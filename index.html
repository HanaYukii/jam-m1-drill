 of the accumulation-output component θ shares its first octet with C(255, s); the fix tells them apart by demanding a non-zero service id in positions 1, 3, 5, 7 and zeros everywhere else","Because C(s, h) hashes the service id together with the key, every octet of such a key — the first one included — is uniformly random, so about 1/256 of them start with 0xFF; the fix re-hashes the whole key so the 0xFF prefix becomes unreachable","C(s, h) keys start with n_0, the low octet of E_4(s), so every service with s mod 256 = 255 yields storage/preimage/request keys beginning 0xFF; the new check also requires zeros in all non-service-id positions, which a Blake2b-derived key matches only with negligible probability"],"answer":3,"optNotes":["service id 只佔位置 1、3、5、7 四個 octet，任何 32-bit id 都放得下，不會溢出到位置 9。","chapter key 只有 C(1)…C(16)（θ 是 C(16)），根本不存在 C(255) 這個單一元件 key。","C(s, h) 並沒有把 service id 混進 hash，第 0 個 byte 是 n_0 而非隨機，修正也沒有再 hash 一次。","C(s, h) 的第 0 個 octet 是 n_0（service id 的最低 byte），s ≡ 255 (mod 256) 就會撞上 0xFF。"],"explanation":"§D.1：C(i) = [i, 0, 0, …]；C(i, s) = [i, n_0, 0, n_1, 0, n_2, 0, n_3, 0, 0, …]（n = E_4(s)）；C(s, h) = [n_0, a_0, n_1, a_1, n_2, a_2, n_3, a_3, a_4, …, a_26]（a = H(h)）。關鍵在第三種：第 0 個 octet 是 n_0 = service id 的最低 byte，完全不是隨機值——只要 s ≡ 255 (mod 256)（255、511、…、0x????00FF），該 service 的所有 storage（h = E_4(2^32−1) ⌢ k）、preimage（E_4(2^32−2) ⌢ hash）、request（E_4(l) ⌢ hash）key 都以 0xFF 開頭。舊碼把它們當成 C(255, s) 去解 89-octet 的 account info，值太短就 EOF（issue #779，fuzzer trace 0xffff0017…）。修正後的 IsServiceInfoKey 除了 byte 0 = 0xFF，還要求位置 2、4、6 與 8…30 全為 0；C(s, h) 要滿足這點需要 a_0…a_3 與 a_4…a_26 共 27 個 Blake2b 輸出 byte 全為 0，機率 2^−216，可視為不可能。順帶一提，§D.1 末段允許實作不保存原始 storage key，只保存 hash 後的 31-byte key——這正是你們 unmatched key-vals 機制的依據。","trap":"31-byte key 的第 0 個 byte：C(i) 是 chapter 編號、C(255, s) 是 255、C(s, h) 是 service id 的低 byte——三者可能相同。"},{"id":"appF-code-shuffle","ch":"F","section":"F Shuffling (Fisher–Yates)","gpRef":"eq. F.1 (shuffle), F.2 (Q_l), F.3 (hash form); eq. 11.20–11.22 (guarantor assignment R, P, M); eq. 17.3 and the tranche-0 selection that follows it","difficulty":2,"kind":"code","tags":["shuffle","guarantor-assignment","calc"],"stem":"This is the team's implementation of the shuffle F of eq. F.1. For s = [10, 20, 30, 40] and r = [3, 6, 4, 5], what does it return, and is the in-place swap faithful to the GP definition?","code":{"lang":"go","caption":"internal/utilities/shuffle/shuffle.go (FisherYatesShuffle)","src":"func FisherYatesShuffle(s []types.U32, r []types.U32) []types.U32 {\n\tl := len(s)\n\n\t// If the sequence is empty, return an empty slice\n\tif l == 0 {\n\t\treturn make([]types.U32, 0)\n\t}\n\n\t// Calculate the index\n\tindex := r[0] % types.U32(l)\n\n\t// The selected element\n\tselected := s[index]\n\n\t// Swap elements\n\ts[index], s[l-1] = s[l-1], s[index]\n\n\t// Recursively shuffle the remaining elements\n\tshuffledRest := FisherYatesShuffle(s[:l-1], r[1:])\n\n\t// Return the shuffled sequence\n\treturn append([]types.U32{selected}, shuffledRest...)\n}"},"options":["[20, 30, 10, 40]; not faithful — GP's result is the array left in place after all swaps have been applied, not the sequence of picked elements, so this function returns the reverse of what eq. F.1 defines","[40, 10, 30, 20]; faithful — GP writes s_{l−1} into the picked slot and drops the last position, and swapping then slicing off the tail is the same thing (the caller's slice is mutated as a side effect)","[40, 10, 20, 30]; not faithful — GP removes the picked element and shifts the remainder left, preserving relative order, so the swap with s[l-1] silently permutes the survivors","[40, 30, 10, 20]; not faithful — GP takes every r_i modulo the original length l and indexes the original sequence without shrinking it, discarding duplicates only at the end"],"answer":1,"optNotes":["把經典 in-place Fisher–Yates 跑完的陣列當結果；eq. F.1 輸出的是依序挑出的元素序列。","洞由 s_{l−1} 填補再縮短長度，所以「對調後切尾」與 eq. F.1 等價，逐步得 40、10、30、20。","這是「移除後左移、保序」的刪法；GP 明寫 s′_{r_0 mod l} = s_{l−1}，並不保留相對順序。","每次都用原長度取模、不縮短序列；GP 的 l 每輪遞減，遞迴吃的是 s′[..l−1]。"],"explanation":"eq. F.1：F(s, r) = [s_{r_0 mod l}] ⌢ F(s′[..l−1], r[1..])，其中 s′ = s 但 s′_{r_0 mod l} = s_{l−1}——輸出是「依序挑出的元素」，被挑走的洞由『最後一個』元素填補，再把長度縮 1。逐步：l = 4，3 mod 4 = 3 → 挑 40，s′ = [10, 20, 30]（洞就在最後，等同截掉）；l = 3，6 mod 3 = 0 → 挑 10，s′_0 = s_2 = 30 → [30, 20]；l = 2，4 mod 2 = 0 → 挑 30，s′_0 = 20 → [20]；最後挑 20。結果 [40, 10, 30, 20]。程式碼把 s[index] 與 s[l−1] 對調再取 s[:l−1]：對調後 index 位置放的正是 s_{l−1}，而移到尾端的元素被切掉，與 GP 完全等價；唯一差別是它就地修改呼叫者的 slice（guarantor_assignments.go 與 auditing.go 每次都建新 slice，所以無害）。eq. F.2/F.3：F(s, h) = F(s, Q_l(h))，Q_l(h)_i = decode_4(H(h ⌢ E_4(⌊i/8⌋))[4i mod 32 ..+4])——每個 Blake2b 供 8 個索引，1023 個 validator 需 128 次 hash。用途：eq. 11.21 的 guarantor 指派 P(v, e, t) = R(F([⌊i/3⌋ | i ∈ N_v], η′_2), ⌊(t mod E)/R⌋)（0.8.0 用 |κ′| 與 ⌊i/3⌋，0.7.2 是 ⌊C·i/V⌋），以及 ch. 17 初始 audit tranche F(reports, Y(seed_0))[..10]（eq. 17.3 之後的 tranche-0 式）。官方 shuffle 向量（jamtestvectors/shuffle，長度 0…341）可驗證 Q_l 與 F 的組合。","trap":"GP 的 F 輸出「挑選順序」，洞由最後一個元素補；用 η′_2（不是 η′_1）避免 epoch 末的 fork 放大。"},{"id":"appG-ietf-vs-ring","ch":"G","section":"G Bandersnatch VRF (IETF VRF vs Ring VRF)","gpRef":"§G; §3 cryptography notation; eq. 6.4, 6.14–6.18, 6.30; eq. 17.3 (audit seed)","difficulty":2,"kind":"concept","tags":["bandersnatch","vrf","ring-vrf","safrole"],"stem":"JAM uses two Bandersnatch constructions: singly-contextualized IETF VRF signatures and ring-VRF proofs. Which statement about where each is used, its size and the output function Y is correct?","options":["Only ticket proofs in E_T are 784-octet ring-VRF proofs (anonymous, checked against a 144-octet ring root); the seal H_S, entropy H_V and audit seeds are 96-octet IETF VRF signatures under a named key; in both, Y(·) is the Blake2b hash of the whole signature, so it moves with the signed message — which is why tickets sign the empty message","Only ticket proofs in E_T are 784-octet ring-VRF proofs (anonymous, checked against a 144-octet ring root); the seal H_S, entropy H_V and audit seeds are 96-octet IETF VRF signatures under a named key; in both, Y(·) is the first 32 octets of the VRF output and depends on the context, not the message","Only ticket proofs in E_T are 784-octet ring-VRF proofs, checked against a 32-octet ring root committed over the active set κ′ rather than the pending set; the seal H_S, entropy H_V and audit seeds are 96-octet IETF VRF signatures under a named key; Y(·) is the first 32 octets of the VRF output, and a key zeroed by Φ is dropped from the ring so the ring shrinks with the offender count","Both the seal H_S and the ticket proof are 784-octet ring-VRF proofs checked against the 144-octet γ′_Z — that is what keeps the block author anonymous until the epoch ends; the entropy H_V and the audit seeds are 96-octet IETF VRF signatures under a named key; in both, Y(·) is the full 64-octet VRF output and depends on the context, not the message"],"answer":1,"optNotes":["Y 取的是 VRF output 本身而非簽名的雜湊，§3 註明它受 context 影響、不受 message 影響。","ring VRF 只用在 ticket proof；§G 的 Y(s) ≡ output(s)[..32]，受 context 影響而不受 message 影響。","ring root ∈ B̊ ⊂ B_144 且承諾在 γ′_P 上；被 Φ 歸零的 key 以 padding point 代入，ring 大小不變。","seal 走 eq. 6.16/6.17 的 IETF 形式、作者由 H_I 公開指名；§G 的 Y 也只取前 32 octets。"],"explanation":"§G：V_k⟨c⟩(m) ⊂ B_96 是 IETF VRF（RFC 9381 樣板）——簽名者由公開金鑰 k 指名；V̄_r⟨c⟩(m) ⊂ B_784 是 ring VRF（Pedersen VRF + zk-SNARK），只證明「ring 裡某個成員」簽了，匿名；O(⟦k⟧) ∈ B_144 是 ring root（commit）。用途：eq. 6.30 的 ticket proof p ∈ V̄_{γ′_Z}⟨X_T ⌢ η′_2 ⌢ [e]⟩([])——唯一的 ring VRF；eq. 6.16/6.17 的 seal H_S ∈ V_{H_A}⟨X_T ⌢ η′_3 ⌢ [i_e]⟩(E_U(H)) 或 ⟨X_F ⌢ η′_3⟩，eq. 6.18 的 H_V ∈ V_{H_A}⟨X_E ⌢ Y(H_S)⟩([])，以及 eq. 17.3 的 audit seed ∈ V_{κ[v]_b}⟨X_U ⌢ Y(H_V)⟩([])——都是 IETF、由 H_A = κ′[H_I]_b 指名。Y(x) = output(x)[..32]：VRF 輸出的前 32 octets，§3 特別註明它「influenced by x（context）but not by m（message）」——所以 ticket id = Y(p) 只由 η′_2 與 entry index 決定，seal 的 Y(H_S) 也不受 header 內容影響（這正是 H_V 能用它當 context 的原因）。匿名的是『票』在被使用前不可連結到驗證者，而不是出塊者：seal 的作者由 H_I 公開指名。ring root 是 eq. 6.14 的 z = O([k_b | k ∈ γ′_P])——用『下一個 epoch 的 pending set』而非 κ′，而 offenders 的 key 被 Φ 換成全 0（eq. 6.15），§G 規定「無對應 Bandersnatch point 的 key 以 padding point 代替」，ring 大小不變。你們 #1040 的修正正是基於「ring commitment 是 Bandersnatch keys 的純函數」。","trap":"ring VRF 只用在 ticket；seal/entropy/audit 都是 IETF；γ_Z 來自 γ′_P（pending），壞 key 用 padding point。"},{"id":"appG-signing-contexts","ch":"G","section":"Signing contexts X (definitions appendix) and their primitives","gpRef":"definitions appendix §Signing Contexts; eq. 6.16–6.18, 6.30, 11.14, 11.28, 17.3, 17.7, 17.16, 18.1; ch. 10 culprit/fault signature rules","difficulty":2,"kind":"concept","tags":["signing-contexts","bandersnatch","ed25519","bls"],"stem":"Each JAM signature is domain-separated by a context string X. Which of the following (context → primitive → use) statements is correct?","options":["X_E = $jam_entropy is an Ed25519 signature by the author over the unsigned header E_U(H); the Blake2b hash of that signature is what feeds the entropy accumulator η′_0 each block","X_U = $jam_audit is the Ed25519 context under which validators sign the judgments that appear in the verdicts of the disputes extrinsic E_D, one signature per report hash","X_T = $jam_ticket_seal is used twice: for the ring-VRF ticket proof (context X_T ⌢ η′_2 ⌢ [e], empty message, root γ′_Z) and for the regular IETF-VRF seal (context X_T ⌢ η′_3 ⌢ [i_e], message E_U(H))","X_G = $jam_guarantee is a Bandersnatch VRF context over H(w), and its output Y(·) doubles as the guarantee identifier stored with the availability assignment in ρ"],"answer":2,"optNotes":["X_E 是 Bandersnatch IETF VRF：context X_E ⌢ Y(H_S)、訊息為空，既不是 Ed25519 也不簽 header。","X_U 是 Bandersnatch 的 audit seed context；judgment 與 fault 用的是 X_valid / X_invalid。","同一個字串兩種用法，差別在 η′_2 vs η′_3、ring vs IETF、空訊息 vs E_U(H)。","X_G 是 Ed25519 而不是 VRF，guarantee 也沒有任何 identifier 會被存進 ρ。"],"explanation":"definitions 附錄「Signing Contexts」：X_A = $jam_available（Ed25519，assurances；eq. 11.14 簽 X_A ⌢ H(E(H_P, bitfield))）；X_B = $jam_beefy（BLS，eq. 18.1 簽 X_B ⌢ 最新 β_H 的 super-peak）；X_E = $jam_entropy（Bandersnatch IETF，eq. 6.18：context X_E ⌢ Y(H_S)、訊息為空）；X_F = $jam_fallback_seal（Bandersnatch，eq. 6.17）；X_G = $jam_guarantee（Ed25519，eq. 11.28 guarantee 簽 X_G ⌢ H(w)，ch. 10 的 culprit 也用它簽 X_G ⌢ report hash）；X_I = $jam_announce（Ed25519，eq. 17.7 的 audit announcement）；X_T = $jam_ticket_seal（Bandersnatch ring VRF 出票 + IETF 正常 seal）；X_U = $jam_audit（Bandersnatch，audit 選取熵，eq. 17.3 的 seed_0 與 eq. 17.12 的 seed_n）；X_valid/X_invalid = $jam_valid/$jam_invalid（Ed25519，judgments 與 faults，eq. 17.16、ch. 10）。判讀時要連 context 的組成（X ⌢ entropy ⌢ index）與原語一起看，同一個字串完全可以搭配不同的原語與不同的 entropy 版本。你們 const.go 的 JamEntropy/JamFallbackSeal/JamTicketSeal/JamValid/JamInvalid/JamAvailable/JamBeefy/JamGuarantee/JamAnnounce/JamAudit 逐一對應；#940 的 bug（用公鑰簽 judgment）就是 X_valid 這條路徑。","trap":"口訣：Bandersnatch = T/F/E/U（票、備援 seal、熵、audit）；Ed25519 = A/G/I/valid/invalid；BLS = B。"},{"id":"arch-beefy-commitment","ch":"ARCH","section":"18 Beefy Distribution (ch. 18)","gpRef":"eq. 18.1–18.2; eq. 7.7–7.8; §19–20","difficulty":2,"kind":"concept","tags":["beefy","grandpa","bridging","off-chain"],"stem":"Per the Beefy Distribution chapter, what does a validator sign, with which key, and when — and what is the signature for?","options":["For each block it authors: a Bandersnatch VRF signature (context $jam_beefy) over the accumulation-output root M_B(s, H_K) of that block, which is placed in the header's H_O marker and is the datum that Grandpa voters sign when they finalize the block","After importing each finalized block: a BLS12-381 signature under κ′[v]'s BLS key over $jam_beefy ⌢ b, where b is the Keccak MMR super-peak of the accumulation-output belt held in the newest β_H entry; the signatures are published freely so they can be aggregated into concise finality proofs for third-party systems such as bridges","After importing every block, finalized or not: a BLS12-381 signature under the validator's BLS key over the posterior state root M_σ(σ′), so that light clients can verify the newest state; Grandpa then aggregates these signatures into its finality justification instead of running its own vote round","Once per epoch: an Ed25519 signature over the Keccak hash of the epoch's last header, published alongside the epoch marker H_E so that parachains bridged through the CoreChains service can prove that the whole epoch was finalized without tracking individual blocks"],"answer":1,"optNotes":["H_O 是 offenders marker；Bandersnatch 只用於 seal／ticket／entropy／audit VRF。","eq. 18.1–18.2：對每個已 finalized 且已 import 的 block，用 BLS 簽 X_B ⌢ last(β_H)_b。","posterior state root 是 Grandpa vote 的內容，Grandpa 也不靠 BLS 聚合，時機更不是每個 block。","金鑰型別與頻率都錯：Beefy 用的是 BLS12-381，而且是每個 finalized block 各簽一次。"],"explanation":"§18：「For each finalized block B which a validator imports, said validator shall make a BLS signature on the BLS12-381 curve… affirming the Keccak hash of the block's most recent Beefy MMR. This should be published and distributed freely… These signatures may be aggregated in order to provide concise proofs of finality to third-party systems.」eq. 18.1：Ξ_v ≡ S^BLS_{κ′[v]_bls}⟨X_B ⌢ last(β_H)_b⟩，eq. 18.2：X_B = $jam_beefy。b 是 β_H 最新一筆的 accumulation-output super-peak：eq. 7.7 先把 θ′ 的 (service, hash) 序列用 M_B(s, H_K) 取根、append 進 belt β′_B，eq. 7.8 再以 App. E 的 super-peak 函數 M_R（H_K($peak ⌢ …)）算出 b——全程 Keccak，§7 明說是「to maximize compatibility with legacy systems」（EVM 系橋用 Keccak precompile 便宜驗證）。分工要分清：Grandpa（§19）負責 JAM 內部 finality，投票資料是 best header＋posterior state root；Beefy 則是給鏈外系統看的可聚合 BLS 承諾（聚合機制見 eprint 2022/1611）。validator key K 的 BLS 公鑰佔 144 bytes（offset 64）。團隊程式：internal/recent_history 的 AppendAndCommitMmr 以 hash.KeccakHash 建 MMR 並回傳 SuperPeak（即 b）；Beefy 簽章本身屬 M2 node 範圍，main 尚未實作。§20 預算：Grandpa＋Beefy 合佔 1/16 CPU、每 slot 各 4 MB 上下行。","trap":"三種金鑰三種用途：Bandersnatch = seal/ticket/entropy/audit VRF；Ed25519 = guarantee/assurance/judgment/announcement；BLS = 只有 Beefy（GP 未指定 Grandpa 投票的金鑰型別）。"},{"id":"arch-best-chain-selection","ch":"ARCH","section":"19 Grandpa and the Best Chain (ch. 19)","gpRef":"eq. 19.1–19.4; §17 (ban-listing)","difficulty":2,"kind":"concept","tags":["best-chain","grandpa","auditing","off-chain"],"stem":"How does a node choose the best block B♭ on which it builds and casts Grandpa votes, and what data does the vote carry?","options":["Candidates are all blocks whose parent is known; the chain with the most fallback-sealed ancestors wins because fallback keys belong to the honest majority; the vote carries the header plus the accumulation-output super-peak so that bridges can reuse Grandpa justifications","Candidates must descend from the latest finalized block, be considered audited, and contain no unfinalized ancestor at a timeslot where the node has seen an equivocation; among them the chain with the most ticket-sealed (non-fallback) ancestors wins; the vote carries the best header together with its posterior state root","Longest-chain rule among descendants of the finalized block; two valid blocks at the same timeslot are both kept because Safrole tolerates equivocation; audited status only gates accumulation, not voting; the vote carries the header hash together with the prior state root H_R taken from the header","Candidates must descend from the finalized block and carry the most guarantees; the chain with the greatest cumulative timeslot wins so that stalled cores are penalised; the vote carries the header only, since Grandpa is independent of state and the state root is supplied by Beefy"],"answer":1,"optNotes":["方向相反——偏好的是 ticket-sealed 而非 fallback；super-peak 是 Beefy 的承諾，不進 Grandpa 投票。","三個可接受條件（eq. 19.1–19.3）加上最大化 ticket-sealed 祖先數（eq. 19.4），投票內容也對。","longest chain 不是 JAM 的規則；§17 要求投 Grandpa 票前先視該 block 為 audited，投票也帶 posterior root。","guarantee 數與 timeslot 總和都不是準則；投票必須附上 M_σ(σ′)，下游才驗得了最新狀態。"],"explanation":"§19 可接受集合（eq. 19.1–19.3）：A(H♭) ∋ H♮（以最新 finalized block 為祖先）；U♭ ≡ ⊤（已審計：§17 eq. 17.19，該 block 剛 available 的 R 中每個 report 都滿足 U(w)）；∄ H^A ≠ H^B 使 H^A_T = H^B_T、H^A ∈ A(H♭) 且 H^A ∉ A(H♮)（未 finalized 的 equivocation）。eq. 19.4：在可接受集合裡最大化 m = Σ_{H^A ∈ A♭} isticketed^A，即用 ticket 而非 fallback key seal 的祖先數——§17 也說 best block 是「the chain with the most regular Safrole blocks which does not contain any such disregarded block」，而被至少 1/3 驗證者判無效的 report 一旦被 accumulate，整條鏈不可再建塊（「may require reversion to an earlier head or alternative fork」）。投票資料：「the block header of the best block together with its posterior state root M_σ(σ′)」——header 只帶 prior root（§5 為了 pipelining），所以下游要能驗證最新狀態就得靠投票補上；後果是投票前必須先算完 posterior state，且「votes for the same block hash but with different associated posterior state roots are considered votes for different blocks」（只在節點失誤或文件歧義時發生）。團隊：fuzz target 以 RestoreBlockAndState(parent) 處理 fork（internal/fuzz/service.go）；#892 處理重複 slot／未知 parent；#783 曾把 prior/posterior root 搞反。","trap":"GP 明說：block 是否 audited 在 finalize 當下可能沒有共識，但「This does not affect the crypto-economic guarantees」——最終會有共識。"},{"id":"arch-audit-tranches","ch":"ARCH","section":"17 Auditing and Judging (ch. 17)","gpRef":"eq. 17.1–17.19 (PDF numbering); §20 (10 audits/validator/slot)","difficulty":3,"kind":"concept","tags":["auditing","elves","tranches","off-chain"],"stem":"In the auditing protocol, how does a validator decide which newly-available work-reports it must audit, and how does that set grow over time?","options":["Tranche 0: shuffle the per-core list of just-available reports with a Bandersnatch VRF output (context $jam_audit ⌢ Y(H_V)) and take the first 10 non-empty entries; a new tranche starts every A = 8 s, adding a report either unconditionally (a negative judgment was seen) or by a per-report VRF whose acceptance chance grows with the previous tranche's no-shows, tuned so that F = 2 validators are expected per no-show","Tranche 0: each validator audits the reports of the cores it guarantees in the current rotation, since it already holds the bundle; every 8 s it adds F = 3 further reports chosen by shuffling with η′_3; a report counts as audited as soon as its three guarantors have re-attested, and negative judgments are gossiped between validators but never placed on-chain","Tranche 0: the three guarantors of each core re-execute their own report so that the accused party bears the cost; every 6 s (one slot) the remaining validators are added round-robin until more than 2/3 have judged, at which point the report counts as audited and any validator that judged negatively is slashed; no announcements are needed because the round-robin order follows from the block hash","Tranche 0: a Fisher–Yates shuffle of κ seeded with η′_2 assigns exactly 30 auditors to every report, matching the 30 audits per report of §20; a report is audited once those 30 positive judgments are in, and no VRF is involved after tranche 0 because the assignment is fixed for the whole epoch; later tranches only ever occur if a negative judgment appears"],"answer":0,"optNotes":["eq. 17.3／17.5 的 VRF 洗牌取前 10，加上 eq. 17.13–17.15 的 no-show VRF，F = 2 正是每個 no-show 期望補上的人數。","F = 2 而非 3，context 是 X_U ⌢ Y(H_V) ⌢ H(w) ++ n；票數夠時 block author 會把 verdict 放進 E_D 上鏈。","被懷疑的正是 guarantor，自審沒有安全意義；週期是 A = 8 秒，而且每個 tranche 都要先發 announcement。","η′_2 是 fallback key sequence 的種子；30 是 §20 的期望值而非固定指派，tranche 0 之後仍有 per-report VRF。"],"explanation":"eq. 17.1–17.2：q 是長度 |κ|/3（active cores 數）的序列，core c 的位置放 ρ[c] 的 report（若 ∈ R，即本 block 剛 available）否則 ∅。eq. 17.3：s_0 ∈ S^bs_{κ[v]_bs}⟨X_U ⌢ Y(H_V)⟩[]（Bandersnatch VRF，context $jam_audit 接本 block entropy VRF 輸出、空訊息）；eq. 17.5：a_0 = {w | w ∈ F(q, Y(s_0))[..10], w ≠ ∅}——Fisher–Yates 洗牌後取前 10 個非空。eq. 17.6：n = ⌊(T − P·H_T)/A⌋，A = 8 秒。新 tranche 的兩種來源：看到 negative judgment（一律必審）；或前一 tranche 的 judgment 數 < announcement 數（no-show）——後者用 eq. 17.13–17.15：s_n(w) 以 X_U ⌢ Y(H_V) ⌢ H(w) ++ n 為 context，條件 (|κ|/(256·F))·Y(s_n(w))_0 < |A_{n−1}(w) ∖ J_⊤(w)|，F = 2 是「the expected number of validators which will be required to issue a judgment for a work-report given a single no-show in the tranche before」（ELVES 論文模型顯示最佳）。每個 tranche 都先發 announcement（eq. 17.7：Ed25519 簽 X_I ++ n ⌢ x_n ⌢ H(H)，附 VRF 證據與前一 tranche 未配對的 announcement），且「Publication of an announcement should be taken as a contract to complete the audit regardless of any future information」。審計本體：向 1/3 驗證者索取 chunk 以 R_{|κ|} 重建 bundle（full 需 342 片），重算 Ξ(p, w_c, w_l, (w_a)_n) 必須與 w 相等（解碼失敗即無效，eq. 17.16），再以 Ed25519 發 judgment（eq. 17.17，context $jam_valid／$jam_invalid ⌢ H(w)）。eq. 17.18：U(w) ⟺ (J_⊥(w) = ∅ ∧ ∃n: A_n(w) ⊆ J_⊤(w)) ∨ |J_⊤(w)| > 2/3·|κ|；eq. 17.19：block audited ⟺ ∀w ∈ R: U(w)。後果：>2/3 仍判 positive → 判 negative 者可能因 time-wasting 受罰；>1/3 判 negative → 含該 report 的 block 被 ban-list、子孫全部不可建塊；block author 可組 verdict 放入 E_D（放在該 report 尚未 accumulate 的鏈上，會清掉 ρ 對應項）。§20 的「每驗證者每 slot 平均 10 次審計 → 每 report 約 30 次」是期望值，不是固定指派。ELVES 對照：backing/approval/inclusion = guaranteeing/auditing/accumulation。團隊：internal/auditing（#935 ComputeInitialAuditAssignment 漏 ValidatorID 導致只能靠超多數規則過關；#956 ComputeAnForValidator 門檻 s_n(w)[0]·V/(256·F) < m_n；#940 BuildJudgements 誤用公鑰簽名）；網路 CE144 announcement／CE145 judgment。","trap":"F = 2 的直覺：每個 no-show 期望「再多 2 個人」來審；一個 negative judgment 則是「所有人都要審」。"},{"id":"arch-guaranteeing-procedure","ch":"ARCH","section":"15 Guaranteeing (ch. 15)","gpRef":"§15; eq. 14.13 (Ξ); eq. 11.24, 11.28","difficulty":2,"kind":"concept","tags":["guaranteeing","off-chain","work-reports"],"stem":"Which statement about the honest guarantor strategy described in the Guaranteeing chapter is correct?","options":["Sign the report with the Bandersnatch key under the $jam_guarantee context so that the ring proof hides which of the core's guarantors signed, so the on-chain credential carries no validator index; two signatures suffice for distribution; guarantors should never sign more than one report per epoch, otherwise the block author's anti-spam filter disregards them for the rest of the epoch","Run every work-item's refine first and check authorization only afterwards, since the pool is re-verified on-chain anyway and refine dominates the cost; all three guarantors' signatures must be collected before the report may be sent to the block author; any report the block author declines to include counts as an offence and is slashed exactly like an invalid report; a guarantor may sign at most one report per rotation","Use the chain state at the report's lookup-anchor rather than the current head for the pool check so that all guarantors of the core agree on the same view; a single signature suffices for distribution because the block author collects the remaining credentials itself; the credential list may therefore arrive unsorted, and the GP gives no guidance on how many reports a guarantor may sign per slot","Check the package's authorization against the authorizer pool of the most recent chain state (plus the other on-chain inclusion conditions) before running any refine logic; after r = Ξ(p, c, l, v), Ed25519-sign $jam_guarantee ⌢ H(E(r)); two signatures suffice to send the report to the next block author; an unincludable report only forfeits reward, a misrepresented Ξ result is punished severely; sign on average at most two reports per timeslot"],"answer":3,"optNotes":["guarantee 用 Ed25519 且身分公開（credential 帶 validator index）；建議值是每 slot 平均兩份而非每 epoch 一份。","§15 要求所有檢查在評估 Ψ_R 之前完成，而被 block author 拒收只損失獎勵、不構成 offence。","GP 明說「the chain state of the most recent block should always be utilized」；分發門檻也是兩個簽名。","四點都對上 §15：先驗 authorization、兩個簽名即可分發、只有謊報 Ξ 結果才重罰、每 slot 平均不超過兩份。"],"explanation":"§15 流程：(1) 評估 work-package 的 authorization 並對照「the authorization pool in the most recent JAM chain state」；(2) 逐 work-item 執行 refine；(3) 依 erasure codec 切 bundle 與 exported data；(4) 組裝並發布 work-report；(5) 把 chunk 分發到驗證者集合；(6) 應要求提供 bundle／exported data。r = Ξ(p, c, l, v)（eq. 14.13）：guarantor 自行選 c（通常是自己被指派的 core）、l（segment-root dictionary，由先前 guaranteed 的 report 推得）、v（assuring validator set 大小，通常是 active set；遇 epoch 交界可對新舊兩個集合各編碼一次、產生兩份 report，但鏈上只能收一份，§14）。簽章：payload (s, i)，s 是 Ed25519 對 X_G ⌢ H(E(r)) 的簽名（鏈上 eq. 11.28 同式；credential 2–3 個、依 validator index 排序且唯一，簽名者須為本或前一 rotation 指派到該 core，eq. 11.24）。「With two guarantor signatures, the work-report may be distributed to the forthcoming JAM chain block author」。這題的重點是激勵不對稱：「validators will be punished severely if they malfunction and commit to a report which does not faithfully represent the result of Ξ」，而 contextual validity／pool 檢查沒做好「does not result in punishment, but will prevent the block author from including the report and so reduces rewards」。效率建議：所有檢查應在「prior to evaluating the Ψ_R function」之前做完，並把 package 轉給同 core 其他 guarantor 以形成共識；為免被 block author 的 anti-spam 忽略，「guarantors should sign an average of no more than two work-reports per timeslot」。團隊：CE133（builder→guarantor 提交）、CE134（guarantor 間分享）、CE135（report 分發）；#863/#860「not sorted or unique guarantors」錯誤碼、#864 guarantor 唯一性。","trap":"先驗 authorization 再跑 refine：白跑 Ψ_R 不會被罰，但浪費的是自己的 CPU 與獎勵。"},{"id":"arch-two-da-classes","ch":"ARCH","section":"16 Availability Assurance (ch. 16) & 14 Exporting / Availability Specifier","gpRef":"§16; §14 (Exporting, eq. 14.18); eq. 11.5, 11.11–11.18","difficulty":2,"kind":"concept","tags":["availability","erasure-coding","d3l","off-chain"],"stem":"Before a validator sets a core's bit in its assurance, which erasure-coded data must it hold, how is that data verified, and for how long must it be kept?","options":["Its bundle shard and segment shards, verified against the segments-root rather than the erasure-root since the erasure-root only commits to the bundle; the bundle shard is kept for 28 days while segment shards may be dropped once the report is accumulated, because accumulation copies the exported segments into on-chain service storage","The full work-package bundle plus every exported segment in clear (not shards), verified by recomputing the work-report locally before assuring, and kept for D = 19,200 slots so that any preimage referenced by the package can be re-verified during the dispute window","Only its shard of the work-package bundle; segment shards are fetched lazily by later importers directly from the guarantors of the exporting package; the bundle shard is retained for L = 14,400 slots (24 h) so that lookup-anchors stay auditable, and no proof is needed because the assurance signature is checked on-chain against the report's erasure-root","Both its shard of the auditable bundle (kept only until the report is considered audited / its block finalized, served on request until then) and its shards of every exported segment under the report's segments-root plus paged-proof data (the long-term D³L, kept ≥ 28 days = 672 epochs), each verified by a Merkle proof against the report's erasure-root before possession is claimed"],"answer":3,"optNotes":["erasure-root u = M_B(transpose[b♣, s♣]) 同時承諾兩者；accumulation 也不會把 segment 複製進鏈上 storage。","assurer 持有的是 erasure-coded shard 而非明文 bundle 與 segment；D = 19,200 是 preimage expunge 期限。","§16 要求兩類 shard 都持有；保留期也不是 L = 14,400，而且 assurance 前必須自己驗過 Merkle 證明。","兩類 shard 分得清楚：bundle shard 留到 audited／finality，segment shard 留 28 天，都以 erasure-root 驗證。"],"explanation":"§16：「There are two classes of shard a validator must have for an availability assignment before claiming possession in an assurance」——(1) bundle 的 erasure-coded shard：「needed to verify the work-report's validity and completeness and need not be retained after the work-report is considered audited. Until then, it should be provided on request」；(2) segments-root 所指每個 exported segment 的 shard：「These should be retained for 28 days and provided to any validator on request」。驗證：「trivially proven through the work-report's work-package erasure-root and a Merkle-proof of inclusion in the correct location」，且「a validator should not claim possession of shards in an assurance unless it has, and has verified, the corresponding proofs」——鏈上對 assurance（eq. 11.11–11.14）只驗 Ed25519 簽章（X_A ⌢ H(E(H_P, f))）與 bitfield、不驗 shard 內容，所以證明必須自己在鏈下驗完。§14 Exporting 把兩者稱為短期 Audit DA store（assurer 保留到「finality of the block in which the availability of the work-result's work-package is assured」）與長期 D³L（Distributed, Decentralized, Data Lake，≥ 28 天 = 672 個完整 epoch，還含 paged-proofs：每 64 個 segment 一頁 hash＋子樹證明）。Availability specifier（eq. 14.18／eq. 11.5）：erasure-root u = M_B(transpose[b♣, s♣])——同時承諾 bundle 與 segments（含 paged proofs）的 chunk，chunk 數 n = assuring validator set 大小；segments-root e 只承諾 exported segments 本身（constant-depth Merkle）。鏈上規則對照：report 在 > 2/3·|κ| 的 assurance 後才 available（eq. 11.17），逾 U = 5 slot 未 available 則清出 ρ（eq. 11.18）。§20：全網 DA 容量約 2 PB、每節點最多 6 TB；assuring 每 slot 上行 144 MB。團隊：internal/store/work_package_bundle_store.go、CE137/138（shard 分發／audit shard 請求）、CE139/140（segment shard 請求）；#1035：erasure 參數依驗證者數（tiny 6 → 3 片可重建，full 1023 → 342 片）。","trap":"兩個 DA：短期 audit DA（bundle shard）vs 長期 import DA / D³L（segment shard＋paged proofs，28 天）——兩者都在同一個 erasure-root 之下。"},{"id":"arch-core-virtual-hardware","ch":"ARCH","section":"20.1 Technical Characteristics & 20.2 Illustrating Performance (ch. 20)","gpRef":"§20 Discussion","difficulty":2,"kind":"concept","tags":["performance","hardware","throughput","rationale"],"stem":"How does the Discussion chapter characterise the 'virtual hardware' that a work-package gets on a JAM core, and what happens to its result afterwards?","options":["Roughly one regular CPU core at 25–50% of native speed for the whole 6-second slot, about 2 MB/s of general-purpose I/O (which includes trustless reads of recent JAM state) and up to 2 GB of RAM, plus unlimited reads from a semi-static preimage store; the result is at most 48 KB and then gets ~10 ms on the same machine with no external I/O but full, immediate access to chain state","A CPU core at 25–50% speed with 2 GB RAM but no access to chain state whatsoever, since refine is stateless by construction, and with unbounded I/O because nothing ever leaves the core; the 48 KB result is then accumulated inside the audit budget (10/16 of CPU time), which is why accumulation is capped at 10^7 gas per report and 3.5·10^9 per block","A full validator machine (16 cores, 64 GB RAM, 8 TB) for one 6-second slot with unlimited chain-state I/O; the result may be up to 12 MB and is then accumulated for up to one second with the same I/O budget, which is why block execution is allotted 2/16 of validator CPU time in the performance model, and preimage lookups are metered against that same 12 MB budget","One CPU core at native speed for one second plus 5 MB of I/O per 6-second slot — the Polkadot parachain budget carried over unchanged so that CoreChains needs no re-tuning — with results up to 90 KB that are accumulated during the following slot with full state access and a further 6 s of execution; the semi-static preimage store is not reachable in-core at all"],"answer":0,"optNotes":["整段對上 §20.1 原文：25–50% 速度、2 MB/s I/O、2 GB RAM、48 KB 結果，再 10 ms 且可直接讀狀態。","GP 明說 I/O「includes any trustless reads from the JAM chain state」且設有 2 MB/s 預算，並非無上限。","16 核／64 GB／8 TB 是參考「節點」的規格；12 MB 是 bundle 量級 W_B，work-result 上限是 W_R = 48 KiB。","1 秒原生算力加 5 MB I/O 是 Polkadot parachain 的預算；90 KB 沒有出處，preimage store 在 in-core 讀得到。"],"explanation":"§20.1：「What might be called the 'virtual hardware' of a JAM core is essentially a regular CPU core executing at somewhere between 25% and 50% of regular speed for the whole six-second portion and which may draw and provide 2MB/s average in general-purpose I/O and utilize up to 2GB in RAM. The I/O includes any trustless reads from the JAM chain state, albeit in the recent past. This virtual hardware also provides unlimited reads from a semi-static preimage-lookup database.」「Each work-package may occupy this hardware… to create some result of at most 48KB. This work-result is then entitled to 10ms on the same machine, this time with no 'external' I/O, but instead with full and immediate access to the JAM chain state.」對應常數：W_R = 48·2^10、G_R = 5·10^9（refine）、G_A = 10^7（每 report accumulate）、G_T = 3.5·10^9（每 block）、W_B = 13,791,360 ≈ 2 MB/s × 6 s。整台參考節點才是 16 核／64 GB／8 TB／0.5 GbE；CPU 分配 audits 10/16、block execution 2/16、Merklization、Grandpa+Beefy、erasure coding、networking 各 1/16；RAM：auditing 20 GB（10 個 PVM instance × 2 GB）、block execution 2 GB、state cache 40 GB（≈ 20,000 條 parachain 的 2 MB footprint）、misc 2 GB；頻寬每 slot 上行 304 MB／下行 281 MB（guaranteeing 106/48、assuring 144/13、auditing 0/133、authoring 53/87、Grandpa+Beefy 4/4），表中換算為 387/357 Mb/s（megabit），故建議 500 Mb/s 且要有 burst 餘裕；全網 DA 2 PB、每節點 ≤ 6 TB。吞吐估計（GP 自稱「a provisional and crude estimation only」）：JAM ≈ 85× single native CPU core 與 682 MB/s DA；simple-transfer 模型：12 MB package ÷ 128 B ≈ 96k tx，但 48 KB result ÷ 8 B（4 B index＋4 B balance）≈ 6k 筆更新 → 每 package ≈ 3k tx → 3k × 341 cores ÷ 6 s ≈ 171k TPS；若瓶頸改為 Merklization（500k–1M 次讀寫/秒）則 250k–350k TPS；把餘額更新也搬進 core 的分割模型可達 1.4M TPS 以上；EVM 對照：每 core ≈ 1,500 gas/µs（區間 500–5,000）vs Eth L1 1.25。三大來源：spatial parallelism、temporal parallelism（pipelining）、與硬體貼合的 VM/gas model。","trap":"「85×」是相對於單一 native CPU core（Polkadot 為 13×，即約 6.5 倍 Polkadot），不是「85 倍 Polkadot」；且全是模型估計。"},{"id":"arch-sweet-spot-further-work","ch":"ARCH","section":"21 Conclusion / 21.1 Further Work (ch. 21)","gpRef":"§21","difficulty":2,"kind":"rationale","tags":["rationale","future-work","architecture"],"stem":"The Conclusion calls JAM a 'sweet spot' and then lists what the paper deliberately leaves open. Which summary is accurate?","options":["Sweet spot = massive computation under secure, resilient consensus (unlike fully-synchronous models) with strict timing and integration guarantees into a singleton state machine (unlike persistently fragmented models); under consideration: synchronous service calls in accumulate, restricting `transfer` for parallel accumulation, reserving extra accumulate compute under certain conditions, and Merklizing the work-package format so authorization needs no full download; networking and token/coretime/staking layers are left out","Sweet spot = a fully fragmented design like Cosmos but sharing one validator set; under consideration: dropping Beefy in favour of Grandpa-only proofs, letting on-chain governance upgrade services in place, adding native signed transactions because the transfer model showed refine-only transfers are I/O-bound, and raising the 48 kB work-result limit so accumulate sees more data; coretime sales and staking are specified in the appendix","Sweet spot = the point where 341 cores exactly saturate a 0.5 GbE link; under consideration: synchronous calls between services during refine, removing the `transfer` host call entirely, lifting the per-block accumulate gas limit G_T, and introducing Merklization into the state trie so authorization can be judged without a full download; the networking protocol is fully specified in an appendix and validator rewards are already tracked on-chain","Sweet spot = as coherent as a fully synchronous chain while accepting Solana-class hardware requirements; open items: replacing ELVES auditing with SNARK proofs once proving cost falls under 50,000× native, shortening D³L retention from 28 days to 24 hours, moving refine's imported segments into the block body, and writing coretime sales and staking into a later chapter rather than delegating them to system services; the networking protocol is already fixed in an appendix"],"answer":0,"optNotes":["sweet spot 的兩個對照組與 §21.1 的四項待辦（同步呼叫、限制 transfer、保留額外算力、Merklize package）全部吻合。","「unlike persistently fragmented models」正好相反；§4.9.2 也明說沒有 transactor 這種概念。","§20 算出的是每 slot 387／357 Mb/s 並刻意留 headroom；要 Merklize 的是 work-package 格式，state trie 早已 Merklize。","JAM 標榜的是 mostly-coherent 與一般規格硬體；用 SNARK 取代 ELVES 也與 §2 的成本論證相反。"],"explanation":"§21：「We argue that the model of JAM provides a novel 'sweet spot', allowing for massive amounts of computation to be done in secure, resilient consensus compared to fully-synchronous models, and yet still have strict guarantees about both timing and integration of the computation into some singleton state machine unlike persistently fragmented models.」——兩個對照組分別是 fully-synchronous（Solana）與 persistently fragmented（Polkadot 1.0／Cosmos／rollups）。Further Work 明列四項可能修改：(1)「Synchronous calls between services in accumulate」；(2)「Restrictions on the transfer function in order to allow for substantial parallelism over accumulation」；(3)「The possibility of reserving substantial additional computation capacity during accumulate under certain conditions」；(4)「Introducing Merklization into the Work Package format in order to obviate the need to have the whole package downloaded in order to evaluate its authorization」。另外：「The networking protocol is also left intentionally undefined at this stage」（JAMNP-S 只在 docs.jamcha.in，且「will most likely not be formalized in the Graypaper」）；「we have also intentionally omitted details of higher-level protocol elements including cryptocurrency, coretime sales, staking and regular smart-contract functionality」；還需要更多實證效能研究、成本比較，以及 PVM 計量下 parachain-validation service 的吞吐原型。注意：§21 最後還寫「Validator performance is not presently tracked on-chain. We do expect this to be tracked on-chain in the final revision」——這段與 §13 的 π（0.6.4 起的 activity statistics）看起來不一致，疑似未更新的舊句，面試被問到時可指出。與 ch. 12 的呼應：Δ_seq／Δ_par 的張力正是「限制 transfer 以換取平行化」的動機。","trap":"「sweet spot」對比的兩端：fully-synchronous（Solana）與 persistently fragmented（Polkadot 1.0 / Cosmos / rollups）。"},{"id":"arch-jip4-protocol-parameters-080","ch":"ARCH","section":"JIP-4 chainspec `protocol_parameters` = fetch(0) encoding (App. B), 0.7.2 → 0.8.0","gpRef":"App. B fetch selector 0 (0.8.0 vs 0.7.2); JIP-4; JIP-5","difficulty":3,"kind":"delta","tags":["jip","chainspec","fetch","delta-0.8.0","code-gap"],"stem":"JIP-4 defines a chainspec's `protocol_parameters` as the JAM-serialized parameter blob in the encoding of `fetch` selector 0. Comparing GP 0.7.2 with 0.8.0, which statement is correct?","options":["The blob is unchanged between 0.7.2 and 0.8.0 (33 fixed-width little-endian fields, 134 bytes); 0.8.0 instead moved V and N into the genesis header's epoch marker H_E, so a chainspec must repeat the validator count there and a node reads the ticket count from the first epoch marker it imports; existing decoders therefore need no change beyond also parsing H_E","0.8.0 drops four fields — N (tickets per validator, now ⌈2E/|γ′_P|⌉), V (validator count, now implied by the validator sets in the genesis state), W_E and W_P (erasure-coding sizes, now derived from the validator count) — shrinking the blob from 33 fields / 134 bytes to 29 fields / 122 bytes; parsers and any 'apply parameters' code that still overwrites tickets-per-validator, validator count or EC sizes from it must change","0.8.0 adds fields for the new gas-model constants (C_gasunknown and the host-call base costs) and for the audit constants F and A so that services can read them via fetch(0); V stays in the blob because validator sets may now vary and a service must know the set size to compute erasure-coding parameters for its exports, so the blob grows from 33 fields / 134 bytes to 41 fields / 168 bytes","0.8.0 keeps all 33 fields but switches them from fixed-width little-endian integers to the general compact encoding E(x), so the blob length now depends on the values (e.g. 1,023 versus 6 validators); JIP-4 widened the `genesis_state` keys from 31 to 32 bytes at the same time so that the state trie can be loaded without re-hashing, and a tiny chainspec now encodes to well under 122 bytes"],"answer":1,"optNotes":["epoch marker H_E 只帶 entropy 與下一 epoch 的金鑰，不放 V／N；blob 本身確實從 33 欄縮成 29 欄。","N、V、W_E、W_P 四欄消失，122 bytes = 7×8 + 11×2 + 11×4；照舊覆寫這四項的程式都得改。","審計常數與 gas／PVM 常數本來就不在 Ω_Y 裡，0.8.0 也沒有把驗證者數留在 blob 內。","編碼仍是固定寬度 little-endian，所以 tiny 與 full 一樣都是 122 bytes；JIP-4 的 state key 也仍是 31 bytes。"],"explanation":"JIP-4：chainspec JSON 有 id、bootnodes（`<name>@<ip>:<port>`，name 是 53 字元 DNS 名：'e' ＋ base-32 Ed25519 公鑰）、genesis_header（JAM-serialized header 的 hex）、genesis_state（「Each key is a 62-character hex string defining the 31-byte state key」，值為任意長度 hex）、protocol_parameters（「A hex string containing JAM-serialized protocol parameters. Encoding matches protocol parameters returned by the fetch host call」）。0.7.2 的 fetch(0)（App. B Ω_Y，φ_10 = 0）依序為 E_8(B_I, B_L, B_S)、E_2(C)、E_4(D, E)、E_8(G_A, G_I, G_R, G_T)、E_2(H, I, J, K)、E_4(L)、E_2(N)、E_2(O, P, Q, R, T, U)、E_2(V)、E_4(R_A, W_B, W_C)、E_4(R_E)、E_4(R_M)、E_4(R_P)、E_4(R_R, W_T, W_X, Y)——33 欄、134 bytes。0.8.0 的 Ω_Y 只剩 29 欄：B_I, B_L, B_S, C, D, E, G_A, G_I, G_R, G_T, H, I, J, K, L, O, P, Q, R, T, U, W_A, W_B, W_C, W_M, W_R, W_T, W_X, Y，共 7×8 + 11×2 + 11×4 = 122 bytes。原因：#527 把每人票數 N 改為公式 ⌈2E/|γ′_P|⌉（tiny 4、full 2）；#514 允許可變驗證者集合（|κ| ∈ {3c | c ∈ [2, C+1]}，來自 genesis state 的 ι/κ/λ，不再是常數）；App. H 的 erasure coding 改以 d(v) = max{d ∈ N_{v/3+2} | W_G mod 2d = 0} 由 v 推導，所以 W_E／W_P 消失（W_G = 4104 仍是常數但本來就不在 blob 裡）。仍不在 blob 內的還有審計常數、C_gasunknown 等 gas 常數與 Z_*（PVM）；編碼也仍是固定寬度 little-endian，31-byte state key 未變。團隊程式：types.ProtocolParameters（types.go:1683）仍是 0.7.2 的 33 欄（含 N、V、WE、WP）；ApplyProtocolParameters（protocol_parameters.go）先斷言不可變常數（B_I, B_L, B_S, P, H, O, Q, I, J, U, G_A, G_I, W_A, W_B, W_C, W_R, W_T, W_M, W_X, T）再覆寫 C, D, E, G_R, G_T, K, L, N, R, V, W_E, W_P, Y——升到 0.8.0 時解碼順序要拿掉 N/V/W_E/W_P，V 改由 genesis state 取得，N 改用公式；#1035/#1022 已示範過 erasure 參數與驗證者數不一致會悄悄改變 erasure root。同一份 blob 也是 service 透過 fetch(0) 看到的（appB-fetch）。JIP-5 補充：dev 驗證者金鑰由 blake2b('jam_val_key_ed25519' ++ seed)／blake2b('jam_val_key_bandersnatch' ++ seed) 推導，trivial_seed(i) = 8 × E_4(i)，不含 BLS（internal/keystore/jip5_key_derivation.go）。","trap":"0.8.0 的 chainspec 不再告訴你 V——驗證者數量要數 genesis state 裡的 κ/ι；tiny 的 N 也不再是 3 而是 ⌈2·12/6⌉ = 4。"},{"id":"arch-fuzz-protocol-m1","ch":"ARCH","section":"jam-conformance fuzz protocol & the M1 evaluation pipeline","gpRef":"davxy/jam-conformance fuzz-proto README; w3f/jam-milestone-delivery PRs","difficulty":2,"kind":"concept","tags":["conformance","fuzzer","history","m1"],"stem":"Which description of the jam-conformance fuzz protocol that the W3F used for the M1 audit is correct?","options":["A synchronous request/response protocol over a Unix domain socket the target binds; messages are JAM-codec encoded with a u32 little-endian length prefix; after a PeerInfo handshake (features = bitwise AND of both sides) the fuzzer sends Initialize (header, state key-vals, ancestor list) then ImportBlock requests, each answered by the posterior state root or an Error (state unchanged); a root mismatch triggers GetState; ancestry and forks are mandatory for M1","A file-based protocol: the fuzzer writes numbered block .bin files into a shared directory and the target writes post-state JSON beside them; the handshake is a version file rather than a PeerInfo exchange, so there is no feature negotiation and ancestry and forks are always on; on the first state-root mismatch the run stops, no report is produced, and the submission is failed for that GP version","A TCP stream on which the target dials the fuzzer and sends the first handshake message; blocks are SCALE-encoded behind a u16 big-endian length prefix; the fuzzer diffs a full state dump after every block rather than a root, an invalid block is signalled by simply omitting the response, and the ancestry feature is optional for M1 because lookup-anchor checks bind block authors rather than importers","A JSON-RPC 2.0 session over WebSockets (port 19800) that the fuzzer binds and the target dials; blocks travel as hex strings and each importBlock call is answered with the header hash rather than a state root; a rejected block closes the connection, ancestry is reconstructed by the fuzzer from a finalizedBlock subscription instead of being supplied, and forks are never generated because Safrole precludes equivocation"],"answer":0,"optNotes":["Unix socket、JAM codec、u32 little-endian 長度前綴、PeerInfo 交集協商，全部對上 fuzz-proto README。","沒有目錄／檔案協定；feature 由雙方 PeerInfo 的 bitwise-and 協商，mismatch 之後還要產出完整 fuzz report。","實際是 Unix socket、JAM codec、u32 little-endian，fuzzer 先送 PeerInfo，而且每塊比對的是 state root。","JSON-RPC／WebSocket 19800 是 JIP-2 的節點 RPC；被拒的 block 回 Error 後連線繼續，forks 對 M1 更是必備。"],"explanation":"davxy/jam-conformance fuzz-proto README：「a synchronous request-response protocol over Unix domain sockets」，target 綁定具名 SOCK_STREAM socket（例 /tmp/jam_target.sock），只有 fuzzer 發起請求、target 回覆後才有下一個；「All messages are encoded according to the JAM codec format. Prior to transmission, each encoded message is prefixed with its length, represented as a 32-bit little-endian integer」。訊息：PeerInfo（discriminant 0x00，含 fuzz_version、fuzz_features、jam_version、app_version、app_name；fuzzer 先送、target 再回）；Initialize（header＋state key-vals＋開啟 ancestry 時的 ancestor list）→ StateRoot（0x02）；ImportBlock → StateRoot 或 Error（0xff；「the target must return an Error message and then wait for the next block」，狀態不變）；GetState → State（整個 key-val 儲存）。「Session features are determined by the intersection (bitwise-and) of the features listed in the PeerInfo message」；M1 必備：feature-ancestry（Initialize 帶祖先清單以做 GP 規定的 lookup-anchor 檢查，tiny 最多 24 筆）與 feature-forks（fuzzer 以突變 block 製造 fork，主鏈只從原始 block 延伸）——Safrole 只保證每個 slot 單一 sealer，並不使 equivocation 不可能，否則就不需要 disputes 與 best-chain 規則了。判定：每次 import 後比對 state root，「When a state root mismatch is detected the fuzzer attempts to fetch the whole state from the target to produce a comprehensive fuzz report」。M1 流程：W3F 以 GP 0.7.2 target 跑「1 million steps」（結果推到 fuzz-reports/0.7.2）→ Parity 審核 → Fellowship 錄音面試（rule 12）→ Fellows track referendum 以 remark「approves in full」批准（#595–#598）。團隊：internal/fuzz/messages.go 的型別（PeerInfo=0、SetState=1〔即 Initialize 的舊名〕、StateRoot=2、ImportBlock=3、GetState=4、State=5、Error=255）；#785 拒絕 block 時回 Error 並保持 pre-state root；#828 trace 中全零 post-state root 代表「必須拒絕」；#991/#983 fuzz 模式依 MaxLookupAge（tiny 24）修剪狀態；config.DefaultConfig().Info 就是送出的 PeerInfo（FuzzVersion 1）。","trap":"Error 回應 = block 被拒但連線繼續、狀態不變；runtime panic 才是真正的 bug——你們的 STF 以 *types.ErrorCode 區分 protocol error 與 runtime error。"},{"id":"arch-prize-interview-rule12","ch":"ARCH","section":"JAM Prize rules (rule 12) & milestone-delivery T&Cs","gpRef":"jam.web3.foundation/rules #12; T&C 3.5 / 6.1 / 8.4; delivery template","difficulty":1,"kind":"concept","tags":["prize","history","interview"],"stem":"According to the JAM Prize rules and the milestone-delivery terms, what is the purpose and standing of the post-submission interview?","options":["It is a mandatory oral defence of the performance tests (gas, trie/DB, signature verification, availability) that the Foundation runs on standard hardware; it is conducted by W3F staff rather than the Fellowship and is not recorded, rule 12 covering only authorship of the benchmark harness, generative-AI use being handled separately under the clean-room rule, and by design the outcome cannot change the prize awarded","It may be requested after submission to verify that team members are the legitimate authors (precluding generative AI) with definitive expertise on both the Gray Paper and their own codebase; the delivery template commits the team to a recorded interview by the Polkadot Technical Fellowship, ratified by an on-chain Fellowship remark, and failing to prove expertise may reduce the prize or disqualify the team","It is an optional Q&A with Parity's auditors about findings from the conformance fuzzer; passing it replaces the need to pass the public and private conformance tests, the outcome is recorded off-chain by the Foundation rather than ratified by the Fellowship on-chain, and because it is optional a team that declines simply waits for the next review window with no effect on its prize","It is a code-review session limited to the PVM and host-call implementation; teams that used generative AI may still pass provided they declared it up-front in the delivery document, the interviewers are drawn from the team's own client-implementation peers, and the only possible consequence of a poor showing is that payment is deferred until version 1.0 of the protocol is ratified"],"answer":1,"optNotes":["效能測試是 rule 5 的獨立要求；rule 12 的面試由 Fellowship 主持、範本明文是 recorded，且確實會影響獎金。","rule 12 的三個要素齊備：authorship 與 expertise 的驗證、錄音面試加 on-chain remark、減額或取消的後果。","rule 20 要求通過所有相關公開與私有測試，面試取代不了；核准也是 Fellows track 的 on-chain remark。","考的範圍是 GP 全文加自家程式；rule 9 是「must not be used in any substantive way」而非事先申報即可。"],"explanation":"jam.web3.foundation/rules 第 12 條原文：「An interview may be requested after submission to ensure team members are the legitimate authors of the code. This precludes the use of generative AI. The interview will seek to ensure the individual has definitive expertise on both the Graypaper and their own codebase. INABILITY TO PROVE THIS EXPERTISE MAY RESULT IN A REDUCED PRIZE OR FULL DISQUALIFICATION.」milestone-delivery 範本的聲明：「we agree to a recorded interview by the Polkadot Technical Fellowship on any matter arising from this milestone submission」與「this milestone submission will need to be ratified with an on-chain remark by the Polkadot Technical Fellowship before it can be merged」。周邊條款：T&C 6.1 允許 Foundation 在提交後要求面試以釐清；T&C 3.5 規定 conformance 以評估當時最新 GP release 為準（所以 0.8.0 差異必考）；T&C 8.4：M1 可在 GP 1.0 批准前付款（2026 年 2 月的 early acceptance 修訂），其餘里程碑不行；rule 5 另有獨立的效能測試（gas、trie/DB、簽章驗證、availability，由 W3F 在標準硬體上跑）；rule 20 要求通過所有相關公開與私有 conformance／performance 測試；rule 9 禁止實質使用生成式 AI；rule 6 clean-room。評審是 Polkadot Fellowship（排除涉入該實作的成員，Gav 的 HackMD）。實際流程（2026）：W3F fuzz（1M steps，GP 0.7.2）→ Parity audit → Fellowship 面試 → Fellows referendum（#595–#598 的 remark「approves in full」，暗示部分核准也可能）。","trap":"面試考兩件事：你「寫了」這份程式（authorship），以及你「懂」GP 與自己的程式（expertise）——回答時把 GP 條文與自家 code 路徑一起講。"},{"id":"ch03-sequence-set-subscripts","ch":"3","section":"3.7 Sequences","gpRef":"§3.7 (⟦T⟧, ⟦T⟧_n, ⟦T⟧_{:n}, ⟦T⟧_{n:}, ⟦T⟧_N); applied in eq. 8.1 and eq. 6.22","difficulty":2,"kind":"concept","tags":["notation","sequences","types"],"stem":"Eq. 8.1 types the authorizer pool and queue as α ∈ ⟦⟦H⟧_{:O}⟧_C and φ ∈ ⟦⟦H⟧_Q⟧_C, and eq. 6.22 types the entropy as η ∈ ⟦H⟧_4. Using the sequence-set notation of GP §3.7, what do these subscripts say?","options":["All three denote sequences of exactly that many hashes; the colon in ⟦H⟧_{:O} only marks that the pool is indexed cyclically (H_T mod O) rather than from zero","⟦H⟧_{:O} is the set of hash sequences of length at most O, ⟦H⟧_Q of length exactly Q and ⟦H⟧_4 of length exactly 4; the outer ⟦·⟧_C means exactly one inner sequence per core","⟦H⟧_{:O} denotes the first O elements of a hash sequence (a slice), so α is an O-element prefix of each core's queue, and ⟦H⟧_Q denotes the single element at index Q","⟦H⟧_{:O} is the set of hash sequences of length at least O (a pool must be kept full), while ⟦H⟧_Q and ⟦H⟧_4 are sequences of length at most Q and at most 4 respectively"],"answer":1,"optNotes":["cyclic index 是 ⟲ 上標（s[i]^⟲ ≡ s[i mod |s|]）的事，與型別下標無關。","冒號在前是上限、無冒號是恰好：pool 可未滿甚至為空，queue 每 core 恰好 Q = 80。","把型別標記當成切片語法；取前 n 個元素要寫 s_{…n} 或 →s^n。","把 _{:n} 與 _{n:} 的方向弄反了；「至少 n 個」要寫成 ⟦T⟧_{n:}。"],"explanation":"GP §3.7：⟦T⟧ 是元素取自 T、長度任意的序列集合（定義一個 ℕ → T 的 partial mapping）；⟦T⟧_n 是「containing exactly n elements」（complete mapping ℕ_n → T）；「sets of sequences of at most n elements and at least n elements may be denoted ⟦T⟧_{:n} and ⟦T⟧_{n:} respectively」；⟦T⟧_N 則是長度落在集合 N 內。套進題目：α ∈ ⟦⟦H⟧_{:O}⟧_C 是每個 core（C = 341）一條至多 O = 8 個 authorizer hash 的 pool，φ ∈ ⟦⟦H⟧_Q⟧_C 每 core 恰好 Q = 80，eq. 6.22 的 η ∈ ⟦H⟧_4 恰好 4 個 entropy 值。你們的 Go 型別完全對應：`AuthPool.Validate` 只檢查 len ≤ AuthPoolMaxSize(8)，`AuthQueue.Validate` 要求 len == AuthQueueSize(80)，兩者外層都要求 len == CoresCount（internal/types/types.go §8.1 區段）。","trap":"冒號在前（_{:n}）= 上限、冒號在後（_{n:}）= 下限、沒冒號 = 恰好；pool 可空、queue 固定 80。"},{"id":"ch03-first-last-n-arrows","ch":"3","section":"3.7.2 Editing","gpRef":"§3.7.2 (⌢, ⧺, →s^n, ←s^n) and §3.7 (⟲); applied in eq. 7.8, eq. 8.2 and eq. 6.35","difficulty":2,"kind":"concept","tags":["notation","sequences","arrows"],"stem":"Three state-transition rules use the arrow operators of GP §3.7.2: β_H′ ≡ ←(β_H† ⧺ e)^H (eq. 7.8), α′[c] ≡ ←(F(c) ⧺ φ′[c][H_T]^⟲)^O (eq. 8.2) and γ′_A ≡ →(n ∪ γ_A sorted ascending by ticket id)^E (eq. 6.35). Which reading is correct?","options":["←^n keeps the first n elements and →^n the last n: β_H′ and α′[c] therefore drop the newest entry once they are full, while γ′_A keeps the E largest ticket ids","Both arrows keep n elements counted from the front; the direction only records whether the sequence was extended with ⧺ (append at the right) or with ⌢ (prepend at the left)","→^n keeps the first n elements and ←^n the last n: β_H′ and α′[c] retain the H = 8 and O = 8 most recently appended entries, while γ′_A retains the E = 600 smallest ticket ids","The arrows are cyclic rotations by n positions, the same operation as the ⟲ superscript, so β_H′ and α′[c] behave as ring buffers whose oldest slot is overwritten in place"],"answer":2,"optNotes":["箭頭意義對調了：這樣會保留最舊、丟掉最新，且排序後取 →^E 拿到的是最小者不是最大者。","忽略了 ← 的定義（「only the final elements」）；⌢ 與 ⧺ 都接在右側，沒有 prepend 語意。","→ 留頭、← 留尾：β_H′ 與 α′[c] 保留最後 8 筆，γ′_A 取排序後最前 600 個最小 ticket id。","把截斷與 ⟲ 模數索引混為一談；β_H、α 是會伸縮的序列，不是原地覆寫的 ring buffer。"],"explanation":"GP §3.7.2：「We denote the sequence made up of the first n elements of sequence s to be →s^n ≡ [s_0, s_1, …, s_{n−1}], and only the final elements as ←s^n」。同節定義 ⌢ 為序列串接、⧺ 為元素接尾（x ⧺ i ≡ x ⌢ [i]）；§3.7 的 s[i]^⟲ ≡ s[i % |s|] 是模數索引，所以 φ′[c][H_T]^⟲ = φ′[c][H_T mod Q]（Q = 80）。三條規則的共同結構都是「先接、再截」：eq. 7.8 與 eq. 8.2 用 ←^n 保留最後 H = 8 / O = 8 筆（丟最舊），eq. 6.35 用 →^E 取排序後最前面 E = 600 個，GP 原文即「the accumulator becomes the lowest items of the sorted union」。你們的 code 三處都對得上：`alpha[c] = alpha[c][len-8:]`（authorization.go）、ticket accumulator 升冪排序後 `[:EpochLength]`（extrinsic_tickets.go）、`AddItem2BetaHPrime` 滿 8 筆時 `copy(historyPrime, historyDagger[1:])` 丟最舊。","trap":"箭頭指向哪邊就留哪邊：→ 留頭、← 留尾。§3.4 另有 % 為 mod、「5 ÷ 3 = 1 R 2」為商餘寫法（§6.1 的 e R m = τ/E 即 e = ⌊τ/E⌋、m = τ mod E）。"},{"id":"ch03-bits-msb-first-trie","ch":"3","section":"3.7.3 Boolean values","gpRef":"§3.7.3 bits(); eq. D.5–D.6 (M_σ, M); App. C.1.4 (bit-sequence encoding); eq. A.15 (PVM ℬ_n)","difficulty":3,"kind":"code","tags":["notation","bits","merklization","codec"],"stem":"GP §3.7.3 defines bits(B) for an octet sequence B by the example bits([160, 0]) = [1, 0, 1, 0, 0, …], and M_σ (eq. D.5) keys the state trie by bits(k) of the 31-octet state key. The team's trie splits entries at each depth with the code below. Is it consistent with the GP?","code":{"lang":"go","caption":"internal/utilities/merklization/merklization.go (partitionByBit)","src":"func partitionByBit(entries []types.StateKeyVal, depth int) int {\n\tbyteIdx := depth / 8\n\tbitMask := byte(1 << (7 - depth%8))\n\tleft := 0\n\tfor right := range entries {\n\t\tif entries[right].Key[byteIdx]&bitMask == 0 {\n\t\t\tentries[left], entries[right] = entries[right], entries[left]\n\t\t\tleft++\n\t\t}\n\t}\n\treturn left\n}"},"options":["Yes: 160 = 0b10100000, so bits() emits each octet's most significant bit first; masking key[depth/8] with 1 << (7 − depth mod 8) walks the path in exactly that order","No: bits() is MSB-first, but the first bit of every node is the branch/leaf discriminator, so the key path must skip bit 0 of key[0] and the mask should start at 1 << (6 − depth mod 8)","No: bits() is least-significant-bit first, matching the codec's bit-sequence encoding E(b ∈ 𝕓) which packs b_i into 2^i, so the mask must be 1 << (depth mod 8)","No: bits() is MSB-first, but M_σ keys the trie by bits(H(k)) — the Blake2b hash of the state key — so the partition must be taken over H(k) rather than the raw key"],"answer":0,"optNotes":["160 = 0b10100000 對上 [1,0,1,0,0,…]，1 << (7 − depth mod 8) 正是 MSB-first 的走法。","discriminator 在 node encoding（eq. D.3）裡、不在 key path 裡，key 的每個 bit 都要走。","LSB-first 的是 App. C.1.4 的 E(b ∈ 𝕓) 與 assurance bitfield；§3.7.3 的 bits() 是 MSB-first。","那是 Ethereum MPT 的做法（keccak(key) 當 path）；eq. D.5 直接用 31-octet state key 的 bits(k)。"],"explanation":"GP §3.7.3：bits(B) 是「the sequence of bits, ordered with the most significant first, which represent the octet sequence B」，160 = 0b10100000 → [1,0,1,0,0,0,0,0]。eq. D.5：M_σ(σ) ≡ M({bits(k) ↦ (k, v) | (k ↦ v) ∈ T(σ)})，eq. D.6 依 key 的第一個 bit 分左右子樹（k_0 = 0 → 左、1 → 右）再遞迴，所以深度 d 對應 key[d/8] 的第 (7 − d mod 8) 位——`partitionByBit` 正確。真正的陷阱是 GP 裡並存三個方向不同的 bit 函數：App. C.1.4 的 E(b ∈ 𝕓)「pack the bits into octets in order of least significant to most」（b_i 放在 2^i），因此 bits() **不是** E(𝕓) 的反函數（E(bits([160])) = [5] ≠ [160]）；PVM 的 ℬ_n（eq. A.15）同樣是 LSB-first 且作用在自然數上。你們的 assurance bitfield 解碼 `(bytes[i/8] >> (i%8)) & 1`（types.go `MakeBitfieldFromByteSlice`）是 LSB-first、對應 codec，與 trie 的 MSB-first 各自都對，混用才錯。","trap":"bits() = MSB-first（trie path）；E(𝕓)、PVM ℬ_n = LSB-first（bitfield、暫存器）。"},{"id":"ch03-vrf-signature-notation","ch":"3","section":"3.8.2 Signing Schemes","gpRef":"§3.8.2; applied in eq. 6.16 (seal), eq. 6.18 (H_V), eq. 6.30 (ticket proof) and eq. 6.32 (ticket id = Y)","difficulty":3,"kind":"concept","tags":["notation","crypto","vrf","safrole"],"stem":"GP §3.8.2 writes a Bandersnatch VRF signature as Ṽ_k^m⟨x⟩ ⊂ B_96 with VRF output Y(·) ∈ H, and eq. 6.16 requires H_S ∈ Ṽ_{H_A}^{E_U(H)}⟨X_T ⌢ η′_3 ⧺ i_e⟩. Which statement is correct?","options":["Ṽ is the anonymous Ring-VRF form: H_A is a ring root over the validator keys and the signer cannot be identified, whereas the identifying form V̊ ⊂ B_784 is the one tickets use","k = H_A is the signer's public key, the superscript E_U(H) is the signed message and the angle-bracketed term is the context; Y(H_S) is determined by the key and the context but not by the message","The angle brackets carry the message and the superscript the context, so Y(H_S) depends on the header serialization E_U(H); this is what lets the seal's VRF output commit to the block content","Y(H_S) is a 96-octet value; the 32-octet ticket identifier i_y is obtained as H(Y(H_S)), and Ed25519 signatures V̄_k⟨m⟩ likewise define a VRF output"],"answer":1,"optNotes":["具名與匿名說反了：Ṽ 具名、V̊ 才匿名；H_A 是單一公鑰，不是 B̊ 裡的 ring root。","下標鑰、上標訊息、⟨⟩ context，且 VRF output「influenced by x but not by m」。","⟨⟩ 裝的是 context、上標才是訊息；若反過來，Y 會隨 header 內容改變而失去 bias-resistance。","Y(·) ∈ H 本身就是 32 octet，eq. 6.16 直接令 i_y = Y(H_S)；Ed25519 也沒有 VRF output。"],"explanation":"GP §3.8.2：Bandersnatch 簽名 Ṽ_k^m⟨x⟩ 的下標 k 是公鑰、上標 m 是訊息、⟨⟩ 內的 x 是 context（LaTeX 巨集 \\bssignature{k}{x}{m} 排版成 Ṽ_k^m⟨x⟩）；「both define a VRF output, a high entropy hash influenced by x but not by m」。具名式與匿名式的差別則是「the member is identified in the former [Ṽ] and is anonymous in the latter [V̊]」——ring proof V̊_r^m⟨x⟩ ⊂ B_784 以 ring root r ∈ B̊ ⊂ B_144（由 O(keys) 算出）為下標。所以 eq. 6.16 的 seal 以未簽名 header E_U(H) 為訊息、X_T ⌢ η′_3 ⧺ i_e 為 context，Y(H_S) 只由金鑰與 context 決定——這正是 i_y = Y(H_S)（ticket id 在上一個 epoch 就能驗）以及 eq. 6.18 H_V ∈ Ṽ_{H_A}^{[]}⟨X_E ⌢ Y(H_S)⟩ 能當 bias-resistant entropy 的原因：作者改動 header 內容不會改變 VRF output。你們的 `createSignatureContext`（extrinsic_tickets.go）組的就是 ⟨⟩ 裡的 context（$jam_ticket_seal ⌢ η′_2 ⧺ attempt），訊息為空。","trap":"Ṽ_k^m⟨x⟩：下標鑰、上標訊息、⟨⟩ context；Y 看 context 不看訊息。Ṽ 具名 96 B、V̊ 匿名 784 B、V̄ Ed25519 64 B。"},{"id":"ch03-hash-functions-and-codec-subscripts","ch":"3","section":"3.8.1 Hashing","gpRef":"§3.8.1 (H, H_K, H_0, E_l and E^{-1}_l assertions); Keccak applied in eq. 7.7","difficulty":2,"kind":"concept","tags":["notation","hashing","codec"],"stem":"Per GP §3.8.1, which statement about the hash functions and the subscripted codec functions is correct?","options":["H is Keccak-256 as in the Yellow Paper and H_K is Blake2b-256; the subscript on E counts the octets of the input, so E_4 accepts only arguments already in B_4 and E^{-1}_8 only naturals below 2^64","H is Blake2b-256 and H_K is Keccak-256, both into H ≡ B_32; a non-blob argument is implicitly passed through E; E_4(x) asserts x ∈ N_2^32 and yields B_4, and E^{-1}_8(y) asserts y ∈ B_8 and yields N_2^64","H is Blake2b-256 and H_K is Keccak-256; hashing a tuple is undefined unless it is written explicitly as H(E(…)), and E_4 is the general variable-length natural encoding capped at four octets","H is Blake2b-512 truncated to 32 octets and H_K is Keccak-256; H_0 denotes H([]), the hash of the empty blob, which is also how M_σ identifies an empty sub-trie"],"answer":1,"optNotes":["H 與 H_K 對調了；下標指的也是 octet 序列那一端的長度，不是輸入端。","下標永遠釘住 octet 端：E_4(x) 斷言 x ∈ N_2^32 且結果 ∈ B_4，E^{-1}_8 反向亦然。","GP 明說輸入會隱含通過 E，tuple 可直接放進 H；E_4 是固定長度 little-endian，不是 compact 編碼的上限。","H 是 Blake2b-256 而非截斷的 512；H_0 是 [0]_32，不是 H([])。"],"explanation":"GP §3.8.1：「H denotes the set of 256-bit values equivalent to B_32. All hash functions in the present work output to this type and H_0 is the value equal to [0]_32」；H(m ∈ B) 是 Blake2b 256-bit（RFC 7693）、H_K(m ∈ B) 是 Keccak 256-bit（Ethereum YP 所用）。「The inputs of a hash function should be expected to be passed through our serialization codec E to yield an octet sequence… (Note that an octet sequence conveniently yields an identity transform.)」——所以 H(H)、H(E_4(s) ⌢ E(h)) 這類寫法不需要明寫 E。下標規則同節寫死：「we may subscript the transformation function with the number of octets we expect the octet sequence term to have. Thus, r = E_4(x ∈ N) would assert x ∈ N_2^32 and r ∈ B_4, whereas s = E^{-1}_8(y ∈ B) would assert y ∈ B_8 and s ∈ N_2^64」（App. C.1.7 的固定長度 little-endian）。Keccak 只用於 β_B accumulation-output belt（eq. 7.7，「to maximize compatibility with legacy systems」），header hash、state trie、erasure root 等都是 Blake2b。你們的 `internal/utilities/hash/hash.go`：`Blake2bHash` / `KeccakHash`。","trap":"H = Blake2b、H_K = Keccak、H_0 = 32 個 0；E_l 的 l 指 octet 長度那一端；tuple 進 H 隱含先 E。"},{"id":"ch03-dictionary-semantics","ch":"3","section":"3.5 Dictionaries","gpRef":"eq. 3.7–3.11; 𝒰 in eq. 3.2; ∅ / A? / ∇ in §3.3","difficulty":2,"kind":"concept","tags":["notation","dictionaries","calc"],"stem":"Let d = {1 ↦ a, 2 ↦ b} and e = {2 ↦ c, 3 ↦ a} be dictionaries in ⟨N → B⟩. Applying GP §3.5 (eq. 3.7–3.11), which statement is correct?","options":["d ∪ e is undefined because key 2 collides — dictionary union is only defined when K(d) ⫰ K(e), which is why the GP always writes (d ∖ K(e)) ∪ e out explicitly instead of d ∪ e","d ∪ e = {1 ↦ a, 2 ↦ c, 3 ↦ a} because the right operand wins on a collision; V(d ∪ e) = {a, c}; and writing d[3] in a rule asserts that key 3 exists — a block relying on it without handling ∅ is invalid","d ∖ {2} removes the pairs whose value is 2, so d ∖ {2} = d; K(e) = {c, a}; and d ∪ e = {1 ↦ a, 2 ↦ c, 3 ↦ a} because the right operand wins on a collision","d ∪ e = {1 ↦ a, 2 ↦ b, 3 ↦ a} because the left operand wins on a collision; V(d ∪ e) = [a, b, a] keeps duplicates in insertion order; and d[3] = ∅ is an ordinary, valid lookup result in every context"],"answer":1,"optNotes":["union 正是為了處理衝突而定義的，(d ∖ K(e)) ∪ e 就是它的定義本身，不是替代寫法。","右邊優先、V 去重，且 GP 明說下標是「an implicit assertion that the key exists」。","∖ 減的是鍵集合（eq. 3.8）、K(·) 取的也是鍵（eq. 3.9），所以 K(e) = {2, 3} 而非值。","eq. 3.11 是右邊優先，V(·) 回傳的集合也會去重；d[k] 更是隱含斷言 key 存在。"],"explanation":"逐步計算：eq. 3.11 d ∪ e ≡ (d ∖ K(e)) ∪ e，「priorities the right-side operand in the case of a key-collision」：K(e) = {2, 3}（eq. 3.9），d ∖ K(e) = {1 ↦ a}（eq. 3.8，減去的是鍵集合 s ⊆ K），再聯集 e 得 {1 ↦ a, 2 ↦ c, 3 ↦ a}；eq. 3.10 的 V(·) 是**集合**，「should different keys with equal values appear in the dictionary, the set will only contain one such value」，故 V(d ∪ e) = {a, c}。查詢的陷阱藏在 eq. 3.7 之後那句：形式上 d[k] ≡ v 若存在、否則 ∅，但 GP 緊接著說「when using a subscript, it is an implicit assertion that the key exists in the dictionary. Should the key not exist, the result is undefined and any block which relies on it must be considered invalid」——要容許缺鍵就必須明寫處理，GP 自己的模式是 𝒰(d[k], default)（eq. 3.2 substitute-if-nothing）或先用 s ∈ K(d) 守門（accumulation 的 providable 函數 Y）。另外 §3.3：∅ 表示「validly left without a specific value」（|∅| = 0，A? ≡ A ∪ {∅}），∇ 才表示錯誤／無效。","trap":"∪ 右邊贏；∖ 減鍵；K 鍵集、V 值集（去重）；缺鍵要嘛 𝒰(…) 給預設、要嘛 block 無效。"},{"id":"ch04-dagger-intermediate-states","ch":"4","section":"4.2.1 State Transition Dependency Graph","gpRef":"eq. 4.6, 4.12, 4.13, 4.14, 4.16, 4.17, 4.18","difficulty":2,"kind":"concept","tags":["stf","intermediate-state","ordering","delta-0.8.0"],"stem":"GP 0.8.0's dependency graph names four dagger-superscripted intermediate states: β_H†, ρ†, ρ‡ and δ‡. Which description of what each one has just absorbed is correct?","options":["β_H† = β_H after this block's guarantees E_G are appended to the newest entry; ρ† = ρ after the assurances E_A; ρ‡ = ρ† after the guarantees E_G; δ‡ = δ after the preimages E_P are integrated, before accumulation runs","β_H† = β_H after the accumulation-output log θ′ has been committed to the belt; ρ† = ρ after the guarantees E_G; ρ‡ = ρ† after the disputes E_D; δ‡ = δ after E_P is integrated and before deferred transfers are applied","β_H† = β_H with the parent's posterior state root H_R written into its newest entry; ρ† = ρ after the disputes E_D; ρ‡ = ρ† after the assurances E_A; δ‡ = δ after accumulating R*, before E_P is folded in","β_H† = β_H with H_R written in; ρ† = ρ after E_A; ρ‡ = ρ† after E_D; δ‡ = δ after E_P — the order of disputes and assurances is immaterial because both only remove entries from ρ"],"answer":2,"optNotes":["eq. 4.6 的 β_H† 只依賴 (H, β_H)、補的是 parent 的 state root；E_P 也在 accumulation 之後才併入。","belt β_B 由 θ′ 更新、與 dagger 無關；ρ 的兩步也把 E_D 與 E_G 對調了。","四個中間態分別出自 eq. 4.6、4.12、4.13 與 4.16，順序與依賴列完全對得上。","E_D 與 E_A 不可交換：assurance 只能對 ρ†[c] ≠ ∅ 的 core 設 bit（eq. 11.15）。"],"explanation":"eq. 4.6 β_H† ≺ (H, β_H)：eq. 7.5 把 β_H 最後一筆的 state root（前一塊寫入時是 H_0）改為 H_R，即 parent 的 posterior root，要到本塊 header 才知道；eq. 4.12 ρ† ≺ (E_D, ρ)：disputes 先把 verdict 為 bad/wonky 的 report 從 core 清掉（eq. 10.14）；eq. 4.13 ρ‡ ≺ (E_A, ρ†)：assurances 讓 report 變 available（進入 R，eq. 11.17）或因 timeout 而移除（eq. 11.18）；eq. 4.14 ρ′ ≺ (E_G, ρ‡, κ, τ′)：最後才放入新 guarantee；eq. 4.16 (ω′, ξ′, δ‡, χ′, ι′, φ′, θ′, S) ≺ (R*, ω, ξ, δ, χ, ι, φ, τ, τ′)：accumulation 產出 δ‡（accumulation.tex 另稱 δ† 為 post-accumulation 的第一個中間態、δ‡ 為更新 last-accumulation 時戳 τ′ 後的第二個，overview 的圖只列 δ‡）；eq. 4.18 δ′ ≺ (E_P, δ‡, τ′)：preimage 最後併入。GP：「The latter two [4.17, 4.18] mark a merge and join in the dependency graph… the availability extrinsic may be fully processed and accumulation of work happen before the preimage lookup extrinsic is folded into state」。0.8.0 的符號也要跟上：新 available 的 report 序列寫作 R（R* 為 accumulatable，0.7.2 寫 W/R*），dagger 標在 β_H 上（β = (β_H, β_B)，belt β_B 不受 parent-root 修正影響）；你們 0.7.2 的 code 仍用 W/R*，`intermediateStates` 存 β†, ρ†, ρ‡, δ†, δ‡（chain_state.go）。","trap":"口訣：β_H† 補 root；ρ† 判、ρ‡ 保、ρ′ 收；δ‡ 算完帳、δ′ 才收 preimage。"},{"id":"ch04-extrinsic-dependency-inputs","ch":"4","section":"4.2.1 State Transition Dependency Graph","gpRef":"eq. 4.11–4.20","difficulty":3,"kind":"concept","tags":["stf","extrinsic","ordering"],"stem":"Reading the 0.8.0 dependency graph (eq. 4.5–4.20) literally, which statement about where the five extrinsic components enter the transition is TRUE?","options":["The guarantees extrinsic E_G is an input to ρ′, β_H′, α′ and π′, but not to the accumulation step, whose only extrinsic-derived input is R* (derived from E_A and ρ†)","The preimages extrinsic E_P is an input to the accumulation step (eq. 4.16), so a service's accumulate code can read a preimage that was provided in the same block","The disputes extrinsic E_D is a direct input to π′, because the validator statistics record which validators were reported as offenders in the block","The assurances extrinsic E_A is a direct input to ρ′, i.e. ρ′ ≺ (E_G, E_A, ρ†, κ, τ′), because guarantees and assurances are processed together in one pass over the cores"],"answer":0,"optNotes":["eq. 4.16 的輸入 (R*, ω, ξ, δ, χ, ι, φ, τ, τ′) 裡沒有任何 extrinsic，只有已 available 的 R*。","eq. 4.18 是 δ′ ≺ (E_P, δ‡, τ′)：preimage 在 accumulation 之後才併入，accumulate 讀不到同塊的。","π′ ≺ (E_G, E_P, E_A, E_T, τ, κ′, π, H, S) 不含 E_D；offender 記在 ψ′_O 與 header 的 H_O。","E_A 先產生 ρ‡（4.13），再由 E_G 覆蓋成 ρ′（4.14），並不是同一個 pass 的直接輸入。"],"explanation":"逐條讀 eq. 4.5–4.20：E_T → γ′ (4.7)、π′ (4.20)；E_D → ψ′ (4.11)、ρ† (4.12)；E_A → ρ‡ (4.13)、R* (4.15)、π′；E_G → ρ′ (4.14)、β_H′ (4.17)、α′ (4.19)、π′；E_P → δ′ (4.18)、π′。結構上的關鍵是 accumulation（4.16）與 extrinsic 之間隔了一層：report 必須先 **available**（E_A 超過 2/3 assurance，eq. 11.17）才會進入 R*，所以同一塊 E_G 裡的 report 最快也要下一塊才被 accumulate；而 preimage 的併入更排在 accumulation 之後（GP：「accumulation of work happen before the preimage lookup extrinsic is folded into state」）。你們 STF 的順序（code-map §2：ψ′ → ρ† → ρ‡ → accumulation → E_P 併入 → α′ → π′ 最後）與此一致。","trap":"accumulation 的唯一「外部」輸入是 R*；E_P 最後、E_D 不進 π′。"},{"id":"ch04-in-core-300x-rationale","ch":"4","section":"4.8.1 In-core Consensus","gpRef":"§4.9.1","difficulty":2,"kind":"rationale","tags":["architecture","in-core","scalability"],"stem":"The Overview states that JAM should be able to do 'upwards of 300 times' the computation in-core as a single machine running the VM at full speed. What justifies this figure, and what keeps such unreplicated computation safe?","options":["In-core results are accepted on the guarantors' signatures alone and are never re-executed by anyone else; the economic stake bonded by the guarantors (slashed on a later dispute) is what makes the 300x figure safe without any further verification","A given computation is executed by only a subset of validators, so throughput scales with network size rather than one machine; the guarantee/assure/audit (and if needed judge) game secures it, and stateless in-core execution can be reproduced by any node synced to the finalized chain","The 300x comes from each of the 341 cores using the whole 6-second slot in parallel; in-core code may read arbitrary on-chain state as of the lookup-anchor block, and that anchoring is what makes its results reproducible by other nodes","Every validator still executes every in-core computation, but the PVM's recompiler makes RISC-V code roughly 300 times faster than EVM bytecode; safety therefore follows from full replication, exactly as in the on-chain model, and no auditing stage is required"],"answer":1,"optNotes":["漏掉 auditing——「確保會有可期待為誠實的一方檢查」正是 ELVES 存在的理由。","GP 給的理由正是「only a subset of the network」執行，算力隨網路規模而非單機擴展。","違反 stateless 設計：refine 只能透過 historical_lookup 讀 preimage，不能讀任意 on-chain state。","那是 on-chain（everybody does everything）的描述；300x 也不是 PVM 對 EVM 的速度比。"],"explanation":"GP §4.9.1：「In this model… only a subset of the network is responsible for actually executing any given computation and assuring the availability of any input data it relies upon… we are able to scale the amount of computation done in consensus commensurate with the size of the network, and not with the computational power of any single machine… upwards of 300 times」。GP 沒有推導 300 這個數字；直觀上它與 core 數同量級——1023 validators / 每 core 3 guarantors = C = 341 cores，扣掉 audit、availability 等額外負擔即「300 多倍」（此為推論，非 GP 原文）。安全性來自「a crypto-economic game of three stages called guaranteeing, assuring, auditing and, potentially, judging」：guarantee 讓無效計算付出經濟代價、assure 確保輸入資料一段期間內可取得、audit 確保會有可期待為誠實的一方檢查正確性（judging 只在有爭議時發生）。並且「All execution done in-core must be reproducible by any node synchronized to the portion of the chain which has been finalized… designed to be as stateless as possible. The requirements… include only the refinement code of the service, the code of the authorizer and any preimage lookups it carried out」，lookup-anchor 必須落在 finalized chain 且夠新。","trap":"三段式（guarantee → assure → audit，必要時 judge）；in-core = stateless、可由 finalized chain 重現；300x ≈ core 數量級。"},{"id":"ch04-best-block-vs-finalized","ch":"4","section":"4.6 Best block","gpRef":"§4.6; §4.3 (head, finalized); §19 (best chain)","difficulty":2,"kind":"concept","tags":["consensus","grandpa","best-chain"],"stem":"GP §4.6 distinguishes the 'best block' from what the Grandpa finality gadget reports. Which statement matches the GP?","options":["The best block is simply the head — the valid block with the most ancestors — with ties between competing heads broken by the smaller header hash; Grandpa merely confirms that head some blocks later and plays no part in choosing a parent for authoring","The best block is the most recent block whose timeslot is not in the future; Grandpa is consulted only afterwards, to prune whichever fork lost, so no separate best-chain rule is needed either for authoring or for serving state to applications","The best block is the latest Grandpa-finalized block; JAM nodes never author on top of an unfinalized block, which is precisely why Grandpa lags only 1–2 blocks behind the most recent head and why no speculative state is ever exposed to applications","The best block is the head of the best chain (§19), used when latency matters more than certainty — choosing the parent for a block one is about to author, or reporting the latest state to a downstream application — at the risk that it never becomes canonical"],"answer":3,"optNotes":["§19 的 best chain 不是最長鏈，選的是 ticket 封印祖先數最多者，GP 也沒有 header hash tie-break。","「timeslot 不在未來」只是 block 暫時有效性的條件（§4.4、§5），不是 best block 的定義。","與 GP 相反：那樣每塊都要等 finality，而 Grandpa 本來就落後最新 head 約 1–2 塊。","GP 明講 best block 就是 §19 best chain 的 head，用於出塊選 parent 與查最新狀態這類低延遲場合。"],"explanation":"GP §4.6：「The simplest and least risky means… would be to inspect the Grandpa finality mechanism… However… Grandpa will typically return a block some small period older than the most recently authored block. (Existing deployments suggest around 1-2 blocks in the past…) There are often circumstances when we may wish to have less latency at the risk of the returned block not ultimately forming a part of the future canonical chain. E.g. we may be in a position of being able to author a block, and we need to decide what its parent should be. Alternatively, we may care to speculate about the most recent state… In these cases, we define the best block as the head of the best chain, itself defined in section 19.」§19 的 best block B♭ 必須：以 finalized block 為祖先、未 finalized 的部分沒有 equivocation（同一 timeslot 兩個有效 block）、已 audited；候選中選「使用 slot-sealer ticket（而非 fallback key）封印的祖先數最多」者，Grandpa 投票投的就是它（連同 posterior state root）。§4.3 另把 head 定義為「the block with the most ancestors」——finalized、best、head 是三個不同的概念。","trap":"finalized（Grandpa，落後 1–2 塊、最安全）≠ best（§19 best chain 的 head，出塊/查詢用）≠ head（祖先最多）。"},{"id":"ch05-unsigned-header-serialization","ch":"5","section":"5 The Header (serialization, Appendix C.2)","gpRef":"eq. 5.1 & §C.2 (E(H), E_U(H))","difficulty":2,"kind":"code","tags":["header","codec","seal","code"],"stem":"The team derives the unsigned header serialization by encoding the full header and truncating it. Which statement about GP 0.8.0's E(H) and E_U(H) explains why this is sound and describes E_U's layout correctly?","code":{"lang":"go","caption":"internal/utilities/block_serialization.go (HeaderUSerialization) + field order of Header.Encode in internal/types/encode.go","src":"// (C.23)\n// This function encodes the header's properties without the seal\n// I still use header encoding function, but remove the length of the encoded seal\nfunc HeaderUSerialization(header types.Header) (output types.ByteSequence, err error) {\n\tencoder := types.GetEncoder()\n\tdefer types.PutEncoder(encoder)\n\n\tserializedHeader, err := encoder.Encode(&header)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\n\tlengthOfSeal := len(header.Seal)          // BandersnatchVrfSignature = [96]byte\n\tvalidLength := len(serializedHeader) - lengthOfSeal\n\n\toutput = append(output, serializedHeader[:validLength]...)\n\n\treturn output, nil\n}\n\n// encode.go — Header.Encode writes, in order: Parent, ParentStateRoot, ExtrinsicHash, Slot,\n//   EpochMark   (nil -> 0x00, else 0x01 ++ mark),\n//   TicketsMark (nil -> 0x00, else 0x01 ++ E tickets),\n//   AuthorIndex, EntropySource, OffendersMark (length-prefixed), Seal"},"options":["E_U(H) omits both Bandersnatch signatures — the entropy source H_V as well as the seal H_S — so a conformant implementation must cut 192 octets from E(H), and the seal's message contains no VRF material at all, which is what stops the two signatures depending on one another","E_U(H) is E(H) with the seal replaced by 96 zero octets, keeping the header length constant so that H_P can be computed before sealing; simple truncation therefore yields a message 96 octets too short and an implementation must re-encode with a zeroed seal instead","The serialized field order follows eq. 5.1 literally (…, H_W, var(H_O), E_2(H_I), H_V, H_S), so truncating the last 96 octets is only correct when H_O is empty, because the length-prefixed offenders list shifts every field that follows it, the seal included","E(H) = E(E_U(H), H_S): the 96-octet seal is the last, fixed-size field, so cutting 96 bytes off E(H) yields exactly the seal's message; inside E_U the order is H_P, H_R, H_X, E_4(H_T), H_E (0/1 discriminator), H_W (0/1 discriminator), E_2(H_I), H_V, var(H_O)"],"answer":3,"optNotes":["E_U 只排除 seal；連 H_V 也拿掉的話，eq. 6.16/6.17 的 seal 就簽不到本塊的 entropy 來源。","E_U 是直接省略 seal 而不是填零：C.2 寫的是 E(H) = E(E_U(H), H_S)。","H_O 再長也只是把 seal 的起點往後推，「尾端 96 bytes 就是 seal」與 H_O 長度無關。","H_S 固定 96 octets 且永遠排在最後，去尾 96 bytes 恰好就是 seal 所簽的 message。"],"explanation":"附錄 C.2：E(H) = E(E_U(H), H_S)，而 E_U(H) = E(H_P, H_R, H_X, E_4(H_T), E_epochmark(H_E), maybe(H_R), E_2(H_I), H_V, var(H_O))。H_V 仍留在 E_U 內（seal 簽到 H_V；H_V 的 VRF context 則含 Y(H_S)，而 VRF output 只由 key 與 context 決定、與 message 無關，所以不循環）。注意序列化順序與 eq. 5.1 的 tuple 順序不同：E_U 裡 E_2(H_I)、H_V 排在 H_O 之前，H_O 以 var（長度前綴）放在 E_U 最後；H_E 用 E(0) 或 E(1, η_0, η_1, var(k))，H_W 用 maybe（0 或 1 ⌢ 固定 E 張 ticket）。你們 Header.Encode 的欄位順序 Parent…AuthorIndex, EntropySource, OffendersMark, Seal 正是這個順序，所以 HeaderUSerialization 的做法正確。0.8.0 的小 delta：epoch marker 的 key 序列改為 var(k)（#1031）。","trap":"序列化順序 p r x t e w i v o | s（H_O 在 H_V 之後、seal 最後），eq. 5.1 的 tuple 順序是 p r x t e w o i v s；E_U = E(H) 去尾 96 bytes。"},{"id":"ch05-extrinsic-hash-inclusion-proof","ch":"5","section":"5 The Header","gpRef":"eq. 5.4–5.7","difficulty":3,"kind":"concept","tags":["header","extrinsic-hash","light-client","delta-0.8.0"],"stem":"A light client holds only a verified header H and wants to check that preimage blob d for service s was included in that block's E_P. Given H_X = H(E(H#(a))) with a = [E_T(E_T), p, g, E_A(E_A), E_D(E_D)] (eq. 5.4–5.7), what is the minimal witness it needs and what is the shape of the check?","options":["The other four component hashes (h_T, h_g, h_A, h_D) plus the entire p sequence of (E_4(s_i), H(d_i)) pairs: it checks (E_4(s), H(d)) ∈ p and H(h_T ⌢ H(p) ⌢ h_g ⌢ h_A ⌢ h_D) = H_X — no other blob is needed, but p is a flat blob, not a log-size path","The complete E_P (every preimage blob of the block) together with the other four extrinsics in full, because H_X hashes the block's whole extrinsic serialization as one blob and cannot be recomputed from hashes alone","A log₂|E_P|-length Merkle path from the leaf H(d) up to H_X, because H_X is a binary Merkle root over every extrinsic item of the block, so the witness is O(log n) hashes and grows only logarithmically as the block fills up","Only H(d), the service index s and the block's H_X, because eq. 5.6 commits each (service, preimage-hash) pair directly into H_X, so a single pair can be checked without touching the rest of E_P or any of the other four extrinsic components"],"answer":0,"optNotes":["witness = 四個 sibling hash + 整段 p（每項 36 bytes），大小隨區塊裡的 preimage 數線性成長。","那是 0.7.2 的情況；#524 之後 p 只帶 (service, blake(blob))，不必附上其他人的 blob。","H# 只是逐項 map 後平鋪再取一次 hash，不是二元 Merkle tree，p 內部沒有 log 長度的路徑。","p 是先整段編碼再取一次 hash，單憑一組 (s, H(d)) 與 H_X 是重算不出來的。"],"explanation":"eq. 5.4：H_X ≡ H(E(H#(a)))，H# 是把 H 逐項套用到序列 a 的每個元素（§3 notation：f^# 表示 map），所以 H_X = H(h_T ⌢ h_p ⌢ h_g ⌢ h_A ⌢ h_D)，其中 h_p = H(p)、p = E(var[(E_4(s), H(d)) | (s, d) ∈ E_P])（eq. 5.6）。這是兩層結構：外層是 5 個 component hash 平鋪後再 hash，內層的 p 是一整個 blob。§5 說明：「taking care to allow for the possibility of reports and preimages to individually have their inclusion proven」——0.8.0 PR #524 把 p 從 E_P(E_P)（含完整 blob）改成 (service, blake(blob)) 的序列，證明時才不必附上其他 preimage 的 blob。你們 CreateExtrinsicHash（0.7.2）對 preimages 仍是 hash 整個 EncodeExtrinsicPreimages，升到 0.8.0 時要改成對 (E_4(s), H(d)) 序列取 hash（#1031）；guarantees 那一段（g，report 用 H(w) 代替）在 0.7.2 已經做對。","trap":"H_X 是「hash of five hashes」，不是 Merkle root；只有 p 與 g 以 hash 代替內容，E_T/E_A/E_D 是整包 encode 後 hash。"},{"id":"ch05-future-slot-temporarily-invalid","ch":"5","section":"5 The Header","gpRef":"eq. 5.8 & §5 text","difficulty":2,"kind":"concept","tags":["header","time","validation"],"stem":"A node receives a block at wall-clock time T whose header has H_T · P > T, while
