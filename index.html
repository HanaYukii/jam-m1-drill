 verdict still needs ≥ 1 fault","A culprit names a report in ψ′_B plus that guarantor's signature over X_G ⌢ r; a fault names a report whose claimed validity v contradicts the verdict (r ∈ ψ′_B ⇔ r ∉ ψ′_G ⇔ v); offender keys must lie in (κ ∪ λ)'s Ed25519 keys minus ψ_O; a good verdict still needs ≥ 1 fault"],"answer":3,"optNotes":["k 的定義最後就寫著扣掉 ψ_O，重複上報使區塊無效；eq. 10.13 只對 (r, ⊤) 要求 fault。","「bad verdict 要 ≥ 2 culprits」是 0.7.2 的規則（0.8.0 #525 移除），且 fault 的 v 條件反了。","culprit 是 bad report 的 guarantor（r ∈ ψ′_B、簽 X_G），fault 不落在 ψ′_W，k 也要含 λ。","四個條件全中；關鍵是 fault 宣稱的 v 必須與 verdict 相反，good verdict 仍要 ≥ 1 個 fault。"],"explanation":"eq. 10.6：∀(r, k, s) ∈ E_C：r ∈ ψ′_B ∧ k ∈ k ∧ s 是 k 對 X_G ⌢ r 的簽章（culprit = 曾 guarantee 一個壞 report 的人，用的正是他的 guarantee 簽章；X_G = $jam_guarantee，正是 eq. 11.28 那把簽章，所以 ρ 在 0.8.0 要存整個 guarantee 才 construct 得出來）。eq. 10.7：∀(r, v, k, s) ∈ E_F：r ∈ ψ′_B ⇔ r ∉ ψ′_G ⇔ v（fault 宣稱的 validity 必須與 verdict 相反：對 bad report 投 valid，或對 good report 投 invalid）。k = {κ ∪ λ 的 Ed25519 key} \\ ψ_O。eq. 10.13：∀(r, ⊤) ∈ v：∃(r, …) ∈ E_F——good verdict 至少要有一個 fault，因為 2/3+1 全投正票的 verdict 必然是有人先投了反票才會啟動 dispute。0.8.0 #525「remove culprits requirement」則拿掉了 bad verdict ≥ 2 culprits 的舊要求。","trap":"你們 0.7.2 code 仍檢查 bad verdict ≥ 2 culprits（code-map 3.6.4）——0.8.0 要拿掉。"},{"id":"ch10-ordering","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.8–10.11","difficulty":2,"kind":"concept","tags":["disputes","ordering"],"stem":"Which ordering/uniqueness constraints does the disputes extrinsic impose?","options":["Verdicts ordered by the timeslot at which each dispute was raised; culprits and faults ordered by the offender's index within κ; judgments ordered by signature; duplicates anywhere are silently dropped rather than invalidating the block","Verdicts ordered & unique by report hash; culprits and faults each ordered & unique by report hash; judgments within a verdict ordered & unique by their ⊤/⊥ vote; a report hash already in ψ_G ∪ ψ_B ∪ ψ_W may be re-judged to overturn the earlier verdict","Verdicts ordered & unique by the verdict's epoch index; culprits and faults each ordered & unique by Ed25519 key; judgments ordered & unique by validator index; no verdict report hash may already be in ψ_O","Verdicts ordered & unique by report hash; culprits and faults each ordered & unique by Ed25519 key; judgments within a verdict ordered & unique by validator index; no verdict report hash may already be in ψ_G ∪ ψ_B ∪ ψ_W"],"answer":3,"optNotes":["verdict 結構裡根本沒有 timeslot 欄位，offender 用 key 不用 index，違規也不會被靜默忽略。","offender 序列的排序鍵是 Ed25519 key、judgment 用 index，而 eq. 10.10 不許翻案重判。","epoch index 只有兩個可能值排不出唯一序；要比對的也是 ψ_G ∪ ψ_B ∪ ψ_W 而非裝 key 的 ψ_O。","三個排序鍵都對：verdict 用 report hash、offender 用 Ed25519 key、judgment 用 validator index。"],"explanation":"eq. 10.8：E_V 依 report hash 排序且唯一；10.9：E_C、E_F 依 offender 的 Ed25519 key 排序且唯一（同一個 report 可能有多個 offender，用 hash 排不出唯一序）；10.10：verdict 的 report hash 與 ψ_G ∪ ψ_B ∪ ψ_W 不相交，判決一次定讞——GP 說 recording reports found to be valid「ensures that additional disputes cannot be raised in the future of the chain」；10.11：每個 verdict 的 judgments 依 validator index 排序且唯一。這些是 test vectors（disputes/）大量 invalid case 的來源：not sorted、duplicate、already judged，任何一項不合都直接使區塊無效。","trap":"culprits/faults 排序鍵是 key，不是 report hash。"},{"id":"ch10-effects","ch":"10","section":"10.2–10.3","gpRef":"eq. 10.14–10.19","difficulty":2,"kind":"concept","tags":["disputes","state"],"stem":"What are the state effects of processing E_D, and what must the header's offenders marker H_O contain?","options":["ρ†[c] is left untouched, a non-positive verdict only stopping accumulation later; ψ′_G, ψ′_B and ψ′_W each absorb their verdict's report hashes; ψ′_O absorbs all culprit and fault keys; H_O = H(E(E_D)), one commitment to E_D","ρ†[c] = ∅ for any core whose pending report was judged bad or wonky; ψ′_G, ψ′_B and ψ′_W each absorb their verdict's report hashes; ψ′_O absorbs all culprit and fault keys; H_O = [culprit keys in order] ⌢ [fault keys in order]","ρ†[c] = ∅ for any core whose pending report was judged bad or wonky; ψ′_G is emptied at each epoch change while ψ′_B and ψ′_W grow; ψ′_O absorbs the culprit keys only; H_O = [fault keys in order] ⌢ [culprit keys in order]","ρ†[c] = ∅ only for cores whose report was judged bad, wonky ones staying pending; ψ′_G, ψ′_B and ψ′_W each absorb their verdict's report hashes; ψ′_O absorbs all culprit and fault keys; H_O lists the offenders' validator indices"],"answer":1,"optNotes":["清 ρ† 正是 disputes 階段的效果；H_O 要列出所有新 offender 的 key，不是 E_D 的單一 hash。","eq. 10.14 的條件是 v ∈ {⊥, ∅}，bad 與 wonky 一起清；H_O 是 culprits 在前、faults 在後。","eq. 10.15–10.17 三個集合只做 ∪、永不清空；ψ′_O 兩邊 key 都吸收；H_O 串接順序也反了。","wonky 代表無法判定，eq. 10.14 一樣要清掉；eq. 10.19 的 H_O 裝 Ed25519 key 不是 index。"],"explanation":"eq. 10.14：∀c：ρ†[c] = ∅ 當 (H(ρ[c]_w), v) ∈ v 且 v ∈ {⊥, ∅}——GP：「Authoring a block with a non-positive verdict has the effect of cancelling its imminent accumulation」。eq. 10.15–10.18：ψ′_G/ψ′_B/ψ′_W 各自 ∪ 對應的 report hash（三者單調成長、永不清空，這正是「同一個 report 不能被重複 dispute」的基礎）；ψ′_O = ψ_O ∪ {culprit keys} ∪ {fault keys}。eq. 10.19：H_O ≡ [k | (…, k, …) ∈ E_C] ⌢ [k | ∈ E_F]，內容必須是「exactly the keys of all new offenders」，好讓輕客戶端從 header 直接讀出誰被罰。你們 ClearWorkReports 對 PositiveJudgmentsSum < 2V/3 的 verdict 清 ρ。","trap":"ρ† 是 disputes 之後、assurances 之前的中間狀態；順序：ρ → ρ† (disputes) → ρ‡ (assurances) → ρ′ (guarantees)。"},{"id":"ch10-code-thresholds","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.12 — internal/extrinsic/dispute_controller.go CompareVerdictsWithPsi","difficulty":2,"kind":"code","tags":["disputes","code","delta-0.8.0"],"stem":"This is the team's verdict classification. What must change for GP 0.8.0 conformance?","code":{"lang":"go","caption":"internal/extrinsic/dispute_controller.go","src":"for _, verdict := range verdictSumSequence {\n    switch verdict.PositiveJudgmentsSum {\n    case types.ValidatorsCount*2/3 + 1:\n        updates.Good = append(updates.Good, types.WorkReportHash(verdict.ReportHash))\n    case 0:\n        updates.Bad = append(updates.Bad, types.WorkReportHash(verdict.ReportHash))\n    case types.ValidatorsCount * 1 / 3:\n        updates.Wonky = append(updates.Wonky, types.WorkReportHash(verdict.ReportHash))\n    default:\n        return types.DisputesRecords{}, errors.New(\"bad_vote_split\")\n    }\n}"},"options":["The default branch must classify every remaining vote count as wonky, because 0.8.0 treats any split that is neither unanimous nor zero as impossible to judge","The wonky case must be folded into the default error branch, because 0.8.0 records only good and bad verdicts and dropped ψ_W from the disputes state entirely","The thresholds must be computed from |k|, the length of the validator set that the verdict's epoch index selects (κ or λ), rather than from the global ValidatorsCount constant","Nothing needs to change: |κ| is fixed at 1023 = 3C in every configuration, so ValidatorsCount is always the right length to take two-thirds and one-third of"],"answer":2,"optNotes":["V 是部分函數；把 4 票、3 票也判成 wonky 會讓惡意 verdict 清掉別人的 pending report。","ψ_W 仍是 eq. 10.1 的第三個成員，⌊|k|/3⌋ 的 wonky case 也還在，0.8.0 沒有拿掉。","0.8.0 允許 |κ| ≠ |λ|（#514），門檻必須跟著 K(a) 選到的那個集合的長度走。","§6.4 明說 validator 序列長度是 6 到 3C 之間的 3 的倍數，tiny 就是 6，並非固定 1023。"],"explanation":"eq. 10.12 的門檻是 ⌊2|k|/3⌋+1、0、⌊|k|/3⌋，其中 k = K(a) ∈ {κ, λ}，所以拿全域常數 ValidatorsCount 去取三分之二／三分之一不再正確——必須依 verdict 的 epoch index 取對應集合的長度（你們 issue #1037「support variable validator-set size (|κ| ≠ V)」就是在處理這件事；§6.4 的 𝕍 見 eq. 6.8：「The length of each sequence is always a multiple of 3 between 6 and 3C」）。程式其餘部分是對的：default → error，讓不合法的票數組合直接使區塊無效。0.8.0 在 §10 只動了 culprits 要求與 N_V/N_O 上限，三個門檻本身沒變。","trap":"同樣的 |κ| 依賴也出現在 assurances 的 2/3 門檻與 erasure shards 數。"},{"id":"ch10-rationale","ch":"10","section":"10 intro","gpRef":"§10 intro paragraphs","difficulty":1,"kind":"rationale","tags":["disputes","rationale"],"stem":"Which of the following is NOT a purpose of the disputes system as stated in the GP?","options":["Removing and banning invalid work-reports from the processing pipeline","Coordinating nodes to revert chain-extensions containing invalid work-reports and aggregating offenders for punishment in a higher-level system (e.g. slashing on a staking parachain)","Directly slashing the offending validator's balance inside the JAM state","Removing troublesome keys from the validator set where there is consensus over their malfunction"],"answer":2,"optNotes":["§10 intro 原話：removing and banning invalid work-reports from the processing pipeline。","§10 intro 同樣明列 revert chain-extensions 與 aggregating offenders for punishment。","JAM 只記 ψ_O 並在下次 key rotation 把 key 清零；扣質押是上層 staking parachain 的事。","§10 intro 原話：removing troublesome keys from the validator set，確實是列出的目的之一。"],"explanation":"§10 intro：disputes 是「an important security backstop for removing and banning invalid work-reports… as well as removing troublesome keys from the validator set… It also helps coordinate nodes to revert chain-extensions… and provides a convenient means of aggregating all offending validators for punishment in a higher-level system」。JAM 本身不做 slashing：「Should JAM be used for a public network such as Polkadot, this would imply the slashing of the offending validator's stake on the staking parachain.」JAM 只記錄 ψ_O 並在下次 key rotation 把 key 清零。","trap":"與 §13 statistics 同理：rewards/slashing 都交給 staking 子系統。"},{"id":"ch11-rho-state","ch":"11","section":"11.1 State","gpRef":"eq. 11.1 (ρ)","difficulty":2,"kind":"delta","tags":["reports","state","delta-0.8.0"],"stem":"What does each entry of ρ (the availability assignments) hold in GP 0.8.0, and why did PR #494 change it?","options":["ρ ∈ [(g ∈ 𝔾 guarantee, t ∈ N_T timeslot)?]_C — the whole guarantee, i.e. the work-report together with its 2–3 guarantor signatures, plus the slot at which it was reported","ρ ∈ [(w ∈ ℝ work-report, t ∈ N_T timeslot)?]_C — the report and its slot but no signatures, as in 0.7.2; guarantor identities are recovered from the guarantees recorded in β instead","ρ ∈ [(g ∈ 𝔾 guarantee, t ∈ N_T timeslot, f ∈ bits[|κ|])?]_C — the guarantee, the slot, and a bitfield of assurances accumulated across blocks until the super-majority is reached","ρ ∈ [(h ∈ ℍ report hash, t ∈ N_T timeslot)?]_C — only a 32-octet commitment per core, the guarantee itself being held off-chain by the guarantors until the report accumulates"],"answer":0,"optNotes":["0.8.0 (#494) 改存整個 guarantee，正是為了留住 guarantor 的身分與簽章。","(w, t) 是 0.7.2 的型別；β 每筆只有 header hash、state root、super-peak、slot 與字典，無簽章可翻。","可用性是單一區塊內的統計：eq. 11.17 只對本塊 E_A 求和，state 裡沒有跨塊累加的 bitfield。","eq. 11.17 要把 (ρ†[c]_g)_w 這份完整 report 交給 accumulation，光有 hash 拼不回 digest。"],"explanation":"eq. 11.1：ρ ∈ [(g ∈ G, t ∈ N_T)?]_C。0.7.2 存的是 (w report, t)；0.8.0 (#494) 改存整個 guarantee（含 2–3 個 guarantor 簽章），理由：「To determine the guarantors to try directly fetching the bundle from」以及「In the case of a dispute, the guarantor signatures are needed to construct a disputes extrinsic（culprits）」。t 是 report 被 guarantee 進鏈的 slot（τ′），用來算 timeout U = 5。這也改變了 C(10) 的 state serialization：↕(g, E_4(t))。","trap":"遷移點：ρ 的型別與序列化都變了（issue #1012 樹）。"},{"id":"ch11-workreport-fields","ch":"11","section":"11.1.1 Work Report","gpRef":"eq. 11.2–11.3","difficulty":2,"kind":"concept","tags":["reports"],"stem":"A work-report (eq. 11.2, of the set ℝ) is a tuple (s, c, c, a, t, l, d, g) — bold c is the refinement context, plain c the core index. Which field description is WRONG?","options":["d — the work-digests, between 1 and I = 16 of them","g — the total gas used by all refine invocations in the package","l — the segment-root lookup dictionary (work-package hash → segment root), which together with the context's prerequisites is limited to J = 8 entries","s — the availability specification (package hash, bundle length, erasure root, shard count, segment root, segment count)"],"answer":1,"optNotes":["eq. 11.2 的 d ∈ [𝔻]_{1:I}，I = 16，digest 數的上下界都對。","g 記的是 Is-Authorized 消耗的 gas；refine 的用量在每個 digest 自己的 u 欄位。","eq. 11.3 就是 |l| + |c_p| ≤ J = 8，這個共用預算的描述無誤。","eq. 11.2 的第一欄 s 就是 avspec，六個子欄位 (p, l, u, v, e, n) 也列對了。"],"explanation":"eq. 11.2：ℝ ≡ (s avspec, **c** refinement context, c core index, a authorizer hash, **t** authorizer trace, **l** segment-root lookup, **d** ∈ [𝔻]_{1:I} digests, g authgasused)——report 層級與 digest 層級各有自己的 gas 欄位，命名相近但語意不同，是這章最容易記混的地方。eq. 11.3：|l| + |c_p（prerequisites）| ≤ J = 8，兩者共用同一個 J 預算。","trap":"report 層級的 g = auth gas；digest 層級的 u = refine gas；digest 的 g = accumulate gas limit。"},{"id":"ch11-refinement-context","ch":"11","section":"11.1.2 Refinement Context","gpRef":"eq. 11.4","difficulty":2,"kind":"delta","tags":["reports","delta-0.8.0"],"stem":"Which fields does the refinement context (eq. 11.4, of the set ℂ) contain in GP 0.8.0 (PR #526)?","options":["Anchor: header hash a, posterior state root s, accumulation-output-log super-peak b; lookup-anchor: header hash l, timeslot t; prerequisites p (a set of package hashes) — 6 fields, unchanged from 0.7.2","Anchor: header hash a, timeslot n, posterior state root s, accumulation-output-log super-peak b; lookup-anchor: header hash l, timeslot t, posterior state root r; prerequisites p (a set of package hashes) — 8 fields","Anchor: header hash a, timeslot n, prior state root s, accumulation-output-log super-peak b; lookup-anchor: header hash l, timeslot t, prior state root r; prerequisites p (a set of package hashes) — 8 fields","Anchor: header hash a, timeslot n, posterior state root s, BEEFY root b; lookup-anchor: header hash l, timeslot t, posterior state root r; core index c and prerequisites p (a set of package hashes) — 9 fields"],"answer":1,"optNotes":["(a, s, b, l, t, p) 六欄是 0.7.2 的型別；少了 n，eq. 11.36 就沒有 x_n = y_t 這一項可比。","0.8.0 #526 補上的正是 anchor 的 timeslot n 與 lookup anchor 的 posterior state root r，共八欄。","兩個 root 都是 posterior：eq. 11.36 比 β† 那筆的 state root，eq. 11.38 比子塊 header 的 H_R。","b 是 accumulation-output super-peak（BEEFY root 是舊名），而 core index 是 w_c、不在 ℂ 裡。"],"explanation":"eq. 11.4（0.8.0）：ℂ ≡ (a anchor hash, n anchor slot, s anchor posterior state root, b anchor accumulation-output super-peak, l lookup-anchor hash, t lookup-anchor slot, r lookup-anchor posterior state root, p prerequisites)。#526「Expose lookup anchor posterior root and anchor slot in refinement context」新增了 anchor 的 timeslot n 與 lookup anchor 的 posterior state root r。驗證：anchor 四元組要匹配 β† 的某筆（eq. 11.36：hash、state root、super-peak b、timeslot）；lookup anchor 的三元組要在 ancestors A 裡找到（eq. 11.38：h_T = t、H(h) = l、且其子塊 h′ 的 H_R = r）。你們 issue #1022 提到「8-field RefineContext」。","trap":"b 是 β 的 accumulation-output super-peak（Keccak MMR），不是 BEEFY root 這個舊名。"},{"id":"ch11-avspec","ch":"11","section":"11.1.3 Availability","gpRef":"eq. 11.5, 11.31","difficulty":2,"kind":"concept","tags":["reports","availability"],"stem":"The availability specification (eq. 11.5) is s ≡ (p, l, u, v, e, n). What do u, v and e denote, and what constraint does eq. 11.31 place on v?","options":["u = erasure root, the Merkle root over the v chunks that erasure-code the bundle plus exported segments; v = the erasure-chunk count, which eq. 11.31 fixes at 1023 in every configuration; e = segment root, a constant-depth tree over the exported segment hashes; n = the segment count","u = segment root over the exported segment hashes; v = the number of work-items in the package, which eq. 11.31 forces to be at most I = 16; e = erasure root over the coded chunks; n = the number of validators assuring the core","u = erasure root, the Merkle root over the v chunks that erasure-code the bundle plus exported segments; v = the erasure-chunk count, which eq. 11.31 forces to equal |κ′|; e = segment root, a constant-depth tree over the exported segment hashes; n = the segment count","u = the hash of the auditable work bundle; v = the number of guarantors credentialing the report, which eq. 11.31 forces to be 2 or 3; e = the erasure root of the bundle's extrinsics; n = the index of the core the package was built for"],"answer":2,"optNotes":["eq. 11.31 比的是 |κ′|，而 validator 數是 6 到 1023 之間 3 的倍數，寫死 1023 正是移植 bug。","u 與 e 對調了；v 也不是 work-item 數（那是 eq. 11.2 的 d ∈ [𝔻]_{1:I}），n 更不是 validator 數。","eq. 11.31 要求 (w_s)_v = |κ′|：一個 chunk 發給一個 assurer，數量必須等於 assurer 集合大小。","p 才是 package hash、l 是 bundle 長度；2–3 是 credential 長度（eq. 11.24），core index 是 w_c。"],"explanation":"eq. 11.5：s ≡ (p package hash, l bundle length, u erasure root, v ∈ 𝕍 erasure shards, e segment root, n segment count)。eq. 11.31：∀w ∈ I：(w_s)_v = |κ′|——GP 的理由是「As one chunk is distributed to each assurer, the number of chunks must equal the size of the assuring validator set」（0.8.0 因 validator 數可變而必須明確檢查）。兩個 root 分工不同：erasure root 承諾了審計所需的全部資料（bundle shard + segment shards），segment root 則讓後續 package 的 import 可驗證重建出來的 segment。","trap":"erasure shard 數 v = |κ′|（posterior）：tiny 6、full 1023。別把 v（shards）跟 n（segment count）記反。"},{"id":"ch11-work-errors","ch":"11","section":"11.1.4 Work Digest","gpRef":"eq. 11.6–11.7","difficulty":2,"kind":"concept","tags":["reports","errors"],"stem":"A work-digest's result is either a blob or a member of the error set 𝔼 = {∞, ☇, BADEXPORTS, OVERSIZE, BAD, BIG} (eq. 11.7). Which meaning is correct?","options":["∞ out-of-gas; ☇ panic; BADEXPORTS the number of exports was misreported; OVERSIZE the refine output would exceed the size limit; BAD service code unavailable at the lookup-anchor; BIG code exceeds W_C = 4,000,000","∞ out-of-gas; ☇ panic; BADEXPORTS the number of exports was misreported; OVERSIZE the refine output would exceed the size limit; BAD the code was available but exceeds W_C = 4,000,000; BIG the code was unavailable at the lookup-anchor","∞ out-of-gas; ☇ a PVM page fault; BADEXPORTS the number of imported segments was misreported; OVERSIZE the bundle would exceed W_B; BAD the authorizer rejected the package; BIG more than I = 16 work-items","∞ an infinite loop was detected by the guarantor; ☇ a host-call fault; BADEXPORTS the number of exports was misreported; OVERSIZE the refine output would exceed the size limit; BAD service code unavailable at the lookup-anchor; BIG the bundle exceeds W_B"],"answer":0,"optNotes":["六個值與 §11.1.4 逐字對應，關鍵在 BAD 是 code 不可得、BIG 是 code 存在但超過 W_C。","BAD 與 BIG 對調了：GP 是 the third… code was not available、the fourth… beyond W_C。","page fault 只是 panic 的成因之一；BADEXPORTS 針對 export 數，OVERSIZE 針對 refine 的輸出。","PVM 不做迴圈偵測（停機問題），∞ 就是 gas 耗盡；W_B 是 §14 對 bundle 的檢查，不是 digest 結果。"],"explanation":"eq. 11.7（錯誤集合是 𝔼，注意 𝕁 在 0.8.0 是 segment 的集合）與 §11.1.4：「The first two are special values concerning execution of the virtual machine, ∞ denoting an out-of-gas error and ☇ denoting an unexpected program termination（panic）. Of the remaining four, the first indicates that the number of exports made was invalidly reported, the second that the size of the digest（refinement output）would cross the acceptable limit, the third（BAD）indicates that the service's code was not available for lookup in state at the posterior state of the lookup-anchor block. The fourth（BIG）indicates that the code was available but was beyond the maximum size allowed W_C」。另外 authorizer 不接受的 package 根本進不了鏈（eq. 11.32 要求 w_a ∈ α[w_c]），不會以 error 的形式留在 digest 裡。你們 encode.go 的 WorkExecResult：0 ok、1 oog、2 panic、3 bad-exports、4 output-oversize、5 bad-code、6 code-oversize。","trap":"錯誤結果仍會被 accumulate（operand 的 r 是 error），只是沒有 output blob。"},{"id":"ch11-report-size-limit","ch":"11","section":"11.1.4 Work Digest","gpRef":"eq. 11.8","difficulty":1,"kind":"concept","tags":["reports","limits"],"stem":"What is the on-chain limit on the variable-size content of a single work-report?","options":["|authorizer trace t| + Σ over digests of |result blob| (errors count as 0) ≤ W_R = 48·2^10 = 49,152 octets","|authorizer trace t| ≤ 32 octets and each digest's result blob ≤ W_G = 4,104 octets, giving at most I = 16 blobs","Σ over digests of |result blob| alone, the authorizer trace being unbounded, ≤ W_R = 48·2^10 = 49,152 octets","|authorizer trace t| + Σ over digests of |result blob| (errors count as their encoded length) ≤ W_B = 13,791,360 octets"],"answer":0,"optNotes":["eq. 11.8 的 L 對 r ∈ 𝔼 回 0，失敗的 digest 不佔 report 空間，out-of-gas 反而「便宜」。","eq. 11.8 是單一總量上限、沒有逐項上限；W_G = 4,104 是 segment 大小，與 report 無關。","|w_t| 是加總的第一項，否則 is-authorized 的 trace 可以無限撐大區塊。","error 不按編碼長度計；而 W_B 套的是 §14 的 work-package bundle，不是 report 的 W_R。"],"explanation":"eq. 11.8：∀w ∈ R：|w_o| + Σ_{i} L(w_d[i]_r) ≤ W_R，L(r) = |r| 若 r ∈ B（成功輸出），否則 0；W_R = 48·2^10 = 49,152。GP 給的理由：「In order to ensure fair use of a block's extrinsic space」。對照 W_B（13,791,360）是 work-package **bundle**（extrinsics + imports 等）的上限（§14）——兩者管的是不同層級的東西。你們 guarantor 端的 BIG/OVERSIZE 判斷是累積前面 item 的輸出一起算。","trap":"48 KiB 是 report 級總量，且 auth trace 也算在內。"},{"id":"ch11-assurance-rules","ch":"11","section":"11.2 Package Availability Assurances","gpRef":"eq. 11.11–11.16","difficulty":2,"kind":"concept","tags":["assurances"],"stem":"Which set of rules applies to the assurances extrinsic E_A?","options":["Each assurance = (anchor a, bitfield f ∈ bits[C], validator index v, Ed25519 sig); a must equal the hash of the block being built; assurances strictly ordered by v; the signature by κ′[v]_e is over X_A ⌢ H(E(H_P, f)); a bit may be set only if ρ†[c] ≠ ∅","Each assurance = (anchor a, bitfield f ∈ bits[C], validator index v, Ed25519 sig); a must equal H_P; assurances strictly ordered by core index; the signature by κ[v]_e is over X_A ⌢ the erasure root of each assured report; a bit may be set only if ρ‡[c] ≠ ∅","Each assurance = (anchor a, bitfield f ∈ bits[C], validator index v, Ed25519 sig); a must equal H_P; assurances strictly ordered by v (so at most one per validator); the signature by κ[v]_e is over X_A ⌢ H(E(H_P, f)); a bit may be set only if ρ†[c] ≠ ∅","Each assurance = (anchor a, bitfield f ∈ bits[|κ|], validator index v, Bandersnatch sig); a must equal H_P; a validator may send several assurances so long as they stay sorted by v; the signature is over X_A ⌢ H(E(H_P, f)); a bit may be set only if ρ†[c] ≠ ∅"],"answer":2,"optNotes":["簽名當下本塊 hash 還不存在，eq. 11.12 因此綁 H_P；eq. 11.14 用的也是 prior 的 κ。","排序鍵是 assurer 的 index v；一筆 assurance 只簽整個 bitfield 一次；前提是 ρ† 而非 ρ‡。","五個條件全中，關鍵是 anchor 綁 parent hash H_P、簽名用的是 prior 的 κ[v]_e。","f ∈ bits[C] 是每個 core 一 bit、簽章是 Ed25519，而 eq. 11.13 的嚴格遞增讓每人至多一筆。"],"explanation":"eq. 11.11：E_A ∈ [(a ∈ H, f ∈ B_C, v ∈ N_{|κ|}, s ∈ E)]；11.12：a = H_P（anchor 是 parent hash，這也讓 assurance 無法被搬到另一條分叉）；11.13：依 v 嚴格遞增；11.14：s ∈ Ed25519 由 κ[v]_e 對 X_A ⌢ H(E(H_P, f)) 簽署，X_A = $jam_available；11.16：f[c] ⇒ ρ†[c] ≠ ∅。注意 signer 用的是 **prior** κ（0.6.4 起「Assurances are checked with the prior validator set」），而 11.16 的前提是 ρ†（disputes 之後、assurances 之前）——ρ‡ 要處理完這些 assurance 才算得出來，拿它當前提會變成循環定義。bit = 1 的意義是「我保證我正在為它的 availability 出力」（軟性宣告，§11.2.1 footnote）。你們的錯誤碼：BadAttestationParent、NotSortedOrUniqueAssurers、CoreNotEngaged。","trap":"bitfield 長度 = C（cores），full 是 43 bytes（341 bits），tiny 1 byte；LSB-first。"},{"id":"ch11-availability-threshold","ch":"11","section":"11.2.2 Available Reports","gpRef":"eq. 11.17–11.18","difficulty":2,"kind":"delta","tags":["assurances","delta-0.8.0","tiny"],"stem":"When does a report become available (R), and when is a pending assignment cleared from ρ‡ in GP 0.8.0?","options":["Available iff the number of assurances with bit c set is ≥ 2/3·|κ| (tiny: ≥ 4 of 6; full: ≥ 682); ρ‡[c] = ∅ if the report became available, or H_T ≥ t + U (U = 5 slots), or |κ| ≠ |κ′| (the validator-set size changed)","Available iff the number of assurances with bit c set is > 2/3·|κ| (tiny: ≥ 5 of 6; full: ≥ 683); ρ‡[c] = ∅ if the report became available, or H_T ≥ t + U with U = 10 slots, or the epoch index has changed","Available iff the number of assurances with bit c set is > 2/3·|κ| (tiny: ≥ 5 of 6; full: ≥ 683); ρ‡[c] = ∅ if the report became available, or H_T ≥ t + U (U = 5 slots), or |κ| ≠ |κ′| (the validator-set size changed)","Available iff the number of assurances with bit c set is > 1/2·|κ| (tiny: ≥ 4 of 6; full: ≥ 512); ρ‡[c] = ∅ only once the report has been accumulated, so an assignment never times out and never reacts to a change in |κ|"],"answer":2,"optNotes":["剛好 2/3 不夠：tiny 要 5 票、full 要 683 票，這裡各少了一票。","U = 5 不是 10；清除條件是 |κ| ≠ |κ′| 而非 epoch 邊界，人數沒變的換屆不清任何 pending。","eq. 11.17 是嚴格大於 2/3，而 eq. 11.18 的第三個清除條件正是 0.8.0 新增的 |κ| ≠ |κ′|。","門檻是 2/3 super-majority；等 accumulate 才清會讓湊不到票的 report 把 core 永久卡死。"],"explanation":"eq. 11.17：R ≡ [ρ†[c]_g_w | Σ_a f[c] > 2/3·|κ|]——嚴格大於 2/3（tiny 6 → >4 → ≥5；full 1023 → >682 → ≥683，即 ⌊2V/3⌋+1；ELVES 的安全假設要求 2/3+1 誠實且 live）。eq. 11.18：ρ‡[c] = ∅ 當 p = ∅ ∨ report ∈ R ∨ H_T ≥ p_t + U ∨ |κ| ≠ |κ′|，否則 p。U = C_assurancetimeoutperiod = 5。「|κ| ≠ |κ′|」是 0.8.0 新增：validator 數改變時所有 pending 都視為提早 timeout（因為 erasure shard 數與 assurer 集合都對不上了）。你們 0.7.2 的 FilterAvailableReports 只有 timeout，沒有 size-change 條件。","trap":"timeout 比較的是 H_T（本塊 slot）與 assignment 的 t（guarantee 進鏈的 slot）。"},{"id":"ch11-guarantor-assignment","ch":"11","section":"11.3 Guarantor Assignments","gpRef":"eq. 11.19–11.23","difficulty":3,"kind":"concept","tags":["guarantees","shuffle"],"stem":"How are validators assigned to cores for guaranteeing in GP 0.8.0?","options":["P(v, e, t) = R(F([⌊i/3⌋ | i ∈ N_v], e), ⌊(t mod E)/R⌋), the shuffle taking entropy e = η′_1 and the rotation period being R = 600, i.e. one rotation per epoch; M = (P(|κ′|, η′_1, τ′), Φ(κ′)) — only cores < |κ′|/3 are active","P(v, e, t) = R(F([⌊C·i/v⌋ | i ∈ N_v], e), ⌊(t mod E)/R⌋): the base sequence spreads the v validators over all C cores before the Fisher-Yates shuffle with entropy e = η′_2; M = (P(|κ′|, η′_2, τ′), Φ(κ′)) — all C = 341 cores are active","P(v, e, t) = R(F([⌊i/3⌋ | i ∈ N_v], e), ⌊(t mod E)/R⌋): the sequence [0,0,0,1,1,1,…] is Fisher-Yates shuffled with entropy e = η′_2, then rotated by the rotation index (R = 10 slots); M = (P(|κ′|, η′_2, τ′), Φ(κ′)) — only cores < |κ′|/3 are active","P(v, e, t) = R(F([⌊i/3⌋ | i ∈ N_v], e), t mod R): the shuffled sequence is rotated once per slot, so each validator's core advances by one every block, with entropy e = η′_2; M = (P(|κ′|, η′_2, τ′), Φ(κ′)) — only cores < |κ′|/3 are active"],"answer":2,"optNotes":["§11.3 明說用 η′_2 而非 η′_1；R = 10 而非 600，一個 epoch 有 E/R = 60 次 rotation。","⌊C·i/v⌋ 是 0.7.2 的寫法：|κ′| < 3C 時它會把 validator 撒到不存在的 active core 上。","base sequence ⌊i/3⌋、entropy η′_2、rotation index ⌊(t mod E)/R⌋ 三處都合 eq. 11.21。","index 是 ⌊(t mod E)/R⌋：同一 rotation 的 10 個 slot 內分配不變，eq. 11.28 才容許回溯。"],"explanation":"§11.3：C = 341 個 core 固定，但只有前 |κ′|/3 個是 active（每個 core 3 個 guarantor）。eq. 11.20：R(c, n) = [(x + n) mod (|c|/3) | x ∈ c]（rotation）；11.21：P(v, e, t) = R(F([⌊i/3⌋ | i ∈ N_v], e), ⌊(t mod E)/R⌋)，F 是附錄 F 的 Fisher-Yates shuffle；11.22：M ≡ (P(|κ′|, η′_2, τ′), Φ(κ′))——key 經 Φ 過濾，offender 會被拒（你們 BannedValidator = code 23）。用 η′_2 是為了避免 fork magnification：§11.3「to avoid the possibility of fork-magnification where uncertainty about chain state at the end of an epoch could give rise to two established forks」。11.23：M* 是上一個 rotation 的分配：若 τ′ − R 仍在同一 epoch 用 (κ′, η′_2)，否則用 (λ′, η′_3)。版本差異：0.7.2 的 base assignment 是 ⌊C·i/V⌋，0.8.0 改成 ⌊i/3⌋（因為 active cores = V/3）。","trap":"rotation period R = 10 slots；每個 epoch 600/10 = 60 次 rotation。"},{"id":"ch11-guarantee-validity","ch":"11","section":"11.4 Work Report Guarantees","gpRef":"eq. 11.24–11.29","difficulty":3,"kind":"concept","tags":["guarantees"],"stem":"Which statement about a guarantee g = (w, t, a) in E_G is correct?","options":["a has exactly 3 (validator index, Ed25519 sig) pairs ordered by index; every signer must be assigned to core w_c under M when t is in the current rotation and under M* otherwise; t must equal τ′; each signature is over the encoded report E(w) itself; w_c < |κ′|/3","a has 2 or 3 (validator index, Ed25519 sig) pairs ordered by index; every signer must be assigned to core w_c under M when t is in the current rotation and under M* otherwise; R·(⌊τ′/R⌋ − 1) ≤ t ≤ τ′; each signature is over X_G ⌢ H(E(w)); w_c < |κ′|/3","a has 2 or 3 (validator index, Ed25519 sig) pairs ordered by index; every signer must be assigned to core w_c under M* when t is in the current rotation and under M otherwise; R·(⌊τ′/R⌋ − 1) ≤ t ≤ τ′; each signature is over X_G ⌢ H(E(w)); w_c < C/3","a has 2 or 3 (validator index, Ed25519 sig) pairs ordered by index; signers may be any members of κ′ ∪ λ′ whatever core they are assigned to; R·(⌊τ′/R⌋ − 1) ≤ t ≤ τ′; each signature is over X_G ⌢ H(E(w)); any core index below C = 341 may be used"],"answer":1,"optNotes":["credential 型別是 [(index, sig)]_{2:3}，2 個就成立；t 可早於 τ′；訊息要先 hash 再冠 context。","eq. 11.28 的五個條件全中：c[v] = w_c、w_c < |κ′|/3、簽 X_G ⌢ H(E(w))、t 可回溯一個 rotation。","M 與 M* 對調了：t 落在當前 rotation 用 M；且 C/3 ≈ 113 不是任何 config 的 active core 數。","eq. 11.28 要求 c[v] = w_c，簽署者必須正好被指派到這個 core；active core 上限是 |κ′|/3。"],"explanation":"eq. 11.24：G ≡ (w ∈ R, t ∈ N_T, a ∈ [(N, E)]_{2:3})；11.25–11.26：E_G ∈ [G]_{:C}，依 core 排序且唯一；11.27：credential 依 validator index 排序；11.28：∀(v, s) ∈ a：v < |k| ∧ c[v] = w_c < |κ′|/3、s ∈ Ed25519_{k[v]_e}(X_G ⌢ H(w))、R(⌊τ′/R⌋ − 1) ≤ t ≤ τ′；(c, k) = M 當 ⌊τ′/R⌋ = ⌊t/R⌋，否則 M*。GP：「Use of an inactive core is not permitted even if a timeslot in the previous rotation is used」。訊息先 Blake2b 再冠上 context string X_G，是為了避免同一段位元組在別的協定情境下被重放。簽署者的 Ed25519 key 會進入 reporters 集合 R（給 π 統計）。","trap":"t 是 guarantee 的 slot，可比 τ′ 早最多一個 rotation；ρ′ 的 timestamp 卻是 τ′（eq. 11.46）。"},{"id":"ch11-report-checks-state","ch":"11","section":"11.4 Work Report Guarantees","gpRef":"eq. 11.31–11.33","difficulty":2,"kind":"concept","tags":["guarantees","gas"],"stem":"Which on-chain checks apply to each incoming report w before it is placed in ρ′?","options":["ρ[w_c] = ∅ (core free in the prior state); w_a ∈ α′[w_c] (authorizer in the POSTERIOR pool); Σ digest accumulate-gas ≤ G_T = 3,500,000,000 and each digest's gas ≥ δ[d_s]_g; the erasure-chunk count equals |κ′|","ρ‡[w_c] = ∅ (core free after disputes and assurances); w_a ∈ α[w_c] (authorizer in the PRIOR pool); Σ digest accumulate-gas ≤ G_A = 10,000,000 and each digest's gas ≥ δ[d_s]_g; the erasure-chunk count equals |κ′|","ρ‡[w_c] = ∅ and the core must additionally have stayed free for U = 5 slots; w_a ∈ α[w_c]; Σ digest accumulate-gas ≤ G_A = 10,000,000 with no per-service floor; the erasure-chunk count equals |κ′|","ρ‡[w_c] = ∅ (core free after disputes and assurances); w_a ∈ α[w_c]; Σ digest refine-gas used ≤ G_R = 5,000,000,000 and each digest's gas ≥ δ[d_s]_g; the erasure-chunk count equals |κ| in the prior state"],"answer":1,"optNotes":["用 prior ρ 會擋掉本塊剛騰出的 core；α′ 要 accumulation 之後才存在；G_T 是整塊的總預算。","eq. 11.32 檢查的是 ρ‡，所以同一塊裡剛騰出的 core 可以馬上再被用。","eq. 11.32 只要求 ρ‡[r_c] = ∅、沒有「空滿 U 個 slot」；eq. 11.33 也明確有 d_g ≥ δ[d_s]_g。","eq. 11.33 管的是 accumulate gas 而不是 refine 的 G_R；eq. 11.31 比的也是 posterior 的 |κ′|。"],"explanation":"eq. 11.31：∀r ∈ I：(r_s)_v = |κ′|（erasure chunk 數 = posterior 的 validator 數，因為 chunk 是發給下一組 assurer 的）；11.32：∀r ∈ I：ρ‡[r_c] = ∅ ∧ r_a ∈ α[r_c]——core 空不空要等 disputes 清完（ρ†）、assurances 與 timeout 收完（ρ‡）才知道，而 authorizer 只能比 **prior** 的 α；11.33：Σ_{d ∈ r_d} d_g ≤ G_A（10M，每個 report 的 accumulate gas 上限）∧ ∀d：d_g ≥ δ[d_s]_g。對照另外兩個容易混的預算：G_T = 3.5·10^9 是**整塊** accumulation 的總預算，G_R = 5·10^9 是單一 work-package refine 的預算（§14，鏈下判定）。","trap":"α（prior）用於檢查，α′ 在 accumulate 之後才算。"},{"id":"ch11-contextual-validity","ch":"11","section":"11.4.1 Contextual Validity of Reports","gpRef":"eq. 11.35–11.45","difficulty":3,"kind":"concept","tags":["guarantees","context"],"stem":"Which of the following is NOT one of the contextual validity requirements for reports in E_G?","options":["Every prerequisite and every segment-root-lookup key must appear in this extrinsic or in β's reported sets, and the looked-up segment roots must match those records","The anchor's (a, n, s, b) must match an entry of β†; the lookup-anchor time must be ≥ H_T − L, and the lookup-anchor header must be found in the ancestor set A","Every digest's service must have been accumulated at least once within the last epoch E, and a service left idle for longer must be re-registered before it may be reported again","No two reports in the extrinsic share a work-package hash, and no package hash may appear in β's reported sets, in ξ (accumulated), in the ready queue ω or in a pending assignment of ρ"],"answer":2,"optNotes":["eq. 11.42 與 11.43–11.44 正是這一項：prereq/srlookup 的 key 與 segment root 都要對得上。","eq. 11.36（anchor 四元組對 β†）、11.37（l_t ≥ H_T − L）、11.38（header 在 A 裡）確有此三條。","GP 沒有「service 閒置過久失效」這條規則，唯一相關的是 eq. 11.45 的 d_c = δ[d_s]_c。","eq. 11.35 加 11.39–11.41 就是這一項：不重複，且不在 β、ξ、ω、ρ 任何一段 pipeline 裡。"],"explanation":"這題考的是 §11.4.1 的完整清單：eq. 11.35（同一塊不得有兩份同 package 的 report）、11.36–11.38（anchor 四元組對 β†、lookup anchor 的時間下限與祖先集合 A）、11.39–11.41（package hash 不得出現在 β 的 reported 集合、ξ、ready queue ω 或任何 pending 的 ρ）、11.42–11.44（prerequisites 與 srlookup 的 key 與 segment root）、11.45（d_c = δ[d_s]_c）。service 只會因 eject 而消失（§9），report 是否合法完全不看該 service 上次 accumulate 的時間。§11.4.1 附註：這些檢查刻意允許表面上的 dependency loop，因為 accumulation 端的 Q 函數永遠不會 accumulate 它們。","trap":"面試官可能要求你列舉「所有」contextual checks——建議背下 anchor / lookup-anchor / no-dup / prereq / srlookup / code-hash 六類。"},{"id":"ch11-rho-prime","ch":"11","section":"11.5 Transitioning for Reports","gpRef":"eq. 11.46","difficulty":1,"kind":"concept","tags":["guarantees","state"],"stem":"After processing E_G, what does ρ′[c] hold for a core that received a new guarantee g?","options":["(w, τ′) — only the work-report, the guarantor credential being discarded once it has been verified","(H(E(w)), τ′) — the report hash paired with the current block's timeslot, the guarantee moving into β","(g, g_t) — the whole guarantee paired with the guarantee's own slot t, which may lie a rotation earlier","(g, τ′) — the whole guarantee paired with the current block's timeslot τ′ as its assignment time"],"answer":3,"optNotes":["0.8.0 (#494) 的 ρ 型別就是 (g, t)：簽章要留著抓 bundle、以及在 dispute 時構造 culprits。","β 每筆從不存 guarantee（eq. 7.2）；而 eq. 11.17 之後要交出整份 report，只有 hash 不夠。","g_t 可比 τ′ 早一整個 rotation（R = 10），一進鏈就超過 U = 5，下一塊立刻被清掉。","eq. 11.46 存的時間戳是 τ′（本塊 slot），timeout 因此從進鏈那一刻起算。"],"explanation":"eq. 11.46：ρ′[c] ≡ (g, t: τ′) 當 ∃g ∈ E_G：(g_w)_c = c，否則 ρ‡[c]。§11.5 附註：對 c ≥ |κ′|/3 的 core，ρ′[c] 永遠是 ∅，保證待審計的 report 數不會超過 active validator 能負擔的量。你們 code-map 3.7.6 特別標了這個坑：「the assignment timestamp is τ′, not the guarantee's slot t」——它直接決定 eq. 11.18 的 timeout（H_T ≥ t + U）從哪一刻開始算。","trap":""},{"id":"ch11-code-availability","ch":"11","section":"11.2.2 Available Reports","gpRef":"eq. 11.17 — internal/extrinsic/assurance_controller.go","difficulty":2,"kind":"code","tags":["assurances","code","delta-0.8.0"],"stem":"The team's availability check uses `totalAvailable[i] >= types.ValidatorsSuperMajority`. Which statement is accurate?","code":{"lang":"go","caption":"internal/extrinsic/assurance_controller.go (UpdateNewlyAvailableWorkReports)","src":"for i := 0; i < types.CoresCount; i++ {\n    // If the votes for this core are greater than the available number, add the work report\n    if totalAvailable[i] >= types.ValidatorsSuperMajority {\n        if rhoDagger[i] == nil {\n            continue\n        }\n        availableWorkReports = append(availableWorkReports, rhoDagger[i].Report)\n    }\n}"},"options":["It matches the GP's strict '> 2/3·|κ|' exactly when ValidatorsSuperMajority = ⌊2|κ|/3⌋ + 1 is derived from the live size of κ — 5 of 6 in tiny, 683 of 1023 in full — rather than from a compile-time constant","It is wrong: eq. 11.17 asks only for ≥ 2/3·|κ|, so 4 of 6 assurances suffice in tiny and 682 of 1023 in full; the comparison should be against ⌈2|κ|/3⌉ instead of a super-majority constant","It is wrong: eq. 11.17 counts, per core, the assurers that set that core's bit, whereas the loop must first count the distinct validators appearing anywhere in E_A and compare that with the super-majority","It is wrong: a core whose rhoDagger entry is nil must still contribute its report, because eq. 11.18 only empties ρ‡ after the availability count for the block has already been taken"],"answer":0,"optNotes":["> 2V/3 對整數等價於 ≥ ⌊2V/3⌋+1，所以只要該常數隨 |κ| 變動，這個比較就是對的。","eq. 11.17 寫的是嚴格大於，⌈2·6/3⌉ = 4 會少算一票，平手局面不該讓 report 變成可用。","eq. 11.17 的 Σ 是逐 core 對 a_f[c] 求和；混著數會把只 assure 了別的 core 的人算進來。","那個 core 根本沒有 report 可送；ρ‡ 是 eq. 11.18 的輸出，不是計票當下的狀態。"],"explanation":"eq. 11.17：Σ_a a_f[c] > (2/3)|κ|。對整數而言 > 2V/3 ⇔ ≥ ⌊2V/3⌋ + 1：V = 6 → > 4 → ≥ 5；V = 1023 → > 682 → ≥ 683。所以 `>= ValidatorsSuperMajority` 這個寫法本身是對的，真正的風險在該常數必須等於 ⌊2|κ|/3⌋+1 且隨 |κ| 變動（0.8.0 起 validator 數可變），不能是編譯期寫死的數字。另外 `rhoDagger[i] == nil` 的情況其實已被 eq. 11.16（bit 只能在有 pending report 的 core 上設）擋掉，這裡是防禦性檢查。","trap":"tiny 5/6、full 683/1023；同一個 super-majority 常數也用在 verdict 的 good 門檻。"},{"id":"ch12-history-queue-state","ch":"12","section":"12.1 History and Queuing","gpRef":"eq. 12.1–12.3","difficulty":2,"kind":"concept","tags":["accumulation","state"],"stem":"What are ξ (accumulated) and ω (ready) and how big are they?","options":["ξ ∈ [{H}]_E — one set of accumulated work-package hashes per slot for the last E = 600 slots (an epoch of history); ω ∈ [[(ℝ, {H})]]_E — per slot, the reports made available in that slot that still have unfulfilled dependencies, each paired with its outstanding dependency set","ξ ∈ [{H}]_C — one set of accumulated work-package hashes per core, so C = 341 sets; ω ∈ [[(ℝ, {H})]]_C — one queue per core holding that core's reports which still have unfulfilled dependencies, each paired with its outstanding dependency set","ξ ∈ [{H}]_E — one set of accumulated WORK-REPORT hashes per slot for the last E = 600 slots (an epoch of history); ω ∈ [[(ℝ, {H})]]_E — per slot, every report that became available in that slot, whether or not its dependencies are met, each paired with the full dependency set it originally declared","ξ ∈ {H} — one flat set holding every work-package hash ever accumulated, never pruned; ω ∈ [[(𝕎, {H})]]_E — per slot, the work-ITEMS made available in that slot that still have unfulfilled dependencies, each paired with its outstanding dependency set"],"answer":0,"optNotes":["eq. 12.1 與 12.3 都以 slot 索引、長度 E，ω 配的是尚未滿足的 dependency 集合。","ξ 與 ω 都以 slot 索引、長度都是 E = 600；App. D 的 C(14) 也是照 slot 逐格序列化。","P(r) 取的是 avspec 的 work-package hash；eq. 12.4 只把有依賴者放進 R^Q，配的也是修剪後剩下的依賴。","ξ 是長度 E 的序列、歷史只留一個 epoch；ω 裝的是 work-report ℝ，𝕎 是 §14.3 的 work-item。"],"explanation":"eq. 12.1：ξ ∈ [{H}]_E（每個 slot 一個集合，共 E 個），ξ_∪ 是聯集；12.3：ω ∈ [[(R, {H})]]_E——ready（已 available 但尚未 accumulate）的 report 與其**未滿足的** dependency（package hash 集合）。兩者都是長度 E 的環狀緩衝：ξ′[E−1] 放本塊剛 accumulate 的 hash 並左移；ω′[m]（m = H_T mod E）放本塊新的 R^Q，跳過的 slot 清空。這就是 test vectors 中 accumulate/ 的 enqueue/unlock/ring-wrap 案例。","trap":"ξ 存的是 package hash 不是 report hash；ready 的依賴在每次 accumulate 後用 E() 修剪。"},{"id":"ch12-W-partition","ch":"12","section":"12.1 History and Queuing","gpRef":"eq. 12.4–12.12 (W!, W^Q, E, Q, W*)","difficulty":3,"kind":"concept","tags":["accumulation","dependencies"],"stem":"How is the sequence of accumulatable reports R* built from the newly available reports R?","options":["R! = reports with no prerequisites, whatever their segment-root lookup holds, accumulated immediately; R^Q = the rest, each paired with its prerequisite set alone, pruned by ξ[E−1] (only the packages accumulated in the previous slot); R* = R! ⌢ Q(E(ω[m..] ⌢ ω[..m] ⌢ R^Q, P(R!))) with Q extracting reports whose dependency set is empty","R! = reports with no prerequisites and empty segment-root lookup, accumulated immediately; R^Q = the rest, each paired with its dependency set (prerequisites ∪ keys of srlookup) pruned by ξ_∪; R* = R! ⌢ Q(E(ω[m..] ⌢ ω[..m] ⌢ R^Q, P(R!))), where Q makes a single pass over the queue and any report still holding a dependency afterwards makes the block invalid","R! = reports with no prerequisites and empty segment-root lookup, accumulated immediately; R^Q = the rest, each paired with its dependency set (prerequisites ∪ keys of srlookup) pruned by ξ_∪; R* = R! ⌢ Q(E(ω[m..] ⌢ ω[..m] ⌢ R^Q, P(R!))) where Q repeatedly extracts reports whose dependency set is empty and E removes satisfied dependencies","R! = reports with no prerequisites and empty segment-root lookup, accumulated immediately; R^Q = the rest, each paired with its dependency set (prerequisites ∪ keys of srlookup) pruned by ξ_∪; R* = R! ⌢ Q(E(ω[..m] ⌢ ω[m..] ⌢ R^Q, P(R!))), i.e. the ready queue is read from the current slot m forwards so that the freshest queued reports get their turn first"],"answer":2,"optNotes":["eq. 12.4 要求 |x_p| = 0 且 r_l = ∅ 同時成立；D(r) 含 keys(r_l)，修剪用 ξ_∪ 而非只有最後一格。","Q 是遞迴定義（解開一批就再用 E 扣一次依賴）；解不開的 report 只是續留 ω 等過期，區塊仍有效。","三處都對：R^Q 先用 ξ_∪ 修剪、ready queue 從最舊的 slot m 起繞一圈、Q 遞迴解到解不動為止。","方向反了：m = H_T mod E 正是本塊要覆寫的最舊一格，ω[m..] 起頭才是由舊到新。"],"explanation":"eq. 12.4：R! = [r | r ∈ R, |x_p| = 0 ∧ r_l = ∅]；12.5：R^Q = E([D(r) | r ∈ R, 有依賴], ξ_∪)，D(r) = (r, x_p ∪ keys(r_l))；12.7：E(r, x) 移除 package hash ∈ x 的項目並從各項依賴集合扣掉 x；12.8：Q(r) = g ⌢ Q(E(r, P(g)))，g = 依賴集合為空者，直到沒有為止；12.11–12.12：R* = R! ⌢ Q(q)，q = E(ω[m..] ⌢ ω[..m] ⌢ R^Q, P(R!))，m = H_T mod E——ready queue 從**最舊**（slot m 起繞一圈）讀起。有無法解的依賴不會讓區塊無效，只是那個 report 留在 ω 直到過期（一個 epoch 後被覆蓋）。","trap":"E 的參數 x 在第一次是 P(R!)（本塊立即 accumulate 者的 hash），不是整個 ξ（R^Q 已先用 ξ_∪ 修剪過）。"},{"id":"ch12-gas-budget","ch":"12","section":"12.3 Final State Integration","gpRef":"eq. 12.24 (g) & 12.17 (Δ+)","difficulty":3,"kind":"delta","tags":["accumulation","gas","delta-0.8.0"],"stem":"What total gas budget g is handed to the outer accumulation Δ+ in a block, and how does Δ+ choose how many reports to accumulate in a round?","options":["g = max(G_T, G_A·C + Σ_{x∈values(χ_Z)} x); Δ+ picks the largest prefix i of the reports such that Σ digest gas-limits of those i reports + Σ gas of pending deferred transfers + Σ free-accumulation gas ≤ g, runs Δ* on them, then recurses with g* = g + Σ(new transfers' gas) − Σ gas actually used and an empty free-accumulation map","g = G_R = 5·10^9, the per-package refine allowance reused as the block's accumulation budget; Δ+ accumulates exactly one report per round rather than a prefix, subtracting that report's actual gas use from g each time, and halts as soon as a service's Accumulate panics, discarding the remaining reports and any transfers they produced","g = G_A·C = 3.41·10^9 exactly, with the always-accumulate allowances χ_Z drawn out of that same total; Δ+ picks the largest prefix i of the reports such that Σ digest gas-limits + Σ gas of pending deferred transfers ≤ g, runs Δ* on them, then recurses with g* = g − Σ gas actually used and the same free-accumulation map","g = max(G_T, G_A·C + Σ_{x∈values(χ_Z)} x); Δ+ picks the largest prefix i of the reports such that Σ digest gas-limits of those i reports alone ≤ g — transfer gas and free-accumulation gas play no part in the test — runs Δ* on them, then recurses with g* = g − Σ gas actually used, carrying the same free-accumulation map into every round"],"answer":0,"optNotes":["eq. 12.17 的預算測試（#500 之後）含 t_g 與 free allowance，遞迴時 f 傳空、g* 再加回 t* 的 gas。","G_R 是單一 package 的 refine 上限；Δ+ 取的是最大前綴，Ψ_A 內 panic 只讓該 service 的 output 消失。","eq. 12.24 是 max(G_T, G_A·C + Σ χ_Z)，χ_Z 是外加的；何況 3.41·10^9 < G_T，取 max 後就是 G_T。","描述的是 0.7.2 的行為：#500 之後 t_g 與 f 才納入判斷，eq. 12.17 遞迴也明確傳 ∅ 進去。"],"explanation":"eq. 12.24：g = max(G_T, G_A·C + Σ χ_Z gas)，G_T = 3.5·10^9、G_A = 10^7、C = 341。eq. 12.17：i = max i：Σ_{r ∈ r[..i], d ∈ r_d} d_g + Σ_{t ∈ t} t_g + Σ_{x ∈ values(f)} x ≤ g（0.8.0 #500「Account for gas reserved by transfer and always acc items」——預算現在把 transfer gas 與 free allowance 也算進去）；n = i + |t| + |f|；(e*, t*, b*, u*) = Δ*(e, t, r[..i], f)；遞迴 Δ+(g*, t*, r[i..], e*, {})，g* = g + Σ t* gas − Σ u* used。為什麼是這種「先估後扣」設計：§12.2 兩個相斥因素——實際 gas 只有執行後才知道（sequential），但同一 service 的 items 想合併成一次 PVM 呼叫以攤銷啟動成本（parallel）。","trap":"遞迴時 f（always-accumulate）傳空——特權 service 只在第一輪免費 accumulate。"},{"id":"ch12-delta-star","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.18–12.19 (Δ*, R)","difficulty":3,"kind":"concept","tags":["accumulation","privileges"],"stem":"In Δ* (parallel accumulation), which services are accumulated and how are the privileged indices (assigners, delegator, registrar) resolved when both the manager and the privileged service itself change them?","options":["s = {services with a digest} ∪ keys(f) ∪ {destinations of deferred transfers}; each is accumulated exactly once via Δ1; χ′_M and χ′_Z are taken from the registrar's output; the conflict resolver is R(o, a, b) = a when a = o, else b","s = {services with a digest} ∪ keys(f) ∪ {destinations of deferred transfers}; each is accumulated exactly once via Δ1; the manager's output alone decides χ′_M and χ′_Z; for assigners, delegator and registrar the conflict resolver is R(o, a, b) = b when a = o, else a","s = {services with a digest} only, so a service that merely receives a deferred transfer or enjoys free accumulation is skipped; each is accumulated exactly once via Δ1; the manager's output alone decides χ′_M and χ′_Z, and assigners, delegator and registrar are changeable only by the manager","s = every service in keys(δ); each is accumulated once per work-digest rather than once per round, so a service holding three digests runs Δ1 three times; the manager's output alone decides χ′_M and χ′_Z; a privilege changed by both the manager and its current holder in the same round makes the block invalid"],"answer":1,"optNotes":["這兩項直接取 manager 的輸出；顛倒後的 R 在 manager 沒動時回傳 prior 值 o，等於忽略持有者。","eq. 12.18 的三個聯集與 eq. 12.19 的 R 都對：manager 沒動時（a = o）才採用持有者自己的 b。","s 還要聯集 K(f) 與 transfer 收件人 t_d；§12.2 的 R 存在正是要讓特權被 owned、由持有者轉走。","只有 s 之內的 service 會跑；Δ1 把同一 service 的所有 digest 併成一次 Ψ_A 呼叫；衝突交給 R 解。"],"explanation":"eq. 12.18：s = {d_s | r ∈ r, d ∈ r_d} ∪ K(f) ∪ {t_d | t ∈ t}；每個 s 呼叫 Δ1(e, t, r, f, s) 一次。(χ′_M, χ′_Z) 直接取 manager m 的輸出 e*；∀c：χ′_A[c] = R(χ_A[c], e*_A[c], (Δ1(χ_A[c]) 輸出)_A[c])；同理 χ′_V、χ′_R；eq. 12.19：R(o, a, b) = b 若 a = o 否則 a。§12.2：「This allows privileges to be 'owned' and facilitates the removal of the manager service」——assigner 可以自己把 assign 權轉走（owned privileges，0.7.1 #475），但 manager 的變更優先。ι′ 來自 delegator 的輸出，φ′[c] 來自 assigner c 的輸出。新建帳戶 n 與刪除帳戶 m 合併進 δ；若兩個 service 產生同一個新 index（理論上不會）則區塊無效。","trap":"每個 service 一輪只 accumulate 一次，其 inputs = 給它的 transfers ⌢ 它的 operand tuples（eq. 12.23）。"},{"id":"ch12-delta-one-gas","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.23 (Δ1)","difficulty":2,"kind":"concept","tags":["accumulation","gas"],"stem":"For a single service s, Δ1 invokes Ψ_A(e, τ′, s, g, i^T ⌢ i^U). How is the gas g computed and what are the inputs?","options":["g = δ[s]_g, the service's own minaccgas, capped at G_A = 10^7; i^T = the transfers to s (in order), i^U = one operand tuple per work-REPORT carrying at least one digest of s, not one per digest","g = f[s] (free allowance, or 0) + Σ gas of deferred transfers destined to s + Σ accumulate gas-limits of s's digests across the round's reports; i^T = the transfers to s (in order), i^U = one operand tuple per digest of s (report order)","g = f[s] (free allowance, or 0) + Σ gas of deferred transfers destined to s, the digests' accumulate gas-limits NOT being added because Δ+ already charged them against the block budget; i^T = the transfers to s (in order), i^U = one operand tuple per digest of s (report order)","g = f[s] (free allowance, or 0) + Σ gas of deferred transfers destined to s + Σ accumulate gas-limits of s's digests across the round's reports; the argument sequence is i^U ⌢ i^T, this round's operand tuples coming ahead of any transfer carried over from the previous round"],"answer":1,"optNotes":["a_g 是 §11 驗 report 時 d_g 的下限而非 accumulate 的額度；i^U 也是每個 digest 一筆而非每份 report。","eq. 12.23 的 g 是 f[s]、transfer gas 與 d_g 三項相加、缺一不可，引數順序也明寫 i^T ⌢ i^U。","Δ+ 的預算測試只決定這一輪吃幾個 report；交給 Ψ_A 的額度仍要把該 service 所有 d_g 加總進去。","順序反了：eq. 12.23 明寫 Ψ_A(…, i^T ⌢ i^U)，0.7.1 併掉 Ψ_T 後就靠位置區分兩類 input。"],"explanation":"eq. 12.23：g = f[s]（若無則 0）+ Σ_{t: t_d = s} t_g + Σ_{d: d_s = s} d_g；i^T = [t | t ∈ t, t_d = s]；i^U = [(r_d result, g_d gas limit, y payload hash, o auth trace, e segroot, h package hash, a authorizer) | r ∈ r, d ∈ r_d, d_s = s]，產生式同時走 r ⊰ r 與 d ⊰ r_d，所以同一 report 裡屬於 s 的兩個 digest 會給出兩筆。0.7.1 起 on_transfer 被併入 accumulate：transfer 以 input 形式（在 operand 之前）交給同一次 Ψ_A（你們 deferred_transfers.go 的註解「v0.7.1 has removed deferred transfers & Ψ_T」）。operand tuple 定義在 eq. 12.13：(h, e, a, y, g, o, r)。","trap":"digest 的 g 是 accumulate gas limit（guarantor 從 work-item 帶進來，鏈上檢查 ≥ a_g）。"},{"id":"ch12-deferred-transfer","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.14 & B.transfer","difficulty":1,"kind":"concept","tags":["accumulation","transfers"],"stem":"A deferred transfer T = (s, d, a, m, g). What are the fields, and when is the balance moved?","options":["s the sender's Ed25519 public key, d the destination service, a the amount, m a 32-octet memo hash, g the gas price the sender is willing to pay; the sender's balance is deducted when `transfer` is called and credited to the destination inside the very same Δ* round","s source service, d destination, a amount, m memo of W_T = 128 octets, g gas limit for the recipient's handling; the sender is debited when `transfer` is called, and the destination is credited later in the same round by a separate on-transfer entry point Ψ_T that Δ* invokes once the digests are done","s source service, d destination, a amount, m memo of W_T = 128 octets, g gas limit for the recipient's handling; the sender's balance is deducted when `transfer` is called, and the amount is credited to the destination when it is accumulated in a later round","s source service, d the destination CORE index, a amount, m memo of W_T = 128 octets, g gas limit for the recipient's handling; nothing leaves the sender until the destination is actually accumulated, so a transfer aimed at a service deleted during the same round costs the sender nothing"],"answer":2,"optNotes":["eq. 12.14 的 s、d 都是 service index，m 是 128 octet 的 memo 本體，g 是 gas limit 不是價格。","0.7.1 就把 Ψ_T 併進 accumulate，0.8.0 只有 Ψ_A，而且交付是在下一輪而非同一輪。","五個欄位全對；Ω_T 成功時當場從 sender 扣款，收方要到下一輪 Δ+ 以 input 形式收到才入帳。","d ∈ N_S 是 service 不是 core；Ω_T 成功時已把 balance 設為 b − a，收方消失錢也回不來。"],"explanation":"eq. 12.14：T ≡ (s ∈ N_S, d ∈ N_S, a ∈ N_B, m ∈ B_{W_T}, g ∈ N_G)，W_T = C_memosize = 128。B 附錄 `transfer`（index 21）：呼叫時檢查 d 存在（否則 WHO）、l ≥ δ[d]_m（否則 LOW）、扣款後餘額 ≥ 自己的 threshold（否則 CASH），成功則立刻從 sender 扣除 a 並把 T 追加到 context 的 transfers 序列。接收方在**下一輪** Δ+ 才以 input 形式收到（Δ+ 的 t* 餵給遞迴呼叫），此時餘額才加上去；轉給不存在（或本輪被刪除）的 service 會被丟棄——但 sender 早就被扣了。","trap":"memo 固定 128 bytes；g 是給接收方處理這筆 transfer 的 gas，會計入下一輪預算。"},{"id":"ch12-outputs","ch":"12","section":"12.3 Final State Integration","gpRef":"eq. 12.24–12.33 (δ† → δ‡ → δ′)","difficulty":2,"kind":"concept","tags":["accumulation","state"],"stem":"After Δ+ returns (n, e′, b, u, t), which statements about the final integration are correct?","options":["θ′ = the (service, hash) pairs in b (services that yielded a 32-byte hash); (δ†, ι′, φ′, χ′) come from e′; the accumulation statistics record per service (N items accumulated, G gas used), the transfer count having been dropped; δ‡ marks a_a = τ′ for every service in keys(δ†); ξ′[E−1] = P(R*[..n])","θ′ = H(E(δ†)), a single commitment to the whole posterior service state; (δ†, ι′, φ′, χ′) come from e′; the accumulation statistics record per service (N items accumulated, T transfers processed, G gas used); δ‡ marks a_a = τ′ for every service that appears in the statistics; ξ′[E−1] = P(R*), the whole accumulatable sequence","θ′ = the (service, hash) pairs in b (services that yielded a 32-byte hash); (δ†, ι′, φ′, χ′) come from e′; the accumulation statistics record per service (N items accumulated, T transfers processed, G gas used); δ‡ marks a_a = τ′ for every service that appears in the statistics; ξ′[E−1] = P(R*[..n]) and ω′ is emptied in full, so that no queued report ever survives a block","θ′ = the (service, hash) pairs in b (services that yielded a 32-byte hash); (δ†, ι′, φ′, χ′) come from e′; the accumulation statistics record per service (N items accumulated, T transfers processed, G gas used); δ‡ marks a_a = τ′ for every service that appears in the statistics; ξ′[E−1] = P(R*[..n])"],"answer":3,"optNotes":["0.8.0 的 S(s) 是 (N, T, G) 三元組；a_a = τ′ 只加在 keys(S) 上，沒被 accumulate 的帳戶不動。","θ′ 是 accumulation output log 不是狀態雜湊；ξ′[E−1] 只收本塊真的做完的 R*[..n]。","ω′ 是環狀更新：只有被跳過的 slot 會清空，其餘 slot 保留並同樣經過 E 修剪。","θ′ 取 b 的 (s, h) 配對、統計是三元組、a_a 只更新 keys(S)、ξ′[E−1] 只收 R*[..n]，四項全對。"],"explanation":"eq. 12.24：(n, e′, b, u, t) ≡ Δ+(g, [], R*, e, χ_Z)；θ′ ≡ [(s, h) ∈ b]（餵 §7 的 belt）；eq. 12.26：(δ†, ι′, φ′, χ′_M, χ′_A, χ′_V, χ′_R, χ′_Z) ≡ e′。eq. 12.27–12.28：accumulation statistics 記作 **S** ∈ D⟨N_S → (N, N, N_G)⟩，S(s) = (N(s) 前 n 個 report 中屬於 s 的 digest 數, T(s) 處理的 transfers 數（0.8.0 #502 加回）, G(s) gas used)，只記非 (0,0,0) 者。eq. 12.29–12.30：δ‡ = δ† 但 keys(S) 中的 service a_a = τ′。eq. 12.31–12.33：ξ′[E−1] = P(R*[..n])、其餘左移；ω′ 的 ring 更新。","trap":"a_a（last accumulation slot）只對「這塊真的 accumulate 過」的 service 更新。"},{"id":"ch12-preimage-integration","ch":"12","section":"12.4 Preimage Integration","gpRef":"eq. 12.34–12.37","difficulty":2,"kind":"concept","tags":["accumulation","preimages"],"stem":"Which rule governs the preimages extrinsic E_P and its integration into δ′?","options":["E_P ∈ [(s, d)] ordered & unique; each (s, d) must be providable in the PRIOR δ — the service exists and δ[s]_l[(H(d), |d|)] = [] (requested, not yet provided); integration happens after accumulation: δ′ = I(δ‡, E_P), setting a_l[(H(d),|d|)] = [τ′] and a_p[H(d)] = d, silently dropping any preimage that is no longer useful","E_P ∈ [(s, d)] ordered & unique; any preimage may be included whether or not the service solicited it, since I stores every pair it is handed; integration happens BEFORE accumulation, δ† = I(δ, E_P), so that a service's Accumulate can read a preimage supplied in the same block, setting a_l[(H(d),|d|)] = [τ′] and a_p[H(d)] = d","E_P ∈ [(s, d)] ordered & unique; each (s, d) must be providable in the POSTERIOR δ‡ — the service must still exist there and δ‡[s]_l[(H(d), |d|)] = [] — so a request that accumulation dropped in the same block makes the whole block invalid; integration is then δ′ = I(δ‡, E_P), setting a_l[(H(d),|d|)] = [τ′] and a_p[H(d)] = d","E_P ∈ [(s, d)] need only be free of duplicates, the ordering being unconstrained; each (s, d) must be providable in the prior δ and must additionally be signed by the service's manager; integration happens after accumulation: δ′ = I(δ‡, E_P), setting a_l[(H(d),|d|)] = [τ′] and a_p[H(d)] = d, silently dropping any preimage that is no longer useful"],"answer":0,"optNotes":["eq. 12.36 的 Y 吃 prior δ 判斷 providable，eq. 12.37 的整合作用在 δ‡，兩個 staging 都擺對了。","Y 要求 δ[s]_l[(H(d), |d|)] = []；§12.4 開頭就是 After accumulation, we must integrate…。","eq. 12.36 的 Y 明確吃 prior δ；被 forget 掉的 preimage 是 disregarded, without prejudice。","eq. 12.35 要求 ordered 且 unique，而 GP 從頭到尾沒有任何簽章條件，只看 request 是否存在。"],"explanation":"eq. 12.34–12.36：E_P ∈ [(N_S, B)]，依 (s, d) 排序且唯一，∀(s, d)：Y(δ, s, d)（providable：s ∈ keys(δ) 且 δ[s]_l[(H(d), |d|)] = []）——用 **prior** δ 檢查。eq. 12.37：δ′ = I(δ‡, E_P)——在 accumulation 之後才整合（依 §4 dependency graph 的 merge/join），因此若 accumulate 過程中 service 被刪或 request 被 forget，該 preimage「disregarded, without prejudice」。I 會把 request 設為 [τ′] 並寫入 preimage。你們的錯誤碼：preimages not sorted and unique / preimage not required。","trap":"驗證看 prior δ、整合作用於 δ‡；順序題在 fuzzer 很常出現。"},{"id":"ch12-code-outer-accumulation","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.17 — internal/accumulation/accumulation.go OuterAccumulation","difficulty":3,"kind":"code","tags":["accumulation","code","delta-0.8.0"],"stem":"This is the team's prefix selection in Δ+. Compared with GP 0.8.0 eq. 12.17, what is missing?","code":{"lang":"go","caption":"internal/accumulation/accumulation.go (OuterAccumulation, 0.7.2)","src":"gasSum := types.Gas(0)\ni := 0\n// Determine the maximal prefix of reports that fits within the gas limit\nfor idx, report := range r {\n    for _, result := range report.Results {\n        gasSum += result.AccumulateGas\n    }\n    if gasSum <= g {\n        i = idx + 1\n    } else {\n        break\n    }\n}\n// n = |t| + i + |f|\nn := len(t) + i + len(f)"},"options":["0.8.0 requires the budget test to include Σ gas of the pending deferred transfers t and Σ free-accumulation allowances f (Σ d_g + Σ t_g + Σ f ≤ g), so gasSum must start from those two sums rather than 0","The test must be applied per report rather than cumulatively: eq. 12.17 requires each individual report in r[..i] to satisfy Σ d_g ≤ G_A = 10^7, so the loop must break at the first report exceeding that per-report cap","The gas figures are the wrong ones: eq. 12.17 sums each digest's actual gas used d_u over the prefix rather than the declared limits d_g, since Δ* hands the real usage back before the budget is tested","The bound on i is wrong: eq. 12.17 takes i as a maximum over N_{|r|+1} so that i may reach |r|, whereas `i = idx + 1` inside the loop caps it at |r| − 1 and always leaves the final report for the next round"],"answer":0,"optNotes":["PR #500 把 t_g 與 always-accumulate 的 f 納入 eq. 12.17 的預算判斷，0.7.2 的 code 只加 d_g。","eq. 12.17 的測試是對整個前綴累加；單一 package 的 Σ w_a < G_A 是 §14.3 的封包合法性條件。","§12.2：實際用量只能在 Δ* 跑完後才知道；何況 digest 裡的 u 記的是 refine 用掉的 gas。","idx 最大取到 |r| − 1，i = idx + 1 因此可以等於 |r|，與 i ∈ N_{|r|+1} 完全一致。"],"explanation":"eq. 12.17（0.8.0）：i = max(N_{|r|+1})：Σ_{r ∈ r[..i], d ∈ r_d} d_g + Σ_{t ∈ t} t_g + Σ_{x ∈ values(f)} x ≤ g。PR #500「Account for gas reserved by transfer and always acc items」把 transfer gas 與 always-accumulate 的 gas 納入預算判斷（否則實際可能超出 g）。0.7.2 的 code 只加 AccumulateGas。n = |t| + i + |f| 在兩版都一樣。§12.2 也講明「Only after a work-item is accumulated can it be known if it uses less gas than the advertised limit」——實際用量只能透過 g* = g + Σ t* gas − Σ u 回饋到下一輪。","trap":"你們 issue digest 提到：eq:accseq budget now includes transfer gas + free allowances。"},{"id":"ch13-validator-stats","ch":"13","section":"13.1 Validator Activity","gpRef":"eq. 13.1–13.6","difficulty":2,"kind":"delta","tags":["statistics","delta-0.8.0"],"stem":"π ≡ (π_V, π_L, π_C, π_S). Which statement about the validator statistics is correct in GP 0.8.0?","options":["Each validator record has six counters (blocks b, tickets t, preimage count p, preimage size d, guarantees g, assurances a); assurances of this block are credited to π_V† BEFORE the epoch-rollover check; on e′ ≠ e, π_L ← π_V† and π_V resets; then b/t/p/d are credited to every validator whose signature appears in the matching extrinsic, and g to the block author H_I","Each validator record has five counters (blocks b, tickets t, preimage count p, preimage size d, guarantees g), assurances being tracked per core in π_C instead; on e′ ≠ e both π_V and π_L are zeroed so that the new epoch starts from nothing; then b/t/p/d are credited to the author H_I and g to every validator in the reporters set G","Each validator record has six counters (blocks b, tickets t, preimage count p, preimage size d, guarantees g, assurances a); assurances of this block are credited AFTER the epoch-rollover check, so on e′ ≠ e they land in the fresh π′_V instead of in π′_L; π_L then takes π_V rather than π_V†; b/t/p/d go to the author H_I and g to the reporters set G","Each validator record has six counters (blocks b, tickets t, preimage count p, preimage size d, guarantees g, assurances a); assurances of this block are credited to π_V† BEFORE the epoch-rollover check; on e′ ≠ e, π_L ← π_V† and π_V resets; then b/t/p/d are credited to the author H_I and g to every validator in the reporters set G"],"answer":3,"optNotes":["兩組規則對調了：b/t/p/d 全部只加在 H_I，g 才看 κ′[v] 是否落在 reporters set 裡。","eq. 13.2 明列六個欄位含 a；π_C 記的是每個 core 被打勾的次數；rollover 是 π_L ← π_V† 的交棒。","描述的是 0.7.2 的順序：0.8.0 邊界那塊的 assurance 會被封進 π′_L，而不是留在新的 π′_V。","0.8.0 先做 eq. 13.4（assurance）再做 13.5（rollover），六個 counter 與各自的歸屬也都對。"],"explanation":"eq. 13.1：π_V, π_L ∈ [(b, t, p, d, g, a)]，|π_V| = |κ|、|π_L| = |λ|。eq. 13.4：π_V† = π_V 但 ∀v：a += (∃a ∈ E_A: a_v = v)——用 prior κ 的索引，**先**於 rollover；eq. 13.5：e′ = e 時 (π_V‡, π′_L) = (π_V†, π_L)，否則 ([0…], π_V†)；eq. 13.6：π′_V = π_V‡ 但 b += (v = H_I)、t += |E_T|（作者）、p += |E_P|、d += Σ|d|（作者）、g += (κ′[v] ∈ R)。0.8.0 把 assurance 的計入移到 rollover 之前（0.7.2 是一起算），你們 issue digest：「assurances credited before epoch rollover in 0.8.0」。§13 開頭：JAM 不直接發獎勵，只提供資料給 staking 子系統。","trap":"每個 validator 每塊最多 +1 assurance、+1 guarantee（存在性判斷，不是數量）。"},{"id":"ch13-core-service-stats","ch":"13","section":"13.2 Cores and Services","gpRef":"eq. 13.7, 13.9–13.12","difficulty":3,"kind":"concept","tags":["statistics"],"stem":"Core statistics π_C and service statistics π_S are per-block (not per-epoch). Which description of the core statistics is correct?","options":["Per core: d (DA load) = Σ over the reports GUARANTEED this block (the set I) on that core of bundle length + W_G·⌈65·segment_count/64⌉; p (popularity) = the number of reports guaranteed on that core; i, x, z, e, u and l are summed over I as well, so every field of π′_C comes from one and the same source","Per core: d (DA load) = Σ over the reports that became AVAILABLE this block (the set R) on that core of bundle length + W_G·⌈65·segment_count/64⌉; p (popularity) = the number of assurances whose bitfield has that core set; i, x, z, e, u and l are summed over the reports GUARANTEED this block (the set I) on that core","Per core: d (DA load) = Σ over the reports that became AVAILABLE this block (the set R) on that core of bundle length + W_G·⌈65·segment_count/64⌉; p (popularity) = the number of guarantor signatures backing that core's reports; i, x, z, e and u are summed over the reports GUARANTEED this block (the set I), but l is the largest bundle length on that core rather than their sum","Per core: d (DA load) = Σ over the reports that became AVAILABLE this block (the set R) on that core of bundle length + W_G·segment_count, the paged proofs not being counted; p (popularity) = the number of assurances whose bitfield has that core set; i, x, z, e, u and l are summed over R as well, so all eight fields follow availability"],"answer":1,"optNotes":["d 的來源是 R 而非 I；p 是對 E_A 的 availability bitfield 求和（Σ_a a_f[c]），與 report 數無關。","d 對 R（本塊剛 available）求和、i/x/z/e/u/l 對 I（本塊 guaranteed）求和，兩個來源分得清楚。","p 仍然是 assurance 打勾數；L(c) 是該 core 上所有 report 的 bundle length 總和而不是最大值。","65/64 正是把每 64 個 export segment 多出的那一頁 paged proof 算進去；R(c)、L(c) 的範圍是 I。"],"explanation":"eq. 13.9–13.12：π′_C[c] = (d = D(c), p = Σ_a a_f[c], i, x, z, e from R(c), l = L(c), u refine gas)。R(c) 與 L(c) 對 **I**（本塊 E_G 進來的 report，w_c = c）求和；D(c) 對 **R**（本塊剛 available 的 report）求和：bundle length + W_G·⌈k·65/64⌉——65/64 是因為每 64 個 export segment 會多一頁 paged-proof segment（§14）。popularity = 本塊 assurance 中對該 core 打勾的數量。你們 code-map 3.9：「DA load is computed from W while imports/exports/gas/bundle-size come from w」。","trap":"兩個不同來源（guaranteed vs available）——面試容易考。"},{"id":"ch13-service-stats","ch":"13","section":"13.2 Cores and Services","gpRef":"eq. 13.8, 13.13–13.17","difficulty":2,"kind":"concept","tags":["statistics"],"stem":"Which services appear in π′_S for a block, and what does the accumulation entry hold?","options":["s = every service in keys(δ), so π′_S carries one entry per existing account in every block; the entry holds provision (count, total size) from E_P, refinement (count, gas), imports/extrinsics/exports, and accumulation = S(s) = (items N, transfers T, gas G) or (0,0,0)","s = services with a digest in this block's reports ∪ services that received a preimage in E_P ∪ keys of the accumulation statistics; the entry holds provision (count, total size) from E_P, refinement (count, gas), imports/extrinsics/exports, and accumulation = S(s) = (items N, transfers T, gas G) or (0,0,0)","s = every service touched since the start of the epoch, since π_S accumulates across an epoch and is cleared only when e′ ≠ e; the entry holds provision (count, total size) taken from the digests, refinement (count, gas), imports/extrinsics/exports, and accumulation = S(s) = (items N, transfers T, gas G) or (0,0,0)","s = the keys of the accumulation statistics only, so a service that was merely reported on or that received a preimage this block gets no entry at all; the entry holds provision (count, total size) from E_P, refinement (count, gas), imports/extrinsics/exports, and accumulation = (items N, gas G)"],"answer":1,"optNotes":["π_S 是 per-block 的活動紀錄，沒活動的 service 根本不列，不會每個帳戶每塊都有一筆。","s^R ∪ s^P ∪ keys(S) 三個來源都算進去，且 0.8.0 的 accumulation 是 (N, T, G) 三元組。","§13.2 明說 core 與 service 統計 tracked only on a per-block basis；provision 的 (1, |d|) 對 E_P 求和。","本塊被 report 或收到 preimage 但沒 accumulate 者仍要列；(N, G) 是 0.7.2 的形狀。"],"explanation":"eq. 13.13–13.17：s = s^R（reported）∪ s^P（provided）∪ keys(S)；π′_S[s] = (p provision = Σ (1, |d|) over E_P for s, r refinement = (count, gas used) over digests, i, x, z, e, a accumulation = S(s) 或 (0,0,0))。π_S 是 per-block 的，所以沒活動的 service 不會出現；跨 epoch 累積並在 e′ ≠ e 換手的是 π_V／π_L。0.7.1 拿掉 on_transfer 的統計、0.8.0 (#502) 把 processed-transfer count 加回 accumulation 三元組。","trap":"π_S 的 accumulation 是 (N, T, G) 三元組。"}],"terms":[{"sym":"σ","term":"state","zh":"整體狀態","cat":"state","gpRef":"eq. 4.4","one":"JAM 的完整狀態，拆成 17 個大致獨立的元件。","body":"σ ≡ (α, β, θ, γ, δ, η, ι, κ, λ, ρ, τ, φ, χ, ψ, π, ω, ξ)。拆成獨立元件有兩個目的：一是讓 state-transition 的依賴圖夠淺、可以平行計算（§4.2.1）；二是讓 Merklization 的 key 空間可以用單一 byte 的 chapter 前綴分區（附錄 D 的 C(i)）。σ′ 代表 posterior（本區塊處理完之後）的狀態。","rel":["σ′","C(i)","STF"]},{"sym":"α","term":"authorizer pool","zh":"授權池","cat":"state","gpRef":"eq. 8.1–8.3","one":"每個 core 目前可用的 authorizer hash 序列（最多 O = 8 個）。","body":"α ∈ [[H]_{:O}]_C。guarantee 上鏈時檢查 w_a ∈ α[w_c]（用 **prior** α）。每個區塊每個 core 都會從 queue 補一個進來：α′[c] = ←(F(c) ⌢ φ′[c][H_T mod Q])^O，其中 F(c) 會把本塊用掉的 authorizer 從**最左邊**移除一個（seqminusl，不是移除全部）。因為要用 posterior 的 φ′，這一步必須排在 accumulation 之後。","rel":["φ","authorizer","O","Q"]},{"sym":"β","term":"recent history","zh":"近期歷史","cat":"state","gpRef":"eq. 7.1–7.8","one":"最近 H = 8 個區塊的摘要（β_H）加上 accumulation output 的 MMR（β_B）。","body":"β ≡ (β_H, β_B)。β_H 每筆是 (header hash, state root, accumulation-output super-peak, timeslot, 本塊回報的 package hash → segment root)。用途：擋掉重複或過期的 work-report——guarantee 的 anchor 必須對上 β† 的某一筆，package hash 不得出現在 β 的任何一筆裡。β_B 是 Keccak MMR，接收每塊的 accumulation output root。","rel":["β†","β_B","anchor","H (常數)"]},{"sym":"β†","term":"beta dagger","zh":"補正後的近期歷史","cat":"state","gpRef":"eq. 7.5","one":"把 β_H 最後一筆的 state root 用本塊的 H_R 補上之後的中間值。","body":"因為 header 帶的是 **prior** state root，寫入 β 的當下還不知道自己的 posterior root，所以先填零 hash；下一個區塊一開始就用自己的 H_R 覆蓋回去（β† ≡ β_H except β†[|β_H|−1]_s = H_R）。之後 guarantee 的 anchor 檢查比對的是 β†，不是 β。","rel":["β","H_R","pipelining"]},{"sym":"γ","term":"Safrole state","zh":"Safrole 狀態","cat":"state","gpRef":"eq. 6.3–6.5","one":"出塊抽籤相關的四元組 (γ_P, γ_Z, γ_S, γ_A)。","body":"γ_P 下個 epoch 的 pending validator keys（每個 epoch 開頭從 ι 重置）；γ_Z 由 γ_P 的 Bandersnatch key 組成的 ring root，用來驗 ticket 的 ring proof；γ_S 本 epoch 的 slot-sealer 序列（E 張 ticket 或 fallback 的 E 把 key）；γ_A ticket accumulator，收集下個 epoch 要用的 ticket（最多 E 筆，留最低的 E 個 id）。","rel":["γ_S","γ_A","γ_Z","ι","κ"]},{"sym":"γ_S","term":"slot-sealer sequence","zh":"時槽封印序列","cat":"state","gpRef":"eq. 6.25–6.27","one":"本 epoch 每個 slot 由誰出塊：600 張 ticket，或 fallback 的 600 把公鑰。","body":"三種情況（eq. 6.25）：e′ = e + 1 ∧ m ≥ Y ∧ |γ_A| = E → Z(γ_A)（outside-in 排序的 ticket）；e′ = e → 不變；其餘（跳過 epoch、accumulator 未滿、比賽未結束）→ F(η′_2, κ′) 的 fallback key。出塊者用 γ_S[H_T mod E] 對應的私鑰簽 seal。","rel":["γ_A","Z","F","seal","T (ticketed)"]},{"sym":"γ_A","term":"ticket accumulator","zh":"票券累積器","cat":"state","gpRef":"eq. 6.35","one":"本 epoch 收集到的 ticket，供下個 epoch 排序使用。","body":"γ′_A = 把新 ticket 與舊 accumulator 依 id 排序後取**最低**的 E 個（→^E）。epoch 換屆時歸零重收。提交的 ticket 必須全部留在 γ′_A 裡（否則 extrinsic 無效），且 id 不得與既有的重複。id 越小越好——這是「score」的意思。","rel":["γ_S","ticket","E (常數)","Y"]},{"sym":"δ","term":"service accounts","zh":"服務帳戶","cat":"state","gpRef":"eq. 9.1–9.3","one":"從 service index 到 service account 的字典，JAM 版的「所有帳戶」。","body":"δ ∈ D⟨N_S → A⟩。每個 account 有 storage、preimages、requests、gratis、code hash、balance、兩個最低 gas、created/lastacc/parent。沒有 nonce（沒有交易就沒有重放問題）。中間狀態：δ† accumulation 之後、δ‡ 更新 lastacc 之後、δ′ 整合 preimage 之後。","rel":["δ†","δ‡","service","a_t"]},{"sym":"η","term":"entropy pool","zh":"熵累積器","cat":"state","gpRef":"eq. 6.22–6.24","one":"四個 32-byte 的隨機值：η_0 每塊更新，η_1..3 是前三個 epoch 結束時的快照。","body":"η′_0 = H(η_0 ⌢ Y(H_V))——用 prior η_0 與 header VRF 的**輸出**。epoch 換屆時 (η′_1, η′_2, η′_3) = (η_0, η_1, η_2)。用途分工：提交 ticket 與 fallback、guarantor 分派用 η′_2；驗 seal 用 η′_3（就是晚一個 epoch 的同一個值）；`fetch` 給 accumulate 的是 η′_0。","rel":["H_V","seal","guarantor assignment"]},{"sym":"ι κ λ","term":"validator key sets","zh":"驗證者金鑰集合","cat":"state","gpRef":"eq. 6.7, 6.14","one":"ι 待命（staging）、κ 現行（active）、λ 上一個 epoch。","body":"epoch 換屆時 (γ′_P, κ′, λ′) = (Φ(ι), γ_P, κ)——所以 ι 要經過兩個 epoch 邊界才會成為 active（ι → γ_P → κ）。Φ 把 ψ′_O（posterior offenders）裡的 key 換成全零。ι 由具 delegator 權限的 service 透過 `designate` 設定。每個 key 是 336 octets：Bandersnatch 32 | Ed25519 32 | BLS 144 | metadata 128。","rel":["γ_P","Φ","designate","ψ_O"]},{"sym":"ρ","term":"availability assignments","zh":"可用性指派","cat":"state","gpRef":"eq. 11.1","one":"每個 core 目前掛著、等待 availability 的 guarantee 與它進鏈的 slot。","body":"ρ ∈ [(g ∈ 𝔾, t ∈ N_T)?]_C。0.8.0 起存的是**整個 guarantee**（含 2–3 個 guarantor 簽章），理由是要能直接向 guarantor 抓 bundle，以及在 dispute 時用這些簽章組出 culprits。中間狀態：ρ†（disputes 清掉 bad/wonky）→ ρ‡（assurances 讓它 available 或 timeout）→ ρ′（新 guarantee 進來，timestamp 記 τ′）。","rel":["ρ†","ρ‡","guarantee","U"]},{"sym":"τ","term":"timeslot","zh":"時槽","cat":"state","gpRef":"eq. 6.1","one":"最近一個區塊的 slot index；τ′ = H_T。","body":"存 τ 是為了能算出 epoch index 與 slot phase：e ⌢ m = τ / E，e′ ⌢ m′ = τ′ / E。很多規則都取決於「prior 的 m」還是「posterior 的 m′」——例如 γ_S 的第一種情況要求 m ≥ Y（prior），ticket extrinsic 的上限則看 m′ < Y。τ ≥ τ′ 直接是無效區塊。","rel":["epoch","H_T","Y"]},{"sym":"φ","term":"authorizer queue","zh":"授權佇列","cat":"state","gpRef":"eq. 8.1","one":"每個 core 固定 Q = 80 筆的 authorizer 佇列，每個 slot 補一筆進 pool。","body":"φ ∈ [[H]_Q]_C。只有該 core 的 assigner（χ_A[c]）能在 accumulate 裡用 `assign` 改它。補進 pool 的是 φ′[c][H_T mod Q]——注意用的是 **posterior** φ′，所以 pool 更新排在 accumulation 之後。（別跟 PVM 的暫存器 φ 搞混，那是另一個同形符號。）","rel":["α","assign","χ_A"]},{"sym":"χ","term":"privileges","zh":"特權服務","cat":"state","gpRef":"eq. 9.9–9.10","one":"五種特權：manager、delegator、registrar、每個 core 的 assigner、always-accumulate 集合。","body":"χ ≡ (χ_M, χ_V, χ_R, χ_A, χ_Z)。χ_M 可改整個 χ 並發放 gratis storage（0.8.0 起 `bless` 只有 manager 能呼叫）；χ_V 可設 ι；χ_R 可建立 index < S = 2^16 的保留 service；χ_A[c] 可改 φ[c]；χ_Z 是每塊都會被 accumulate 的 service 與其免費 gas。","rel":["bless","assign","designate","χ_Z"]},{"sym":"ψ","term":"disputes state","zh":"爭議狀態","cat":"state","gpRef":"eq. 10.1","one":"good / bad / wonky 三個 report hash 集合，加上 offenders 的 Ed25519 key 集合。","body":"ψ ≡ (ψ_G, ψ_B, ψ_W, ψ_O)。已經判過的 report hash 不能再被判一次（verdict 的 hash 必須與三個集合不相交）。ψ_O 只增不減，且在下次 key rotation 時讓 Φ 把對應的 validator key 清零；JAM 自己不做 slashing，只留紀錄給上層 staking 系統。","rel":["verdict","culprit","fault","Φ"]},{"sym":"π","term":"activity statistics","zh":"活動統計","cat":"state","gpRef":"eq. 13.1","one":"π_V 本 epoch、π_L 上一個 epoch 的 validator 統計，加上 per-core 與 per-service 的本塊統計。","body":"π ≡ (π_V, π_L, π_C, π_S)。validator 每人六個計數器：b 出塊、t 帶進的 ticket 數、p preimage 數、d preimage bytes（這四個都記在**作者**身上）、g guarantee（記在有簽名的 guarantor）、a assurance（記在簽 assurance 的人）。π_C/π_S 是 per-block 的，沒活動就不出現。JAM 只產生數據，獎勵計算交給上層。","rel":["G (reporters)","π_C","π_S"]},{"sym":"ω","term":"ready queue","zh":"待累積佇列","cat":"state","gpRef":"eq. 12.3","one":"已 available 但依賴未滿足、等著被 accumulate 的 report（長度 E 的環狀緩衝）。","body":"ω ∈ [[(ℝ, {H})]]_E，每格存 (report, 尚未滿足的 package hash 集合)。每塊從 ω[m..] ⌢ ω[..m] 依序取（m = H_T mod E，即最舊優先），能解鎖的用 Q 函數挑出來，跳過的 slot 清空，超過一個 epoch 沒解開就被覆蓋掉。0.7.x 的文獻寫成 ϑ，0.8.0 已改名為 ω。","rel":["ξ","R!","R*","Q 函數"]},{"sym":"ξ","term":"accumulation history","zh":"累積歷史","cat":"state","gpRef":"eq. 12.1","one":"最近一個 epoch 內已被 accumulate 的 work-package hash（每個 slot 一組集合）。","body":"ξ ∈ [{H}]_E。兩個用途：判斷 report 的 prerequisite 是否已滿足（依賴的 package 在 ξ 裡就算解鎖），以及擋掉重複的 package。每塊左移一格，最後一格放本塊剛 accumulate 的 package hash。","rel":["ω","prerequisite","R*"]},{"sym":"θ","term":"accumulation output log","zh":"累積輸出紀錄","cat":"state","gpRef":"eq. 7.4, 12.24","one":"本塊各 service 透過 `yield` 產出的 (service, hash) 序列。","body":"θ′ 由 Δ+ 的輸出 b 而來，只收「有 yield 32-byte hash」的 service。它會被 M_B（Keccak）算出一個 root，append 進 β_B 這條 MMR，其 super-peak 就是 BEEFY 簽的東西——也就是 service 對外部系統（bridge）承諾狀態的管道。","rel":["yield","β_B","BEEFY"]},{"sym":"B","term":"block","zh":"區塊","cat":"block","gpRef":"eq. 4.2","one":"B ≡ (H, E)：一個 header 加一份 extrinsic。","body":"JAM 是 transactionless 的：extrinsic 的五個部分全部由 validator 產生，沒有使用者簽名的交易。外部資料只能經由 work-package（in-core 的 refine）與 preimage 進入狀態。","rel":["H (header)","E (extrinsic)"]},{"sym":"E","term":"extrinsic","zh":"區塊外部資料","cat":"block","gpRef":"eq. 4.3","one":"E ≡ (E_T, E_D, E_P, E_A, E_G)：tickets、disputes、preimages、assurances、guarantees。","body":"E_T 出塊抽籤的票（m′ < Y 時最多 K = 16 張）；E_D 爭議（verdicts + culprits + faults，各最多 16）；E_P preimage（依 (service, blob) 排序且唯一）；E_A availability assurance（每個 validator 至多一筆，依 index 遞增）；E_G work-report guarantee（每個 core 至多一筆，依 core 排序）。","rel":["E_T","E_G","E_A","E_D","E_P"]},{"sym":"H","term":"header","zh":"區塊標頭","cat":"block","gpRef":"eq. 5.1","one":"十個欄位：H_P, H_R, H_X, H_T, H_E, H_W, H_O, H_I, H_V, H_S。","body":"parent hash、**prior** state root、extrinsic hash、timeslot、epoch marker、winning-tickets marker、offenders marker、作者 index、entropy VRF 簽章、seal。E_U(H) 是「不含 seal」的序列化，也就是 seal 簽的訊息。","rel":["H_R","H_S","H_V","E_U(H)"]},{"sym":"H_R","term":"prior state root","zh":"前態狀態根","cat":"block","gpRef":"§5","one":"header 帶的是**父區塊**的 posterior state root，不是自己的。","body":"GP 明說理由是「to facilitate the pipelining of block computation and in particular of Merklization」——出塊者不必先把新狀態 Merklize 完才能發布區塊。代價是 β 最新一筆的 state root 要留白、由下一塊補（β†），以及 Grandpa 投票必須另外帶上 posterior state root。","rel":["β†","Grandpa","pipelining"]},{"sym":"H_S / H_V","term":"seal / entropy VRF signature","zh":"封印與熵簽章","cat":"block","gpRef":"eq. 6.16–6.18","one":"兩個 Bandersnatch VRF 簽章：一個證明出塊權，一個產生熵。","body":"ticket 模式：Y(H_S) 必須等於該 slot 的 ticket id，context 是 X_T ⌢ η′_3 ++ i_e，訊息是 E_U(H)，並標記 T = 1。fallback 模式：γ_S[H_T mod E] 必須等於作者的 Bandersnatch key，context 改 X_F ⌢ η′_3，T = 0。兩種模式都要有 H_V：context X_E ⌢ Y(H_S)、訊息為空——訊息先被固定住，所以熵無法被出塊者操弄。","rel":["γ_S","η","T (ticketed)","Bandersnatch"]},{"sym":"H_X","term":"extrinsic hash","zh":"外部資料雜湊","cat":"block","gpRef":"eq. 5.4–5.7","one":"對五個 extrinsic 元件各自的承諾再取一次 hash。","body":"0.8.0 (#524) 改成：preimage 部分承諾 (E_4(service), H(data)) 對，guarantee 部分承諾 (H(report), E_4(slot), credential)。目的是「allow for the possibility of reports and preimages to individually have their inclusion proven」——不必附上整個 blob 就能證明某筆在區塊裡。","rel":["E_P","E_G","Merkle proof"]},{"sym":"H_E / H_W / H_O","term":"epoch / winning-tickets / offenders markers","zh":"三個標記","cat":"block","gpRef":"eq. 6.28–6.29, 10.19","one":"讓只同步 header 的節點也能追上 validator 與 ticket 的變化。","body":"H_E 只在 e′ > e 時出現，內容是 (η_0, η_1) 加上 γ′_P 每個 validator 的 (Bandersnatch, Ed25519) key。H_W 只在同一 epoch 內首次跨過 Y、且 accumulator 飽和時出現，內容是 Z(γ_A)。H_O 是本塊新增的 offender key（culprits 在前、faults 在後），可以是空序列。H_E 與 H_W 互斥。","rel":["γ_P","γ_A","Z","offenders"]},{"sym":"","term":"in-core vs on-chain","zh":"核內／鏈上","cat":"flow","gpRef":"§4.9.1","one":"in-core 只有被指派的少數 validator 執行；on-chain 是所有人都跑。","body":"in-core（refine）由該 core 的 guarantor 執行，靠 guaranteeing → assuring → auditing →（必要時）judging 這套 crypto-economic 遊戲取信，因此算力可隨網路規模成長（GP 估計約單機的 300 倍）；on-chain（accumulate）是「everybody does everything」，受單機能力限制。兩者由同一批 validator 執行，安全性相當，差別在「可擴展 vs 同步」。","rel":["refine","accumulate","ELVES"]},{"sym":"","term":"refine","zh":"精煉","cat":"flow","gpRef":"§4.9.2, eq. B.5","one":"service 的 in-core 進入點：無狀態、吃大量輸入、吐出小的 digest。","body":"Ψ_R 在 core 上執行，沒有一般的鏈上狀態可讀（只有 historical_lookup 能依 lookup-anchor 時點查 preimage），但可以建立 inner PVM、export segment 到 D³L。每個 work-item 一次 refine，gas 上限 G_R = 5×10^9。輸出（work result）與統計資料組成 work-digest。","rel":["accumulate","work-item","Ψ_R","historical_lookup"]},{"sym":"","term":"accumulate","zh":"累積","cat":"flow","gpRef":"§12, eq. B.9","one":"service 的 on-chain 進入點：有狀態、可轉帳、可建立 service。","body":"Ψ_A 以 PC = 5 為進入點，參數只有 (timeslot, service id, input 數)，實際的 operand 與 transfer 用 `fetch`(14/15) 讀。每個 report 的 accumulate gas 上限 G_A = 10^7、每塊總量 G_T = 3.5×10^9。0.7.1 起 on_transfer 併入 accumulate——轉帳以 input 的形式在下一輪送達收款方。","rel":["refine","Δ+","deferred transfer","yield"]},{"sym":"","term":"guarantor","zh":"保證人","cat":"flow","gpRef":"§11.3, §15","one":"被指派到某個 core、負責執行 refine 並簽署 work-report 的 validator。","body":"每個 active core 固定 3 個 guarantor，由 η′_2 對 [⌊i/3⌋] 做 Fisher–Yates shuffle、再依 rotation index ⌊(t mod E)/R⌋ 旋轉決定（R = 10 slots 換一次）。兩個簽章就足以把 report 送給出塊者。GP 建議「平均每個 slot 簽不超過兩份 report」，以免被出塊者當成 spam 忽略。","rel":["M (assignments)","rotation","guarantee","R (常數)"]},{"sym":"","term":"assurer","zh":"擔保人","cat":"flow","gpRef":"§11.2, §16","one":"宣告自己已持有某 core 的 erasure-coded shard 的 validator。","body":"每個 slot 發一份 assurance：bitfield 每個 core 一 bit，anchor 必須是 H_P，用 prior κ 的 Ed25519 key 對 X_A ⌢ H(E(H_P, bitfield)) 簽名。要打勾必須同時握有兩類 shard：report bundle 的（審計用，審完可丟）與所有 exported segment 的（保存 28 天）。超過 2/3·|κ| 打勾，report 才算 available。","rel":["assurance","erasure coding","D³L","R (available)"]},{"sym":"","term":"auditor","zh":"審計者","cat":"flow","gpRef":"§17","one":"每個 validator 都要對隨機抽到的 report 重跑一次並公開判決。","body":"初始 tranche：用 X_U ⌢ Y(H_V) 的 VRF 洗牌後取 10 個 core。之後每 8 秒（A）一個 tranche，遇到負面判決或 no-show（有人宣告卻沒交判決）就擴大，期望每個 no-show 多帶 F = 2 個審計者。審計要先把 bundle 從 1/3 的 validator 手上的 chunk 重建出來，再重跑 computereport 逐欄位比對。","rel":["ELVES","no-show","tranche","A","F"]},{"sym":"","term":"ELVES","zh":"ELVES 機制","cat":"flow","gpRef":"§17 & eprint 2024/961","one":"JAM 審計機制的理論基礎，源自 Polkadot 的 backing/approval/inclusion。","body":"論文用語與 JAM 的對照：backing = guaranteeing、approval = auditing、inclusion = accumulation。核心想法是「非冗餘分割 + 提案與審計賽局」——不需要所有人重算，只要作弊被抓到的機率夠高、代價夠大即可。安全性假設 ≥ 2/3+1 的 validator 誠實且在線。","rel":["auditor","guarantor","dispute"]},{"sym":"P","term":"work-package","zh":"工作包","cat":"data","gpRef":"eq. 14.2","one":"⟨j, h, u, f, c, w⟩：授權 token、授權服務、授權 code hash、config、refinement context、work-items。","body":"authorizer = H(u ⌢ f)。一個 package 最多 I = 16 個 work-item，整包（含 extrinsic 與 import）不得超過 W_B = 13,791,360 octets。package 由 builder 組裝、交給 guarantor；它本身不上鏈，上鏈的是它的 work-report。","rel":["work-item","authorizer","work-report","W_B"]},{"sym":"","term":"work-item","zh":"工作項","cat":"data","gpRef":"eq. 14.3","one":"package 內的一個工作單位：指定 service、code hash、payload、兩個 gas 上限、imports、extrinsics、export 數。","body":"每個 item 對應一次 refine 與（之後）一筆 work-digest。imports 以 (segment root 或 package hash, index) 指定要從 D³L 匯入的 segment；extrinsics 以 (hash, length) 指定隨包附帶的資料。宣告的 export 數若與實際 export 不符，結果會被換成 BADEXPORTS。","rel":["work-package","work-digest","segment","refine"]},{"sym":"ℝ","term":"work-report","zh":"工作報告","cat":"data","gpRef":"eq. 11.2","one":"(s, c, c, a, t, l, d, g)：avspec、refinement context、core、authorizer、auth trace、segment-root lookup、digests、auth gas。","body":"這是 in-core 計算「上鏈」的形式：不含原始資料，只含承諾與結果。變動大小（auth trace + 所有成功輸出）受 W_R = 48 KiB 限制；digest 數 1..16；|segment-root lookup| + |prerequisites| ≤ J = 8。report 的 hash H(E(w)) 是 dispute 與 ρ 清除時的識別碼。","rel":["work-digest","avspec","refinement context","W_R"]},{"sym":"𝔻","term":"work-digest","zh":"工作摘要","cat":"data","gpRef":"eq. 11.6","one":"一個 work-item 的 refine 結果加上資源使用量。","body":"欄位：service、code hash（必須與鏈上 δ[s]_c 相符）、payload hash、accumulate gas 上限、結果（blob 或錯誤）、實際用掉的 refine gas、import 數、extrinsic 數與大小、export 數。accumulate 時它會被轉成 operand tuple 餵給 service。","rel":["work-report","operand tuple","𝔼"]},{"sym":"𝔼","term":"work error set","zh":"工作錯誤集合","cat":"data","gpRef":"eq. 11.7","one":"{∞ OOG, ☇ panic, BADEXPORTS, OVERSIZE, BAD, BIG}。","body":"∞ gas 用盡、☇ 非預期終止、BADEXPORTS 宣告的 export 數不符、OVERSIZE 輸出會撐破 report 的大小上限、BAD 在 lookup-anchor 的狀態下找不到 service code、BIG code 超過 W_C = 4,000,000。錯誤仍然會被 accumulate（operand 的結果就是錯誤值），只是沒有輸出 blob。注意 0.8.0 的 𝕁 是 segment 的集合，不是錯誤集合。","rel":["work-digest","𝕁","W_C"]},{"sym":"𝕐","term":"availability specification","zh":"可用性規格","cat":"data","gpRef":"eq. 11.5","one":"(p, l, u, v, e, n)：package hash、bundle 長度、erasure root、shard 數、segment root、segment 數。","body":"u 是對所有 erasure chunk 的 Merkle root（審計與重建的依據）；v 必須等於 |κ′|，因為每個 assurer 拿一個 chunk；e 是對 exported segment 做的 constant-depth Merkle root，供之後的 package import 時驗證。容易記反的是 v（shards）與 n（segments）。","rel":["erasure coding","segment","assurer"]},{"sym":"ℂ","term":"refinement context","zh":"精煉語境","cat":"data","gpRef":"eq. 11.4",
