⌋ = 2, and the seal must now come from one of the 9 incoming validators (H_I < 9), because γ′_Z commits to their keys from this block on and H_E lists their 9 pairs","n = ⌈24/6⌉ = 4, because n is computed from the active set κ′ that seals this epoch; γ′_Z stays a 6-key ring and H_E lists 6 pairs until the 9 validators actually become active in epoch e + 2","The block is invalid: eq. 6.8 requires |ι| = |κ| at all times, so the validator count can only be changed by restarting from genesis with a new chainspec; designate would have returned HUH for z = 9","Tickets submitted during epoch e + 1 need entry index < n = ⌈24/9⌉ = 3 and ring proofs against a 9-key γ′_Z; H_E lists 9 (k_b, k_e) pairs; but the block's H_I must be < 6 and its seal comes from κ′ = the old 6-member γ_P"],"answer":3,"explanation":"eq. 6.14：e′ > e 時 γ′_P = Φ(ι)（9 筆）、κ′ = γ_P（6 筆）、λ′ = κ、z = O([k_b | k ∈ γ′_P])——ring 有 9 個成員。eq. 6.30：n = ⌈2E/|γ′_P|⌉ = ⌈24/9⌉ = ⌈2.67⌉ = 3，entry index ∈ N_3 = {0, 1, 2}；用 floor 得 2 是錯的；用 κ′ 的 6 算出 4 也是錯的 set。eq. 6.28：H_E 列出 γ′_P 的 9 組 (k_b, k_e)。但本 epoch 出塊的是 κ′（舊的 6 人 γ_P）：§5 eq. 5.10 H_I ∈ N_{|κ′|} = N_6，seal 由 κ′[H_I]_b 簽（6.16/6.17），fallback F(η′_2, κ′) 的索引 mod 6；9 位新 validator 要到 epoch e + 2 才成為 κ。eq. 6.7/6.8（0.8.0 PR #514「Support smaller validator sets」）：ι、γ_P、κ、λ 各自 ∈ [K]_{N_V}、N_V = {3c | c ∈ N_{2..C+1}}，沒有要求彼此等長；designate host call 只檢查 z ∈ N_V；eq. 11.18 更明文處理 |κ| ≠ |κ′|（清空 ρ‡），所以「必須重啟 genesis」是錯的。連帶影響：active core 數 = |κ′|/3，本 epoch 2 個、下個 epoch 3 個。你們的 code 目前撐不住這種鏈：GetVerifier 要求 len(gammaK) == ValidatorsCount，ValidateHeaderEpochMark 要求 len(em.Validators) == ValidatorsCount，兩者都會拒絕合法區塊——這就是 open issue #1037。","trap":"一句話：ticket 規則跟著 γ′_P（下個 epoch 的人），seal/author 規則跟著 κ′（這個 epoch 的人）。"},{"id":"ch06-ring-root-nulled-keys","ch":"6","section":"6.3 Key Rotation / Appendix G","gpRef":"eq. 6.14–6.15, G.3 (ring root), App. G padding-point note","difficulty":3,"kind":"concept","tags":["safrole","ring-vrf","offenders","validators"],"stem":"On an epoch change, one validator in ι has its Ed25519 key in ψ′_O, so Φ replaces its entire 336-octet entry with zeros. How does this affect γ′_Z and ticket verification in the new epoch?","options":["The ring keeps |γ′_P| members: a zero key decodes to no Bandersnatch point, so the padding point is substituted at that position in z = O([k_b | k ∈ γ′_P]); the offender cannot produce a valid ring proof, everyone else's tickets verify against this γ′_Z all epoch","O(…) fails on an undecodable key, so a block that would place a nulled key into γ′_P is invalid; offenders therefore have to be removed from ι by the delegator service (designate) before the boundary, shrinking the set by 3 each time","The all-zero key is a valid Bandersnatch point (the identity), so γ′_Z is computed normally and the offender can keep submitting tickets until the following epoch removes it; only its Ed25519-signed artefacts are refused meanwhile","The offender's slot is removed from the ring, so γ′_Z commits to |γ′_P| − 1 keys and everyone's ring position shifts by one; this is why the accumulator has to be re-sorted at the epoch boundary and why H_E lists the surviving keys only"],"answer":0,"explanation":"eq. 6.15：Φ 把 k_e ∈ ψ′_O 的整組 key 換成 [0, 0, …]；eq. 6.14：z = O([k_b | k ∈ γ′_P]) 仍對 **全部** |γ′_P| 個位置取 commitment。App. G 明文：「in the case a key has no corresponding Bandersnatch point when constructing the ring, then the Bandersnatch padding point … should be substituted」——全零 32 bytes 不對應合法的 ring 成員（Twisted Edwards 的 identity 是 (0, 1)，壓縮編碼是 0x01 後接零，不是全零），所以該位置換成 padding point，ring 大小不變、其他人的位置也不變。w3f vector enact-epoch-change-with-padding-1 就是測這個：一把 key 因在 posterior offenders 而歸零、另一把本來就 undecodable，「Both the invalid keys are replaced with the padding point during ring commitment computation」。offender 沒有 padding point 的私鑰，做不出合法 ring proof，整個 epoch 都無法投 ticket；「移除該位置」與「區塊無效」都是錯的。注意 Φ 只作用在進入 γ′_P 的 ι——已在 κ′ 裡的 offender 本 epoch 的 seal 仍照常驗（§11 eq. 11.22 的 guarantor 分配才另外套 Φ(κ′)）；而歸零的 entry 下個 epoch 進到 κ 後，fallback F 若抽到它，那個 slot 沒人能出塊。工程面：γ′_Z ∈ B_144（G.3）是 key 序列的純函數，只在 e′ > e 時重算（KeyRotate 否則直接沿用 prior γ_Z）；你們的 GetVerifier 以 Blake2b(所有 Bandersnatch key 串接) 當快取鍵（#1041），取代原本按 epoch 快取、fork-restore 就得重建的做法（#1040）。","trap":"零 key ≠ 移除：ring 成員數不變、位置不變，只是那格換成 padding point。"},{"id":"ch06-vrf-output-message-independence","ch":"6","section":"6.4 Sealing and Entropy Accumulation","gpRef":"eq. 6.16, 6.24, 6.30, 6.32; §3.8.2 Signing Schemes; App. G eq. G.2/G.5","difficulty":3,"kind":"rationale","tags":["safrole","vrf","seal","tickets","rationale"],"stem":"A ticket proof is a ring-VRF proof with context X_T ⌢ η′_2 ++ r over the EMPTY message, while the seal H_S is a plain Bandersnatch signature with context X_T ⌢ η′_3 ++ i_e over E_U(H), the whole unsigned header. Why can eq. 6.16 nevertheless demand i_y = Y(H_S), i.e. that the seal's VRF output equal the ticket id?","options":["Because the ticket id is defined as the Blake2b hash of the proof bytes, and eq. 6.16 requires the seal to embed a copy of the original 784-byte ring proof so that every verifier can recompute that hash from the header alone; the E_U(H) message merely binds the embedded copy to this particular block","Because a VRF output depends only on the secret key and the context ('influenced by x but not by m'), and by seal time the submission entropy has rotated from η′_2 into η′_3 so the contexts coincide: the same key reproduces the ticket id under any message — anonymous in the ring proof, attributable in the seal","Because both the ticket proof and the seal are in fact signed over the empty message — E_U(H) is only ever the message of H_V, whose output feeds η′_0 — so the two VRF outputs agree trivially; the identity check i_y = Y(H_S) is accordingly made against H_V rather than against the seal","Because η′_2 = η′_3 whenever the tickets were submitted in the same epoch as the block being sealed, so the author simply re-signs an identical context; the message is ignored by the verifier for seals though not for ring proofs, which is why tickets carry [] and seals carry E_U(H)"],"answer":1,"explanation":"§3.8.2：Bandersnatch signature 與 RingVRF proof「both define a VRF output, a high entropy hash influenced by x but not by m」，且「the member is identified in the former and is anonymous in the latter」；App. G（G.2/G.5）：Y(·) 取 output 的前 32 bytes。eq. 6.32：ticket id y = Y(p)，是 VRF **輸出**，不是 proof bytes 的 hash；eq. 6.30 的 context 是 X_T ⌢ η′_2 ++ r（提交當時的 η′_2）；eq. 6.24 在下個 epoch 邊界把它 rotate 成 η′_3，所以 eq. 6.16 seal 的 context X_T ⌢ η′_3 ++ i_e 與當初提票的 context 逐 byte 相同。同一把 secret key + 相同 context ⇒ 相同 VRF output，無論訊息是 [] 還是 E_U(H)，因此驗證者比對 i_y = Y(H_S) 就能確定「出塊者就是持票人」——提票時 ring proof 只證明「γ′_P 某成員」，出塊時 IETF 簽章（H_A 已知）揭露身分；這就是 Safrole「事前匿名、事後可歸屬」的核心。§6.7 也說 ticket id「is used both as a score in the contest and as input for the block's entropy source VRF signature」（H_V 的 context X_E ⌢ Y(H_S)）。其他選項：η′_2 ≠ η′_3（差一個 epoch）；seal 的訊息是 E_U(H) 不是空——這才把 seal 綁定到 header 內容，只有 H_V 的訊息是 []；seal 是 96-byte signature，不含 784-byte ring proof。另外，i_y 比對的對象是 seal H_S（6.16），不是 H_V——H_V 只負責把 Y(H_S) 當 context 產生 entropy；也不能說「驗證者忽略訊息」：訊息仍然參與簽章驗證（改一個 byte 簽章就不過），只是不影響 VRF output。「同一個 epoch 內提票、同一個 epoch 內封章」同樣不對：ticket 在 epoch N 提交、到 N+1 才對應 slot，兩邊 context 相同純粹是 6.24 rotate 的結果。你們 ValidateByTickets 先比 vrf.VRFIetfOutput(header.Seal) == ticket.ID，再 IETFVerify(context, E_U(H))。","trap":"VRF output 只看 (key, context)，不看 message——這是 ticket 能匿名提交、之後又能對上 seal 的原因。"},{"id":"ch06-why-m-ge-Y","ch":"6","section":"6.5 The Slot-Sealer Sequence","gpRef":"eq. 6.25, 6.29, 6.31, 6.35; §6.6–6.7 prose","difficulty":3,"kind":"rationale","tags":["safrole","fallback","markers","rationale"],"stem":"Eq. 6.25 uses the accumulator as the next slot-sealer sequence only when e′ = e + 1 ∧ m ≥ Y ∧ |γ_A| = E. What does the conjunct m ≥ Y — a property of the PRIOR block — actually guarantee, and why does the GP tie the ticket regime to it?","options":["That the prior block's author held a ticket (T = 1), since a fallback-sealed block is not allowed to close a contest on behalf of the ticket holders; this is also what the best-chain rule of §19 counts when it prefers ticketed ancestors","That at least Y tickets were submitted during the epoch, so the contest was competitive enough for the accumulator to be trusted over the fallback keys; with fewer than Y entries the outside-in ordering Z would leave slots unassigned","That no ticket submitted inside the tail is counted: tickets arriving at m ≥ Y would otherwise have been proven against the wrong ring root and entropy, since γ′_Z and η′_2 already refer to the epoch after next by then","That some block of the ending epoch was authored in the tail, which — γ_A being frozen once m′ ≥ Y — is exactly the condition under which H_W = Z(γ_A) was published in that epoch, so a header-only node is never asked to verify ticket seals for a sequence it never saw"],"answer":3,"explanation":"eq. 6.31：m′ ≥ Y 時 |E_T| = 0，§6.7 末尾更指出此時 γ′_A = γ_A——進入 tail 後 accumulator 凍結。eq. 6.29：同一 epoch 內第一個跨過 Y 的區塊（m < Y ≤ m′）若 |γ_A| = E 就發佈 H_W = Z(γ_A)。把兩者合起來：「前一塊在 tail（m ≥ Y）且 |γ_A| = E」⟺「本 epoch 已有某塊發佈了 H_W，且內容恰是 Z(γ_A)」（tail 內任何一塊都是或晚於那個第一塊，而 γ_A 從那之後不再變動）。§6.6 說 marker 的目的就是讓「nodes which do not synchronize the entire state」能「using only the chain of headers」追蹤 sealer/validator 的變化，§6.7 也說 Y 之後「the following epoch's slot-sealer sequence becomes fixed」。若沒有任何區塊落在 tail（前一塊 m < Y 直接跳到下個 epoch），H_W 從未出現，header-only 節點無從得知 ticket 序列，所以 GP 寧可走 fallback（vector skip_epoch_tail-1：「Tickets mark has no chance to be generated. Accumulated tickets discarded. Fallback method enacted」）。其他選項：Y = 500 是 slot phase，與「幾張 ticket」無關，飽和由 |γ_A| = E 這個 conjunct 負責；tail 內本來就不可能有 ticket（6.31），空的 E_T 在 tail 是唯一合法情況；T 旗標不是 6.25 的輸入（它只用在 §19 best-chain 偏好）。你們的 #284 就是最初只判 ePrime == e+1，會在沒有 H_R 的情況下啟用 ticket（也會在跳過 epoch 時用錯 accumulator）。","trap":"m ≥ Y 不是「比賽夠久」，而是「H_W 一定已經在 header 鏈上」——三個 conjunct 各管一件事：e′ = e+1（是下一個 epoch）、m ≥ Y（H_W 已發佈）、|γ_A| = E（飽和）。"},{"id":"ch06-three-keys-epoch-marker","ch":"6","section":"6.3 Key Rotation / 6.6 The Markers","gpRef":"eq. 6.10–6.13, 6.15, 6.28; §5 eq. 5.11; eq. 11.14, 11.28, 17.7, 18.1","difficulty":2,"kind":"concept","tags":["safrole","validators","markers","keys"],"stem":"Each validator key K bundles a Bandersnatch, an Ed25519 and a BLS public key. Which mapping of key → protocol use is correct, and why has the epoch marker H_E carried the Ed25519 keys alongside the Bandersnatch keys since GP 0.6.4?","options":["Bandersnatch: ticket ring proofs, seals, H_V and audit-selection VRFs; Ed25519: guarantees and assurances only; BLS: judgments, culprits, faults and BEEFY. H_E carries Ed25519 keys because Φ needs them to null the offenders inside κ′ at the epoch boundary, and κ′ is not otherwise reconstructible from headers","Bandersnatch: ticket ring proofs, H_S, H_V, audit-selection VRFs; Ed25519: guarantees, assurances, judgments/culprits/faults, audit announcements, offender identity (ψ_O, H_O, Φ); BLS: BEEFY only. H_E carries Ed25519 keys so a header-only node can attribute every Ed25519-signed artefact and every H_O entry to a validator","Bandersnatch: ticket ring proofs, seals and H_V; Ed25519: everything else, including BEEFY signatures and audit announcements; BLS is reserved metadata with no protocol use yet, exactly like k_m. H_E carries Ed25519 keys so that GRANDPA voters can be weighted by stake using nothing but the header chain","Bandersnatch: seals, H_V and BEEFY; Ed25519: ticket ring proofs, guarantees, assurances and audit announcements; BLS: judgments, culprits, faults and offender identity (ψ_O, H_O, Φ). H_E carries Ed25519 keys because the ring root γ′_Z is a commitment to the Ed25519 keys of γ′_P, which header-only nodes must be able to rebuild for themselves"],"answer":1,"explanation":"eq. 6.10–6.13：k_b Bandersnatch、k_e Ed25519、k_l BLS（144 bytes）、k_m metadata（opaque，不參與任何密碼學）。Bandersnatch：ticket ring proof（6.30，對 γ′_Z）、seal H_S（6.16/6.17）、entropy VRF H_V（6.18）、§17 auditing 的 VRF seed（s_0、s_n 用 κ[v]_b）。Ed25519：guarantee credentials（11.28）、assurances（11.14，κ[a]_e）、verdict 中的 judgments（§10 用 k[i]_e，k 取自 κ 或 λ）、culprits/faults（10.2 的 tuple 直接帶 Ed25519 key 與簽章）、audit announcements（17.7）、以及 offender 身分——ψ_O 是 Ed25519 key 的集合，H_O ∈ [H_E]（5.11），Φ 用 k_e ∈ ψ′_O 判斷（6.15）。BLS：只有 BEEFY（18.1，κ′[v]_bls 對 accumulation-output MMR 的 Keccak 簽章）。eq. 6.28：H_E = (η_0, η_1, [(k_b, k_e) | k ∈ γ′_P])；§6.6：marker 是給「do not synchronize the entire state」的節點用 header 鏈追蹤 validator 變化——只有 Bandersnatch 的話，這種節點能驗 seal，卻無法把 guarantee/assurance/judgment/announcement 或 H_O 裡的 Ed25519 key 對應到 validator，因此 0.6.4 把 Ed25519 key 加進 H_E（changelog：「Ed25519 keys in epoch marker」）；BLS 與 metadata 不在 H_E 內。其他選項：BEEFY 用 BLS 不是 Bandersnatch/Ed25519；γ′_Z 是 Bandersnatch key 的 ring root（6.14）；Φ 作用在 ι → γ′_P 而非 κ′、讀的是 state 而不是 header；GP 沒有「以 stake 加權 GRANDPA」。把 judgments/culprits/faults 歸給 BLS 也錯（§10.2 的 tuple 直接帶 Ed25519 key 與簽章），把 offender 身分歸給 BLS 同樣錯——ψ_O 是 Ed25519 key 的集合（6.15 用 k_e 比對）；ticket 是 Bandersnatch ring proof，不是 Ed25519 簽章；audit announcement（17.7，Ed25519）與 audit 抽籤 VRF（§17，Bandersnatch）分屬兩把 key，不能整包丟給同一邊；BLS 更不是「保留未用的 metadata」——18.1 就用 κ′[v]_bls 對 accumulation-output MMR 簽章，真正不參與密碼學的是 k_m。你們的 EpochMarkValidatorKeys 就是 {Bandersnatch, Ed25519} 兩欄，ValidateHeaderEpochMark 兩者都比。","trap":"口訣：Bandersnatch = Safrole（票、seal、entropy、audit 抽籤）；Ed25519 = 其他所有簽章與 offender 身分；BLS = 只有 BEEFY。"},{"id":"ch10-verdict-keyset-epoch-boundary","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.2–10.4","difficulty":3,"kind":"concept","tags":["disputes","calc","tiny","epoch-boundary"],"stem":"Tiny config (E = 12). A block with H_T = 24 — the first block of epoch 2 — is imported on top of a parent whose τ = 23, and its E_D contains verdicts. Per eq. 10.2–10.4, which epoch indices a may those verdicts carry, and which validator set K(a) verifies each of them?","options":["a ∈ {2, 1, 0}: in an epoch-boundary block judgments from κ′, κ and λ are all admissible, each verdict still needing ⌊2|k|/3⌋+1 = 5 signatures","a ∈ {1, 0}: a = 1 selects the prior κ (the set active during epoch 1) and a = 0 the prior λ; a = 2 is rejected even though the block itself belongs to epoch 2","a ∈ {2, 1}: a = 2 selects the prior κ and a = 1 the prior λ, since ⌊H_T/E⌋ = 2 is the epoch index a verdict must name; a = 0 is rejected as too old","a ∈ {2, 1}: a = 2 selects κ′ (the set this block rotates in) and a = 1 selects κ, because the index is derived from the block's own timeslot H_T; a = 0 is rejected since λ is two epochs stale by now"],"answer":1,"explanation":"eq. 10.2 的 verdict 第二項型別是 ⌊τ/E⌋ − N_2，即 {⌊τ/E⌋, ⌊τ/E⌋ − 1}，而 τ 是 **prior state 的 timeslot**（GP 原文：「must be either the epoch index of the prior state or one less」）。eq. 10.3：K(a) = κ 當 a = ⌊τ/E⌋，否則 λ——這裡的 κ、λ 都是 prior state 的集合。計算：τ = 23 → ⌊23/12⌋ = 1，所以 a ∈ {1, 0}；a = 1 → κ（epoch 1 期間的 active set），a = 0 → λ（epoch 0 的 set）。本塊雖然 H_T = 24 屬於 epoch 2、且會做 key rotation（κ′ = γ_P、λ′ = κ，eq. 6.14），但 disputes 用的是 prior 集合，γ_P 這批新 validator 在本塊還不能簽 verdict；要到下一塊（τ = 24：a = 2 → κ = 新集合，a = 1 → λ = 舊 κ）才行。用 H_T 推出 a ∈ {2, 1} 的兩種說法都錯：verdict 的 epoch index 綁的是父塊的 τ，不是本塊 slot；「三個集合都可以」也錯：K 只有兩個 case，a = 2 既 ≠ 1 也 ≠ 0 → 區塊無效。eq. 10.4 另要求每個 verdict 恰好 ⌊2|k|/3⌋+1 = 5（tiny）個 judgment。你們 VerifySignature：`a := U32(state.GetTau()) / U32(EpochLength)`，state 取自 `GetPriorStates()`，與 GP 一致。","trap":"口訣：verdict 的 a 看「父塊的 τ」，K(a) 取「prior κ/λ」；換 epoch 那一塊，新集合還簽不了 verdict。"},{"id":"ch10-code-genesis-age-underflow","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.2–10.3 — internal/extrinsic/verdict_controller.go VerifySignature","difficulty":3,"kind":"code","tags":["disputes","code","fuzzer","edge-case"],"stem":"The chain is still in its genesis epoch (prior τ < E, so ⌊τ/E⌋ = 0). Which verdict `Age` does this code accept although GP 0.8.0 (eq. 10.2–10.3) makes the block invalid — and against which key set would it then verify the judgments?","code":{"lang":"go","caption":"internal/extrinsic/verdict_controller.go (VerdictWrapper.VerifySignature)","src":"func (v *VerdictWrapper) VerifySignature() error {\n\n    state := blockchain.GetInstance().GetPriorStates()\n\n    a := types.U32(state.GetTau()) / types.U32(types.EpochLength)\n    if v.Verdict.Age != a && v.Verdict.Age != a-1 {\n        return errors.New(\"bad_judgement_age\")\n    }\n\n    k := make(types.ValidatorsData, types.ValidatorsCount)\n    if v.Verdict.Age == a {\n        k = state.GetKappa()\n    } else {\n        k = state.GetLambda()\n    }"},"options":["Age = 0 with judgments signed by λ keys: since a−1 cannot be matched at genesis, the code falls through to the λ branch and accepts λ signatures for the current epoch","Age = 1: because the check compares Age against both a and a−1 symmetrically, the next epoch's index also passes and the judgments are verified against κ as if the epoch had already rolled over","None: the wrapped value of `a-1` can never equal a decoded 32-bit Age, so at genesis only Age = 0 passes and the code is exactly the GP rule","Age = 2^32 − 1: `a-1` wraps around in U32, so the age check passes and the judgments are verified against λ, whereas ⌊τ/E⌋ − N_2 has no previous epoch at epoch 0"],"answer":3,"explanation":"eq. 10.2：a ∈ ⌊τ/E⌋ − N_2 = {⌊τ/E⌋, ⌊τ/E⌋ − 1}；eq. 10.3：K(a) = κ 當 a = ⌊τ/E⌋，否則 λ。在 genesis epoch，⌊τ/E⌋ = 0，「前一個 epoch」的 index 是 −1，不是自然數，所以唯一合法的 a 是 0。但這段 Go 把 a 宣告成 U32，`a-1` 在 a = 0 時 wrap 成 4294967295；序列化上 a 是 E_4（附錄 C 的 E_D 編碼：(r, E_4(a), var[j])），所以 Age = 0xFFFFFFFF 是 fuzzer 完全做得出來的輸入——它通過 age 檢查、`Age == a` 為假 → 用 λ 驗簽。若簽章確實由 λ 的 key 產生（genesis 時 λ 通常等於 κ），你們會接受一個 reference implementation 會拒絕的區塊 → state root 分歧。這正是 #1042 整合 PR 補的「genesis-epoch guard」。其他說法：Age = 1 既不等於 0 也不等於 0xFFFFFFFF，會被拒；Age = 0 走的是 `Age == a` → κ，不是 λ；「wraparound 永遠對不上」是錯的，U32 之間的比較就是會相等。","trap":"用 unsigned 減 1 之前先想 a = 0；GP 的 ⌊τ/E⌋ − N_2 沒有負數，也沒有 2^32 − 1。"},{"id":"ch10-code-fault-equivalence-wonky","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.7 — internal/extrinsic/fault_controller.go VerifyReportHashValidty","difficulty":3,"kind":"code","tags":["disputes","code","faults","edge-case"],"stem":"In this block a verdict classifies report r as wonky (exactly ⌊|k|/3⌋ positive judgments), so r ∈ ψ′_W and r ∉ ψ′_G ∪ ψ′_B. E_F also carries a fault (r, ⊥, k, s) with a correct signature from a κ ∪ λ key that is not in ψ_O. Per GP 0.8.0 eq. 10.7, is the block valid — and what does this code do with it?","code":{"lang":"go","caption":"internal/extrinsic/fault_controller.go (FaultController.VerifyReportHashValidty)","src":"func (f *FaultController) VerifyReportHashValidty() error {\n    posteriorStates := blockchain.GetInstance().GetPosteriorStates()\n    psiBad := posteriorStates.GetPsiB()\n    psiGood := posteriorStates.GetPsiG()\n    // ... badMap / goodMap are filled from psiBad / psiGood ...\n    length := len(f.Faults)\n    for i := 0; i < length; i++ {\n        vote := f.Faults[i].Vote\n        // if vote not contradict verdict, should not be in faults\n        inGood := goodMap[f.Faults[i].Target] && !badMap[f.Faults[i].Target]\n        inBad := !goodMap[f.Faults[i].Target] && badMap[f.Faults[i].Target]\n        if (vote && inGood) || (!vote && inBad) {\n            return errors.New(\"fault_verdict_wrong\")\n        }\n    }\n    return nil\n}"},"options":["Invalid, and the code rejects it too: with inGood = inBad = false both clauses collapse to the vote itself, so fault_verdict_wrong is returned for v = ⊥","Invalid: the equivalence forces r into exactly one of ψ′_B, ψ′_G, so a wonky report admits no fault for either v; the code nevertheless accepts it, since it only rejects (v ∧ good) or (¬v ∧ bad)","Valid only if v = ⊤ — a 'valid' vote on a report that is not in ψ′_G is the offense a fault documents — and the code rejects exactly that combination via inGood","Valid: v = ⊥ does not contradict a non-good verdict, so the fault stands, k enters ψ′_O and H_O; the code agrees, since neither inGood nor inBad is set for a wonky target"],"answer":1,"explanation":"eq. 10.7 是三向等價：r ∈ ψ′_B ⇔ r ∉ ψ′_G ⇔ v。真值表：r 是 bad → (⊤ ⇔ ⊤ ⇔ v) → v 必須是 ⊤（offender 對壞 report 投 valid）；r 是 good → (⊥ ⇔ ⊥ ⇔ v) → v 必須是 ⊥（對好 report 投 invalid）；r 是 wonky 或根本沒被判過 → r ∈ ψ′_B 為 ⊥、r ∉ ψ′_G 為 ⊤，前兩項就不等價，無論 v 為何都不成立 → 區塊無效。直覺：wonky 表示「無法判定」，沒有人能被證明投錯票，所以 wonky verdict 只會清 ρ†（eq. 10.14），不會產生 offender。這段 Go 只在 (vote ∧ inGood) 或 (¬vote ∧ inBad) 時回 fault_verdict_wrong；wonky 時 inGood = inBad = false，兩個子句都是 false → 直接放行，k 還會被 UpdatePsiO 寫進 ψ′_O 並出現在 H_O——與 reference 分歧。#1042 的「fault equivalence enforcement」就是補這個洞。「v = ⊤ 才是 offense」只對 bad report 成立；「v = ⊥ 不矛盾所以有效」忽略了等價式要求 r 必須落在 ψ′_B 或 ψ′_G 其中之一。另外 k 的來源也有限制：k ∈ {κ ∪ λ 的 Ed25519 key} \\ ψ_O（prior），已在 punish-set 裡的 key 不能再報（你們回 offender_already_reported）。","trap":"fault 只能指向 good 或 bad 的 report；wonky 沒有 offender，只有 ρ† 清除。"},{"id":"ch10-report-hash-identity","ch":"10","section":"10.1 The State","gpRef":"eq. 10.1, 10.6, 10.14; cf. eq. 11.28","difficulty":2,"kind":"rationale","tags":["disputes","rationale","hashing"],"stem":"ψ_G, ψ_B, ψ_W, every judgment message, every culprit proof and the ρ† clearing rule (eq. 10.14) all identify the disputed item by one 32-byte hash. Which hash is it, and why is that the right identity for a dispute?","options":["H(E(g)) — the hash of the whole guarantee including its credential and slot, so that the guarantors who signed are bound into the judged object and culprits can be derived from the verdict alone","The erasure root (w_s)_u, because a dispute is ultimately about whether the erasure-coded bundle behind the report reconstructs to valid data, which is what auditors re-execute","H(E(w)) — the hash of the encoded work-report: it is exactly what guarantors signed (X_G ⌢ H(w)), so a culprit proof is the original guarantee signature, and eq. 10.14 matches cores via H((ρ[c]_g)_w)","The work-package hash (w_s)_h: the package is the unit of work, so judging it bans every report ever made of that package, and eq. 10.14 compares the package hash held in ρ[c] against the verdict"],"answer":2,"explanation":"§10.1：ψ_G/ψ_B/ψ_W 是「the hashes of all work-reports」；eq. 10.14 用 H((ρ[c]_g)_w)——取 assignment 裡的 guarantee、再取其中的 work-report 來 hash——去比對 verdict。為什麼是 report 而不是 package？dispute 爭的是「這份宣稱的結果」是否正確：同一個 package 可能被不同 guarantor 產生不同的 report（一份對、一份錯），package hash 只承諾輸入，無法區分。為什麼不含 credential？eq. 10.6 的 culprit 簽章是 Ed25519_k(X_G ⌢ r)，而 eq. 11.28 的 guarantee 簽章是 Ed25519(X_G ⌢ H(w))——訊息完全相同，所以 culprit proof 就是 guarantor 當初的簽章本身（這也是 0.8.0 #494 把整個 guarantee 存進 ρ 的理由之一：「the guarantor signatures are needed to construct a disputes extrinsic」）；若 hash 包含 credential，同一份 report 換一組簽章就變成另一個「物件」，auditor 的 judgment 也無法獨立於簽署者計算。erasure root 只承諾資料可用性，不是計算結果。你們 ClearWorkReports 正是 `encoder.Encode(&priorStatesRho[i].Report)` 再 Blake2b——hash 的是 report，不是整個 assignment (g, t)。","trap":"三處同一個 hash：judgment 訊息 X_valid/X_invalid ⌢ H(w)、culprit 訊息 X_G ⌢ H(w)、ρ† 清除 H((ρ[c]_g)_w)。"},{"id":"ch11-rho-pipeline-worked","ch":"11","section":"11.2 Package Availability Assurances / 11.5 Transitioning for Reports","gpRef":"eq. 11.16–11.18, 11.32, 11.46","difficulty":3,"kind":"concept","tags":["assurances","guarantees","calc","tiny","timeout"],"stem":"Tiny config (|κ| = 6, U = 5), one core c = 0, no disputes. Block at slot 40: E_G carries guarantee g₁ for core 0. Block at slot 42: E_A has 4 assurances with bit 0 set. Block at slot 45: E_A has 3 assurances with bit 0 set and E_G carries an otherwise-valid guarantee g₂ for core 0. After the slot-45 block, what are ρ‡[0] and ρ′[0], and is g₁'s report ever accumulated?","options":["ρ‡[0] = ∅ because the cumulative 7 assurances made the report available; it accumulates in this block and ρ′[0] = (g₂, 45)","ρ‡[0] = (g₁, 40): the timeout only fires once H_T > t + U, i.e. from slot 46, so g₂ is rejected as core_engaged","ρ‡[0] = ∅ because 45 ≥ 40 + U; g₁'s report never enters R and is dropped without accumulation; g₂ is accepted, so ρ′[0] = (g₂, 45)","ρ‡[0] = (g₁, 40): the 4 + 3 = 7 assurances gathered so far exceed the threshold of 5, so the report is in R and accumulates, while g₂ is rejected as core_engaged"],"answer":2,"explanation":"逐塊推演。slot 40：eq. 11.46 → ρ′[0] = (g₁, 40)（timestamp 是 τ′，不是 g₁ 裡的 t）。slot 42：eq. 11.17 的 R 只數**本塊** E_A：Σ_{a ∈ E_A} a_f[0] = 4，門檻是 > 2/3·6 = 4，需 ≥ 5 → 不可用；eq. 11.18 的 timeout 檢查 42 ≥ 40 + 5 為假 → ρ‡[0] = ρ′[0] = (g₁, 40)。slot 45：本塊只有 3 個 assurance → 仍不可用（state 裡沒有跨塊的計數器，ρ 只存 (g, t)，assurer 必須每塊重送，直到某一塊單獨過門檻）；但 45 ≥ 40 + 5 成立 → ρ‡[0] = ∅；g₁ 的 report 從未進入 R，就這樣消失、不 accumulate（§11 開頭：「timed-out, implying it may be replaced by another report without accumulation」）。接著 eq. 11.32 用 ρ‡ 檢查 core：ρ‡[0] = ∅ → g₂ 合法 → ρ′[0] = (g₂, 45)。「4 + 3 = 7」的兩個說法錯在把 assurance 跨塊累加；「H_T > t + U」錯在比較子：eq. 11.18 是 ≥，slot 45 就 timeout。附註：slot 45 的三個 assurance 仍合法，因為 eq. 11.16 只要求 ρ†[0] ≠ ∅（timeout 在 ρ‡ 才生效）。你們 FilterAvailableReports：`headerTimeSlot >= AssignedSlot + WorkReportTimeout`，UpdateNewlyAvailableWorkReports 只統計當塊 extrinsic——與 GP 一致。","trap":"assurance 不累積；timeout 用 ≥；timeout 的 report 不 accumulate，但 core 同一塊就可再用——這正是 ρ‡ 存在的理由。"},{"id":"ch11-guarantee-slot-window-calc","ch":"11","section":"11.4 Work Report Guarantees","gpRef":"eq. 11.28","difficulty":2,"kind":"concept","tags":["guarantees","rotation","calc"],"stem":"Full config (R = 10). The block being imported has τ′ = 57. For a guarantee g = (w, t, a) in E_G, which values of t are acceptable under eq. 11.28, and which assignment (M or M*) verifies the credential for each?","options":["t ∈ [50, 57] only — the current rotation, all verified against M — because M* is consulted solely when the previous rotation lies in the previous epoch","t ∈ [47, 57] — a sliding window of R slots ending at τ′; t ∈ [47, 49] is verified against M* and t ∈ [50, 57] against M; t = 46 is rejected as too old","t ∈ [40, 59] — the whole previous and current rotation — with t > τ′ allowed since guarantees may be produced before the block that includes them","t ∈ [40, 57]: t ∈ [40, 49] is verified against M* (rotation index 4) and t ∈ [50, 57] against M (rotation index 5); t = 39 and t = 58 are both rejected"],"answer":3,"explanation":"eq. 11.28 第三行：R·(⌊τ′/R⌋ − 1) ≤ t ≤ τ′。⌊57/10⌋ = 5 → 10·(5 − 1) = 40，所以 40 ≤ t ≤ 57，共 18 個 slot（前一整個 rotation + 本 rotation 到目前為止）。選集合的規則：(c, k) = M 當 ⌊τ′/R⌋ = ⌊t/R⌋，否則 M*。t ∈ [50, 57] → ⌊t/10⌋ = 5 = ⌊57/10⌋ → M = (P(|κ′|, η′_2, 57), Φ(κ′))；t ∈ [40, 49] → ⌊t/10⌋ = 4 → M* = (P(|k|, e, τ′ − R = 47), Φ(k))，而 ⌊47/600⌋ = ⌊57/600⌋，所以 (k, e) = (κ′, η′_2)，rotation index ⌊47/10⌋ = 4。「滑動視窗 [47, 57]」錯：下界是對齊 rotation 的 R·(⌊τ′/R⌋ − 1)，不是 τ′ − R；「只有本 rotation」錯：M* 在每個 rotation 邊界都會用到，不只 epoch 邊界；「[40, 59]」錯：t ≤ τ′，未來 slot 不行。你們 ValidateSignatures：`(int(tau)/RotationPeriod-1)*RotationPeriod <= slot` 否則 ReportEpochBeforeLast、`slot <= tau` 否則 FutureReportSlot、`tau/R == slot/R` 決定 GFunc 或 GStarFunc——完全對應。","trap":"下界是 rotation 對齊的 R(⌊τ′/R⌋−1)，不是 τ′−R；τ′ = 57 時可回溯 17 個 slot，τ′ = 50 時也是只回到 40。"},{"id":"ch11-rotation-epoch-boundary-mstar","ch":"11","section":"11.3 Guarantor Assignments","gpRef":"eq. 11.23, 11.28","difficulty":3,"kind":"calc","tags":["guarantees","rotation","calc","epoch-boundary"],"stem":"Full config (E = 600, R = 10). A block at τ′ = 603 includes a guarantee with t = 595. Which assignment must its credential be checked against?","options":["M* = (P(|κ′|, η′_2, 593), Φ(κ′)): the previous rotation always uses the current epoch's entropy and set, only the rotation index differs","The guarantee is invalid: a guarantee may not straddle an epoch boundary because the validator set may have changed","M = (P(|κ′|, η′_2, 603), Φ(κ′)) at rotation index 0, because t is within R slots of τ′","M* = (P(|λ′|, η′_3, 593), Φ(λ′)): the previous rotation (index 59) belonged to the previous epoch, so it is recomputed from λ′ and η′_3"],"answer":3,"explanation":"先看視窗：R(⌊603/10⌋ − 1) = 590 ≤ 595 ≤ 603 ✓。再看 rotation：⌊603/10⌋ = 60 ≠ ⌊595/10⌋ = 59 → 用 M*（eq. 11.28 的 otherwise）。eq. 11.23：(k, e) = (κ′, η′_2) 當 ⌊(τ′ − R)/E⌋ = ⌊τ′/E⌋，否則 (λ′, η′_3)；⌊593/600⌋ = 0 ≠ ⌊603/600⌋ = 1 → (λ′, η′_3)，M* = (P(|λ′|, η′_3, 593), Φ(λ′))，P 內的 rotation index 是 ⌊(593 mod 600)/10⌋ = 59。為什麼這樣才對：epoch 換屆時 λ′ = κ（eq. 6.14）、η′_3 = η_2（eq. 6.24），正好是上個 epoch 期間算 M 所用的 (κ′, η′_2)，所以 M* 精確重現 rotation 59 的分配；換屆後 η′_2 已是新 epoch 的 entropy，拿它配 λ′ 或 κ′ 都算不出當時的分配。「t 在 R 個 slot 內就用 M」錯：判準是 rotation index 是否相同，不是距離。「跨 epoch 不允許」錯：GP 明講可用前一個 rotation 的 t，M* 就是為此存在。注意 0.8.0 額外要求：即使用 M*，w_c 仍須 < |κ′|/3（posterior set）——「Use of an inactive core is not permitted even if a timeslot in the previous rotation is used and the core was active then」；且 Φ 用的是 ψ′_O，本塊新抓到的 offender 在 λ′ 裡也會被 null 掉。你們 GStarFunc：`(tau − R)/E == tau/E` 選 (η′_2, κ′) 否則 (η′_3, λ′)，再以 tau − R 呼叫 NewGuranatorAssignments——一致。","trap":"M* 的 entropy/set 由 τ′ − R 落在哪個 epoch 決定；(λ′, η′_3) 這組合只在 epoch 開頭的第一個 rotation 出現。"},{"id":"ch11-code-permute-080","ch":"11","section":"11.3 Guarantor Assignments","gpRef":"eq. 11.20–11.22 — internal/extrinsic/guarantor_assignments.go permute","difficulty":2,"kind":"code","tags":["guarantees","shuffle","code","delta-0.8.0"],"stem":"This is the team's P (GP 0.7.2). Under GP 0.8.0 (eq. 11.20–11.21), what changes when the validator sequence has |κ′| = 9 in a chain with C = 341 cores?","code":{"lang":"go","caption":"internal/extrinsic/guarantor_assignments.go (rotateCores, permute)","src":"// (11.19) R(c, n) = [(x + n) mod C | x ∈ c]\nfunc rotateCores(in []types.U32, n types.U32) []types.U32 {\n    out := make([]types.U32, len(in))\n    for i, x := range in {\n        out[i] = (x + n) % types.U32(types.CoresCount)\n    }\n    return out\n}\n\n// (11.20)\nfunc permute(e types.Entropy, currentSlot types.TimeSlot) []types.CoreIndex {\n    base := make([]types.U32, types.ValidatorsCount)\n    for i := 0; i < types.ValidatorsCount; i++ {\n        c := (types.CoresCount * i) / types.ValidatorsCount\n        base[i] = types.U32(c)\n    }\n\n    shuffled := shuffle.Shuffle(base, types.OpaqueHash(e))\n\n    subEpoch := (int(currentSlot) % types.EpochLength) / types.RotationPeriod\n\n    // R(...) call\n    rotatedU32 := rotateCores(shuffled, types.U32(subEpoch))\n    ..."},"options":["0.8.0 builds the base [⌊i/3⌋ | i ∈ N_9] = [0,0,0,1,1,1,2,2,2] and rotates modulo |κ′|/3 = 3; this code builds ⌊341·i/9⌋ = [0, 37, 75, …, 303] and rotates modulo 341, scattering guarantors over inactive cores","Nothing observable: ⌊C·i/V⌋ and ⌊i/3⌋ coincide for every validator count permitted by eq. 6.8, and mod C equals mod V/3 for the same reason, so only the constant names differ between the versions","0.8.0 keeps ⌊C·i/V⌋ = [0, 37, 75, …, 303] as the base but changes the rotation modulus from C to E/R = 60, the number of rotations per epoch, so the shuffle output cycles once per epoch","0.8.0 replaces the Fisher–Yates shuffle by a plain rotation of the identity assignment [0, 1, 2, …, 8] modulo |κ′|/3, removing the dependence on η′_2 so that assignments are known a whole epoch ahead"],"answer":0,"explanation":"eq. 11.21：P(v, e, t) = R(F([⌊i/3⌋ | i ∈ N_v], e), ⌊(t mod E)/R⌋)；eq. 11.20：R(c, n) = [(x + n) mod (|c|/3) | x ∈ c]。0.8.0 的邏輯是「每個 core 3 個 guarantor，所以只有前 |κ′|/3 個 core 是 active」（§11.3）；|κ′| = 9 → base = [0,0,0,1,1,1,2,2,2]，用 η′_2 做 Fisher–Yates 後 rotation 取 mod 3。你們 permute 是 0.7.2 的 ⌊C·i/V⌋ 加 `% CoresCount`：i = 0..8 → ⌊341·i/9⌋ = [0, 37, 75, 113, 151, 189, 227, 265, 303]，再 mod 341——把 guarantor 分到 inactive core，且每個 core 只有 1 人，永遠湊不到 2 個簽章。為什麼現在 test vectors 都過？因為 tiny (6, 2) 與 full (1023, 341) 都滿足 V = 3C：⌊2i/6⌋ = ⌊341i/1023⌋ = ⌊i/3⌋，且 mod C = mod V/3，兩式完全重合；一旦 0.8.0 eq. 6.8 允許的其他 |κ| ∈ {3c} 出現就分歧（issue #1037「support variable validator-set size」）。「只是常數改名」錯在此；「rotation modulus 改成 E/R」混淆了每 epoch 的 rotation 次數（60）與 core 數；「改成 identity 不 shuffle」錯：F 與 η′_2 都還在（用 η′_2 而非 η′_1 是為了避免 fork magnification）。","trap":"0.8.0 的 base 與 modulus 都只看 |κ′|（⌊i/3⌋、mod |κ′|/3），C 只在 ρ 的長度出現。"},{"id":"ch11-code-anchor-checks-080","ch":"11","section":"11.4.1 Contextual Validity of Reports","gpRef":"eq. 11.36, 11.38 — internal/extrinsic/guarantee_controller.go ValidateContexts","difficulty":2,"kind":"code","tags":["guarantees","context","code","delta-0.8.0"],"stem":"This is the team's refinement-context validation (GP 0.7.2). Which conditions required by GP 0.8.0 eq. 11.36 (anchor) and eq. 11.38 (lookup anchor) are missing from it?","code":{"lang":"go","caption":"internal/extrinsic/guarantee_controller.go (GuaranteeController.ValidateContexts)","src":"for _, context := range contexts {\n    recentAnchorMatch := false\n    stateRootMatch := false\n    beefyRootMatch := false\n    for _, blockInfo := range betaDagger {\n        // xa = yh\n        if context.Anchor == blockInfo.HeaderHash {\n            recentAnchorMatch = true\n            // xs = ys\n            stateRootMatch = (context.StateRoot == blockInfo.StateRoot)\n            // xb = yb\n            beefyRootMatch = context.BeefyRoot == types.BeefyRoot(blockInfo.BeefyRoot)\n            break\n        }\n    }\n    ...\n}\n// 11.35   ancestors currently not maintained\nancestry := blockchain.GetInstance().GetAncestry()\nif len(ancestry) > 0 {\n    for _, context := range contexts {\n        anchorHashCondition := false\n        for _, item := range ancestry {\n            cond1 := item.Slot == context.LookupAnchorSlot\n            cond2 := item.HeaderHash == context.LookupAnchor\n            if cond1 && cond2 {\n                anchorHashCondition = true\n                break\n            }\n        }\n        ..."},"options":["Nothing beyond renaming BeefyRoot to the accumulation-output super-peak b, with the new BlockInfo timeslot being informational only; both anchor tuples are otherwise identical to 0.7.2","Anchor: drop the state-root comparison because 0.8.0 anchors carry a timeslot instead of a state root; lookup anchor: check only l_t ≥ H_T − L, since the ancestor-set requirement was removed in 0.8.0","Anchor: the context's anchor timeslot must also equal the β† entry's timeslot (x_t = y_t); lookup anchor: the child header h′ (h′_p = H(h)) must carry h′_r = l_s, verifying the lookup anchor's posterior state root","Anchor: compare against β instead of β†, since 0.8.0 no longer patches the parent's state root into recent history; lookup anchor: unchanged, since the ancestor set already stores (slot, hash) pairs"],"answer":2,"explanation":"eq. 11.36（0.8.0）：∀x ∈ x：∃y ∈ β†：x_a = y_h ∧ x_s = y_s ∧ x_b = y_b ∧ x_t = y_t——四個等式，第四個 timeslot 是 #526 新增（β 的每筆 entry 在 0.8.0 也多了 timeslot，eq. 7.2/7.8；你們 #1031 加了 BlockInfo.timeslot）。eq. 11.38（0.8.0）：∃h, h′ ∈ A：h_t = l_t ∧ H(h) = l ∧ h′_p = H(h) ∧ h′_r = l_s——lookup anchor 的 posterior state root l_s 沒辦法從 h 自己讀到（header 只帶 prior state root H_R），所以透過它的子塊 h′ 的 H_R 來驗。這段 Go 只比對 Anchor/StateRoot/BeefyRoot（三項）以及 ancestry 的 (slot, hash)（兩項），缺 x_t = y_t 與 h′_r = l_s；#1027 加了 anchor_slot 與 lookup_anchor_state_root 兩個欄位，驗證邏輯也要跟上。其他選項：β† 仍然必要——它把父塊 entry 的 state root 換成本塊的 H_R（eq. 7.5），否則以父塊為 anchor 的 report 沒有正確的 state root 可比；state root 比對沒有被拿掉；「只是改名」忽略了新增的兩個欄位。","trap":"0.8.0 的 anchor 比四項（hash、state root、super-peak、slot）；lookup anchor 比三項，其中 l_s 要靠子塊的 H_R。"},{"id":"ch11-lookup-anchor-ancestry","ch":"11","section":"11.4.1 Contextual Validity of Reports","gpRef":"eq. 11.37–11.38","difficulty":2,"kind":"concept","tags":["guarantees","context","fuzzer"],"stem":"Why can the lookup-anchor requirement (eq. 11.38) not be checked from the on-chain state σ alone, and how does the conformance fuzzer make it checkable for an M1 target?","options":["It needs the full posterior state of the lookup-anchor block in order to recompute its state root r, which the fuzzer supplies on demand through GetState messages while the block is being imported","It needs the headers of the last L slots (the ancestor set, not part of σ), deterministic from the header chain; the fuzzer's Initialize message therefore carries an ancestry list of (slot, header hash), a mandatory M1 feature","It only needs β, the last H = 8 blocks, whose entries carry a header hash, a state root and a timeslot, so the check is purely on-chain; the fuzzer merely replays enough blocks to fill β before it submits any guarantees","The fuzzer skips it: 0.8.0 made the lookup anchor optional in the refinement context, so only the age bound l_t ≥ H_T − L is exercised by the vectors and no ancestry list is transmitted at Initialize"],"answer":1,"explanation":"§11.4.1 原文：「this is one of the few conditions which cannot be checked purely with on-chain state and must be checked by virtue of retaining the series of the last L headers as the ancestor set. Since it is determined through the header chain, it is still deterministic and calculable.」eq. 11.37 只用 H_T 與 l_t 比（l_t ≥ H_T − L，L = 14,400 slots = 24 小時）；eq. 11.38 則要在祖先集合裡找到 h（h_t = l_t、H(h) = l）及其子塊 h′（h′_p = H(h)、h′ 的 prior-state-root = r）。這個集合不在 σ 裡：β 只有 H = 8 筆，而 lookup anchor 允許回溯 L = 14,400 個 slot（24 小時），差了三個數量級；β 的每筆在 0.8.0 雖然確實帶了 header hash、state root、accumulation-output super-peak 與 timeslot（eq. 7.2），覆蓋範圍仍遠遠不夠，而且 eq. 11.38 還要比對 lookup anchor **子塊** header 的 prior-state-root，那是 β 沒有的資訊。Conformance fuzzer 因此把 Ancestry 列為 M1 必備 feature（「lookup anchors in guarantees are within last L imported headers」），Initialize（SetState）訊息附帶 ancestry 陣列，之後每次成功 import 再 append——這就是 #853/#854「add ancestry to store and fix guarantee slot validation」與 #892 的來源。你們 ValidateContexts 只在 `len(ancestry) > 0` 時比對 (slot, hash)，否則跳過（錯誤碼 LookupAnchorNotRecent）。「需要 lookup-anchor 的完整 state 並靠 GetState 現取」錯：eq. 11.38 只比對 header 欄位（h_t、H(h)、子塊的 h′_p 與 h′_r），根本不必重算 state root，而 fuzzer 的 GetState 是匯入完成後的稽核介面，不是匯入途中的隨選查詢。「0.8.0 讓 lookup anchor 變成可選、所以只驗年齡上限」錯：eq. 11.4 的 ℂ 一定帶 l、t、r 三個 lookup-anchor 欄位，eq. 11.38 是硬性條件，0.8.0 反而還多要求了 posterior state root r。","trap":"anchor 靠 β†（state 內），lookup anchor 靠祖先 header（state 外）；兩者的年齡上限不同：H = 8 塊 vs L = 14,400 slots。"},{"id":"ch11-prerequisite-window","ch":"11","section":"11.4.1 Contextual Validity of Reports","gpRef":"eq. 11.42","difficulty":3,"kind":"concept","tags":["guarantees","dependencies","edge-case"],"stem":"A work-report in E_G lists prerequisite p. Package p was guaranteed 10 blocks ago and accumulated 8 blocks ago, so p ∈ ξ but p no longer appears in any entry of β (H = 8). Is the guarantee valid?","options":["Valid at guarantee time, but the report is parked in the ready queue ω until p is reported again inside the recent-history window, because eq. 11.42 is re-evaluated during accumulation","Invalid (dependency_missing): eq. 11.42 requires every prerequisite to be guaranteed in the very same block, so only mutual and self dependencies are admissible and β is never consulted","Invalid (dependency_missing): eq. 11.42 admits a prerequisite only if it is in this block's E_G or among the reported-package sets of β; ξ is not consulted at guarantee time","Valid: p ∈ ξ proves the package was accumulated, and eq. 11.42 accepts ξ alongside the extrinsic and β, so the dependency holds and the report accumulates as soon as it is available"],"answer":2,"explanation":"eq. 11.42：∀w ∈ I, ∀p ∈ (w_x)_p ∪ keys(w_l)：p ∈ p ∪ {x | x ∈ keys(b_p), b ∈ β}——prerequisite（以及 segment-root lookup 的 key）只能來自本塊 E_G 的 package hash 集合 p，或 β 各 entry 的 reported-package 字典（最近 H = 8 塊）。ξ（accumulated，保存 E 個 slot 的 accumulated package hash）完全沒有出現在這條式子裡；它是 §12 accumulation 端用來判斷 prerequisite 是否已滿足、決定 report 進 R* 還是留在 ω 的依據。所以「10 塊前 report、8 塊前 accumulate」的 p 已經掉出 β：新 report 在 guarantee 階段就被拒（你們回 DependencyMissing；test vectors 的 dependencies 案例分 mutual/self/from history 三種，「from history」指的就是 β）。設計意圖：pipeline 中相依的 package 應緊接著提交；β 同時提供 segment root（eq. 11.43–11.44）供 lookup 驗證，ξ 沒有 segment root。「eq. 11.42 也接受 ξ」把 §12 的規則搬到 §11：ξ 只在 accumulation 端判斷 prerequisite 是否已滿足，guarantee 階段的式子裡根本沒有它。「先進 ω 等 p 被重報、因為 11.42 在 accumulation 會重算」錯兩處：ω 只收已經通過 guarantee 檢查的 report，不存在「暫存等補件」的狀態；而 11.42 是 contextual validity，只在 guarantee 時判一次，accumulation 用的是 §12 的 Q/ξ 另一組規則。「必須同塊、β 從不被查」太嚴也違反原文：11.42 明列 β 各 entry 的 reported-package 字典，test vectors 的「from history」案例測的正是這條路徑。你們 CheckExtrinsicOrRecentHistory 的 checkPackageSet 正是 p ∪ β.History[].Reported。","trap":"guarantee 時看 β（8 塊），accumulate 時看 ξ（E 個 slot）；兩個視窗、兩個問題。"},{"id":"ch11-code-hash-prediction","ch":"11","section":"11.4.1 Contextual Validity of Reports","gpRef":"eq. 11.45","difficulty":3,"kind":"concept","tags":["guarantees","digest","edge-case"],"stem":"Service s upgraded its code after a work-package was built: the work-item's code hash c was correct at build time and refine ran the code available at the lookup anchor, but the including block's prior state has δ[s]_c ≠ c. What happens to the guarantee at inclusion?","options":["Accepted: c only records which code refine actually executed, resolved against the lookup anchor's posterior state, and accumulation then simply runs whatever δ′[s]_c holds at that time","Accepted, but the digest's result is overwritten on-chain with the BAD error, since the recorded code hash no longer resolves to a preimage the service still holds in its lookup dictionary","Rejected (bad_code_hash): eq. 11.45 demands d_c = δ[d_s]_c in the prior state of the including block, so a report refined against superseded code is discarded rather than accumulated","Accepted provided the lookup anchor is at most L = 14,400 slots old, because code availability is judged only at the lookup anchor and eq. 11.45 constrains the payload hash, not the code hash"],"answer":2,"explanation":"§11.1.4：「We include the hash of the code of the service at the time of being reported c, which must be accurately predicted within the work-report according to equation 11.45」；eq. 11.45：∀w ∈ I, ∀d ∈ w_d：d_c = δ[d_s]_c，δ 是 prior state。§14 的 work-item 也說 c 是「the code hash of the service at the time of reporting (whose preimage must be available from the perspective of the lookup anchor block)」——refine 執行的是這個 hash 在 lookup-anchor 視角下 historical lookup 到的 preimage，而鏈上檢查的是包含區塊當下的 δ[s]_c；兩者一旦因 service 升級而不同，guarantee 就無效（reports vectors 有 bad_code_hash 案例）。理由：accumulate 稍後會用當下的 code 執行，若 report 是用已被淘汰的 code 算出來的，不該進入 accumulation，而是讓 guarantor 重做。「c 只記錄執行了哪份 code、accumulate 直接用 δ′[s]_c」錯：eq. 11.45 是硬性等式，而且比對基準是**包含區塊的 prior 狀態** δ，既不是 lookup anchor 的狀態，也不是 posterior 的 δ′——正因為 c 是對「report 進鏈當下」的預測，它才有可能猜錯。「鏈上把 result 改寫成 BAD」錯：鏈上規則從不改寫 digest 的內容（report 是 guarantor 產生的既成事實，改寫會讓 report hash 對不上簽章）；BAD 是 refine 階段在 lookup-anchor 視角查不到 code preimage 時就寫進 digest 的值（eq. 11.7）。「只要 lookup anchor 在 L = 14,400 slot 內就好、11.45 管的是 payload hash」錯兩處：11.45 管的正是 d_c（code hash），payload hash 鏈上完全不檢查、只是原封不動傳給 accumulate；lookup-anchor 的年齡上限是另一條 eq. 11.37。你們 CheckWorkResult：`w.CodeHash != delta[w.ServiceID].ServiceInfo.CodeHash` → BadCodeHash，δ 取自 prior state。","trap":"digest 的 c 是「預測」：refine 用 lookup-anchor 的 code，鏈上卻比對 prior δ 的 code hash。"},{"id":"ch11-assurance-bitfield-packing","ch":"11","section":"11.2.1 The Assurances Extrinsic","gpRef":"eq. 11.11, 11.14; App. C bit-sequence encoding","difficulty":2,"kind":"calc","tags":["assurances","codec","calc"],"stem":"Full config (C = 341). An assurer sets only the bit for core 340. What does E(f) look like, and what exactly does the assurer sign?","options":["E(f) is 43 octets whose last octet is 0x10 (bit 4 of octet 42, packed LSB-first, no length prefix); the signature is over X_A ⌢ H(H_P ⌢ E(f)), i.e. a hash of 75 octets","E(f) is 341 octets, one per core, the last being 0x01 and no length prefix; the signature is over X_A ⌢ H_P ⌢ E(f) directly, i.e. 373 octets signed with no intermediate hash","E(f) is a length-prefixed sequence: the discriminator 0x2B followed by 43 octets ending in 0x10; the signature is over X_A ⌢ H(H_P ⌢ E(f)), i.e. a hash of 76 octets","E(f) is 43 octets whose last octet is 0x08 (bit 4 counted from the most significant end of octet 42, no length prefix); the signature is over X_A ⌢ H(H_P ⌢ E(f)), a hash of 75 octets"],"answer":0,"explanation":"附錄 C 的 bit sequence encoding：「pack the bits into octets in order of least significant to most」，且只有變長序列才加 length prefix；eq. 11.11 的 f ∈ bits[C] 是定長，所以 E(f) 就是 ⌈341/8⌉ = 43 個 octet、沒有前綴。core 340：340 = 42·8 + 4 → 第 43 個 octet（index 42）的 bit 4 → 0x10。若誤用 MSB-first 會算成 bit 7 − 4 = 3 → 0x08，這正是第一個干擾項的錯誤。「一 bit 一 byte、341 octets」違反編碼規則（bit sequence 一律 8 bits 打包成 1 octet），而且該項還把簽章訊息寫成直接簽 H_P ⌢ E(f) 這 373 個 octet——eq. 11.14 明確要先 Blake2b 再簽，否則訊息長度會隨 C 變動。「加 length prefix 0x2B」把定長序列當成變長：只有 ⟦·⟧ 這種變長序列才有 length discriminator，多出來的一個 octet 也會讓 hash 的 preimage 變成 76 而不是 75 個 octet。eq. 11.14：s ∈ Ed25519_{κ[v]_e}(X_A ⌢ H(E(H_P, f)))，X_A = $jam_available：先把 32-byte 的 H_P 與 43-byte 的 E(f) 串成 75 bytes 做 Blake2b，再把 32-byte 摘要接在 X_A 後面簽——不是直接簽 H_P ⌢ E(f)。你們的實作：AvailBitfieldBytes = 43（full）/ 1（tiny）；`ToOctetSlice`：`bytes[i/8] |= b << (i % 8)`（LSB-first）；ValidateSignature：`hash.Blake2bHash(append(anchor, bitfield...))` 後接在 JamAvailable 之後——與 GP 一致。tiny 兩個 core 都勾 = 0x03。","trap":"bit i 在 octet ⌊i/8⌋ 的第 (i mod 8) 位（LSB-first）；簽的是 hash 的 hash：X_A ⌢ Blake2b(H_P ⌢ E(f))。"},{"id":"ch11-inactive-core-set-shrink","ch":"11","section":"11.4 Work Report Guarantees","gpRef":"eq. 11.18, 11.23, 11.28, 11.31","difficulty":3,"kind":"delta","tags":["guarantees","assurances","delta-0.8.0","variable-validators"],"stem":"GP 0.8.0, C = 341, E = 600, R = 10. During epoch e the active set had |κ| = 12 (cores 0–3 active); at the epoch change the set shrinks to |κ′| = 9. The first block of the new epoch (τ′ = 600) carries a guarantee for core 3 with t = 595, signed by the three validators that M* assigns to core 3. Which statement is correct?","options":["Invalid: eq. 11.28 bounds w_c by |κ′|/3 = 3 even under M*, so core 3 is now inactive; eq. 11.31 wants (w_s)_v = |κ′| = 9, not the 12 chunks the report carries; and eq. 11.18 has already emptied ρ‡ because |κ| ≠ |κ′|","Valid: M* reproduces the previous rotation's assignment, under which core 3 was active and 12 chunks were the right shard count; eq. 11.28's core bound is read against whichever set M* selects, and ρ‡ survives an epoch change untouched","Invalid only because the signers come from λ′: eq. 11.23 lets M* fall back to the previous epoch's keys for assurances alone, so a guarantee in an epoch's first block needs κ′ signatures and w_c may be any core below C/3","Valid, but ρ′[3] is stamped with the guarantee's own slot t = 595 instead of τ′ = 600, so eq. 11.18's H_T ≥ t + U already holds at slot 600 and the assignment is dropped in the very block that created it"],"answer":0,"explanation":"這題把 0.8.0 因「validator 數可變」（eq. 6.8：|κ| ∈ {3c}）而新增的三條規則放在一起。(1) eq. 11.28：c[v] = w_c < |κ′|/3——用 **posterior** κ′ 的大小，且 GP 明說「Use of an inactive core is not permitted even if a timeslot in the previous rotation is used and the core was active then」，所以 core 3（|κ′|/3 = 3 → active 只有 0–2）即使透過 M* = (P(|λ′|, η′_3, 590), Φ(λ′)) 找得到合法簽署者也不行。(2) eq. 11.31：(w_s)_v = |κ′| = 9——每個 assurer 拿一個 chunk，chunk 數必須等於新的 assurer 數；為 12 個 validator 編的 report 對不上。(3) eq. 11.18：|κ| ≠ |κ′| 時 ρ‡ 全部清空（「Items cleared in this way can be viewed as having timed out early」）——舊集合留下的 pending report 也無法再被新集合 assure。「M* 重現當時分配所以有效、core 上限跟著 M* 選到的集合走、ρ‡ 換屆不受影響」只答對了簽章那一半：M/M* 決定的是「誰有資格簽」，而 eq. 11.28 的 w_c < |κ′|/3 這個上限永遠用 posterior 的 κ′，GP 還特別加了一句「Use of an inactive core is not permitted even if a timeslot in the previous rotation is used and the core was active then」；ρ‡ 也不是不受影響，eq. 11.18 的 |κ| ≠ |κ′| 條件正是為此而設。「ρ′ 用 t = 595 所以當場逾時」錯：eq. 11.46 的 timestamp 永遠是 τ′ = 600，600 ≥ 605 不成立，不會當場被清。「必須由 κ′ 簽、M* 只用於 assurances」錯兩處：eq. 11.23 定義的 M* 就是 **guarantor** 在上一個 rotation 的分配，跨 epoch 時取 (λ′, η′_3)，所以 λ′ 成員簽名完全合法；而 core 上限是 |κ′|/3，不是 C/3。0.7.2 沒有這些問題（V = 1023 = 3C 固定），你們 0.7.2 的 FilterAvailableReports 也沒有 size-change 條件（#1027 review 才補上），|κ′|/3 的 core 上限與 (w_s)_v = |κ′| 亦是 #1016/#1037 的範圍。","trap":"0.8.0 三個「跟著 |κ′| 走」的地方：active core 數 |κ′|/3、erasure shard 數 |κ′|、|κ| ≠ |κ′| 就清 ρ‡。"},{"id":"ch13-counter-deltas-calc","ch":"13","section":"13.1 Validator Activity","gpRef":"eq. 13.4–13.6 (π_V†, π_V‡, π′_V); eq. 11.28 (reporters set G)","difficulty":2,"kind":"concept","tags":["statistics","validator-stats","calc"],"stem":"A block in the middle of an epoch (e′ = e) has author index H_I = 3. Its extrinsic contains E_T with 2 tickets, E_P with one preimage of 500 octets, E_A with assurances signed by validators 1 and 2, and E_G with one guarantee whose credential carries the signatures of validators 0 and 4. Which per-validator changes does π′_V show relative to π_V (counters b, t, p, d, g, a)?","options":["Validator 3: b+1, t+2, p+1, d+500; validators 1 and 2: a+1 each; validators 0 and 4: g+1 each; all other records unchanged","Validator 3: b+1, t+2, p+1, d+500, g+1, a+2 — every extrinsic the author includes is credited to the author; no other validator changes","Validator 3: b+1, p+1, d+500; the two validators who generated the tickets: t+1 each; validators 1 and 2: a+1 each; validators 0 and 4: g+1 each","Validator 3: b+1, t+2, p+1, d+1; validators 1 and 2: a+1 each; validators 0 and 4: g+1 each"],"answer":0,"explanation":"eq. 13.4：π_V†[v]_a = π_V[v]_a + (∃a ∈ E_A : a_v = v)——assurance 記在**簽署者**身上（validator 1、2 各 +1；存在性判斷，每人每塊最多 +1）。eq. 13.5：e′ = e（不在 epoch 邊界）所以 π_V‡ = π_V†、π_L 不變。eq. 13.6：b += (v = H_I)、t += |E_T|、p += |E_P|、d += Σ_{d∈E_P}|d| 都**只給 author** H_I = 3：b+1、t+2、p+1、d+500；g += (κ′[v] ∈ G)，G 是 eq. 11.28 的 reporters set——credential 裡有簽名的 validator 的 Ed25519 key——所以 validator 0、4 各 +1。結果：v0: g+1；v1、v2: a+1；v3: b+1, t+2, p+1, d+500；v4: g+1。「author 全包（g+1, a+2）」錯在 g 與 a 依**簽章**歸屬，author 只是把 extrinsic 打包進區塊；「d+1」錯在 d 是 preimage 的 octet 總數（500），p 才是筆數；「ticket 記給產生者」錯在 ticket 是匿名的 ring-VRF 證明，鏈上不知道誰產生，eq. 13.6 因此把 |E_T| 記給 H_I。你們 statistics.go：UpdateTicketStatistics / UpdatePreimageStatistics / UpdatePreimageOctetStatistics 只更新 authorIndex；UpdateReportStatistics 用 reporters set（κ′ 的 Ed25519 key 是否在集合內）；UpdateAvailabilityStatistics 用 assurance.ValidatorIndex。issue #710（0.7.0）修的就是「每個 validator 只算一次」，#869 修 guarantee 計數。","trap":"b/t/p/d 看 H_I；g/a 看簽章；每塊每人 g、a 最多各 +1（布林值，不是數量）。"},{"id":"ch13-why-statistics","ch":"13","section":"13.1 Validator Activity","gpRef":"§13.1 (intro paragraphs); §14.1 honest behavior; C(13) in App. D","difficulty":1,"kind":"rationale","tags":["statistics","rationale","staking"],"stem":"Why does the JAM chain keep validator activity statistics at all, and what does the GP say about the activities that cannot be measured directly on-chain?","options":["JAM pays validators directly: each block the STF debits a treasury service in proportion to π_V, exactly as it does for punishment; block production, guaranteeing and assurances are trackable on-chain, and so are GRANDPA, BEEFY and auditing, since every message a validator signs is eventually included in some block","JAM issues no rewards itself and the statistics exist only for telemetry (JIP-3) and RPC: π sits outside the consensus state and is not covered by the state root, as is the punishment record ψ; GRANDPA, BEEFY and auditing activity is therefore simply omitted rather than oracled to any external subsystem","JAM issues no rewards itself but oracles activity data to a staking subsystem, as it does with punishment data; block production, guaranteeing and assurances are trackable on-chain, whereas GRANDPA, BEEFY and auditing are not and are instead covered by validators voting on each other's efforts, with a median accepted under a 50%-honest assumption","JAM issues no rewards itself but feeds π into Safrole, which drops from ι′ any validator whose counters fall below a threshold; block production, guaranteeing and assurances are trackable on-chain, whereas GRANDPA and BEEFY activity is read straight from the header's finality field and auditing is covered by validators voting on each other's efforts"],"answer":2,"explanation":"§13.1 開頭：「The JAM chain does not explicitly issue rewards—we leave this as a job to be done by the staking subsystem (in Polkadot's case envisioned as a system parachain—hosted without fees…)」，JAM 只負責「facilitate the arrival of information on validator activity in to the staking subsystem」，如同 punishment（ψ_o offenders）資訊一樣是給外部子系統的 oracle。可直接鏈上追蹤的是 block production、guarantor reports、availability assurance（對應 π_V 的 b/t/p/d、g、a）；GRANDPA、BEEFY 與 auditing 則「cannot」，改由 validator 互評——「validators vote on their impression of each other's efforts and a median may be accepted as the truth」，並且「With an assumption of 50% honest validators, this gives an adequate means of oraclizing this information」。§14.1 的 honest behavior 清單最後一項正是「submitting the correct amount of auditing work seen being done by other validators」。其他選項的錯處：說 STF 每塊按 π_V 從 treasury service 直接發錢者，與 §13.1 第一句「The JAM chain does not explicitly issue rewards」正面牴觸，而且「validator 簽的每則訊息最終都會進區塊」也不成立——GRANDPA/BEEFY 的簽章根本不在 block 裡，這正是它們 untrackable 的原因。說 π 餵給 Safrole、counter 低於門檻就從 ι′ 剔除、GRANDPA/BEEFY 由 header 的 finality 欄位讀取者錯兩處：ι′ 來自 delegator service 的 accumulate 輸出（§12），與 π 無關；§5 的 header 欄位裡也沒有任何 finality 欄位。說 π 只是 telemetry（JIP-3）與 RPC、和 ψ 一樣不在共識狀態內、untrackable 的活動就直接略過者錯三處：π 是 App. D 的 C(13)、ψ（good/bad/wonky/offenders）是 C(5)，兩者都在 state root 底下（0.8.0 起 π_V/π_L 還帶長度前綴——你們 PR #1034）；而 untrackable 的部分並沒有被略過，GP 明說改用「validators vote on their impression of each other's efforts and a median may be accepted as the truth」來 oracle。","trap":"JAM 不發獎勵、不追蹤 GRANDPA/BEEFY/audit；這些靠 validator voting 的 median，假設只需 50% 誠實。"},{"id":"ch14-code-digest-mapping","ch":"14","section":"14.3 Packages and Items","gpRef":"eq. 14.10 (item-to-digest C); eq. 11.6 (D); eq. 13.10/13.17 — internal/work_package/work_package.go C","difficulty":2,"kind":"code","tags":["work-packages","digest","code"],"stem":"This is the team's item-to-digest function (GP 0.8.0 eq. 14.10, C). Which statement about it is correct?","code":{"lang":"go","caption":"internal/work_package/work_package.go (C; the '14.8' in the comment is the 0.7.2 number of eq. 14.10)","src":"// C (14.8)\nfunc C(item types.WorkItem, result types.WorkExecResult, gas types.Gas) types.WorkResult {\n    payloadHash := hash.Blake2bHash(item.Payload)\n    importCount := types.U16(len(item.ImportSegments))\n    extrinsicSize := types.U32(len(item.Extrinsic))\n    var zSum types.U16\n    for _, v := range item.Extrinsic {\n        zSum += types.U16(v.Len)\n    }\n    return types.WorkResult{\n        ServiceID:     item.Service,\n        CodeHash:      item.CodeHash,\n        PayloadHash:   payloadHash,\n        AccumulateGas: item.AccumulateGasLimit,\n        Result:        result,\n        RefineLoad: types.RefineLoad{\n            GasUsed:        gas,\n            Imports:        importCount,\n            ExtrinsicCount: item.ExportCount,\n            ExtrinsicSize:  extrinsicSize,\n            Exports:        zSum,\n        },\n    }\n}"},"options":["The code is correct: eq. 14.10 pins down only the payload hash, the accumulate gas limit, the import count and the gas used, leaving the three manifest counters x, z and e to whatever Ψ_R actually did, so any self-consistent assignment is acceptable provided the guarantors agree on the resulting report hash","AccumulateGas is the only defect: a digest's g must be the refine gas limit w_g, because the accumulation gas is decided on-chain by Δ+ rather than by the package; the payload hash H(w_y), the import count |w_i| and the three load counters x = |w_x|, z = Σ of the extrinsic lengths and e = w_e are all assigned correctly","Three load counters are rotated: eq. 14.10 sets x = |w_x| (number of extrinsics), z = Σ of the extrinsic lengths and e = w_e (declared export count), but the code puts w_e into ExtrinsicCount, |w_x| into ExtrinsicSize and the length sum into Exports — payload hash, accumulate gas limit, import count and gas used are right","The only defect is the payload hash: eq. 14.10 requires y = H(E(w)), the hash of the whole encoded work-item rather than of the payload alone, so PayloadHash must be taken over E(item); the accumulate gas limit, the import count and the three load counters x = |w_x|, z = Σ of the extrinsic lengths and e = w_e are all assigned correctly"],"answer":2,"explanation":"eq. 14.10 C：((s, c, y, a, e, i, x), l, u) ↦ (s, c, y ↦ H(y), g ↦ w_a, l, u, i ↦ |w_i|, e, x ↦ |w_x|, z ↦ Σ_{(h,z)∈w_x} z)。對照 code：Imports = len(ImportSegments) 正確、AccumulateGas = w_a 正確、PayloadHash = H(payload) 正確、GasUsed = u 正確；但 ExtrinsicCount 被塞了 item.ExportCount（應為 len(item.Extrinsic)）、ExtrinsicSize 被塞了 len(item.Extrinsic)（應為 Σ Len，也就是 zSum）、Exports 被塞了 zSum（應為 ExportCount）——三個欄位輪轉錯位。後果：digest 的 x/z/e 錯 → report hash 與其他實作不同（guarantor 簽章不一致）→ π_C 與 π_S（eq. 13.10、13.17 的 R(c)、R(s)）也錯。STF conformance fuzzer 沒抓到，因為 test vectors 直接提供現成的 work-report（code-map §5 第 16 點：這條路徑不在 STF 向量裡）。干擾項：payload hash 就是 H(w_y)——eq. 11.6 說 y「has no immediate relevance, but is something provided to the accumulation logic」；digest 的 g 是 **accumulate** gas limit w_a（鏈上 eq. 11.4x 檢查 Σ g ≤ G_A 與 ≥ service 的 minaccgas），refine 的實際用量是 u，w_g 只出現在 eq. 14.9 與 Ψ_R；eq. 14.10 是精確定義，沒有「任意一致的指定」——而且 e 是 work-item **宣告**的 w_e，實際 export 數不符時 I 函數（eq. 14.13）會給 ⊚ BADEXPORTS。三個干擾項還有一個共同破綻：它們都順帶宣稱 x、z、e 指派正確，但 code 裡 ExtrinsicCount 收的是 item.ExportCount、ExtrinsicSize 收的是 len(item.Extrinsic)、Exports 收的是 zSum——三個欄位整組輪轉，光憑這一點就足以把它們全部排除。","trap":"digest 五個負載欄位：u gas used、i imports、e exports、x extrinsic count、z extrinsic size——順序與名稱要背熟。"},{"id":"ch14-code-refine-args","ch":"14","section":"14.4 Computation of Work-Report","gpRef":"eq. B.5 (Ψ_R argument a and gas w_g); eq. B.1 (Ψ_I uses E_2(c)); eq. 14.9 (G_R) — PVM/refine_invocation.go RefineInvoke","difficulty":3,"kind":"code","tags":["work-packages","refine","pvm-invocation","code"],"stem":"Below is how the team's Ψ_R builds the argument blob a handed to Ψ_M. Which statement is correct under GP 0.8.0 (eq. B.5)?","code":{"lang":"go","caption":"PVM/refine_invocation.go (RefineInvoke, 0.7.2)","src":"    // otherwise\n    var a []byte\n    encoder := types.NewEncoder()\n    // c\n    encoded, _ := encoder.EncodeUint(uint64(input.CoreIndex))\n    a = append(a, encoded...)\n    // i\n    encoded, _ = encoder.EncodeUint(uint64(input.WorkItemIndex))\n    a = append(a, encoded...)\n    // w_s\n    encoded, _ = encoder.Encode(&workItem.CodeHash)\n    a = append(a, encoded...)\n    // |w_y| . w_y\n    encoded, _ = encoder.Encode(&workItem.Payload)\n    a = append(a, encoded...)\n    // H(p)\n    encoded, _ = encoder.Encode(&input.WorkPackage)\n    h := hash.Blake2bHash(encoded)\n    a = append(a, h[:]...)\n    // ... (host-call context `addition` elided)\n    result := Psi_M(StandardCodeFormat(code), 0, workItem.RefineGasLimit, a, RefineOmegas, addition)"},"options":["The final hash must be H(E(w)), the hash of the encoded work-item being refined, rather than H(p); and the gas limit handed to Ψ_M must be G_R = 5·10⁹, the per-package refine allowance, not one item's w_g — the compact c and i, the service index w_s and the length-prefixed payload are all correct","The third component of a must be the service index w_s as a compact natural, but the code appends the 32-octet code hash w_c; the compact c and i, the length-prefixed payload, H(p) over the encoded package and the gas limit w_g all match the GP","The core index must be encoded as E_2(c), two fixed octets, exactly as Ψ_I does, so the compact EncodeUint is wrong; the service index w_s, the compact i, the length-prefixed payload, H(p) over the encoded package and the gas limit w_g all match the GP","The payload must be appended without a length prefix because Refine obtains it through the fetch host-call instead, so the ↕ is spurious; the compact c and i, the service index w_s, H(p) over the encoded package and the gas limit w_g all match eq. B.5"],"answer":1,"explanation":"eq. B.5 Ψ_R(c, i, p, r, ī, ς)：a = E(c, i, w_s, ↕w_y, H(p))，code 由 E(↕z, code) = Λ(δ[w_s], (p_c)_t, w_c) 去掉 metadata 前綴取得，然後 (u, o, (m, e)) = Ψ_M(code, 0, w_g, a, F, (∅, []))。c、i、w_s 都是無下標的 E → 一般（compact）自然數編碼；w_y 帶長度前綴（↕）；H(p) 是整個 package 序列化後的 hash。你們的 code：c、i 用 EncodeUint（C.6 compact）正確；Payload 用 ByteSequence.Encode（帶長度）正確；H(p) = Blake2b(E(p)) 正確；gas 傳 workItem.RefineGasLimit（w_g）正確；但註解寫 w_s 的那行編的是 workItem.CodeHash——塞進去的是 32-byte 的 w_c，而不是 service index w_s（N_S，compact 編碼 1–5 bytes）。任何依 GP 解析 refine args 的 service 會把 code hash 的前幾個 byte 當 service id、後面全部錯位。0.7.2 與 0.8.0 的公式相同（0.7.1 才加入 c）。干擾項：E_2(c) 是 **Ψ_I**（eq. B.1：Ψ_M(p_u, 0, G_I, E_2(c), F, ∅)），Ψ_R 是 compact；H(p) 就是 package 的 hash（service 靠它辨識自己屬於哪個 package，work-item 內容可用 fetch selector 11–13 取得）；G_R = 5·10⁹ 是 eq. 14.9 的 **package 級** Σ w_g 上限，單一 item 的 gas 就是它宣告的 w_g；payload 的 ↕ 明確存在（fetch 13 只是另一個取得管道）。三個干擾項還共用一個破綻：它們都順帶宣稱 a 的第三段 w_s 指派正確，但那一行編進去的是 workItem.CodeHash（32 bytes 的 w_c），與 eq. B.5 的 compact w_s 對不上——光憑這一點就能把它們全部排除。","trap":"Ψ_I：E_2(c) + G_I = 50M；Ψ_R：E(c, i, w_s, ↕w_y, H(p)) + w_g（Σ w_g < G_R = 5·10⁹）。"},{"id":"ch14-compute-report-signature","ch":"14","section":"14.4 Computation of Work-Report","gpRef":"eq. 14.13–14.14 (Ξ, E, srlookup correspondence); eq. 14.17 (A with v); eq. 11.31","difficulty":3,"kind":"delta","tags":["work-packages","compute-report","delta-0.8.0"],"stem":"GP 0.8.0 redefines the work-report computation function Ξ. Which statement about its arguments and its failure condition E is correct?","options":["Ξ(p, c, l, v) takes the package, the core, a segment-root dictionary l keyed by work-ITEM index with one entry per import, and v, the number of guarantor signatures on the report (2 or 3); it yields ∇ only if the Is-Authorized result is not a blob of at most W_R octets or if the encoded report exceeds W_B = 13,791,360 octets","Ξ(p, c) as in 0.7.2 takes only the package and the core; the segment-root dictionary is read out of the on-chain state ρ during computation and the shard count is fixed at V = 1,023; it yields ∇ only if the Is-Authorized result is not a blob of at most W_R octets — a work-item whose Refine ends in ∞, ☇, BAD or BIG does not make Ξ fail","Ξ(p, c, l, v) takes the package, the core, a segment-root dictionary l (one entry per work-package hash referenced by an h⊞ import) and the assurer-set size v; it yields ∇ if the Is-Authorized result is not a blob of at most W_R octets, if keys(l) differ from the set of h⊞ hashes, or if any work-item's Refine ends in ∞, ☇, BAD or BIG, so that a guarantor never signs a report holding a failed item","Ξ(p, c, l, v) takes the package, the core, a segment-root dictionary l (one entry per work-package hash referenced by an h⊞ import) and the assurer-set size v; it yields ∇ only if the Is-Authorized result is not a blob of at most W_R octets or if keys(l) differ from the set of h⊞ hashes — a work-item whose Refine ends in ∞, ☇, BAD or BIG does not make Ξ fail"],"answer":3,"explanation":"eq. 14.13：Ξ: (P, N_C, ⟨H → H⟩, N_V) → ℝ ∪ {∇}，(p, c, l, v) ↦ ∇ if E，否則 (s, c ↦ p_c, c, a ↦ p_a, t, l, d, g)。其中 (t, g) = Ψ_I(p, c)——Is-Authorized 必須先跑，「to ensure that the work-package warrants the needed core-time」；E = t ∉ B_{:W_R} ∨ K(l) ≠ {h | w ∈ p_w, (h⊞, n) ∈ w_i}，也就是 Ψ_I 失敗（回傳 BAD/BIG/∞/☇ 等非 blob，或 trace 超過 W_R = 49,152）或 segment-root dictionary 的 key 集合不對。work-item 的 Refine 失敗（∞、☇、BAD、BIG、⊚ bad-exports、⊖ oversize）只會由 I 函數把該 digest 的 result 換成 error、exports 換成零 segment——「the work-package continues to be valid as a whole」。0.7.2 是 Ξ(p, c) 兩個參數，l 只以 keys(l) ≡ {…} 且 |l| ≤ 8 隱含定義；0.8.0（配合 #514 可變 validator 數）把 l 與 assurer 數 v 明確列為參數，v 再傳給 A（eq. 14.17–14.18）決定 erasure coding 的 shard 數，鏈上 eq. 11.31 要求 (w_s)_n = |κ′|。eq. 14.14：guarantor 要自行確認 l 的每一對 (h ↦ e) 真的對應（H(p) = h 且 Ξ(p, …)_s 的 segroot = e），否則「consider the work-package unable to be guaranteed」；auditor 直接沿用 report 裡的 l。干擾項逐一：說 Ξ 仍是 0.7.2 的兩參數版、l 從鏈上 ρ 讀出來、shard 數固定 V = 1,023 者錯三處——0.8.0 的 Ξ 有四個參數；l 是 **guarantor 自己組出來**、隨 report 上鏈供驗證的（ρ 只存各 core 上 pending 的 availability assignment，沒有別的 package 的 segment-root）；shard 數是參數 v，鏈上 eq. 11.31 要求 (w_s)_n = |κ′|，#514 之後 validator 集合大小可變，不再寫死。說任何 work-item 的 Refine 失敗（∞、☇、BAD、BIG）都會讓 Ξ 回 ∇ 者錯在 E 只有兩個 disjunct，item 失敗由 I 就地換成 error digest 與零 segment，「the work-package continues to be valid as a whole」。說 l 以 work-item index 為 key、v 是 credential 的簽章數（2–3）、失敗條件是編碼後 report 超過 W_B 者錯三處——l 的 key 是 work-package hash；v ∈ N_V 是 assurer 集合大小，2–3 是 guarantee credential 的長度（eq. 11.24 的 a ∈ [2:3]）；W_B = 13,791,360 是 **bundle** 上限（§14.3），report 變動長度的上限才是 W_R（eq. 11.8）。你們 issue #1015/#1026：WorkPackageSpec 加 erasure_shards，Producer 設為 TotalShards。","trap":"Ξ 失敗只有兩種：Is-Authorized 失敗、l 的 key 集合不對；item 失敗不會讓 Ξ 失敗。"},{"id":"ch14-oversize-cumulative-calc","ch":"14","section":"14.4 Computation of Work-Report","gpRef":"eq. 14.13 (I(p, j), z); eq. 11.8 (W_R)","difficulty":3,"kind":"calc","tags":["work-packages","compute-report","oversize","calc"],"stem":"A guarantor computes a report for a package whose authorization trace t is 1,000 octets and whose four work-items all refine successfully (export counts correct) with output blobs of 20,000, 25,000, 5,000 and 3,000 octets, in that order. With W_R = 49,152, what results do the four digests carry?","options":["ok (20,000), ok (25,000), ⊖ OVERSIZE, ok (3,000) — the size check is cumulative (|r| + |t| + Σ of earlier successful outputs > W_R) and an item replaced by ⊖ contributes 0 to the sums of later items","ok (20,000), ok (25,000), ⊖ OVERSIZE, ⊖ OVERSIZE — the check is cumulative (|r| + |t| + Σ of earlier outputs > W_R) but an item replaced by ⊖ still contributes its own 5,000 octets, so every later item is oversize as well","Ξ returns ∇ for the whole package: 1,000 + 20,000 + 25,000 + 5,000 + 3,000 = 54,000 exceeds W_R, and E is true whenever the authorization trace plus all refinement outputs cross the limit, so no report is produced at all","ok, ok, ok, ok — each output is individually far below W_R, so I never fires; the 48 KiB ceiling is enforced only on-chain, by eq. 11.8 against the report as assembled from the digests"],"answer":0,"explanation":"eq. 14.13 的 I(p, j)：若 |r| + z > W_R 則 (⊖, u, [J_0, …]_{m_e})，其中 z = |t| + Σ_{k<j, (r ∈ B, …) = I(p,k)} |r|——只累加**前面成功（r ∈ B）**的輸出，再加上 authorizer trace t。逐項：item 0：z = 1,000，20,000 + 1,000 = 21,000 ≤ 49,152 → ok；item 1：z = 21,000，25,000 + 21,000 = 46,000 → ok；item 2：z = 46,000，5,000 + 46,000 = 51,000 > 49,152 → ⊖ OVERSIZE，輸出換成 error、exports 換成 m_e 個零 segment（J_0 = [0]^{W_G}），gas u 照記；item 3：z 仍是 46,000（item 2 的 r 不是 blob，不計入），3,000 + 46,000 = 49,000 ≤ 49,152 → ok。最終 report 的 |t| + Σ L(r) = 49,000，自動滿足鏈上 eq. 11.8——guarantor 端正是靠 I 的 ⊖ 保證 report 不會超過。「後面全部 ⊖」錯在把 oversize item 的 5,000 也算進 z——I 的 z 只累加 (r ∈ B, …) 也就是**成功**的輸出，被換成 ⊖ 的 item 貢獻 0，所以 item 3 還有機會過關。「全部 ok、只靠鏈上把關」錯兩處：I 在 guarantor 端就會觸發，而且真等到 eq. 11.8 才擋，整份 report 會被拒、guarantor 白做工，這正是 GP 要「gracefully handle」的情形。「整包 ∇」錯在 E 只有兩個 disjunct（Ψ_I 的結果不是 ≤ W_R 的 blob、或 keys(l) 不對），輸出總長度從來不是 E 的判斷條件（見 eq. 14.13）。同理 ⊚ BADEXPORTS（|e| ≠ m_e）也只影響該 item。你們 work_package.go：z := len(o) + rSum、rSum += len(r.Data)，error 結果的 Data 為空所以不累加——與 GP 一致。W_R = 48·2^10 = 49,152。","trap":"z 只累計成功輸出 + |t|；⊖ 的 item 不計入，後面的 item 還有機會成功。"},{"id":"ch14-paged-proofs","ch":"14","section":"14.3.1 Exporting / 14.4.1 Availability Specifier","gpRef":"eq. 14.12 (P), 14.18 (A: e = M(s), s♣); eq. E.4–E.6 (M, J_x, L_x); eq. 13.12","difficulty":2,"kind":"concept","tags":["work-packages","segments","paged-proofs","merkle"],"stem":"Exported segments are committed to by the segments-root e of the availability specification and justified through paged proofs. Which statement is correct?","options":["e = M(s) is the root of a constant-depth binary Merkle tree over the exported segments, its leaves '$leaf'-prefixed and zero-hash-padded to a power of two; P(s) yields one 4,104-octet segment per 32 exported segments, each carrying a page of 32 leaf hashes plus its subtree path; they live only in the short-term Audit DA, since auditors are the only ones who verify imports","e = M_B(s), the well-balanced binary Merkle root taken over the raw segments with no padding; P(s) yields ⌈|s|/64⌉ extra segments, each the zero-padded encoding of the Merkle path J_6(s, i) to a 64-leaf subtree plus that subtree's page of 64 leaf hashes L_6(s, i); both are stored inside the auditable bundle rather than in the D³L","e = M(s) is the root of a constant-depth binary Merkle tree over the exported segments, its leaves '$leaf'-prefixed and zero-hash-padded to a power of two; P(s) yields one extra segment per exported segment, each holding that segment's own ≈350-byte justification, and every validator stores all of them so that any node can verify any import without fetching chunks","e = M(s) is the root of a constant-depth binary Merkle tree over the exported segments, its leaves '$leaf'-prefixed and zero-hash-padded to a power of two; P(s) yields ⌈|s|/64⌉ extra segments, each the zero-padded encoding of the Merkle path J_6(s, i) to a 64-leaf subtree plus that subtree's page of 64 leaf hashes L_6(s, i); both are erasure-coded into the long-lived D³L"],"answer":3,"explanation":"§14.3.1：segments-root「is formed as the root of a constant-depth binary Merkle tree as defined in equation E.4」，即 A 的 e = M(s)（eq. 14.18）；E.4/E.7：M 先把每個 leaf 做 H($leaf ⌢ v) 再零填到 2 的冪——固定深度讓 import 證明的大小固定（eq. 14.7 的 32·⌈log₂ W_X⌉）。eq. 14.12：P(s) = [P_{W_G}(E(↕J_6(s, i), ↕L_6(s, i))) | i < ⌈|s|/64⌉]——每頁一個 segment，內容是 root 到該 64-leaf 子樹的路徑 J_6（E.5）加上這 64 個 leaf hash 的頁 L_6（E.6），零填到 4,104；§14.4.1：「exactly ⌈1/64⌉ paged-proof segments as the number of yielded segments, each composed of a page of 64 hashes of segments, together with a Merkle proof from the root to the subtree-root which includes those 64 segments」。它們與 exported segments 串接後（s ⌢ P(s)）一起被 C_v 切片、轉置後做成 s♣ → erasure root（eq. 14.18），存在長期的 D³L；importer「each justification can be derived through a single paged-proof」，最壞每個 import 多抓一個 segment，連續 import 共用一頁。這也是 eq. 13.12 DA-load 65/64 的由來。干擾項逐一：說 e = M_B(s)（無填充）、且 paged proof 收在 auditable bundle 裡者錯兩處——M_B（E.3）是 well-balanced 無填充版，用在 erasure root 與 extrinsic hash，segment root 用的是固定深度的 M（§14.3.1 明指 eq. E.4），固定深度才能讓 import 證明大小固定；而 P(s) 是與 segments 串接後一起 erasure-code 進 D³L，bundle 裡放的是這個 package 自己 **import** 的 justification，不是它 export 的 paged proof。說每 32 個 segment 一頁、且只存短期 Audit DA、只有 auditor 會驗 import 者錯三處——頁大小是 2^6 = 64（所以是 ⌈|s|/64⌉ 頁、DA load 才會出現 65/64）；paged proof 存的是長期 D³L；而真正逐一驗 import justification 的是 **guarantor**，§14.2.2 說「We do not force auditors to go through the same process」。說每個 segment 各配一份 ≈350 bytes 的 justification、且每個 validator 全都存者也錯兩處——正因為 §14.2.2 說這種資料「too voluminous to have all validators store all data」，才改成每 64 個 segment 一頁、並沿用同一套 availability 框架分片存放。你們 work_package.go PagedProofs：Jx(6,…)、Lx(6,…)、PadToMultiple(SegmentSize)；A 用 merkle_tree.M 算 exportsRoot。","trap":"segment root = M（constant depth，$leaf 前綴 + 零填）；paged proof 每 64 個 segment 一頁、存 D³L；65/64。"},{"id":"ch14-makebundle","ch":"14","section":"14.4 Computation of Work-Report / 14.2.2 Data Collection and Justification","gpRef":"eq. 14.15–14.17 (X, L_l, S_l, J_l, B, s = A(H(p), B(p, l), e, v)); §14.3.1 (Audit DA vs D³L lifetimes)","difficulty":2,"kind":"concept","tags":["work-packages","bundle","audit-da","d3l"],"stem":"What exactly goes into the auditable work-bundle B(p, l) that guarantors erasure-code into the Audit DA, and how does that differ from what goes into the D³L?","options":["B(p, l) = E(p, X#(p_w), S_l#(p_w), J_l#(p_w)) with the exported segments appended as a fifth component: the encoded package, every extrinsic blob, every imported segment, their Merkle justifications and finally this package's own exports — only the justification paths carry length prefixes; the bundle goes to the long-lived D³L (≥ 28 days = 672 epochs) while the paged proofs alone are short-lived Audit-DA data","B(p, l) = E(p, X#(p_w), S_l#(p_w), J_l#(p_w)) with the finished work-report appended, so that auditors can compare their own result against the guarantors' without touching on-chain data; every one of the sequences carries a length prefix; both the bundle and the exported segments with their paged proofs are kept for ≥ 28 days (672 epochs) in the same store","B(p, l) = E(p, X#(p_w), S_l#(p_w), J_l#(p_w)): the encoded package, then every extrinsic blob, then every imported segment and finally the Merkle justifications of those imports — only the justification paths carry length prefixes; the bundle is short-lived Audit-DA data, whereas exported segments plus their paged proofs go to the long-lived D³L (≥ 28 days = 672 epochs)","B(p, l) = E(p, X#(p_w)) only: the encoded package and every extrinsic blob, with no imported segments and no justifications — auditors re-fetch the segments from the D³L and check their paged proofs themselves, exactly as the guarantors did; the bundle is short-lived Audit-DA data, whereas exported segments plus their paged proofs go to the long-lived D³L (≥ 28 days = 672 epochs)"],"answer":2,"explanation":"eq. 14.16：B(p, l) = E(p, X#(p_w), S_l#(p_w), J_l#(p_w))；eq. 14.15：X(w) = 依 w_x 順序的 extrinsic 原始 blob（H(d) 與 |d| 必須吻合）；L_l 把 h⊞ 透過 l 換成 segment root；S_l(w) = 每個 (r, n) ∈ w_i 對應的 segment b[n]（M(b) = L_l(r)）；J_l(w) = ↕J_0(b, n)，每個 import 的 Merkle 路徑。「Note the lack of length prefixes: only the Merkle paths for the justifications have a length prefix. All other sequence lengths are determinable through the work package itself」（extrinsic 長度在 w_x、segment 固定 4,104、import 數量在 w_i）。這個 bundle 就是 A 的第二個參數：s = A(H(p), B(p, l), ē, v)，(w_s)_l = |B(p, l)|（eq. 14.17–14.18），被 C_v 切成 v 個 chunk 進 **短期** Audit DA——§14.3.1：「assurers are expected to keep them only until finality of the block in which the availability of the work-result's work-package is assured」；exported segments + P(s) 則進 **長期** D³L，「kept for a minimum of 28 days (672 complete epochs)」。理由（§14.2.2）：guarantor 已用 justification 驗過 import，但「We do not force auditors to go through the same process」——auditing 平均每個 package 30 次、guaranteeing 只有 2–3 次，寧可在 D³L 與 Audit DA 之間重複資料以降低 auditor 成本。干擾項逐一：說 bundle 尾端接著 work-report、四段全部帶長度前綴、且 bundle 與 exported segments 同存 28 天者錯三處——B 只有四個元件、不含 report（auditor 自己重跑 Ξ 再比對 report hash）；GP 明說「Note the lack of length prefixes: only the Merkle paths for the justifications have a length prefix」；bundle 屬短期 Audit DA，只有 D³L 才是 672 epochs。說 B 只有 package 與 extrinsic、import segment 讓 auditor 自己從 D³L 抓來驗 paged proof 者，正好把 §14.2.2 要避免的成本加回去——auditing 平均每個 package 30 次、guaranteeing 只有 2–3 次，所以寧可讓 D³L 與 Audit DA 重複存放資料。說 exported segments 是 B 的第五個元件、又把兩個 store 的壽命對調者也錯兩處——export 走的是 A 的第三個參數（s ⌢ P(s) 一起 erasure-code 進 D³L），而 bundle 只留到 availability 被 assure 的那個區塊 finalize 為止。你們 work_package.go BuildWorkPackageBundle：WorkPackageBundle{Package, Extrinsics, ImportSegments, ImportProofs}。0.8.0 才把它命名為 B 並明確以 (p, l) 為參數（issue #1015「explicit make-bundle / compute-report semantics」）。","trap":"bundle = package ⌢ extrinsics ⌢ import segments ⌢ justifications（只有 justification path 有長度前綴）；短期 Audit DA vs 長期 D³L（672 epochs）。"},{"id":"arch-audit-initial-tranche","ch":"ARCH","section":"17.3 Selection of Reports","gpRef":"eq. 17.2–17.4","difficulty":3,"kind":"concept","tags":["auditing","elves"],"stem":"How does a validator pick the work-reports it must audit in the INITIAL tranche (a_0)?","options":["It makes a Bandersnatch VRF signature s_0 over context X_U ⌢ Y(H_V) with an empty message, then Fisher-Yates shuffles the per-core sequence q using Y(s_0) and keeps the non-empty entries among the first ten","It audits every report that became available in the block: q holds one entry per active core, so the initial tranche is simply all of its non-empty entries and no verifiable randomness is involved","It audits the reports on the cores it guaranteed in the previous rotation, reusing the guarantor assignment G* of that rotation rather than drawing any fresh randomness for the tranche","It signs the block hash with its Ed25519 key and audits those cores whose index matches the low bits of that signature, taking as many cores as the audit bias factor F = 2 permits"],"answer":0,"explanation":"eq. 17.2：s_0 ∈ F_{κ[v]_b}^{X_U ⌢ Y(H_V)}([])，X_U = $jam_audit——注意 VRF 的 context 綁定本區塊的 entropy VRF 輸出 Y(H_V)，所以選擇是可驗證亂數且逐塊不同。eq. 17.3：a_0 = {w | w ∈ F(q, Y(s_0))[..10], w ≠ ∅}，q 是長度 |κ|/3（active cores）的序列，把「本塊剛 available 的 report」對應到 core（沒有就是 ∅）；先洗牌取前十項、再濾掉 ∅，所以初始 tranche 最多 10 個 core。說「全部都審」的選項推翻了 ELVES 的整個前提：若每個 validator 都審每份 report，in-core 就退化成 everybody-does-everything，§4.9.1 想要的約 300 倍算力也就沒了；GP 的作法正是抽樣加上 no-show 驅動的 tranche 擴張。說「審自己上一輪 guarantee 過的 core」的選項在誘因上剛好相反：guarantor 是被審的一方，讓它審自己保證過的東西等於取消審計的獨立性，而且 G* 是公開可算的，攻擊者能事先知道誰審什麼。說「用 Ed25519 簽 block hash 取低位元」的選項有兩個硬錯：這裡用的是 Bandersnatch VRF（唯有 VRF 的輸出 Y(·) 才能既保密又對他人可驗證，Ed25519 簽名不是 VRF），而 F = 2 是 audit bias factor，只出現在 n > 0 的後續 tranche 判準 a_n(w) 裡（§17.3），與初始 tranche 取十個 core 無關。宣告（announcement）必須先發布並且「should be taken as a contract to complete the audit regardless of any future information」。","trap":"10 個 core 是 shuffle 後取前 10；q 的長度是 active cores = |κ|/3，不是 C = 341。"},{"id":"arch-audit-outcomes","ch":"ARCH","section":"17.1 Overview","gpRef":"§17.1","difficulty":2,"kind":"concept","tags":["auditing","disputes"],"stem":"GP §17.1 describes what happens when a negative judgment appears. Which pair of thresholds and consequences is correct?","options":["If more than 1/2 of validators issue NEGATIVE judgments, the report is dropped from its availability assignment; if fewer do, nothing happens at all — no validator is ever punished for a false negative and the block containing the report stays buildable","If more than 2/3 of validators still issue POSITIVE judgments, those issuing negative judgments may be punished for time-wasting; if more than 1/3 issue NEGATIVE judgments, the block containing the report is ban-listed and it and all its descendants are disregarded","A single NEGATIVE judgment suffices: it invalidates the block that carried the report and slashes all three guarantors of that core; no further validator need judge, no verdict reaches the disputes extrinsic, and the 2/3 positive threshold plays no part","Negative judgments carry no consequence of their own; only the disputes extrinsic matters, a verdict there needs the unanimous signature of the whole active validator set, and the punish-set ψ_O fills only from culprits and never from faults"],"answer":1,"explanation":"§17.1：「if greater than 2/3 of the validators still issue positive judgments, then validators issuing negative judgments may receive a punishment for time-wasting. If greater than 1/3 of the validators issue negative judgments, then the block which includes the work-report is ban-listed. It and all its descendants are disregarded and may not be built on.」最後由 block author 把足夠的票組成 verdict 放進 disputes extrinsic（§10）。把門檻說成「過半才丟掉、且沒有懲罰」的選項三處都錯：門檻是 1/3 而不是 1/2，時間浪費者確實會被罰（這正是為了讓惡意的負面判決有代價），而被 ban-list 的區塊連同其後代「may not be built on」，不可能還照樣能建。說「一票否決、直接砍三個 guarantor、也不必組 verdict」的選項則跳過了整個 disputes 機制：§17.1 說的是「once there are enough votes, a verdict can be constructed by a block author and placed in a disputes extrinsic」，而 §10 的 verdict 更要求判決數恰為 ⌊2/3·|k|⌋ + 1 張，單獨一票既構不成 verdict，也不會有任何 culprit 被登錄。說「負面判決沒有鏈上效果、verdict 需要全體一致」的選項在門檻上憑空發明：§10 eq. 10.12 的正面票數只接受 ⌊2/3·|k|⌋ + 1（good）、0（bad）、⌊1/3·|k|⌋（wonky）三個值，從來不是 unanimity；ψ_O 也不是只收 culprits——§10 明白把 culprits（保證了無效 report 的 guarantor）與 faults（判決與 verdict 相牴觸的簽署者）並列為兩種 offence，兩者都會進 punish-set。另外：一個 report 的所有宣告都被正面判決匹配時即為 audited；一個區塊的所有新 available report 都 audited 時該區塊為 audited——這是 finalize 的前提之一（§19）。","trap":"「1/3 負面 → 整條鏈分支被丟棄」是 best-chain 的 disregard 規則；2/3 正面 → 反對者被罰。"},{"id":"arch-audit-reconstruction","ch":"ARCH","section":"17.2 Data Fetching","gpRef":"§17.2–17.3 & appendix H","difficulty":2,"kind":"concept","tags":["auditing","erasure-coding"],"stem":"How does an auditor obtain the data it needs to re-run a work-report?","options":["It asks the core's other two guarantors to re-sign the report and takes a matching pair of Ed25519 signatures as proof of correctness; no bundle is fetched and refine is never re-run","It downloads the whole bundle from the block author, who is required by the GP to retain it for 28 days; the exported segments arrive with it, so the refine logic never has to be re-run","It reads both the imported and the exported segments straight from on-chain state, where they sit under the reporting service's preimages until the report is accumulated and then expire","It reconstructs the bundle from erasure-coded chunks fetched from about one-third of the validators, verified against the erasure-root; exported segments are recomputed by re-running refine"],"answer":3,"explanation":"§17.3：「This may be done through requesting erasure-coded chunks from one-third of the validators, verified through the erasure coding's Merkle root, and
