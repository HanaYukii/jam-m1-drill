ssibility; performance and coherency are antagonistic because signature verification does not parallelize, so throughput must be bought with weaker composability — JAM answers by fragmenting state into 341 causally-independent shards, each small enough to stay coherent, bridged by an asynchronous message queue","Factors: Resilience, Generality, Performance, Coherency, Accessibility; the antagonism is between resilience and accessibility, since every additional validator adds a consensus round-trip and cheap access therefore forces a small set — JAM answers by pinning the validator set at 1,023 and pushing all further growth into off-chain roll-ups that settle asynchronously against the chain","Factors: Resilience, Generality, Performance, Coherency, Accessibility; performance and coherency are antagonistic because causality is bounded by signal speed, so larger state-spaces become less coherent — JAM answers by pipelining a highly scalable, mostly-coherent element (in-core) into a synchronous, fully-coherent element (on-chain), replacing crude partitioning with 'cache affinity'"],"answer":3,"optNotes":["五項名稱全不對；16 核/64 GB/8 TB 只是 §20 的假設硬體，GP 也明確以成本否定 SNARK 路線。","把資訊理論論證換成「簽章無法平行化」；341 個因果獨立分片正是 GP 批評的 crude partitioning。","被點名對立的是第 3、4 項而非 resilience／accessibility；0.8.0 更已讓 validator 集合大小可變。","五項與對立的那一組（performance／coherency）都對，解法也正是 in-core → on-chain 的 pipeline 與 cache affinity。"],"explanation":"§1.2：(1) Resilience (2) Generality (3) Performance (4) Coherency (5) Accessibility；「items 3 and 4 are antagonistic according to an information theoretic principle… we shall name it size-coherency antagonism」，而前兩項是 Web3 的隱含前提——「we make an implicit assumption of the first two items」。§1.3：state-space 越大越不 coherent（受光速、電子與軟體延遲限制，元件間平均距離與變異都上升，因果解析時間發散）；現有可擴展系統（Polkadot、Cosmos、rollup）靠粗暴分割與非同步溝通，GP 以細菌分裂比喻批評之。JAM「pipelines a highly scalable, mostly coherent element to a synchronous, fully coherent element」，以類似多核心 CPU 共享 RAM 的「cache affinity」取代分割，目標是「avoiding the persistent fragmentation of state-space」——這就是「mostly-coherent trustless supercomputer」副標的由來。GP 也明確以成本為由否定 SNARK 路線（「Unlike with SNARK-based L2-blockchain techniques… this model draws upon crypto-economic mechanisms」）。","trap":"與 SNARK rollup 的對比：§2 指 RISC-Zero 類證明比直接執行慢 6 萬倍以上、且傾向中心化。"},{"id":"arch-why-safrole","ch":"ARCH","section":"6 Safrole rationale","gpRef":"§6 intro & §19","difficulty":2,"kind":"rationale","tags":["architecture","safrole","rationale"],"stem":"Why does JAM use Safrole (ticket-based, anonymous, ring-VRF) rather than a BABE-like VRF lottery?","options":["Safrole's advantage is that several validators may win the same slot so a slot is never empty: the ring VRF lets each of them prove membership of γ_P, the resulting fork is resolved by whichever block reaches Grandpa first, and tickets are drawn afresh each slot from η_0 so that no author is predictable more than one slot ahead","Safrole exists to take signatures off the hot path: the ticket is a plain hash preimage revealed at sealing, so checking a seal costs one hash rather than a VRF verification; anonymity comes from validators rotating their Ed25519 keys every epoch, and the entropy pool η is taken straight from the block hash since a hash is already uniform","Safrole limits each 6-second slot to exactly one predetermined key-holder (near fork-free), keeps the identity of future slot authors anonymous until they seal (DoS resistance), and produces a high-quality unbiasable entropy pool; the best-chain rule additionally prefers chains with more ticket-sealed (vs fallback) ancestors","Safrole is a finality gadget sitting under Grandpa: it assigns each slot one author, who must then gather 2/3+1 pre-votes before the block may extend the chain, which is why JAM has no forks at all and needs no fork-choice rule; fallback keys are used only in the genesis epoch, before any tickets have accumulated"],"answer":2,"optNotes":["這正是 Safrole 要修掉的 BABE 行為：γ_A 累積整個 epoch，交界一次排成 γ_S，每個 slot 只有一個 sealer。","seal 是 Bandersnatch VRF 簽章、ticket 是 ring-VRF 證明；η′_0 取 Y(H_v) 正是因為 block hash 可被 grinding。","三個目的都寫在 §6 intro：每 slot 恰一個作者、未來作者匿名、副產品是高品質 entropy，§19 再加 ticket 優先。","Safrole 只管 block production，finality 歸 Grandpa；fallback F(k, η_2) 任何一次 ticket 不足的交界都會啟用。"],"explanation":"§6 intro：「The chief purpose of a block production consensus mechanism is to limit the rate at which new blocks may be authored and, ideally, preclude the possibility of forks… Safrole limits the possible author of any block within any given six-second timeslot to a single key-holder… under normal operation, the identity of the key-holder of any future timeslot will have a very high degree of anonymity. As a side effect… we can generate a high-quality pool of entropy」——三個目的：近似無分叉、DoS 抗性、高品質 entropy。對照 BABE 的 VRF 抽籤會出現多個或零個 slot leader，Safrole 用 ticket 在前一個 epoch 就決定每個 slot 恰好一個作者；注意 GP 的用字是「ideally, preclude the possibility of forks」，並非完全無分叉，所以 §19 仍需 best-chain 規則——偏好「most ancestor blocks whose author used a slot-sealer ticket, rather than a fallback key」。Safrole 是 Sassafras 的簡化版（「To follow in the footsteps of Ethereum yellow paper」——簡單到能被多個獨立實作正確實現）。","trap":"anonymity 來自 ring VRF：證明「我是 γ_P 中某人」而不揭露是誰；seal 時才用普通 VRF 揭露。"},{"id":"arch-availability-auditing","ch":"ARCH","section":"4.8.1, 11, 16, 17 rationale","gpRef":"§4.9.1, §16–17, ELVES paper","difficulty":2,"kind":"rationale","tags":["architecture","rationale","elves"],"stem":"Why does JAM need BOTH availability (assurances + erasure coding) AND auditing/disputes to secure in-core computation?","options":["Guaranteeing attaches economic cost to invalid results; but auditors can only re-execute if the inputs are retrievable, so 2/3+1 of validators must first assure they hold erasure-coded shards (any 1/3 reconstruct); then randomly-selected auditors (ELVES) re-run reports and escalate on negative judgments or no-shows; disputes finalize the verdict on-chain and ban the report/offenders","Auditing comes first: validators re-execute every report the moment it is guaranteed, and only reports that survive audit are then erasure-coded and distributed; a 1/3 assurance threshold suffices because one honest shard-holder can always raise the alarm; disputes exist only to redistribute the guarantors' deposits, so availability is a storage optimization layered onto an already-complete audit","They are two halves of one mechanism: the three guarantors of a core sign the report and then re-execute each other's work — that mutual check is what the GP calls auditing — while assurances only acknowledge receipt of the block; because guarantors are already staked no external auditor is drawn, and a negative judgment slashes the reporter directly with no on-chain verdict needed","Erasure coding already establishes validity: because every shard is Merklized under the work-report's erasure-root, a validator that reconstructs the bundle can check the result without re-running refine, so assurances alone settle correctness; auditing is an optional latency optimization for nodes wanting to accumulate early, and the disputes extrinsic merely records who assured late"],"answer":0,"optNotes":["順序與門檻都對：2/3+1 assurance 先讓輸入可取得，隨機抽出的 auditor 才有東西重跑，disputes 收尾。","順序反了；1/3 是重建所需的 chunk 比例而非 assurance 門檻，disputes 產出的是 verdict 與 ban-list。","被懷疑的正是 guarantor，自審沒有安全意義；auditor 是用 Bandersnatch VRF 從整個 validator set 抽出的。","混淆資料可得性與計算正確性：erasure-root 只承諾輸入，refine 的輸出必須重新執行才知道對不對。"],"explanation":"§4.9.1：「a crypto-economic game of three stages called guaranteeing, assuring, auditing and, potentially, judging. Respectively, these attach a substantial economic cost to the invalidity of some proposed computation; then a sufficient degree of confidence that the inputs of the computation will be available for some period of time; and finally, a sufficient degree of confidence that the validity of the computation… will be checked by some party who we can expect to be honest.」四階段合起來才讓 §4.9.2 的「code executed in-core has a comparable level of crypto-economic security to that executed on-chain」成立：沒有 availability，惡意 guarantor 可以「藏起」輸入讓人無法審計；沒有 auditing，guarantee 的經濟懲罰無從觸發。report 要先被「a clear 2/3 super-majority of validators」標記，才進入 §17 的 just-became-available 集合被抽中審計；審計每 A = 8 秒一個 tranche、no-show 時 bias factor F = 2 加派審計者，而且是強制的——「one prerequisite of a node finalizing a block is for it to view the block as audited」（§20 給的量：每 validator 每 timeslot 平均 10 次、每份 report 30 次）。ELVES（eprint 2024/961）證明在 ≥ 2/3+1 誠實假設下此遊戲安全。","trap":"面試「design rationale」高頻題：把四階段講清楚，並說明 report 為何要先 available 才 accumulate。"},{"id":"arch-why-prior-root-and-pipelining","ch":"ARCH","section":"5 & 20 (pipelining)","gpRef":"§5, §20 Discussion","difficulty":2,"kind":"rationale","tags":["architecture","pipelining"],"stem":"JAM is designed so that most of a block's work can proceed while the block propagates. Which design features make that possible?","options":["Both refine and accumulate run off-chain: a core's guarantors execute the whole pipeline and publish only a state diff, leaving the on-chain step a Merkle patch; the header's state-root field is therefore left as the zero hash and corrected only once Grandpa finalizes the block, which is what bounds the pipeline to the 8-block recent-history window","Temporal parallelism (pipelining): the header carries the PRIOR state root, so a block can be published before the new state has been Merklized — that cost lands in the next slot; plus spatial parallelism, both across the largely independent components of σ (whose dependency graph §4.2.1 deliberately keeps shallow) and across cores in-core","Temporal parallelism comes from the header carrying the POSTERIOR state root, which lets a node accept a block without replaying it, so Merklization must finish before publication but is never repeated; spatial parallelism comes from giving each core its own fragment of σ, so two cores never touch the same state component and accumulation runs fully in parallel","Blocks are authored a slot early: the ticket-holder for slot n+1 is handed the state of slot n as soon as it exists, precomputes its block and merely signs it when the slot opens, so the posterior root is already known and can go in the header; the 341 cores then each replay the block, sharing the Merklization cost 341 ways"],"answer":1,"optNotes":["accumulate 明訂在鏈上；先填零再由下一塊補的是 recent history β 的 state-root 欄位，不是 H_r。","兩種平行性都對：prior root 讓 Merklization 落到下一個 slot，σ 的淺依賴圖與多 core 則給空間平行。","§5 明說 posterior root 是 Polkadot 與 Yellow Paper 的做法而 JAM 刻意 departs；JAM 也不做持久性狀態切割。","Safrole 只提前決定「誰」出塊，內容取決於當下 extrinsic；core 跑的是 refine 而非重放區塊。"],"explanation":"§5：prior state root「to facilitate the pipelining of block computation and in particular of Merklization」——這是「a departure from both Polkadot and the Yellow Paper's Ethereum, in both of which a block's header contains the posterior state's Merkle root」，Merklize 新狀態的成本因此落到下一個 slot。§4.2 的 dependency graph 刻意最小化深度，讓 β†、Safrole、disputes、assurances、guarantees 這些輕量步驟可平行，而 accumulation（最重）之後只剩 preimage 整合、α′、π′。§20 Discussion 列了三個 driver：spatial parallelism（341 cores + eq. 4.4 的 17 個大致獨立的 state 元件）、temporal parallelism（pipelining）、PVM 與硬體對齊（RISC-V → 高效 recompile）。參考硬體 16 核/64 GB/8 TB/0.5 Gbps；CPU 預算 10/16 給 auditing、2/16 block execution、1/16 Merklization——Merklization 是每個節點自己的成本，不會被 core 數分攤。","trap":"Grandpa vote 帶 posterior state root（§19）讓下游仍能驗證最新狀態——彌補 header 只有 prior root。"},{"id":"arch-services-vs-accounts","ch":"ARCH","section":"4.8.2 services","gpRef":"§4.9.2, §9","difficulty":1,"kind":"rationale","tags":["architecture","services"],"stem":"How do JAM services differ from Ethereum's account model, and how does external data enter the state?","options":["JAM keeps Ethereum's split but renames it: service accounts hold code, balance and state, while 'authorizer accounts' hold a secret key and a nonce so they can sign work-packages; refine and accumulate are both on-chain entry points, and external data arrives as signed transactions the authorizer account pays for from its balance","JAM has only service accounts (code + balance + state, no secret key, no nonce), but a service exposes a single entry point that guarantors run in-core and the chain then re-runs on-chain to verify; external data enters as extrinsics in the block body, and coretime is charged per byte of that extrinsic much as Ethereum charges gas","JAM services are the direct successors of parachains: each is registered against a fixed core, ships a validation function guarantors execute, and talks to other services over an asynchronous XCM-like queue; data enters via collators' proofs-of-validity, and the accumulate entry point exists only to move balances between services","JAM has only service accounts (code + balance + state, no secret key, no nonce); each has two entry points — refine (in-core, stateless, arbitrary input → small digest) and accumulate (on-chain, stateful); all extrinsic data enters through refine inside work-packages, authorized via coretime/authorizers rather than signed transactions"],"answer":3,"optNotes":["GP 說「In JAM, all accounts are service accounts」；authorizer 授權的是程式碼而非帳戶，付費靠事先買好的 coretime。","service 有 refine 與 accumulate 兩個 entry-point；鏈上重跑正是 guarantee／assure／audit 賽局要取代的工作。","service 不綁死在某個 core，CoreChains 只是眾多 service 之一，而 accumulate 遠不只搬餘額。","兩個 entry point 與「無私鑰、無 nonce」都對上 §4.9.2，外部資料一律走 work-package 裡的 refine。"],"explanation":"§4.9.2：「In JAM, all accounts are service accounts… Since they are not controlled by a secret key, they do not need a nonce.」「All data extrinsic to JAM is fed into the refinement code of some service… executed in-core… refinement code is executed off-chain and subject to no such constraints, enabling JAM services to scale dramatically both in the size of their inputs and in the complexity of their computation.」同節也明說 service definition「actually includes multiple code entry-points, one concerning refinement and the other concerning accumulation」，而且「there is no such concept of a *transactor*」——授權走的是 coretime 與 authorizer，不是簽章交易。CoreChains（parachains）、CorePlay（actor/continuation smart contracts，靠 PVM 可暫停/續跑）、CoreVM 等都只是 service——JAM 本身沒有 parachain 概念，升級責任下放到 service（Wiki：「Non-upgradable chain; upgradability responsibility shifted to services」）。","trap":"面試官若問「為什麼 JAM 不可升級」：協定固定、可多實作、把演進放在 service 層。"},{"id":"arch-constants","ch":"ARCH","section":"Appendix I constants","gpRef":"Appendix I & §20","difficulty":2,"kind":"concept","tags":["constants"],"stem":"Which set of full-configuration constants is correct?","options":["C = 341 cores (|κ| = 3C = 1023 in the full configuration; V itself is no longer a protocol constant), E = 600 slots/epoch, P = 6 s, Y = 500, R = 10, H = 8, L = 14,400, D = 19,200, U = 5, K = 16, O = 8, Q = 80, I = 16, J = 8, T = 128, W_G = 4,104, W_R = 48 KiB, W_B = 13,791,360, W_C = 4,000,000, G_A = 10^7, G_R = 5·10^9, G_T = 3.5·10^9, G_I = 5·10^7, A = 8 s, F = 2","C = 341 cores with |κ| = 3C = 1023 fixed for every configuration, E = 600 slots/epoch, P = 12 s, Y = 300, R = 10, H = 24, L = 600, D = 19,200, U = 5, K = 16, O = 8, Q = 80, I = 16, J = 8, T = 128, W_G = 4,104, W_R = 48 KiB, W_B = 13,791,360, W_C = 4,000,000, G_A = 10^7, G_R = 5·10^9, G_T = 3.5·10^9, G_I = 5·10^7, A = 6 s, F = 3","C = 341 cores (|κ| = 3C = 1023 in the full configuration), E = 600 slots/epoch, P = 6 s, Y = 500, R = 10, H = 8, L = 14,400, D = 14,400 (identical to L), U = 5, K = 3, O = 80, Q = 8, I = 8, J = 16, T = 16, W_G = 4,096, W_R = 12 MB, W_B = 48 KiB, W_C = 64,000, G_A = 5·10^9, G_R = 10^7, G_T = 3.5·10^9, G_I = 5·10^7, A = 8 s, F = 2","C = 1023 cores with V = 341 validators still fixed by the protocol, E = 3,600 slots/epoch, P = 6 s, Y = 600, R = 60, H = 8, L = 14,400, D = 19,200, U = 5, K = 16, O = 8, Q = 80, I = 16, J = 8, T = 128, W_G = 4,104, W_R = 48 KiB, W_B = 13,791,360, W_C = 4,000,000, G_A = 10^7, G_R = 5·10^9, G_T = 3.5·10^9, G_I = 5·10^7, A = 8 s, F = 2"],"answer":0,"optNotes":["整組與附錄 I 相符，關鍵在 0.8.0 已把 V 移出常數表、驗證者數改由 𝕍 決定而門檻一律取 |κ|。","GP 全文以 six-second timeslot 為前提；H = 8、L = 14,400、A = 8 s、F = 2，且 |κ| 已非固定。","多組常數被對調或寫錯：D = L + 4,800、O = 8 / Q = 80、I = 16 / J = 8、W_G = 4,104、W_C = 4,000,000。","core 數與 validator 數對調了；E = 600（正好一小時）、Y 必須小於 E、rotation R = 10。"],"explanation":"附錄 I 的常數表在 0.8.0 已**沒有 V**（validator 數改由 𝕍 ≡ {3c | c ∈ N_[2,C+1]} 決定、門檻一律取 |κ|）：C_corecount 341、epoch E 600、slot P 6 s、Y（epoch tail start）500、R（rotation）10、H（recent history）8、L（max lookup anchorage）14,400 = 24h、D（expunge）19,200 = L + 4,800、U（assurance timeout）5、K（max block tickets）16、O（auth pool）8、Q（auth queue）80、I（max package items）16、J（max report deps）8、N_V/N_O 16、S = 2^16、T（max package extrinsics）128、W_M/W_X（imports/exports）3,072、W_G segment 4,104、W_F 4,488、W_R 48·2^10、W_B 13,791,360、W_A 64,000、W_C 4,000,000、W_T memo 128、G_A 10^7、G_I 5·10^7、G_R 5·10^9、G_T 3.5·10^9、B_S/B_I/B_L = 100/10/1、A（tranche）8 s、F（audit bias）2、Z_P 2^12、Z_Z 2^16、Z_I 2^24、Z_A 2。full 配置下 |κ| = 1023 = 3·341（每個 active core 3 個 guarantor），但 #514 之後「所有配置都固定 1023」的說法已不成立。","trap":"tiny（test vectors）：V 6、C 2、E 12、Y 10、R 4、D 32、K 3→(0.8.0 由公式)、N ⌈2E/V⌉。"},{"id":"arch-jam-vs-polkadot-eth","ch":"ARCH","section":"2 Previous Work","gpRef":"§2","difficulty":2,"kind":"rationale","tags":["architecture","rationale"],"stem":"According to the GP's 'Previous Work' analysis, what are the main limitations of Polkadot 1.0 and of Ethereum-style rollups that JAM tries to overcome?","options":["Polkadot: its weakness is that all parachains share one validator set, so security is capped by a single stake pool and XCMP must stay synchronous to be safe; rollups: proving costs are already within reach of crypto-economic verification and only sequencer uptime is unsolved — JAM therefore drops the ELVES audit game for SNARK-verified cores and gives each service its own validator subset","Polkadot: it cannot safely host more than ~50 parachains because the ELVES audit game is the bottleneck; rollups: proof generation is already cheap enough, but Dank-sharding's erasure coding over a binary field with Merklization is what centralizes them — JAM answers by adopting KZG polynomial-commitment availability and replacing auditing with optimistic fraud proofs","Polkadot: parachains are isolated ecosystems with asynchronous, coarse-grained XCMP and access limited to ~50 auction slots; rollups: heterogeneous security/economics, SNARK proving is orders of magnitude too costly (RISC-Zero ~61,000× slower than native) and sequencers centralize — JAM keeps Polkadot's ELVES machinery but makes cores un-opinionated, permissionless and semi-coherent","Polkadot: parachains are isolated and XCMP is asynchronous and coarse-grained; rollups: their fragmentation is benign because Ethereum's validator set gives every roll-up identical communication, security and economic properties, and the one real obstacle is proving the EVM — JAM answers by fixing parachain validation as the single function a core may run, with coretime still auctioned in long-term slots"],"answer":2,"optNotes":["GP 拿單一 validator set 對比 Cosmos 的 no homogenous security；XCMP 被明寫為 asynchronous，JAM 也保留 ELVES。","兩邊對調：Dank-sharding 用大質數域的 polynomial commitment，binary field 加 Merklization 才是 JAM 採用的方案。","四點都出自 §2：XCMP 非同步且粗粒度、約 50 個 slot、RISC-Zero 慢 61,000 倍，JAM 則 co-opt ELVES。","§2 說 rollup 的性質「may differ, potentially quite dramatically」；core 不預設用途，長期拍賣正是要消除的門檻。"],"explanation":"§2：Polkadot「a collection of independent ecosystems with only limited opportunity for collaboration」，XCMP「asynchronous, coarse-grained and practically limited by its reliance on a high-level slowly evolving interaction language」，slot 數約 50——這是 accessibility 的限制，不是安全上限。Ethereum rollup 市場則是「heterogeneous communication… security… and economic properties」；SNARK：RISC-Zero「over 61,000 times as long as simply recompiling and executing」、成本 66,000,000×，即使 50,000× 也「several orders of magnitude greater than would be required to compete on a cost-basis with established crypto-economic techniques」；Solana 式全同步：多次停機、512 GB RAM、依賴中心化資料庫。JAM 的回答是保留（co-opt）ELVES——GP 評它為三種跨網路安全方案中最安全、經濟效率最高者——並把 core 變成 un-opinionated、permissionless、semi-coherent 的通用計算資源。","trap":"Kian 的說法：「What was once called an L2/parachain is now called a service」。"},{"id":"ch14-work-package","ch":"14","section":"14.2 Work Packages","gpRef":"eq. 14.2–14.3 (§14.3)","difficulty":2,"kind":"concept","tags":["work-packages"],"stem":"A work-package (eq. 14.2, of the set ℙ) is ⟨j, h, u, f, c, w⟩. Which description is correct?","options":["j authorization token (an opaque blob); h the index of the core the package is destined for; u authorizer code hash; f configuration blob (parameterization); c refinement context; w work-items (1..I = 16) each with service, code hash, payload, refine & accumulate gas limits, the imported segments' data inline, extrinsic (hash, length) pairs, and the exported segments' hashes","j authorization token; h the index of the service that will accumulate the results; u the refine code hash of the first work-item; f configuration blob; c the availability context: erasure-root plus the chunk indices; w work-items (1..T = 128) each with service, code hash, payload, one combined gas limit, imported segment hashes, and its exported segments inline","j the guarantors' signatures over the package; h the hash of the package itself; u the index of the service whose refine code runs; f the gas limit shared by every item; c the availability specification (erasure-root, segment-root, length); w work-items (1..I = 16) each with service, payload, extrinsic hashes and an authorization token of its own","j authorization token; h auth-service index (the service hosting the authorizer code); u authorizer code hash; f configuration blob (parameterization); c refinement context; w work-items (1..I = 16) each with service, code hash, payload, refine & accumulate gas limits, imports (segment root/hash + index), extrinsic (hash, length) pairs, and export count"],"answer":3,"optNotes":["h 的型別是 N_S（service index），core 由 guarantor 決定並寫在 report 上；import 也是承諾而非內嵌資料。","item 上限是 I = 16（T = 128 是整個 package 的 extrinsic 總數），而且 export 只記數量、不內嵌。","把 work-report 的欄位搬進 package：guarantor 簽章在 E_G 裡，availability specification 是 report 的欄位。","六個欄位逐一對上 eq. 14.2，work-item 的 g/a 兩個 gas limit 與只記數量的 e 也對上 eq. 14.3。"],"explanation":"eq. 14.2：ℙ ≡ (j ∈ B token, h ∈ N_S auth service, u ∈ H auth code hash, f ∈ B config, c ∈ ℂ context, w ∈ [𝕀]_{1:I} items)；eq. 14.3：work-item = (s service, c code hash, y payload, g refine gas limit, a accumulate gas limit, i imports [(H ∪ hash⊞, N)], x extrinsics [(H, N)], e export count)。authorizer a = H(u ⌢ f)（0.8.0 #522）；h 是「hosts the authorization code」的 service，c 是 refinement context（anchor hash/state root/beefy root、lookup anchor hash 與 slot、prerequisites），不要跟 work-report 的 availability specification 混。限制（eq. 14.5–14.9）：總 extrinsics ≤ T = 128、imports/exports ≤ W_M/W_X = 3,072、bundle ≤ W_B = 13,791,360。§14.2 的設計原則是「Rather than having much data inline, they instead reference data through commitments」——import 用 (Merkle root, index) 承諾，export「we do not require any particular commitment to them in the work-package beyond knowing how many」。§14 之後（15 guaranteeing、16 assurance、17 auditing）是 M2 範圍，但 M1 面試仍可能問 refine 的輸入輸出概念。","trap":"auth code 是從 δ[h] 的 preimage 以 lookup-anchor 時間做 historical lookup 取得（eq. 14.4 附近）。"},{"id":"delta-summary-080","ch":"ARCH","section":"GP 0.7.2 → 0.8.0 changes","gpRef":"graypaper releases v0.8.0 (June 3 2026)","difficulty":2,"kind":"delta","tags":["delta-0.8.0"],"stem":"Your implementation targets GP 0.7.2 while the current GP is 0.8.0. Which list contains ONLY genuine 0.8.0 changes?","options":["fetch replacing the import host call; memory-access exceptions formalized and a feature freeze declared; assurances checked with the prior validator set; Ed25519 keys in the epoch marker alongside activity statistics; the provide host call, with imports separated from exports; 'super-fetch', gratis storage and account metadata; maximum code sizes with oversize reports handled; stricter opcode and jump validity","The 'Macrofication Marathon' moving every variable-length item to the end of its encoding; fixed-length validator-index serialization; W* made to depend on ρ†; accumulate absorbing on_transfer so a service has one on-chain entry point; the core index added to refine's arguments and removed from the guarantee payload; small service IDs; a version byte prefixing account serialization; 'Owned Privileges' for χ","Variable validator-set sizes (multiples of 3, 6…1023, thresholds derived from |κ|); full guarantees kept in ρ; hard caps of 16 verdicts/culprits/faults, with culprits no longer required behind a bad verdict; bless restricted to the manager service; authorizer = H(auth code hash ⌢ config); refinement context gains anchor slot + lookup-anchor posterior root; per-basic-block gas model with grow_heap replacing sbrk; tickets per validator = ⌈2E/|γ′_P|⌉","64-bit PVM registers and 64-bit addressing throughout; guarantor assignments carrying full validator keys; erasure-coding equation fixes; the info host call gaining registers 9 and 10; explicit per-invocation out-of-gas checks; the transfer gas-charge fix and the work-package size-limit fix; preimage-integration simplification; the posterior state root finalised; a metadata prefix for code blobs"],"answer":2,"optNotes":["fetch 取代 import 與 feature freeze 屬 0.6.0，其餘散落在 0.6.4、0.6.5、0.6.6、0.6.7。","Macrofication Marathon、變長欄位後移、W* 依賴 ρ† 屬 0.7.0；on_transfer 併入與 small service IDs 屬 0.7.1。","整份清單都能對回 0.8.0 的 PR：#514、#494、#525、#519、#522、#526、#508、#527。","64-bit registers 屬 0.5.0；info 的 register 9/10、transfer gas fix 等屬 0.7.2，正是你們現在的版本。"],"explanation":"0.8.0（2026-06-03）的實際變更清單：#514 support smaller validator sets（𝕍 ≡ {3c}，門檻一律由 |κ| 導出）、#494 keep full guarantees in ρ、#525 dispute extrinsic 硬上限 16 且移除 culprits 必要性、#519 restrict bless to manager service、#522 update authorizer identification（authorizer = H(auth code hash ⌢ config)，對齊 ch. 8 與 ch. 14）、#526 expose lookup anchor posterior root and anchor slot、#508 新 gas cost model（per-basic-block，模擬 ROB/execution units）與 sbrk → grow_heap、#517 host function gas costs、#527 ticket 常數改為 ⌈2E/|γ′_P|⌉、#524 extrinsic hash、#502 processed transfer count、#497 illegal memory access 收費、#520/#521/#528。0.7.2 與 0.8.0 之間沒有任何 release，所以判準就是上面這份 PR 清單：凡不在其中的條目，都屬於更早的 release。你們 issue #1012（Update to v0.8.0）與其子 issue #1013–#1022 就是這張清單的實作追蹤。","trap":"面試官依「最新 GP」出題（T&C 3.5：conformance assessed against the latest release），所以 0.8.0 差異必須熟。"},{"id":"arch-tiny-config","ch":"ARCH","section":"Test vectors tiny configuration","gpRef":"w3f/jamtestvectors README & JIP-4","difficulty":1,"kind":"concept","tags":["tiny","test-vectors"],"stem":"Which values describe the 'tiny' test-vector configuration used by the W3F vectors and the conformance fuzzer?","options":["12 validators, 4 cores, epoch 60 slots, ticket submission ends at slot 50, rotation period 10, preimage expunge period 64, super-majority 9 of 12, verdict thresholds 9/0/4, ring size 12","1023 validators, 341 cores, epoch 600 slots, ticket submission ends at slot 500, rotation period 10, preimage expunge period 19,200, super-majority 683 of 1023, verdict thresholds 683/0/341, ring size 1023","6 validators, 2 cores, epoch 12 slots, ticket submission ends at slot 10, rotation period 4, preimage expunge period 32, super-majority 5 of 6, verdict thresholds 5/0/2, ring size 6","6 validators, 2 cores, epoch 12 slots, ticket submission ends at slot 12, rotation period 4, preimage expunge period 32, super-majority 4 of 6, verdict thresholds 4/0/2, ring size 6"],"answer":2,"optNotes":["雖然仍滿足 |κ| = 3C，但不是任何一份 W3F 設定的值——tiny 就是 6 個 validator、2 個 core。","這其實是 full 配置的數字；tiny 改動的遠不只 gas limit，連 ring 大小與 assurance bitfield 寬度都不同。","6/2/12、Y = 10、rotation 4、expunge 32、super-majority 5 of 6，全部對上 jamtestvectors 的 tiny。","Y 必須小於 E，tiny 是 Y = 10 < E = 12；super-majority 是 ⌊2·6/3⌋ + 1 = 5 不是 4，verdict 門檻也跟著錯。"],"explanation":"jamtestvectors README（tiny）：num_validators 6、num_cores 2、epoch_duration 12、contest_duration（Y）10、rotation_period 4、preimage_expunge_period 32、tickets_per_validator 3（0.7.x；0.8.0 由 ⌈2E/V⌉ = 4）、max_tickets_per_extrinsic 3、num_ec_pieces_per_segment 1026；其他常數同 GP。門檻一律從 |κ| 現算：super-majority ⌊2·6/3⌋+1 = 5、wonky 門檻 ⌊6/3⌋ = 2；assurance bitfield 1 byte；Bandersnatch ring 大小 6（Zcash SRS）。對照 full 配置則是 1023 validators / 341 cores / epoch 600、expunge 19,200、super-majority 683、wonky 341。JIP-4 chainspec 的 protocol_parameters 就是用 fetch(0) 的編碼傳遞這些參數；你們 chainspec.ApplyProtocolParameters 會驗證編譯期常數必須一致。","trap":"tiny 的 Y = 10 < E = 12，所以每個 epoch 只有 slot 10、11 兩個 tail slot。"},{"id":"b2-appA-branch-both-targets","ch":"A","section":"A.5 Single-Step State Transition (branch)","gpRef":"eq. A.21 (branch), A.5 (ϖ), A.2 (v_blob)","difficulty":3,"kind":"code","tags":["pvm","branches","basic-blocks","delta-0.8.0"],"stem":"Every conditional branch in the team's 0.7.2 interpreter (instBranch for 170–175 and the branch_*_imm handlers) resolves through this helper. Under GP 0.8.0 eq. A.21, which statement about the branch rule is correct?","code":{"lang":"go","caption":"PVM/branch.go (branch) + call site in PVM/instructions.go (instBranch)","src":"func branch(pc ProgramCounter, b ProgramCounter, C bool, bitmask Bitmask, instruction ProgramCode) (ExitReason, ProgramCounter) {\n\tswitch {\n\tcase !C:\n\t\treturn ExitContinue, pc\n\tcase !bitmask.IsStartOfBasicBlock(b) && instruction.isOpcodeValid(b):\n\t\treturn ExitPanic, pc\n\tdefault:\n\t\treturn ExitContinue, b\n\t}\n}\n\n// instBranch (opcodes 170-175), after computing branchCondition:\n\treason, newPC := branch(pc, vX, branchCondition, interp.Program.Bitmasks, interp.Program.InstructionData)\n\tif reason != ExitContinue {\n\t\tpvmLogger.Errorf(\"instBranch branch error at pc: %d, opcode: %s\", pc, zeta[opcode(interp.Program.InstructionData[pc])])\n\t\treturn ExitReason(reason), pc\n\t}\n\n\treturn reason, newPC"},"options":["The helper is already 0.8.0-compliant: eq. A.21 validates b only on the taken path, because the fall-through ı + 1 + skip(ı) has already been proved by v_blob to be a bitmask-flagged, valid opcode and so is trivially a legal continuation; the extra isOpcodeValid clause is a harmless strengthening","0.8.0 still validates only the taken target, but now additionally requires it to be 2-octet aligned like a dynamic jump (b mod Z_A = 0 with Z_A = 2) and to appear somewhere in the jump table j, neither of which this helper checks; the fall-through path remains unvalidated in 0.8.0 too","0.8.0 removed the runtime panic entirely: v_blob now walks every branch at deblob time and rejects the blob unless both of its targets lie in ϖ, so deblob returns error and Ψ panics before a single instruction runs; both the check on b and the isOpcodeValid clause are therefore dead code","0.8.0 panics whenever either target is not a basic-block start — the taken target b or the fall-through ı + 1 + skip(ı) — even when the condition is false; this helper validates only b, and only when C holds, so a not-taken branch with an invalid target continues here but must panic in 0.8.0"],"answer":3,"optNotes":["「通過 v_inst 的合法 opcode」與「∈ ϖ」是兩回事——ϖ 只收 0 或某個 terminator 的下一條。","對齊與查 j 只出現在 eq. A.22 的 djump；靜態 branch 的條件只有兩個目標都 ∈ ϖ。","eq. A.2 的 v_blob/v_inst 只驗指令流形狀，一個跳躍目標都不看，runtime 的 ϖ 檢查省不得。","eq. A.21 的第一個 case 不管 C 真假都要求兩個目標都在 ϖ，所以沒跳的無效 fall-through 也得 ☇。"],"explanation":"eq. A.21：branch(b, C) ⟹ (ε, ı′) = (☇, ı) when b ∉ ϖ ∨ ı + 1 + skip(ı) ∉ ϖ；(▸, ı + 1 + skip(ı)) otherwhen ¬C；(▸, b) otherwise。GP 原文：「conditional jumps are valid if and only if both branches point to the start of a basic block (regardless of whether a branch is taken), otherwise a panic occurs」。你們的 branch() 先 `case !C: return ExitContinue, pc`——沒跳就完全不檢查，跳了才檢查 b（還加了 isOpcodeValid 條件，把跳到無效 opcode 的情況留給 trap 處理），這是 0.7.2「taken 才驗證」的語意；issues digest 的 #1046（PVM update 0.8.0）把「branch/jump dual-target validation」列為 App. A 的變更之一。實務上只要 blob 通過 v_blob，branch 的 fall-through 位置必然在 ϖ 裡（branch ∈ T，eq. A.5 的 ϖ 定義），唯一例外是 branch 是程式最後一條指令：ı + 1 + skip(ı) = |c| ∉ ϖ，0.8.0 不論條件真假都在 branch 本身 ☇（0.7.2 則是沒跳時掉出程式碼、執行 ζ 的 0 = trap 才 panic，且多扣一次 gas）。","trap":"0.8.0 口訣：branch 的兩個目標（taken 與 fall-through）都必須是 basic block 起點，不管有沒有跳。"},{"id":"b2-appA-gas-charged-flag","ch":"A","section":"A.5 Single-Step State Transition (gas charged flag)","gpRef":"eq. A.8 (ε^ϱ, ϱ*, flag′), A.11 (flag*), A.6 (𝔏), A.39 (Ψ_H starts with ⊥); §B invoke/machine","difficulty":3,"kind":"concept","tags":["pvm","gas","host-calls","delta-0.8.0"],"stem":"GP 0.8.0 threads a boolean 'gas charged' flag through Ψ. A basic block has an ecalli in its middle; the host call returns ▸ and Ψ_H resumes at ı″ = ı′ + 1 + skip(ı′). Which statement about gas charging in this situation is correct?","options":["Nothing is charged again on that resume: ecalli is not a terminator, so flag* stays ⊤ and Ψ_1 skips the ϱ^Δ deduction; the flag becomes ⊥ only after a terminator executes (or on an out-of-gas exit), while a brand-new Ψ_H — which always starts with ⊥ — resuming at a mid-block ı charges the whole block ϱ^Δ(𝔏(ı)), not just the remaining suffix","The whole block ϱ^Δ(𝔏(ı″)) is charged a second time on every host-call resume, because 0.8.0 added ecalli to the terminator set T so that a host call always ends a basic block; the flag exists only so that the first block of a fresh Ψ_H is not charged twice over","The flag matters only for out-of-gas resumption: on every other exit it is discarded and Ψ_H unconditionally charges ϱ^Δ of the block containing ı″ before continuing; on an ∞ exit it is set to ⊤ so that gas already deducted is not deducted again once more gas is supplied, and it is a parameter of Ψ_H* alone, never of Ψ itself","Only the suffix of the block is re-charged: every non-▸ exit — a host call included — clears the flag to ⊥, and Ψ_1 then prices just the instructions from ı″ up to the block’s terminator, so a block interrupted by n host calls costs its ϱ^Δ plus n partial re-charges"],"answer":0,"optNotes":["ecalli 不在 §A.3 的 T 裡所以 flag* 維持 ⊤；而全新的 Ψ_H 從 ⊥ 開始、扣的是整個 𝔏(ı) block。","§A.3 的 T 只有 trap、fallthrough、jump、jump_ind、load_imm_jump(_ind) 與 branch_*，不含 ecalli。","eq. A.8 的 OOG 支是 (∞, ϱ, ⊥)：flag 清成 ⊥ 且 gas 一分未扣；flag 也是 Ψ 本身的參數。","ϱ^Δ 的引數是 𝔏(ı) 即 block 起點，GP 沒有 suffix 計價；eq. A.11 也只有兩種情況會清 flag。"],"explanation":"eq. A.8：(ε^ϱ, ϱ*, flag′) = (▸, ϱ, ⊤) when flag = ⊤；(▸, ϱ − ϱ^Δ(c, k, 𝔏(ı)), ⊤) otherwhen ϱ ≥ ϱ^Δ(c, k, 𝔏(ı))；(∞, ϱ, ⊥) otherwise。eq. A.11：flag* = ⊥ when flag′ = ⊥ ∨ (c_ı ∈ T ∧ ε* ∈ {▸} ∪ {h̄} × N_R)，否則 ⊤。T（§A.3）= trap、fallthrough、jump、jump_ind、load_imm_jump(_ind)、所有 branch_*；ecalli（10）不在 T 裡，所以 ecalli 造成 h̄ exit 時 flag* = ⊤，Ψ（eq. A.1）把這個 flag′ 回傳，Ψ_H*（eq. A.38）以同一個 flag′ 續跑 → 不重複收費。flag 何時變 ⊥：執行了 terminator 且 ε* = ▸（下一步進新 block、或「jumps back to the beginning of the current basic block」都重新收費），以及 OOG（此時 ϱ 不變、ı* = ı）。𝔏（eq. A.6）= max(j ∈ ϖ : j ≤ ı) 是「含 ı 的 block 起點」，所以 flag = ⊥ 而 ı 在 block 中間時，扣的是整個 block 的 ϱ^Δ；Ψ_H ≡ Ψ_H*(…, ⊥, …)（eq. A.39）——每次新的 Ψ_H 都從 ⊥ 開始。App. B 也配合：machine 建立內層 PVM 時 flag 初始為 ⊥，invoke 把 Ψ 回傳的 flag′ 存回 m*[n]，內層 host call 後再 invoke 不會重扣；內層 OOG 後補 gas 再 invoke 才會重扣。這正是 #1046 review 的修正：「mid-block resume must charge the full containing block cost L(i) first — not just the suffix」。你們 0.7.2 沒有這個 flag（每指令 1 gas，SingleStepInvokeDecodedBlocks 逐條扣）。","trap":"flag 只被「執行完的 terminator」與「OOG」清成 ⊥；ecalli 不是 terminator，host call 續跑不重扣。"},{"id":"b2-appA-recompiler-block-gas-stub","ch":"A","section":"A.5 Single-Step State Transition (gas charging) — x86-64 recompiler","gpRef":"eq. A.8 (ε^ϱ, ϱ* unchanged on ∞), A.10 (ı* = ı), A.54 (ϱ^Δ)","difficulty":3,"kind":"code","tags":["pvm","gas","recompiler","delta-0.8.0"],"stem":"The recompiler contains a prepared-but-disabled block-level gas path for GP 0.8.0 (shown together with the current 0.7.2 per-instruction landing pad). Measured against eq. A.8, what is still wrong with the prepared path?","code":{"lang":"go","caption":"PVM/recompiler/gas.go (emitOutOfGasExit, emitBlockGasCheck, emitBlockOutOfGasExit)","src":"// emitOutOfGasExit emits the temporary GP v0.7.2 per-instruction OOG landing pad.\nfunc emitOutOfGasExit(a *asm.Assembler, oog asm.Label, instrPC PVM.ProgramCounter) {\n\t_ = a.BindLabel(oog)\n\t// Undo the fused charge: on OOG the interpreter leaves gas unchanged.\n\ta.SubMemImm32(RegGuestBase, -int32(OffsetGas), -1)\n\ta.MovMemImm32_32(RegGuestBase, -int32(OffsetExitPC), int32(instrPC))\n\ta.MovImm64ToReg(RegScratch, uint64(PVM.ExitOOG))\n\ta.MovRegToMem(RegGuestBase, -int32(OffsetExitReason), RegScratch)\n\ta.Jmp(a.ExitTrampoline())\n}\n\n// emitBlockGasCheck is the prepared block-based gas charging path for GP v0.8.0.\nfunc (c *Compiler) emitBlockGasCheck(a *asm.Assembler, blockOOG asm.Label, instrCount int64) {\n\ta.SubMemImm32(RegGuestBase, -int32(OffsetGas), int32(instrCount))\n\ta.Jcc(asm.CondS, blockOOG)\n}\n\n// emitBlockOutOfGasExit is the prepared block-entry OOG landing pad for GP v0.8.0.\nfunc emitBlockOutOfGasExit(a *asm.Assembler, blockOOG asm.Label, blockStartPC PVM.ProgramCounter) {\n\t_ = a.BindLabel(blockOOG)\n\ta.MovMemImm32_32(RegGuestBase, -int32(OffsetExitPC), int32(blockStartPC))\n\ta.MovImm64ToReg(RegScratch, uint64(PVM.ExitOOG))\n\ta.MovRegToMem(RegGuestBase, -int32(OffsetExitReason), RegScratch)\n\ta.Jmp(a.ExitTrampoline())\n}"},"options":["The direction: 0.8.0 charges a block only once its terminator has executed, so the SubMemImm32 belongs after the terminator with the sign check reversed; charging at block entry would bill a block that panics half-way through, which eq. A.8 avoids precisely by deferring the deduction","Nothing: in 0.8.0 each instruction still costs 1 gas and is merely aggregated per block, so subtracting the instruction count at block entry is exactly ϱ^Δ; and leaving the counter negative on the out-of-gas path is intended, because Ψ_M's R function reports consumption as u = ϱ − max(ϱ′, 0) and clamps it anyway","Two things: the amount deducted must be the block's ϱ^Δ from the A.9 pipeline simulation (max(cycles − 3, 1)), not its instruction count; and on the out-of-gas path the deduction must be undone, because A.8 leaves ϱ unchanged when ϱ < ϱ^Δ — the per-instruction pad restores its charge, the block pad does not","Only the exit PC: on a block-entry out-of-gas exit eq. A.10 requires ı* to point at the block's terminating instruction — the last one the charge would have paid for — rather than at the block start; the amount deducted and the untouched-gas rule are both already handled correctly by this code"],"answer":2,"optNotes":["事後收費等於讓 panic 的 block 免費，正是 GP 要求「預先扣款」所要防的事。","0.8.0 的 ϱ^Δ 來自 §A.9 管線模擬，與指令數沒有固定比例；u 的 clamp 也救不了寫回外層的負 counter。","金額要換成 eq. A.54 的 max(cycles − 3, 1)，且 A.8 的 ϱ* = ϱ 要求 landing pad 把預扣的錢加回去。","eq. A.10 在 ε^ϱ ≠ ▸ 時 ı* = ı（嘗試收費的那條指令）；而金額與不扣款兩點正是真正的缺陷所在。"],"explanation":"eq. A.8：ϱ ≥ ϱ^Δ(c, k, 𝔏(ı)) 才扣（ϱ* = ϱ − ϱ^Δ），否則 (∞, ϱ, ⊥)——「the execution is interrupted and the gas counter remains unchanged」；§A.5 也明說「No instruction is allowed to execute within a basic block unless the gas cost for the entire basic block has been charged in advance」。emitBlockGasCheck 用「先 sub 再看 SF」的技巧，判斷方向沒錯（post-charge < 0 ⟺ pre-charge < 金額），但 (1) 金額是 instrCount——那是 0.7.2 的 GasCost = InstrCount（block_info.go），0.8.0 要用 eq. A.54 的 ϱ^Δ = max(cycles − 3, 1)，由 A.9 的 ROB 模擬與 A.10 表算出（#1046 之後 interpreter 與 recompiler 共用 GasCostForBlock）；(2) 走到 emitBlockOutOfGasExit 時記憶體裡的 gas 已經是「負的」，沒有像 emitOutOfGasExit 那樣 `SubMemImm32(…, -1)` 把錢加回去，違反 ϱ* = ϱ；後果可觀察：R（eq. A.48）算 u = ϱ − max(ϱ′, 0) 會變成「全部 gas 用光」，invoke host call 也會把負的 g′_R 寫回記憶體。至於 ExitPC = blockStartPC：eq. A.10 在 ε^ϱ ≠ ▸ 時 ı* = ı，也就是「嘗試收費的那條指令」，正常進入 block 時就是 block 起點，這部分沒錯（唯一例外是 flag = ⊥ 且從 block 中間恢復，此時 ı* 是恢復點，扣的仍是整個 block）。","trap":"OOG 時 ϱ 不變（A.8）——「先扣再判斷」的 JIT 寫法一定要在 landing pad 把錢加回去，而且扣的是 ϱ^Δ 不是指令數。"},{"id":"b2-appA-load-imm-jump-ind-reg-write","ch":"A","section":"A.5.1 Instruction Tables (load_imm_jump_ind) & A.1 (Ψ on panic)","gpRef":"eq. A.34 table (opcode 180), A.22 (djump), A.1 (Ψ returns φ′ on ☇/∎), A.10; §B invoke","difficulty":3,"kind":"code","tags":["pvm","jumps","edge-case","test-vectors"],"stem":"In this implementation of load_imm_jump_ind the register write φ_A = ν_X happens even when the dynamic jump panics. Is that what GP 0.8.0 prescribes, and can the difference ever be observed?","code":{"lang":"go","caption":"PVM/instructions.go (instLoadImmJumpInd, opcode 180)","src":"// opcode 180\nfunc instLoadImmJumpInd(interp *Interpreter, pc ProgramCounter, skipLength ProgramCounter) (ExitReason, ProgramCounter) {\n\trA, rB, vX, vY, err := decodeTwoRegistersAndTwoImmediates(interp.Program.InstructionData, pc, skipLength)\n\tif err != nil {\n\t\tpvmLogger.Errorf(\"instLoadImmJumpInd decodeTwoRegistersAndTwoImmediates error: %v\", err)\n\t\treturn ExitPanic, pc\n\t}\n\t// per https://github.com/koute/jamtestvectors/blob/master_pvm_initial/pvm/TESTCASES.md#inst_load_imm_and_jump_indirect_invalid_djump_to_zero_different_regs_without_offset_nok\n\t// the register update should take place even if the jump panics\n\tdest := uint32(interp.Registers[rB] + vY)\n\treason, newPC := djump(pc, dest, interp.Program.JumpTable, interp.Program.Bitmasks)\n\n\tinterp.Registers[rA] = vX\n\tswitch reason {\n\tcase ExitPanic:\n\t\treturn reason, pc\n\tcase ExitHalt:\n\t\treturn reason, pc\n\tdefault:\n\t\treturn reason, newPC\n\t}\n}"},"options":["No: §A.1's 'the machine state represents the prior state of said instruction' covers ☇ just as it covers ∞, F̄ and h̄, so φ_A must stay untouched when the djump panics; the write is a latent bug that goes unnoticed only because Ψ_M's R function maps ☇ to the panic result and throws the register file away","No: eq. A.10 rolls back every mutation of a panicking instruction — ε* = ☇ forces (ı*, φ*, μ*) = (ı, φ, μ) exactly as it does for a page fault — so φ_A keeps its old value; the koute PVM test vectors bear this out, expecting φ_A unchanged in every *_nok djump case — the jump-to-zero, the over-length and the misaligned variants alike","Yes, but only for the halt sentinel a = 2^32 − 2^16, where φ_A = ν_X is part of what the caller reads back; eq. A.22 evaluates djump before the register write, so on the panic branch the write is skipped, and no caller could observe it anyway because a panicking inner machine leaves the outer memory untouched","Yes: the table row defines djump((φ_B + ν_Y) mod 2^32) and φ′_A = ν_X as independent mutations, and on ☇ Ψ returns the posterior registers φ′ with only ı reset to 0; it is observable because the invoke host call writes the inner machine's registers back to memory even when the inner exit is PANIC, and at top level via φ_7/φ_8 when the sentinel halts"],"answer":3,"optNotes":["那句 prior state 的主詞是「In all other cases」，☇/∎ 回的是 posterior 狀態、只有 ı 歸零。","回捲只發生在 ε^ϱ ≠ ▸ 與 ε^μ ≠ ▸ 兩支，指令層級的 ☇ 走的是 otherwise 支 (ε, ı′, φ′, μ′)。","eq. A.34 把兩個 mutation 並列、沒有任何條件化；invoke 在 c = ☇ 時照樣把 φ′ 寫回外層 RAM。","表列把 djump 與 φ′_A = ν_X 並列，而 eq. A.1 在 ☇ 回傳 posterior 的 φ′，只有 ı 歸零。"],"explanation":"eq. A.34 表列 load_imm_jump_ind：djump((φ_B + ν_Y) mod 2^32)，φ′_A = ν_X——兩個 mutation 並列、互不條件化；eq. A.22 的 djump 只決定 (ε, ı′)。eq. A.10：ε^ϱ、ε^μ 都是 ▸ 時 (ε*, ı*, φ*, μ*) = (ε, ı′, φ′, μ′)，所以 ε = ☇ 時 φ* 仍含這次寫入；eq. A.1 的 Ψ 在 ε ∈ {☇, ∎} 回傳 (ε, 0, ϱ′, flag′, φ′, μ′)——posterior 的暫存器、只有 ı 歸零。§A.1：「In the case of a final halt, either through panic or success, the instruction counter returned is zero」，而那句「the machine state represents the prior state of said instruction」講的是「In all other cases」，即 ∞ / F̄ / h̄ 這三種可續跑的 exit（Ψ 回傳 (ε, ı, ϱ′, flag′, φ, μ)）。可觀察性：App. B 的 invoke 在 c = ☇ 時仍回 (▸, PANIC, φ_8, μ*, m*)，而 μ* 把 E_8(g′_R) ⌢ E_8(φ′) 寫回外層記憶體，外層程式讀得到內層 panic 後的暫存器；頂層 Ψ_M（eq. A.48 的 R）雖對 ☇ 回 panic，但 sentinel halt 時回傳 μ′[φ′_7 …+φ′_8]，若 A ∈ {7, 8} 也直接可見。你們程式碼註解引用的 koute 測試向量 inst_load_imm_and_jump_indirect_invalid_djump_to_zero_different_regs_without_offset_nok 正是要求 panic 後暫存器已更新。load_imm_jump（80）同理：sjump(ν_Y) 與 φ′_A = ν_X 並列。","trap":"☇ 與 ∎ 回傳 posterior 狀態（只有 ı 歸零）；∞ / F̄ / h̄ 才回傳 prior 狀態以便續跑。"},{"id":"b2-appA-vblob-terminator","ch":"A","section":"A.1 Basic Definition (deblob validity v_blob / v_inst)","gpRef":"eq. A.2 (deblob, v_blob, v_inst), A.3 (skip), A.4 (ζ), A.5 (ϖ)","difficulty":2,"kind":"delta","tags":["pvm","validation","codec","delta-0.8.0"],"stem":"GP 0.8.0's deblob(p, ı) returns error — and Ψ then panics without executing anything — unless v_blob(c, k, 0) and v_inst(c, k, ı) both hold. Which set of conditions do these two validators actually enforce?","options":["|k| = |c|; walking the code from index 0 by 1 + skip(·), every visited octet is flagged in k and is a valid opcode (∈ U); the walk ends exactly at |k| with the last instruction a terminator (∈ T); and the entry point ı is itself a flagged, valid opcode","That every branch and jump target lies in ϖ and that no instruction is longer than 16 octets, both established during a single walk of the code; the final instruction may be anything, because ζ pads the code with zeros so that running off the end simply executes opcode 0 and traps","Only that |k| = |c| and that every jump-table entry points at a basic-block start; opcode validity is left to execution time, where an unknown opcode behaves like opcode 0 and traps, and the entry point ı is accepted wherever it lands, since Ψ re-derives the nearest opcode boundary from k","That the code contains at least one ecalli and ends with a jump_ind to the halt sentinel 2^32 − 2^16, so that every program has a well-defined return path to the host; the bitmask itself needs no check, since k is regenerated from each opcode's length while deblob decodes"],"answer":0,"optNotes":["四項正是 eq. A.2 的 v_blob 與 v_inst：|k| = |c|、沿途皆合法 opcode、剛好停在 |k|、尾端 ∈ T。","跳躍目標是 eq. A.20/A.21 在 runtime 查 ϖ；真正的關鍵被漏掉了——走訪必須停在 |k| 且尾端 ∈ T。","deblob 另外要求 v_inst(c, k, ı)：入口必須 k_ı = 1 且 c_ı ∈ U，Ψ 不會替你重新對齊到最近邊界。","GP 沒有這兩條結構要求；k 是 blob 實際傳來的欄位，正因指令長度隱含才需要它，無法反推。"],"explanation":"eq. A.2：v_blob(c, k, ı) = ⊤ when ı > 0 ∧ ı = |k|；⊥ otherwhen ı + 1 + skip(ı) = |k| ∧ c_ı ∉ T；v_blob(c, k, ı + 1 + skip(ı)) otherwhen v_inst(c, k, ı)；⊥ otherwise。v_inst(c, k, ı) = |k| = |c| ∧ ı < |k| ∧ k_ı = 1 ∧ c_ı ∈ U。也就是從 0 開始沿 skip 走訪每條指令：每個落點都要是 bitmask 標記的合法 opcode、最後一條必須是 terminator、走訪要剛好停在 |k|（空程式因 ı > 0 條件而無效）；deblob 另外用 v_inst(c, k, ı) 驗證入口 ı。這是 0.8.0 的新規（issues digest #1046：「programs whose final block lacks a terminator are invalid (v_blob rule)」；PR #508 摘要：「blobs pre-validated」），動機是 block-based gas：ϱ^Δ 的模擬（eq. A.58 只有遇到 T 才把 x_ı 設為 ∅）需要每個 basic block 都有終點。0.7.2 沒有 v_blob，無效 opcode 或掉出程式碼末端是靠 ζ = c ⌢ [0, 0, …]（eq. A.4）的 trap 在 runtime 才 panic（會多扣 gas）；0.8.0 裡 ζ 的零填充只剩「最後一條指令缺少的引數 octet」這個用途。你們的 preDecodeBlocks 其實已在 deblob 時對「block 跑出程式末端」與無效 opcode 回 ExitPanic，MakeBitMasks 也驗 bitmask 長度，與 0.8.0 方向一致。","trap":"v_blob 驗的是「指令流的形狀」（合法 opcode + terminator 收尾），不驗跳躍目標；跳錯位置仍是 runtime panic。"},{"id":"b2-appB-write-prev-length-full","ch":"B","section":"B.5 General Functions — write","gpRef":"§B.5 `write` = 5 (Ω_W); eq. B.12 (G); eq. 9.8 (a_t)","difficulty":2,"kind":"code","tags":["host-calls","write","storage","fuzz-bug"],"stem":"The excerpt is the team's Ω_W (`write`) after fix #980. A service overwrites a key that currently holds a 100-octet value with a 5,000-octet value (φ_7…φ_10 = k_O, k_Z, v_O, v_Z). Which statement matches GP 0.8.0?","code":{"lang":"go","caption":"PVM/host_call_general.go (write, after PR #980)","src":"\tvalue, storageRawKeyExists := a.StorageDict[string(storageRawKey)]\n\t// ...\n\tif storageRawKeyExists {\n\t\tfootprintItems, footprintOctets = service_account.CalcStorageItemfootprint(string(storageRawKey), value)\n\t\tl = uint64(len(value))\n\t} else { // ... (elided: key only present in the not-yet-decoded state key-vals)\n\t\tl = NONE\n\t}\n\t// ...\n\tif vz == 0 { // remove storage\n\t\tdelete(a.StorageDict, string(storageRawKey))\n\t} else if input.VM.Mem.IsReadable(vo, vz) { // storage append/update\n\t\tstorageRawData := input.VM.Mem.Read(vo, vz)\n\t\t// ...\n\t\tnewMinBalance := service_account.CalcThresholdBalance(newItems, newOctets, a.ServiceInfo.DepositOffset) // a_t\n\t\tif newMinBalance > a.ServiceInfo.Balance {\n\t\t\tinput.VM.Registers[7] = FULL\n\t\t\treturn OmegaOutput{ExitReason: ExitContinue, Addition: input.Addition}\n\t\t}\n\t\t// balance check passed, now apply the storage mutation\n\t\ta.StorageDict[string(storageRawKey)] = storageRawData\n\t\t// ...\n\t} else {\n\t\treturn OmegaOutput{ExitReason: ExitPanic, Addition: input.Addition}\n\t}\n\t// ...\n\tinput.VM.Registers[7] = l"},"options":["If the post-write a_t ≤ a_b the value is stored and φ′_7 = 100, the length of the value being replaced; if a_t > a_b, φ′_7 = FULL and the account is handed back unchanged (s′ = s) — the pre-fix code had already mutated the shared Go map, so the FULL write leaked (#979)","On success φ′_7 = OK (0); a_t > a_b cannot occur for an overwrite because the storage deposit (B_I per item, B_L per octet) is charged only when a key is first created, never when its value changes size, so Ω_W needs no threshold check on this path","On success φ′_7 = 5000, the length of the value just written; if a_t > a_b the value is still stored, φ′_7 = FULL and the shortfall is debited from the balance at the service's next accumulation — so all the fix had to change was the register value, not the order of the map mutation","If a_t > a_b the host call exits ☇ (panic) so that the whole accumulation collapses to the checkpointed context y; otherwise φ′_7 = 100, the length of the value being replaced, and the value is stored — the collapse is exactly what made the pre-fix map mutation harmless"],"answer":0,"optNotes":["成功回舊值長度 100（key 原本不存在才回 NONE），FULL 時 s′ = s——所以必須先算門檻再改 map。","a_t 隨 a_o 變動（每筆 storage 計 34 + |k| + |v|），改變 value 大小就會拉高門檻。","回傳的是被取代的舊值長度而不是新長度；GP 的 FULL 分支回的是原封不動的 s，沒有欠款概念。","☇ 只保留給記憶體錯誤；餘額不足是可續行的 FULL，context 不會被丟棄，污染會一路寫進 δ′。"],"explanation":"Ω_W（write = 5）定義：[k_O, k_Z, v_O, v_Z] = φ_7…φ_10；k = μ[k_O..+k_Z]（不可讀 → error）；a = s 但 a_storage[k] = μ[v_O..+v_Z]（v_Z = 0 時改為刪除 k；value 範圍不可讀 → error）；l = |s_storage[k]| 若 k ∈ keys(s_storage)，否則 NONE；(ε′, φ′_7, s′) = (☇, φ_7, s) 當 k = error ∨ a = error；(▸, FULL, s) 當 a_minbalance > a_balance；(▸, l, a) 否則。所以成功時回傳的是「被取代的舊值長度」，FULL 時 s′ = s 一字不改。a_t（eq. 9.8）= max(0, B_S + B_I·a_i + B_L·a_o − a_f)，而 a_o 含每筆 storage 的 34 + |k| + |v|，所以把 100 octets 換成 5,000 octets 會拉高 a_t。你們的 bug #979（fuzz seed 3785638964 step 15419）：write 先改了 StorageDict 再檢查門檻，Go map 淺複製共用底層 map，FULL 的寫入仍被持久化 → state root mismatch；PR #980 改成先算 newMinBalance 再改 map（即上面的順序）。另外 accumulate 中 write 經 G（eq. B.12）包裝：x*_self = 回傳的 s′，所以同一次 accumulate 之後的 read/info 看得到新值。","trap":"write 回傳「舊長度或 NONE」，不回傳 OK；v_Z = 0 是刪除；FULL 時必須零副作用。"},{"id":"b2-appB-read-cross-service-pure","ch":"B","section":"B.5 General Functions — read","gpRef":"§B.5 `read` = 4 (Ω_R); eq. B.11–B.12 (F, G)","difficulty":3,"kind":"code","tags":["host-calls","read","storage","fuzz-bug","accumulation"],"stem":"Excerpt from the team's Ω_R (`read`) after fix #938, which added the `callerServiceID == serviceID` guard (s* = φ_7, or the caller when φ_7 = 2^64−1). Accumulating service A reads a storage key of service B, which is not accumulating in this block. Which statement is correct?","code":{"lang":"go","caption":"PVM/host_call_general.go (read, after PR #938)","src":"\tvar a types.ServiceAccount\n\tcallerServiceID := serviceID\n\tif sStar == uint64(serviceID) {\n\t\ta = delta[serviceID]\n\t} else if value, exists := delta[types.ServiceID(sStar)]; exists {\n\t\ta = value\n\t\tserviceID = types.ServiceID(sStar)\n\t} else {\n\t\tinput.VM.Registers[7] = NONE\n\t\treturn OmegaOutput{ExitReason: ExitContinue, Addition: input.Addition}\n\t}\n\tstorageRawKey := input.VM.Mem.Read(ko, kz)\n\tv, exists := a.StorageDict[string(storageRawKey)]\n\tstorageValueFromKeyVal := getStorageFromKeyVal(input.Addition.GeneralArgs.StorageKeyVal, serviceID, storageRawKey)\n\tif !exists {\n\t\tif storageValueFromKeyVal == nil { // check storage state key-val\n\t\t\tinput.VM.Registers[7] = NONE\n\t\t\treturn OmegaOutput{ExitReason: ExitContinue, Addition: input.Addition}\n\t\t} else {\n\t\t\tv = *storageValueFromKeyVal\n\t\t\t// ...\n\t\t\tif callerServiceID == serviceID {\n\t\t\t\ta.StorageDict[string(storageRawKey)] = v\n\t\t\t\tinput.Addition.AccumulateArgs.ResultContextX.PartialState.ServiceAccounts[serviceID] = a\n\t\t\t\tremoveStorageFromKeyVal(input.Addition.GeneralArgs.StorageKeyVal, serviceID, storageRawKey)\n\t\t\t}\n\t\t}\n\t}"},"options":["The read must observe the posterior state being built in this block — including writes by services accumulated earlier in the same round — so the cached value has to be refreshed from the accumulation context on every read rather than removed from the pool, and the guard is itself a bug because it suppresses that refresh for every s* ≠ s","The read must be served from the lookup-anchor snapshot exactly as `historical_lookup` does, so mutating the current-state cache is only a performance concern and can never change δ′; the guard merely avoids decoding B's key-vals twice, and the state-root divergence came from the merge rule alone","Ω_R(ϱ, ω, μ, s, s, d) may look up any account in d but hands back only the caller's account s (mirrored into x by G); a read of B is a pure lookup that must leave B untouched — before the guard, B's key-val was evicted from the unmatched pool, B's entry vanished from the merged δ′ and the state root diverged","Reading another service's storage is not permitted by Ω_R: for s* ≠ s the call must return WHO without touching memory or the key-val pool, so in a compliant implementation the branch that reaches B's account is unreachable and the guard is merely defensive — cross-service inspection is what `info` and `historical_lookup` are for"],"answer":2,"optNotes":["d 是 Ψ_A 拿到的 partial state 快照，同一輪其他 service 的寫入本來就看不到，refresh 也救不了。","historical_lookup 只存在於 refine；且因果顛倒——交集式 merge 是既定設計，缺陷在純函數留下副作用。","跨 service 讀取在 GP 裡是純函數：G 只把呼叫者自己的帳戶寫回 x_self，B 不可能被改動。","d（partial state 的 accounts）正是為了讓 s* ≠ s 能查而傳進來的，而且查不到時回的是 NONE。"],"explanation":"Ω_R（read = 4）：s* = s 若 φ_7 = 2^64−1，否則 φ_7；a = s（呼叫者自己，含本次已 write 的內容）若 s* = s；d[s*] 若 s* ∈ keys(d)；否則 none。[k_O, k_Z, o] = φ_8…φ_10、v_Z = φ_12、f = min(φ_11, |v|)、l = min(v_Z, |v| − f)；v = error（key 範圍不可讀）→ ☇；a = none 或 k ∉ keys(a_storage) → NONE（不是 WHO——WHO 是 transfer/eject/provide 等找不到 service 時用的）；否則寫 v[f..f+l] 到 μ[o..+l] 並回傳 |v|。read 的 mutation 只有 (ε′, φ′_7, μ′)，s′ = s；在 accumulate 的 F（eq. B.11）中 read 被 G 包起來，G 只把「呼叫者自己的帳戶」寫回 x_self（eq. B.12），所以跨 service 的讀取在 GP 裡是純函數，不可能改動 B。d 是 (x_u)_d，即 Ψ_A 拿到的 partial state 快照（Δ1 對同一輪的每個 service 傳同一份 e，§12 平行累加），因此同一輪其他 service 的寫入本來就看不到。你們的 #938（bug id 1776702160_6218）：A 讀 B 的 key 時，把 B 的 entry 從 UnmatchedKeyVals cache 移除當成最佳化，但 B 這個 block 沒有 accumulate，其本地帳戶副本從未寫回 d′，而 #880 的 merge 採交集語意（任何輸出缺少的 key 視為被刪除）→ B 的 storage 全局消失、state root mismatch；修法就是只在 callerServiceID == serviceID 時才快取並移除。","trap":"read/lookup/info 找不到回 NONE（2^64−1）；跨 service 讀取是唯讀快照，只有自己的帳戶會經 G 寫回 x。"},{"id":"b2-appB-unknown-hostcall-oog","ch":"B","section":"B.2/B.3/B.4 — context mutator F, default case","gpRef":"eq. B.2, B.6, B.11 (default case); eq. B.13 (C); M_∅ in App. I","difficulty":2,"kind":"code","tags":["host-calls","gas","fuzz-bug","delta-0.8.0"],"stem":"During accumulation a service executes `ecalli 9` (`machine`, a refine-only call) with ϱ = 300 gas remaining. The team's dispatcher routes ids that are not in the invocation's table to hostCallException (below, after PR #992). What does GP 0.8.0 prescribe for this situation?","code":{"lang":"go","caption":"PVM/host_call_general.go (hostCallException / chargeGasAndCheck, after PR #992)","src":"func hostCallException(input OmegaInput) (output OmegaOutput) {\n\tif result := chargeGasAndCheck(&input); result != nil {\n\t\treturn *result\n\t}\n\tinput.VM.Registers[7] = WHAT\n\treturn OmegaOutput{\n\t\tExitReason: ExitContinue,\n\t\tAddition:   input.Addition,\n\t}\n}\n\nfunc chargeGasAndCheck(input *OmegaInput) *OmegaOutput {\n\t*input.VM.Gas -= 10\n\tif *input.VM.Gas < 0 {\n\t\treturn &OmegaOutput{\n\t\t\tExitReason: ExitOOG,\n\t\t\tAddition:   input.Addition,\n\t\t}\n\t}\n\treturn nil\n}"},"options":["The machine panics (☇) with no gas charged: a host-call id outside the invocation's table is treated like an invalid instruction, and the accumulation collapses to the checkpointed context y","The default branch of F charges M_∅ = 1000 first: ϱ′ = 300 − 1000 < 0, so the invocation exits ∞ and Ψ_A collapses to the checkpointed context y; under the 0.7.2 flat charge of 10 the same call would have continued with φ′_7 = WHAT","The `ecalli` surfaces to the caller of Ψ_A as the exit h̄ × 9: the accumulation is aborted, treated as a host-call fault, and the service's result for this block is recorded as BAD","φ′_7 = WHAT and execution continues at the next instruction regardless of the remaining gas — nothing was executed, so an unknown or unavailable host call can never by itself trigger out-of-gas (the pre-#992 behaviour)"],"answer":1,"optNotes":["ecalli 對任何立即數都是合法指令，未知 id 只是走 default 分支，不是無效指令。","0.8.0 的 M_∅ = 1000 > 300，ϱ′ < 0 使 invocation ∞，collapse 因而取 checkpoint 過的 y。","§A.6 的 Ψ_H 把每個 host id 都交給 F 處理，最上層永遠看不到 h̄；BAD 也不在 Ψ_A 的值域裡。","F 的 default 是「先扣 M_∅ 再回 WHAT」，扣費本身就可能把 ϱ′ 壓到負值而 ∞。"],"explanation":"三個 invocation 的 mutator F（eq. B.2、B.6、B.11）最後兩行完全相同：ω′ = ω 但 φ′_7 = WHAT，ϱ′ = ϱ − M_∅；若 ϱ′ < 0 → (∞, ϱ′, ω′, μ)，否則 (▸, ϱ′, ω′, μ)。M_∅（Gas cost charged for an unknown host-call）在 0.8.0 是 1000（0.7.2 是 10，你們 chargeGasAndCheck 裡的 10 就是 0.7.2 值）。所以 ϱ = 300 時：300 − 1000 = −700 < 0 → ∞；Ψ_M 的 u = ϱ − max(ϱ′, 0) = 300（全部耗盡）；collapse C（eq. B.13）在 o ∈ {∞, ☇} 時採用 exceptional context Y（最後一次 checkpoint 的狀態，沒 checkpoint 就是初始 I(s, s)）。只有 refine 用 invoke 驅動的 inner machine 才會把 ecalli 以 (HOST, h) 回報給外層。你們的 #993：hostCallException 扣 10 gas 後沒檢查 gas 是否為負（fuzzer session 8f50823b… step 175662，service 0x6707fa2e 在 accumulate 呼叫了無效 host function）；參考實作 polkajam 停機（∞）、你們繼續執行 → θ（LastAccOut）、β（BEEFY root）與 state root 分歧；PR #992 補上 chargeGasAndCheck 的 OOG 檢查（GP 0.7.2 gavofyork/graypaper#482「explicit OOG check for each invocation mutator default case」）。升 0.8.0 時要把 10 換成 M_∅ = 1000（連同其他 host call 的 base + per-KiB 費用，見 App. I）。","trap":"未知 host call「先扣費再回 WHAT」，扣費本身就能觸發 ∞；0.8.0 的 M_∅ = 1000 不是 10。"},{"id":"b2-appB-invoke-gas-refund","ch":"B","section":"B.6 Refine Functions — invoke","gpRef":"§B.6 `invoke` = 13 (Ω_K); eq. B.4 (inner PVM tuple); §B.1 inner result codes","difficulty":3,"kind":"code","tags":["host-calls","refine","inner-pvm","gas","delta-0.8.0"],"stem":"The excerpt is the team's 0.7.2 `invoke` (Ω_K): it reads a 112-octet block at φ_8, runs inner machine n = φ_7 and writes the block back. Apart from the id shift (12 → 13), which GP 0.8.0 rule is missing from it?","code":{"lang":"go","caption":"PVM/host_call_refine.go (invoke, 0.7.2 numbering)","src":"\tn, o := input.VM.Registers[7], input.VM.Registers[8]\n\n\toffset := uint64(112)\n\t// g = panic\n\tif !input.VM.Mem.IsWriteable(o, offset) {\n\t\tinput.VM.Registers[7] = OOB\n\t\treturn OmegaOutput{ExitReason: ExitPanic, Addition: input.Addition}\n\t}\n\t// ... (WHO if n is not a known machine; decode g and w[0..13] from the 112 octets)\n\t// wrap m[n]_p (program), w (registers), m[n]_u (memory), g (gas)\n\ttempInterp := NewInterpreter(&tmpProgram, w, &tempMemory, Gas(g))\n\t// ...\n\tc, pcPrime = tempInterp.SingleStepInvoke(input.Addition.IntegratedPVMMap[n].PC)\n\t// ... (re-encode gas' and registers')\n\t// write data into memory (mu)\n\tinput.VM.Mem.Write(o, data)\n\n\t// m* = m\n\ttmp := input.Addition.IntegratedPVMMap[n]\n\ttmp.Memory = *tempInterp.Memory\n\tif c.GetReasonType() == HOST_CALL {\n\t\ttmp.PC = pcPrime + 1 + ProgramCounter(skip(int(pcPrime), input.Addition.Program.Bitmasks))\n\t} else {\n\t\ttmp.PC = pcPrime\n\t}\n\tinput.Addition.IntegratedPVMMap[n] = tmp"},"options":["Resumption: on a HOST exit the saved instruction counter must stay on the `ecalli` itself, so that the outer service can re-execute that instruction after servicing the call, exactly as Ψ does for a page fault; advancing it by i′ + skip(i′) + 1 drops an instruction","Nested host calls: an `ecalli` executed by the inner machine must be dispatched through the refine mutator F (historical_lookup, export, …) instead of stopping the inner run, so Ω_K has to invoke Ψ_H rather than Ψ and the outer service should never see the HOST result code at all","Memory: the 112-octet block need only be readable, because in 0.8.0 the inner gas and the 13 registers are handed back through φ′_7…φ′_12 rather than written back into the block, so a readable-but-unwritable window is fine and the excerpt's OOB-and-panic path should be a plain WHO instead","Gas: the outer machine pays g = M_K + g_R up front (∞ if ϱ < g; g_R is the inner gas read from the block) and afterwards gets the inner's unspent g_R′ back, ϱ′ = ϱ − g + g_R′; the inner machine also carries a gas-charged flag for its current basic block"],"answer":3,"optNotes":["m*[n]_i = i′ + skip(i′) + 1 正是要跳過那條 ecalli；停在原地會讓 resume 後無限重複同一個 ecalli。","inner PVM 刻意沒有 host call 能力，Ω_K 明寫呼叫 Ψ，ecalli 一律以 (HOST, h) 停機交外層處理。","GP 要求 N_{o..+112} ⊆ writable(μ)，因為 g_R′ 與 w′ 要原地寫回同一塊，不可寫就 ⟨0, error⟩ → ☇。","0.7.2 只扣 10 且 inner gas 完全獨立；0.8.0 要外層預付 M_K + g_R 並退還未用完的 g_R′。"],"explanation":"Ω_K（invoke = 13）：[n, o] = φ_7,8；⟨g_R, w⟩ 滿足 E_8(g_R) ⌢ E_8(w) = μ[o..+112]（8 octets gas + 13 個 8-octet 暫存器），且 N_{o..+112} 必須 ⊆ writable(μ)，否則 ⟨0, error⟩ → ☇（因為結果要寫回同一塊）；(c, i′, g_R′, f′, w′, u′) = Ψ(m[n]_p, m[n]_i, g_R, m[n]_f, w, m[n]_u)——是 Ψ 不是 Ψ_H，inner 沒有 host call，遇到 ecalli 就以 c = h̄ × h 停下；μ* 寫回 E_8(g_R′) ⌢ E_8(w′)；m*[n]_i = i′ + skip(i′) + 1 當 c ∈ {h̄} × N_R（跳過那條 ecalli，讓外層 service 代為服務後 resume），否則 i′；m*[n]_f = f′（eq. B.4 的 inner PVM tuple ⟨p, u, i, f⟩，f 是「本 basic block 的 gas 已扣」旗標，因為 0.8.0 gas 以 basic block 為單位預扣，mid-block resume 時不能再扣一次——#1046 review 也提到 A.4 的 L(i)）。gas：g = M_K + g_R（M_K = 968）；ϱ′ = ϱ − g 當 w = error ∨ n ∉ keys(m) ∨ ϱ < g，否則 ϱ − g + g_R′——也就是外層先付全部 inner gas，剩下的退回；ϱ < g 依 B.18/B.19 直接 ∞。回傳：(HOST, h)、(FAULT, x 位址)、OOG、PANIC、HALT 進 φ′_7/φ′_8（非 HOST/FAULT 時 φ′_8 不變）；n 不存在 → WHO。你們的 0.7.2 版本只扣 10 gas，inner 的 g 完全獨立、也不退還——這正是 #1046 的「invoke gas refund」項目；同一 PR 也加了 machine 的 63 台上限（GP PR #521，|m| ≥ 63 → FULL，且排在 ☇ 之前）。另外值得複查：excerpt 的 skip 用的是 input.Addition.Program.Bitmasks（外層程式的 bitmask），GP 的 skip(i′) 應以 inner 程式 m[n]_p 的 bitmask 計算。","trap":"invoke 的 112 octets 必須「可寫」；inner 無 host call（ecalli → HOST）；0.8.0 外層預付 g_R 並退還 g_R′。"},{"id":"b2-appB-pages-access-modes","ch":"B","section":"B.6 Refine Functions — pages","gpRef":"§B.6 `pages` = 12 (Ω_Z); App. I M_Z,* gas constants","difficulty":3,"kind":"code","tags":["host-calls","refine","inner-pvm","memory"],"stem":"The excerpt is the team's `pages` (Ω_Z) acting on inner machine n over page range [p, p+c) with mode r (φ_7…φ_10 = n, p, c, r). Compared with GP 0.8.0, which statement is correct?","code":{"lang":"go","caption":"PVM/host_call_refine.go (pages, 0.7.2 numbering)","src":"\tif r > 4 || p < 16 || p+c >= (1<<32)/ZP {\n\t\tinput.VM.Registers[7] = HUH\n\t\treturn OmegaOutput{ExitReason: ExitContinue, Addition: input.Addition}\n\t}\n\tif r > 2 && !isReadable(p, c, input.Addition.IntegratedPVMMap[n].Memory) {\n\t\tinput.VM.Registers[7] = HUH\n\t\treturn OmegaOutput{ExitReason: ExitContinue, Addition: input.Addition}\n\t}\n\t// otherwise : ok\n\t// u_v\n\tif r >= 3 {\n\t\tfor i := uint32(p); i < uint32(p+c); i++ {\n\t\t\tinput.Addition.IntegratedPVMMap[n].Memory.Pages[i] = &Page{\n\t\t\t\tValue:  make([]byte, ZP),\n\t\t\t\tAccess: MemoryInaccessible,\n\t\t\t}\n\t\t}\n\t}\n\t// u_a\n\tif r == 1 || r == 3 {\n\t\tfor i := uint32(p); i < uint32(p+c); i++ {\n\t\t\tinput.Addition.IntegratedPVMMap[n].Memory.Pages[i] = &Page{\n\t\t\t\tValue:  make([]byte, ZP),\n\t\t\t\tAccess: MemoryReadOnly,\n\t\t\t}\n\t\t}\n\t}\n\t// ... (r == 2 || r == 4: same loop with Access: MemoryReadWrite)\n\tinput.VM.Registers[7] = OK"},"options":["The code is correct: Ω_Z zero-fills the range for every r ∈ 0…4 and only the resulting access differs (0 → inaccessible, 1/3 → R, 2/4 → W); the GP never distinguishes an allocation from a mode change, which is why App. I prices every r with one base cost and one per-page rate","Two semantic gaps: for r = 0 the GP zero-fills the range and makes it inaccessible (the code leaves it untouched), and for r ∈ {3, 4} the GP keeps the page contents and only changes the access mode to R or W (the code re-allocates zeroed pages instead)","The only gap is the error code: when r > 2 and a page of the range is inaccessible the GP returns OOB (inner-PVM memory index not accessible) exactly as `peek` and `poke` do, rather than HUH; the page mutations themselves are right, and r = 0 rightly leaves the octets alone","The GP validates r ∈ 0…4, p ≥ 16 and p + c < 2^32/Z_P before looking up n, so an invalid request aimed at a non-existent machine must yield HUH where the code yields WHO; the page mutations themselves are right, and an invalid r is free, no gas constant being defined for it"],"answer":1,"optNotes":["u′_value 只在 r < 3 時被清成 0；附錄 I 也給了 free/alloc/setmode 三組不同費率而非一組。","r = 0 是「歸零 + 設為不可存取」，r ∈ {3, 4} 保留內容只改權限——實作恰好兩邊都做反了。","Ω_Z 的結果只有 WHO/HUH/OK，OOB 專屬於 peek/poke 對 inner memory 的位元組範圍存取。","u = error（n ∉ keys(m)）是第一個 case 且回 WHO；無效 r 也不免費，M_Z,i = 80。"],"explanation":"Ω_Z（pages = 12）：[n, p, c, r] = φ_7…φ_10；u = m[n]_u（n ∉ keys(m) → error）；u′ = u 但 value[p·Z_P..+c·Z_P] = [0, 0, …] 當 r < 3、否則保留原值；access[p..+c] = [∅…] 當 r = 0、[R…] 當 r ∈ {1, 3}、[W…] 當 r ∈ {2, 4}；(φ′_7, m′) = (WHO, m) 當 u = error；(HUH, m) 當 r > 4 ∨ p < 16 ∨ p + c ≥ 2^32/Z_P（= 2^20 頁；p < 16 保護最低的 64 KiB）；(HUH, m) 當 r > 2 ∧ access[p..+c] ∋ ∅（改權限只能對已配置的頁）；(OK, m′) 否則。語意上 r = 0 是「釋放」（歸零 + 不可存取）、1/2 是「配置」（歸零 + R/W）、3/4 是「改權限」（內容保留）；把內容留著等於把舊資料留在一個之後可能被重新配置的頁裡。0.8.0 的 gas 也依此分類：free M_Z,f,c + c·M_Z,f,p = 212 + 118/頁、alloc 275 + 121/頁、setmode 130 + 29/頁、無效 r 固定 M_Z,i = 80——三組常數正是因為三種操作成本不同。對照你們的程式：r = 0 什麼都沒做（GP 要歸零並設為不可存取）；r ≥ 3 先配置歸零頁再設 R/W（GP 要保留內容）——code-map 3.12.9 也標出這個分歧；而 WHO 先於 HUH 的順序與 GP 一致。額外注意：r > 2 的檢查把「頁索引 p、頁數 c」丟給 isReadable(start, offset, m)，而該函式（argument_invocation.go）以位元組位址計算 startPage = start / Z_P，所以檢查的是錯的頁——這條路徑沒有 conformance vectors 覆蓋，遷移 0.8.0 時值得補測。","trap":"pages 的 r：0 釋放、1/2 配置（歸零）、3/4 只改權限（保留內容）；錯誤碼是 WHO/HUH，沒有 OOB、沒有 panic。"},{"id":"b2-appB-eject-conditions","ch":"B","section":"B.7 Accumulate Functions — eject","gpRef":"§B.7 `eject` = 22 (Ω_J); eq. 9.8 (a_i, a_o); eq. B.3 (D)","difficulty":3,"kind":"concept","tags":["host-calls","eject","preimages","accounts"],"stem":"Service 7 (accumulating) calls `eject` (index 22) with φ_7 = 9 and φ_8 = o, where μ[o..+32] = h. Under GP 0.8.0, when does the call return OK, and what happens then?","options":["Service 9 exists, is not the caller, and its code hash equals the code hash of service 7 with its parent field a_p = 7; its footprint is exactly a_i = 2 with l = max(81, a_o) − 81 (one request (h, l), no storage); a_l[(h, l)] = [x, y] with y < t − D; then 9 is deleted and its balance is burned","Service 9 exists, is not the caller, and its code hash equals E_32(7); its footprint is exactly a_i = 2 with l = max(81, a_o) − 81 (one request (h, l), no storage); a_l[(h, l)] = [], still unprovided; then 9 is deleted and its entire balance is credited to the registrar χ_R","Service 9 exists, is not the caller, and its code hash equals E_32(7); its footprint is exactly a_i = 2 with l = max(81, a_o) − 81 (one request (h, l), no storage); a_l[(h, l)] = [x, y] with y < t − D; then 9 is deleted and its entire balance is added to service 7","Service 9 exists, is not the caller, and its code hash equals E_32(7); its footprint is exactly a_i = 2 with l = max(81, a_o) − 81 (one request (h, l), no storage); a_l[(h, l)] = [x, y, w] with w < t − D; then 9 is deleted and its entire balance is added to service 7"],"answer":2,"optNotes":["Ω_J 比對的是 d_c = E_32(呼叫者索引)；兩個 service 共用同一份 code 是正常狀態，a_p 也從未被讀。","[] 表示「已請求、從未提供」，不保證沒有 refine 還需要它；χ_R 也與 eject 的資金流向無關。","code hash = E_32(呼叫者) 是自我停用標記，狀態須為 [x, y] 且 y < t − D，餘額歸呼叫者。","三元素狀態只有 forget 會處理，Ω_J 的 OK 分支只匹配長度為 2 的 [x, y]，且過期看的是中間的 y。"],"explanation":"Ω_J（eject = 22，g = M_J = 458）：[d, o] = φ_7,8；h = μ[o..+32]（不可讀 → ☇）；d = accounts[d] 只在 d ≠ x_id ∧ d ∈ keys(accounts) 時成立，否則 error → WHO；d_c ≠ E_32(x_id) → WHO；l = max(81, d_o) − 81；d_i ≠ 2 ∨ (h, l) ∉ keys(d_l) → HUH；d_l[(h, l)] = [x, y] ∧ y < t − D → OK：accounts \\ {d} ∪ {x_id ↦ s′}，s′_b = x_self_b + d_b；其他情況（[]、[x]、[x, y, w]、或 y 尚未過期）→ HUH。81 從哪來：eq. 9.8 定義 a_i = 2·|a_l| + |a_s|、a_o = Σ_{(h,z)∈a_l}(81 + z) + Σ_{a_s}(34 + |k| + |v|)；「恰一個 request、沒有 storage」等價於 a_i = 2 且 a_o = 81 + z，因此 l = a_o − 81 就把那個唯一 request 的長度 z 還原出來（通常是被 eject 的 service 自己舊 code 的 preimage）。設計意圖：一個 service 把自己的 code hash 設成 E_32(某個 service 索引)（不可能是合法 code 的值，等於自我停用）就等於指名「由那個 service 回收我」；等最後一個 preimage 已 forget 且過了 D = L + 4,800 = 19,200 slots（eq. B.3，確保 refine 的 historical lookup 不再需要它），parent 才能回收餘額並刪帳戶。你們的 eject()（host_call_accumulate.go）：SerializeFixedLength(callerID, 32)、max(81, Bytes) − 81、Items != 2、lookupDataLength == 2 && lookupData[1] < timeslot − D，與 GP 相符。","trap":"eject 的三把鎖：code hash = E_32(呼叫者)、a_i = 2（唯一 request）、該 request 狀態 [x, y] 且 y < t − D；餘額歸呼叫者。"},{"id":"b2-appB-log-jip1","ch":"B","section":"B.2–B.4 mutator default case & JIP-1 `log`","gpRef":"eq. B.2, B.6, B.11 (default branch); JIP-1 (host call 100)","difficulty":2,"kind":"concept","tags":["host-calls","jip","log","fuzz-bug"],"stem":"A service executes `ecalli 100` (`log`). Which statement is correct?","options":["`log` is specified by JIP-1, not by the Gray Paper: its observable effects match an unimplemented index — φ′_7 = WHAT and the gas of a bad-index call — and an unreadable message/target range must have no side-effects (no panic); the node merely prints the message","`log` is consensus-critical: the formatted message is hashed into the service's accumulation output θ and hence into the BEEFY root β_B, so every node must implement byte-identical level/target/message formatting, and an unreadable range must panic (☇)","`log` is host call 100 of GP App. B, available in all three invocations: it returns OK, costs M_∅ = 1000 and, like every other host call that reads memory, panics (☇) when the message range is not readable — omitting that check merely turns a specified panic into a crash","`log` exists only in Ψ_R as a guarantor diagnostic, where it returns OK and charges M_∅; during accumulate and is-authorized `ecalli 100` instead falls through to the mutator's WHAT default, so the same program sees OK in one invocation and WHAT in another"],"answer":0,"optNotes":["JIP-1 刻意讓 log 對共識透明：回傳值與 gas 都與「未實作的壞 index」完全一致。","yield（26）才是唯一把 32-octet hash 送進 x_y → θ′ → BEEFY 的管道，log 不改任何 context 欄位。","JIP-1 明寫「No side-effects if memory access is invalid」，☇ 會讓實作與未實作的節點分岔。","三張表都註冊了 [100]；JIP-1 的重點正是不論實作與否、不論哪個 invocation 都看到同樣結果。"],"explanation":"GP 附錄 B 沒有 index 100；純 GP 節點對 ecalli 100 走 F 的 default（eq. B.2/B.6/B.11）：扣 M_∅、φ′_7 = WHAT、繼續（gas 不足則 ∞）。JIP-1「Debug message host call」原文：Index 100、Name log、Gas usage 10「(same as host-call with bad index)」；輸入 φ_7 = level（0 fatal … 4 pedantic）、target = ∅ 若 φ_8 = 0 ∧ φ_9 = 0 否則 μ[φ_8..+φ_9]、message = μ[φ_10..+φ_11]；輸出 φ′_7 = WHAT——「WHAT is always returned so that authorizer/service behaviour is the same whether or not this JIP is implemented」；「No side-effects if memory access is invalid」。換言之 log 對共識刻意「透明」：不進 θ/β、不改狀態、不 panic，回傳值與 gas 都與未實作時一致（注意 JIP 的「10」是 0.7.x 時代的 bad-index 費用；0.8.0 的 M_∅ = 1000，實作時要跟目前 GP 版本對齊，否則 gas 統計會分歧）。它不是 refine 專屬：你們 host_call_invocation.go 的三張表都註冊了 [100] = logHostCall。你們的 #975（fuzz seed 309584898、tiny spec）：logHostCall 讀 (r10, r11)/(r8, r9) 前沒做 isReadable，直接解參考未配置的頁 → target 程序崩潰（「IO error: early eof」）；PR #976 改成不可讀就 continue、無副作用。另外值得核對：現行 logHostCall 沒有設 φ′_7 = WHAT（註解寫「none modified per spec」），與現在的 JIP-1 文字不符——若 service 在 log 後讀 φ_7，會與依 JIP-1 或純 GP 的節點不一致。","trap":"log 不在 GP 裡；合規做法 = 印訊息、φ′_7 = WHAT、bad-index 費用、記憶體無效時零副作用（不能 panic、更不能 crash）。"},{"id":"appC-code-avspec-080","ch":"C","section":"C.2 Block Serialization (availability specification)","gpRef":"§C.2 E(s ∈ availability spec); eq. 11.5; eq. 11.31","difficulty":2,"kind":"code","tags":["codec","availability-spec","delta-0.8.0"],"stem":"The team's encoder for the availability specification (work-package spec) is still on GP 0.7.2. What must change so that it produces the GP 0.8.0 wire form E(s) of §C.2, and which on-chain rule accompanies the new field?","code":{"lang":"go","caption":"internal/types/encode.go (WorkPackageSpec.Encode) — struct fields: Hash, Length U32, ErasureRoot, ExportsRoot, ExportsCount U16","src":"func (w *WorkPackageSpec) Encode(e *Encoder) error {\n\tcLog(Cyan, \"Encoding WorkPackageSpec\")\n\n\t// Hash\n\tif err := w.Hash.Encode(e); err != nil {\n\t\treturn err\n\t}\n\n\t// Length\n\tif err := w.Length.Encode(e); err != nil {\n\t\treturn err\n\t}\n\n\t// ErasureRoot\n\tif err := w.ErasureRoot.Encode(e); err != nil {\n\t\treturn err\n\t}\n\n\t// ExportsRoot\n\tif err := w.ExportsRoot.Encode(e); err != nil {\n\t\treturn err\n\t}\n\n\t// ExportsCount\n\tif err := w.ExportsCount.Encode(e); err != nil {\n\t\treturn err\n\t}\n\n\treturn nil\n}"},"options":["Replace the fixed E_4 Length with a compact E(l) and add v as a compact natural right after it; v is whatever number of chunks the guarantor actually distributed, so it is not checked on-chain","Append E_2(v) after ExportsCount, because since GP 0.7.0 any newly added field of a structure must go to its end to keep decoders streaming-friendly; on-chain v must equal the number of cores C","Nothing on the wire: v is derivable from the validator count V and is therefore never serialized; only the JSON test-vector schema gains an erasure_shards field for readability","Insert a U16 erasure-shard count v, encoded E_2(v), between ErasureRoot and ExportsRoot; the other widths stay as they are (E_4 length, E_2 exports count); on-chain every incoming report must carry v = |κ′|"],"answer":3,"optNotes":["長度 l 仍是 E_4 而非 compact，v 也不是 guarantor 自由決定的——eq. 11.31 在鏈上檢查它。","「新欄位排最後」只針對變長（↕）欄位；v 是固定 2 octets、位置由 GP 明定，而且 v 不是 C。","v 必須進 wire，否則另一個 validator-set 大小的 assurer 無從驗證這份 report。","§C.2 把 E_2(v) 排在 u 與 e 之間，且 eq. 11.31 要求 (w_s)_v = |κ′|——每個 assurer 恰一個 chunk。"],"explanation":"GP 0.8.0 §C.2：E(s ∈ availability spec) ≡ E(p, E_4(l), u, E_2(v), e, E_2(n))——依序是 package hash p、bundle 長度 l（E_4）、erasure root u、erasure-shard 數 v（E_2）、segment root e、segment 數 n（E_2）。eq. 11.5 把 v ∈ N_V（validator count 型別）放在 u 與 e 之間；eq. 11.31：∀w ∈ 進來的 reports：(w_s)_v = |κ′|，因為「one chunk is distributed to each assurer, the number of chunks must equal the size of the assuring validator set」。0.8.0 的 erasure coding 以 v 為參數（§14.4.1 的 A(p, b, s, v) 用 z = 2·d(v)），所以規格本身要記錄 v；GP 也註明對兩個不同大小的 validator set 派發時要做兩次 erasure coding、產生兩份不同的 work-report。你們的 PR #1026 就是在 ErasureRoot 與 ExportsRoot 之間加 `ErasureShards U16`（producer 設為 TotalShards），這會改變每一個 on-chain WorkReport 的位元組佈局（進而影響 report hash、guarantee 簽名、ρ 內容）。","trap":"0.7.2 五欄位 (p, l, u, e, n) → 0.8.0 六欄位 (p, l, u, v, e, n)；v 是 E_2 且必須等於 |κ′|。"},{"id":"appC-code-operand-transfer-prefix","ch":"C","section":"C.2 Block Serialization (operand tuple and deferred transfer)","gpRef":"§C.2 E(deferred transfer), E(operand tuple); eq. B.9; §B.4 fetch cases 14–15; eq. 12.13–12.14","difficulty":2,"kind":"code","tags":["codec","accumulation","deferred-transfer","fetch"],"stem":"The team prefixes each accumulate input item with a byte before its body. Which explanation of the two prefixes and of what actually consumes this encoding is correct per GP 0.8.0?","code":{"lang":"go","caption":"internal/types/encode.go (OperandOrDeferredTransfer.Encode)","src":"func (o *OperandOrDeferredTransfer) Encode(e *Encoder) error {\n\tcLog(Cyan, \"Encoding OperandOrDeferredTransfer\")\n\n\t// if operand is nil, append 0 to the buffer, else append 1\n\tif o.Operand == nil && o.DeferredTransfer == nil {\n\t\treturn errors.New(\"Operand and DeferredTransfer are both nil\")\n\t}\n\t// ...\n\t// Operand\n\tif o.Operand != nil {\n\t\t// prefix\n\t\te.buf.Write([]byte{0})\n\n\t\tif err := o.Operand.Encode(e); err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n\n\t// DeferredTransfer\n\tif o.DeferredTransfer != nil {\n\t\t// prefix\n\t\te.buf.Write([]byte{1})\n\n\t\tif err := o.DeferredTransfer.Encode(e); err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n\n\treturn nil\n}"},"options":["The prefixes are a team convention for the JSON test vectors only; on the wire GP orders all transfers before all operands and tells them apart by fixed length, a transfer body being 152 octets; the service learns the split from Ψ_M's initial argument, which carries both counts rather than one total","The prefix is the account-serialization version byte introduced in GP 0.7.1 (0 = legacy operand layout, 1 = transfer layout with the 128-octet memo); Ψ_A takes two separate sequences, one of operands and one of transfers, and 0.8.0 drops the byte because the two never share a sequence","The prefixes are the discriminators GP puts in front of E(operand tuple) (0) and E(deferred transfer) (1); Ψ_A takes one mixed sequence i ∈ ⟦operand ∪ transfer⟧ and the service reads it back through fetch (cases 14/15), so each item must be self-describing","The prefixes separate the two halves of the accumulate memory image: Ψ_M's initial argument E(t, s, |i|) is followed by every operand (prefix 0) and then every transfer (prefix 1) written into RAM at start-up, so fetch only ever has to serve work-package data and nothing needs to be self-describing"],"answer":2,"optNotes":["GP 沒有「transfer 在前、靠固定長度分辨」的規則——operand 的 ↕t 與 O(l) 本來就是變長。","0.7.1 的 version byte 是 C(255, s) 值的開頭；eq. B.9 收的仍是 operand ∪ transfer 的混合序列。","Ψ_M 的初始參數只有 E(t, s, |i|)，項目靠 fetch 14/15 讀回，所以每一項必須自我描述。","初始記憶體只含數量不含 i 的內容；§B.4 的 φ_10 = 14／15 回的正是 E(↕i) 與 E(i[φ_11])。"],"explanation":"GP §C.2 明確定義 E(x ∈ deferred transfer) ≡ E(1, E_4(s), E_4(d), E_8(a), m, E_8(g))（memo m 固定 128 octets、不加長度前綴）以及 E(x ∈ operand tuple) ≡ E(0, p, e, a, y, g, O(l), ↕t)——開頭的 1/0 就是 discriminator。為什麼需要：eq. B.9 的 Ψ_A 接收的是 i ∈ ⟦operand tuple ∪ deferred transfer⟧ 這種『混合序列』（eq. 12.13–12.14，accumulation.tex：「the union of the two characterizes inputs to the Accumulation invocation function」）；Ψ_M 的初始參數只有 E(t, s, |i|)，項目本身是服務透過 fetch host call 讀回：§B.4 的 fetch 在 φ_10 = 14 時回傳 E(↕i)、15 時回傳 E(i[φ_11])。沒有 discriminator，服務無法分辨讀到的是 operand 還是 transfer。你們的實作正好對應：operand 用 0、transfer 用 1，Operand.Encode 的 GasLimit 走 EncodeInteger（compact，與 GP 的 g 一致），AuthOutput 帶長度前綴。","trap":"1 = transfer、0 = operand；memo 128 octets 無前綴；fetch 14/15 把整段 E(↕i) 或單一 E(i[k]) 交給服務。"},{"id":"appD-code-service-info-key","ch":"D","section":"D.1 Serialization (state-key constructor C)","gpRef":"§D.1 state-key constructor C (unlabelled first equation of appendix D)","difficulty":3,"kind":"code","tags":["merklization","state-keys","fuzzer-bug"],"stem":"Before PR #780 the team recognised a service-info key C(255, s) by testing only stateKey[0] == 0xFF, and fuzzer traces failed with 'failed to decode expected service info from state key 0xffff0017…: EOF'. Why was byte 0 alone ambiguous, and why is the current check sound?","code":{"lang":"go","caption":"internal/utilities/merklization/parse_state_key_vals.go (IsServiceInfoKey) + state_key_constructor.go (ServiceWrapper.StateKeyConstruct)","src":"func IsServiceInfoKey(stateKey types.StateKey) bool {\n\tif stateKey[0] != 0xFF {\n\t\treturn false\n\t}\n\tfor i := 1; i < len(stateKey); i++ {\n\t\tif i == 1 || i == 3 || i == 5 || i == 7 {\n\t\t\tcontinue\n\t\t}\n\t\tif stateKey[i] != 0 {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}\n\n// [n_0, h_0, n_1, h_1, n_2, h_2, n_3, h_3, h_4, h_5,...,h_26] where n = encode_4(service_id)\nfunc (w ServiceWrapper) StateKeyConstruct() (output types.StateKey) {\n\tn := encodeServiceID(w.ServiceIndex)\n\ta := hash.Blake2bHashPartial(w.h[:], 27)\n\tfor i := 0; i <= 3; i++ {\n\t\toutput[2*i] = n[i]\n\t\toutput[2*i+1] = a[i]\n\t}\n\tfor i := 4; i <= 26; i++ {\n\t\toutput[i+4] = a[i]\n\t}\n\treturn output\n}"},"options":["C(255, s) keys for service ids above 2^24 spill their fourth id octet into position 9, so byte 0 alone cannot separate them from the chapter keys C(9)…C(16); the fix therefore skips positions 1, 3, 5, 7 and tolerates position 9 as well","The chapter key C(255)
