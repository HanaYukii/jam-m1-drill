P(H)_t < H_T holds (its parent is known and older). How does GP §5 classify this block?","options":["It is valid as long as the drift stays below one slot period P = 6 s, which the GP grants as an explicit clock-skew tolerance so that honest authors at the very start of a slot are not rejected by peers whose clocks run marginally slow","It is permanently invalid, and since authoring ahead of the clock is an offence the author's Ed25519 key must reach ψ_O as a culprit in the next block's disputes extrinsic, so the node discards the header rather than keeping it","It is valid: only the ordering rule P(H)_t < H_T belongs to consensus, while the wall-clock comparison is authoring guidance — which is exactly why the STF test vectors carry no notion of T and an importing node must accept the block","It fails eq. 5.8 for now, but the GP notes such a block 'may become valid as T advances' — unlike a block with H_T ≤ P(H)_t, which can never become valid, it is only temporarily invalid and may be re-evaluated later"],"answer":3,"optNotes":["GP 沒有任何 clock-skew 容忍條款，eq. 5.8 就是 H_T·P ≤ T 這個硬比較。","ψ_O 只由 E_D 的 culprits/faults 增長，那些爭議全部圍繞 work-report 的正確性，與出塊時間無關。","eq. 5.8 的兩個 conjunct 都是有效性條件；vectors 不含 T 只因離線 trace 表達不了 wall-clock。","T 會前進，所以未來區塊只是暫時無效；而 H_T ≤ P(H)_t 永遠不可能變真。"],"explanation":"eq. 5.8：P(H)_t < H_T ∧ H_T·P ≤ T（P = 6 秒，T 為自 JAM Common Era 起的 wall-clock 秒數）。§5：「A block may only be regarded as valid once the time-slot index H_T is in the past」，而且「Blocks considered invalid by this rule may become valid as T advances」——節點可以暫存未來區塊、等 T 追上再 import。對照你們的 code：STF 裡只檢查 τ < τ′（safrole.go 的 BadSlot：「timeslot value must be strictly monotonic」），wall-clock 條件放在 header_controller.ValidateTimeSlot（出塊路徑，用 time.Now() 與 JamCommonEra 2025-01-01 12:00 UTC 相減）；STF test vectors 與 fuzzer trace 都不含 wall-clock，所以這條規則只在 live 節點的 gossip/import 路徑上有意義。","trap":"「暫時無效」只適用於未來 slot；跳過的 slot（H_T > P(H)_t + 1）是合法的，不要跟未來 slot 混淆。"},{"id":"ch05-author-index-bound-set","ch":"5","section":"5 The Header","gpRef":"eq. 5.10 & eq. 6.8 (valcount)","difficulty":3,"kind":"code","tags":["header","validators","delta-0.8.0","fuzzer-bug","code"],"stem":"After fuzzer bug #825 (a header with H_I = 65535 panicked UpdateEtaPrime0 with 'index out of range [65535] with length 6' because the index was used before being validated), the team added this check. Is the bound it uses the one GP 0.8.0 specifies?","code":{"lang":"go","caption":"internal/stf/validate_header.go (ValidateNonVRFHeader, excerpt)","src":"\t// Validate author_index out of range.\n\t// NOTE: There is currently no official error code defined for this case.\n\t// We may need to update this once the spec updates.\n\tif header.AuthorIndex >= types.ValidatorIndex(len(priorState.Kappa)) {\n\t\terrCode := SafroleErrorCode.AuthorIndexOutOfRange\n\t\treturn &errCode\n\t}\n\treturn nil\n}"},"options":["Yes: the bound is the constant V (1023 full / 6 tiny); κ and κ′ always hold exactly V entries in every configuration, so either length works and the choice of set is purely cosmetic — the only substantive fix for #825 was ordering the range test before the index is dereferenced","Yes: eq. 5.10 defines H_I ∈ N_{|κ|} — the author must belong to the prior active set, because the block is built on the prior state and its seal is verified before the epoch's key rotation is applied, so len(priorState.Kappa) is exactly the spec bound and #825 needed nothing beyond moving the test ahead of UpdateEtaPrime0","No: H_I indexes the pending set γ_P, since the first block of an epoch is sealed by the incoming validators; the bound must therefore be |γ_P| read out of the prior Safrole state, because κ′ is only assigned once the seal has been verified and bounding H_I by it would be circular","Not exactly: eq. 5.10 bounds H_I by |κ′| (the posterior active set, whose key also verifies H_S and H_V); the prior κ is equivalent only while |κ| = |κ′|, which holds today because the team never resizes the set, but 0.8.0 lets validator-set sizes differ across an epoch boundary (eq. 6.8)"],"answer":3,"optNotes":["eq. 6.8 的 𝕍 ≡ {3c | 2 ≤ c ≤ C} 允許長度變動，「V 是常數」是 0.7.2 的寫法。","順序講反了：κ′ ≺ (H, τ, κ, γ) 先算出來、seal 驗證在其後，拿 κ′ 當上界沒有循環問題。","epoch 首塊時 κ′ 已經等於舊的 γ_P，index 的對象就是 κ′ 本身，不必繞道 γ_P。","eq. 5.10 的上界是 |κ′|；0.8.0 (#514) 起 |κ| 與 |κ′| 可在 epoch 交界不相等。"],"explanation":"eq. 5.10：H_I ∈ N_{|κ′|}，H_A ≡ κ′[H_I]_b——用的是 posterior active set（epoch 的第一個區塊由剛輪替進來的 κ′ = 舊 γ_P 出塊；#784/#791 就是因為用 prior κ/η 驗 seal 與 H_V 而失敗）。0.7.2 這裡的上界是常數 V；0.8.0（PR #514）改為 |κ′|，且 eq. 6.8 允許 validator 序列長度是 6 到 3C 之間任何 3 的倍數、designate 可以改變 ι 的長度。你們目前 |κ| ≡ |κ′| ≡ ValidatorsCount（offender 的 key 就地清零、不移除，issue #1037），所以 len(priorState.Kappa) 暫時等價；一旦支援變動大小，集合變大時會誤拒合法的 H_I ∈ [|κ|, |κ′|)，變小時會放過非法 index，接著在 η′_0 = H(η_0 ⌢ Y(H_V)) 或 seal 驗證取 κ′[H_I] 時再度 panic——正是 #825 的症狀。另一個重點：這個 bound check 必須排在所有使用 κ′[H_I] 的步驟（UpdateEtaPrime0、seal/VRF 驗證）之前——#825 的本質是「先用後驗」。","trap":"H_I 對 κ′ 取 index，bound 也是 |κ′|；0.8.0 之後不要再把 V 當常數用。"},{"id":"ch07-beta-entry-timeslot-080","ch":"7","section":"7 Recent History","gpRef":"eq. 7.2, 7.8 & eq. 11.36; §D.1 C(3)","difficulty":2,"kind":"delta","tags":["recent-history","delta-0.8.0","codec","anchor"],"stem":"This 0.7.2 code builds the entry appended to β_H at the end of a block. What must change for GP 0.8.0, and which on-chain check motivates the change?","code":{"lang":"go","caption":"internal/recent_history/recent_history_controller.go (NewItem) — GP 0.7.2 checkout","src":"// pack item $n$ (7.8) GP 0.6.7\n/*\n\titem $n$ = (header hash $h$, accumulation-result mmr $b$, state root $s$, WorkReportHash $\\mathbf{p}$)\n*/\nfunc NewItem(headerHash types.HeaderHash, workReportHash []types.ReportedWorkPackage, accumulationResultMmr types.OpaqueHash) (item types.BlockInfo) {\n\tzeroHash := types.StateRoot{}\n\titem = types.BlockInfo{\n\t\tHeaderHash: headerHash,\n\t\tBeefyRoot:  accumulationResultMmr,\n\t\tStateRoot:  zeroHash,\n\t\tReported:   workReportHash,\n\t}\n\treturn item\n}"},"options":["Store the whole accumulation-output sequence θ′ in place of the super-peak b, because eq. 11.36 now compares the anchor's accumulation log entry by entry rather than against one commitment, which is also why 0.8.0 moved the belt out of C(3) and into its own state key","Add the lookup-anchor posterior state root of every report guaranteed in the block, because 0.8.0 added that field to the refinement context and β_H is the only on-chain place where the value can be recorded — the ancestor set A holds headers, not the roots that follow them","Add the block's timeslot t = H_T as a fifth field (E_4(t) between s and p under state key C(3)): refinement contexts now carry the anchor's timeslot and eq. 11.36 requires it to equal the t of the matching β† entry (GP PR #526; team PR #1031 threads H_T into NewItem)","Replace the zero state root with the posterior root M_σ(σ′), because 0.8.0 headers now commit to the posterior state rather than the prior one; eq. 7.5's β† correction therefore disappears and eq. 11.36 can compare an anchor's state root against the very block that produced it"],"answer":2,"optNotes":["β 存的是 belt 的 super-peak 而不是整個 θ′；C(3) 至今仍同時裝 item 與 mmrencode(β_B)。","lookup-anchor 的 posterior root 用 ancestor set 裡下一個 header 的 H_R 驗（eq. 11.38），不經過 β。","#526 讓 refinement context 帶上 anchor slot，鏈上要驗它，β 的每一筆就必須存 t。","0.8.0 的 header 仍只帶 prior state root，state root 照舊填零、由下一塊的 β† 補正（eq. 7.5）。"],"explanation":"eq. 7.2（0.8.0）：β_H ∈ [(h, s, b, t ∈ N_T, p)]_{:H}——多了 timeslot；eq. 7.8 的新 entry 是 (H(H), H_0, M_R(β′_B), H_T, p)。動機：0.8.0 PR #526 在 refinement context（eq. 11.4）加入 anchor slot 與 lookup-anchor posterior state root，讓 refine 端能得知 anchor 的時間；鏈上要驗它，eq. 11.36 就變成：∃y ∈ β†：anchor hash = y_h ∧ anchor posterior state = y_s ∧ anchor accumulation log = y_b ∧ anchor time = y_t——其中 accumulation log 只比一個 32-byte super-peak，不是逐筆比對。狀態序列化（§D.1 的 C(3)）順序是 (h, b, s, E_4(t), var(p))——注意 b 在 s 之前，與 eq. 7.2 的 tuple 順序 (h, s, b, t, p) 不同；你們 BlockInfo 的欄位 HeaderHash, BeefyRoot, StateRoot, Reported 正是照序列化順序排，PR #1031 把 4-byte timeslot 插在 state_root 與 reported 之間。","trap":"0.8.0 β_H 一項 = 5 欄；序列化順序 h, b, s, t, p（b 在 s 前）；anchor 的四個欄位全部要對上 β† 的同一筆。"},{"id":"ch07-belt-empty-output","ch":"7","section":"7 Recent History","gpRef":"eq. 7.6–7.7 & eq. E.1, E.3","difficulty":3,"kind":"concept","tags":["recent-history","mmr","edge-case"],"stem":"Block N accumulates nothing that yields an output, so θ′ = []. What happens to the accumulation-output belt β_B and to the super-peak b written into block N's β_H entry?","options":["Nothing is appended and b repeats the parent's super-peak, so the belt holds one leaf per block that produced at least one accumulation output and BEEFY verifiers simply skip empty blocks","The block's header hash H(H) is appended in place of the missing output root, so that the belt stays aligned one-to-one with the β_H entries and their header hashes","One leaf is still appended: M_B([], H_K) = N([], H_K) = H_0, so β′_B = A(β_B, H_0, H_K) and b = M_R(β′_B) changes — the belt always carries exactly one leaf per block since genesis","An empty peak ∅ is appended to the peak sequence without any hashing, so the peak count grows by one while b stays unchanged until the next block with a non-empty θ′"],"answer":2,"optNotes":["eq. 7.7 沒有「θ′ 為空就跳過」的條件，belt 的 leaf 數等於創世以來的區塊數。","header hash 進的是 β_H 的 h 欄位，從來不會被 append 進 belt。","M_B([], H_K) = N([], H_K) = H_0：空塊照樣 append 一片 H_0 的 leaf，super-peak 每塊都變。","∅ 只在 MMR 進位時作為空 peak 出現（eq. E.8 的 R(r, n, ∅)），不會因 θ′ 為空而被 append。"],"explanation":"eq. 7.6–7.7：s = [E_4(s) ⌢ E(h) | (s, h) ∈ θ′]，β′_B ≡ A(β_B, M_B(s, H_K), H_K)。θ′ 來自 eq. 12.22/12.24 的 b = {(s, b) | b = yield 結果 ≠ ∅}——只有在 accumulate 裡呼叫 yield 的 service 才會出現，所以大多數區塊的 θ′ 都是空的。此時 s = []，依 eq. E.3：M_B(v, H) 在 |v| = 1 時為 H(v_0)，否則為 N(v, H)；再依 eq. E.1：N([], H) = H_0（零 hash）。你們的 lastAccOutRoot → merkle.Mb：len(v) == 0 時走 N 回傳 zeroHash，再交給 AppendOne（OpaqueHash 長度固定 32，不會被當成空值略過），行為一致。","trap":"belt 是「每塊一片 leaf」的 MMR；空區塊的 leaf 是 H_0 不是 ∅。因此兩個相鄰的空區塊，其 β_H 的 b 也不相同。"},{"id":"ch08-leftmost-removal-code","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 8.3 (F) & eq. 11.25, 11.32","difficulty":2,"kind":"code","tags":["authorization","code","fuzzer-bug"],"stem":"Before PR #694 (bug #692) this removal deleted every occurrence of the used authorizer hash and ignored the report's core. Which statement correctly describes the GP rule the fixed code implements and why the old behaviour was wrong?","code":{"lang":"go","caption":"internal/authorization/authorization.go (updatePoolFromQueue) & internal/types/types.go (AuthPool.RemoveLeftMostPairedValue)","src":"func updatePoolFromQueue(coreIndex types.CoreIndex, eg types.ReportGuarantee, alpha types.AuthPools) (types.AuthPools, error) {\n\tpool := alpha[coreIndex]\n\tif pool == nil {\n\t\treturn nil, fmt.Errorf(\"alpha[%d] is nil\", coreIndex)\n\t}\n\n\t// (8.3)   remove (g_r)a from α[c]（leftmost match）\n\tauthHashToRemoved := eg.Report.AuthorizerHash\n\tpool.RemoveLeftMostPairedValue(authHashToRemoved)\n\n\talpha[coreIndex] = pool\n\treturn alpha, nil\n}\n\nfunc (a *AuthPool) RemoveLeftMostPairedValue(h OpaqueHash) {\n\tresult := (*a)[:0]\n\tremoved := false\n\tfor _, v := range *a {\n\t\tif removed || !bytes.Equal(v[:], h[:]) {\n\t\t\tresult = append(result, v)\n\t\t} else {\n\t\t\tremoved = true\n\t\t}\n\t}\n\t*a = result\n}"},"options":["eq. 8.3, but the pool to edit must be found by looking the guarantors' validator indices up in the current rotation's assignment G, not by the core index stored inside the work-report — so a guarantee signed one rotation earlier edits whichever core those validators are sitting on now","eq. 8.3: F(c) = α[c] ⊖ {w_a} removes one left-most instance from the pool of the report's own core; a pool is a sequence that may hold the same hash several times (e.g. a queue repeating one authorizer), so deleting every copy shrank pools and broke the test vectors","eq. 11.32: the removal doubles as the pool-membership check, and a missing match must reject the block — so the old code was wrong only in failing to return an error when nothing matched, which is why the fix belongs in the guarantee validator rather than in the authorization state transition","eq. 8.2: the removal only makes room for the queue entry appended this block, so deleting every duplicate is harmless — α[c] is a set in which one authorizer hash can never occur twice, and the ←(…)^O truncation would have discarded any extra copies within eight blocks anyway"],"answer":1,"optNotes":["要編輯哪個 pool 由 (g_w)_c 決定；eq. 11.28 允許 g_t 落在前一個 rotation，反推會挑到別的 pool。","§3 的 s ⊖ {v} 是 excepting the left-most element equal to v，只移除最舊的那一個。","F(c) 不做驗證：w_a ∈ α[w_c] 早在 eq. 11.32 就對 prior α 檢查過了。","eq. 8.1 的 α ∈ [[H]_{:O}]_C 是序列不是集合；pool 未滿時根本不截斷，多刪的 hash 永久消失。"],"explanation":"eq. 8.3：F(c) ≡ α[c] ⊖ {(g_w)_a} 當 ∃g ∈ E_G：(g_w)_c = c，否則 F(c) = α[c]。α[c] 是序列而非集合，重複完全合法：queue φ[c] 常常整排都是同一個 authorizer（例如某條 parachain 專用的 core），pool 裡自然會累積多個相同 hash；全部刪掉會讓 pool 憑空縮水，後續的 guarantee 就會因 eq. 11.32 找不到 authorizer 而被拒。而且這裡一定只需要移除一個：eq. 11.25 保證 E_G 每個 core 最多一個 guarantee、依 core 排序且不重複。#692 的修法正是「match the core index from report in guarantees」+「remove only the leftmost instance」。","trap":"⊖（seqminusl）只砍最左邊一個；pool 與 queue 都是「序列」，允許重複。"},{"id":"ch08-new-authorizer-availability-timing","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 8.2, eq. 4.19 & eq. 11.32","difficulty":3,"kind":"concept","tags":["authorization","guarantees","ordering"],"stem":"At the start of block N the pool α[c] does not contain authorizer x. During block N's accumulation the assigner service of core c calls `assign` with a queue whose entry at index H_T mod Q is x, so x will be appended to core c's pool by this block. Block N's E_G also carries a guarantee for core c whose work-report has authorizer x. Is that guarantee valid, and when is x first usable?","options":["Valid: the authorizer check accepts any hash present in α[c] or in φ′[c], since the queue is the source of the pool and the assigner has already approved that authorizer for the core","Invalid: eq. 11.32 requires w_a ∈ α[w_c] on the prior pool, and x only enters α′[c] through eq. 8.2 at the end of block N — so the first block whose E_G may carry a report authorized by x is N+1","Invalid, but for a different reason: a single block may not both alter a core's queue via `assign` and accept a guarantee on that core, so the guarantee is rejected regardless of x","Valid: α′ is deliberately computed after accumulation so that guarantees in the same block can already rely on freshly assigned authorizers, which is why §8.2 orders the pool update last"],"answer":1,"optNotes":["guarantee 驗證不看 φ：queue 只是 pool 的補給來源，本身不是授權依據。","eq. 11.32 比的是 prior α（無 prime、無 dagger），x 要等 block N 結束才進得了 α′[c]。","GP 沒有「同一塊不能同時 assign 與 guarantee 同一個 core」這條規則。","α′ 要在 accumulation 之後才算，那是 α′ 的產生順序，不是 guarantee 驗證所看的狀態。"],"explanation":"eq. 11.32：∀w ∈ w：ρ‡[w_c] = ∅ ∧ w_a ∈ α[w_c]。依賴圖 eq. 4.19：α′ ≺ (H, E_G, φ′, α)，表示 E_G 是 α′ 的輸入而不是反過來——所以 x 要到 block N 結束時才進入 α′[c]，block N+1 的 prior α 才含 x。實務含意：assigner 想讓新 authorizer 可用，最快也是下一個 slot；而且 pool 每塊都會 append 一個 queue 項目，x 進 pool 後若一直沒被使用、pool 又沒被其他 guarantee 消耗，最多再 8 個區塊就會被 ←^O 擠掉，所以 queue 的安排要與預期的 package 提交時間對齊。你們 STF 的順序（ValidateExtrinsic → UpdateReports → UpdateAccumlate → UpdateAuthorizations）也正是先用 prior α 驗 guarantee、最後才產生 α′。","trap":"guarantee 看 prior α；α′ 用 posterior φ′。新 authorizer 最早在「下一個區塊」才可用。"},{"id":"ch06-code-useless-ticket-gap","ch":"6","section":"6.7 The Extrinsic and Tickets","gpRef":"eq. 6.35–6.36 — internal/safrole/extrinsic_tickets.go CreateNewTicketAccumulator","difficulty":3,"kind":"code","tags":["safrole","tickets","code","fuzzer"],"stem":"This is the tail of the team's CreateNewTicketAccumulator (identical on main and on the 0.8.0 branch), reached after the new tickets passed the tail/attempt/proof/order/duplicate checks. A block at m′ = 300 carries 3 valid tickets whose ids are all HIGHER than every id in a saturated γ_A (|γ_A| = E). What does the GP require, and what does this code do?","code":{"lang":"go","caption":"internal/safrole/extrinsic_tickets.go (CreateNewTicketAccumulator, tail)","src":"// (6.34) Get previous ticket accumulator\npreviousTicketsAccumulator := GetPreviousTicketsAccumulator()\n\n// (6.34) Concatenate the new tickets and the previous ticket accumulator\nnewTicketsAccumulator := append(newTickets, previousTicketsAccumulator...)\n\n// (6.34) sort the tickets by ticket id\nsort.Slice(newTicketsAccumulator, func(i, j int) bool {\n    return bytes.Compare(newTicketsAccumulator[i].ID[:], newTicketsAccumulator[j].ID[:]) < 0\n})\n\n// (6.33) Verify the new tickets accmuulator\nerr = VerifyTicketsDuplicate(newTicketsAccumulator)\nif err != nil {\n    // Found a ticket duplicate (Someone submitted the same ticket)\n    return err\n}\n\n// (6.34) select E tickets from the sorted tickets for the new ticket accumulator\nmaxTicketsAccumulatorSize := types.EpochLength\nif len(newTicketsAccumulator) > maxTicketsAccumulatorSize {\n    newTicketsAccumulator = newTicketsAccumulator[:maxTicketsAccumulatorSize]\n}\n\n// (6.34) set the new ticket accumulator to the posterior state\ncs.GetPosteriorStates().SetGammaA(newTicketsAccumulator)\n\nreturn nil"},"options":["The block is invalid per eq. 6.34 because the new ids collide with γ_A, and VerifyTicketsDuplicate on the merged, sorted sequence is exactly the check that catches this case, so the code is conformant","Eq. 6.36 (n ⊆ γ′_A) makes the block INVALID, but this code silently drops the 3 tickets in the [:E] truncation and accepts it — a block that the reference implementation rejects","The block is invalid per eq. 6.31 because tickets are only accepted while |γ_A| < E; the code should compare len(previousTicketsAccumulator) with E before merging and return UnexpectedTicket","The block is valid per eq. 6.35: γ′_A simply keeps the lowest E ids, so the 3 tickets are not retained and nothing further is required of the block; this code is fully conformant and needs no extra check"],"answer":1,"optNotes":["6.34 講的是 id **相同**；VerifyTicketsDuplicate 只比排序後相鄰是否相等，抓不到較大的合法 id。","6.36 要求 n ⊆ γ′_A，而這裡 `[:maxTicketsAccumulatorSize]` 截掉後就 SetGammaA、return nil。","6.31 限的是 |E_T| ≤ K，與 |γ_A| 無關——accumulator 已滿仍可接受分數更好的 ticket。","漏掉 6.36：γ′_A 的確等於 γ_A，但「沒擠進前 E 名的 ticket」讓整個區塊必須被拒絕。"],"explanation":"eq. 6.35：γ′_A ≡ 取 sort_by_id(n ∪ (∅ if e′ > e else γ_A)) 的最低 E 筆；eq. 6.36 緊接著要求 n ⊆ γ′_A：「It is invalid to include useless tickets in the extrinsic, so all submitted tickets must exist in their posterior ticket accumulator」。這段程式（main 與 1012-update-to-v080 分支相同）沒有任何「截斷後確認 newTickets 仍在 accumulator 內」的步驟，SafroleErrorCode 也沒有對應的 code；w3f 的 safrole vectors 沒有 useless-ticket 失敗案例（fail cases 只有 bad attempt / already recorded / bad order / bad proof / lottery over），所以一直沒被抓到，但 fuzzer 若產生這種區塊，reference 會拒絕、你們會接受，state 立刻分岔。對照 vector publish_tickets_with_mark-3：「Publish some tickets with a full accumulator. Some old ticket are removed to make space for new ones」——滿載的 accumulator 本來就還能收更好的票。修法：截斷後確認 newTickets 的最大 id ≤ γ′_A 的最後一筆（或逐一 Contains），失敗就回傳錯誤。","trap":"口訣：進不了前 E 名的 ticket 不是被丟掉，而是讓整個區塊作廢（6.36）。"},{"id":"ch06-code-attempt-cap-v080","ch":"6","section":"6.7 The Extrinsic and Tickets","gpRef":"eq. 6.30 (n = ⌈2E/|γ′_P|⌉) — internal/safrole/extrinsic_tickets.go VerifyTicketsAttempt (branch 1012-update-to-v080, PR #1025)","difficulty":2,"kind":"code","tags":["safrole","tickets","code","delta-0.8.0"],"stem":"This is VerifyTicketsAttempt on the team's 0.8.0 branch (PR #1025); on main (0.7.2) it compared Attempt against the constant TicketsPerValidator. Which statement about it is correct?","code":{"lang":"go","caption":"internal/safrole/extrinsic_tickets.go (VerifyTicketsAttempt, branch 1012-update-to-v080)","src":"func VerifyTicketsAttempt(tickets types.TicketsExtrinsic) *types.ErrorCode {\n    numV := len(blockchain.GetInstance().GetPosteriorStates().GetGammaK())\n    if numV == 0 {\n        ...\n        if len(tickets) > 0 {\n            err := SafroleErrorCode.BadTicketAttempt\n            return &err\n        }\n        return nil\n    }\n    // n = ceil(2E / numV) via integer arithmetic.\n    n := (2*types.EpochLength + numV - 1) / numV\n\n    for _, ticket := range tickets {\n        // ticket.Attempt is an entry index (0-based); reject Attempt >= n.\n        if ticket.Attempt >= types.TicketAttempt(n) {\n            err := SafroleErrorCode.BadTicketAttempt\n            return &err\n        }\n    }\n\n    return nil\n}"},"options":["It uses the wrong set: n must be derived from |κ′|, the active set, because tickets are submitted by the validators authoring blocks right now; taking GetGammaK makes the bound change one epoch too early on any chain whose set size varies","It implements n = ⌈2E/|γ′_P|⌉ with the posterior pending set (the team's GammaK), i.e. the ring the tickets are proven against; (2E + |γ′_P| − 1) / |γ′_P| is the integer ceiling and the bound is exclusive because N_n = {0, …, n−1}","It is only a refactor: because offenders are zeroed in place rather than removed, |γ′_P| always equals V, so 0.7.2's constant TicketsPerValidator (3 tiny / 2 full) already produced exactly the same bound and no test vector changes behaviour","It has an off-by-one: eq. 6.30 puts the entry index in N_n, which by §3.4 includes n itself, so Attempt == n must be accepted and the comparison should be > n rather than >= n; in tiny mode (E = 12, |γ′_P| = 6) this wrongly rejects entry index 4"],"answer":1,"optNotes":["分母必須與 ticket 所證明的 ring 是同一個集合——ring 由 γ′_P 的 Bandersnatch key 建成。","分母取 posterior 的 γ′_P，(2E + |γ′_P| − 1) / |γ′_P| 是整數 ceiling，上界 exclusive 也正確。","與 PR #1025 的事實相反：tiny 的 bound 從 3 變成 4，舊 vector 才被標成 IsV080IncompatibleVector。","誤讀 §3.4：N_n = {x | x < n} 是嚴格小於，tiny 下合法的 entry index 是 0…3 而非 0…4。"],"explanation":"eq. 6.30：E_T ∈ [(r ∈ N_n, p ∈ F̄^{X_T ⌢ η′_2 ++ r}_{γ′_Z}([]))]，n = ⌈2E/|γ′_P|⌉——分母是 **posterior pending set** γ′_P（你們命名為 GammaK），因為 ticket 是對 γ′_Z（由 γ′_P 的 Bandersnatch key 建 ring）做 ring proof，是「下個 epoch 的 validator」在投票，與本 epoch 出塊的 κ′ 無關。§3.4：N_n = {x ∈ N, x < n}。算例：tiny E = 12、|γ′_P| = 6 → (24+5)/6 = 4；full E = 600、1023 → (1200+1022)/1023 = 2。0.7.2 main 用常數 TicketsPerValidator（tiny 3 / full 2），tiny 下 entry index 3 在 0.8.0 變成合法（PR #1025 因此把舊 vector publish-tickets-no-mark-1「bad ticket attempt number」標成 IsV080IncompatibleVector 跳過）；同一個 PR 也把 VerifyEpochTail 的上限從 ValidatorsCount 改成 MaxTicketsPerBlock（K，eq. 6.31）。GP 的理由：「To ensure the accumulator can be saturated, when there are fewer validators, each validator is permitted more tickets」（每個 slot 期望約 2 張 ticket）。","trap":"n 的分母是 |γ′_P| 不是 |κ′|；上界是 exclusive（r < n）；tiny 的 n 從 3 變 4。"},{"id":"ch06-code-header-checks-posterior","ch":"6","section":"6.4 Sealing and Entropy Accumulation","gpRef":"eq. 6.16–6.18, 6.28; §5 eq. 5.10 — internal/stf/sft.go RunSTF, validate_header.go ValidateHeaderVrf","difficulty":3,"kind":"code","tags":["safrole","seal","markers","code","fuzzer","epoch"],"stem":"The team's RunSTF validates the header in two phases around UpdateSafrole; passing the POSTERIOR state to the second phase was the fix for fuzzer bug #784 'Header VRF Verification Failure on some cases' (PR #791). For the first block of a new epoch, why can the seal H_S, the entropy source H_V and the epoch marker H_E only be checked in the second phase?","code":{"lang":"go","caption":"internal/stf/sft.go (RunSTF) + validate_header.go (ValidateHeaderVrf)","src":"// Validate Non-VRF Header(H_E, H_W, H_O, H_I)\n// For non-genesis blocks, validate the header\nif header.Parent != (types.HeaderHash{}) {\n    err = ValidateNonVRFHeader(header, &priorState, extrinsic)\n    ...\n}\n...\n// Update Safrole\nerr = UpdateSafrole()\n...\npostState := cs.GetPosteriorStates().GetState()\n\n// After keyRotate\nerr = ValidateHeaderVrf(header, &priorState, &postState)\n...\nfunc ValidateHeaderVrf(header types.Header, priorState *types.State, posteriorState *types.State) error {\n    if err := safrole.ValidateHeaderEpochMark(header, priorState, posteriorState); err != nil {\n        return err\n    }\n    if err := safrole.ValidateHeaderSeal(header, posteriorState); err != nil {\n        return err\n    }\n    if err := safrole.ValidateHeaderEntropy(header, posteriorState); err != nil {\n        return err\n    }\n    return nil\n}"},"options":["Only for performance: ring-VRF verification is slow, so it is deferred until the cheap checks have passed; verifying against the prior state would give identical results in every block because κ, η and γ_S are stable within a block","Because all three depend on this block's own rotation: H_S is checked against γ′_S[H_T mod E] with H_A = κ′[H_I]_b and context η′_3, H_V against the same H_A, and H_E against γ′_P = Φ(ι); the prior κ/η/γ_S pass mid-epoch but fail at epoch boundaries","Because H_E must be compared with the posterior entropy η′_0, η′_1, which only exist after UpdateEtaPrime0; the seal itself could safely be verified against the prior state, since H_A = κ[H_I]_b by definition","Because the seal signs E_U(H), which embeds H_E and H_W, so those markers must be finalized first; the validator set itself is irrelevant, since κ′ = κ whenever the block is valid and the seal context η′_3 equals η_3 in every block"],"answer":1,"optNotes":["效能不是理由，而且 seal 是 IETF VRF、不是昂貴的 ring VRF。","三者的比對對象 γ′_S、κ′、η′_3、γ′_P 全是本塊自己的 rotation 產物，只能在 UpdateSafrole 之後驗。","H_E 比對的是 **prior** η_0、η_1；且 §5 eq. 5.10 明寫 H_A ≡ κ′[H_I]_b，用的是 posterior。","「κ′ = κ whenever valid」在 e′ > e 就不成立，η′_3 也只有 epoch 中段才等於 η_3。"],"explanation":"eq. 6.16/6.17：i = γ′_S[H_T mod E]（posterior 序列），H_S 由 H_A 簽、context 用 η′_3；§5 eq. 5.10：H_A ≡ κ′[H_I]_b（posterior active set）；eq. 6.18：H_V 同樣由 H_A 驗；eq. 6.28：H_E 的 key 列表是 γ′_P = Φ(ι)，但其兩個 entropy 欄位比對的是 prior η_0、η_1（ValidateHeaderEpochMark 用 priorState.Eta[0]/[1]）。這些 posterior 值在 epoch 第一塊全由該塊自己的 KeyRotate（κ′ = γ_P）、UpdateEntropy（η′_3 = η_2）、UpdateSlotKeySequence 產生，所以 seal/entropy/epoch-mark 只能在 UpdateSafrole 之後驗；epoch 中段 κ′ = κ、η′_3 = η_3、γ′_S = γ_S，用 prior state 也會過——這正是 #784「on some cases」只在 epoch 邊界失敗的原因（trace 1758621879/00000348 被誤判為 error 7 VrfSealInvalid），PR #791 改成傳 posterior Kappa & Eta。H_W、H_O、H_X、H_R、H_I 只依賴 prior state 與 extrinsic，所以留在 ValidateNonVRFHeader（reviewer yu2C 堅持不要整個搬到 safrole 之後），其中 H_I 的 range check 必須最早做（#825）。順帶一提 sft.go 的註解「(H_E, H_W, H_O, H_I)」已過時——H_E 實際在 ValidateHeaderVrf 裡驗。","trap":"口訣：seal、H_V 看 posterior（γ′_S、κ′、η′_3）；H_E 看 prior η_0/η_1 + posterior γ′_P；H_W/H_O/H_I 只看 prior + extrinsic。"},{"id":"ch06-code-author-index-bound","ch":"6","section":"6.4 Sealing and Entropy Accumulation","gpRef":"§5 eq. 5.10 (H_I ∈ N_{|κ′|}), eq. 6.7–6.8, 6.14 — internal/stf/validate_header.go ValidateNonVRFHeader","difficulty":3,"kind":"code","tags":["safrole","validators","code","fuzzer","delta-0.8.0"],"stem":"After fuzzer bug #825 (panic 'index out of range [65535] with length 6' while computing η′_0), the team added this check to ValidateNonVRFHeader, which runs BEFORE UpdateSafrole. Which assessment is right under GP 0.8.0?","code":{"lang":"go","caption":"internal/stf/validate_header.go (ValidateNonVRFHeader)","src":"// Validate author_index out of range.\n// NOTE: There is currently no official error code defined for this case.\n// We may need to update this once the spec updates.\nif header.AuthorIndex >= types.ValidatorIndex(len(priorState.Kappa)) {\n    errCode := SafroleErrorCode.AuthorIndexOutOfRange\n    return &errCode\n}"},"options":["The GP bound is |κ′| (posterior), not |κ|; the check is equivalent today only because every key sequence here has exactly V entries (offenders are zeroed in place, #1037) — once a 0.8.0 set-size change makes |γ_P| ≠ |κ|, a bound taken from the prior κ is wrong at the boundary","The bound should be |ι|, since at an epoch boundary the block author is drawn from the staging set that eq. 6.14 has just promoted into κ′; bounding by either the prior or the posterior κ would reject every author from the incoming set on the first block","The check is exactly what the GP specifies: eq. 5.10 bounds H_I by |κ|, the prior active set, which is precisely why it can be verified before key rotation without loss of generality, and it therefore covers the fuzzer's 65535 case at any validator-set size","The check is unnecessary: an out-of-range H_I already fails the seal signature check and is reported as VrfSealInvalid, so the fuzzer's expected rejection is produced anyway; the real fix for #825 belonged inside UpdateEtaPrime0, where the panic was raised"],"answer":0,"optNotes":["今天 |κ| = |κ′| 只因序列永遠是 V 筆；0.8.0 允許長度變動後，κ′ = γ_P 在邊界就會不同長。","eq. 6.14 在邊界把 ι 推進的是 γ′_P，κ′ 取的是舊 γ_P——ι 還要再過一個邊界才成為 κ。","eq. 5.10 寫的是 H_I ∈ N_{|κ′|}——邊界取的是 posterior κ′ 的長度，不是 prior κ。","根本走不到簽章驗證：索引 κ′[H_I] 時就先 panic，修法塞進 UpdateEtaPrime0 也治標不治本。"],"explanation":"§5 eq. 5.10：H_I ∈ N_{|κ′|}、H_A ≡ κ′[H_I]_b——邊界是 **posterior** κ′ 的長度。#825 的 panic（index out of range [65535] with length 6）就是 H_I 在 range check 之前被拿去索引 validator 陣列；Go 直接 panic 而不是回傳錯誤，fuzzer 視為 target crash。這段檢查放在 ValidateNonVRFHeader（UpdateSafrole 之前），手上只有 prior state，於是用 len(priorState.Kappa)；今天這是等價的，因為 codebase 裡 ι/γ_P/κ/λ 永遠都是 V 筆（offender 只被 Φ 歸零、不移除，#1037），|κ| = |κ′|。但 GP 0.8.0 eq. 6.7/6.8（PR #514）允許每個序列長度各自 ∈ N_V = {6, 9, …, 1023}，designate host call 也只要求 z ∈ N_V；當 |γ_P| ≠ |κ| 時，epoch 第一塊的 κ′ = γ_P（eq. 6.14）長度會變（eq. 11.18 也因此在 |κ| ≠ |κ′| 時清空 ρ‡），正確做法是先算出 κ′ 的長度（e′ > e 時取 |γ_P|，否則 |κ|）再檢查。錯誤碼方面 GP 與官方 enum 沒有對應值，你們暫用 AuthorIndexOutOfRange (13)。","trap":"面試官可能追問：H_I 越界時你們回什麼？答：沒有官方 code，自訂 13；重點是必須在任何 κ′[H_I] 之前檢查，否則 panic。"},{"id":"ch06-skip-epochs-transition","ch":"6","section":"6.3–6.7 (epoch transition across skipped epochs)","gpRef":"eq. 6.2, 6.14, 6.24, 6.25, 6.28–6.29, 6.35","difficulty":3,"kind":"concept","tags":["safrole","epoch","entropy","fallback","markers","calc"],"stem":"Full parameters (E = 600, Y = 500). The prior block has τ = 1195 and a saturated accumulator (|γ_A| = E); the next block has H_T = 1810 (nothing was authored in between). Expressing posterior values in terms of PRIOR ones, which description of this transition is correct?","options":["Rotation is applied once per elapsed epoch, i.e. twice here: κ′ = Φ(ι), λ′ = γ_P, (η′_1, η′_2, η′_3) = (η′_0, η_0, η_1); γ′_S = F(η_0, Φ(ι)); H_E is present and H_W absent","Rotation happens exactly once: κ′ = γ_P, λ′ = κ, γ′_P = Φ(ι), (η′_1, η′_2, η′_3) = (η_0, η_1, η_2); γ′_S = F(η_1, γ_P) despite m = 595 ≥ Y and a full γ_A; H_E is present, H_W absent; γ′_A is rebuilt from this block's E_T alone","γ′_S = Z(γ_A) because the prior block sat in the tail (m = 595 ≥ Y) with a saturated accumulator; keys and entropy rotate once; H_W = Z(γ_A) is emitted as well since this block closes the contest","The block is rejected with BadSlot: eq. 6.25 has no case for e′ = e + 2, so a chain may skip individual slots but never an entire epoch; the next valid H_T is therefore some slot of epoch 2, and only from there can epoch 3 be reached"],"answer":1,"optNotes":["6.14 與 6.24 的條件是布林的 e′ > e，與 e′ − e 差幾格無關，state 只記得最後一塊。","一次 rotation 加 fallback：e′ = e + 2 讓 6.25 第一種情況失效，H_W 需要 e′ = e 也不會出現。","6.25 的第一種情況要求 e′ = e + 1（精確相等）；本題 e′ = e + 2，累積的 ticket 一律作廢。","BadSlot 只在 τ′ ≤ τ 時觸發；跳過任意多個 slot 甚至整個 epoch 都是合法的。"],"explanation":"計算：e ⌢ m = 1195/600 → e = 1、m = 595；e′ ⌢ m′ = 1810/600 → e′ = 3、m′ = 10（eq. 6.2）。eq. 6.14 與 6.24 的條件都是布林的 e′ > e，與 e′ − e 無關，所以 key 與 entropy **只 rotate 一次**：κ′ = γ_P、λ′ = κ、γ′_P = Φ(ι)、(η′_1, η′_2, η′_3) = (η_0, η_1, η_2)——state 只記得最後一塊，沒有「中間 epoch」可言。eq. 6.25 第一種情況要求 e′ = e + 1，這裡不成立，即使 m = 595 ≥ Y 且 |γ_A| = E 也走 F(η′_2, κ′) = F(η_1, γ_P)（vector skip_epochs-1：「Progress skipping epochs with a full tickets accumulator. Tickets mark is not generated. Accumulated tickets discarded. Fallback method enacted」）。eq. 6.28：e′ > e → H_E = (η_0, η_1, γ′_P 的 (k_b, k_e))；eq. 6.29：H_W 需要 e′ = e → ∅。eq. 6.35：e′ > e → γ′_A 只由本塊的 n 組成（m′ = 10 < Y，可帶最多 K 張、對新的 γ′_Z 與 context X_T ⌢ η_1 驗）。本塊 seal 走 fallback：H_A = γ′_S[10]、context X_F ⌢ η′_3 = X_F ⌢ η_2、T = 0。你們的程式：UpdateEntropy/KeyRotate 用 `ePrime > e`，UpdateSlotKeySequence 用 `ePrime == e+1`，正好對應。","trap":"跳 N 個 epoch ≠ rotate N 次；6.25 要的是 e′ = e + 1（精確），6.14/6.24 要的是 e′ > e（任意）。"},{"id":"ch06-variable-set-boundary","ch":"6","section":"6.3 Key Rotation / 6.7 The Extrinsic and Tickets","gpRef":"eq. 6.7–6.8, 6.14, 6.28, 6.30; §5 eq. 5.10","difficulty":3,"kind":"delta","tags":["safrole","validators","tickets","delta-0.8.0","calc"],"stem":"Tiny parameters (E = 12). During epoch e the delegator service set the staging set ι to 9 validators while γ_P and κ still hold 6 — a legal 0.8.0 configuration (eq. 6.8). Consider the first block of epoch e + 1. Which statement is correct?","options":["n = ⌊24/9⌋ = 2, and the seal must now come from one of the 9 incoming validators (H_I < 9), because γ′_Z commits to their keys from this block on and H_E lists their 9 pairs","n = ⌈24/6⌉ = 4, because n is computed from the active set κ′ that seals this epoch; γ′_Z stays a 6-key ring and H_E lists 6 pairs until the 9 validators actually become active in epoch e + 2","The block is invalid: eq. 6.8 requires |ι| = |κ| at all times, so the validator count can only be changed by restarting from genesis with a new chainspec; designate would have returned HUH for z = 9","Tickets submitted during epoch e + 1 need entry index < n = ⌈24/9⌉ = 3 and ring proofs against a 9-key γ′_Z; H_E lists 9 (k_b, k_e) pairs; but the block's H_I must be < 6 and its seal comes from κ′ = the old 6-member γ_P"],"answer":3,"optNotes":["n 用的是 ceiling 不是 floor（⌈24/9⌉ = 3）；而且本 epoch 出塊的仍是 κ′ 這 6 個人。","分母是 γ′_P 不是 κ′；γ′_Z 與 H_E 在這一塊就已換成 9 人（eq. 6.14 的 z 對 γ′_P 取）。","eq. 6.7/6.8 沒有要求四個序列彼此等長；designate 只檢查 z ∈ N_V，11.18 更明文處理 |κ| ≠ |κ′|。","ticket 規則跟著 γ′_P（9 人）走，seal 與 H_I 跟著 κ′（舊的 6 人 γ_P）走，兩者在這塊分家。"],"explanation":"eq. 6.14：e′ > e 時 γ′_P = Φ(ι)（9 筆）、κ′ = γ_P（6 筆）、λ′ = κ、z = O([k_b | k ∈ γ′_P])——ring 有 9 個成員。eq. 6.30：n = ⌈2E/|γ′_P|⌉ = ⌈24/9⌉ = ⌈2.67⌉ = 3，entry index ∈ N_3 = {0, 1, 2}。eq. 6.28：H_E 列出 γ′_P 的 9 組 (k_b, k_e)。但本 epoch 出塊的是 κ′（舊的 6 人 γ_P）：§5 eq. 5.10 H_I ∈ N_{|κ′|} = N_6，seal 由 κ′[H_I]_b 簽（6.16/6.17），fallback F(η′_2, κ′) 的索引 mod 6；9 位新 validator 要到 epoch e + 2 才成為 κ。eq. 6.7/6.8（0.8.0 PR #514「Support smaller validator sets」）：ι、γ_P、κ、λ 各自 ∈ [K]_{N_V}、N_V = {3c | c ∈ N_{2..C+1}}。連帶影響：active core 數 = |κ′|/3，本 epoch 2 個、下個 epoch 3 個。你們的 code 目前撐不住這種鏈：GetVerifier 要求 len(gammaK) == ValidatorsCount，ValidateHeaderEpochMark 要求 len(em.Validators) == ValidatorsCount，兩者都會拒絕合法區塊——這就是 open issue #1037。","trap":"一句話：ticket 規則跟著 γ′_P（下個 epoch 的人），seal/author 規則跟著 κ′（這個 epoch 的人）。"},{"id":"ch06-ring-root-nulled-keys","ch":"6","section":"6.3 Key Rotation / Appendix G","gpRef":"eq. 6.14–6.15, G.3 (ring root), App. G padding-point note","difficulty":3,"kind":"concept","tags":["safrole","ring-vrf","offenders","validators"],"stem":"On an epoch change, one validator in ι has its Ed25519 key in ψ′_O, so Φ replaces its entire 336-octet entry with zeros. How does this affect γ′_Z and ticket verification in the new epoch?","options":["The ring keeps |γ′_P| members: a zero key decodes to no Bandersnatch point, so the padding point is substituted at that position in z = O([k_b | k ∈ γ′_P]); the offender cannot produce a valid ring proof, everyone else's tickets verify against this γ′_Z all epoch","O(…) fails on an undecodable key, so a block that would place a nulled key into γ′_P is invalid; offenders therefore have to be removed from ι by the delegator service (designate) before the boundary, shrinking the set by 3 each time","The all-zero key is a valid Bandersnatch point (the identity), so γ′_Z is computed normally and the offender can keep submitting tickets until the following epoch removes it; only its Ed25519-signed artefacts are refused meanwhile","The offender's slot is removed from the ring, so γ′_Z commits to |γ′_P| − 1 keys and everyone's ring position shifts by one; this is why the accumulator has to be re-sorted at the epoch boundary and why H_E lists the surviving keys only"],"answer":0,"optNotes":["App. G 明文：無對應 Bandersnatch point 時該位置改用 padding point，ring 大小維持不變。","vector enact-epoch-change-with-padding-1 正是把兩把無效 key 換成 padding point，而非拒絕區塊。","全零 32 bytes 不是合法點：Twisted Edwards 的 identity 是 (0, 1)，壓縮編碼不是全零。","ring 的大小與每個人的位置都不變：eq. 6.14 的 z 仍對全部 |γ′_P| 個位置取 commitment。"],"explanation":"eq. 6.15：Φ 把 k_e ∈ ψ′_O 的整組 key 換成 [0, 0, …]；eq. 6.14：z = O([k_b | k ∈ γ′_P]) 仍對 **全部** |γ′_P| 個位置取 commitment。App. G 明文：「in the case a key has no corresponding Bandersnatch point when constructing the ring, then the Bandersnatch padding point … should be substituted」。w3f vector enact-epoch-change-with-padding-1 就是測這個：一把 key 因在 posterior offenders 而歸零、另一把本來就 undecodable，「Both the invalid keys are replaced with the padding point during ring commitment computation」。offender 沒有 padding point 的私鑰，做不出合法 ring proof，整個 epoch 都無法投 ticket。注意 Φ 只作用在進入 γ′_P 的 ι——已在 κ′ 裡的 offender 本 epoch 的 seal 仍照常驗（§11 eq. 11.22 的 guarantor 分配才另外套 Φ(κ′)）；而歸零的 entry 下個 epoch 進到 κ 後，fallback F 若抽到它，那個 slot 就沒人能出塊。工程面：γ′_Z ∈ B_144（G.3）是 key 序列的純函數，只在 e′ > e 時重算（KeyRotate 否則直接沿用 prior γ_Z）；你們的 GetVerifier 以 Blake2b(所有 Bandersnatch key 串接) 當快取鍵（#1041），取代原本按 epoch 快取、fork-restore 就得重建的做法（#1040）。","trap":"零 key ≠ 移除：ring 成員數不變、位置不變，只是那格換成 padding point。"},{"id":"ch06-vrf-output-message-independence","ch":"6","section":"6.4 Sealing and Entropy Accumulation","gpRef":"eq. 6.16, 6.24, 6.30, 6.32; §3.8.2 Signing Schemes; App. G eq. G.2/G.5","difficulty":3,"kind":"rationale","tags":["safrole","vrf","seal","tickets","rationale"],"stem":"A ticket proof is a ring-VRF proof with context X_T ⌢ η′_2 ++ r over the EMPTY message, while the seal H_S is a plain Bandersnatch signature with context X_T ⌢ η′_3 ++ i_e over E_U(H), the whole unsigned header. Why can eq. 6.16 nevertheless demand i_y = Y(H_S), i.e. that the seal's VRF output equal the ticket id?","options":["Because the ticket id is defined as the Blake2b hash of the proof bytes, and eq. 6.16 requires the seal to embed a copy of the original 784-byte ring proof so that every verifier can recompute that hash from the header alone; the E_U(H) message merely binds the embedded copy to this particular block","Because a VRF output depends only on the secret key and the context ('influenced by x but not by m'), and by seal time the submission entropy has rotated from η′_2 into η′_3 so the contexts coincide: the same key reproduces the ticket id under any message — anonymous in the ring proof, attributable in the seal","Because both the ticket proof and the seal are in fact signed over the empty message — E_U(H) is only ever the message of H_V, whose output feeds η′_0 — so the two VRF outputs agree trivially; the identity check i_y = Y(H_S) is accordingly made against H_V rather than against the seal","Because η′_2 = η′_3 whenever the tickets were submitted in the same epoch as the block being sealed, so the author simply re-signs an identical context; the message is ignored by the verifier for seals though not for ring proofs, which is why tickets carry [] and seals carry E_U(H)"],"answer":1,"optNotes":["6.32 取的是 VRF **輸出**而非 proof bytes 的 hash；seal 是 96-byte 簽章，不含 784-byte ring proof。","VRF output 只看 (key, context)；6.24 的 rotate 讓提票時的 η′_2 到封章時正好變成 η′_3。","seal 的訊息就是 E_U(H)（這才把它綁到 header）；i_y 比對的對象是 H_S 而不是 H_V。","η′_2 與 η′_3 差一個 epoch；訊息也仍然參與簽章驗證，只是不影響 VRF output。"],"explanation":"§3.8.2：Bandersnatch signature 與 RingVRF proof「both define a VRF output, a high entropy hash influenced by x but not by m」，且「the member is identified in the former and is anonymous in the latter」；App. G（G.2/G.5）：Y(·) 取 output 的前 32 bytes。eq. 6.32：ticket id y = Y(p)；eq. 6.30 的 context 是 X_T ⌢ η′_2 ++ r（提交當時的 η′_2）；eq. 6.24 在下個 epoch 邊界把它 rotate 成 η′_3，所以 eq. 6.16 seal 的 context X_T ⌢ η′_3 ++ i_e 與當初提票的 context 逐 byte 相同。同一把 secret key 加上相同 context ⇒ 相同 VRF output，無論訊息是 [] 還是 E_U(H)，因此驗證者比對 i_y = Y(H_S) 就能確定「出塊者就是持票人」——提票時 ring proof 只證明「γ′_P 某成員」，出塊時 IETF 簽章（H_A 已知）揭露身分；這就是 Safrole「事前匿名、事後可歸屬」的核心。§6.7 也說 ticket id「is used both as a score in the contest and as input for the block's entropy source VRF signature」（即 H_V 的 context X_E ⌢ Y(H_S)）。你們 ValidateByTickets 先比 vrf.VRFIetfOutput(header.Seal) == ticket.ID，再 IETFVerify(context, E_U(H))。","trap":"VRF output 只看 (key, context)，不看 message——這是 ticket 能匿名提交、之後又能對上 seal 的原因。"},{"id":"ch06-why-m-ge-Y","ch":"6","section":"6.5 The Slot-Sealer Sequence","gpRef":"eq. 6.25, 6.29, 6.31, 6.35; §6.6–6.7 prose","difficulty":3,"kind":"rationale","tags":["safrole","fallback","markers","rationale"],"stem":"Eq. 6.25 uses the accumulator as the next slot-sealer sequence only when e′ = e + 1 ∧ m ≥ Y ∧ |γ_A| = E. What does the conjunct m ≥ Y — a property of the PRIOR block — actually guarantee, and why does the GP tie the ticket regime to it?","options":["That the prior block's author held a ticket (T = 1), since a fallback-sealed block is not allowed to close a contest on behalf of the ticket holders; this is also what the best-chain rule of §19 counts when it prefers ticketed ancestors","That at least Y tickets were submitted during the epoch, so the contest was competitive enough for the accumulator to be trusted over the fallback keys; with fewer than Y entries the outside-in ordering Z would leave slots unassigned","That no ticket submitted inside the tail is counted: tickets arriving at m ≥ Y would otherwise have been proven against the wrong ring root and entropy, since γ′_Z and η′_2 already refer to the epoch after next by then","That some block of the ending epoch was authored in the tail, which — γ_A being frozen once m′ ≥ Y — is exactly the condition under which H_W = Z(γ_A) was published in that epoch, so a header-only node is never asked to verify ticket seals for a sequence it never saw"],"answer":3,"optNotes":["T 旗標不是 6.25 的輸入，它只用在 §19 best-chain 對 ticket-sealed 祖先的偏好上。","Y = 500 是 slot phase，與「提交了幾張 ticket」無關；飽和由 |γ_A| = E 這個 conjunct 負責。","tail 內本來就不可能有 ticket（6.31 要求 |E_T| = 0），沒有「算錯 ring root」的餘地。","m ≥ Y 等價於「本 epoch 已有某塊發佈過 H_W」，header-only 節點才不會驗到沒見過的序列。"],"explanation":"eq. 6.31：m′ ≥ Y 時 |E_T| = 0，§6.7 末尾更指出此時 γ′_A = γ_A——進入 tail 後 accumulator 凍結。eq. 6.29：同一 epoch 內第一個跨過 Y 的區塊（m < Y ≤ m′）若 |γ_A| = E 就發佈 H_W = Z(γ_A)。把兩者合起來：「前一塊在 tail（m ≥ Y）且 |γ_A| = E」⟺「本 epoch 已有某塊發佈了 H_W，且內容恰是 Z(γ_A)」（tail 內任何一塊都是或晚於那個第一塊，而 γ_A 從那之後不再變動）。§6.6 說 marker 的目的就是讓「nodes which do not synchronize the entire state」能「using only the chain of headers」追蹤 sealer/validator 的變化，§6.7 也說 Y 之後「the following epoch's slot-sealer sequence becomes fixed」。若沒有任何區塊落在 tail（前一塊 m < Y 直接跳到下個 epoch），H_W 從未出現，header-only 節點無從得知 ticket 序列，所以 GP 寧可走 fallback（vector skip_epoch_tail-1：「Tickets mark has no chance to be generated. Accumulated tickets discarded. Fallback method enacted」）。你們的 #284 就是最初只判 ePrime == e+1，會在沒有 H_W 的情況下啟用 ticket（也會在跳過 epoch 時用錯 accumulator）。","trap":"m ≥ Y 不是「比賽夠久」，而是「H_W 一定已經在 header 鏈上」——三個 conjunct 各管一件事：e′ = e+1（是下一個 epoch）、m ≥ Y（H_W 已發佈）、|γ_A| = E（飽和）。"},{"id":"ch06-three-keys-epoch-marker","ch":"6","section":"6.3 Key Rotation / 6.6 The Markers","gpRef":"eq. 6.10–6.13, 6.15, 6.28; §5 eq. 5.11; eq. 11.14, 11.28, 17.7, 18.1","difficulty":2,"kind":"concept","tags":["safrole","validators","markers","keys"],"stem":"Each validator key K bundles a Bandersnatch, an Ed25519 and a BLS public key. Which mapping of key → protocol use is correct, and why has the epoch marker H_E carried the Ed25519 keys alongside the Bandersnatch keys since GP 0.6.4?","options":["Bandersnatch: ticket ring proofs, seals, H_V and audit-selection VRFs; Ed25519: guarantees and assurances only; BLS: judgments, culprits, faults and BEEFY. H_E carries Ed25519 keys because Φ needs them to null the offenders inside κ′ at the epoch boundary, and κ′ is not otherwise reconstructible from headers","Bandersnatch: ticket ring proofs, H_S, H_V, audit-selection VRFs; Ed25519: guarantees, assurances, judgments/culprits/faults, audit announcements, offender identity (ψ_O, H_O, Φ); BLS: BEEFY only. H_E carries Ed25519 keys so a header-only node can attribute every Ed25519-signed artefact and every H_O entry to a validator","Bandersnatch: ticket ring proofs, seals and H_V; Ed25519: everything else, including BEEFY signatures and audit announcements; BLS is reserved metadata with no protocol use yet, exactly like k_m. H_E carries Ed25519 keys so that GRANDPA voters can be weighted by stake using nothing but the header chain","Bandersnatch: seals, H_V and BEEFY; Ed25519: ticket ring proofs, guarantees, assurances and audit announcements; BLS: judgments, culprits, faults and offender identity (ψ_O, H_O, Φ). H_E carries Ed25519 keys because the ring root γ′_Z is a commitment to the Ed25519 keys of γ′_P, which header-only nodes must be able to rebuild for themselves"],"answer":1,"optNotes":["judgments/culprits/faults 都直接帶 Ed25519 key 與簽章；Φ 作用在 ι → γ′_P、讀的是 state 而非 header。","三把 key 的分工與 H_E 的動機都對：header-only 節點要能把 Ed25519 簽章與 H_O 對應到 validator。","BEEFY（18.1）用 κ′[v]_bls，BLS 並非未用的保留欄位；GP 也沒有「以 stake 加權 GRANDPA」。","ticket 是 Bandersnatch ring proof、BEEFY 用 BLS；ψ_O 是 Ed25519 key 集合，γ′_Z 也是對 k_b 取的。"],"explanation":"eq. 6.10–6.13：k_b Bandersnatch、k_e Ed25519、k_l BLS（144 bytes）、k_m metadata（opaque，不參與任何密碼學）。Bandersnatch：ticket ring proof（6.30，對 γ′_Z）、seal H_S（6.16/6.17）、entropy VRF H_V（6.18）、§17 auditing 的 VRF seed（s_0、s_n 用 κ[v]_b）。Ed25519：guarantee credentials（11.28）、assurances（11.14，κ[a]_e）、verdict 中的 judgments（§10 用 k[i]_e，k 取自 κ 或 λ）、culprits/faults（10.2 的 tuple 直接帶 Ed25519 key 與簽章）、audit announcements（17.7）、以及 offender 身分——ψ_O 是 Ed25519 key 的集合，H_O ∈ [H_E]（5.11），Φ 用 k_e ∈ ψ′_O 判斷（6.15）。BLS：只有 BEEFY（18.1，κ′[v]_bls 對 accumulation-output MMR 的 Keccak 簽章）。eq. 6.28：H_E = (η_0, η_1, [(k_b, k_e) | k ∈ γ′_P])；§6.6：marker 是給「do not synchronize the entire state」的節點用 header 鏈追蹤 validator 變化——只有 Bandersnatch 的話，這種節點能驗 seal，卻無法把 guarantee/assurance/judgment/announcement 或 H_O 裡的 Ed25519 key 對應到 validator，因此 0.6.4 把 Ed25519 key 加進 H_E（changelog：「Ed25519 keys in epoch marker」）；BLS 與 metadata 不在 H_E 內。你們的 EpochMarkValidatorKeys 就是 {Bandersnatch, Ed25519} 兩欄，ValidateHeaderEpochMark 兩者都比。","trap":"口訣：Bandersnatch = Safrole（票、seal、entropy、audit 抽籤）；Ed25519 = 其他所有簽章與 offender 身分；BLS = 只有 BEEFY。"},{"id":"ch10-verdict-keyset-epoch-boundary","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.2–10.4","difficulty":3,"kind":"concept","tags":["disputes","calc","tiny","epoch-boundary"],"stem":"Tiny config (E = 12). A block with H_T = 24 — the first block of epoch 2 — is imported on top of a parent whose τ = 23, and its E_D contains verdicts. Per eq. 10.2–10.4, which epoch indices a may those verdicts carry, and which validator set K(a) verifies each of them?","options":["a ∈ {2, 1, 0}: in an epoch-boundary block judgments from κ′, κ and λ are all admissible, each verdict still needing ⌊2|k|/3⌋+1 = 5 signatures","a ∈ {1, 0}: a = 1 selects the prior κ (the set active during epoch 1) and a = 0 the prior λ; a = 2 is rejected even though the block itself belongs to epoch 2","a ∈ {2, 1}: a = 2 selects the prior κ and a = 1 the prior λ, since ⌊H_T/E⌋ = 2 is the epoch index a verdict must name; a = 0 is rejected as too old","a ∈ {2, 1}: a = 2 selects κ′ (the set this block rotates in) and a = 1 selects κ, because the index is derived from the block's own timeslot H_T; a = 0 is rejected since λ is two epochs stale by now"],"answer":1,"optNotes":["K 只有兩個 case，a = 2 既 ≠ ⌊τ/E⌋ 也 ≠ ⌊τ/E⌋ − 1 → 區塊直接無效。","τ = 23 → ⌊23/12⌋ = 1，所以 a ∈ {1, 0}；K(a) 取的正是 prior 的 κ 與 λ。","同樣拿 H_T 推 a：⌊H_T/E⌋ = 2 不是 verdict 該帶的 index，型別綁的是 ⌊τ/E⌋。","epoch index 綁的是父塊的 τ 而不是本塊 H_T；κ′ 這批新 validator 本塊還不能簽 verdict。"],"explanation":"eq. 10.2 的 verdict 第二項型別是 ⌊τ/E⌋ − N_2，即 {⌊τ/E⌋, ⌊τ/E⌋ − 1}，而 τ 是 **prior state 的 timeslot**（GP 原文：「must be either the epoch index of the prior state or one less」）。eq. 10.3：K(a) = κ 當 a = ⌊τ/E⌋，否則 λ——這裡的 κ、λ 都是 prior state 的集合。計算：τ = 23 → ⌊23/12⌋ = 1。本塊雖然 H_T = 24 屬於 epoch 2、且會做 key rotation（κ′ = γ_P、λ′ = κ，eq. 6.14），但 disputes 用的是 prior 集合，γ_P 這批新 validator 在本塊還不能簽 verdict；要到下一塊（τ = 24：a = 2 → κ = 新集合，a = 1 → λ = 舊 κ）才行。eq. 10.4 另要求每個 verdict 恰好 ⌊2|k|/3⌋+1 = 5（tiny）個 judgment。你們 VerifySignature：`a := U32(state.GetTau()) / U32(EpochLength)`，state 取自 `GetPriorStates()`，與 GP 一致。","trap":"口訣：verdict 的 a 看「父塊的 τ」，K(a) 取「prior κ/λ」；換 epoch 那一塊，新集合還簽不了 verdict。"},{"id":"ch10-code-genesis-age-underflow","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.2–10.3 — internal/extrinsic/verdict_controller.go VerifySignature","difficulty":3,"kind":"code","tags":["disputes","code","fuzzer","edge-case"],"stem":"The chain is still in its genesis epoch (prior τ < E, so ⌊τ/E⌋ = 0). Which verdict `Age` does this code accept although GP 0.8.0 (eq. 10.2–10.3) makes the block invalid — and against which key set would it then verify the judgments?","code":{"lang":"go","caption":"internal/extrinsic/verdict_controller.go (VerdictWrapper.VerifySignature)","src":"func (v *VerdictWrapper) VerifySignature() error {\n\n    state := blockchain.GetInstance().GetPriorStates()\n\n    a := types.U32(state.GetTau()) / types.U32(types.EpochLength)\n    if v.Verdict.Age != a && v.Verdict.Age != a-1 {\n        return errors.New(\"bad_judgement_age\")\n    }\n\n    k := make(types.ValidatorsData, types.ValidatorsCount)\n    if v.Verdict.Age == a {\n        k = state.GetKappa()\n    } else {\n        k = state.GetLambda()\n    }"},"options":["Age = 0 with judgments signed by λ keys: since a−1 cannot be matched at genesis, the code falls through to the λ branch and accepts λ signatures for the current epoch","Age = 1: because the check compares Age against both a and a−1 symmetrically, the next epoch's index also passes and the judgments are verified against κ as if the epoch had already rolled over","None: the wrapped value of `a-1` can never equal a decoded 32-bit Age, so at genesis only Age = 0 passes and the code is exactly the GP rule","Age = 2^32 − 1: `a-1` wraps around in U32, so the age check passes and the judgments are verified against λ, whereas ⌊τ/E⌋ − N_2 has no previous epoch at epoch 0"],"answer":3,"optNotes":["Age = 0 走的是 `Age == a` 分支 → 用 κ 驗簽，不會落到 λ。","Age = 1 既不等於 a = 0 也不等於 wrap 後的 0xFFFFFFFF，這個輸入照樣會被擋下。","U32 之間的比較就是會相等，wrap 後的值完全可能命中解碼出來的 Age。","a 宣告成 U32，a = 0 時 a-1 wrap 成 4294967295，而 Age 以 E_4 編碼，fuzzer 做得出這個值。"],"explanation":"eq. 10.2：a ∈ ⌊τ/E⌋ − N_2 = {⌊τ/E⌋, ⌊τ/E⌋ − 1}；eq. 10.3：K(a) = κ 當 a = ⌊τ/E⌋，否則 λ。在 genesis epoch，⌊τ/E⌋ = 0，「前一個 epoch」的 index 是 −1，不是自然數，所以唯一合法的 a 是 0；序列化上 a 是 E_4（附錄 C 的 E_D 編碼：(r, E_4(a), var[j])）。後果：這樣的區塊會通過 age 檢查並改用 λ 驗簽，若簽章確實由 λ 的 key 產生（genesis 時 λ 通常等於 κ），你們會接受一個 reference implementation 會拒絕的區塊 → state root 分歧。這正是 #1042 整合 PR 補的「genesis-epoch guard」。","trap":"用 unsigned 減 1 之前先想 a = 0；GP 的 ⌊τ/E⌋ − N_2 沒有負數，也沒有 2^32 − 1。"},{"id":"ch10-code-fault-equivalence-wonky","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.7 — internal/extrinsic/fault_controller.go VerifyReportHashValidty","difficulty":3,"kind":"code","tags":["disputes","code","faults","edge-case"],"stem":"In this block a verdict classifies report r as wonky (exactly ⌊|k|/3⌋ positive judgments), so r ∈ ψ′_W and r ∉ ψ′_G ∪ ψ′_B. E_F also carries a fault (r, ⊥, k, s) with a correct signature from a κ ∪ λ key that is not in ψ_O. Per GP 0.8.0 eq. 10.7, is the block valid — and what does this code do with it?","code":{"lang":"go","caption":"internal/extrinsic/fault_controller.go (FaultController.VerifyReportHashValidty)","src":"func (f *FaultController) VerifyReportHashValidty() error {\n    posteriorStates := blockchain.GetInstance().GetPosteriorStates()\n    psiBad := posteriorStates.GetPsiB()\n    psiGood := posteriorStates.GetPsiG()\n    // ... badMap / goodMap are filled from psiBad / psiGood ...\n    length := len(f.Faults)\n    for i := 0; i < length; i++ {\n        vote := f.Faults[i].Vote\n        // if vote not contradict verdict, should not be in faults\n        inGood := goodMap[f.Faults[i].Target] && !badMap[f.Faults[i].Target]\n        inBad := !goodMap[f.Faults[i].Target] && badMap[f.Faults[i].Target]\n        if (vote && inGood) || (!vote && inBad) {\n            return errors.New(\"fault_verdict_wrong\")\n        }\n    }\n    return nil\n}"},"options":["Invalid, and the code rejects it too: with inGood = inBad = false both clauses collapse to the vote itself, so fault_verdict_wrong is returned for v = ⊥","Invalid: the equivalence forces r into exactly one of ψ′_B, ψ′_G, so a wonky report admits no fault for either v; the code nevertheless accepts it, since it only rejects (v ∧ good) or (¬v ∧ bad)","Valid only if v = ⊤ — a 'valid' vote on a report that is not in ψ′_G is the offense a fault documents — and the code rejects exactly that combination via inGood","Valid: v = ⊥ does not contradict a non-good verdict, so the fault stands, k enters ψ′_O and H_O; the code agrees, since neither inGood nor inBad is set for a wonky target"],"answer":1,"optNotes":["inGood = inBad = false 時，(vote ∧ false) 與 (¬vote ∧ false) 都是 false，不會回錯誤。","eq. 10.7 要求 r 必落在 ψ′_B 或 ψ′_G 之一；wonky 時程式兩個子句皆假 → 直接放行。","v = ⊤ 只有對 bad report 才是 offense；good report 對應的 fault 投的是 ⊥。","wonky 時等價式的前兩項就已經不相等，無論 v 為何都不成立，fault 不可能合法。"],"explanation":"eq. 10.7 是三向等價：r ∈ ψ′_B ⇔ r ∉ ψ′_G ⇔ v。真值表：r 是 bad → (⊤ ⇔ ⊤ ⇔ v) → v 必須是 ⊤（offender 對壞 report 投 valid）；r 是 good → (⊥ ⇔ ⊥ ⇔ v) → v 必須是 ⊥（對好 report 投 invalid）；r 是 wonky 或根本沒被判過 → r ∈ ψ′_B 為 ⊥、r ∉ ψ′_G 為 ⊤，前兩項就不等價 → 區塊無效。直覺：wonky 表示「無法判定」，沒有人能被證明投錯票，所以 wonky verdict 只會清 ρ†（eq. 10.14），不會產生 offender。這段 Go 放行之後，k 還會被 UpdatePsiO 寫進 ψ′_O 並出現在 H_O——與 reference 分歧；#1042 的「fault equivalence enforcement」就是補這個洞。另外 k 的來源也有限制：k ∈ {κ ∪ λ 的 Ed25519 key} \\ ψ_O（prior），已在 punish-set 裡的 key 不能再報（你們回 offender_already_reported）。","trap":"fault 只能指向 good 或 bad 的 report；wonky 沒有 offender，只有 ρ† 清除。"},{"id":"ch10-report-hash-identity","ch":"10","section":"10.1 The State","gpRef":"eq. 10.1, 10.6, 10.14; cf. eq. 11.28","difficulty":2,"kind":"rationale","tags":["disputes","rationale","hashing"],"stem":"ψ_G, ψ_B, ψ_W, every judgment message, every culprit proof and the ρ† clearing rule (eq. 10.14) all identify the disputed item by one 32-byte hash. Which hash is it, and why is that the right identity for a dispute?","options":["H(E(g)) — the hash of the whole guarantee including its credential and slot, so that the guarantors who signed are bound into the judged object and culprits can be derived from the verdict alone","The erasure root (w_s)_u, because a dispute is ultimately about whether the erasure-coded bundle behind the report reconstructs to valid data, which is what auditors re-execute","H(E(w)) — the hash of the encoded work-report: it is exactly what guarantors signed (X_G ⌢ H(w)), so a culprit proof is the original guarantee signature, and eq. 10.14 matches cores via H((ρ[c]_g)_w)","The work-package hash (w_s)_h: the package is the unit of work, so judging it bans every report ever made of that package, and eq. 10.14 compares the package hash held in ρ[c] against the verdict"],"answer":2,"optNotes":["若 hash 含 credential，同一份 report 換一組簽章就成了另一個物件，judgment 也無法獨立計算。","erasure root 只承諾資料可用性、不承諾計算結果，而 dispute 爭的正是結果。","H(E(w)) 與 guarantor 簽的 X_G ⌢ H(w) 是同一個訊息，culprit proof 就是原本那把簽章。","package hash 只承諾輸入：同一個 package 可能產出一對一錯的兩份 report，分不開。"],"explanation":"§10.1：ψ_G/ψ_B/ψ_W 是「the hashes of all work-reports」；eq. 10.14 用 H((ρ[c]_g)_w)——取 assignment 裡的 guarantee、再取其中的 work-report 來 hash——去比對 verdict。dispute 爭的是「這份宣稱的結果」是否正確，所以識別碼必須綁在 report 這一層。eq. 10.6 的 culprit 簽章是 Ed25519_k(X_G ⌢ r)，而 eq. 11.28 的 guarantee 簽章是 Ed25519(X_G ⌢ H(w))——訊息完全相同（這也是 0.8.0 #494 把整個 guarantee 存進 ρ 的理由之一：「the guarantor signatures are needed to construct a disputes extrinsic」）。你們 ClearWorkReports 正是 `encoder.Encode(&priorStatesRho[i].Report)` 再 Blake2b——hash 的是 report，不是整個 assignment (g, t)。","trap":"三處同一個 hash：judgment 訊息 X_valid/X_invalid ⌢ H(w)、culprit 訊息 X_G ⌢ H(w)、ρ† 清除 H((ρ[c]_g)_w)。"},{"id":"ch11-rho-pipeline-worked","ch":"11","section":"11.2 Package Availability Assurances / 11.5 Transitioning for Reports","gpRef":"eq. 11.16–11.18, 11.32, 11.46","difficulty":3,"kind":"concept","tags":["assurances","guarantees","calc","tiny","timeout"],"stem":"Tiny config (|κ| = 6, U = 5), one core c = 0, no disputes. Block at slot 40: E_G carries guarantee g₁ for core 0. Block at slot 42: E_A has 4 assurances with bit 0 set. Block at slot 45: E_A has 3 assurances with bit 0 set and E_G carries an otherwise-valid guarantee g₂ for core 0. After the slot-45 block, what are ρ‡[0] and ρ′[0], and is g₁'s report ever accumulated?","options":["ρ‡[0] = ∅ because the cumulative 7 assurances made the report available; it accumulates in this block and ρ′[0] = (g₂, 45)","ρ‡[0] = (g₁, 40): the timeout only fires once H_T > t + U, i.e. from slot 46, so g₂ is rejected as core_engaged","ρ‡[0] = ∅ because 45 ≥ 40 + U; g₁'s report never enters R and is dropped without accumulation; g₂ is accepted, so ρ′[0] = (g₂, 45)","ρ‡[0] = (g₁, 40): the 4 + 3 = 7 assurances gathered so far exceed the threshold of 5, so the report is in R and accumulates, while g₂ is rejected as core_engaged"],"answer":2,"optNotes":["同樣把 4 + 3 當成 7 票；eq. 11.17 只數本塊 E_A 裡的 assurance。","eq. 11.18 的比較子是 ≥ 而不是 >，slot 45 就已經逾時。","45 ≥ 40 + 5 觸發 timeout，g₁ 從未進入 R，同一塊的 core 就能換上 g₂。","assurance 不跨塊累加：ρ 只存 (g, t)，state 裡沒有任何計數器。"],"explanation":"逐塊推演。slot 40：eq. 11.46 → ρ′[0] = (g₁, 40)（timestamp 是 τ′，不是 g₁ 裡的 t）。slot 42：eq. 11.17 的 R 只數**本塊** E_A：Σ_{a ∈ E_A} a_f[0] = 4，門檻是 > 2/3·6 = 4，需 ≥ 5 → 不可用；eq. 11.18 的 timeout 檢查 42 ≥ 40 + 5 為假 → ρ‡[0] = ρ′[0] = (g₁, 40)。slot 45：本塊只有 3 個 assurance → 仍不可用（assurer 必須每塊重送，直到某一塊單獨過門檻）；但 45 ≥ 40 + 5 成立 → ρ‡[0] = ∅；g₁ 的 report 從未進入 R，就這樣消失、不 accumulate（§11 開頭：「timed-out, implying it may be replaced by another report without accumulation」）。接著 eq. 11.32 用 ρ‡ 檢查 core：ρ‡[0] = ∅ → g₂ 合法 → ρ′[0] = (g₂, 45)。附註：slot 45 的三個 assurance 仍合法，因為 eq. 11.16 只要求 ρ†[0] ≠ ∅（timeout 在 ρ‡ 才生效）。你們 FilterAvailableReports：`headerTimeSlot >= AssignedSlot + WorkReportTimeout`，UpdateNewlyAvailableWorkReports 只統計當塊 extrinsic——與 GP 一致。","trap":"assurance 不累積；timeout 用 ≥；timeout 的 report 不 accumulate，但 core 同一塊就可再用——這正是 ρ‡ 存在的理由。"},{"id":"ch11-guarantee-slot-window-calc","ch":"11","section":"11.4 Work Report Guarantees","gpRef":"eq. 11.28","difficulty":2,"kind":"concept","tags":["guarantees","rotation","calc"],"stem":"Full config (R = 10). The block being imported has τ′ = 57. For a guarantee g = (w, t, a) in E_G, which values of t are acceptable under eq. 11.28, and which assignment (M or M*) verifies the credential for each?","options":["t ∈ [50, 57] only — the current rotation, all verified against M — because M* is consulted solely when the previous rotation lies in the previous epoch","t ∈ [47, 57] — a sliding window of R slots ending at τ′; t ∈ [47, 49] is verified against M* and t ∈ [50, 57] against M; t = 46 is rejected as too old","t ∈ [40, 59] — the whole previous and current rotation — with t > τ′ allowed since guarantees may be produced before the block that includes them","t ∈ [40, 57]: t ∈ [40, 49] is verified against M* (rotation index 4) and t ∈ [50, 57] against M (rotation index 5); t = 39 and t = 58 are both rejected"],"answer":3,"optNotes":["M* 在每個 rotation 邊界都會用到，並不是只有跨 epoch 時才查。","下界是 rotation 對齊的 R·(⌊τ′/R⌋ − 1) = 40，不是滑動的 τ′ − R = 47。","eq. 11.28 明寫 t ≤ τ′，未來 slot 的 guarantee 一律不收。","⌊57/10⌋ = 5 → 下界 10·4 = 40，共 18 個 slot；rotation index 相同才用 M。"],"explanation":"eq. 11.28 第三行：R·(⌊τ′/R⌋ − 1) ≤ t ≤ τ′。⌊57/10⌋ = 5 → 10·(5 − 1) = 40，所以 40 ≤ t ≤ 57，共 18 個 slot（前一整個 rotation + 本 rotation 到目前為止）。選集合的規則：(c, k) = M 當 ⌊τ′/R⌋ = ⌊t/R⌋，否則 M*。t ∈ [50, 57] → ⌊t/10⌋ = 5 = ⌊57/10⌋ → M = (P(|κ′|, η′_2, 57), Φ(κ′))；t ∈ [40, 49] → ⌊t/10⌋ = 4 → M* = (P(|k|, e, τ′ − R = 47), Φ(k))，而 ⌊47/600⌋ = ⌊57/600⌋，所以 (k, e) = (κ′, η′_2)，rotation index ⌊47/10⌋ = 4。你們 ValidateSignatures：`(int(tau)/RotationPeriod-1)*RotationPeriod <= slot` 否則 ReportEpochBeforeLast、`slot <= tau` 否則 FutureReportSlot、`tau/R == slot/R` 決定 GFunc 或 GStarFunc——完全對應。","trap":"下界是 rotation 對齊的 R(⌊τ′/R⌋−1)，不是 τ′−R；τ′ = 57 時可回溯 17 個 slot，τ′ = 50 時也是只回到 40。"},{"id":"ch11-rotation-epoch-boundary-mstar","ch":"11","section":"11.3 Guarantor Assignments","gpRef":"eq. 11.23, 11.28","difficulty":3,"kind":"concept","tags":["guarantees","rotation","calc","epoch-boundary"],"stem":"Full config (E = 600, R = 10). A block at τ′ = 603 includes a guarantee with t = 595. Which assignment must its credential be checked against?","options":["M* = (P(|κ′|, η′_2, 593), Φ(κ′)): the previous rotation always uses the current epoch's entropy and set, only the rotation index differs","The guarantee is invalid: a guarantee may not straddle an epoch boundary because the validator set may have changed","M = (P(|κ′|, η′_2, 603), Φ(κ′)) at rotation index 0, because t is within R slots of τ′","M* = (P(|λ′|, η′_3, 593), Φ(λ′)): the previous rotation (index 59) belonged to the previous epoch, so it is recomputed from λ′ and η′_3"],"answer":3,"optNotes":["τ′ − R = 593 落在上一個 epoch，eq. 11.23 因此改用 (λ′, η′_3) 而不是當期的 (κ′, η′_2)。","GP 明講可以用前一個 rotation 的 t，M* 正是為此而存在。","判準是兩個 rotation index 是否相同（60 ≠ 59），而不是 t 與 τ′ 的距離。","⌊593/600⌋ = 0 ≠ ⌊603/600⌋ = 1 → 取 (λ′, η′_3)，P 內的 rotation index 是 59。"],"explanation":"先看視窗：R(⌊603/10⌋ − 1) = 590 ≤ 595 ≤ 603 ✓。再看 rotation：⌊603/10⌋ = 60 ≠ ⌊595/10⌋ = 59 → 用 M*（eq. 11.28 的 otherwise）。eq. 11.23：(k, e) = (κ′, η′_2) 當 ⌊(τ′ − R)/E⌋ = ⌊τ′/E⌋，否則 (λ′, η′_3)。為什麼這樣才對：epoch 換屆時 λ′ = κ（eq. 6.14）、η′_3 = η_2（eq. 6.24），正好是上個 epoch 期間算 M 所用的 (κ′, η′_2)，所以 M* 精確重現 rotation 59 的分配；換屆後 η′_2 已是新 epoch 的 entropy，拿它配 λ′ 或 κ′ 都算不出當時的分配。注意 0.8.0 額外要求：即使用 M*，w_c 仍須 < |κ′|/3（posterior set）——「Use of an inactive core is not permitted even if a timeslot in the previous rotation is used and the core was active then」；且 Φ 用的是 ψ′_O，本塊新抓到的 offender 在 λ′ 裡也會被 null 掉。你們 GStarFunc：`(tau − R)/E == tau/E` 選 (η′_2, κ′) 否則 (η′_3, λ′)，再以 tau − R 呼叫 NewGuranatorAssignments——一致。","trap":"M* 的 entropy/set 由 τ′ − R 落在哪個 epoch 決定；(λ′, η′_3) 這組合只在 epoch 開頭的第一個 rotation 出現。"},{"id":"ch11-code-permute-080","ch":"11","section":"11.3 Guarantor Assignments","gpRef":"eq. 11.20–11.22 — internal/extrinsic/guarantor_assignments.go permute","difficulty":2,"kind":"code","tags":["guarantees","shuffle","code","delta-0.8.0"],"stem":"This is the team's P (GP 0.7.2). Under GP 0.8.0 (eq. 11.20–11.21), what changes when the validator sequence has |κ′| = 9 in a chain with C = 341 cores?","code":{"lang":"go","caption":"internal/extrinsic/guarantor_assignments.go (rotateCores, permute)","src":"// (11.19) R(c, n) = [(x + n) mod C | x ∈ c]\nfunc rotateCores(in []types.U32, n types.U32) []types.U32 {\n    out := make([]types.U32, len(in))\n    for i, x := range in {\n        out[i] = (x + n) % types.U32(types.CoresCount)\n    }\n    return out\n}\n\n// (11.20)\nfunc permute(e types.Entropy, currentSlot types.TimeSlot) []types.CoreIndex {\n    base := make([]types.U32, types.ValidatorsCount)\n    for i := 0; i < types.ValidatorsCount; i++ {\n        c := (types.CoresCount * i) / types.ValidatorsCount\n        base[i] = types.U32(c)\n    }\n\n    shuffled := shuffle.Shuffle(base, types.OpaqueHash(e))\n\n    subEpoch := (int(currentSlot) % types.EpochLength) / types.RotationPeriod\n\n    // R(...) call\n    rotatedU32 := rotateCores(shuffled, types.U32(subEpoch))\n    ..."},"options":["0.8.0 builds the base [⌊i/3⌋ | i ∈ N_9] = [0,0,0,1,1,1,2,2,2] and rotates modulo |κ′|/3 = 3; this code builds ⌊341·i/9⌋ = [0, 37, 75, …, 303] and rotates modulo 341, scattering guarantors over inactive cores","Nothing observable: ⌊C·i/V⌋ and ⌊i/3⌋ coincide for every validator count permitted by eq. 6.8, and mod C equals mod V/3 for the same reason, so only the constant names differ between the versions","0.8.0 keeps ⌊C·i/V⌋ = [0, 37, 75, …, 303] as the base but changes the rotation modulus from C to E/R = 60, the number of rotations per epoch, so the shuffle output cycles once per epoch","0.8.0 replaces the Fisher–Yates shuffle by a plain rotation of the identity assignment [0, 1, 2, …, 8] modulo |κ′|/3, removing the dependence on η′_2 so that assignments are known a whole epoch ahead"],"answer":0,"optNotes":["0.8.0 的 base 是 ⌊i/3⌋、modulus 是 |κ′|/3；⌊C·i/9⌋ 會把 guarantor 撒到 inactive core。","只有 V = 3C 時兩式才重合；eq. 6.8 允許的其他 |κ| 一出現就分歧。","E/R = 60 是每個 epoch 的 rotation 次數，跟 rotation 的 modulus（core 數）是兩回事。","F 與 η′_2 都還在：用 η′_2 而非 η′_1 正是為了避免 fork magnification。"],"explanation":"eq. 11.21：P(v, e, t) = R(F([⌊i/3⌋ | i ∈ N_v], e), ⌊(t mod E)/R⌋)；eq. 11.20：R(c, n) = [(x + n) mod (|c|/3) | x ∈ c]。0.8.0 的邏輯是「每個 core 3 個 guarantor，所以只有前 |κ′|/3 個 core 是 active」（§11.3）；|κ′| = 9 → base = [0,0,0,1,1,1,2,2,2]，用 η′_2 做 Fisher–Yates 後 rotation 取 mod 3。你們 permute 是 0.7.2 的 ⌊C·i/V⌋ 加 `% CoresCount`：i = 0..8 → ⌊341·i/9⌋ = [0, 37, 75, 113, 151, 189, 227, 265, 303]，再 mod 341——把 guarantor 分到 inactive core，且每個 core 只有 1 人，永遠湊不到 2 個簽章。為什麼現在 test vectors 都過？因為 tiny (6, 2) 與 full (1023, 341) 都滿足 V = 3C：⌊2i/6⌋ = ⌊341i/1023⌋ = ⌊i/3⌋，且 mod C = mod V/3，兩式完全重合；一旦 0.8.0 eq. 6.8 允許的其他 |κ| ∈ {3c} 出現就分歧（issue #1037「support variable validator-set size」）。","trap":"0.8.0 的 base 與 modulus 都只看 |κ′|（⌊i/3⌋、mod |κ′|/3），C 只在 ρ 的長度出現。"},{"id":"ch11-code-anchor-checks-080","ch":"11","section":"11.4.1 Contextual Validity of Reports","gpRef":"eq. 11.36, 11.38 — internal/extrinsic/guarantee_controller.go ValidateContexts","difficulty":2,"kind":"code","tags":["guarantees","context","code","delta-0.8.0"],"stem":"This is the team's refinement-context validation (GP 0.7.2). Which conditions required by GP 0.8.0 eq. 11.36 (anchor) and eq. 11.38 (lookup anchor) are missing from it?","code":{"lang":"go","caption":"internal/extrinsic/guarantee_controller.go (GuaranteeController.ValidateContexts)","src":"for _, context := range contexts {\n    recentAnchorMatch := false\n    stateRootMatch := false\n    beefyRootMatch := false\n    for _, blockInfo := range betaDagger {\n        // xa = yh\n        if context.Anchor == blockInfo.HeaderHash {\n            recentAnchorMatch = true\n            // xs = ys\n            stateRootMatch = (context.StateRoot == blockInfo.StateRoot)\n            // xb = yb\n            beefyRootMatch = context.BeefyRoot == types.BeefyRoot(blockInfo.BeefyRoot)\n            break\n        }\n    }\n    ...\n}\n// 11.35   ancestors currently not maintained\nancestry := blockchain.GetInstance().GetAncestry()\nif len(ancestry) > 0 {\n    for _, context := range contexts {\n        anchorHashCondition := false\n        for _, item := range ancestry {\n            cond1 := item.Slot == context.LookupAnchorSlot\n            cond2 := item.HeaderHash == context.LookupAnchor\n            if cond1 && cond2 {\n                anchorHashCondition = true\n                break\n            }\n        }\n        ..."},"options":["Nothing beyond renaming BeefyRoot to the accumulation-output super-peak b, with the new BlockInfo timeslot being informational only; both anchor tuples are otherwise identical to 0.7.2","Anchor: drop the state-root comparison because 0.8.0 anchors carry a timeslot instead of a state root; lookup anchor: check only l_t ≥ H_T − L, since the ancestor-set requirement was removed in 0.8.0","Anchor: the context's anchor timeslot must also equal the β† entry's timeslot (x_t = y_t); lookup anchor: the child header h′ (h′_p = H(h)) must carry h′_r = l_s, verifying the lookup anchor's posterior state root","Anchor: compare against β instead of β†, since 0.8.0 no longer patches the parent's state root into recent history; lookup anchor: unchanged, since the ancestor set already stores (slot, hash) pairs"],"answer":2,"optNotes":["「只是改名」忽略了 0.8.0 新增的兩個欄位：anchor slot 與 lookup-anchor posterior root。","state root 的比對並沒有被拿掉，祖先集合的要求也還在，eq. 11.38 仍是硬性條件。","缺的正是 eq. 11.36 的第四個等式 x_t = y_t，以及 eq. 11.38 的 h′_r = l_s。","β† 仍然必要：它把父塊 entry 的 state root 換成本塊的 H_R（eq. 7.5），否則沒有正確的 root 可比。"],"explanation":"eq. 11.36（0.8.0）：∀x ∈ x：∃y ∈ β†：x_a = y_h ∧ x_s = y_s ∧ x_b = y_b ∧ x_t = y_t——四個等式，第四個 timeslot 是 #526 新增（β 的每筆 entry 在 0.8.0 也多了 timeslot，eq. 7.2/7.8；你們 #1031 加了 BlockInfo.timeslot）。eq. 11.38（0.8.0）：∃h, h′ ∈ A：h_t = l_t ∧ H(h) = l ∧ h′_p = H(h) ∧ h′_r = l_s——lookup anchor 的 posterior state root l_s 沒辦法從 h 自己讀到（header 只帶 prior state root H_R），所以透過它的子塊 h′ 的 H_R 來驗。這段 Go 只比對 Anchor/StateRoot/BeefyRoot（三項）以及 ancestry 的 (slot, hash)（兩項）；#1027 加了 anchor_slot 與 lookup_anchor_state_root 兩個欄位，驗證邏輯也要跟上。","trap":"0.8.0 的 anchor 比四項（hash、state root、super-peak、slot）；lookup anchor 比三項，其中 l_s 要靠子塊的 H_R。"},{"id":"ch11-lookup-anchor-ancestry","ch":"11","section":"11.4.1 Contextual Validity of Reports","gpRef":"eq. 11.37–11.38","difficulty":2,"kind":"concept","tags":["guarantees","context","fuzzer"],"stem":"Why can the lookup-anchor requirement (eq. 11.38) not be checked from the on-chain state σ alone, and how does the conformance fuzzer make it checkable for an M1 target?","options":["It needs the full posterior state of the lookup-anchor block in order to recompute its state root r, which the fuzzer supplies on demand through GetState messages while the block is being imported","It needs the headers of the last L slots (the ancestor set, not part of σ), deterministic from the header chain; the fuzzer's Initialize message therefore carries an ancestry list of (slot, header hash), a mandatory M1 feature","It only needs β, the last H = 8 blocks, whose entries carry a header hash, a state root and a timeslot, so the check is purely on-chain; the fuzzer merely replays enough blocks to fill β before it submits any guarantees","The fuzzer skips it: 0.8.0 made the lookup anchor optional in the refinement context, so only the age bound l_t ≥ H_T − L is exercised by the vectors and no ancestry list is transmitted at Initialize"],"answer":1,"optNotes":["eq. 11.38 只比對 header 欄位、不必重算 state root；GetState 是匯入完成後的稽核介面。","祖先集合不在 σ 裡，但由 header chain 決定，所以仍是 deterministic and calculable。","β 只有 H = 8 筆，而 lookup anchor 可回溯 L = 14,400 slot，覆蓋範圍差了三個數量級。","eq. 11.4 的 ℂ 一定帶 l、t、r 三個 lookup-anchor 欄位，0.8.0 反而多要求了 posterior root r。"],"explanation":"§11.4.1 原文：「this is one of the few conditions which cannot be checked purely with on-chain state and must be checked by virtue of retaining the series of the last L headers as the ancestor set. Since it is determined through the header chain, it is still deterministic and calculable.」eq. 11.37 只用 H_T 與 l_t 比（l_t ≥ H_T − L，L = 14,400 slots = 24 小時）；eq. 11.38 則要在祖先集合裡找到 h（h_t = l_t、H(h) = l）及其子塊 h′（h′_p = H(h)、h′ 的 prior-state-root = r）——後者是 β 完全沒有的資訊。Conformance fuzzer 因此把 Ancestry 列為 M1 必備 feature（「lookup anchors in guarantees are within last L imported headers」），Initialize（SetState）訊息附帶 ancestry 陣列，之後每次成功 import 再 append——這就是 #853/#854「add ancestry to store and fix guarantee slot validation」與 #892 的來源。你們 ValidateContexts 只在 `len(ancestry) > 0` 時比對 (slot, hash)，否則跳過（錯誤碼 LookupAnchorNotRecent）。","trap":"anchor 靠 β†（state 內），lookup anchor 靠祖先 header（state 外）；兩者的年齡上限不同：H = 8 塊 vs L = 14,400 slots。"},{"id":"ch11-prerequisite-window","ch":"11","section":"11.4.1 Contextual Validity of Reports","gpRef":"eq. 11.42","difficulty":3,"kind":"concept","tags":["guarantees","dependencies","edge-case"],"stem":"A work-report in E_G lists prerequisite p. Package p was guaranteed 10 blocks ago and accumulated 8 blocks ago, so p ∈ ξ but p no longer appears in any entry of β (H = 8). Is the guarantee valid?","options":["Valid at guarantee time, but the report is parked in the ready queue ω until p is reported again inside the recent-history window, because eq. 11.42 is re-evaluated during accumulation","Invalid (dependency_missing): eq. 11.42 requires every prerequisite to be guaranteed in the very same block, so only mutual and self dependencies are admissible and β is never consulted","Invalid (dependency_missing): eq. 11.42 admits a prerequisite only if it is in this block's E_G or among the reported-package sets of β; ξ is not consulted at guarantee time","Valid: p ∈ ξ proves the package was accumulated, and eq. 11.42 accepts ξ alongside the extrinsic and β, so the dependency holds and the report accumulates as soon as it is available"],"answer":2,"optNotes":["ω 只收已經通過 guarantee 檢查的 report，不存在「暫存等補件」這種狀態。","eq. 11.42 明列 β 各 entry 的 reported 字典，vectors 的「from history」測的正是這條路徑。","eq. 11.42 的來源集合只有本塊的 p 與 β 各 entry 的 reported 字典，ξ 不在其中。","把 §12 的規則搬到了 §11：ξ 只在 accumulation 端用來判斷 prerequisite 是否已滿足。"],"explanation":"eq. 11.42：∀w ∈ I, ∀p ∈ (w_x)_p ∪ keys(w_l)：p ∈ p ∪ {x | x ∈ keys(b_p), b ∈ β}——prerequisite（以及 segment-root lookup 的 key）只能來自本塊 E_G 的 package hash 集合 p，或 β 各 entry 的 reported-package 字典（最近 H = 8 塊）。ξ（accumulated，保存 E 個 slot 的 accumulated package hash）完全沒有出現在這條式子裡；它是 §12 accumulation 端用來判斷 prerequisite 是否已滿足、決定 report 進 R* 還是留在 ω 的依據。所以「10 塊前 report、8 塊前 accumulate」的 p 已經掉出 β：新 report 在 guarantee 階段就被拒（你們回 DependencyMissing；test vectors 的 dependencies 案例分 mutual/self/from history 三種）。設計意圖：pipeline 中相依的 package 應緊接著提交；β 同時提供 segment root（eq. 11.43–11.44）供 lookup 驗證，ξ 沒有 segment root。你們 CheckExtrinsicOrRecentHistory 的 checkPackageSet 正是 p ∪ β.History[].Reported。","trap":"guarantee 時看 β（8 塊），accumulate 時看 ξ（E 個 slot）；兩個視窗、兩個問題。"},{"id":"ch11-code-hash-prediction","ch":"11","section":"11.4.1 Contextual Validity of Reports","gpRef":"eq. 11.45","difficulty":3,"kind":"concept","tags":["guarantees","digest","edge-case"],"stem":"Service s upgraded its code after a work-package was built: the work-item's code hash c was correct at build time and refine ran the code available at the lookup anchor, but the including block's prior state has δ[s]_c ≠ c. What happens to the guarantee at inclusion?","options":["Accepted: c only records which code refine actually executed, resolved against the lookup anchor's posterior state, and accumulation then simply runs whatever δ′[s]_c holds at that time","Accepted, but the digest's result is overwritten on-chain with the BAD error, since the recorded code hash no longer resolves to a preimage the service still holds in its lookup dictionary","Rejected (bad_code_hash): eq. 11.45 demands d_c = δ[d_s]_c in the prior state of the including block, so a report refined against superseded code is discarded rather than accumulated","Accepted provided the lookup anchor is at most L = 14,400 slots old, because code availability is judged only at the lookup anchor and eq. 11.45 constrains the payload hash, not the code hash"],"answer":2,"optNotes":["eq. 11.45 是硬性等式，比對基準是包含區塊的 prior δ，既不是 lookup anchor 也不是 δ′。","鏈上規則從不改寫 digest：改寫會讓 report hash 對不上 guarantor 的簽章。","eq. 11.45 要求 d_c = δ[d_s]_c，service 一升級這個預測就落空，report 只能重做。","11.45 管的是 d_c（code hash），payload hash 鏈上不檢查；年齡上限是另一條 eq. 11.37。"],"explanation":"§11.1.4：「We include the hash of the code of the service at the time of being reported c, which must be accurately predicted within the work-report according to equation 11.45」；eq. 11.45：∀w ∈ I, ∀d ∈ w_d：d_c = δ[d_s]_c，δ 是 prior state。§14 的 work-item 也說 c 是「the code hash of the service at the time of reporting (whose preimage must be available from the perspective of the lookup anchor block)」——refine 執行的是這個 hash 在 lookup-anchor 視角下 historical lookup 到的 preimage，而鏈上檢查的是包含區塊當下的 δ[s]_c（reports vectors 有 bad_code_hash 案例）。理由：accumulate 稍後會用當下的 code 執行，若 report 是用已被淘汰的 code 算出來的，不該進入 accumulation，而是讓 guarantor 重做。附帶一提，BAD 是 refine 階段在 lookup-anchor 視角查不到 code preimage 時就寫進 digest 的值（eq. 11.7），與這條鏈上檢查是兩回事。你們 CheckWorkResult：`w.CodeHash != delta[w.ServiceID].ServiceInfo.CodeHash` → BadCodeHash，δ 取自 prior state。","trap":"digest 的 c 是「預測」：refine 用 lookup-anchor 的 code，鏈上卻比對 prior δ 的 code hash。"},{"id":"ch11-inactive-core-set-shrink","ch":"11","section":"11.4 Work Report Guarantees","gpRef":"eq. 11.18, 11.23, 11.28, 11.31","difficulty":3,"kind":"delta","tags":["guarantees","assurances","delta-0.8.0","variable-validators"],"stem":"GP 0.8.0, C = 341, E = 600, R = 10. During epoch e the active set had |κ| = 12 (cores 0–3 active); at the epoch change the set shrinks to |κ′| = 9. The first block of the new epoch (τ′ = 600) carries a guarantee for core 3 with t = 595, signed by the three validators that M* assigns to core 3. Which statement is correct?","options":["Invalid: eq. 11.28 bounds w_c by |κ′|/3 = 3 even under M*, so core 3 is now inactive; eq. 11.31 wants (w_s)_v = |κ′| = 9, not the 12 chunks the report carries; and eq. 11.18 has already emptied ρ‡ because |κ| ≠ |κ′|","Valid: M* reproduces the previous rotation's assignment, under which core 3 was active and 12 chunks were the right shard count; eq. 11.28's core bound is read against whichever set M* selects, and ρ‡ survives an epoch change untouched","Invalid only because the signers come from λ′: eq. 11.23 lets M* fall back to the previous epoch's keys for assurances alone, so a guarantee in an epoch's first block needs κ′ signatures and w_c may be any core below C/3","Valid, but ρ′[3] is stamped with the guarantee's own slot t = 595 instead of τ′ = 600, so eq. 11.18's H_T ≥ t + U already holds at slot 600 and the assignment is dropped in the very block that created it"],"answer":0,"optNotes":["三條 0.8.0 新規則同時命中：core 上限 |κ′|/3 = 3、shard 數要 9、且 ρ‡ 已因換屆清空。","M/M* 只決定誰有資格簽；w_c 的上限永遠用 posterior κ′，ρ‡ 也會被 |κ| ≠ |κ′| 清空。","eq. 11.23 的 M* 本來就是 guarantor 的上一輪分配，λ′ 成員簽名合法；上限也不是 C/3。","eq. 11.46 的 timestamp 永遠是 τ′ = 600，600 ≥ 605 不成立，不會當場被清掉。"],"explanation":"這題把 0.8.0 因「validator 數可變」（eq. 6.8：|κ| ∈ {3c}）而新增的三條規則放在一起。(1) eq. 11.28：c[v] = w_c < |κ′|/3——用 **posterior** κ′ 的大小，且 GP 明說「Use of an inactive core is not permitted even if a timeslot in the previous rotation is used and the core was active then」，所以 core 3（|κ′|/3 = 3 → active 只有 0–2）即使透過 M* = (P(|λ′|, η′_3, 590), Φ(λ′)) 找得到合法簽署者也不行。(2) eq. 11.31：(w_s)_v = |κ′| = 9——每個 assurer 拿一個 chunk，chunk 數必須等於新的 assurer 數；為 12 個 validator 編的 report 對不上。(3) eq. 11.18：|κ| ≠ |κ′| 時 ρ‡ 全部清空（「Items cleared in this way can be viewed as having timed out early」）——舊集合留下的 pending report 也無法再被新集合 assure。0.7.2 沒有這些問題（V = 1023 = 3C 固定），你們 0.7.2 的 FilterAvailableReports 也沒有 size-change 條件（#1027 review 才補上），|κ′|/3 的 core 上限與 (w_s)_v = |κ′| 亦是 #1016/#1037 的範圍。","trap":"0.8.0 三個「跟著 |κ′| 走」的地方：active core 數 |κ′|/3、erasure shard 數 |κ′|、|κ| ≠ |κ′| 就清 ρ‡。"},{"id":"ch13-counter-deltas-calc","ch":"13","section":"13.1 Validator Activity","gpRef":"eq. 13.4–13.6 (π_V†, π_V‡, π′_V); eq. 11.28 (reporters set G)","difficulty":2,"kind":"concept","tags":["statistics","validator-stats","calc"],"stem":"A block in the middle of an epoch (e′ = e) has author index H_I = 3. Its extrinsic contains E_T with 2 tickets, E_P with one preimage of 500 octets, E_A with assurances signed by validators 1 and 2, and E_G with one guarantee whose credential carries the signatures of validators 0 and 4. Which per-validator changes does π′_V show relative to π_V (counters b, t, p, d, g, a)?","options":["Validator 3: b+1, t+2, p+1, d+500; validators 1 and 2: a+1 each; validators 0 and 4: g+1 each; all other records unchanged","Validator 3: b+1, t+2, p+1, d+500, g+1, a+2 — every extrinsic the author includes is credited to the author; no other validator changes","Validator 3: b+1, p+1, d+500; the two validators who generated the tickets: t+1 each; validators 1 and 2: a+1 each; validators 0 and 4: g+1 each","Validator 3: b+1, t+2, p+1, d+1; validators 1 and 2: a+1 each; validators 0 and 4: g+1 each"],"answer":0,"optNotes":["b/t/p/d 記給 H_I、a 記給 assurance 簽署者、g 記給 eq. 11.28 的 reporters，三種歸屬都對。","g 與 a 依簽章歸屬，author 只是把 extrinsic 打包進區塊，不會因此連 g、a 一起拿到。","ticket 是匿名的 ring-VRF 證明，鏈上不知道誰產生，eq. 13.6 因此把 |E_T| 記給 H_I。","d 是 preimage 的 octet 總數（500），p 才是筆數，兩者記在不同 counter 不可混。"],"explanation":"eq. 13.4：π_V†[v]_a = π_V[v]_a + (∃a ∈ E_A : a_v = v)——assurance 記在**簽署者**身上（存在性判斷，每人每塊最多 +1）。eq. 13.5：e′ = e（不在 epoch 邊界）所以 π_V‡ = π_V†、π_L 不變。eq. 13.6：b += (v = H_I)、t += |E_T|、p += |E_P|、d += Σ_{d∈E_P}|d| 都**只給 author**；g += (κ′[v] ∈ G)，G 是 eq. 11.28 的 reporters set——credential 裡有簽名的 validator 的 Ed25519 key。結果：v0: g+1；v1、v2: a+1；v3: b+1, t+2, p+1, d+500；v4: g+1。你們 statistics.go：UpdateTicketStatistics / UpdatePreimageStatistics / UpdatePreimageOctetStatistics 只更新 authorIndex；UpdateReportStatistics 用 reporters set；UpdateAvailabilityStatistics 用 assurance.ValidatorIndex。issue #710（0.7.0）修的就是「每個 validator 只算一次」，#869 修 guarantee 計數。","trap":"b/t/p/d 看 H_I；g/a 看簽章；每塊每人 g、a 最多各 +1（布林值，不是數量）。"},{"id":"ch13-why-statistics","ch":"13","section":"13.1 Validator Activity","gpRef":"§13.1 (intro paragraphs); §14.1 honest behavior; C(13) in App. D","difficulty":1,"kind":"ra
