高位（255 bits）以騰出 discriminator bit；值 ≤ 32 bytes 內嵌可省一次 hash。"},{"id":"appE-merkle-functions","ch":"E","section":"E.1 Binary Merkle Trees & E.2 MMR","gpRef":"eq. E.1–E.8","difficulty":2,"kind":"concept","tags":["merklization","mmr"],"stem":"Which description of the general Merklization functions is correct?","options":["N (node): splits the sequence at ⌈n/2⌉ and hashes left ⌢ right with no domain-separation prefix, the prefixes being reserved for leaves; M_B is the constant-depth root that pads to a power of two while M is the well-balanced root over the raw blobs — the two are named for their leaf treatment, not their shape; the MMR append A carries like binary addition and the super-peak folds the peaks with a '$node' prefix under Blake2b","N (node): splits the sequence at ⌊n/2⌋ so the right half is the larger one, and hashes '$node' ⌢ left ⌢ right; M_B is the well-balanced root taken over the RAW blobs; M (constant-depth) first hashes each leaf as '$leaf' ⌢ v and pads to a power of two by repeating the final leaf rather than with zero hashes; the MMR append A gives every leaf its own new peak without any carrying, and the super-peak folds the peaks with a '$peak' prefix","N (node): splits the sequence at ⌈n/2⌉ and hashes '$node' ⌢ left ⌢ right (well-balanced); M_B is the well-balanced root taken over the RAW blobs (it deliberately avoids hashing each item); M (constant-depth) first hashes each leaf as '$leaf' ⌢ v and pads to a power of two with zero hashes — used for segment roots and paged proofs; the MMR append A adds a peak with binary-addition-style carrying and the super-peak folds the peaks with a '$peak' prefix","N (node): splits the sequence at ⌈n/2⌉ and hashes '$node' ⌢ left ⌢ right (well-balanced); M_B hashes every item as '$leaf' ⌢ v before building the tree, which is what costs it one extra hash per item; M (constant-depth) takes the RAW blobs and pads to a power of two with zero hashes; the MMR append A carries like binary addition and the super-peak folds the peaks with a '$peak' prefix, but is defined only when the number of peaks is a power of two"],"answer":2,"explanation":"eq. E.1：N(v, H) = H_0 若空；v_0 若單一；否則 H($node ⌢ N(v[..⌈n/2⌉]) ⌢ N(v[⌈n/2⌉..]))——「well-balanced」使最大深度最小。前綴 $node/$leaf 防止 preimage collision。E.3：M_B(v, H) = H(v_0) 當 |v| = 1，否則 N(v, H)——直接把原始 blob 當 leaf、不加 $leaf 前綴（GP 明說它「avoids hashing each item in the sequence」）；用於 extrinsic hash 與 accumulation output belt 的每塊 root（Keccak）；E.4：M（constant depth）先 $leaf 雜湊、零填到 2 的冪——segment root 與 paged proofs（J_x/L_x, x = 6 即每 64 個 leaf 一頁）用它，因為固定深度讓 import 證明大小固定。E.8：MMR append A（peaks 序列，像二進位加法進位），super-peak 用 $peak 前綴從左到右摺疊。β_B 就是這種 MMR（Keccak）。三個干擾各錯在可查證的點：說 N 在 ⌊n/2⌋ 切、M 用重複最後一個 leaf 補滿、A 不進位而讓每個 leaf 自成新 peak 的那個，三處都與 eq. E.1／preprocessor C／eq. E.8 相反（GP 是 ⌈n/2⌉ 切、補 zero hash H_0、遇到已占用的 slot 就折疊進位到下一格）；說 N 不加前綴、把 M_B 與 M 的角色對調、且 super-peak 用 $node 前綴配 Blake2b 的那個，錯在 N 的定義本身就含 $node、M_B 才是 well-balanced 而 M 才是 constant-depth、super-peak 用的是 $peak 前綴且是 Keccak；說 M_B 會先對每個 item 做 $leaf 雜湊、M 反而吃原始 blob、且 super-peak 只在 peak 數為 2 的冪時才有定義的那個，錯在 GP 明講 M_B「avoids hashing each item in the sequence」、加 $leaf 的是 constancy preprocessor C，且 super-peak 對任意個非 ∅ peak 都遞迴定義。","trap":"M_B 取 root 的分割點是 ⌈n/2⌉（左邊較多）；M 是零填到 2^k。"},{"id":"appH-erasure-rate","ch":"H","section":"H Erasure Coding","gpRef":"eq. H.1","difficulty":2,"kind":"calc","tags":["erasure-coding","calc"],"stem":"The systematic Reed-Solomon code over GF(2^16) has rate d(v):v with d(v) = max({d | d ∈ N_{v/3+2}, W_G mod 2d = 0}). What is d for v = 1023 and for v = 6, and what does this achieve?","options":["d(1023) = 342 and d(6) = 3: any d of the v chunks reconstruct the data, so the system survives almost two-thirds of validators being malicious or offline; a 4,104-octet segment splits into 4104/(2·342) = 6 pieces per validator at full scale","d(1023) = 341 and d(6) = 2: any d of the v chunks reconstruct the data, so the system survives almost two-thirds of validators being malicious or offline; since 4,104 is not a multiple of 2·341 a segment must be zero-padded before it can be coded at full scale","d(1023) = 682 and d(6) = 4: at least v − d of the v chunks are needed to reconstruct, so the system survives only one-third of validators being malicious or offline; a 4,104-octet segment splits into 4104/(2·682) ≈ 3 pieces per validator at full scale","d(1023) = 512 and d(6) = 3: any d of the v chunks reconstruct the data, so the system survives half the validators being malicious or offline; a 4,104-octet segment splits into 4104/(2·512) ≈ 4 pieces per validator at full scale"],"answer":0,"explanation":"eq. H.1：d(v) = max{d ≤ v/3 + 1（N_{v/3+2} 即 0..v/3+1）: 4104 mod 2d = 0}。v = 1023：v/3 + 1 = 342，4104 = 2·342·6 ✓ → d = 342；v = 6：v/3 + 1 = 3，4104 mod 6 = 0 ✓ → d = 3。§H：「we wish to be able to reconstruct even should almost two-thirds of the v validators be malicious or incapacitated」，rate 最佳（d = v/3 + 1）的 v 集合包含 6, 9, 15, …, 1023；v = 1022 時效率最差（約 1:4.5）。full 下每個 segment 產生 6 個 octet-pair per validator（「data-parallelism of order 6」）。注意 0.7.x 的 tiny test vectors 用 W_P = 1026（2 個 data shards），0.8.0 的公式給 3——遷移時要重看 tiny EC 常數（你們 code-map 3.17 指出 DataShards/TotalShards 是編譯期常數）。三個干擾：說 d(1023) = 341、d(6) = 2、且因為 4104 不是 2·341 的倍數所以 segment 必須補零的那個，錯在 341 不是候選集合中的最大值（342 ≤ v/3 + 1 且 4104 mod 684 = 0，故 342 合格），而 §H 正是為了「encoding segments of size W_G without padding」才這樣定義 𝒟，段落末也明說「no padding is required」；說 d(1023) = 512、只能撐住一半 validator 作惡的那個，512 已超出 N_{v/3+2} 的上界 342，且 4104 mod 1024 ≠ 0，門檻也不是二分之一；說 d(1023) = 682、d(6) = 4、且要 v − d 個 chunk 才能還原的那個，682 同樣超界、d(6) = 4 > 3，而 eq. H.6 是任意 𝒟(v) 個 chunk 即可還原，門檻方向被說反了。","trap":"H.1 的集合是 N_{v/3+2} = {0, …, v/3+1}，所以最大候選就是 v/3 + 1。"},{"id":"appH-chunking","ch":"H","section":"H Erasure Coding","gpRef":"eq. H.5–H.6","difficulty":2,"kind":"concept","tags":["erasure-coding"],"stem":"How does the chunking function 𝒞^v_k turn a data blob into v chunks, and what makes the code 'systematic'?","options":["The blob (padded to a multiple of 2·d(v) octets) is split into k pieces of d(v) octet-pairs; each piece is erasure-coded into v octet-pairs; the results are transposed so that chunk i holds the i-th pair of every piece (k pairs per chunk); systematic means the first d(v) chunks are the original data, so if they are all present reconstruction is mere concatenation","The blob (padded to a multiple of 2·d(v) octets) is split into k pieces of d(v) octet-pairs; each piece is erasure-coded into v octet-pairs; the pieces are then hashed and it is those hashes, not the coded pairs, that are handed out as chunks; systematic means every chunk carries a Merkle proof of its own index, so one chunk can be checked without reconstructing anything","The blob (padded to a multiple of 2·d(v) octets) is split into k pieces of d(v) octet-pairs; each piece is erasure-coded into v octet-pairs over GF(2^8) in the standard polynomial basis; the results are transposed so that chunk i holds the i-th pair of every piece; systematic means the encoder is its own inverse, so coding a blob twice returns the blob","The blob (padded to a multiple of 2·v octets) is split into v pieces of one octet-pair each; each piece is erasure-coded into d(v) octet-pairs; the results are concatenated rather than transposed, so chunk i is a contiguous slice of the coded stream; systematic means the parity pairs sit after the data, so any v − d(v) chunks reconstruct"],"answer":0,"explanation":"eq. H.5：𝒞^v_k(d) = join(T[C_v(p) | p ∈ T(split_2(split_2k(d)))])——先切成 k 段、每段 d(v) 個 octet-pair、各自 RS 編碼成 v 個 pair、再轉置成 v 個 chunk（每個 k pairs）。eq. H.6：任意 d(v) 個 chunk（附索引）可還原；「If the original d items are known then reconstruction is just their concatenation」——systematic code 的優點：guarantor/assurer 手上的前 342 個 chunk 就是原始資料。兩個使用情境：Audit DA（work-package bundle，變長）與 Import DA（固定 4104-octet segments）。實作用 Cantor basis 的 GF(2^16)（lin2014novel）。三個干擾的錯處都可對照 GP：說填到 2·v 的倍數、切成 v 段、每段編碼成 d(v) 個 pair、直接串接而非轉置、且要 v − d(v) 個 chunk 才能還原的那個，方向整個顛倒——eq. H.5 是填到 2·𝒟(v) 的倍數、切成 k 段、每段 𝒟(v) 個 pair 編成 v 個 pair、再轉置，而 eq. H.6 說任意 𝒟(v) 個 chunk 就夠；說發出去的 chunk 是各段的雜湊、並把 systematic 定義成「每個 chunk 自帶 Merkle proof」的那個，錯在 chunk 就是轉置後的 coded octet-pair 本身（雜湊只發生在組 erasure-root 的 b^♣ 那一步），而 systematic 指的是原始資料原封不動出現在 codeword 前段；說在 GF(2^8) 標準多項式基底上編碼、且 systematic 意為「編碼器是自身的反函數」的那個，錯在 §H 明訂 GF(2^16)（不可約多項式 x^16 + x^5 + x^3 + x^2 + 1）並改用 Cantor basis，systematic 也與自反性無關。","trap":"shard/chunk 數 = |κ′|（每個 validator 一個）；erasure root 是對這些 chunk 的 Merkle root。"},{"id":"arch-corejam-name","ch":"ARCH","section":"1.1 Nomenclature / RFC-31","gpRef":"§1.1 & RFC-31 CoreJam","difficulty":1,"kind":"rationale","tags":["architecture","history"],"stem":"Where does the name 'JAM' come from, and which stages of the original CoreJam model actually execute on-chain?","options":["From 'Joint Availability Mechanism', after the erasure-coded D3L at its centre; RFC-31 already proposed this same complete protocol under the name CoreJam, and only Collect runs on-chain, since the chain must order incoming work-packages before the other three stages run in-core","From 'Just Another Machine', a nod to the Yellow Paper's naming; the collect / refine / join / accumulate pipeline was bolted on later by RFC-31, and all four stages run on-chain because a single validator set executes everything in consensus","From CoreJam (Polkadot Fellowship RFC-31), named after its Collect / Refine / Join / Accumulate model; only Join and Accumulate happen on-chain — Collect and Refine are off-chain/in-core — hence 'Join-Accumulate Machine', a complete protocol rather than RFC-31's scope-limited alteration","From CoreJam (Polkadot Fellowship RFC-31), named after its Collect / Refine / Join / Accumulate model; Refine and Accumulate are the on-chain pair — Collect and Join are done off-chain by the package builder — hence 'Join-Accumulate Machine'"],"answer":2,"explanation":"GP §1.1：「An early, unrefined, version of this protocol was first proposed in Polkadot Fellowship RFC 31, known as CoreJam. CoreJam takes its name after the collect/refine/join/accumulate model of computation at the heart of its service proposition. While the CoreJam RFC suggested an incomplete, scope-limited alteration to the Polkadot protocol, JAM refers to a complete and coherent overall blockchain protocol.」Collect（builder 收集輸入）與 Refine（in-core 計算）在鏈下；Join（guarantee/assure 上鏈）與 Accumulate（狀態整合）在鏈上。把 Refine 與 Accumulate 當成鏈上那一對的選項，剛好把分工顛倒：Refine 是 in-core 的高吞吐階段，Join 才是把 work-report 帶上鏈的那一步，否則縮寫也不會是 Join-Accumulate Machine。說名字來自「Just Another Machine」、四階段全在鏈上的選項，牴觸 §4.9.1 對 in-core consensus 的整段論證——「everybody does everything」式的 on-chain consensus model「is unfortunately not scalable」，JAM 引入 in-core 模型正是為了繞開它。說名字來自「Joint Availability Mechanism」、RFC-31 已是完整協定、且只有 Collect 上鏈的選項三點皆錯：§1.1 明寫 RFC-31「suggested an incomplete, scope-limited alteration to the Polkadot protocol」，而 Collect 是 package builder 在鏈下收集輸入，從來不在鏈上。","trap":"面試「architecture」開場常問這題；順便提 RFC-31 的三種 service 想像：parachain validation、actor progression（CorePlay）、simple ordering。"},{"id":"arch-driving-factors","ch":"ARCH","section":"1.2–1.3 Driving Factors / Size-Coherency Antagonism","gpRef":"§1.2–1.3","difficulty":2,"kind":"rationale","tags":["architecture","rationale"],"stem":"The GP names five driving factors and a principle called 'size-coherency antagonism'. Which statement is correct?","options":["Factors: Speed, Cost, Security, Decentralization, Simplicity; the antagonism is between decentralization and performance, because hardware requirements are barriers to entry to the validator set — JAM answers by fixing validator hardware at 16 cores / 64 GB / 8 TB and using SNARKs to compress the work, so coherency survives without any pipeline at all","Factors: Resilience, Generality, Performance, Coherency, Accessibility; performance and coherency are antagonistic because signature verification does not parallelize, so throughput must be bought with weaker composability — JAM answers by fragmenting state into 341 causally-independent shards, each small enough to stay coherent, bridged by an asynchronous message queue","Factors: Resilience, Generality, Performance, Coherency, Accessibility; the antagonism is between resilience and accessibility, since every additional validator adds a consensus round-trip and cheap access therefore forces a small set — JAM answers by pinning the validator set at 1,023 and pushing all further growth into off-chain roll-ups that settle asynchronously against the chain","Factors: Resilience, Generality, Performance, Coherency, Accessibility; performance and coherency are antagonistic because causality is bounded by signal speed, so larger state-spaces become less coherent — JAM answers by pipelining a highly scalable, mostly-coherent element (in-core) into a synchronous, fully-coherent element (on-chain), replacing crude partitioning with 'cache affinity'"],"answer":3,"explanation":"§1.2：(1) Resilience (2) Generality (3) Performance (4) Coherency (5) Accessibility；「items 3 and 4 are antagonistic according to an information theoretic principle… we shall name it size-coherency antagonism」。§1.3：state-space 越大越不 coherent（受光速/電子/軟體延遲限制）；現有可擴展系統（Polkadot、Cosmos、rollup）靠粗暴分割與非同步溝通；JAM「pipelines a highly scalable, mostly coherent element to a synchronous, fully coherent element」，以類似多核心 CPU 共享 RAM 的「cache affinity」取代分割。這就是「mostly-coherent trustless supercomputer」副標的由來。把對立的一組說成 resilience 與 accessibility 的那個選項錯在：§1.2 明說前兩項（resilience、generality）是 Web3 的隱含前提——「we make an implicit assumption of the first two items」——被點名對立的是第 3、4 項 performance 與 coherency；而且「把 validator 固定在 1,023、成長丟給非同步結算的鏈下 roll-up」正是 §1.3/§2 批評的持久性分裂路線，0.8.0 更已讓 validator 集合大小可變。把 antagonism 的成因說成「簽章驗證無法平行化」的那個選項，換掉了 GP 的資訊理論論證：state 越多→元件間平均距離與變異越大→因果解析時間發散，與簽章無關；它給的解法（341 個因果獨立分片 + 非同步訊息佇列）恰恰是 GP 拿細菌分裂比喻批評的 crude partitioning，JAM 要的是「avoiding the persistent fragmentation of state-space」。列出 Speed / Cost / Security / Decentralization / Simplicity 的那個選項連五項都不對，而且 16 核 / 64 GB / 8 TB 只是 §20 效能模型的假設硬體、不是協定要求；GP 也明確以成本為由否定 SNARK 路線（「Unlike with SNARK-based L2-blockchain techniques… this model draws upon crypto-economic mechanisms」）。","trap":"與 SNARK rollup 的對比：§2 指 RISC-Zero 類證明比直接執行慢 6 萬倍以上、且傾向中心化。"},{"id":"arch-why-safrole","ch":"ARCH","section":"6 Safrole rationale","gpRef":"§6 intro & §19","difficulty":2,"kind":"rationale","tags":["architecture","safrole","rationale"],"stem":"Why does JAM use Safrole (ticket-based, anonymous, ring-VRF) rather than a BABE-like VRF lottery?","options":["Safrole's advantage is that several validators may win the same slot so a slot is never empty: the ring VRF lets each of them prove membership of γ_P, the resulting fork is resolved by whichever block reaches Grandpa first, and tickets are drawn afresh each slot from η_0 so that no author is predictable more than one slot ahead","Safrole exists to take signatures off the hot path: the ticket is a plain hash preimage revealed at sealing, so checking a seal costs one hash rather than a VRF verification; anonymity comes from validators rotating their Ed25519 keys every epoch, and the entropy pool η is taken straight from the block hash since a hash is already uniform","Safrole limits each 6-second slot to exactly one predetermined key-holder (near fork-free), keeps the identity of future slot authors anonymous until they seal (DoS resistance), and produces a high-quality unbiasable entropy pool; the best-chain rule additionally prefers chains with more ticket-sealed (vs fallback) ancestors","Safrole is a finality gadget sitting under Grandpa: it assigns each slot one author, who must then gather 2/3+1 pre-votes before the block may extend the chain, which is why JAM has no forks at all and needs no fork-choice rule; fallback keys are used only in the genesis epoch, before any tickets have accumulated"],"answer":2,"explanation":"§6 intro：「The chief purpose of a block production consensus mechanism is to limit the rate at which new blocks may be authored and, ideally, preclude the possibility of forks… Safrole limits the possible author of any block within any given six-second timeslot to a single key-holder… under normal operation, the identity of the key-holder of any future timeslot will have a very high degree of anonymity. As a side effect… we can generate a high-quality pool of entropy」。BABE 的 VRF 抽籤會有多個或零個 slot leader（fork/空 slot），Safrole 用 ticket 在前一個 epoch 就決定每個 slot 恰好一個作者。§19：best chain 偏好「most ancestor blocks whose author used a slot-sealer ticket, rather than a fallback key」。Safrole 是 Sassafras 的簡化版（「To follow in the footsteps of Ethereum yellow paper」——簡單到能被多個獨立實作正確實現）。說「同一個 slot 可以有多個贏家、ticket 每個 slot 現抽」的那組正好把 Safrole 要修掉的 BABE 行為當成優點：γ_A 累積整個 epoch 的 ticket，在 epoch 交界一次性排序成 γ_S，每個 slot 只有一個 sealer；分叉也不是「先到 Grandpa 者勝」，而是 §19 的 best-chain 規則。說「Safrole 把簽章拿掉、ticket 只是 hash preimage、匿名性來自輪替 Ed25519 key、η 直接取自 block hash」的那組四點皆誤：seal H_s 是 Bandersnatch VRF 簽章、ticket 是 ring-VRF 證明（匿名性正來自「證明我屬於 γ_P 卻不揭露是誰」），而 η′_0 累積的是 H_v 的 VRF 輸出 Y(H_v)（其訊息又綁定 Y(H_s)），刻意不用 block hash——block hash 可被作者 grinding，就失去 unbiasable。說「Safrole 是 Grandpa 下面的 finality gadget、要收 2/3+1 pre-vote、完全無分叉、fallback 只在創世 epoch」的那組混淆了出塊與最終性：Safrole 只管 block production，finality 由 Grandpa 負責，GP 的用字是「ideally, preclude the possibility of forks」（近似無分叉，仍需 best-chain 規則）；fallback key sequence F(k, η_2) 是任何一次 epoch 交界只要 ticket 不足就會啟用，不限創世。","trap":"anonymity 來自 ring VRF：證明「我是 γ_P 中某人」而不揭露是誰；seal 時才用普通 VRF 揭露。"},{"id":"arch-availability-auditing","ch":"ARCH","section":"4.8.1, 11, 16, 17 rationale","gpRef":"§4.9.1, §16–17, ELVES paper","difficulty":2,"kind":"rationale","tags":["architecture","rationale","elves"],"stem":"Why does JAM need BOTH availability (assurances + erasure coding) AND auditing/disputes to secure in-core computation?","options":["Guaranteeing attaches economic cost to invalid results; but auditors can only re-execute if the inputs are retrievable, so 2/3+1 of validators must first assure they hold erasure-coded shards (any 1/3 reconstruct); then randomly-selected auditors (ELVES) re-run reports and escalate on negative judgments or no-shows; disputes finalize the verdict on-chain and ban the report/offenders","Auditing comes first: validators re-execute every report the moment it is guaranteed, and only reports that survive audit are then erasure-coded and distributed; a 1/3 assurance threshold suffices because one honest shard-holder can always raise the alarm; disputes exist only to redistribute the guarantors' deposits, so availability is a storage optimization layered onto an already-complete audit","They are two halves of one mechanism: the three guarantors of a core sign the report and then re-execute each other's work — that mutual check is what the GP calls auditing — while assurances only acknowledge receipt of the block; because guarantors are already staked no external auditor is drawn, and a negative judgment slashes the reporter directly with no on-chain verdict needed","Erasure coding already establishes validity: because every shard is Merklized under the work-report's erasure-root, a validator that reconstructs the bundle can check the result without re-running refine, so assurances alone settle correctness; auditing is an optional latency optimization for nodes wanting to accumulate early, and the disputes extrinsic merely records who assured late"],"answer":0,"explanation":"§4.9.1：「a crypto-economic game of three stages called guaranteeing, assuring, auditing and, potentially, judging. Respectively, these attach a substantial economic cost to the invalidity of some proposed computation; then a sufficient degree of confidence that the inputs of the computation will be available for some period of time; and finally, a sufficient degree of confidence that the validity of the computation… will be checked by some party who we can expect to be honest.」四階段合起來才讓 §4.9.2 的「code executed in-core has a comparable level of crypto-economic security to that executed on-chain」成立：沒有 availability，惡意 guarantor 可以「藏起」輸入讓人無法審計；沒有 auditing，guarantee 的經濟懲罰無從觸發。ELVES（eprint 2024/961）證明在 ≥ 2/3+1 誠實假設下此遊戲安全；審計每 A = 8 秒一個 tranche、no-show 時 bias factor F = 2 加派審計者。把順序倒過來、宣稱先審計再做 erasure coding 且 assurance 門檻只要 1/3 的那組錯在三處：GP 的順序是 guarantee → assure → audit →（必要時）judge，report 要先被「a clear 2/3 super-majority of validators」標記才進入 §17 的 just-became-available 集合被審計；1/3 是「重建所需的 chunk 比例」而不是 assurance 門檻；disputes 產生的是鏈上 verdict 與 ban-list（含 culprits／faults 的懲罰），不是重分配保證金。宣稱 erasure coding 本身就能證明結果正確、auditing 只是可選加速的那組，混淆了資料可得性與計算正確性：erasure-root 的 Merkle 證明只保證重建出的 bundle 就是被 commit 的「輸入」，refine 的輸出對不對必須重新執行才知道（§17 明講要 retrace the guarantors steps 並重算 work-report）；且 auditing 是強制的——「one prerequisite of a node finalizing a block is for it to view the block as audited」，§20 給的量是每 validator 每 timeslot 平均 10 次、每份 report 30 次審計。宣稱由該 core 的三個 guarantor 互審、assurance 只是收到區塊的回條的那組，破壞了整個賽局：被懷疑的正是 guarantor，自審沒有安全意義，GP 的 auditor 是用 Bandersnatch VRF（context $jam_audit）從整個 validator set 隨機抽出的；assurance 是承諾持有該 work-package bundle 的 erasure-coded chunk；而所有 verdict 一律進 disputes extrinsic 上鏈。","trap":"面試「design rationale」高頻題：把四階段講清楚，並說明 report 為何要先 available 才 accumulate。"},{"id":"arch-why-prior-root-and-pipelining","ch":"ARCH","section":"5 & 20 (pipelining)","gpRef":"§5, §20 Discussion","difficulty":2,"kind":"rationale","tags":["architecture","pipelining"],"stem":"JAM is designed so that most of a block's work can proceed while the block propagates. Which design features make that possible?","options":["Both refine and accumulate run off-chain: a core's guarantors execute the whole pipeline and publish only a state diff, leaving the on-chain step a Merkle patch; the header's state-root field is therefore left as the zero hash and corrected only once Grandpa finalizes the block, which is what bounds the pipeline to the 8-block recent-history window","Temporal parallelism (pipelining): the header carries the PRIOR state root, so a block can be published before the new state has been Merklized — that cost lands in the next slot; plus spatial parallelism, both across the largely independent components of σ (whose dependency graph §4.2.1 deliberately keeps shallow) and across cores in-core","Temporal parallelism comes from the header carrying the POSTERIOR state root, which lets a node accept a block without replaying it, so Merklization must finish before publication but is never repeated; spatial parallelism comes from giving each core its own fragment of σ, so two cores never touch the same state component and accumulation runs fully in parallel","Blocks are authored a slot early: the ticket-holder for slot n+1 is handed the state of slot n as soon as it exists, precomputes its block and merely signs it when the slot opens, so the posterior root is already known and can go in the header; the 341 cores then each replay the block, sharing the Merklization cost 341 ways"],"answer":1,"explanation":"§5：prior state root「to facilitate the pipelining of block computation and in particular of Merklization」。§4.2 的 dependency graph 刻意最小化深度，讓 β†、Safrole、disputes、assurances、guarantees 這些輕量步驟可平行，而 accumulation（最重）之後只剩 preimage 整合、α′、π′。§20 Discussion：三個 driver——spatial parallelism（341 cores + eq. 4.4 的 17 個大致獨立的 state 元件）、temporal parallelism（pipelining）、PVM 與硬體對齊（RISC-V → 高效 recompile）。參考硬體 16 核/64 GB/8 TB/0.5 Gbps；CPU 預算 10/16 給 auditing、2/16 block execution、1/16 Merklization。宣稱 header 帶 posterior state root、並讓每個 core 各自持有 σ 一塊分片的那組，兩點都反了：§5 明寫「This is a departure from both Polkadot and the Yellow Paper's Ethereum, in both of which a block's header contains the posterior state's Merkle root. We do this to facilitate the pipelining of block computation」；而 JAM 的賣點正是不做持久性狀態切割——accumulation 在鏈上、同步地作用於單一 σ，core 並不擁有狀態分片。宣稱 ticket holder 能提前一個 slot 把整個區塊預先算好、再由 341 個 core 各自重放區塊來分攤 Merklization 的那組：Safrole 只提前決定「誰」出塊，區塊內容取決於父區塊與當下的 extrinsic，無法預算；core 跑的是 work-package 的 refine 而非重放區塊；Merklization 是每個節點自己的成本（§20 編列 1/16 CPU），不會被 341 分攤。宣稱 refine 與 accumulate 都在鏈下、header 的 state root 先填 zero hash 再等 Grandpa 補的那組，混淆了兩個不同機制：§4.9.2 明訂 refine 在 core、accumulate 在鏈上且由同一組 validator 執行；先填 zero hash 再由下一個區塊修正的是 recent history β 的 state-root 欄位（因為 β′ 只用來定義下一塊的 β†），header 的 H_r 恆等於父區塊的 posterior root；H = 8 是 β 保留的區塊數，與 pipeline 長度無關。","trap":"Grandpa vote 帶 posterior state root（§19）讓下游仍能驗證最新狀態——彌補 header 只有 prior root。"},{"id":"arch-services-vs-accounts","ch":"ARCH","section":"4.8.2 services","gpRef":"§4.9.2, §9","difficulty":1,"kind":"rationale","tags":["architecture","services"],"stem":"How do JAM services differ from Ethereum's account model, and how does external data enter the state?","options":["JAM keeps Ethereum's split but renames it: service accounts hold code, balance and state, while 'authorizer accounts' hold a secret key and a nonce so they can sign work-packages; refine and accumulate are both on-chain entry points, and external data arrives as signed transactions the authorizer account pays for from its balance","JAM has only service accounts (code + balance + state, no secret key, no nonce), but a service exposes a single entry point that guarantors run in-core and the chain then re-runs on-chain to verify; external data enters as extrinsics in the block body, and coretime is charged per byte of that extrinsic much as Ethereum charges gas","JAM services are the direct successors of parachains: each is registered against a fixed core, ships a validation function guarantors execute, and talks to other services over an asynchronous XCM-like queue; data enters via collators' proofs-of-validity, and the accumulate entry point exists only to move balances between services","JAM has only service accounts (code + balance + state, no secret key, no nonce); each has two entry points — refine (in-core, stateless, arbitrary input → small digest) and accumulate (on-chain, stateful); all extrinsic data enters through refine inside work-packages, authorized via coretime/authorizers rather than signed transactions"],"answer":3,"explanation":"§4.9.2：「In JAM, all accounts are service accounts… Since they are not controlled by a secret key, they do not need a nonce.」「All data extrinsic to JAM is fed into the refinement code of some service… executed in-core… refinement code is executed off-chain and subject to no such constraints, enabling JAM services to scale dramatically both in the size of their inputs and in the complexity of their computation.」CoreChains（parachains）、CorePlay（actor/continuation smart contracts，靠 PVM 可暫停/續跑）、CoreVM 等都只是 service——JAM 本身沒有 parachain 概念，升級責任下放到 service（Wiki：「Non-upgradable chain; upgradability responsibility shifted to services」）。宣稱 JAM 另有一種持有私鑰與 nonce 的 authorizer account、外部資料靠簽章交易進來的選項，直接牴觸「In JAM, all accounts are service accounts… Since they are not controlled by a secret key, they do not need a nonce」與「there is no such concept of a *transactor*」；authorizer 是授權「程式碼」而非帳戶，付費靠事先購買並指派給 authorization agent 的 coretime。宣稱 service 只有單一 entry point、鏈上還要重跑一次驗證、coretime 按 extrinsic 位元組計費的選項：GP 明說 service definition「actually includes multiple code entry-points, one concerning refinement and the other concerning accumulation」；鏈上不會重跑 refine——那正是 guaranteeing / assuring / auditing 這個賽局要取代的工作；外部資料走的是 work-package 裡的 refine，不是區塊 body 的 extrinsic。宣稱 service 是 parachain 的接班人、綁定固定 core、以 XCM 式非同步佇列溝通的選項：coretime 指派給 authorizer，service 並不綁死在某個 core，CoreChains 只是眾多 service 之一；而 JAM 的賣點正是拿掉持久性分裂與非同步訊息——accumulate 同步作用在單一 σ 上，且它提供改狀態、轉帳、呼叫其他 service 的完整能力，不只搬餘額。","trap":"面試官若問「為什麼 JAM 不可升級」：協定固定、可多實作、把演進放在 service 層。"},{"id":"arch-constants","ch":"ARCH","section":"Appendix I constants","gpRef":"Appendix I & §20","difficulty":2,"kind":"concept","tags":["constants"],"stem":"Which set of full-configuration constants is correct?","options":["C = 341 cores (|κ| = 3C = 1023 in the full configuration; V itself is no longer a protocol constant), E = 600 slots/epoch, P = 6 s, Y = 500, R = 10, H = 8, L = 14,400, D = 19,200, U = 5, K = 16, O = 8, Q = 80, I = 16, J = 8, T = 128, W_G = 4,104, W_R = 48 KiB, W_B = 13,791,360, W_C = 4,000,000, G_A = 10^7, G_R = 5·10^9, G_T = 3.5·10^9, G_I = 5·10^7, A = 8 s, F = 2","C = 341 cores with |κ| = 3C = 1023 fixed for every configuration, E = 600 slots/epoch, P = 12 s, Y = 300, R = 10, H = 24, L = 600, D = 19,200, U = 5, K = 16, O = 8, Q = 80, I = 16, J = 8, T = 128, W_G = 4,104, W_R = 48 KiB, W_B = 13,791,360, W_C = 4,000,000, G_A = 10^7, G_R = 5·10^9, G_T = 3.5·10^9, G_I = 5·10^7, A = 6 s, F = 3","C = 341 cores (|κ| = 3C = 1023 in the full configuration), E = 600 slots/epoch, P = 6 s, Y = 500, R = 10, H = 8, L = 14,400, D = 14,400 (identical to L), U = 5, K = 3, O = 80, Q = 8, I = 8, J = 16, T = 16, W_G = 4,096, W_R = 12 MB, W_B = 48 KiB, W_C = 64,000, G_A = 5·10^9, G_R = 10^7, G_T = 3.5·10^9, G_I = 5·10^7, A = 8 s, F = 2","C = 1023 cores with V = 341 validators still fixed by the protocol, E = 3,600 slots/epoch, P = 6 s, Y = 600, R = 60, H = 8, L = 14,400, D = 19,200, U = 5, K = 16, O = 8, Q = 80, I = 16, J = 8, T = 128, W_G = 4,104, W_R = 48 KiB, W_B = 13,791,360, W_C = 4,000,000, G_A = 10^7, G_R = 5·10^9, G_T = 3.5·10^9, G_I = 5·10^7, A = 8 s, F = 2"],"answer":0,"explanation":"附錄 I 的常數表在 0.8.0 已**沒有 V**（validator 數改由 𝕍 ≡ {3c | c ∈ N_[2,C+1]} 決定、門檻一律取 |κ|）：C_corecount 341、epoch E 600、slot P 6 s、Y（epoch tail start）500、R（rotation）10、H（recent history）8、L（max lookup anchorage）14,400 = 24h、D（expunge）19,200 = L + 4,800、U（assurance timeout）5、K（max block tickets）16、O（auth pool）8、Q（auth queue）80、I（max package items）16、J（max report deps）8、N_V/N_O 16、S = 2^16、T（max package extrinsics）128、W_M/W_X（imports/exports）3,072、W_G segment 4,104、W_F 4,488、W_R 48·2^10、W_B 13,791,360、W_A 64,000、W_C 4,000,000、W_T memo 128、G_A 10^7、G_I 5·10^7、G_R 5·10^9、G_T 3.5·10^9、B_S/B_I/B_L = 100/10/1、A（tranche）8 s、F（audit bias）2、Z_P 2^12、Z_Z 2^16、Z_I 2^24、Z_A 2。full 配置下 |κ| = 1023 = 3·341（每個 active core 3 個 guarantor）。把 core 數與 validator 數對調（寫成 C = 1023、V = 341）並給 E = 3,600、Y = 600、R = 60 的那組：341 才是 core 數，且 0.8.0 已把 V 從常數表移除；E = 600 slot（正好一小時），Y 必須小於 E（Y = 500 才是 epoch tail 起點），rotation R = 10。把 P 寫成 12 s、Y = 300、H = 24、L = 600、A = 6 s、F = 3 的那組：GP 全文以「six-second timeslot」為前提所以 P = 6 s，recent history 只保留 H = 8 個 block，L = 14,400 slot 恰為 24 小時，audit tranche 每 A = 8 秒一輪、bias factor F = 2；它同時宣稱 |κ| 對所有配置固定為 1023，與 #514 的可變 validator set 直接衝突。最後一組把成對常數互換或寫錯：D = L + 4,800 = 19,200 而不等於 L；K = 16（3 是 tiny 的 max_tickets_per_extrinsic）；O = 8 與 Q = 80 被對調；I = 16 與 J = 8 被對調；T = 128；W_G = 4,104 而非 4,096（segment 含 padding）；W_R = 48 KiB 與 W_B = 13,791,360 被對調；W_C = 4,000,000（64,000 是 auth code 上限 W_A）；G_A = 10^7 與 G_R = 5·10^9 同樣被對調。","trap":"tiny（test vectors）：V 6、C 2、E 12、Y 10、R 4、D 32、K 3→(0.8.0 由公式)、N ⌈2E/V⌉。"},{"id":"arch-jam-vs-polkadot-eth","ch":"ARCH","section":"2 Previous Work","gpRef":"§2","difficulty":2,"kind":"rationale","tags":["architecture","rationale"],"stem":"According to the GP's 'Previous Work' analysis, what are the main limitations of Polkadot 1.0 and of Ethereum-style rollups that JAM tries to overcome?","options":["Polkadot: its weakness is that all parachains share one validator set, so security is capped by a single stake pool and XCMP must stay synchronous to be safe; rollups: proving costs are already within reach of crypto-economic verification and only sequencer uptime is unsolved — JAM therefore drops the ELVES audit game for SNARK-verified cores and gives each service its own validator subset","Polkadot: it cannot safely host more than ~50 parachains because the ELVES audit game is the bottleneck; rollups: proof generation is already cheap enough, but Dank-sharding's erasure coding over a binary field with Merklization is what centralizes them — JAM answers by adopting KZG polynomial-commitment availability and replacing auditing with optimistic fraud proofs","Polkadot: parachains are isolated ecosystems with asynchronous, coarse-grained XCMP and access limited to ~50 auction slots; rollups: heterogeneous security/economics, SNARK proving is orders of magnitude too costly (RISC-Zero ~61,000× slower than native) and sequencers centralize — JAM keeps Polkadot's ELVES machinery but makes cores un-opinionated, permissionless and semi-coherent","Polkadot: parachains are isolated and XCMP is asynchronous and coarse-grained; rollups: their fragmentation is benign because Ethereum's validator set gives every roll-up identical communication, security and economic properties, and the one real obstacle is proving the EVM — JAM answers by fixing parachain validation as the single function a core may run, with coretime still auctioned in long-term slots"],"answer":2,"explanation":"§2：Polkadot 「a collection of independent ecosystems with only limited opportunity for collaboration」，XCMP「asynchronous, coarse-grained and practically limited by its reliance on a high-level slowly evolving interaction language」，slot 數約 50；Ethereum rollup 市場「heterogeneous communication… security… and economic properties」；SNARK：RISC-Zero「over 61,000 times as long as simply recompiling and executing」、成本 66,000,000×，即使 50,000× 也「several orders of magnitude greater than would be required to compete on a cost-basis with established crypto-economic techniques」；Solana 式全同步：多次停機、512 GB RAM、依賴中心化資料庫。JAM：保留 ELVES（非冗餘分割 + 提案/審計遊戲），把 core 變成 un-opinionated 的通用計算資源。把「共用單一 validator set」當成 Polkadot 弱點、說 XCMP 必須同步、並主張 JAM 改用 SNARK 且讓每個 service 自帶 validator 子集的那一組，方向全反：GP 正是用 Polkadot 的單一 validator set 對比 Cosmos 分裂式的「no homogenous security」，XCMP 被明寫為 asynchronous，而 JAM 是 co-opt ELVES、維持單一 validator set。宣稱 rollup 的通訊/安全/經濟性質完全一致、且 JAM 把 core 固定成 parachain validation 並繼續長期拍賣 coretime 的那一組，與 §2「may differ, potentially quite dramatically」相反，也違反 core 不預設用途（CoreChains 只是一個 service）與消除拍賣門檻的 accessibility 目標。說 ~50 是安全上限、ELVES 是瓶頸、Dank-sharding 用 binary field 而 JAM 改採 KZG 與 fraud proof 的那一組把兩邊對調：Dank-sharding 用 large prime field 上的 polynomial commitment，binary field + Merklization 才是本文採用的方案（對 validator CPU 負擔低數個數量級）；~50 是 accessibility 限制而非安全上限，且 GP 評 ELVES 為三種跨網路安全方案中最安全、經濟效率最高者。","trap":"Kian 的說法：「What was once called an L2/parachain is now called a service」。"},{"id":"ch14-work-package","ch":"14","section":"14.2 Work Packages","gpRef":"eq. 14.2–14.3 (§14.3)","difficulty":2,"kind":"concept","tags":["work-packages"],"stem":"A work-package (eq. 14.2, of the set ℙ) is ⟨j, h, u, f, c, w⟩. Which description is correct?","options":["j authorization token (an opaque blob); h the index of the core the package is destined for; u authorizer code hash; f configuration blob (parameterization); c refinement context; w work-items (1..I = 16) each with service, code hash, payload, refine & accumulate gas limits, the imported segments' data inline, extrinsic (hash, length) pairs, and the exported segments' hashes","j authorization token; h the index of the service that will accumulate the results; u the refine code hash of the first work-item; f configuration blob; c the availability context: erasure-root plus the chunk indices; w work-items (1..T = 128) each with service, code hash, payload, one combined gas limit, imported segment hashes, and its exported segments inline","j the guarantors' signatures over the package; h the hash of the package itself; u the index of the service whose refine code runs; f the gas limit shared by every item; c the availability specification (erasure-root, segment-root, length); w work-items (1..I = 16) each with service, payload, extrinsic hashes and an authorization token of its own","j authorization token; h auth-service index (the service hosting the authorizer code); u authorizer code hash; f configuration blob (parameterization); c refinement context; w work-items (1..I = 16) each with service, code hash, payload, refine & accumulate gas limits, imports (segment root/hash + index), extrinsic (hash, length) pairs, and export count"],"answer":3,"explanation":"eq. 14.2：ℙ ≡ (j ∈ B token, h ∈ N_S auth service, u ∈ H auth code hash, **f** ∈ B config, **c** ∈ ℂ context, w ∈ [𝕀]_{1:I} items)；eq. 14.3：work-item = (s service, c code hash, y payload, g refine gas limit, a accumulate gas limit, i imports [(H ∪ hash⊞, N)], x extrinsics [(H, N)], e export count)。authorizer a = H(u ⌢ f)（0.8.0 #522）。限制（eq. 14.5–14.9）：總 extrinsics ≤ T = 128、imports/exports ≤ W_M/W_X = 3,072、bundle ≤ W_B = 13,791,360。§14 之後（15 guaranteeing、16 assurance、17 auditing）是 M2 範圍，但 M1 面試仍可能問 refine 的輸入輸出概念。把 j 說成 guarantor 簽章、h 說成 package hash、u 說成 service index、f 說成共用 gas limit、c 說成 availability specification 的那組，等於把 work-report 的欄位搬進 work-package：guarantor 簽章在 E_G（guarantees extrinsic）裡而非 ℙ 裡，avail spec（erasure-root/segment-root/length）是 work-report 的欄位，gas limit 則是每個 work-item 各有 g 與 a 兩個。把 h 說成「負責 accumulate 的 service」、u 說成第一個 item 的 refine code hash、c 說成 erasure-root 加 chunk index、item 上限寫成 T = 128 且只有一個合併 gas limit、export 直接內嵌的那組：h 是「hosts the authorization code」的 service，u 是 authorizer code hash，c 是 refinement context（anchor hash/state root/beefy root、lookup anchor hash 與 slot、prerequisites），item 數上限是 I = 16（T = 128 是整個 package 的 extrinsic 總數上限），且 export 只記數量 e——「we do not require any particular commitment to them in the work-package beyond knowing how many」。把 h 說成 core index、又把 imported segment 的資料與 exported segment 的 hash 直接放進 item 的那組：h 的型別是 N_S（service index），core 是 guarantor 決定並寫在 work-report 上；而 §14.2 的設計原則正是「Rather than having much data inline, they instead reference data through commitments」，import 用 (Merkle root, index) 承諾、export 只給數量。","trap":"auth code 是從 δ[h] 的 preimage 以 lookup-anchor 時間做 historical lookup 取得（eq. 14.4 附近）。"},{"id":"delta-summary-080","ch":"ARCH","section":"GP 0.7.2 → 0.8.0 changes","gpRef":"graypaper releases v0.8.0 (June 3 2026)","difficulty":2,"kind":"delta","tags":["delta-0.8.0"],"stem":"Your implementation targets GP 0.7.2 while the current GP is 0.8.0. Which list contains ONLY genuine 0.8.0 changes?","options":["fetch replacing the import host call; memory-access exceptions formalized and a feature freeze declared; assurances checked with the prior validator set; Ed25519 keys in the epoch marker alongside activity statistics; the provide host call, with imports separated from exports; 'super-fetch', gratis storage and account metadata; maximum code sizes with oversize reports handled; stricter opcode and jump validity","The 'Macrofication Marathon' moving every variable-length item to the end of its encoding; fixed-length validator-index serialization; W* made to depend on ρ†; accumulate absorbing on_transfer so a service has one on-chain entry point; the core index added to refine's arguments and removed from the guarantee payload; small service IDs; a version byte prefixing account serialization; 'Owned Privileges' for χ","Variable validator-set sizes (multiples of 3, 6…1023, thresholds derived from |κ|); full guarantees kept in ρ; hard caps of 16 verdicts/culprits/faults, with culprits no longer required behind a bad verdict; bless restricted to the manager service; authorizer = H(auth code hash ⌢ config); refinement context gains anchor slot + lookup-anchor posterior root; per-basic-block gas model with grow_heap replacing sbrk; tickets per validator = ⌈2E/|γ′_P|⌉","64-bit PVM registers and 64-bit addressing throughout; guarantor assignments carrying full validator keys; erasure-coding equation fixes; the info host call gaining registers 9 and 10; explicit per-invocation out-of-gas checks; the transfer gas-charge fix and the work-package size-limit fix; preimage-integration simplification; the posterior state root finalised; a metadata prefix for code blobs"],"answer":2,"explanation":"0.8.0（2026-06-03）的實際變更清單：#514 support smaller validator sets（𝕍 ≡ {3c}，門檻一律由 |κ| 導出）、#494 keep full guarantees in ρ、#525 dispute extrinsic 硬上限 16 且移除 culprits 必要性、#519 restrict bless to manager service、#522 update authorizer identification（authorizer = H(auth code hash ⌢ config)，對齊 ch. 8 與 ch. 14）、#526 expose lookup anchor posterior root and anchor slot、#508 新 gas cost model（per-basic-block，模擬 ROB/execution units）與 sbrk → grow_heap、#517 host function gas costs、#527 ticket 常數改為 ⌈2E/|γ′_P|⌉、#524 extrinsic hash、#502 processed transfer count、#497 illegal memory access 收費、#520/#521/#528。其餘三組列的全是更早的 release，因此都不符合「ONLY genuine 0.8.0」：Macrofication Marathon、變長欄位移到編碼末端、validator index 定長序列化、W* 依賴 ρ† 屬 0.7.0（2025-06-25），accumulate 併入 on_transfer、core index 進 refine 參數並移出 guarantee payload、small service IDs、account version byte、Owned Privileges 屬 0.7.1（2025-07-26）。fetch 取代 import、memory-access exceptions、feature freeze 屬 0.6.0；assurances 改用 prior validator set、Ed25519 keys in epoch marker、activity statistics 屬 0.6.4；provide 與 imports/exports 分離屬 0.6.5；max code sizes 與 oversize reports、posterior state root finalised 屬 0.6.6；super-fetch、gratis storage、account metadata、更嚴格的 opcode/jump validity 屬 0.6.7。64-bit registers 屬 0.5.0；guarantor assignments 帶完整 key 與 erasure-coding 公式修正屬 0.7.1；info host call 的 register 9/10、explicit OOG checks、transfer gas charge fix、WP size limits fix、preimage-integration simplification 屬 0.7.2；code blob 的 metadata prefix 屬 0.6.3。0.7.2 與 0.8.0 之間沒有任何 release，所以判準就是上面那份 PR 清單。你們 issue #1012（Update to v0.8.0）與其子 issue #1013–#1022 就是這張清單的實作追蹤。","trap":"面試官依「最新 GP」出題（T&C 3.5：conformance assessed against the latest release），所以 0.8.0 差異必須熟。"},{"id":"arch-tiny-config","ch":"ARCH","section":"Test vectors tiny configuration","gpRef":"w3f/jamtestvectors README & JIP-4","difficulty":1,"kind":"concept","tags":["tiny","test-vectors"],"stem":"Which values describe the 'tiny' test-vector configuration used by the W3F vectors and the conformance fuzzer?","options":["12 validators, 4 cores, epoch 60 slots, ticket submission ends at slot 50, rotation period 10, preimage expunge period 64, super-majority 9 of 12, verdict thresholds 9/0/4, ring size 12","1023 validators, 341 cores, epoch 600 slots, ticket submission ends at slot 500, rotation period 10, preimage expunge period 19,200, super-majority 683 of 1023, verdict thresholds 683/0/341, ring size 1023","6 validators, 2 cores, epoch 12 slots, ticket submission ends at slot 10, rotation period 4, preimage expunge period 32, super-majority 5 of 6, verdict thresholds 5/0/2, ring size 6","6 validators, 2 cores, epoch 12 slots, ticket submission ends at slot 12, rotation period 4, preimage expunge period 32, super-majority 4 of 6, verdict thresholds 4/0/2, ring size 6"],"answer":2,"explanation":"jamtestvectors README（tiny）：num_validators 6、num_cores 2、epoch_duration 12、contest_duration（Y）10、rotation_period 4、preimage_expunge_period 32、tickets_per_validator 3（0.7.x；0.8.0 由 ⌈2E/V⌉ = 4）、max_tickets_per_extrinsic 3、num_ec_pieces_per_segment 1026；其他常數同 GP。super-majority ⌊2·6/3⌋+1 = 5；wonky 門檻 ⌊6/3⌋ = 2；assurance bitfield 1 byte；Bandersnatch ring 大小 6（Zcash SRS）。JIP-4 chainspec 的 protocol_parameters 就是用 fetch(0) 的編碼傳遞這些參數；你們 chainspec.ApplyProtocolParameters 會驗證編譯期常數必須一致。把 ticket 提交截止寫成 slot 12、super-majority 寫成 4 of 6 的那組有兩個可驗算的錯：Y 必須小於 E，tiny 是 Y = 10、E = 12（只剩 slot 10、11 兩個 tail slot）；super-majority 是 ⌊2·6/3⌋ + 1 = 5，不是 4，連帶 verdict 的正向門檻也是 5。12 validators / 4 cores / epoch 60 那組雖仍滿足 |κ| = 3C，但不是任何一份 W3F 設定的值——tiny 就是 6 / 2 / 12，rotation 4、expunge 32、ring 6。1023 / 341 / 600 那組其實是 full 配置（對應 D = 19,200、super-majority 683、wonky 門檻 341），而 tiny 改動的遠不只 gas limit：validator 數、core 數、epoch 長度、rotation、expunge、ring 大小、assurance bitfield 寬度全都不同。","trap":"tiny 的 Y = 10 < E = 12，所以每個 epoch 只有 slot 10、11 兩個 tail slot。"},{"id":"b2-appA-branch-both-targets","ch":"A","section":"A.5 Single-Step State Transition (branch)","gpRef":"eq. A.21 (branch), A.5 (ϖ), A.2 (v_blob)","difficulty":3,"kind":"code","tags":["pvm","branches","basic-blocks","delta-0.8.0"],"stem":"Every conditional branch in the team's 0.7.2 interpreter (instBranch for 170–175 and the branch_*_imm handlers) resolves through this helper. Under GP 0.8.0 eq. A.21, which statement about the branch rule is correct?","code":{"lang":"go","caption":"PVM/branch.go (branch) + call site in PVM/instructions.go (instBranch)","src":"func branch(pc ProgramCounter, b ProgramCounter, C bool, bitmask Bitmask, instruction ProgramCode) (ExitReason, ProgramCounter) {\n\tswitch {\n\tcase !C:\n\t\treturn ExitContinue, pc\n\tcase !bitmask.IsStartOfBasicBlock(b) && instruction.isOpcodeValid(b):\n\t\treturn ExitPanic, pc\n\tdefault:\n\t\treturn ExitContinue, b\n\t}\n}\n\n// instBranch (opcodes 170-175), after computing branchCondition:\n\treason, newPC := branch(pc, vX, branchCondition, interp.Program.Bitmasks, interp.Program.InstructionData)\n\tif reason != ExitContinue {\n\t\tpvmLogger.Errorf(\"instBranch branch error at pc: %d, opcode: %s\", pc, zeta[opcode(interp.Program.InstructionData[pc])])\n\t\treturn ExitReason(reason), pc\n\t}\n\n\treturn reason, newPC"},"options":["The helper is already 0.8.0-compliant: eq. A.21 validates b only on the taken path, because the fall-through ı + 1 + skip(ı) has already been proved by v_blob to be a bitmask-flagged, valid opcode and so is trivially a legal continuation; the extra isOpcodeValid clause is a harmless strengthening","0.8.0 still validates only the taken target, but now additionally requires it to be 2-octet aligned like a dynamic jump (b mod Z_A = 0 with Z_A = 2) and to appear somewhere in the jump table j, neither of which this helper checks; the fall-through path remains unvalidated in 0.8.0 too","0.8.0 removed the runtime panic entirely: v_blob now walks every branch at deblob time and rejects the blob unless both of its targets lie in ϖ, so deblob returns error and Ψ panics before a single instruction runs; both the check on b and the isOpcodeValid clause are therefore dead code","0.8.0 panics whenever either target is not a basic-block start — the taken target b or the fall-through ı + 1 + skip(ı) — even when the condition is false; this helper validates only b, and only when C holds, so a not-taken branch with an invalid target continues here but must panic in 0.8.0"],"answer":3,"explanation":"eq. A.21：branch(b, C) ⟹ (ε, ı′) = (☇, ı) when b ∉ ϖ ∨ ı + 1 + skip(ı) ∉ ϖ；(▸, ı + 1 + skip(ı)) otherwhen ¬C；(▸, b) otherwise。GP 原文：「conditional jumps are valid if and only if both branches point to the start of a basic block (regardless of whether a branch is taken), otherwise a panic occurs」。你們的 branch() 先 `case !C: return ExitContinue, pc`——沒跳就完全不檢查，跳了才檢查 b（還加了 isOpcodeValid 條件，把跳到無效 opcode 的情況留給 trap 處理），這是 0.7.2「taken 才驗證」的語意；issues digest 的 #1046（PVM update 0.8.0）把「branch/jump dual-target validation」列為 App. A 的變更之一。實務上只要 blob 通過 v_blob，branch 的 fall-through 位置必然在 ϖ 裡（branch ∈ T，eq. A.5 的 ϖ 定義），唯一例外是 branch 是程式最後一條指令：ı + 1 + skip(ı) = |c| ∉ ϖ，0.8.0 不論條件真假都在 branch 本身 ☇（0.7.2 則是沒跳時掉出程式碼、執行 ζ 的 0 = trap 才 panic，且多扣一次 gas）。干擾項逐一：說「只驗 taken 目標、fall-through 因為 v_blob 驗過所以必然合法」的，兩層都不成立——eq. A.21 的第一個 case 不管 C 真假都要求兩個目標都在 ϖ；而且「是 bitmask 標記的合法 opcode」與「∈ ϖ」是兩回事：ϖ 只收「0 或某個 terminator 的下一條」，一條落在 block 中段的普通指令即使通過 v_inst 也不在 ϖ 裡，程式最後一條 branch 的 fall-through 更是 |c|，連 k 的範圍都不在。說「還要 2-octet 對齊、還要出現在 jump table 裡」的，把 djump 的條件搬錯地方：對齊（b mod Z_A = 0）與查表只出現在 eq. A.22，靜態 branch 的條件只有 b ∈ ϖ 與 fall-through ∈ ϖ。說「v_blob 在 deblob 時就驗跳躍目標、runtime 檢查是 dead code」的，違反 eq. A.2：v_blob/v_inst 只驗 |k| = |c|、沿 skip 走訪的每個落點是標記過的合法 opcode、走訪剛好停在 |k| 且最後一條 ∈ T，完全不看跳躍目標——所以 runtime 的 ϖ 檢查不能省。","trap":"0.8.0 口訣：branch 的兩個目標（taken 與 fall-through）都必須是 basic block 起點，不管有沒有跳。"},{"id":"b2-appA-jump-family","ch":"A","section":"A.5.1 Instruction Tables (jump, jump_ind, load_imm_jump, load_imm_jump_ind)","gpRef":"§A.5.1 opcodes 40/50/80/180 (eq. A.27, A.28, A.30, A.34 tables); eq. A.20 (sjump), A.22 (djump)","difficulty":2,"kind":"concept","tags":["pvm","jumps","decoding"],"stem":"The PVM has four unconditional control-transfer instructions: jump (40), jump_ind (50), load_imm_jump (80) and load_imm_jump_ind (180). Which description of their operands and target resolution is correct?","options":["All four carry an absolute code offset; the _ind forms differ only in reading that offset from a register instead of from an immediate, and all four are validated by the same sjump rule (target ∈ ϖ), so the jump table j is consulted only for the halt sentinel 2^32 − 2^16 and never for an ordinary jump","jump and load_imm_jump carry a signed PC-relative offset (target = ı + Z_l(…)) resolved statically by sjump; jump_ind and load_imm_jump_ind compute (φ_reg + ν) mod 2^32 and resolve it through the jump table via djump; the two load_imm_* forms additionally write φ′_A = ν_X, which is how a call saves its return address","jump and jump_ind form the static pair, whose targets v_blob already checks at deblob time so that no runtime ϖ test is needed; load_imm_jump and load_imm_jump_ind form the dynamic pair, going through the jump table j, writing φ′_A = ν_X and recognising the halt sentinel 2^32 − 2^16","jump_ind and load_imm_jump_ind index the jump table directly with the register value, j[φ_A], their immediate serving only as a gas hint; jump and load_imm_jump carry a signed PC-relative offset resolved by sjump, and the halt sentinel 2^32 − 2^16 is recognised by sjump rather than by djump"],"answer":1,"explanation":"四條都在 §A.3 的 terminator 集合 T 裡。jump（40，eq. A.27 One Offset）：ν_X ≡ ı + Z_{l_X}(E^{-1}_{l_X}(ζ_{ı+1…}))，是相對於 ı 的帶號 offset，執行 sjump(ν_X)（eq. A.20：b ∉ ϖ → ☇）。load_imm_jump（80，eq. A.30 One Register, One Immediate and One Offset）：sjump(ν_Y) 且 φ′_A = ν_X——ν_Y 是 offset、ν_X 是要載入的立即值。jump_ind（50，eq. A.28）：djump((φ_A + ν_X) mod 2^32)。load_imm_jump_ind（180，eq. A.34 Two Registers & Two Immediates）：djump((φ_B + ν_Y) mod 2^32) 且 φ′_A = ν_X。djump（eq. A.22）：a = 2^32 − 2^16 → ∎；a = 0 ∨ a > |j|·Z_A ∨ a mod Z_A ≠ 0 ∨ j[a/Z_A − 1] ∉ ϖ → ☇；否則 ı′ = j[a/Z_A − 1]。典型用法：call = load_imm_jump（ra ← 返回用的 jump-table 位址，同時跳到函式）；return = jump_ind ra + 0；標準初始化（eq. A.47）把 φ_0 設成 2^32 − 2^16，entry function 一 return 就 halt。你們的 instJump 走 branch(pc, vX, true, …)，instJumpInd / instLoadImmJumpInd 走 djump（branch.go 的 DjumpResolve）。干擾項逐一：說「四條都帶絕對 offset、都走 sjump、j 只用來認 halt sentinel」的，錯在 jump/load_imm_jump 的 ν 是相對於 ı 的帶號位移（eq. A.27/A.30 的 ν ≡ ı + Z_l(…)），而 _ind 兩條走的是 djump，j 是它們每次跳躍的必經之路，sentinel 反而是 djump 在查表之前就攔下的第一個 case；說「jump 與 jump_ind 是靜態對、v_blob 在 deblob 時就驗過所以 runtime 不必查 ϖ」的，配對方式與驗證時機都錯——分界在 _ind（動態）而不是 load_imm_（寫暫存器），而 eq. A.2 的 v_blob 只驗 |k| = |c|、沿 skip 走訪的 opcode 合法性與尾端 terminator，一個跳躍目標都不驗；說「_ind 用 j[φ_A] 直接索引、immediate 只是 gas hint、sentinel 由 sjump 認」的，錯在 eq. A.22 的索引是 (φ + ν) mod 2^32 得到 a 之後取 a/Z_A − 1，immediate 是真正參與加法的位移，而 sjump（eq. A.20）只有 b ∉ ϖ 一個條件，根本不認識 sentinel。","trap":"jump_ind 跳的是「jump table 位址」不是 code offset：a → j[a/2 − 1]；a = 0 保留為無效。"},{"id":"b2-appA-gas-charged-flag","ch":"A","section":"A.5 Single-Step State Transition (gas charged flag)","gpRef":"eq. A.8 (ε^ϱ, ϱ*, flag′), A.11 (flag*), A.6 (𝔏), A.39 (Ψ_H starts with ⊥); §B invoke/machine","difficulty":3,"kind":"concept","tags":["pvm","gas","host-calls","delta-0.8.0"],"stem":"GP 0.8.0 threads a boolean 'gas charged' flag through Ψ. A basic block has an ecalli in its middle; the host call returns ▸ and Ψ_H resumes at ı″ = ı′ + 1 + skip(ı′). Which statement about gas charging in this situation is correct?","options":["Nothing is charged again on that resume: ecalli is not a terminator, so flag* stays ⊤ and Ψ_1 skips the ϱ^Δ deduction; the flag becomes ⊥ only after a terminator executes (or on an out-of-gas exit), while a brand-new Ψ_H — which always starts with ⊥ — resuming at a mid-block ı charges the whole block ϱ^Δ(𝔏(ı)), not just the remaining suffix","The whole block ϱ^Δ(𝔏(ı″)) is charged a second time on every host-call resume, because 0.8.0 added ecalli to the terminator set T so that a host call always ends a basic block; the flag exists only so that the first block of a fresh Ψ_H is not charged twice over","The flag matters only for out-of-gas resumption: on every other exit it is discarded and Ψ_H unconditionally charges ϱ^Δ of the block containing ı″ before continuing; on an ∞ exit it is set to ⊤ so that gas already deducted is not deducted again once more gas is supplied, and it is a parameter of Ψ_H* alone, never of Ψ itself","Only the suffix of the block is re-charged: every non-▸ exit — a host call included — clears the flag to ⊥, and Ψ_1 then prices just the instructions from ı″ up to the block’s terminator, so a block interrupted by n host calls costs its ϱ^Δ plus n partial re-charges"],"answer":0,"explanation":"eq. A.8：(ε^ϱ, ϱ*, flag′) = (▸, ϱ, ⊤) when flag = ⊤；(▸, ϱ − ϱ^Δ(c, k, 𝔏(ı)), ⊤) otherwhen ϱ ≥ ϱ^Δ(c, k, 𝔏(ı))；(∞, ϱ, ⊥) otherwise。eq. A.11：flag* = ⊥ when flag′ = ⊥ ∨ (c_ı ∈ T ∧ ε* ∈ {▸} ∪ {h̄} × N_R)，否則 ⊤。T（§A.3）= trap、fallthrough、jump、jump_ind、load_imm_jump(_ind)、所有 branch_*；ecalli（10）不在 T 裡，所以 ecalli 造成 h̄ exit 時 flag* = ⊤，Ψ（eq. A.1）把這個 flag′ 回傳，Ψ_H*（eq. A.38）以同一個 flag′ 續跑 → 不重複收費。flag 何時變 ⊥：執行了 terminator 且 ε* = ▸（下一步進新 block、或「jumps back to the beginning of the current basic block」都重新收費），以及 OOG（此時 ϱ 不變、ı* = ı）。𝔏（eq. A.6）= max(j ∈ ϖ : j ≤ ı) 是「含 ı 的 block 起點」，所以 flag = ⊥ 而 ı 在 block 中間時，扣的是整個 block 的 ϱ^Δ；Ψ_H ≡ Ψ_H*(…, ⊥, …)（eq. A.39）——每次新的 Ψ_H 都從 ⊥ 開始。App. B 也配合：machine 建立內層 PVM 時 flag 初始為 ⊥，invoke 把 Ψ 回傳的 flag′ 存回 m*[n]，內層 host call 後再 invoke 不會重扣；內層 OOG 後補 gas 再 invoke 才會重扣。這正是 #1046 review 的修正：「mid-block resume must charge the full containing block cost L(i) first — not just the suffix」。干擾項逐一：說「只重扣 block 的 suffix」的，GP 裡根本沒有這種算式——ϱ^Δ 的引數是 𝔏(ı)（eq. A.6 的 block 起點），扣的永遠是整個 block；而且「每個非 ▸ 的 exit 都把 flag 清成 ⊥」也錯：eq. A.11 只有「c_ı ∈ T 且 ε* ∈ {▸} ∪ {h̄} × N_R」與 flag′ = ⊥（即 OOG）兩種情況才清。說「0.8.0 把 ecalli 加進 T、所以每次 host call 續跑都重扣整個 block」的，錯在 §A.3 的 T 只有 trap、fallthrough、jump、jump_ind、load_imm_jump(_ind) 與所有 branch_*，ecalli（opcode 10）不在其中；若它真是 terminator，任何含 host call 的迴圈 gas 都會爆掉。說「flag 只影響 OOG、其餘 exit 一律丟掉，且 OOG 時 flag 設成 ⊤ 以免重扣」的，把 eq. A.8 讀反了：OOG 那一支是 (∞, ϱ, ⊥)——flag 設成 ⊥ 而且 gas 一分未扣，正因為沒扣，補了 gas 再跑本來就該重新扣一次整個 block；flag 也不是「只影響 OOG」、更不是只屬於 Ψ_H* 的參數——eq. A.1 的 Ψ 本身就收下 flag 並在每個 exit 回傳 flag′。你們 0.7.2 沒有這個 flag（每指令 1 gas，SingleStepInvokeDecodedBlocks 逐條扣）。","trap":"flag 只被「執行完的 terminator」與「OOG」清成 ⊥；ecalli 不是 terminator，host call 續跑不重扣。"},{"id":"b2-appA-recompiler-block-gas-stub","ch":"A","section":"A.5 Single-Step State Transition (gas charging) — x86-64 recompiler","gpRef":"eq. A.8 (ε^ϱ, ϱ* unchanged on ∞), A.10 (ı* = ı), A.54 (ϱ^Δ)","difficulty":3,"kind":"code","tags":["pvm","gas","recompiler","delta-0.8.0"],"stem":"The recompiler contains a prepared-but-disabled block-level gas path for GP 0.8.0 (shown together with the current 0.7.2 per-instruction landing pad). Measured against eq. A.8, what is still wrong with the prepared path?","code":{"lang":"go","caption":"PVM/recompiler/gas.go (emitOutOfGasExit, emitBlockGasCheck, emitBlockOutOfGasExit)","src":"// emitOutOfGasExit emits the temporary GP v0.7.2 per-instruction OOG landing pad.\nfunc emitOutOfGasExit(a *asm.Assembler, oog asm.Label, instrPC PVM.ProgramCounter) {\n\t_ = a.BindLabel(oog)\n\t// Undo the fused charge: on OOG the interpreter leaves gas unchanged.\n\ta.SubMemImm32(RegGuestBase, -int32(OffsetGas), -1)\n\ta.MovMemImm32_32(RegGuestBase, -int32(OffsetExitPC), int32(instrPC))\n\ta.MovImm64ToReg(RegScratch, uint64(PVM.ExitOOG))\n\ta.MovRegToMem(RegGuestBase, -int32(OffsetExitReason), RegScratch)\n\ta.Jmp(a.ExitTrampoline())\n}\n\n// emitBlockGasCheck is the prepared block-based gas charging path for GP v0.8.0.\nfunc (c *Compiler) emitBlockGasCheck(a *asm.Assembler, blockOOG asm.Label, instrCount int64) {\n\ta.SubMemImm32(RegGuestBase, -int32(OffsetGas), int32(instrCount))\n\ta.Jcc(asm.CondS, blockOOG)\n}\n\n// emitBlockOutOfGasExit is the prepared block-entry OOG landing pad for GP v0.8.0.\nfunc emitBlockOutOfGasExit(a *asm.Assembler, blockOOG asm.Label, blockStartPC PVM.ProgramCounter) {\n\t_ = a.BindLabel(blockOOG)\n\ta.MovMemImm32_32(RegGuestBase, -int32(OffsetExitPC), int32(blockStartPC))\n\ta.MovImm64ToReg(RegScratch, uint64(PVM.ExitOOG))\n\ta.MovRegToMem(RegGuestBase, -int32(OffsetExitReason), RegScratch)\n\ta.Jmp(a.ExitTrampoline())\n}"},"options":["The direction: 0.8.0 charges a block only once its terminator has executed, so the SubMemImm32 belongs after the terminator with the sign check reversed; charging at block entry would bill a block that panics half-way through, which eq. A.8 avoids precisely by deferring the deduction","Nothing: in 0.8.0 each instruction still costs 1 gas and is merely aggregated per block, so subtracting the instruction count at block entry is exactly ϱ^Δ; and leaving the counter negative on the out-of-gas path is intended, because Ψ_M's R function reports consumption as u = ϱ − max(ϱ′, 0) and clamps it anyway","Two things: the amount deducted must be the block's ϱ^Δ from the A.9 pipeline simulation (max(cycles − 3, 1)), not its instruction count; and on the out-of-gas path the deduction must be undone, because A.8 leaves ϱ unchanged when ϱ < ϱ^Δ — the per-instruction pad restores its charge, the block pad does not","Only the exit PC: on a block-entry out-of-gas exit eq. A.10 requires ı* to point at the block's terminating instruction — the last one the charge would have paid for — rather than at the block start; the amount deducted and the untouched-gas rule are both already handled correctly by this code"],"answer":2,"explanation":"eq. A.8：ϱ ≥ ϱ^Δ(c, k, 𝔏(ı)) 才扣（ϱ* = ϱ − ϱ^Δ），否則 (∞, ϱ, ⊥)——「the execution is interrupted and the gas counter remains unchanged」。emitBlockGasCheck 用「先 sub 再看 SF」的技巧，判斷方向沒錯（post-charge < 0 ⟺ pre-charge < 金額），但 (1) 金額是 instrCount——那是 0.7.2 的 GasCost = InstrCount（block_info.go），0.8.0 要用 eq. A.54 的 ϱ^Δ = max(cycles − 3, 1)，由 A.9 的 ROB 模擬與 A.10 表算出（#1046 之後 interpreter 與 recompiler 共用 GasCostForBlock）；(2) 走到 emitBlockOutOfGasExit 時記憶體裡的 gas 已經是「負的」，沒有像 emitOutOfGasExit 那樣 `SubMemImm32(…, -1)` 把錢加回去，違反 ϱ* = ϱ；後果可觀察：R（eq. A.48）算 u = ϱ − max(ϱ′, 0) 會變成「全部 gas 用光」，invoke host call 也會把負的 g′_R 寫回記憶體。至於 ExitPC = blockStartPC：eq. A.10 在 ε^ϱ ≠ ▸ 時 ı* = ı，也就是「嘗試收費的那條指令」，正常進入 block 時就是 block 起點，這部分沒錯（唯一例外是 flag = ⊥ 且從 block 中間恢復，此時 ı* 是恢復點，扣的仍是整個 block）。干擾項逐一：說「每指令 1 gas 加總就等於 ϱ^Δ、負值交給 R 去 clamp」的，前半是 0.7.2 的 GasCost = InstrCount，0.8.0 的 ϱ^Δ 來自 §A.9 的管線模擬（eq. A.54 的 max(cycles − 3, 1)，與指令數沒有固定比例）；後半也救不了：u = ϱ − max(ϱ′, 0)（eq. A.48）只修正「回報的總消耗」，記憶體裡那個負的 gas counter 仍會被 invoke 原封不動寫回外層 RAM，違反 A.8 的 ϱ* = ϱ。說「只有 exit PC 錯、ı* 該指向 terminator」的，讀反了 eq. A.10：ε^ϱ ≠ ▸ 時 (ε*, ı*, φ*, μ*) = (ε^ϱ, ı, φ, μ)，ı* 就是「嘗試收費時所在的那條指令」，正常進入 block 時即 block 起點，而且它宣稱「金額與不扣款規則都已正確」正是這段程式碼真正的兩個缺陷。「terminator 之後才扣」同樣不是 0.8.0 的語意：GP 明說 「No instruction is allowed to execute within a basic block unless the gas cost for the entire basic block has been charged in advance」——事後收費等於讓 panic 的 block 免費，正是預扣要防的事。","trap":"OOG 時 ϱ 不變（A.8）——「先扣再判斷」的 JIT 寫法一定要在 landing pad 把錢加回去，而且扣的是 ϱ^Δ 不是指令數。"},{"id":"b2-appA-load-imm-jump-ind-reg-write","ch":"A","section":"A.5.1 Instruction Tables (load_imm_jump_ind) & A.1 (Ψ on panic)","gpRef":"eq. A.34 table (opcode 180), A.22 (djump), A.1 (Ψ returns φ′ on ☇/∎), A.10; §B invoke","difficulty":3,"kind":"code","tags":["pvm","jumps","edge-case","test-vectors"],"stem":"In this implementation of load_imm_jump_ind the register write φ_A = ν_X happens even when the dynamic jump panics. Is that what GP 0.8.0 prescribes, and can the difference ever be observed?","code":{"lang":"go","caption":"PVM/instructions.go (instLoadImmJumpInd, opcode 180)","src":"// opcode 180\nfunc instLoadImmJumpInd(interp *Interpreter, pc ProgramCounter, skipLength ProgramCounter) (ExitReason, ProgramCounter) {\n\trA, rB, vX, vY, err := decodeTwoRegistersAndTwoImmediates(interp.Program.InstructionData, pc, skipLength)\n\tif err != nil {\n\t\tpvmLogger.Errorf(\"instLoadImmJumpInd decodeTwoRegistersAndTwoImmediates error: %v\", err)\n\t\treturn ExitPanic, pc\n\t}\n\t// per https://github.com/koute/jamtestvectors/blob/master_pvm_initial/pvm/TESTCASES.md#inst_load_imm_and_jump_indirect_invalid_djump_to_zero_different_regs_without_offset_nok\n\t// the register update should take place even if the jump panics\n\tdest := uint32(interp.Registers[rB] + vY)\n\treason, newPC := djump(pc, dest, interp.Program.JumpTable, interp.Program.Bitmasks)\n\n\tinterp.Registers[rA] = vX\n\tswitch reason {\n\tcase ExitPanic:\n\t\treturn reason, pc\n\tcase ExitHalt:\n\t\treturn reason, pc\n\tdefault:\n\t\treturn reason, newPC\n\t}\n}"},"options":["No: §A.1's 'the machine state represents the prior state of said instruction' covers ☇ just as it covers ∞, F̄ and h̄, so φ_A must stay untouched when the djump panics; the write is a latent bug that goes unnoticed only because Ψ_M's R function maps ☇ to the panic result and throws the register file away","No: eq. A.10 rolls back every mutation of a panicking instruction — ε* = ☇ forces (ı*, φ*, μ*) = (ı, φ, μ) exactly as it does for a page fault — so φ_A keeps its old value; the koute PVM test vectors bear this out, expecting φ_A unchanged in every *_nok djump case — the jump-to-zero, the over-length and the misaligned variants alike","Yes, but only for the halt sentinel a = 2^32 − 2^16, where φ_A = ν_X is part of what the caller reads back; eq. A.22 evaluates djump before the register write, so on the panic branch the write is skipped, and no caller could observe it anyway because a panicking inner machine leaves the outer memory untouched","Yes: the table row defines djump((φ_B + ν_Y) mod 2^32) and φ′_A = ν_X as independent mutations, and on ☇ Ψ returns the posterior registers φ′ with only ı reset to 0; it is observable because the invoke host call writes the inner machine's registers back to memory even when the inner exit is PANIC, and at top level via φ_7/φ_8 when the sentinel halts"],"answer":3,"explanation":"eq. A.34 表列 load_imm_jump_ind：djump((φ_B + ν_Y) mod 2^32)，φ′_A = ν_X——兩個 mutation 並列、互不條件化；eq. A.22 的 djump 只決定 (ε, ı′)。eq. A.10：ε^ϱ、ε^μ 都是 ▸ 時 (ε*, ı*, φ*, μ*) = (ε, ı′, φ′, μ′)，所以 ε = ☇ 時 φ* 仍含這次寫入；eq. A.1 的 Ψ 在 ε ∈ {☇, ∎} 回傳 (ε, 0, ϱ′, flag′, φ′, μ′)——posterior 的暫存器、只有 ı 歸零。§A.1 那句「the machine state represents the prior state of said instruction」講的是「In all other cases」，即 ∞ / F̄ / h̄ 這三種可續跑的 exit（Ψ 回傳 (ε, ı, ϱ′, flag′, φ, μ)），不是 halt/panic。可觀察性：App. B 的 invoke 在 c = ☇ 時仍回 (▸, PANIC, φ_8, μ*, m*)，而 μ* 把 E_8(g′_R) ⌢ E_8(φ′) 寫回外層記憶體，外層程式讀得到內層 panic 後的暫存器；頂層 Ψ_M（eq. A.48 的 R）雖對 ☇ 回 panic，但 sentinel halt 時回傳 μ′[φ′_7 …+φ′_8]，若 A ∈ {7, 8} 也直接可見。你們程式碼註解引用的 koute 測試向量 inst_load_imm_and_jump_indirect_invalid_djump_to_zero_different_regs_without_offset_nok 正是要求 panic 後暫存器已更新。load_imm_jump（80）同理：sjump(ν_Y) 與 φ′_A = ν_X 並列。干擾項逐一：說「§A.1 的 prior state 也涵蓋 ☇」的，錯在那句話的主詞是「In all other cases」，而前一句已把 halt/panic 挑出來單獨處理（「In the case of a final halt, either through panic or success, the instruction counter returned is zero」）——☇/∎ 回的是 posterior 狀態、只有 ı 歸零；說「只有 sentinel halt 那條路徑才寫暫存器、eq. A.22 先跑 djump 所以 panic 分支跳過寫入」的，錯在 eq. A.34 的表格把兩個 mutation 並列，沒有任何條件化，eq. A.22 只產出 (ε, ı′)、管不到 φ′，而且「panic 的內層機器不影響外層記憶體」也不對——invoke 在 c = ☇ 時照樣把 E_8(g′_R) ⌢ E_8(φ′) 寫回外層 RAM；說「eq. A.10 會把 panic 指令的 mutation 全部回捲」的，把 A.10 的分支讀混了：回捲只發生在 ε^ϱ ≠ ▸（gas 不足）與 ε^μ ≠ ▸（記憶體不可存取）兩支，指令層級的 ☇ 走的是 otherwise 支 (ε, ı′, φ′, μ′)，而且它引用的那個測試向量恰恰要求暫存器已更新。","trap":"☇ 與 ∎ 回傳 posterior 狀態（只有 ı 歸零）；∞ / F̄ / h̄ 才回傳 prior 狀態以便續跑。"},{"id":"b2-appA-store-cross-page-fault-address","ch":"A","section":"A.5 Single-Step State Transition (memory faults)","gpRef":"eq. A.9 (ε^μ), A.10 (state unchanged on F̄); §A.5.1 store_u64 row","difficulty":3,"kind":"code","tags":["pvm","memory","page-fault","conformance"],"stem":"A store_u64 (8 bytes) targets address 0x2_0FFC: page 0x20 (0x20000–0x20FFF) is writable, page 0x21 is unallocated. What exit does GP 0.8.0 eq. A.9 require, and how does this implementation differ?","code":{"lang":"go","caption":"PVM/decode.go (storeIntoMemory), used by every store_* / store_ind_* / store_imm_* handler","src":"func storeIntoMemory(interp *Interpreter, offset int, memIndex uint32, immediate uint64) ExitReason {\n\tmem := interp.Memory\n\tif memIndex < uint32(1<<16) { // 0.7.2  A.8 check memory > 2^16\n\t\treturn ExitPanic\n\t}\n\n\tpageNum := memIndex / ZP\n\tpageIndex := memIndex % ZP\n\n\tpage, ok := mem.Pages[pageNum]\n\tif !ok {\n\t\treturn ExitPageFault | ExitReason(memIndex)\n\t}\n\tif page.Access != MemoryReadWrite {\n\t\treturn ExitPageFault | ExitReason(memIndex)\n\t}\n\t...\n\t// Fast path: entirely within current page.\n\tif pageIndex+uint32(offset) <= ZP {\n\t\tcopy(page.Value[pageIndex:], src)\n\t\treturn ExitContinue\n\t}\n\n\t// Cross-page slow path.\n\tnextPage, ok := mem.Pages[pageNum+1]\n\tif !ok {\n\t\treturn ExitPageFault | ExitReason(memIndex)\n\t}\n\tif nextPage.Access != MemoryReadWrite {\n\t\treturn ExitPageFault | ExitReason(memIndex)\n\t}\n\n\tfirstLen := ZP - pageIndex\n\tcopy(page.Value[pageIndex:], src[:firstLen])\n\tcopy(nextPage.Value, src[firstLen:])\n\treturn ExitContinue\n}"},"options":["GP: ☇ (panic) — a multi-octet access may not straddle a page boundary, and the GP treats such a straddling access exactly like an access below 2^16; the code is wrong to report a page fault at all, and would be equally wrong to commit the four octets that do fit inside page 0x20","GP: F̄ × 0x2_0FFC — eq. A.9 reports min(x) itself, and x is seeded with the address the instruction was handed rather than with only the inaccessible indices; the implementation is therefore exactly compliant here and in the single-page case, where the reported value is likewise the first octet touched","GP: F̄ × 0x2_1000 — the lowest inaccessible page address among the written indices (x = {0x21000…0x21003}, min(x) rounded down to a multiple of Z_P); the code correctly leaves memory untouched but reports memIndex = 0x2_0FFC, an address that lies in an accessible page and is not page-aligned","GP: the four octets that fit are committed to page 0x20 and only then is F̄ × 0x2_1000 raised for the remainder, because eq. A.9 is evaluated octet by octet as the store proceeds; the code is wrong to leave memory completely unchanged and wrong to test both pages before copying anything"],"answer":2,"explanation":"eq. A.9：x = {x ∈ w : x mod 2^32 ∉ V*_μ}（w 是這條指令要寫的所有索引；V*_μ = {i : μ_a[⌊i/Z_P⌋] = W} 是可寫索引集），ε^μ = ☇ when min(x) mod 2^32 < 2^16；F̄ × Z_P⌊min(x) mod 2^32 ÷ Z_P⌋ otherwise。這裡 w = {0x20FFC, …, 0x21003}，只有落在 page 0x21 的四個位址不可寫，x = {0x21000, …, 0x21003}，min(x) = 0x21000，對齊 Z_P = 4096 後仍是 0x21000。§A.5 原文：「the exit reason is a fault with the lowest page address to be written which is inaccessible」。eq. A.10：ε^μ ≠ ▸ 時 (ε*, ı*, φ*, μ*) = (ε^μ, ı, φ, μ)——狀態完全不變，所以「先寫前四個 byte」是錯的；跨頁存取本身合法，不是 panic（只有 min(x) < 2^16 才 ☇）。你們的實作先檢查兩頁再 copy，記憶體不變這點正確，但每個 fault 分支都回 `ExitPageFault | ExitReason(memIndex)`，回報的是存取起始位址 0x20FFC：它在可寫的 page 裡、也不是 page 對齊；即使不跨頁（例如 fault 在 0x21004）也應回 0x21000 而非 0x21004。recompiler 的 SIGSEGV handler 同樣塞入原始 guest_addr。可觀察性：invoke host call 把 F̄ 的位址放進 φ_8（FAULT），koute 的 PVM 測試向量也帶 expected-page-fault-address 欄位；正確做法是回報前先 `addr &^ (ZP-1)`，並在跨頁時選第一個不可存取的 page。（loadFromMemory 同樣回原始 vx。）干擾項逐一：說「eq. A.9 回的就是 min(x)、而 x 以指令拿到的位址為起點」的，把 x 的定義讀漏了——x = {x ∈ r : x mod 2^32 ∉ V_μ ∨ x ∈ w : x mod 2^32 ∉ V*_μ}，裡面只有「不可存取」的索引，可寫的 0x20FFC 根本不在 x 裡，而且外面還套了 Z_P⌊· ÷ Z_P⌋ 對齊；說「跨頁存取本身就該 ☇、比照低於 2^16」的，錯在 eq. A.9 只有 min(x) mod 2^32 < 2^16 這一個 ☇ 條件，跨頁與未對齊都合法，只是落在不可存取頁的那些索引會 F̄；說「先寫入放得下的四個 octet 再 fault」的，違反 eq. A.10：ε^μ ≠ ▸ 時 (ε*, ı*, φ*, μ*) = (ε^μ, ı, φ, μ)，GP 也明說 machine state remains unchanged——r 與 w 是「為了算出 Ψ_1 的結果而需要下標的全部索引」，要先整組檢查才可能有任何 mutation，所以「先檢查兩頁再 copy」正是對的。","trap":"回報的是「最低不可存取的 page 位址」（Z_P 對齊、且必須真的不可存取），不是存取的起始位址。"},{"id":"b2-appA-sigsegv-handler","ch":"A","section":"A.5 (memory faults & division semantics) — recompiler design","gpRef":"eq. A.9 (ε^μ: < 2^16 → ☇, else F̄), §A.5.1 div/rem rows (b = 0, MIN/−1)","difficulty":3,"kind":"code","tags":["pvm","recompiler","memory","rationale"],"stem":"The x86-64 recompiler maps guest memory as one 4 GiB region based at R15 with real mprotect permissions and emits no software bounds check above 2^16; this signal handler turns hardware events inside JIT code into PVM exits. Which statement is correct?","code":{"lang":"c","caption":"PVM/recompiler/x86signal/x86_signal_linux.c (signal_handler)","src":"    if (sig == SIGFPE) {\n        uintptr_t rip = (uintptr_t)gregs[REG_RIP];\n        if (!is_jit_code(rip) || base == NULL) {\n            chain_to_old(sig, info, uctx_void);\n            return;\n        }\n        jit_exit_panic(base, gregs);\n        return;\n    }\n\n    uintptr_t fault_addr = (uintptr_t)info->si_addr;\n    if (!is_jit_fault(base, fault_addr)) {\n        chain_to_old(sig, info, uctx_void);\n        return;\n    }\n\n    uint32_t guest_addr = (uint32_t)(fault_addr - (uintptr_t)base);\n    if (guest_addr < 0x10000u) {\n        jit_exit_panic(base, gregs);\n    } else {\n        store_pvm_regs(base, gregs);\n        uint64_t exit_reason = (EXIT_PAGE_FAULT_TYPE << 56) | (uint64_t)guest_addr;\n        *(uint64_t *)(base - OFF_EXIT_REASON) = exit_reason;\n\n        uintptr_t return_addr  = *(uintptr_t *)(base - OFF_RETURN_ADDR);\n        uintptr_t return_stack = *(uintptr_t *)(base - OFF_RETURN_STACK);\n        gregs[REG_RIP] = (greg_t)return_addr;\n        gregs[REG_RSP] = (greg_t)return_stack;\n    }"},"options":["A fault at guest offset < 2^16 becomes F̄ × 0 so that the host can tell null-pointer bugs apart from ordinary faults, and any other fault becomes F̄ carrying the faulting guest address; SIGFPE becomes ∞, because div/rem is the most expensive row of the §A.10 table (60 cycles, 1 DIV unit) and a trapping divide means the block was mispriced","The handler cannot know which PVM registers were live at the fault, so it always reports ☇ and discards register state; only the interpreter backend can ever produce F̄, which is why the recompiler emits a software bounds check before every load and store and bails out to the interpreter whenever the checked address leaves the 4 GiB window","Every fault is retried in place: the handler mprotects the missing page read-write, restores the spilled registers and returns from the signal so the faulting x86 instruction re-executes — the JIT analogue of eq. A.9's 'RAM must be changed' recovery; SIGFPE is chained to the previously installed handler, since an IDIV trap can only ever be a host bug","A fault at guest offset < 2^16 becomes ☇ and any other fault inside the guest window becomes F̄ carrying the faulting guest address, after the 13 pinned x86 registers are spilled to the control region and RIP/RSP are rewritten to the Go return point; SIGFPE from JIT code becomes ☇ only as a safety net, because correct div/rem codegen never lets IDIV see b = 0 or MIN/−1"],"answer":3,"explanation":"對照 eq. A.9：min(x) mod 2^32 < 2^16 → ☇，否則 F̄——handler 的 `guest_addr < 0x10000u → jit_exit_panic`、否則 `(EXIT_PAGE_FAULT_TYPE << 56) | guest_addr` 正是這條規則的硬體版：前 64 KiB 永遠不映射（PROT_NONE），存取就 SIGSEGV。恢復方式不是「重試」：handler 先用 store_pvm_regs 把 ucontext 裡 13 個 pinned 暫存器（RAX/RDX/RBX/…/RBP，對應 register_map.go 的 PVMToX86）寫回 R15 下方的 control region，再把 RIP/RSP 改成 entry trampoline 存好的 OFF_RETURN_ADDR / OFF_RETURN_STACK，於是 sigreturn 後直接「回到 Go」，BlockBasedInvoke 讀 ExitReason/ExitPC 後結束（這也是為何要 runtime.LockOSThread：guest_base_ptr 是 per-OS-thread 的 TLS）。GP 的 F̄ 本來就是可續跑的 exit（改 RAM 後再 Ψ），但這由 host（例如 invoke + pages）決定，不是 handler 偷偷補頁。SIGFPE：x86 IDIV 在除以 0 與 MIN/−1 會發 #DE，而 GP 規定 div 除零得 2^64 − 1、rem 除零得被除數、MIN/−1 得 φ_A / 0（§A.5.1），不能 panic——所以 emit_arith_three.go 的 emitDivS64 先 `TestRegReg` 判 0、再 `CmpRegImm32(-1)` 判 −1 才走 IDIV，handler 的 SIGFPE → ☇ 只是防線。剩下的差距：回報的是原始 guest_addr，而 eq. A.9 要求 Z_P⌊·/Z_P⌋ 對齊的最低不可存取 page 位址。其他設計選擇：executable.go 用 memfd 雙映射（RW 視圖寫碼、RX 視圖執行）避免每個 block mprotect 切換 W^X。干擾項逐一：說「handler 自己補頁重試、SIGFPE 交還舊 handler」的，兩處都錯——F̄ 是要回到 host 讓它決定要不要改 RAM（例如 invoke 前先 pages），handler 私自映射等於憑空給服務記憶體；而 JIT 內的 SIGFPE 若 chain 給舊 handler，process 會直接死掉，正確做法是轉成 ☇。說「< 2^16 回 F̄ × 0、SIGFPE 轉 ∞」的，前半違反 eq. A.9「min(x) mod 2^32 < 2^16 → ☇」（GP 特別強調 regardless of the apparent (in)accessibility），後半除了 ∞ 只由 eq. A.8 的 gas 不足產生外，「div/rem 是 A.10 最貴的一列」也不成立：div/rem 60 cycles，ecalli 是 100 cycles / 4 decode slots。說「handler 無法得知暫存器、只有 interpreter 能產生 F̄、recompiler 每次存取都先做軟體邊界檢查」的，正好與這個設計相反：store_pvm_regs 從 ucontext 撈得到全部 13 個 pinned 暫存器，而整個 4 GiB 視窗配真實 mprotect 權限的用意就是「2^16 以上不發軟體檢查」，靠硬體 SIGSEGV 代勞。","trap":"硬體 page fault 只能替代「≥ 2^16 的可存取性檢查」；< 2^16 → ☇ 與除法特例是語意規則，要在 codegen / handler 明確處理。"},{"id":"b2-appA-vblob-terminator","ch":"A","section":"A.1 Basic Definition (deblob validity v_blob / v_inst)","gpRef":"eq. A.2 (deblob, v_blob, v_inst), A.3 (skip), A.4 (ζ), A.5 (ϖ)","difficulty":2,"kind":"delta","tags":["pvm","validation","codec","delta-0.8.0"],"stem":"GP 0.8.0's deblob(p, ı) returns error — and Ψ then panics without executing anything — unless v_blob(c, k, 0) and v_inst(c, k, ı) both hold. Which set of conditions do these two validators actually enforce?","options":["|k| = |c|; walking the code from index 0 by 1 + skip(·), every visited octet is flagged in k and is a valid opcode (∈ U); the walk ends exactly at |k| with the last instruction a terminator (∈ T); and the entry point ı is itself a flagged, valid opcode","That every branch and jump target lies in ϖ and that no instruction is longer than 16 octets, both established during a single walk of the code; the final instruction may be anything, because ζ pads the code with zeros so that running off the end simply executes opcode 0 and traps","Only that |k| = |c| and that every jump-table entry points at a basic-block start; opcode validity is left to execution time, where an unknown opcode behaves like opcode 0 and traps, and the entry point ı is accepted wherever it lands, since Ψ re-derives the nearest opcode boundary from k","That the code contains at least one ecalli and ends with a jump_ind to the halt sentinel 2^32 − 2^16, so that every program has a well-defined return path to the host; the bitmask itself needs no check, since k is regenerated from each opcode's length while deblob decodes"],"answer":0,"explanation":"eq. A.2：v_blob(c, k, ı) = ⊤ when ı > 0 ∧ ı = |k|；⊥ otherwhen ı + 1 + skip(ı) = |k| ∧ c_ı ∉ T；v_blob(c, k, ı + 1 + skip(ı)) otherwhen v_inst(c, k, ı)；⊥ otherwise。v_inst(c, k, ı) = |k| = |c| ∧ ı < |k| ∧ k_ı = 1 ∧ c_ı ∈ U。也就是從 0 開始沿 skip 走訪每條指令：每個落點都要是 bitmask 標記的合法 opcode、最後一條必須是 terminator、走訪要剛好停在 |k|（空程式因 ı > 0 條件而無效）；deblob 另外用 v_inst(c, k, ı) 驗證入口 ı。這是 0.8.0 的新規（issues digest #1046：「programs whose final block lacks a terminator are invalid (v_blob rule)」；PR #508 摘要：「blobs pre-validated」），動機是 block-based gas：ϱ^Δ 的模擬（eq. A.58 只有遇到 T 才把 x_ı 設為 ∅）需要每個 basic block 都有終點。0.7.2 沒有 v_blob，無效 opcode 或掉出程式碼末端是靠 ζ = c ⌢ [0, 0, …]（eq. A.4）的 trap 在 runtime 才 panic（會多扣 gas）；0.8.0 裡 ζ 的零填充只剩「最後一條指令缺少的引數 octet」這個用途。干擾項逐一：說「只驗 |k| = |c| 與 jump table 指向 block 起點、入口 ı 落在哪都行」的，錯在 deblob 另外要求 v_inst(c, k, ı)——入口必須 k_ı = 1 且 c_ı ∈ U，Ψ 不會替你「重新對齊」到最近的 opcode 邊界；而 jump table 的 j_{a/Z_A − 1} ∈ ϖ 是 eq. A.22 在 runtime 判的，v_blob 一個 entry 都不看。說「驗跳躍目標與指令長度上限」的，兩項都不是驗證項：靜態 jump/branch 靠 eq. A.20/A.21 在 runtime 檢查 ϖ，「指令最長 16 octets」則是 §A.2 的描述性上限（長度本來就是隱含的，無從驗起）；它還漏了真正的關鍵——走訪必須停在 |k| 且最後一條 ∈ T。說「必須含 ecalli、必須以 jump_ind 跳 sentinel 收尾、k 可由 opcode 長度重建」的，三項都無中生有：GP 沒有這兩條結構要求，而 k 是 blob 裡實際傳來的欄位（p 的最後一段），正因為指令長度是隱含的才需要它，不可能反過來由長度推出。你們的 preDecodeBlocks 其實已在 deblob 時對「block 跑出程式末端」與無效 opcode 回 ExitPanic，MakeBitMasks 也驗 bitmask 長度，與 0.8.0 方向一致。","trap":"v_blob 驗的是「指令流的形狀」（合法 opcode + terminator 收尾），不驗跳躍目標；跳錯位置仍是 runtime panic。"},{"id":"b2-appA-opcode-renumbering-unlikely","ch":"A","section":"A.3 Basic Blocks & A.5.1 (opcodes 2 and 100–110)","gpRef":"§A.5.1 tables (opcodes 0–2, 100–110), eq. A.65 (𝔟 branch cost), A.10 table (unlikely = 40 cycles)","difficulty":2,"kind":"code","tags":["pvm","opcodes","gas","delta-0.8.0"],"stem":"This is the team's GP 0.7.2 opcode table for the no-argument and two-register groups. What must change to match GP 0.8.0?","code":{"lang":"go","caption":"PVM/opcode_info.go (opcodeInfoTable, excerpt)","src":"\t// A.5.1 No-argument (terminators)\n\t0: {Name: \"trap\", Category: InstrCatNoArg, IsTerminator: true},\n\t1: {Name: \"fallthrough\", Category: InstrCatNoArg, IsTerminator: true},\n\n\t// A.5.2 One immediate\n\t10: {Name: \"ecalli\", Category: InstrCatOneImm, IsTerminator: false},\n\t...\n\t// A.5.9 Two registers\n\t100: {Name: \"move_reg\", Category: InstrCatTwoReg, IsTerminator: false},\n\t101: {Name: \"sbrk\", Category: InstrCatTwoReg, IsTerminator: false},\n\t102: {Name: \"count_set_bits_64\", Category: InstrCatTwoReg, IsTerminator: false},\n\t103: {Name: \"count_set_bits_32\", Category: InstrCatTwoReg, IsTerminator: false},\n\t104: {Name: \"leading_zero_bits_64\", Category: InstrCatTwoReg, IsTerminator: false},\n\t105: {Name: \"leading_zero_bits_32\", Category: InstrCatTwoReg, IsTerminator: false},\n\t106: {Name: \"trailing_zero_bits_64\", Category: InstrCatTwoReg, IsTerminator: false},\n\t107: {Name: \"trailing_zero_bits_32\", Category: InstrCatTwoReg, IsTerminator: false},\n\t108: {Name: \"sign_extend_8\", Category: InstrCatTwoReg, IsTerminator: false},\n\t109: {Name: \"sign_extend_16\", Category: InstrCatTwoReg, IsTerminator: false},\n\t110: {Name: \"zero_extend_16\", Category: InstrCatTwoReg, IsTerminator: false},\n\t111: {Name: \"reverse_bytes\", Category: InstrCatTwoReg, IsTerminator: false},"},"options":["Nothing in these groups: 0.8.0 renumbered only the host calls, inserting grow_heap at id 1, while PVM opcodes stay frozen across GP versions so that already-compiled service blobs remain valid; the new unlikely hint is encoded as an ecalli with ν_X = 0 rather than as an opcode of its own","sbrk (101) disappears — heap growth becomes the grow_heap host call — so count_set_bits_64 … reverse_bytes shift down to 101–110; and a new no-argument opcode unlikely = 2 appears: a no-op that is not a terminator but is priced at 40 cycles and makes any branch targeting it (or trap) cost 𝔟 = 1 instead of 20","The two-register group is renumbered to start at 101 and trap moves from opcode 0 to opcode 2, swapping places with unlikely, so that a zero octet is no longer a valid opcode and running off the end of the code is caught by v_blob at deblob time rather than by ζ's zero padding at run time","sbrk stays at 101 but becomes a terminator, because growing the heap can now page-fault and must therefore end a basic block; unlikely = 2 is added as a second new terminator, so a compiler can close a block wherever it marks cold code, and both are priced at 2 cycles just like trap and fallthrough"],"answer":1,"explanation":"GP 0.8.0 §A.5.1：無引數指令 0 trap（ε = ☇）、1 fallthrough（sjump(ı + 1 + skip(ı))）、2 unlikely（沒有任何 mutation）；Two Registers 表：100 move_reg、101 count_set_bits_64、102 count_set_bits_32、103 leading_zero_bits_64、104 leading_zero_bits_32、105 trailing_zero_bits_64、106 trailing_zero_bits_32、107 sign_extend_8、108 sign_extend_16、109 zero_extend_16、110 reverse_bytes——sbrk 不存在了（PR #508：「sbrk replaced by grow_heap host call；opcodes and host calls renumbered」），heap 成長改由 App. B 的 grow_heap host call 處理。§A.3 的 T 沒有 unlikely，也沒有 sbrk：unlikely 只是提示，執行到它就 ı′ = ı + 1 + skip(ı) 繼續同一個 block；trap 仍是 opcode 0，所以 ζ 的零填充（eq. A.4）依然是 trap。價格：A.10 表 unlikely = 40 cycles、1 decode slot、不佔 unit；trap / fallthrough = 2 cycles；eq. A.65：𝔟(c, ı) = 1 when {ζ_{ı+1+skip(ı)}, ζ_{ı_target}} ∩ {unlikely, trap} ≠ ∅，否則 20——編譯器把 unlikely 放在冷路徑（錯誤處理）入口，熱路徑上的 branch 幾乎免費，真的走進冷 block 才付 40。干擾項逐一：說「opcode 跨版本凍結、unlikely 用 ecalli ν_X = 0 表示」的，前半被 0.8.0 這次重新編號直接推翻，後半錯在 ecalli（10）的語意是 ε = h̄ × ν_X，會離開 PVM 進 host call，而 unlikely 只是不做任何 mutation 的 opcode 2；說「sbrk 留在 101 且變成 terminator、unlikely 也是 terminator、兩者都 2 cycles」的，三處都錯——sbrk 已被移除，§A.3 的 T 不含這兩者，而 A.10 表給 unlikely 的是 40 cycles（trap/fallthrough 才是 2 cycles）；說「兩暫存器組從 101 起算、trap 搬到 2 與 unlikely 對調、零 octet 不再是合法 opcode」的，把因果弄反了：trap 仍是 opcode 0，正因為如此 eq. A.4 的 ζ = c ⌢ [0, 0, …] 補零才等同 trap；v_blob 確實會擋掉尾端缺 terminator 的 blob，但那與 trap 的編號無關。你們要做的：刪掉 instSbrk（code-map 3.11.8）、整組 101–111 往下移一格、新增 opcode 2（IsTerminator: false）並在 gas 表加上 40 cycles 與 𝔟 的目標檢查。","trap":"unlikely 是 hint 不是 terminator；便宜的是「指向它的 branch」（𝔟 = 1），貴的是「真的跑進去」（40 cycles）。"},{"id":"b2-appB-write-prev-length-full","ch":"B","section":"B.5 General Functions — write","gpRef":"§B.5 `write` = 5 (Ω_W); eq. B.12 (G); eq. 9.8 (a_t)","difficulty":2,"kind":"code","tags":["host-calls","write","storage","fuzz-bug"],"stem":"The excerpt is the team's Ω_W (`write`) after fix #980. A service overwrites a key that currently holds a 100-octet value with a 5,000-octet value (φ_7…φ_10 = k_O, k_Z, v_O, v_Z). Which statement matches GP 0.8.0?","code":{"lang":"go","caption
