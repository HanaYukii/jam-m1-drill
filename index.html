"refine = stateless / in-core / 大輸入；accumulate = stateful / on-chain / 小輸出。"},{"id":"ch04-balance-timeslot-ranges","ch":"4","section":"4.6–4.7","gpRef":"eq. 4.21 (balance), eq. 4.28 (timeslot)","difficulty":1,"kind":"concept","tags":["types"],"stem":"Which of the following is TRUE about the numeric domains used by JAM?","options":["Balances and timeslots are both N_2^64, with Kusama's 10^12 denomination, putting the protocol's end of life far beyond the year 2840","Balances are N_2^64 with Ethereum's 10^18 denomination; timeslots are N_2^32, which caps total issuance at roughly 18 whole tokens once the denomination applies","Balances are N_2^128 to match Polkadot's 10^10 denomination; timeslots are N_2^64, so the slot index can never wrap and the protocol has no dated end of life","Balances are N_2^64 (u64) with a standard denomination of 10^9 tokens; timeslots are N_2^32, giving the protocol a lifespan into the year 2840"],"answer":3,"optNotes":["三處都錯：timeslot 是 u32、面額是 10^9，而 10^12 是 Kusama 的。","10^18 是 Ethereum 的值；套上去 18×10^9 tokens 只剩 18 顆，正說明 GP 為何選 10^9。","10^10 是 Polkadot 的面額；balance 是 u64 不是 u128，timeslot 放大成 u64 也就失去 2840 年這個結論。","eq. 4.21 的 N_B ≡ N_2^64 配 10^9 面額，eq. 4.28 的 N_T ≡ N_2^32 才推得出 2840 年這個壽命。"],"explanation":"GP eq. 4.21：N_B ≡ N_2^64，並假設 10^9 為標準面額，因此最多約 18×10^9 tokens；用 u64 正是為了讓餘額能塞進固定寬度的序列化。eq. 4.28：N_T ≡ N_2^32，6 秒一 slot，壽命到 2840 年 8 月中。GP 在同處把 Polkadot 的 10^10、Kusama 的 10^12 與 Ethereum 的 10^18 明文列為「different to」JAM 的對照組，這三個數字正是干擾項的來源。","trap":"u64 balance、u32 timeslot、u32 service index。"},{"id":"ch04-coretime-vs-gas","ch":"4","section":"4.8.2 On Services and Accounts","gpRef":"§4.9.2 last paragraphs","difficulty":2,"kind":"rationale","tags":["coretime","authorization"],"stem":"How does JAM replace Ethereum's gas-purchase model for buying blockspace?","options":["Coretime is pre-purchased (Agile-Coretime style) and assigned to an authorization agent; procurement is out of scope of the GP and expected to be handled by a system parachain","Work-package builders sign a transaction that debits their own account on inclusion, exactly as in Ethereum — the one place where JAM keeps a signature-identified transactor","Validators auction each six-second slot to the highest-bidding work-package builder, and the authorization system of §8 exists to settle that auction and pay out the winning bid","Blockspace is metered in gas and debited from the accumulating service's balance a_b as its work-report accumulates; a service whose balance runs dry has its reports dropped"],"answer":0,"optNotes":["§4.9.2 明講 coretime 是預先購買並指派給 authorization agent，採購本身不在 GP 範圍內。","直接違反「there is no such concept of a 'transactor'」——區塊裡沒有使用者簽名的交易。","§8 只維護 authorizer pool α 與 queue φ，沒有出價、沒有拍賣，也不付錢給出塊者。","gas 在 JAM 只是 PVM 的計量與上限，從頭到尾沒有餘額被扣；a_b 管的是 threshold a_t 與 transfer。"],"explanation":"GP §4.9.2：「In place of Ethereum's gas model for purchasing and measuring blockspace, JAM has the concept of coretime, which is prepurchased and assigned to an authorization agent… Its procurement is out of scope in the present work and is expected to be managed by a system parachain operating within a parachains service itself blessed with a number of cores」。授權代理（authorizer）讓外部行為者不必像 Ethereum 交易那樣自我識別即可提供輸入；同節斷言「In JAM, these are separated and there is no such concept of a 'transactor'」。這正是 §8 authorization system 的動機：把「買 coretime」與「提交具體工作」解耦。","trap":"面試「design rationale」常問：為什麼要 authorization system？答：同時支援 Ethereum-style 與 Polkadot-style 的互動模式。"},{"id":"ch04-pvm-summary","ch":"4","section":"4.5 The Virtual Machine and Gas","gpRef":"§4.7 The Virtual Machine and Gas, eq. 4.22–4.27","difficulty":1,"kind":"concept","tags":["pvm"],"stem":"Which description of the PVM as summarized in the Overview is correct?","options":["A stack machine derived from WebAssembly with 32-bit words, 16 registers and a linear memory that grows in 64 KiB pages with no inaccessible pages","A RISC-V (RV32IM) based register machine with 16 registers of 32 bits, big-endian, and a flat 64-bit address space that is not paged at all","A RISC-V (RV64EM) based register machine with 13 64-bit registers, little-endian, and a pageable 32-bit address space in 4096-octet pages","An EVM-compatible machine that keeps the Yellow Paper's cryptographic precompiles and environment opcodes in its instruction set, with 256-bit words"],"answer":2,"optNotes":["GP 明寫 PVM 是 RISC register machine；eq. 4.24 的 access 陣列正是為了讓頁面能是 ∅，page fault 才存在。","四項全反：暫存器是 64-bit、13 個、little-endian，位址空間是 32-bit 且分頁。","RV64EM、13 個 64-bit 暫存器、little-endian、2^32 octet 的 pageable RAM 與 Z_P = 4096 全部對上 §4.5。","與 GP 的簡化理由正好相反：密碼學與環境互動指令一律拿掉，能力改走 host call。"],"explanation":"GP §4.5：PVM 以 RISC-V 的 RV64EM 為基礎，13 個 64-bit 暫存器（RISC-V 有 16 個，扣掉 2 個 OS 保留 + 1 個固定為 0）、little-endian、記憶體為 2^32 個 octet 的 pageable RAM，page 大小 Z_P = 2^12 = 4096，每頁可為 mutable(W)、readable(R) 或 inaccessible(∅)。同節並交代刪減指令集的理由：「the complex instructions for cryptographic operations are missing as are those which deal with environmental interactions」。","trap":"13 registers / 64-bit / 4 KiB pages / 32-bit addressing。"},{"id":"ch04-forks-safrole-grandpa","ch":"4","section":"4.3 Which History?","gpRef":"§4.3","difficulty":1,"kind":"rationale","tags":["consensus"],"stem":"JAM states three goals about forks: (1) two heads should rarely form, (2) when they do they should be resolved quickly, (3) it should be possible to identify a recent block that will remain in history in perpetuity. Which mechanism delivers which goal?","options":["Safrole delivers all three; Grandpa is only used for BEEFY bridging","Safrole delivers (1), Grandpa delivers (3), and both contribute to (2)","Grandpa delivers (1) and (2); Safrole delivers (3)","ELVES auditing delivers (1); Safrole delivers (2); Grandpa delivers (3)"],"answer":1,"optNotes":["Grandpa 在 GP 裡就是 finality gadget 本身，不是只為 BEEFY bridging 服務的附件。","正是 §4.3 的分工：出塊的 Safrole 給 (1)、finality 的 Grandpa 給 (3)，(2) 由兩者共同貢獻。","把兩者對調了：Grandpa 管的是 finalization，不是「兩個 head 很少形成」。","ELVES 是 in-core 計算正確性的 auditing 機制，與這三個 fork 目標無直接關係。"],"explanation":"GP §4.3：「Safrole, which governs the (not-necessarily forkless) extension of the blockchain; and Grandpa, which governs the finalization… the former delivers point 1, the latter delivers point 3 and both are important for delivering point 2.」分工很清楚：出塊機制負責「很少長出兩個 head」，finality gadget 負責「某個近期區塊永久留在歷史裡」，而「分叉快速收斂」則是兩者共同的貢獻。","trap":""},{"id":"ch05-header-fields","ch":"5","section":"5 The Header","gpRef":"eq. 5.1","difficulty":1,"kind":"concept","tags":["header"],"stem":"GP eq. 5.1 defines the header H as a 10-tuple. Which field is NOT part of the header?","options":["H_W — the winning-tickets marker, carrying the next epoch's E = 600 tickets","H_R — the prior state root, which is the parent block's posterior state root","H_B — the BEEFY root committing to this block's own accumulation outputs","H_V — the entropy-yielding VRF signature that feeds the accumulator η_0"],"answer":2,"optNotes":["H_W 型別為 ([ticket]_E)?（eq. 5.11），E = 600，裝的正是下一 epoch 的 slot-sealer tickets。","H_R 是 eq. 5.1 的第二個欄位，§5 定義它就是 parent 的 posterior state root。","accumulation output 走 β 的 accumulation-output belt，簽的是 last(β)_b 的 super-peak，header 無此欄。","H_V 的輸出 Y(H_V) 正是 entropy accumulator 的輸入：η′_0 ≡ H(η_0 ⌢ Y(H_V))。"],"explanation":"eq. 5.1：H ≡ (H_P parent hash, H_R prior state root, H_X extrinsic hash, H_T timeslot, H_E epoch marker, H_W winning-tickets marker, H_O offenders marker, H_I author index, H_V VRF signature, H_S seal)，共十個欄位——一個 parent hash、兩個 root/hash、時間、三個 marker、作者索引，以及兩個 Bandersnatch 簽章。BEEFY / accumulation-output root 屬於 β 的 accumulation-output belt（β_B，見 §7）與 §18 Beefy Distribution 的鏈下流程，從來不是 header 的一部分。","trap":"記憶法：p r x t | e w o | i v s。"},{"id":"ch05-prior-state-root","ch":"5","section":"5 The Header","gpRef":"eq. 5.9 (H_r)","difficulty":1,"kind":"rationale","tags":["header","pipelining"],"stem":"Unlike Ethereum and Polkadot, a JAM header commits to the PRIOR state root (H_R = M_σ(σ)) rather than the posterior one. What is the stated reason?","options":["To reduce header size: the extrinsic hash H_X already commits to every input that can change state, so committing a second 32-octet root would be redundant","Because the posterior state root is undefined until the block's work-reports have been audited, and auditing only completes several tranches later","Because Grandpa votes carry the block header alone, which makes the header's prior state root the only place a finalized state root is ever committed","To facilitate pipelining of block computation, in particular of Merklization: the author need not finish Merklizing the new state before publishing the block"],"answer":3,"optNotes":["prior 與 posterior root 都是 32 octet，換一個並不省空間；H_X 承諾的是輸入而不是結果狀態。","σ′ 由 (σ, B) 完全決定、區塊內就算得出；auditing 是鏈下流程，只影響 finalization 與選鏈。","§19 明寫 Grandpa 投的是 best block header「together with its posterior state root」。","GP 給的理由就是 pipelining：作者不必先算完新狀態的 Merklization 才發布區塊。"],"explanation":"GP §5：「This is a departure from both Polkadot and the Yellow Paper's Ethereum… We do this to facilitate the pipelining of block computation and in particular of Merklization.」實務上 block author 可以先發布區塊，把耗時的 state Merklization 延後到下一個 slot 才需要（下一個區塊的 H_R 才會用到）。後果：β 裡最新一筆的 state root 先填零，由下一個區塊的 β† 用 H_R 補正（eq. 7.5）。","trap":"設計理念題。延伸：Grandpa vote 會帶 posterior state root（§19）以彌補 header 只有 prior root。"},{"id":"ch05-extrinsic-hash-080","ch":"5","section":"5 The Header","gpRef":"eq. 5.4–5.7 (H_x)","difficulty":3,"kind":"delta","tags":["header","delta-0.8.0","codec"],"stem":"GP 0.8.0 (PR #524) redefined the extrinsic hash H_X = H(E(H#(a))) with a = [E_T(E_T), p, g, E_A(E_A), E_D(E_D)]. How are the preimages (p) and guarantees (g) components formed?","options":["p and g are dropped from a, which is then the three-element sequence [E_T(E_T), E_A(E_A), E_D(E_D)]; preimages and guarantees are committed only via the prior state root","p and g are the full codec encodings of E_P and E_G exactly as the block body carries them, so a commits to every preimage blob and every complete work-report","p encodes the sequence of (E_4(service), H(data)) pairs and g encodes the sequence of (H(work-report), E_4(slot), var(credential)) tuples, each sequence var-length prefixed","p is the Blake2b hash of the concatenated preimage blobs and g is the Keccak hash of the concatenated work-reports, so a carries exactly one 32-octet leaf for each"],"answer":2,"optNotes":["eq. 5.5 的 a 是五個元素；preimages 與 guarantees 正是靠 H_X 而非 state root 進入 header。","那樣 a 會扛著整包 blob 與整份 report，恰好毀掉「逐項證明 inclusion」的設計目的。","eq. 5.6–5.7 兩者都是 E(var[…]) 的形狀：序列每個元素先換成 hash 再編碼。","H# 是 blake-many（對序列每個元素各取一次 hash），且 Keccak 在 JAM 只用於 §18 的 BEEFY MMR。"],"explanation":"GP eq. 5.6–5.7：p = E(var[(E_4(s), H(d)) for (s,d) in E_P])，g = E(var[(H(w), E_4(t), var(a)) for (w,t,a) in E_G])。GP 為此給的理由（§5）：「taking care to allow for the possibility of reports and preimages to individually have their inclusion proven」——只放 hash，就能用 Merkle proof 證明某個 preimage/report 在區塊裡，而不必附上整個 blob。你們的 code（block_serialization / header hash）在 0.7.2 對 guarantees 已是用 report hash，0.8.0 再把 preimages 改為 (service, blake(data))。","trap":"0.7.2→0.8.0 差異；H# 是 blake-many（對序列每個元素各取 hash 再 encode）。"},{"id":"ch05-timeslot-validity","ch":"5","section":"5 The Header","gpRef":"eq. 5.8","difficulty":1,"kind":"concept","tags":["header","time"],"stem":"Which condition must a block's timeslot H_T satisfy for the block to be considered valid right now?","options":["P(H)_t < H_T ∧ H_T · P ≥ T — strictly greater than the parent's slot, and at or beyond the current wall-clock time T","P(H)_t < H_T ∧ H_T · P ≤ T — strictly greater than the parent's slot, and no later than the current wall-clock time T","P(H)_t ≤ H_T ∧ H_T · P ≤ T — greater than or equal to the parent's slot, and no later than the current wall-clock time T","H_T = P(H)_t + 1 ∧ H_T · P ≤ T — exactly one slot after the parent, and no later than the current wall-clock time T"],"answer":1,"optNotes":["wall-clock 條件方向反了：H_T·P ≥ T 等於只接受當下或未來的區塊。","eq. 5.8 正是這兩條：對 parent 嚴格大於，且 H_T·P ≤ T（P = 6 秒的 wall-clock）。","放寬成「大於或等於 parent」會允許父子同 slot，GP 明寫 strictly greater。","要求恰好 parent + 1 就禁止跳 slot，但沒人出塊時 slot 本來就會被跳過。"],"explanation":"GP eq. 5.8：P(H)_t < H_T ∧ H_T·P ≤ T，其中 P = 6 秒、T 為 wall-clock 秒數（自 Common Era 起算）。§5 原文：「A block may only be regarded as valid once the time-slot index H_T is in the past. It is always strictly greater than that of its parent.」且「Blocks considered invalid by this rule may become valid as T advances」——太新的區塊只是暫時無效，不是永久拒絕。你們 STF 裡 `BadSlot` 對應的是 τ ≥ τ′ 的情況。","trap":"跳 slot 是合法的（例如沒人出塊），這也是為什麼 Safrole 要處理 e′ > e+1（整個 epoch 被跳過）的情況。"},{"id":"ch05-author-index","ch":"5","section":"5 The Header","gpRef":"eq. 5.10 (H_i, H_a)","difficulty":2,"kind":"concept","tags":["header","validators"],"stem":"The block author index H_I is an index into which validator set, and how is the author's Bandersnatch key H_A obtained?","options":["Into the staging set ι; H_A = ι[H_I]_b, since ι holds the keys the delegator designates for the very next epoch","Into the prior active set κ; H_A = κ[H_I]_b, and H_A is serialized as an eleventh header field beside H_I","Into the pending set γ_k; H_A = γ_k[H_I]_b, which is why H_I may exceed |κ′| in an epoch's first block","Into the posterior active set κ′; H_A ≡ κ′[H_I]_b, and H_A is NOT serialized — it is merely an equivalence"],"answer":3,"optNotes":["ι 慢一輪：eq. 6.14 要先 ι → γ_k，再過一個 epoch 才成為 κ，對應的是下下個 epoch。","prior/posterior 反了，而且 eq. 5.1 的 header 只有十個欄位，H_A 從不上鏈。","違反 eq. 5.10 的型別 H_I ∈ N_{|κ′|}——索引域永遠是 κ′，不可能超出。","eq. 5.10 就是 H_I ∈ N_{|κ′|}、H_A ≡ κ′[H_I]_b，並明說它不被序列化。"],"explanation":"GP eq. 5.10：H_I ∈ N_{|κ′|}，H_A ≡ κ′[H_I]_b，「this is merely an equivalence, and is not serialized as part of the header」——驗證者是自己用 κ′ 算出作者的 Bandersnatch key。用 posterior κ′ 是因為 epoch 交界的第一個區塊已由新的 active set 出塊（key rotation 在該區塊內完成）。你們的 sealing.go 驗 seal/VRF 時傳入的也是 posterior state（code-map 3.2.6 註：參數名叫 priorState 但 STF 傳的是 posterior）。","trap":"epoch 第一個區塊：作者屬於 κ′ = 舊的 γ_k。"},{"id":"ch05-ancestors-lookup-anchor","ch":"5","section":"5 The Header","gpRef":"eq. 5.3 (ancestors A) & §11.4 lookup anchor","difficulty":2,"kind":"concept","tags":["header","ancestry"],"stem":"The GP only requires implementations to store headers of ancestors authored within the previous L = 14,400 timeslots (24 hours). Which on-chain check is the reason this ancestor set A is needed?","options":["Recomputing the fallback slot-sealer sequence F(η′_2, κ′) after a skipped epoch, which needs the entropy VRF H_V of every header in the skipped epoch","Verifying that a guarantee's lookup-anchor block (hash, timeslot and posterior state root) really occurs in the chain, which state σ on its own cannot attest","Verifying that each new block's parent hash H_P is the Blake2b of the parent header, which needs every header back to the last finalized block","Verifying that each availability assurance's anchor matches the parent hash H_P, which needs a search of the retained headers to locate that anchor"],"answer":1,"optNotes":["F(η′_2, κ′)（eq. 6.27）的輸入只有 posterior entropy 與 κ′ 兩個 state 分量，不讀歷史 header。","lookup anchor 最舊可到 L = 14,400 slot 之前，而 recent history β 只留 H = 8 塊，非靠 A 不可。","eq. 5.2（H_P ≡ H(E(P(H)))）只用到直接的 parent header 一份，不必往回保留任何東西。","eq. 11.12 的 a_a = H_P 是一次等值比對，不需要在保留的 header 序列裡搜尋。"],"explanation":"GP eq. 11.38：∀x ∈ contexts: ∃h, h′ ∈ A: h_t = x_l（lookup-anchor time）∧ H(h) = x_l（lookup-anchor hash）∧ h′_p = H(h) ∧ h′_r = x_{l,s}（posterior state root of lookup anchor，0.8.0 新增）。§11.4：「this is one of the few conditions which cannot be checked purely with on-chain state and must be checked by virtue of retaining the series of the last L headers」。這也是 fuzzer 的「Ancestry」feature：M1 必須支援。","trap":"L = 14,400 slots = 24h；recent history H = 8 blocks 是給 anchor 用的，lookup anchor 用 A。"},{"id":"ch05-markers-types","ch":"5","section":"5.1 The Markers","gpRef":"eq. 5.11 (markers)","difficulty":2,"kind":"concept","tags":["header","markers"],"stem":"Which statement about the three header markers (H_E, H_W, H_O) is correct per eq. 5.11?","options":["H_E ∈ (H, H, [(bandersnatch, ed25519)]_V)? ; H_W ∈ ([ticket]_E)? ; H_O ∈ [ed25519 key]? — all three are optional and all three are None outside an epoch's first block","H_E ∈ (H, H, [(bandersnatch, ed25519)]_V)? ; H_W ∈ ([ticket]_E)? ; H_O ∈ [N_V]? — the offenders marker is optional and holds validator indices rather than keys","H_E ∈ ([336-octet validator key]_V)? ; H_W ∈ ([bandersnatch key]_E)? ; H_O ∈ [ed25519 key] — the epoch marker carries whole keys and the winners marker the fallback sealers","H_E ∈ (H, H, [(bandersnatch, ed25519)]_V)? ; H_W ∈ ([ticket]_E)? ; H_O ∈ [ed25519 key] — the offenders marker is a plain sequence that may be empty but is never None"],"answer":3,"optNotes":["型別上 H_O 不帶 ?；語意上只要該塊帶了 culprits 或 faults，epoch 中間任何一塊都可能非空。","H_O 裝的是 Ed25519 公鑰而不是 validator index，而且它並非 optional。","H_E 只放 (bandersnatch, ed25519) 這對子集合；fallback key 由鏈上重算，從不進 H_W。","eq. 5.11 的 H_O 沒有 ? 包裝：它可以是空序列，但永遠不是 None。"],"explanation":"GP eq. 5.11：H_E ∈ (H, H, [(bandersnatch, ed25519)]_V)?（兩個 entropy hash + 下一 epoch 每個 validator 的 Bandersnatch 與 Ed25519 key，0.6.4 起加入 Ed25519），H_W ∈ ([ticket]_E)?（E = 600 張 tickets），H_O ∈ [ed25519 key]。時機也不同：H_E 只在 e′ > e 時非空，H_W 只在同一 epoch 內首次跨越 Y 且 accumulator 飽和時非空，而 H_O 與 epoch 邊界無關，由 §10 disputes 帶進來的 culprits/faults 決定。fallback slot-sealer 序列 F(η′_2, κ′) 則是鏈上重算（eq. 6.27），不佔任何 header 欄位。","trap":"H_E 放的是 key 的子集合（bs + ed），不是完整 336-octet key；H_O 放 key 不是 index。"},{"id":"ch06-gamma-components","ch":"6","section":"6.2 Safrole Basic State","gpRef":"eq. 6.3–6.6","difficulty":1,"kind":"concept","tags":["safrole","state"],"stem":"The Safrole state γ ≡ (γ_P, γ_Z, γ_S, γ_A). Which description is correct?","options":["γ_P the ticket accumulator (≤ E tickets) for the next epoch; γ_Z the Bandersnatch ring root over γ_P; γ_S the current epoch's slot-sealer sequence (E tickets or E keys); γ_A the pending validator keys, reset to ι at the start of each epoch","γ_P the previous epoch's validator keys (the λ set); γ_Z the Bandersnatch ring root over the active set κ; γ_S the current epoch's slot-sealer sequence (E tickets or E keys); γ_A the ticket accumulator (≤ E tickets) for the next epoch","γ_P pending validator keys for the next epoch; γ_Z an Ed25519 ring root over γ_P; γ_S the ticket accumulator (≤ E tickets) for the next epoch; γ_A the current epoch's slot-sealer sequence (E tickets or E keys)","γ_P pending validator keys for the next epoch; γ_Z the Bandersnatch ring root over γ_P; γ_S the current epoch's slot-sealer sequence (E tickets or E keys); γ_A the ticket accumulator (≤ E tickets) for the next epoch"],"answer":3,"optNotes":["違反 6.5/6.6 的型別：accumulator 是 ticket 序列（≤ E 筆），pending set 是 validator key 序列。","γ_P 指向未來不是過去（λ 是 γ 之外的獨立狀態），且 eq. 6.14 的 ring root 是對 γ′_P 取的。","ring root 只由 Bandersnatch key k_b 構成；γ_S 與 γ_A 兩者也被對調了。","四項全對上 eq. 6.3–6.5：pending set、對 γ_P 取的 ring root、本 epoch sealer、下個 epoch 的票池。"],"explanation":"GP eq. 6.3–6.5：γ_P（pending set，每個 epoch 開頭從 ι 重置，決定下一個 epoch 的 ring root）、γ_Z ∈ ring root（由 γ_P 的 Bandersnatch key k_b 組成，eq. 6.14 的 z = O([k_b | k ∈ γ′_P])）、γ_S ∈ [C]_E ∪ [H_B]_E（本 epoch 的 slot-sealer 序列：600 張 ticket 或 fallback 的 600 把 Bandersnatch key）、γ_A ∈ [C]_{:E}（下一個 epoch 用的 ticket accumulator，最多 E 筆）。Safrole 只透過 ι、κ、τ、η 與協定其他部分互動。最容易混的是 γ_S 與 γ_A 的時間方向：γ_S 是**本** epoch 已定案、每個 slot 對應一筆的 sealer 序列，γ_A 則是本 epoch 期間持續累積、供**下**個 epoch 用的 ticket 池。","trap":"γ_S 有兩種型態（tickets 或 keys），serialization 時用 0/1 discriminator（見 D.1 C(4)）。"},{"id":"ch06-key-rotation","ch":"6","section":"6.3 Key Rotation","gpRef":"eq. 6.14–6.15","difficulty":2,"kind":"concept","tags":["safrole","validators","epoch"],"stem":"On an epoch change (e′ > e), how are the validator key sets rotated per eq. 6.14?","options":["(γ′_P, κ′, λ′, γ′_Z) = (Φ(ι), γ_P, κ, z) where z is the ring root over the Bandersnatch keys of γ′_P and Φ nulls the entire key tuple of any validator whose Ed25519 key is in ψ′_O","(γ′_P, κ′, λ′, γ′_Z) = (Φ(γ_P), κ, λ, γ_Z) where the ring root is only recomputed when ι changes and Φ nulls the keys of offenders in ψ′_O — the sequences advance one step every block","(γ′_P, κ′, λ′, γ′_Z) = (Φ(ι), ι, κ, z) where z is the ring root over the Bandersnatch keys of κ′ and Φ nulls the keys of offenders in the prior ψ_O rather than the posterior set","(γ′_P, κ′, λ′, γ′_Z) = (ι, γ_P, κ, z) where z is the ring root over γ′_P's Bandersnatch keys and no offender filtering is applied — offenders are skipped later by the guarantor assignment"],"answer":0,"optNotes":["eq. 6.14 與 6.15 完全對上：來源是 staging set ι，ring root 對 γ′_P 取，Φ 用 posterior ψ′_O。","輪換只在 e′ > e 發生，且新 pending set 的來源是 ι 而非 γ_P 自身，否則 ι 永遠進不了 κ。","錯兩處：ring root 必須對 γ′_P（下個 epoch 的提票 ring）取，且 disputes 先跑，用 posterior ψ′_O。","eq. 6.15 的 Φ 在輪換當下就把 offender 整把 key 歸零；§11 的 P(|κ′|, η′_2, τ′) 沒有排除機制。"],"explanation":"eq. 6.14：e′ > e 時 (γ′_P, κ′, λ′, γ′_Z) = (Φ(ι), γ_P, κ, z)，其中 z = O([k_b | k ∈ γ′_P])（ring root），否則四者不變。eq. 6.15：Φ(k) 把 k_e ∈ ψ′_O（posterior offenders，因為 disputes 已先處理）的 validator 整組換成全零 key。所以 staging set ι 要等**兩個** epoch 邊界才會成為 active（ι → γ_P → κ）。你們的 KeyRotate() 對應此式；ReplaceOffenderKeys 用的是 posterior ψ_O。","trap":"常考：ι 什麼時候變成 κ？答：下下個 epoch（先進 γ_P，再進 κ）。"},{"id":"ch06-valcount","ch":"6","section":"6.3 Key Rotation","gpRef":"eq. 6.7–6.8 (valcount)","difficulty":2,"kind":"delta","tags":["safrole","validators","delta-0.8.0"],"stem":"GP 0.8.0 (PR #514) generalized the validator-set size. Which sizes are permitted for ι, γ_P, κ and λ?","options":["Any multiple of 3 between 3 and 3·C − 3 = 1020 inclusive (N_V ≡ {3c | c ∈ N_{1..C}})","Any multiple of 3 between 6 and 3·C = 1023 inclusive (N_V ≡ {3c | c ∈ N_{2..C+1}})","Any size between 6 and 1023 inclusive, with no divisibility rule (N_V ≡ N_{6..3·C+1})","Exactly 1023 validators always — the size is the fixed constant 3·C with C = 341 cores"],"answer":1,"optNotes":["兩端各差一格：c 從 2 起算所以下界是 6，c 上限到 C+1 才使 3c 達到 3·C = 1023。","eq. 6.8 的 N_V ≡ {3c | c ∈ N_{2…C+1}}，即 6, 9, 12, …, 1023。","「3 的倍數」是硬條件：每個 active core 固定配 3 個 guarantor，非 3 倍數會讓 |κ′|/3 不整除。","那是 0.7.2 的世界觀；0.8.0 之後 ι、γ_P、κ、λ 各自的長度都可以是 N_V 裡的任一值。"],"explanation":"eq. 6.8：N_V ≡ {3c | c ∈ N_{2…C+1}}，即 6, 9, 12, …, 1023；§6.3：「The length of each sequence is always a multiple of 3 between 6 and 3C.」每個 active core 需要 3 個 guarantor，所以只有前 |κ′|/3 個 core 是 active（§11.3）。這是 0.7.2→0.8.0 的重大變化：很多常數改成依 |κ| 計算（例如 super-majority ⌊2|κ|/3⌋+1、tickets per validator n = ⌈2E/|γ′_P|⌉、erasure shards = |κ′|），designate host call 也只要求 z ∈ N_V。你們 repo 的 issue #1037 就是在追這個變動。","trap":"tiny 模式 V=6、C=2；full V=1023、C=341（1023 = 3·341）。"},{"id":"ch06-validator-key-layout","ch":"6","section":"6.3 Key Rotation","gpRef":"eq. 6.9–6.13","difficulty":1,"kind":"concept","tags":["safrole","validators","codec"],"stem":"A validator key K is a 336-octet sequence. What is the layout?","options":["Bandersnatch 32 | Ed25519 32 | BLS 144 | metadata 128","Bandersnatch 33 | Ed25519 32 | BLS 143 | metadata 128","Bandersnatch 32 | BLS 144 | Ed25519 32 | metadata 128","Ed25519 32 | Bandersnatch 32 | BLS 96 | metadata 176"],"answer":0,"optNotes":["eq. 6.9–6.13 的順序與長度：32 + 32 + 144 + 128 = 336。","Bandersnatch 公鑰是 32 octets、BLS 是 144；總長雖仍為 336，每個切點卻都偏了一格。","Ed25519 必須緊接 Bandersnatch 落在 offset 32，BLS 要到 offset 64 才開始。","前兩把的順序對調了，且 BLS 是 144 octets 不是 96（metadata 固定 128）。"],"explanation":"eq. 6.9–6.13：k_b = k[0..32)（Bandersnatch）、k_e = k[32..64)（Ed25519）、k_l = k[64..208)（BLS，144 octets）、k_m = k[208..336)（metadata，128 octets，opaque，用來放例如網路位址等實務識別資訊）。32+32+144+128 = 336。","trap":"BLS 144 octets（BLS12-381 上的 key 組合）。metadata 不參與任何密碼學運算。"},{"id":"ch06-entropy-update","ch":"6","section":"6.4 Sealing and Entropy Accumulation","gpRef":"eq. 6.22–6.24","difficulty":2,"kind":"concept","tags":["safrole","entropy"],"stem":"How is the entropy accumulator η updated in each block, and on an epoch change?","options":["η′_0 = H(η_0 ⌢ Y(H_V)) every block; the history rotates every block as well, so (η′_1, η′_2, η′_3) = (η_0, η_1, η_2) holds unconditionally and η_3 is always three blocks old","η′_0 = H(η_0 ⌢ Y(H_V)) every block, folding in the entropy VRF's output; on e′ > e additionally (η′_1, η′_2, η′_3) = (η_0, η_1, η_2), otherwise (η_1, η_2, η_3) unchanged","η′_0 = H(η_0 ⌢ H_V) every block, hashing the whole VRF signature rather than its 32-byte output; on e′ > e additionally (η′_1, η′_2, η′_3) = (η_0, η_1, η_2), otherwise unchanged","η′_0 = H(η_0 ⌢ Y(H_S)) every block, folding in the seal's VRF output; on e′ > e additionally (η′_1, η′_2, η′_3) = (η′_0, η_1, η_2), pushing the posterior accumulator into the history"],"answer":1,"optNotes":["違反 6.24 的 case 條件：每塊都推的話，η_2 就不再是上上個 epoch 結束時的累積值。","eq. 6.23 取的是 Y(H_V) 這個 VRF 輸出，eq. 6.24 的 rotate 只在 e′ > e 且推入 prior η_0。","6.23 餵進 hash 的是 VRF **輸出** Y(H_V)；簽章 bytes 本身不是那個 unbiasable 隨機值。","累積進 η_0 的是 H_V 的輸出；rotate 推入 posterior η′_0 更會把本塊 entropy 混進 η′_1。"],"explanation":"eq. 6.23：η′_0 ≡ H(η_0 ⌢ Y(H_V))——用 **prior** η_0 與 H_V 的 VRF **輸出** Y(·)（App. G 定義為 output 的前 32 bytes）做 Blake2b。eq. 6.24：e′ > e 時 (η′_1, η′_2, η′_3) = (η_0, η_1, η_2)，注意推入的是 prior η_0，否則三者不變。H_V 的簽章 context 是 X_E ⌢ Y(H_S)（eq. 6.18），也就是 seal 的 VRF 輸出，因此 entropy 是「先固定訊息、再產生」的 bias-resistant 來源；Y(H_S) 本身只拿來當 H_V 的 context 並與 ticket id 比對，不會直接進 η。你們 UpdateEtaPrime0() / UpdateEntropy() 分別對應 6.23 / 6.24。","trap":"H_V 的輸出餵 η′_0；H_S 的輸出（Y(H_S)）只作為 H_V 的訊息與 ticket id 比對。"},{"id":"ch06-which-eta-where","ch":"6","section":"6.4 Sealing and Entropy Accumulation","gpRef":"eq. 6.16–6.18, 6.25, 6.30, 11.22","difficulty":3,"kind":"concept","tags":["safrole","entropy"],"stem":"Each of η′_2 and η′_3 has specific uses in GP 0.8.0. Which assignment is correct?","options":["η′_1: ticket ring-proof context (X_T ⌢ η′_1 ++ r) and fallback key sequence F(η′_1, κ′); η′_2: verifying the seal signature context (X_T ⌢ η′_2 ++ i_e); η′_3: the guarantor assignment shuffle P(|κ′|, η′_3, τ′)","η′_0: ticket ring-proof context (X_T ⌢ η′_0 ++ r) and the guarantor assignment shuffle; η′_1: fallback key sequence F(η′_1, κ′) and seal verification; η′_2 and η′_3 are kept solely to populate the epoch marker H_E","η′_2: verifying the seal signature context (X_T ⌢ η′_2 ++ i_e or X_F ⌢ η′_2); η′_3: ticket ring-proof context (X_T ⌢ η′_3 ++ r), fallback key sequence F(η′_3, κ′), guarantor assignment shuffle","η′_2: ticket ring-proof context (X_T ⌢ η′_2 ++ r), fallback key sequence F(η′_2, κ′), guarantor assignment shuffle; η′_3: verifying the seal signature context (X_T ⌢ η′_3 ++ i_e or X_F ⌢ η′_3)"],"answer":3,"optNotes":["三個用途整組往前挪一格；eq. 11.22 明寫 G ≡ (P(|κ′|, η′_2, τ′), Φ(κ′))，用的是 η′_2。","η′_0 每塊都被 6.23 改寫，拿它當 ring proof context 會使同 epoch 內每塊 context 都不同。","方向剛好相反：提票在前用較新的那格，驗 seal 在後才用已 rotate 的最舊那格。","提票、fallback 與 guarantor 分配都用 η′_2，驗 seal 用晚一個 epoch 的 η′_3，正是 §6.4 的說法。"],"explanation":"tickets 在 epoch N 提交時用 η′_2（eq. 6.30 的 ring proof context X_T ⌢ η′_2 ++ r）；到 epoch N+1 驗 seal 時，那個值已經被 rotate 成 η′_3（eq. 6.16：X_T ⌢ η′_3 ++ i_e；6.17：X_F ⌢ η′_3），這就是 §6.4 說的「The oldest is used to regenerate this randomness when verifying the seal」。fallback F(η′_2, κ′)（6.25）與 guarantor 分配 P(|κ′|, η′_2, τ′)（11.22）也都用 η′_2；§11.3 解釋不用 η_1 是為了避免 epoch 末尾狀態不確定造成 fork magnification。epoch marker H_E 帶的則是 prior (η_0, η_1)，rotate 後即 η′_1、η′_2。","trap":"口訣：提 ticket 用 η2，驗 seal 用 η3（同一個值晚一個 epoch）。"},{"id":"ch06-seal-ticket-condition","ch":"6","section":"6.4 Sealing and Entropy Accumulation","gpRef":"eq. 6.16 (ticket seal)","difficulty":3,"kind":"concept","tags":["safrole","seal"],"stem":"When γ′_S is a sequence of tickets, the seal H_S must satisfy three conditions (eq. 6.16), with i = γ′_S[H_T mod E]. Which set is exactly right?","options":["i = H_A (the sealer entry is the author's own Bandersnatch key); H_S is a Bandersnatch signature by H_A over context X_F ⌢ η′_3 with message E_U(H) (the unsigned header); and the block is marked T = 0","i_y = H(H_S), the Blake2b hash of the seal bytes; H_S is a ring-VRF proof against γ′_Z over context X_T ⌢ η′_3 ++ i_e with message E(H) (the full header); and the block is marked T = 1 (ticketed)","i_y = Y(H_S); H_S is a Bandersnatch signature by H_A over context X_T ⌢ η′_3 ++ i_e with message E_U(H) (the unsigned header); and the block is marked T = 1 (ticketed)","i_y = Y(H_S); H_S is a Bandersnatch signature by H_A over context X_T ⌢ η′_2 ++ i_e with message E_U(H) (the unsigned header); and the block is marked T = 1 (ticketed)"],"answer":2,"optNotes":["那是 eq. 6.17 的 fallback 情況：i = H_A、X_F context、T = 0。","6.32 的 ticket id 是 VRF 輸出而非簽章 hash；訊息取完整 E(H) 更是循環定義（header 含 H_S）。","三個條件與 eq. 6.16 一字不差：Y(H_S) 對上該 slot 的 ticket id、η′_3 context、T = 1。","η′_2 是提交 ticket 時的 context；驗 seal 一律用已 rotate 的 η′_3。"],"explanation":"eq. 6.16：γ′_S ∈ [C] ⇒ { i_y = Y(H_S)（seal 的 VRF 輸出必須等於該 slot ticket 的 id，證明出塊者就是持票人）, H_S ∈ F^{X_T ⌢ η′_3 ++ i_e}_{H_A}(E_U(H)), T = 1 }。seal 是一般（IETF）Bandersnatch VRF 簽章，不是 ring VRF——ring 只在提交 ticket 時用；訊息則是省略 seal 欄位的 E_U(H)，否則簽章會簽進自己。你們的 sealing.go ValidateByBandersnatchs 就是檢查 Y(H_S) == ticket id。","trap":"E_U(H) = 不含 H_S 的 header 序列化；H_V 則是 context X_E ⌢ Y(H_S)、訊息為空 []。"},{"id":"ch06-slot-sealer-cases","ch":"6","section":"6.5 The Slot-Sealer Sequence","gpRef":"eq. 6.25","difficulty":2,"kind":"concept","tags":["safrole","fallback"],"stem":"The posterior slot-sealer sequence γ′_S has three cases. A block arrives with e′ = e + 1, the previous block was at slot phase m = 480 (< Y = 500) and γ_A holds 600 tickets. What is γ′_S?","options":["Z(γ_A) — the outside-in ordering of the accumulator, because e′ = e + 1 and |γ_A| = E both hold and the m ≥ Y clause constrains m′, the new block's phase, not the prior block's","γ_S — unchanged, because the second case of eq. 6.25 covers any block whose prior still sat inside the same epoch's ticket-submission window, and only m ≥ Y forces a fresh sequence","F(η_2, κ) — fallback keys, because m = 480 < Y does select the third case, but F is seeded with the prior η_2 and the prior active set κ that were in force while the previous block was authored","F(η′_2, κ′) — fallback keys, because eq. 6.25's first case also needs m ≥ Y and the prior block's phase is still inside the ticket-submission window, so the contest never closed"],"answer":3,"optNotes":["6.25 的 m 出自 τ（前一塊的 slot phase）；讀成 m′ 會讓本塊自己跨過 Y 就提前開票。","「γ_S 不變」的條件是 e′ = e（同一 epoch），本題 e′ = e + 1 已不適用。","F 的參數必須是 posterior：κ′（= 舊 γ_P）才是本 epoch 的 active set，η′_2 也已 rotate 過。","三條件缺一不可：m = 480 < Y = 500，比賽尚未封閉，即使 accumulator 已滿也得走 fallback。"],"explanation":"eq. 6.25：γ′_S ≡ Z(γ_A) 當 e′ = e+1 ∧ m ≥ Y ∧ |γ_A| = E；γ_S 當 e′ = e；否則 F(η′_2, κ′)。三個條件缺一不可，而 m 是 **prior** block 的 slot phase（來自 τ），這個門檻是要確認「比賽在上一塊時就已結束」。同理若跳過整個 epoch（e′ ≥ e+2）也走 fallback。fallback 一律以 posterior 的 η′_2 與 κ′ 為種子。你們 UpdateSlotKeySequence() 的三段 if 完全對應。","trap":"面試愛問邊界：(1) 跳過整個 epoch；(2) accumulator 未滿；(3) 前一塊 m < Y。全部都是 fallback。"},{"id":"ch06-outside-in-Z","ch":"6","section":"6.5 The Slot-Sealer Sequence","gpRef":"eq. 6.26 (Z)","difficulty":1,"kind":"concept","tags":["safrole","tickets"],"stem":"With a tiny epoch of E = 6 and a sorted accumulator γ_A = [a, b, c, d, e, f] (ascending ticket ids), what is Z(γ_A)?","options":["[a, f, b, e, c, d]","[a, b, c, d, e, f]","[a, c, e, f, d, b]","[f, a, e, b, d, c]"],"answer":0,"optNotes":["eq. 6.26 的 [s_0, s_{n−1}, s_1, s_{n−2}, …] 逐項對上。","那是原始的升冪序列，完全沒有做 outside-in 交錯。","那是「隔一個取一個」再折返，不是 6.26 的頭尾交錯。","頭尾起點反了：Z 從最小 id 起頭，不是從最大的那一張開始。"],"explanation":"eq. 6.26：Z(s) = [s_0, s_{n−1}, s_1, s_{n−2}, …]，「outside-in」交錯取頭尾。所以 [a,b,c,d,e,f] → [a,f,b,e,c,d]。目的：最佳（最小 id）的 ticket 與最差的 ticket 交錯散佈到整個 epoch，避免某段時間集中由同一批 validator 出塊。你們的 OutsideInSequencer() 用 left/right 兩個指標實作。","trap":"第一個 slot 是最小 id（s_0），第二個是最大 id。"},{"id":"ch06-epoch-marker","ch":"6","section":"6.6 The Markers","gpRef":"eq. 6.28","difficulty":2,"kind":"concept","tags":["safrole","markers"],"stem":"What exactly does the epoch marker H_E contain in the first block of a new epoch (e′ > e)?","options":["(η′_0, η′_1, [(k_b, k_e) | k ∈ κ′]) — the posterior η′_0 and η′_1 plus the Bandersnatch and Ed25519 keys of the validators that have just become active in this epoch","(η_2, η_3, [(k_b, k_e) | k ∈ ι]) — the two oldest historical entropies plus the Bandersnatch and Ed25519 keys of the staging set exactly as the designate host call left it","(η_0, η_1, Z(γ_A)) — the prior η_0 and η_1 plus the outside-in ordered ticket identifiers, one per timeslot, that will seal each slot of the coming epoch","(η_0, η_1, [(k_b, k_e) | k ∈ γ′_P]) — the prior η_0 and η_1 plus the Bandersnatch and Ed25519 keys of the pending validators γ′_P who take over in the next epoch"],"answer":3,"optNotes":["η′_0 已摻進本塊的 VRF 輸出；key 來源也錯，marker 預告的是下個 epoch 的 γ′_P 而非 κ′。","(η_2, η_3) 又更舊兩格；未經 Φ 過濾的 ι 會讓 light client 收到尚未歸零的 offender key。","Z(γ_A) 是 winning-tickets marker H_W（6.29）的內容，與 H_E 是 header 裡互斥的兩個欄位。","eq. 6.28 一字不差：prior (η_0, η_1) 加上已 Φ 過濾的 γ′_P 的 Bandersnatch + Ed25519 key。"],"explanation":"eq. 6.28：H_E ≡ (η_0, η_1, [(k_b, k_e) | k ∈ γ′_P]) 當 e′ > e，否則 ∅。η_0 與 η_1 是 **prior** 值（rotate 後就是 η′_1、η′_2，也就是下個 epoch 提 ticket 與 fallback 會用到的 entropy），加上 γ′_P（下一個 epoch 的 pending set，已經 Φ 過濾）的 Bandersnatch + Ed25519 key。目的（§6.6）：讓不同步完整 state 的節點（light client）只靠 header 鏈就能追蹤 validator 變化。你們 ValidateHeaderEpochMark（InvalidEpochMark = code 9）檢查此式。","trap":"H_E 放 γ′_P 不是 κ′；entropy 是 prior η_0/η_1。"},{"id":"ch06-winning-tickets-marker","ch":"6","section":"6.6 The Markers","gpRef":"eq. 6.29","difficulty":2,"kind":"concept","tags":["safrole","markers"],"stem":"Under which exact condition is the winning-tickets marker H_W non-empty?","options":["e′ > e ∧ m ≥ Y ∧ |γ_A| = E — the first block of a new epoch, once the previous epoch's tail has been reached and the accumulator is saturated; then H_W = Z(γ_A)","e′ = e ∧ Y ≤ m < m′ ∧ |γ_A| = E — every block of the epoch's tail after ticket submission has already closed, provided the accumulator is saturated; then H_W = Z(γ_A)","e′ = e ∧ m < Y ≤ m′ ∧ |γ_A| ≥ 1 — the first block of the same epoch whose slot phase crosses the tail start Y, with any non-empty accumulator; then H_W = Z(γ_A)","e′ = e ∧ m < Y ≤ m′ ∧ |γ_A| = E — the first block of the same epoch whose slot phase crosses the tail start Y, with a saturated accumulator; then H_W = Z(γ_A)"],"answer":3,"optNotes":["那組條件描述的其實是 slot-sealer 序列的第一個 case；進入新 epoch 才公告已經太遲。","少了 m < Y 這個下界，整段 tail 每一塊都會重複公告同一份序列。","Z 的定義域是長度 E 的序列；accumulator 未滿時下個 epoch 直接走 fallback。","eq. 6.29 的三個合取項完全對上：同一 epoch 內跨越 Y 的那一塊，且 accumulator 已飽和。"],"explanation":"eq. 6.29：H_W ≡ Z(γ_A) 當 e′ = e ∧ m < Y ≤ m′ ∧ |γ_A| = E，否則 ∅。即「同一 epoch 內，前一塊 phase 在 Y 之前、本塊 phase 在 Y 之後（含）」的那唯一一個區塊，且 accumulator 已飽和，就把下個 epoch 的最終 ticket 序列公告在 header；6.25 則在下個 epoch 的第一塊把同一份序列定案為 γ′_S。注意若 epoch 尾端沒有任何區塊跨越 Y（例如 m = 480 直接跳到下個 epoch），H_W 永遠不會出現。","trap":"H_W 與 H_E 互斥：H_W 要 e′ = e，H_E 要 e′ > e。"},{"id":"ch06-ticket-extrinsic-limits","ch":"6","section":"6.7 The Extrinsic and Tickets","gpRef":"eq. 6.30–6.32","difficulty":2,"kind":"delta","tags":["safrole","tickets","delta-0.8.0"],"stem":"Per GP 0.8.0, what bounds apply to the tickets extrinsic E_T?","options":["|E_T| ≤ E = 600 summed across the whole epoch rather than per block; each entry index e < n where n = ⌈2E / |γ′_P|⌉ — so 2 in the full configuration (E = 600, |γ′_P| = 1023)","|E_T| ≤ K = 16 in every block including those in the tail; each entry index e < N = 2, a fixed constant that does not depend on the validator-set size (E = 600, |κ| = 1023)","|E_T| ≤ K = 16 when m′ ≤ Y, otherwise |E_T| = 0; each entry index e < n where n = ⌈|γ′_P| / 2E⌉ — so 1 in the full configuration (E = 600, |γ′_P| = 1023)","|E_T| ≤ K = 16 when m′ < Y, otherwise |E_T| = 0; each entry index e < n where n = ⌈2E / |γ′_P|⌉ — so 2 in the full configuration (E = 600, |γ′_P| = 1023)"],"answer":3,"optNotes":["K 限制的是**單一區塊**的 extrinsic 大小；GP 對整個 epoch 的提交總量沒有直接上限。","tail 期間必須是空 extrinsic；把上限寫成固定常數 N = 2 也是 0.7.2 的舊寫法。","m′ = Y 那一塊已在 tail 內；比例倒過來更會變成 validator 越多、每人配額越少。","eq. 6.31 的 m′ < Y 與 eq. 6.30 的 n = ⌈2E/|γ′_P|⌉ 都對上，full 配置算出來是 2。"],"explanation":"eq. 6.30：E_T ∈ [(r ∈ N_n, p ∈ ring proof over γ′_Z with context X_T ⌢ η′_2 ++ r)]，n = ⌈2E/|γ′_P|⌉——0.8.0 (#527) 把原本的常數 N 改成公式，「To ensure the accumulator can be saturated, when there are fewer validators, each validator is permitted more tickets」。full：⌈2·600/1023⌉ = 2；test-vector 的 tiny 配置（E = 12、|γ′_P| = 6）：⌈24/6⌉ = 4（0.7.x 的 tiny 常數是 3，這是遷移時要改的點）。eq. 6.31：|E_T| ≤ K = 16 當 m′ < Y，否則必須為 0（tail 期間不能再提 ticket）。","trap":"條件是 m′ < Y（本塊的 phase），K = 16 是每個區塊的上限，不是每個 epoch。"},{"id":"ch06-ticket-accumulator-rules","ch":"6","section":"6.7 The Extrinsic and Tickets","gpRef":"eq. 6.33–6.36","difficulty":2,"kind":"concept","tags":["safrole","tickets"],"stem":"Which statement about the new tickets n and the posterior accumulator γ′_A is FALSE?","options":["Tickets with higher ids are preferred, so γ′_A keeps the highest E entries","Every submitted ticket must appear in γ′_A — a ticket that would be evicted by the accumulator's cap is useless and makes the extrinsic invalid","γ′_A is the lowest E entries of the sorted union of n and (γ_A, or ∅ if e′ > e)","n must be sorted ascending by ticket id and contain no duplicates, and no id in n may already be in γ_A"],"answer":0,"optNotes":["eq. 6.35 留下的是排序後**最低**的 E 個 ticket id，數值小者勝。","eq. 6.36 的 n ⊆ γ′_A：「It is invalid to include useless tickets in the extrinsic」——真的。","eq. 6.35 就是這麼寫的：排序後的聯集取最低 E 筆，跨 epoch 時起點換成空序列。","eq. 6.33 要求依 id 排序且唯一、6.34 要求與 γ_A 不相交——這句是真的。"],"explanation":"eq. 6.33：n 依 id 排序且唯一；6.34：n 的 id 與 γ_A 不相交；6.35：γ′_A = →(sort_by_id(n ∪ (∅ if e′ > e else γ_A)))^E，取的是排序後**最前面**（即最低）的 E 筆，§6.7 原文「the accumulator becomes the lowest items of the sorted union」；6.36：n ⊆ γ′_A，「It is invalid to include useless tickets in the extrinsic」。注意 §6.2 的行文說 γ_A 是「highest-scoring ticket identifiers」——GP 兩處措辭方向相反，實作一律以 6.35 的公式為準。你們 CreateNewTicketAccumulator() 排序後取 [:E]，GetPreviousTicketsAccumulator 在 e′ > e 時回傳空 accumulator。","trap":"「score」= ticket id（VRF 輸出），數值小者勝。"},{"id":"ch06-ticket-proof-context","ch":"6","section":"6.7 The Extrinsic and Tickets","gpRef":"eq. 6.30, 6.32","difficulty":2,"kind":"concept","tags":["safrole","tickets","vrf"],"stem":"A ticket proof p in E_T is a Bandersnatch ring-VRF proof. Against which ring root, with what context, and what is the ticket identifier?","options":["Against γ′_Z (the posterior ring root), context X_T ⌢ η′_2 ++ r, empty message []; the ticket id is the VRF output Y(p)","Against γ_Z (the prior ring root), context X_T ⌢ η′_3 ++ r, message E_U(H) (the unsigned header); the ticket id is the Blake2b hash H(p)","Against the Ed25519 keys of κ′ (the active set), context X_T ⌢ η_0 ++ r, empty message []; the ticket id is the proof p itself","Against γ′_Z (the posterior ring root), context X_E ⌢ Y(H_S), message E_U(H) (the unsigned header); the ticket id is the VRF output Y(p)"],"answer":0,"optNotes":["eq. 6.30 與 6.32 全對上：root 取 γ′_Z、context X_T ⌢ η′_2 ++ r、訊息為空、id = Y(p)。","prior γ_Z 會在 epoch 第一塊整批誤判；綁上 E_U(H) 更失去「先提交、後開票」的性質。","ring 由 γ′_P 的 Bandersnatch key 組成，曲線與集合都不對；proof 可重新隨機化，不能當 id。","X_E ⌢ Y(H_S) 是 H_V 的 context（6.18）；提票的當下根本還沒有 H_S 存在。"],"explanation":"eq. 6.30：p ∈ F̄^{X_T ⌢ η′_2 ++ r}_{γ′_Z}([])，ring proof 的驗證 root 是 γ′_Z（若本塊是 epoch 第一塊，γ′_Z 已換成新 pending set 的 root，因此 ticket 會針對**新** ring 驗證）；訊息為空序列；eq. 6.32：ticket id y = Y(p)（VRF 輸出），r 是 entry index。ring proof 讓驗證者知道「某個 γ′_P 成員」擁有此 ticket，但不知道是誰——這正是匿名性的來源。你們 createSignatureContext 就是 \"jam_ticket_seal\" + η′_2(32B) + attempt(1B)。","trap":"ring VRF 用在 ticket；一般 VRF 用在 seal 與 H_V。"},{"id":"ch06-seal-fallback","ch":"6","section":"6.4 Sealing","gpRef":"eq. 6.17–6.18","difficulty":2,"kind":"concept","tags":["safrole","seal","fallback"],"stem":"In fallback mode (γ′_S is a sequence of Bandersnatch keys), which checks apply to the header?","options":["γ′_S[H_T mod E] must equal H_A; no seal is required in fallback mode, there being no ticket identifier to bind it to; T = 0; and H_V alone is checked, with context X_E ⌢ η′_3 over []","γ′_S[H_T mod E] must equal the author's Ed25519 key; H_S is a ring-VRF proof against γ′_Z with context X_F ⌢ η′_3 over E_U(H); T = 1; and H_V is still required with context X_E ⌢ Y(H_S) over []","γ′_S[H_T mod E] must equal H_A; H_S is a Bandersnatch signature by H_A with context X_F ⌢ η′_3 over E_U(H); T = 0; and H_V is still required with context X_E ⌢ Y(H_S) over []","γ′_S[H_T mod E] must equal H_A; H_S is a Bandersnatch signature by H_A with context X_F ⌢ η′_2 over E_U(H); T = 0; and H_V is still required with context X_E ⌢ Y(H_S) over E_U(H)"],"answer":2,"optNotes":["6.17 仍要求 H_S，否則無從證明作者持有該 slot 指定的 key；H_V 的 context 也是 X_E ⌢ Y(H_S)。","三處都錯：γ′_S ∈ [H_B]_E 是 Bandersnatch key 序列，ring proof 只用於提票，fallback 的 T 必為 0。","eq. 6.17 的三個條件加上 6.18 的 H_V ∈ F^{X_E ⌢ Y(H_S)}_{H_A}([]) 全部對上。","驗 seal 一律用已 rotate 的 η′_3；6.18 的 H_V 訊息是空序列 []，不是 E_U(H)。"],"explanation":"eq. 6.17：γ′_S ∈ [H_B] ⇒ { i = H_A, H_S ∈ F^{X_F ⌢ η′_3}_{H_A}(E_U(H)), T = 0 }。eq. 6.18 對 ticket 與 fallback 兩種模式都適用：H_V ∈ F^{X_E ⌢ Y(H_S)}_{H_A}([])，也就是 entropy 在 fallback 下仍然每塊更新。三個 context 字串：X_F = $jam_fallback_seal、X_T = $jam_ticket_seal、X_E = $jam_entropy。T = 0 表示此塊「安全性較低」，§19 best-chain 規則會偏好 ticket-sealed 祖先較多的鏈。","trap":"fallback 的 entropy 仍然每塊更新（H_V 必填）。"},{"id":"ch06-code-slot-key-sequence","ch":"6","section":"6.5 The Slot-Sealer Sequence","gpRef":"eq. 6.25 — internal/safrole/sealing.go UpdateSlotKeySequence","difficulty":2,"kind":"code","tags":["safrole","code"],"stem":"This is the team's implementation of γ′_S. Which claim about it is correct?","code":{"lang":"go","caption":"internal/safrole/sealing.go (UpdateSlotKeySequence)","src":"if ePrime == e+1 && len(gammaA) == types.EpochLength && int(slotIndex) >= types.SlotSubmissionEnd {\n    // Z(γa) if e′ = e + 1 ∧ m ≥ Y ∧ |γa| = E\n    newGammaS.Tickets = OutsideInSequencer(&gammaA)\n} else if ePrime == e { // γs if e′ = e\n    newGammaS = cs.GetPriorStates().GetGammaS()\n} else { // F(η′2, κ′) otherwise\n    newGammaS.Keys = FallbackKeySequence(etaPrime[2], posteriorState.GetKappa())\n}\nposteriorState.SetGammaS(newGammaS)"},"options":["`slotIndex` should be m′ — the phase of the block being imported, H_T mod E — because eq. 6.25 asks whether the contest has closed by the current block; reading the prior block's τ mod E is an off-by-one","`slotIndex` is m — the slot phase of the PRIOR block (τ mod E) — and `gammaA` is the prior accumulator; `etaPrime[2]` and `posteriorState.GetKappa()` are posterior values, matching F(η′_2, κ′)","The first branch should also fire when ePrime ≥ e + 2 provided |γ_A| = E and m ≥ Y, since accumulated tickets stay valid until they are consumed; restricting it to e + 1 forces fallback needlessly","The fallback branch should pass the prior κ together with the prior η_2, since the incoming validators only gain authoring rights from the second block of the epoch onwards"],"answer":1,"optNotes":["換成 m′ 會讓「跨過 Y 的那一塊」立刻開票、少等一整段 tail——6.25 明寫的是 m。","6.25 的 m 出自 τ、F 的參數是 posterior，這段程式三處判斷都與公式一致。","跳過整個 epoch 後 ring root 與 η 都已再度 rotate，那些 ticket 是為 e+1 準備的。","epoch 第一塊完成 6.14 輪換之後，κ′（= 舊 γ_P）才是本 epoch 真正的 active set。"],"explanation":"eq. 6.25 的條件是 m ≥ Y，m 是 **prior** block 的 phase（τ 除以 E 的餘數），不是 m′——因為要確認「比賽已在前一塊之前結束」，這正是 fuzzer 愛打的邊界。F 的參數則是 η′_2 與 κ′（posterior）。e′ ≥ e+2（跳過整個 epoch）必須走 fallback，因為 accumulator 裡的 ticket 是為「e+1」那個 epoch 準備的，其 ring proof 針對的是當時的 γ′_Z。","trap":"你們的 OuterUsedSafrole 先做 UpdateEntropy、KeyRotate，再做 UpdateSlotKeySequence——順序正是為了讓 η′_2、κ′ 就位。"},{"id":"ch06-code-fallback-hash","ch":"6","section":"6.5 The Slot-Sealer Sequence","gpRef":"eq. 6.27 — internal/safrole/slot_key_sequence.go","difficulty":2,"kind":"code","tags":["safrole","code","fallback"],"stem":"Read the team's FallbackKeySequence. Which statement is accurate about its conformance to eq. 6.27?","code":{"lang":"go","caption":"internal/safrole/slot_key_sequence.go","src":"for i = 0; i < epochLength; i++ {\n    serial := utils.SerializeFixedLength(i, 4)          // E_4(i)\n    concatenation := append(entropy[:], serial...)      // r ⌢ E_4(i)\n    // H4 : Keccak256(serializedBytes) -> See section 3.8 , take only the first 4 octets of the hash,\n    hash := hash.Blake2bHashPartial(concatenation, 4)\n    validatorIndex, _ := utils.DeserializeFixedLength(types.ByteSequence(hash), types.U32(4))\n    validatorIndex %= (types.U32(types.ValidatorsCount))\n    keys[i] = validators[validatorIndex].Bandersnatch\n}"},"options":["The hash is right — Blake2b is the GP's H and the first 4 octets are decoded little-endian — but eq. 6.27's cyclic subscript reduces modulo the length of the key sequence passed in, i.e. |κ′|, whereas the code reduces modulo the compile-time constant ValidatorsCount","The slice is wrong — eq. 6.27's subscript takes the LAST four octets of H(r ⌢ E_4(i)) and decodes them big-endian, so Blake2bHashPartial(·, 4) reads the wrong end — while the modulus over ValidatorsCount matches the equation's cyclic subscript exactly","The reduction is spurious — decode_4 of four Blake2b octets already lands inside N_E and eq. 6.27 carries no modulus at all, so `%= ValidatorsCount` is an invented step that can map two distinct slots onto the same validator and break one-slot-one-author","The hash is wrong — §3.8 reserves H for Blake2b-256 but eq. 6.27 calls for H_K, Keccak-256, exactly as the surviving comment says — while the modulus is right, since the cyclic subscript reduces over the fixed validator count that ValidatorsCount holds"],"answer":0,"optNotes":["Blake2b 與「前 4 octets、小端」都對；問題在 `%= ValidatorsCount` 用編譯期常數而非 len(κ′)。","兩處都錯：s_{…4} 取的是**前** 4 個元素，且 decode 與 E_n 一律小端。","忽略了 6.27 外層的 ⟲：decode_4 的值域是 0…2³²−1，不取模必然越界。","被 stale 註解帶偏：§3.8 的 H 就是 Blake2b-256，而對固定 validator 數取模在 0.8.0 也不成立。"],"explanation":"eq. 6.27：k[decode_4(H(r ⌢ E_4(i))_{…4})]_b，外面套 ⟲（cyclic 索引）——也就是對**傳入的 key 序列長度** |k| = |κ′| 取模。H 是 Blake2b（§3.8：H ≡ Blake2b-256；H_K 才是 Keccak，只用在 accumulation-output belt 與 BEEFY）。這段 code 有兩個要點：(1) 註解寫 Keccak256 是 stale，實際呼叫的是 Blake2bHashPartial，行為正確；(2) `%= types.ValidatorsCount` 用的是編譯期常數，在 0.7.2（|κ| 恆等於 V）沒問題，但 0.8.0 允許 |κ| 變動後就必須改成 len(κ′)——這正是 issue #1037 要處理的一類問題。順帶一提，取模讓不同 slot 撞到同一個 validator 是 fallback 的正常行為而非缺陷——F 本來就是可重複抽樣。","trap":"面試官可能直接問：你們 fallback 用哪個 hash？答 Blake2b，並指出註解錯誤。"},{"id":"ch06-code-entropy-order","ch":"6","section":"6.4 Sealing and Entropy","gpRef":"eq. 6.23–6.24 — internal/safrole/sealing.go UpdateEntropy","difficulty":2,"kind":"code","tags":["safrole","code","entropy"],"stem":"In the team's UpdateEntropy, why is `eta[0]` overwritten with the posterior η′_0 AFTER the rotation loop, and what would go wrong if the loop ran after UpdateEtaPrime0 wrote into the same array?","code":{"lang":"go","caption":"internal/safrole/sealing.go","src":"eta := cs.GetPriorStates().GetEta()\nif ePrime > e {\n    for i := 2; i >= 0; i-- {\n        eta[i+1] = eta[i]          // (η′1, η′2, η′3) = (η0, η1, η2)\n    }\n}\n// This make sure we won't overwrite eta0\neta[0] = cs.GetPosteriorStates().GetEta0()\ncs.GetPosteriorStates().SetEta(eta)"},"options":["Because the descending loop is what stops η_0 from being copied into all three history slots; the write to eta[0] is independent of eq. 6.24 and could equally well run before the rotation","Because eq. 6.24 is stated over posterior values, (η′_1, η′_2, η′_3) = (η′_0, η′_1, η′_2), so η′_0 must be settled first and the assignment after the loop is a compensating fix-up for the wrong order","Because eq. 6.24 re-seeds the accumulator on an epoch change: η′_0 has to be reset after the rotation so the new epoch starts from a clean value, which is exactly what writing eta[0] last achieves","Because eq. 6.24 rotates the PRIOR η_0 into η′_1; if η′_0 (already hashed with this block's VRF output) were rotated instead, η′_1 would wrongly include the current block's entropy"],"answer":3,"optNotes":["正好說反：倒序確實避免了覆蓋，但**寫入時機**才是這段程式的核心。","6.24 右邊是 (η_0, η_1, η_2) 三個 prior 值；照 posterior 遞推會讓三格歷史被同一值填滿。","GP 沒有這個依據：6.23 每一塊都照 H(η_0 ⌢ Y(H_V)) 更新，epoch 邊界也不例外。","6.24 右側全是 prior 值；先寫 η′_0 會讓 η′_1 變成 H(η_0 ⌢ Y(H_V))，混進本塊的 entropy。"],"explanation":"eq. 6.24：(η′_1, η′_2, η′_3) ≡ (η_0, η_1, η_2)——右側全是 **prior** 值。η′_0 = H(η_0 ⌢ Y(H_V))（6.23）則已經包含本塊的 VRF 輸出。若先把 η′_0 寫進 eta[0] 再 rotate，η′_1 會變成 H(η_0 ⌢ Y(H_V))，導致下個 epoch 的 ticket context（用 η′_2）與 fallback 都算錯，state root 立刻 mismatch。這種「prior vs posterior」的細節正是 fuzzer 最常抓到的 bug 類型。","trap":"所有 Safrole 式子都要先問：右邊是 prior 還是 posterior？"},{"id":"ch07-beta-structure","ch":"7","section":"7 Recent History","gpRef":"eq. 7.1–7.4","difficulty":2,"kind":"concept","tags":["recent-history","state"],"stem":"In GP 0.8.0 the recent-history state is β ≡ (β_H, β_B). What does each recent block entry in β_H hold, and what is β_B?","options":["Each β_H entry: (header hash, posterior state root, extrinsic hash, timeslot); β_B is the set of BEEFY signatures gathered over the last H = 8 blocks, which is what lets a bridge prove finality without following the header chain","Each β_H entry: (header hash h, state root s, accumulation-output-log super-peak b, timeslot t, dictionary p of reported work-package hash → segment root); β_B is the accumulation-output belt, an MMR of per-block accumulation-output roots","β_H is a single rolling hash committing to the last H = 8 headers, so recent history costs only 32 octets of state; β_B is the four-entry entropy accumulator, rotated at each epoch boundary and re-seeded from every header's VRF output","Each β_H entry: (header hash, state root, timeslot, list of the hashes of every work-report guaranteed in the block); β_B is the sequence of the last H = 8 block headers, retained so that a lookup-anchor can be resolved straight out of state"],"answer":1,"optNotes":["H_X 只存在 header（eq. 5.1），β 的 item 不含它；β_B 裝的全是 accumulation-output root，一個簽章都沒有。","eq. 7.2 的五個欄位（含 0.8.0 新增的 timeslot t）與 eq. 7.3 的 Keccak MMR belt 完全吻合。","eq. 7.1–7.2 的 β_H 是最多 8 筆 tuple 的序列；四項的 entropy accumulator 是另一個狀態項 η。","eq. 7.8 建的 p 是 package hash ↦ segment root 的 dictionary，不是 report hash 清單；狀態裡從無 header 序列。"],"explanation":"eq. 7.2：β_H ∈ [(h ∈ H, s ∈ H, b ∈ H, t ∈ N_T, p ∈ D⟨H→H⟩)]_{:H}，H = 8。t（timeslot）是 0.8.0 新增欄位（配合 refinement context 的 anchor slot，#526）。p 是本塊 E_G 中每個 work-package hash → 其 segment root（exports root），供之後 report 的 prerequisite / segment-root lookup 驗證用。eq. 7.3：β_B ∈ [H?]（MMR 的 peaks，∅ 表示空 peak），用 Keccak。eq. 7.4：θ ∈ [(N_S, H)] 是本塊的 accumulation output（service, hash）序列。","trap":"0.8.0 β_H 有 5 個欄位（多了 timeslot）；p 的 value 是 segment root 不是 report hash。"},{"id":"ch07-beta-dagger","ch":"7","section":"7 Recent History","gpRef":"eq. 7.5 & 7.8","difficulty":2,"kind":"concept","tags":["recent-history","pipelining"],"stem":"Why does the newest β_H entry get state root s = H_0 (the zero hash) at the end of block N, and how is it corrected?","options":["Because β_H entries carry no state root at all: eq. 7.2 declares an item as ⟨h, b, t, p⟩ and the zero hash is only a placeholder that C(3) skips, so eq. 11.36 matches an anchor on its header hash, super-peak and timeslot alone","Because the root goes into β_B instead: each block appends its own posterior state root as the belt's next leaf, so the β_H item can leave s at H_0 permanently and an anchor's state root is checked against b","Because the posterior state root of block N is not yet known when β′ is computed (the header carries the prior root); block N+1 computes β† by overwriting the last entry's s with its own H_R (eq. 7.5) before anything reads β","Because a state root only matters once the block is finalized: the entry keeps H_0 until Grandpa finalizes block N, at which point the finality gadget writes the real root into that entry and eq. 11.36 starts accepting anchors on it"],"answer":2,"optNotes":["eq. 7.2 明列 s ∈ H 為第二個具名欄位，C(3) 讓它佔滿 32 bytes，eq. 11.36 也確實比對 x_s = y_s。","eq. 7.6–7.7 append 進 belt 的 leaf 由 θ′ 編碼而來，與 state root 無關；x_s 與 x_b 是兩個獨立比較。","eq. 7.5：補正者是下一個區塊，用自己 header 的 H_R 覆寫父塊那筆——§7 說 β′ 只用來定義 β†。","STF 是確定性函數，finality 從不回寫狀態；eq. 7.5 的補正發生在下一塊，與敲定無關。"],"explanation":"eq. 7.8：新 entry 為 (H(H), H_0, super-peak(β′_B), H_T, p)，§7 說明「The new state-trie root is the zero hash, which is inaccurate but safe since β′ is not utilized except to define the next block's β†」。eq. 7.5：β† ≡ β_H except β†[|β_H|−1]_s = H_R。所以每個 block 一開始（在驗 guarantee 的 anchor 之前）先用自己的 H_R 補正父塊的 state root。這是 header 帶 prior state root（pipelining）的直接後果。你們的 STF 在 τ′ 與 header check 之後、disputes 之前就算 β†。","trap":"guarantee 的 anchor 檢查（eq. 11.36）比對的是 β†（補正後），不是 β。"},{"id":"ch07-belt-keccak","ch":"7","section":"7 Recent History","gpRef":"eq. 7.6–7.7","difficulty":2,"kind":"rationale","tags":["recent-history","mmr","beefy"],"stem":"The accumulation-output belt β′_B = A(β_B, M_B(s, H_K), H_K) uses Keccak (H_K) rather than Blake2b. What is s and why Keccak?","options":["s = [E_4(service) ⌢ E(hash) for each (service, hash) in θ′]; Keccak is used 'to maximize compatibility with legacy systems'","s = the encoded header of the block being appended; Keccak is required because the Bandersnatch ring VRF transcript is defined over it","s = [H(g_w) for each guarantee g ∈ E_G]; Keccak is mandated so that Grandpa's finality votes can be checked by the same bridge contracts","s = the sequence of every work-report hash guaranteed in this block; Keccak is chosen because it costs less PVM gas than Blake2b"],"answer":0,"optNotes":["eq. 7.6 的 s 正是 θ′ 的 (service, hash) 編碼；§7 給的理由就是與 legacy 系統相容。","belt 的 leaf 來源是 θ′ 而非 header；附錄 G 的 ring VRF 有自己的建構，與 belt 雜湊選擇無關。","簽 belt super-peak 的是 BEEFY 的 BLS 簽章（eq. 18.1），Grandpa 完全不碰 belt。","work-report hash 只出現在 header 的 H_X 與 guarantee 簽章訊息；「省 PVM gas」不是 GP 給的理由。"],"explanation":"eq. 7.6：s = [E_4(s) ⌢ E(h) | (s,h) ∈ θ′]；eq. 7.7：β′_B ≡ A(β_B, M_B(s, H_K), H_K)——先用 well-balanced binary Merkle（M_B）以 Keccak 算出本塊 accumulation output 的 root，再用 MMR append（附錄 E.2）接到 belt 上。§7：「Throughout, the Keccak hash function is used to maximize compatibility with legacy systems」——EVM 有便宜的 keccak256 precompile，BEEFY（§18）就是對這個 belt 的 super-peak 做 BLS 簽章給外部系統（bridge）用，bridge 合約驗 belt 幾乎不花錢。你們的 recent_history_controller / mmr 都用 Keccak。","trap":"belt 是 MMR（append-only，peaks 序列），super-peak（E.2）才是單一 32-byte commitment。"},{"id":"ch07-purpose","ch":"7","section":"7 Recent History","gpRef":"§7 & eq. 11.36, 11.41–11.44","difficulty":1,"kind":"concept","tags":["recent-history"],"stem":"What is the primary purpose of retaining the H = 8 most recent blocks in β_H, according to the GP?","options":["To preclude duplicate or out-of-date work-reports: a guarantee's refinement-context anchor must appear in β† and its work-package hash must not already be a key of any recent block's reported-package map","To store the last 8 posterior state roots so that Grandpa voters can compare candidate chains without re-executing them, β_B holding the matching BLS signatures over those roots","To seed the fallback slot-sealer sequence: when the ticket contest falls short, F draws E = 600 Bandersnatch keys and the hashes of the last 8 blocks in β_H supply the randomness for that draw","To let light clients follow the chain without state: β_H is the only place the last H = 8 header hashes are kept, so a client walks them backwards instead of reading H_P out of each header"],"answer":0,"optNotes":["§7 第一句就是 preclude duplicate or out of date work-reports（eq. 11.36、11.41）。","最新一筆的 s 在本塊仍是 H_0、要等下一塊 β† 補正；β_B 是 output belt，不存任何簽章。","fallback key sequence F 的種子是 η′_2、抽的是 κ′ 的 Bandersnatch key（§6），與 β 無關。","每個 header 自帶 H_P 即可往回走，且 β 是狀態，light client 反而拿不到。"],"explanation":"§7 第一句：「This is used to preclude the possibility of duplicate or out of date work-reports from being submitted.」具體用途：(1) eq. 11.36：refinement context 的 anchor (hash, state root, belt super-peak, timeslot) 必須匹配 β† 的某一筆——所以 anchor 最多只能是 8 個區塊之前；(2) eq. 11.41：新 report 的 package hash 不得出現在任何 β 條目的 p 裡（防重複）；(3) eq. 11.42 / 11.44：prerequisites 與 segment-root lookup 必須在 extrinsic 或 β 的 p 裡找得到。","trap":"anchor 深度 ≤ 8 blocks；lookup anchor 深度 ≤ 14,400 slots（用 ancestors A）。"},{"id":"ch08-pool-queue-sizes","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 8.1","difficulty":1,"kind":"concept","tags":["authorization","state"],"stem":"What are the shapes of the authorizer pool α and authorizer queue φ?","options":["α ∈ [[H]_{:O}]_C with O = 8 (up to 8 authorizer hashes per core); φ ∈ [[H]_Q]_C with Q = 80 (exactly 80 per core)","α and φ are both dictionaries D⟨H → N_C⟩ from authorizer hash to core index, so no hash ever repeats and no per-core length bound is needed","α ∈ [[H]_{:Q}]_C with Q = 80 (up to 80 pooled per core); φ ∈ [[H]_O]_C with O = 8 (exactly 8 queued per core)","α ∈ [H]_C — one live authorizer per core, replaced every block; φ ∈ [[H]_E]_C with E = 600, one queue entry per epoch slot"],"answer":0,"optNotes":["eq. 8.1：pool 是最多 O = 8 的變長序列，queue 是固定長度 Q = 80，兩個常數不互換。","與 eq. 8.1 的型別直接衝突：兩者都是 per-core 序列，同一 hash 在同一 pool 重複完全合法。","O 與 Q 對調了：pool 上限 8、queue 剛好 80，這是最常見的記憶錯亂。","α[c] 是可容多個 hash 的序列（eq. 8.3 才需要移除最左邊一個）；queue 長度是獨立常數 Q，不隨 E 走。"],"explanation":"eq. 8.1：α ∈ [[H]_{:O}]_C，O = C_authpoolsize = 8（最多 8 個）；φ ∈ [[H]_Q]_C，Q = C_authqueuesize = 80（固定 80 個）。pool 是「現在可以用的 authorizer」，queue 是「未來每個 slot 依序補進 pool 的 authorizer」，rotation 取的是 H_T mod Q。φ 只能由 accumulate 中具 assigner 權限（χ_A[c]）的 service 透過 `assign` host call 修改。編碼上 C(1) 為 [var(x) | x ∈ α]、C(2) 為 E(φ)。","trap":"O = 8、Q = 80；pool 是 :O（可少於 8），queue 是固定長度 Q。"},{"id":"ch08-pool-update","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 8.2–8.3","difficulty":3,"kind":"concept","tags":["authorization","calc"],"stem":"Core c has pool α[c] = [a, b, a, d] (left = oldest) and a guarantee in E_G for core c whose report has authorizer a. With φ′[c][H_T mod Q] = x and O = 8, what is α′[c]?","options":["[b, d, x] — both copies of a are removed before x is appended, because a pool never holds the same authorizer twice","[x, a, b, a, d] — the queue entry is prepended at the head and the used authorizer is dropped only once the pool would exceed O = 8","[a, b, a, d, x] — x is appended and nothing is removed, since F(c) only trims the pool once it already holds O = 8 entries","[b, a, d, x] — the leftmost occurrence of a is removed, then x is appended, and the last O entries are kept"],"answer":3,"optNotes":["把兩個 a 都刪掉正是 bug #692：⊖ 是 seqminusl，pool 是序列、允許重複。","方向相反：eq. 8.2 把新項接在右邊，←(…)^O 丟掉的是最左邊（最舊）那個。","eq. 8.3 的條件是「E_G 裡存在 core c 的 guarantee」，與長度無關；長度只決定截斷。","⊖ 是 seqminusl（只砍最左一個）、x 接在尾端、長度 4 未達 O 不截斷，三步全對。"],"explanation":"eq. 8.2：α′[c] ≡ ←(F(c) ⌢ φ′[c][H_T mod Q])^O；eq. 8.3：F(c) = α[c] ⊖ {w_a}（⊖ 是「移除最左邊一個」的 seqminusl 運算）當 E_G 裡有 core c 的 guarantee，否則 α[c]。所以先移除最左邊那個 a → [b, a, d]，再 append x → [b, a, d, x]，長度 4 ≤ 8 不需截斷。每個區塊每個 core 都會 append 一個（即使沒有 guarantee），滿 8 時以 ←^O 保留**最後** 8 個（丟最舊）。你們的 authorization 模組註解：remove leftmost occurrence, append φ′[c][H_T mod Q], keep last 8。","trap":"H_T mod Q 用的是本塊 timeslot 對 80 取餘；用 posterior φ′。"},{"id":"ch08-authorizer-identity","ch":"8","section":"8.1 Authorizers and Authorizations","gpRef":"§8.1 & eq. 14.11 (§14.3; delta #522)","difficulty":2,"kind":"delta","tags":["authorization","delta-0.8.0"],"stem":"How is an authorizer identified in GP 0.8.0, and where is the authorization decision actually made?","options":["Authorizer = the Ed25519 key of the coretime purchaser, so α[c] is a list of up to O = 8 buyer keys and guarantors verify a signature by one of them over the work-package hash rather than executing any PVM code","Authorizer = the is-authorized code hash alone, with the configuration blob passed to Ψ_I separately; the block author runs that code while building the block and other validators trust the trace it publishes","Authorizer = H(PVM code hash ⌢ configuration blob); the is-authorized decision is made entirely in-core by the guarantors (Ψ_I), while on-chain logic only checks that the authorizer is in the core's pool","Authorizer = H(token ⌢ trace), so the pool entry commits both to the argument supplied with the package and to the output it produced; every validator therefore re-runs Ψ_I at block import to recompute that hash"],"answer":2,"optNotes":["eq. 8.1 的 α 裝的是 hash；§8.1 定義 authorizer 是跑在 G_I = 50M gas 下的 PVM 邏輯，不是驗簽。","eq. 14.11 的 p_a ≡ H(p_u ⌢ p_f) 已把 config 包進雜湊，且出塊者不會在鏈上跑 authorizer。","§8.1 原文：authorizer 是 PVM code hash ⌢ config blob 的雜湊；鏈上只驗 w_a ∈ α[w_c]。","把識別碼與執行結果搞混：authorizer 必須在任何執行之前就能拿去和 α[c] 比對。"],"explanation":"§8.1：「Authorizers are identified as the hash of their PVM code hash concatenated with their Configuration blob」（0.8.0 #522 統一了第 8 章與第 14 章的定義：work-package 帶 auth code hash h 與 config c，report 的 authorizer a = H(h ⌢ c)）。三個概念要分清：Token（隨 package 附的 opaque 資料）、Trace（成功授權時輸出的 opaque 資料，進 report 的 o 欄位）、Authorizer（在固定 gas G_I = 50M 下判斷是否授權的 PVM 邏輯）。「The process by which work-packages are determined to be authorized… happens entirely in-core」——不是 on-chain logic 的職責，鏈上只驗 w_a ∈ α[w_c]（eq. 11.32）。","trap":"on-chain 不執行 authorizer code；只查 pool。"},{"id":"ch08-why-authorization","ch":"8","section":"8 Authorization","gpRef":"§8 intro","difficulty":1,"kind":"rationale","tags":["authorization","rationale"],"stem":"What motivation does the GP give for the authorization system?","options":["To give each core its own gas market: guarantors bid for coretime block by block and the clearing price is recorded next to the authorizer hash in α[c], so a congested core costs more to use","To disentangle the intention of using some coretime from the specification and submission of a particular workload, so that JAM can support both Ethereum-style and Polkadot-style interaction patterns","To replace Grandpa's finality votes with per-core authorizer votes: a work-report is final once more than two thirds of the authorizers pooled for its core have signed it, which is what the bound O = 8 sizes","To cap how much work one service may submit: the pool's O = 8 entries act as a per-service rate limiter, so a service that already had a package reported this timeslot cannot have a second one guaranteed on any core"],"answer":1,"optNotes":["eq. 8.1 的 α 只裝 32-byte hash、沒有價格欄位，G_I / G_R 是協定常數，鏈上沒有競標。","§8 intro 的 disentangling the intention of usage…，買 coretime 與送 package 可分離。","authorizer 是一段 PVM 邏輯而不是簽名者；三分之二門檻屬於 availability assurance，與它無關。","α 是 per-core 而非 per-service，協定並未限制單一 service 能送幾份 package。"],"explanation":"§8 intro：Ethereum 的 gas 由交易作者當場購買（購買者 = 作者）；Polkadot 的 parachain slot 由團隊長期租用（購買者通常 ≠ 出塊者）。「On a principle of flexibility, we would wish JAM capable of supporting a range of interaction patterns both Ethereum-style and Polkadot-style… we introduce the authorization system, a means of disentangling the intention of usage for some coretime from the specification and submission of a particular workload」——這就是「買 coretime 的人」與「提交 work-package 的人」可以不同人的來源，連結到 §4.9.2 coretime 與 §14 的 is-authorized。","trap":"設計理念題常見；連結到 §4.9.2 coretime 與 §14 的 is-authorized。"},{"id":"ch09-account-fields","ch":"9","section":"9 Service Accounts","gpRef":"eq. 9.3","difficulty":2,"kind":"concept","tags":["accounts","state"],"stem":"Which of the following is NOT a field of a service account A in GP 0.8.0 (eq. 9.3)?","options":["a_p — the parent service index, i.e. the service that created this one","a_f — the gratis storage offset, a balance-denominated deposit credit","a_n — a nonce, incremented once on every accumulation of the service","a_m — the minimum gas required for each deferred transfer (minmemogas)"],"answer":2,"optNotes":["a_p（parent）是 eq. 9.3 的欄位之一，記錄建立這個帳戶的 service index。","a_f 確實列在 eq. 9.3，就是 a_t = max(0, … − a_f) 裡被扣掉的那筆 deposit credit。","service 不由私鑰控制、系統裡也沒有使用者交易，eq. 9.3 因此沒有 nonce 這一欄。","a_m 是 §9.1 的「每筆 deferred transfer 的最低 gas」，確實在 eq. 9.3 的欄位表裡。"],"explanation":"eq. 9.3：A ≡ (s storage, p preimages, l requests, f gratis, c codehash, b balance, g minaccgas, m minmemogas, r created, a lastacc, p parent)——十一個欄位，nonce 不在其中。§4.9.2 給了理由：「Since they are not controlled by a secret key, they do not need a nonce.」沒有私鑰控制、也沒有使用者交易，就沒有重放問題要防。兩個 gas 下限要分清：a_g minaccgas 是 per work-item，a_m minmemogas 是 per deferred-transfer。a_f（gratis）與 a_r/a_a/a_p 是 0.6.7～0.7.x 加入的 metadata；manager 才能建立帶 gratis 的 service（`new` 的 f ≠ 0 需要 manager 權限）。","trap":"兩個 gas 下限：a_g 每個 work-item 的 accumulate 最低 gas；a_m 每筆 deferred transfer 的最低 gas。"},{"id":"ch09-code-metadata","ch":"9","section":"9.1 Code and Gas","gpRef":"eq. 9.4","difficulty":2,"kind":"concept","tags":["accounts","code"],"stem":"How are a service's code a_c and metadata a_m derived from its code hash?","options":["The preimage of a_c in the account's own lookup a_p must decode as E(var(m), c) — a var-length metadata blob followed by the code; otherwise both are ∅","The preimage is fetched from the manager service χ_M's lookup, so all service code is held centrally; the leading 32 octets of that blob are the metadata","The code sits directly in the storage dictionary a_s under the key a_c, with the metadata under a_c ⌢ [0]; a missing entry leaves the service on its previous code","a_c is the Blake2b of the raw code alone and the metadata lives in the storage dictionary a_s; a missing preimage still leaves the code resolvable from its hash"],"answer":0,"optNotes":["eq. 9.4：(a_m, a_c) = (m, c) 當 E(var(m), c) = a_p[a_c]，兩者同來自這一份 preimage。","χ_M 的權力限於改 χ 與發 gratis credit，code 一律取自服務自己的 a_p；metadata 也不是固定 32 octets。","a_s 是 accumulate 才寫得到、refine 讀不到的 on-chain 存儲；查不到時給 (∅, ∅)，沒有沿用舊 code。","a_c 雜湊的是整個 E(var(m), c) 編碼而非裸 code，且 hash 反推不出 preimage。"],"explanation":"eq. 9.4：(a_m, a_c) = (m, c) 當 E(var(m), c) = a_p[a_c]，否則 (∅, ∅)。即 code hash 指向的、且必須在服務自己的 preimage lookup a_p 裡的那份 preimage，內容是「var-length metadata ⌢ code」的編碼；metadata 是 opaque（JIP-6 討論標準化）。code 走 preimage 而不走 storage 的理由在 §9.2：只有 preimage 是「available also in-core」的那一種，refine 根本讀不到 a_s。eq. 9.6 的不變式 (h ↦ d) ∈ a_p ⟹ h = H(d) 則固定了雜湊的對象；preimage 不在 state 裡，服務就是不能執行，refine 會回 BAD（eq. 11.7 的 BAD = code unavailable at lookup anchor）。entry points：0 = refine（in-core）、1 = accumulate（on-chain）（0.7.1 起 on_transfer 併入 accumulate）。","trap":"`new` 會在 requests 裡放 (c, l) → []，等待 preimage 被提供。"},{"id":"ch09-lookup-status","ch":"9","section":"9.2 Preimage Lookups","gpRef":"§9.2.2 Semantics, eq. 9.7","difficulty":2,"kind":"concept","tags":["accounts","preimages"],"stem":"A request entry a_l[(h, len)] holds a sequence of up to 3 timeslots. What does [x, y] mean, and what does [x, y, z] mean?","options":["[x, y]: the preimage was available from x and is unavailable since y; [x, y, z]: it was available from x until y and is available again since z","[x, y]: the preimage was requested at x and was first supplied at y; [x, y, z]: supplied at y and then expunged from state entirely at z","[x, y]: the preimage was available from x and was expunged from state at y; [x, y, z]: an illegal shape that no host call can ever produce","[x, y]: two distinct services requested the same preimage, one at x and one at y; [x, y, z]: three distinct services each requested it"],"answer":0,"optNotes":["兩個形狀都對上 §9.2.2：第二個時刻是轉為 unavailable，第三個是再次可用的起點。","序列裡不記 request 時刻——requested 的狀態就是空序列 []；z 標記的也不是刪除。","[x, y] 只是標成 unavailable，preimage 仍留在 a_p；[x, y, z] 是 §9.2.2 明列的合法形狀。","a_l 掛在單一服務帳戶底下，鍵是 (h, len)、值是這個服務自己的可用性歷史，不記請求者身分。"],"explanation":"§9.2.2：h = []：requested 未提供；[x]：自 x 起 available；[x, y]：曾於 x 可用、自 y 起 unavailable；[x, y, z]：x～y 可用、z 起再次可用。eq. 9.7 的 I(l, t)：[x] → x ≤ t；[x,y] → x ≤ t < y；[x,y,z] → x ≤ t < y ∨ z ≤ t；[] → ⊥。真正要移除還得靠 `forget`，而且要等 y < t − D。這個「歷史可用性」是為了 in-core refine 的 historical_lookup 能在任何 lookup-anchor 時點被確定性地重算（審計需要），所以狀態只往序列尾端追加。你們 `query` host call 把這四種狀態編成 φ_7/φ_8。","trap":"再次 solicit 一個 [x,y] 會變 [x,y,t]；forget 一個 [x] 變 [x,t]；forget [x,y]（y 夠舊）才真正刪除。"},{"id":"ch09-historical-lookup-calc","ch":"9","section":"9.2 Preimage Lookups","gpRef":"eq. 9.7 (Λ)","difficulty":2,"kind":"concept","tags":["accounts","preimages","calc"],"stem":"A service has preimage p (hash h, length 40) with a_l[(h, 40)] = [100, 250, 400]. Which statement about the historical lookup Λ(a, t, h) is correct?","options":["Λ returns p for any t ≥ 100","Λ returns p for t = 300 only","Λ returns p for t = 120 but ∅ for t = 450, since the last entry marks a second withdrawal","Λ returns p for t = 120 and t = 450, but ∅ for t = 300"],"answer":3,"optNotes":["把 [x, y, z] 讀成「自 x 起一直可用」，忽略了 y = 250 到 z = 400 的空窗。","剛好只認了空窗：250 … 400 才是 unavailable 的區間，t = 300 是唯一查不到的。","第三個時刻是「再次可用」的起點而不是第二次撤回，t = 450 ≥ 400 查得到。","三個時點依 x ≤ t < y ∨ z ≤ t 判定為 ✓/✗/✓，與這組答案完全相符。"],"explanation":"eq. 9.7：[x,y,z] 的條件是 x ≤ t < y ∨ z ≤ t。逐一代入：t=120：100 ≤ 120 < 250 ✓；t=300：不在 [100,250) 且 300 < 400 ✗；t=450：450 ≥ 400 ✓。Λ 還要求 h ∈ keys(a_p)（preimage 還在 state 裡），而 t 的定義域是 (H_T − D) … H_T，D = 19,200 slots（32 小時）——超過這個期間的 preimage 可能已被 expunge。","trap":"三個時間點的語意：available / unavailable / available again。"},{"id":"ch09-footprint-formula","ch":"9","section":"9.3 Account Footprint and Threshold Balance","gpRef":"eq. 9.8","difficulty":2,"kind":"concept","tags":["accounts","balance"],"stem":"How are the footprint a_i (items) and a_o (octets) and the threshold balance a_t defined?","options":["a_i = 2·|a_l| + |a_s|; a_o = Σ_{(h,z)∈keys(a_l)} (32 + z) + Σ_{(x,y)∈a_s} (32 + |y|); a_t = max(0, B_I·a_i + B_L·a_o − a_f)","a_i = 2·|a_l| + |a_s|; a_o = Σ_{(h,z)∈keys(a_l)} (81 + z) + Σ_{(x,y)∈a_s} (34 + |x| + |y|); a_t = max(0, B_S + B_I·a_i + B_L·a_o − a_f)","a_i = 2·|a_p| + |a_s|; a_o = Σ_{(h,d)∈a_p} (81 + |d|) + Σ_{(x,y)∈a_s} (34 + |x| + |y|); a_t = max(0, B_S + B_I·a_i + B_L·a_o − a_f)","a_i = |a_l| + |a_s|; a_o = Σ_{(h,z)∈keys(a_l)} (81 + z) + Σ_{(x,y)∈a_s} (34 + |x| + |y|); a_t = max(0, B_S + B_I·a_i + B_L·a_o)"],"answer":1,"optNotes":["固定開銷是 81 與 34 不是 32/32，storage 的 key 長度要計入，base deposit B_S 也不能漏。","完全對上 eq. 9.8：request 2 items / 81+z octets、storage 1 item / 34+|key|+|value|，門檻再扣 a_f。","求和應跑 requests dictionary a_l 的鍵 (h, z)、用宣告長度 z，不是跑 a_p 用實際 blob 長度。","request 的係數是 2·|a_l| 不是 1，而且 gratis offset a_f 必須從門檻裡扣掉。"],"explanation":"eq. 9.8：每個 lookup request 算 2 個 item 與 81+z octets（z 是宣告的 preimage 長度；81 是 GP 給定的固定開銷常數），每個 storage entry 算 1 個 item 與 34+|k|+|v| octets（34 同為固定開銷）。這些數字直接寫在 eq. 9.8 裡，面試時不需要推導、但要記得。a_t = max(0, B_S + B_I·a_i + B_L·a_o − a_f)，B_S = 100、B_I = 10、B_L = 1（appendix I），a_f 是 gratis 抵扣，扣到負數再由 max(0, ·) 夾回零。計價對象是 requests dictionary 而非已供應的 preimages，等於 solicit 一發出就開始收押金，防止免費占位。fuzzer 曾抓到你們少減 a_f（issue digest：因為 traces 的 DepositOffset 都是 0 所以一直沒發現）。","trap":"request 算 2 items；storage 算 1 item。"},{"id":"ch09-privileges","ch":"9","section":"9.4 Service Privileges","gpRef":"eq. 9.9–9.10","difficulty":2,"kind":"concept","tags":["accounts","privileges"],"stem":"The privileges state χ ≡ (χ_M, χ_V, χ_R, χ_A, χ_Z). Which mapping of privilege → power is correct?","options":["χ_M: the service that pays the accumulation gas of every other service; χ_V: the current active validator set κ; χ_R: the service that registers preimages on behalf of others; χ_A: the auditors drawn afresh in each tranche; χ_Z: services allowed to hold a zero balance","χ_M manager: may alter χ (bless) and grant gratis storage; χ_V delegator: may set ι (designate); χ_R registrar: may create services with indices below S = 2^16; χ_A assigners (one per core): may set φ[c] (assign); χ_Z: services that accumulate every block with a fixed gas allowance","χ_M manager: may alter χ (bless) and grant gratis storage; χ_V delegator: may set κ directly; χ_R registrar: may create services at any index; χ_A: one global assigner that sets φ for all cores; χ_Z: services that accumulate once per epoch","χ_M manager: may set ι (designate); χ_V delegator: may alter χ (bless); χ_R registrar: may set φ[c] (assign); χ_A assigners (one per core): may create services with indices below S = 2^16; χ_Z: services exempt from gas metering while they accumulate"],"answer":1,"optNotes":["eq. 9.9 的五個成分全是 service index，既不是 κ 也不是審計者集合；accumulate 的 gas 也沒有誰替別人付。","完全對上 §9.4：manager 改 χ 兼發 gratis、delegator 設 ι、registrar 開 protected range、assigner 逐 core 改 φ[c]。","delegator 設的是 ι 而非 κ（要經 γ_k 才輪到 κ，eq. 6.14）；registrar 只限 index < 2^16，assigner 逐 core，χ_Z 每塊都跑。","四種權力的持有者被互相對調；而 χ_Z 拿到的是每塊一份固定 gas 額度，一樣照 PVM 計量，不是免計 gas。"],"explanation":"§9.4 與 eq. 9.9：χ_M（manager）可改變 χ 並授予 storage deposit credits（gratis）；χ_V（delegator）可設定 ι（下下個 epoch 的 validator keys，透過 `designate`）；χ_R（registrar）可建立 index < S = 2^16 的受保護 service；χ_A ∈ [N_S]_C 每個 core 一個 assigner，可改 φ[c]（`assign`）；χ_Z ∈ D⟨N_S→N_G⟩ always-accumulate 服務與其每塊的基本 gas。GP 的敘述順序本身就是記憶點：「manager … able to effect an alteration of χ … as well as bestow services with storage deposit credits. The next, χ_V, is able to set ι. Then χ_R alone is able to create new service accounts with indices in the protected range. The following, χ_A, are the service indices capable of altering the authorizer queue φ, one for each core.」0.8.0 (#519) 把 `bless` 限制為只有 manager 可呼叫——之前的漏洞：任意 service 可 bless 自己成 manager 再用 `new` 取得 gratis storage。","trap":"registrar 是 0.7.1 加入的（Small service IDs）；0.8.0 bless 只限 manager。"},{"id":"ch09-preimage-vs-storage","ch":"9","section":"9.2 Preimage Lookups","gpRef":"§9.2 intro","difficulty":1,"kind":"rationale","tags":["accounts","preimages","rationale"],"stem":"The GP lists three differences between preimage lookups and general storage. Which is NOT one of them?","options":["Preimage data, once supplied, goes through an 'unavailable' period before it may be removed, so that its historical availability is retained","Preimage data is supplied extrinsically (via E_P), whereas storage data originates from the service's own accumulation","Preimages may be removed instantly by the service, whereas storage entries are retained for 28 days","Preimages map a hash to its preimage, whereas storage maps arbitrary keys to values"],"answer":2,"optNotes":["這正是 §9.2 的第三個差異：供應後要先標成 unavailable，過一段時間才能移除。","這是 §9.2 列出的差異之一：preimage 由 E_P 外部提供，storage 由服務自己的 accumulate 寫入。","方向剛好說反：GP 說的是 preimage「may not be removed freely」，被綁住的是 preimage 不是 storage。","這是 §9.2 的第一個差異：一邊是 hash 對應其 preimage，一邊是任意 key 對 value。"],"explanation":"§9.2：三個差異——(1) hash→preimage vs 任意 key→value；(2) preimage 由 extrinsic 外部提供，storage 由 accumulate 產生；(3) preimage「once supplied, may not be removed freely; instead it goes through a process of being marked as unavailable, and only after a period of time may it be removed」。理由：refine 在 in-core 用 historical_lookup 查 preimage，審計時必須能確定「當時是否可用」，所以移除只能走這種可追溯的兩段式流程。","trap":"forget 後要等 D = 19,200 slots 才能真正刪除。"},{"id":"ch10-state","ch":"10","section":"10.1 The State","gpRef":"eq. 10.1","difficulty":1,"kind":"concept","tags":["disputes","state"],"stem":"The disputes state is ψ ≡ (ψ_G, ψ_B, ψ_W, ψ_O). What do the four components hold?","options":["ψ_G and ψ_B are sets of work-report hashes judged correct and incorrect; ψ_W is the queue of verdicts still short of the ⌊2|k|/3⌋+1 threshold; ψ_O is the balance slashed from each offender","ψ_G, ψ_B and ψ_W are sets of the validator indices which respectively guaranteed, audited and disputed a report; ψ_O is a set of the report hashes that have been judged invalid","ψ_G, ψ_B and ψ_W are sets of work-package hashes judged respectively correct, incorrect and impossible to judge; ψ_O is a set of the Bandersnatch keys of validators found to have misjudged a report","ψ_G, ψ_B and ψ_W are sets of work-report hashes judged respectively correct, incorrect and impossible to judge; ψ_O is a set of the Ed25519 keys of validators found to have misjudged a report"],"answer":3,"optNotes":["eq. 10.4 要求 verdict 進鏈時票數恰好，鏈上沒有待補佇列；JAM 也不在 ψ_O 記罰沒餘額。","三個集合裝的是 report hash 本身而不是誰投過票，且把 ψ_O 說成 report hash 正好相反。","judgment 針對的是 work-report（hash 為 H(E(w))），而 punish-set 用的是 Ed25519 key。","eq. 10.1 的前三者都是 work-report hash 集合，ψ_O 則是 Ed25519 key 的 punish-set。"],"explanation":"eq. 10.1：ψ ≡ (ψ_G, ψ_B, ψ_W, ψ_O)。前三者都是 **work-report hash** 的集合：good（判定正確）、bad（判定錯誤）、wonky（無法判定）；ψ_O 是 punish-set，裝的是 **Ed25519 key**（不是 index，因為 validator 集合每個 epoch 會變），供 Φ 在換屆時把 offender 的 key 清零，也供上層 staking 系統 slash——§10 明說 JAM 自己不動餘額。§10 說明 verdict 很少發生，但是「an important security backstop for removing and banning invalid work-reports from the processing pipeline」。","trap":"報告是 report hash H(E(w))；offender 用 Ed25519 key（不是 index，因為 validator 集合每個 epoch 會變）。"},{"id":"ch10-verdict-structure","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.2–10.4","difficulty":2,"kind":"delta","tags":["disputes","delta-0.8.0"],"stem":"Per GP 0.8.0, which statement about the verdicts component E_V of the disputes extrinsic is correct?","options":["Each verdict is (report hash, epoch index a ∈ {⌊τ/E⌋, ⌊τ/E⌋−1}, judgments); judgments must number at least ⌊2|k|/3⌋+1 and may be drawn from κ ∪ λ combined; there is no per-extrinsic cap on verdicts","Each verdict is (report hash, epoch index a ∈ {⌊τ/E⌋, ⌊τ/E⌋−1}, one aggregated BLS signature over the report hash); the signers must be ⌊2|k|/3⌋+1 members of k; at most N_V = 16 verdicts per extrinsic","Each verdict is (report hash, epoch index a ∈ {⌊τ/E⌋, ⌊τ/E⌋−1}, judgments); judgments must number exactly ⌊2|k|/3⌋+1 where k = κ if a is the current epoch else λ; at most N_V = 16 verdicts per extrinsic","Each verdict is (report hash, the timeslot at which the dispute was raised, judgments); judgments must number exactly ⌊|k|/3⌋+1 where k is always the posterior set κ′; at most N_V = 16 verdicts per extrinsic"],"answer":2,"optNotes":["eq. 10.4 是「恰好」不是「至少」；K(a) 只取 κ 或 λ 之一；0.8.0 #525 正是新增 N_V = 16。","judgment 是 [(⊤/⊥, N, Ed25519 sig)] 序列、每票須可個別驗證；BLS 只用於 Beefy commitment。","epoch index、恰好 ⌊2|k|/3⌋+1 票、K(a) 二選一、N_V = 16 四點全中 eq. 10.2–10.4。","第二欄是 epoch index 而非 timeslot；⌊|k|/3⌋ 是 wonky 門檻；K(a) 取 prior 的 κ/λ 不是 κ′。"],"explanation":"eq. 10.2：E_V ∈ [(H, ⌊τ/E⌋ − N_2, [(⊤/⊥, N, Ed25519 sig)])]_{:N_V}，N_V = 16（0.8.0 #525 新增硬上限）；E_C、E_F 各最多 N_O = 16。eq. 10.3：K(a) = κ 當 a = ⌊τ/E⌋（prior τ 的 epoch），否則 λ；每個 verdict 必須恰好包含 ⌊2|k|/3⌋+1 個 judgment（tiny：5；full：683），每個 judgment 由 k[i]_e 對 X_valid/X_invalid ⌢ report hash 簽名（X = $jam_valid / $jam_invalid）。每票依 index 排序、可個別驗證，事後才能被引用來構造 fault。你們 Verdict.Validate 檢查 ValidatorsSuperMajority 個票。","trap":"epoch index 用 prior τ；票數是「恰好」不是「至少」。"},{"id":"ch10-verdict-thresholds","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.12 (V)","difficulty":2,"kind":"concept","tags":["disputes","calc","tiny"],"stem":"A verdict's outcome depends on t, the number of positive judgments among the ⌊2|k|/3⌋+1 signatures. In the tiny config (|k| = 6), which (t → outcome) table is correct, and what happens for any other t?","options":["t ≥ 4 → good (⊤); t ≤ 1 → bad (⊥); t ∈ {2, 3} → wonky (∅); no other t can occur","t = 5 → good (⊤); t = 0 → bad (⊥); t = 2 → wonky (∅); any other t makes the block invalid","t = 6 → good (⊤); t = 1 → bad (⊥); t = 2 → wonky (∅); any other t is silently ignored","t = 5 → good (⊤); t = 0 → bad (⊥); t = 3 → wonky (∅); any other t makes the block invalid"],"answer":1,"optNotes":["三個門檻都是等式不是區間，而且分裂票（t = 4、t = 1）正是 dispute 最可能的結果。","tiny |k| = 6 代入 eq. 10.12 的三個等式：⌊4⌋+1 = 5、0、⌊2⌋ = 2，其餘 t 皆無定義。","good 是 ⌊2|k|/3⌋+1 = 5 不是全票 6，bad 是 0 不是 1，落空的 t 也不會被忽略。","wonky 門檻是 ⌊|k|/3⌋ = ⌊6/3⌋ = 2 而不是 3；good 與 bad 這兩個值倒是對的。"],"explanation":"eq. 10.12：V(a, j) = ⊤ 當 t = ⌊2|k|/3⌋+1；⊥ 當 t = 0；∅ 當 t = ⌊|k|/3⌋。tiny |k| = 6：⌊4⌋+1 = 5、0、⌊2⌋ = 2；full |k| = 1023：683、0、341。三個門檻都是**等式**而不是區間，落在它們之外的 t 讓 V 無定義 → 整個區塊無效（你們的 code 回 `bad_vote_split`），而不是忽略該 verdict。註腳：這三個門檻恰是三種動作的決策門檻，且安全假設要求 ≥ 2/3+1 的 validator 是 live 的（ELVES 論文）。","trap":"wonky 是「剛好 1/3 正票」，不是「介於中間」。"},{"id":"ch10-culprits-faults","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.6–10.7, 10.13","difficulty":3,"kind":"delta","tags":["disputes","delta-0.8.0"],"stem":"Which statement about culprits (E_C) and faults (E_F) is correct in GP 0.8.0?","options":["A culprit names a report in ψ′_B plus that guarantor's signature over X_G ⌢ r; a fault names a report whose claimed validity v contradicts the verdict (r ∈ ψ′_B ⇔ r ∉ ψ′_G ⇔ v); keys already in ψ_O may be re-reported to punish a repeat offender; every verdict, good, bad or wonky, needs ≥ 1 fault","A culprit names a report in ψ′_B plus that guarantor's signature over X_G ⌢ r; a fault names a report whose claimed validity v agrees with the verdict (r ∈ ψ′_G ⇔ v); offender keys must lie in (κ ∪ λ)'s Ed25519 keys minus ψ_O; a bad verdict needs ≥ 2 culprits and a good one ≥ 1 fault","A culprit names a report in ψ′_G plus that guarantor's judgment signature over X_valid ⌢ r; a fault names a report in ψ′_W whose claimed validity v contradicts the verdict; offender keys must lie in κ′'s Ed25519 keys alone; a good
