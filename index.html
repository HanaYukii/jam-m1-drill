n":"JIP-4 chainspec `protocol_parameters` = fetch(0) encoding (App. B), 0.7.2 → 0.8.0","gpRef":"App. B fetch selector 0 (0.8.0 vs 0.7.2); JIP-4; JIP-5","difficulty":3,"kind":"delta","tags":["jip","chainspec","fetch","delta-0.8.0","code-gap"],"stem":"JIP-4 defines a chainspec's `protocol_parameters` as the JAM-serialized parameter blob in the encoding of `fetch` selector 0. Comparing GP 0.7.2 with 0.8.0, which statement is correct?","options":["The blob is unchanged between 0.7.2 and 0.8.0 (33 fixed-width little-endian fields, 134 bytes); 0.8.0 instead moved V and N into the genesis header's epoch marker H_E, so a chainspec must repeat the validator count there and a node reads the ticket count from the first epoch marker it imports; existing decoders therefore need no change beyond also parsing H_E","0.8.0 drops four fields — N (tickets per validator, now ⌈2E/|γ′_P|⌉), V (validator count, now implied by the validator sets in the genesis state), W_E and W_P (erasure-coding sizes, now derived from the validator count) — shrinking the blob from 33 fields / 134 bytes to 29 fields / 122 bytes; parsers and any 'apply parameters' code that still overwrites tickets-per-validator, validator count or EC sizes from it must change","0.8.0 adds fields for the new gas-model constants (C_gasunknown and the host-call base costs) and for the audit constants F and A so that services can read them via fetch(0); V stays in the blob because validator sets may now vary and a service must know the set size to compute erasure-coding parameters for its exports, so the blob grows from 33 fields / 134 bytes to 41 fields / 168 bytes","0.8.0 keeps all 33 fields but switches them from fixed-width little-endian integers to the general compact encoding E(x), so the blob length now depends on the values (e.g. 1,023 versus 6 validators); JIP-4 widened the `genesis_state` keys from 31 to 32 bytes at the same time so that the state trie can be loaded without re-hashing, and a tiny chainspec now encodes to well under 122 bytes"],"answer":1,"explanation":"JIP-4：chainspec JSON 有 id、bootnodes（`<name>@<ip>:<port>`，name 是 53 字元 DNS 名：'e' ＋ base-32 Ed25519 公鑰）、genesis_header（JAM-serialized header 的 hex）、genesis_state（「Each key is a 62-character hex string defining the 31-byte state key」，值為任意長度 hex）、protocol_parameters（「A hex string containing JAM-serialized protocol parameters. Encoding matches protocol parameters returned by the fetch host call」）。0.7.2 的 fetch(0)（App. B Ω_Y，φ_10 = 0）依序為 E_8(B_I, B_L, B_S)、E_2(C)、E_4(D, E)、E_8(G_A, G_I, G_R, G_T)、E_2(H, I, J, K)、E_4(L)、E_2(N)、E_2(O, P, Q, R, T, U)、E_2(V)、E_4(R_A, W_B, W_C)、E_4(R_E)、E_4(R_M)、E_4(R_P)、E_4(R_R, W_T, W_X, Y)——33 欄、134 bytes。0.8.0 的 Ω_Y 只剩 29 欄：B_I, B_L, B_S, C, D, E, G_A, G_I, G_R, G_T, H, I, J, K, L, O, P, Q, R, T, U, W_A, W_B, W_C, W_M, W_R, W_T, W_X, Y，共 7×8 + 11×2 + 11×4 = 122 bytes。原因：#527 把每人票數 N 改為公式 ⌈2E/|γ′_P|⌉（tiny 4、full 2）；#514 允許可變驗證者集合（|κ| ∈ {3c | c ∈ [2, C+1]}，來自 genesis state 的 ι/κ/λ，不再是常數）；App. H 的 erasure coding 改以 d(v) = max{d ∈ N_{v/3+2} | W_G mod 2d = 0} 由 v 推導，所以 W_E／W_P 消失（W_G = 4104 仍是常數但本來就不在 blob 裡）。仍不在 blob 內的：A、F（審計）、C_gasunknown 等 gas 常數、Z_*（PVM），所以「加入 gas/audit 常數」錯；編碼仍是固定寬度 little-endian（不是 E(x)），31-byte state key 也沒變；epoch marker H_E 只帶 entropy 與下一 epoch 的 Bandersnatch/Ed25519 keys，不放 V/N，所以「33 欄／134 bytes 原封不動、解碼器不用改」也錯——欄位由 33 減為 29、長度由 134 減為 122 bytes，凡是照舊從 blob 覆寫 N/V/W_E/W_P 的程式都必須改。「成長到 41 欄／168 bytes」與「tiny 會編到遠低於 122 bytes」同樣不成立：前者列的 gas／audit 常數根本不在 Ω_Y 裡，後者預設改用變長的 E(x)，但 0.8.0 仍是固定寬度 little-endian，所以 tiny 與 full 的 blob 一樣都是 122 bytes。團隊程式：types.ProtocolParameters（types.go:1683）仍是 0.7.2 的 33 欄（含 N、V、WE、WP）；ApplyProtocolParameters（protocol_parameters.go）先斷言不可變常數（B_I, B_L, B_S, P, H, O, Q, I, J, U, G_A, G_I, W_A, W_B, W_C, W_R, W_T, W_M, W_X, T）再覆寫 C, D, E, G_R, G_T, K, L, N, R, V, W_E, W_P, Y——升到 0.8.0 時解碼順序要拿掉 N/V/W_E/W_P，V 改由 genesis state 取得，N 改用公式；#1035/#1022 已示範過 erasure 參數與驗證者數不一致會悄悄改變 erasure root。同一份 blob 也是 service 透過 fetch(0) 看到的（appB-fetch）。JIP-5 補充：dev 驗證者金鑰由 blake2b('jam_val_key_ed25519' ++ seed)／blake2b('jam_val_key_bandersnatch' ++ seed) 推導，trivial_seed(i) = 8 × E_4(i)，不含 BLS（internal/keystore/jip5_key_derivation.go）。","trap":"0.8.0 的 chainspec 不再告訴你 V——驗證者數量要數 genesis state 裡的 κ/ι；tiny 的 N 也不再是 3 而是 ⌈2·12/6⌉ = 4。"},{"id":"arch-fuzz-protocol-m1","ch":"ARCH","section":"jam-conformance fuzz protocol & the M1 evaluation pipeline","gpRef":"davxy/jam-conformance fuzz-proto README; w3f/jam-milestone-delivery PRs","difficulty":2,"kind":"concept","tags":["conformance","fuzzer","history","m1"],"stem":"Which description of the jam-conformance fuzz protocol that the W3F used for the M1 audit is correct?","options":["A synchronous request/response protocol over a Unix domain socket the target binds; messages are JAM-codec encoded with a u32 little-endian length prefix; after a PeerInfo handshake (features = bitwise AND of both sides) the fuzzer sends Initialize (header, state key-vals, ancestor list) then ImportBlock requests, each answered by the posterior state root or an Error (state unchanged); a root mismatch triggers GetState; ancestry and forks are mandatory for M1","A file-based protocol: the fuzzer writes numbered block .bin files into a shared directory and the target writes post-state JSON beside them; the handshake is a version file rather than a PeerInfo exchange, so there is no feature negotiation and ancestry and forks are always on; on the first state-root mismatch the run stops, no report is produced, and the submission is failed for that GP version","A TCP stream on which the target dials the fuzzer and sends the first handshake message; blocks are SCALE-encoded behind a u16 big-endian length prefix; the fuzzer diffs a full state dump after every block rather than a root, an invalid block is signalled by simply omitting the response, and the ancestry feature is optional for M1 because lookup-anchor checks bind block authors rather than importers","A JSON-RPC 2.0 session over WebSockets (port 19800) that the fuzzer binds and the target dials; blocks travel as hex strings and each importBlock call is answered with the header hash rather than a state root; a rejected block closes the connection, ancestry is reconstructed by the fuzzer from a finalizedBlock subscription instead of being supplied, and forks are never generated because Safrole precludes equivocation"],"answer":0,"explanation":"davxy/jam-conformance fuzz-proto README：「a synchronous request-response protocol over Unix domain sockets」，target 綁定具名 SOCK_STREAM socket（例 /tmp/jam_target.sock），只有 fuzzer 發起請求、target 回覆後才有下一個；「All messages are encoded according to the JAM codec format. Prior to transmission, each encoded message is prefixed with its length, represented as a 32-bit little-endian integer」。訊息：PeerInfo（discriminant 0x00，含 fuzz_version、fuzz_features、jam_version、app_version、app_name；fuzzer 先送、target 再回）；Initialize（header＋state key-vals＋開啟 ancestry 時的 ancestor list）→ StateRoot（0x02）；ImportBlock → StateRoot 或 Error（0xff；「the target must return an Error message and then wait for the next block」，狀態不變）；GetState → State（整個 key-val 儲存）。「Session features are determined by the intersection (bitwise-and) of the features listed in the PeerInfo message」；M1 必備：feature-ancestry（Initialize 帶祖先清單以做 GP 規定的 lookup-anchor 檢查，tiny 最多 24 筆）與 feature-forks（fuzzer 以突變 block 製造 fork，主鏈只從原始 block 延伸）。判定：每次 import 後比對 state root，「When a state root mismatch is detected the fuzzer attempts to fetch the whole state from the target to produce a comprehensive fuzz report」。干擾項錯處：JSON-RPC／WebSocket 19800 是 JIP-2 的節點 RPC 而非 fuzz 協定，回傳的是 posterior state root 而不是 header hash；被拒的 block 不會關閉連線（回 Error 後等下一塊），ancestor 清單由 Initialize 帶入而不是 fuzzer 從 finalizedBlock 訂閱自行推回，forks 對 M1 是必備——而且 Safrole 只保證每個 slot 單一 sealer，並不「使 equivocation 不可能」，否則就不需要 disputes 與 best-chain 規則了。TCP、SCALE、u16 big-endian、target 先握手全錯（實際是 Unix socket、JAM codec、u32 little-endian、fuzzer 先送 PeerInfo）；每塊比對的是 state root，只有 mismatch 時才用 GetState 抓整份狀態；無效 block 一定回明確的 Error（0xff）而不是略過回應；ancestry 對 M1 必備，lookup-anchor 正是 importer 端的鏈上檢查（§11 的 report 有效性條件）。沒有目錄／檔案協定，握手也不是版本檔——feature 是雙方 PeerInfo 清單的 bitwise-and 協商結果；mismatch 也不會立刻中止，反而要接著產出 comprehensive fuzz report。M1 流程：W3F 以 GP 0.7.2 target 跑「1 million steps」（結果推到 fuzz-reports/0.7.2）→ Parity 審核 → Fellowship 錄音面試（rule 12）→ Fellows track referendum 以 remark「approves in full」批准（#595–#598）。團隊：internal/fuzz/messages.go 的型別（PeerInfo=0、SetState=1〔即 Initialize 的舊名〕、StateRoot=2、ImportBlock=3、GetState=4、State=5、Error=255）；#785 拒絕 block 時回 Error 並保持 pre-state root；#828 trace 中全零 post-state root 代表「必須拒絕」；#991/#983 fuzz 模式依 MaxLookupAge（tiny 24）修剪狀態；config.DefaultConfig().Info 就是送出的 PeerInfo（FuzzVersion 1）。","trap":"Error 回應 = block 被拒但連線繼續、狀態不變；runtime panic 才是真正的 bug——你們的 STF 以 *types.ErrorCode 區分 protocol error 與 runtime error。"},{"id":"arch-prize-interview-rule12","ch":"ARCH","section":"JAM Prize rules (rule 12) & milestone-delivery T&Cs","gpRef":"jam.web3.foundation/rules #12; T&C 3.5 / 6.1 / 8.4; delivery template","difficulty":1,"kind":"concept","tags":["prize","history","interview"],"stem":"According to the JAM Prize rules and the milestone-delivery terms, what is the purpose and standing of the post-submission interview?","options":["It is a mandatory oral defence of the performance tests (gas, trie/DB, signature verification, availability) that the Foundation runs on standard hardware; it is conducted by W3F staff rather than the Fellowship and is not recorded, rule 12 covering only authorship of the benchmark harness, generative-AI use being handled separately under the clean-room rule, and by design the outcome cannot change the prize awarded","It may be requested after submission to verify that team members are the legitimate authors (precluding generative AI) with definitive expertise on both the Gray Paper and their own codebase; the delivery template commits the team to a recorded interview by the Polkadot Technical Fellowship, ratified by an on-chain Fellowship remark, and failing to prove expertise may reduce the prize or disqualify the team","It is an optional Q&A with Parity's auditors about findings from the conformance fuzzer; passing it replaces the need to pass the public and private conformance tests, the outcome is recorded off-chain by the Foundation rather than ratified by the Fellowship on-chain, and because it is optional a team that declines simply waits for the next review window with no effect on its prize","It is a code-review session limited to the PVM and host-call implementation; teams that used generative AI may still pass provided they declared it up-front in the delivery document, the interviewers are drawn from the team's own client-implementation peers, and the only possible consequence of a poor showing is that payment is deferred until version 1.0 of the protocol is ratified"],"answer":1,"explanation":"jam.web3.foundation/rules 第 12 條原文：「An interview may be requested after submission to ensure team members are the legitimate authors of the code. This precludes the use of generative AI. The interview will seek to ensure the individual has definitive expertise on both the Graypaper and their own codebase. INABILITY TO PROVE THIS EXPERTISE MAY RESULT IN A REDUCED PRIZE OR FULL DISQUALIFICATION.」milestone-delivery 範本的聲明：「we agree to a recorded interview by the Polkadot Technical Fellowship on any matter arising from this milestone submission」與「this milestone submission will need to be ratified with an on-chain remark by the Polkadot Technical Fellowship before it can be merged」。T&C 6.1：Foundation 可在提交後要求面試以釐清；T&C 3.5：conformance 以評估當時最新 GP release 為準（所以 0.8.0 差異必考）；T&C 8.4：M1 可在 GP 1.0 批准前付款（2026 年 2 月的 early acceptance 修訂），其餘里程碑不行；rule 9：不得實質使用生成式 AI；rule 6：clean-room。評審是 Polkadot Fellowship（排除涉入該實作的成員，Gav 的 HackMD）。實際流程（2026）：W3F fuzz（1M steps，GP 0.7.2）→ Parity audit → Fellowship 面試 → Fellows referendum（#595–#598 的 remark「approves in full」，暗示部分核准也可能）。干擾項錯處：把面試說成效能測試的答辯、由 W3F 員工主持且不錄影、又說 rule 12 只管 benchmark harness 的著作權——效能測試是 rule 5 獨立的要求（gas、trie/DB、簽章驗證、availability，由 W3F 在標準硬體跑），rule 12 針對的是整份程式的 authorship 與 expertise 且「This precludes the use of generative AI」（不是丟給 clean-room 條款處理），主持者是 Polkadot Technical Fellowship、範本明文是 recorded interview，而且結果「MAY RESULT IN A REDUCED PRIZE OR FULL DISQUALIFICATION」，當然會影響獎金。說它是可選的 Parity Q&A、可取代 conformance tests、由 Foundation 鏈下記錄、拒絕也無代價：面試由 Foundation 依 T&C 6.1 提出且範本已承諾配合，rule 20 要求「must pass all relevant public and private conformance/performance tests」不可被面試取代，核准是 Fellows track 的 on-chain remark（#595–#598），拒絕或無法證明專業度可導致減額或取消。說範圍只有 PVM 與 host call、生成式 AI 只要事先申報即可、由同語言的實作同儕面試、最壞只是延到 1.0 才付款：範圍是 GP 全文（ch. 3–13＋附錄，外加 architecture／rationale／PVM 三個加分段）與自家程式；rule 9 是「must not be used in any substantive way」而非申報制；評審是 Fellowship 且「excluding members involved in the implementation being voted on」；付款時點由 rule 21／T&C 8.4 規範（M1 更是唯一可在 GP 1.0 批准前付款的里程碑），與面試結果是兩回事。","trap":"面試考兩件事：你「寫了」這份程式（authorship），以及你「懂」GP 與自己的程式（expertise）——回答時把 GP 條文與自家 code 路徑一起講。"},{"id":"ch03-sequence-set-subscripts","ch":"3","section":"3.7 Sequences","gpRef":"§3.7 (⟦T⟧, ⟦T⟧_n, ⟦T⟧_{:n}, ⟦T⟧_{n:}, ⟦T⟧_N); applied in eq. 8.1 and eq. 6.22","difficulty":2,"kind":"concept","tags":["notation","sequences","types"],"stem":"Eq. 8.1 types the authorizer pool and queue as α ∈ ⟦⟦H⟧_{:O}⟧_C and φ ∈ ⟦⟦H⟧_Q⟧_C, and eq. 6.22 types the entropy as η ∈ ⟦H⟧_4. Using the sequence-set notation of GP §3.7, what do these subscripts say?","options":["All three denote sequences of exactly that many hashes; the colon in ⟦H⟧_{:O} only marks that the pool is indexed cyclically (H_T mod O) rather than from zero","⟦H⟧_{:O} is the set of hash sequences of length at most O, ⟦H⟧_Q of length exactly Q and ⟦H⟧_4 of length exactly 4; the outer ⟦·⟧_C means exactly one inner sequence per core","⟦H⟧_{:O} denotes the first O elements of a hash sequence (a slice), so α is an O-element prefix of each core's queue, and ⟦H⟧_Q denotes the single element at index Q","⟦H⟧_{:O} is the set of hash sequences of length at least O (a pool must be kept full), while ⟦H⟧_Q and ⟦H⟧_4 are sequences of length at most Q and at most 4 respectively"],"answer":1,"explanation":"GP §3.7：⟦T⟧ 是元素取自 T、長度任意的序列集合（定義一個 ℕ → T 的 partial mapping）；⟦T⟧_n 是「containing exactly n elements」（complete mapping ℕ_n → T）；「sets of sequences of at most n elements and at least n elements may be denoted ⟦T⟧_{:n} and ⟦T⟧_{n:} respectively」；⟦T⟧_N 則是長度落在集合 N 內。因此 eq. 8.1 的 α ∈ ⟦⟦H⟧_{:O}⟧_C 表示每個 core（C = 341 個、恰好一條）有一條**至多** O = 8 個 authorizer hash 的 pool——可以未滿甚至為空；φ ∈ ⟦⟦H⟧_Q⟧_C 每 core **恰好** Q = 80 個；eq. 6.22 η ∈ ⟦H⟧_4 恰好 4 個 entropy 值。「至少 O」把 :n 與 n: 的方向弄反了；「前 O 個元素」把型別標記與切片語法（切片寫 s_{…n} 或 →s^n）混為一談；「cyclic index」是 ⟲ 上標（s[i]^⟲ ≡ s[i mod |s|]）的事，與型別無關。你們的 Go 型別完全對應：`AuthPool.Validate` 只檢查 len ≤ AuthPoolMaxSize(8)，`AuthQueue.Validate` 要求 len == AuthQueueSize(80)，兩者外層都要求 len == CoresCount（internal/types/types.go §8.1 區段）。","trap":"冒號在前（_{:n}）= 上限、冒號在後（_{n:}）= 下限、沒冒號 = 恰好；pool 可空、queue 固定 80。"},{"id":"ch03-first-last-n-arrows","ch":"3","section":"3.7.2 Editing","gpRef":"§3.7.2 (⌢, ⧺, →s^n, ←s^n) and §3.7 (⟲); applied in eq. 7.8, eq. 8.2 and eq. 6.35","difficulty":2,"kind":"concept","tags":["notation","sequences","arrows"],"stem":"Three state-transition rules use the arrow operators of GP §3.7.2: β_H′ ≡ ←(β_H† ⧺ e)^H (eq. 7.8), α′[c] ≡ ←(F(c) ⧺ φ′[c][H_T]^⟲)^O (eq. 8.2) and γ′_A ≡ →(n ∪ γ_A sorted ascending by ticket id)^E (eq. 6.35). Which reading is correct?","options":["←^n keeps the first n elements and →^n the last n: β_H′ and α′[c] therefore drop the newest entry once they are full, while γ′_A keeps the E largest ticket ids","Both arrows keep n elements counted from the front; the direction only records whether the sequence was extended with ⧺ (append at the right) or with ⌢ (prepend at the left)","→^n keeps the first n elements and ←^n the last n: β_H′ and α′[c] retain the H = 8 and O = 8 most recently appended entries, while γ′_A retains the E = 600 smallest ticket ids","The arrows are cyclic rotations by n positions, the same operation as the ⟲ superscript, so β_H′ and α′[c] behave as ring buffers whose oldest slot is overwritten in place"],"answer":2,"explanation":"GP §3.7.2：「We denote the sequence made up of the first n elements of sequence s to be →s^n ≡ [s_0, s_1, …, s_{n−1}], and only the final elements as ←s^n」。同節定義 ⌢ 為序列串接、⧺ 為元素接尾（x ⧺ i ≡ x ⌢ [i]）——兩者都接在**右側**，沒有 prepend 語意；§3.7 的 s[i]^⟲ ≡ s[i % |s|] 是模數索引，所以 φ′[c][H_T]^⟲ = φ′[c][H_T mod Q]（Q = 80）。因此 eq. 7.8 的 β_H′ 先把新區塊的 entry 接在最右、再用 ←^H 保留**最後** H = 8 筆（丟掉最舊）；eq. 8.2 同理保留最後 O = 8 個 authorizer；eq. 6.35 的 γ′_A 對排序後的聯集取 →^E，即最前面 E = 600 個 = ticket id **最小**者（GP 原文：「the accumulator becomes the lowest items of the sorted union」）。「keeps the E largest」方向相反；「兩個箭頭都從前面數」忽略了 ← 的定義；「rotation」把截斷與 ⟲ 索引混為一談（β_H、α 是會縮短/成長的序列，不是原地覆寫的 ring buffer）。你們的 code：`alpha[c] = alpha[c][len-8:]`（authorization.go）、ticket accumulator 升冪排序後 `[:EpochLength]`（extrinsic_tickets.go）、`AddItem2BetaHPrime` 滿 8 筆時 `copy(historyPrime, historyDagger[1:])` 丟最舊。","trap":"箭頭指向哪邊就留哪邊：→ 留頭、← 留尾。§3.4 另有 % 為 mod、「5 ÷ 3 = 1 R 2」為商餘寫法（§6.1 的 e R m = τ/E 即 e = ⌊τ/E⌋、m = τ mod E）。"},{"id":"ch03-bits-msb-first-trie","ch":"3","section":"3.7.3 Boolean values","gpRef":"§3.7.3 bits(); eq. D.5–D.6 (M_σ, M); App. C.1.4 (bit-sequence encoding); eq. A.15 (PVM ℬ_n)","difficulty":3,"kind":"code","tags":["notation","bits","merklization","codec"],"stem":"GP §3.7.3 defines bits(B) for an octet sequence B by the example bits([160, 0]) = [1, 0, 1, 0, 0, …], and M_σ (eq. D.5) keys the state trie by bits(k) of the 31-octet state key. The team's trie splits entries at each depth with the code below. Is it consistent with the GP?","code":{"lang":"go","caption":"internal/utilities/merklization/merklization.go (partitionByBit)","src":"func partitionByBit(entries []types.StateKeyVal, depth int) int {\n\tbyteIdx := depth / 8\n\tbitMask := byte(1 << (7 - depth%8))\n\tleft := 0\n\tfor right := range entries {\n\t\tif entries[right].Key[byteIdx]&bitMask == 0 {\n\t\t\tentries[left], entries[right] = entries[right], entries[left]\n\t\t\tleft++\n\t\t}\n\t}\n\treturn left\n}"},"options":["Yes: 160 = 0b10100000, so bits() emits each octet's most significant bit first; masking key[depth/8] with 1 << (7 − depth mod 8) walks the path in exactly that order","No: bits() is MSB-first, but the first bit of every node is the branch/leaf discriminator, so the key path must skip bit 0 of key[0] and the mask should start at 1 << (6 − depth mod 8)","No: bits() is least-significant-bit first, matching the codec's bit-sequence encoding E(b ∈ 𝕓) which packs b_i into 2^i, so the mask must be 1 << (depth mod 8)","No: bits() is MSB-first, but M_σ keys the trie by bits(H(k)) — the Blake2b hash of the state key — so the partition must be taken over H(k) rather than the raw key"],"answer":0,"explanation":"GP §3.7.3：bits(B) 是「the sequence of bits, ordered with the most significant first, which represent the octet sequence B」，160 = 0b10100000 → [1,0,1,0,0,0,0,0]。eq. D.5：M_σ(σ) ≡ M({bits(k) ↦ (k, v) | (k ↦ v) ∈ T(σ)})，eq. D.6 依 key 的第一個 bit 分左右子樹（k_0 = 0 → 左、1 → 右）再遞迴，所以深度 d 對應 key[d/8] 的第 (7 − d mod 8) 位——`partitionByBit` 正確。陷阱一：App. C.1.4 的 E(b ∈ 𝕓)「pack the bits into octets in order of least significant to most」（b_i 放在 2^i），因此 bits() **不是** E(𝕓) 的反函數：E(bits([160])) = [5] ≠ [160]；你們的 assurance bitfield 解碼 `(bytes[i/8] >> (i%8)) & 1`（types.go `MakeBitfieldFromByteSlice`）是 LSB-first、對應 codec，兩處各自都對，混用才錯。陷阱二：PVM 的 ℬ_n（eq. A.15）也是 LSB-first（y[i] = ⌊x/2^i⌋ mod 2）且作用在自然數上，與 §3 的 bits() 是不同函數。「bits(H(k))」是 Ethereum MPT 的做法（keccak(key) 當 path），JAM 直接用 31-octet state key；「跳過 bit 0」把 node encoding（eq. D.3：branch node 第一個 bit 為 0、左子樹 hash 只取後 255 bits）和 key path 混為一談——discriminator 在 node 裡、不在 key 裡。","trap":"bits() = MSB-first（trie path）；E(𝕓)、PVM ℬ_n = LSB-first（bitfield、暫存器）。"},{"id":"ch03-vrf-signature-notation","ch":"3","section":"3.8.2 Signing Schemes","gpRef":"§3.8.2; applied in eq. 6.16 (seal), eq. 6.18 (H_V), eq. 6.30 (ticket proof) and eq. 6.32 (ticket id = Y)","difficulty":3,"kind":"concept","tags":["notation","crypto","vrf","safrole"],"stem":"GP §3.8.2 writes a Bandersnatch VRF signature as Ṽ_k^m⟨x⟩ ⊂ B_96 with VRF output Y(·) ∈ H, and eq. 6.16 requires H_S ∈ Ṽ_{H_A}^{E_U(H)}⟨X_T ⌢ η′_3 ⧺ i_e⟩. Which statement is correct?","options":["Ṽ is the anonymous Ring-VRF form: H_A is a ring root over the validator keys and the signer cannot be identified, whereas the identifying form V̊ ⊂ B_784 is the one tickets use","k = H_A is the signer's public key, the superscript E_U(H) is the signed message and the angle-bracketed term is the context; Y(H_S) is determined by the key and the context but not by the message","The angle brackets carry the message and the superscript the context, so Y(H_S) depends on the header serialization E_U(H); this is what lets the seal's VRF output commit to the block content","Y(H_S) is a 96-octet value; the 32-octet ticket identifier i_y is obtained as H(Y(H_S)), and Ed25519 signatures V̄_k⟨m⟩ likewise define a VRF output"],"answer":1,"explanation":"GP §3.8.2：Bandersnatch 簽名 Ṽ_k^m⟨x⟩ 的下標 k 是公鑰、上標 m 是訊息、⟨⟩ 內的 x 是 context（LaTeX 巨集 \\bssignature{k}{x}{m} 排版成 Ṽ_k^m⟨x⟩）；「both define a VRF output, a high entropy hash influenced by x but not by m」。所以 eq. 6.16 的 seal 以未簽名 header E_U(H) 為訊息、X_T ⌢ η′_3 ⧺ i_e 為 context，Y(H_S) 只由金鑰與 context 決定——這正是 i_y = Y(H_S)（ticket id 在上一個 epoch 就能驗）以及 eq. 6.18 H_V ∈ Ṽ_{H_A}^{[]}⟨X_E ⌢ Y(H_S)⟩ 能當作 bias-resistant entropy 的原因：作者改動 header 內容不會改變 VRF output。「⟨⟩ 是訊息」只對 Ed25519 的 V̄_k⟨m⟩ 成立（它沒有 context），對 Bandersnatch 是反的；「Ṽ 是匿名 ring form」說反了——GP：「the member is identified in the former [Ṽ] and is anonymous in the latter [V̊]」，ring proof V̊_r^m⟨x⟩ ⊂ B_784 用 ring root r ∈ B̊ ⊂ B_144（由 O(keys) 算出）識別，而 H_A 是單一公鑰、不是 ring root；「Y 是 96 octet、i_y = H(Y)」錯：Y(·) ∈ H 本身就是 32 octet，eq. 6.16 直接令 i_y = Y(H_S)，而且 Ed25519 沒有 VRF output。你們的 `createSignatureContext`（extrinsic_tickets.go）組的就是 ⟨⟩ 裡的 context（$jam_ticket_seal ⌢ η′_2 ⧺ attempt），訊息為空。","trap":"Ṽ_k^m⟨x⟩：下標鑰、上標訊息、⟨⟩ context；Y 看 context 不看訊息。Ṽ 具名 96 B、V̊ 匿名 784 B、V̄ Ed25519 64 B。"},{"id":"ch03-hash-functions-and-codec-subscripts","ch":"3","section":"3.8.1 Hashing","gpRef":"§3.8.1 (H, H_K, H_0, E_l and E^{-1}_l assertions); Keccak applied in eq. 7.7","difficulty":2,"kind":"concept","tags":["notation","hashing","codec"],"stem":"Per GP §3.8.1, which statement about the hash functions and the subscripted codec functions is correct?","options":["H is Keccak-256 as in the Yellow Paper and H_K is Blake2b-256; the subscript on E counts the octets of the input, so E_4 accepts only arguments already in B_4 and E^{-1}_8 only naturals below 2^64","H is Blake2b-256 and H_K is Keccak-256, both into H ≡ B_32; a non-blob argument is implicitly passed through E; E_4(x) asserts x ∈ N_2^32 and yields B_4, and E^{-1}_8(y) asserts y ∈ B_8 and yields N_2^64","H is Blake2b-256 and H_K is Keccak-256; hashing a tuple is undefined unless it is written explicitly as H(E(…)), and E_4 is the general variable-length natural encoding capped at four octets","H is Blake2b-512 truncated to 32 octets and H_K is Keccak-256; H_0 denotes H([]), the hash of the empty blob, which is also how M_σ identifies an empty sub-trie"],"answer":1,"explanation":"GP §3.8.1：「H denotes the set of 256-bit values equivalent to B_32. All hash functions in the present work output to this type and H_0 is the value equal to [0]_32」；H(m ∈ B) 是 Blake2b 256-bit（RFC 7693）、H_K(m ∈ B) 是 Keccak 256-bit（Ethereum YP 所用）。「The inputs of a hash function should be expected to be passed through our serialization codec E to yield an octet sequence… (Note that an octet sequence conveniently yields an identity transform.)」——所以 H(H)、H(E_4(s) ⌢ E(h)) 這類寫法不需要明寫 E，tuple 直接放進 H 也是合法的。下標：「we may subscript the transformation function with the number of octets we expect the octet sequence term to have. Thus, r = E_4(x ∈ N) would assert x ∈ N_2^32 and r ∈ B_4, whereas s = E^{-1}_8(y ∈ B) would assert y ∈ B_8 and s ∈ N_2^64」——下標是**octet 序列那一端**的長度（App. C.1.7 固定長度 little-endian），不是「輸入長度」、也不是 compact 編碼的上限。Keccak 只用於 β_B accumulation-output belt（eq. 7.7，「to maximize compatibility with legacy systems」），header hash、state trie、erasure root 等都是 Blake2b。「H_0 = H([])」錯：H_0 是 32 個零 octet，App. D 的空 sub-trie 也是用這個零 hash 而非 H([])。你們的 `internal/utilities/hash/hash.go`：`Blake2bHash` / `KeccakHash`。","trap":"H = Blake2b、H_K = Keccak、H_0 = 32 個 0；E_l 的 l 指 octet 長度那一端；tuple 進 H 隱含先 E。"},{"id":"ch03-dictionary-semantics","ch":"3","section":"3.5 Dictionaries","gpRef":"eq. 3.7–3.11; 𝒰 in eq. 3.2; ∅ / A? / ∇ in §3.3","difficulty":2,"kind":"concept","tags":["notation","dictionaries","calc"],"stem":"Let d = {1 ↦ a, 2 ↦ b} and e = {2 ↦ c, 3 ↦ a} be dictionaries in ⟨N → B⟩. Applying GP §3.5 (eq. 3.7–3.11), which statement is correct?","options":["d ∪ e is undefined because key 2 collides — dictionary union is only defined when K(d) ⫰ K(e), which is why the GP always writes (d ∖ K(e)) ∪ e out explicitly instead of d ∪ e","d ∪ e = {1 ↦ a, 2 ↦ c, 3 ↦ a} because the right operand wins on a collision; V(d ∪ e) = {a, c}; and writing d[3] in a rule asserts that key 3 exists — a block relying on it without handling ∅ is invalid","d ∖ {2} removes the pairs whose value is 2, so d ∖ {2} = d; K(e) = {c, a}; and d ∪ e = {1 ↦ a, 2 ↦ c, 3 ↦ a} because the right operand wins on a collision","d ∪ e = {1 ↦ a, 2 ↦ b, 3 ↦ a} because the left operand wins on a collision; V(d ∪ e) = [a, b, a] keeps duplicates in insertion order; and d[3] = ∅ is an ordinary, valid lookup result in every context"],"answer":1,"explanation":"逐步計算：eq. 3.11 d ∪ e ≡ (d ∖ K(e)) ∪ e，「priorities the right-side operand in the case of a key-collision」：K(e) = {2, 3}（eq. 3.9，keys 是**鍵**的集合，不是 {c, a}），d ∖ K(e) = {1 ↦ a}（eq. 3.8 減去的是鍵集合 s ⊆ K，不是值），再聯集 e 得 {1 ↦ a, 2 ↦ c, 3 ↦ a}；eq. 3.10 V(·) 是**集合**，「should different keys with equal values appear in the dictionary, the set will only contain one such value」，故 V(d ∪ e) = {a, c}。查詢：eq. 3.7 形式上定義 d[k] ≡ v 若存在、否則 ∅，但 GP 緊接著說「when using a subscript, it is an implicit assertion that the key exists in the dictionary. Should the key not exist, the result is undefined and any block which relies on it must be considered invalid」；要容許缺鍵必須明寫處理，GP 自己的模式是 𝒰(d[k], default)（eq. 3.2 substitute-if-nothing，如 eq. 13.x 的 𝒰(S[s], (0,0,0))）或先用 s ∈ K(d) 守門（accumulation 的 providable 函數 Y）。「左邊優先／V 保留重複」與定義相反；「衝突即未定義」錯——union 正是為了處理衝突而定義的，(d ∖ K(e)) ∪ e 是它的定義而非替代寫法；「d ∖ {2} 減值」錯，∖ 作用在鍵上。另外 §3.3：∅ 表示「validly left without a specific value」（|∅| = 0，A? ≡ A ∪ {∅}），∇ 才表示錯誤／無效。","trap":"∪ 右邊贏；∖ 減鍵；K 鍵集、V 值集（去重）；缺鍵要嘛 𝒰(…) 給預設、要嘛 block 無效。"},{"id":"ch04-dagger-intermediate-states","ch":"4","section":"4.2.1 State Transition Dependency Graph","gpRef":"eq. 4.6, 4.12, 4.13, 4.14, 4.16, 4.17, 4.18","difficulty":2,"kind":"concept","tags":["stf","intermediate-state","ordering","delta-0.8.0"],"stem":"GP 0.8.0's dependency graph names four dagger-superscripted intermediate states: β_H†, ρ†, ρ‡ and δ‡. Which description of what each one has just absorbed is correct?","options":["β_H† = β_H after this block's guarantees E_G are appended to the newest entry; ρ† = ρ after the assurances E_A; ρ‡ = ρ† after the guarantees E_G; δ‡ = δ after the preimages E_P are integrated, before accumulation runs","β_H† = β_H after the accumulation-output log θ′ has been committed to the belt; ρ† = ρ after the guarantees E_G; ρ‡ = ρ† after the disputes E_D; δ‡ = δ after E_P is integrated and before deferred transfers are applied","β_H† = β_H with the parent's posterior state root H_R written into its newest entry; ρ† = ρ after the disputes E_D; ρ‡ = ρ† after the assurances E_A; δ‡ = δ after accumulating R*, before E_P is folded in","β_H† = β_H with H_R written in; ρ† = ρ after E_A; ρ‡ = ρ† after E_D; δ‡ = δ after E_P — the order of disputes and assurances is immaterial because both only remove entries from ρ"],"answer":2,"explanation":"eq. 4.6 β_H† ≺ (H, β_H)：eq. 7.5 把 β_H 最後一筆的 state root（前一塊寫入時是 H_0）改為 H_R，即 parent 的 posterior root，要到本塊 header 才知道；eq. 4.12 ρ† ≺ (E_D, ρ)：disputes 先把 verdict 為 bad/wonky 的 report 從 core 清掉（eq. 10.14）；eq. 4.13 ρ‡ ≺ (E_A, ρ†)：assurances 讓 report 變 available（進入 R，eq. 11.17）或因 timeout 而移除（eq. 11.18）；eq. 4.14 ρ′ ≺ (E_G, ρ‡, κ, τ′)：最後才放入新 guarantee；eq. 4.16 (ω′, ξ′, δ‡, χ′, ι′, φ′, θ′, S) ≺ (R*, ω, ξ, δ, χ, ι, φ, τ, τ′)：accumulation 產出 δ‡（accumulation.tex 另稱 δ† 為 post-accumulation 的第一個中間態、δ‡ 為更新 last-accumulation 時戳 τ′ 後的第二個中間態，overview 的圖只列 δ‡）；eq. 4.18 δ′ ≺ (E_P, δ‡, τ′)：preimage 最後併入。GP：「The latter two [4.17, 4.18] mark a merge and join in the dependency graph… the availability extrinsic may be fully processed and accumulation of work happen before the preimage lookup extrinsic is folded into state」。E_D → E_A → E_G 的順序不可交換：assurance 只能對 ρ†[c] ≠ ∅ 的 core 設 bit（eq. 11.15），被 dispute 清掉的 report 不該再被 assure；E_G 要放進的是 ρ‡ 清空後的 core。0.8.0 PDF 的符號：新 available 的 report 序列寫作 R（R* 為 accumulatable，0.7.2 寫 W/R*）、ready queue 寫作 ω（0.7.2 寫 ω）、dagger 標在 β_H 上（β = (β_H, β_B)，belt β_B 不受 parent-root 修正影響）；你們 0.7.2 的 code 仍用 W/R*/ω，`intermediateStates` 存 β†, ρ†, ρ‡, δ†, δ‡（chain_state.go）。","trap":"口訣：β_H† 補 root；ρ† 判、ρ‡ 保、ρ′ 收；δ‡ 算完帳、δ′ 才收 preimage。"},{"id":"ch04-extrinsic-dependency-inputs","ch":"4","section":"4.2.1 State Transition Dependency Graph","gpRef":"eq. 4.11–4.20","difficulty":3,"kind":"concept","tags":["stf","extrinsic","ordering"],"stem":"Reading the 0.8.0 dependency graph (eq. 4.5–4.20) literally, which statement about where the five extrinsic components enter the transition is TRUE?","options":["The guarantees extrinsic E_G is an input to ρ′, β_H′, α′ and π′, but not to the accumulation step, whose only extrinsic-derived input is R* (derived from E_A and ρ†)","The preimages extrinsic E_P is an input to the accumulation step (eq. 4.16), so a service's accumulate code can read a preimage that was provided in the same block","The disputes extrinsic E_D is a direct input to π′, because the validator statistics record which validators were reported as offenders in the block","The assurances extrinsic E_A is a direct input to ρ′, i.e. ρ′ ≺ (E_G, E_A, ρ†, κ, τ′), because guarantees and assurances are processed together in one pass over the cores"],"answer":0,"explanation":"逐條讀 eq. 4.5–4.20：E_T → γ′ (4.7)、π′ (4.20)；E_D → ψ′ (4.11)、ρ† (4.12)；E_A → ρ‡ (4.13)、R* (4.15)、π′；E_G → ρ′ (4.14)、β_H′ (4.17)、α′ (4.19)、π′；E_P → δ′ (4.18)、π′。Accumulation（4.16）的輸入是 (R*, ω, ξ, δ, χ, ι, φ, τ, τ′)——沒有任何 extrinsic 直接進來：report 是在 **available**（E_A 超過 2/3 assurance，eq. 11.17）之後才 accumulate，而不是被 guarantee 的當下，所以同一塊 E_G 裡的 report 最快下一塊才會被 accumulate。E_P 在 δ′ ≺ (E_P, δ‡, τ′) 才併入，也就是 accumulation **之後**（GP：「accumulation of work happen before the preimage lookup extrinsic is folded into state」），因此 accumulate 讀不到同塊提供的 preimage（要下一塊）；E_A 不是 ρ′ 的直接輸入——它先產生 ρ‡，再由 E_G 覆蓋（4.13 → 4.14）；π′ ≺ (E_G, E_P, E_A, E_T, τ, κ′, π, H, S) **不含** E_D：validator statistics（eq. 13.x）只計 blocks、tickets、preimages、preimage bytes、guarantees、assurances，offender 記在 ψ′_O 與 header 的 H_O。你們 STF 的順序（code-map §2：ψ′ → ρ† → ρ‡ → accumulation → E_P 併入 → α′ → π′ 最後）與此一致。","trap":"accumulation 的唯一「外部」輸入是 R*；E_P 最後、E_D 不進 π′。"},{"id":"ch04-in-core-300x-rationale","ch":"4","section":"4.8.1 In-core Consensus","gpRef":"§4.9.1","difficulty":2,"kind":"rationale","tags":["architecture","in-core","scalability"],"stem":"The Overview states that JAM should be able to do 'upwards of 300 times' the computation in-core as a single machine running the VM at full speed. What justifies this figure, and what keeps such unreplicated computation safe?","options":["In-core results are accepted on the guarantors' signatures alone and are never re-executed by anyone else; the economic stake bonded by the guarantors (slashed on a later dispute) is what makes the 300x figure safe without any further verification","A given computation is executed by only a subset of validators, so throughput scales with network size rather than one machine; the guarantee/assure/audit (and if needed judge) game secures it, and stateless in-core execution can be reproduced by any node synced to the finalized chain","The 300x comes from each of the 341 cores using the whole 6-second slot in parallel; in-core code may read arbitrary on-chain state as of the lookup-anchor block, and that anchoring is what makes its results reproducible by other nodes","Every validator still executes every in-core computation, but the PVM's recompiler makes RISC-V code roughly 300 times faster than EVM bytecode; safety therefore follows from full replication, exactly as in the on-chain model, and no auditing stage is required"],"answer":1,"explanation":"GP §4.9.1：「In this model… only a subset of the network is responsible for actually executing any given computation and assuring the availability of any input data it relies upon… we are able to scale the amount of computation done in consensus commensurate with the size of the network, and not with the computational power of any single machine… upwards of 300 times」。GP 沒有推導 300 這個數字；直觀上它與 core 數同量級——1023 validators / 每 core 3 guarantors = C = 341 cores，扣掉 audit、availability 等額外負擔即「300 多倍」（此為推論，非 GP 原文）。安全性來自「a crypto-economic game of three stages called guaranteeing, assuring, auditing and, potentially, judging」：guarantee 讓無效計算付出經濟代價、assure 確保輸入資料一段期間內可取得、audit 確保會有可期待為誠實的一方檢查正確性（judging 只在有爭議時發生）；並且「All execution done in-core must be reproducible by any node synchronized to the portion of the chain which has been finalized… designed to be as stateless as possible. The requirements… include only the refinement code of the service, the code of the authorizer and any preimage lookups it carried out」，lookup-anchor 必須在 finalized chain 且夠新。「每個 validator 都執行」是 on-chain（everybody does everything）模型的描述；「只靠 guarantor 簽名、無人重算」漏掉 auditing——這正是 ELVES/§17–§18 存在的理由；「可讀任意 on-chain state」違反 stateless 設計（refine 只能透過 historical_lookup 讀 preimage）。","trap":"三段式（guarantee → assure → audit，必要時 judge）；in-core = stateless、可由 finalized chain 重現；300x ≈ core 數量級。"},{"id":"ch04-best-block-vs-finalized","ch":"4","section":"4.6 Best block","gpRef":"§4.6; §4.3 (head, finalized); §19 (best chain)","difficulty":2,"kind":"concept","tags":["consensus","grandpa","best-chain"],"stem":"GP §4.6 distinguishes the 'best block' from what the Grandpa finality gadget reports. Which statement matches the GP?","options":["The best block is simply the head — the valid block with the most ancestors — with ties between competing heads broken by the smaller header hash; Grandpa merely confirms that head some blocks later and plays no part in choosing a parent for authoring","The best block is the most recent block whose timeslot is not in the future; Grandpa is consulted only afterwards, to prune whichever fork lost, so no separate best-chain rule is needed either for authoring or for serving state to applications","The best block is the latest Grandpa-finalized block; JAM nodes never author on top of an unfinalized block, which is precisely why Grandpa lags only 1–2 blocks behind the most recent head and why no speculative state is ever exposed to applications","The best block is the head of the best chain (§19), used when latency matters more than certainty — choosing the parent for a block one is about to author, or reporting the latest state to a downstream application — at the risk that it never becomes canonical"],"answer":3,"explanation":"GP §4.6：「The simplest and least risky means… would be to inspect the Grandpa finality mechanism… However… Grandpa will typically return a block some small period older than the most recently authored block. (Existing deployments suggest around 1-2 blocks in the past…) There are often circumstances when we may wish to have less latency at the risk of the returned block not ultimately forming a part of the future canonical chain. E.g. we may be in a position of being able to author a block, and we need to decide what its parent should be. Alternatively, we may care to speculate about the most recent state… In these cases, we define the best block as the head of the best chain, itself defined in section 19.」§19 的 best block B♭ 必須：以 finalized block 為祖先、未 finalized 的部分沒有 equivocation（同一 timeslot 兩個有效 block）、已 audited；候選中選「使用 slot-sealer ticket（而非 fallback key）封印的祖先數最多」者，Grandpa 投票投的就是它（連同 posterior state root）。§4.3 的 head 定義是「the block with the most ancestors」，但 best block 不是單純最長鏈、GP 也沒有「header hash 較小」的 tie-break；「只在 finalized block 上出塊」與 GP 相反（那樣每塊都要等 finality）；「timeslot 不在未來」只是 block 暫時有效性的條件（§4.4、§5），不是 best block 的定義。對應 §4.3 的三個目標：Safrole 負責 (1) 少分叉、Grandpa 負責 (3) finality、兩者合力達成 (2) 快速收斂。","trap":"finalized（Grandpa，落後 1–2 塊、最安全）≠ best（§19 best chain 的 head，出塊/查詢用）≠ head（祖先最多）。"},{"id":"ch05-unsigned-header-serialization","ch":"5","section":"5 The Header (serialization, Appendix C.2)","gpRef":"eq. 5.1 & §C.2 (E(H), E_U(H))","difficulty":2,"kind":"code","tags":["header","codec","seal","code"],"stem":"The team derives the unsigned header serialization by encoding the full header and truncating it. Which statement about GP 0.8.0's E(H) and E_U(H) explains why this is sound and describes E_U's layout correctly?","code":{"lang":"go","caption":"internal/utilities/block_serialization.go (HeaderUSerialization) + field order of Header.Encode in internal/types/encode.go","src":"// (C.23)\n// This function encodes the header's properties without the seal\n// I still use header encoding function, but remove the length of the encoded seal\nfunc HeaderUSerialization(header types.Header) (output types.ByteSequence, err error) {\n\tencoder := types.GetEncoder()\n\tdefer types.PutEncoder(encoder)\n\n\tserializedHeader, err := encoder.Encode(&header)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\n\tlengthOfSeal := len(header.Seal)          // BandersnatchVrfSignature = [96]byte\n\tvalidLength := len(serializedHeader) - lengthOfSeal\n\n\toutput = append(output, serializedHeader[:validLength]...)\n\n\treturn output, nil\n}\n\n// encode.go — Header.Encode writes, in order: Parent, ParentStateRoot, ExtrinsicHash, Slot,\n//   EpochMark   (nil -> 0x00, else 0x01 ++ mark),\n//   TicketsMark (nil -> 0x00, else 0x01 ++ E tickets),\n//   AuthorIndex, EntropySource, OffendersMark (length-prefixed), Seal"},"options":["E_U(H) omits both Bandersnatch signatures — the entropy source H_V as well as the seal H_S — so a conformant implementation must cut 192 octets from E(H), and the seal's message contains no VRF material at all, which is what stops the two signatures depending on one another","E_U(H) is E(H) with the seal replaced by 96 zero octets, keeping the header length constant so that H_P can be computed before sealing; simple truncation therefore yields a message 96 octets too short and an implementation must re-encode with a zeroed seal instead","The serialized field order follows eq. 5.1 literally (…, H_W, var(H_O), E_2(H_I), H_V, H_S), so truncating the last 96 octets is only correct when H_O is empty, because the length-prefixed offenders list shifts every field that follows it, the seal included","E(H) = E(E_U(H), H_S): the 96-octet seal is the last, fixed-size field, so cutting 96 bytes off E(H) yields exactly the seal's message; inside E_U the order is H_P, H_R, H_X, E_4(H_T), H_E (0/1 discriminator), H_W (0/1 discriminator), E_2(H_I), H_V, var(H_O)"],"answer":3,"explanation":"附錄 C.2：E(H) = E(E_U(H), H_S)，而 E_U(H) = E(H_P, H_R, H_X, E_4(H_T), E_epochmark(H_E), maybe(H_R), E_2(H_I), H_V, var(H_O))。seal H_S 是 Bandersnatch signature ⊂ blob[96]，固定 96 octets 且永遠是最後一個欄位，所以 E(H) 去掉尾端 96 bytes 恰好就是 E_U(H)——也就是 eq. 6.16/6.17 中 seal 所簽的 message。H_V 仍留在 E_U 內（seal 簽到 H_V；H_V 的 VRF context 則含 Y(H_S)，而 VRF output 只由 key 與 context 決定、與 message 無關，所以不循環）。注意序列化順序與 eq. 5.1 的 tuple 順序不同：E_U 裡 E_2(H_I)、H_V 排在 H_O 之前，H_O 以 var（長度前綴）放在 E_U 最後；H_E 用 E(0) 或 E(1, η_0, η_1, var(k))，H_W 用 maybe（0 或 1 ⌢ 固定 E 張 ticket）。你們 Header.Encode 的欄位順序 Parent…AuthorIndex, EntropySource, OffendersMark, Seal 正是這個順序，所以 HeaderUSerialization 的做法正確。「省略 H_V、砍 192 bytes」錯：E_U 只排除 seal；「seal 換成 96 個零」錯：E_U 是直接省略而非填零；「照 eq. 5.1 順序、H_O 在 H_I 之前、只在 H_O 為空時才對」錯：seal 位置與 H_O 長度無關。0.8.0 的小 delta：epoch marker 的 key 序列改為 var(k)（#1031）。補充兩點：H_S 永遠是 E(H) 的最後一個欄位，H_O 再長也只是往前擠，seal 的起點會跟著移動但「尾端 96 bytes」始終是 seal，所以「H_O 非空就不能截斷」不成立；而 seal 與 H_V 若真的互不涵蓋（把兩個簽章都排除），eq. 6.16/6.17 的 seal 就簽不到本塊的 entropy 來源，那才會讓 H_V 可被事後替換。","trap":"序列化順序 p r x t e w i v o | s（H_O 在 H_V 之後、seal 最後），eq. 5.1 的 tuple 順序是 p r x t e w o i v s；E_U = E(H) 去尾 96 bytes。"},{"id":"ch05-extrinsic-hash-inclusion-proof","ch":"5","section":"5 The Header","gpRef":"eq. 5.4–5.7","difficulty":3,"kind":"concept","tags":["header","extrinsic-hash","light-client","delta-0.8.0"],"stem":"A light client holds only a verified header H and wants to check that preimage blob d for service s was included in that block's E_P. Given H_X = H(E(H#(a))) with a = [E_T(E_T), p, g, E_A(E_A), E_D(E_D)] (eq. 5.4–5.7), what is the minimal witness it needs and what is the shape of the check?","options":["The other four component hashes (h_T, h_g, h_A, h_D) plus the entire p sequence of (E_4(s_i), H(d_i)) pairs: it checks (E_4(s), H(d)) ∈ p and H(h_T ⌢ H(p) ⌢ h_g ⌢ h_A ⌢ h_D) = H_X — no other blob is needed, but p is a flat blob, not a log-size path","The complete E_P (every preimage blob of the block) together with the other four extrinsics in full, because H_X hashes the block's whole extrinsic serialization as one blob and cannot be recomputed from hashes alone","A log₂|E_P|-length Merkle path from the leaf H(d) up to H_X, because H_X is a binary Merkle root over every extrinsic item of the block, so the witness is O(log n) hashes and grows only logarithmically as the block fills up","Only H(d), the service index s and the block's H_X, because eq. 5.6 commits each (service, preimage-hash) pair directly into H_X, so a single pair can be checked without touching the rest of E_P or any of the other four extrinsic components"],"answer":0,"explanation":"eq. 5.4：H_X ≡ H(E(H#(a)))，H# 是把 H 逐項套用到序列 a 的每個元素（§3 notation：f^# 表示 map），所以 H_X = H(h_T ⌢ h_p ⌢ h_g ⌢ h_A ⌢ h_D)，其中 h_p = H(p)、p = E(var[(E_4(s), H(d)) | (s, d) ∈ E_P])（eq. 5.6）。這是兩層結構：外層是 5 個 component hash 平鋪後再 hash（不是二元 Merkle tree），內層的 p 是一整個 blob。要證明某個 preimage 被收錄，需要：另外四個 component hash、完整的 p 序列（每項 36 bytes）以及 d 本身（重算 H(d)）。§5 說明：「taking care to allow for the possibility of reports and preimages to individually have their inclusion proven」——0.8.0 PR #524 把 p 從 E_P(E_P)（含完整 blob）改成 (service, blake(blob)) 的序列，證明時才不必附上其他 preimage 的 blob。錯誤選項：H# 不是 Merkle tree，p 內部沒有 log 長度的路徑；「要全部 E_P blob」是 0.7.2 的情況；「只要 H(d) 與 H_X」少了 p 的其餘項與四個 sibling hash，根本無法重算 H_X。你們 CreateExtrinsicHash（0.7.2）對 preimages 仍是 hash 整個 EncodeExtrinsicPreimages，升到 0.8.0 時要改成對 (E_4(s), H(d)) 序列取 hash（#1031）；guarantees 那一段（g，report 用 H(w) 代替）在 0.7.2 已經做對。再強調一次規模：witness 的大小是「p 的長度 × 36 bytes + 4 個 sibling hash」，隨區塊裡的 preimage 數線性成長，不是 O(log n)；也不可能只憑一組 (s, H(d)) 就重算 H_X，因為 p 是先整段編碼再取一次 hash。","trap":"H_X 是「hash of five hashes」，不是 Merkle root；只有 p 與 g 以 hash 代替內容，E_T/E_A/E_D 是整包 encode 後 hash。"},{"id":"ch05-future-slot-temporarily-invalid","ch":"5","section":"5 The Header","gpRef":"eq. 5.8 & §5 text","difficulty":2,"kind":"concept","tags":["header","time","validation"],"stem":"A node receives a block at wall-clock time T whose header has H_T · P > T, while P(H)_t < H_T holds (its parent is known and older). How does GP §5 classify this block?","options":["It is valid as long as the drift stays below one slot period P = 6 s, which the GP grants as an explicit clock-skew tolerance so that honest authors at the very start of a slot are not rejected by peers whose clocks run marginally slow","It is permanently invalid, and since authoring ahead of the clock is an offence the author's Ed25519 key must reach ψ_O as a culprit in the next block's disputes extrinsic, so the node discards the header rather than keeping it","It is valid: only the ordering rule P(H)_t < H_T belongs to consensus, while the wall-clock comparison is authoring guidance — which is exactly why the STF test vectors carry no notion of T and an importing node must accept the block","It fails eq. 5.8 for now, but the GP notes such a block 'may become valid as T advances' — unlike a block with H_T ≤ P(H)_t, which can never become valid, it is only temporarily invalid and may be re-evaluated later"],"answer":3,"explanation":"eq. 5.8：P(H)_t < H_T ∧ H_T·P ≤ T（P = 6 秒，T 為自 JAM Common Era 起的 wall-clock 秒數）。§5：「A block may only be regarded as valid once the time-slot index H_T is in the past」——兩個子句都是有效性條件，但性質不同：T 會前進，所以 GP 明說「Blocks considered invalid by this rule may become valid as T advances」，未來區塊只是暫時無效，節點可以暫存、等 T 追上再 import；而 H_T ≤ P(H)_t 永遠不可能變真，是永久無效。GP 沒有任何 clock-skew 容忍（沒有「一個 slot 內可接受」的規則），也沒有把「提早出塊」列為 offence——ψ_O 只會經由 disputes 的 culprits/faults 增加（eq. 10.18）。對照你們的 code：STF 裡只檢查 τ < τ′（safrole.go 的 BadSlot：「timeslot value must be strictly monotonic」），wall-clock 條件放在 header_controller.ValidateTimeSlot（出塊路徑，用 time.Now() 與 JamCommonEra 2025-01-01 12:00 UTC 相減）；STF test vectors 與 fuzzer trace 都不含 wall-clock，所以這條規則只在 live 節點的 gossip/import 路徑上有意義——但「vectors 沒有它」不等於「它不是有效性條件」，eq. 5.8 的兩個 conjunct 都是有效性條件，只是其中一個無法用離線 trace 表達。「未來區塊要罰」也錯得徹底：ψ_O 只會由 E_D 的 culprits／faults 增長，而那些爭議全部圍繞 work-report 的正確性，跟出塊時間無關；何況該區塊根本還沒有效，沒有「已被接受再回頭追究」的餘地。","trap":"「暫時無效」只適用於未來 slot；跳過的 slot（H_T > P(H)_t + 1）是合法的，不要跟未來 slot 混淆。"},{"id":"ch05-author-index-bound-set","ch":"5","section":"5 The Header","gpRef":"eq. 5.10 & eq. 6.8 (valcount)","difficulty":3,"kind":"code","tags":["header","validators","delta-0.8.0","fuzzer-bug","code"],"stem":"After fuzzer bug #825 (a header with H_I = 65535 panicked UpdateEtaPrime0 with 'index out of range [65535] with length 6' because the index was used before being validated), the team added this check. Is the bound it uses the one GP 0.8.0 specifies?","code":{"lang":"go","caption":"internal/stf/validate_header.go (ValidateNonVRFHeader, excerpt)","src":"\t// Validate author_index out of range.\n\t// NOTE: There is currently no official error code defined for this case.\n\t// We may need to update this once the spec updates.\n\tif header.AuthorIndex >= types.ValidatorIndex(len(priorState.Kappa)) {\n\t\terrCode := SafroleErrorCode.AuthorIndexOutOfRange\n\t\treturn &errCode\n\t}\n\treturn nil\n}"},"options":["Yes: the bound is the constant V (1023 full / 6 tiny); κ and κ′ always hold exactly V entries in every configuration, so either length works and the choice of set is purely cosmetic — the only substantive fix for #825 was ordering the range test before the index is dereferenced","Yes: eq. 5.10 defines H_I ∈ N_{|κ|} — the author must belong to the prior active set, because the block is built on the prior state and its seal is verified before the epoch's key rotation is applied, so len(priorState.Kappa) is exactly the spec bound and #825 needed nothing beyond moving the test ahead of UpdateEtaPrime0","No: H_I indexes the pending set γ_P, since the first block of an epoch is sealed by the incoming validators; the bound must therefore be |γ_P| read out of the prior Safrole state, because κ′ is only assigned once the seal has been verified and bounding H_I by it would be circular","Not exactly: eq. 5.10 bounds H_I by |κ′| (the posterior active set, whose key also verifies H_S and H_V); the prior κ is equivalent only while |κ| = |κ′|, which holds today because the team never resizes the set, but 0.8.0 lets validator-set sizes differ across an epoch boundary (eq. 6.8)"],"answer":3,"explanation":"eq. 5.10：H_I ∈ N_{|κ′|}，H_A ≡ κ′[H_I]_b——用的是 posterior active set（epoch 的第一個區塊由剛輪替進來的 κ′ = 舊 γ_P 出塊；#784/#791 就是因為用 prior κ/η 驗 seal 與 H_V 而失敗）。0.7.2 這裡的上界是常數 V；0.8.0（PR #514）改為 |κ′|，且 eq. 6.8 允許 validator 序列長度是 6 到 3C 之間任何 3 的倍數、designate 可以改變 ι 的長度，所以 |κ′| 在 epoch 交界可能 ≠ |κ|。你們目前 |κ| ≡ |κ′| ≡ ValidatorsCount（offender 的 key 就地清零、不移除，issue #1037），所以 len(priorState.Kappa) 暫時等價；一旦支援變動大小，集合變大時會誤拒合法的 H_I ∈ [|κ|, |κ′|)，變小時會放過非法 index，接著在 η′_0 = H(η_0 ⌢ Y(H_V)) 或 seal 驗證取 κ′[H_I] 時再度 panic——正是 #825 的症狀。「γ_P」錯：epoch 交界時 κ′ 已經等於舊的 γ_P，index 對象是 κ′ 本身；「常數 V」是 0.7.2 的寫法。另一個重點：這個 bound check 必須排在所有使用 κ′[H_I] 的步驟（UpdateEtaPrime0、seal/VRF 驗證）之前——#825 的本質是「先用後驗」。順帶拆掉幾個似是而非的說法：「先驗 seal 再輪替金鑰，所以上界是 |κ|」把順序講反了——κ′ ≺ (H, τ, κ, γ)（§4 依賴圖）只用 header 的 timeslot 與先前狀態算出，seal 驗證在 κ′ 之後，因此拿 κ′ 當上界沒有循環問題，γ_P 那個說法的「循環」理由也隨之落空；epoch 第一塊確實由新進 validator 出塊，但那時 κ′ 已經等於舊的 γ_P，index 的對象是 κ′ 本身。「V 是常數、兩個集合永遠一樣長」則是 0.7.2 的寫法：eq. 6.8 把合法的 validator 序列長度定義成 𝕍 ≡ {3c | 2 ≤ c ≤ C}（6 到 1023，皆為 3 的倍數），designate 可以改變 ι 的長度，所以「純屬美觀」不成立。","trap":"H_I 對 κ′ 取 index，bound 也是 |κ′|；0.8.0 之後不要再把 V 當常數用。"},{"id":"ch07-beta-entry-timeslot-080","ch":"7","section":"7 Recent History","gpRef":"eq. 7.2, 7.8 & eq. 11.36; §D.1 C(3)","difficulty":2,"kind":"delta","tags":["recent-history","delta-0.8.0","codec","anchor"],"stem":"This 0.7.2 code builds the entry appended to β_H at the end of a block. What must change for GP 0.8.0, and which on-chain check motivates the change?","code":{"lang":"go","caption":"internal/recent_history/recent_history_controller.go (NewItem) — GP 0.7.2 checkout","src":"// pack item $n$ (7.8) GP 0.6.7\n/*\n\titem $n$ = (header hash $h$, accumulation-result mmr $b$, state root $s$, WorkReportHash $\\mathbf{p}$)\n*/\nfunc NewItem(headerHash types.HeaderHash, workReportHash []types.ReportedWorkPackage, accumulationResultMmr types.OpaqueHash) (item types.BlockInfo) {\n\tzeroHash := types.StateRoot{}\n\titem = types.BlockInfo{\n\t\tHeaderHash: headerHash,\n\t\tBeefyRoot:  accumulationResultMmr,\n\t\tStateRoot:  zeroHash,\n\t\tReported:   workReportHash,\n\t}\n\treturn item\n}"},"options":["Store the whole accumulation-output sequence θ′ in place of the super-peak b, because eq. 11.36 now compares the anchor's accumulation log entry by entry rather than against one commitment, which is also why 0.8.0 moved the belt out of C(3) and into its own state key","Add the lookup-anchor posterior state root of every report guaranteed in the block, because 0.8.0 added that field to the refinement context and β_H is the only on-chain place where the value can be recorded — the ancestor set A holds headers, not the roots that follow them","Add the block's timeslot t = H_T as a fifth field (E_4(t) between s and p under state key C(3)): refinement contexts now carry the anchor's timeslot and eq. 11.36 requires it to equal the t of the matching β† entry (GP PR #526; team PR #1031 threads H_T into NewItem)","Replace the zero state root with the posterior root M_σ(σ′), because 0.8.0 headers now commit to the posterior state rather than the prior one; eq. 7.5's β† correction therefore disappears and eq. 11.36 can compare an anchor's state root against the very block that produced it"],"answer":2,"explanation":"eq. 7.2（0.8.0）：β_H ∈ [(h, s, b, t ∈ N_T, p)]_{:H}——多了 timeslot；eq. 7.8 的新 entry 是 (H(H), H_0, M_R(β′_B), H_T, p)。動機：0.8.0 PR #526 在 refinement context（eq. 11.4）加入 anchor slot 與 lookup-anchor posterior state root，讓 refine 端能得知 anchor 的時間；鏈上要驗它，就必須在 β 裡存每個 recent block 的 t，eq. 11.36 變成：∃y ∈ β†：anchor hash = y_h ∧ anchor posterior state = y_s ∧ anchor accumulation log = y_b ∧ anchor time = y_t。狀態序列化（§D.1 的 C(3)）順序是 (h, b, s, E_4(t), var(p))——注意 b 在 s 之前，與 eq. 7.2 的 tuple 順序 (h, s, b, t, p) 不同；你們 BlockInfo 的欄位 HeaderHash, BeefyRoot, StateRoot, Reported 正是照序列化順序排，PR #1031 把 4-byte timeslot 插在 state_root 與 reported 之間。錯誤選項：state root 仍是 H_0、由下一塊的 β† 用 H_R 補正（eq. 7.5），header 也仍然只帶 prior root；β 存的是 belt 的 super-peak，不是整個 θ′（θ′ 已被 M_B + MMR append 吸收，eq. 7.6–7.7）；lookup-anchor 的 posterior state root 是用 ancestor set 裡「下一個 header 的 H_R」來驗（eq. 11.38：h′_p = H(h) ∧ h′_r = x 的 lookup-anchor 後狀態根），完全不經過 β——ancestor set 保留的是 header，而每個 header 都帶 prior state root，所以「下一個 header 的 H_R」正好就是這一個區塊的 posterior root，根本不需要 β 幫忙記。另外兩個干擾也可逐句反駁：0.8.0 的 header 仍然只帶 prior state root（§5：「This is a departure from both Polkadot and the Yellow Paper's Ethereum」，理由是 pipelining），所以 β† 依然存在；C(3) 至今仍同時裝著每筆 item 與 mmrencode(β_B)，belt 沒有搬到別的 state key，anchor 的 accumulation log 也只比一個 32-byte super-peak（x_b = y_b），不是逐筆比對。","trap":"0.8.0 β_H 一項 = 5 欄；序列化順序 h, b, s, t, p（b 在 s 前）；anchor 的四個欄位全部要對上 β† 的同一筆。"},{"id":"ch07-belt-empty-output","ch":"7","section":"7 Recent History","gpRef":"eq. 7.6–7.7 & eq. E.1, E.3","difficulty":3,"kind":"concept","tags":["recent-history","mmr","edge-case"],"stem":"Block N accumulates nothing that yields an output, so θ′ = []. What happens to the accumulation-output belt β_B and to the super-peak b written into block N's β_H entry?","options":["Nothing is appended and b repeats the parent's super-peak, so the belt holds one leaf per block that produced at least one accumulation output and BEEFY verifiers simply skip empty blocks","The block's header hash H(H) is appended in place of the missing output root, so that the belt stays aligned one-to-one with the β_H entries and their header hashes","One leaf is still appended: M_B([], H_K) = N([], H_K) = H_0, so β′_B = A(β_B, H_0, H_K) and b = M_R(β′_B) changes — the belt always carries exactly one leaf per block since genesis","An empty peak ∅ is appended to the peak sequence without any hashing, so the peak count grows by one while b stays unchanged until the next block with a non-empty θ′"],"answer":2,"explanation":"eq. 7.6–7.7：s = [E_4(s) ⌢ E(h) | (s, h) ∈ θ′]，β′_B ≡ A(β_B, M_B(s, H_K), H_K)，沒有任何「θ′ 為空就跳過」的條件。θ′ 來自 eq. 12.22/12.24 的 b = {(s, b) | b = yield 結果 ≠ ∅}——只有在 accumulate 裡呼叫 yield 的 service 才會出現，所以大多數區塊的 θ′ 都是空的。此時 s = []，依 eq. E.3：M_B(v, H) 在 |v| = 1 時為 H(v_0)，否則為 N(v, H)；再依 eq. E.1：N([], H) = H_0（零 hash）。所以每個區塊都往 belt append 一片 leaf（空塊的 leaf 是 H_0），belt 的 leaf 數等於創世以來的區塊數，super-peak 每塊都會變。∅ 只會以 MMR 進位時留下的「空 peak」出現（eq. E.8 的 R(r, n, ∅)），不會因 θ′ 為空而被 append；header hash 也不會進 belt（它進的是 β_H 的 h）。你們的 lastAccOutRoot → merkle.Mb：len(v) == 0 時走 N 回傳 zeroHash，再交給 AppendOne（OpaqueHash 長度固定 32，不會被當成空值略過），行為一致。","trap":"belt 是「每塊一片 leaf」的 MMR；空區塊的 leaf 是 H_0 不是 ∅。因此兩個相鄰的空區塊，其 β_H 的 b 也不相同。"},{"id":"ch07-belt-five-appends-calc","ch":"7","section":"7 Recent History (MMR, Appendix E.2)","gpRef":"eq. 7.7 & eq. E.8–E.10","difficulty":3,"kind":"calc","tags":["recent-history","mmr","calc"],"stem":"Starting from an empty belt β_B = [] at genesis, five consecutive blocks append their per-block roots r_1, …, r_5 (each r_i = M_B(s_i, H_K)). Applying the MMR append function of eq. E.8 with H = H_K, what is β_B after block 5, and what super-peak b = M_R(β_B) enters block 5's β_H entry?","options":["β_B = [H_K(H_K(r_1 ⌢ r_2) ⌢ H_K(r_3 ⌢ r_4)), ∅, r_5]; b = H_K('peak' ⌢ H_K(H_K(r_1 ⌢ r_2) ⌢ H_K(r_3 ⌢ r_4)) ⌢ r_5)","β_B = [r_5, ∅, H_K(H_K(r_1 ⌢ r_2) ⌢ H_K(r_3 ⌢ r_4))]; b = H_K(r_5 ⌢ H_K(H_K(r_1 ⌢ r_2) ⌢ H_K(r_3 ⌢ r_4))) — the super-peak is just one more un-prefixed carry","β_B = [M_B([r_1, r_2, r_3, r_4, r_5], H_K)]; b = that single root — the range is re-balanced on every append so there is always exactly one peak","β_B = [r_5, ∅, H_K(H_K(r_1 ⌢ r_2) ⌢ H_K(r_3 ⌢ r_4))]; b = H_K('peak' ⌢ r_5 ⌢ H_K(H_K(r_1 ⌢ r_2) ⌢ H_K(r_3 ⌢ r_4)))"],"answer":3,"explanation":"逐步套用 eq. E.8 的 P(r, l, n)：(1) [] + r_1：n = 0 ≥ |r| = 0 → append → [r_1]。(2) + r_2：r[0] 已佔用 → 清成 ∅，帶著 H_K(r_1 ⌢ r_2) 往 n = 1 → append → [∅, h_12]。(3) + r_3：r[0] = ∅ → 直接放入 → [r_3, h_12]。(4) + r_4：r[0] 佔用 → 進位 H_K(r_3 ⌢ r_4) 到 n = 1，r[1] 也佔用 → 再進位 H_K(h_12 ⌢ h_34) 到 n = 2 → append → [∅, ∅, h_1234]。(5) + r_5：r[0] = ∅ → [r_5, ∅, h_1234]。這對應 5 = 101₂：index i 的 peak 代表一棵 2^i 片 leaf 的樹，index 0 永遠是最小的那棵。super-peak（eq. E.10）：先取非 ∅ 的 peaks h = [r_5, h_1234]，|h| = 2 → H_K($peak ⌢ M_R([r_5]) ⌢ h_1234) = H_K('peak' ⌢ r_5 ⌢ h_1234)——由左往右摺，最後一個 peak 在最外層。錯誤選項對應的錯誤：把大樹放在 index 0 是方向反了；MMR 是 append-only，不會重新平衡成一棵 M_B（那樣還會多出 $node 前綴，且 append 成本不再是 O(log N)）；super-peak 一定帶 $peak 前綴，只有 MMR 內部進位才是無前綴的 H(r[n] ⌢ l)。你們 mmr.go 的 P() 與 SuperPeak()（先濾掉 nil，再遞迴摺前 n−1 個）與此一致；狀態序列化時每個 peak 前有 0/1 option byte（eq. E.9，encode.go 的 Mmr 編碼）。","trap":"peak 序列的 index = 樹高（2^i 片 leaf）；super-peak 由左往右摺、最後一個 peak 在最外層、前綴是 $peak。"},{"id":"ch08-leftmost-removal-code","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 8.3 (F) & eq. 11.25, 11.32","difficulty":2,"kind":"code","tags":["authorization","code","fuzzer-bug"],"stem":"Before PR #694 (bug #692) this removal deleted every occurrence of the used authorizer hash and ignored the report's core. Which statement correctly describes the GP rule the fixed code implements and why the old behaviour was wrong?","code":{"lang":"go","caption":"internal/authorization/authorization.go (updatePoolFromQueue) & internal/types/types.go (AuthPool.RemoveLeftMostPairedValue)","src":"func updatePoolFromQueue(coreIndex types.CoreIndex, eg types.ReportGuarantee, alpha types.AuthPools) (types.AuthPools, error) {\n\tpool := alpha[coreIndex]\n\tif pool == nil {\n\t\treturn nil, fmt.Errorf(\"alpha[%d] is nil\", coreIndex)\n\t}\n\n\t// (8.3)   remove (g_r)a from α[c]（leftmost match）\n\tauthHashToRemoved := eg.Report.AuthorizerHash\n\tpool.RemoveLeftMostPairedValue(authHashToRemoved)\n\n\talpha[coreIndex] = pool\n\treturn alpha, nil\n}\n\nfunc (a *AuthPool) RemoveLeftMostPairedValue(h OpaqueHash) {\n\tresult := (*a)[:0]\n\tremoved := false\n\tfor _, v := range *a {\n\t\tif removed || !bytes.Equal(v[:], h[:]) {\n\t\t\tresult = append(result, v)\n\t\t} else {\n\t\t\tremoved = true\n\t\t}\n\t}\n\t*a = result\n}"},"options":["eq. 8.3, but the pool to edit must be found by looking the guarantors' validator indices up in the current rotation's assignment G, not by the core index stored inside the work-report — so a guarantee signed one rotation earlier edits whichever core those validators are sitting on now","eq. 8.3: F(c) = α[c] ⊖ {w_a} removes one left-most instance from the pool of the report's own core; a pool is a sequence that may hold the same hash several times (e.g. a queue repeating one authorizer), so deleting every copy shrank pools and broke the test vectors","eq. 11.32: the removal doubles as the pool-membership check, and a missing match must reject the block — so the old code was wrong only in failing to return an error when nothing matched, which is why the fix belongs in the guarantee validator rather than in the authorization state transition","eq. 8.2: the removal only makes room for the queue entry appended this block, so deleting every duplicate is harmless — α[c] is a set in which one authorizer hash can never occur twice, and the ←(…)^O truncation would have discarded any extra copies within eight blocks anyway"],"answer":1,"explanation":"eq. 8.3：F(c) ≡ α[c] ⊖ {(g_w)_a} 當 ∃g ∈ E_G：(g_w)_c = c，否則 F(c) = α[c]。§3 notation：s ⊖ {v} 是「s excepting the left-most element equal to v」——只移除最左邊（最舊）的一個。eq. 8.1 的 α ∈ [[H]_{:O}]_C 是序列不是集合，重複完全合法：queue φ[c] 常常整排都是同一個 authorizer（例如某條 parachain 專用的 core），pool 裡自然會累積多個相同 hash；全部刪掉會讓 pool 憑空縮水，後續的 guarantee 就會因 eq. 11.32 找不到 authorizer 而被拒。#692 的修法正是「match the core index from report in guarantees」+「remove only the leftmost instance」。其他選項：α[c] 不是 set；F(c) 不做驗證——w_a ∈ α[w_c] 早在 guarantee 驗證（eq. 11.32，對 prior α）就檢查過了，所以這裡一定找得到、也一定只需移除一個（eq. 11.25：E_G 每個 core 最多一個 guarantee，且依 core 排序不重複）；要編輯哪個 pool 由 report 的 core index (g_w)_c 決定，與 guarantor 是誰無關——用「現在這一輪 G 的 validator→core 對應」反推更是錯上加錯：eq. 11.28 允許 guarantee 的 g_t 落在前一個 rotation（R = 10 slots），那時同一批 validator 被指派到的 core 與現在不同，反推會挑到別的 pool。另外，「⊖ 只是為了騰位置，被 ←(…)^O 截斷早晚也會丟掉重複」也不成立：pool 未滿時根本不截斷，而每個區塊每個 core 都只 append 一項，多刪的那幾個 hash 是永久消失、不會被補回來。","trap":"⊖（seqminusl）只砍最左邊一個；pool 與 queue 都是「序列」，允許重複。"},{"id":"ch08-pool-two-block-calc","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 8.2–8.3 & eq. 4.19","difficulty":3,"kind":"calc","tags":["authorization","calc","ordering"],"stem":"Core c, with O = 8 and Q = 80. Before block N: α[c] = [x, y, x, z, w, u, v, t] (oldest on the left) and φ[c] = [q_0, …, q_79]. Block N has H_T = 171 and its E_G holds one guarantee for core c whose report has authorizer x; φ[c] is untouched in block N. Block N+1 has H_T = 173 and no guarantee for core c, but its accumulation calls `assign` on core c, replacing the queue with [r_0, …, r_79]. What is α[c] after block N+1?","options":["[x, z, w, u, v, t, q_3, r_5]","[x, z, w, u, v, t, q_11, q_13]","[x, z, w, u, v, t, q_11, r_13]","[y, z, w, u, v, t, q_11, r_13]"],"answer":2,"explanation":"eq. 8.2：α′[c] ≡ ←(F(c) ⌢ φ′[c][H_T]↺)^O，↺ 是 modulo 下標（§3：s[i]↺ ≡ s[i mod |s|]），所以取的 index = H_T mod Q = H_T mod 80；eq. 8.3：core c 有 guarantee 時 F(c) = α[c] ⊖ {w_a}（只移除最左邊一個），否則 F(c) = α[c]。Block N：F(c) = [x, y, x, z, w, u, v, t] ⊖ {x} = [y, x, z, w, u, v, t]（7 個）；171 mod 80 = 11 → append q_11 → [y, x, z, w, u, v, t, q_11]（8 個，不需截斷）。Block N+1：沒有 guarantee，F(c) 就是這 8 個；但 α′ 依賴的是 posterior φ′（eq. 4.19：α′ ≺ (H, E_G, φ′, α)；§8.2：「this step must be computed after accumulation」），本塊的 assign 已把 φ′[c] 換成 r，173 mod 80 = 13 → append r_13 → 9 個 → ←^8 保留最後 8 個，丟掉最舊的 y → [x, z, w, u, v, t, q_11, r_13]。錯誤選項對應的錯誤：仍用 prior φ 取 q_13（忘了 α′ 用的是 φ′）；block N 把兩個 x 都移除（#692 的 bug）；用 H_T mod O = mod 8 取 q_3、r_5（index 要對 Q = 80 取餘）。順帶一提，block N 的 guarantee 之所以合法，是因為 eq. 11.32 以 prior α[c] 檢查 x ∈ α[c]。","trap":"順序：先 ⊖（只對有 guarantee 的 core）→ 再 append φ′[c][H_T mod 80] → 再 ←^8 留最後 8 個；每塊每個 core 都 append，沒 guarantee 的滿 pool 每塊左移一格。"},{"id":"ch08-new-authorizer-availability-timing","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 8.2, eq. 4.19 & eq. 11.32","difficulty":3,"kind":"concept","tags":["authorization","guarantees","ordering"],"stem":"At the start of block N the pool α[c] does not contain authorizer x. During block N's accumulation the assigner service of core c calls `assign` with a queue whose entry at index H_T mod Q is x, so x will be appended to core c's pool by this block. Block N's E_G also carries a guarantee for core c whose work-report has authorizer x. Is that guarantee valid, and when is x first usable?","options":["Valid: the authorizer check accepts any hash present in α[c] or in φ′[c], since the queue is the source of the pool and the assigner has already approved that authorizer for the core","Invalid: eq. 11.32 requires w_a ∈ α[w_c] on the prior pool, and x only enters α′[c] through eq. 8.2 at the end of block N — so the first block whose E_G may carry a report authorized by x is N+1","Invalid, but for a different reason: a single block may not both alter a core's queue via `assign` and accept a guarantee on that core, so the guarantee is rejected regardless of x","Valid: α′ is deliberately computed after accumulation so that guarantees in the same block can already rely on freshly assigned authorizers, which is why §8.2 orders the pool update last"],"answer":1,"explanation":"eq. 11.32：∀w ∈ w：ρ‡[w_c] = ∅ ∧ w_a ∈ α[w_c]——用的是 prior α（無 prime、無 dagger）。α′ 的定義（eq. 8.2）雖然要等 accumulation 之後才能算（因為需要 φ′），那是 α′ 的「產生」順序，不是 guarantee 驗證所看的狀態；依賴圖 eq. 4.19：α′ ≺ (H, E_G, φ′, α) 表示 E_G 是 α′ 的輸入，而非反過來。所以 x 要到 block N 結束時才進入 α′[c]，block N+1 的 prior α 才含 x，N+1 的 E_G 才能收 authorizer 為 x 的 report。實務含意：assigner 想讓新 authorizer 可用，最快也是下一個 slot；而且 pool 每塊都會 append 一個 queue 項目，x 進 pool 後若一直沒被使用、pool 又沒被其他 guarantee 消耗，最多再 8 個區塊就會被 ←^O 擠掉，所以 queue 的安排要與預期的 package 提交時間對齊。錯誤選項：guarantee 驗證不看 φ（queue 只是 pool 的補給來源，不是授權依據）；GP 沒有「同一塊不能同時 assign 與 guarantee」的規則。你們 STF 的順序（ValidateExtrinsic → UpdateReports → UpdateAccumlate → UpdateAuthorizations）也正是先用 prior α 驗 guarantee、最後才產生 α′。","trap":"guarantee 看 prior α；α′ 用 posterior φ′。新 authorizer 最早在「下一個區塊」才可用。"},{"id":"ch06-code-useless-ticket-gap","ch":"6","section":"6.7 The Extrinsic and Tickets","gpRef":"eq. 6.35–6.36 — internal/safrole/extrinsic_tickets.go CreateNewTicketAccumulator","difficulty":3,"kind":"code","tags":["safrole","tickets","code","fuzzer"],"stem":"This is the tail of the team's CreateNewTicketAccumulator (identical on main and on the 0.8.0 branch), reached after the new tickets passed the tail/attempt/proof/order/duplicate checks. A block at m′ = 300 carries 3 valid tickets whose ids are all HIGHER than every id in a saturated γ_A (|γ_A| = E). What does the GP require, and what does this code do?","code":{"lang":"go","caption":"internal/safrole/extrinsic_tickets.go (CreateNewTicketAccumulator, tail)","src":"// (6.34) Get previous ticket accumulator\npreviousTicketsAccumulator := GetPreviousTicketsAccumulator()\n\n// (6.34) Concatenate the new tickets and the previous ticket accumulator\nnewTicketsAccumulator := append(newTickets, previousTicketsAccumulator...)\n\n// (6.34) sort the tickets by ticket id\nsort.Slice(newTicketsAccumulator, func(i, j int) bool {\n    return bytes.Compare(newTicketsAccumulator[i].ID[:], newTicketsAccumulator[j].ID[:]) < 0\n})\n\n// (6.33) Verify the new tickets accmuulator\nerr = VerifyTicketsDuplicate(newTicketsAccumulator)\nif err != nil {\n    // Found a ticket duplicate (Someone submitted the same ticket)\n    return err\n}\n\n// (6.34) select E tickets from the sorted tickets for the new ticket accumulator\nmaxTicketsAccumulatorSize := types.EpochLength\nif len(newTicketsAccumulator) > maxTicketsAccumulatorSize {\n    newTicketsAccumulator = newTicketsAccumulator[:maxTicketsAccumulatorSize]\n}\n\n// (6.34) set the new ticket accumulator to the posterior state\ncs.GetPosteriorStates().SetGammaA(newTicketsAccumulator)\n\nreturn nil"},"options":["The block is invalid per eq. 6.34 because the new ids collide with γ_A, and VerifyTicketsDuplicate on the merged, sorted sequence is exactly the check that catches this case, so the code is conformant","Eq. 6.36 (n ⊆ γ′_A) makes the block INVALID, but this code silently drops the 3 tickets in the [:E] truncation and accepts it — a block that the reference implementation rejects","The block is invalid per eq. 6.31 because tickets are only accepted while |γ_A| < E; the code should compare len(previousTicketsAccumulator) with E before merging and return UnexpectedTicket","The block is valid per eq. 6.35: γ′_A simply keeps the lowest E ids, so the 3 tickets are not retained and nothing further is required of the block; this code is fully conformant and needs no extra check"],"answer":1,"explanation":"eq. 6.35：γ′_A ≡ 取 sort_by_id(n ∪ (∅ if e′ > e else γ_A)) 的最低 E 筆；eq. 6.36 緊接著要求 n ⊆ γ′_A：「It is invalid to include useless tickets in the extrinsic, so all submitted tickets must exist in their posterior ticket accumulator」。題目裡 3 張 ticket 的 id 都比滿載 γ_A 的最大 id 還大，排序後全部落在第 E 名之後，被 `[:maxTicketsAccumulatorSize]` 截掉——程式接著 SetGammaA 並 return nil，區塊被接受；GP 卻要求整個區塊無效。這段程式（main 與 1012-update-to-v080 分支相同）沒有任何「截斷後確認 newTickets 仍在 accumulator 內」的步驟，SafroleErrorCode 也沒有對應的 code；w3f 的 safrole vectors 沒有 useless-ticket 失敗案例（fail cases 只有 bad attempt / already recorded / bad order / bad proof / lottery over），所以一直沒被抓到，但 fuzzer 若產生這種區塊，reference 會拒絕、你們會接受，state 立刻分岔。其他選項：6.34 講的是 id **相同**（duplicate），VerifyTicketsDuplicate 只比較排序後相鄰是否相等，抓不到「較大但合法的 id」；6.31 是 |E_T| ≤ K（m′ < Y）、與 |γ_A| 無關——accumulator 已滿仍可接受更好的 ticket（vector publish_tickets_with_mark-3：「Publish some tickets with a full accumulator. Some old ticket are removed to make space for new ones」）；「照 6.35 保留最低 E 筆所以合法」漏掉了 6.36（此情境下 γ′_A 的確等於 γ_A，但區塊本身必須被拒絕）。修法：截斷後確認 newTickets 的最大 id ≤ γ′_A 的最後一筆（或逐一 Contains），失敗就回傳錯誤。","trap":"口訣：進不了前 E 名的 ticket 不是被丟掉，而是讓整個區塊作廢（6.36）。"},{"id":"ch06-code-attempt-cap-v080","ch":"6","section":"6.7 The Extrinsic and Tickets","gpRef":"eq. 6.30 (n = ⌈2E/|γ′_P|⌉) — internal/safrole/extrinsic_tickets.go VerifyTicketsAttempt (branch 1012-update-to-v080, PR #1025)","difficulty":2,"kind":"code","tags":["safrole","tickets","code","delta-0.8.0"],"stem":"This is VerifyTicketsAttempt on the team's 0.8.0 branch (PR #1025); on main (0.7.2) it compared Attempt against the constant TicketsPerValidator. Which statement about it is correct?","code":{"lang":"go","caption":"internal/safrole/extrinsic_tickets.go (VerifyTicketsAttempt, branch 1012-update-to-v080)","src":"func VerifyTicketsAttempt(tickets types.TicketsExtrinsic) *types.ErrorCode {\n    numV := len(blockchain.GetInstance().GetPosteriorStates().GetGammaK())\n    if numV == 0 {\n        ...\n        if len(tickets) > 0 {\n            err := SafroleErrorCode.BadTicketAttempt\n            return &err\n        }\n        return nil\n    }\n    // n = ceil(2E / numV) via integer arithmetic.\n    n := (2*types.EpochLength + numV - 1) / numV\n\n    for _, ticket := range tickets {\n        // ticket.Attempt is an entry index (0-based); reject Attempt >= n.\n        if ticket.Attempt >= types.TicketAttempt(n) {\n            err := SafroleErrorCode.BadTicketAttempt\n            return &err\n        }\n    }\n\n    return nil\n}"},"options":["It uses the wrong set: n must be derived from |κ′|, the active set, because tickets are submitted by the validators authoring blocks right now; taking GetGammaK makes the bound change one epoch too early on any chain whose set size varies","It implements n = ⌈2E/|γ′_P|⌉ with the posterior pending set (the team's GammaK), i.e. the ring the tickets are proven against; (2E + |γ′_P| − 1) / |γ′_P| is the integer ceiling and the bound is exclusive because N_n = {0, …, n−1}","It is only a refactor: because offenders are zeroed in place rather than removed, |γ′_P| always equals V, so 0.7.2's constant TicketsPerValidator (3 tiny / 2 full) already produced exactly the same bound and no test vector changes behaviour","It has an off-by-one: eq. 6.30 puts the entry index in N_n, which by §3.4 includes n itself, so Attempt == n must be accepted and the comparison should be > n rather than >= n; in tiny mode (E = 12, |γ′_P| = 6) this wrongly rejects entry index 4"],"answer":1,"explanation":"eq. 6.30：E_T ∈ [(r ∈ N_n, p ∈ F̄^{X_T ⌢ η′_2 ++ r}_{γ′_Z}([]))]，n = ⌈2E/|γ′_P|⌉——分母是 **posterior pending set** γ′_P（你們命名為 GammaK），因為 ticket 是對 γ′_Z（由 γ′_P 的 Bandersnatch key 建 ring）做 ring proof，是「下個 epoch 的 validator」在投票，與本 epoch 出塊的 κ′ 無關，所以「用 κ′」是錯的 set。§3.4：N_n = {x ∈ N, x < n}，Attempt ≥ n 就拒絕（BadTicketAttempt）沒有 off-by-one；`(2E + numV − 1) / numV` 是整數 ceiling 的標準寫法：tiny E = 12、|γ′_P| = 6 → (24+5)/6 = 4；full E = 600、1023 → (1200+1022)/1023 = 2。0.7.2 main 用常數 TicketsPerValidator（tiny 3 / full 2），tiny 下 entry index 3 在 0.8.0 變成合法（PR #1025 因此把舊 vector publish-tickets-no-mark-1「bad ticket attempt number」標成 IsV080IncompatibleVector 跳過），所以「只是 refactor、bound 不變」是錯的。同一個 PR 也把 VerifyEpochTail 的上限從 ValidatorsCount 改成 MaxTicketsPerBlock（K，eq. 6.31）。GP 的理由：「To ensure the accumulator can be saturated, when there are fewer validators, each validator is permitted more tickets」（每個 slot 期望約 2 張 ticket）。補充三個干擾各錯在哪：「N_n 含 n」是誤讀 §3.4（N_n 嚴格小於 n），tiny 下合法 entry index 是 0…3 而不是 0…4；「該用 |κ′|、GetGammaK 會早一個 epoch 生效」錯在分母必須與 ticket 所證明的 ring 同一個集合——ring 由 γ′_P 的 Bandersnatch key 建成，時間點剛好對齊；「沒有任何 test vector 行為改變」則與 PR #1025 的事實相反，舊 vector 正因為 bound 從 3 變 4 才被標成 IsV080IncompatibleVector。","trap":"n 的分母是 |γ′_P| 不是 |κ′|；上界是 exclusive（r < n）；tiny 的 n 從 3 變 4。"},{"id":"ch06-code-header-checks-posterior","ch":"6","section":"6.4 Sealing and Entropy Accumulation","gpRef":"eq. 6.16–6.18, 6.28; §5 eq. 5.10 — internal/stf/sft.go RunSTF, validate_header.go ValidateHeaderVrf","difficulty":3,"kind":"code","tags":["safrole","seal","markers","code","fuzzer","epoch"],"stem":"The team's RunSTF validates the header in two phases around UpdateSafrole; passing the POSTERIOR state to the second phase was the fix for fuzzer bug #784 'Header VRF Verification Failure on some cases' (PR #791). For the first block of a new epoch, why can the seal H_S, the entropy source H_V and the epoch marker H_E only be checked in the second phase?","code":{"lang":"go","caption":"internal/stf/sft.go (RunSTF) + validate_header.go (ValidateHeaderVrf)","src":"// Validate Non-VRF Header(H_E, H_W, H_O, H_I)\n// For non-genesis blocks, validate the header\nif header.Parent != (types.HeaderHash{}) {\n    err = ValidateNonVRFHeader(header, &priorState, extrinsic)\n    ...\n}\n...\n// Update Safrole\nerr = UpdateSafrole()\n...\npostState := cs.GetPosteriorStates().GetState()\n\n// After keyRotate\nerr = ValidateHeaderVrf(header, &priorState, &postState)\n...\nfunc ValidateHeaderVrf(header types.Header, priorState *types.State, posteriorState *types.State) error {\n    if err := safrole.ValidateHeaderEpochMark(header, priorState, posteriorState); err != nil {\n        return err\n    }\n    if err := safrole.ValidateHeaderSeal(header, posteriorState); err != nil {\n        return err\n    }\n    if err := safrole.ValidateHeaderEntropy(header, posteriorState); err != nil {\n        return err\n    }\n    return nil\n}"},"options":["Only for performance: ring-VRF verification is slow, so it is deferred until the cheap checks have passed; verifying against the prior state would give identical results in every block because κ, η and γ_S are stable within a block","Because all three depend on this block's own rotation: H_S is checked against γ′_S[H_T mod E] with H_A = κ′[H_I]_b and context η′_3, H_V against the same H_A, and H_E against γ′_P = Φ(ι); the prior κ/η/γ_S pass mid-epoch but fail at epoch boundaries","Because H_E must be compared with the posterior entropy η′_0, η′_1, which only exist after UpdateEtaPrime0; the seal itself could safely be verified against the prior state, since H_A = κ[H_I]_b by definition","Because the seal signs E_U(H), which embeds H_E and H_W, so those markers must be finalized first; the validator set itself is irrelevant, since κ′ = κ whenever the block is valid and the seal context η′_3 equals η_3 in every block"],"answer":1,"explanation":"eq. 6.16/6.17：i = γ′_S[H_T mod E]（posterior 序列），H_S 由 H_A 簽、context 用 η′_3；§5 eq. 5.10：H_A ≡ κ′[H_I]_b（posterior active set）；eq. 6.18：H_V 同樣由 H_A 驗；eq. 6.28：H_E 的 key 列表是 γ′_P = Φ(ι)。這些 posterior 值在 epoch 第一塊全由該塊自己的 KeyRotate（κ′ = γ_P）、UpdateEntropy（η′_3 = η_2）、UpdateSlotKeySequence 產生，所以 seal/entropy/epoch-mark 只能在 UpdateSafrole 之後驗。epoch 中段 κ′ = κ、η′_3 = η_3、γ′_S = γ_S，用 prior state 也會過——這正是 #784「on some cases」只在 epoch 邊界失敗的原因（trace 1758621879/00000348 被誤判為 error 7 VrfSealInvalid），PR #791 改成傳 posterior Kappa & Eta。其他選項：H_E 比對的是 **prior** η_0、η_1（ValidateHeaderEpochMark 用 priorState.Eta[0]/[1]），不是 η′_0/η′_1；「κ′ = κ whenever valid」在 e′ > e 時不成立；效能不是理由，而且 seal 是 IETF VRF 不是 ring VRF。H_W、H_O、H_X、H_R、H_I 只依賴 prior state 與 extrinsic，所以留在 ValidateNonVRFHeader（reviewer yu2C 堅持不要整個搬到 safrole 之後），其中 H_I 的 range check 必須最早做（#825）。順帶一提 sft.go 的註解「(H_E, H_W, H_O, H_I)」已過時——H_E 實際在 ValidateHeaderVrf 裡驗。","trap":"口訣：seal、H_V 看 posterior（γ′_S、κ′、η′_3）；H_E 看 prior η_0/η_1 + posterior γ′_P；H_W/H_O/H_I 只看 prior + extrinsic。"},{"id":"ch06-code-author-index-bound","ch":"6","section":"6.4 Sealing and Entropy Accumulation","gpRef":"§5 eq. 5.10 (H_I ∈ N_{|κ′|}), eq. 6.7–6.8, 6.14 — internal/stf/validate_header.go ValidateNonVRFHeader","difficulty":3,"kind":"code","tags":["safrole","validators","code","fuzzer","delta-0.8.0"],"stem":"After fuzzer bug #825 (panic 'index out of range [65535] with length 6' while computing η′_0), the team added this check to ValidateNonVRFHeader, which runs BEFORE UpdateSafrole. Which assessment is right under GP 0.8.0?","code":{"lang":"go","caption":"internal/stf/validate_header.go (ValidateNonVRFHeader)","src":"// Validate author_index out of range.\n// NOTE: There is currently no official error code defined for this case.\n// We may need to update this once the spec updates.\nif header.AuthorIndex >= types.ValidatorIndex(len(priorState.Kappa)) {\n    errCode := SafroleErrorCode.AuthorIndexOutOfRange\n    return &errCode\n}"},"options":["The GP bound is |κ′| (posterior), not |κ|; the check is equivalent today only because every key sequence here has exactly V entries (offenders are zeroed in place, #1037) — once a 0.8.0 set-size change makes |γ_P| ≠ |κ|, a bound taken from the prior κ is wrong at the boundary","The bound should be |ι|, since at an epoch boundary the block author is drawn from the staging set that eq. 6.14 has just promoted into κ′; bounding by either the prior or the posterior κ would reject every author from the incoming set on the first block","The check is exactly what the GP specifies: eq. 5.10 bounds H_I by |κ|, the prior active set, which is precisely why it can be verified before key rotation without loss of generality, and it therefore covers the fuzzer's 65535 case at any validator-set size","The check is unnecessary: an out-of-range H_I already fails the seal signature check and is reported as VrfSealInvalid, so the fuzzer's expected rejection is produced anyway; the real fix for #825 belonged inside UpdateEtaPrime0, where the panic was raised"],"answer":0,"explanation":"§5 eq. 5.10：H_I ∈ N_{|κ′|}、H_A ≡ κ′[H_I]_b——邊界是 **posterior** κ′ 的長度。#825 的 panic（index out of range [65535] with length 6）就是 H_I 在 range check 之前被拿去索引 validator 陣列；Go 直接 panic 而不是回傳錯誤，fuzzer 視為 target crash，所以「seal check 反正會失敗」不成立——根本走不到簽章驗證。這段檢查放在 ValidateNonVRFHeader（UpdateSafrole 之前），手上只有 prior state，於是用 len(priorState.Kappa)。今天這是等價的：codebase 裡 ι/γ_P/κ/λ 永遠都是 V 筆（offender 只被 Φ 歸零、不移除，#1037），|κ| = |κ′|。但 GP 0.8.0 eq. 6.7/6.8（PR #514）允許每個序列長度各自 ∈ N_V = {6, 9, …, 1023}，designate host call 也只要求 z ∈ N_V；當 |γ_P| ≠ |κ| 時，epoch 第一塊的 κ′ = γ_P（eq. 6.14）長度會變（eq. 11.18 也因此在 |κ| ≠ |κ′| 時清空 ρ‡），正確做法是先算出 κ′ 的長度（e′ > e 時取 |γ_P|，否則 |κ|）再檢查。「GP 用 prior κ」與「用 |ι|」都是錯的 set：eq. 6.14 在邊界上把 ι 推進的是 γ′_P，κ′ 取的是舊 γ_P，所以 ι 還要再過一個邊界才成為 κ，「ι 剛被提升為 κ′」的前提本身就不成立。把修法塞進 UpdateEtaPrime0 也治標不治本：任何在它之前索引 κ′[H_I] 的路徑（例如取 H_A ≡ κ′[H_I]_b 去驗 seal）都會先 panic。錯誤碼方面 GP/官方 enum 沒有對應值，你們暫用 AuthorIndexOutOfRange (13)。","trap":"面試官可能追問：H_I 越界時你們回什麼？答：沒有官方 code，自訂 13；重點是必須在任何 κ′[H_I] 之前檢查，否則 panic。"},{"id":"ch06-skip-epochs-transition","ch":"6","section":"6.3–6.7 (epoch transition across skipped epochs)","gpRef":"eq. 6.2, 6.14, 6.24, 6.25, 6.28–6.29, 6.35","difficulty":3,"kind":"concept","tags":["safrole","epoch","entropy","fallback","markers","calc"],"stem":"Full parameters (E = 600, Y = 500). The prior block has τ = 1195 and a saturated accumulator (|γ_A| = E); the next block has H_T = 1810 (nothing was authored in between). Expressing posterior values in terms of PRIOR ones, which description of this transition is correct?","options":["Rotation is applied once per elapsed epoch, i.e. twice here: κ′ = Φ(ι), λ′ = γ_P, (η′_1, η′_2, η′_3) = (η′_0, η_0, η_1); γ′_S = F(η_0, Φ(ι)); H_E is present and H_W absent","Rotation happens exactly once: κ′ = γ_P, λ′ = κ, γ′_P = Φ(ι), (η′_1, η′_2, η′_3) = (η_0, η_1, η_2); γ′_S = F(η_1, γ_P) despite m = 595 ≥ Y and a full γ_A; H_E is present, H_W absent; γ′_A is rebuilt from this block's E_T alone","γ′_S = Z(γ_A) because the prior block sat in the tail (m = 595 ≥ Y) with a saturated accumulator; keys and entropy rotate once; H_W = Z(γ_A) is emitted as well since this block closes the contest","The block is rejected with BadSlot: eq. 6.25 has no case for e′ = e + 2, so a chain may skip individual slots but never an entire epoch; the next valid H_T is therefore some slot of epoch 2, and only from there can epoch 3 be reached"],"answer":1,"explanation":"計算：e ⌢ m = 1195/600 → e = 1、m = 595；e′ ⌢ m′ = 1810/600 → e′ = 3、m′ = 10（eq. 6.2）。eq. 6.14 與 6.24 的條件都是布林的 e′ > e，與 e′ − e 無關，所以 key 與 entropy **只 rotate 一次**：κ′ = γ_P、λ′ = κ、γ′_P = Φ(ι)、(η′_1, η′_2, η′_3) = (η_0, η_1, η_2)——state 只記得最後一塊，沒有「中間 epoch」可言。eq. 6.25 第一種情況要求 e′ = e + 1，這裡 e′ = e + 2 不成立，即使 m = 595 ≥ Y 且 |γ_A| = E 也走 F(η′_2, κ′) = F(η_1, γ_P)（vector skip_epochs-1：「Progress skipping epochs with a full tickets accumulator. Tickets mark is not generated. Accumulated tickets discarded. Fallback method enacted」）。eq. 6.28：e′ > e → H_E = (η_0, η_1, γ′_P 的 (k_b, k_e))；eq. 6.29：H_W 需要 e′ = e → ∅。eq. 6.35：e′ > e → γ′_A 只由本塊的 n 組成（m′ = 10 < Y，可帶最多 K 張、對新的 γ′_Z 與 context X_T ⌢ η_1 驗）。本塊 seal 走 fallback：H_A = γ′_S[10]、context X_F ⌢ η′_3 = X_F ⌢ η_2、T = 0。BadSlot 只在 τ′ ≤ τ 時觸發（vector enact_epoch_change_with_no_tickets-2「Timeslot must be strictly monotonic」），跳過任意多 slot 或 epoch 都合法。你們的程式：UpdateEntropy/KeyRotate 用 `ePrime > e`，UpdateSlotKeySequence 用 `ePrime == e+1`，正好對應。","trap":"跳 N 個 epoch ≠ rotate N 次；6.25 要的是 e′ = e + 1（精確），6.14/6.24 要的是 e′ > e（任意）。"},{"id":"ch06-variable-set-boundary","ch":"6","section":"6.3 Key Rotation / 6.7 The Extrinsic and Tickets","gpRef":"eq. 6.7–6.8, 6.14, 6.28, 6.30; §5 eq. 5.10","difficulty":3,"kind":"delta","tags":["safrole","validators","tickets","delta-0.8.0","calc"],"stem":"Tiny parameters (E = 12). During epoch e the delegator service set the staging set ι to 9 validators while γ_P and κ still hold 6 — a legal 0.8.0 configuration (eq. 6.8). Consider the first block of epoch e + 1. Which statement is correct?","options":["n = ⌊24/9
