η′_2、抽的是 κ′ 的 Bandersnatch key（§6），與 β 無關；「存 8 個 posterior state root 給 Grandpa 投票、β_B 放對應 BLS 簽章」錯，最新一筆的 s 在本塊仍是 H_0、要等下一塊的 β† 用 H_R 補正（eq. 7.5），β_B 是 Keccak 的 accumulation-output belt（eq. 7.7）不存任何簽章，BEEFY 的 BLS 簽章（eq. 18.1）也不進狀態。","trap":"anchor 深度 ≤ 8 blocks；lookup anchor 深度 ≤ 14,400 slots（用 ancestors A）。"},{"id":"ch08-pool-queue-sizes","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 8.1","difficulty":1,"kind":"concept","tags":["authorization","state"],"stem":"What are the shapes of the authorizer pool α and authorizer queue φ?","options":["α ∈ [[H]_{:O}]_C with O = 8 (up to 8 authorizer hashes per core); φ ∈ [[H]_Q]_C with Q = 80 (exactly 80 per core)","α and φ are both dictionaries D⟨H → N_C⟩ from authorizer hash to core index, so no hash ever repeats and no per-core length bound is needed","α ∈ [[H]_{:Q}]_C with Q = 80 (up to 80 pooled per core); φ ∈ [[H]_O]_C with O = 8 (exactly 8 queued per core)","α ∈ [H]_C — one live authorizer per core, replaced every block; φ ∈ [[H]_E]_C with E = 600, one queue entry per epoch slot"],"answer":0,"explanation":"eq. 8.1：α ∈ [[H]_{:O}]_C，O = C_authpoolsize = 8（最多 8 個）；φ ∈ [[H]_Q]_C，Q = C_authqueuesize = 80（固定 80 個）。pool 是「現在可以用的 authorizer」，queue 是「未來每個 slot 依序補進 pool 的 authorizer」。φ 只能由 accumulate 中具 assigner 權限（χ_A[c]）的 service 透過 `assign` host call 修改。干擾項：把 O 與 Q 對調（pool 最多 80、queue 剛好 8）是最常見的記憶錯亂；「每個 core 只有一個 authorizer、queue 長度等於 epoch 長度 E = 600」錯在兩處——α[c] 是可容納多個 hash 的序列（eq. 8.3 才需要「移除最左邊一個」這種運算），而 queue 長度是獨立常數 Q = 80，不隨 E 走，rotation 用的是 H_T mod Q；「兩者都是 hash → core index 的 dictionary、不重複」則和 eq. 8.1 的型別直接衝突：兩者都是 per-core 的序列（C(1) 編成 [var(x) | x ∈ α]、C(2) 編成 E(φ)），同一個 authorizer hash 在同一個 pool 裡重複出現完全合法。","trap":"O = 8、Q = 80；pool 是 :O（可少於 8），queue 是固定長度 Q。"},{"id":"ch08-pool-update","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 8.2–8.3","difficulty":3,"kind":"calc","tags":["authorization","calc"],"stem":"Core c has pool α[c] = [a, b, a, d] (left = oldest) and a guarantee in E_G for core c whose report has authorizer a. With φ′[c][H_T mod Q] = x and O = 8, what is α′[c]?","options":["[b, d, x] — both copies of a are removed before x is appended, because a pool never holds the same authorizer twice","[x, a, b, a, d] — the queue entry is prepended at the head and the used authorizer is dropped only once the pool would exceed O = 8","[a, b, a, d, x] — x is appended and nothing is removed, since F(c) only trims the pool once it already holds O = 8 entries","[b, a, d, x] — the leftmost occurrence of a is removed, then x is appended, and the last O entries are kept"],"answer":3,"explanation":"eq. 8.2：α′[c] ≡ ←(F(c) ⌢ φ′[c][H_T mod Q])^O；eq. 8.3：F(c) = α[c] ⊖ {w_a}（⊖ 是「移除最左邊一個」的 seqminusl 運算）當 E_G 裡有 core c 的 guarantee，否則 α[c]。所以先移除最左邊那個 a → [b, a, d]，再 append x → [b, a, d, x]，長度 4 ≤ 8 不需截斷。每個區塊每個 core 都會 append 一個（即使沒有 guarantee），滿 8 時以 ←^O 保留**最後** 8 個（丟最舊）。你們的 authorization 模組註解：remove leftmost occurrence, append φ′[c][H_T mod Q], keep last 8。三個錯誤選項各對應一個真實踩雷：把兩個 a 都刪掉正是 bug #692（⊖ 是 seqminusl，只砍最左邊一個；pool 是序列，允許重複）；「pool 未滿就不移除」把 F(c) 的條件記成長度條件——eq. 8.3 的條件是「E_G 裡存在 core c 的 guarantee」，與長度無關，截斷才是長度條件；「prepend 再從尾端丟」方向相反——eq. 8.2 是 F(c) ⌢ 新項再取 ←(…)^O，新項附在右邊、被丟掉的是最左邊（最舊）的。","trap":"H_T mod Q 用的是本塊 timeslot 對 80 取餘；用 posterior φ′。"},{"id":"ch08-authorizer-identity","ch":"8","section":"8.1 Authorizers and Authorizations","gpRef":"§8.1 & eq. 14.11 (§14.3; delta #522)","difficulty":2,"kind":"delta","tags":["authorization","delta-0.8.0"],"stem":"How is an authorizer identified in GP 0.8.0, and where is the authorization decision actually made?","options":["Authorizer = the Ed25519 key of the coretime purchaser, so α[c] is a list of up to O = 8 buyer keys and guarantors verify a signature by one of them over the work-package hash rather than executing any PVM code","Authorizer = the is-authorized code hash alone, with the configuration blob passed to Ψ_I separately; the block author runs that code while building the block and other validators trust the trace it publishes","Authorizer = H(PVM code hash ⌢ configuration blob); the is-authorized decision is made entirely in-core by the guarantors (Ψ_I), while on-chain logic only checks that the authorizer is in the core's pool","Authorizer = H(token ⌢ trace), so the pool entry commits both to the argument supplied with the package and to the output it produced; every validator therefore re-runs Ψ_I at block import to recompute that hash"],"answer":2,"explanation":"§8.1：「Authorizers are identified as the hash of their PVM code hash concatenated with their Configuration blob」（0.8.0 #522 統一了第 8 章與第 14 章的定義：work-package 帶 auth code hash h 與 config c，report 的 authorizer a = H(h ⌢ c)）。三個概念：Token（隨 package 附的 opaque 資料）、Trace（成功授權時輸出的 opaque 資料，進 report 的 o 欄位）、Authorizer（在固定 gas G_I = 50M 下判斷是否授權的 PVM 邏輯）。「The process by which work-packages are determined to be authorized… happens entirely in-core」；鏈上只驗 w_a ∈ α[w_c]（eq. 11.32）。干擾項為何錯：「只雜湊 code hash、config 另外傳」與 eq. 14.11 的 p_a ≡ H(p_u ⌢ p_f) 相違，config 就在雜湊裡面，換 config 就換出另一個 authorizer；而且出塊者不會在鏈上跑 authorizer——§8.1 說得很白：「not the competence of on-chain logic and happens entirely in-core」。「H(token ⌢ trace)」把識別碼和執行結果搞混：token 與 trace 是每個 package 各自不同的 opaque 資料，authorizer 必須在任何執行之前就能拿去和 α[c] 比對。「coretime 購買者的 Ed25519 key」錯在型別與機制：eq. 8.1 的 α ∈ ⟦⟦H⟧_:O⟧_C 裝的是 hash，且 §8.1 定義 Authorizer 是「a piece of logic which executes within some pre-specified and well-known computational limits」，授權靠跑 PVM（G_I = 50M gas）而不是驗簽名。","trap":"on-chain 不執行 authorizer code；只查 pool。"},{"id":"ch08-why-authorization","ch":"8","section":"8 Authorization","gpRef":"§8 intro","difficulty":1,"kind":"rationale","tags":["authorization","rationale"],"stem":"What motivation does the GP give for the authorization system?","options":["To give each core its own gas market: guarantors bid for coretime block by block and the clearing price is recorded next to the authorizer hash in α[c], so a congested core costs more to use","To disentangle the intention of using some coretime from the specification and submission of a particular workload, so that JAM can support both Ethereum-style and Polkadot-style interaction patterns","To replace Grandpa's finality votes with per-core authorizer votes: a work-report is final once more than two thirds of the authorizers pooled for its core have signed it, which is what the bound O = 8 sizes","To cap how much work one service may submit: the pool's O = 8 entries act as a per-service rate limiter, so a service that already had a package reported this timeslot cannot have a second one guaranteed on any core"],"answer":1,"explanation":"§8 intro：Ethereum 的 gas 由交易作者當場購買（購買者 = 作者）；Polkadot 的 parachain slot 由團隊長期租用（購買者通常 ≠ 出塊者）。「On a principle of flexibility, we would wish JAM capable of supporting a range of interaction patterns both Ethereum-style and Polkadot-style… we introduce the authorization system, a means of disentangling the intention of usage for some coretime from the specification and submission of a particular workload」——這就是「買 coretime 的人」與「提交 work-package 的人」可以不同人的來源。三個干擾都有具體錯誤：「每個 core 自己的 gas 市場、成交價跟著 authorizer hash 存進 α[c]」——eq. 8.1 的 α ∈ ⟦⟦H⟧_:O⟧_C 只裝 32-byte hash，沒有價格欄位，is-authorized 與 refine 的 gas 也是協定常數 G_I / G_R，JAM 鍵上沒有競標。「authorizer 投票取代 Grandpa」——authorizer 是一段 PVM 邏輯而不是簽名者，三分之二門檻屬於 availability assurances（對 κ 計票），finality 由 Grandpa / BEEFY 負責。「O = 8 是 per-service 速率限制」——α 是 per-core 不是 per-service，「一個 core 一塊最多一份 report」來自 eq. 11.32 的 ρ‡[w_c] = ∅ 與 E_G 依 core 排序不重複，協定並未限制單一 service 能送幾份 package。","trap":"設計理念題常見；連結到 §4.9.2 coretime 與 §14 的 is-authorized。"},{"id":"ch09-account-fields","ch":"9","section":"9 Service Accounts","gpRef":"eq. 9.3","difficulty":2,"kind":"concept","tags":["accounts","state"],"stem":"Which of the following is NOT a field of a service account A in GP 0.8.0 (eq. 9.3)?","options":["a_p — the parent service index, i.e. the service that created this one","a_f — the gratis storage offset, a balance-denominated deposit credit","a_n — a nonce, incremented once on every accumulation of the service","a_m — the minimum gas required for each deferred transfer (minmemogas)"],"answer":2,"explanation":"eq. 9.3：A ≡ (s storage, p preimages, l requests, f gratis, c codehash, b balance, g minaccgas, m minmemogas, r created, a lastacc, p parent)——十一個欄位，另外三個選項描述的都在其中且描述正確：gratis storage offset 就是 a_t = max(0, B_S + B_I·a_i + B_L·a_o − a_f) 裡被扣掉的那筆 deposit credit；parent service index 記錄建立這個帳戶的 service；minmemogas 依 §9.1 是「the minimum gas required per deferred-transfer」（對照 a_g minaccgas 是 per work-item）。nonce 則根本不存在——§4.9.2：「Since they are not controlled by a secret key, they do not need a nonce.」service 不由私鑰控制、系統裡也沒有使用者交易，就沒有重放問題可防。a_f（gratis）與 a_r/a_a/a_p 是 0.6.7～0.7.x 加入的 metadata；manager 才能建立帶 gratis 的 service（`new` 的 f ≠ 0 需要 manager 權限）。","trap":"兩個 gas 下限：a_g 每個 work-item 的 accumulate 最低 gas；a_m 每筆 deferred transfer 的最低 gas。"},{"id":"ch09-code-metadata","ch":"9","section":"9.1 Code and Gas","gpRef":"eq. 9.4","difficulty":2,"kind":"concept","tags":["accounts","code"],"stem":"How are a service's code a_c and metadata a_m derived from its code hash?","options":["The preimage of a_c in the account's own lookup a_p must decode as E(var(m), c) — a var-length metadata blob followed by the code; otherwise both are ∅","The preimage is fetched from the manager service χ_M's lookup, so all service code is held centrally; the leading 32 octets of that blob are the metadata","The code sits directly in the storage dictionary a_s under the key a_c, with the metadata under a_c ⌢ [0]; a missing entry leaves the service on its previous code","a_c is the Blake2b of the raw code alone and the metadata lives in the storage dictionary a_s; a missing preimage still leaves the code resolvable from its hash"],"answer":0,"explanation":"eq. 9.4：(a_m, a_c) = (m, c) 當 E(var(m), c) = a_p[a_c]，否則 (∅, ∅)。即 code hash 指向的、且必須在服務自己的 preimage lookup a_p 裡的那份 preimage，內容是「var-length metadata ⌢ code」的編碼；metadata 是 opaque（JIP-6 討論標準化）。說 code 放在 storage dictionary a_s 的選項錯了 state 成分：a_s 是 accumulate 才寫得到的 on-chain key/value，refine 在 in-core 讀不到它，正因如此 code 必須走 preimage 這條路（§9.2：preimage 才是「available also in-core」的那一種）；而且找不到 code 時 GP 給的是 (∅, ∅)，沒有「沿用舊 code」這回事。說 code 存在 manager service χ_M 的 preimages 的選項也錯：χ_M 的權力限於改 χ 與發 gratis credit（§9.4），code 一律取自服務自己的 a_p；metadata 也不是固定 32 octets，而是 var 前綴的變長 blob。說 a_c 是「raw code 的 Blake2b」的選項同樣錯：由 eq. 9.6 的不變式 (h ↦ d) ∈ a_p ⟹ h = H(d) 可知 a_c 雜湊的是整個 E(var(m), c) 編碼而非裸 code，且 hash 本身不能反推出 preimage——preimage 不在 state 裡，服務就是不能執行，refine 會回 BAD（eq. 11.7 的 BAD = code unavailable at lookup anchor）。entry points：0 = refine（in-core）、1 = accumulate（on-chain）（0.7.1 起 on_transfer 併入 accumulate）。","trap":"`new` 會在 requests 裡放 (c, l) → []，等待 preimage 被提供。"},{"id":"ch09-lookup-status","ch":"9","section":"9.2 Preimage Lookups","gpRef":"§9.2.2 Semantics, eq. 9.7","difficulty":2,"kind":"concept","tags":["accounts","preimages"],"stem":"A request entry a_l[(h, len)] holds a sequence of up to 3 timeslots. What does [x, y] mean, and what does [x, y, z] mean?","options":["[x, y]: the preimage was available from x and is unavailable since y; [x, y, z]: it was available from x until y and is available again since z","[x, y]: the preimage was requested at x and was first supplied at y; [x, y, z]: supplied at y and then expunged from state entirely at z","[x, y]: the preimage was available from x and was expunged from state at y; [x, y, z]: an illegal shape that no host call can ever produce","[x, y]: two distinct services requested the same preimage, one at x and one at y; [x, y, z]: three distinct services each requested it"],"answer":0,"explanation":"§9.2.2：h = []：requested 未提供；[x]：自 x 起 available；[x, y]：曾於 x 可用、自 y 起 unavailable；[x, y, z]：x～y 可用、z 起再次可用。eq. 9.7 的 I(l, t)：[x] → x ≤ t；[x,y] → x ≤ t < y；[x,y,z] → x ≤ t < y ∨ z ≤ t；[] → ⊥。說「x 是 request 時間、y 是首次供應時間」的選項錯在序列裡根本沒有記錄 request 時刻：request 的狀態就是空序列 []，一被供應就直接變成單元素 [x]，x 已經是「可用起始時間」；而 z 標記的是再次可用、不是刪除。說 [x, y] 代表「y 時已被 expunge」、且 [x,y,z] 非法的選項錯兩處：[x, y] 只是被標成 unavailable，preimage 本身仍留在 a_p 裡（真正的移除要靠 `forget`，而且還要等 y < t − D）；[x,y,z] 是 §9.2.2 明列的四種合法形狀之一。說三個時刻代表不同請求者的選項則搞錯了這個 dictionary 的歸屬：a_l 本來就掛在單一服務帳戶底下，鍵是 (h, len)、值是這個服務自己的可用性歷史，不記錄任何請求者身分。這個「歷史可用性」是為了 in-core refine 的 historical_lookup 能在任何 lookup-anchor 時點被確定性地重算（審計需要）。你們 `query` host call 把這四種狀態編成 φ_7/φ_8。","trap":"再次 solicit 一個 [x,y] 會變 [x,y,t]；forget 一個 [x] 變 [x,t]；forget [x,y]（y 夠舊）才真正刪除。"},{"id":"ch09-historical-lookup-calc","ch":"9","section":"9.2 Preimage Lookups","gpRef":"eq. 9.7 (Λ)","difficulty":2,"kind":"calc","tags":["accounts","preimages","calc"],"stem":"A service has preimage p (hash h, length 40) with a_l[(h, 40)] = [100, 250, 400]. Which statement about the historical lookup Λ(a, t, h) is correct?","options":["Λ returns p for any t ≥ 100","Λ returns p for t = 300 only","Λ returns p for t = 120 but ∅ for t = 450, since the last entry marks a second withdrawal","Λ returns p for t = 120 and t = 450, but ∅ for t = 300"],"answer":3,"explanation":"eq. 9.7：[x,y,z] 的條件是 x ≤ t < y ∨ z ≤ t。t=120：100 ≤ 120 < 250 ✓；t=300：不在 [100,250) 且 300 < 400 ✗；t=450：450 ≥ 400 ✓。Λ 還要求 h ∈ keys(a_p)（preimage 還在 state 裡）。注意 t 的定義域是 (H_T − D) … H_T，D = 19,200 slots（32 小時）——超過這個期間的 preimage 可能已被 expunge。","trap":"三個時間點的語意：available / unavailable / available again。"},{"id":"ch09-footprint-formula","ch":"9","section":"9.3 Account Footprint and Threshold Balance","gpRef":"eq. 9.8","difficulty":2,"kind":"concept","tags":["accounts","balance"],"stem":"How are the footprint a_i (items) and a_o (octets) and the threshold balance a_t defined?","options":["a_i = 2·|a_l| + |a_s|; a_o = Σ_{(h,z)∈keys(a_l)} (32 + z) + Σ_{(x,y)∈a_s} (32 + |y|); a_t = max(0, B_I·a_i + B_L·a_o − a_f)","a_i = 2·|a_l| + |a_s|; a_o = Σ_{(h,z)∈keys(a_l)} (81 + z) + Σ_{(x,y)∈a_s} (34 + |x| + |y|); a_t = max(0, B_S + B_I·a_i + B_L·a_o − a_f)","a_i = 2·|a_p| + |a_s|; a_o = Σ_{(h,d)∈a_p} (81 + |d|) + Σ_{(x,y)∈a_s} (34 + |x| + |y|); a_t = max(0, B_S + B_I·a_i + B_L·a_o − a_f)","a_i = |a_l| + |a_s|; a_o = Σ_{(h,z)∈keys(a_l)} (81 + z) + Σ_{(x,y)∈a_s} (34 + |x| + |y|); a_t = max(0, B_S + B_I·a_i + B_L·a_o)"],"answer":1,"explanation":"eq. 9.8：每個 lookup request 算 2 個 item 與 81+z octets（z 是宣告的 preimage 長度；81 是 GP 給定的固定開銷常數），每個 storage entry 算 1 個 item 與 34+|k|+|v| octets（34 同為固定開銷）。這些數字直接寫在 eq. 9.8 裡，面試時不需要推導、但要記得。a_t = max(0, B_S + B_I·a_i + B_L·a_o − a_f)，B_S = 100、B_I = 10、B_L = 1（appendix I），a_f 是 gratis 抵扣。把 a_i 寫成 |a_l| + |a_s|、且 a_t 不減 a_f 的選項錯兩處：request 的係數是 2 不是 1（GP 寫的是 2·|a_l|），而 gratis offset 必須從門檻裡扣掉、扣到負數再由 max(0, ·) 夾回零。把求和換成跑 a_p、用實際 blob 長度 |d| 的選項錯在 state 成分：footprint 是對 requests dictionary a_l 的鍵 (h, z) 求和、用的是「宣告」長度 z，所以連還沒被供應（狀態 []）的 request 也要付押金——這正是 solicit 一發出就開始計費、防止免費占位的設計。把常數改成 32/32、並漏掉 B_S 的選項則錯三處：81 與 34 是 GP 明定的固定開銷，storage 的 key 長度 |x| 同樣要計入，而 base deposit B_S 是每個 service 都要付的底價。fuzzer 曾抓到你們少減 a_f（issue digest：因為 traces 的 DepositOffset 都是 0 所以一直沒發現）。","trap":"request 算 2 items；storage 算 1 item。"},{"id":"ch09-threshold-calc","ch":"9","section":"9.3 Account Footprint and Threshold Balance","gpRef":"eq. 9.8 with B_S=100, B_I=10, B_L=1","difficulty":2,"kind":"calc","tags":["accounts","balance","calc"],"stem":"A service has one preimage request of declared length 100, two storage entries each with a 4-octet key and a 10-octet value, and gratis a_f = 0. What is its threshold balance a_t?","options":["407","336","417","349"],"answer":2,"explanation":"a_i = 2·1 + 2 = 4；a_o = (81 + 100) + 2·(34 + 4 + 10) = 181 + 96 = 277；a_t = max(0, 100 + 10·4 + 1·277 − 0) = 100 + 40 + 277 = 417。錯誤選項：407 = 把 request 只算 1 個 item（a_i = 3）；336 = 漏掉 request 的 81 octets 固定開銷（a_o = 196）；349 = 漏掉 storage 每筆 34 octets 固定開銷（a_o = 209）。","trap":"面試可能請你當場算 threshold；記住 81/34 兩個常數。"},{"id":"ch09-privileges","ch":"9","section":"9.4 Service Privileges","gpRef":"eq. 9.9–9.10","difficulty":2,"kind":"concept","tags":["accounts","privileges"],"stem":"The privileges state χ ≡ (χ_M, χ_V, χ_R, χ_A, χ_Z). Which mapping of privilege → power is correct?","options":["χ_M: the service that pays the accumulation gas of every other service; χ_V: the current active validator set κ; χ_R: the service that registers preimages on behalf of others; χ_A: the auditors drawn afresh in each tranche; χ_Z: services allowed to hold a zero balance","χ_M manager: may alter χ (bless) and grant gratis storage; χ_V delegator: may set ι (designate); χ_R registrar: may create services with indices below S = 2^16; χ_A assigners (one per core): may set φ[c] (assign); χ_Z: services that accumulate every block with a fixed gas allowance","χ_M manager: may alter χ (bless) and grant gratis storage; χ_V delegator: may set κ directly; χ_R registrar: may create services at any index; χ_A: one global assigner that sets φ for all cores; χ_Z: services that accumulate once per epoch","χ_M manager: may set ι (designate); χ_V delegator: may alter χ (bless); χ_R registrar: may set φ[c] (assign); χ_A assigners (one per core): may create services with indices below S = 2^16; χ_Z: services exempt from gas metering while they accumulate"],"answer":1,"explanation":"§9.4 與 eq. 9.9：χ_M（manager）可改變 χ 並授予 storage deposit credits（gratis）；χ_V（delegator）可設定 ι（下下個 epoch 的 validator keys，透過 `designate`）；χ_R（registrar）可建立 index < S = 2^16 的受保護 service；χ_A ∈ [N_S]_C 每個 core 一個 assigner，可改 φ[c]（`assign`）；χ_Z ∈ D⟨N_S→N_G⟩ always-accumulate 服務與其每塊的基本 gas。把四種權力互換持有者的選項（manager 去設 ι、delegator 去 bless、registrar 去 assign、assigners 去開低編號 service）每一條都對不上 §9.4 的文字順序「manager … able to effect an alteration of χ … as well as bestow services with storage deposit credits. The next, χ_V, is able to set ι. Then χ_R alone is able to create new service accounts with indices in the protected range. The following, χ_A, are the service indices capable of altering the authorizer queue φ, one for each core.」；而且 χ_Z 不是「免計 gas」，它拿到的是每塊一份固定 gas 額度，一樣照 PVM 計量。把五者說成 validator set、auditors、代付 gas 者、可以零餘額者的選項錯在型別：eq. 9.9 五個成分全都是 service index（χ_A 是長度 C 的 index 序列、χ_Z 是 index→gas 的 dictionary），既不是 κ 也不是審計者集合；accumulate 的 gas 來自 work-report 各 digest 宣告的額度，沒有誰替別人付。最後一個選項有三處錯：delegator 設的是 ι 不是 κ（ι 要經過 γ_k 才輪到 κ，見 eq. 6.14），registrar 的權限恰恰是「protected range」也就是 index < 2^16 這一段，χ_A 是一個 core 一個 assigner 的序列而非單一全域者，而 χ_Z 的服務是每個 block 都 accumulate，不是每個 epoch 一次。0.8.0 (#519) 把 `bless` 限制為只有 manager 可呼叫——之前的漏洞：任意 service 可 bless 自己成 manager 再用 `new` 取得 gratis storage。","trap":"registrar 是 0.7.1 加入的（Small service IDs）；0.8.0 bless 只限 manager。"},{"id":"ch09-preimage-vs-storage","ch":"9","section":"9.2 Preimage Lookups","gpRef":"§9.2 intro","difficulty":1,"kind":"rationale","tags":["accounts","preimages","rationale"],"stem":"The GP lists three differences between preimage lookups and general storage. Which is NOT one of them?","options":["Preimage data, once supplied, goes through an 'unavailable' period before it may be removed, so that its historical availability is retained","Preimage data is supplied extrinsically (via E_P), whereas storage data originates from the service's own accumulation","Preimages may be removed instantly by the service, whereas storage entries are retained for 28 days","Preimages map a hash to its preimage, whereas storage maps arbitrary keys to values"],"answer":2,"explanation":"§9.2：三個差異——(1) hash→preimage vs 任意 key→value；(2) preimage 由 extrinsic 外部提供，storage 由 accumulate 產生；(3) preimage 「once supplied, may not be removed freely; instead it goes through a process of being marked as unavailable, and only after a period of time may it be removed」。理由：refine 在 in-core 用 historical_lookup 查 preimage，審計時必須能確定「當時是否可用」。「preimage 可立即移除、storage 保留 28 天」把方向說反了。","trap":"forget 後要等 D = 19,200 slots 才能真正刪除。"},{"id":"ch10-state","ch":"10","section":"10.1 The State","gpRef":"eq. 10.1","difficulty":1,"kind":"concept","tags":["disputes","state"],"stem":"The disputes state is ψ ≡ (ψ_G, ψ_B, ψ_W, ψ_O). What do the four components hold?","options":["ψ_G and ψ_B are sets of work-report hashes judged correct and incorrect; ψ_W is the queue of verdicts still short of the ⌊2|k|/3⌋+1 threshold; ψ_O is the balance slashed from each offender","ψ_G, ψ_B and ψ_W are sets of the validator indices which respectively guaranteed, audited and disputed a report; ψ_O is a set of the report hashes that have been judged invalid","ψ_G, ψ_B and ψ_W are sets of work-package hashes judged respectively correct, incorrect and impossible to judge; ψ_O is a set of the Bandersnatch keys of validators found to have misjudged a report","ψ_G, ψ_B and ψ_W are sets of work-report hashes judged respectively correct, incorrect and impossible to judge; ψ_O is a set of the Ed25519 keys of validators found to have misjudged a report"],"answer":3,"explanation":"eq. 10.1：ψ ≡ (ψ_G, ψ_B, ψ_W, ψ_O)。前三者都是 **work-report hash** 的集合：good（判定正確）、bad（判定錯誤）、wonky（無法判定）；ψ_O 是 punish-set，裝的是 **Ed25519 key**（不是 index，因為 validator 集合每個 epoch 會變），供 Φ 在換屆時把 offender 的 key 清零，也供上層 staking 系統 slash。§10 說明 verdict 很少發生，但是「an important security backstop for removing and banning invalid work-reports from the processing pipeline」。把三個集合說成「誰 guarantee／audit／dispute 過」的 validator index 是錯的：它們裝的是 report hash 本身，而且該敘述又把 ψ_O 說成 report hash，正好與 GP 相反。「work-package hash ＋ Bandersnatch key」錯兩處：judgment 針對的是 work-report（hash 為 H(E(w))），而 punish-set 用的是 Ed25519 key。「ψ_W 是還沒湊滿 ⌊2|k|/3⌋+1 票的 verdict 佇列、ψ_O 是罰沒餘額」也錯：eq. 10.4 要求 verdict 一進鏈就恰好帶 ⌊2|k|/3⌋+1 個 judgment，鏈上不存在「票數不足待補」的 verdict，wonky-set 同樣只裝 report hash；且 §10 明說 JAM 自己不動餘額，slashing 留給上層 staking 系統。","trap":"報告是 report hash H(E(w))；offender 用 Ed25519 key（不是 index，因為 validator 集合每個 epoch 會變）。"},{"id":"ch10-verdict-structure","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.2–10.4","difficulty":2,"kind":"delta","tags":["disputes","delta-0.8.0"],"stem":"Per GP 0.8.0, which statement about the verdicts component E_V of the disputes extrinsic is correct?","options":["Each verdict is (report hash, epoch index a ∈ {⌊τ/E⌋, ⌊τ/E⌋−1}, judgments); judgments must number at least ⌊2|k|/3⌋+1 and may be drawn from κ ∪ λ combined; there is no per-extrinsic cap on verdicts","Each verdict is (report hash, epoch index a ∈ {⌊τ/E⌋, ⌊τ/E⌋−1}, one aggregated BLS signature over the report hash); the signers must be ⌊2|k|/3⌋+1 members of k; at most N_V = 16 verdicts per extrinsic","Each verdict is (report hash, epoch index a ∈ {⌊τ/E⌋, ⌊τ/E⌋−1}, judgments); judgments must number exactly ⌊2|k|/3⌋+1 where k = κ if a is the current epoch else λ; at most N_V = 16 verdicts per extrinsic","Each verdict is (report hash, the timeslot at which the dispute was raised, judgments); judgments must number exactly ⌊|k|/3⌋+1 where k is always the posterior set κ′; at most N_V = 16 verdicts per extrinsic"],"answer":2,"explanation":"eq. 10.2：E_V ∈ [(H, ⌊τ/E⌋ − N_2, [(⊤/⊥, N, Ed25519 sig)])]_{:N_V}，N_V = 16（0.8.0 #525 新增硬上限）；E_C、E_F 各最多 N_O = 16。eq. 10.3：K(a) = κ 當 a = ⌊τ/E⌋（prior τ 的 epoch），否則 λ；每個 verdict 必須恰好包含 ⌊2|k|/3⌋+1 個 judgment（tiny：5；full：683），每個 judgment 由 k[i]_e 對 X_valid/X_invalid ⌢ report hash 簽名（X = $jam_valid / $jam_invalid）。你們 Verdict.Validate 檢查 ValidatorsSuperMajority 個票。「至少 ⌊2|k|/3⌋+1 票、簽署者可取 κ ∪ λ 聯集、且沒有數量上限」錯三處：eq. 10.4 是**恰好**不是至少；k = K(a) 只會是 κ 或 λ 其中一個（聯集只出現在 offender 的 k 定義，eq. 10.6–10.7）；而 0.8.0 (#525) 正是新增了 N_V = 16 這個硬上限。「第二欄是 dispute 的 timeslot、票數 ⌊|k|/3⌋+1、k 永遠取 κ′」也錯三處：第二欄是 epoch index（只能是 ⌊τ/E⌋ 或再減一）；⌊|k|/3⌋ 是 wonky 的判定門檻而非 judgment 個數；K(a) 取的是 **prior** 的 κ/λ，不是 posterior κ′。「單一聚合 BLS 簽章」錯：judgment 是 [(⊤/⊥, N, Ed25519 sig)] 的序列，每票必須可個別驗證、依 index 排序，並在事後被引用來構造 fault；BLS key 在 JAM 只用於 accumulation output 的 Beefy commitment。","trap":"epoch index 用 prior τ；票數是「恰好」不是「至少」。"},{"id":"ch10-verdict-thresholds","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.12 (V)","difficulty":2,"kind":"calc","tags":["disputes","calc","tiny"],"stem":"A verdict's outcome depends on t, the number of positive judgments among the ⌊2|k|/3⌋+1 signatures. In the tiny config (|k| = 6), which (t → outcome) table is correct, and what happens for any other t?","options":["t ≥ 4 → good (⊤); t ≤ 1 → bad (⊥); t ∈ {2, 3} → wonky (∅); no other t can occur","t = 5 → good (⊤); t = 0 → bad (⊥); t = 2 → wonky (∅); any other t makes the block invalid","t = 6 → good (⊤); t = 1 → bad (⊥); t = 2 → wonky (∅); any other t is silently ignored","t = 5 → good (⊤); t = 0 → bad (⊥); t = 3 → wonky (∅); any other t makes the block invalid"],"answer":1,"explanation":"eq. 10.12：V(a, j) = ⊤ 當 t = ⌊2|k|/3⌋+1；⊥ 當 t = 0；∅ 當 t = ⌊|k|/3⌋。tiny |k| = 6：⌊4⌋+1 = 5、0、⌊2⌋ = 2；full |k| = 1023：683、0、341。三個門檻都是**等式**而不是區間：讀成「t ≥ 4 算 good、t ≤ 1 算 bad、中間都算 wonky」會讓 t = 4、t = 1 這類分裂票也成立，但 V 在這些 t 根本沒有定義，而且「其他 t 不可能出現」的說法也錯——分裂票正是 dispute 最可能的結果。wonky 的門檻是 ⌊|k|/3⌋ = 2，不是 3；good 的門檻是 ⌊2|k|/3⌋+1 = 5，不是全票 6（eq. 10.4 規定 judgment 恰好 5 個，t = 6 在 tiny 下根本不可能），bad 是 0 而不是 1。落在三個等式之外的 t 使 verdict 無定義 → 區塊無效（你們的 code 回 `bad_vote_split`），不是「忽略該 verdict」。註腳：這三個門檻恰是三種動作的決策門檻，且安全假設要求 ≥ 2/3+1 的 validator 是 live 的（ELVES 論文）。","trap":"wonky 是「剛好 1/3 正票」，不是「介於中間」。"},{"id":"ch10-culprits-faults","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.6–10.7, 10.13","difficulty":3,"kind":"delta","tags":["disputes","delta-0.8.0"],"stem":"Which statement about culprits (E_C) and faults (E_F) is correct in GP 0.8.0?","options":["A culprit names a report in ψ′_B plus that guarantor's signature over X_G ⌢ r; a fault names a report whose claimed validity v contradicts the verdict (r ∈ ψ′_B ⇔ r ∉ ψ′_G ⇔ v); keys already in ψ_O may be re-reported to punish a repeat offender; every verdict, good, bad or wonky, needs ≥ 1 fault","A culprit names a report in ψ′_B plus that guarantor's signature over X_G ⌢ r; a fault names a report whose claimed validity v agrees with the verdict (r ∈ ψ′_G ⇔ v); offender keys must lie in (κ ∪ λ)'s Ed25519 keys minus ψ_O; a bad verdict needs ≥ 2 culprits and a good one ≥ 1 fault","A culprit names a report in ψ′_G plus that guarantor's judgment signature over X_valid ⌢ r; a fault names a report in ψ′_W whose claimed validity v contradicts the verdict; offender keys must lie in κ′'s Ed25519 keys alone; a good verdict still needs ≥ 1 fault","A culprit names a report in ψ′_B plus that guarantor's signature over X_G ⌢ r; a fault names a report whose claimed validity v contradicts the verdict (r ∈ ψ′_B ⇔ r ∉ ψ′_G ⇔ v); offender keys must lie in (κ ∪ λ)'s Ed25519 keys minus ψ_O; a good verdict still needs ≥ 1 fault"],"answer":3,"explanation":"eq. 10.6：∀(r, k, s) ∈ E_C：r ∈ ψ′_B ∧ k ∈ k ∧ s 是 k 對 X_G ⌢ r 的簽章（culprit = 曾 guarantee 一個壞 report 的人，用的正是他的 guarantee 簽章）。eq. 10.7：∀(r, v, k, s) ∈ E_F：r ∈ ψ′_B ⇔ r ∉ ψ′_G ⇔ v（fault 宣稱的 validity v 必須與 verdict 相反：對 bad report 投 valid，或對 good report 投 invalid）。k = {κ ∪ λ 的 Ed25519 key} \\ ψ_O。eq. 10.13：∀(r, ⊤) ∈ v：∃(r, …) ∈ E_F（good verdict 至少一個 fault——因為 2/3+1 全投正票的 verdict 必然有人先投了反票才會啟動 dispute）。0.8.0 #525「remove culprits requirement」拿掉了 bad verdict ≥ 2 culprits 的要求，所以「bad verdict 要配 ≥ 2 culprits」是 0.7.2 的規則；同一個干擾項還把 fault 的條件寫成「v 與 verdict 一致」，正好反了——fault 的定義就是「與已成立的 verdict 矛盾的判斷」。「culprit 指向 ψ′_G、簽的是 judgment 用的 X_valid、fault 指向 ψ′_W、key 只能取 κ′」四處都錯：culprit 是 bad report 的 guarantor，故 r ∈ ψ′_B 且用的是 guarantee 簽章 X_G ⌢ r（X_G = $jam_guarantee，正是 eq. 11.28 那把簽章，所以 ρ 在 0.8.0 要存整個 guarantee 才construct得出來）；fault 的條件寫在 ψ′_B/ψ′_G 上（wonky 不產生 fault）；k 取的是 κ ∪ λ 兩期的 Ed25519 key。「已在 ψ_O 的 key 可以再報一次」錯：k 的定義最後明確寫著 \\ ψ_O，重複上報的 offender 會讓區塊無效；同一個干擾項的「good、bad、wonky 每種 verdict 都要 ≥ 1 fault」也錯，eq. 10.13 只對 (r, ⊤) 有此要求。","trap":"你們 0.7.2 code 仍檢查 bad verdict ≥ 2 culprits（code-map 3.6.4）——0.8.0 要拿掉。"},{"id":"ch10-ordering","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.8–10.11","difficulty":2,"kind":"concept","tags":["disputes","ordering"],"stem":"Which ordering/uniqueness constraints does the disputes extrinsic impose?","options":["Verdicts ordered by the timeslot at which each dispute was raised; culprits and faults ordered by the offender's index within κ; judgments ordered by signature; duplicates anywhere are silently dropped rather than invalidating the block","Verdicts ordered & unique by report hash; culprits and faults each ordered & unique by report hash; judgments within a verdict ordered & unique by their ⊤/⊥ vote; a report hash already in ψ_G ∪ ψ_B ∪ ψ_W may be re-judged to overturn the earlier verdict","Verdicts ordered & unique by the verdict's epoch index; culprits and faults each ordered & unique by Ed25519 key; judgments ordered & unique by validator index; no verdict report hash may already be in ψ_O","Verdicts ordered & unique by report hash; culprits and faults each ordered & unique by Ed25519 key; judgments within a verdict ordered & unique by validator index; no verdict report hash may already be in ψ_G ∪ ψ_B ∪ ψ_W"],"answer":3,"explanation":"eq. 10.8：E_V 依 report hash 排序且唯一；10.9：E_C、E_F 依 offender 的 Ed25519 key 排序且唯一；10.10：verdict 的 report hash 與 ψ_G ∪ ψ_B ∪ ψ_W 不相交（已判過的不能再判——「recording reports found to be valid ensures that additional disputes cannot be raised in the future」）；10.11：每個 verdict 的 judgments 依 validator index 排序且唯一。這些是 test vectors（disputes/）大量 invalid case 的來源：not sorted、duplicate、already judged。「culprits/faults 依 report hash 排序、judgments 依 ⊤/⊥ 票值排序、已判過的可以重判翻案」三處都錯：offender 序列的排序鍵是 Ed25519 key（同一個 report 可能有多個 offender，用 hash 排不出唯一序），judgment 的排序鍵是 validator index，而 eq. 10.10 的 disjoint 條件正是要讓判決「一次定讞」——GP 說 recording valid reports「ensures that additional disputes cannot be raised in the future of the chain」。「verdicts 依 epoch index 排序、且只需與 ψ_O 不相交」錯：排序鍵是 report hash（epoch index 只有兩個可能值，根本排不出唯一序），而 ψ_O 裝的是 key，report hash 要比對的是 ψ_G ∪ ψ_B ∪ ψ_W。「依提交 timeslot／κ 內的 index 排序、重複靜默忽略」錯得最徹底：verdict 結構裡根本沒有 timeslot 欄位，offender 用 key 而非 index（跨 epoch index 會變），而任何未排序或重複都直接使區塊無效，不會被忽略。","trap":"culprits/faults 排序鍵是 key，不是 report hash。"},{"id":"ch10-effects","ch":"10","section":"10.2–10.3","gpRef":"eq. 10.14–10.19","difficulty":2,"kind":"concept","tags":["disputes","state"],"stem":"What are the state effects of processing E_D, and what must the header's offenders marker H_O contain?","options":["ρ†[c] is left untouched, a non-positive verdict only stopping accumulation later; ψ′_G, ψ′_B and ψ′_W each absorb their verdict's report hashes; ψ′_O absorbs all culprit and fault keys; H_O = H(E(E_D)), one commitment to E_D","ρ†[c] = ∅ for any core whose pending report was judged bad or wonky; ψ′_G, ψ′_B and ψ′_W each absorb their verdict's report hashes; ψ′_O absorbs all culprit and fault keys; H_O = [culprit keys in order] ⌢ [fault keys in order]","ρ†[c] = ∅ for any core whose pending report was judged bad or wonky; ψ′_G is emptied at each epoch change while ψ′_B and ψ′_W grow; ψ′_O absorbs the culprit keys only; H_O = [fault keys in order] ⌢ [culprit keys in order]","ρ†[c] = ∅ only for cores whose report was judged bad, wonky ones staying pending; ψ′_G, ψ′_B and ψ′_W each absorb their verdict's report hashes; ψ′_O absorbs all culprit and fault keys; H_O lists the offenders' validator indices"],"answer":1,"explanation":"eq. 10.14：∀c：ρ†[c] = ∅ 當 (H(ρ[c]_w), v) ∈ v 且 v ∈ {⊥, ∅}（bad 或 wonky 都清掉——「Authoring a block with a non-positive verdict has the effect of cancelling its imminent accumulation」）。eq. 10.15–10.18：ψ′_G/ψ′_B/ψ′_W 各自 ∪ 對應的 report hash；ψ′_O = ψ_O ∪ {culprit keys} ∪ {fault keys}。eq. 10.19：H_O ≡ [k | (…, k, …) ∈ E_C] ⌢ [k | ∈ E_F]（culprits 先、faults 後，各依其排序）。你們 ClearWorkReports 對 PositiveJudgmentsSum < 2V/3 的 verdict 清 ρ。「只有 bad 清 ρ†、wonky 留著等待、H_O 列 validator index」錯：eq. 10.14 的條件是 v ∈ {⊥, ∅}，wonky 代表「無法判定」，同樣不該讓它繼續走向 accumulation；而 eq. 10.19 的 H_O 是 Ed25519 key 的序列，不是 index。「ψ′_G 每個 epoch 清空、ψ′_O 只吸收 culprit、H_O 先 fault 後 culprit」錯三處：eq. 10.15–10.17 三個集合都只做 ∪（單調成長，這正是「同一個 report 不能被重複 dispute」的基礎，永遠不清空）；eq. 10.18 明寫 ψ′_O 同時吸收 E_C 與 E_F 兩邊的 key；eq. 10.19 的串接順序是 culprits 在前、faults 在後。「ρ† 完全不動、H_O 是 E_D 的 hash」錯：清 ρ† 正是 disputes 階段的效果，GP 說「Authoring a block with a non-positive verdict has the effect of cancelling its imminent accumulation」；H_O 必須列出「exactly the keys of all new offenders」，才能讓輕客戶端從 header 直接讀出誰被罰。","trap":"ρ† 是 disputes 之後、assurances 之前的中間狀態；順序：ρ → ρ† (disputes) → ρ‡ (assurances) → ρ′ (guarantees)。"},{"id":"ch10-code-thresholds","ch":"10","section":"10.2 Extrinsic","gpRef":"eq. 10.12 — internal/extrinsic/dispute_controller.go CompareVerdictsWithPsi","difficulty":2,"kind":"code","tags":["disputes","code","delta-0.8.0"],"stem":"This is the team's verdict classification. What must change for GP 0.8.0 conformance?","code":{"lang":"go","caption":"internal/extrinsic/dispute_controller.go","src":"for _, verdict := range verdictSumSequence {\n    switch verdict.PositiveJudgmentsSum {\n    case types.ValidatorsCount*2/3 + 1:\n        updates.Good = append(updates.Good, types.WorkReportHash(verdict.ReportHash))\n    case 0:\n        updates.Bad = append(updates.Bad, types.WorkReportHash(verdict.ReportHash))\n    case types.ValidatorsCount * 1 / 3:\n        updates.Wonky = append(updates.Wonky, types.WorkReportHash(verdict.ReportHash))\n    default:\n        return types.DisputesRecords{}, errors.New(\"bad_vote_split\")\n    }\n}"},"options":["The default branch must classify every remaining vote count as wonky, because 0.8.0 treats any split that is neither unanimous nor zero as impossible to judge","The wonky case must be folded into the default error branch, because 0.8.0 records only good and bad verdicts and dropped ψ_W from the disputes state entirely","The thresholds must be computed from |k|, the length of the validator set that the verdict's epoch index selects (κ or λ), rather than from the global ValidatorsCount constant","Nothing needs to change: |κ| is fixed at 1023 = 3C in every configuration, so ValidatorsCount is always the right length to take two-thirds and one-third of"],"answer":2,"explanation":"eq. 10.12 的門檻是 ⌊2|k|/3⌋+1、0、⌊|k|/3⌋，k = K(a) ∈ {κ, λ}。0.8.0 允許 |κ| ≠ |λ|（validator set 可在 epoch 間改變大小，#514），所以用全域常數 ValidatorsCount 不再正確——必須依 verdict 的 epoch index 取對應集合的長度（你們 issue #1037「support variable validator-set size (|κ| ≠ V)」就是在處理這件事）。default → error 是對的：其他票數組合使區塊無效。「什麼都不用改，|κ| 永遠 1023」錯：§6.4 明說「The length of each sequence is always a multiple of 3 between 6 and 3C」（eq. 6.8 的 𝕍），tiny config 就是 6，而且 κ 與 λ 可以不一樣大，所以門檻必須跟著 K(a) 選到的那個集合走。「拿掉 wonky」錯：ψ_W 在 eq. 10.1 仍是 disputes state 的第三個成員，eq. 10.12 的 ⌊|k|/3⌋ case 也還在，0.8.0 只動了 culprits 要求與 N_V/N_O 上限。「default 改判 wonky」錯：V 是部分函數，wonky 只在 t 恰好等於 ⌊|k|/3⌋ 時成立；把 4 票、3 票這種分裂票也判成 wonky 會讓惡意 verdict 得以清掉別人的 pending report（eq. 10.14），這正是要回 error 讓整塊無效的原因。","trap":"同樣的 |κ| 依賴也出現在 assurances 的 2/3 門檻與 erasure shards 數。"},{"id":"ch10-rationale","ch":"10","section":"10 intro","gpRef":"§10 intro paragraphs","difficulty":1,"kind":"rationale","tags":["disputes","rationale"],"stem":"Which of the following is NOT a purpose of the disputes system as stated in the GP?","options":["Removing and banning invalid work-reports from the processing pipeline","Coordinating nodes to revert chain-extensions containing invalid work-reports and aggregating offenders for punishment in a higher-level system (e.g. slashing on a staking parachain)","Directly slashing the offending validator's balance inside the JAM state","Removing troublesome keys from the validator set where there is consensus over their malfunction"],"answer":2,"explanation":"§10 intro：disputes 是「an important security backstop for removing and banning invalid work-reports… as well as removing troublesome keys from the validator set… It also helps coordinate nodes to revert chain-extensions… and provides a convenient means of aggregating all offending validators for punishment in a higher-level system」。JAM 本身不做 slashing：「Should JAM be used for a public network such as Polkadot, this would imply the slashing of the offending validator's stake on the staking parachain.」JAM 只記錄 ψ_O 並在下次 key rotation 把 key 清零。","trap":"與 §13 statistics 同理：rewards/slashing 都交給 staking 子系統。"},{"id":"ch11-rho-state","ch":"11","section":"11.1 State","gpRef":"eq. 11.1 (ρ)","difficulty":2,"kind":"delta","tags":["reports","state","delta-0.8.0"],"stem":"What does each entry of ρ (the availability assignments) hold in GP 0.8.0, and why did PR #494 change it?","options":["ρ ∈ [(g ∈ 𝔾 guarantee, t ∈ N_T timeslot)?]_C — the whole guarantee, i.e. the work-report together with its 2–3 guarantor signatures, plus the slot at which it was reported","ρ ∈ [(w ∈ ℝ work-report, t ∈ N_T timeslot)?]_C — the report and its slot but no signatures, as in 0.7.2; guarantor identities are recovered from the guarantees recorded in β instead","ρ ∈ [(g ∈ 𝔾 guarantee, t ∈ N_T timeslot, f ∈ bits[|κ|])?]_C — the guarantee, the slot, and a bitfield of assurances accumulated across blocks until the super-majority is reached","ρ ∈ [(h ∈ ℍ report hash, t ∈ N_T timeslot)?]_C — only a 32-octet commitment per core, the guarantee itself being held off-chain by the guarantors until the report accumulates"],"answer":0,"explanation":"eq. 11.1：ρ ∈ [(g ∈ G, t ∈ N_T)?]_C。0.7.2 存的是 (w report, t)；0.8.0 (#494) 改存整個 guarantee（含 2–3 個 guarantor 簽章），理由：「To determine the guarantors to try directly fetching the bundle from」以及「In the case of a dispute, the guarantor signatures are needed to construct a disputes extrinsic（culprits）」。t 是 report 被 guarantee 進鏈的 slot（τ′），用來算 timeout U = 5。這也改變了 C(10) 的 state serialization：↕(g, E_4(t))。「只存 (w, t)、guarantor 身分改去 β 裡翻」錯兩處：(w, t) 正是 0.7.2 的型別，而 β 的每筆只有 header hash、state root、accumulation-output super-peak、timeslot 與「package hash → segment root」字典（eq. 7.2），裡面沒有任何 guarantee 或簽章可翻。「只留 32-byte 的 report hash」錯：assurance 湊齊時 eq. 11.17 直接把 (ρ†[c]_g)_w 這份完整 report 放進 R 交給 accumulation，光有 hash 拼不回 digest。「再多存一個跨區塊累積的 assurance bitfield」錯：可用性是**單一區塊內**的統計——eq. 11.17 只對本塊 E_A 裡的 assurance 求和，沒有跨塊累加的計數器，bitfield 只存在於 extrinsic 而不在 state。","trap":"遷移點：ρ 的型別與序列化都變了（issue #1012 樹）。"},{"id":"ch11-workreport-fields","ch":"11","section":"11.1.1 Work Report","gpRef":"eq. 11.2–11.3","difficulty":2,"kind":"concept","tags":["reports"],"stem":"A work-report (eq. 11.2, of the set ℝ) is a tuple (s, c, c, a, t, l, d, g) — bold c is the refinement context, plain c the core index. Which field description is WRONG?","options":["d — the work-digests, between 1 and I = 16 of them","g — the total gas used by all refine invocations in the package","l — the segment-root lookup dictionary (work-package hash → segment root), which together with the context's prerequisites is limited to J = 8 entries","s — the availability specification (package hash, bundle length, erasure root, shard count, segment root, segment count)"],"answer":1,"explanation":"eq. 11.2：ℝ ≡ (s avspec, **c** refinement context, c core index, a authorizer hash, **t** authorizer trace, **l** segment-root lookup, **d** ∈ [𝔻]_{1:I} digests, g authgasused)。g 是 **Is-Authorized** 呼叫消耗的 gas，不是 refine 的 gas——每個 digest 自己有 u（refine gas used）。eq. 11.3：|l| + |c_p（prerequisites）| ≤ J = 8。","trap":"report 層級的 g = auth gas；digest 層級的 u = refine gas；digest 的 g = accumulate gas limit。"},{"id":"ch11-refinement-context","ch":"11","section":"11.1.2 Refinement Context","gpRef":"eq. 11.4","difficulty":2,"kind":"delta","tags":["reports","delta-0.8.0"],"stem":"Which fields does the refinement context (eq. 11.4, of the set ℂ) contain in GP 0.8.0 (PR #526)?","options":["Anchor: header hash a, posterior state root s, accumulation-output-log super-peak b; lookup-anchor: header hash l, timeslot t; prerequisites p (a set of package hashes) — 6 fields, unchanged from 0.7.2","Anchor: header hash a, timeslot n, posterior state root s, accumulation-output-log super-peak b; lookup-anchor: header hash l, timeslot t, posterior state root r; prerequisites p (a set of package hashes) — 8 fields","Anchor: header hash a, timeslot n, prior state root s, accumulation-output-log super-peak b; lookup-anchor: header hash l, timeslot t, prior state root r; prerequisites p (a set of package hashes) — 8 fields","Anchor: header hash a, timeslot n, posterior state root s, BEEFY root b; lookup-anchor: header hash l, timeslot t, posterior state root r; core index c and prerequisites p (a set of package hashes) — 9 fields"],"answer":1,"explanation":"eq. 11.4（0.8.0）：ℂ ≡ (a anchor hash, n anchor slot, s anchor posterior state root, b anchor accumulation-output super-peak, l lookup-anchor hash, t lookup-anchor slot, r lookup-anchor posterior state root, p prerequisites)。#526「Expose lookup anchor posterior root and anchor slot in refinement context」新增了 anchor 的 timeslot n 與 lookup anchor 的 posterior state root r。驗證：anchor 四元組要匹配 β† 的某筆（eq. 11.36：hash、state root、super-peak b、timeslot）；lookup anchor 的三元組要在 ancestors A 裡找到（eq. 11.38：h_T = t、H(h) = l、且其子塊 h′ 的 H_R = r）。你們 issue #1022 提到「8-field RefineContext」。「6 欄、與 0.7.2 相同」錯：0.7.2 的確是 (a, s, b, l, t, p) 六欄，但 #526 補上的正是 anchor 的 timeslot n 與 lookup-anchor 的 posterior state root r；少了 n，eq. 11.36 就沒有 x_n = y_t 這一項可比。「b 是 BEEFY root、外加一個 core index、共 9 欄」錯兩處：0.8.0 的 b 是 accumulation-output log 的 Keccak MMR super-peak（BEEFY root 是被取代的舊名），而 core index 屬於 work-report 本身（w_c，eq. 11.2），不在 ℂ 裡。「兩個 state root 都是 prior」錯：eq. 11.36 要 x_s 等於 β† 該筆的 state root（那個區塊的 **posterior**），eq. 11.38 則要 x_r 等於 lookup-anchor **子塊** header 的 prior-state-root，也就是 lookup anchor 自己的 posterior state root。","trap":"b 是 β 的 accumulation-output super-peak（Keccak MMR），不是 BEEFY root 這個舊名。"},{"id":"ch11-avspec","ch":"11","section":"11.1.3 Availability","gpRef":"eq. 11.5, 11.31","difficulty":2,"kind":"concept","tags":["reports","availability"],"stem":"The availability specification (eq. 11.5) is s ≡ (p, l, u, v, e, n). What do u, v and e denote, and what constraint does eq. 11.31 place on v?","options":["u = erasure root, the Merkle root over the v chunks that erasure-code the bundle plus exported segments; v = the erasure-chunk count, which eq. 11.31 fixes at 1023 in every configuration; e = segment root, a constant-depth tree over the exported segment hashes; n = the segment count","u = segment root over the exported segment hashes; v = the number of work-items in the package, which eq. 11.31 forces to be at most I = 16; e = erasure root over the coded chunks; n = the number of validators assuring the core","u = erasure root, the Merkle root over the v chunks that erasure-code the bundle plus exported segments; v = the erasure-chunk count, which eq. 11.31 forces to equal |κ′|; e = segment root, a constant-depth tree over the exported segment hashes; n = the segment count","u = the hash of the auditable work bundle; v = the number of guarantors credentialing the report, which eq. 11.31 forces to be 2 or 3; e = the erasure root of the bundle's extrinsics; n = the index of the core the package was built for"],"answer":2,"explanation":"eq. 11.5：s ≡ (p package hash, l bundle length, u erasure root, v ∈ 𝕍 erasure shards, e segment root, n segment count)。eq. 11.31：∀w ∈ I：(w_s)_v = |κ′|——因為「As one chunk is distributed to each assurer, the number of chunks must equal the size of the assuring validator set」（0.8.0 因 validator 數可變而必須明確檢查）。erasure root 承諾了審計所需的全部資料（bundle shard + segment shards），segment root 讓後續 package 的 import 可驗證重建的 segment。「u 是 segment root、e 是 erasure root」把兩個 root 對調了；同一項的 v 也不是 work-item 數（那是 eq. 11.2 的 d ∈ [𝔻]_{1:I}，I = 16），n 也不是 validator 數。「v 在所有 config 都固定 1023」錯：eq. 11.31 比的是 |κ′|，而 0.8.0 的 validator 集合是 6 到 1023 之間 3 的倍數（eq. 6.8），tiny 就是 6——把它寫死成常數正是 0.7.2 → 0.8.0 最常見的移植 bug。「u 是 bundle hash、v 是 guarantor 數 2–3、e 是 extrinsic root、n 是 core index」四項全錯：𝕐 裡的 p 才是 package hash、l 是 bundle 長度；2–3 是 guarantee credential 的長度（eq. 11.24）；core index 是 w_c 而不是 avspec 的欄位。","trap":"erasure shard 數 v = |κ′|（posterior）：tiny 6、full 1023。別把 v（shards）跟 n（segment count）記反。"},{"id":"ch11-work-errors","ch":"11","section":"11.1.4 Work Digest","gpRef":"eq. 11.6–11.7","difficulty":2,"kind":"concept","tags":["reports","errors"],"stem":"A work-digest's result is either a blob or a member of the error set 𝔼 = {∞, ☇, BADEXPORTS, OVERSIZE, BAD, BIG} (eq. 11.7). Which meaning is correct?","options":["∞ out-of-gas; ☇ panic; BADEXPORTS the number of exports was misreported; OVERSIZE the refine output would exceed the size limit; BAD service code unavailable at the lookup-anchor; BIG code exceeds W_C = 4,000,000","∞ out-of-gas; ☇ panic; BADEXPORTS the number of exports was misreported; OVERSIZE the refine output would exceed the size limit; BAD the code was available but exceeds W_C = 4,000,000; BIG the code was unavailable at the lookup-anchor","∞ out-of-gas; ☇ a PVM page fault; BADEXPORTS the number of imported segments was misreported; OVERSIZE the bundle would exceed W_B; BAD the authorizer rejected the package; BIG more than I = 16 work-items","∞ an infinite loop was detected by the guarantor; ☇ a host-call fault; BADEXPORTS the number of exports was misreported; OVERSIZE the refine output would exceed the size limit; BAD service code unavailable at the lookup-anchor; BIG the bundle exceeds W_B"],"answer":0,"explanation":"eq. 11.7（錯誤集合是 𝔼，注意 𝕁 在 0.8.0 是 segment 的集合）與 §11.1.4：「The first two are special values concerning execution of the virtual machine, ∞ denoting an out-of-gas error and ☇ denoting an unexpected program termination（panic）. Of the remaining four, the first indicates that the number of exports made was invalidly reported, the second that the size of the digest（refinement output）would cross the acceptable limit, the third（BAD）indicates that the service's code was not available for lookup in state at the posterior state of the lookup-anchor block. The fourth（BIG）indicates that the code was available but was beyond the maximum size allowed W_C」。你們 encode.go 的 WorkExecResult：0 ok、1 oog、2 panic、3 bad-exports、4 output-oversize、5 bad-code、6 code-oversize。「∞ 是偵測到無窮迴圈、☇ 是 host-call fault、BIG 是 bundle 超過 W_B」錯三處：PVM 不做迴圈偵測（停機問題），∞ 就是 gas 耗盡；☇ 涵蓋所有 unexpected program termination（panic / trap / 非法指令），host-call 失敗有自己的回傳值；而 bundle 的 W_B 上限是 §14 對 work-package 的檢查，不會變成 digest 的結果值。「☇ 是 page fault、BADEXPORTS 講 import 數、OVERSIZE 講 bundle、BAD 是 authorizer 拒絕」也錯：page fault 只是 panic 的一種成因；BADEXPORTS 針對的是 **export** 數被錯報；OVERSIZE 針對 refine 的輸出（digest）；authorizer 不接受的 package 根本進不了鏈（eq. 11.32 要求 w_a ∈ α[w_c]），不會以 error 的形式留在 digest 裡。最後一項把 BAD 與 BIG 對調：GP 原文是「the third indicates that the service's code was not available for lookup… The fourth indicates that the code was available but was beyond the maximum size allowed W_C」。","trap":"錯誤結果仍會被 accumulate（operand 的 r 是 error），只是沒有 output blob。"},{"id":"ch11-report-size-limit","ch":"11","section":"11.1.4 Work Digest","gpRef":"eq. 11.8","difficulty":1,"kind":"concept","tags":["reports","limits"],"stem":"What is the on-chain limit on the variable-size content of a single work-report?","options":["|authorizer trace t| + Σ over digests of |result blob| (errors count as 0) ≤ W_R = 48·2^10 = 49,152 octets","|authorizer trace t| ≤ 32 octets and each digest's result blob ≤ W_G = 4,104 octets, giving at most I = 16 blobs","Σ over digests of |result blob| alone, the authorizer trace being unbounded, ≤ W_R = 48·2^10 = 49,152 octets","|authorizer trace t| + Σ over digests of |result blob| (errors count as their encoded length) ≤ W_B = 13,791,360 octets"],"answer":0,"explanation":"eq. 11.8：∀w ∈ R：|w_o| + Σ_{i} L(w_d[i]_r) ≤ W_R，L(r) = |r| 若 r ∈ B（成功輸出），否則 0；W_R = 48·2^10。理由：「In order to ensure fair use of a block's extrinsic space」。W_B（13,791,360）是 work-package **bundle**（extrinsics + imports 等）的上限（§14），不是 report。你們 guarantor 端的 BIG/OVERSIZE 判斷是累積前面 item 的輸出一起算。「error 也按編碼長度計、上限取 W_B」錯兩處：eq. 11.8 的 L 對 r ∈ 𝔼 明確回 0（失敗的 digest 不佔 report 空間，所以 out-of-gas 反而「便宜」），而該上限套的是 §14 的 bundle 限制而非 report 的 W_R。「只算 result、auth trace 不受限」錯：|w_t| 是加總的第一項，否則 is-authorized 的 trace 可以無限撐大區塊。「auth trace ≤ 32、每個 result ≤ W_G = 4,104」錯：eq. 11.8 是**單一總量**上限，沒有逐項上限（一個 digest 就吃掉 48 KiB 也合法）；W_G = 4,104 是 segment 的大小，與 report 大小無關。","trap":"48 KiB 是 report 級總量，且 auth trace 也算在內。"},{"id":"ch11-assurance-rules","ch":"11","section":"11.2 Package Availability Assurances","gpRef":"eq. 11.11–11.16","difficulty":2,"kind":"concept","tags":["assurances"],"stem":"Which set of rules applies to the assurances extrinsic E_A?","options":["Each assurance = (anchor a, bitfield f ∈ bits[C], validator index v, Ed25519 sig); a must equal the hash of the block being built; assurances strictly ordered by v; the signature by κ′[v]_e is over X_A ⌢ H(E(H_P, f)); a bit may be set only if ρ†[c] ≠ ∅","Each assurance = (anchor a, bitfield f ∈ bits[C], validator index v, Ed25519 sig); a must equal H_P; assurances strictly ordered by core index; the signature by κ[v]_e is over X_A ⌢ the erasure root of each assured report; a bit may be set only if ρ‡[c] ≠ ∅","Each assurance = (anchor a, bitfield f ∈ bits[C], validator index v, Ed25519 sig); a must equal H_P; assurances strictly ordered by v (so at most one per validator); the signature by κ[v]_e is over X_A ⌢ H(E(H_P, f)); a bit may be set only if ρ†[c] ≠ ∅","Each assurance = (anchor a, bitfield f ∈ bits[|κ|], validator index v, Bandersnatch sig); a must equal H_P; a validator may send several assurances so long as they stay sorted by v; the signature is over X_A ⌢ H(E(H_P, f)); a bit may be set only if ρ†[c] ≠ ∅"],"answer":2,"explanation":"eq. 11.11：E_A ∈ [(a ∈ H, f ∈ B_C, v ∈ N_{|κ|}, s ∈ E)]；11.12：a = H_P（anchor 是 parent hash）；11.13：依 v 嚴格遞增；11.14：s ∈ Ed25519 由 κ[v]_e 對 X_A ⌢ H(E(H_P, f)) 簽署，X_A = $jam_available；11.16：f[c] ⇒ ρ†[c] ≠ ∅（不能對沒有 pending report 的 core 打勾）。注意 signer 用的是 **prior** κ（0.6.4 起「Assurances are checked with the prior validator set」）。bit = 1 的意義是「我保證我正在為它的 availability 出力」（軟性宣告，§11.2.1 footnote）。你們的錯誤碼：BadAttestationParent、NotSortedOrUniqueAssurers、CoreNotEngaged。「anchor 取本塊自己的 hash、signer 取 κ′」錯兩處：簽名時本塊的 hash 還不存在，eq. 11.12 因此綁 parent hash H_P（也讓 assurance 無法被搬到另一條分叉）；eq. 11.14 用的是 **prior** 的 κ[v]_e。「bitfield 長度 |κ|、用 Bandersnatch 簽、同一 validator 可送多筆」錯三處：f ∈ bits[C] 是每個 core 一 bit（full 341 bits = 43 octets，tiny 1 octet）；assurance 是 Ed25519；eq. 11.13 要求 index **嚴格**遞增，所以每個 validator 至多一筆。「依 core index 排序、逐 report 簽 erasure root、前提用 ρ‡」錯三處：排序鍵是 assurer 的 index v；一筆 assurance 只簽一次、簽的是整個 bitfield 的 X_A ⌢ H(E(H_P, f))；而 eq. 11.16 的前提是 ρ†（disputes 之後、assurances 之前），ρ‡ 是處理完這些 assurance 才算出來的，拿它當前提會變成循環定義。","trap":"bitfield 長度 = C（cores），full 是 43 bytes（341 bits），tiny 1 byte；LSB-first。"},{"id":"ch11-availability-threshold","ch":"11","section":"11.2.2 Available Reports","gpRef":"eq. 11.17–11.18","difficulty":2,"kind":"delta","tags":["assurances","delta-0.8.0","tiny"],"stem":"When does a report become available (R), and when is a pending assignment cleared from ρ‡ in GP 0.8.0?","options":["Available iff the number of assurances with bit c set is ≥ 2/3·|κ| (tiny: ≥ 4 of 6; full: ≥ 682); ρ‡[c] = ∅ if the report became available, or H_T ≥ t + U (U = 5 slots), or |κ| ≠ |κ′| (the validator-set size changed)","Available iff the number of assurances with bit c set is > 2/3·|κ| (tiny: ≥ 5 of 6; full: ≥ 683); ρ‡[c] = ∅ if the report became available, or H_T ≥ t + U with U = 10 slots, or the epoch index has changed","Available iff the number of assurances with bit c set is > 2/3·|κ| (tiny: ≥ 5 of 6; full: ≥ 683); ρ‡[c] = ∅ if the report became available, or H_T ≥ t + U (U = 5 slots), or |κ| ≠ |κ′| (the validator-set size changed)","Available iff the number of assurances with bit c set is > 1/2·|κ| (tiny: ≥ 4 of 6; full: ≥ 512); ρ‡[c] = ∅ only once the report has been accumulated, so an assignment never times out and never reacts to a change in |κ|"],"answer":2,"explanation":"eq. 11.17：R ≡ [ρ†[c]_g_w | Σ_a f[c] > 2/3·|κ|]——嚴格大於 2/3（tiny 6 → >4 → ≥5；full 1023 → >682 → ≥683，即 ⌊2V/3⌋+1）。eq. 11.18：ρ‡[c] = ∅ 當 p = ∅ ∨ report ∈ R ∨ H_T ≥ p_t + U ∨ |κ| ≠ |κ′|，否則 p。U = C_assurancetimeoutperiod = 5。「|κ| ≠ |κ′|」是 0.8.0 新增：validator 數改變時所有 pending 都視為提早 timeout（因為 erasure shard 數與 assurer 集合都對不上了）。你們 0.7.2 的 FilterAvailableReports 只有 timeout，沒有 size-change 條件。「≥ 2/3·|κ| 就算 available（tiny 4/6、full 682）」錯：eq. 11.17 是**嚴格**大於，剛好 2/3 不夠——tiny 少一票、full 少一票都還不算可用。「U = 10、且 epoch 一換就清」錯兩處：U = 5；eq. 11.18 的第三個條件是 |κ| ≠ |κ′|，不是 epoch 邊界——validator 數沒變的換屆不會清掉任何 pending assignment。「> 1/2 門檻、且等 accumulate 才清」錯：門檻是 2/3 super-majority（ELVES 的安全假設要求 2/3+1 誠實且 live）；而 accumulate 發生在 available **之後**，若要等 accumulate 才清，逾時而永遠湊不到 assurance 的 report 會把 core 永久卡死，正是 U 這個 timeout 要避免的。","trap":"timeout 比較的是 H_T（本塊 slot）與 assignment 的 t（guarantee 進鏈的 slot）。"},{"id":"ch11-guarantor-assignment","ch":"11","section":"11.3 Guarantor Assignments","gpRef":"eq. 11.19–11.23","difficulty":3,"kind":"concept","tags":["guarantees","shuffle"],"stem":"How are validators assigned to cores for guaranteeing in GP 0.8.0?","options":["P(v, e, t) = R(F([⌊i/3⌋ | i ∈ N_v], e), ⌊(t mod E)/R⌋), the shuffle taking entropy e = η′_1 and the rotation period being R = 600, i.e. one rotation per epoch; M = (P(|κ′|, η′_1, τ′), Φ(κ′)) — only cores < |κ′|/3 are active","P(v, e, t) = R(F([⌊C·i/v⌋ | i ∈ N_v], e), ⌊(t mod E)/R⌋): the base sequence spreads the v validators over all C cores before the Fisher-Yates shuffle with entropy e = η′_2; M = (P(|κ′|, η′_2, τ′), Φ(κ′)) — all C = 341 cores are active","P(v, e, t) = R(F([⌊i/3⌋ | i ∈ N_v], e), ⌊(t mod E)/R⌋): the sequence [0,0,0,1,1,1,…] is Fisher-Yates shuffled with entropy e = η′_2, then rotated by the rotation index (R = 10 slots); M = (P(|κ′|, η′_2, τ′), Φ(κ′)) — only cores < |κ′|/3 are active","P(v, e, t) = R(F([⌊i/3⌋ | i ∈ N_v], e), t mod R): the shuffled sequence is rotated once per slot, so each validator's core advances by one every block, with entropy e = η′_2; M = (P(|κ′|, η′_2, τ′), Φ(κ′)) — only cores < |κ′|/3 are active"],"answer":2,"explanation":"§11.3：C = 341 個 core 固定，但只有前 |κ′|/3 個是 active（每個 core 3 個 guarantor）。eq. 11.20：R(c, n) = [(x + n) mod (|c|/3) | x ∈ c]（rotation）；11.21：P(v, e, t) = R(F([⌊i/3⌋ | i ∈ N_v], e), ⌊(t mod E)/R⌋)，F 是附錄 F 的 Fisher-Yates shuffle；11.22：M ≡ (P(|κ′|, η′_2, τ′), Φ(κ′))——key 經 Φ 過濾，offender 會被拒（你們 BannedValidator = code 23）。用 η′_2 而非 η′_1 是為了避免 fork magnification（§11.3）。11.23：M* 是上一個 rotation 的分配：若 τ′ − R 仍在同一 epoch 用 (κ′, η′_2)，否則用 (λ′, η′_3)。0.7.2 的 base assignment 是 ⌊C·i/V⌋，0.8.0 改成 ⌊i/3⌋（因為 active cores = V/3）——所以「base sequence 用 ⌊C·i/v⌋、341 個 core 全部 active」正是沒跟上 0.8.0 的寫法：當 |κ′| < 3C 時它會把 validator 撒到不存在的 active core 上。「用 η′_1、R = 600 一個 epoch 轉一次」錯兩處：§11.3 明說用 η′_2 而非 η′_1，「to avoid the possibility of fork-magnification where uncertainty about chain state at the end of an epoch could give rise to two established forks」；R = 10，一個 epoch 有 E/R = 60 次 rotation。「rotation index 取 t mod R，每個 slot 前進一個 core」錯：index 是 ⌊(t mod E)/R⌋，同一個 rotation 的 10 個 slot 內分配完全不變，這正是 eq. 11.28 能容許 guarantee 的 t 落在上一個 rotation 的前提。","trap":"rotation period R = 10 slots；每個 epoch 600/10 = 60 次 rotation。"},{"id":"ch11-guarantee-validity","ch":"11","section":"11.4 Work Report Guarantees","gpRef":"eq. 11.24–11.29","difficulty":3,"kind":"concept","tags":["guarantees"],"stem":"Which statement about a guarantee g = (w, t, a) in E_G is correct?","options":["a has exactly 3 (validator index, Ed25519 sig) pairs ordered by index; every signer must be assigned to core w_c under M when t is in the current rotation and under M* otherwise; t must equal τ′; each signature is over the encoded report E(w) itself; w_c < |κ′|/3","a has 2 or 3 (validator index, Ed25519 sig) pairs ordered by index; every signer must be assigned to core w_c under M when t is in the current rotation and under M* otherwise; R·(⌊τ′/R⌋ − 1) ≤ t ≤ τ′; each signature is over X_G ⌢ H(E(w)); w_c < |κ′|/3","a has 2 or 3 (validator index, Ed25519 sig) pairs ordered by index; every signer must be assigned to core w_c under M* when t is in the current rotation and under M otherwise; R·(⌊τ′/R⌋ − 1) ≤ t ≤ τ′; each signature is over X_G ⌢ H(E(w)); w_c < C/3","a has 2 or 3 (validator index, Ed25519 sig) pairs ordered by index; signers may be any members of κ′ ∪ λ′ whatever core they are assigned to; R·(⌊τ′/R⌋ − 1) ≤ t ≤ τ′; each signature is over X_G ⌢ H(E(w)); any core index below C = 341 may be used"],"answer":1,"explanation":"eq. 11.24：G ≡ (w ∈ R, t ∈ N_T, a ∈ [(N, E)]_{2:3})；11.25–11.26：E_G ∈ [G]_{:C}，依 core 排序且唯一；11.27：credential 依 validator index 排序；11.28：∀(v, s) ∈ a：v < |k| ∧ c[v] = w_c < |κ′|/3、s ∈ Ed25519_{k[v]_e}(X_G ⌢ H(w))、R(⌊τ′/R⌋ − 1) ≤ t ≤ τ′；(c, k) = M 當 ⌊τ′/R⌋ = ⌊t/R⌋，否則 M*。「Use of an inactive core is not permitted even if a timeslot in the previous rotation is used」。簽署者的 Ed25519 key 進入 reporters 集合 R（給 π 統計）。「恰好 3 個簽章、t 必須等於 τ′、簽的是 E(w) 本身」錯三處：credential 的型別是 [(validator index, Ed25519 sig)]_{2:3}，2 個就成立（第三位 guarantor 可能離線）；eq. 11.28 允許 t 回溯一整個 rotation；訊息是 X_G ⌢ H(E(w))，先 Blake2b 再冠上 context string，直接簽 E(w) 會讓同一段位元組在別的協定情境下被重放。「簽署者可以是 κ′ ∪ λ′ 的任何人、core 只要 < C = 341」錯兩處：eq. 11.28 要求 c[v] = w_c，簽署者必須正好被指派到這個 core（κ′ ∪ λ′ 的說法只描述了 key 來源）；active core 上限是 |κ′|/3，只有 full config 才剛好等於 C。「M 與 M* 對調、上限取 C/3」錯：t 落在當前 rotation 用 M，落在上一個 rotation 才用 M*；而 C/3 ≈ 113 不是任何 config 的 active core 數。","trap":"t 是 guarantee 的 slot，可比 τ′ 早最多一個 rotation；ρ′ 的 timestamp 卻是 τ′（eq. 11.46）。"},{"id":"ch11-report-checks-state","ch":"11","section":"11.4 Work Report Guarantees","gpRef":"eq. 11.31–11.33","difficulty":2,"kind":"concept","tags":["guarantees","gas"],"stem":"Which on-chain checks apply to each incoming report w before it is placed in ρ′?","options":["ρ[w_c] = ∅ (core free in the prior state); w_a ∈ α′[w_c] (authorizer in the POSTERIOR pool); Σ digest accumulate-gas ≤ G_T = 3,500,000,000 and each digest's gas ≥ δ[d_s]_g; the erasure-chunk count equals |κ′|","ρ‡[w_c] = ∅ (core free after disputes and assurances); w_a ∈ α[w_c] (authorizer in the PRIOR pool); Σ digest accumulate-gas ≤ G_A = 10,000,000 and each digest's gas ≥ δ[d_s]_g; the erasure-chunk count equals |κ′|","ρ‡[w_c] = ∅ and the core must additionally have stayed free for U = 5 slots; w_a ∈ α[w_c]; Σ digest accumulate-gas ≤ G_A = 10,000,000 with no per-service floor; the erasure-chunk count equals |κ′|","ρ‡[w_c] = ∅ (core free after disputes and assurances); w_a ∈ α[w_c]; Σ digest refine-gas used ≤ G_R = 5,000,000,000 and each digest's gas ≥ δ[d_s]_g; the erasure-chunk count equals |κ| in the prior state"],"answer":1,"explanation":"eq. 11.31：∀r ∈ I：(r_s)_v = |κ′|（erasure chunk 數 = posterior 的 validator 數）；11.32：∀r ∈ I：ρ‡[r_c] = ∅ ∧ r_a ∈ α[r_c]——用 ρ‡（disputes + assurances 處理後）與 **prior** α；11.33：Σ_{d ∈ r_d} d_g ≤ G_A（10M，每個 report 的 accumulate gas 上限）∧ ∀d：d_g ≥ δ[d_s]_g。「用 prior ρ、posterior α′、上限取 G_T」錯三處：core 空不空必須等 disputes 清完（ρ†）、assurances 與 timeout 收完（ρ‡）才知道，用 prior ρ 會擋掉本塊剛騰出來的 core；α′ 要等 accumulation 之後才算得出來，檢查當然只能用 α；G_T = 3.5·10^9 是**整塊** accumulation 的總預算，不是單一 report 的上限。「core 還必須空滿 U = 5 個 slot」錯：eq. 11.32 只要求 ρ‡[r_c] = ∅，前一份 report 一 available 或一逾時，同一塊裡就能換上新的；同一項說「沒有 per-service 下限」也錯，eq. 11.33 明確要求 d_g ≥ δ[d_s]_g。「限制 refine gas 總量 G_R、shard 數比 prior |κ|」錯：eq. 11.33 管的是 digest 的 **accumulate** gas limit，G_R = 5·10^9 是單一 work-package refine 的預算（§14，鏈下判定）；而 eq. 11.31 比的是 posterior 的 |κ′|，因為 chunk 是發給下一組 assurer 的。","trap":"α（prior）用於檢查，α′ 在 accumulate 之後才算。"},{"id":"ch11-contextual-validity","ch":"11","section":"11.4.1 Contextual Validity of Reports","gpRef":"eq. 11.35–11.45","difficulty":3,"kind":"concept","tags":["guarantees","context"],"stem":"Which of the following is NOT one of the contextual validity requirements for reports in E_G?","options":["Every prerequisite and every segment-root-lookup key must appear in this extrinsic or in β's reported sets, and the looked-up segment roots must match those records","The anchor's (a, n, s, b) must match an entry of β†; the lookup-anchor time must be ≥ H_T − L, and the lookup-anchor header must be found in the ancestor set A","Every digest's service must have been accumulated at least once within the last epoch E, and a service left idle for longer must be re-registered before it may be reported again","No two reports in the extrinsic share a work-package hash, and no package hash may appear in β's reported sets, in ξ (accumulated), in the ready queue ω or in a pending assignment of ρ"],"answer":2,"explanation":"eq. 11.35（|p| = |I|，同一塊不得有兩份同 package 的 report）與 11.39–11.41（package hash 不得出現在 β 的 reported 集合、ξ、ready queue ω 或任何 pending 的 ρ 裡）就是「不重複、不在 pipeline 任何一段」那一項；eq. 11.36（anchor 四元組 (a, n, s, b) 對上 β† 的某筆）、11.37（l_t ≥ H_T − L）、11.38（lookup anchor 的 header 在祖先集合 A 裡）就是 anchor / lookup-anchor 那一項；eq. 11.42（prerequisites 與 srlookup 的 key 必須在本塊 extrinsic 或 β）與 11.43–11.44（srlookup 的 segment root 必須與紀錄相符）就是相依那一項——這三個敘述全部都是真正的條件。剩下「service 必須在最近一個 epoch 內被 accumulate 過、閒置更久要重新註冊才能再被 report」則是杜撰：GP 從頭到尾沒有「service 閒置過久就失效」的規則，service 只會因 eject 而消失（§9），report 是否合法也完全不看該 service 上次 accumulate 的時間；真正跟 service 有關的唯一 contextual 條件是 eq. 11.45 的 d_c = δ[d_s]_c。§11.4.1 附註：這些檢查刻意允許表面上的 dependency loop，因為 accumulation 端的 Q 函數永遠不會 accumulate 它們。","trap":"面試官可能要求你列舉「所有」contextual checks——建議背下 anchor / lookup-anchor / no-dup / prereq / srlookup / code-hash 六類。"},{"id":"ch11-rho-prime","ch":"11","section":"11.5 Transitioning for Reports","gpRef":"eq. 11.46","difficulty":1,"kind":"concept","tags":["guarantees","state"],"stem":"After processing E_G, what does ρ′[c] hold for a core that received a new guarantee g?","options":["(w, τ′) — only the work-report, the guarantor credential being discarded once it has been verified","(H(E(w)), τ′) — the report hash paired with the current block's timeslot, the guarantee moving into β","(g, g_t) — the whole guarantee paired with the guarantee's own slot t, which may lie a rotation earlier","(g, τ′) — the whole guarantee paired with the current block's timeslot τ′ as its assignment time"],"answer":3,"explanation":"eq. 11.46：ρ′[c] ≡ (g, t: τ′) 當 ∃g ∈ E_G：(g_w)_c = c，否則 ρ‡[c]。時間戳是 **τ′**（本塊 slot），不是 guarantee 裡的 t——這樣 eq. 11.18 的 timeout（H_T ≥ t + U）從進鏈那一刻起算。§11.5 附註：對 c ≥ |κ′|/3 的 core，ρ′[c] 永遠是 ∅，保證待審計的 report 數不會超過 active validator 能負擔的量。你們 code-map 3.7.6：「the assignment timestamp is τ′, not the guarantee's slot t」。改用 guarantee 自己的 g_t 就錯了：eq. 11.28 允許 t 落在上一個 rotation（最多早 R = 10 個 slot），這樣的 report 一進鏈就已經超過 U = 5 的 timeout，下一塊立刻被清掉，等於永遠無法取得 availability。「只留 report、驗完就丟掉 credential」錯：0.8.0 (#494) 的 ρ 型別就是 (g, t)，簽章要留著用來找 guarantor 抓 bundle、以及在 dispute 時構造 culprits。「只留 report hash、guarantee 搬進 β」錯：β 的每筆只有 header hash、state root、accumulation-output super-peak、timeslot 與 package hash → segment root 字典（eq. 7.2），從來不存 guarantee；而 eq. 11.17 之後要把整份 report 交給 accumulation，只有 hash 是不夠的。","trap":""},{"id":"ch11-code-availability","ch":"11","section":"11.2.2 Available Reports","gpRef":"eq. 11.17 — internal/extrinsic/assurance_controller.go","difficulty":2,"kind":"code","tags":["assurances","code","delta-0.8.0"],"stem":"The team's availability check uses `totalAvailable[i] >= types.ValidatorsSuperMajority`. Which statement is accurate?","code":{"lang":"go","caption":"internal/extrinsic/assurance_controller.go (UpdateNewlyAvailableWorkReports)","src":"for i := 0; i < types.CoresCount; i++ {\n    // If the votes for this core are greater than the available number, add the work report\n    if totalAvailable[i] >= types.ValidatorsSuperMajority {\n        if rhoDagger[i] == nil {\n            continue\n        }\n        availableWorkReports = append(availableWorkReports, rhoDagger[i].Report)\n    }\n}"},"options":["It matches the GP's strict '> 2/3·|κ|' exactly when ValidatorsSuperMajority = ⌊2|κ|/3⌋ + 1 is derived from the live size of κ — 5 of 6 in tiny, 683 of 1023 in full — rather than from a compile-time constant","It is wrong: eq. 11.17 asks only for ≥ 2/3·|κ|, so 4 of 6 assurances suffice in tiny and 682 of 1023 in full; the comparison should be against ⌈2|κ|/3⌉ instead of a super-majority constant","It is wrong: eq. 11.17 counts, per core, the assurers that set that core's bit, whereas the loop must first count the distinct validators appearing anywhere in E_A and compare that with the super-majority","It is wrong: a core whose rhoDagger entry is nil must still contribute its report, because eq. 11.18 only empties ρ‡ after the availability count for the block has already been taken"],"answer":0,"explanation":"eq. 11.17：Σ_a a_f[c] > (2/3)|κ|。對整數而言 > 2V/3 ⇔ ≥ ⌊2V/3⌋ + 1：V=6 → > 4 → ≥ 5；V=1023 → > 682 → ≥ 683。所以 `>= ValidatorsSuperMajority` 正確，前提是該常數等於 ⌊2|κ|/3⌋+1 且隨 |κ| 變動（0.8.0）。`rhoDagger[i] == nil` 的情況其實已被 eq. 11.16（bit 只能在有 pending report 的 core 上設）擋掉，這裡是防禦性檢查。「GP 只要求 ≥ 2/3·|κ|，所以 tiny 4/6 就夠、應改用 ⌈2|κ|/3⌉」錯：eq. 11.17 寫的是嚴格大於，⌈2·6/3⌉ = 4 會少算一票，剛好 2/3 的平手局面不該讓 report 變成可用。「應該先數 E_A 裡出現過的相異 validator 再比門檻」錯：eq. 11.17 的 Σ 是**逐 core** 對 a_f[c] 求和，正是這段迴圈在做的事；把所有 core 的票混在一起數，會讓只 assure 了別的 core 的 validator 也被算進這個 core。「ρ† 為 nil 的 core 也該送出 report」錯：那個 core 根本沒有 report 可送，而 ρ‡ 是 eq. 11.18 的**輸出**、不是計票當下的狀態，用它來解釋計票順序是把因果顛倒了。","trap":"tiny 5/6、full 683/1023；同一個 super-majority 常數也用在 verdict 的 good 門檻。"},{"id":"ch12-history-queue-state","ch":"12","section":"12.1 History and Queuing","gpRef":"eq. 12.1–12.3","difficulty":2,"kind":"concept","tags":["accumulation","state"],"stem":"What are ξ (accumulated) and ω (ready) and how big are they?","options":["ξ ∈ [{H}]_E — one set of accumulated work-package hashes per slot for the last E = 600 slots (an epoch of history); ω ∈ [[(ℝ, {H})]]_E — per slot, the reports made available in that slot that still have unfulfilled dependencies, each paired with its outstanding dependency set","ξ ∈ [{H}]_C — one set of accumulated work-package hashes per core, so C = 341 sets; ω ∈ [[(ℝ, {H})]]_C — one queue per core holding that core's reports which still have unfulfilled dependencies, each paired with its outstanding dependency set","ξ ∈ [{H}]_E — one set of accumulated WORK-REPORT hashes per slot for the last E = 600 slots (an epoch of history); ω ∈ [[(ℝ, {H})]]_E — per slot, every report that became available in that slot, whether or not its dependencies are met, each paired with the full dependency set it originally declared","ξ ∈ {H} — one flat set holding every work-package hash ever accumulated, never pruned; ω ∈ [[(𝕎, {H})]]_E — per slot, the work-ITEMS made available in that slot that still have unfulfilled dependencies, each paired with its outstanding dependency set"],"answer":0,"explanation":"eq. 12.1：ξ ∈ [{H}]_E（每個 slot 一個集合，共 E 個），ξ_∪ 是聯集；12.3：ω ∈ [[(R, {H})]]_E——ready（已 available 但尚未 accumulate）的 report 與其**未滿足的** dependency（package hash 集合）。兩者都是長度 E 的環狀緩衝：ξ′[E−1] 放本塊剛 accumulate 的 hash 並左移；ω′[m]（m = H_T mod E）放本塊新的 R^Q，跳過的 slot 清空。這就是 test vectors 中 accumulate/ 的 enqueue/unlock/ring-wrap 案例。干擾項逐一：說 ξ 存的是 **work-report hash**、且 ω 收下本 slot「所有」available 的 report 者兩處都錯——P(r) 取的是 (r_avspec) 的 **work-package** hash，而 eq. 12.4 只把有 prerequisite 或 srlookup 非空的 report 放進 R^Q（無依賴者進 R! 當場 accumulate），配對的也是被 E 修剪後**剩下**的依賴。說 ξ 是「永不修剪的扁平集合」且 ω 裝 **work-item（𝕎）** 者也錯兩次——ξ 是長度 E 的序列，歷史只留一個 epoch，過舊的整格被丟掉；ω 裝的是 work-report（ℝ，§11 Work Report），𝕎 是 §14.3 的 work-item。說兩者以 **core** 索引（C = 341）者錯在 ξ 與 ω 都以 **slot** 索引、長度都是 E = 600，App. D 的 C(14) 也是照 slot 一格一格序列化 ω。","trap":"ξ 存的是 package hash 不是 report hash；ready 的依賴在每次 accumulate 後用 E() 修剪。"},{"id":"ch12-W-partition","ch":"12","section":"12.1 History and Queuing","gpRef":"eq. 12.4–12.12 (W!, W^Q, E, Q, W*)","difficulty":3,"kind":"concept","tags":["accumulation","dependencies"],"stem":"How is the sequence of accumulatable reports R* built from the newly available reports R?","options":["R! = reports with no prerequisites, whatever their segment-root lookup holds, accumulated immediately; R^Q = the rest, each paired with its prerequisite set alone, pruned by ξ[E−1] (only the packages accumulated in the previous slot); R* = R! ⌢ Q(E(ω[m..] ⌢ ω[..m] ⌢ R^Q, P(R!))) with Q extracting reports whose dependency set is empty","R! = reports with no prerequisites and empty segment-root lookup, accumulated immediately; R^Q = the rest, each paired with its dependency set (prerequisites ∪ keys of srlookup) pruned by ξ_∪; R* = R! ⌢ Q(E(ω[m..] ⌢ ω[..m] ⌢ R^Q, P(R!))), where Q makes a single pass over the queue and any report still holding a dependency afterwards makes the block invalid","R! = reports with no prerequisites and empty segment-root lookup, accumulated immediately; R^Q = the rest, each paired with its dependency set (prerequisites ∪ keys of srlookup) pruned by ξ_∪; R* = R! ⌢ Q(E(ω[m..] ⌢ ω[..m] ⌢ R^Q, P(R!))) where Q repeatedly extracts reports whose dependency set is empty and E removes satisfied dependencies","R! = reports with no prerequisites and empty segment-root lookup, accumulated immediately; R^Q = the rest, each paired with its dependency set (prerequisites ∪ keys of srlookup) pruned by ξ_∪; R* = R! ⌢ Q(E(ω[..m] ⌢ ω[m..] ⌢ R^Q, P(R!))), i.e. the ready queue is read from the current slot m forwards so that the freshest queued reports get their turn first"],"answer":2,"explanation":"eq. 12.4：R! = [r | r ∈ R, |x_p| = 0 ∧ r_l = ∅]；12.5：R^Q = E([D(r) | r ∈ R, 有依賴], ξ_∪)，D(r) = (r, x_p ∪ keys(r_l))；12.7：E(r, x) 移除 package hash ∈ x 的項目並從各項依賴集合扣掉 x；12.8：Q(r) = g ⌢ Q(E(r, P(g)))，g = 依賴集合為空者，直到沒有為止；12.11–12.12：R* = R! ⌢ Q(q)，q = E(ω[m..] ⌢ ω[..m] ⌢ R^Q, P(R!))，m = H_T mod E——ready queue 從**最舊**（slot m 起繞一圈）讀起。有無法解的依賴不會讓區塊無效，只是那個 report 留在 ω 直到過期（一個 epoch 後被覆蓋）。干擾項逐一：把環狀佇列讀成 ω[..m] ⌢ ω[m..]「最新優先」者方向反了——m = H_T mod E 正是本塊要覆寫的那一格，也就是**最舊**的一格，所以 ω[m..] 起頭才是從最舊讀起。說 R! 只看 prerequisite、依賴集合只算 prerequisite、且用 ξ[E−1] 修剪者錯三處：eq. 12.4 要求 |x_p| = 0 **且** r_l = ∅ 同時成立，D(r) 把 keys(r_l)（h⊞ 待換算的 segment-root lookup）也算成依賴，修剪用的是 ξ_∪（整個 epoch 的聯集）而不是只有最後一格。說 Q 只掃一遍、掃完還有依賴就讓區塊無效者錯在 Q 是遞迴定義（解開一批就再用 E 扣一次依賴，直到 g = [] 為止），而且解不開的 report 只是續留 ω 等過期，區塊仍然有效。","trap":"E 的參數 x 在第一次是 P(R!)（本塊立即 accumulate 者的 hash），不是整個 ξ（R^Q 已先用 ξ_∪ 修剪過）。"},{"id":"ch12-gas-budget","ch":"12","section":"12.3 Final State Integration","gpRef":"eq. 12.24 (g) & 12.17 (Δ+)","difficulty":3,"kind":"delta","tags":["accumulation","gas","delta-0.8.0"],"stem":"What total gas budget g is handed to the outer accumulation Δ+ in a block, and how does Δ+ choose how many reports to accumulate in a round?","options":["g = max(G_T, G_A·C + Σ_{x∈values(χ_Z)} x); Δ+ picks the largest prefix i of the reports such that Σ digest gas-limits of those i reports + Σ gas of pending deferred transfers + Σ free-accumulation gas ≤ g, runs Δ* on them, then recurses with g* = g + Σ(new transfers' gas) − Σ gas actually used and an empty free-accumulation map","g = G_R = 5·10^9, the per-package refine allowance reused as the block's accumulation budget; Δ+ accumulates exactly one report per round rather than a prefix, subtracting that report's actual gas use from g each time, and halts as soon as a service's Accumulate panics, discarding the remaining reports and any transfers they produced","g = G_A·C = 3.41·10^9 exactly, with the always-accumulate allowances χ_Z drawn out of that same total; Δ+ picks the largest prefix i of the reports such that Σ digest gas-limits + Σ gas of pending deferred transfers ≤ g, runs Δ* on them, then recurses with g* = g − Σ gas actually used and the same free-accumulation map","g = max(G_T, G_A·C + Σ_{x∈values(χ_Z)} x); Δ+ picks the largest prefix i of the reports such that Σ digest gas-limits of those i reports alone ≤ g — transfer gas and free-accumulation gas play no part in the test — runs Δ* on them, then recurses with g* = g − Σ gas actually used, carrying the same free-accumulation map into every round"],"answer":0,"explanation":"eq. 12.24：g = max(G_T, G_A·C + Σ χ_Z gas)，G_T = 3.5·10^9、G_A = 10^7、C = 341。eq. 12.17：i = max i：Σ_{r ∈ r[..i], d ∈ r_d} d_g + Σ_{t ∈ t} t_g + Σ_{x ∈ values(f)} x ≤ g（0.8.0 #500「Account for gas reserved by transfer and always acc items」——預算現在把 transfer gas 與 free allowance 也算進去）；n = i + |t| + |f|；(e*, t*, b*, u*) = Δ*(e, t, r[..i], f)；遞迴 Δ+(g*, t*, r[i..], e*, {})，g* = g + Σ t* gas − Σ u* used。為什麼是這種「先估後扣」設計：§12.2 兩個相斥因素——實際 gas 只有執行後才知道（sequential），但同一 service 的 items 想合併成一次 PVM 呼叫以攤銷啟動成本（parallel）。干擾項逐一：把測試寫成「只加 digest 的 d_g」、g* 漏掉 + Σ t* 的 gas、又把同一份 f 帶進每一輪者，描述的正是 0.7.2 的行為——0.8.0 的 #500 才把 t_g 與 f 納入預算判斷，而 eq. 12.17 的遞迴明確傳 ∅ 進去（always-accumulate 只在第一輪免費）。說 g = G_A·C = 3.41·10^9、χ_Z 的額度從這個總額裡「扣」者錯在 eq. 12.24 是 max(G_T, G_A·C + Σ χ_Z)：always-accumulate 的額度是**外加**在 G_A·C 之上，何況 3.41·10^9 < G_T = 3.5·10^9，取 max 之後根本就是 G_T。說 g = G_R = 5·10^9、一次只 accumulate 一個 report、遇到 panic 就停者錯三處：G_R 是**單一 work-package 的 refine** 上限（§14.3：Σ w_g < G_R），與 accumulation 預算無關；Δ+ 取的是最大**前綴**而非單一 report；service 在 Ψ_A 內 panic 只會讓它自己的 output 消失、gas used 照記，不會中止 Δ+。","trap":"遞迴時 f（always-accumulate）傳空——特權 service 只在第一輪免費 accumulate。"},{"id":"ch12-delta-star","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.18–12.19 (Δ*, R)","difficulty":3,"kind":"concept","tags":["accumulation","privileges"],"stem":"In Δ* (parallel accumulation), which services are accumulated and how are the privileged indices (assigners, delegator, registrar) resolved when both the manager and the privileged service itself change them?","options":["s = {services with a digest} ∪ keys(f) ∪ {destinations of deferred transfers}; each is accumulated exactly once via Δ1; χ′_M and χ′_Z are taken from the registrar's output; the conflict resolver is R(o, a, b) = a when a = o, else b","s = {services with a digest} ∪ keys(f) ∪ {destinations of deferred transfers}; each is accumulated exactly once via Δ1; the manager's output alone decides χ′_M and χ′_Z; for assigners, delegator and registrar the conflict resolver is R(o, a, b) = b when a = o, else a","s = {services with a digest} only, so a service that merely receives a deferred transfer or enjoys free accumulation is skipped; each is accumulated exactly once via Δ1; the manager's output alone decides χ′_M and χ′_Z, and assigners, delegator and registrar are changeable only by the manager","s = every service in keys(δ); each is accumulated once per work-digest rather than once per round, so a service holding three digests runs Δ1 three times; the manager's output alone decides χ′_M and χ′_Z; a privilege changed by both the manager and its current holder in the same round makes the block invalid"],"answer":1,"explanation":"eq. 12.18：s = {d_s | r ∈ r, d ∈ r_d} ∪ K(f) ∪ {t_d | t ∈ t}；每個 s 呼叫 Δ1(e, t, r, f, s) 一次。(χ′_M, χ′_Z) 直接取 manager m 的輸出 e*；∀c：χ′_A[c] = R(χ_A[c], e*_A[c], (Δ1(χ_A[c]) 輸出)_A[c])；同理 χ′_V、χ′_R；eq. 12.19：R(o, a, b) = b 若 a = o 否則 a。§12.2：「This allows privileges to be 'owned' and facilitates the removal of the manager service」——assigner 可以自己把 assign 權轉走（owned privileges，0.7.1 #475），但 manager 的變更優先。ι′ 來自 delegator 的輸出，φ′[c] 來自 assigner c 的輸出。新建帳戶 n 與刪除帳戶 m 合併進 δ；若兩個 service 產生同一個新 index（理論上不會）則區塊無效。干擾項逐一：說 s 只有「有 digest 的 service」、且特權只能由 manager 更動者錯兩處——eq. 12.18 的 s 還要聯集 K(f) 與 transfer 的收件人 t_d，而 §12.2 明說 R 存在的用意正是讓特權可以被「owned」、由持有者自己轉走。說 s = keys(δ)、同一 service 有幾個 digest 就跑幾次 Δ1、特權衝突讓區塊無效者錯三處——只有 s 之內的 service 會被 accumulate；Δ1 把該 service 這一輪的所有 digest 併成**一次** Ψ_A 呼叫（這正是 §12.2 要攤銷 PVM 啟動成本的理由）；特權衝突交給 R 解決，唯一會讓區塊無效的是兩個 service 產生同一個新／改／刪帳戶 index。說 (χ′_M, χ′_Z) 取自 registrar、且 R(o, a, b) = a 若 a = o 否則 b 者把兩件事都弄反了——這兩項直接取 manager 的輸出，而顛倒後的 R 會在 manager 沒動時回傳 prior 值 o，等於永遠忽略持有者自己的變更。","trap":"每個 service 一輪只 accumulate 一次，其 inputs = 給它的 transfers ⌢ 它的 operand tuples（eq. 12.23）。"},{"id":"ch12-delta-one-gas","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.23 (Δ1)","difficulty":2,"kind":"concept","tags":["accumulation","gas"],"stem":"For a single service s, Δ1 invokes Ψ_A(e, τ′, s, g, i^T ⌢ i^U). How is the gas g computed and what are the inputs?","options":["g = δ[s]_g, the service's own minaccgas, capped at G_A = 10^7; i^T = the transfers to s (in order), i^U = one operand tuple per work-REPORT carrying at least one digest of s, not one per digest","g = f[s] (free allowance, or 0) + Σ gas of deferred transfers destined to s + Σ accumulate gas-limits of s's digests across the round's reports; i^T = the transfers to s (in order), i^U = one operand tuple per digest of s (report order)","g = f[s] (free allowance, or 0) + Σ gas of deferred transfers destined to s, the digests' accumulate gas-limits NOT being added because Δ+ already charged them against the block budget; i^T = the transfers to s (in order), i^U = one operand tuple per digest of s (report order)","g = f[s] (free allowance, or 0) + Σ gas of deferred transfers destined to s + Σ accumulate gas-limits of s's digests across the round's reports; the argument sequence is i^U ⌢ i^T, this round's operand tuples coming ahead of any transfer carried over from the previous round"],"answer":1,"explanation":"eq. 12.23：g = f[s]（若無則 0）+ Σ_{t: t_d = s} t_g + Σ_{d: d_s = s} d_g；i^T = [t | t ∈ t, t_d = s]；i^U = [(r_d result, g_d gas limit, y payload hash, o auth trace, e segroot, h package hash, a authorizer) | r ∈ r, d ∈ r_d, d_s = s]。0.7.1 起 on_transfer 被併入 accumulate：transfer 以 input 形式（在 operand 之前）交給同一次 Ψ_A（你們 deferred_transfers.go 的註解「v0.7.1 has removed deferred transfers & Ψ_T」）。operand tuple 定義在 eq. 12.13：(h, e, a, y, g, o, r)。干擾項逐一：說 digest 的 d_g 不併進 g（理由是 Δ+ 已經扣過）者錯在 eq. 12.23 的 g 是三項相加、缺一不可——Δ+ 的預算測試只決定這一輪吃幾個 report，真正交給 Ψ_A 的額度仍要把該 service 自己所有 d_g 加總進去。說 g = δ[s]_g（minaccgas）者搞混了角色：a_g 是 §11 驗 report 時要求 d_g ≥ 它的**下限**（每個 work-item 至少要有這麼多 gas 才值得跑），不是 accumulate 當下拿到的額度；而 i^U 是**每個 digest** 一筆 operand（產生式同時走 r ⊰ r 與 d ⊰ r_d），同一 report 裡屬於 s 的兩個 digest 會給出兩筆。說順序是 i^U ⌢ i^T 者把方向弄反了——eq. 12.23 明寫 Ψ_A(…, i^T ⌢ i^U)，transfer 在前、operand 在後，0.7.1 併掉 Ψ_T 之後就是靠這個位置區分兩類 input。","trap":"digest 的 g 是 accumulate gas limit（guarantor 從 work-item 帶進來，鏈上檢查 ≥ a_g）。"},{"id":"ch12-deferred-transfer","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.14 & B.transfer","difficulty":1,"kind":"concept","tags":["accumulation","transfers"],"stem":"A deferred transfer T = (s, d, a, m, g). What are the fields, and when is the balance moved?","options":["s the sender's Ed25519 public key, d the destination service, a the amount, m a 32-octet memo hash, g the gas price the sender is willing to pay; the sender's balance is deducted when `transfer` is called and credited to the destination inside the very same Δ* round","s source service, d destination, a amount, m memo of W_T = 128 octets, g gas limit for the recipient's handling; the sender is debited when `transfer` is called, and the destination is credited later in the same round by a separate on-transfer entry point Ψ_T that Δ* invokes once the digests are done","s source service, d destination, a amount, m memo of W_T = 128 octets, g gas limit for the recipient's handling; the sender's balance is deducted when `transfer` is called, and the amount is credited to the destination when it is accumulated in a later round","s source service, d the destination CORE index, a amount, m memo of W_T = 128 octets, g gas limit for the recipient's handling; nothing leaves the sender until the destination is actually accumulated, so a transfer aimed at a service deleted during the same round costs the sender nothing"],"answer":2,"explanation":"eq. 12.14：T ≡ (s ∈ N_S, d ∈ N_S, a ∈ N_B, m ∈ B_{W_T}, g ∈ N_G)，W_T = C_memosize = 128。B 附錄 `transfer`（index 21）：呼叫時檢查 d 存在（否則 WHO）、l ≥ δ[d]_m（否則 LOW）、扣款後餘額 ≥ 自己的 threshold（否則 CASH），成功則立刻從 sender 扣除 a 並把 T 追加到 context 的 transfers 序列。接收方在**下一輪** Δ+ 才以 input 形式收到（Δ+ 的 t* 餵給遞迴呼叫），此時餘額才加上去；轉給不存在（或本輪被刪除）的 service 會被丟棄——但 sender 早就被扣了。干擾項逐一：說 s 是 Ed25519 公鑰、m 是 32-byte memo hash、g 是 gas price、且同一輪就入帳者錯四處——eq. 12.14 的 s、d 都是 service index（N_S），m 是 W_T = 128 octet 的 **memo 本體**（Ω_T 直接從記憶體讀 128 bytes），g 是給收方處理用的 gas **limit** 不是價格，而收方要到下一輪 Δ+ 才拿到這筆 input。說 d 是 **core** index、且要等收方被 accumulate 才扣款者錯兩處——d ∈ N_S 是 service，而 Ω_T 成功時當場把 self 的 balance 設為 b = balance − a，就算收方稍後消失，這筆錢也已經離開 sender。說有一個獨立的 Ψ_T on-transfer 進入點在同一輪把款項送達者錯在 0.7.1 就把 Ψ_T 併進 accumulate 了：0.8.0 只有 Ψ_A，transfer 以 i^T 的形式排在 operand 之前（eq. 12.23），而且是**下一輪**才交付。","trap":"memo 固定 128 bytes；g 是給接收方處理這筆 transfer 的 gas，會計入下一輪預算。"},{"id":"ch12-outputs","ch":"12","section":"12.3 Final State Integration","gpRef":"eq. 12.24–12.33 (δ† → δ‡ → δ′)","difficulty":2,"kind":"concept","tags":["accumulation","state"],"stem":"After Δ+ returns (n, e′, b, u, t), which statements about the final integration are correct?","options":["θ′ = the (service, hash) pairs in b (services that yielded a 32-byte hash); (δ†, ι′, φ′, χ′) come from e′; the accumulation statistics record per service (N items accumulated, G gas used), the transfer count having been dropped; δ‡ marks a_a = τ′ for every service in keys(δ†); ξ′[E−1] = P(R*[..n])","θ′ = H(E(δ†)), a single commitment to the whole posterior service state; (δ†, ι′, φ′, χ′) come from e′; the accumulation statistics record per service (N items accumulated, T transfers processed, G gas used); δ‡ marks a_a = τ′ for every service that appears in the statistics; ξ′[E−1] = P(R*), the whole accumulatable sequence","θ′ = the (service, hash) pairs in
