service has since replaced or forgotten the preimage","From the pool entry: the hash in α[c] is the preimage hash of the code concatenated with its configuration, so a guarantor fetches that blob by hash from any peer and runs it against the current best head, which is why an authorizer only becomes usable once someone has published its preimage","From the account of the first work-item's service, read at the anchor block's posterior state, since the anchor is what already pins the refinement context to a recent state root every validator has agreed on — eq. 11.36 has matched that root against β†, so no separate retention rule is needed to keep the code resolvable","From the work-package itself: the code blob travels in the bundle beside the token and the configuration blob, which is exactly what the 64,000-octet limit bounds, so a guarantor needs no preimage lookup at all and the hash pooled in α[c] is simply the Blake2b of that code section"],"answer":0,"explanation":"eq. 14.11：p_a ≡ H(p_u ⌢ p_f)（authorizer = auth code hash 與 config blob 串接後的 Blake2b，0.8.0 PR #522 把 ch.8 與 ch.14 的說法對齊），而 E(var(metadata), auth code) ≡ Λ(δ[p_h], (p_c)_t, p_u)，其中 p_u 是 auth code hash、p_h 是 auth code host service。三個重點：(1) 供應 code 的是 work-package 自己宣告的 auth code host service p_h，那是 eq. 14.2 裡與 work-item 的 service 分開的獨立欄位 —— 這正是「授權」與「工作」分離的具體長相：買 coretime 的人挑 authorizer，真正做事的是別的 service；(2) 時間點是 lookup anchor 的 timeslot (p_c)_t，不是 anchor，因為 Λ 的設計目標是「在可能被 audit 的整段期間答案不變」，GP 用 D = L + 4,800 = 19,200 slots 的 expunge period 保證這件事；用 anchor 或 best head 解析會讓 auditor 兩個 epoch 後重跑得到不同的 code，破壞可審計性；(3) α[c] 只有 32 bytes 的 hash，既沒有 config 也沒有 code，光靠它取不到程式。W_A = 64,000 是「解析出來的」is-authorized code 的大小上限（eq. B.1 的 BIG 條件），不是 bundle 內某個欄位的上限——bundle 自己的上限是 W_B ≈ 13.8 MB。所以「code 隨 bundle 一起送、不必查 preimage」錯：eq. 14.2 的 work-package 只帶 p_h（auth code host service）、p_u（code hash）與 p_f（config），code 是由 eq. 14.11 的 Λ 解析出來的等價值。「拿 α[c] 的 hash 直接去要 preimage、對 best head 執行」也錯：α[c] 存的是 H(p_u ⌢ p_f)，是「hash 串 config」再取一次 hash，本身不是任何 blob 的 preimage key；而綁 best head 等於讓答案隨鏈頭飄移，正是 Λ 要避免的。至於「讀第一個 work-item 的 service、取 anchor 的 posterior state」，anchor 最多只有 8 個區塊深，audit 可能發生在兩個 epoch 之後，重跑會拿到不同結果——GP 才要用 lookup anchor 搭配 D = 19,200 slots 的 expunge period。","trap":"anchor 與 lookup anchor 是兩個不同的區塊：anchor 管 state/beefy/timeslot 比對，lookup anchor 管所有 preimage 的解析時點。"},{"id":"c3-ch08-unauthorized-report-outcome","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 11.32 & eq. 8.2","difficulty":3,"kind":"code","tags":["authorization","guarantees","prior-posterior"],"stem":"This 0.7.2 code implements the authorizer half of eq. 11.32. Which pool is it obliged to read, and what is the protocol-level consequence when the membership test fails?","code":{"lang":"go","caption":"internal/extrinsic/guarantee_controller.go:172-186 (ValidateWorkReports; gas checks elided)","src":"func (g *GuaranteeController) ValidateWorkReports() error {\n\tworkReports := g.WorkReportSet()\n\talpha := blockchain.GetInstance().GetPriorStates().GetAlpha()\n\tdelta := blockchain.GetInstance().GetPriorStates().GetDelta()\n\trhoDoubleDagger := blockchain.GetInstance().GetIntermediateStates().GetRhoDoubleDagger()\n\tfor _, workReport := range workReports {\n\t\tif rhoDoubleDagger[workReport.CoreIndex] != nil {\n\t\t\terr := ReportsErrorCode.CoreEngaged\n\t\t\treturn &err\n\t\t}\n\t\tauthPool := alpha[workReport.CoreIndex]\n\t\tif !isAuthPoolContains(authPool, workReport.AuthorizerHash) {\n\t\t\terr := ReportsErrorCode.CoreUnauthorized\n\t\t\treturn &err\n\t\t}\n\t\t// … per-service accumulate-gas checks elided …\n\t}\n\treturn nil\n}"},"options":["Either pool will do, because the rotation only removes the authorizer the report itself consumed; failure records the report's guarantors as culprits in the disputes state so that the next epoch's punishment set slashes them, their Ed25519 keys entering ψ_O through the offenders marker of this very header","The prior pool, but the report is still admitted into the availability assignments with an empty authorizer trace and is silently discarded at accumulation time, which is why an absent authorizer costs a guarantor nothing and ρ‡ holds the entry until the U = 5 slot assurance timeout clears it","The prior pool, since the posterior one is only formed after accumulation out of the posterior queue; and the failure is an ordinary block-validity failure — the guarantee cannot be part of a valid block, so there is no report to punish anyone over and nothing is written to the disputes state","The posterior pool, because the report is being included in this very block and eq. 8.2's rotation is applied before guarantees are processed; failure then invalidates the block, which is why the dependency graph lists α′ among the inputs of ρ′ rather than the other way round"],"answer":2,"explanation":"eq. 11.32 寫的是 ∀r ∈ I : ρ‡[r_c] = ∅ ∧ r_a ∈ α[r_c] —— α 沒有 prime。順序上也只能如此：eq. 8.2 的 α′ 依賴 φ′，而 φ′ 是 accumulation 的產出，§8.2 明說 \"practically speaking, this step must be computed after accumulation\"，所以 guarantee 驗證的當下 α′ 根本還不存在。程式碼用 GetPriorStates().GetAlpha() 是對的，也因此本區塊 accumulation 才剛 assign 進 queue 的新 authorizer，最快要下一個區塊才可能被引用。至於後果：§11 的這些條件是「區塊有效性條件」，不滿足就整個區塊不合法，import 時直接拒（團隊實作回 CoreUnauthorized），不會產生任何 offender 紀錄。這是刻意的分工：culprit／fault 只處理需要離線資料（重跑 refine、拉 audit DA）才能判定的爭議，而 authorizer 在不在 pool 裡是任何節點光看鏈上狀態就能算出來的條件，既不需要 dispute，也沒有「已經被接受、事後才發現」的狀態可罰。ρ 也不會先收下再丟：eq. 11.46 只把通過全部檢查的 guarantee 填進 ρ′。順帶一提 ρ‡ 是 assurances 之後、guarantees 之前的中間態，這正是 core-engaged 檢查要用它而不是 ρ 的原因；也因此「先塞進 ρ‡ 等 U = 5 slot 超時再清掉」不可能發生——ρ‡ 早在 guarantee 進來前就定案了。「α′ 是 ρ′ 的輸入」也把箭頭指反：§4 的依賴圖寫的是 α′ ≺ (H, E_G, φ′, α)，E_G 餵給 α′，而 ρ′ ≺ (E_G, ρ‡, κ, τ′) 根本不含 α′。「兩個 pool 都可以」則忽略了 eq. 8.2 每塊每個 core 都會 append 一項 φ′[c]↺[H_T]，α 與 α′ 幾乎必然不同；至於罰則，ψ_O 只能經由 E_D 的 culprits／faults 增長，header 的 offenders marker 只是把 E_D 新增的那些 key 公告出來，不是另一條入口。","trap":"「檢查用 prior α、更新用 posterior φ′」同一章兩個方向；面試常問「同一個區塊裡剛 assign 的 authorizer 能不能馬上用」——不能。"},{"id":"c3-ch09-expunge-delay","ch":"9","section":"9.2 Preimage Lookups","gpRef":"§9.2 (domain of Λ); App. B Refine Invocation (D ≡ L + 4,800 = 19,200)","difficulty":1,"kind":"rationale","tags":["accounts","preimages","constants"],"stem":"§9.2 bounds the timeslot argument of the historical-lookup function Λ to the window (H_t − D … H_t), and the constants appendix fixes D = 19,200 timeslots. What is the GP's stated reason for that particular number?","options":["The period must exceed the two-epoch audit window (1,200 timeslots) by a factor of sixteen so that erasure-coded bundles can still be reconstructed from the 1,023 validators' shards during a dispute; D is derived from that retention period, not from any anchor age.","Ω_H must return the same answer at every moment when auditing may still occur; the lookup anchor may itself be up to L = 14,400 timeslots older than recent history, so the period is that anchor age plus a further 4,800 slots (eight hours) of safety margin.","19,200 timeslots is exactly 32 epochs, which is precisely how long the accumulation history ξ keeps work-package hashes, so a preimage may not be dropped before the work-package that used it can no longer be re-accumulated; D is fixed at 32·E for that reason.","The per-octet deposit B_L is refunded linearly over the period, and 19,200 slots is 32 hours at six seconds per slot — the standard deposit-refund schedule for elective state; B_L is credited back to a_b in equal instalments over those slots."],"answer":1,"explanation":"GP 附錄 B（Refine Invocation）原文：「The historical-lookup host-call function, Ω_H, is designed to give the same result regardless of the state of the chain for any time when auditing may occur … The lookup anchor may be up to L timeslots before the recent history and therefore adds to the potential age at the time of audit. We therefore set D to have a safety margin of eight hours: D ≡ L + 4,800 = 19,200。」L = 14,400（max lookup anchor age，24 小時），加 4,800 slot（8 小時）＝ 19,200 slot（32 小時）。§9.2 的 Λ 定義域正是 (H_t − D … H_t)。其餘說法錯在理由而非算術：32 epoch 這個換算雖然數字對得上（19,200 / E = 32），但 ξ 只保存「一個 epoch」的 package hashes（eq. 12.1），兩者無關，而且 GP 把 D 定義成 L + 4,800 而不是 32·E——數值巧合不是定義。audit window 那一支推導方向反了：是 lookup anchor 的年齡驅動 D（「The lookup anchor may be up to L timeslots before the recent history and therefore adds to the potential age at the time of audit」），不是 dispute 期間的 erasure 重建；把這個常數的來源歸給某段保存期、宣稱與 anchor 年齡無關，正好否定了 GP 自己寫出來的那條算式。deposit 那一支則兩層都錯：GP 完全沒有 deposit 逐步退款的機制，a_t 是 max(0, B_S + B_I·a_i + B_L·a_o − a_f) 這種門檻式檢查而不是攤提，更不會有任何 B_L 被「分期退回 a_b」——餘額只透過 transfer 與 accumulate 改變。","trap":"D 只是「forget 之後多久才能真的刪」；真正把 preimage 從 state 移除的動作在 `forget`（自家，Ω_F = 25）與 `eject`（別家，Ω_J = 22）兩個 accumulate host call 裡——注意別跟 0.8.0 的 `expunge`（Ω_X = 14）混淆，那是 refine-only 的 inner-PVM 拆除呼叫，與 preimage 無關。preimage 生命週期的狀態機本身在 §9.2.2。"},{"id":"c3-ch09-service-info-leaf","ch":"9","section":"9.3 Account Footprint and Threshold Balance","gpRef":"eq. 9.3, eq. 9.8; §D.1 T(σ) row C(255, s); App. B `info` (Ω_I)","difficulty":2,"kind":"concept","tags":["accounts","state","merklization"],"stem":"a_i (items), a_o (octets) and a_t (threshold balance) are dependent values — §9.3 derives a_i and a_o from a_s and a_l, and a_t from those two plus the stored gratis offset a_f, and none of them is a member of the eq. 9.3 tuple. Which of them actually reach the Merklized state, and how does that compare with what the `info` host call hands back?","options":["All three reach both encodings, and the two encodings are byte-for-byte identical — which is exactly why an implementation is free to reuse a single codec for the trie leaf and for the host call, and why the leaf can be handed straight to the guest's buffer.","The trie leaf carries a_t but neither a_i nor a_o (those are recomputed on demand), while `info` returns a_i and a_o but not a_t; both encodings begin with the version octet 0.","None of the three is serialized anywhere: the trie stores only the eq. 9.3 tuple fields, and a_i, a_o and a_t are recomputed from a_s and a_l each time a host call needs them.","The service-info leaf carries a_i and a_o but not a_t, and it opens with a version octet 0; `info` has no version octet but does include a_t, laid out as E(a_c, E_8(a_b, a_t, a_g, a_m, a_o), E_4(a_i), E_8(a_f), E_4(a_r, a_a, a_p))."],"answer":3,"explanation":"§9.3 說得很清楚：a_i、a_o 是 dependent values，「as we will see in the account serialization function … these are expected to be found explicitly within the Merklized state data. Because of this we make explicit their set.」——所以 a_i ∈ N_{2^32}、a_o ∈ N_{2^64} 被寫死進 trie。附錄 D 的 T(σ)：C(255, s) ↦ E(0, a_c, E_8(a_b, a_g, a_m, a_o, a_f), E_4(a_i, a_r, a_a, a_p))，開頭那個 0 就是 0.7.1 起加入的 service-info version octet，而 a_t 不在裡面（它是 max(0, B_S + B_I·a_i + B_L·a_o − a_f)，隨時可重算）。附錄 B 的 Ω_I（`info`）則是另一個排列：E(a_c, E_8(a_b, a_t, a_g, a_m, a_o), E_4(a_i), E_8(a_f), E_4(a_r, a_a, a_p))——有 a_t、沒有 version octet、a_f 的位置也不同。認為兩者可以共用同一個 codec 是實作最常見的坑；認為 a_i/a_o 不進 state 則會讓你的 state root 對不上官方 vector；把 a_t 寫進 leaf 會多 8 bytes 而整棵 trie 崩掉。","trap":"leaf 有 version octet、沒有 a_t；`info` 沒有 version octet、有 a_t。兩個排列不同，別共用 struct。"},{"id":"c3-ch09-write-threshold-go","ch":"9","section":"9.3 Account Footprint and Threshold Balance","gpRef":"eq. 9.8 (a_i, a_o, a_t); App. B `write` (Ω_W)","difficulty":2,"kind":"code","tags":["accounts","balance","host-calls","fuzzer-bug"],"stem":"This is the team's Ω_W after the fix for the 'write mutates StorageDict before the balance check' bug. Which statement matches GP 0.8.0?","code":{"lang":"go","caption":"PVM/host_call_general.go (write) + internal/service_account/service_account.go:207 (CalcStorageItemfootprint)","src":"// remove the old item's footprint, then add the new one's\nnewItems := a.ServiceInfo.Items - footprintItems\nnewOctets := a.ServiceInfo.Bytes - footprintOctets\n\nstorageItems, storageOctets := service_account.CalcStorageItemfootprint(\n    string(storageRawKey), storageRawData)\nnewItems += storageItems\nnewOctets += storageOctets\n\nnewMinBalance := service_account.CalcThresholdBalance(\n    newItems, newOctets, a.ServiceInfo.DepositOffset) // a_t\nif newMinBalance > a.ServiceInfo.Balance {\n    input.VM.Registers[7] = FULL\n    return OmegaOutput{ExitReason: ExitContinue, Addition: input.Addition}\n}\n\n// balance check passed, now apply the storage mutation\na.StorageDict[string(storageRawKey)] = storageRawData\na.ServiceInfo.Items = newItems\na.ServiceInfo.Bytes = newOctets\n\n// ---- service_account.go ----\nfunc CalcStorageItemfootprint(storageRawKey string, storageData types.ByteSequence) (types.U32, types.U64) {\n\treturn 1, 34 + types.U64(len(storageRawKey)) + types.U64(len(storageData))\n}"},"options":["One storage entry costs 1 against a_i and 32 + |v| against a_o — key length is never charged, because JAM stores only the hash of a storage key in the trie; on FULL the write still lands and the shortfall is taken out of the balance.","One storage entry costs 2 against a_i and 81 + |v| against a_o, exactly like a lookup-meta entry, on the grounds that both occupy precisely one leaf of the state trie; FULL is only ever produced once the balance itself has reached zero, so a solvent service can always complete a write.","The threshold is recomputed once at the end of accumulation rather than on every host call, so `write` can never yield FULL at all; services that over-commit their storage are pruned afterwards by whichever service holds their code-hash tombstone, and their deposit is returned to the parent.","One storage entry costs 1 against a_i and 34 + |k| + |v| against a_o — both the key and the value are charged; when the post-write threshold exceeds the balance the call yields FULL and the account must be returned completely untouched, which is why the map write is deferred until after the comparison."],"answer":3,"explanation":"eq. 9.8：a_i ≡ 2·|a_l| + |a_s|；a_o ≡ Σ_{(h,z)∈K(a_l)} (81 + z) + Σ_{(x,y)∈a_s} (34 + |y| + |x|)；a_t ≡ max(0, B_S + B_I·a_i + B_L·a_o − a_f)。注意求和是對 a_s 的「pair」跑，key 與 value 的長度都算——storage 一筆 = 1 item、34 + |k| + |v| octets；lookup request 一筆 = 2 items、81 + z octets。附錄 B 的 Ω_W：「⟨continue, FULL, s⟩ otherwhen a_t > a_b」——回傳的第三個元素是 **s**（原封不動的帳戶），不是被改過的 a；#979/#980 這個 bug 正是因為 Go map 是 reference，先寫再檢查會讓 FULL 分支殘留寫入，fuzzer seed 3785638964 step 15419 抓到。把 key 長度漏掉（只算 32 + |v|）會讓 a_o 系統性偏低、threshold 太鬆；把 storage 當成 2 items / 81 + z 是把 lookup 的計價套錯對象；threshold 檢查確實是每次 host call（`write`、`solicit` 用 FULL，`transfer`、`new` 用 CASH）當場做的。","trap":"FULL 與 CASH 不同：a_t > a_b 用 FULL（write / solicit）；轉帳後自己跌破 a_t 用 CASH（transfer / new）。兩者都不留下任何狀態變更。"},{"id":"c3-ch09-forget-lifecycle","ch":"9","section":"9.2.2 Semantics","gpRef":"§9.2.2 (four shapes of a_l); App. B `forget` (Ω_F), expunge period D = 19,200","difficulty":2,"kind":"concept","tags":["accounts","preimages","host-calls"],"stem":"A service calls `forget` at time t for one of its own request keys (h, z). Taking the four shapes of a_l[(h, z)] in turn, which set of transitions matches GP 0.8.0?","options":["[] → HUH, there is nothing to forget; [x] → the request entry and a_p[h] are both dropped at once; [x, y] → [x, y, t]; [x, y, w] → [w, t] with no age condition attached; every other case returns HUH.","[] → dropped; [x] → dropped together with a_p[h]; [x, y] → dropped together with a_p[h]; [x, y, w] → dropped together with a_p[h]; every shape collapses at once and the D-slot delay governs only `eject`.","[] → the request entry is dropped; [x] → [x, t]; [x, y] → the request entry and a_p[h] are both expunged, but only once y < t − D; [x, y, w] → [w, t], again only once y < t − D; every other case returns HUH.","[] → the request entry is dropped; [x] → [x, t]; [x, y] → the request entry and a_p[h] are expunged the moment y < t, with no D-slot wait; [x, y, w] → dropped outright rather than rewritten; every other case returns HUH."],"answer":2,"explanation":"附錄 B 的 Ω_F（`forget` = 25）逐條列出 a = self except：(i) 當 a_l[(h,z)] 是 []（無條件），或是 [x, y] 且 y < t − D，同時從 K(a_l) 移除 (h,z)、從 K(a_p) 移除 h；(ii) 當 a_l[(h,z)] = [x]，改寫成 [x, t]；(iii) 當 a_l[(h,z)] = [x,y,w] 且 y < t − D，改寫成 [w, t]；其餘 → error → HUH。這裡要點名一個 GP 的 under-specification：原文只寫了一條 guard「(x_s)_l[h,z] ∈ {[], [x,y]}, y < t − D」，把兩種形狀併在同一個集合裡，但 [] 這一支根本沒有任何東西綁定 y，年齡條件在該支懸空、無從判定；唯一可實作、也就是本題所鍵的讀法，是把 [] 這個 case 直接刪掉、完全不加等待期——[] 代表「已 solicit、從未供應」，若它也要等 D，solicit 之後就永遠取消不掉、[] 會永久卡在 state 裡——所以 D 的等待期實際上只約束 [x, y] 與 [x, y, w] 這兩支。GP 0.8.0 對此並未明文釐清，這是已知的 under-specification。對照 §9.2.2 的四種語意：[] requested、[x] available since x、[x,y] 自 y 起 unavailable、[x,y,z] 自 z 起再度 available。關鍵是「available 的東西不能一步刪掉」——它必須先降級成 [x, t]，等 D = 19,200 slot 後才可能被真正 expunge，這正是 §9.2 開頭說的「it goes through a process of being marked as unavailable, and only after a period of time may it be removed from state. This ensures that historical information on its existence is retained.」認為 available 可以一次刪、或認為 y < t 就能刪，都會破壞 in-core historical_lookup 的確定性（auditor 在 lookup anchor 時點重算會拿到不同答案）。至於 [x,y,w] → [w, t]：舊的 [x,y] 那段歷史被丟掉，因為它已經超過 D、不再需要保存——所以把 [x,y,w] 說成「直接整筆刪掉」也錯，它是被改寫而不是被移除，服務仍然持有那份 preimage 且自 w 起可用。其餘幾個干擾說法逐一對照：把 [] 說成回傳 HUH 的，正好和上面推導的唯一可實作讀法相反（[] 是唯一一支不需等待、可以無條件移除的）；把 [x,y] 說成變 [x,y,t] 的，那是 `solicit` 對 [x,y] 的動作而不是 `forget` 的，兩個 host call 的轉移被對調了；把 [x,y,w] → [w,t] 說成「不附年齡條件」的，漏掉 Ω_F 對這一支同樣要求 y < t − D；說 D 的等待期只管 `eject` 的，則把 §9.2 開頭那句「only after a period of time may it be removed from state」整個取消掉了——`eject` 確實也受 D 約束，但 `forget` 自己就有這道等待期，否則服務隨時可以自我抹除歷史。","trap":"`forget` 不看餘額，`solicit` 才有 FULL 檢查；反向的 `solicit` 只接受兩種輸入形狀（不存在 → []、[x,y] → [x,y,t]），其餘一律 HUH。"},{"id":"c3-ch09-new-service-index","ch":"9","section":"9 Service Accounts","gpRef":"§9 eq. 9.1 (N_S ≡ N_{2^32}); eq. B.14 (check); S = 2^16","difficulty":2,"kind":"concept","tags":["accounts","service-id","accumulation"],"stem":"A service calls `new` during accumulation. How does GP 0.8.0 pick the index of the child account, and how is a clash with an existing service avoided?","options":["The context's next free id starts as check((E⁻¹_4(H(E(s, η′_0, H_t))) mod (2^32 − S − 2^8)) + S) with S = 2^16, so it is folded into the public range only; check linearly probes forward, i ↦ (i − S + 1) mod (2^32 − 2^8 − S) + S, until it lands on an index outside K(δ); the registrar alone may instead name any index below S.","The index is derived from H(E(s, η_0, H_t)) using the prior entropy accumulator and then probed downwards until a free slot appears; the reserved block is the top 2^16 of the index space rather than the bottom, and any service — not merely the registrar — may claim one of those reserved slots.","The index is the largest key currently present in δ plus one, so indices are handed out strictly sequentially across the whole chain and a clash is impossible by construction; the registrar merely reserves the first 2^16 of them at genesis and hands them out off-chain.","The index is Blake2b of the new account's code hash reduced mod 2^32, so that identical code always lands on the same slot and duplicate deployments are cheap; there is no probing at all, and should that index already be occupied the whole block is rejected as invalid."],"answer":0,"explanation":"附錄 B 的 initializer I：a（next free id）= check((E⁻¹_4(H(E(s, η′_0, H_t))) mod (2^32 − S − 2^8)) + S)，用的是**posterior** entropy accumulator η′_0 與本區塊的 H_t；模數刻意扣掉 S = C_minpublicindex = 2^16（registrar 專屬的 protected range）與最高的 2^8，所以隨機落點一定在 public range。eq. B.14 的 check(i) = i 若 i ∉ K(δ)，否則 check((i − S + 1) mod (2^32 − 2^8 − S) + S)——就是往前線性探測到第一個空位。成功 `new` 之後 context 的下一個 id 再跳 42：i* = check(S + (a − S + 42) mod (2^32 − S − 2^8))。registrar 路徑另走一條：當 caller = χ_R 且要求的 id < S，直接用該 id（已被占用則 FULL）。GP 也補了一句保險：萬一同一個 index 真的被兩個 service 取走，「the block is considered invalid」，但「Since no service can predict the identifier sequence ahead of time, they cannot intentionally disadvantage the block author.」用 code hash 當種子會讓相同 code 的服務互撞；純遞增計數器在 parallel accumulation（Δ*）下無法決定性合併；用 prior η_0 則會讓 index 在區塊執行前就可預測。","trap":"η′_0（posterior）不是 η_0；並且 `new` 只在 accumulate 內可用，refine 沒有 δ。"},{"id":"c3-ch09-privilege-mutation","ch":"9","section":"9.4 Service Privileges","gpRef":"eq. 9.9–9.10 (χ); App. B `bless` (Ω_B), `assign` (Ω_A), `new` (Ω_N)","difficulty":3,"kind":"delta","tags":["accounts","privileges","gratis","delta-0.8.0"],"stem":"Your Go node is on GP 0.7.2, where the 'Owned Privileges' model let each privileged service rewrite its own slot of χ. What does GP 0.8.0 change, and who may hand a brand-new account a non-zero gratis storage offset a_f?","options":["Ω_B is the one host call that rewrites (χ_M, χ_A, χ_V, χ_R, χ_Z) wholesale, and it now yields HUH unless the caller is χ_M itself, so no service can promote itself to manager; a core's assigner may still hand over its own χ_A[c] through `assign`, and `new` yields HUH whenever f ≠ 0 and the caller is not the manager.","Ω_B is open to any service whose own index sits below S = 2^16, since occupying the protected range is what confers privilege in the first place; χ_A[c] may then only be moved by the manager, and a service raises its own a_f through `upgrade`.","Ω_B may still be invoked by any of the five privileged services, each rewriting only the slot it owns; the manager is special solely in that it may grant storage deposit credits, and `new` accepts f ≠ 0 from either the manager or the registrar.","χ is no longer mutable by host calls at all in 0.8.0; it may only be rewritten by the services listed in χ_Z as part of the automatic accumulation they receive in every block, and a_f is fixed for every account at genesis and can never be raised afterwards by anyone, manager included."],"answer":0,"explanation":"GP 0.8.0（PR #519 「Restrict bless to manager service」）在 Ω_B 加了一條守衛：「⟨continue, HUH, …⟩ otherwhen x_s ≠ (x_e)_m」（x_s 是呼叫者的 service index，x_e 是 invocation context 裡的 partial state）——也就是呼叫者不是 χ_M 就整組 HUH。§9.4 原文也改成 χ_M「is the service able to effect an alteration of χ from block to block as well as bestow services with storage deposit credits」。0.7.1 的 Owned Privileges（#475）讓每個特權服務改自己那格，攻擊面是：某服務先 bless 自己成 manager，再用 `new` 配 gratis storage、或把自己設成 registrar 去搶 < S 的低位 index。要留意 0.8.0 並沒有把「自有權」全部收回：Ω_A（`assign`）仍然要求 x_s = (x_e)_a[c] 才能寫 φ[c]，而且它同時寫回 χ_A[c]，所以 assigner 依然能把自己那一核的權限交棒；Ω_D（`designate`）則只要求 x_s = (x_e)_v，能改 ι 但改不了 χ_V。gratis 的守衛在 Ω_N：「⟨continue, HUH, …⟩ otherwhen f ≠ 0 ∧ x_s ≠ (x_e)_m」。`upgrade`（Ω_U）只能改自己的 a_c/a_g/a_m，碰不到 a_f；低 index 與特權完全是兩回事（低 index 只是 registrar 能指定的保留區）；χ_Z 只是「每個區塊自動 accumulate 並配基本 gas」的字典，沒有任何寫 χ 的能力。","trap":"0.7.2 → 0.8.0 的一句話：bless 只剩 manager 能叫；但 assign 仍保留 per-core 的自有權。"},{"id":"c3-appD-key-31-octets","ch":"D","section":"D.2.1 Node Encoding and Trie Identification","gpRef":"§D.1 (C → B_31); §D.2.1 (nodes fixed at 512 bit)","difficulty":1,"kind":"rationale","tags":["merklization","trie","state-keys"],"stem":"The state-key constructor C is specified as producing B_31, yet every other quantity in the state trie — child identities, the embedded value slot, H(v) — is 32 octets. What forces the key to be one octet short?","options":["The top octet is reserved so that the branch/leaf discriminator bit can be carried inside the key itself, which is what lets a verifier tell the two node types apart without fetching the node.","Keys are Blake2b outputs with the one-octet chapter index stripped off before storage; the value field is likewise 31 octets, padded to 32 only when hashed.","A node is fixed at 512 bit, and a leaf must fit a one-octet discriminator-plus-size header, the key, and a full 32-octet field for either the value or its hash: 1 + 31 + 32 = 64.","31 octets leaves one spare octet in a branch node so that a third child pointer can be appended when a sub-trie exceeds the 2^8 fan-out limit."],"answer":2,"explanation":"§D.2.1：「Nodes are fixed in size at 512 bit (64 bytes).」leaf 的版面是：第 1 bit 分辨 branch/leaf，第 2 bit 分辨 embedded-value leaf 與 regular leaf，該 byte 剩下的 6 bits 存 embedded value 的長度（regular leaf 則清零）；「The following 31 bytes are dedicated to the state key. The last 32 bytes are defined as the value, filling with zeroes if its length is less than 32 bytes」或是 H(v)。1 + 31 + 32 = 64——31 就是 64 扣掉 header octet 與整整 32 octet 的 value/hash 欄位之後剩下的空間，這也是 §D.1 一開始就說 state serialization 是「a mapping from 31-octet sequence state-keys to octet sequences of indefinite length」的原因。discriminator 位在 node 的第一個 byte、不在 key 裡（key 的每個 bit 都拿去做 trie 導航，不能挪用）；value 欄位是 32 octet 不是 31；branch 只有兩個 child（左邊丟掉最高 bit 給 discriminator，用 255 bits；右邊用完整 256 bits），沒有第三個 child 的概念。","trap":"JIP-4 chainspec 的 genesis_state 每個 key 是 62 個 hex 字元 = 31 bytes，正好對得上。"},{"id":"c3-appD-service-subkeys","ch":"D","section":"D.1 Serialization","gpRef":"§D.1 (state-key constructor C; the final four rows of T(σ))","difficulty":2,"kind":"concept","tags":["merklization","state-keys","accounts"],"stem":"In T(σ) a service's storage entries, its preimages and its lookup-meta entries all go through the very same third form of C. What exactly is passed in, and what keeps the three kinds apart in the trie?","options":["The three kinds are told apart by octet 0 of the finished 31-octet key, which is 0xFD for storage, 0xFE for a preimage and 0xFF for lookup-meta, with the remaining 30 octets holding H(k) or the hash h directly and the service index folded into the value rather than the key.","All three use C(s, h) with h the raw storage key or preimage hash and no marker whatsoever; collisions cannot arise because a service storage key is required by §9 to be exactly 32 octets long, which keeps it inside a namespace disjoint from the 32-octet preimage hashes.","A four-octet marker is prepended before hashing — E_4(2^32−1) ⌢ k for storage, E_4(2^32−2) ⌢ h for a preimage, and E_4(l) ⌢ h for the lookup-meta of declared length l — and C(s, ·) then interleaves the four octets of n = E_4(s) with the first four octets of a = H(·), appending a_4 … a_26.","Storage uses C(s, k) with the raw key, preimages use the chapter form C(254, s) and lookup-meta uses C(253, s); no marker is needed at all because the three already live under distinct chapter indices, and the (h, l) pair of a lookup entry is recovered from the leaf's value rather than its key."],"answer":2,"explanation":"§D.1 的 T(σ) 最後三列逐字寫著：∀⟨s ↦ a⟩ ∈ δ, ⟨k ↦ v⟩ ∈ a_s：C(s, E_4(2^32−1) ⌢ k) ↦ v；∀⟨h ↦ p⟩ ∈ a_p：C(s, E_4(2^32−2) ⌢ h) ↦ p；∀⟨(h, l) ↦ t⟩ ∈ a_l：C(s, E_4(l) ⌢ h) ↦ E(↕[E_4(x) for x ∈ t])。而第三形式的 C 本身是 (s, h) ↦ [n_0, a_0, n_1, a_1, n_2, a_2, n_3, a_3, a_4, a_5, …, a_26]，其中 n = E_4(s)、a = H(h)——service id 的四個 byte 與雜湊的前四個 byte 交錯，之後接雜湊的第 4…26 byte，共 8 + 23 = 31 bytes。GP 接著保證：「Cryptographic hashing ensures that there will be no duplicate state-keys given that there are no duplicate inputs to C.」——不重複性靠的是 C 的**輸入**互斥，marker 就是把三個命名空間分開的手段；也因此 2^32−1 與 2^32−2 這兩個長度值等於被保留掉：只有當某個 service 同時存在一筆長度剛好是 2^32−1 的 lookup 請求、且其 hash 與某個 32-byte storage key 相同時才會撞上，而 0.8.0（PR #520）已把 preimage 長度收進 N_L ≡ N_{2^32}（注意這個型別**仍然包含** 2^32−1 與 2^32−2 兩個保留值，形式上並未排除碰撞，靠的是實務尺寸），實務上 preimage 遠小於 4 GiB，所以安全。想靠 octet 0 分辨是錯的：octet 0 是 n_0，也就是 service id 的最低位 byte，任何 s ≡ 255 (mod 256) 的服務其 storage/preimage key 都以 0xFF 開頭——你們 #779/#780 那個「failed to decode expected service info from state key 0xffff0017…」就是踩到這裡。chapter 形式 C(i, s) 只用在 C(255, s) 的 service info；storage key 長度完全自由，沒有 32 octet 的規定。","trap":"GP 明說 storage key「not required to be known by implementations」——只要存得下 Merklisation-ready 的雜湊即可，原始 key 可以不落盤。"},{"id":"c3-appD-rho-guarantee","ch":"D","section":"D.1 Serialization","gpRef":"§D.1 T(σ) row C(10); eq. 11.1 (ρ spec)","difficulty":3,"kind":"delta","tags":["merklization","state-keys","rho","delta-0.8.0"],"stem":"Your 0.7.2 encoder writes the C(10) entry of T(σ) as, per core, an optional pair of work-report and reporting timeslot. What does GP 0.8.0 put there instead?","options":["Per core an optional pair of work-report and timeslot exactly as before; 0.8.0 only tightened the timeslot to a fixed-length E_4 encoding and left the payload alone.","Per core an optional pair ⟨a_g, E_4(a_t)⟩ written with the ? option discriminator, where a_g is the entire guarantee G ≡ (r work-report, t timeslot, a credential of 2–3 (validator index, Ed25519 signature) pairs) — so the guarantors' signatures are now part of committed state.","The availability assurances extrinsic of the current block, so that an assurer's bitfield can be proven against the state root without replaying the block.","Only the availability specification (package hash, erasure root, segment root, bundle length) of each core's pending report, the guarantee itself being retained off-chain by the guarantors until an audit demands it; that is precisely the size reduction 0.8.0 was aiming for."],"answer":1,"explanation":"GP 0.8.0（PR #494「Keep full guarantees in availability assignments state (rho)」）把 eq. 11.1 改成 ρ ∈ ⟦(g ∈ G, t ∈ N_T)?⟧_C，而 G ≡ (r ∈ R, t ∈ N_T, a ∈ ⟦(N, V̄)⟧_{2:3})（eq. 11.24；0.8.0 的 R 是 work-report 集合、W 是 work-item 集合、V̄ 是 Ed25519 簽章集合），也就是 work-report 加上 guarantor 的 credential。附錄 D 的 T(σ) 因此寫成 C(10) ↦ E([ ⟨a_g, E_4(a_t)⟩? for ⟨a_g, a_t⟩ ∈ ρ ])——外層是 optional discriminator（∅ → 0；否則 1 ⌢ …），內層 timeslot 用固定 4 byte。0.7.2 只存 work-report，signature 不進 state；升上 0.8.0 若沒改，C(10) 的 leaf 會短一大截、state root 直接對不上。注意 guarantee 自己帶一個 t（guarantee 的 timeslot），availability assignment 又帶一個 t（reported 的時間，用於 eq. 11.18 的 U 逾時清除），兩者不是同一個欄位。把 C(10) 當成 assurances extrinsic 是把 extrinsic 與 state 搞混（extrinsic 從不進 trie）；只存 availability spec 則是 work-report 內部的一個欄位，不是 ρ 的內容。","trap":"0.8.0 之後 ρ[c] 有兩個 timeslot：guarantee 內的 g_t，以及 assignment 的 a_t。序列化時別漏掉前者。"},{"id":"c3-appD-merklize-bitorder","ch":"D","section":"D.2 Merklization","gpRef":"§D.2 (M over D⟨b → (B_31, B)⟩); §3 notation (bits(·) is most-significant-first)","difficulty":3,"kind":"code","tags":["merklization","trie","state-root","incremental"],"stem":"M is defined over a dictionary keyed by bits(k), while the team's Go partitions one slice in place at each depth. A teammate proposes replacing it with 'sort the key-vals ascending, then fold them pairwise like M_B — same leaves, same root, and it vectorizes better'. Which statement is correct?","code":{"lang":"go","caption":"internal/utilities/merklization/merklization.go (partitionByBit, merklizeWithCache)","src":"func partitionByBit(entries []types.StateKeyVal, depth int) int {\n\tbyteIdx := depth / 8\n\tbitMask := byte(1 << (7 - depth%8))\n\tleft := 0\n\tfor right := range entries {\n\t\tif entries[right].Key[byteIdx]&bitMask == 0 {\n\t\t\tentries[left], entries[right] = entries[right], entries[left]\n\t\t\tleft++\n\t\t}\n\t}\n\treturn left\n}\n\nfunc merklizeWithCache(entries []types.StateKeyVal, depth int, cache LeafHashCache) types.OpaqueHash {\n\tif len(entries) == 0 {\n\t\treturn types.OpaqueHash{}\n\t}\n\tif len(entries) == 1 {\n\t\tif cache != nil {\n\t\t\treturn cache(entries[0].Key, entries[0].Value)\n\t\t}\n\t\tnode := encodeLeafNode(entries[0].Key, entries[0].Value)\n\t\treturn hash.Blake2bHash(node[:])\n\t}\n\tpivot := partitionByBit(entries, depth)\n\tleftHash := merklizeWithCache(entries[:pivot], depth+1, cache)\n\trightHash := merklizeWithCache(entries[pivot:], depth+1, cache)\n\tnode := encodeBranchNode(leftHash, rightHash)\n\treturn hash.Blake2bHash(node[:])\n}"},"options":["bits(·) runs least-significant-bit first so as to agree with the bit-sequence encoding E(b) of appendix C, so depth d has to branch on bit d mod 8 of octet ⌊d/8⌋; the partition shown is therefore reversed, and the only reason such an implementation ever matches a vector is that its state-key constructor is reversed too.","The proposal is sound: ascending key order is exactly a pre-order walk of the Patricia trie, so pairwise folding rebuilds the identical shape and the identical root; the in-place partition is nothing but an allocation optimization, and leaf caching keeps working either way because a leaf hash depends on nothing beyond its own key and value.","bits(·) runs most-significant-bit first, so depth d branches on bit 7 − (d mod 8) of octet ⌊d/8⌋; the shape follows from key bit-prefixes alone and never from slice order, which is what lets leaf hashes be cached and only the path from a changed leaf to the root recomputed — folding sorted leaves pairwise builds a balanced tree and a different root.","Insertion order genuinely matters here: the GP requires the leaves to be folded in ascending key order because the resulting root is what gets appended to the accumulation-output belt by M_R, an append-only structure; caching leaf hashes across blocks is consequently unsound and the trie must be rebuilt in full every block."],"answer":2,"explanation":"§3（notation）定義得很明確：「We use the function bits(B) ∈ b to denote the sequence of bits, ordered with the most significant first … thus bits([160, 0]) = [1, 0, 1, 0, 0, …]」，所以 depth d 要取 octet ⌊d/8⌋ 的第 7 − (d mod 8) 個 bit——正是程式裡的 `byte(1 << (7 - depth%8))`。§D.2 的 M 收的是 dictionary D⟨b → (B_31, B)⟩，遞迴條件是 ⟨b ↦ p⟩ ∈ d ⇔ ⟨b[1:] ↦ p⟩ ∈ l（當 b_0 = 0）或 r（當 b_0 = 1）：樹形**只**由 key 的 bit prefix 決定，跟輸入順序無關。這正是 incremental / cached 計算的前提：leaf hash 可以用 (key, H(value)) 當快取鍵（你們的 `LeafHashCache` 與 `key_level_cache.go` 就是這樣做），一個 block 只改動幾百個 key 時，只需要重算那幾條從 leaf 到 root 的路徑，而不是整棵 trie——否則每個 block 都要重雜湊整個 state，pipelining（header 帶 prior state root）就完全沒有意義了。把排序後 pairwise 摺疊會得到 well-balanced 樹（那是 M_B / 附錄 E 的做法），深度與分岔點都不同，root 必然不同。M_B 用在 accumulation-output log 每區塊的 root（β_B′ ≡ A(β_B, M_B(s, keccak), keccak)）與 work-package 的 erasure root；segment root 用的是定深的 M（constant-depth merklization），而 0.8.0 的 extrinsic hash 根本不是 Merkle 樹：H_X ≡ H(E(H^#(a)))（PR #524）。至於 bit order：附錄 C 的 E(b ∈ b) 確實是 LSB-first 打包 octet，但那是 codec，不是 trie 導航——把兩者搞混是實作最典型的 state-root 不符來源。M_R（MMR super-peak）是 accumulation-output belt 的東西，跟 state trie 無關。","trap":"同一份 GP 裡有兩種 bit 順序：trie 導航 bits(·) 是 MSB-first，codec 的 bitstring 打包是 LSB-first。"},{"id":"c3-ch12-omega-xi-theta-naming","ch":"12","section":"12.1 History and Queuing","gpRef":"eq. 12.1 & 12.3; eq. 7.4 (θ); §4.2 state σ","difficulty":1,"kind":"delta","tags":["accumulation","state","notation","delta-0.8.0"],"stem":"Among the state items in σ written by accumulation are ω, ξ and θ. A GP 0.7.2-era Go client still calls its ready-queue field `Vartheta`. Which mapping of symbol → meaning is right for GP 0.8.0?","options":["ω ∈ ⟦{H}⟧_E took over from ξ as the epoch-long history of already-accumulated work-package hashes; the ready queue is still spelled ϑ ∈ ⟦⟦(ℝ, {H})⟧⟧_E in 0.8.0 and θ ∈ ⟦(N_S, H)⟧ is unchanged, so a 0.7.2 client only has to retire the symbol ξ and repoint the state key that held it","ω ∈ ⟦(N_S, H)⟧ is the Accumulation Output Log, renamed from θ in 0.8.0; ξ ∈ ⟦⟦(ℝ, {H})⟧⟧_E is the ready queue of deferred reports each paired with its outstanding dependency set; θ ∈ ⟦(N_S, N_G)⟧ now holds the per-service gas usage u that the last block's Δ+ returned, which is what the accumulation statistics read","ω ∈ ⟦⟦(ℝ, {H})⟧⟧_E is the ready (accumulation) queue of deferred reports each paired with its outstanding dependency set — GP 0.7.2 wrote this as ϑ; ξ ∈ ⟦{H}⟧_E is the epoch-long history of already-accumulated work-package hashes; θ ∈ ⟦(N_S, H)⟧ is the Accumulation Output Log, this block's (service, commitment) pairs","ω ∈ ⟦(N_S, N_S, N_B, B_128, N_G)⟧ is a new 0.8.0 state item holding the deferred transfers carried between accumulation rounds so that they survive a block boundary; ϑ ∈ ⟦⟦(ℝ, {H})⟧⟧_E remains the ready queue and ξ ∈ ⟦{H}⟧_E the epoch-long history of accumulated work-package hashes"],"answer":2,"explanation":"GP 0.8.0 的 preamble 明訂 \\ready = ω、\\accumulated = ξ、\\lastaccout = θ。eq. 12.3 給出 ω ∈ ⟦⟦(ℝ, {H})⟧⟧_E（ℝ 是 0.8.0 的 work-report 集合，0.7.2 記作 W；每個 slot 一串「report + 尚未滿足的 dependency 集合」），eq. 12.1 給出 ξ ∈ ⟦{H}⟧_E（一個 epoch 份量的已 accumulate work-package hash），eq. 7.4 / 12.25 給出 θ ∈ ⟦(N_S, H)⟧ 亦即本區塊的 accumulation output log。0.7.2 的 ready queue 符號是 ϑ（團隊 Go 欄位 `Vartheta`、state key C(14)），0.8.0 改成 ω（GP 與 0.8.0 release notes 都沒有說明改名理由，別在口試時把「為了避開 ϑ/θ 混淆」講成 GP 的說法）；state key 不變：C(14)=ω、C(15)=ξ、C(16)=θ。說 ω 是 output log、或說 ω 取代 ξ、或說 ω 是新增的 deferred-transfer 佇列都與 preamble 及 §4.2 的 σ 組成不符——deferred transfers 從不進 σ，它們只在 Δ+ 的 recursion 內部傳遞，區塊結束就消失（eq. 12.14 的 X ≡ (s, d, a, m, g) 只是 Ψ_A 的輸入型別，不是 σ 的分量，所以拿它當 ω 的型別是雙重錯誤）。同理，per-service gas usage u 也進不了 σ：它是 eq. 12.17 的回傳分量之一，餵完 eq. 12.28 的 G(s) 就消失，θ 裝的是 (service, commitment) 對而非 (service, gas)。最後，ξ 在 0.8.0 完全沒有改名或改義，「只要把 ξ 退休掉」的遷移計畫會把 accumulated 歷史整個弄丟。","trap":"面試常考：0.7.2→0.8.0 ready queue 是 ϑ→ω 的更名，state key C(14) 與型別結構都沒動；同章的 W!/W_Q/W* 也一併改成 R!/R^Q/R*；別把 ω 和 θ（output log）搞混。"},{"id":"c3-ch12-operand-tuple-fields","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.13 (U), 12.14 (X), 12.23 (Δ1)","difficulty":1,"kind":"concept","tags":["accumulation","operands","work-digest"],"stem":"Δ1 builds i^U as one operand tuple per work-digest of service s, taken from the round's reports in order. Two of s's digests sit in different reports r₁ and r₂. Which description of what an operand tuple carries is right for GP 0.8.0?","options":["The set is U (and deferred transfers are X, Ψ_A taking ⟦U ∪ X⟧). Each tuple takes y, g and l from the digest and, from its report, the core index and the refinement-context anchor in place of the package hash and segment root, so that accumulate can re-verify availability; digests whose l falls in the work-error set E are dropped before i^U is assembled, so the two tuples survive only if both refined successfully","The set is U (and deferred transfers are X, Ψ_A taking ⟦U ∪ X⟧). One operand tuple is built per report rather than per digest: its l field holds the concatenation of that report's digest results and its g field their summed gas-limits, with p, e, a and t lifted from the report as usual, and the service demultiplexes the results by payload hash — so s receives one tuple here, not two","The set is U (and deferred transfers are X, Ψ_A taking ⟦U ∪ X⟧). An operand tuple is the work-digest verbatim, so besides y, g and l it also carries c the code hash, d_u the gas actually used during refine, and the import / extrinsic / export counts that feed the core statistics; nothing is lifted in from the enclosing report, so the two tuples differ only in their payload hashes","The set is U (and deferred transfers are X, Ψ_A taking ⟦U ∪ X⟧). Each tuple mixes digest-level fields — y payload hash, g accumulate gas-limit, l the result, which is a blob or a member of the work-error set E — with fields lifted from its own report: p = (r_s)_p package hash, e = (r_s)_e segment root, a = r_a authorizer hash and t = r_t authorizer trace; so the two tuples differ in their report-level fields"],"answer":3,"explanation":"eq. 12.13：U ≡ (p ∈ H, e ∈ H, a ∈ H, y ∈ H, g ∈ N_G, t ∈ B, l ∈ B ∪ E)，eq. 12.14：X ≡ (s, d, a, m, g)，兩者的聯集就是 Ψ_A 的第五個參數（eq. B.9）。eq. 12.23 明白寫出每個 tuple 的來源：l ← d_l、g ← d_g、y ← d_y 來自 work-digest；t ← r_t、e ← (r_s)_e、p ← (r_s)_p、a ← r_a 來自那個 digest 所屬的 report，所以同一個 service 在不同 report 裡的兩個 digest，report-level 欄位不同。把 operand 說成 work-digest 原封不動是錯的：code hash c、refine 實際用掉的 gas、import/extrinsic/export 計數都只留在 digest 裡（後四項連同 d_u 餵 §13 的 core statistics，見 statistics.tex 的 d_u/d_i/d_x/d_z/d_e；code hash c 則是給 §11.4 的 d_c = δ[d_s]_c 檢查用），不會進 accumulate。「一個 report 一個 operand」與 eq. 12.23 的 d ↕ r_d 迭代直接矛盾——同一個 service 在該 round 有幾個 digest 就有幾個 operand。失敗結果也不會被丟掉：l 的型別寫成 B ∪ E，就是為了讓 service 自己處理 ∞、☇、BAD、BIG 等錯誤，GP 沒有任何「把 work-error digest 濾掉」的步驟。core index 與 refinement context 同樣不在 eq. 12.13 的七個欄位裡：availability 早在 §11 就驗完了，accumulate 沒有再驗一次的資料也沒有這個職責；而說「report-level 欄位完全不併入」則與 eq. 12.23 的 t ← r_t、e ← (r_s)_e、p ← (r_s)_p、a ← r_a 四行直接衝突。","trap":"口訣：operand = 「digest 三件（y, g, l）+ report 四件（p, e, a, t）」；refine 用掉多少 gas 不在裡面。"},{"id":"c3-ch12-E-removes-entries-too","ch":"12","section":"12.1 History and Queuing","gpRef":"eq. 12.7 (E), 12.8 (Q), 12.12, 12.33 (ω′)","difficulty":2,"kind":"rationale","tags":["accumulation","dependencies","queue"],"stem":"The queue-editing function E(r, x) does two jobs: it strips dependencies that appear in x, and it also discards whole entries. A teammate implements only the first job. What actually goes wrong?","options":["Only ω′ is affected — both the i = 0 case E(R^Q, ξ′[E−1]) and the i ≥ τ′ − τ case E(ω↺[m−i], ξ′[E−1]) would keep reports that were just accumulated, so the ready queue grows without bound until the epoch-long shift drops the stale entries. Q itself stays safe, because each recursion is fed a strictly shorter sequence once its dependency sets have been stripped","Nothing breaks. Q still terminates because its recursion is bounded by the epoch length E, and the §11.4 contextual check rejects any incoming report whose package hash is already in ξ, so an entry sitting in ω can never be accumulated a second time either; discarding whole entries is a pure optimisation that keeps ω small","Q stops terminating — E(r, P(g)) hands back the same entries with still-empty dependency sets, so the next recursion picks the identical g forever — and at the block boundary ω′ (both the i = 0 case E(R^Q, ξ′[E−1]) and the i ≥ τ′ − τ case E(ω↺[m−i], ξ′[E−1])) keeps reports that were just accumulated, so they would be accumulated again in a later block","The dependency-stripping job becomes redundant instead: once entries are never removed, a report can only ever be blocked by another report sitting in the same queue, so every dependency E would have stripped belongs to an entry E would also have deleted. Q therefore still terminates and ω′ still drains, just more slowly — one epoch-long shift at a time rather than one accumulation round at a time"],"answer":2,"explanation":"eq. 12.7 的 E 同時做兩件事：「(r, x) ↦ [(r, d ∖ x) | (r, d) ↕ r, (r_s)_p ∉ x]」——後半的過濾條件(r_s)_p ∉ x 才是把「自己已經被 accumulate」的項目整筆刪掉的那一半。少了它，eq. 12.8 的 Q(r) = g ⌢ Q(E(r, P(g))) 會無限遞迴，因為 g 裡的項目依然留在 E(r, P(g)) 中且 dependency 集合仍為空，下一輪算出來的 g 完全相同。同樣地 eq. 12.12 的 q = E(… ⌢ R^Q, P(R!)) 會讓同時出現在 R! 與 ready queue 的 report 在同一個區塊被 accumulate 兩次，而 eq. 12.33 三個 case 中的兩個（i = 0 與 i ≥ τ′ − τ）靠 E(·, ξ′[E−1]) 清掉本區塊已完成的項目（中間的 1 ≤ i < τ′ − τ 是直接清成 ⟦⟧，不套用 E）。說「Q 反正拿到更短的序列」是錯的——沒有刪除就不會變短。搬出 §11.4 的反重複檢查也不對：那條規則管的是 E_G 裡新進來的 guarantee（比對 β_H、ξ、ω、ρ），管不到早就躺在 ω 裡的項目；Q 的遞迴也沒有任何 epoch 長度的界——eq. 12.8 唯一的 base case 是 g = ⟦⟧，只有「這一輪挑不出空 dependency 的項目」才會停。至於「相依只會指向同一個佇列裡的 report」也不成立：dependency 是 work-package hash，被依賴的那份可能走 R!（本塊直接 accumulate、從未進過 ω），也可能是前幾個區塊就完成而只留在 ξ 裡的——這兩種情況剪依賴與刪項目作用在不同的項目上，兩件事並不互相涵蓋。","trap":"E 是「刪項目 + 剪依賴」兩件事；只做剪依賴，Q 就不會收斂。"},{"id":"c3-ch12-starved-dependency-fate","ch":"12","section":"12.1 History and Queuing","gpRef":"eq. 12.8 (Q), 12.31–12.33; §12.1","difficulty":2,"kind":"concept","tags":["accumulation","dependencies","ready-queue"],"stem":"A report w is sitting in ω with one outstanding dependency p, and package p is never accumulated — the report carrying p was guaranteed a few blocks ago but timed out on its core and never became available. Trace w's fate under GP 0.8.0.","options":["Q never emits it, and the block that made w available is invalid: §12.1 says accumulation is cancelled entirely in the case of an invalid dependency, and cancellation is signalled by rejecting the block, so a report that times out on its core retroactively invalidates whichever later block first queued the report that depended on it","Q never emits it, because its dependency set is never emptied; it is then dropped at the very next block, because E(·, ξ′[E−1]) removes any entry still carrying a dependency that is absent from ξ — which is exactly how the GP cancels a report with an unsatisfiable dependency","Q never emits it, because its dependency set is never emptied; each block it is simply carried forward by the i ≥ τ′ − τ case ω′↺[m−i] = E(ω↺[m−i], ξ′[E−1]), and it vanishes at most one epoch later when the slot index wraps round and the i = 0 case overwrites that very slot with the new block's R^Q","Q holds it back only for a while: after E = 600 slots the dependency is deemed expired, the i ≥ τ′ − τ case stops re-applying E to that slot, and Q then treats w's dependency set as empty and accumulates it with whatever operands it has — so the work is delayed by at most one epoch but never silently lost"],"answer":2,"explanation":"eq. 12.8 的 Q 只挑 dependency 集合為空的項目（g = [r | (r, ∅) ↕ r]），w 永遠不會被挑中。eq. 12.33 的三個 case 決定它的壽命：i = 0 用本區塊的 R^Q 覆寫目前 slot、1 ≤ i < τ′ − τ 把跳過的 slot 清成 []、i ≥ τ′ − τ 則保留舊內容但套用 E(·, ξ′[E−1])。由於索引是 cyclic 的 ω′↺[m − i]，w 所在的 slot 在最多 E = 600 個 slot 後就會輪到 i = 0 被整個覆寫，這正好呼應 §12.1 的敘述「Each of these were made available at most one epoch ago」。GP 說的 cancelled entirely 指的是這種靜默淘汰，不是讓區塊無效——§12.1 沒有任何條款把 dependency 問題升級成區塊無效（§12 另有區塊有效性條件——12.18 底下 n/m 的索引衝突、以及 eq. 12.35–12.36 對 E_P 的要求——但與 dependency 無關）。「E = 600 之後視為到期照樣 accumulate」是憑空發明的規則；「E 會刪掉帶有不在 ξ 的 dependency 的項目」把 E 的語意反了：E 的第二個參數是「已完成」的 hash 集合，它只會刪掉「自己的 package hash 出現在該集合裡」的項目，永遠不會因為「某個 dependency 不在 ξ 裡」而刪掉任何東西——真要那樣做，剛進佇列、依賴尚未完成的正常項目第一時間就會被清光。把它升級成區塊無效也沒有依據：§12.1 的 cancelled entirely 指的是這份 report 不會被 accumulate，而 guarantor 在 core 上逾時本來就是 §11 允許的正常結果，不可能反過來讓後面某個區塊失效。","trap":"ready queue 的淘汰不是超時計時器，而是 cyclic buffer 被同一個 slot index 繞回來覆寫。"},{"id":"c3-ch12-gas-floor-vs-ceiling","ch":"12","section":"12.2 Execution","gpRef":"§11.4 (report gas checks); eq. 12.23 (Δ1 g), 12.24 (block g); §9.1","difficulty":2,"kind":"concept","tags":["accumulation","gas","service-accounts"],"stem":"G_A = 10,000,000 and G_T = 3,500,000,000, while every service account carries a_g and a_m. Which statement correctly places each accumulate-gas limit — the ceilings and the per-service floors?","options":["Per report, §11.4 requires Σ over its digests of d_g ≤ G_A; per service, G_A is additionally a per-block cap enforced inside Δ1, which is why eq. 12.23 clamps that service's g at G_A instead of summing its sources; and a_g is a refund floor rather than a minimum — whatever a service leaves unspent below a_g is credited back to its balance at the end of Δ+, with a_m playing the same role for deferred transfers","Per report, §11.4 requires Σ over its digests of d_g ≤ G_A and every digest's d_g ≥ δ[d_s]_g (the destination service's a_g), both checked at guarantee time against the prior δ; per block, eq. 12.24 sets Δ+'s budget to g = max(G_T, G_A·C + Σ values(χ_Z)); and the `transfer` host call refuses with LOW unless the transfer's gas l ≥ δ[d]_m, so a deferred transfer also arrives with enough gas for the recipient's Accumulate","Both ceilings are enforced inside Δ+ at accumulation time rather than at guarantee time: eq. 12.24's budget covers the whole block and §11.4's per-report sum is re-checked there against the posterior δ, so a service whose a_g exceeds G_A can never be accumulated — which is why a_g ≤ G_A is maintained as a state invariant by the `new` host call, and a_m is bounded against G_T the same way","Per report, §11.4 requires Σ over its digests of d_g ≤ G_T, G_T being the figure that bounds any single report; per block, eq. 12.24 builds Δ+'s budget out of G_A, the whole-block ceiling, which is why G_T is the larger constant of the two; and the two service-level floors run the other way round — a_g is the minimum gas per deferred transfer and a_m the minimum per work-item"],"answer":1,"explanation":"三個層級要分清楚。(1) Report 層：§11.4 的條件是 ∀w ∈ I: Σ_{d ∈ w_d}(d_g) ≤ G_A ∧ ∀d ∈ w_d: d_g ≥ δ[d_s]_g，是在 guarantee 進來時用 prior δ 檢查，跟 §12 無關。(2) Block 層：eq. 12.24 的 g = max(G_T, G_A·C + Σ_{x ∈ values(χ_Z)}(x))，definitions.tex 也說 G_T 「should be no smaller than G_A·C + Σ」。(3) Service 層的兩個下限來自 §9.1：a_g 是「每個 work-item」執行 Accumulate 所需的最低 gas，a_m 是「每筆 deferred transfer」所需的最低 gas，後者由 `transfer` host call 以 LOW 錯誤把關。把 G_A 說成 Δ1 內的 per-service 上限、把 a_g 說成退款門檻都不存在於 GP；Δ1 的 g 是加總（eq. 12.23）而不是上限——它把 free-accumulation 額度、該 service 收到的 transfer gas 與它所有 digest 的 d_g 相加，沒有任何 clamp。把 a_g 說成「用不完就退款」同樣不存在於 GP：§9.1 的 a_g 是**准入下限**，沒有達到就根本不該被 guarantee，不是事後結算的回沖；`new` host call 也沒有維護 a_g ≤ G_A 這種不變量。§11.4 的兩條 gas 條件是 guarantee 時對 prior δ 檢查的，Δ+ 不會再驗一次（真要重驗，posterior δ 裡的 a_g 可能已被本塊改過，反而會讓合法區塊被拒）。把 a_g 與 a_m 對調、或把 G_A 說成整塊上限、G_T 說成單一 report 上限，數量級也剛好反了：G_T 比 G_A 大 350 倍，當成「單一 report 上限」會讓一份 report 就能吃掉整塊預算。","trap":"上限往下走（block g → report G_A），下限往上走（a_g / a_m → 呼叫方必須配足）；別把兩個方向搞反。"},{"id":"c3-ch12-theta-from-yield","ch":"12","section":"12.3 Final State Integration","gpRef":"eq. 12.18 (b), 12.25 (θ′); eq. 7.7 (β′_B)","difficulty":2,"kind":"concept","tags":["accumulation","output-log","beefy"],"stem":"In one block: service 5 accumulates and calls `yield` with a 32-octet hash; service 6 accumulates and burns gas but never calls `yield`; service 9 has no work-digest at all and is reached only by a deferred transfer, and it calls `yield`. What ends up in θ′, and what consumes it?","options":["b = {(s, y) | s ∈ s, y = Δ(s)_y, y ≠ ∅}, so this block contributes exactly the pairs for services 5 and 9; but θ′ is the append-only log of every accumulation output since genesis, so those two pairs are merely its tail, and the belt β_B is a cache of the Merkle root taken over that whole log","b = {(s, y) | s ∈ s, y = Δ(s)_y, y ≠ ∅}, but only services holding at least one work-digest in R*[..n] are members of s, so θ′ carries the pair for service 5 alone — service 9 is excluded even though it yielded, because a service reached solely by a deferred transfer can never commit an accumulation output. θ′ is replaced wholesale each block and is what β′_B appends to","θ′ holds one entry for every service in Δ*'s service set s, with the zero hash standing in for services that did not yield, so θ′ carries pairs for services 5, 6 and 9 alike and |θ′| = |s|, which is what lets downstream verifiers index it by position. It is a state item of its own, replaced wholesale each block, and it is what β′_B appends to","b = {(s, y) | s ∈ s, y = Δ(s)_y, y ≠ ∅}, so θ′ carries exactly the pairs for services 5 and 9 — service 6 shows up in u and in the accumulation statistics S but not here. θ′ is a state item of its own, replaced wholesale each block, and it is the input to β′_B = A(β_B, M_B(s, H_K), H_K) whose super-peak is stored in the new β_H entry"],"answer":3,"explanation":"eq. 12.18 定義 b = {(s, b) | s ∈ s, b = Δ(s)_y, b ≠ ∅}，條件 b ≠ ∅ 表示「沒呼叫 yield 就不入列」，所以 service 6 只會出現在 u（gas 使用量）與 eq. 12.28 的 S，不會出現在 θ′。Δ* 的 service 集合 s = {d_s | r ∈ r, d ∈ r_d} ∪ K(f) ∪ {t_d | t ∈ t}，transfer 的收款方本來就在裡面，因此 service 9 完全有資格 yield。eq. 12.25：θ′ ≡ ⟦(s, h) ∈ b⟧，它是 σ 裡獨立的一項（state key C(16)），每個區塊整批換掉，不是自創世以來的累積；真正累積的是 §7 的 β_B（eq. 7.7 用 Keccak 做 M_B 與 MMB append），其 super-peak 才寫進 β_H；θ′ 與 β_B 的方向剛好相反——θ′ 每塊整批換掉，β_B 才是累積的那一個，說 β_B 只是 θ′ 的Merkle root 快取正好把兩者顛倒。用零 hash 補齊未 yield 的服務會讓 |θ′| = |s|，直接違反 eq. 12.18 的 b ≠ ∅ 過濾條件（也讓「零 hash」這個合法的 yield 值無從分辨）；宣稱只有帶 work-digest 的服務能貢獻，則與同一條式子裡 s = {d_s | r ∈ r, d ∈ r_d} ∪ K(f) ∪ {t_d | t ∈ t} 的三段聯集牴觸——純收款服務與 always-accumulate 服務同樣會被 Δ1 呼叫，同樣能 yield。","trap":"沒 yield 就沒 commitment：θ′ 的長度由 yield 次數決定，不由 |s| 決定。"},{"id":"c3-ch12-provide-two-places","ch":"12","section":"12.2 Execution / 12.4 Preimage Integration","gpRef":"eq. 12.18 (d′), 12.20 (I), 12.21 (Y), 12.37","difficulty":2,"kind":"concept","tags":["accumulation","preimages","provide"],"stem":"The preimage-integration function I is applied twice during a block's transition. Where are the two applications, and what does its Y predicate silently discard?","options":["Only once, at the very end as δ′ = I(δ‡, E_P): the `provide` host call writes straight into the service's a_p and a_l during accumulation, so Δ* has nothing left to integrate. Y(d, s, i) is ⊥ unless s ∈ K(d) and d[s]_l[(H(i), |i|)] = [], so a blob aimed at a service ejected in the same round is dropped without prejudice — but that can only ever bite the extrinsic, never a `provide`","Once inside Δ1 for each accumulating service — so each service folds in its own provisions before Δ* merges the account dictionaries — and once at the very end as δ′ = I(δ‡, E_P). Y(d, s, i) accepts a request slot of the form [] or [x, y], i.e. solicited, or previously available and then forgotten, which is what lets the same preimage be provided twice over a service's lifetime","Once inside Δ* as e_d′ = I((e_d ∪ n) ∖ m, ⋃_{s ∈ s} Δ(s)_p) — folding in the blobs offered by the `provide` host call only after newly created and removed services have been merged — and once at the very end as δ′ = I(δ‡, E_P). Y(d, s, i) is ⊥ unless s ∈ K(d) and d[s]_l[(H(i), |i|)] = [], so a blob aimed at a service ejected in the same round, or at a request that is not merely solicited, is dropped without prejudice","Twice — once inside Δ* and once at the very end — but both applications take E_P as their second argument, the blobs offered by `provide` having been merged into E_P before Δ* runs. Y(d, s, i) additionally requires the blob to be under W_C = 4,000,000 octets and the service to hold the storage deposit for it, and a failure of either condition makes the block invalid rather than dropping the blob"],"answer":2,"explanation":"eq. 12.18 的 e_d′ = I((e_d ∪ n) ∖ m, ⋃_{s ∈ s} Δ(s)_p)：`provide` host call 產生的 provisions Δ(s)_p 是在 Δ* 這一層、而且是在新建服務 n 併入、被刪服務 m 移除「之後」才整合，所以同一輪被 eject 掉的服務收不到 blob。eq. 12.37 的 δ′ = I(δ‡, E_P) 是第二次，處理 preimage extrinsic。eq. 12.21 的 Y(d, s, i) 只在 s ∈ K(d) 且 d[s]_l[(H(i), |i|)] = ⟦⟧ 時為真，GP 原文也明說「Preimage provisions into services which no longer exist or whose relevant request is dropped are disregarded」——是靜默略過，不是讓區塊無效。說 `provide` 直接寫進 a_p 而不需要 I，就漏掉了 Δ* 這一層的合流；說兩次都吃 E_P、或把 W_C 與 storage deposit 塞進 Y，都不是 eq. 12.20–12.21 的內容——Y 只有 s ∈ K(d) 與 d[s]_l[(H(i), |i|)] = ⟦⟧ 兩個條件，而且不合格時是「disregarded」而非讓區塊無效；把 [x, y] 也算 providable 更是直接違反 Y 的等號條件（[x, y] 代表「曾經 available、後來被 forget」，那條 request 已經有歷史，不是還在等人餵的空 slot）。說第一次是在 Δ1 裡各自整合也不對：eq. 12.23 的 Δ1 只把 provisions 當**輸出**（Δ(s)_p）回傳，真正的合流一定要等到 Δ* 這一層，否則 n（新建）與 m（刪除）還沒算出來，就無法判斷目標 service 是否還存在。","trap":"I 出現兩次：Δ* 裡收 `provide`、區塊尾端收 E_P；兩次的丟棄都是「without prejudice」，不會讓區塊無效。"},{"id":"c3-ch12-code-accumulation-statistics","ch":"12","section":"12.3 Final State Integration","gpRef":"eq. 12.27–12.28; eq. 12.17 (Δ+ output)","difficulty":2,"kind":"code","tags":["accumulation","statistics","code","delta-0.8.0"],"stem":"This is the team's GP 0.7.2 accumulation-statistics builder S. Which gap against GP 0.8.0 must be closed?","code":{"lang":"go","caption":"internal/accumulation/deferred_transfers.go (calculateAccumulationStatistics), 0.7.2 main","src":"// (12.28–12.29) S ≡ {(s ↦ (G(s), N(s))) | G(s)+N(s) ≠ 0}\nfunc calculateAccumulationStatistics(serviceGasUsedList types.ServiceGasUsedList,\n\tn types.U64) types.AccumulationStatistics {\n\tG := map[types.ServiceID]types.Gas{} // G(s)\n\tfor _, serviceGasUsed := range serviceGasUsedList {\n\t\tG[serviceGasUsed.ServiceID] += serviceGasUsed.Gas\n\t}\n\n\tS := types.AccumulationStatistics{}\n\tfor s, Gs := range G {\n\t\tNs := types.U64(len(getWorkResultByService(s, n)))\n\n\t\tif types.U64(Gs)+Ns == 0 {\n\t\t\tcontinue // skip, N(S) = []\n\t\t}\n\n\t\tS[s] = types.GasAndNumAccumulatedReports{\n\t\t\tGas:                   Gs,\n\t\t\tNumAccumulatedReports: Ns,\n\t\t}\n\t}\n\treturn S\n}"},"options":["N(s) must count whole work-*reports*, not digests: eq. 12.28 iterates r ↕ R*[..n] and counts each report once for the service that owns it, whereas this code counts one entry per matching digest, so a report carrying two digests for the same service is double-counted","0.8.0 makes S ∈ ⟨N_S → (N, N, N_G)⟩ a three-tuple S(s) = (N(s), T(s), G(s)); the missing middle element T(s) counts the processed deferred transfers whose destination is s, which forces Δ+ to return a fifth component — the processed-transfer sequence t ⌢ t† — and the inclusion filter becomes S(s) ≠ (0, 0, 0) rather than a sum test","G(s) must be the gas *allotted* — Σ d_g over the service's digests, the very figure §11.4 checks against G_A — rather than the gas actually used, otherwise a service that runs out of gas is under-charged in the statistics that feed π_S; the two-element shape and the sum-based inclusion filter are both already right for 0.8.0","S must carry an entry for every service in δ, with the all-zero triple for untouched services, so that the dictionary's key set is stable from block to block and π_S's serialization keeps a fixed length; the shape does become a triple in 0.8.0, but the new element is the transfer count sitting *last*, and it is Δ*, not Δ+, that returns the processed-transfer sequence it is built from"],"answer":1,"explanation":"GP 0.8.0 eq. 12.27 寫的是 S ∈ ⟨N_S → (N, N, N_G)⟩，eq. 12.28 是 S ≡ {(s ↦ S(s)) | S(s) ≠ (0, 0, 0)}，其中 S(s) ≡ (N(s), T(s), G(s))，T(s) ≡ |[t | t ↕ t, t_d = s]| 就是「送到 s 的已處理 deferred transfer 筆數」（GP PR #502 “Add back processed transfer count to service statistics”）。要算得出 T(s)，eq. 12.17 的 Δ+ 必須多回傳一個 processed-transfer 序列（回傳值是 ⟨i + j, e′, b* ∪ b, u* ⌢ u, t ⌢ t†⟩），而這份 0.7.2 程式的 OuterAccumulationOutput 只有四個欄位、型別也只是 (Gas, NumAccumulatedReports) 兩元組，篩選條件寫成 Gs + Ns == 0 也不等價於三元組全零。另外三個說法都站不住腳：eq. 12.28 的 N(s) 明確是 d ↕ r_d 逐個 digest 數，不是逐 report；G(s) ≡ Σ_{(s, u) ∈ u}(u) 就是實際用掉的 gas；而 S 只收非零項，正是為了讓 δ‡ 只對真的被 accumulate 的服務蓋上 a_a = τ′——δ‡ 的規則是「s ∈ K(S) 才把 a_a 改成 τ′」，若補上全零項目就會蓋滿整個 δ，而且 S 是 π_S 的來源之一（eq. 13.14 的 K(S)），這麼做等於讓每個 service 每塊都出現在統計裡。另外 T(s) 在三元組裡是**中間**那一項（N, T, G），而處理過的 transfer 序列 t ⌢ t† 是 eq. 12.17 的 Δ+ 回傳的第五個分量——eq. 12.18 的 Δ* 只回傳四個分量（e′, t′, b, u），拿它當來源會少一層遞迴累積。","trap":"0.8.0 的 accumulation statistics 是三元組 (N, T, G)；漏掉 T 會連帶讓 Δ+ 的回傳值少一個分量。"},{"id":"c3-ch12-why-R-star-is-a-sequence","ch":"12","section":"12.1 History and Queuing","gpRef":"eq. 11.17 (R), 12.4, 12.11 (R*), 12.17, 12.31","difficulty":2,"kind":"rationale","tags":["accumulation","determinism","availability"],"stem":"R, R!, R^Q and R* are all sequences rather than sets, even though only membership decides which reports are eligible. Why does the ordering matter for consensus, and where is it fixed?","options":["Because Δ+ accumulates only the gas-fitting prefix R*[..i] and then records ξ′[E−1] = P(R*[..n]): a different ordering yields a different prefix and hence a different posterior state. The order is pinned right back at eq. 11.17, where R is built by walking cores in ascending core index over ρ† and keeping those with more than 2/3·|κ| assurances; R! preserves that order and Q appends the queued reports in dependency-resolution rounds","Ordering only affects the accumulation statistics S and therefore π_S, because eq. 12.28's N(s) walks R*[..n] in order; the service state δ† is order-independent, since each service's Δ1 is a pure function of its own operands and its own prior account, and ξ′[E−1] = P(R*[..n]) is a set, so whatever order its members were produced in is lost the moment it is written","It does not matter for the posterior state. Δ* accumulates services in parallel, and any permutation of R* selects the same gas-fitting prefix anyway, because eq. 12.17 picks the maximal i by a sum and addition is commutative; that is exactly why b is a set while u is merely a convenient sequence, and why the GP bothers to fix an order only at eq. 12.11, purely so the prose can talk about R* concretely","Because Δ+ accumulates only the gas-fitting prefix R*[..i], so when gas runs short the ordering decides what gets dropped. The order is pinned at eq. 11.17, where R is built by ranking cores on how many assurances each collected, most-assured first, so that the best-attested reports are the ones accumulated and the marginal ones are deferred into ω"],"answer":0,"explanation":"eq. 12.17 選的是「最大的前綴 i」使得 Σ_{r ∈ r[..i], d ∈ r_d}(d_g) + Σ_{t ∈ t}(t_g) + Σ_{x ∈ values(f)}(x) ≤ g，而 eq. 12.31 又用 ξ′[E−1] = P(R*[..n]) 把「本區塊做完了哪些 package」寫進 state。這兩處都只看前綴，所以順序一旦不同，被 accumulate 的集合、ξ′、δ† 乃至 state root 全都不同。順序的源頭在 eq. 11.17：R ≡ [(ρ†[c]_g)_w | c ↕ N_C, Σ_{a ∈ E_A} a_f[c] > 2/3·|κ|]，是以 core index 遞增走訪，接著 eq. 12.4 的 R! 沿用該順序、eq. 12.11 的 R* = R! ⌢ Q(q) 再把佇列項目依相依解開的輪次接上。說順序無關是把「Δ* 內部服務間可平行」誤讀成「報告間可任意重排」——加法確實可交換，但 eq. 12.17 選的是**前綴**，重排會換掉「哪幾份 report 落在前綴裡」，被選中的集合一變，δ† 與 ξ′ 就跟著變；說只影響統計則忽略了同一件事，而且 ξ′[E−1] 雖然是集合，決定它**內容**的仍是前綴長度 n；而依 assurance 數排序在 GP 裡完全不存在——eq. 11.17 走的是 c ↕ N_C（core index 遞增），超過 2/3·|κ| 只是一個布林門檻，跨過就入列、沒跨過就不入列，沒有任何名次可言。","trap":"「哪些會被 accumulate」由 gas 前綴決定，所以序列順序就是共識的一部分；core index 遞增是唯一的來源。"},{"id":"c3-ch12-accseq-n-with-transfers","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.17 (Δ+), 12.24, 12.28","difficulty":3,"kind":"delta","tags":["accumulation","transfers","gas","delta-0.8.0"],"stem":"Mid-recursion inside Δ+, the remaining report sequence is empty but the previous Δ* round emitted three deferred transfers t, and the free-accumulation map handed to this call is ∅. Does Δ+ do any more work, and what does it hand back in GP 0.8.0?","options":["Yes — the test n = i + |t| + |f| = 3 ≠ 0 fires — but the round is a no-op: Δ*'s service set is s = {d_s | r ∈ r, d ∈ r_d} ∪ K(f) alone, so with r[..i] empty and f = ∅ it is empty too, the three transfers are discarded, and only the balances already credited by the earlier `transfer` host calls survive into δ†; u and b therefore come back empty and the three destinations contribute nothing to eq. 12.28's T(s)","No. The GP's termination test is the prefix length i, and with r = ⟦⟧ the maximal gas-fitting prefix is i = 0, so the base case ⟨0, e, ∅, ⟦⟧, ⟦⟧⟩ fires and Δ* is never invoked; the three pending transfers are carried into the next block through ω, which is precisely why ω is typed to hold them alongside the deferred reports, and their gas is re-charged against that block's budget g rather than this one's","Yes. The GP's termination test is n = i + |t| + |f| = 0 + 3 + 0 = 3 ≠ 0, so Δ* is still invoked; its service set s = {d_s | r ∈ r, d ∈ r_d} ∪ K(f) ∪ {t_d | t ∈ t} reduces to the three destinations, which are accumulated on the transfers alone. The result is ⟨i + j, e′, b* ∪ b, u* ⌢ u, t ⌢ t†⟩, whose fifth component — the processed transfers — is what T(s) in eq. 12.28 counts","Yes — the test n = i + |t| + |f| = 3 ≠ 0 fires and the three destinations are accumulated on the transfers alone — but Δ+ still returns the four-tuple ⟨n, e′, b, u⟩ exactly as in 0.7.2; the processed transfers that T(s) needs are recovered afterwards by diffing δ† against δ for balance movements, eq. 12.28 being defined over that reconstruction rather than over anything Δ+ hands back"],"answer":2,"explanation":"eq. 12.17 的終止條件不是「還有沒有 report」，而是 n = i + |t| + |f|：只要還有待處理的 deferred transfer 或還有 free-accumulation 服務，Δ+ 就會再跑一輪 Δ*。eq. 12.18 的服務集合 s 明確包含 {t_d | t ∈ t}，所以純粹被轉帳打到的服務也會被 accumulate（Δ1 的 g = U(f[s], 0) + Σ_{t_d = s}(t_g) + Σ digests，此時只剩轉帳那一項），這正是 0.7.1 之後把 on-transfer 併進 accumulate 的結果。GP 0.8.0 的 Δ+ 回傳五元組，最後一項 t ⌢ t† 是「本次遞迴實際處理掉的 transfer 序列」，eq. 12.28 的 T(s) 就靠它計數（對照 0.7.2 只回傳四元組，這是團隊必須補的差異）。說 i = 0 就走 base case，混淆了 i 與 n；說 transfers 會經由 ω 跨區塊保存也不對——ω 只裝 work-report，deferred transfer 不進 σ，區塊結束前一定要在 Δ+ 的遞迴裡消化完（eq. 12.3 的 ω ∈ ⟦⟦(ℝ, {H})⟧⟧_E 裝的是 report 與 hash 集合，型別上就放不下 transfer）。把 s 說成只有 {d_s} ∪ K(f) 則漏掉 eq. 12.18 明列的第三段 {t_d | t ∈ t}，那正是「只被轉帳打到的服務」進入 accumulate 的唯一途徑；而「事後 diff 餘額」也還原不出 T(s)——同一個 service 可能同時有 digest、有轉入、有轉出，餘額變化是淨額，數不出筆數。","trap":"Δ+ 的停機條件是 n = i + |t| + |f|；report 用完不代表結束，轉帳與 always-accumulate 也能把遞迴撐著。"},{"id":"c3-ch12-prior-privileged-index-reads","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.18 (Δ*), 12.19 (R)","difficulty":3,"kind":"concept","tags":["accumulation","privileges","prior-posterior"],"stem":"Inside Δ*, core c's posterior authorizer queue φ′[c] and the posterior staging keys ι′ are each lifted out of exactly one service's Δ1 output. Whose output, and selected by which version of χ?","options":["φ′[c] = R(φ[c], (e*_q)[c], ((Δ(χ_A[c])_e)_q)[c]) — it is merged across the manager and the prior assigner with R(o, a, b), exactly as χ′_A[c] is; and ι′ is taken from whichever service in s wrote it last when s is walked in ascending service index, so a higher-indexed service can overwrite the delegator's copy","φ′[c] = ((Δ(χ′_A[c])_e)_q)[c] and ι′ = (Δ(χ′_V)_e)_i — the *posterior* per-core assigner and the *posterior* delegator. A service granted the assign privilege during this very block can therefore immediately install the queue the block will use, and only that service's own copy of the component is read, core index by core index","φ′[c] = ((Δ(χ_A[c])_e)_q)[c] and ι′ = (Δ(χ_V)_e)_i — the *prior* per-core assigner and the *prior* delegator. Even when this same round rewrites χ′_A[c] or χ′_V, the queue and the keys still come from whoever held the privilege when the round began, and only that service's own copy of the component is read, core index by core index","φ′[c] = ((Δ(χ_M)_e)_q)[c] and ι′ = (Δ(χ_M)_e)_i — both are lifted out of the manager's output e* = Δ(χ_M)_e, because only the manager may alter any component of χ; the assigner and the delegator merely stage requests inside their own partial states, which the manager's Accumulate ratifies before Δ* merges them"],"answer":2,"explanation":"eq. 12.18 分得很細。**誰擁有特權**用 R 合併：∀c, e_a′[c] = R(e_a[c], (e*_a)[c], ((Δ(e_a[c])_e)_a)[c])，以及 e_v′、e_r′ 同理；而 e_m′ 與 e_z′ 直接取自 manager 的輸出 e* = Δ(m)_e，不經過 R。**特權作用的內容**則另外一條路：e_q′[c] = ((Δ(e_a[c])_e)_q)[c] 與 e_i′ = (Δ(e_v)_e)_i，括號裡的 e_a[c]、e_v 是 Δ* 的輸入、也就是 prior 的 χ_A[c] 與 χ_V。因此本區塊剛被指派為 assigner 的服務不能在同一個區塊就改 φ′[c]（要等下一塊）。另外 §8 的 α′ 之所以必須在 accumulation 之後才算，authorization.tex 給的理由是「Since α′ is dependent on φ′ … this step must be computed after accumulation, the stage in which φ′ is defined」——那是 α′ 讀 φ′ 造成的順序，與這條 prior/posterior 選擇規則無關。把兩者都說成 manager 的輸出，會漏掉 eq. 12.19 註解裡「This allows privileges to be `owned`」的整個設計；說用 posterior χ′ 會造成同區塊自我授權（GP 未載明這條規則的動機；0.8.0 另有 PR #519 把 bless 限縮給 manager，方向類似但機制不同）；說 φ′[c] 也用 R 合併則混淆了「誰有權」與「權力寫出來的值」：R 只出現在 e_a′、e_v′、e_r′ 這三行，φ′ 與 ι′ 是直接單點讀取，沒有仲裁也沒有「最後寫的人贏」——真讓 s 裡任何服務都能覆寫 ι′，等於任何一個被 accumulate 的服務都能改下一輪的 validator 金鑰。把兩者都掛在 manager 身上同樣不對：e* 只供出 e_m′ 與 e_z′（以及 R 的中間參數），χ 的其他分量各有各的擁有者，這正是 eq. 12.19 註解說的 privileges can be `owned`。","trap":"χ′ 用 R 合併，但 φ′[c] 與 ι′ 只讀 prior χ_A[c] / χ_V 那一個服務的輸出——同區塊拿到特權，下一區塊才生效。"},{"id":"c3-ch12-code-delta-star-map-order","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.18 (u, t′)","difficulty":3,"kind":"code","tags":["accumulation","determinism","transfers","code"],"stem":"In the team's Δ*, the service set s is a Go map and this loop collects u and t′ from the per-service results. Which GP 0.8.0 requirement does it violate, and what is the observable symptom?","code":{"lang":"go","caption":"internal/accumulation/accumulation.go (set_s + ParallelizedAccumulation result loop), condensed","src":"func set_s(r []types.WorkReport, f types.AlwaysAccumulateMap,\n\tt []types.DeferredTransfer) map[types.ServiceID]bool {\n\ts := make(map[types.ServiceID]bool, len(r)*2+len(f)+len(t))\n\tfor _, w := range r {\n\t\tfor _, r := range w.Results {\n\t\t\ts[r.ServiceID] = true // rd\n\t\t}\n\t}\n\tfor serviceID := range f { // K(f)\n\t\ts[serviceID] = true\n\t}\n\tfor _, deferredTransfer := range t {\n\t\ts[deferredTransfer.ReceiverID] = true // td\n\t}\n\treturn s\n}\n\n// ... later, in ParallelizedAccumulation:\n// Process results from each service accumulation\nfor service_id := range s {\n\tsingleOutput := cache[service_id]\n\t// u = [(s, ∆(s)u) S s <− s]\n\tu = append(u, types.ServiceGasUsed{ServiceID: service_id,\n\t\tGas: singleOutput.GasUsed})\n\t// t = [∆(s)t S s <− s]\n\ttPrime = append(tPrime, singleOutput.DeferredTransfers...)\n}"},"options":["Nothing consensus-relevant: eq. 12.18 writes t′ as a set, and u is only ever consumed by eq. 12.28's G(s), which sums per service, so both are order-independent. The flattened ⌢⌢t′ does reach the next Δ+ round in an arbitrary order, but eq. 12.23 re-sorts each destination's i^T by sender before Ψ_A sees it, so two nodes importing the same block still agree on the state root","The violation is in set_s rather than in the loop: only services carrying a work-digest may contribute to u and t′, so transfer destinations and always-accumulate services have to be filtered back out of s before this loop runs. The map iteration itself is harmless, because eq. 12.18 marks u and t′ with ∈ rather than ↕ and both are consumed order-insensitively","Eq. 12.18 writes u = ⟦(s, Δ(s)_u) | s ↕ s⟧ and t′ = ⟦Δ(s)_t | s ↕ s⟧ with the ordered-iteration marker, i.e. ascending service index, whereas Go randomises map iteration. The flattened ⌢⌢t′ therefore reaches the next Δ+ round permuted, so each destination's i^T — and hence Ψ_A's operand sequence, the balances it credits and the resulting state root — can differ between two nodes importing the very same block","Eq. 12.18's ↕ marker does demand a deterministic walk, but over *report* order — the order in which each service's first digest appears in r[..i] — so sorting by ascending service index would be exactly as wrong as the map order. The symptom is the same either way: the flattened ⌢⌢t′ reaches the next Δ+ round permuted and two nodes importing the same block disagree on the state root"],"answer":2,"explanation":"eq. 12.18 對這兩個輸出都用了有序迭代記號：u = ⟦(s, Δ(s)_u) | s ↕ s⟧、t′ = ⟦Δ(s)_t | s ↕ s⟧，而 §3 的 notation 說明 ↕ 代表依元素本身遞增排序，對 s ∈ N_S 就是 service index 由小到大。Go 的 `for k := range m` 是刻意隨機化的，於是 tPrime 的串接順序在每個節點都不同；由於 eq. 12.17 會把 t* 餵回下一輪，而 eq. 12.23 的 i^T = ⟦t | t ↕ t, t_d = s⟧ 直接沿用該序列，最後 Ψ_A 收到的 operand 序列與 `fetch` 讀出的內容就不同 —— 同一個區塊在不同節點算出不同 state root，典型症狀是 fuzzer / trace 測試偶發性不一致（團隊也用一個 `sort.Slice(iT, ...)` by SenderID 去掩蓋，但 sort.Slice 不穩定，同一 sender 的多筆轉帳仍可能被重排）。說 t′ 是集合是誤讀——GP 寫的是序列再 ⌢⌢；說要用 report 順序也沒有依據——§3.7.1 的 ↕ 是「依元素本身遞增」，s 的元素是 service index，所以正解就是 ascending service index，GP 沒有第二套排序規則；說「Δ1 會再按 sender 排一次」則與 eq. 12.23 的 i^T = ⟦t | t ↕ t, t_d = s⟧ 衝突——那個 ↕ 跑的是序列 t 本身，沿用傳進來的順序，不會另外重排；而 s 的定義本來就含 K(f) 與 {t_d}，把它們濾掉會讓 always-accumulate 服務與純收款服務完全不被 accumulate。","trap":"GP 的 ↕ 不是裝飾：任何從集合展開成序列的地方，Go map 迭代都是共識殺手。"},{"id":"c3-ch13-epoch-boundary-split","ch":"13","section":"13.1 Validator Activity","gpRef":"eq. 13.4–13.6","difficulty":3,"kind":"concept","tags":["statistics","epoch","rollover","prior-vs-posterior","delta-0.8.0"],"stem":"GP 0.8.0 §13.1 derives the validator activity records in three ordered steps — π_V†, then (π_V‡, π′_L), then π′_V — with e = ⌊τ/E⌋ and e′ = ⌊τ′/E⌋. Take the first block of a new epoch (so e′ ≠ e): its author is validator 7, its assurance extrinsic E_A carries assurances signed by validators 4 and 9, and its guarantee extrinsic E_G credits validator 22. Where do this block's own increments end up?","options":["Everything this block contributes lands in the freshly zeroed accumulator, because eq. 13.4 applies the assurance pass to π_V‡ rather than to π_V; validator 7's block/ticket/preimage counters and validator 22's guarantee credit therefore sit in the current-epoch record alongside validators 4 and 9's assurance steps, and the archive keeps the previous epoch's totals untouched.","Everything this block contributes lands in the last-epoch archive, because eq. 13.6 applies its five remaining counters to π_V† as well and it is the result of that whole pass which is moved across at the rollover; validator 7's block/ticket/preimage counters, validator 22's guarantee credit and validators 4 and 9's assurance steps therefore travel together into π′_L. The current-epoch record stays an all-zero sequence until the second block of the new epoch.","The two assurance increments land in the last-epoch archive, because they are added to the prior record first and it is that already-incremented record which is moved across at the rollover; validator 7's block/ticket/preimage counters and validator 22's guarantee credit start from the freshly zeroed accumulator and so land in the current-epoch record. One block is deliberately split across the two records.","The rollover is triggered by the header's epoch marker H_E rather than by comparing ⌊τ/E⌋ with ⌊τ′/E⌋, and when H_E ≠ ∅ both records are zeroed rather than one being overwritten by the other; validator 7's block/ticket/preimage counters, validator 22's guarantee credit and validators 4 and 9's assurance steps are therefore all first entries of the current-epoch record, and the archive contributes nothing to this block at all."],"answer":2,"explanation":"eq. 13.4 先做 π_V† ≡ π_V except ∀v ∈ N_{|κ|}：π_V†[v]_a = π_V[v]_a + (∃a ∈ E_A : a_v = v)——assurance 是加在 **prior** 的 π_V 上。eq. 13.5 之後才做 epoch rollover：(π_V‡, π′_L) = (π_V†, π_L) when e′ = e，otherwise ([(0, …), …], π_V†)，其中 e = ⌊τ/E⌋（prior τ）、e′ = ⌊τ′/E⌋（posterior τ′ = H_T）。所以邊界那一塊的 assurance 先進 π_V†，再整包被搬進 π′_L。eq. 13.6 才從已歸零的 π_V‡ 出發：b += (v = H_I)、t += |E_T|、p += |E_P|、d += Σ_{d ∈ E_P}|d|（都只給 author）、g += (κ′[v] ∈ G)，這些落在 π′_V。因此同一塊的六個 counter 被刻意拆到兩個 record：a 記在舊 epoch、其餘五個記在新 epoch。「整塊都進新累加器」正是 0.7.2 的作法（也是 statistics.go 目前的行為，PR #1034 才修）；它把 eq. 13.4 說成作用在 π_V‡ 上，但那條式子白紙黑字寫的是 π_V† ≡ π_V except …，起點是 **prior** 的 π_V，π_V‡ 要到 eq. 13.5 才存在。「整塊都進 π′_L」則反過來，忽略了 eq. 13.6 明寫 π′_V ≡ π_V‡ except …——五個 counter 的起點是 rollover **之後**的 π_V‡，不是 π_V†。拿 H_E 當判斷依據則要小心：eq. 6.28 的 H_E 恰好在 e′ > e 時非 ∅，觸發時機與 eq. 13.5 的 e′ ≠ e 其實重合，所以那個選項真正錯的是後半段——π_L 從來不會被歸零（eq. 13.5 的 otherwise 分支是把 π_V† 整包搬過去覆寫它），而且 assurance 早在 eq. 13.4 就併進 π_V† 了，不可能變成新 epoch record 的第一筆。（H_E 本身只帶 (η_0, η_1) 與 γ′_P 的金鑰序列，§13 從不讀它。）","trap":"口訣：assurance 在 rollover 之前，b/t/p/d/g 在 rollover 之後；epoch 邊界那一塊會被劈成兩半。"},{"id":"c3-ch13-guarantee-credit-set","ch":"13","section":"13.1 Validator Activity","gpRef":"eq. 13.6 (g counter); eq. 11.28 (reporters set G)","difficulty":2,"kind":"concept","tags":["statistics","guarantees","reporters","prior-vs-posterior"],"stem":"GP 0.8.0 updates the guarantee counter as π′_V[v]_g = π_V‡[v]_g + (κ′[v] ∈ G), where G is the reporters set of eq. 11.28. Suppose one block's E_G holds two guarantees: validator 12 signed a credential in both of them (one report under this rotation's assignment, one under the previous rotation's), validator 30 signed a credential in only one, and the block's author is validator 5. How does the g counter move?","options":["Validator 12 moves by 1, validator 30 by 1, the author not at all — the added term is a Boolean membership test of the validator's Ed25519 key against a set of keys, so two credentials in the same block still yield a single step, and the index v is resolved through the posterior active set.","Validator 12 moves by 1, validator 30 by 1, and the author additionally by 2 — the added term is a Boolean membership test, so each guarantor takes a single step, the author is separately credited one step per report the block carries, and the index v is resolved through the prior active set κ.","Validator 12 moves by 2, validator 30 by 1, the author not at all — the added term counts credential signatures rather than testing membership, so a validator that signs in two guarantees of the same block takes two steps, and the index v is resolved through the posterior active set.","Only the author moves, and by 2 — g records the reports the author brought on-chain, one step per report; the guarantors are credited through the assurance counter a instead, and because that counter is incremented against the prior record, their steps land in the archive whenever the block sits on an epoch boundary."],"answer":0,"explanation":"eq. 11.28 定義 reporters set：k ∈ G ⟺ ∃(r, t, a) ∈ E_G, ∃(v, s) ∈ a : k = (k_v)_e——G 是 **Ed25519 公鑰的集合**（k 取自本 rotation 或前一 rotation 的 guarantor assignment）。eq. 13.6 的增量 (κ′[v] ∈ G) 是一個 Boolean，依 §3.7.3「⊤ = 1、⊥ = 0」的隱含轉換，同一塊裡簽兩份 report 也只能 +1（實作上就是先把 G 建成 reportersSet，再對每個 validator 最多 +1）。這裡有一個 GP 自身的矛盾必須知道：§13.1 的欄位說明寫 「g: The number of reports guaranteed by the validator」，但依 eq. 13.6 的集合成員測試，g 每塊最多 +1，實際語意是「該 validator 在這一塊有沒有 guarantee 過 report」而不是 report 的筆數。考試以 eq. 13.6 為準，但要認得那句 prose——它正是「每簽一份 credential 就記一次、validator 12 因此 +2」那個干擾項的來源；團隊在 0.7.0 時期（#710/#711）採用的也正是這種 per-report 舊讀法（該 issue 的結論是 「each report counted once per validator」，方向與 0.8.0 的 eq. 13.6 相反，別把它當成 +1 的依據）。索引用的是 **posterior** 的 κ′（eq. 13.6 的 ∀v ∈ N_{|κ′|}），不是 prior 的 κ——注意 eq. 13.4 的 assurance 迴圈才是跑 N_{|κ|}，兩者刻意不同。author 在 §13 只拿 b、t、p、d 四個 counter（eq. 13.6 裡只有這四項帶 v = H_I 的條件），g 的增量整條式子裡沒有 author 的位置，所以「author 每帶進一份 report 就 +1」是憑空多出來的規則；把 guarantor 的功勞算進 a 也與 §13.1 的 counter 說明相反：a 明確是「availability assurances made by the validator」，且 eq. 13.4 的增量條件是 ∃a ∈ E_A : a_v = v，資料來源是 assurance extrinsic 而非 E_G——順帶一提，那條式子確實是加在 prior record 上（所以 epoch 邊界會落進 π′_L），但那是 assurance 的性質，不會因此讓 guarantor 改用 a 計分。","trap":"GP 字面寫 κ′[v] ∈ G，但 κ′[v] ∈ K 是四欄位金鑰 tuple 而 G ⊂ H；實作一律讀成 (κ′[v])_e ∈ G。"},{"id":"c3-ch13-core-record-fields","ch":"13","section":"13.2 Cores and Services","gpRef":"eq. 13.7–13.9; §13.2","difficulty":2,"kind":"concept","tags":["statistics","core-stats","types","gas"],"stem":"GP 0.8.0 types the core statistics as π_C ∈ ⟦(d, p, i, x, z, e, l, u)⟧_C while the service statistics are π_S ∈ ⟨N_S → (…)⟩. A teammate is laying out the Go struct for one core record and asks which of the eight components are gas, which are counts and which are octet quantities — and whether the container needs zeroing at the epoch boundary. What do you tell them?","options":["Only the last component is gas-typed (N_G, the refine gas summed over the digests); the DA load, the total extrinsic size and the total bundle length are octet quantities; the popularity figure and the import, extrinsic and export components are plain counts. But the sequence accumulates over the epoch just like the validator records and is zeroed at the same rollover, which is why the first component is called a load rather than a size.","The DA load and the refine gas are both gas-typed, because DA occupancy is charged against the refine budget; the total extrinsic size is an octet quantity while the total bundle length counts work-items rather than octets; the popularity figure and the import and export components are plain counts. The container is a dictionary that lists only the cores which saw activity in the block.","Only the last component is gas-typed (N_G, the refine gas summed over the digests); the DA load, the total extrinsic size and the total bundle length are octet quantities; the popularity figure and the import, extrinsic and export components are plain counts. The container is a fixed-length sequence with one entry per core, rebuilt from scratch on every block, so no epoch-boundary zeroing exists for it.","All eight are plain naturals — the gas type N_G appears only in the service record's refinement pair; the DA load and the total extrinsic size are octet quantities but the total bundle length counts the segments in the bundle; the popularity figure counts the guarantors assigned to that core in this rotation, and the import, extrinsic and export components are plain counts. The container is a fixed-length sequence with one entry per core, rebuilt from scratch every block."],"answer":2,"explanation":"eq. 13.7：π_C ∈ ⟦(d ∈ N, p ∈ N, i ∈ N, x ∈ N, z ∈ N, e ∈ N, l ∈ N, u ∈ N_G)⟧_C——八個欄位裡**只有 u 是 N_G**（gas），其餘都是 N；語意上 d（DA load）、z（extrinsic size）、l（bundle length）是 octet 數量，p、i、x、e 是計數。eq. 13.9：p = Σ_{a ∈ E_A} a_f[c]，是本塊 assurance 裡把該 core 打勾的**張數**，不是被指派到該 core 的 guarantor 人數；l = L(c) = Σ_{w ∈ I, w_c = c} (w_s)_l 明確是 avspec 的 bundle **長度**。§13.2 開宗明義：「These are tracked only on a per-block basis unlike the validator statistics which are tracked over the whole epoch.」——所以 π_C 每塊整個重算，沒有 epoch 歸零這回事。容器型別也別搞混：π_C 是 ⟦…⟧_C 的**定長序列**（341 個 core 全都有一筆，即使全零），eq. 13.8 的 π_S 才是 dictionary，只放有活動的 service。把 l 說成「bundle 裡的 segment 數」或「work-item 數」都與 eq. 13.11 的 L(c) ≡ Σ (w_s)_l 牴觸——segment 數是 avspec 的 n，只在 eq. 13.12 的 D(c) 裡以 W_G⌈65n/64⌉ 的形式換算成 octet；把 d 說成 gas-typed 也沒有依據：eq. 13.7 只有 u ∈ N_G，DA 佔用從來不從 refine 預算扣。最後那個只錯在「會跨塊累加」的選項最值得留意：型別全部說對了，但 §13.2 第一句就否定它，而且 d 叫做 load 是因為它衡量 DA 的**佔用量**（含 65/64 的 paged-proof 放大），與是否跨 epoch 累加無關。","trap":"π_C 定長、每塊重算；π_S 是 dictionary、每塊重算；只有 π_V/π_L 才有 epoch rollover。"},{"id":"c3-ch13-da-load-calc","ch":"13","section":"13.2 Cores and Services","gpRef":"eq. 13.9, 13.12; eq. 11.17 (R); eq. 11.30 (I)","difficulty":3,"kind":"calc","tags":["statistics","core-stats","da-load","calc"],"stem":"In one block, core 5 sees two things. (a) The guarantee extrinsic brings in a fresh work-report for core 5 whose availability spec has bundle length 100,000 octets and export-segment count 200. (b) An older report already assigned to core 5 crosses its two-thirds assurance threshold in this same block; its availability spec has bundle length 262,144 octets and export-segment count 130. With W_G = 4,104, what value does π′_C[5]_d take?","options":["795,664","937,216","803,872","807,976"],"answer":3,"explanation":"eq. 13.12：D(c) ≡ Σ_{w ∈ R, w_c = c} ((w_s)_l + W_G⌈(w_s)_n · 65/64⌉)，求和範圍是 **R**——eq. 11.17 定義的「newly available」報告（本塊剛跨過 2/3 super-maj
