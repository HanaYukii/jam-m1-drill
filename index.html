tionale","tags":["statistics","rationale","staking"],"stem":"Why does the JAM chain keep validator activity statistics at all, and what does the GP say about the activities that cannot be measured directly on-chain?","options":["JAM pays validators directly: each block the STF debits a treasury service in proportion to π_V, exactly as it does for punishment; block production, guaranteeing and assurances are trackable on-chain, and so are GRANDPA, BEEFY and auditing, since every message a validator signs is eventually included in some block","JAM issues no rewards itself and the statistics exist only for telemetry (JIP-3) and RPC: π sits outside the consensus state and is not covered by the state root, as is the punishment record ψ; GRANDPA, BEEFY and auditing activity is therefore simply omitted rather than oracled to any external subsystem","JAM issues no rewards itself but oracles activity data to a staking subsystem, as it does with punishment data; block production, guaranteeing and assurances are trackable on-chain, whereas GRANDPA, BEEFY and auditing are not and are instead covered by validators voting on each other's efforts, with a median accepted under a 50%-honest assumption","JAM issues no rewards itself but feeds π into Safrole, which drops from ι′ any validator whose counters fall below a threshold; block production, guaranteeing and assurances are trackable on-chain, whereas GRANDPA and BEEFY activity is read straight from the header's finality field and auditing is covered by validators voting on each other's efforts"],"answer":2,"optNotes":["與 §13.1 第一句 does not explicitly issue rewards 正面牴觸；GRANDPA/BEEFY 簽章根本不進區塊。","π 是 App. D 的 C(13)、ψ 是 C(5)，兩者都在 state root 底下；untrackable 的活動也沒有被略過。","§13.1 原文：JAM 只 facilitate the arrival of information，untrackable 的部分靠互評取 median。","ι′ 來自 delegator service 的 accumulate 輸出（§12），與 π 無關；§5 的 header 也沒有 finality 欄位。"],"explanation":"§13.1 開頭：「The JAM chain does not explicitly issue rewards—we leave this as a job to be done by the staking subsystem (in Polkadot's case envisioned as a system parachain—hosted without fees…)」，JAM 只負責「facilitate the arrival of information on validator activity in to the staking subsystem」，如同 punishment（ψ_o offenders）資訊一樣是給外部子系統的 oracle。可直接鏈上追蹤的是 block production、guarantor reports、availability assurance（對應 π_V 的 b/t/p/d、g、a）；GRANDPA、BEEFY 與 auditing 則「cannot」，改由 validator 互評——「validators vote on their impression of each other's efforts and a median may be accepted as the truth」，並且「With an assumption of 50% honest validators, this gives an adequate means of oraclizing this information」。§14.1 的 honest behavior 清單最後一項正是「submitting the correct amount of auditing work seen being done by other validators」。編碼上 π 落在 App. D 的 C(13)，0.8.0 起 π_V/π_L 還帶長度前綴（你們 PR #1034）。","trap":"JAM 不發獎勵、不追蹤 GRANDPA/BEEFY/audit；這些靠 validator voting 的 median，假設只需 50% 誠實。"},{"id":"ch14-code-digest-mapping","ch":"14","section":"14.3 Packages and Items","gpRef":"eq. 14.10 (item-to-digest C); eq. 11.6 (D); eq. 13.10/13.17 — internal/work_package/work_package.go C","difficulty":2,"kind":"code","tags":["work-packages","digest","code"],"stem":"This is the team's item-to-digest function (GP 0.8.0 eq. 14.10, C). Which statement about it is correct?","code":{"lang":"go","caption":"internal/work_package/work_package.go (C; the '14.8' in the comment is the 0.7.2 number of eq. 14.10)","src":"// C (14.8)\nfunc C(item types.WorkItem, result types.WorkExecResult, gas types.Gas) types.WorkResult {\n    payloadHash := hash.Blake2bHash(item.Payload)\n    importCount := types.U16(len(item.ImportSegments))\n    extrinsicSize := types.U32(len(item.Extrinsic))\n    var zSum types.U16\n    for _, v := range item.Extrinsic {\n        zSum += types.U16(v.Len)\n    }\n    return types.WorkResult{\n        ServiceID:     item.Service,\n        CodeHash:      item.CodeHash,\n        PayloadHash:   payloadHash,\n        AccumulateGas: item.AccumulateGasLimit,\n        Result:        result,\n        RefineLoad: types.RefineLoad{\n            GasUsed:        gas,\n            Imports:        importCount,\n            ExtrinsicCount: item.ExportCount,\n            ExtrinsicSize:  extrinsicSize,\n            Exports:        zSum,\n        },\n    }\n}"},"options":["The code is correct: eq. 14.10 pins down only the payload hash, the accumulate gas limit, the import count and the gas used, leaving the three manifest counters x, z and e to whatever Ψ_R actually did, so any self-consistent assignment is acceptable provided the guarantors agree on the resulting report hash","AccumulateGas is the only defect: a digest's g must be the refine gas limit w_g, because the accumulation gas is decided on-chain by Δ+ rather than by the package; the payload hash H(w_y), the import count |w_i| and the three load counters x = |w_x|, z = Σ of the extrinsic lengths and e = w_e are all assigned correctly","Three load counters are rotated: eq. 14.10 sets x = |w_x| (number of extrinsics), z = Σ of the extrinsic lengths and e = w_e (declared export count), but the code puts w_e into ExtrinsicCount, |w_x| into ExtrinsicSize and the length sum into Exports — payload hash, accumulate gas limit, import count and gas used are right","The only defect is the payload hash: eq. 14.10 requires y = H(E(w)), the hash of the whole encoded work-item rather than of the payload alone, so PayloadHash must be taken over E(item); the accumulate gas limit, the import count and the three load counters x = |w_x|, z = Σ of the extrinsic lengths and e = w_e are all assigned correctly"],"answer":2,"optNotes":["eq. 14.10 對 x、z、e 是精確定義，沒有「任意自洽即可」的空間，而 code 的這三欄確實錯位。","digest 的 g 是 accumulate gas limit w_a；refine 的 w_g 只出現在 eq. 14.9 與 Ψ_R。","ExtrinsicCount 收了 w_e、ExtrinsicSize 收了 |w_x|、Exports 收了 Σz，正是三欄整組輪轉。","eq. 11.6 說 y 是原樣交給 accumulation 的 payload，digest 取的就是 H(w_y)，不是整個 work-item。"],"explanation":"eq. 14.10 C：((s, c, y, a, e, i, x), l, u) ↦ (s, c, y ↦ H(y), g ↦ w_a, l, u, i ↦ |w_i|, e, x ↦ |w_x|, z ↦ Σ_{(h,z)∈w_x} z)。對照 code：Imports = len(ImportSegments)、AccumulateGas = w_a、PayloadHash = H(payload)、GasUsed = u 都正確；但 ExtrinsicCount 被塞了 item.ExportCount（應為 len(item.Extrinsic)）、ExtrinsicSize 被塞了 len(item.Extrinsic)（應為 Σ Len，也就是 zSum）、Exports 被塞了 zSum（應為 ExportCount）——三個欄位輪轉錯位。三個干擾項共用同一個破綻：它們都順帶宣稱 x、z、e 指派正確。後果：digest 的 x/z/e 錯 → report hash 與其他實作不同（guarantor 簽章不一致）→ π_C 與 π_S（eq. 13.10、13.17 的 R(c)、R(s)）也錯。STF conformance fuzzer 沒抓到，因為 test vectors 直接提供現成的 work-report（code-map §5 第 16 點：這條路徑不在 STF 向量裡）。另外 e 是 work-item **宣告**的 w_e，實際 export 數不符時 I 函數（eq. 14.13）會給 ⊚ BADEXPORTS。","trap":"digest 五個負載欄位：u gas used、i imports、e exports、x extrinsic count、z extrinsic size——順序與名稱要背熟。"},{"id":"ch14-code-refine-args","ch":"14","section":"14.4 Computation of Work-Report","gpRef":"eq. B.5 (Ψ_R argument a and gas w_g); eq. B.1 (Ψ_I uses E_2(c)); eq. 14.9 (G_R) — PVM/refine_invocation.go RefineInvoke","difficulty":3,"kind":"code","tags":["work-packages","refine","pvm-invocation","code"],"stem":"Below is how the team's Ψ_R builds the argument blob a handed to Ψ_M. Which statement is correct under GP 0.8.0 (eq. B.5)?","code":{"lang":"go","caption":"PVM/refine_invocation.go (RefineInvoke, 0.7.2)","src":"    // otherwise\n    var a []byte\n    encoder := types.NewEncoder()\n    // c\n    encoded, _ := encoder.EncodeUint(uint64(input.CoreIndex))\n    a = append(a, encoded...)\n    // i\n    encoded, _ = encoder.EncodeUint(uint64(input.WorkItemIndex))\n    a = append(a, encoded...)\n    // w_s\n    encoded, _ = encoder.Encode(&workItem.CodeHash)\n    a = append(a, encoded...)\n    // |w_y| . w_y\n    encoded, _ = encoder.Encode(&workItem.Payload)\n    a = append(a, encoded...)\n    // H(p)\n    encoded, _ = encoder.Encode(&input.WorkPackage)\n    h := hash.Blake2bHash(encoded)\n    a = append(a, h[:]...)\n    // ... (host-call context `addition` elided)\n    result := Psi_M(StandardCodeFormat(code), 0, workItem.RefineGasLimit, a, RefineOmegas, addition)"},"options":["The final hash must be H(E(w)), the hash of the encoded work-item being refined, rather than H(p); and the gas limit handed to Ψ_M must be G_R = 5·10⁹, the per-package refine allowance, not one item's w_g — the compact c and i, the service index w_s and the length-prefixed payload are all correct","The third component of a must be the service index w_s as a compact natural, but the code appends the 32-octet code hash w_c; the compact c and i, the length-prefixed payload, H(p) over the encoded package and the gas limit w_g all match the GP","The core index must be encoded as E_2(c), two fixed octets, exactly as Ψ_I does, so the compact EncodeUint is wrong; the service index w_s, the compact i, the length-prefixed payload, H(p) over the encoded package and the gas limit w_g all match the GP","The payload must be appended without a length prefix because Refine obtains it through the fetch host-call instead, so the ↕ is spurious; the compact c and i, the service index w_s, H(p) over the encoded package and the gas limit w_g all match eq. B.5"],"answer":1,"optNotes":["H(p) 就是整包 package 的 hash；G_R 是 eq. 14.9 的 package 級 Σ w_g 上限，單一 item 傳的是 w_g。","註解寫 w_s 的那行編進去的是 workItem.CodeHash，32-byte 的 w_c 頂替了 compact 的 service index。","E_2(c) 是 Ψ_I 的參數（eq. B.1：Ψ_M(p_u, 0, G_I, E_2(c), …)），Ψ_R 的 c 用的是 compact E。","eq. B.5 的 ↕w_y 明確帶長度前綴，fetch selector 13 只是另一個取得管道，不能取消 ↕。"],"explanation":"eq. B.5 Ψ_R(c, i, p, r, ī, ς)：a = E(c, i, w_s, ↕w_y, H(p))，code 由 E(↕z, code) = Λ(δ[w_s], (p_c)_t, w_c) 去掉 metadata 前綴取得，然後 (u, o, (m, e)) = Ψ_M(code, 0, w_g, a, F, (∅, []))。c、i、w_s 都是無下標的 E → 一般（compact）自然數編碼；w_y 帶長度前綴（↕）；H(p) 是整個 package 序列化後的 hash。你們的 code：c、i 用 EncodeUint（C.6 compact）正確；Payload 用 ByteSequence.Encode（帶長度）正確；H(p) = Blake2b(E(p)) 正確；gas 傳 workItem.RefineGasLimit（w_g）正確——唯一的錯處是 a 的第三段，任何依 GP 解析 refine args 的 service 會把 code hash 的前幾個 byte 當 service id、後面全部錯位；三個干擾項也都順帶宣稱那一段是對的。0.7.2 與 0.8.0 的公式相同（0.7.1 才加入 c）。","trap":"Ψ_I：E_2(c) + G_I = 50M；Ψ_R：E(c, i, w_s, ↕w_y, H(p)) + w_g（Σ w_g < G_R = 5·10⁹）。"},{"id":"ch14-compute-report-signature","ch":"14","section":"14.4 Computation of Work-Report","gpRef":"eq. 14.13–14.14 (Ξ, E, srlookup correspondence); eq. 14.17 (A with v); eq. 11.31","difficulty":3,"kind":"delta","tags":["work-packages","compute-report","delta-0.8.0"],"stem":"GP 0.8.0 redefines the work-report computation function Ξ. Which statement about its arguments and its failure condition E is correct?","options":["Ξ(p, c, l, v) takes the package, the core, a segment-root dictionary l keyed by work-ITEM index with one entry per import, and v, the number of guarantor signatures on the report (2 or 3); it yields ∇ only if the Is-Authorized result is not a blob of at most W_R octets or if the encoded report exceeds W_B = 13,791,360 octets","Ξ(p, c) as in 0.7.2 takes only the package and the core; the segment-root dictionary is read out of the on-chain state ρ during computation and the shard count is fixed at V = 1,023; it yields ∇ only if the Is-Authorized result is not a blob of at most W_R octets — a work-item whose Refine ends in ∞, ☇, BAD or BIG does not make Ξ fail","Ξ(p, c, l, v) takes the package, the core, a segment-root dictionary l (one entry per work-package hash referenced by an h⊞ import) and the assurer-set size v; it yields ∇ if the Is-Authorized result is not a blob of at most W_R octets, if keys(l) differ from the set of h⊞ hashes, or if any work-item's Refine ends in ∞, ☇, BAD or BIG, so that a guarantor never signs a report holding a failed item","Ξ(p, c, l, v) takes the package, the core, a segment-root dictionary l (one entry per work-package hash referenced by an h⊞ import) and the assurer-set size v; it yields ∇ only if the Is-Authorized result is not a blob of at most W_R octets or if keys(l) differ from the set of h⊞ hashes — a work-item whose Refine ends in ∞, ☇, BAD or BIG does not make Ξ fail"],"answer":3,"optNotes":["l 的 key 是 work-package hash；v 是 assurer 集合大小，2–3 是 credential 長度；W_B 是 bundle 上限。","0.8.0 的 Ξ 有四個參數；l 由 guarantor 自組並隨 report 上鏈，ρ 只存各 core pending 的 assignment。","item 失敗由 I 就地換成 error digest 與零 segment，the work-package continues to be valid as a whole。","eq. 14.13 的 E 只有兩個 disjunct：Ψ_I 的結果不是 ≤ W_R 的 blob，或 K(l) 與 h⊞ 的 hash 集合不符。"],"explanation":"eq. 14.13：Ξ: (P, N_C, ⟨H → H⟩, N_V) → ℝ ∪ {∇}，(p, c, l, v) ↦ ∇ if E，否則 (s, c ↦ p_c, c, a ↦ p_a, t, l, d, g)。其中 (t, g) = Ψ_I(p, c)——Is-Authorized 必須先跑，「to ensure that the work-package warrants the needed core-time」；E = t ∉ B_{:W_R} ∨ K(l) ≠ {h | w ∈ p_w, (h⊞, n) ∈ w_i}。work-item 的 Refine 失敗（∞、☇、BAD、BIG、⊚ bad-exports、⊖ oversize）只會由 I 函數把該 digest 的 result 換成 error、exports 換成零 segment——「the work-package continues to be valid as a whole」。0.7.2 是 Ξ(p, c) 兩個參數，l 只以 keys(l) ≡ {…} 且 |l| ≤ 8 隱含定義；0.8.0（配合 #514 可變 validator 數）把 l 與 assurer 數 v 明確列為參數，v 再傳給 A（eq. 14.17–14.18）決定 erasure coding 的 shard 數，鏈上 eq. 11.31 要求 (w_s)_n = |κ′|。eq. 14.14：guarantor 要自行確認 l 的每一對 (h ↦ e) 真的對應（H(p) = h 且 Ξ(p, …)_s 的 segroot = e），否則「consider the work-package unable to be guaranteed」；auditor 直接沿用 report 裡的 l。你們 issue #1015/#1026：WorkPackageSpec 加 erasure_shards，Producer 設為 TotalShards。","trap":"Ξ 失敗只有兩種：Is-Authorized 失敗、l 的 key 集合不對；item 失敗不會讓 Ξ 失敗。"},{"id":"ch14-paged-proofs","ch":"14","section":"14.3.1 Exporting / 14.4.1 Availability Specifier","gpRef":"eq. 14.12 (P), 14.18 (A: e = M(s), s♣); eq. E.4–E.6 (M, J_x, L_x); eq. 13.12","difficulty":2,"kind":"concept","tags":["work-packages","segments","paged-proofs","merkle"],"stem":"Exported segments are committed to by the segments-root e of the availability specification and justified through paged proofs. Which statement is correct?","options":["e = M(s) is the root of a constant-depth binary Merkle tree over the exported segments, its leaves '$leaf'-prefixed and zero-hash-padded to a power of two; P(s) yields one 4,104-octet segment per 32 exported segments, each carrying a page of 32 leaf hashes plus its subtree path; they live only in the short-term Audit DA, since auditors are the only ones who verify imports","e = M_B(s), the well-balanced binary Merkle root taken over the raw segments with no padding; P(s) yields ⌈|s|/64⌉ extra segments, each the zero-padded encoding of the Merkle path J_6(s, i) to a 64-leaf subtree plus that subtree's page of 64 leaf hashes L_6(s, i); both are stored inside the auditable bundle rather than in the D³L","e = M(s) is the root of a constant-depth binary Merkle tree over the exported segments, its leaves '$leaf'-prefixed and zero-hash-padded to a power of two; P(s) yields one extra segment per exported segment, each holding that segment's own ≈350-byte justification, and every validator stores all of them so that any node can verify any import without fetching chunks","e = M(s) is the root of a constant-depth binary Merkle tree over the exported segments, its leaves '$leaf'-prefixed and zero-hash-padded to a power of two; P(s) yields ⌈|s|/64⌉ extra segments, each the zero-padded encoding of the Merkle path J_6(s, i) to a 64-leaf subtree plus that subtree's page of 64 leaf hashes L_6(s, i); both are erasure-coded into the long-lived D³L"],"answer":3,"optNotes":["頁大小是 2^6 = 64（DA load 才會是 65/64）；逐一驗 import justification 的其實是 guarantor。","M_B（E.3）是 well-balanced 無填充版，用在 erasure root 與 extrinsic hash；bundle 裝的是本包 import 的 justification。","§14.2.2 正因這種資料 too voluminous to have all validators store all data，才改成 64 個 segment 一頁。","§14.3.1 明指 segment root 用 eq. E.4 的固定深度 M，eq. 14.12 每 64 個 segment 一頁，兩者同進 D³L。"],"explanation":"§14.3.1：segments-root「is formed as the root of a constant-depth binary Merkle tree as defined in equation E.4」，即 A 的 e = M(s)（eq. 14.18）；E.4/E.7：M 先把每個 leaf 做 H($leaf ⌢ v) 再零填到 2 的冪——固定深度讓 import 證明的大小固定（eq. 14.7 的 32·⌈log₂ W_X⌉）。eq. 14.12：P(s) = [P_{W_G}(E(↕J_6(s, i), ↕L_6(s, i))) | i < ⌈|s|/64⌉]——每頁一個 segment，內容是 root 到該 64-leaf 子樹的路徑 J_6（E.5）加上這 64 個 leaf hash 的頁 L_6（E.6），零填到 4,104；§14.4.1：「exactly ⌈1/64⌉ paged-proof segments as the number of yielded segments, each composed of a page of 64 hashes of segments, together with a Merkle proof from the root to the subtree-root which includes those 64 segments」。它們與 exported segments 串接後（s ⌢ P(s)）一起被 C_v 切片、轉置後做成 s♣ → erasure root（eq. 14.18），存在長期的 D³L；importer「each justification can be derived through a single paged-proof」，最壞每個 import 多抓一個 segment，連續 import 共用一頁。這也是 eq. 13.12 DA-load 65/64 的由來。你們 work_package.go PagedProofs：Jx(6,…)、Lx(6,…)、PadToMultiple(SegmentSize)；A 用 merkle_tree.M 算 exportsRoot。","trap":"segment root = M（constant depth，$leaf 前綴 + 零填）；paged proof 每 64 個 segment 一頁、存 D³L；65/64。"},{"id":"ch14-makebundle","ch":"14","section":"14.4 Computation of Work-Report / 14.2.2 Data Collection and Justification","gpRef":"eq. 14.15–14.17 (X, L_l, S_l, J_l, B, s = A(H(p), B(p, l), e, v)); §14.3.1 (Audit DA vs D³L lifetimes)","difficulty":2,"kind":"concept","tags":["work-packages","bundle","audit-da","d3l"],"stem":"What exactly goes into the auditable work-bundle B(p, l) that guarantors erasure-code into the Audit DA, and how does that differ from what goes into the D³L?","options":["B(p, l) = E(p, X#(p_w), S_l#(p_w), J_l#(p_w)) with the exported segments appended as a fifth component: the encoded package, every extrinsic blob, every imported segment, their Merkle justifications and finally this package's own exports — only the justification paths carry length prefixes; the bundle goes to the long-lived D³L (≥ 28 days = 672 epochs) while the paged proofs alone are short-lived Audit-DA data","B(p, l) = E(p, X#(p_w), S_l#(p_w), J_l#(p_w)) with the finished work-report appended, so that auditors can compare their own result against the guarantors' without touching on-chain data; every one of the sequences carries a length prefix; both the bundle and the exported segments with their paged proofs are kept for ≥ 28 days (672 epochs) in the same store","B(p, l) = E(p, X#(p_w), S_l#(p_w), J_l#(p_w)): the encoded package, then every extrinsic blob, then every imported segment and finally the Merkle justifications of those imports — only the justification paths carry length prefixes; the bundle is short-lived Audit-DA data, whereas exported segments plus their paged proofs go to the long-lived D³L (≥ 28 days = 672 epochs)","B(p, l) = E(p, X#(p_w)) only: the encoded package and every extrinsic blob, with no imported segments and no justifications — auditors re-fetch the segments from the D³L and check their paged proofs themselves, exactly as the guarantors did; the bundle is short-lived Audit-DA data, whereas exported segments plus their paged proofs go to the long-lived D³L (≥ 28 days = 672 epochs)"],"answer":2,"optNotes":["export 走的是 A 的第三個參數（s ⌢ P(s) 進 D³L）；bundle 只留到 availability 那塊 finalize 為止。","bundle 只有四個元件、不含 report；GP 也明說只有 justification 的 Merkle path 帶長度前綴。","eq. 14.16 的四段順序與「只有 justification path 有長度前綴」都吻合，且 bundle 屬短期 Audit DA。","正好把 §14.2.2 要避免的成本加回去：auditing 每包平均 30 次、guaranteeing 只有 2–3 次。"],"explanation":"eq. 14.16：B(p, l) = E(p, X#(p_w), S_l#(p_w), J_l#(p_w))；eq. 14.15：X(w) = 依 w_x 順序的 extrinsic 原始 blob（H(d) 與 |d| 必須吻合）；L_l 把 h⊞ 透過 l 換成 segment root；S_l(w) = 每個 (r, n) ∈ w_i 對應的 segment b[n]（M(b) = L_l(r)）；J_l(w) = ↕J_0(b, n)，每個 import 的 Merkle 路徑。「Note the lack of length prefixes: only the Merkle paths for the justifications have a length prefix. All other sequence lengths are determinable through the work package itself」（extrinsic 長度在 w_x、segment 固定 4,104、import 數量在 w_i）。這個 bundle 就是 A 的第二個參數：s = A(H(p), B(p, l), ē, v)，(w_s)_l = |B(p, l)|（eq. 14.17–14.18），被 C_v 切成 v 個 chunk 進**短期** Audit DA——§14.3.1：「assurers are expected to keep them only until finality of the block in which the availability of the work-result's work-package is assured」；exported segments + P(s) 則進**長期** D³L，「kept for a minimum of 28 days (672 complete epochs)」。理由（§14.2.2）：guarantor 已用 justification 驗過 import，但「We do not force auditors to go through the same process」——寧可在 D³L 與 Audit DA 之間重複資料以降低 auditor 成本。你們 work_package.go BuildWorkPackageBundle：WorkPackageBundle{Package, Extrinsics, ImportSegments, ImportProofs}。0.8.0 才把它命名為 B 並明確以 (p, l) 為參數（issue #1015「explicit make-bundle / compute-report semantics」）。","trap":"bundle = package ⌢ extrinsics ⌢ import segments ⌢ justifications（只有 justification path 有長度前綴）；短期 Audit DA vs 長期 D³L（672 epochs）。"},{"id":"arch-audit-initial-tranche","ch":"ARCH","section":"17.3 Selection of Reports","gpRef":"eq. 17.2–17.4","difficulty":3,"kind":"concept","tags":["auditing","elves"],"stem":"How does a validator pick the work-reports it must audit in the INITIAL tranche (a_0)?","options":["It makes a Bandersnatch VRF signature s_0 over context X_U ⌢ Y(H_V) with an empty message, then Fisher-Yates shuffles the per-core sequence q using Y(s_0) and keeps the non-empty entries among the first ten","It audits every report that became available in the block: q holds one entry per active core, so the initial tranche is simply all of its non-empty entries and no verifiable randomness is involved","It audits the reports on the cores it guaranteed in the previous rotation, reusing the guarantor assignment G* of that rotation rather than drawing any fresh randomness for the tranche","It signs the block hash with its Ed25519 key and audits those cores whose index matches the low bits of that signature, taking as many cores as the audit bias factor F = 2 permits"],"answer":0,"optNotes":["eq. 17.3：a_0 = {w | w ∈ F(q, Y(s_0))[..10], w ≠ ∅}，先洗牌取前十、再濾掉 ∅。","全部都審等於退回 everybody-does-everything，也用不上任何可驗證亂數。","guarantor 正是被審的一方，且 G* 公開可算，攻擊者能事先知道誰審什麼。","用的是 Bandersnatch VRF 而非 Ed25519 簽名；F = 2 只用在 n > 0 的後續 tranche 判準。"],"explanation":"eq. 17.2：s_0 ∈ F_{κ[v]_b}^{X_U ⌢ Y(H_V)}([])，X_U = $jam_audit——VRF 的 context 綁定本區塊的 entropy VRF 輸出 Y(H_V)，所以選擇是可驗證亂數且逐塊不同。eq. 17.3：a_0 = {w | w ∈ F(q, Y(s_0))[..10], w ≠ ∅}，q 是長度 |κ|/3（active cores）的序列，把「本塊剛 available 的 report」對應到 core（沒有就是 ∅）；先洗牌取前十項、再濾掉 ∅，所以初始 tranche 最多 10 個 core。抽樣而非全審正是 ELVES 的前提：§4.9.1 想要的約 300 倍算力來自 in-core 的少數重算，後續 tranche 的擴張由 no-show 驅動。宣告（announcement）必須先發布並且「should be taken as a contract to complete the audit regardless of any future information」。","trap":"10 個 core 是 shuffle 後取前 10；q 的長度是 active cores = |κ|/3，不是 C = 341。"},{"id":"arch-audit-outcomes","ch":"ARCH","section":"17.1 Overview","gpRef":"§17.1","difficulty":2,"kind":"concept","tags":["auditing","disputes"],"stem":"GP §17.1 describes what happens when a negative judgment appears. Which pair of thresholds and consequences is correct?","options":["If more than 1/2 of validators issue NEGATIVE judgments, the report is dropped from its availability assignment; if fewer do, nothing happens at all — no validator is ever punished for a false negative and the block containing the report stays buildable","If more than 2/3 of validators still issue POSITIVE judgments, those issuing negative judgments may be punished for time-wasting; if more than 1/3 issue NEGATIVE judgments, the block containing the report is ban-listed and it and all its descendants are disregarded","A single NEGATIVE judgment suffices: it invalidates the block that carried the report and slashes all three guarantors of that core; no further validator need judge, no verdict reaches the disputes extrinsic, and the 2/3 positive threshold plays no part","Negative judgments carry no consequence of their own; only the disputes extrinsic matters, a verdict there needs the unanimous signature of the whole active validator set, and the punish-set ψ_O fills only from culprits and never from faults"],"answer":1,"optNotes":["門檻是 1/3 不是 1/2；被 ban-list 的區塊「may not be built on」，反對者也確實會被罰。","兩個門檻都對上 §17.1：2/3 正面罰浪費時間者、1/3 負面 ban-list 該塊與其後代。","verdict 需 ⌊2/3·|k|⌋ + 1 票，單獨一票既構不成 verdict，也不會登錄任何 culprit。","eq. 10.12 的票數從來不是 unanimity；ψ_O 除 culprits 外也收 faults 這種 offence。"],"explanation":"§17.1：「if greater than 2/3 of the validators still issue positive judgments, then validators issuing negative judgments may receive a punishment for time-wasting. If greater than 1/3 of the validators issue negative judgments, then the block which includes the work-report is ban-listed. It and all its descendants are disregarded and may not be built on.」兩個門檻方向相反：2/3 正面是用來懲罰亂投反對票的人（讓惡意負面判決有代價），1/3 負面則丟掉整條分支。最後由 block author 把足夠的票組成 verdict 放進 disputes extrinsic（§10）——「once there are enough votes, a verdict can be constructed by a block author and placed in a disputes extrinsic」；§10 eq. 10.12 的正面票數只接受 ⌊2/3·|k|⌋ + 1（good）、0（bad）、⌊1/3·|k|⌋（wonky）三個值，而 punish-set ψ_O 同時收 culprits（保證了無效 report 的 guarantor）與 faults（判決與 verdict 相牴觸的簽署者）。另外：一個 report 的所有宣告都被正面判決匹配時即為 audited；一個區塊的所有新 available report 都 audited 時該區塊為 audited——這是 finalize 的前提之一（§19）。","trap":"「1/3 負面 → 整條鏈分支被丟棄」是 best-chain 的 disregard 規則；2/3 正面 → 反對者被罰。"},{"id":"arch-audit-reconstruction","ch":"ARCH","section":"17.2 Data Fetching","gpRef":"§17.2–17.3 & appendix H","difficulty":2,"kind":"concept","tags":["auditing","erasure-coding"],"stem":"How does an auditor obtain the data it needs to re-run a work-report?","options":["It asks the core's other two guarantors to re-sign the report and takes a matching pair of Ed25519 signatures as proof of correctness; no bundle is fetched and refine is never re-run","It downloads the whole bundle from the block author, who is required by the GP to retain it for 28 days; the exported segments arrive with it, so the refine logic never has to be re-run","It reads both the imported and the exported segments straight from on-chain state, where they sit under the reporting service's preimages until the report is accumulated and then expire","It reconstructs the bundle from erasure-coded chunks fetched from about one-third of the validators, verified against the erasure-root; exported segments are recomputed by re-running refine"],"answer":3,"optNotes":["guarantor 的簽名正是審計要檢驗的對象，再收一次同一批人的背書是循環論證。","持有 chunk 的是 assurer 不是出塊者；28 天是 exported-segment 的 D³L 期限，不是 audit DA store。","segment 從不進 state，鏈上只有 erasure-root、segment-root 等 hash；preimage 是 §9.2 另一套設施。","chunk 取自約三分之一 validator、以 erasure-root 驗證，exported segments 則靠重跑 refine 產生。"],"explanation":"§17.3：「This may be done through requesting erasure-coded chunks from one-third of the validators, verified through the erasure coding's Merkle root, and reconstructing the bundles as per the recovery function」（附錄 H：任意 d(v) ≈ v/3 + 1 個 chunk 即可還原）。§17.2：bundle 內含 work-package、extrinsic data、imported segments 與其 justification；「Exported segments need not be reconstructed in the same way, but rather should be determined… through the execution of the Refine logic」——重跑 refine 正是審計的核心動作，M(w, p) 要求 w = Ξ(p, w_c, w_l, …) 逐欄位相符，光有資料而不重算根本沒有審到。§17.3 確實允許直接向 guarantor 要完整 bundle 當捷徑，但「If this data cannot be decoded or verified however, we must fall back to reconstruction from erasure-coded chunks」，而且拿到之後一樣要重跑 refine，把 work-package specification 的每個欄位重算並比對——「essentially retracing the guarantors steps」。","trap":"審計 = 重跑 computereport 並比對整個 report；解不出 bundle 本身就代表 report 無效。"},{"id":"c3-appE-wb-vs-constant-depth","ch":"E","section":"E.1 Binary Merkle Trees & E.2 MMR","gpRef":"eq. E.1 (N), E.3 (M_B), E.4 (M), E.7 (C); eq. 11.5 (segment-root a_e); §14 availability specifier (erasure-root a_u)","difficulty":3,"kind":"rationale","tags":["merklization","segment-root","erasure-root","rationale"],"stem":"Appendix E gives two general Merkle root functions: the well-balanced M_B and the constant-depth M. In an availability specification the segment-root a_e is built with one of them and the erasure-root a_u with the other. Which way round is it, and what does the well-balanced shape buy over simply padding every tree up to a power of two?","options":["Both roots use M; M_B is only a thin wrapper that hashes a lone item and otherwise defers to the node function N. Padding up to a power of two is exactly what makes a tree well-balanced, the '$leaf' versus '$node' prefixes are the only substantive difference between the two root functions, and the erasure-root's leaves are single 32-octet chunk hashes rather than 64-octet pairs.","The other way round: the segment-root uses M_B because a segment is 4,104 octets and M_B avoids hashing each item, while the erasure-root uses M because the chunk count is fixed at the validator-set size, so a constant-depth tree is cheaper to build. M_B applies the '$leaf' prefix in its own base case, so no separate preprocessor is needed, and well-balancedness only matters for very short sequences where log₂ rounding wastes one level.","Both roots use M_B; the constant-depth function exists only for the state trie of appendix D, whose 31-octet keys already fix the depth, and the preprocessor C is that trie's key-padding step. The well-balanced shape is preferred because it gives every leaf the same proof length, which a power-of-two-padded tree cannot do once the item count is not itself a power of two, so J_6/L_6 page over the trie rather than over a general Merkle tree.","The segment-root uses M: the preprocessor C rewrites every item as H('$leaf' ⌢ s) and pads to 2^⌈log₂ n⌉ zero-hash leaves, so all leaves sit at one depth and 64-leaf pages stay size-aligned for J_6/L_6. The erasure-root uses M_B, whose leaves are already 64-octet hash pairs, so pre-hashing would be wasted and splitting at ⌈|v|/2⌉ keeps the deepest level — and the count of leaves on it — minimal."],"answer":3,"optNotes":["M_B 完全不 padding；well-balanced 指的是最深深度與該層 leaf 數皆最小，不是補到 2 的冪次。","與 eq. 11.5 原文相反，而且 M_B 的 base case 是 H(v_0)，並沒有 '$leaf' 前綴。","附錄 D 的是 binary Patricia Merkle Trie、31-octet key 不經過 C；證明長度齊一的反而是定深樹。","eq. 11.5 明寫 segment-root 是 constant-depth、zero-hash-padded，而 erasure-root 的 leaf 本來就是 hash。"],"explanation":"GP 0.8.0 eq. 11.5 的說明文字寫得很白：segment-root a_e 是「a constant-depth, left-biased and zero-hash-padded binary Merkle tree committing to the hashes of each of the exported segments」，也就是 M（eq. E.4）＝ N(C(v,H),H)；C（eq. E.7）先把每個 item 換成 H('$leaf' ⌢ v_i)，再用 zero hash H_0 補到 2^⌈log₂ max(1,|v|)⌉。這兩件事缺一不可：先雜湊 leaf 才不會讓 justification 夾帶一整個 4,104-octet segment；補到 2 的冪次才會有 size-aligned 的 2^6 page，讓 eq. 14.12 的 paged-proofs 函數 P（GP 就叫 P，勿與 eq. 11.21 的 permute P 或 eq. 14.19 的 zero-pad 𝒫_n 混淆）能用 J_6/L_6 一次證明 64 個 segment。erasure-root a_u 走的是另一條路：§14 的 availability specifier 定義 a_u = M_B([⌢x | x ∈ ᵀ[b♣, s♣]])，每片 leaf 已經是「bundle chunk 的 Blake2b ⌢ 該 validator segment 欄的 M_B root」共 64 octets，再 pre-hash 一次純屬多做。GP 對 well-balanced 的定義是「ensures that the maximum depth of any leaf is minimal and that the number of leaves at that depth is also minimal」——注意這不等於「每片 leaf 的證明一樣長」：N 在 ⌈|v|/2⌉ 切，|v| = 5 時 index 0 的 trace 長 3、index 3 的長 2；長度齊一的是 constant-depth 那一種。","trap":"口訣：segment-root 走「先 $leaf 再補 0」的定深樹（要分頁證明），erasure-root 走「不補不預雜湊」的均衡樹（leaf 本來就是 hash）。"},{"id":"c3-appE-code-trace-split","ch":"E","section":"E.1 Binary Merkle Trees & E.2 MMR","gpRef":"eq. E.1 (N), E.2 (trace T), E.5–E.6 (J_x, L_x), E.7 (C); eq. 14.12 (paged proofs)","difficulty":3,"kind":"code","tags":["merklization","justification","proof-path","bug"],"stem":"Below is the team's trace function, the one that produces the sibling nodes of an inclusion justification. In the same file the node function N splits its input with `mid := (len(v) + 1) / 2`. Reading the two together, what is the defect and where does it actually bite?","code":{"lang":"go","caption":"internal/utilities/merkle_tree/merkle_tree.go (T) — compare with N in the same file","src":"func T(v []types.ByteSequence, i types.U32, hashFunc func(types.ByteSequence) types.OpaqueHash) (output []types.ByteSequence) {\n\tif len(v) <= 1 {\n\t\treturn output\n\t}\n\tmid := types.U32(len(v) / 2)\n\tvar siblingHalf []types.ByteSequence\n\tvar traverseHalf []types.ByteSequence\n\tvar newIndex types.U32\n\n\tif i < mid {\n\t\tsiblingHalf = v[mid:]  // right is sibling\n\t\ttraverseHalf = v[:mid] // go left\n\t\tnewIndex = i\n\t} else {\n\t\tsiblingHalf = v[:mid]  // left is sibling\n\t\ttraverseHalf = v[mid:] // go right\n\t\tnewIndex = i - mid\n\t}\n\tsibling := N(siblingHalf, hashFunc)\n\tsuffix := T(traverseHalf, newIndex, hashFunc)\n\tresult := make([]types.ByteSequence, 0, 1+len(suffix))\n\tresult = append(result, sibling)\n\tresult = append(result, suffix...)\n\treturn result\n}"},"options":["It is fine as written: for a well-balanced tree the two rounding conventions describe the same tree, because N recurses on the very halves this function walks. The only genuine divergence from the GP is ordering — the returned sequence runs from the leaf upwards, whereas the GP emits the opposite nodes from the root downwards, so reversing the slice at the CE 140 call site is the whole of the fix.","The recursion descends into the sibling half rather than the half that contains the target index, so the returned co-path is the mirror image of the correct one. Lengths always match the GP's, which is why unit tests on proof length pass while verification against a root fails. Page proofs escape it because a power-of-two tree is symmetric, so only the CE 140 co-path is affected.","It omits the '$node' domain-separation prefix when folding a sibling into the path, so the hashes it returns cannot be recombined into the root; the fix is to prepend the prefix inside this function rather than relying on the node function to do it. Odd-length levels are unaffected, since both functions round the split the same way, and page proofs fail exactly as often as direct calls do.","It rounds the split down while the GP — and this file's own node function — round it up, so at any recursion level of odd length the siblings and even the path length are wrong: for three items at index 0 the GP yields two nodes and this yields one. Page proofs escape it because C has already padded to a power of two, but the direct call that builds the CE 140 segment-shard co-path does not."],"answer":3,"optNotes":["同檔的 N 用 ceil、T 用 floor，兩者根本不描述同一棵樹；順序則本來就由 root 往下，與 eq. E.2 一致。","程式遞迴的是 traverseHalf 而不是兄弟半，而且長度就是會少一層，不是「長度永遠相符」。","'$node' 前綴由 N 自己加，T 只是收集 N 的輸出；兩個函式的取整方式也並不相同。","N 是 `(len(v)+1)/2`、T 是 `len(v)/2`；v = [a,b,c]、i = 0 時正解兩層、這份程式只回一層。"],"explanation":"GP eq. E.1 的 N 在 ⌈|v|/2⌉ 切：N(v,H) = H('$node' ⌢ N(v_{…⌈|v|/2⌉},H) ⌢ N(v_{⌈|v|/2⌉…},H))；eq. E.2 的 trace T 用同一個 ⌈|v|/2⌉ 決定 P^⊤（含 i 的那半）與 P^⊥（兄弟那半）以及 P_I 的位移。程式裡 N 寫成 `(len(v)+1)/2` 是對的（ceil），但 T 寫成 `len(v)/2` 是 floor，兩者在長度為奇數時分岔。以 v = [a,b,c]、i = 0 為例：GP 的樹是 ((a,b),c)，正解 co-path 為 [N([c]), N([b])] 共兩層；這份程式取 mid = 1，兄弟半變成 [b,c]、只遞迴 [a]，回傳長度 1 的 [N([b,c])]，內容與長度全錯，proof 永遠對不回 root。為什麼平常沒炸：J_x（eq. E.5）先呼叫 C（eq. E.7）把序列補到 2 的冪次才丟給 T，之後每一層都是偶數，floor 與 ceil 相同，所以 work_package.go 走 eq. 14.12 的 paged-proofs P(s) 分頁證明沒事；真正踩雷的是 networking/handler/ce/ce140.go 的 constructMerkleCoPath，它把未補齊的 segment-shard 序列直接餵給 T。","trap":"看到 Merkle 程式先問一句：ceil 還是 floor？GP 全篇一律 ⌈|v|/2⌉，只要 root 與 proof 用不同取整，偶數長度測資會全綠、奇數長度全紅。"},{"id":"c3-appE-mmb-peaks-superpeak","ch":"E","section":"E.1 Binary Merkle Trees & E.2 MMR","gpRef":"eq. E.8 (A), E.9 (E_M), E.10 (M_R); eq. 7.3, 7.7–7.8; §18 Beefy Distribution","difficulty":2,"kind":"concept","tags":["mmr","mmb","accumulation-log","beefy"],"stem":"The Accumulation Output Log β_B is a sequence of optional hashes rather than a single root, yet every recent-history entry stores only one 32-octet value b derived from it. Why does state keep the whole peak sequence, and what is that single value used for?","options":["The append function A carries like binary addition — an occupied slot n is folded with the incoming leaf and carried into slot n+1, an empty slot ∅ is simply filled — but the peak sequence itself is only a cache, since a node can rebuild it from the last H recent-history entries whenever it needs a proof; the single value is the Blake2b well-balanced root M_B taken over the peaks, kept in β_H purely so light clients can check the log without replaying accumulation, and Beefy signs the state root rather than that value.","The append function A pushes exactly one new peak per block and drops the oldest once the sequence exceeds H entries, exactly like the recent-history ring buffer, so the peaks are a bounded window rather than a growing commitment and old outputs simply age out of provability; the single stored value is the Keccak hash of the encoded peak sequence E_M(β_B), which enters β_H and is what third parties treat as the bridging commitment and BLS-sign for Beefy.","The append function A carries like binary addition — an occupied slot n is folded with the incoming leaf and carried into slot n+1, an empty slot ∅ is simply filled — so the peaks are exactly the state needed to keep appending and to serve O(log N) inclusion proofs; hashing them away would end appendability, which is why the separate super-peak M_R (a left-associated Keccak fold over the non-∅ peaks under a '$peak' prefix) is the one 32-octet value that enters β_H and is BLS-signed for Beefy.","The append function A carries like binary addition — an occupied slot n is folded with the incoming leaf and carried into slot n+1, an empty slot ∅ is simply filled — and the peaks are kept so that the log can be rewound on a fork, since removing the last leaf only ever requires dropping one peak; the single value is the well-balanced Keccak root over the accumulation outputs of that one block, which is what enters β_H and is BLS-signed for Beefy, so the peak sequence itself never leaves the node."],"answer":2,"optNotes":["β_H 每筆只留 super-peak 而且只有 H 筆，重建不出整條 belt；進 β_H 的也是 Keccak 的 M_R 而非 M_B。","A 的動作是進位而非推入，peak 數只隨 log₂N 成長且從不淘汰；E_M 是 C(3) 的 codec、根本不雜湊。","GP 明寫雜湊掉 peaks 就不能再 append，所以 state 留 peaks、對外只公布 super-peak M_R。","一次 append 可能連鎖進位好幾格；那顆 root 是被 append 進去的 leaf，不是 eq. 7.8 存下的 M_R(β′_B)。"],"explanation":"GP 附錄 E 的 MMR/MMB 段落：「a sequence of peaks, each peak the root of a Merkle tree containing 2^i items where i is the index in the sequence」，且「some peaks may be empty, ∅ rather than a Merkle root」。eq. E.8 的 A(r,l,H) = P(r,l,0,H) 就是二進位加法的進位：n ≥ |r| 時把 l 接在尾端；r_n = ∅ 時直接填入；否則把 r_n 清成 ∅、把 H(r_n ⌢ l) 當新的 leaf 進位到 n+1。GP 也明講「Hashing them removes the possibility of further appending so the range itself is kept on the system which needs to generate future proofs」——這就是 state 存 peaks 而不是存單一 root 的理由，也是 MMR 與一般 Merkle root 的根本差別。eq. 7.7：β′_B ≡ A(β_B, M_B(s, keccak), keccak)，每個 block 只 append 一片 leaf（該 block accumulation output 的 well-balanced root，且明講「Throughout, the Keccak hash function is used to maximize compatibility with legacy systems」）。eq. 7.8 存進 β_H 的欄位是 b = M_R(β′_B)，而 eq. E.10 的 M_R 先濾掉 ∅、空則 H_0、單一則直接回傳，否則 keccak('$peak' ⌢ M_R(h_{…|h|−1}) ⌢ h_{|h|−1})——注意 M_R 是寫死 Keccak，不像 A（eq. E.8）收 H 參數；E_M（eq. E.9）則根本不雜湊，它只是給 state serialization C(3) 用的 codec 𝓔_M。§18 Beefy 就是對 X_B ⌢ last(β_H)_b 做 BLS 簽章，所以 super-peak 才是對外橋接的那顆 commitment。","trap":"MMR 與單一 Merkle root 的差別＝「還能不能再 append」。peaks 留著才能 append 與出證明；對外公布的是 super-peak（Keccak、'$peak'）。"},{"id":"c3-appF-shuffle-is-consensus","ch":"F","section":"F Shuffling (Fisher–Yates)","gpRef":"eq. F.1 (F); eq. 11.21 (guarantor permute P); §17 tranche-0 audit selection","difficulty":2,"kind":"rationale","tags":["shuffle","determinism","guarantor-assignment","rationale"],"stem":"A reviewer on the team wants to replace the `r_0 mod l` index selection in the shuffle F with rejection sampling, on the grounds that a modulo of a 32-bit draw is biased whenever l does not divide 2³². How should the team answer?","options":["The change is unnecessary rather than wrong: the numeric-sequence-from-hash function already removes the bias by slicing non-overlapping 4-octet windows out of a Blake2b digest, so the value taken modulo the remaining length is exactly uniform and rejection sampling would loop zero times. The two forms therefore agree bit for bit, and a node that switches still derives the same assignment P(|κ′|, η′_2, τ′) as everyone else.","Accept it, but only for ticket handling. The appendix-F shuffle is what orders the ticket accumulator γ_A and what §6 calls on to build the fallback key sequence, and since γ_A is re-sorted by identifier before use the permutation never reaches state; the guarantor path and the tranche-0 audit selection must keep the Gray Paper's biased form, because those two do reach state.","Reject the change. F is a consensus rule, not a statistics utility: every node must derive the identical permutation from the same entropy, and its output drives the guarantor-to-core assignment P(|κ′|, η′_2, τ′) and the tranche-0 audit selection. A node that de-biases assigns validators to different cores, then rejects perfectly valid guarantor signatures and splits the chain; the residual bias across 32-bit draws is deliberately accepted.","Accept the change. The Gray Paper fixes only the distribution — any shuffle that yields a uniformly random permutation of the input is conformant — and the jamtestvectors shuffle suite checks only that the result is a permutation of the input, not which permutation. F feeds nothing that is checked on chain anyway: the guarantor-to-core assignment is fixed by the core index each work-report carries, and tranche-0 auditing is a purely local choice."],"answer":2,"optNotes":["Q_l（eq. F.2）只是把 hash 展開成 32-bit 數列，取模時的偏差原封不動保留下來。","γ_A 依 identifier y 排序取最小的 E 個，從未呼叫 F；§6 那個 fallback 是另一個同名函數。","F 是共識規則而非統計工具：它的輸出決定 eq. 11.21 的 P 與 §17 的 tranche-0，改了就分叉。","GP 給的是逐步可重現的函數定義，jamtestvectors 的 shuffle 向量是逐一比對輸出序列本身。"],"explanation":"eq. F.1 定義 F(s,r)：每一步取 index = r_0 mod l，輸出 s_{r_0 mod l}，再把 s_{l−1} 搬進那個位置、序列縮短一格遞迴。這裡的 mod 確實有 modulo bias（r_i ∈ N_{2³²}，l 通常不整除 2³²），GP 明知而不改，因為它要的不是統計上的完美均勻，而是「所有節點算出同一個排列」。用到的地方是硬性共識：eq. 11.21 的 P(v,e,t) = R(F([⌊i/3⌋ | i ∈ N_v], e), ⌊(t mod E)/R⌋) 決定每個 validator 這一輪被指派到哪個 core，η′_2 當種子（GP 特別說用 η_2 而非 η_1 是為了避開 fork-magnification）；另一處是 §17 的 tranche-0：F(reports, Y(s_0))[..10]。只要有節點改了 F，它算出的 M（eq. 11.22 的 guarantor assignments）就不同，於是把別人合法的 guarantor 簽章判成 bad validator index／unsorted guarantors，直接分叉。規範函數的價值在 bit-exact 可重現，不在統計品質，這是面試常考的判斷題。","trap":"面試常問「這個 shuffle 有 bias 你要不要修？」——答案永遠是不修：規範函數的價值在於 bit-exact 可重現，不在於統計品質。"},{"id":"c3-appF-seq-from-hash-vs-fallback","ch":"F","section":"F Shuffling (Fisher–Yates)","gpRef":"eq. F.2 (Q_l), F.3 (F from a hash); eq. 6.27 (fallback key sequence)","difficulty":2,"kind":"concept","tags":["shuffle","entropy","safrole","fallback"],"stem":"Two places in the Gray Paper expand a 32-octet hash into a sequence of indices: the numeric-sequence-from-hash function that feeds the shuffle, and the fallback key-sequence function of §6 that picks an epoch's worth of Bandersnatch keys when the ticket accumulator is not full. How do the two expansions actually differ?","options":["The shuffle's expansion makes one Blake2b call per eight outputs — hashing the seed concatenated with the 4-octet encoding of ⌊i/8⌋ — and decodes the little-endian 4-octet window at offset 4i mod 32, so one 32-octet digest supplies eight consecutive 32-bit numbers. §6's fallback hashes once per slot, over the seed concatenated with the encoding of the slot index, and decodes only the leading 4 octets, using the result to index the key sequence cyclically.","It is the other way round: the shuffle's expansion hashes once per output, over the seed concatenated with the 4-octet encoding of i, and takes the leading four octets of each digest; §6's fallback makes one Blake2b call per eight slots — hashing the seed with the encoding of ⌊i/8⌋ — and decodes the little-endian window at offset 4i mod 32, which is what keeps a whole epoch of fallback keys cheap to compute at once.","Both hash once per output, over the seed concatenated with the 4-octet encoding of the index, and both take only the leading four octets of each digest; the shuffle then decodes big-endian and uses the value in its natural range while §6's fallback decodes little-endian and reduces modulo the key-sequence length, so endianness is the only real difference and is the classic source of fallback-seal mismatches.","They are the same construction used twice: §6's fallback sequence is literally the appendix-F shuffle applied to the active key set κ′ with η′_2 as the seed and then truncated to E entries, so both make one Blake2b call per eight outputs over the seed concatenated with the 4-octet encoding of ⌊i/8⌋, both decode the little-endian window at offset 4i mod 32, and both index the key sequence cyclically — which is why an implementation only needs one hash-expansion routine."],"answer":0,"optNotes":["Q_l 的 counter 是 ⌊i/8⌋、window 取 4i mod 32；eq. 6.27 逐 slot 一次 hash、取前 4 octets 再做 cyclic index。","把兩邊的批次方式對調了：八個一批的是 Q_l，逐 slot 一次的才是 fallback key sequence。","𝓔⁻¹_4 兩邊都是 little-endian，GP 從未定義 big-endian 解碼；Q_l 取的也不是固定前四個 octet。","eq. 6.27 寫的是 H(r ⌢ E_4(i)) 逐 slot 一次、只取 _{…4}，規格與 Q_l 並不相同。"],"explanation":"eq. F.2：Q_l(h) = [ 𝓔⁻¹_4( H(h ⌢ E_4(⌊i/8⌋))_{4i mod 32 …+4} ) | i ∈ N_l ]。注意兩個細節：counter 是 ⌊i/8⌋，所以每八個輸出才換一次 Blake2b；取的是 offset 4i mod 32 起算的 4 octets，剛好把 32-octet digest 切成八個互不重疊的 window，再以 𝓔⁻¹_4（little-endian，見 §3 對 E_l/𝓔⁻¹_l 的約定；別和 eq. H.1 的 shard 數函數 𝒟 混用同一個字母）解成 32-bit 數。eq. F.3 則把它接到 shuffle 上：F(s,h) ≡ F(s, Q_{|s|}(h))，數列長度恰好等於序列長度。§6 的 fallback key sequence（eq. 6.27）長得像但不是同一個：F(r,k) = [ k[𝓔⁻¹_4(H(r ⌢ E_4(i))_{…4})]_b ⟳ | i ∈ N_E ]——每個 slot 各做一次 hash，只取前 4 octets，而且是對 k 取 cyclic index（⟳），輸出是 Bandersnatch 公鑰而不是數字。把兩者當成同一個函數，是實作 safrole fallback 時最典型的錯法：γ′_S 只有落到 eq. 6.25 第三支時（跨 epoch 而 Z(γ_A) 的條件不成立，例如 |γ_A| ≠ E 或 m < Y）才等於 eq. 6.27 的結果（那是逐 slot 抽 k 的 fallback，不是把 κ′ 拿去 shuffle）；同一 epoch 內（e′ = e）γ′_S 一律沿用 γ_S。","trap":"§6 的 fallback 叫 F、附錄 F 的 shuffle 也叫 𝓕——同名不同物。fallback 一個 slot 一次 hash、取前 4 bytes；Q_l 一次 hash 供八個、取 4i mod 32 的 window。"},{"id":"c3-appG-why-ring-not-plain-vrf","ch":"G","section":"G Bandersnatch VRF (IETF VRF vs Ring VRF)","gpRef":"§G; §3 signing schemes; eq. 6.30 (tickets extrinsic), eq. 6.16 (ticket seal)","difficulty":1,"kind":"rationale","tags":["bandersnatch","ring-vrf","safrole","anonymity","rationale"],"stem":"Safrole could have proved ticket validity with an ordinary IETF VRF signature plus the submitting validator's published Bandersnatch key. Why does the Gray Paper insist on a ring VRF proof instead?","options":["Because the proof shows only that its author knows a secret whose public key lies in the ring committed by γ′_Z, never which one, so next epoch's slot-sealer sequence can sit in public state without revealing who will author which slot; the author is identified only when the seal appears, which is what blunts targeted denial-of-service and bribery.","Because one ring proof can carry all of a validator's ticket entries at once — the entry indices ride in the message while the context fixes only η′_2 — so the 784-octet cost is paid once per validator per epoch and the tickets extrinsic stays inside its 16-per-block cap however many entries each validator is allowed.","Because it lets any key holder, validator or not, enter the ticket contest — the proof is checked against the 144-octet γ′_Z but ring membership is not required, only knowledge of some Bandersnatch secret — which is what keeps the accumulator saturated when part of the validator set is offline, and is why the contest closes at slot 500 of the epoch.","Because a ring VRF output is unbiasable whereas a plain VRF output can be ground by its signer through resubmission, so only the ring form makes next epoch's slot-sealer sequence safe to publish; anonymity is a welcome side effect but not the reason, and grinding resistance is also why the ticket's message is empty and its context carries no entry index."],"answer":0,"optNotes":["§3 說得最白：兩者的差別就在「member is identified in the former and is anonymous in the latter」。","每個 entry index 各自一張 784-octet proof；16 限的是每個 block 的 ticket 筆數而非每人一張。","ring proof 恰恰只有 ring 成員產得出來；Y = 500 收單是 C_epochtailstart 的規定，與參賽資格無關。","兩種簽章都是 VRF，output 的不可操縱性來自 input 綁死 η′_2；eq. 6.30 的 context 也確實帶著 i_e。"],"explanation":"§3 的簽章章節把差別講得最清楚：「Both the Bandersnatch signature and RingVRF proof strictly imply that a member utilized their secret key in combination with both the context x and the message m; the difference is that the member is identified in the former and is anonymous in the latter.」而 ring root 那段又說「A root implies a specific sequence of Bandersnatch key pairs, knowledge of one of the secrets would imply being capable of making a unique, valid—and anonymous—proof of knowledge of a unique secret within the sequence.」eq. 6.30 的 ticket proof 屬於 ⟨γ′_Z, X_T ⌢ η′_2 ⌢ i_e, []⟩ 這一族 784-octet ring proof，驗證只看 144-octet 的 ring root，因此鏈上永遠不知道某張 ticket 是誰投的；到了下一個 epoch 該 slot 的作者才用 eq. 6.16 的 96-octet IETF 簽章現身。（以下為 Sassafras/Safrole 的公認設計動機，GP 0.8.0 本文只寫到 anonymity，未展開攻擊模型）這正是 Safrole 相對 BABE 的賣點：未來的出塊者名單公開、身分不公開，攻擊者無法提前針對某台機器打 DoS 或行賄。","trap":"GP 0.8.0 只把 anonymity 寫成理由：ring proof 證明的是「簽章者在 γ′_Z 這個 ring 之中」而不指名是誰；unbiasability 兩種 VRF 都有，拿它當選 ring VRF 的理由必錯。"},{"id":"c3-appG-ring-root-commitment","ch":"G","section":"G Bandersnatch VRF (IETF VRF vs Ring VRF)","gpRef":"§G (ring root O, padding point); eq. 6.14–6.15 (key rotation and Φ); eq. 6.4 (γ_Z)","difficulty":2,"kind":"concept","tags":["bandersnatch","ring-vrf","ring-root","offenders"],"stem":"What exactly does the epoch root γ′_Z commit to, and what becomes of a validator whose key tuple has been zeroed by Φ because its Ed25519 key is in the offenders set?","options":["It commits to the full 336-octet validator key tuples of the pending set — Bandersnatch, Ed25519, BLS and metadata alike — as a fixed 144-octet commitment recomputed at the epoch boundary. Since Φ zeroes only the Ed25519 component the Bandersnatch half survives and keeps its index, so an offender can still submit tickets until the next rotation removes it.","It commits to the ordered Bandersnatch components of the pending key set — the validators of the coming epoch — as a fixed 144-octet commitment recomputed at the epoch boundary. An all-zero entry is not a valid curve point, so the Bandersnatch padding point is substituted for it: the ring keeps its size, every other member keeps its index, and no proof can ever be produced for that position.","It is the well-balanced Merkle root M_B over the ordered 32-octet Bandersnatch components of the pending key set and is therefore itself 32 octets, recomputed at the epoch boundary. A zeroed entry simply becomes a leaf whose opening nobody knows: the ring keeps its size, every other member keeps its index, and that is what excludes the offender from the contest.","It commits to the ordered Bandersnatch components of the active key set κ′ — the validators of the current epoch — as a fixed 144-octet commitment recomputed whenever the offenders set changes. Zeroed entries are dropped and the surviving keys re-indexed, so the ring shrinks by the number of offenders and both the root and the proofs get correspondingly cheaper."],"answer":1,"optNotes":["z 只取 32-octet 的 Bandersnatch 分量，而 eq. 6.15 的 Φ 是把整條 tuple 換成 [0, 0, …]。","eq. 6.14 的 z = O([k_b | k ∈ γ′_P]) 承諾的是 pending set，而全零鍵以 padding point 補位、索引不變。","O(s) ≡ commit(s) 是多項式承諾而非 Merkle root，definitions 也寫明 ringroot ⊂ B_144。","承諾的是 pending set 且只在 epoch 邊界重算；proof 恆 784 octets、root 恆 144，不會因 ring 變小而變便宜。"],"explanation":"eq. 6.14 的 key rotation 在 e′ > e 時把 (γ′_P, κ′, λ′, γ′_Z) 設成 (Φ(ι), γ_P, κ, z)，其中 z = O([k_b | k ∈ γ′_P])——所以 ring root 承諾的是 pending set γ′_P（下一個 epoch 才上線的那組）的 Bandersnatch 分量。§G 的 O(s) ≡ commit(s)，而 §3 與 definitions 都寫明 ringroot ⊂ B_144（B_144 是 blob 集合 𝔹 的 144-octet 子集；別寫成 𝕐_144，𝕐 是 eq. 11.5 的 avspec 集合），是固定 144 octets、與 ring 大小無關的 commitment。eq. 6.15 的 Φ(k) 在 k_e ∈ ψ′_O 時把「整個」key tuple 換成 [0,0,…]，不是只清 Ed25519 那 32 octets。§G 結尾那句就是為這種情況準備的：「Note that in the case a key k̃ has no corresponding Bandersnatch point when constructing the ring, then the Bandersnatch padding point as stated by Hosseini–Galassi should be substituted.」——用 padding point 補位而不是把它刪掉，ring 長度與每個成員的索引都不變，只是那個位置沒有人握有對應私鑰，因此永遠生不出合法 proof。若真的把零鍵刪掉再重新編號，所有人的 ring 成員位置都會位移，跨實作的 root 也就對不起來，這是 ring verifier 快取常見的災難（團隊 #1040/#1041 就是把 verifier 從「以 epoch 為 key」改成「以 validator-set hash 為 key」）。","trap":"三個字要記牢：pending（不是 active）、144 octets（不是 32）、padding point（不是刪除）。"},{"id":"c3-appG-output-vs-signature","ch":"G","section":"G Bandersnatch VRF (IETF VRF vs Ring VRF)","gpRef":"§G (Y as output(·)‥32); §3 signing schemes; eq. 6.6 (ticket), 6.16 (ticket seal), 6.30 (tickets extrinsic)","difficulty":3,"kind":"concept","tags":["bandersnatch","vrf-output","ticket-identifier","safrole"],"stem":"The ticket accumulator keeps only tuples of a 32-octet identifier and an entry index; the 784-octet ring proof from the extrinsic is thrown away once verified. An epoch later the sealer of a slot must present a 96-octet signature whose output equals that stored identifier, even though it now signs the serialized unsigned header rather than an empty message. What makes that possible?","options":["Because the stored identifier is the Blake2b hash of the ring proof, and a Bandersnatch ring proof is deterministic, so the same key and context regenerate the identical proof bytes and hence the identical hash; the message plays no part in that hash. The ticket's context is the ticket-seal string with η′_2 and the entry index, the seal's is the same string with η′_3, and the entropy rotation makes those two byte strings equal one epoch later.","Because a VRF output is a high-entropy hash influenced by the context but not by the message, fixed by the secret key and the input alone. The ticket's context is the ticket-seal string with η′_2 and the entry index; the seal's is the same string with η′_3 and the ticket's entry index, and the entropy rotation makes those two byte strings equal one epoch later, so the same key yields the same 32 octets under either signature type.","Because the identifier is derived from η′_2 together with the entry index alone, so every validator can recompute every ticket identifier without ever seeing the proof; the signature contributes only the proof of the right to use it, which is why the proof itself need not be retained. One epoch later the seal signs under η′_3, but since the identifier never depended on a secret key, the sealer need only exhibit the same entry index.","Because the seal republishes the stored ring proof inside the seal field — the 96-octet form is that same proof with the zero-knowledge portion stripped, which is exactly why the two sizes differ — so its output is trivially unchanged no matter what is signed. The context does move from η′_2 to η′_3 across the epoch boundary, but a stripped proof carries its original output along with it, so the stored identifier still matches."],"answer":1,"optNotes":["96-octet IETF 簽章與 784-octet ring proof 是兩種位元串，雜湊不可能相同；Y(s) 取的是 VRF output 本身。","§3 明說 VRF output「influenced by x but not by m」，而 entropy 輪轉讓投票時的 η′_2 正是一個 epoch 後的 η′_3。","那樣 ticket 就毫無私鑰綁定、人人可奪 slot；eq. 6.16 要求 i_y = Y(H_S)，H_S 必須由 H_A 這把私鑰簽出。","eq. 6.16 的 H_S 是重新產生的 96-octet IETF 簽章，不是舊 ring proof 剝掉某部分之後的片段。"],"explanation":"§3 的關鍵句：「both define a VRF output, a high entropy hash influenced by x but not by m」，§G 則寫 Y(s) ≡ output(x | x ∈ ⟨…⟩)‥32，也就是取 VRF output 的前 32 octets。§6 定義新 ticket 為 n = [(y ← Y(i_p), e ← i_e) | i ∈ E_T]，γ_A 依 y 排序取最小的 E 個，全程沒有保留 784-octet 的 proof。到了下一個 epoch，eq. 6.16 要求 i_y = Y(H_S) 且 H_S ∈ ⟨H_A, X_T ⌢ η′_3 ⌢ i_e, E_U(H)⟩。兩邊 context 之所以逐 byte 相同，是因為 entropy 每個 epoch 輪轉 (η′_1, η′_2, η′_3) ← (η_0, η_1, η_2)：投票當下的 η′_2，正是一個 epoch 後的 η′_3；entry index 也一路帶著。message 一邊是空序列、一邊是 E_U(H)，但 message 不影響 output，所以同一把私鑰照樣算出同一個 y。這也解釋了為什麼「ticket 不能被搬到別的 epoch」：換 epoch 就換 η，context 一變 y 就變，舊 y 進不了新的 γ_A；順帶一提 ticket 跟 core 完全無關，validator→core 是 eq. 11.21 的 shuffle 在管，別把兩者混談。","trap":"先分清楚兩個東西：signature／proof 是「可丟的憑證」，Y(·) 的 VRF output 才是「進 state 的身分」。output 綁 key＋context，不綁 message。"},{"id":"c3-appH-code-shardcount-080","ch":"H","section":"H Erasure Coding","gpRef":"eq. H.1 (𝒟); eq. 6.8 (𝕍); eq. 11.5 (a_v), eq. 11.31 (∀r ∈ I: (r_s)_v = |κ′|); §14 availability specifier","difficulty":2,"kind":"code","tags":["erasure-coding","delta-0.8.0","constants","tiny-vs-full"],"stem":"The team's Go tree is on GP 0.7.2 and pins the erasure-coding rate as shown. GP 0.8.0 replaces the fixed rate with the function 𝒟(v). What is the minimal correct migration, and what does it do to the 6-validator tiny configuration?","code":{"lang":"go","caption":"internal/types/const.go (mode setters + package constants) and internal/work_package/work_package.go (buildBCloud)","src":"// SetTinyMode()                     // SetFullMode()\n\tECPiecesPerSegment = 1026         //   ECPiecesPerSegment = 6      // W_P\n\tECBasicSize        = 4            //   ECBasicSize        = 684    // W_E\n\n// erasure coding constants\n// 342:1023 (Appendix H)\nconst (\n\tDataShards  = 342\n\tTotalShards = 1023\n)\n\n// buildBCloud\n\tpadded := PadToMultiple(bundle, types.ECBasicSize)\n\n\tshards, err := erasurecoding.EncodeDataShards(padded, types.DataShards, types.TotalShards-types.DataShards)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\thashedShards := make([]types.OpaqueHash, len(shards))\n\tfor i, shard := range shards {\n\t\thashedShards[i] = hash.Blake2bHash(types.ByteSequence(shard))\n\t}"},"options":["Every one of these numbers becomes a function of the assuring-set size that the report itself carries: the total is that size (which the on-chain rule pins to |κ′|), the data-shard count is the largest d with 2d dividing W_G and d no greater than v/3 + 1, and the pad width is twice that. On tiny that gives 3 data shards out of 6, a pad width of 6 and 684 pieces per segment, so the old 4 / 1026 pair must go.","Only the total needs to follow the assuring-set size that the report itself carries; the data-shard count is fixed by the segment size alone, since 𝒟 is the largest d with 2d dividing W_G, and the pad width is twice that. Tiny therefore keeps its 4 and its 1026 pieces per segment while only the total becomes variable, and buildBCloud needs no change beyond reading the report's shard-count field.","Set the data-shard count to v/3 + 1 unconditionally, the total to the assuring-set size the report carries, and the pad width to twice the count. Because the set of legal validator-set sizes contains only multiples of three, the side condition that twice the count divide the segment size is automatically satisfied and can be dropped; tiny becomes 3 out of 6 with 684 pieces per segment and full stays 342 out of 1023.","Nothing in this file changes beyond the segment constants. 𝒟(v) governs only the Import-DA segment path, so the audit-DA bundle keeps its 342:1023 rate and its 684-octet pad width, while the segment path alone switches to the report's own shard count; that asymmetry is exactly why the availability spec gained a shard-count field, and why the tiny pair stays 4 / 1026 rather than 3 / 684."],"answer":0,"optNotes":["三個數都成為 a_v 的函數：total = a_v、d = 𝒟(a_v)、pad 寬 2d，tiny 因此是 3/6 與 684 pieces。","丟掉了 eq. H.1 的候選集合 N_{v/3+2}：沒有 v/3+1 這個上界，最大的 d 會變成 2,052。","數值恰好對，錯在理由與通用性：v = 1002 時 335 不整除 2,052，真正的 𝒟(1002) = 228。","§14 的 b♣ = H#(C^{a_v}_{⌈|b|/z⌉}(𝒫_z(b)))，bundle 路徑一樣吃 a_v 與 z = 2·𝒟(a_v)。"],"explanation":"GP 0.8.0 的 eq. H.1：𝒟(v ∈ 𝕍) ≡ max({d | d ∈ N_{v/3+2}, W_G mod 2d = 0})，也就是「不超過 v/3+1 且 2d 能整除 W_G = 4,104 的最大 d」；配合 eq. 6.8 的 𝕍 ≡ {3c | c ∈ N_{2…C+1}}（§6 原文：「always a multiple of 3 between 6 and 3C」），rate 不再是常數而是每份 report 自帶的參數。eq. 11.5 讓 availability spec 多了 a_v ∈ 𝕍，緊接著 eq. 11.31 規定 ∀r ∈ I：(r_s)_v = |κ′|，§14 的 availability specifier 又把 z = 2·𝒟(a_v) 當成 bundle 補零與每段切片的寬度。代進 tiny：v = 6 → v/3+1 = 3，2·3 = 6 整除 4,104，所以 𝒟(6) = 3、z = 6、W_G/z = 684 pieces per segment；程式裡 tiny 的 4 / 1026 是 0.7.x 時代的值（等於 𝒟 = 2），必須換掉，否則 padded 長度與 encoder 期望的 2·DataShards 根本不一致。整除側條件不是裝飾：v = 1002 ∈ 𝕍 時 v/3+1 = 335，但 2d | 4104 要求 d 整除 2,052，335 不合，真正的 𝒟(1002) = 228，GP 也特別提醒「the rate is least efficient when v is slightly below one of these values」。團隊的 PR #1026／#1035（original_shards(v)）與 issue #1037（|κ| ≠ V）就是這條遷移。","trap":"0.8.0 的 shard 數不是常數而是 report 欄位：先讀 a_v，再算 𝒟(a_v)，最後才 pad。tiny 從 2:6 變 3:6，每段 pieces 從 1026 變 684。"},{"id":"c3-appH-what-gets-coded","ch":"H","section":"H Erasure Coding","gpRef":"§14 availability specifier (b♣, s♣, a_u); eq. 14.12 (paged proofs); eq. 11.5; eq. H.5–H.6","difficulty":1,"kind":"concept","tags":["erasure-coding","availability","audit-da","d3l"],"stem":"For one work-report, which data does a guarantor erasure-code and hand out, and what does an individual validator end up holding?","options":["One data set: the work-report itself, zero-padded up to a multiple of twice the data-shard count and then coded into one chunk per validator, with each resulting chunk hashed; the erasure-root is the well-balanced Merkle root over those chunk hashes. The work-package bundle and the exported segments stay with the guarantors, who serve them on request during an audit, so a validator holds one 32-octet chunk hash and nothing more.","One data set: only the work-package bundle, zero-padded up to a multiple of twice the data-shard count and then coded into as many chunks as there are assurers, with each chunk hashed into a leaf of the erasure-root. The exported segments are committed to by the segment-root instead and are reconstructed on demand by re-running refine, which is why the segment-root and the erasure-root are separate fields, so a validator holds a single 32-octet bundle-chunk hash.","Two data sets: the auditable bundle, zero-padded up to a multiple of twice the data-shard count and then coded, with each resulting chunk hashed; and the exported segments together with their paged-proof segments, each coded and then transposed so that one chunk of every segment lands on the same validator. A validator holds one leaf of the erasure-root: its bundle-chunk hash concatenated with the root over its own segment column.","One data set: only the exported segments, together with their paged-proof segments, are coded and then transposed so that one chunk of every segment lands on the same validator, because only they must survive in the long-term data lake. The auditable bundle is replicated whole to every validator, which is precisely why it may be discarded soon after the block is finalized, and a validator's erasure-root leaf is just the root over its own segment column."],"answer":2,"optNotes":["work-report 只有幾 KB 而且本來就上鏈；a_u 的每片 leaf 也是 64 octets 而非單一 chunk hash。","refine 的輸入（imported segments）本身就得先能取回，這正是長期 D³L 存在的理由。","§14 明寫 guarantor 要編碼並分發「two data sets」，validator 的 leaf 是 bundle chunk hash 接自己那欄的 M_B root。","把 bundle 全量複製 1023 份正是 audit DA 要避免的事；它短命是因為只需撐到該區塊 final。"],"explanation":"§14 講得很直接：「Guarantors are required to erasure-code and distribute two data sets: one blob, the auditable bundle containing the encoded work-package, extrinsic data and self-justifying imported segments which is placed in the short-term Audit DA store; and a second set of exported-segments data together with the Paged-Proofs metadata.」availability specifier 的定義式把兩條路寫成 b♣ = H#(C^{a_v}_{⌈|b|/z⌉}(𝒫_z(b)))（先用 𝒫_z 補零到 z = 2·𝒟(a_v) 的倍數，再切片編碼，每片 chunk 各做一次 Blake2b）與 s♣ = M_B#(ᵀ C^{a_v}#_{W_G/z}(s ⌢ P(s)))（每個 segment 各自編碼、轉置後每個 validator 拿到自己那一欄，再對該欄取 M_B root）；最後 a_u = M_B([⌢x | x ∈ ᵀ[b♣, s♣]])，所以每個 validator 對應到 erasure-root 的一片 leaf＝「它的 bundle chunk hash ⌢ 它的 segment 欄 root」，共 64 octets。eq. 11.5 的說明也印證：「the root of a binary Merkle tree whose leaves are the a_v chunks produced by erasure-coding the work-package bundle and exported segments. As one chunk is distributed to each assurer, the number of chunks must equal the size of the assuring validator set.」segment-root 與 erasure-root 之所以是兩個欄位，是因為前者承諾 segment 內容、後者承諾分片配置。","trap":"兩條線分開記：bundle 先 𝒫_z 補零→編碼→每片各做一次 Blake2b；segments 是 s ⌢ P(s) 一起編碼→轉置→每欄取 M_B root。erasure-root 的一片 leaf ＝同一個 validator 在這兩條線上的結果接起來。"},{"id":"c3-appH-rate-and-field-rationale","ch":"H","section":"H Erasure Coding","gpRef":"eq. H.1 (𝒟) and the §H opening paragraph; eq. 6.8 (𝕍); eq. 11.17 (availability super-majority)","difficulty":2,"kind":"rationale","tags":["erasure-coding","rationale","gf65536","threshold","delta-0.8.0"],"stem":"Appendix H says the coding rate 'is derived from' three separate considerations. Which account of them is right, and why is the code built over GF(2¹⁶) rather than over single octets?","options":["Reconstruction must survive almost two-thirds of the validators being malicious or incapacitated, which puts the data-shard count near v/3 + 1 and dovetails with the 2/3+1 assurance super-majority; the field is 16-bit, so one code word is an octet pair and the evaluation points can index up to v distinct validators; and twice the shard count must divide the 4,104-octet segment size so that a segment codes with no padding at all, which is why the count is the largest such value rather than exactly v/3 + 1.","The rate is chosen so that a two-thirds super-majority of assurances is itself the reconstruction threshold, which puts the data-shard count near 2v/3; the field is 16-bit purely because a segment is 4,104 = 2 × 2,052 octets and the code words must tile it evenly; and the divisibility side condition exists only to keep the last chunk from needing a length prefix, which is why the count is the largest admissible value rather than exactly 2v/3. On 1,023 validators that gives 682 data shards and 3 pieces per validator per segment.","The data-shard count is exactly ⌊v/3⌋ + 1 for every legal validator-set size, so the divisibility side condition is never active and could be dropped; GF(2¹⁶) is chosen only because 16-bit multiply-accumulate is faster than byte-wise arithmetic on modern hardware; and the 4,104-octet segment size follows from the field rather than the other way round, 4,104 being simply the smallest convenient multiple of the code-word width. On 1,002 validators that gives 335 data shards with no padding.","The rate is set so that exactly the 683 validators of a full super-majority are needed to rebuild, which is what ties availability to finality and fixes the count at 2v/3 + 1 rather than at the largest admissible value; GF(2¹⁶) is chosen because Blake2b emits 32 octets, i.e. exactly 16 code words, so a chunk hash and a chunk share a representation; and twice the shard count still divides the 4,104-octet segment size, since 1,366 divides 4,104."],"answer":0,"optNotes":["三個理由與 §H 開頭的並列完全對應：近 2/3 容錯給出上界、16-bit field、segment 免 padding 的整除條件。","682 早已超出 N_{v/3+2} 的上界 342，而且 2·682 = 1,364 不整除 4,104，切不出整數 pieces。","v = 1002 時 335 不整除 2,052（𝒟 = 228）；GF(2⁸) 只有 256 個點，連 1,023 個 validator 都編不完。","算術就錯了：1,366 × 3 = 4,098 尚餘 6；Blake2b 輸出 32 octets 與選 GF(2¹⁶) 也毫無因果關係。"],"explanation":"§H 開頭原文把三個理由並列：「This rate is derived from the fact we wish to be able to reconstruct even should almost two-thirds of the v validators be malicious or incapacitated, the 16-bit Galois field on which the erasure-code is based and the desire to support, for simplicity, encoding segments of size W_G without padding.」對應到 eq. H.1 的 𝒟(v) ≡ max({d | d ∈ N_{v/3+2}, W_G mod 2d = 0})：上界 v/3+1 來自第一點（只要有 𝒟(v) 片就能重建，等於容忍將近 2/3 的節點消失，與 eq. 11.17 的 2/3+1 assurance 門檻互相搭配，而不是要求 2/3 的 chunk）；「2d 整除 4,104」來自第三點，所以 segment 用 k = W_G/(2𝒟(v)) 永遠是整數、完全不必 padding；而取 max 而非直接等於 v/3+1，正是因為整除條件會把它往下拉——GP 自己舉例「when v = 1022, the rate is approximately 1:4.5」——但要注意 1022 ∉ 𝕍（𝕍 只收 6 到 1023 之間 3 的倍數），這是個假想值：也只有在 v 不是 3 的倍數時，H.1 的上界該讀成 ⌊v/3⌋+1 還是 v/3+1 才會有差（取 ⌊1022/3⌋+1 = 341 才得到 𝒟 = 228、rate ≈ 1:4.48，與 GP 自己寫的 1:4.5 相符；讀成 342 則是 1:2.99）。對每個合法的 v 兩種讀法一致（v/3 ∈ ℕ），真正能驗證整除側條件確實會生效的合法案例是 v = 1002：v/3+1 = 335 不整除 2,052，𝒟(1002) = 228。至於為什麼是 GF(2¹⁶)：code word 就是一個 octet pair，validator i 被映成 field element ĩ = Σ i_j v_j（Cantor basis），evaluation point 必須每個 validator 各一個且互異，GF(2⁸) 只有 256 個點，連 1,023 個 validator 都編不完，這是 16-bit 最直接的必要性（§H 只把 16-bit GF 列為三項考量之一，並未替它們排序）。0.7.2 時這一切是寫死的 342:1023，0.8.0 才為了支援較小的 validator set 而變成以 v 為參數的函數。","trap":"「三分之一容錯」講的是 chunk 門檻 𝒟(v) ≈ v/3+1（任 1/3 即可重建），「三分之二」講的是 assurance 的 super-majority——兩個門檻方向相反，別對調。"},{"id":"c3-ch03-bounded-numeric-blob-types","ch":"3","section":"3.4 Numbers / 3.7.4 Octets and Blobs","gpRef":"§3.4; §3.7.4; §3.8.1","difficulty":1,"kind":"concept","tags":["notation","types","blobs","numbers"],"stem":"Almost every type in the Gray Paper is built from the vocabulary fixed in §3.4 and §3.7.4: N, N_n, Z, N_L, B, B_x and B_$. Which statement reads all of them the way the GP defines them?","options":["The subscripted natural set includes the subscript itself, so N_n has n + 1 members; N_L is equivalent to N_{2^64} because octet-sequence lengths are carried as 64-bit values; B_x is the set of blobs of length exactly x and B_$ the subset which are ASCII-encoded strings; and an octet, though bijective with a natural under 256, is not the same entity under serialization.","The subscripted natural set is the naturals strictly below the subscript, so N_n has n members; N_L is the set of octet sequences shorter than 2^32 rather than the set of their lengths; B_x is the set of blobs of at most x octets and B_$ the subset which are ASCII-encoded strings; and an octet serializes exactly as the general natural-number encoding does.","The subscripted natural set is the naturals strictly below the subscript, so N_n has n members; N_L is the GP's shorthand for the set of *lengths* of octet sequences and is equivalent to N_{2^32}; B_x is the set of blobs of length exactly x and B_$ the subset which are ASCII-encoded strings; and an octet, though bijective with a natural under 256, is not the same entity for serialization.","The subscripted natural set is the naturals strictly below the subscript, so N_n has n members; N_L is the set of lengths of octet sequences and is equivalent to N_{2^32}; B_x is the set of blobs of length exactly x but B_$ is the subset whose leading octet is a sentinel marker; and an octet just is a natural under 256, so the two serialize identically."],"answer":2,"optNotes":["N_n 是嚴格小於（恰 n 個元素），且 N_L 等價於 N_{2^32} 而不是 N_{2^64}。","N_L 是**長度**的集合而非 blob 集合；B_x 是恰好 x，且 octet 一律序列化為自身。","四項全對上 §3.4 與 §3.7.4：嚴格小於、長度集合、恰好 x 個 octet、octet 與自然數序列化不同。","B_$ 是 ASCII 字串子集、與 sentinel 標記無關；octet 與自然數在序列化上明確不等價。"],"explanation":"§3.4：「N denotes the set of naturals including zero whereas N_n implies a restriction on that set to values less than n. Formally, N = {0, 1, …} and N_n = {x | x ∈ N, x < n}」——嚴格小於，所以 N_n 有 n 個元素。同節：「we denote N_L as the set of lengths of octet sequences and is equivalent to N_{2^32}」——N_L 是**長度的集合**（一個自然數集），不是 blob 的集合。§3.7.4：「B denotes the set of octet strings (“blobs”) of arbitrary length… B_x denotes the set of such sequences of length x. B_$ denotes the subset of B which are ascii-encoded strings」。同節最後那句是面試最愛考的：「while an octet has an implicit and obvious bijective relationship with natural numbers less than 256…we do not treat them as exactly equivalent entities. In particular for the purpose of serialization, an octet is always serialized to itself, whereas a natural number may be serialized as a sequence of potentially several octets, depending on its magnitude and the encoding variant」——這是 App. C 裡 blob 直接落地、而自然數走 E 或 compact 變體的根據。另外 §3.8.1 定義 hash 集合 H ≡ B_32。","trap":"N_L 是「長度」的集合（= N_{2^32}），不是 blob 的集合；B_x 是「恰好 x」不是「至多 x」。"},{"id":"c3-ch03-optional-none-error","ch":"3","section":"3.3 Sets / 3.2 Functions and Operators","gpRef":"§3.3; eq. 3.2 (substitute-if-nothing); applied at eq. 13.13","difficulty":1,"kind":"concept","tags":["notation","optional","none","error"],"stem":"§3.3 introduces ∅, ∇ and the optional constructor A?, and eq. 3.2 defines the substitute-if-nothing function 𝒰. §13.2 then writes a service's accumulation entry as 𝒰(S[s], (0, 0, 0)), where S is a dictionary from service index to a triple. Which reading is correct?","options":["∅ marks a term validly left without a specific value and is defined to have cardinality zero; the optional constructor gives A? ≡ A ∪ {∅}; ∇ marks an unexpected failure or an invalid value, and the GP prefers it to ⊥ so it is not confused with Boolean false; and 𝒰 yields its first argument that is not ∅ — so the entry is the service's own triple when the dictionary holds one and the all-zero triple otherwise.","∅ is the empty set itself, so it has cardinality zero only because it happens to hold no members; the optional constructor A? is a codec directive meaning the component may be omitted from the encoding rather than a set operation; ∇ is the GP's chosen spelling of Boolean false, which is why the more conventional ⊥ is avoided; and 𝒰 yields the last of its arguments that is not ∅ — so the entry is the all-zero triple whenever the dictionary holds anything at all.","∅ has cardinality one, being a distinct inhabitant that A? adds to A; ∇ marks an unexpected failure or an invalid value and the GP prefers it to ⊥ so it is not confused with Boolean false; 𝒰 is defined for exactly two arguments, a candidate and a default; and a dictionary subscript on a missing key yields ∇ rather than ∅ — which is precisely why eq. 13.13 needs its fallback.","∅ marks a term validly left without a specific value and the optional constructor gives A? ≡ A ∪ {∅}; ∇ is a synonym for ∅ reserved for the case where the absence was anticipated, so the two are interchangeable inhabitants of A?; and 𝒰 yields the first of its arguments that *is* ∅, falling back to its last argument when none of them is — so the entry is ∅ for every service that was accumulated and the all-zero triple only for the untouched ones."],"answer":0,"optNotes":["§3.3 與 eq. 3.2 逐句對上：∅ 的 cardinality 為零、A? ≡ A ∪ {∅}、∇ 表錯誤、𝒰 取第一個非 ∅。","A? 是集合運算不是 codec 指示；GP 不用 ⊥ 正是怕與 Boolean false 混淆，∇ 不是 false。","∅ 的 cardinality 依 §3.3 定義為零；eq. 3.7 的 dictionary miss 給 ∅，且 𝒰 不限兩個引數。","∇ 與 ∅ 語意相反：前者是「出錯了」，後者才是「合法地沒有值」；𝒰 取的也是非 ∅ 的那個。"],"explanation":"§3.3：「We commonly use ∅ to indicate that some term is validly left without a specific value. Its cardinality is defined as zero. We define the operation A? such that A? ≡ A ∪ {∅}」；「The term ∇ is utilized to indicate the unexpected failure of an operation or that a value is invalid or unexpected. (We try to avoid the use of the more conventional ⊥ here to avoid confusion with Boolean false…)」——∅ 與 ∇ 語意完全不同：前者是「合法地沒有值」，後者是「錯了」。eq. 3.2：𝒰(a_0, … a_n) ≡ a_x : (a_x ≠ ∅ ∨ x = n), ⋀_{i=0}^{x−1} a_i = ∅，GP 自己給的例子是 𝒰(∅, 1, ∅, 2) = 1 與 𝒰(∅, ∅) = ∅——取**第一個非 ∅** 的引數，且可以有兩個以上引數。至於 dictionary 查不到 key 時的結果：eq. 3.7 明寫 d[k] ≡ v if ∃k : (k ↦ v) ∈ d，otherwise ∅（不是 ∇）；這正是 𝒰(S[s], (0, 0, 0)) 能運作的原因——沒被 accumulate 的 service 查出 ∅，於是落到後備的全零三元組；若 dictionary miss 真的給 ∇，eq. 13.13 這個包裝就救不回來，因為 ∇ 代表的是「出錯了」而不是「合法地沒有值」。","trap":"∅ = 合法的「沒有值」；∇ = 錯誤。dictionary miss 給 ∅，不是 ∇；𝒰 取第一個非 ∅。"},{"id":"c3-ch03-ellipsis-ranges","ch":"3","section":"3.4 Numbers / 3.7 Sequences","gpRef":"§3.4 (Z_{a…b}, Z_{a…+b}); §3.7 (slicing, s[i]^⟲, last)","difficulty":2,"kind":"concept","tags":["notation","sequences","slicing","ranges"],"stem":"Let s = [10, 20, 30, 40, 50]. Applying the ellipsis conventions of GP §3.4 for integer sets and §3.7 for sequence slicing, which line is correct throughout?","options":["s_{…3} = [10, 20, 30], s_{1…+3} = [20, 30], Z_{1…3} = {1, 2, 3}, Z_{1…+3} = {2, 3, 4}, last(s) = 50, s[7]^⟲ = 30","s_{…3} = [10, 20, 30], s_{1…+3} = [20, 30, 40], Z_{1…3} = {1, 2}, Z_{1…+3} = {1, 2, 3}, last(s) = 50, s[7]^⟲ = 30","s_{…3} = [30, 40, 50], s_{1…+3} = [10, 20, 30], Z_{1…3} = {1, 2}, Z_{1…+3} = {1, 2, 3}, last(s) = 10, s[7]^⟲ = 40","s_{…3} = [10, 20], s_{1…+3} = [20, 30, 40, 50], Z_{1…3} = {1, 2, 3}, Z_{1…+3} = {1, 2, 3, 4}, last(s) = 50, s[7]^⟲ = 20"],"answer":1,"optNotes":["Z_{1…3} 是半開的 {1, 2}；…+3 是從 index 1 起算三個，Z_{1…+3} 也不從 2 起跳。","半開區間與 offset/length 逐項對上，前綴切片與 7 mod 5 = 2 也都算對。","把前綴切片讀成後綴、把 …+ 當成從頭取，last(s) 取的更是第一個元素而非最後。","把整數區間讀成閉區間、切片又少取一格；7 mod 5 = 2 應得 s[2] = 30 而非 s[1]。"],"explanation":"§3.4：「Z_{a…b} = {x | x ∈ Z, a ≤ x < b}. E.g. Z_{2…5} = {2, 3, 4}」——**半開**區間；「We denote the offset/length form of this set as Z_{a…+b}, a short form of Z_{a…a+b}」。§3.7 對序列用同一套省略號：「A range may be denoted using an ellipsis for example: [0, 1, 2, 3]_{…2} = [0, 1] and [0, 1, 2, 3]_{1…+2} = [1, 2]」——下標只有結尾時是「取前 n 個」（等價於 index < n），有 …+ 時是 offset/length。同節另有兩個記號：「We denote modulo subscription as s[i]^⟲ ≡ s[i mod |s|]」與「We denote the final element x of a sequence s = [..., x] through the function last(s) ≡ x」。GP 全篇沒有任何「a 到 b 皆含」的閉區間記法——從 PDF 抄公式時最常見的錯誤就是把它讀成閉區間。另外會在正文遇到 §3 從未定義的 N_{a…b}（preamble 的 \\Nclamp，例如 eq. 6.8 的 𝕍 ≡ {3c | c ∈ N_{2…C+1}}）：它沿用同一套半開讀法，C = 341 時 c 的上界是 341（c < 342），𝕍 的最大值才會剛好是 3 · 341 = 1023。","trap":"GP 只有兩種形式：半開的 a…b，與 offset/length 的 a…+b；序列切片沿用同一套，沒有閉區間。"},{"id":"c3-ch03-prime-dagger-record","ch":"3","section":"3.6 Tuples / 3.7 Sequences","gpRef":"§3.6 (named tuple components); eq. 4.1 (σ′ ≡ Υ(σ, B)); §4 state-transition dependency graph; eq. 13.1–13.3","difficulty":3,"kind":"concept","tags":["notation","tuples","prior-vs-posterior","state"],"stem":"Eq. 13.1–13.2 declare π ≡ (π_V, π_L, π_C, π_S) with (π_V, π_L) ∈ ⟦(b ∈ N, t ∈ N, p ∈ N, d ∈ N, g ∈ N, a ∈ N)⟧², and §13.1 then works through π_V†, π_V‡ and π′_V. An interviewer asks you to read that notation aloud. Which reading is right?","options":["∈ and the tricolon are interchangeable spellings of the same binding, so a field may equally be read back by name or by position; squaring the sequence-set says each of the two records is itself a sequence, one six-field entry per validator; §3 defines the prime as 'the value after the extrinsic has been applied'; and the dagger marks a value that has already been through the epoch rollover while the double-dagger marks one that has not.","A type declaration and a concrete value are both written with ∈, the tricolon being reserved for the key/value pairs of a dictionary, so the six counters are positional only and must be addressed by index rather than by name; squaring the sequence-set says each of the two records is itself a sequence, one six-field entry per validator; the prime denotes the Grandpa-finalized value of a state component, so π′ is only well defined once finality has caught up with the chain; and dagger and double-dagger mark the same component as it stood on a fork that was later discarded.","A type declaration introduces each component with ∈ while a concrete value binds its fields with the tricolon, and either way a field is read back by subscripting its name; squaring the sequence-set means the pair holds exactly two records in total, one per epoch, so each record carries a single validator's six counters; the prime marks the value that will be current at the start of the next epoch; and dagger and double-dagger are two further components of σ, each with its own state-trie key.","A type declaration introduces each component with ∈ while a concrete value binds its fields with the tricolon, and either way a field is read back by subscripting its name; squaring the sequence-set says each of the two records is itself a sequence, one six-field entry per validator; the undecorated symbol is the prior state and the primed one the posterior — a convention the GP fixes not in §3 but alongside σ′ ≡ Υ(σ, B) — and dagger and double-dagger mark intermediate values inside a single transition that appear in neither σ nor σ′."],"answer":3,"optNotes":["∈ 與 tricolon 不可互換、沒有位置索引；prime 不在 §3 定義，dagger 與 double-dagger 的先後也說反了。","型別宣告用 ∈、具體值用 tricolon，欄位一律以名字下標；prime 也與 finality 無關。","上標 2 是把整個序列集合取平方：π_V 與 π_L 各自是序列、每個 validator 一筆；dagger 也沒有 trie key。","prime 由 eq. 4.1 旁的文字定下、dagger 出自 §4 的 dependency graph，兩者都不在 §3。"],"explanation":"§3.6 Tuples：「we may denote a tuple with two named natural components a and b as T = (a ∈ N, b ∈ N). We would denote an item t ∈ T through subscripting its name, thus for some t = (a ⦂ 3, b ⦂ 5), t_a = 3 and t_b = 5」——型別宣告用 ∈、具體值用 tricolon（⦂），欄位一律用**名字**下標讀取。tricolon 的位置也要記牢：§3.5 的 dictionary 用的是 ↦（k ↦ v），tricolon 只出現在 §3.6 具體 tuple 值的欄位綁定。eq. 13.2 的上標 2 則是把整個「序列集合」取平方：π_V 與 π_L **各自**都是一個序列，eq. 13.3 再釘死長度 |π_V| = |κ|、|π_L| = |λ|（0.8.0 改用 |κ|/|λ| 取代常數 V，根源是 eq. 6.8 的 𝕍 ≡ {3c | c ∈ N_{2…C+1}} 與 κ, λ ∈ ⟦𝕂⟧_𝕍——validator-set 大小在 0.8.0 是**可變**的）。最刁鑽的一點：prime 的意義**不是**在 §3 定義的——§3 只談 typography、sets、numbers、dictionaries、tuples、sequences、cryptography，通篇沒有 prime 字樣。它是在 §4 的 eq. 4.1 旁以文字定下的：「Where σ is the prior state, σ′ is the posterior state, B is some valid block and Υ is our block-level state-transition function」。dagger 同樣出自 §4 的 dependency graph 段落：「The only synchronous entanglements are visible through the intermediate components superscripted with a dagger」——π_V† / π_V‡ 是單次 transition 內部的中間值，既不在 eq. 4.4 的 σ 分量清單裡，也沒有自己的 state-trie key（π 整體只佔
