":"PVM/host_call_general.go (write, after PR #980)","src":"\tvalue, storageRawKeyExists := a.StorageDict[string(storageRawKey)]\n\t// ...\n\tif storageRawKeyExists {\n\t\tfootprintItems, footprintOctets = service_account.CalcStorageItemfootprint(string(storageRawKey), value)\n\t\tl = uint64(len(value))\n\t} else { // ... (elided: key only present in the not-yet-decoded state key-vals)\n\t\tl = NONE\n\t}\n\t// ...\n\tif vz == 0 { // remove storage\n\t\tdelete(a.StorageDict, string(storageRawKey))\n\t} else if input.VM.Mem.IsReadable(vo, vz) { // storage append/update\n\t\tstorageRawData := input.VM.Mem.Read(vo, vz)\n\t\t// ...\n\t\tnewMinBalance := service_account.CalcThresholdBalance(newItems, newOctets, a.ServiceInfo.DepositOffset) // a_t\n\t\tif newMinBalance > a.ServiceInfo.Balance {\n\t\t\tinput.VM.Registers[7] = FULL\n\t\t\treturn OmegaOutput{ExitReason: ExitContinue, Addition: input.Addition}\n\t\t}\n\t\t// balance check passed, now apply the storage mutation\n\t\ta.StorageDict[string(storageRawKey)] = storageRawData\n\t\t// ...\n\t} else {\n\t\treturn OmegaOutput{ExitReason: ExitPanic, Addition: input.Addition}\n\t}\n\t// ...\n\tinput.VM.Registers[7] = l"},"options":["If the post-write a_t ≤ a_b the value is stored and φ′_7 = 100, the length of the value being replaced; if a_t > a_b, φ′_7 = FULL and the account is handed back unchanged (s′ = s) — the pre-fix code had already mutated the shared Go map, so the FULL write leaked (#979)","On success φ′_7 = OK (0); a_t > a_b cannot occur for an overwrite because the storage deposit (B_I per item, B_L per octet) is charged only when a key is first created, never when its value changes size, so Ω_W needs no threshold check on this path","On success φ′_7 = 5000, the length of the value just written; if a_t > a_b the value is still stored, φ′_7 = FULL and the shortfall is debited from the balance at the service's next accumulation — so all the fix had to change was the register value, not the order of the map mutation","If a_t > a_b the host call exits ☇ (panic) so that the whole accumulation collapses to the checkpointed context y; otherwise φ′_7 = 100, the length of the value being replaced, and the value is stored — the collapse is exactly what made the pre-fix map mutation harmless"],"answer":0,"explanation":"Ω_W（write = 5）定義：[k_O, k_Z, v_O, v_Z] = φ_7…φ_10；k = μ[k_O..+k_Z]（不可讀 → error）；a = s 但 a_storage[k] = μ[v_O..+v_Z]（v_Z = 0 時改為刪除 k；value 範圍不可讀 → error）；l = |s_storage[k]| 若 k ∈ keys(s_storage)，否則 NONE；(ε′, φ′_7, s′) = (☇, φ_7, s) 當 k = error ∨ a = error；(▸, FULL, s) 當 a_minbalance > a_balance；(▸, l, a) 否則。所以成功時回傳的是「被取代的舊值長度」100（不是新長度 5000，也不是 OK；key 原本不存在才回 NONE），FULL 時 s′ = s 一字不改。說「FULL 之後押金留到下一輪 accumulate 再補扣、修正只是改回傳值」的那組有兩個問題：GP 的 FULL 分支回傳的是 s（原封不動的帳戶），沒有任何「欠款」概念，而 #979 的根因正是「先改 map 再檢查」的順序——只改暫存器不會讓被污染的 StorageDict 復原。說「Ω_W 這條路徑根本不需要門檻檢查」的那組把 a_t 當成只在建 key 時計一次的固定值；說 a_t > a_b 會 ☇ 的那組則混淆了兩種失敗：☇ 是記憶體錯誤（k = error ∨ a = error），餘額不足是可續行的 FULL——PVM 會帶著 FULL 繼續跑下一條指令，context 不會被丟棄，所以被污染的 map 會一路寫進 δ′。a_t（eq. 9.8）= max(0, B_S + B_I·a_i + B_L·a_o − a_f)，而 a_o 含每筆 storage 的 34 + |k| + |v|，所以把 100 octets 換成 5,000 octets 會拉高 a_t，「押金只在建 key 時收」是錯的。你們的 bug #979（fuzz seed 3785638964 step 15419）：write 先改了 StorageDict 再檢查門檻，Go map 淺複製共用底層 map，FULL 的寫入仍被持久化 → state root mismatch；PR #980 改成先算 newMinBalance 再改 map（即上面的順序）。另外 accumulate 中 write 經 G（eq. B.12）包裝：x*_self = 回傳的 s′，所以同一次 accumulate 之後的 read/info 看得到新值。","trap":"write 回傳「舊長度或 NONE」，不回傳 OK；v_Z = 0 是刪除；FULL 時必須零副作用。"},{"id":"b2-appB-read-cross-service-pure","ch":"B","section":"B.5 General Functions — read","gpRef":"§B.5 `read` = 4 (Ω_R); eq. B.11–B.12 (F, G)","difficulty":3,"kind":"code","tags":["host-calls","read","storage","fuzz-bug","accumulation"],"stem":"Excerpt from the team's Ω_R (`read`) after fix #938, which added the `callerServiceID == serviceID` guard (s* = φ_7, or the caller when φ_7 = 2^64−1). Accumulating service A reads a storage key of service B, which is not accumulating in this block. Which statement is correct?","code":{"lang":"go","caption":"PVM/host_call_general.go (read, after PR #938)","src":"\tvar a types.ServiceAccount\n\tcallerServiceID := serviceID\n\tif sStar == uint64(serviceID) {\n\t\ta = delta[serviceID]\n\t} else if value, exists := delta[types.ServiceID(sStar)]; exists {\n\t\ta = value\n\t\tserviceID = types.ServiceID(sStar)\n\t} else {\n\t\tinput.VM.Registers[7] = NONE\n\t\treturn OmegaOutput{ExitReason: ExitContinue, Addition: input.Addition}\n\t}\n\tstorageRawKey := input.VM.Mem.Read(ko, kz)\n\tv, exists := a.StorageDict[string(storageRawKey)]\n\tstorageValueFromKeyVal := getStorageFromKeyVal(input.Addition.GeneralArgs.StorageKeyVal, serviceID, storageRawKey)\n\tif !exists {\n\t\tif storageValueFromKeyVal == nil { // check storage state key-val\n\t\t\tinput.VM.Registers[7] = NONE\n\t\t\treturn OmegaOutput{ExitReason: ExitContinue, Addition: input.Addition}\n\t\t} else {\n\t\t\tv = *storageValueFromKeyVal\n\t\t\t// ...\n\t\t\tif callerServiceID == serviceID {\n\t\t\t\ta.StorageDict[string(storageRawKey)] = v\n\t\t\t\tinput.Addition.AccumulateArgs.ResultContextX.PartialState.ServiceAccounts[serviceID] = a\n\t\t\t\tremoveStorageFromKeyVal(input.Addition.GeneralArgs.StorageKeyVal, serviceID, storageRawKey)\n\t\t\t}\n\t\t}\n\t}"},"options":["The read must observe the posterior state being built in this block — including writes by services accumulated earlier in the same round — so the cached value has to be refreshed from the accumulation context on every read rather than removed from the pool, and the guard is itself a bug because it suppresses that refresh for every s* ≠ s","The read must be served from the lookup-anchor snapshot exactly as `historical_lookup` does, so mutating the current-state cache is only a performance concern and can never change δ′; the guard merely avoids decoding B's key-vals twice, and the state-root divergence came from the merge rule alone","Ω_R(ϱ, ω, μ, s, s, d) may look up any account in d but hands back only the caller's account s (mirrored into x by G); a read of B is a pure lookup that must leave B untouched — before the guard, B's key-val was evicted from the unmatched pool, B's entry vanished from the merged δ′ and the state root diverged","Reading another service's storage is not permitted by Ω_R: for s* ≠ s the call must return WHO without touching memory or the key-val pool, so in a compliant implementation the branch that reaches B's account is unreachable and the guard is merely defensive — cross-service inspection is what `info` and `historical_lookup` are for"],"answer":2,"explanation":"Ω_R（read = 4）：s* = s 若 φ_7 = 2^64−1，否則 φ_7；a = s（呼叫者自己，含本次已 write 的內容）若 s* = s；d[s*] 若 s* ∈ keys(d)；否則 none。[k_O, k_Z, o] = φ_8…φ_10、v_Z = φ_12、f = min(φ_11, |v|)、l = min(v_Z, |v| − f)；v = error（key 範圍不可讀）→ ☇；a = none 或 k ∉ keys(a_storage) → NONE（不是 WHO——WHO 是 transfer/eject/provide 等找不到 service 時用的）；否則寫 v[f..f+l] 到 μ[o..+l] 並回傳 |v|。read 的 mutation 只有 (ε′, φ′_7, μ′)，s′ = s；在 accumulate 的 F（eq. B.11）中 read 被 G 包起來，G 只把「呼叫者自己的帳戶」寫回 x_self（eq. B.12），所以跨 service 的讀取在 GP 裡是純函數，不可能改動 B。d 是 (x_u)_d，即 Ψ_A 拿到的 partial state 快照（Δ1 對同一輪的每個 service 傳同一份 e，§12 平行累加），因此同一輪其他 service 的寫入本來就看不到，「觀察 posterior 狀態」是錯的；historical_lookup（Ω_H）只存在於 refine，依 lookup-anchor 時間查 preimage，跟 read 無關。說「跨 service 讀取根本不合法、s* ≠ s 要回 WHO」的那組與 Ω_R 的簽名矛盾：d（partial state 的 accounts）就是為了讓 s* ≠ s 能查而傳進來的，而且查不到時回的是 NONE 不是 WHO；info（Ω_I）確實可查任意 service 的中繼資料，但它讀不到 storage，historical_lookup 更只存在於 refine。說「guard 本身是 bug、應該每次從 context 重新整理」的那組除了 posterior 的誤解外還多錯一層：refresh 對象是 B 的本地副本，而 B 這輪根本不會被寫回 d′，refresh 多少次都救不了「輸出裡少了 B 的 key 就等於刪除」。說「反正照 lookup-anchor 快照讀、改快取只是效能問題、分歧來自 merge 規則」的那組把因果顛倒：merge 採交集語意是既定設計（#880），真正的缺陷是 read 這個純函數留下了副作用。你們的 #938（bug id 1776702160_6218）：A 讀 B 的 key 時，把 B 的 entry 從 UnmatchedKeyVals cache 移除當成最佳化，但 B 這個 block 沒有 accumulate，其本地帳戶副本從未寫回 d′，而 #880 的 merge 採交集語意（任何輸出缺少的 key 視為被刪除）→ B 的 storage 全局消失、state root mismatch；修法就是只在 callerServiceID == serviceID 時才快取並移除。","trap":"read/lookup/info 找不到回 NONE（2^64−1）；跨 service 讀取是唯讀快照，只有自己的帳戶會經 G 寫回 x。"},{"id":"b2-appB-unknown-hostcall-oog","ch":"B","section":"B.2/B.3/B.4 — context mutator F, default case","gpRef":"eq. B.2, B.6, B.11 (default case); eq. B.13 (C); M_∅ in App. I","difficulty":2,"kind":"code","tags":["host-calls","gas","fuzz-bug","delta-0.8.0"],"stem":"During accumulation a service executes `ecalli 9` (`machine`, a refine-only call) with ϱ = 300 gas remaining. The team's dispatcher routes ids that are not in the invocation's table to hostCallException (below, after PR #992). What does GP 0.8.0 prescribe for this situation?","code":{"lang":"go","caption":"PVM/host_call_general.go (hostCallException / chargeGasAndCheck, after PR #992)","src":"func hostCallException(input OmegaInput) (output OmegaOutput) {\n\tif result := chargeGasAndCheck(&input); result != nil {\n\t\treturn *result\n\t}\n\tinput.VM.Registers[7] = WHAT\n\treturn OmegaOutput{\n\t\tExitReason: ExitContinue,\n\t\tAddition:   input.Addition,\n\t}\n}\n\nfunc chargeGasAndCheck(input *OmegaInput) *OmegaOutput {\n\t*input.VM.Gas -= 10\n\tif *input.VM.Gas < 0 {\n\t\treturn &OmegaOutput{\n\t\t\tExitReason: ExitOOG,\n\t\t\tAddition:   input.Addition,\n\t\t}\n\t}\n\treturn nil\n}"},"options":["The machine panics (☇) with no gas charged: a host-call id outside the invocation's table is treated like an invalid instruction, and the accumulation collapses to the checkpointed context y","The default branch of F charges M_∅ = 1000 first: ϱ′ = 300 − 1000 < 0, so the invocation exits ∞ and Ψ_A collapses to the checkpointed context y; under the 0.7.2 flat charge of 10 the same call would have continued with φ′_7 = WHAT","The `ecalli` surfaces to the caller of Ψ_A as the exit h̄ × 9: the accumulation is aborted, treated as a host-call fault, and the service's result for this block is recorded as BAD","φ′_7 = WHAT and execution continues at the next instruction regardless of the remaining gas — nothing was executed, so an unknown or unavailable host call can never by itself trigger out-of-gas (the pre-#992 behaviour)"],"answer":1,"explanation":"三個 invocation 的 mutator F（eq. B.2、B.6、B.11）最後兩行完全相同：ω′ = ω 但 φ′_7 = WHAT，ϱ′ = ϱ − M_∅；若 ϱ′ < 0 → (∞, ϱ′, ω′, μ)，否則 (▸, ϱ′, ω′, μ)。M_∅（Gas cost charged for an unknown host-call）在 0.8.0 是 1000（0.7.2 是 10，你們 chargeGasAndCheck 裡的 10 就是 0.7.2 值）。所以 ϱ = 300 時：300 − 1000 = −700 < 0 → ∞；Ψ_M 的 u = ϱ − max(ϱ′, 0) = 300（全部耗盡）；collapse C（eq. B.13）在 o ∈ {∞, ☇} 時採用 exceptional context Y（最後一次 checkpoint 的狀態，沒 checkpoint 就是初始 I(s, s)）。不是 ☇：ecalli 對任何立即數都是合法指令，未知 id 只是走 default；也不是 h̄ × h 外洩：§A.6 的 Ψ_H 把每個 host id 都交給 F 處理，最上層永遠看不到 h̄——只有 refine 用 invoke 驅動的 inner machine 才會把 ecalli 以 (HOST, h) 回報給外層。你們的 #993：hostCallException 扣 10 gas 後沒檢查 gas 是否為負（fuzzer session 8f50823b… step 175662，service 0x6707fa2e 在 accumulate 呼叫了無效 host function）；參考實作 polkajam 停機（∞）、你們繼續執行 → θ（LastAccOut）、β（BEEFY root）與 state root 分歧；PR #992 補上 chargeGasAndCheck 的 OOG 檢查（GP 0.7.2 gavofyork/graypaper#482「explicit OOG check for each invocation mutator default case」）。升 0.8.0 時要把 10 換成 M_∅ = 1000（連同其他 host call 的 base + per-KiB 費用，見 App. I）。","trap":"未知 host call「先扣費再回 WHAT」，扣費本身就能觸發 ∞；0.8.0 的 M_∅ = 1000 不是 10。"},{"id":"b2-appB-invoke-gas-refund","ch":"B","section":"B.6 Refine Functions — invoke","gpRef":"§B.6 `invoke` = 13 (Ω_K); eq. B.4 (inner PVM tuple); §B.1 inner result codes","difficulty":3,"kind":"code","tags":["host-calls","refine","inner-pvm","gas","delta-0.8.0"],"stem":"The excerpt is the team's 0.7.2 `invoke` (Ω_K): it reads a 112-octet block at φ_8, runs inner machine n = φ_7 and writes the block back. Apart from the id shift (12 → 13), which GP 0.8.0 rule is missing from it?","code":{"lang":"go","caption":"PVM/host_call_refine.go (invoke, 0.7.2 numbering)","src":"\tn, o := input.VM.Registers[7], input.VM.Registers[8]\n\n\toffset := uint64(112)\n\t// g = panic\n\tif !input.VM.Mem.IsWriteable(o, offset) {\n\t\tinput.VM.Registers[7] = OOB\n\t\treturn OmegaOutput{ExitReason: ExitPanic, Addition: input.Addition}\n\t}\n\t// ... (WHO if n is not a known machine; decode g and w[0..13] from the 112 octets)\n\t// wrap m[n]_p (program), w (registers), m[n]_u (memory), g (gas)\n\ttempInterp := NewInterpreter(&tmpProgram, w, &tempMemory, Gas(g))\n\t// ...\n\tc, pcPrime = tempInterp.SingleStepInvoke(input.Addition.IntegratedPVMMap[n].PC)\n\t// ... (re-encode gas' and registers')\n\t// write data into memory (mu)\n\tinput.VM.Mem.Write(o, data)\n\n\t// m* = m\n\ttmp := input.Addition.IntegratedPVMMap[n]\n\ttmp.Memory = *tempInterp.Memory\n\tif c.GetReasonType() == HOST_CALL {\n\t\ttmp.PC = pcPrime + 1 + ProgramCounter(skip(int(pcPrime), input.Addition.Program.Bitmasks))\n\t} else {\n\t\ttmp.PC = pcPrime\n\t}\n\tinput.Addition.IntegratedPVMMap[n] = tmp"},"options":["Resumption: on a HOST exit the saved instruction counter must stay on the `ecalli` itself, so that the outer service can re-execute that instruction after servicing the call, exactly as Ψ does for a page fault; advancing it by i′ + skip(i′) + 1 drops an instruction","Nested host calls: an `ecalli` executed by the inner machine must be dispatched through the refine mutator F (historical_lookup, export, …) instead of stopping the inner run, so Ω_K has to invoke Ψ_H rather than Ψ and the outer service should never see the HOST result code at all","Memory: the 112-octet block need only be readable, because in 0.8.0 the inner gas and the 13 registers are handed back through φ′_7…φ′_12 rather than written back into the block, so a readable-but-unwritable window is fine and the excerpt's OOB-and-panic path should be a plain WHO instead","Gas: the outer machine pays g = M_K + g_R up front (∞ if ϱ < g; g_R is the inner gas read from the block) and afterwards gets the inner's unspent g_R′ back, ϱ′ = ϱ − g + g_R′; the inner machine also carries a gas-charged flag for its current basic block"],"answer":3,"explanation":"Ω_K（invoke = 13）：[n, o] = φ_7,8；⟨g_R, w⟩ 滿足 E_8(g_R) ⌢ E_8(w) = μ[o..+112]（8 octets gas + 13 個 8-octet 暫存器），且 N_{o..+112} 必須 ⊆ writable(μ)，否則 ⟨0, error⟩ → ☇（因為結果要寫回同一塊）；(c, i′, g_R′, f′, w′, u′) = Ψ(m[n]_p, m[n]_i, g_R, m[n]_f, w, m[n]_u)——是 Ψ 不是 Ψ_H，inner 沒有 host call，遇到 ecalli 就以 c = h̄ × h 停下；μ* 寫回 E_8(g_R′) ⌢ E_8(w′)；m*[n]_i = i′ + skip(i′) + 1 當 c ∈ {h̄} × N_R（跳過那條 ecalli，讓外層 service 代為服務後 resume），否則 i′；m*[n]_f = f′（eq. B.4 的 inner PVM tuple ⟨p, u, i, f⟩，f 是「本 basic block 的 gas 已扣」旗標，因為 0.8.0 gas 以 basic block 為單位預扣，mid-block resume 時不能再扣一次——#1046 review 也提到 A.4 的 L(i)）。gas：g = M_K + g_R（M_K = 968）；ϱ′ = ϱ − g 當 w = error ∨ n ∉ keys(m) ∨ ϱ < g，否則 ϱ − g + g_R′——也就是外層先付全部 inner gas，剩下的退回；ϱ < g 依 B.18/B.19 直接 ∞。回傳：(HOST, h)、(FAULT, x 位址)、OOG、PANIC、HALT 進 φ′_7/φ′_8（非 HOST/FAULT 時 φ′_8 不變）；n 不存在 → WHO。你們的 0.7.2 版本只扣 10 gas，inner 的 g 完全獨立、也不退還——這正是 #1046 的「invoke gas refund」項目；同一 PR 也加了 machine 的 63 台上限（GP PR #521，|m| ≥ 63 → FULL，且排在 ☇ 之前）。另外值得複查：excerpt 的 skip 用的是 input.Addition.Program.Bitmasks（外層程式的 bitmask），GP 的 skip(i′) 應以 inner 程式 m[n]_p 的 bitmask 計算。其餘三個選項描述的都是「GP 本來就沒要求」的事：說 inner 的 ecalli 應該轉呼叫 Ψ_H 走 refine 的 F，與 Ω_K 明寫的 Ψ(...) 不符——inner PVM 刻意沒有 host call 能力（它連 context 都拿不到），ecalli 一律以 c = h̄ × h 停機並把 (HOST, h) 放進 φ′_7/φ′_8，讓外層 service 自行決定要不要代勞。說 HOST 時 pc 應停在 ecalli 原地的那組正好相反：m*[n]_i = i′ + skip(i′) + 1 是**跳過**那條 ecalli，因為外層已經代為服務；停在原地會讓 resume 後無限重複同一個 ecalli（page fault 才是停在原地重試，那是 Ψ 對 μ 的行為，不是 Ω_K 對 HOST 的行為）。說 112 octets 只需可讀的那組錯在結果的去向：GP 要求 N_{o..+112} ⊆ writable(μ)，否則 ⟨0, error⟩ → ☇，正因為 g_R′ 與 w′ 要原地寫回同一塊；0.8.0 沒有把它們改放進 φ′_7…φ′_12，φ′_8 只在 HOST/FAULT 時承載 h 或錯誤位址。","trap":"invoke 的 112 octets 必須「可寫」；inner 無 host call（ecalli → HOST）；0.8.0 外層預付 g_R 並退還 g_R′。"},{"id":"b2-appB-pages-access-modes","ch":"B","section":"B.6 Refine Functions — pages","gpRef":"§B.6 `pages` = 12 (Ω_Z); App. I M_Z,* gas constants","difficulty":3,"kind":"code","tags":["host-calls","refine","inner-pvm","memory"],"stem":"The excerpt is the team's `pages` (Ω_Z) acting on inner machine n over page range [p, p+c) with mode r (φ_7…φ_10 = n, p, c, r). Compared with GP 0.8.0, which statement is correct?","code":{"lang":"go","caption":"PVM/host_call_refine.go (pages, 0.7.2 numbering)","src":"\tif r > 4 || p < 16 || p+c >= (1<<32)/ZP {\n\t\tinput.VM.Registers[7] = HUH\n\t\treturn OmegaOutput{ExitReason: ExitContinue, Addition: input.Addition}\n\t}\n\tif r > 2 && !isReadable(p, c, input.Addition.IntegratedPVMMap[n].Memory) {\n\t\tinput.VM.Registers[7] = HUH\n\t\treturn OmegaOutput{ExitReason: ExitContinue, Addition: input.Addition}\n\t}\n\t// otherwise : ok\n\t// u_v\n\tif r >= 3 {\n\t\tfor i := uint32(p); i < uint32(p+c); i++ {\n\t\t\tinput.Addition.IntegratedPVMMap[n].Memory.Pages[i] = &Page{\n\t\t\t\tValue:  make([]byte, ZP),\n\t\t\t\tAccess: MemoryInaccessible,\n\t\t\t}\n\t\t}\n\t}\n\t// u_a\n\tif r == 1 || r == 3 {\n\t\tfor i := uint32(p); i < uint32(p+c); i++ {\n\t\t\tinput.Addition.IntegratedPVMMap[n].Memory.Pages[i] = &Page{\n\t\t\t\tValue:  make([]byte, ZP),\n\t\t\t\tAccess: MemoryReadOnly,\n\t\t\t}\n\t\t}\n\t}\n\t// ... (r == 2 || r == 4: same loop with Access: MemoryReadWrite)\n\tinput.VM.Registers[7] = OK"},"options":["The code is correct: Ω_Z zero-fills the range for every r ∈ 0…4 and only the resulting access differs (0 → inaccessible, 1/3 → R, 2/4 → W); the GP never distinguishes an allocation from a mode change, which is why App. I prices every r with one base cost and one per-page rate","Two semantic gaps: for r = 0 the GP zero-fills the range and makes it inaccessible (the code leaves it untouched), and for r ∈ {3, 4} the GP keeps the page contents and only changes the access mode to R or W (the code re-allocates zeroed pages instead)","The only gap is the error code: when r > 2 and a page of the range is inaccessible the GP returns OOB (inner-PVM memory index not accessible) exactly as `peek` and `poke` do, rather than HUH; the page mutations themselves are right, and r = 0 rightly leaves the octets alone","The GP validates r ∈ 0…4, p ≥ 16 and p + c < 2^32/Z_P before looking up n, so an invalid request aimed at a non-existent machine must yield HUH where the code yields WHO; the page mutations themselves are right, and an invalid r is free, no gas constant being defined for it"],"answer":1,"explanation":"Ω_Z（pages = 12）：[n, p, c, r] = φ_7…φ_10；u = m[n]_u（n ∉ keys(m) → error）；u′ = u 但 value[p·Z_P..+c·Z_P] = [0, 0, …] 當 r < 3、否則保留原值；access[p..+c] = [∅…] 當 r = 0、[R…] 當 r ∈ {1, 3}、[W…] 當 r ∈ {2, 4}；(φ′_7, m′) = (WHO, m) 當 u = error；(HUH, m) 當 r > 4 ∨ p < 16 ∨ p + c ≥ 2^32/Z_P（= 2^20 頁；p < 16 保護最低的 64 KiB）；(HUH, m) 當 r > 2 ∧ access[p..+c] ∋ ∅（改權限只能對已配置的頁）；(OK, m′) 否則。語意上 r = 0 是「釋放」（歸零 + 不可存取）、1/2 是「配置」（歸零 + R/W）、3/4 是「改權限」（內容保留）。0.8.0 的 gas 也依此分類：free M_Z,f,c + c·M_Z,f,p = 212 + 118/頁、alloc 275 + 121/頁、setmode 130 + 29/頁、無效 r 固定 M_Z,i = 80。對照你們的程式：r = 0 什麼都沒做（GP 要歸零並設為不可存取）；r ≥ 3 先配置歸零頁再設 R/W（GP 要保留內容）——code-map 3.12.9 也標出這個分歧；而 WHO 先於 HUH 的順序與 GP 一致，OOB 只用於 peek/poke 對 inner memory 的位元組範圍存取，pages 用 HUH。干擾項對照：說「五種 r 都歸零、GP 不分配置與改權限、附錄 I 只有一組費率」的那組同時錯在語義與計費——u′_value 只在 r < 3 時被清成 0，而 M_Z 有三組常數（free 212 + 118/頁、alloc 275 + 121/頁、setmode 130 + 29/頁）加上無效 r 的 M_Z,i = 80，正是因為三種操作成本不同。說「唯一的落差是錯誤碼該用 OOB」的那組錯兩處：Ω_Z 的四個結果只有 WHO/HUH/OK，OOB 專屬於 peek/poke 對 inner memory 的位元組範圍；而 r = 0 在 GP 是「歸零 + 設為不可存取」，把內容留著等於把舊資料留在一個之後可能被重新配置的頁裡。說「GP 先驗 r/p/p+c 再查 n，所以不存在的機器該回 HUH」的那組把判定順序倒過來：u = error（n ∉ keys(m)）是第一個 case，回 WHO；而且無效 r 並非免費，M_Z,i = 80。額外注意：r > 2 的檢查把「頁索引 p、頁數 c」丟給 isReadable(start, offset, m)，而該函式（argument_invocation.go）以位元組位址計算 startPage = start / Z_P，所以檢查的是錯的頁——這條路徑沒有 conformance vectors 覆蓋，遷移 0.8.0 時值得補測。","trap":"pages 的 r：0 釋放、1/2 配置（歸零）、3/4 只改權限（保留內容）；錯誤碼是 WHO/HUH，沒有 OOB、沒有 panic。"},{"id":"b2-appB-grow-heap","ch":"B","section":"B.5 General Functions — grow_heap","gpRef":"§B.5 `grow_heap` = 1 (Ω_♊); eq. A.42 (Y conditions); M_♊,c / M_♊,p in App. I","difficulty":3,"kind":"delta","tags":["host-calls","memory","gas","delta-0.8.0"],"stem":"GP 0.8.0 replaces the `sbrk` instruction with the `grow_heap` host call (index 1, present in all three invocations). A program with no RO data (so a = 32, the first RW-data page) currently has c = 8 writable RW pages (h = 40) and b = 1000; it calls grow_heap with φ_7 = 50 while ϱ = 2,000. What happens?","options":["φ_7 is the desired end page (index + 1 of the last writable page): g = 275 + (50 − 40)·121 = 1,485 is charged, pages [40, 50) become writable and φ′_7 = 50; with φ_7 ≤ 40 or φ_7 > 1000 only 275 would be charged, φ′_7 = 40 and nothing would change","Memory growth is already priced by the per-basic-block gas model, so grow_heap only charges its base cost 275 regardless of how many pages are added; pages [40, 50) become writable and φ′_7 = 50, while a request above b is refused with FULL instead of being a no-op","φ_7 is an octet count as with 0.7.2's sbrk instruction: the heap grows by 50 octets rounded up to one whole page, φ′_7 = the previous break address 40·Z_P = 163,840, and only the base cost 275 is charged since a single page is added; a request beyond b returns OOB","φ_7 is a page count to add: pages [40, 90) become writable, g = 275 + 50·121 = 6,325 is charged and φ′_7 = 90; a request that would pass b = 1000 is clamped to b rather than refused, and φ_7 = 0 is how a program queries the current heap pointer without paying per page"],"answer":0,"explanation":"Ω_♊（grow_heap = 1）：(o, s) 由 JAM blob p 依 eq. A.42 解出（RO data 與 stack 大小）；a = (2Z_Z + Z(|o|))/Z_P 是 RW data 區的起始頁（無 RO data 時 = 2·65536/4096 = 32）；b = (2^32 − 3Z_Z − Z_I − P(s))/Z_P 是 RW 區可及的最後一頁 + 1（stack 前留一個 Z_Z guard zone）；c = |{p ∈ [a, b) : access[p] = W}| 是目前可寫頁數；h = a + c 是目前的 heap 指標（頁）。(ε′, ϱ′, φ′_7) = (▸, ϱ − M_♊,c, h) 當 φ_7 ≤ h ∨ φ_7 > b（不動、只收基本費、回傳現況）；(∞, ϱ, h) 當 ϱ < g；(▸, ϱ − g, φ_7) 否則；且 access[a..φ′_7) = [W…]；g = M_♊,c + (φ_7 − h)·M_♊,p，M_♊,c = 275、M_♊,p = 121。代入：h = 32 + 8 = 40，φ_7 = 50 → 新增 10 頁 → g = 275 + 1,210 = 1,485 ≤ 2,000 → 頁 [40, 50) 變 W、φ′_7 = 50。所以 φ_7 是「絕對的目標頁索引（+1）」，不是要加的頁數（那會變成 [40, 90) 與 6,325 gas），也不是 sbrk 那種以 octet 為單位、回傳舊 break 位址的介面；記憶體成長不是免費的，每頁 121 gas 與 basic-block gas model 無關。對照 0.7.2：sbrk 是 PVM 指令，參數是 octet 數、回傳舊 heap 指標（位址）；0.8.0（GP PR #508）把它拿掉並改成 host call，因此 host-call 編號全部 +1。你們的 #1046 實作了此項；review 註記「HeapMaxPages must reserve the major guard zone」對應上面 b 的定義——stack 區起點是 2^32 − 2Z_Z − Z_I − P(s)（eq. A.46），b 再往下保留一個 Z_Z。小心：ecosystem-notes/code-map 有把 1862 誤標成 grow_heap 的基本費，1862 是 machine（M_M,c）。把 φ_7 當「要增加的頁數」的那組會多配 40 頁、多收 4,840 gas，而且 GP 對超出 b 的請求不是 clamp 而是 no-op（回傳 h、只收 M_♊,c）；「φ_7 = 0 用來查詢」倒是碰巧落在 φ_7 ≤ h 這條 no-op 分支上，但它推不出「參數是頁數」——任何 ≤ h 的值都一樣。把它當 sbrk（octet 數、回傳舊 break 位址、超界回 OOB）的那組正是 0.7.2 的語義：0.8.0 已刪掉 sbrk 指令，改成以頁為單位的 host call，而且 Ω_♊ 的結果只有 ▸ 與 ∞ 兩種，沒有任何錯誤碼。說每頁不另計費的那組與附錄 I 的 M_♊,p = 121 相牴觸——記憶體是節點的實際成本，basic-block gas 只涵蓋指令執行；同一組還把超界說成 FULL，GP 是 no-op。","trap":"grow_heap(φ_7 = 目標頁索引+1) → 回傳新的 heap 頁；≤ h 或 > b 是 no-op（仍收 275）；每新增一頁 121 gas。"},{"id":"b2-appB-eject-conditions","ch":"B","section":"B.7 Accumulate Functions — eject","gpRef":"§B.7 `eject` = 22 (Ω_J); eq. 9.8 (a_i, a_o); eq. B.3 (D)","difficulty":3,"kind":"concept","tags":["host-calls","eject","preimages","accounts"],"stem":"Service 7 (accumulating) calls `eject` (index 22) with φ_7 = 9 and φ_8 = o, where μ[o..+32] = h. Under GP 0.8.0, when does the call return OK, and what happens then?","options":["Service 9 exists, is not the caller, and its code hash equals the code hash of service 7 with its parent field a_p = 7; its footprint is exactly a_i = 2 with l = max(81, a_o) − 81 (one request (h, l), no storage); a_l[(h, l)] = [x, y] with y < t − D; then 9 is deleted and its balance is burned","Service 9 exists, is not the caller, and its code hash equals E_32(7); its footprint is exactly a_i = 2 with l = max(81, a_o) − 81 (one request (h, l), no storage); a_l[(h, l)] = [], still unprovided; then 9 is deleted and its entire balance is credited to the registrar χ_R","Service 9 exists, is not the caller, and its code hash equals E_32(7); its footprint is exactly a_i = 2 with l = max(81, a_o) − 81 (one request (h, l), no storage); a_l[(h, l)] = [x, y] with y < t − D; then 9 is deleted and its entire balance is added to service 7","Service 9 exists, is not the caller, and its code hash equals E_32(7); its footprint is exactly a_i = 2 with l = max(81, a_o) − 81 (one request (h, l), no storage); a_l[(h, l)] = [x, y, w] with w < t − D; then 9 is deleted and its entire balance is added to service 7"],"answer":2,"explanation":"Ω_J（eject = 22，g = M_J = 458）：[d, o] = φ_7,8；h = μ[o..+32]（不可讀 → ☇）；d = accounts[d] 只在 d ≠ x_id ∧ d ∈ keys(accounts) 時成立，否則 error → WHO；d_c ≠ E_32(x_id) → WHO；l = max(81, d_o) − 81；d_i ≠ 2 ∨ (h, l) ∉ keys(d_l) → HUH；d_l[(h, l)] = [x, y] ∧ y < t − D → OK：accounts \\ {d} ∪ {x_id ↦ s′}，s′_b = x_self_b + d_b；其他情況（[]、[x]、[x, y, w]、或 y 尚未過期）→ HUH。81 從哪來：eq. 9.8 定義 a_i = 2·|a_l| + |a_s|、a_o = Σ_{(h,z)∈a_l}(81 + z) + Σ_{a_s}(34 + |k| + |v|)；「恰一個 request、沒有 storage」等價於 a_i = 2 且 a_o = 81 + z，因此 l = a_o − 81 就把那個唯一 request 的長度 z 還原出來（通常是被 eject 的 service 自己舊 code 的 preimage）。設計意圖：一個 service 把自己的 code hash 設成 E_32(某個 service 索引)（不可能是合法 code 的值，等於自我停用）就等於指名「由那個 service 回收我」；等最後一個 preimage 已 forget 且過了 D = L + 4,800 = 19,200 slots（eq. B.3，確保 refine 的 historical lookup 不再需要它），parent 才能回收餘額並刪帳戶。干擾項逐一對照：用「兩者 code hash 相同 + parent 欄位 a_p = 7」當身分測試、且把餘額燒掉的那組錯兩處——Ω_J 比對的是 d_c = E_32(呼叫者索引)（32-octet 定長編碼的服務索引，不可能是任何合法 code 的雜湊，等於「把自己交給 parent 處置」的停用標記）；「兩個 service 用同一份 code」是完全正常的狀態，若拿它當條件，任何人都能 eject 跟自己同 code 的鄰居。parent 欄位 a_p 在 Ω_J 從頭到尾沒被讀（它只由 `new` 寫入、由 `info` 讀出）；餘額則是加進呼叫者 x_self 的 balance，不是銷毀——回收押金正是 eject 的目的。順帶記住 footprint 條件：a_i = 2·|a_l| + |a_s| 必須恰為 2，即一筆 request、零筆 storage。把狀態寫成 [] 並把餘額給 registrar 的那組錯兩處：[] 是「已請求、從未提供」，GP 要求的是 [x, y] 且 y < t − D（曾經可用、已被 forget、且過了 expunge 期），因為只有這樣才能保證沒有任何 refine 還需要它；而 χ_R 只決定誰能用 < S 的低位索引（`new`），與 eject 的資金流向無關。用三元素 [x, y, w] 且 w < t − D 的那組：這種狀態只有 forget 處理（→ [w, t]），Ω_J 的 OK 分支只匹配長度為 2 的 [x, y]，其餘一律 HUH——而且過期判定看的是中間的 y，w 是最近一次重新請求的時刻。你們的 eject()（host_call_accumulate.go）：SerializeFixedLength(callerID, 32)、max(81, Bytes) − 81、Items != 2、lookupDataLength == 2 && lookupData[1] < timeslot − D，與 GP 相符。","trap":"eject 的三把鎖：code hash = E_32(呼叫者)、a_i = 2（唯一 request）、該 request 狀態 [x, y] 且 y < t − D；餘額歸呼叫者。"},{"id":"b2-appB-log-jip1","ch":"B","section":"B.2–B.4 mutator default case & JIP-1 `log`","gpRef":"eq. B.2, B.6, B.11 (default branch); JIP-1 (host call 100)","difficulty":2,"kind":"concept","tags":["host-calls","jip","log","fuzz-bug"],"stem":"A service executes `ecalli 100` (`log`). Which statement is correct?","options":["`log` is specified by JIP-1, not by the Gray Paper: its observable effects match an unimplemented index — φ′_7 = WHAT and the gas of a bad-index call — and an unreadable message/target range must have no side-effects (no panic); the node merely prints the message","`log` is consensus-critical: the formatted message is hashed into the service's accumulation output θ and hence into the BEEFY root β_B, so every node must implement byte-identical level/target/message formatting, and an unreadable range must panic (☇)","`log` is host call 100 of GP App. B, available in all three invocations: it returns OK, costs M_∅ = 1000 and, like every other host call that reads memory, panics (☇) when the message range is not readable — omitting that check merely turns a specified panic into a crash","`log` exists only in Ψ_R as a guarantor diagnostic, where it returns OK and charges M_∅; during accumulate and is-authorized `ecalli 100` instead falls through to the mutator's WHAT default, so the same program sees OK in one invocation and WHAT in another"],"answer":0,"explanation":"GP 附錄 B 沒有 index 100；純 GP 節點對 ecalli 100 走 F 的 default（eq. B.2/B.6/B.11）：扣 M_∅、φ′_7 = WHAT、繼續（gas 不足則 ∞）。JIP-1「Debug message host call」原文：Index 100、Name log、Gas usage 10「(same as host-call with bad index)」；輸入 φ_7 = level（0 fatal … 4 pedantic）、target = ∅ 若 φ_8 = 0 ∧ φ_9 = 0 否則 μ[φ_8..+φ_9]、message = μ[φ_10..+φ_11]；輸出 φ′_7 = WHAT——「WHAT is always returned so that authorizer/service behaviour is the same whether or not this JIP is implemented」；「No side-effects if memory access is invalid」。換言之 log 對共識刻意「透明」：不進 θ/β、不改狀態、不 panic，回傳值與 gas 都與未實作時一致（注意 JIP 的「10」是 0.7.x 時代的 bad-index 費用；0.8.0 的 M_∅ = 1000，實作時要跟目前 GP 版本對齊，否則 gas 統計會分歧）。它不是 refine 專屬：你們 host_call_invocation.go 的三張表都註冊了 [100] = logHostCall。你們的 #975（fuzz seed 309584898、tiny spec）：logHostCall 讀 (r10, r11)/(r8, r9) 前沒做 isReadable，直接解參考未配置的頁 → target 程序崩潰（「IO error: early eof」）；PR #976 改成不可讀就 continue、無副作用。另外值得核對：現行 logHostCall 沒有設 φ′_7 = WHAT（註解寫「none modified per spec」），與現在的 JIP-1 文字不符——若 service 在 log 後讀 φ_7，會與依 JIP-1 或純 GP 的節點不一致。三個干擾項都踩在「log 必須對共識透明」這條線上：說它是附錄 B 的正式 host call、且記憶體不可讀要 ☇ 的那組，正好是 #975 的錯誤行為——JIP-1 明寫「No side-effects if memory access is invalid」，☇ 會讓有 log 的節點與沒實作 log 的節點分岔（一邊 collapse 到 y、一邊照常繼續）。說訊息會進 θ 與 β_B 的那組把 debug 輸出寫進共識：yield（26）才是唯一把 32-octet hash 放進 x_y → θ′ → BEEFY 的管道，log 不改任何 context 欄位。說它只在 Ψ_R 可用、accumulate 才回 WHAT 的那組會造成兩種回傳值與兩種 gas：JIP-1 的重點恰恰相反——不論實作與否、不論哪個 invocation，觀察到的都是 WHAT 加上 bad-index 的費用。","trap":"log 不在 GP 裡；合規做法 = 印訊息、φ′_7 = WHAT、bad-index 費用、記憶體無效時零副作用（不能 panic、更不能 crash）。"},{"id":"appC-code-avspec-080","ch":"C","section":"C.2 Block Serialization (availability specification)","gpRef":"§C.2 E(s ∈ availability spec); eq. 11.5; eq. 11.31","difficulty":2,"kind":"code","tags":["codec","availability-spec","delta-0.8.0"],"stem":"The team's encoder for the availability specification (work-package spec) is still on GP 0.7.2. What must change so that it produces the GP 0.8.0 wire form E(s) of §C.2, and which on-chain rule accompanies the new field?","code":{"lang":"go","caption":"internal/types/encode.go (WorkPackageSpec.Encode) — struct fields: Hash, Length U32, ErasureRoot, ExportsRoot, ExportsCount U16","src":"func (w *WorkPackageSpec) Encode(e *Encoder) error {\n\tcLog(Cyan, \"Encoding WorkPackageSpec\")\n\n\t// Hash\n\tif err := w.Hash.Encode(e); err != nil {\n\t\treturn err\n\t}\n\n\t// Length\n\tif err := w.Length.Encode(e); err != nil {\n\t\treturn err\n\t}\n\n\t// ErasureRoot\n\tif err := w.ErasureRoot.Encode(e); err != nil {\n\t\treturn err\n\t}\n\n\t// ExportsRoot\n\tif err := w.ExportsRoot.Encode(e); err != nil {\n\t\treturn err\n\t}\n\n\t// ExportsCount\n\tif err := w.ExportsCount.Encode(e); err != nil {\n\t\treturn err\n\t}\n\n\treturn nil\n}"},"options":["Replace the fixed E_4 Length with a compact E(l) and add v as a compact natural right after it; v is whatever number of chunks the guarantor actually distributed, so it is not checked on-chain","Append E_2(v) after ExportsCount, because since GP 0.7.0 any newly added field of a structure must go to its end to keep decoders streaming-friendly; on-chain v must equal the number of cores C","Nothing on the wire: v is derivable from the validator count V and is therefore never serialized; only the JSON test-vector schema gains an erasure_shards field for readability","Insert a U16 erasure-shard count v, encoded E_2(v), between ErasureRoot and ExportsRoot; the other widths stay as they are (E_4 length, E_2 exports count); on-chain every incoming report must carry v = |κ′|"],"answer":3,"explanation":"GP 0.8.0 §C.2：E(s ∈ availability spec) ≡ E(p, E_4(l), u, E_2(v), e, E_2(n))——依序是 package hash p、bundle 長度 l（E_4）、erasure root u、erasure-shard 數 v（E_2）、segment root e、segment 數 n（E_2）。eq. 11.5 把 v ∈ N_V（validator count 型別）放在 u 與 e 之間；eq. 11.31：∀w ∈ 進來的 reports：(w_s)_v = |κ′|，因為「one chunk is distributed to each assurer, the number of chunks must equal the size of the assuring validator set」。0.8.0 的 erasure coding 以 v 為參數（§14.4.1 的 A(p, b, s, v) 用 z = 2·d(v)），所以規格本身要記錄 v。「把新欄位放到最後」是錯的：0.7.0 的規則只針對『變長』欄位（↕），v 是固定 2 octets，位置由 GP 明確定義；v 也不是 C。長度 l 仍是 E_4（不是 compact），v 也不是 guarantor 自由決定的。「不序列化」也錯：v 必須進 wire，否則另一個 validator-set 大小的 assurer 無法驗證，而且 GP 註明對兩個不同大小的 validator set 派發時要做兩次 erasure coding、產生兩份不同的 work-report。你們的 PR #1026 就是在 ErasureRoot 與 ExportsRoot 之間加 `ErasureShards U16`（producer 設為 TotalShards），這會改變每一個 on-chain WorkReport 的位元組佈局（進而影響 report hash、guarantee 簽名、ρ 內容）。","trap":"0.7.2 五欄位 (p, l, u, e, n) → 0.8.0 六欄位 (p, l, u, v, e, n)；v 是 E_2 且必須等於 |κ′|。"},{"id":"appC-work-digest-encoding","ch":"C","section":"C.2 Block Serialization (work digest and O(result))","gpRef":"§C.2 E(d ∈ work digest) and O(o); eq. 11.6–11.7","difficulty":2,"kind":"concept","tags":["codec","work-digest","work-result"],"stem":"A work digest d = (s, c, y, g, l, u, i, x, z, e) is serialized inside a work report. Which statement about its encoding in GP 0.8.0 is correct?","options":["The gas limit g is a compact natural exactly like the core index of the enclosing work report, the result carries a leading length prefix in all seven cases, and u, i, x, z, e are E_2 counters","Every numeric field is fixed-width — E_8 for both gas values, E_4 for the four counters and E_4 for the extrinsic size — because work reports are hashed into the state trie and fixed widths keep the trie leaves aligned","O(l) uses 0 for ∞ and [1] ⌢ ↕blob for success, mirroring the ¿x optional encoding; the five load fields u, i, x, z, e are E_4 so that every digest has a predictable size for the report-size limit W_R","E_4(s), c, y, E_8(g), then O(l) — [0] ⌢ ↕blob on success, else one octet 1…6 for ∞, ☇, BADEXPORTS, OVERSIZE, BAD, BIG — then u, i, x, z, e as compact naturals (digests are never read individually by the PVM, so space wins)"],"answer":3,"explanation":"§C.2：E(d ∈ work digest) ≡ E(E_4(s), c, y, E_8(g), O(l), u, i, x, z, e)。前四個是固定寬度：service index E_4、code hash、payload hash、accumulate gas limit E_8；結果用 O(o)：o ∈ blob 時為 (0, ↕o)，否則 1 = ∞（out-of-gas）、2 = ☇（panic）、3 = BADEXPORTS、4 = OVERSIZE、5 = BAD（lookup anchor 找不到 code）、6 = BIG（code 超過 W_C）；最後五個 refine 負載欄位 u（gas used）、i（imports）、x（extrinsic 數）、z（extrinsic 總大小）、e（exports）用一般的 compact E——GP 原始碼的註解說得很白：「These are variable length, since we never access them individually, digests are never accessed directly by the PVM and space is at a premium here」。錯誤選項：把 0 給 ∞、1 給成功是反的（0 一定是成功 + 長度前綴的 blob）；「全部固定寬度」不對，五個負載欄位是 compact；「g 是 compact」在 work digest 裡不對（是 E_8）——但注意 operand tuple 的 g（§C.2 E(operand) = E(0, p, e, a, y, g, O(l), ↕t)）確實是 compact，這是常被混淆的地方。你們的 WorkResult.Encode：AccumulateGas 是 Gas 型別走 E_8，RefineLoad.Encode 五個欄位用 EncodeInteger（compact），WorkExecResult.Encode 的 0…6 對應完全一致。","trap":"O(result)：0 + ↕blob 是成功；1..6 依序 ∞、☇、BADEXPORTS、OVERSIZE、BAD、BIG。digest 的 g 是 E_8，operand tuple 的 g 是 compact。"},{"id":"appC-code-operand-transfer-prefix","ch":"C","section":"C.2 Block Serialization (operand tuple and deferred transfer)","gpRef":"§C.2 E(deferred transfer), E(operand tuple); eq. B.9; §B.4 fetch cases 14–15; eq. 12.13–12.14","difficulty":2,"kind":"code","tags":["codec","accumulation","deferred-transfer","fetch"],"stem":"The team prefixes each accumulate input item with a byte before its body. Which explanation of the two prefixes and of what actually consumes this encoding is correct per GP 0.8.0?","code":{"lang":"go","caption":"internal/types/encode.go (OperandOrDeferredTransfer.Encode)","src":"func (o *OperandOrDeferredTransfer) Encode(e *Encoder) error {\n\tcLog(Cyan, \"Encoding OperandOrDeferredTransfer\")\n\n\t// if operand is nil, append 0 to the buffer, else append 1\n\tif o.Operand == nil && o.DeferredTransfer == nil {\n\t\treturn errors.New(\"Operand and DeferredTransfer are both nil\")\n\t}\n\t// ...\n\t// Operand\n\tif o.Operand != nil {\n\t\t// prefix\n\t\te.buf.Write([]byte{0})\n\n\t\tif err := o.Operand.Encode(e); err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n\n\t// DeferredTransfer\n\tif o.DeferredTransfer != nil {\n\t\t// prefix\n\t\te.buf.Write([]byte{1})\n\n\t\tif err := o.DeferredTransfer.Encode(e); err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n\n\treturn nil\n}"},"options":["The prefixes are a team convention for the JSON test vectors only; on the wire GP orders all transfers before all operands and tells them apart by fixed length, a transfer body being 152 octets; the service learns the split from Ψ_M's initial argument, which carries both counts rather than one total","The prefix is the account-serialization version byte introduced in GP 0.7.1 (0 = legacy operand layout, 1 = transfer layout with the 128-octet memo); Ψ_A takes two separate sequences, one of operands and one of transfers, and 0.8.0 drops the byte because the two never share a sequence","The prefixes are the discriminators GP puts in front of E(operand tuple) (0) and E(deferred transfer) (1); Ψ_A takes one mixed sequence i ∈ ⟦operand ∪ transfer⟧ and the service reads it back through fetch (cases 14/15), so each item must be self-describing","The prefixes separate the two halves of the accumulate memory image: Ψ_M's initial argument E(t, s, |i|) is followed by every operand (prefix 0) and then every transfer (prefix 1) written into RAM at start-up, so fetch only ever has to serve work-package data and nothing needs to be self-describing"],"answer":2,"explanation":"GP §C.2 明確定義 E(x ∈ deferred transfer) ≡ E(1, E_4(s), E_4(d), E_8(a), m, E_8(g))（memo m 固定 128 octets、不加長度前綴）以及 E(x ∈ operand tuple) ≡ E(0, p, e, a, y, g, O(l), ↕t)——開頭的 1/0 就是 discriminator。為什麼需要：eq. B.9 的 Ψ_A 接收的是 i ∈ ⟦operand tuple ∪ deferred transfer⟧ 這種『混合序列』（eq. 12.13–12.14，accumulation.tex：「the union of the two characterizes inputs to the Accumulation invocation function」）；Ψ_M 的初始參數只有 E(t, s, |i|)，項目本身是服務透過 fetch host call 讀回：§B.4 的 fetch 在 φ_10 = 14 時回傳 E(↕i)、15 時回傳 E(i[φ_11])。沒有 discriminator，服務無法分辨讀到的是 operand 還是 transfer。錯誤選項：初始記憶體並不含 i 的內容（只有數量）；這也不是 0.7.1 的 account-info version byte（那個 0 在 C(255, s) 的值開頭），而且 0.8.0 transfers 仍是 accumulate 的輸入；GP 也沒有「transfer 在前、用固定長度分辨」的規則——operand 的 ↕t 和 O(l) 本來就是變長。你們的實作正好對應：operand 用 0、transfer 用 1，Operand.Encode 的 GasLimit 走 EncodeInteger（compact，與 GP 的 g 一致），AuthOutput 帶長度前綴。三個干擾補充錯在哪：說 fetch 只服務 work-package 資料、項目因此不必自我描述的那個，直接與 §B.4 的 φ_10 = 14／15 兩個 case 衝突（那兩個 case 回傳的正是 E(↕i) 與 E(i[φ_11])）；說 Ψ_A 收的是「operand 一串、transfer 另一串」兩個序列的那個，與 eq. B.9 的簽名 (…, ⟦operand tuple ∪ deferred transfer⟧) 不符，0.8.0 也沒有拿掉任何一個 discriminator；說服務靠 Ψ_M 的初始參數同時拿到兩個數量的那個，錯在初始參數只有 E(t, s, |i|) 這一個總數。","trap":"1 = transfer、0 = operand；memo 128 octets 無前綴；fetch 14/15 把整段 E(↕i) 或單一 E(i[k]) 交給服務。"},{"id":"appD-leaf-first-octet","ch":"D","section":"D.2.1 Node Encoding and Trie Identification","gpRef":"§D.2.1 functions B and L (unlabelled)","difficulty":3,"kind":"calc","tags":["merklization","trie","calc"],"stem":"In the state trie, what is the first octet of the 64-octet leaf node for a value of exactly 32 octets, and what is it for a value of 33 octets?","options":["0x80 and 0xC0 — the length is not part of the first octet; it is recovered from the zero padding","0xA0 and 0xA1 — the 6-bit length field holds any length up to 63, so 33 still fits as an embedded value","0xC0 for both — 32 octets already needs the full value slot, so both are regular leaves storing H(v)","0xA0 for the 32-octet value and 0xC0 for the 33-octet value — the low six bits hold the embedded value length"],"answer":3,"explanation":"§D.2.1：L(k, v) = [1, 0] ⌢ bits(E_1(|v|))[2..] ⌢ bits(k) ⌢ bits(v) ⌢ [0, 0, …] 當 |v| ≤ 32；否則 [1, 1, 0, 0, 0, 0, 0, 0] ⌢ bits(k) ⌢ bits(H(v))。bits() 是 MSB-first（§3 notation：bits([160, 0]) = [1, 0, 1, 0, 0, …]）。|v| = 32：E_1(32) = [0x20] = 0010_0000，去掉前兩個 bit 得 10_0000，接在 [1, 0] 後 → 1010_0000 = 0xA0；也就是「embedded-value leaf，6-bit 長度 = 32」。|v| = 33：條件 |v| ≤ 32 不成立 → regular leaf，第一個 octet 固定 1100_0000 = 0xC0，最後 32 octets 放 Blake2b(v)。所以邊界是「≤ 32 內嵌、> 32 存 hash」：32 octets 剛好填滿值槽仍算內嵌（省一次 hash）；33 雖然 6 bits 裝得下，但規則以 32 為界，0xA1 不存在於合法 trie。0x80 是長度 0 的 embedded leaf（空值），不是「不含長度」。補充：branch node 第一個 octet = 左子 hash 第一個 byte 去掉最高位（bits(l)[1..]），即 l_0 & 0x7F，右子 hash 完整 32 bytes。你們的 encodeLeafNode 就是 `node[0] = 0x80 | byte(len(value))` 與 `node[0] = 0xC0`，encodeBranchNode 是 `node[0] = left[0] & 0x7F`——與 GP 完全一致。","trap":"10 + 6-bit 長度（≤ 32）→ 內嵌；11000000 → 存 H(v)；0 + 255 bits 左 + 256 bits 右 → branch。"},{"id":"appD-code-service-info-key","ch":"D","section":"D.1 Serialization (state-key constructor C)","gpRef":"§D.1 state-key constructor C (unlabelled first equation of appendix D)","difficulty":3,"kind":"code","tags":["merklization","state-keys","fuzzer-bug"],"stem":"Before PR #780 the team recognised a service-info key C(255, s) by testing only stateKey[0] == 0xFF, and fuzzer traces failed with 'failed to decode expected service info from state key 0xffff0017…: EOF'. Why was byte 0 alone ambiguous, and why is the current check sound?","code":{"lang":"go","caption":"internal/utilities/merklization/parse_state_key_vals.go (IsServiceInfoKey) + state_key_constructor.go (ServiceWrapper.StateKeyConstruct)","src":"func IsServiceInfoKey(stateKey types.StateKey) bool {\n\tif stateKey[0] != 0xFF {\n\t\treturn false\n\t}\n\tfor i := 1; i < len(stateKey); i++ {\n\t\tif i == 1 || i == 3 || i == 5 || i == 7 {\n\t\t\tcontinue\n\t\t}\n\t\tif stateKey[i] != 0 {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}\n\n// [n_0, h_0, n_1, h_1, n_2, h_2, n_3, h_3, h_4, h_5,...,h_26] where n = encode_4(service_id)\nfunc (w ServiceWrapper) StateKeyConstruct() (output types.StateKey) {\n\tn := encodeServiceID(w.ServiceIndex)\n\ta := hash.Blake2bHashPartial(w.h[:], 27)\n\tfor i := 0; i <= 3; i++ {\n\t\toutput[2*i] = n[i]\n\t\toutput[2*i+1] = a[i]\n\t}\n\tfor i := 4; i <= 26; i++ {\n\t\toutput[i+4] = a[i]\n\t}\n\treturn output\n}"},"options":["C(255, s) keys for service ids above 2^24 spill their fourth id octet into position 9, so byte 0 alone cannot separate them from the chapter keys C(9)…C(16); the fix therefore skips positions 1, 3, 5, 7 and tolerates position 9 as well","The chapter key C(255) of the accumulation-output component θ shares its first octet with C(255, s); the fix tells them apart by demanding a non-zero service id in positions 1, 3, 5, 7 and zeros everywhere else","Because C(s, h) hashes the service id together with the key, every octet of such a key — the first one included — is uniformly random, so about 1/256 of them start with 0xFF; the fix re-hashes the whole key so the 0xFF prefix becomes unreachable","C(s, h) keys start with n_0, the low octet of E_4(s), so every service with s mod 256 = 255 yields storage/preimage/request keys beginning 0xFF; the new check also requires zeros in all non-service-id positions, which a Blake2b-derived key matches only with negligible probability"],"answer":3,"explanation":"§D.1：C(i) = [i, 0, 0, …]；C(i, s) = [i, n_0, 0, n_1, 0, n_2, 0, n_3, 0, 0, …]（n = E_4(s)）；C(s, h) = [n_0, a_0, n_1, a_1, n_2, a_2, n_3, a_3, a_4, …, a_26]（a = H(h)）。關鍵在第三種：第 0 個 octet 是 n_0 = service id 的最低 byte，完全不是隨機值——只要 s ≡ 255 (mod 256)（255、511、…、0x????00FF），該 service 的所有 storage（h = E_4(2^32−1) ⌢ k）、preimage（E_4(2^32−2) ⌢ hash）、request（E_4(l) ⌢ hash）key 都以 0xFF 開頭。舊碼把它們當成 C(255, s) 去解 89-octet 的 account info，值太短就 EOF（issue #779，fuzzer trace 0xffff0017…）。修正後的 IsServiceInfoKey 除了 byte 0 = 0xFF，還要求位置 2、4、6 與 8…30 全為 0；C(s, h) 要滿足這點需要 a_0…a_3 與 a_4…a_26 共 27 個 Blake2b 輸出 byte 全為 0，機率 2^−216，可視為不可能。其它選項：service id 只佔位置 1、3、5、7 四個 octet，任何 32-bit id 都放得下，沒有「溢出到位置 9」；C(s, h) 並沒有把 service id 混進 hash，第一個 byte 是 n_0 而非隨機，修正也沒有再 hash；chapter key 只有 C(1)…C(16)（θ 是 C(16)），不存在 C(255)。順帶一提，§D.1 末段允許實作不保存原始 storage key，只保存 hash 後的 31-byte key——這正是你們 unmatched key-vals 機制的依據。","trap":"31-byte key 的第 0 個 byte：C(i) 是 chapter 編號、C(255, s) 是 255、C(s, h) 是 service id 的低 byte——三者可能相同。"},{"id":"appF-code-shuffle","ch":"F","section":"F Shuffling (Fisher–Yates)","gpRef":"eq. F.1 (shuffle), F.2 (Q_l), F.3 (hash form); eq. 11.20–11.22 (guarantor assignment R, P, M); eq. 17.3 and the tranche-0 selection that follows it","difficulty":2,"kind":"code","tags":["shuffle","guarantor-assignment","calc"],"stem":"This is the team's implementation of the shuffle F of eq. F.1. For s = [10, 20, 30, 40] and r = [3, 6, 4, 5], what does it return, and is the in-place swap faithful to the GP definition?","code":{"lang":"go","caption":"internal/utilities/shuffle/shuffle.go (FisherYatesShuffle)","src":"func FisherYatesShuffle(s []types.U32, r []types.U32) []types.U32 {\n\tl := len(s)\n\n\t// If the sequence is empty, return an empty slice\n\tif l == 0 {\n\t\treturn make([]types.U32, 0)\n\t}\n\n\t// Calculate the index\n\tindex := r[0] % types.U32(l)\n\n\t// The selected element\n\tselected := s[index]\n\n\t// Swap elements\n\ts[index], s[l-1] = s[l-1], s[index]\n\n\t// Recursively shuffle the remaining elements\n\tshuffledRest := FisherYatesShuffle(s[:l-1], r[1:])\n\n\t// Return the shuffled sequence\n\treturn append([]types.U32{selected}, shuffledRest...)\n}"},"options":["[20, 30, 10, 40]; not faithful — GP's result is the array left in place after all swaps have been applied, not the sequence of picked elements, so this function returns the reverse of what eq. F.1 defines","[40, 10, 30, 20]; faithful — GP writes s_{l−1} into the picked slot and drops the last position, and swapping then slicing off the tail is the same thing (the caller's slice is mutated as a side effect)","[40, 10, 20, 30]; not faithful — GP removes the picked element and shifts the remainder left, preserving relative order, so the swap with s[l-1] silently permutes the survivors","[40, 30, 10, 20]; not faithful — GP takes every r_i modulo the original length l and indexes the original sequence without shrinking it, discarding duplicates only at the end"],"answer":1,"explanation":"eq. F.1：F(s, r) = [s_{r_0 mod l}] ⌢ F(s′[..l−1], r[1..])，其中 s′ = s 但 s′_{r_0 mod l} = s_{l−1}——輸出是「依序挑出的元素」，被挑走的洞由『最後一個』元素填補，再把長度縮 1。逐步：l = 4，3 mod 4 = 3 → 挑 40，s′ = [10, 20, 30]（洞就在最後，等同截掉）；l = 3，6 mod 3 = 0 → 挑 10，s′_0 = s_2 = 30 → [30, 20]；l = 2，4 mod 2 = 0 → 挑 30，s′_0 = 20 → [20]；最後挑 20。結果 [40, 10, 30, 20]。程式碼把 s[index] 與 s[l−1] 對調再取 s[:l−1]：對調後 index 位置放的正是 s_{l−1}，而移到尾端的元素被切掉，與 GP 完全等價；唯一差別是它就地修改呼叫者的 slice（guarantor_assignments.go 與 auditing.go 每次都建新 slice，所以無害）。其它選項對應的錯誤：[40, 10, 20, 30] 是「移除後左移、保序」的刪法；[20, 30, 10, 40] 是把經典 in-place Fisher–Yates 跑完後的陣列當結果（剛好是 GP 輸出的反序）；[40, 30, 10, 20] 是每次都用原長度取模、不縮短序列。eq. F.2/F.3：F(s, h) = F(s, Q_l(h))，Q_l(h)_i = decode_4(H(h ⌢ E_4(⌊i/8⌋))[4i mod 32 ..+4])——每個 Blake2b 供 8 個索引，1023 個 validator 需 128 次 hash。用途：eq. 11.21 的 guarantor 指派 P(v, e, t) = R(F([⌊i/3⌋ | i ∈ N_v], η′_2), ⌊(t mod E)/R⌋)（0.8.0 用 |κ′| 與 ⌊i/3⌋，0.7.2 是 ⌊C·i/V⌋），以及 ch. 17 初始 audit tranche F(reports, Y(seed_0))[..10]（eq. 17.3 之後的 tranche-0 式）。官方 shuffle 向量（jamtestvectors/shuffle，長度 0…341）可驗證 Q_l 與 F 的組合。","trap":"GP 的 F 輸出「挑選順序」，洞由最後一個元素補；用 η′_2（不是 η′_1）避免 epoch 末的 fork 放大。"},{"id":"appG-ietf-vs-ring","ch":"G","section":"G Bandersnatch VRF (IETF VRF vs Ring VRF)","gpRef":"§G; §3 cryptography notation; eq. 6.4, 6.14–6.18, 6.30; eq. 17.3 (audit seed)","difficulty":2,"kind":"concept","tags":["bandersnatch","vrf","ring-vrf","safrole"],"stem":"JAM uses two Bandersnatch constructions: singly-contextualized IETF VRF signatures and ring-VRF proofs. Which statement about where each is used, its size and the output function Y is correct?","options":["Only ticket proofs in E_T are 784-octet ring-VRF proofs (anonymous, checked against a 144-octet ring root); the seal H_S, entropy H_V and audit seeds are 96-octet IETF VRF signatures under a named key; in both, Y(·) is the Blake2b hash of the whole signature, so it moves with the signed message — which is why tickets sign the empty message","Only ticket proofs in E_T are 784-octet ring-VRF proofs (anonymous, checked against a 144-octet ring root); the seal H_S, entropy H_V and audit seeds are 96-octet IETF VRF signatures under a named key; in both, Y(·) is the first 32 octets of the VRF output and depends on the context, not the message","Only ticket proofs in E_T are 784-octet ring-VRF proofs, checked against a 32-octet ring root committed over the active set κ′ rather than the pending set; the seal H_S, entropy H_V and audit seeds are 96-octet IETF VRF signatures under a named key; Y(·) is the first 32 octets of the VRF output, and a key zeroed by Φ is dropped from the ring so the ring shrinks with the offender count","Both the seal H_S and the ticket proof are 784-octet ring-VRF proofs checked against the 144-octet γ′_Z — that is what keeps the block author anonymous until the epoch ends; the entropy H_V and the audit seeds are 96-octet IETF VRF signatures under a named key; in both, Y(·) is the full 64-octet VRF output and depends on the context, not the message"],"answer":1,"explanation":"§G：V_k⟨c⟩(m) ⊂ B_96 是 IETF VRF（RFC 9381 樣板）——簽名者由公開金鑰 k 指名；V̄_r⟨c⟩(m) ⊂ B_784 是 ring VRF（Pedersen VRF + zk-SNARK），只證明「ring 裡某個成員」簽了，匿名；O(⟦k⟧) ∈ B_144 是 ring root（commit）。用途：eq. 6.30 的 ticket proof p ∈ V̄_{γ′_Z}⟨X_T ⌢ η′_2 ⌢ [e]⟩([])——唯一的 ring VRF；eq. 6.16/6.17 的 seal H_S ∈ V_{H_A}⟨X_T ⌢ η′_3 ⌢ [i_e]⟩(E_U(H)) 或 ⟨X_F ⌢ η′_3⟩，eq. 6.18 的 H_V ∈ V_{H_A}⟨X_E ⌢ Y(H_S)⟩([])，以及 eq. 17.3 的 audit seed ∈ V_{κ[v]_b}⟨X_U ⌢ Y(H_V)⟩([])——都是 IETF、由 H_A = κ′[H_I]_b 指名。Y(x) = output(x)[..32]：VRF 輸出的前 32 octets，§3 特別註明它「influenced by x（context）but not by m（message）」——所以 ticket id = Y(p) 只由 η′_2 與 entry index 決定，seal 的 Y(H_S) 也不受 header 內容影響（這正是 H_V 能用它當 context 的原因）。錯誤選項：seal 不是 ring proof，作者由 H_I 公開指名，匿名的是『票』在被使用前不可連結到驗證者；Y 不是簽名的 Blake2b；ring root 是 eq. 6.14 的 z = O([k_b | k ∈ γ′_P])——用『下一個 epoch 的 pending set』而非 κ′，而 offenders 的 key 被 Φ 換成全 0（eq. 6.15），§G 規定「無對應 Bandersnatch point 的 key 以 padding point 代替」，ring 大小不變。你們 #1040 的修正正是基於「ring commitment 是 Bandersnatch keys 的純函數」。逐一看干擾新增的主張：說 seal 與 ticket 都是 784-octet ring proof、且 Y(·) 是完整 64-octet VRF output 的那個，兩點都錯——seal 走 eq. 6.16/6.17 的 IETF 形式且由 H_I 公開指名作者，而 §G 定義 Y(s) ≡ output(s)[..32]（取前 32 octets）；說 Y(·) 是整個簽名的 Blake2b、會隨被簽訊息而變的那個，錯在 Y 取的是 VRF output 本身而非簽名的雜湊，§3 也註明它受 context 影響、不受 message 影響（ticket 簽空訊息並不是為了固定 identifier，而是因為 identifier 本來就與 message 無關）；說 ring root 只有 32 octets、承諾在 κ′ 上、且被 Φ 歸零的 key 會被剔除使 ring 變小的那個，三點都錯——ring root ∈ B̊ ⊂ B_144，eq. 6.14 的 z = O([k_b | k ∈ γ′_P]) 用的是 pending set，而 §G 規定無對應 Bandersnatch point 的 key 以 padding point 代入，ring 大小不變。","trap":"ring VRF 只用在 ticket；seal/entropy/audit 都是 IETF；γ_Z 來自 γ′_P（pending），壞 key 用 padding point。"},{"id":"appG-signing-contexts","ch":"G","section":"Signing contexts X (definitions appendix) and their primitives","gpRef":"definitions appendix §Signing Contexts; eq. 6.16–6.18, 6.30, 11.14, 11.28, 17.3, 17.7, 17.16, 18.1; ch. 10 culprit/fault signature rules","difficulty":2,"kind":"concept","tags":["signing-contexts","bandersnatch","ed25519","bls"],"stem":"Each JAM signature is domain-separated by a context string X. Which of the following (context → primitive → use) statements is correct?","options":["X_E = $jam_entropy is an Ed25519 signature by the author over the unsigned header E_U(H); the Blake2b hash of that signature is what feeds the entropy accumulator η′_0 each block","X_U = $jam_audit is the Ed25519 context under which validators sign the judgments that appear in the verdicts of the disputes extrinsic E_D, one signature per report hash","X_T = $jam_ticket_seal is used twice: for the ring-VRF ticket proof (context X_T ⌢ η′_2 ⌢ [e], empty message, root γ′_Z) and for the regular IETF-VRF seal (context X_T ⌢ η′_3 ⌢ [i_e], message E_U(H))","X_G = $jam_guarantee is a Bandersnatch VRF context over H(w), and its output Y(·) doubles as the guarantee identifier stored with the availability assignment in ρ"],"answer":2,"explanation":"definitions 附錄「Signing Contexts」：X_A = $jam_available（Ed25519，assurances；eq. 11.14 簽 X_A ⌢ H(E(H_P, bitfield))）；X_B = $jam_beefy（BLS，eq. 18.1 簽 X_B ⌢ 最新 β_H 的 super-peak）；X_E = $jam_entropy（Bandersnatch IETF，eq. 6.18：context X_E ⌢ Y(H_S)、訊息為空，不是 Ed25519，也不簽 header）；X_F = $jam_fallback_seal（Bandersnatch，eq. 6.17）；X_G = $jam_guarantee（Ed25519，eq. 11.28 guarantee 簽 X_G ⌢ H(w)，ch. 10 的 culprit 也用它簽 X_G ⌢ report hash）；X_I = $jam_announce（Ed25519，eq. 17.7 的 audit announcement）；X_T = $jam_ticket_seal（Bandersnatch ring VRF 出票 + IETF 正常 seal）；X_U = $jam_audit（Bandersnatch，audit 選取熵，eq. 17.3 的 seed_0 與 eq. 17.12 的 seed_n）；X_valid/X_invalid = $jam_valid/$jam_invalid（Ed25519，judgments 與 faults，eq. 17.16、ch. 10）。所以 X_T 一個字串兩種用法是對的——差別在 η′_2 vs η′_3、ring vs IETF、空訊息 vs E_U(H)。X_G 不是 VRF，guarantee 沒有 identifier；X_U 是 Bandersnatch 的 audit seed，judgment 用 X_valid/X_invalid。你們 const.go 的 JamEntropy/JamFallbackSeal/JamTicketSeal/JamValid/JamInvalid/JamAvailable/JamBeefy/JamGuarantee/JamAnnounce/JamAudit 逐一對應；#940 的 bug（用公鑰簽 judgment）就是 X_valid 這條路徑。","trap":"口訣：Bandersnatch = T/F/E/U（票、備援 seal、熵、audit）；Ed25519 = A/G/I/valid/invalid；BLS = B。"},{"id":"arch-beefy-commitment","ch":"ARCH","section":"18 Beefy Distribution (ch. 18)","gpRef":"eq. 18.1–18.2; eq. 7.7–7.8; §19–20","difficulty":2,"kind":"concept","tags":["beefy","grandpa","bridging","off-chain"],"stem":"Per the Beefy Distribution chapter, what does a validator sign, with which key, and when — and what is the signature for?","options":["For each block it authors: a Bandersnatch VRF signature (context $jam_beefy) over the accumulation-output root M_B(s, H_K) of that block, which is placed in the header's H_O marker and is the datum that Grandpa voters sign when they finalize the block","After importing each finalized block: a BLS12-381 signature under κ′[v]'s BLS key over $jam_beefy ⌢ b, where b is the Keccak MMR super-peak of the accumulation-output belt held in the newest β_H entry; the signatures are published freely so they can be aggregated into concise finality proofs for third-party systems such as bridges","After importing every block, finalized or not: a BLS12-381 signature under the validator's BLS key over the posterior state root M_σ(σ′), so that light clients can verify the newest state; Grandpa then aggregates these signatures into its finality justification instead of running its own vote round","Once per epoch: an Ed25519 signature over the Keccak hash of the epoch's last header, published alongside the epoch marker H_E so that parachains bridged through the CoreChains service can prove that the whole epoch was finalized without tracking individual blocks"],"answer":1,"explanation":"§18：「For each finalized block B which a validator imports, said validator shall make a BLS signature on the BLS12-381 curve… affirming the Keccak hash of the block's most recent Beefy MMR. This should be published and distributed freely… These signatures may be aggregated in order to provide concise proofs of finality to third-party systems.」eq. 18.1：Ξ_v ≡ S^BLS_{κ′[v]_bls}⟨X_B ⌢ last(β_H)_b⟩，eq. 18.2：X_B = $jam_beefy。b 是 β_H 最新一筆的 accumulation-output super-peak：eq. 7.7 先把 θ′ 的 (service, hash) 序列用 M_B(s, H_K) 取根、append 進 belt β′_B，eq. 7.8 再以 App. E 的 super-peak 函數 M_R（H_K($peak ⌢ …)）算出 b——全程 Keccak，§7 明說是「to maximize compatibility with legacy systems」（EVM 系橋用 Keccak precompile 便宜驗證）。所以簽的不是 state root、不是 header hash，也不是每個 block 都簽，只有「已 finalized 且已 import」的 block。分工：Grandpa（§19）負責 JAM 內部 finality，投票資料是 best header＋posterior state root；Beefy 是給鏈外系統看的可聚合 BLS 承諾（聚合機制見 eprint 2022/1611）。「每個 block 簽 posterior state root」錯在對象與時機（那是 Grandpa vote 的內容，且 Grandpa 不靠 BLS 聚合）；「每 epoch 一次 Ed25519」錯在金鑰型別與頻率；「Bandersnatch VRF → H_O」錯在 H_O 是 offenders marker，Bandersnatch 只用於 seal／ticket／entropy／audit VRF。validator key K 的 BLS 公鑰佔 144 bytes（offset 64）。團隊程式：internal/recent_history 的 AppendAndCommitMmr 以 hash.KeccakHash 建 MMR 並回傳 SuperPeak（即 b）；Beefy 簽章本身屬 M2 node 範圍，main 尚未實作。§20 預算：Grandpa＋Beefy 合佔 1/16 CPU、每 slot 各 4 MB 上下行。","trap":"三種金鑰三種用途：Bandersnatch = seal/ticket/entropy/audit VRF；Ed25519 = guarantee/assurance/judgment/announcement；BLS = 只有 Beefy（GP 未指定 Grandpa 投票的金鑰型別）。"},{"id":"arch-best-chain-selection","ch":"ARCH","section":"19 Grandpa and the Best Chain (ch. 19)","gpRef":"eq. 19.1–19.4; §17 (ban-listing)","difficulty":2,"kind":"concept","tags":["best-chain","grandpa","auditing","off-chain"],"stem":"How does a node choose the best block B♭ on which it builds and casts Grandpa votes, and what data does the vote carry?","options":["Candidates are all blocks whose parent is known; the chain with the most fallback-sealed ancestors wins because fallback keys belong to the honest majority; the vote carries the header plus the accumulation-output super-peak so that bridges can reuse Grandpa justifications","Candidates must descend from the latest finalized block, be considered audited, and contain no unfinalized ancestor at a timeslot where the node has seen an equivocation; among them the chain with the most ticket-sealed (non-fallback) ancestors wins; the vote carries the best header together with its posterior state root","Longest-chain rule among descendants of the finalized block; two valid blocks at the same timeslot are both kept because Safrole tolerates equivocation; audited status only gates accumulation, not voting; the vote carries the header hash together with the prior state root H_R taken from the header","Candidates must descend from the finalized block and carry the most guarantees; the chain with the greatest cumulative timeslot wins so that stalled cores are penalised; the vote carries the header only, since Grandpa is independent of state and the state root is supplied by Beefy"],"answer":1,"explanation":"§19 可接受集合（eq. 19.1–19.3）：A(H♭) ∋ H♮（以最新 finalized block 為祖先）；U♭ ≡ ⊤（已審計：§17 eq. 17.19，該 block 剛 available 的 R 中每個 report 都滿足 U(w)）；∄ H^A ≠ H^B 使 H^A_T = H^B_T、H^A ∈ A(H♭) 且 H^A ∉ A(H♮)（未 finalized 的 equivocation）。eq. 19.4：在可接受集合裡最大化 m = Σ_{H^A ∈ A♭} isticketed^A，即用 ticket 而非 fallback key seal 的祖先數——§17 也說 best block 是「the chain with the most regular Safrole blocks which does not contain any such disregarded block」，而被至少 1/3 驗證者判無效的 report 一旦被 accumulate，整條鏈不可再建塊（「may require reversion to an earlier head or alternative fork」）。投票資料：「the block header of the best block together with its posterior state root M_σ(σ′)」——header 只帶 prior root（§5 為了 pipelining），Grandpa 的下游要能驗證最新狀態；後果是投票前必須先算完 posterior state，且「votes for the same block hash but with different associated posterior state roots are considered votes for different blocks」（只在節點失誤或文件歧義時發生）。干擾項：longest chain 不是規則；Safrole 只是把每個 slot 限制為單一作者，equivocation 仍是要排除的失誤；「audited 只管 accumulation」錯（§17：投 Grandpa 票前必須視該 block 為 audited）；「guarantee 最多／timeslot 最大」不是準則；「fallback 最多者勝」方向相反；prior root 或 super-peak 都不是投票內容（super-peak 是 Beefy 的事）。團隊：fuzz target 以 RestoreBlockAndState(parent) 處理 fork（internal/fuzz/service.go）；#892 處理重複 slot／未知 parent；#783 曾把 prior/posterior root 搞反。","trap":"GP 明說：block 是否 audited 在 finalize 當下可能沒有共識，但「This does not affect the crypto-economic guarantees」——最終會有共識。"},{"id":"arch-audit-tranches","ch":"ARCH","section":"17 Auditing and Judging (ch. 17)","gpRef":"eq. 17.1–17.19 (PDF numbering); §20 (10 audits/validator/slot)","difficulty":3,"kind":"concept","tags":["auditing","elves","tranches","off-chain"],"stem":"In the auditing protocol, how does a validator decide which newly-available work-reports it must audit, and how does that set grow over time?","options":["Tranche 0: shuffle the per-core list of just-available reports with a Bandersnatch VRF output (context $jam_audit ⌢ Y(H_V)) and take the first 10 non-empty entries; a new tranche starts every A = 8 s, adding a report either unconditionally (a negative judgment was seen) or by a per-report VRF whose acceptance chance grows with the previous tranche's no-shows, tuned so that F = 2 validators are expected per no-show","Tranche 0: each validator audits the reports of the cores it guarantees in the current rotation, since it already holds the bundle; every 8 s it adds F = 3 further reports chosen by shuffling with η′_3; a report counts as audited as soon as its three guarantors have re-attested, and negative judgments are gossiped between validators but never placed on-chain","Tranche 0: the three guarantors of each core re-execute their own report so that the accused party bears the cost; every 6 s (one slot) the remaining validators are added round-robin until more than 2/3 have judged, at which point the report counts as audited and any validator that judged negatively is slashed; no announcements are needed because the round-robin order follows from the block hash","Tranche 0: a Fisher–Yates shuffle of κ seeded with η′_2 assigns exactly 30 auditors to every report, matching the 30 audits per report of §20; a report is audited once those 30 positive judgments are in, and no VRF is involved after tranche 0 because the assignment is fixed for the whole epoch; later tranches only ever occur if a negative judgment appears"],"answer":0,"explanation":"eq. 17.1–17.2：q 是長度 |κ|/3（active cores 數）的序列，core c 的位置放 ρ[c] 的 report（若 ∈ R，即本 block 剛 available）否則 ∅。eq. 17.3：s_0 ∈ S^bs_{κ[v]_bs}⟨X_U ⌢ Y(H_V)⟩[]（Bandersnatch VRF，context $jam_audit 接本 block entropy VRF 輸出、空訊息）；eq. 17.5：a_0 = {w | w ∈ F(q, Y(s_0))[..10], w ≠ ∅}——Fisher–Yates 洗牌後取前 10 個非空。eq. 17.6：n = ⌊(T − P·H_T)/A⌋，A = 8 秒。新 tranche 的兩種來源：看到 negative judgment（一律必審）；或前一 tranche 的 judgment 數 < announcement 數（no-show）——後者用 eq. 17.13–17.15：s_n(w) 以 X_U ⌢ Y(H_V) ⌢ H(w) ++ n 為 context，條件 (|κ|/(256·F))·Y(s_n(w))_0 < |A_{n−1}(w) ∖ J_⊤(w)|，F = 2 是「the expected number of validators which will be required to issue a judgment for a work-report given a single no-show in the tranche before」（ELVES 論文模型顯示最佳）。每個 tranche 都先發 announcement（eq. 17.7：Ed25519 簽 X_I ++ n ⌢ x_n ⌢ H(H)，附 VRF 證據與前一 tranche 未配對的 announcement），且「Publication of an announcement should be taken as a contract to complete the audit regardless of any future information」。審計本體：向 1/3 驗證者索取 chunk 以 R_{|κ|} 重建 bundle（full 需 342 片），重算 Ξ(p, w_c, w_l, (w_a)_n) 必須與 w 相等（解碼失敗即無效，eq. 17.16），再以 Ed25519 發 judgment（eq. 17.17，context $jam_valid／$jam_invalid ⌢ H(w)）。eq. 17.18：U(w) ⟺ (J_⊥(w) = ∅ ∧ ∃n: A_n(w) ⊆ J_⊤(w)) ∨ |J_⊤(w)| > 2/3·|κ|；eq. 17.19：block audited ⟺ ∀w ∈ R: U(w)。後果：>2/3 仍判 positive → 判 negative 者可能因 time-wasting 受罰；>1/3 判 negative → 含該 report 的 block 被 ban-list、子孫全部不可建塊；block author 可組 verdict 放入 E_D（放在該 report 尚未 accumulate 的鏈上，會清掉 ρ 對應項）。§20 的「每驗證者每 slot 平均 10 次審計 → 每 report 約 30 次」是期望值，不是固定指派。干擾項錯處：選擇是 VRF 隨機抽樣而非 guarantor 自審（被懷疑的正是 guarantor，自審沒有安全意義），週期是 A = 8 秒非 6 秒，也沒有全體輪流；announcement 更不是可省的——每個 tranche 都要簽發，且「Publication of an announcement should be taken as a contract to complete the audit regardless of any future information」；「判 negative 就罰」也錯，GP 說的是「>2/3 仍判 positive」時判 negative 者才可能因 time-wasting 受罰。η′_2 是 fallback key sequence 的種子而不是審計種子，審計用的是專用 Bandersnatch VRF；30 是 §20 的期望值而非固定指派，audited 的判準是 J_⊥ 為空且某個 tranche 的 announce 集合全部回了 positive，或 positive 超過 2/3·|κ|，不是「湊滿 30 個 positive」；tranche 0 之後仍有 per-report VRF，指派也不會整個 epoch 固定。F = 3、η′_3 都錯（F = 2，context 是 X_U ⌢ Y(H_V) ⌢ H(w) ++ n）；announce ≠ judgment——no-show 正是「announce 了卻沒 judgment」，之後仍會再開 tranche；negative judgment 也不會只在驗證者之間流傳，票數足夠時 block author 就會組成 verdict 放進 E_D 上鏈。ELVES 對照：backing/approval/inclusion = guaranteeing/auditing/accumulation。團隊：internal/auditing（#935 ComputeInitialAuditAssignment 漏 ValidatorID 導致只能靠超多數規則過關；#956 ComputeAnForValidator 門檻 s_n(w)[0]·V/(256·F) < m_n；#940 BuildJudgements 誤用公鑰簽名）；網路 CE144 announcement／CE145 judgment。","trap":"F = 2 的直覺：每個 no-show 期望「再多 2 個人」來審；一個 negative judgment 則是「所有人都要審」。"},{"id":"arch-guaranteeing-procedure","ch":"ARCH","section":"15 Guaranteeing (ch. 15)","gpRef":"§15; eq. 14.13 (Ξ); eq. 11.24, 11.28","difficulty":2,"kind":"concept","tags":["guaranteeing","off-chain","work-reports"],"stem":"Which statement about the honest guarantor strategy described in the Guaranteeing chapter is correct?","options":["Sign the report with the Bandersnatch key under the $jam_guarantee context so that the ring proof hides which of the core's guarantors signed, so the on-chain credential carries no validator index; two signatures suffice for distribution; guarantors should never sign more than one report per epoch, otherwise the block author's anti-spam filter disregards them for the rest of the epoch","Run every work-item's refine first and check authorization only afterwards, since the pool is re-verified on-chain anyway and refine dominates the cost; all three guarantors' signatures must be collected before the report may be sent to the block author; any report the block author declines to include counts as an offence and is slashed exactly like an invalid report; a guarantor may sign at most one report per rotation","Use the chain state at the report's lookup-anchor rather than the current head for the pool check so that all guarantors of the core agree on the same view; a single signature suffices for distribution because the block author collects the remaining credentials itself; the credential list may therefore arrive unsorted, and the GP gives no guidance on how many reports a guarantor may sign per slot","Check the package's authorization against the authorizer pool of the most recent chain state (plus the other on-chain inclusion conditions) before running any refine logic; after r = Ξ(p, c, l, v), Ed25519-sign $jam_guarantee ⌢ H(E(r)); two signatures suffice to send the report to the next block author; an unincludable report only forfeits reward, a misrepresented Ξ result is punished severely; sign on average at most two reports per timeslot"],"answer":3,"explanation":"§15 流程：(1) 評估 work-package 的 authorization 並對照「the authorization pool in the most recent JAM chain state」；(2) 逐 work-item 執行 refine；(3) 依 erasure codec 切 bundle 與 exported data；(4) 組裝並發布 work-report；(5) 把 chunk 分發到驗證者集合；(6) 應要求提供 bundle／exported data。r = Ξ(p, c, l, v)（eq. 14.13）：guarantor 自行選 c（通常是自己被指派的 core）、l（segment-root dictionary，由先前 guaranteed 的 report 推得）、v（assuring validator set 大小，通常是 active set；遇 epoch 交界可對新舊兩個集合各編碼一次、產生兩份 report，但鏈上只能收一份，§14）。「When JAM chain state is needed, the chain state of the most recent block should always be utilized」——所以「用 lookup-anchor 的狀態」錯。簽章：payload (s, i)，s 是 Ed25519 對 X_G ⌢ H(E(r)) 的簽名（鏈上 eq. 11.28 同式；credential 2–3 個、依 validator index 排序且唯一，簽名者須為本或前一 rotation 指派到該 core，eq. 11.24）。「With two guarantor signatures, the work-report may be distributed to the forthcoming JAM chain block author」——不必集齊三個。激勵：「validators will be punished severely if they malfunction and commit to a report which does not faithfully represent the result of Ξ」；反之 contextual validity／pool 檢查沒做好「does not result in punishment, but will prevent the block author from including the report and so reduces rewards」——所以「被 block author 拒絕就 slash」錯。效率：所有這些檢查應在跑 Ψ_R 之前做完（「prior to evaluating the Ψ_R function」）；要把 package 轉給同 core 其他 guarantor 以形成共識；儘量帶齊 attestation 組成 extrinsic；為免被 block author 的 anti-spam 忽略，「guarantors should sign an average of no more than two work-reports per timeslot」（不是每 epoch 一份）。Bandersnatch／ring proof 是 Safrole 的工具，guarantee 用 Ed25519 且身分公開（credential 帶 validator index），所以「ring proof 隱藏簽名者、credential 不含 validator index」整段錯。先跑 refine 再驗 authorization 也違反 §15 的效率建議——所有 contextual 與 pool 檢查都應在「prior to evaluating the Ψ_R function」之前做完；「必須集滿三個簽名」與「單一簽名即可分發」也都錯，門檻就是兩個；credential 依 eq. 11.24 必須依 validator index 排序且不重複，block author 不會替你重排（你們的 #863／#860 正是踩到「not sorted or unique guarantors」）；「每 rotation 一份」「每 epoch 一份」同樣不是 GP 的建議值。團隊：CE133（builder→guarantor 提交）、CE134（guarantor 間分享）、CE135（report 分發）；#863/#860「not sorted or unique guarantors」錯誤碼、#864 guarantor 唯一性。","trap":"先驗 authorization 再跑 refine：白跑 Ψ_R 不會被罰，但浪費的是自己的 CPU 與獎勵。"},{"id":"arch-two-da-classes","ch":"ARCH","section":"16 Availability Assurance (ch. 16) & 14 Exporting / Availability Specifier","gpRef":"§16; §14 (Exporting, eq. 14.18); eq. 11.5, 11.11–11.18","difficulty":2,"kind":"concept","tags":["availability","erasure-coding","d3l","off-chain"],"stem":"Before a validator sets a core's bit in its assurance, which erasure-coded data must it hold, how is that data verified, and for how long must it be kept?","options":["Its bundle shard and segment shards, verified against the segments-root rather than the erasure-root since the erasure-root only commits to the bundle; the bundle shard is kept for 28 days while segment shards may be dropped once the report is accumulated, because accumulation copies the exported segments into on-chain service storage","The full work-package bundle plus every exported segment in clear (not shards), verified by recomputing the work-report locally before assuring, and kept for D = 19,200 slots so that any preimage referenced by the package can be re-verified during the dispute window","Only its shard of the work-package bundle; segment shards are fetched lazily by later importers directly from the guarantors of the exporting package; the bundle shard is retained for L = 14,400 slots (24 h) so that lookup-anchors stay auditable, and no proof is needed because the assurance signature is checked on-chain against the report's erasure-root","Both its shard of the auditable bundle (kept only until the report is considered audited / its block finalized, served on request until then) and its shards of every exported segment under the report's segments-root plus paged-proof data (the long-term D³L, kept ≥ 28 days = 672 epochs), each verified by a Merkle proof against the report's erasure-root before possession is claimed"],"answer":3,"explanation":"§16：「There are two classes of shard a validator must have for an availability assignment before claiming possession in an assurance」——(1) bundle 的 erasure-coded shard：「needed to verify the work-report's validity and completeness and need not be retained after the work-report is considered audited. Until then, it should be provided on request」；(2) segments-root 所指每個 exported segment 的 shard：「These should be retained for 28 days and provided to any validator on request」。驗證：「trivially proven through the work-report's work-package erasure-root and a Merkle-proof of inclusion in the correct location」，且「a validator should not claim possession of shards in an assurance unless it has, and has verified, the corresponding proofs」。§14 Exporting 把兩者稱為短期 Audit DA store（assurer 保留到「finality of the block in which the availability of the work-result's work-package is assured」）與長期 D³L（Distributed, Decentralized, Data Lake，≥ 28 天 = 672 個完整 epoch，還含 paged-proofs：每 64 個 segment 一頁 hash＋子樹證明）。Availability specifier（eq. 14.18／eq. 11.5）：erasure-root u = M_B(transpose[b♣, s♣])——同時承諾 bundle 與 segments（含 paged proofs）的 chunk，chunk 數 n = assuring validator set 大小；segments-root e 只承諾 exported segments 本身（constant-depth Merkle），所以「用 segments-root 驗 shard」與「erasure-root 只承諾 bundle」都錯。保留期限不是 L（14,400，lookup-anchor 上限）也不是 D（19,200，preimage expunge），bundle shard 也不是 28 天；鏈上對 assurance（eq. 11.11–11.14）只驗 Ed25519 簽章（X_A ⌢ H(E(H_P, f))）與 bitfield，不驗 shard 內容，所以證明必須自己在鏈下驗；accumulation 不會把 segment 複製上鏈（segment 只能被後續 work-package import）。鏈上規則對照：report 在 > 2/3·|κ| 的 assurance 後才 available（eq. 11.17），逾 U = 5 slot 未 available 則清出 ρ（eq. 11.18）。§20：全網 DA 容量約 2 PB、每節點最多 6 TB；assuring 每 slot 上行 144 MB。團隊：internal/store/work_package_bundle_store.go、CE137/138（shard 分發／audit shard 請求）、CE139/140（segment shard 請求）；#1035：erasure 參數依驗證者數（tiny 6 → 3 片可重建，full 1023 → 342 片）。","trap":"兩個 DA：短期 audit DA（bundle shard）vs 長期 import DA / D³L（segment shard＋paged proofs，28 天）——兩者都在同一個 erasure-root 之下。"},{"id":"arch-core-virtual-hardware","ch":"ARCH","section":"20.1 Technical Characteristics & 20.2 Illustrating Performance (ch. 20)","gpRef":"§20 Discussion","difficulty":2,"kind":"concept","tags":["performance","hardware","throughput","rationale"],"stem":"How does the Discussion chapter characterise the 'virtual hardware' that a work-package gets on a JAM core, and what happens to its result afterwards?","options":["Roughly one regular CPU core at 25–50% of native speed for the whole 6-second slot, about 2 MB/s of general-purpose I/O (which includes trustless reads of recent JAM state) and up to 2 GB of RAM, plus unlimited reads from a semi-static preimage store; the result is at most 48 KB and then gets ~10 ms on the same machine with no external I/O but full, immediate access to chain state","A CPU core at 25–50% speed with 2 GB RAM but no access to chain state whatsoever, since refine is stateless by construction, and with unbounded I/O because nothing ever leaves the core; the 48 KB result is then accumulated inside the audit budget (10/16 of CPU time), which is why accumulation is capped at 10^7 gas per report and 3.5·10^9 per block","A full validator machine (16 cores, 64 GB RAM, 8 TB) for one 6-second slot with unlimited chain-state I/O; the result may be up to 12 MB and is then accumulated for up to one second with the same I/O budget, which is why block execution is allotted 2/16 of validator CPU time in the performance model, and preimage lookups are metered against that same 12 MB budget","One CPU core at native speed for one second plus 5 MB of I/O per 6-second slot — the Polkadot parachain budget carried over unchanged so that CoreChains needs no re-tuning — with results up to 90 KB that are accumulated during the following slot with full state access and a further 6 s of execution; the semi-static preimage store is not reachable in-core at all"],"answer":0,"explanation":"§20.1：「What might be called the 'virtual hardware' of a JAM core is essentially a regular CPU core executing at somewhere between 25% and 50% of regular speed for the whole six-second portion and which may draw and provide 2MB/s average in general-purpose I/O and utilize up to 2GB in RAM. The I/O includes any trustless reads from the JAM chain state, albeit in the recent past. This virtual hardware also provides unlimited reads from a semi-static preimage-lookup database.」「Each work-package may occupy this hardware… to create some result of at most 48KB. This work-result is then entitled to 10ms on the same machine, this time with no 'external' I/O, but instead with full and immediate access to the JAM chain state.」對應常數：W_R = 48·2^10、G_R = 5·10^9（refine）、G_A = 10^7（每 report accumulate）、G_T = 3.5·10^9（每 block）、W_B = 13,791,360 ≈ 2 MB/s × 6 s。整台參考節點才是 16 核／64 GB／8 TB／0.5 GbE；CPU 分配 audits 10/16、block execution 2/16、Merklization、Grandpa+Beefy、erasure coding、networking 各 1/16；RAM：auditing 20 GB（10 個 PVM instance × 2 GB）、block execution 2 GB、state cache 40 GB（≈ 20,000 條 parachain 的 2 MB footprint）、misc 2 GB；頻寬每 slot 上行 304 MB／下行 281 MB（guaranteeing 106/48、assuring 144/13、auditing 0/133、authoring 53/87、Grandpa+Beefy 4/4），表中換算為 387/357 Mb/s（megabit），故建議 500 Mb/s 且要有 burst 餘裕；全網 DA 2 PB、每節點 ≤ 6 TB。干擾項錯處：整台 16 核／64 GB／8 TB 是參考「節點」而非單一 work-package 拿到的資源，12 MB 是 bundle 量級（W_B = 13,791,360）而不是 work-result 上限（W_R = 48 KiB），accumulate 拿到的是約 10 ms 而非 1 秒；preimage-lookup database 提供的是「unlimited reads」，不會被計進 I/O 預算。「1 秒原生算力＋5 MB I/O／6 秒」是 Polkadot parachain 的預算（GP：80 條 parachain ≈ 13× native CPU、67 MB/s），不是 JAM core；90 KB 的 result 上限沒有出處，accumulate 也不會再拿一個 6 秒，而 preimage store 在 in-core 是讀得到的。refine 更不是「完全無法讀狀態」——GP 明說「The I/O includes any trustless reads from the JAM chain state, albeit in the recent past」，而且 I/O 有 2 MB/s 預算、不是無上限；accumulate 屬 block execution（2/16）而非 audit 預算，10^7／3.5·10^9 的 gas 上限是 G_A／G_T 本身的規定，與 CPU 分配無關。吞吐估計（GP 自稱「a provisional and crude estimation only」）：JAM ≈ 85× single native CPU core 與 682 MB/s DA；simple-transfer 模型：12 MB package ÷ 128 B ≈ 96k tx，但 48 KB result ÷ 8 B（4 B index＋4 B balance）≈ 6k 筆更新 → 每 package ≈ 3k tx → 3k × 341 cores ÷ 6 s ≈ 171k TPS；若瓶頸改為 Merklization（500k–1M 次讀寫/秒）則 250k–350k TPS；把餘額更新也搬進 core 的分割模型可達 1.4M TPS 以上；EVM 對照：每 core ≈ 1,500 gas/µs（區間 500–5,000）vs Eth L1 1.25。三大來源：spatial parallelism、temporal parallelism（pipelining）、與硬體貼合的 VM/gas model。","trap":"「85×」是相對於單一 native CPU core（Polkadot 為 13×，即約 6.5 倍 Polkadot），不是「85 倍 Polkadot」；且全是模型估計。"},{"id":"arch-sweet-spot-further-work","ch":"ARCH","section":"21 Conclusion / 21.1 Further Work (ch. 21)","gpRef":"§21","difficulty":2,"kind":"rationale","tags":["rationale","future-work","architecture"],"stem":"The Conclusion calls JAM a 'sweet spot' and then lists what the paper deliberately leaves open. Which summary is accurate?","options":["Sweet spot = massive computation under secure, resilient consensus (unlike fully-synchronous models) with strict timing and integration guarantees into a singleton state machine (unlike persistently fragmented models); under consideration: synchronous service calls in accumulate, restricting `transfer` for parallel accumulation, reserving extra accumulate compute under certain conditions, and Merklizing the work-package format so authorization needs no full download; networking and token/coretime/staking layers are left out","Sweet spot = a fully fragmented design like Cosmos but sharing one validator set; under consideration: dropping Beefy in favour of Grandpa-only proofs, letting on-chain governance upgrade services in place, adding native signed transactions because the transfer model showed refine-only transfers are I/O-bound, and raising the 48 kB work-result limit so accumulate sees more data; coretime sales and staking are specified in the appendix","Sweet spot = the point where 341 cores exactly saturate a 0.5 GbE link; under consideration: synchronous calls between services during refine, removing the `transfer` host call entirely, lifting the per-block accumulate gas limit G_T, and introducing Merklization into the state trie so authorization can be judged without a full download; the networking protocol is fully specified in an appendix and validator rewards are already tracked on-chain","Sweet spot = as coherent as a fully synchronous chain while accepting Solana-class hardware requirements; open items: replacing ELVES auditing with SNARK proofs once proving cost falls under 50,000× native, shortening D³L retention from 28 days to 24 hours, moving refine's imported segments into the block body, and writing coretime sales and staking into a later chapter rather than delegating them to system services; the networking protocol is already fixed in an appendix"],"answer":0,"explanation":"§21：「We argue that the model of JAM provides a novel 'sweet spot', allowing for massive amounts of computation to be done in secure, resilient consensus compared to fully-synchronous models, and yet still have strict guarantees about both timing and integration of the computation into some singleton state machine unlike persistently fragmented models.」Further Work 明列四項可能修改：(1)「Synchronous calls between services in accumulate」；(2)「Restrictions on the transfer function in order to allow for substantial parallelism over accumulation」；(3)「The possibility of reserving substantial additional computation capacity during accumulate under certain conditions」；(4)「Introducing Merklization into the Work Package format in order to obviate the need to have the whole package downloaded in order to evaluate its authorization」。另外：「The networking protocol is also left intentionally undefined at this stage」（JAMNP-S 只在 docs.jamcha.in，且「will most likely not be formalized in the Graypaper」）；「we have also intentionally omitted details of higher-level protocol elements including cryptocurrency, coretime sales, staking and regular smart-contract functionality」；還需要更多實證效能研究、成本比較，以及 PVM 計量下 parachain-validation service 的吞吐原型。注意：§21 最後還寫「Validator performance is not presently tracked on-chain. We do expect this to be tracked on-chain in the final revision」——這段與 §13 的 π（0.6.4 起的 activity statistics）看起來不一致，疑似未更新的舊句，面試被問到時可指出。干擾項錯處：把 sweet spot 說成「和全同步鏈一樣 coherent，代價是接受 Solana 級硬體」與原句相反——JAM 標榜的是 mostly-coherent，§20 的參考硬體是 16 核／64 GB／8 TB 的一般規格，Solana 建議的 512 GB RAM 正是 §2 拿來批評的門檻；SNARK 取代 ELVES 與 §2 的論證相反（即使 50,000× 仍「several orders of magnitude」太貴）；D³L 28 天是刻意延長的設計而非待砍項；imported segment 靠 availability 系統的承諾取得，不會搬進 block body；cryptocurrency／coretime sales／staking 是「intentionally omitted」而非留到後面章節或附錄，networking protocol 同樣「left intentionally undefined at this stage」。把 sweet spot 說成「341 個 core 剛好塞滿 0.5 GbE」是把 §20 的頻寬模型誤當定義——該表算出的是每 slot 304／281 MB（約 387／357 Mb/s），並明說 500 Mb/s 留有「sufficient margin of error and headroom」；同步呼叫是在 accumulate 不是 refine；transfer 是「限制」不是移除；G_T = 3.5·10^9 仍是硬上限；要 Merklize 的是 work-package 格式，state trie 早已 Merklize（App. D）；而 §21 結尾明寫 validator performance「is not presently tracked on-chain」。把 sweet spot 說成「像 Cosmos 那樣完全分裂、只是共用 validator set」剛好否定了原句的「unlike persistently fragmented models」；JAM 協定本身不可升級、升級責任下放給 service；沒有 native signed transaction（§4.9.2 明說沒有 transactor 概念），且 §20 的轉帳模型給的是 171k–1.4m TPS 並強調「neither model to be bottlenecked in computation」；48 kB work-result 上限也不在 §21.1 的四項清單內；Beefy 則是跨鏈橋接所需的設計。與 ch. 12 的呼應：Δ_seq／Δ_par 的張力正是「限制 transfer 以換取平行化」的動機。","trap":"「sweet spot」對比的兩端：fully-synchronous（Solana）與 persistently fragmented（Polkadot 1.0 / Cosmos / rollups）。"},{"id":"arch-jip4-protocol-parameters-080","ch":"ARCH","sectio
