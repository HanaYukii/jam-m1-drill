 a_f[c] > 2/3·|κ|]，是以 core index 遞增走訪，接著 eq. 12.4 的 R! 沿用該順序、eq. 12.11 的 R* = R! ⌢ Q(q) 再把佇列項目依相依解開的輪次接上。","trap":"「哪些會被 accumulate」由 gas 前綴決定，所以序列順序就是共識的一部分；core index 遞增是唯一的來源。"},{"id":"c3-ch12-accseq-n-with-transfers","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.17 (Δ+), 12.24, 12.28","difficulty":3,"kind":"delta","tags":["accumulation","transfers","gas","delta-0.8.0"],"stem":"Mid-recursion inside Δ+, the remaining report sequence is empty but the previous Δ* round emitted three deferred transfers t, and the free-accumulation map handed to this call is ∅. Does Δ+ do any more work, and what does it hand back in GP 0.8.0?","options":["Yes — the test n = i + |t| + |f| = 3 ≠ 0 fires — but the round is a no-op: Δ*'s service set is s = {d_s | r ∈ r, d ∈ r_d} ∪ K(f) alone, so with r[..i] empty and f = ∅ it is empty too, the three transfers are discarded, and only the balances already credited by the earlier `transfer` host calls survive into δ†; u and b therefore come back empty and the three destinations contribute nothing to eq. 12.28's T(s)","No. The GP's termination test is the prefix length i, and with r = ⟦⟧ the maximal gas-fitting prefix is i = 0, so the base case ⟨0, e, ∅, ⟦⟧, ⟦⟧⟩ fires and Δ* is never invoked; the three pending transfers are carried into the next block through ω, which is precisely why ω is typed to hold them alongside the deferred reports, and their gas is re-charged against that block's budget g rather than this one's","Yes. The GP's termination test is n = i + |t| + |f| = 0 + 3 + 0 = 3 ≠ 0, so Δ* is still invoked; its service set s = {d_s | r ∈ r, d ∈ r_d} ∪ K(f) ∪ {t_d | t ∈ t} reduces to the three destinations, which are accumulated on the transfers alone. The result is ⟨i + j, e′, b* ∪ b, u* ⌢ u, t ⌢ t†⟩, whose fifth component — the processed transfers — is what T(s) in eq. 12.28 counts","Yes — the test n = i + |t| + |f| = 3 ≠ 0 fires and the three destinations are accumulated on the transfers alone — but Δ+ still returns the four-tuple ⟨n, e′, b, u⟩ exactly as in 0.7.2; the processed transfers that T(s) needs are recovered afterwards by diffing δ† against δ for balance movements, eq. 12.28 being defined over that reconstruction rather than over anything Δ+ hands back"],"answer":2,"optNotes":["漏掉 eq. 12.18 明列的第三段 {t_d | t ∈ t}，那是純收款服務進入 accumulate 的唯一途徑。","混淆了 i 與 n；ω 型別上只放 report 與 hash 集合，deferred transfer 從不進 σ。","終止條件是 n = i + |t| + |f|；s 縮成三個收款方，回傳五元組的 t ⌢ t† 正是 T(s) 的來源。","餘額變化是淨額：同時有 digest、有轉入又有轉出的 service 根本數不出 transfer 筆數。"],"explanation":"eq. 12.17 的終止條件不是「還有沒有 report」，而是 n = i + |t| + |f|：只要還有待處理的 deferred transfer 或還有 free-accumulation 服務，Δ+ 就會再跑一輪 Δ*。eq. 12.18 的服務集合 s 明確包含 {t_d | t ∈ t}，所以純粹被轉帳打到的服務也會被 accumulate（Δ1 的 g = U(f[s], 0) + Σ_{t_d = s}(t_g) + Σ digests，此時只剩轉帳那一項），這正是 0.7.1 之後把 on-transfer 併進 accumulate 的結果。GP 0.8.0 的 Δ+ 回傳五元組，最後一項 t ⌢ t† 是「本次遞迴實際處理掉的 transfer 序列」，eq. 12.28 的 T(s) 就靠它計數（對照 0.7.2 只回傳四元組，這是團隊必須補的差異）。","trap":"Δ+ 的停機條件是 n = i + |t| + |f|；report 用完不代表結束，轉帳與 always-accumulate 也能把遞迴撐著。"},{"id":"c3-ch12-prior-privileged-index-reads","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.18 (Δ*), 12.19 (R)","difficulty":3,"kind":"concept","tags":["accumulation","privileges","prior-posterior"],"stem":"Inside Δ*, core c's posterior authorizer queue φ′[c] and the posterior staging keys ι′ are each lifted out of exactly one service's Δ1 output. Whose output, and selected by which version of χ?","options":["φ′[c] = R(φ[c], (e*_q)[c], ((Δ(χ_A[c])_e)_q)[c]) — it is merged across the manager and the prior assigner with R(o, a, b), exactly as χ′_A[c] is; and ι′ is taken from whichever service in s wrote it last when s is walked in ascending service index, so a higher-indexed service can overwrite the delegator's copy","φ′[c] = ((Δ(χ′_A[c])_e)_q)[c] and ι′ = (Δ(χ′_V)_e)_i — the *posterior* per-core assigner and the *posterior* delegator. A service granted the assign privilege during this very block can therefore immediately install the queue the block will use, and only that service's own copy of the component is read, core index by core index","φ′[c] = ((Δ(χ_A[c])_e)_q)[c] and ι′ = (Δ(χ_V)_e)_i — the *prior* per-core assigner and the *prior* delegator. Even when this same round rewrites χ′_A[c] or χ′_V, the queue and the keys still come from whoever held the privilege when the round began, and only that service's own copy of the component is read, core index by core index","φ′[c] = ((Δ(χ_M)_e)_q)[c] and ι′ = (Δ(χ_M)_e)_i — both are lifted out of the manager's output e* = Δ(χ_M)_e, because only the manager may alter any component of χ; the assigner and the delegator merely stage requests inside their own partial states, which the manager's Accumulate ratifies before Δ* merges them"],"answer":2,"optNotes":["R 只出現在 e_a′、e_v′、e_r′ 三行；讓任何服務都能覆寫 ι′ 等於誰都能改下一輪的 validator 金鑰。","同一區塊剛拿到 assign 特權的服務要等下一塊才能改 φ′[c]，式子讀的就是 prior。","eq. 12.18 的 e_q′[c] 與 e_i′ 括號裡是 Δ* 的輸入 χ_A[c]、χ_V，也就是回合開始時的持有者。","會漏掉 eq. 12.19 註解「This allows privileges to be owned」的整個設計；e* 只供出 e_m′ 與 e_z′。"],"explanation":"eq. 12.18 分得很細。**誰擁有特權**用 R 合併：∀c, e_a′[c] = R(e_a[c], (e*_a)[c], ((Δ(e_a[c])_e)_a)[c])，以及 e_v′、e_r′ 同理；而 e_m′ 與 e_z′ 直接取自 manager 的輸出 e* = Δ(m)_e，不經過 R。**特權作用的內容**則另外一條路：e_q′[c] = ((Δ(e_a[c])_e)_q)[c] 與 e_i′ = (Δ(e_v)_e)_i，括號裡的 e_a[c]、e_v 是 Δ* 的輸入、也就是 prior 的 χ_A[c] 與 χ_V。另外 §8 的 α′ 之所以必須在 accumulation 之後才算，authorization.tex 給的理由是「Since α′ is dependent on φ′ … this step must be computed after accumulation, the stage in which φ′ is defined」——那是 α′ 讀 φ′ 造成的順序，與這條 prior/posterior 選擇規則無關。","trap":"χ′ 用 R 合併，但 φ′[c] 與 ι′ 只讀 prior χ_A[c] / χ_V 那一個服務的輸出——同區塊拿到特權，下一區塊才生效。"},{"id":"c3-ch12-code-delta-star-map-order","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.18 (u, t′)","difficulty":3,"kind":"code","tags":["accumulation","determinism","transfers","code"],"stem":"In the team's Δ*, the service set s is a Go map and this loop collects u and t′ from the per-service results. Which GP 0.8.0 requirement does it violate, and what is the observable symptom?","code":{"lang":"go","caption":"internal/accumulation/accumulation.go (set_s + ParallelizedAccumulation result loop), condensed","src":"func set_s(r []types.WorkReport, f types.AlwaysAccumulateMap,\n\tt []types.DeferredTransfer) map[types.ServiceID]bool {\n\ts := make(map[types.ServiceID]bool, len(r)*2+len(f)+len(t))\n\tfor _, w := range r {\n\t\tfor _, r := range w.Results {\n\t\t\ts[r.ServiceID] = true // rd\n\t\t}\n\t}\n\tfor serviceID := range f { // K(f)\n\t\ts[serviceID] = true\n\t}\n\tfor _, deferredTransfer := range t {\n\t\ts[deferredTransfer.ReceiverID] = true // td\n\t}\n\treturn s\n}\n\n// ... later, in ParallelizedAccumulation:\n// Process results from each service accumulation\nfor service_id := range s {\n\tsingleOutput := cache[service_id]\n\t// u = [(s, ∆(s)u) S s <− s]\n\tu = append(u, types.ServiceGasUsed{ServiceID: service_id,\n\t\tGas: singleOutput.GasUsed})\n\t// t = [∆(s)t S s <− s]\n\ttPrime = append(tPrime, singleOutput.DeferredTransfers...)\n}"},"options":["Nothing consensus-relevant: eq. 12.18 writes t′ as a set, and u is only ever consumed by eq. 12.28's G(s), which sums per service, so both are order-independent. The flattened ⌢⌢t′ does reach the next Δ+ round in an arbitrary order, but eq. 12.23 re-sorts each destination's i^T by sender before Ψ_A sees it, so two nodes importing the same block still agree on the state root","The violation is in set_s rather than in the loop: only services carrying a work-digest may contribute to u and t′, so transfer destinations and always-accumulate services have to be filtered back out of s before this loop runs. The map iteration itself is harmless, because eq. 12.18 marks u and t′ with ∈ rather than ↕ and both are consumed order-insensitively","Eq. 12.18 writes u = ⟦(s, Δ(s)_u) | s ↕ s⟧ and t′ = ⟦Δ(s)_t | s ↕ s⟧ with the ordered-iteration marker, i.e. ascending service index, whereas Go randomises map iteration. The flattened ⌢⌢t′ therefore reaches the next Δ+ round permuted, so each destination's i^T — and hence Ψ_A's operand sequence, the balances it credits and the resulting state root — can differ between two nodes importing the very same block","Eq. 12.18's ↕ marker does demand a deterministic walk, but over *report* order — the order in which each service's first digest appears in r[..i] — so sorting by ascending service index would be exactly as wrong as the map order. The symptom is the same either way: the flattened ⌢⌢t′ reaches the next Δ+ round permuted and two nodes importing the same block disagree on the state root"],"answer":2,"optNotes":["t′ 是序列不是集合；eq. 12.23 的 i^T = ⟦t | t ↕ t, t_d = s⟧ 沿用傳進來的順序，不會另外重排。","s 的定義本來就含 K(f) 與 {t_d}，濾掉會讓 always-accumulate 與純收款服務完全不被 accumulate。","§3.7.1 的 ↕ 是依元素本身遞增，s 的元素是 service index，而 Go map 迭代是刻意隨機化的。","GP 沒有第二套排序規則：↕ 依元素本身遞增，正解就是 ascending service index。"],"explanation":"eq. 12.18 對這兩個輸出都用了有序迭代記號：u = ⟦(s, Δ(s)_u) | s ↕ s⟧、t′ = ⟦Δ(s)_t | s ↕ s⟧，而 §3 的 notation 說明 ↕ 代表依元素本身遞增排序，對 s ∈ N_S 就是 service index 由小到大。Go 的 `for k := range m` 是刻意隨機化的，於是 tPrime 的串接順序在每個節點都不同；由於 eq. 12.17 會把 t* 餵回下一輪，而 eq. 12.23 的 i^T = ⟦t | t ↕ t, t_d = s⟧ 直接沿用該序列，最後 Ψ_A 收到的 operand 序列與 `fetch` 讀出的內容就不同——同一個區塊在不同節點算出不同 state root，典型症狀是 fuzzer / trace 測試偶發性不一致（團隊也用一個 `sort.Slice(iT, ...)` by SenderID 去掩蓋，但 sort.Slice 不穩定，同一 sender 的多筆轉帳仍可能被重排）。","trap":"GP 的 ↕ 不是裝飾：任何從集合展開成序列的地方，Go map 迭代都是共識殺手。"},{"id":"c3-ch13-epoch-boundary-split","ch":"13","section":"13.1 Validator Activity","gpRef":"eq. 13.4–13.6","difficulty":3,"kind":"concept","tags":["statistics","epoch","rollover","prior-vs-posterior","delta-0.8.0"],"stem":"GP 0.8.0 §13.1 derives the validator activity records in three ordered steps — π_V†, then (π_V‡, π′_L), then π′_V — with e = ⌊τ/E⌋ and e′ = ⌊τ′/E⌋. Take the first block of a new epoch (so e′ ≠ e): its author is validator 7, its assurance extrinsic E_A carries assurances signed by validators 4 and 9, and its guarantee extrinsic E_G credits validator 22. Where do this block's own increments end up?","options":["Everything this block contributes lands in the freshly zeroed accumulator, because eq. 13.4 applies the assurance pass to π_V‡ rather than to π_V; validator 7's block/ticket/preimage counters and validator 22's guarantee credit therefore sit in the current-epoch record alongside validators 4 and 9's assurance steps, and the archive keeps the previous epoch's totals untouched.","Everything this block contributes lands in the last-epoch archive, because eq. 13.6 applies its five remaining counters to π_V† as well and it is the result of that whole pass which is moved across at the rollover; validator 7's block/ticket/preimage counters, validator 22's guarantee credit and validators 4 and 9's assurance steps therefore travel together into π′_L. The current-epoch record stays an all-zero sequence until the second block of the new epoch.","The two assurance increments land in the last-epoch archive, because they are added to the prior record first and it is that already-incremented record which is moved across at the rollover; validator 7's block/ticket/preimage counters and validator 22's guarantee credit start from the freshly zeroed accumulator and so land in the current-epoch record. One block is deliberately split across the two records.","The rollover is triggered by the header's epoch marker H_E rather than by comparing ⌊τ/E⌋ with ⌊τ′/E⌋, and when H_E ≠ ∅ both records are zeroed rather than one being overwritten by the other; validator 7's block/ticket/preimage counters, validator 22's guarantee credit and validators 4 and 9's assurance steps are therefore all first entries of the current-epoch record, and the archive contributes nothing to this block at all."],"answer":2,"optNotes":["eq. 13.4 白紙黑字是 π_V† ≡ π_V except …，起點是 prior 的 π_V；π_V‡ 要到 eq. 13.5 才存在。","eq. 13.6 明寫 π′_V ≡ π_V‡ except …，五個 counter 的起點是 rollover 之後的 π_V‡。","eq. 13.4 先加在 π_V 上，eq. 13.5 的 otherwise 分支再把整包 π_V† 搬進 π′_L，一塊被劈成兩半。","π_L 從來不會被歸零：eq. 13.5 的 otherwise 分支是把 π_V† 整包搬過去覆寫它。"],"explanation":"eq. 13.4 先做 π_V† ≡ π_V except ∀v ∈ N_{|κ|}：π_V†[v]_a = π_V[v]_a + (∃a ∈ E_A : a_v = v)——assurance 是加在 **prior** 的 π_V 上。eq. 13.5 之後才做 epoch rollover：(π_V‡, π′_L) = (π_V†, π_L) when e′ = e，otherwise ([(0, …), …], π_V†)，其中 e = ⌊τ/E⌋（prior τ）、e′ = ⌊τ′/E⌋（posterior τ′ = H_T）。eq. 13.6 才從已歸零的 π_V‡ 出發：b += (v = H_I)、t += |E_T|、p += |E_P|、d += Σ_{d ∈ E_P}|d|（都只給 author）、g += (κ′[v] ∈ G)，這些落在 π′_V。因此同一塊的六個 counter 被刻意拆到兩個 record：a 記在舊 epoch、其餘五個記在新 epoch。「整塊都進新累加器」正是 0.7.2 的作法（也是 statistics.go 目前的行為，PR #1034 才修）。順帶一提，eq. 6.28 的 H_E 恰好在 e′ > e 時非 ∅，觸發時機與 eq. 13.5 的 e′ ≠ e 重合，但 §13 從不讀它——H_E 只帶 (η_0, η_1) 與 γ′_P 的金鑰序列。","trap":"口訣：assurance 在 rollover 之前，b/t/p/d/g 在 rollover 之後；epoch 邊界那一塊會被劈成兩半。"},{"id":"c3-ch13-guarantee-credit-set","ch":"13","section":"13.1 Validator Activity","gpRef":"eq. 13.6 (g counter); eq. 11.28 (reporters set G)","difficulty":2,"kind":"concept","tags":["statistics","guarantees","reporters","prior-vs-posterior"],"stem":"GP 0.8.0 updates the guarantee counter as π′_V[v]_g = π_V‡[v]_g + (κ′[v] ∈ G), where G is the reporters set of eq. 11.28. Suppose one block's E_G holds two guarantees: validator 12 signed a credential in both of them (one report under this rotation's assignment, one under the previous rotation's), validator 30 signed a credential in only one, and the block's author is validator 5. How does the g counter move?","options":["Validator 12 moves by 1, validator 30 by 1, the author not at all — the added term is a Boolean membership test of the validator's Ed25519 key against a set of keys, so two credentials in the same block still yield a single step, and the index v is resolved through the posterior active set.","Validator 12 moves by 1, validator 30 by 1, and the author additionally by 2 — the added term is a Boolean membership test, so each guarantor takes a single step, the author is separately credited one step per report the block carries, and the index v is resolved through the prior active set κ.","Validator 12 moves by 2, validator 30 by 1, the author not at all — the added term counts credential signatures rather than testing membership, so a validator that signs in two guarantees of the same block takes two steps, and the index v is resolved through the posterior active set.","Only the author moves, and by 2 — g records the reports the author brought on-chain, one step per report; the guarantors are credited through the assurance counter a instead, and because that counter is incremented against the prior record, their steps land in the archive whenever the block sits on an epoch boundary."],"answer":0,"optNotes":["(κ′[v] ∈ G) 是集合成員的 Boolean，同一塊簽兩份也只 +1，且索引跑的是 N_{|κ′|}。","eq. 13.6 只有 b/t/p/d 帶 v = H_I 的條件，g 的式子裡沒有 author 的位置；索引也是 posterior κ′。","來源是 §13.1 的 prose 與 0.7.0 的 per-report 舊讀法，與 eq. 13.6 的成員測試方向相反。","a 的增量條件是 ∃a ∈ E_A : a_v = v，資料來源是 assurance extrinsic 而不是 E_G。"],"explanation":"eq. 11.28 定義 reporters set：k ∈ G ⟺ ∃(r, t, a) ∈ E_G, ∃(v, s) ∈ a : k = (k_v)_e——G 是 **Ed25519 公鑰的集合**（k 取自本 rotation 或前一 rotation 的 guarantor assignment）。eq. 13.6 的增量 (κ′[v] ∈ G) 是一個 Boolean，依 §3.7.3「⊤ = 1、⊥ = 0」的隱含轉換，同一塊裡簽兩份 report 也只能 +1（實作上就是先把 G 建成 reportersSet，再對每個 validator 最多 +1）。這裡有一個 GP 自身的矛盾必須知道：§13.1 的欄位說明寫「g: The number of reports guaranteed by the validator」，但依 eq. 13.6 的集合成員測試，g 每塊最多 +1，實際語意是「該 validator 在這一塊有沒有 guarantee 過 report」而不是 report 的筆數。考試以 eq. 13.6 為準，但要認得那句 prose——團隊在 0.7.0 時期（#710/#711）採用的正是這種 per-report 舊讀法。索引用的是 **posterior** 的 κ′（eq. 13.6 的 ∀v ∈ N_{|κ′|}），不是 prior 的 κ——注意 eq. 13.4 的 assurance 迴圈才是跑 N_{|κ|}，兩者刻意不同。","trap":"GP 字面寫 κ′[v] ∈ G，但 κ′[v] ∈ K 是四欄位金鑰 tuple 而 G ⊂ H；實作一律讀成 (κ′[v])_e ∈ G。"},{"id":"c3-ch13-core-record-fields","ch":"13","section":"13.2 Cores and Services","gpRef":"eq. 13.7–13.9; §13.2","difficulty":2,"kind":"concept","tags":["statistics","core-stats","types","gas"],"stem":"GP 0.8.0 types the core statistics as π_C ∈ ⟦(d, p, i, x, z, e, l, u)⟧_C while the service statistics are π_S ∈ ⟨N_S → (…)⟩. A teammate is laying out the Go struct for one core record and asks which of the eight components are gas, which are counts and which are octet quantities — and whether the container needs zeroing at the epoch boundary. What do you tell them?","options":["Only the last component is gas-typed (N_G, the refine gas summed over the digests); the DA load, the total extrinsic size and the total bundle length are octet quantities; the popularity figure and the import, extrinsic and export components are plain counts. But the sequence accumulates over the epoch just like the validator records and is zeroed at the same rollover, which is why the first component is called a load rather than a size.","The DA load and the refine gas are both gas-typed, because DA occupancy is charged against the refine budget; the total extrinsic size is an octet quantity while the total bundle length counts work-items rather than octets; the popularity figure and the import and export components are plain counts. The container is a dictionary that lists only the cores which saw activity in the block.","Only the last component is gas-typed (N_G, the refine gas summed over the digests); the DA load, the total extrinsic size and the total bundle length are octet quantities; the popularity figure and the import, extrinsic and export components are plain counts. The container is a fixed-length sequence with one entry per core, rebuilt from scratch on every block, so no epoch-boundary zeroing exists for it.","All eight are plain naturals — the gas type N_G appears only in the service record's refinement pair; the DA load and the total extrinsic size are octet quantities but the total bundle length counts the segments in the bundle; the popularity figure counts the guarantors assigned to that core in this rotation, and the import, extrinsic and export components are plain counts. The container is a fixed-length sequence with one entry per core, rebuilt from scratch every block."],"answer":2,"optNotes":["§13.2 第一句就否定跨塊累加；d 叫 load 是因為它衡量 DA 佔用量（含 65/64 放大），與累加無關。","eq. 13.7 裡只有 u ∈ N_G，DA 佔用從不從 refine 預算扣；π_C 是定長序列，dictionary 的是 π_S。","只有 u ∈ N_G、d/z/l 是 octet、其餘為計數，且 π_C 定長每塊重算——三件事都符合 eq. 13.7 與 §13.2。","eq. 13.7 的 u ∈ N_G 確實是 gas；l = Σ (w_s)_l 是 octet 長度，p 是 assurance 打勾的張數。"],"explanation":"eq. 13.7：π_C ∈ ⟦(d ∈ N, p ∈ N, i ∈ N, x ∈ N, z ∈ N, e ∈ N, l ∈ N, u ∈ N_G)⟧_C——八個欄位裡**只有 u 是 N_G**（gas），其餘都是 N；語意上 d（DA load）、z（extrinsic size）、l（bundle length）是 octet 數量，p、i、x、e 是計數。eq. 13.9：p = Σ_{a ∈ E_A} a_f[c]，是本塊 assurance 裡把該 core 打勾的**張數**；l = L(c) = Σ_{w ∈ I, w_c = c} (w_s)_l 明確是 avspec 的 bundle **長度**（segment 數是 avspec 的 n，只在 eq. 13.12 的 D(c) 裡以 W_G⌈65n/64⌉ 換算成 octet）。§13.2 開宗明義：「These are tracked only on a per-block basis unlike the validator statistics which are tracked over the whole epoch.」——所以 π_C 每塊整個重算。容器型別也別搞混：π_C 是 ⟦…⟧_C 的**定長序列**（341 個 core 全都有一筆，即使全零），eq. 13.8 的 π_S 才是 dictionary，只放有活動的 service。","trap":"π_C 定長、每塊重算；π_S 是 dictionary、每塊重算；只有 π_V/π_L 才有 epoch rollover。"},{"id":"c3-ch13-rollover-code","ch":"13","section":"13.1 Validator Activity","gpRef":"eq. 13.4–13.6","difficulty":2,"kind":"code","tags":["statistics","rollover","delta-0.8.0","go"],"code":{"lang":"go","caption":"internal/statistics/statistics.go:109-133, 460-504 (UpdateValidatorActivityStatistics / UpdateCurrentStatistics, GP 0.7.2, condensed)","src":"// (13.3)  π ≡ (πV , πL, πC , πS);  (πV, πL) => (current, last)\nfunc UpdateValidatorActivityStatistics() {\n\tcs := blockchain.GetInstance()\n\tpreEpochIndex := GetEpochIndex(cs.GetPriorStates().GetTau())\n\tpostEpochIndex := GetEpochIndex(cs.GetPosteriorStates().GetTau())\n\tpreStatistics := cs.GetPriorStates().GetPi()\n\tif preEpochIndex == postEpochIndex {\n\t\tcs.GetPosteriorStates().SetPiCurrent(preStatistics.ValsCurr)\n\t\tcs.GetPosteriorStates().SetPiLast(preStatistics.ValsLast)\n\t} else { // reset\n\t\tvalsCurrent := make(types.ValidatorsStatistics, types.ValidatorsCount)\n\t\tcs.GetPosteriorStates().SetPiCurrent(valsCurrent)\n\t\tcs.GetPosteriorStates().SetPiLast(preStatistics.ValsCurr)\n\t}\n\tUpdateCurrentStatistics(cs.GetLatestBlock().Extrinsic) // ... plus core & service stats\n}\n\nfunc UpdateCurrentStatistics(extrinsic types.Extrinsic) {\n\tstatistics := cs.GetPosteriorStates().GetPi()\n\tUpdateBlockStatistics(&statistics, authorIndex)\n\tUpdateTicketStatistics(&statistics, authorIndex, extrinsic.Tickets)\n\tUpdatePreimageStatistics(&statistics, authorIndex, extrinsic.Preimages)\n\tUpdateReportStatistics(&statistics, extrinsic.Guarantees, tau, kappa)\n\tUpdateAvailabilityStatistics(&statistics, authorIndex, extrinsic.Assurances)\n\tcs.GetPosteriorStates().SetPiCurrent(statistics.ValsCurr)\n}"},"stem":"This is the team's GP 0.7.2 statistics code, condensed. Measured against GP 0.8.0 eq. 13.4–13.6, on which blocks does it place a validator's assurance increment in the wrong record, and what is the minimal fix?","options":["Only on blocks where ⌊τ/E⌋ ≠ ⌊τ′/E⌋. eq. 13.4 applies the assurance pass to the prior record, and eq. 13.5 then moves that already-incremented record into the archive, so on an epoch-boundary block each assurer's step belongs in the archive rather than in the newly allocated slice this code writes it into. The fix is to run the assurance pass on the prior record before the branch and to hand the incremented record to the else-branch's archive assignment.","On no block at all: the placement of the assurance increment already matches 0.8.0, because eq. 13.4 is itself applied to π_V‡ and this code likewise runs its availability pass on the posterior record. The only genuine 0.8.0 gap visible here is eq. 13.3, which sizes the two records from |κ| and |λ| rather than from the constant ValidatorsCount. The fix is to allocate the reset slice with len(kappa) instead.","Only on epoch-boundary blocks, but in the opposite direction. eq. 13.6 applies all six counters to π_V† before eq. 13.5 performs the rollover, so on a boundary block the author's block, ticket and preimage steps belong in the archive too, and the newly allocated slice must stay an all-zero sequence until the second block of the new epoch. The fix is to hoist the whole of UpdateCurrentStatistics above the epoch branch, so that every counter is credited before the reset rather than only the assurance pass.","On every block. eq. 13.4 attributes each assurance to the block author rather than to the assurer who signed it, so the availability pass credits the wrong validator on every block and not merely at the boundary; which of the two records receives that credit is a separate question this code already answers correctly. The fix is to index the increment by authorIndex exactly as the ticket and preimage passes already do."],"answer":0,"optNotes":["非邊界塊 π_V‡ = π_V†，兩種寫法同值；只有 ⌊τ/E⌋ ≠ ⌊τ′/E⌋ 的那一塊才會顯現差異。","|κ|/|λ| 確實是另一個缺口，但這說法把 eq. 13.4 的起點誤讀成 π_V‡，與式子本身矛盾。","eq. 13.6 的 b/t/p/d/g 全部以 π_V‡ 為起點，提前做等於讓新 epoch 的第一塊完全不計分。","與 UpdateAvailabilityStatistics 目前用 assurance.ValidatorIndex 的作法相反，也違反 §13.1 對 a 的定義。"],"explanation":"0.7.2 → 0.8.0 的差異就在 assurance 的時機。0.8.0 eq. 13.4：π_V† ≡ π_V except ∀v ∈ N_{|κ|}：π_V†[v]_a = π_V[v]_a + (∃a ∈ E_A : a_v = v)——作用在 **prior** π_V 上；eq. 13.5 才 rollover：e′ ≠ e 時 (π_V‡, π′_L) = ([(0, …), …], π_V†)。上面這段 Go 先分支歸零、把 π_V 搬進 ValsLast，然後 UpdateCurrentStatistics 從 **posterior** 取 π 再跑 UpdateAvailabilityStatistics，等於把 assurance 記進了新 epoch 的累加器。這正是 team issue #1021 / PR #1034「assurances credited before epoch rollover」要修的東西。另外 eq. 13.3 以 |κ|/|λ| 決定兩份 record 的長度（程式碼仍用常數 ValidatorsCount）也還沒補，是 team issue #1037，但那是獨立的一件事，不影響 assurance 落在哪一份 record。","trap":"非 epoch 邊界的 fuzz trace 全綠不代表對——這個 bug 只在 600 塊裡的那 1 塊現形。"},{"id":"c3-ch13-accum-triple-code","ch":"13","section":"13.2 Cores and Services","gpRef":"eq. 13.8, 13.13–13.14; eq. 12.27–12.28","difficulty":2,"kind":"code","tags":["statistics","service-stats","accumulation","delta-0.8.0","go"],"code":{"lang":"go","caption":"internal/statistics/statistics.go:386-450 (CalculateAccumulationStatistics + record assembly, GP 0.7.2)","src":"// v0.7.1\n// (13.12) a\n// AccumulateCount, AccumulateGasUsed\nfunc CalculateAccumulationStatistics(serviceID types.ServiceID,\n\taccumulationStatistics types.AccumulationStatistics,\n) (accumulateCount types.U32, accumulateGasUsed types.Gas) {\n\tvalue, ok := accumulationStatistics[serviceID]\n\tif ok {\n\t\taccumulateCount = types.U32(value.NumAccumulatedReports)\n\t\taccumulateGasUsed = value.Gas\n\t}\n\t// else, the service id is not found, count and gas are 0\n\treturn accumulateCount, accumulateGasUsed\n}\n\n// ... inside UpdateServiceActivityStatistics, for each serviceID in s:\nservicesStatistics[serviceID] = types.ServiceActivityRecord{\n\tProvidedCount:     ps.count,\n\tProvidedSize:      ps.size,\n\tRefinementCount:   R.n,\n\tRefinementGasUsed: R.GasUsed,\n\tAccumulateCount:   accumulateCount,\n\tAccumulateGasUsed: accumulateGasUsed,\n}"},"stem":"The team's GP 0.7.2 code builds each service record's accumulation entry as the pair shown. GP 0.8.0 reshapes that entry. What exactly changes, and what observable consequence does it have for which services appear in π′_S?","options":["The entry becomes a three-element value — work-digests accumulated for the service, deferred transfers delivered to it, and accumulation gas — obtained as the substitute-if-nothing of the service's entry in S against an all-zero triple. Since S now keeps every service whose triple is not all-zero, a service touched only by incoming transfers has a non-zero middle element, becomes a key of S, and therefore joins the union that forms π′_S's domain.","0.8.0 restores the separate on-transfer PVM invocation Ψ_T, so the accumulation entry keeps its two elements and the record regains a transfer count and a transfer gas figure as two further top-level fields beside it, drawn from a second dictionary of on-transfer statistics. Every service that received a transfer therefore appears in π′_S carrying its own on-transfer gas figure, beside the reported and preimage-provided services.","The entry keeps its two elements — work-digests accumulated for the service and accumulation gas — but the gas element is re-typed from N_G to a plain natural, and it is now read out with a bare dictionary subscript rather than through the substitute-if-nothing wrapper. The domain of π′_S is unchanged, still the union of reported services, preimage-provided services and the keys of the accumulation statistics, so a service touched only by a transfer never appears.","The entry becomes a three-element value — work-digests accumulated for the service, preimages provided to it, and accumulation gas — obtained as the substitute-if-nothing of the service's entry in S against an all-zero triple. Since that middle element already counts provisions the separate provision pair becomes redundant, and the domain of π′_S narrows to exactly the services which appear as keys of the accumulation statistics."],"answer":0,"optNotes":["eq. 13.13 的 a = 𝒰(S[s], (0,0,0))；T(s) > 0 讓純收款的 service 經 K(S) 進入 domain。","accumulation.tex 全篇沒有 Ψ_T；#502 只放回 transfer 筆數，沒有第二本 on-transfer 統計字典。","eq. 13.8 的 a 第三個元素仍是 N_G，且用的是 𝒰 包裝——裸下標查不到會得 ∅，型別不合。","eq. 12.28 的 T(s) 數的是 transfer 筆數而非 preimage；eq. 13.14 的三方聯集也沒動過。"],"explanation":"eq. 13.8：π_S ∈ ⟨N_S → (p ∈ (N, N), r ∈ (N, N_G), i ∈ N, x ∈ N, z ∈ N, e ∈ N, a ∈ (N, N, N_G))⟩——a 在 0.8.0 是**三元組**。eq. 13.13：a = 𝒰(S[s], (0, 0, 0))，𝒰 是 §3.2 / eq. 3.2 的 substitute-if-nothing。S 的定義在 eq. 12.27–12.28：S ∈ ⟨N_S → (N, N, N_G)⟩、S ≡ {s ↦ S(s) | S(s) ≠ (0, 0, 0)}，其中 S(s) = (N(s), T(s), G(s))：N(s) 是本塊被 accumulate 的 work-digest 數、T(s) ≡ |[t | t ↕ t, t_d = s]| 是 destination 為 s 的 processed deferred transfer 數、G(s) 是 accumulation 用掉的 gas。eq. 13.14：s = s^R ∪ s^P ∪ K(S)。歷史脈絡：0.7.1（team #656）因為 Ψ_T 被移除而把 OnTransfersCount / OnTransfersGasUsed 從 ServiceActivityRecord 刪掉，0.8.0（GP #502「Add back processed transfer count to service statistics」）只把 transfer **筆數**放回三元組中間，並沒有復活 on-transfer 的 gas 欄位，也沒有復活 Ψ_T——轉帳的 gas 是在 eq. 12.23 的 g 裡與 work-digest 的 gas 加總後一次進 Ψ_A。另一個要留意的編輯瑕疵：eq. 13.13 的 p = Σ_{(s, d) ∈ E_P}(1, |d|)，comprehension 綁定的 s 字面上**遮蔽**了外層的 ∀s ∈ s，照字面讀會退化成與 service 無關的全域總和；實際意思（也是所有實作的作法）是「E_P 中 service index 等於該 s 的那些 preimage 的 (筆數, 總 octet 數)」，同樣的遮蔽寫法也見於 eq. 12.28 的 G(s)。","trap":"0.8.0 加回來的是 transfer 的「筆數」，不是 on-transfer 的 gas；Ψ_T 沒有回來。"},{"id":"c3-ch13-consensus-state-rationale","ch":"13","section":"13.1 Validator Activity","gpRef":"§13.1; eq. 4.4 (state composition); eq. 13.1–13.3; App. D key C(13)","difficulty":2,"kind":"rationale","tags":["statistics","rationale","state","epoch","staking"],"stem":"An interviewer pushes back: 'Validator counters look like telemetry to me. Why are they a component of σ and Merklized into the state trie at all, and why keep two validator records rather than one running counter?' What is the GP-grounded answer?","options":["Because Grandpa weights finality votes by validator performance, so the figures have to sit in σ where the finality gadget can read them and a stale accumulator would let a validator vote with the previous epoch's weight; that is also why §13.1 has validators vote on each other's auditing efforts, since audits carry the same weight in that ballot. The pairing exists so that a validator removed from the active set mid-epoch can still be slashed against its own history rather than against whoever replaced it, and the core records are paired for exactly the same reason.","It is essentially a serialization convenience: the JIP-2 RPC's statistics endpoint and the conformance vectors want a fixed-shape record, so π rides along in σ purely to give those consumers a stable layout, and because it is excluded from the state-trie construction of appendix D a node that skipped the update entirely would still agree on the state root. The pairing exists only so that a test vector can compare a whole epoch's totals in one shot.","Because the figures must be bit-identical on every node and provable to a consumer outside the chain: JAM pays no rewards itself but has to deliver activity data to a staking subsystem, so the record is a state component with its own trie key and a node computing it differently produces a different state root. The pairing exists because settlement is per-epoch — the archive holds the just-completed epoch's totals unchanged for the whole of the next epoch, giving a stable snapshot to read while the accumulator fills.","Because the author's reward is paid out of the block's accumulation gas budget in the same block, so the counters have to be readable from inside the state transition rather than from an off-chain index. The pairing is a rollback buffer: when a fork is reverted the archive is copied back over the accumulator, which is exactly why both halves have to be Merklized."],"answer":2,"optNotes":["GRANDPA、BEEFY 與 auditing 恰恰是 §13.1 說無法直接鏈上追蹤、要靠互評取中位數的部分。","與 App. D 直接衝突：C(13) 就是 π 的 state key，π′ 一定會被併進 M_σ(σ′)。","§13.1 原文：JAM 不發獎勵、只把活動資料送進 staking subsystem，配對是為了 per-epoch 結算的穩定快照。","§13.1 第一句就是 does not explicitly issue rewards；分叉靠整個 σ 版本切換，沒有回拷 π 的動作。"],"explanation":"§13.1 開頭：「The JAM chain does not explicitly issue rewards—we leave this as a job to be done by the staking subsystem…However…it is important for the JAM chain to facilitate the arrival of information on validator activity in to the staking subsystem so that it may be acted upon.」要讓鏈外（甚至跨鏈）的 staking 系統能**信任**這些數字，它就必須是共識狀態：eq. 4.4 把 π 列為 σ 的十七個分量之一，App. D 以 C(13) 當 state key 併入 state trie，因此 π′ 併入 M_σ(σ′) 並可被 light client 證明——但要記住 JAM 的 header 帶的是 **prior** state root（§5：H_R ≡ M_σ(σ)，GP 明說這是與 Ethereum／Polkadot 相反的設計，為了 pipelining），所以含 π′ 的 σ′ 之根**不在本塊的 H_R 裡**，要等**下一塊**的 header 才會出現，剛好落後一塊；任何節點算錯 π 就會算出不同的 state root，直接是 invalid block。雙份 record 的理由在 §13.1：「The validator statistics are made on a per-epoch basis and we retain one record of completed statistics (π_L) together with one record which serves as an accumulator for the present epoch (π_V)」——結算以 epoch 為單位，π_L 在整個下一個 epoch 都不再變動，消費者才有穩定快照可讀。§13.2 明講 π_C/π_S「are tracked only on a per-block basis」，所以不需要這種配對；而懲罰在 §10 的 judgements，依據是 ψ 不是 π。","trap":"「為什麼在鏈上」的標準答法：因為要能被證明且必須共識一致，π 進 state root；不是為了 RPC 好看。"},{"id":"appC-natural-encoding-shape","ch":"C","section":"C.1 General Natural Number Serialization","gpRef":"§C.1","difficulty":2,"kind":"concept","tags":["codec","encoding","bijection"],"stem":"GP §C.1 gives a variable-length encoding E(x) for a general natural number. What determines how many octets a value takes, and why is that design forced on the GP rather than merely convenient?","options":["The length is carried out-of-band by the enclosing structure's own length prefix, so E(x) itself is just the little-endian digits; the GP relies on the enclosing tuple to make the whole encoding unambiguous rather than on E(x) alone","The encoder emits the minimum number of octets and a decoder recovers the length by scanning for a terminator octet; uniqueness is a convention that implementations are encouraged but not required to follow, since the state root is taken over the decoded values","Every natural number is padded to a fixed eight octets so that field offsets inside a structure are constant; the fixed width is what makes the encoding injective, and shorter forms exist only inside work-package payloads where no hashing occurs","A prefix in the first octet announces the length, and each value has exactly one valid encoding; the state root hashes encoded state, so two encodings of one value — or one encoding readable as two values — would let honest nodes disagree on the root"],"answer":3,"explanation":"§C.1 的通用自然數編碼是「前綴決定長度」的變長編碼：第一個位元組的高位樣式宣告後面還有幾個位元組，小數值因此只佔一兩個位元組。真正的重點是**雙射**——附錄 D 的 state root 是對編碼後的位元組做 hash，所以「同一個值有兩種寫法」會讓兩個誠實節點算出不同的 root，「同一串位元組能解成兩個值」則讓證明可以被挪用。這也是為什麼字典必須先依 key 排序再編碼：正規化是編碼規格的一部分，不是實作細節。","optNotes":["外層長度前綴管的是序列有幾個元素，不能取代單一整數自身的長度資訊。","掃描終止位元組不是 GP 的做法，且雙射是規格要求而非慣例——state root 取的是編碼後的位元組，不是解碼後的值。","固定八位元組正是 E_n 的做法，不是通用 E；把所有整數補到 8 bytes 會讓狀態與證明肥好幾倍。","前綴宣告長度 + 唯一編碼，理由正是 state root 對編碼結果取 hash。"],"trap":"被問「為什麼編碼要雙射」時，答案要落在 state root 與證明上，不是「比較整齊」。"},{"id":"appD-node-discrimination","ch":"D","section":"D.2.1 Trie Node Encoding","gpRef":"§D.2.1","difficulty":2,"kind":"concept","tags":["merklization","trie","state-root"],"stem":"State-trie nodes are all the same size. Walking the trie, how does a reader tell the three node kinds apart, and what decides whether a leaf stores the value itself or only its hash?","options":["The node kind is recovered from the depth at which it was reached — branches only appear above the last level — and embedding is decided by whether the value fits in the 31 octets left over after the state key, so the cut-off is 31 rather than 32 octets","A one-octet tag precedes each node and names one of the three kinds; embedding applies whenever the value is smaller than the hash it would otherwise be replaced by, which the encoder decides per node and records in that tag","Branches and leaves are distinguished by whether the second half of the node is a valid hash preimage; values are always stored by hash so that node size stays fixed, and the embedded form exists only in the service-info leaf","The first bit separates branch from leaf and the second separates an embedded-value leaf from a regular one; a value of at most 32 octets is embedded (its length lives in the remaining bits of that octet), anything longer is replaced by its hash"],"answer":3,"explanation":"§D.2.1：節點固定 512 bit（64 octet），第一個 bit 分 branch / leaf，第二個 bit 分 embedded-value leaf / regular leaf。embedded 的情況下，首位元組剩下的 6 個 bit 存值的長度，接著 31 octet 的 state key，最後 32 octet 放值本身（不足補零）；regular 的情況下那 6 個 bit 歸零，最後 32 octet 改放值的 hash。門檻是 32 octet，因為那正是尾段的容量。固定大小讓節點可以直接以陣列存取、證明大小完全可預測，而內嵌小值省掉一次 hash 與一次額外查詢——狀態裡的餘額、索引、小 metadata 幾乎都落在這一類。","optNotes":["節點種類是自描述的，不靠深度推斷；31 octet 是 state key 的長度，不是值的容量。","沒有額外的 tag 位元組——多一個位元組就破壞 1+31+32 = 64 的固定佈局。","「一律存 hash」會讓每個小值都多一次 hash 與一次查詢，正是 embedded leaf 要避免的。","兩個 bit 分三種節點，門檻 32 octet 正好是尾段容量，這是 §D.2.1 的原文結構。"]},{"id":"ch07-belt-mmr-shape","ch":"7","section":"7.4 The Accumulation Output Belt","gpRef":"§7.4; §E.3","difficulty":2,"kind":"concept","tags":["mmr","beefy","recent-history"],"stem":"β_B is a Merkle Mountain Range that grows by one root per block. Describe what the append does to the structure, and why the GP chose an MMR here rather than rebuilding a balanced Merkle tree each block.","options":["Appending inserts the new root at the position given by the block's timeslot modulo the belt length, overwriting whatever was there; the belt is therefore a ring buffer and old outputs age out automatically, which bounds the on-chain state","Appending rebuilds the range so that the peaks are always balanced within one level of each other, which keeps proof length uniform; older proofs must be reissued after each block, which is acceptable because BEEFY only ever proves the most recent block","Appending replaces the single root with the hash of the old root and the new item, so the range is really a hash chain; this keeps the state small and lets a verifier walk backwards from the current root to any earlier output in constant space","Appending places the new root at height 0 and merges it upward with any existing peak of equal height, leaving a set of peaks whose heights are the binary digits of the count; the structure is append-only, so each append costs O(log n) and previously issued proofs remain valid"],"answer":3,"explanation":"MMR 的 append 只往後加、從不改寫既有節點：新項以高度 0 進來，遇到同高度的既有 peak 就合併升高，於是 peak 集合對應項數的二進位表示。這帶來兩個對 JAM 關鍵的性質——單次 append 只碰 O(log n) 個節點，而且**舊的證明不會失效**，因為它依賴的節點沒有被改寫。accumulation output 正是「持續產出、由鏈外長期驗證」的資料，BEEFY（§18）對 β_H 最後一筆的 super-peak 簽名，讓第三方能拿一份幾個月前的證明回來驗。普通平衡樹每加一片葉子就要重算整棵樹，所有舊證明全部作廢。","optNotes":["環狀緩衝會讓舊輸出被覆蓋、證明永久失效；那是 ω 與 ξ 的做法，不是 belt 的做法。","MMR 不重新平衡；而且 BEEFY 的消費者要驗的常常是舊區塊的輸出，不是只驗最新一筆。","退化成 hash chain 的話，證明某一項要走過它之後的所有項，長度是 O(n) 而不是 O(log n)。","peak 合併規則與 append-only 帶來的舊證明有效性，正是選 MMR 的兩個理由。"]},{"id":"ch11-assurance-signature","ch":"11","section":"11.2 Assurances","gpRef":"§11.2","difficulty":2,"kind":"concept","tags":["assurance","availability","signature"],"stem":"An assurance carries a bitfield with one bit per core plus a signature. What is actually signed, and what would break if the signature covered only the bitfield?","options":["The signature covers the assurer's own validator index and the bitfield, which is what lets the chain attribute the assurance; the parent hash is checked separately by comparing it against the header rather than by being signed","The signature covers the work-report hashes of every core whose bit is set, so an assurer commits to specific reports; the parent header hash is not involved because reports outlive the block in which they were guaranteed","The signature covers only the bitfield, and replay is prevented by the on-chain rule that each validator may appear at most once per block; binding a block would be redundant because the extrinsic is already inside the block being signed","The signature covers a domain-separated hash of the parent header hash together with the encoded bitfield; without the parent hash the same signed bitfield could be replayed into a later block, letting a validator be counted as assuring data it no longer holds"],"answer":3,"explanation":"§11.2 的 assurance 簽的是 domain separator 接上「parent header hash 與編碼後 bitfield 的 hash」。綁 parent hash 的用意是把這份表態鎖在**某一個特定的鏈上位置**：少了它，同一份簽名可以被別人撿去塞進之後任何一塊，讓一個早就把 shard 丟掉、甚至已經離線的 validator 持續被計入可得性門檻——而可得性門檻正是「資料還救得回來」的唯一保證。用 bitfield 而不是逐份報告簽名，則是頻寬考量：一個 validator 每塊可能同時持有數百個 core 的 shard，逐一簽名的驗簽成本是 C 倍。","optNotes":["validator index 由 extrinsic 欄位攜帶並用來取公鑰驗簽，不是靠簽章內容來歸屬。","assurance 表態的是「我持有這些 core 的 shard」，不對特定 report hash 簽名——這正是 bitfield 的設計。","「每塊最多出現一次」擋得住同一塊內的重複，擋不住把舊簽名搬到後面的區塊。","綁 parent header hash 是為了防重放，這正是它被納入簽章輸入的理由。"]},{"id":"ch14-oversize-rule","ch":"14","section":"14.4 Work Result Size","gpRef":"§14; eq. 11.x (W_R)","difficulty":2,"kind":"concept","tags":["work-report","oversize","limits"],"stem":"A work-package's items refine one after another and the report has a size ceiling W_R. Is the ceiling applied per item or to the report as a whole, and what happens to an item that would cross it?","options":["It is per item: each output is compared against W_R on its own, so a package can only fail if a single item is oversized; the report as a whole is unbounded because the bundle, not the report, is what availability has to carry","It is cumulative and the outputs are truncated rather than replaced, with the truncation length recorded in the digest so that an auditor re-running refine can reproduce exactly the same bytes","It is cumulative: each item's output is measured against the authorizer trace plus the outputs already accepted, and the first item that would cross W_R has its output replaced by the OVERSIZE error while later items are still refined normally","It is cumulative, but crossing the ceiling invalidates the entire work-report, so the guarantors must drop the package and none of its items are reported — this is what stops a service from padding its output to squeeze others out"],"answer":2,"explanation":"大小檢查是**累計**的：判斷的量是 authorizer trace |t| 加上先前已被接受的輸出總和，再加上這一項的輸出，超過 W_R 的第一項就把它的 result 換成 ⊖ OVERSIZE。關鍵有兩點——被換掉的是**該項的結果**，不是整份報告作廢（後面的 item 照跑，可能還是成功的）；而且順序有意義，同樣一組 item 換個順序，出事的可能是不同的那一個。這也是為什麼 OVERSIZE 屬於 𝔼 錯誤集合而不是「報告無效」：它是一個可被記錄、可被 accumulate 看到的結果，服務端能自己處理。","optNotes":["若只逐項比對，四個各佔 W_R 八成的 item 就能組出遠超上限的報告，鏈上限制形同虛設。","GP 沒有截斷語意；截斷會讓 refine 的輸出不再是純函數的完整結果，auditor 重跑的比對基準也會變模糊。","累計判斷、第一個越界的項被換成 OVERSIZE、後續照跑，三點都對上 §14 的規則。","整份報告作廢的話，一個 item 的失控就能吃掉同包其他服務的工作，OVERSIZE 也就不必列進 𝔼。"]},{"id":"appA-fault-address-rule","ch":"A","section":"A.4 Memory & Page Faults","gpRef":"eq. A.9","difficulty":2,"kind":"concept","tags":["pvm","page-fault","memory"],"stem":"A multi-octet store straddles two pages: the first is writable, the second is not allocated. What does the PVM report, and why is the reported address defined the way it is?","options":["A page fault carrying the page-aligned address of the lowest inaccessible octet touched by the access; aligning to the page is what makes the value something the host can act on — it is exactly the page the host must map before the program is resumed","A page fault carrying the base address of the page containing the start of the access, so that the whole access can be retried from a known-mapped position; the machine writes the accessible prefix first and resumes from the fault address","A page fault carrying the exact address of the first inaccessible octet, so the host learns precisely where the access stopped; the host is expected to align the value itself before mapping, since alignment is a host concern rather than part of the machine's semantics","A panic, because an access that crosses a page boundary into unallocated memory is by definition malformed; page faults are reserved for accesses that lie wholly inside a single unmapped page and can therefore be satisfied by mapping one page"],"answer":0,"explanation":"eq. A.9 把 fault 的參數定義成「被觸及的位址中最低的那個不可存取位址，向下對齊到 Z_P = 2^12 的頁邊界」。兩個設計點值得講：第一，**回報的是頁而不是精確位址**，因為 host 唯一能做的補救就是把那一頁映射進來再續跑，給它一個頁位址剛好可以直接用；第二，page fault 是**可回復的退出理由**而不是 panic，因為 refine 要按需載入 import segment、accumulate 要按需取 storage，如果一開始就得把所有可能用到的資料塞進記憶體，work-package 會大到不可行。另外，跨頁存取不會先寫入可存取的那一半——整個存取要嘛完成、要嘛不發生，否則重跑不出同樣的記憶體狀態。","optNotes":["最低不可存取位址、向下對齊到頁邊界，正是 eq. A.9 的定義，理由也在「host 要映射的是一整頁」。","回報存取起點所在的頁會指到一個**已經映射好**的頁，host 照著做等於沒補救，而且部分寫入會破壞可重現性。","精確位址對 host 沒有多餘用處，而 GP 明確把對齊寫進了公式，不是留給 host 做。","跨頁存取不是 malformed；fault 本來就要處理「一部分可存取」的情形，否則按需載入無法運作。"]},{"id":"appA-jump-semantics","ch":"A","section":"A.3 Basic Blocks & Control Transfer","gpRef":"§A.3; §A.5","difficulty":2,"kind":"concept","tags":["pvm","control-flow","gas"],"stem":"The PVM has both statically-resolved jumps and indirect jumps computed from a register. What extra conditions must an indirect target satisfy, and what would break in the gas model if they were dropped?","options":["An indirect target must be aligned, non-zero, inside the jump table and land on a basic-block start; without the block-start requirement a program could enter a block below its first instruction and execute it without the block's gas ever being charged","An indirect target must be the start of a function as recorded in the program's symbol table, which is what the jump table holds; the gas model is unaffected because indirect jumps carry their own gas cost as an immediate operand","An indirect target only has to be a multiple of the page size, so that a jump can never straddle a page; gas is charged per instruction retired rather than per block, so where control lands has no bearing on the accounting","An indirect target must merely lie inside the code blob and be aligned; block starts are not required because the machine re-derives the enclosing block from the program counter and charges that block on entry, so gas accounting is unaffected either way"],"answer":0,"explanation":"靜態跳躍（jump / load_imm_jump）帶的是有號的 PC 相對位移，組譯期就能解析；間接跳躍（jump_ind / load_imm_jump_ind）的目標由暫存器算出，因此 GP 對它加了四個條件：對齊 Z_A、非零、落在 jump table 範圍內，而且 j[a/Z_A − 1] 必須是一個 **basic block 的起點**。最後一條跟 0.8.0 的 gas 模型直接相扣——gas 是在「進入 block」時整塊預扣的，如果可以從 block 中間切進去，那段指令就會在沒被計價的情況下執行，等於無限免費計算。對齊那條則是 GP 自己說的 LLVM 相容性：LLVM 產碼時假設動態跳躍目標有一定的對齊。","optNotes":["四個條件與「block 起點保證 gas 一定被收過」的關聯，正是這題要考的設計連動。","jump table 存的是合法跳躍目標，不是符號表；指令也沒有攜帶 gas 立即數。","頁大小與控制流無關，而 0.8.0 早已不是每指令計價——這是 0.7.2 的模型。","PVM 不會在跳躍後回頭補收 block 的 gas；預扣發生在進入 block 的那一刻，所以落點必須受限。"],"trap":"被問「為什麼間接跳躍要限制目標」時，先講 gas，再講 LLVM 對齊，順序反過來會顯得只背了條文。"},{"id":"appB-gas-model","ch":"B","section":"B.1 Host Call Gas","gpRef":"§B（PR #517）","difficulty":2,"kind":"delta","tags":["host-call","gas","delta-0.8.0"],"stem":"GP 0.8.0 reworked how a host call is charged. Describe the shape of the new charge and what happens when a service invokes an index that is not available in its invocation.","options":["Each call has a base cost plus, where it moves data, a term proportional to the number of KiB touched; an index that is unknown or unavailable is charged a default cost first, so a call with too little gas left exits out-of-gas rather than returning an error code","Each call costs the same flat amount regardless of the data it moves, which is what keeps a basic block's cost statically computable; an unknown index is free and simply returns WHAT, since charging for a call that did nothing would be unfair","Costs are declared by the service in its metadata and validated at registration, which lets a service bound its own worst case; an unknown index aborts the whole accumulation with a panic so that mistakes surface loudly during development","The cost is computed after the call from the gas the host actually consumed, so a call that moves more data naturally costs more; an unknown index returns WHAT and the machine charges nothing, leaving the counter untouched"],"answer":0,"explanation":"0.8.0（PR #517）把 host call 的計價改成「基本成本 + 資料量項」：每個呼叫有自己的 base cost，會搬資料的再加上按 KiB 計的部分。這件事的面試價值在它跟兩件事的互動——第一，**先扣後做**：不明或當前 invocation 不可用的 index 會先被收一筆預設成本，所以餘額不足時的結果是 ∞（out-of-gas，整個 invocation 收掉並回到 checkpoint），而不是乖乖回 WHAT，這是實作很容易寫反的地方；第二，它跟附錄 A 的 block-level 預扣是兩層獨立的計價，host call 的成本不會被算進 block 的 ϱ^Δ 裡。","optNotes":["base + 每 KiB、以及不明 index 先扣預設成本導致可能 OOG，兩點都是 0.8.0 的規定。","0.8.0 已經不是齊頭式定價；而且 block 的靜態成本與 host call 的成本本來就分屬兩層。","服務不能自訂 host call 價目；讓 service 宣告成本等於讓它自己決定攻擊成本。","事後依實際消耗計價無法跨實作重現，等於放棄確定性——GP 的成本一律是規格寫死的。"]},{"id":"appB-grow-heap-semantics","ch":"B","section":"B.2 grow_heap","gpRef":"§B（PR #508 / #517）","difficulty":2,"kind":"delta","tags":["host-call","memory","delta-0.8.0"],"stem":"GP 0.8.0 removes the sbrk instruction and provides heap growth as the grow_heap host call instead. What does the caller pass, and why is a host call the right home for this operation under the 0.8.0 gas model?","options":["The caller passes the desired end page and the cost is settled afterwards from the host's actual allocation cost, which is why it cannot be an instruction — instructions must have their cost known before they execute, but host calls are charged on return","The caller names the heap end it wants and is charged in proportion to the pages newly made writable; an instruction whose cost depends on its operand would break the promise that a basic block's price can be computed statically before the block runs","The caller passes the number of octets to add and is charged a flat amount; it was moved out of the instruction set purely for encoding space, since the opcode was needed for one of the new no-argument instructions introduced in 0.8.0","The caller passes a page count and the call is free, because the memory was already reserved when the program was initialized; making it a host call simply lets the host refuse growth when the machine is nested inside an inner PVM"],"answer":1,"explanation":"grow_heap 吃的是「想要的堆結尾頁」，費用按**新變成可寫的頁數**計。它從指令變成 host call 的理由跟 0.8.0 的 gas 模型直接相關：附錄 A 改成整個 basic block 在進入時預先扣款，而預扣的前提是 block 的價格能在執行前**靜態算出**。一條成本取決於運算元的指令會讓這個前提破掉——你無法在不執行的情況下知道這次 sbrk 要長多少頁。搬成 host call 之後，指令層維持靜態可計價，動態成本統一走 host call 那條先扣後做的路徑。","optNotes":["host call 同樣是先扣後做，不是事後結算——事後結算無法保證跨實作一致。","指定結尾頁、按新增頁數計費，理由落在「block 價格必須靜態可算」，這正是 0.8.0 的連動。","動機不是編碼空間；把它留在指令集裡會直接破壞 block-level 預扣的前提。","記憶體不是初始化時就全部保留，否則 grow_heap 沒有存在意義，也不會需要計費。"]},{"id":"appB-fetch-purpose","ch":"B","section":"B.2 fetch","gpRef":"§B","difficulty":2,"kind":"concept","tags":["host-call","refine","design"],"stem":"fetch is a single host call, available in all three invocations, whose first argument selects which piece of data to read. Why did the GP fold this many data sources into one call instead of giving each its own index?","options":["Because the sources share one gas price, and the GP charges per host-call index; folding them together is what keeps the price of reading the protocol constants identical to the price of reading a work-package's imports","Because each invocation exposes a different subset of the sources, and a single call is the only way to express that — with separate indices the machine could not tell which ones are legal in refine as opposed to accumulate","Because a selector keeps the call's register signature within the four argument registers available to host calls, which separate indices could not do since each source needs its own offset and length pair","Because the host-call numbering is part of the ABI every deployed service compiles against: a selector argument lets new data sources be added without renumbering anything, while a new index per source would eventually force existing services to be rebuilt"],"answer":3,"explanation":"fetch 用 φ_10 當 selector 選資料來源（協定常數、entropy、authorizer trace、extrinsic 與 import、work-package 各部分…），三種 invocation 都能用，只是可取的來源不同。把它們收成一個呼叫的理由是 **ABI 穩定性**：host call 的編號是所有已部署 service 編譯時就寫死的介面，每加一種資料就配一個新編號，遲早會撞上重新編號的需求，而重新編號會讓既有 service 全部失效（0.8.0 移除 sbrk 導致 opcode 位移就是同一類痛）。selector 是資料層的參數，加東西只要多一個值。","optNotes":["同一個 fetch 的不同來源本來就可能因搬運資料量而價格不同，不是齊頭定價。","「哪些來源在哪個 invocation 可用」用個別編號一樣表達得出來——那只是 dispatch 表的事。","暫存器數量不是限制：每個來源本來就只需要 selector 加上輸出緩衝的位址與長度。","ABI 穩定、加來源不必動編號，正是把多來源收進單一 fetch 的理由。"]},{"id":"appC-digest-error-encoding","ch":"C","section":"C.x Work Digest","gpRef":"§C；eq. 11.7（𝔼）","difficulty":2,"kind":"concept","tags":["codec","work-digest","errors"],"stem":"A work digest's result field holds either the refine output or a member of the error set 𝔼. How is that alternative encoded, and why does the GP put refine failures on-chain as values rather than rejecting the report?","options":["A failing item makes the whole work-report invalid, so the encoding has no error case at all; the 𝔼 set exists only to name the conditions guarantors check off-chain before deciding whether to sign the report","Success is a discriminant octet followed by the length-prefixed blob, and each error is a single distinct octet; keeping failures as ordinary values lets accumulate see exactly how an item failed, and lets one item fail without invalidating the others in the package","Success and failure share the same shape — a length-prefixed blob, empty in the failure case — with the reason carried separately in the report's authorizer trace; this keeps the digest fixed-width, which the erasure coder relies on","Errors are encoded as reserved blob values that no successful refine can produce, so no discriminant is needed; a report containing any error is still valid but is skipped by accumulate, which is why the error variants need no on-chain meaning"],"answer":1,"explanation":"digest 的 result 用一個判別位元組區分：成功是判別值再接長度前綴的 blob，失敗則是單一個位元組，各自對應 𝔼 裡的 ∞（out-of-gas）、☇（panic）、BADEXPORTS、OVERSIZE、BAD、BIG。把失敗當**值**而不是當「報告無效」是刻意的：第一，accumulate 讀得到失敗原因，服務可以自己決定要重試、退款還是記帳；第二，同一個 work-package 裡其他 item 不受牽連，否則一個服務的失控就能吃掉同包所有人的工作；第三，失敗也要被稽核——auditor 重跑時比對的是「同一個輸入是否同樣失敗」，若失敗不上鏈就沒有可比對的對象。","optNotes":["單一 item 失敗不會讓整份報告無效——OVERSIZE 之所以列在 𝔼 裡就是因為它是可記錄的結果。","判別位元組 + 單位元組錯誤碼，以及「失敗是值」帶來的三個好處，正是 GP 的設計。","空 blob 無法區分「成功但輸出為空」與「失敗」，而 digest 本來就不是固定寬度。","保留值的做法會讓錯誤與合法輸出混淆；而且 accumulate 確實看得到錯誤，不是跳過。"]},{"id":"ch06-fallback-purpose","ch":"6","section":"6.5 The Slot Key Sequence","gpRef":"eq. 6.25–6.26","difficulty":2,"kind":"concept","tags":["safrole","fallback","anonymity"],"stem":"When too few tickets arrive, γ′_S falls back to a key sequence derived from entropy and the active validator set. How is each slot's author chosen, and what property does the chain give up while the fallback is in force?","options":["Each slot's author is picked by hashing the entropy together with the slot index and reducing the result modulo the set size; the whole epoch's schedule becomes publicly computable in advance, so the anonymity that ring VRF tickets buy is lost for that epoch","The fallback assigns every slot to the validator set collectively and accepts the first valid seal to arrive; anonymity is unaffected because no schedule exists, at the cost of occasional competing blocks at the same height","Authors are drawn from the previous epoch's ticket accumulator, reusing the newest tickets that were not consumed; anonymity is preserved because those tickets are still ring-VRF proofs, but liveness suffers because the pool eventually empties","Each slot's author is the validator whose index equals the slot number modulo the set size, so the schedule is a plain round robin; nothing is lost beyond fairness, since a round robin gives some validators marginally more slots than others"],"answer":0,"explanation":"fallback 對每個 slot i 取 entropy 與 slot 索引一起 hash、截取四個位元組解成整數後對 validator 數取模，選出該 slot 的出塊者。它的代價很具體：所需的輸入在 epoch 一開始就全部公開，任何人都能把**整個 epoch 的出塊表**算出來——這正是 ring VRF ticket 花力氣買來的匿名性，在 fallback 生效期間完全消失，針對性 DoS 與賄賂重新變得可行。GP 仍然這樣設計，是因為可用性優先於匿名性：寧可退化也不要停鏈。Y = 500 的投票截止線就是為了讓票源有時間累積、盡量不走到這條路。","optNotes":["hash(entropy ⌢ slot index) 取模選人、以及匿名性全失，兩者是 eq. 6.26 與其代價。","無排程、先到先得等於放棄單一出塊者，會讓每個 slot 都可能分叉，與 Safrole 的目的相反。","fallback 的前提就是票不夠，沒有可重用的票；重用舊票也會讓同一張票決定兩個 epoch。","純輪流會讓出塊順序與 validator 索引綁死，任何人都能長期預測，且無法隨 entropy 變動。"],"trap":"「票不夠會怎樣」要答到「出塊表變成公開可算」，只說「用公鑰輪流」等於沒答到重點。"},{"id":"ch05-parent-hash-covers-seal","ch":"5","section":"5.1 The Header","gpRef":"eq. 5.2","difficulty":2,"kind":"concept","tags":["header","parent-hash","seal"],"stem":"H_P is defined as the Blake2b hash of an encoding of the parent header. Which encoding is hashed, and what follows from that choice?","options":["The full encoding, but with the markers cleared to their empty forms, so that the same parent yields one hash whether or not it opened an epoch; this keeps hashes stable across the epoch boundary where markers are added late","The unsigned encoding, so that the parent's seal stays outside the chain of commitments; this lets a validator replace a lost seal without disturbing its descendants, which is what makes seal-less archival storage possible","A hash of the parent's state root and timeslot only, since those two fields already determine the parent uniquely; hashing the whole header would make the commitment depend on data the child cannot independently reconstruct","The full encoding including the parent's seal, so a child commits to the exact sealed bytes its parent was published as; nobody can re-seal a header — even with the same author and contents — without orphaning every block already built on it"],"answer":3,"explanation":"eq. 5.2：H_P ≡ H(E(P(H)))，用的是**完整**編碼 E，也就是含 seal H_S 的那個版本（未含 seal 的 E_U 只用來當簽章訊息）。結論是每個子區塊都把父區塊「發布出去的那串位元組」原封釘死：改動父 header 的任何一個位元組——包括重簽一次 seal——都會換出不同的 H_P，讓所有已經建在上面的區塊瞬間脫鏈。這正是「鏈」這個字的意思，也是為什麼 seal 必須是 header 的一部分而不是附加在旁邊的資料。","optNotes":["GP 沒有「清空 marker 再雜湊」的變體；marker 是在出塊當下就決定的欄位，不會事後補。","E_U 是簽章訊息，不是父雜湊的輸入；若不涵蓋 seal，同一份內容可以被重複簽出多個合法父節點。","只雜湊兩個欄位會讓不同 header 碰撞成同一個 H_P，等於允許替換父區塊的其餘內容。","完整編碼（含 seal）與「重簽即脫鏈」的推論，正是 eq. 5.2 的直接後果。"]},{"id":"ch05-what-header-alone-proves","ch":"5","section":"5.1–5.3","gpRef":"§5; eq. 5.8; eq. 5.9","difficulty":3,"kind":"concept","tags":["header","light-client","validation"],"stem":"A node receives only a header, with neither the block body nor any chain state. Which checks can it complete, and which one is the first that it cannot?","options":["It can check structural well-formedness, that the timeslot exceeds its parent's, and that the slot is not in the future; it cannot verify the seal, because knowing who was entitled to author that slot requires the sealer sequence, which lives in state","It can check the seal and the entropy signature, since both are verifiable against the author index alone; what it cannot check is the timeslot, because comparing against the parent requires having stored the parent header","It can check nothing without state, because even the timeslot bound is expressed against the posterior validator set; this is why the GP requires implementations to keep 24 hours of ancestors before validating any header","It can check everything except the extrinsic hash, since only that field depends on data outside the header; the seal is self-contained because the author's public key is one of the header's own fields and needs no external lookup"],"answer":0,"explanation":"從 header 本身可以做的是結構檢查、以及 eq. 5.8 的時間條件：P(H)_T < H_T，且 H_T·P ≤ 目前的牆鐘時間（前者需要父 header，後者只需要時鐘）。**卡住的是 seal**：驗 H_S 要先知道「這個 slot 該由誰出塊」，那來自 γ′_S 與 κ′——都是狀態。這正好解釋 header 為什麼要帶 marker：H_E 給出下一個 epoch 的 key 與 entropy、H_W 給出該 epoch 的 600 張 ticket，讓只同步 header 的輕客戶端能自己推出 sealer 序列、往後一路驗下去，而不必重放狀態。","optNotes":["結構與時間可查、seal 需要 sealer 序列（狀態）——這正是 marker 存在的理由。","驗簽反而是最需要外部資訊的一步；而時間檢查只需要父 header 與時鐘。","24 小時祖先的要求是為了 anchor 檢查，不是時間條件的前提；時間條件不涉及 κ′。","作者的公鑰不是 header 欄位：H_I 是索引，H_A ≡ κ′[H_I]_b 只是等價式，不被序列化。"],"trap":"「拿到 header 你能驗什麼」是很常見的開場題，答案的分水嶺在「簽章需要狀態」。"},{"id":"ch05-genesis-presumed","ch":"5","section":"5.1 The Header","gpRef":"§5（genesis header 與 σ_g）","difficulty":2,"kind":"rationale","tags":["header","genesis","trust"],"stem":"The GP says consensus over the genesis header and the state it represents is presumed rather than derived. Why must a chain definition contain such an assumption at all?","options":["Because the validator set at genesis cannot be committed to inside the state it is meant to authorize, so the bootstrap keys are distributed by the chain spec and the state root is recomputed by each node from that file","Because the genesis state is too large to Merklize with the same function used for later blocks, so its root has to be published separately and taken on trust until the first real block establishes the normal invariants","Because the genesis block has no author and therefore no seal, and the GP's validity rules are stated only for sealed headers; presuming genesis is a notational shortcut that a production chain replaces with a genesis seal","Because every header's validity is defined relative to its parent, so the recursion needs a base case that is agreed out-of-band; without one, any self-consistent chain would be as valid as any other and 'the' chain would not be well defined"],"answer":3,"explanation":"§5 直接寫明：對 genesis header H_g 與它所代表的狀態 σ_g 的共識是**預設**的。理由是形式上的——header 的合法性是相對於父 header 定義的（H_P 指向父、H_T 必須大於父），這是一條遞迴；遞迴需要一個基底，而基底無法由同一套規則產生，否則任何一條自洽的鏈都同樣「合法」，「這條鏈」這個詞就沒有指涉。實務上這個基底就是 chain spec：所有節點在鏈外同意同一份 genesis，之後所有東西才能靠密碼學推導。","optNotes":["驗證者集合本來就存在 genesis 狀態裡；問題不在能不能放，而在誰來認定那份狀態。","genesis 狀態用的是同一個 Merklization 函數，大小不是問題。","把它說成暫時的notation 捷徑並不正確——任何鏈都需要這個公理，不會被 genesis seal 取代。","遞迴需要鏈外約定的基底，這是 genesis 被「預設」而非「推導」的形式理由。"]},{"id":"ch05-why-five-component-hash","ch":"5","section":"5.2 The Extrinsic Hash","gpRef":"eq. 5.4–5.7","difficulty":3,"kind":"rationale","tags":["header","extrinsic-hash","light-client"],"stem":"H_X hashes a sequence of five per-component hashes, and inside two of those components each item is itself reduced to a hash. What is that shape buying, and why are only those two treated that way?","options":["It lets the five components be gossiped and verified independently of one another, which is what allows a validator to accept the assurances of a block while still waiting for its guarantees to arrive over the network","It lets a third party prove one preimage or one guarantee was included without shipping the rest of the extrinsic, so the components whose individual items outsiders care about are itemized while the others are committed to wholesale","It bounds the size of the extrinsic, because a component that hashes its items individually can be checked against a per-item limit that a single flat encoding would hide from the on-chain validity rules","It keeps the hash cheap to recompute when one component changes, so an author assembling a block can swap in a better set of guarantees without rehashing the tickets, assurances and disputes it has already fixed"],"answer":1,"explanation":"GP 的原話是這個設計「taking care to allow for the possibility of reports and preimages to individually have their inclusion proven」。五個分量各自先 hash，再對這五個 hash 的序列取 hash，等於一棵極扁的證明樹：想證明某個 preimage 被納入，只要出示另外四個分量的 hash 加上 p 這個分量的內容即可，其他四份資料完全不必給。而 p 與 g 內部再把每一項換成 (E_4(service), H(data)) 與 (H(report), E_4(slot), var(credential))，是因為**外界真正會單獨追問的就是這兩種東西**：某份 preimage 有沒有上鏈、某份 report 有沒有被擔保。ticket、assurance、dispute 沒有這種外部需求，整包編碼即可。","optNotes":["H_X 是事後的承諾，與分量能不能各自傳播無關；區塊本來就是整體被驗證的。","為個別 preimage 與 report 提供包含證明，正是 GP 對這個結構寫下的理由。","大小限制寫在 §11 的 W_R 等規則裡，不靠雜湊結構表達。","重算成本不是動機：出塊者本來就要把整份 extrinsic 定下來才能封塊。"]},{"id":"ch05-epoch-marker-content","ch":"5","section":"5.3 The Markers","gpRef":"eq. 5.11；§6.6","difficulty":2,"kind":"concept","tags":["header","markers","epoch"],"stem":"When a block is the first of a new epoch, its epoch marker is populated. What does that marker carry, and who is it for?","options":["The identities of validators leaving and joining, expressed as a delta against the previous set, together with the entropy that will seed the coming epoch's shuffle","The next epoch's slot-sealer sequence in full, which is why the marker is optional — carrying it in every header would cost 600 entries per block rather than one per epoch","The next and current epoch randomness plus, for every validator of the coming epoch, its Bandersnatch and Ed25519 keys — enough for a header-only follower to reconstruct who may author and to verify their signatures","The hash of the previous epoch's final state and the ticket accumulator as it stood at the boundary, so that a follower can replay the ticket contest itself and confirm the sealer sequence was derived honestly"],"answer":2,"explanation":"§6.6：epoch marker 在新 epoch 的第一塊出現，內容是**下一個與當前 epoch 的隨機數**，加上一個序列，逐一列出下個 epoch 每位 validator 的 Bandersnatch 與 Ed25519 金鑰（型別即 eq. 5.11 的 ?(H, H, ⟦(bskey, edkey)⟧_V)）。它的受眾是只同步 header 的人：validator set 換人之後，後續所有 seal 都要用新的金鑰驗，而金鑰住在狀態裡；把它放進 header，輕客戶端才能在不重放狀態的前提下繼續驗下去。600 張 ticket 則是另一個 marker H_W 的內容，兩者常被搞混。","optNotes":["marker 給的是完整金鑰列表而非差異；差異式表示法要求接收者已經握有前一屆的完整集合。","600 張 ticket 是 winning-tickets marker H_W 的內容，不是 epoch marker。","兩個隨機數加上全套下屆金鑰、服務對象是只看 header 的追隨者，正是 §6.6 的定義與用途。","GP 沒有把 ticket accumulator 放進 marker；讓追隨者自行重跑抽籤等於要它持有狀態。"]},{"id":"ch05-index-not-key","ch":"5","section":"5.1 The Header","gpRef":"eq. 5.10","difficulty":2,"kind":"rationale","tags":["header","author","design"],"stem":"The header identifies its author by an index rather than by a public key. Beyond saving bytes, what does that choice force, and what does it cost?","options":["It forces the author to prove set membership separately, since an index alone cannot be checked against a signature; the cost is an extra ring proof per block, which is why the seal and the entropy signature are distinct","It forces the validator set to be ordered by public key so that indices are canonical; the cost is that a set change reorders every index, which is why offenders are zeroed in place rather than removed","It forces the index to be re-derived after disputes, since a punished validator's slot is reused; the cost is that two blocks in the same epoch may legitimately carry the same index for different authors","It forces every verifier to already agree on the posterior active set, since the index means nothing without it; the cost is that a header cannot be interpreted in isolation, which is precisely why the epoch marker exists"],"answer":3,"explanation":"eq. 5.10：H_I ∈ N_{|κ′|}，而 H_A ≡ κ′[H_I]_b 只是等價式，**不被序列化**。用索引的代價不只是省下 32 個位元組——它把「這個 header 說的是誰」變成一個相對於 κ′ 的問題，於是任何驗證者都必須先同意同一份 posterior active set 才能解讀 header。這正是 epoch marker 存在的理由：set 換人時，把新的金鑰序列放進 header，讓只看 header 的人也能跟上索引的意義。實作上還有一個直接後果：H_I 的上界是 |κ′| 而不是 |κ|，兩者只有在集合大小不變時才等價（fuzzer bug #825 就踩在這裡）。","optNotes":["seal 本身就是用 κ′[H_I] 的金鑰驗的，不需要額外的成員資格證明；ring proof 用在 ticket，不在 seal。","GP 沒有要求驗證者集合依公鑰排序；offender 被 Φ 歸零是 §6 的機制，與索引正規化無關。","同一個 epoch 內索引與人的對應是固定的；被懲罰者不會讓索引被別人接手。","索引把解讀權綁在 κ′ 上、因而需要 epoch marker，這是這個設計最實質的連動。"]},{"id":"ch05-offenders-marker-why","ch":"5","section":"5.3 The Markers","gpRef":"eq. 5.11；§10","difficulty":2,"kind":"rationale","tags":["header","markers","disputes"],"stem":"The offenders marker is a plain sequence of Ed25519 keys, empty in almost every block, and it duplicates information that disputes processing already puts into state. Why carry it in the header?","options":["Because the disputes extrinsic is optional and may be pruned from archived blocks, so the marker is the only durable on-chain record of who was punished and when","Because the marker is what the accumulation stage reads when it rewrites the validator queue, so leaving it out would make the punishment invisible to the next epoch's key rotation","Because offenders must be announced one block before their verdicts take effect, giving the accused a window to publish a counter-proof before the exclusion becomes final","Because punishment changes which keys may sign later, and a follower that only reads headers would otherwise keep accepting signatures from validators the chain has already excluded"],"answer":3,"explanation":"H_O ∈ ⟦ed25519 key⟧ 是一個可以為空、但永遠不是 ∅ 的普通序列（H_E 與 H_W 才是 optional，這個型別差異本身就是常考點）。它放進 header 的理由跟 epoch marker 同一條線：被剔除的 validator 之後不能再被當成合法簽章者，而只讀 header 的人不會處理 disputes extrinsic、也不持有 ψ_O；沒有這個 marker，它就會繼續接受早該被排除的簽章。至於狀態那份紀錄，是給完整節點做狀態轉移用的，兩者受眾不同、不是重複。","optNotes":["extrinsic 不會被協定層剪枝，marker 也不是為了保存歷史而存在。","accumulation 讀的是狀態裡的 ψ，不是 header 的 marker。","GP 沒有給被指認者緩衝期；verdict 一旦上鏈就生效。","讓只讀 header 的人知道「誰的簽章不再算數」，正是把 offender 放上 header 的理由。"]},{"id":"ch05-markers-optionality-cost","ch":"5","section":"5.3 The Markers","gpRef":"eq. 5.11","difficulty":2,"kind":"concept","tags":["header","markers","size"],"stem":"Two of the three markers are optional and one is not. What does that asymmetry buy, given how often each is populated and how large each can get?","options":["It lets the encoder distinguish 'no epoch change happened' from 'an epoch change happened with an empty key set', a distinction that matters at genesis and after a set-size change to zero validators","The two that can be large — a full key set and a whole epoch of tickets — appear at most once per epoch, so making them optional keeps the ordinary header to a fixed small size; the third is normally empty and an empty sequence already costs almost nothing","The asymmetry mirrors which fields are produced by Safrole and which by disputes: everything Safrole emits is optional because the ticket contest may fail, while disputes output is mandatory because a verdict cannot fail to conclude","The two that are optional are the ones a verifier may legitimately ignore, so a node that trusts its peers can skip decoding them; the third must always be present because the seal is computed over it and a missing field would change the signed message"],"answer":1,"explanation":"eq. 5.11：H_E ∈ ?(H, H, ⟦(bskey, edkey)⟧_V)、H_W ∈ ?(⟦ticket⟧_E)、H_O ∈ ⟦ed25519 key⟧。前兩個一旦出現就很大——一整套 validator 金鑰、或整個 epoch 的 600 張 ticket——但每個 epoch 至多出現一次，所以用 optional 讓平時只花一個 0 位元組的判別位元；第三個平常是空序列，長度前綴 0 已經幾乎不佔空間，做成 optional 沒有收益，反而多一層包裝。這是「編碼形狀跟隨出現頻率與大小」的典型取捨，也是最容易被追問「為什麼 H_O 不是 optional」的地方。","optNotes":["空序列與 ∅ 的區分在這裡沒有語意需求——沒有 offender 與有零個 offender 是同一件事。","大而罕見的用 optional、小而常在的用空序列，正是這組型別差異的成本考量。","H_W 確實與 Safrole 有關，但 H_E 也在 epoch 邊界必然出現，不是「可能失敗」才有。","seal 涵蓋的是 E_U 的全部欄位，三個 marker 都在裡面，沒有哪個因為 optional 而被排除。"]},{"id":"ch05-marker-misplacement","ch":"5","section":"5.3 The Markers","gpRef":"§5.3；§6.6","difficulty":3,"kind":"concept","tags":["header","markers","validity"],"stem":"A block arrives mid-epoch carrying a populated epoch marker. How should a validator treat it, and what is the general principle behind that treatment?","options":["Accept the block and adopt the marker, treating it as an early announcement of the coming epoch; this is the mechanism by which an author can pre-publish a set change that the state has not yet applied","Reject the block only if the marker's key set differs from the one already in state; a marker that merely appears at an unexpected time is harmless because its content is still correct","Reject the block: the markers are not free-form annotations but values the state transition itself determines, so a header whose marker disagrees with what the transition produces is simply not a valid header","Accept the block but ignore the marker, since markers are advisory aids for light clients and a full node derives the same information from state; only a marker that contradicts state in a way affecting the seal can invalidate a block"],"answer":2,"explanation":"marker 不是出塊者可以自由填寫的欄位：H_E 與 H_W 的內容與**出現時機**都是由狀態轉移決定的（§6.6 把 H_E 定義成一個依 e′ ≠ e 分支的式子，非邊界時就是 ∅）。因此「epoch 中間出現 epoch marker」不是一個可以容忍的瑕疵，而是 header 與狀態轉移不一致——區塊無效。背後的通則值得記牢：**header 裡每一個欄位都是狀態轉移的承諾，不是附註**；驗證一個區塊，本質上就是重跑轉移並確認每個承諾都對得上。這也是為什麼 marker 雖然是為輕客戶端而設，全節點仍然必須檢查它。","optNotes":["GP 沒有「預先公告」的機制；epoch 邊界由 τ 與 E 決定，不由出塊者宣告。","出現時機本身就是規格的一部分，內容正確不能補救時機錯誤。","marker 由狀態轉移決定，不一致即無效，這是 header 欄位的一般原則。","把 marker 當成可忽略的註記，等於允許出塊者對輕客戶端說謊而不受懲罰。"],"trap":"面試常追問「如果出塊者亂填 marker 會怎樣」——答「無效」還不夠，要說出「marker 是轉移的承諾」這條通則。"},{"id":"ch05-absent-commitments","ch":"5","section":"5.1 The Header","gpRef":"eq. 5.1；§4","difficulty":3,"kind":"rationale","tags":["header","design","comparison"],"stem":"An Ethereum header commits to the post-state, a receipts root and the gas consumed. A JAM header carries none of the three. Where does each of those roles go instead?","options":["The post-state is committed to by the seal, which signs the state root the author computed; receipts are replaced by the accumulation output log in the header; and gas is omitted because JAM meters core time in slots rather than in gas","The post-state appears as the next block's prior state root; per-item outcomes live in work-digests inside reports rather than in the header; and resource use is bounded in advance by core time and gas ceilings instead of being reported after the fact","All three are folded into the extrinsic hash, whose five components include a results component; JAM simply reorganizes the same commitments under one field so that light clients need to follow only one root rather than three","They are all deferred to the BEEFY commitment, which is why a JAM header is smaller: anything an external verifier needs is proven against the accumulation-output MMR rather than against the header itself"],"answer":1,"explanation":"三件事各有去處。post-state：JAM 的 header 帶的是 **prior** state root，某一塊的執行結果要到**下一塊**的 H_R 才被承諾——這是為了讓出塊與 Merklization 管線化。receipts：JAM 沒有 receipt 這一層，每個 work-item 的結果（成功的 blob 或 𝔼 裡的錯誤）留在 work-report 的 digest 裡，隨報告上鏈，accumulate 讀得到。gas：JAM 不事後回報用量，而是事前設限——core time 本身是稀缺資源、report 有 G_A 之類的上限、PVM 以 basic block 預扣，超過就是 OOG。少了這三個承諾，header 只剩十個欄位，這也是它能保持小而固定的原因。","optNotes":["seal 簽的是 header 自身（不含 seal 的編碼），不是狀態根；header 也沒有 accumulation output log 欄位。","prior state root、digest 裡的結果、事前設限取代事後回報，三者各自對應原本的角色。","extrinsic hash 承諾的是輸入（extrinsic），不是執行結果；它沒有 results 分量。","BEEFY 的 MMR 承諾 accumulation output，取代不了 state root 與逐項結果。"]},{"id":"ch04-stf-extrinsic","ch":"4","section":"4.1 The Block","gpRef":"eq. 4.2–4.3 (block / extrinsic)","difficulty":1,"kind":"concept","tags":["block","extrinsic"],"stem":"Per GP 0.8.0, the extrinsic E of a JAM block is a tuple of exactly five components. Which of the following is NOT one of them?","options":["E_A — availability assurances by validators","E_D — disputes (verdicts, culprits, faults)","E_T — tickets for the Safrole slot-sealer contest","E_X — user transactions signed by external accounts"],"answer":3,"optNotes":["E_A 是 validator 對 availability 的 assurance，確實列在 eq. 4.3 之中。","E_D 是 disputes（verdicts、culprits、faults），eq. 4.3 的第二項。","E_T 是 eq. 4.3 五元組的第一項：Safrole 的 ticket extrinsic。","「使用者簽名的交易」是 Ethereum 模型的概念，eq. 4.3 的五元組裡沒有這一項。"],"explanation":"GP eq. 4.3：E ≡ (E_T, E_D, E_P, E_A, E_G)，即 tickets、disputes、preimages、assurances、guarantees（reports）。JAM 是 transactionless 的：沒有任何「使用者簽名的交易」進入區塊，所有 extrinsic 都是由 validator 產生的；外部資料只能透過 work-package（in-core 的 refine）以及 preimage 進入系統（§4.7：「there is no such concept of a transactor」）。","trap":"面試常問：JAM 為什麼沒有 transaction？答：授權（authorization）與 blockspace 購買（coretime）被拆開，外部輸入經 refine 進入。"},{"id":"ch04-state-components","ch":"4","section":"4.2 The State","gpRef":"eq. 4.4 (state composition)","difficulty":2,"kind":"concept","tags":["state"],"stem":"GP eq. 4.4 partitions the state σ into 17 components. Which pairing of symbol → meaning is WRONG?","options":["θ → the accumulation output log of the most recent block","ω → the authorizer queue from which each core's pool is refilled","ρ → each core's current availability assignment (a guaranteed but not-yet-available work-report)","ξ → work-packages recently accumulated (one epoch of history)"],"answer":1,"optNotes":["θ 確實是本區塊的 accumulation output log，配對無誤。","ω 是 ready queue（已 available 但 dependency 未滿足的 report）；authorizer queue 是 φ。","ρ 確實是每個 core 的 availability assignment：已 guarantee 但尚未 available 的 work-report。","ξ 確實是最近一個 epoch 內已 accumulate 的 work-package hash，配對無誤。"],"explanation":"σ ≡ (α, β, θ, γ, δ, η, ι, κ, λ, ρ, τ, φ, χ, ψ, π, ω, ξ)，共 17 個分量。最容易混的是 authorization 與 accumulation 兩組佇列：α 是 authorizer pool、φ 是 authorizer queue（pool 的補給來源）、ω 是 ready queue、ξ 是防重複與 dependency 判斷用的已 accumulate 集合、θ 是本區塊的 accumulation output log（(service, hash) pairs），會被 β 的 belt 吸收。","trap":"ω (vartheta) vs φ (phi) 容易混：ω = ready/queued reports，φ = auth queue。"},{"id":"ch04-dependency-graph-alpha","ch":"4","section":"4.2.1 State Transition Dependency Graph","gpRef":"eq. 4.5–4.20","difficulty":2,"kind":"concept","tags":["stf","ordering"],"stem":"In the state-transition dependency graph, the posterior authorizer pool α′ is defined as α′ ≺ (H, E_G, φ′, α). What does this imply for the order of computation inside a block import?","options":["α′ can be computed before any extrinsic is validated, since eq. 4.5–4.20 makes it depend only on the header's timeslot H_T and the prior pool α","α′ must be computed after accumulation, because φ′ (the posterior authorizer queue) is only known once accumulate has run (the `assign` host call may change it)","α′ is independent of the extrinsic and may run in parallel with Safrole, since φ changes only through the `designate` privilege held by the delegator χ_V","α′ must be computed before the guarantees extrinsic is validated, since eq. 11.32 checks each report's authorizer against the posterior pool α′[w_c]"],"answer":1,"optNotes":["eq. 4.5–4.20 的依賴列是 α′ ≺ (H, E_G, φ′, α)，共四個輸入，不只 header 與 prior pool。","φ′ 只有在 accumulation 跑完後才定義，§8.2 明講這一步必須排在 accumulation 之後。","認錯了 host call 與權限：改 φ[c] 的是 core 的 assigner χ_A 用 assign，designate 是 χ_V 設 ι。","prior 與 posterior 反了：eq. 11.32 檢查的是 w_a ∈ α[w_c]，用的是 prior pool。"],"explanation":"GP §8.2 明講：「Since α′ is dependent on φ′, practically speaking, this step must be computed after accumulation, the stage in which φ′ is defined.」α′[c] = ←(F(c) ⌢ φ′[c][H_T mod Q])^O 的兩個動態輸入分工明確：E_G 決定哪些 authorizer hash 要從 pool 移除，φ′ 決定補進來的是什麼，而 φ 只能被持有 assigner 權限的 service 在 accumulate 裡修改。你們的 STF（internal/stf/sft.go）也是在 accumulation 之後才做 α′。","trap":"guarantee 驗證看 prior α；pool 更新用 posterior φ′。"},{"id":"ch04-common-era","ch":"4","section":"4.4 Time","gpRef":"§4.4 (JAM Common Era)","difficulty":1,"kind":"concept","tags":["time"],"stem":"When does the JAM Common Era begin, and why was that particular time of day chosen?","options":["00:00 UTC on 1 January 1970 — the Unix epoch itself, so a JAM timeslot index is simply the current Unix time divided by P = 6 seconds","12:00 UTC on 1 January 2025 — midday ensures every major timezone is on the same calendar date at any exact 24-hour multiple from the epoch start","12:00 UTC on 1 January 2024 — the day the first Gray Paper was published, so the slot index counts from the specification's own birthday","00:00 UTC on 1 January 2025 — a midnight start makes timeslot 0 the first slot of a calendar day, so every 14,400-slot boundary is a date change worldwide"],"answer":1,"optNotes":["若 era 就是 Unix epoch，腳註那個 1,735,732,800 秒的偏移就會是 0。","GP 選 midday 的理由就是讓所有主要時區在 24 小時整數倍時落在同一個日期。","年份錯了（是 2025），而且 GP 從未把 common era 綁在自身的出版日上。","從 UTC 午夜起算的 24 小時倍數，UTC−5 還停在前一天、UTC+9 已進隔天，正是 midday 要避免的。"],"explanation":"GP §4.4：「we define the time in terms of seconds passed since the beginning of the JAM Common Era, 1200 UTC on January 1, 2025」（Unix 時間 1,735,732,800 秒後），並直接給出理由：「Midday UTC is selected to ensure that all major timezones are on the same date at any exact 24-hour multiple from the beginning of the common era.」timeslot index 即自 Common Era 起算的 6 秒週期數，H_T·P ≤ T（wall clock）才是有效的 slot。","trap":"數字題：1,735,732,800；slot = 6 秒；epoch = 600 slots = 1 小時。"},{"id":"ch04-in-core-vs-on-chain","ch":"4","section":"4.8 The Core Model and Services","gpRef":"§4.9.1–4.9.2","difficulty":1,"kind":"concept","tags":["architecture","refine","accumulate"],"stem":"Which statement correctly contrasts JAM's in-core and on-chain consensus models?","options":["Both are executed by all validators and differ only in pricing: in-core gas is charged per octet of the work-package, while on-chain gas is charged per PVM instruction","In-core computation (refine) is executed by every validator, while on-chain computation (accumulate) is executed only by the block author and replayed by others on a dispute","In-core computation (refine) is stateful and may transfer balances between services; on-chain computation (accumulate) is stateless and accepts arbitrarily large inputs","In-core computation (refine) is executed by a subset of validators and secured by the guarantee/assure/audit/judge game; on-chain computation (accumulate) is executed by all validators"],"answer":3,"optNotes":["差異的本質是「誰執行」與可擴展性，不是計價；沒有按 work-package octet 計 gas 這種規則。","兩邊都顛倒了；accumulate 是 STF 的一部分，每個匯入區塊的節點都必須重算才對得上 H_R。","說反了：refine 是 stateless、吃任意大的輸入，accumulate 才 stateful、能 transfer balance。","§4.9.1 的 in-core 只由子集執行、以 guarantee/assure/audit/judge 擔保；on-chain 才是全體都算。"],"explanation":"GP §4.9.1：in-core model 下「only a subset of the network is responsible for actually executing any given computation」，靠 guaranteeing → assuring → auditing →（可能的）judging 這組 crypto-economic game 確保正確性，可達單機約 300 倍的算力；on-chain（accumulate）則是 GP 稱為「everybody does everything」的模型。§4.9.2 補上兩者的性格：refine 是「a sort of high-performance stateless processor, able to accept arbitrary input data」，accumulate 則「more stateful, providing access to certain on-chain functionality including the possibility of transferring balance」，而 GP 對兩者差異的總結是「the primary difference between them one of scalability versus synchroneity」。","trap":
