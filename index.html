b (services that yielded a 32-byte hash); (δ†, ι′, φ′, χ′) come from e′; the accumulation statistics record per service (N items accumulated, T transfers processed, G gas used); δ‡ marks a_a = τ′ for every service that appears in the statistics; ξ′[E−1] = P(R*[..n]) and ω′ is emptied in full, so that no queued report ever survives a block","θ′ = the (service, hash) pairs in b (services that yielded a 32-byte hash); (δ†, ι′, φ′, χ′) come from e′; the accumulation statistics record per service (N items accumulated, T transfers processed, G gas used); δ‡ marks a_a = τ′ for every service that appears in the statistics; ξ′[E−1] = P(R*[..n])"],"answer":3,"explanation":"eq. 12.24：(n, e′, b, u, t) ≡ Δ+(g, [], R*, e, χ_Z)；θ′ ≡ [(s, h) ∈ b]（餵 §7 的 belt）；eq. 12.26：(δ†, ι′, φ′, χ′_M, χ′_A, χ′_V, χ′_R, χ′_Z) ≡ e′。eq. 12.27–12.28：accumulation statistics 記作 **S** ∈ D⟨N_S → (N, N, N_G)⟩，S(s) = (N(s) 前 n 個 report 中屬於 s 的 digest 數, T(s) 處理的 transfers 數（0.8.0 #502 加回）, G(s) gas used)，只記非 (0,0,0) 者。eq. 12.29–12.30：δ‡ = δ† 但 keys(S) 中的 service a_a = τ′。eq. 12.31–12.33：ξ′[E−1] = P(R*[..n])、其餘左移；ω′ 的 ring 更新。干擾項逐一：說 θ′ = H(E(δ†))、ξ′[E−1] = P(R*) 全部者錯兩處——θ′ 是 accumulation output log，內容是 b 裡的 (s, h) 配對序列（餵給 §7 的 belt），不是狀態雜湊；而 ξ′[E−1] 只收 R*[..n]，也就是本塊**真的**做完的前 n 個，其餘留給後續區塊。說統計是 (N, G) 二元組、且 a_a 對 keys(δ†) 全面更新者也錯兩處——0.8.0 的 S(s) 是 (N(s), T(s), G(s)) 三元組，而 a_a = τ′ 只加在 keys(S) 上，沒被 accumulate 的帳戶不動。說 ω′ 整個清空者錯在 ω′ 是環狀更新：ω′[m] 放本塊新的 R^Q 並以 ξ′[E−1] 修剪，被跳過的 slot 才清空，其餘 slot 保留、同樣經過 E 修剪。","trap":"a_a（last accumulation slot）只對「這塊真的 accumulate 過」的 service 更新。"},{"id":"ch12-preimage-integration","ch":"12","section":"12.4 Preimage Integration","gpRef":"eq. 12.34–12.37","difficulty":2,"kind":"concept","tags":["accumulation","preimages"],"stem":"Which rule governs the preimages extrinsic E_P and its integration into δ′?","options":["E_P ∈ [(s, d)] ordered & unique; each (s, d) must be providable in the PRIOR δ — the service exists and δ[s]_l[(H(d), |d|)] = [] (requested, not yet provided); integration happens after accumulation: δ′ = I(δ‡, E_P), setting a_l[(H(d),|d|)] = [τ′] and a_p[H(d)] = d, silently dropping any preimage that is no longer useful","E_P ∈ [(s, d)] ordered & unique; any preimage may be included whether or not the service solicited it, since I stores every pair it is handed; integration happens BEFORE accumulation, δ† = I(δ, E_P), so that a service's Accumulate can read a preimage supplied in the same block, setting a_l[(H(d),|d|)] = [τ′] and a_p[H(d)] = d","E_P ∈ [(s, d)] ordered & unique; each (s, d) must be providable in the POSTERIOR δ‡ — the service must still exist there and δ‡[s]_l[(H(d), |d|)] = [] — so a request that accumulation dropped in the same block makes the whole block invalid; integration is then δ′ = I(δ‡, E_P), setting a_l[(H(d),|d|)] = [τ′] and a_p[H(d)] = d","E_P ∈ [(s, d)] need only be free of duplicates, the ordering being unconstrained; each (s, d) must be providable in the prior δ and must additionally be signed by the service's manager; integration happens after accumulation: δ′ = I(δ‡, E_P), setting a_l[(H(d),|d|)] = [τ′] and a_p[H(d)] = d, silently dropping any preimage that is no longer useful"],"answer":0,"explanation":"eq. 12.34–12.36：E_P ∈ [(N_S, B)]，依 (s, d) 排序且唯一，∀(s, d)：Y(δ, s, d)（providable：s ∈ keys(δ) 且 δ[s]_l[(H(d), |d|)] = []）——用 **prior** δ 檢查。eq. 12.37：δ′ = I(δ‡, E_P)——在 accumulation 之後才整合（依 §4 dependency graph 的 merge/join），因此若 accumulate 過程中 service 被刪或 request 被 forget，該 preimage「disregarded, without prejudice」。I 會把 request 設為 [τ′] 並寫入 preimage。你們的錯誤碼：preimages not sorted and unique / preimage not required。干擾項逐一：說 providability 要對 **posterior** δ‡ 檢查、且 accumulation 途中被 forget 掉的 request 會讓整塊無效者錯兩處——eq. 12.36 的 Y 明確吃 prior δ，而 §12.4 說這種 preimage 是「disregarded, without prejudice」，區塊照樣有效。說未經 solicit 的 preimage 也能塞、而且整合排在 accumulation **之前**者也錯兩處——Y 要求 δ[s]_l[(H(d), |d|)] = []（必須已被 request 且尚未提供），且 §12.4 開頭就是「After accumulation, we must integrate all preimages」，順序倒過來會讓同一塊的 accumulate 讀到本不該看見的 preimage。說 E_P 只要去重、不必排序，還要 manager 簽章者錯兩處——eq. 12.35 要求 ordered **且** unique，而 GP 從頭到尾沒有任何簽章條件，能不能提供只看 request 是否存在。","trap":"驗證看 prior δ、整合作用於 δ‡；順序題在 fuzzer 很常出現。"},{"id":"ch12-code-outer-accumulation","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.17 — internal/accumulation/accumulation.go OuterAccumulation","difficulty":3,"kind":"code","tags":["accumulation","code","delta-0.8.0"],"stem":"This is the team's prefix selection in Δ+. Compared with GP 0.8.0 eq. 12.17, what is missing?","code":{"lang":"go","caption":"internal/accumulation/accumulation.go (OuterAccumulation, 0.7.2)","src":"gasSum := types.Gas(0)\ni := 0\n// Determine the maximal prefix of reports that fits within the gas limit\nfor idx, report := range r {\n    for _, result := range report.Results {\n        gasSum += result.AccumulateGas\n    }\n    if gasSum <= g {\n        i = idx + 1\n    } else {\n        break\n    }\n}\n// n = |t| + i + |f|\nn := len(t) + i + len(f)"},"options":["0.8.0 requires the budget test to include Σ gas of the pending deferred transfers t and Σ free-accumulation allowances f (Σ d_g + Σ t_g + Σ f ≤ g), so gasSum must start from those two sums rather than 0","The test must be applied per report rather than cumulatively: eq. 12.17 requires each individual report in r[..i] to satisfy Σ d_g ≤ G_A = 10^7, so the loop must break at the first report exceeding that per-report cap","The gas figures are the wrong ones: eq. 12.17 sums each digest's actual gas used d_u over the prefix rather than the declared limits d_g, since Δ* hands the real usage back before the budget is tested","The bound on i is wrong: eq. 12.17 takes i as a maximum over N_{|r|+1} so that i may reach |r|, whereas `i = idx + 1` inside the loop caps it at |r| − 1 and always leaves the final report for the next round"],"answer":0,"explanation":"eq. 12.17（0.8.0）：i = max(N_{|r|+1})：Σ_{r ∈ r[..i], d ∈ r_d} d_g + Σ_{t ∈ t} t_g + Σ_{x ∈ values(f)} x ≤ g。PR #500「Account for gas reserved by transfer and always acc items」把 transfer gas 與 always-accumulate 的 gas 納入預算判斷（否則實際可能超出 g）。0.7.2 的 code 只加 AccumulateGas。n = |t| + i + |f| 在兩版都一樣。單一 report 的 Σ d_g ≤ G_A 是在 §11 guarantee 驗證時就擋掉的，不在這裡。干擾項逐一：說應該改加實際用掉的 d_u 而非宣告上限 d_g 者錯在 §12.2 已講明「Only after a work-item is accumulated can it be known if it uses less gas than the advertised limit」——實際用量只能在 Δ* 跑完之後，透過 g* = g + Σ t* gas − Σ u 回饋到下一輪，預算測試當下手上只有 d_g（何況 digest 裡的 u 記的是 **refine** 用掉的 gas，本來就不是 accumulate 的量）。說要改成「每個 report 各自 Σ d_g ≤ G_A」者錯在 eq. 12.17 的測試是對整個前綴**累加**的；單一 work-package 的 Σ w_a < G_A 是 §14.3 的封包合法性條件，與這個迴圈無關。說 `i = idx + 1` 讓 i 封頂在 |r| − 1 者根本不成立：idx 最大取到 |r| − 1，i 因此可以等於 |r|，與 eq. 12.17 的 i ∈ N_{|r|+1} 完全一致。","trap":"你們 issue digest 提到：eq:accseq budget now includes transfer gas + free allowances。"},{"id":"ch13-validator-stats","ch":"13","section":"13.1 Validator Activity","gpRef":"eq. 13.1–13.6","difficulty":2,"kind":"delta","tags":["statistics","delta-0.8.0"],"stem":"π ≡ (π_V, π_L, π_C, π_S). Which statement about the validator statistics is correct in GP 0.8.0?","options":["Each validator record has six counters (blocks b, tickets t, preimage count p, preimage size d, guarantees g, assurances a); assurances of this block are credited to π_V† BEFORE the epoch-rollover check; on e′ ≠ e, π_L ← π_V† and π_V resets; then b/t/p/d are credited to every validator whose signature appears in the matching extrinsic, and g to the block author H_I","Each validator record has five counters (blocks b, tickets t, preimage count p, preimage size d, guarantees g), assurances being tracked per core in π_C instead; on e′ ≠ e both π_V and π_L are zeroed so that the new epoch starts from nothing; then b/t/p/d are credited to the author H_I and g to every validator in the reporters set G","Each validator record has six counters (blocks b, tickets t, preimage count p, preimage size d, guarantees g, assurances a); assurances of this block are credited AFTER the epoch-rollover check, so on e′ ≠ e they land in the fresh π′_V instead of in π′_L; π_L then takes π_V rather than π_V†; b/t/p/d go to the author H_I and g to the reporters set G","Each validator record has six counters (blocks b, tickets t, preimage count p, preimage size d, guarantees g, assurances a); assurances of this block are credited to π_V† BEFORE the epoch-rollover check; on e′ ≠ e, π_L ← π_V† and π_V resets; then b/t/p/d are credited to the author H_I and g to every validator in the reporters set G"],"answer":3,"explanation":"eq. 13.1：π_V, π_L ∈ [(b, t, p, d, g, a)]，|π_V| = |κ|、|π_L| = |λ|。eq. 13.4：π_V† = π_V 但 ∀v：a += (∃a ∈ E_A: a_v = v)——用 prior κ 的索引，**先**於 rollover；eq. 13.5：e′ = e 時 (π_V‡, π′_L) = (π_V†, π_L)，否則 ([0…], π_V†)；eq. 13.6：π′_V = π_V‡ 但 b += (v = H_I)、t += |E_T|（作者）、p += |E_P|、d += Σ|d|（作者）、g += (κ′[v] ∈ R)。0.8.0 把 assurance 的計入移到 rollover 之前（0.7.2 是一起算），你們 issue digest：「assurances credited before epoch rollover in 0.8.0」。§13 開頭：JAM 不直接發獎勵，只提供資料給 staking 子系統。干擾項逐一：說 assurance 記在 rollover **之後**、π_L 接的是 π_V（而非 π_V†）者描述的是 0.7.2 的順序——0.8.0 先做 eq. 13.4 再做 13.5，所以 epoch 邊界那一塊的 assurance 會被封進 π′_L 而不是留在新的 π′_V。說只有五個 counter、assurance 改記在 π_C、且 rollover 時 π_V 與 π_L 一起歸零者錯兩處——eq. 13.2 明列六個欄位（含 a），π_C 的 popularity 記的是每個 **core** 被打勾的次數而不是每個 validator 的行為；rollover 是 π_L ← π_V† 的交棒，不是雙雙清空，否則上一個 epoch 的資料就無從 oracle 出去。說 b/t/p/d 依簽章歸屬、g 記給 author 者剛好把兩組規則對調——eq. 13.6 的 b/t/p/d 全部只加在 H_I 身上（ticket 是匿名 ring-VRF，鏈上根本不知道誰產生的），g 才是看 κ′[v] 是否落在 reporters set G 裡。","trap":"每個 validator 每塊最多 +1 assurance、+1 guarantee（存在性判斷，不是數量）。"},{"id":"ch13-core-service-stats","ch":"13","section":"13.2 Cores and Services","gpRef":"eq. 13.7, 13.9–13.12","difficulty":3,"kind":"concept","tags":["statistics"],"stem":"Core statistics π_C and service statistics π_S are per-block (not per-epoch). Which description of the core statistics is correct?","options":["Per core: d (DA load) = Σ over the reports GUARANTEED this block (the set I) on that core of bundle length + W_G·⌈65·segment_count/64⌉; p (popularity) = the number of reports guaranteed on that core; i, x, z, e, u and l are summed over I as well, so every field of π′_C comes from one and the same source","Per core: d (DA load) = Σ over the reports that became AVAILABLE this block (the set R) on that core of bundle length + W_G·⌈65·segment_count/64⌉; p (popularity) = the number of assurances whose bitfield has that core set; i, x, z, e, u and l are summed over the reports GUARANTEED this block (the set I) on that core","Per core: d (DA load) = Σ over the reports that became AVAILABLE this block (the set R) on that core of bundle length + W_G·⌈65·segment_count/64⌉; p (popularity) = the number of guarantor signatures backing that core's reports; i, x, z, e and u are summed over the reports GUARANTEED this block (the set I), but l is the largest bundle length on that core rather than their sum","Per core: d (DA load) = Σ over the reports that became AVAILABLE this block (the set R) on that core of bundle length + W_G·segment_count, the paged proofs not being counted; p (popularity) = the number of assurances whose bitfield has that core set; i, x, z, e, u and l are summed over R as well, so all eight fields follow availability"],"answer":1,"explanation":"eq. 13.9–13.12：π′_C[c] = (d = D(c), p = Σ_a a_f[c], i, x, z, e from R(c), l = L(c), u refine gas)。R(c) 與 L(c) 對 **I**（本塊 E_G 進來的 report，w_c = c）求和；D(c) 對 **R**（本塊剛 available 的 report）求和：bundle length + W_G·⌈k·65/64⌉——65/64 是因為每 64 個 export segment 會多一頁 paged-proof segment（§14）。popularity = 本塊 assurance 中對該 core 打勾的數量。你們 code-map 3.9：「DA load is computed from W while imports/exports/gas/bundle-size come from w」。干擾項逐一：說八個欄位全部對 I 求和、p = 該 core 本塊的 report 數者錯兩處——d 的來源是 R（本塊剛 available 的 report），而 p 是對 E_A 的 availability bitfield 求和（Σ_a a_f[c]），跟 report 數無關。說 d = bundle length + W_G·segcount（不含 paged proof）、且 i/x/z/e/u/l 也對 R 求和者也錯兩處——65/64 的係數正是把每 64 個 export segment 額外多出的那一頁 paged-proof segment 算進 DA 負擔，而 R(c) 與 L(c) 的求和範圍是 I 不是 R。說 p 是該 core 的 guarantor 簽章數、l 取最大值者同樣錯兩處——p 仍然是 assurance 打勾數，L(c) 是該 core 上所有 report 的 bundle length **總和**而不是最大值。","trap":"兩個不同來源（guaranteed vs available）——面試容易考。"},{"id":"ch13-service-stats","ch":"13","section":"13.2 Cores and Services","gpRef":"eq. 13.8, 13.13–13.17","difficulty":2,"kind":"concept","tags":["statistics"],"stem":"Which services appear in π′_S for a block, and what does the accumulation entry hold?","options":["s = every service in keys(δ), so π′_S carries one entry per existing account in every block; the entry holds provision (count, total size) from E_P, refinement (count, gas), imports/extrinsics/exports, and accumulation = S(s) = (items N, transfers T, gas G) or (0,0,0)","s = services with a digest in this block's reports ∪ services that received a preimage in E_P ∪ keys of the accumulation statistics; the entry holds provision (count, total size) from E_P, refinement (count, gas), imports/extrinsics/exports, and accumulation = S(s) = (items N, transfers T, gas G) or (0,0,0)","s = every service touched since the start of the epoch, since π_S accumulates across an epoch and is cleared only when e′ ≠ e; the entry holds provision (count, total size) taken from the digests, refinement (count, gas), imports/extrinsics/exports, and accumulation = S(s) = (items N, transfers T, gas G) or (0,0,0)","s = the keys of the accumulation statistics only, so a service that was merely reported on or that received a preimage this block gets no entry at all; the entry holds provision (count, total size) from E_P, refinement (count, gas), imports/extrinsics/exports, and accumulation = (items N, gas G)"],"answer":1,"explanation":"eq. 13.13–13.17：s = s^R（reported）∪ s^P（provided）∪ keys(S)；π′_S[s] = (p provision = Σ (1, |d|) over E_P for s, r refinement = (count, gas used) over digests, i, x, z, e, a accumulation = S(s) 或 (0,0,0))。π_S 是 per-block 的，所以沒活動的 service 不會出現。0.7.1 拿掉 on_transfer 的統計、0.8.0 (#502) 把 processed-transfer count 加回 accumulation 三元組。干擾項逐一：說 s = keys(δ)、每個帳戶每塊都有一筆者錯在 π_S 是 per-block 的活動紀錄，只有 s^R ∪ s^P ∪ keys(S) 這三個來源的 service 才會出現，沒活動就不列。說 s 只有 keys(S)、且 accumulation 是 (N, G) 二元組者錯兩處：本塊被 report 或收到 preimage 但沒 accumulate 的 service 仍要列（refinement 與 provision 欄位就是為它們而設），而 (N, G) 是 0.7.2 的形狀，0.8.0 已把 processed-transfer 數補回成三元組。說 π_S 跨 epoch 累積、provision 取自 digests 者也錯兩處：§13.2 明說 core 與 service 統計「tracked only on a per-block basis」，跨 epoch 累積並在 e′ ≠ e 換手的是 π_V／π_L；provision 的 (1, |d|) 是對 E_P 求和，digests 貢獻的是 refinement 與 i/x/z/e。","trap":"π_S 的 accumulation 是 (N, T, G) 三元組。"}],"terms":[{"sym":"σ","term":"state","zh":"整體狀態","cat":"state","gpRef":"eq. 4.4","one":"JAM 的完整狀態，拆成 17 個大致獨立的元件。","body":"σ ≡ (α, β, θ, γ, δ, η, ι, κ, λ, ρ, τ, φ, χ, ψ, π, ω, ξ)。拆成獨立元件有兩個目的：一是讓 state-transition 的依賴圖夠淺、可以平行計算（§4.2.1）；二是讓 Merklization 的 key 空間可以用單一 byte 的 chapter 前綴分區（附錄 D 的 C(i)）。σ′ 代表 posterior（本區塊處理完之後）的狀態。","rel":["σ′","C(i)","STF"]},{"sym":"α","term":"authorizer pool","zh":"授權池","cat":"state","gpRef":"eq. 8.1–8.3","one":"每個 core 目前可用的 authorizer hash 序列（最多 O = 8 個）。","body":"α ∈ [[H]_{:O}]_C。guarantee 上鏈時檢查 w_a ∈ α[w_c]（用 **prior** α）。每個區塊每個 core 都會從 queue 補一個進來：α′[c] = ←(F(c) ⌢ φ′[c][H_T mod Q])^O，其中 F(c) 會把本塊用掉的 authorizer 從**最左邊**移除一個（seqminusl，不是移除全部）。因為要用 posterior 的 φ′，這一步必須排在 accumulation 之後。","rel":["φ","authorizer","O","Q"]},{"sym":"β","term":"recent history","zh":"近期歷史","cat":"state","gpRef":"eq. 7.1–7.8","one":"最近 H = 8 個區塊的摘要（β_H）加上 accumulation output 的 MMR（β_B）。","body":"β ≡ (β_H, β_B)。β_H 每筆是 (header hash, state root, accumulation-output super-peak, timeslot, 本塊回報的 package hash → segment root)。用途：擋掉重複或過期的 work-report——guarantee 的 anchor 必須對上 β† 的某一筆，package hash 不得出現在 β 的任何一筆裡。β_B 是 Keccak MMR，接收每塊的 accumulation output root。","rel":["β†","β_B","anchor","H (常數)"]},{"sym":"β†","term":"beta dagger","zh":"補正後的近期歷史","cat":"state","gpRef":"eq. 7.5","one":"把 β_H 最後一筆的 state root 用本塊的 H_R 補上之後的中間值。","body":"因為 header 帶的是 **prior** state root，寫入 β 的當下還不知道自己的 posterior root，所以先填零 hash；下一個區塊一開始就用自己的 H_R 覆蓋回去（β† ≡ β_H except β†[|β_H|−1]_s = H_R）。之後 guarantee 的 anchor 檢查比對的是 β†，不是 β。","rel":["β","H_R","pipelining"]},{"sym":"γ","term":"Safrole state","zh":"Safrole 狀態","cat":"state","gpRef":"eq. 6.3–6.5","one":"出塊抽籤相關的四元組 (γ_P, γ_Z, γ_S, γ_A)。","body":"γ_P 下個 epoch 的 pending validator keys（每個 epoch 開頭從 ι 重置）；γ_Z 由 γ_P 的 Bandersnatch key 組成的 ring root，用來驗 ticket 的 ring proof；γ_S 本 epoch 的 slot-sealer 序列（E 張 ticket 或 fallback 的 E 把 key）；γ_A ticket accumulator，收集下個 epoch 要用的 ticket（最多 E 筆，留最低的 E 個 id）。","rel":["γ_S","γ_A","γ_Z","ι","κ"]},{"sym":"γ_S","term":"slot-sealer sequence","zh":"時槽封印序列","cat":"state","gpRef":"eq. 6.25–6.27","one":"本 epoch 每個 slot 由誰出塊：600 張 ticket，或 fallback 的 600 把公鑰。","body":"三種情況（eq. 6.25）：e′ = e + 1 ∧ m ≥ Y ∧ |γ_A| = E → Z(γ_A)（outside-in 排序的 ticket）；e′ = e → 不變；其餘（跳過 epoch、accumulator 未滿、比賽未結束）→ F(η′_2, κ′) 的 fallback key。出塊者用 γ_S[H_T mod E] 對應的私鑰簽 seal。","rel":["γ_A","Z","F","seal","T (ticketed)"]},{"sym":"γ_A","term":"ticket accumulator","zh":"票券累積器","cat":"state","gpRef":"eq. 6.35","one":"本 epoch 收集到的 ticket，供下個 epoch 排序使用。","body":"γ′_A = 把新 ticket 與舊 accumulator 依 id 排序後取**最低**的 E 個（→^E）。epoch 換屆時歸零重收。提交的 ticket 必須全部留在 γ′_A 裡（否則 extrinsic 無效），且 id 不得與既有的重複。id 越小越好——這是「score」的意思。","rel":["γ_S","ticket","E (常數)","Y"]},{"sym":"δ","term":"service accounts","zh":"服務帳戶","cat":"state","gpRef":"eq. 9.1–9.3","one":"從 service index 到 service account 的字典，JAM 版的「所有帳戶」。","body":"δ ∈ D⟨N_S → A⟩。每個 account 有 storage、preimages、requests、gratis、code hash、balance、兩個最低 gas、created/lastacc/parent。沒有 nonce（沒有交易就沒有重放問題）。中間狀態：δ† accumulation 之後、δ‡ 更新 lastacc 之後、δ′ 整合 preimage 之後。","rel":["δ†","δ‡","service","a_t"]},{"sym":"η","term":"entropy pool","zh":"熵累積器","cat":"state","gpRef":"eq. 6.22–6.24","one":"四個 32-byte 的隨機值：η_0 每塊更新，η_1..3 是前三個 epoch 結束時的快照。","body":"η′_0 = H(η_0 ⌢ Y(H_V))——用 prior η_0 與 header VRF 的**輸出**。epoch 換屆時 (η′_1, η′_2, η′_3) = (η_0, η_1, η_2)。用途分工：提交 ticket 與 fallback、guarantor 分派用 η′_2；驗 seal 用 η′_3（就是晚一個 epoch 的同一個值）；`fetch` 給 accumulate 的是 η′_0。","rel":["H_V","seal","guarantor assignment"]},{"sym":"ι κ λ","term":"validator key sets","zh":"驗證者金鑰集合","cat":"state","gpRef":"eq. 6.7, 6.14","one":"ι 待命（staging）、κ 現行（active）、λ 上一個 epoch。","body":"epoch 換屆時 (γ′_P, κ′, λ′) = (Φ(ι), γ_P, κ)——所以 ι 要經過兩個 epoch 邊界才會成為 active（ι → γ_P → κ）。Φ 把 ψ′_O（posterior offenders）裡的 key 換成全零。ι 由具 delegator 權限的 service 透過 `designate` 設定。每個 key 是 336 octets：Bandersnatch 32 | Ed25519 32 | BLS 144 | metadata 128。","rel":["γ_P","Φ","designate","ψ_O"]},{"sym":"ρ","term":"availability assignments","zh":"可用性指派","cat":"state","gpRef":"eq. 11.1","one":"每個 core 目前掛著、等待 availability 的 guarantee 與它進鏈的 slot。","body":"ρ ∈ [(g ∈ 𝔾, t ∈ N_T)?]_C。0.8.0 起存的是**整個 guarantee**（含 2–3 個 guarantor 簽章），理由是要能直接向 guarantor 抓 bundle，以及在 dispute 時用這些簽章組出 culprits。中間狀態：ρ†（disputes 清掉 bad/wonky）→ ρ‡（assurances 讓它 available 或 timeout）→ ρ′（新 guarantee 進來，timestamp 記 τ′）。","rel":["ρ†","ρ‡","guarantee","U"]},{"sym":"τ","term":"timeslot","zh":"時槽","cat":"state","gpRef":"eq. 6.1","one":"最近一個區塊的 slot index；τ′ = H_T。","body":"存 τ 是為了能算出 epoch index 與 slot phase：e ⌢ m = τ / E，e′ ⌢ m′ = τ′ / E。很多規則都取決於「prior 的 m」還是「posterior 的 m′」——例如 γ_S 的第一種情況要求 m ≥ Y（prior），ticket extrinsic 的上限則看 m′ < Y。τ ≥ τ′ 直接是無效區塊。","rel":["epoch","H_T","Y"]},{"sym":"φ","term":"authorizer queue","zh":"授權佇列","cat":"state","gpRef":"eq. 8.1","one":"每個 core 固定 Q = 80 筆的 authorizer 佇列，每個 slot 補一筆進 pool。","body":"φ ∈ [[H]_Q]_C。只有該 core 的 assigner（χ_A[c]）能在 accumulate 裡用 `assign` 改它。補進 pool 的是 φ′[c][H_T mod Q]——注意用的是 **posterior** φ′，所以 pool 更新排在 accumulation 之後。（別跟 PVM 的暫存器 φ 搞混，那是另一個同形符號。）","rel":["α","assign","χ_A"]},{"sym":"χ","term":"privileges","zh":"特權服務","cat":"state","gpRef":"eq. 9.9–9.10","one":"五種特權：manager、delegator、registrar、每個 core 的 assigner、always-accumulate 集合。","body":"χ ≡ (χ_M, χ_V, χ_R, χ_A, χ_Z)。χ_M 可改整個 χ 並發放 gratis storage（0.8.0 起 `bless` 只有 manager 能呼叫）；χ_V 可設 ι；χ_R 可建立 index < S = 2^16 的保留 service；χ_A[c] 可改 φ[c]；χ_Z 是每塊都會被 accumulate 的 service 與其免費 gas。","rel":["bless","assign","designate","χ_Z"]},{"sym":"ψ","term":"disputes state","zh":"爭議狀態","cat":"state","gpRef":"eq. 10.1","one":"good / bad / wonky 三個 report hash 集合，加上 offenders 的 Ed25519 key 集合。","body":"ψ ≡ (ψ_G, ψ_B, ψ_W, ψ_O)。已經判過的 report hash 不能再被判一次（verdict 的 hash 必須與三個集合不相交）。ψ_O 只增不減，且在下次 key rotation 時讓 Φ 把對應的 validator key 清零；JAM 自己不做 slashing，只留紀錄給上層 staking 系統。","rel":["verdict","culprit","fault","Φ"]},{"sym":"π","term":"activity statistics","zh":"活動統計","cat":"state","gpRef":"eq. 13.1","one":"π_V 本 epoch、π_L 上一個 epoch 的 validator 統計，加上 per-core 與 per-service 的本塊統計。","body":"π ≡ (π_V, π_L, π_C, π_S)。validator 每人六個計數器：b 出塊、t 帶進的 ticket 數、p preimage 數、d preimage bytes（這四個都記在**作者**身上）、g guarantee（記在有簽名的 guarantor）、a assurance（記在簽 assurance 的人）。π_C/π_S 是 per-block 的，沒活動就不出現。JAM 只產生數據，獎勵計算交給上層。","rel":["G (reporters)","π_C","π_S"]},{"sym":"ω","term":"ready queue","zh":"待累積佇列","cat":"state","gpRef":"eq. 12.3","one":"已 available 但依賴未滿足、等著被 accumulate 的 report（長度 E 的環狀緩衝）。","body":"ω ∈ [[(ℝ, {H})]]_E，每格存 (report, 尚未滿足的 package hash 集合)。每塊從 ω[m..] ⌢ ω[..m] 依序取（m = H_T mod E，即最舊優先），能解鎖的用 Q 函數挑出來，跳過的 slot 清空，超過一個 epoch 沒解開就被覆蓋掉。0.7.x 的文獻寫成 ϑ，0.8.0 已改名為 ω。","rel":["ξ","R!","R*","Q 函數"]},{"sym":"ξ","term":"accumulation history","zh":"累積歷史","cat":"state","gpRef":"eq. 12.1","one":"最近一個 epoch 內已被 accumulate 的 work-package hash（每個 slot 一組集合）。","body":"ξ ∈ [{H}]_E。兩個用途：判斷 report 的 prerequisite 是否已滿足（依賴的 package 在 ξ 裡就算解鎖），以及擋掉重複的 package。每塊左移一格，最後一格放本塊剛 accumulate 的 package hash。","rel":["ω","prerequisite","R*"]},{"sym":"θ","term":"accumulation output log","zh":"累積輸出紀錄","cat":"state","gpRef":"eq. 7.4, 12.24","one":"本塊各 service 透過 `yield` 產出的 (service, hash) 序列。","body":"θ′ 由 Δ+ 的輸出 b 而來，只收「有 yield 32-byte hash」的 service。它會被 M_B（Keccak）算出一個 root，append 進 β_B 這條 MMR，其 super-peak 就是 BEEFY 簽的東西——也就是 service 對外部系統（bridge）承諾狀態的管道。","rel":["yield","β_B","BEEFY"]},{"sym":"B","term":"block","zh":"區塊","cat":"block","gpRef":"eq. 4.2","one":"B ≡ (H, E)：一個 header 加一份 extrinsic。","body":"JAM 是 transactionless 的：extrinsic 的五個部分全部由 validator 產生，沒有使用者簽名的交易。外部資料只能經由 work-package（in-core 的 refine）與 preimage 進入狀態。","rel":["H (header)","E (extrinsic)"]},{"sym":"E","term":"extrinsic","zh":"區塊外部資料","cat":"block","gpRef":"eq. 4.3","one":"E ≡ (E_T, E_D, E_P, E_A, E_G)：tickets、disputes、preimages、assurances、guarantees。","body":"E_T 出塊抽籤的票（m′ < Y 時最多 K = 16 張）；E_D 爭議（verdicts + culprits + faults，各最多 16）；E_P preimage（依 (service, blob) 排序且唯一）；E_A availability assurance（每個 validator 至多一筆，依 index 遞增）；E_G work-report guarantee（每個 core 至多一筆，依 core 排序）。","rel":["E_T","E_G","E_A","E_D","E_P"]},{"sym":"H","term":"header","zh":"區塊標頭","cat":"block","gpRef":"eq. 5.1","one":"十個欄位：H_P, H_R, H_X, H_T, H_E, H_W, H_O, H_I, H_V, H_S。","body":"parent hash、**prior** state root、extrinsic hash、timeslot、epoch marker、winning-tickets marker、offenders marker、作者 index、entropy VRF 簽章、seal。E_U(H) 是「不含 seal」的序列化，也就是 seal 簽的訊息。","rel":["H_R","H_S","H_V","E_U(H)"]},{"sym":"H_R","term":"prior state root","zh":"前態狀態根","cat":"block","gpRef":"§5","one":"header 帶的是**父區塊**的 posterior state root，不是自己的。","body":"GP 明說理由是「to facilitate the pipelining of block computation and in particular of Merklization」——出塊者不必先把新狀態 Merklize 完才能發布區塊。代價是 β 最新一筆的 state root 要留白、由下一塊補（β†），以及 Grandpa 投票必須另外帶上 posterior state root。","rel":["β†","Grandpa","pipelining"]},{"sym":"H_S / H_V","term":"seal / entropy VRF signature","zh":"封印與熵簽章","cat":"block","gpRef":"eq. 6.16–6.18","one":"兩個 Bandersnatch VRF 簽章：一個證明出塊權，一個產生熵。","body":"ticket 模式：Y(H_S) 必須等於該 slot 的 ticket id，context 是 X_T ⌢ η′_3 ++ i_e，訊息是 E_U(H)，並標記 T = 1。fallback 模式：γ_S[H_T mod E] 必須等於作者的 Bandersnatch key，context 改 X_F ⌢ η′_3，T = 0。兩種模式都要有 H_V：context X_E ⌢ Y(H_S)、訊息為空——訊息先被固定住，所以熵無法被出塊者操弄。","rel":["γ_S","η","T (ticketed)","Bandersnatch"]},{"sym":"H_X","term":"extrinsic hash","zh":"外部資料雜湊","cat":"block","gpRef":"eq. 5.4–5.7","one":"對五個 extrinsic 元件各自的承諾再取一次 hash。","body":"0.8.0 (#524) 改成：preimage 部分承諾 (E_4(service), H(data)) 對，guarantee 部分承諾 (H(report), E_4(slot), credential)。目的是「allow for the possibility of reports and preimages to individually have their inclusion proven」——不必附上整個 blob 就能證明某筆在區塊裡。","rel":["E_P","E_G","Merkle proof"]},{"sym":"H_E / H_W / H_O","term":"epoch / winning-tickets / offenders markers","zh":"三個標記","cat":"block","gpRef":"eq. 6.28–6.29, 10.19","one":"讓只同步 header 的節點也能追上 validator 與 ticket 的變化。","body":"H_E 只在 e′ > e 時出現，內容是 (η_0, η_1) 加上 γ′_P 每個 validator 的 (Bandersnatch, Ed25519) key。H_W 只在同一 epoch 內首次跨過 Y、且 accumulator 飽和時出現，內容是 Z(γ_A)。H_O 是本塊新增的 offender key（culprits 在前、faults 在後），可以是空序列。H_E 與 H_W 互斥。","rel":["γ_P","γ_A","Z","offenders"]},{"sym":"","term":"in-core vs on-chain","zh":"核內／鏈上","cat":"flow","gpRef":"§4.9.1","one":"in-core 只有被指派的少數 validator 執行；on-chain 是所有人都跑。","body":"in-core（refine）由該 core 的 guarantor 執行，靠 guaranteeing → assuring → auditing →（必要時）judging 這套 crypto-economic 遊戲取信，因此算力可隨網路規模成長（GP 估計約單機的 300 倍）；on-chain（accumulate）是「everybody does everything」，受單機能力限制。兩者由同一批 validator 執行，安全性相當，差別在「可擴展 vs 同步」。","rel":["refine","accumulate","ELVES"]},{"sym":"","term":"refine","zh":"精煉","cat":"flow","gpRef":"§4.9.2, eq. B.5","one":"service 的 in-core 進入點：無狀態、吃大量輸入、吐出小的 digest。","body":"Ψ_R 在 core 上執行，沒有一般的鏈上狀態可讀（只有 historical_lookup 能依 lookup-anchor 時點查 preimage），但可以建立 inner PVM、export segment 到 D³L。每個 work-item 一次 refine，gas 上限 G_R = 5×10^9。輸出（work result）與統計資料組成 work-digest。","rel":["accumulate","work-item","Ψ_R","historical_lookup"]},{"sym":"","term":"accumulate","zh":"累積","cat":"flow","gpRef":"§12, eq. B.9","one":"service 的 on-chain 進入點：有狀態、可轉帳、可建立 service。","body":"Ψ_A 以 PC = 5 為進入點，參數只有 (timeslot, service id, input 數)，實際的 operand 與 transfer 用 `fetch`(14/15) 讀。每個 report 的 accumulate gas 上限 G_A = 10^7、每塊總量 G_T = 3.5×10^9。0.7.1 起 on_transfer 併入 accumulate——轉帳以 input 的形式在下一輪送達收款方。","rel":["refine","Δ+","deferred transfer","yield"]},{"sym":"","term":"guarantor","zh":"保證人","cat":"flow","gpRef":"§11.3, §15","one":"被指派到某個 core、負責執行 refine 並簽署 work-report 的 validator。","body":"每個 active core 固定 3 個 guarantor，由 η′_2 對 [⌊i/3⌋] 做 Fisher–Yates shuffle、再依 rotation index ⌊(t mod E)/R⌋ 旋轉決定（R = 10 slots 換一次）。兩個簽章就足以把 report 送給出塊者。GP 建議「平均每個 slot 簽不超過兩份 report」，以免被出塊者當成 spam 忽略。","rel":["M (assignments)","rotation","guarantee","R (常數)"]},{"sym":"","term":"assurer","zh":"擔保人","cat":"flow","gpRef":"§11.2, §16","one":"宣告自己已持有某 core 的 erasure-coded shard 的 validator。","body":"每個 slot 發一份 assurance：bitfield 每個 core 一 bit，anchor 必須是 H_P，用 prior κ 的 Ed25519 key 對 X_A ⌢ H(E(H_P, bitfield)) 簽名。要打勾必須同時握有兩類 shard：report bundle 的（審計用，審完可丟）與所有 exported segment 的（保存 28 天）。超過 2/3·|κ| 打勾，report 才算 available。","rel":["assurance","erasure coding","D³L","R (available)"]},{"sym":"","term":"auditor","zh":"審計者","cat":"flow","gpRef":"§17","one":"每個 validator 都要對隨機抽到的 report 重跑一次並公開判決。","body":"初始 tranche：用 X_U ⌢ Y(H_V) 的 VRF 洗牌後取 10 個 core。之後每 8 秒（A）一個 tranche，遇到負面判決或 no-show（有人宣告卻沒交判決）就擴大，期望每個 no-show 多帶 F = 2 個審計者。審計要先把 bundle 從 1/3 的 validator 手上的 chunk 重建出來，再重跑 computereport 逐欄位比對。","rel":["ELVES","no-show","tranche","A","F"]},{"sym":"","term":"ELVES","zh":"ELVES 機制","cat":"flow","gpRef":"§17 & eprint 2024/961","one":"JAM 審計機制的理論基礎，源自 Polkadot 的 backing/approval/inclusion。","body":"論文用語與 JAM 的對照：backing = guaranteeing、approval = auditing、inclusion = accumulation。核心想法是「非冗餘分割 + 提案與審計賽局」——不需要所有人重算，只要作弊被抓到的機率夠高、代價夠大即可。安全性假設 ≥ 2/3+1 的 validator 誠實且在線。","rel":["auditor","guarantor","dispute"]},{"sym":"P","term":"work-package","zh":"工作包","cat":"data","gpRef":"eq. 14.2","one":"⟨j, h, u, f, c, w⟩：授權 token、授權服務、授權 code hash、config、refinement context、work-items。","body":"authorizer = H(u ⌢ f)。一個 package 最多 I = 16 個 work-item，整包（含 extrinsic 與 import）不得超過 W_B = 13,791,360 octets。package 由 builder 組裝、交給 guarantor；它本身不上鏈，上鏈的是它的 work-report。","rel":["work-item","authorizer","work-report","W_B"]},{"sym":"","term":"work-item","zh":"工作項","cat":"data","gpRef":"eq. 14.3","one":"package 內的一個工作單位：指定 service、code hash、payload、兩個 gas 上限、imports、extrinsics、export 數。","body":"每個 item 對應一次 refine 與（之後）一筆 work-digest。imports 以 (segment root 或 package hash, index) 指定要從 D³L 匯入的 segment；extrinsics 以 (hash, length) 指定隨包附帶的資料。宣告的 export 數若與實際 export 不符，結果會被換成 BADEXPORTS。","rel":["work-package","work-digest","segment","refine"]},{"sym":"ℝ","term":"work-report","zh":"工作報告","cat":"data","gpRef":"eq. 11.2","one":"(s, c, c, a, t, l, d, g)：avspec、refinement context、core、authorizer、auth trace、segment-root lookup、digests、auth gas。","body":"這是 in-core 計算「上鏈」的形式：不含原始資料，只含承諾與結果。變動大小（auth trace + 所有成功輸出）受 W_R = 48 KiB 限制；digest 數 1..16；|segment-root lookup| + |prerequisites| ≤ J = 8。report 的 hash H(E(w)) 是 dispute 與 ρ 清除時的識別碼。","rel":["work-digest","avspec","refinement context","W_R"]},{"sym":"𝔻","term":"work-digest","zh":"工作摘要","cat":"data","gpRef":"eq. 11.6","one":"一個 work-item 的 refine 結果加上資源使用量。","body":"欄位：service、code hash（必須與鏈上 δ[s]_c 相符）、payload hash、accumulate gas 上限、結果（blob 或錯誤）、實際用掉的 refine gas、import 數、extrinsic 數與大小、export 數。accumulate 時它會被轉成 operand tuple 餵給 service。","rel":["work-report","operand tuple","𝔼"]},{"sym":"𝔼","term":"work error set","zh":"工作錯誤集合","cat":"data","gpRef":"eq. 11.7","one":"{∞ OOG, ☇ panic, BADEXPORTS, OVERSIZE, BAD, BIG}。","body":"∞ gas 用盡、☇ 非預期終止、BADEXPORTS 宣告的 export 數不符、OVERSIZE 輸出會撐破 report 的大小上限、BAD 在 lookup-anchor 的狀態下找不到 service code、BIG code 超過 W_C = 4,000,000。錯誤仍然會被 accumulate（operand 的結果就是錯誤值），只是沒有輸出 blob。注意 0.8.0 的 𝕁 是 segment 的集合，不是錯誤集合。","rel":["work-digest","𝕁","W_C"]},{"sym":"𝕐","term":"availability specification","zh":"可用性規格","cat":"data","gpRef":"eq. 11.5","one":"(p, l, u, v, e, n)：package hash、bundle 長度、erasure root、shard 數、segment root、segment 數。","body":"u 是對所有 erasure chunk 的 Merkle root（審計與重建的依據）；v 必須等於 |κ′|，因為每個 assurer 拿一個 chunk；e 是對 exported segment 做的 constant-depth Merkle root，供之後的 package import 時驗證。容易記反的是 v（shards）與 n（segments）。","rel":["erasure coding","segment","assurer"]},{"sym":"ℂ","term":"refinement context","zh":"精煉語境","cat":"data","gpRef":"eq. 11.4","one":"(a, n, s, b, l, t, r, p)：anchor 四件組、lookup-anchor 三件組、prerequisites。","body":"anchor（hash、slot、posterior state root、accumulation-output super-peak）必須對上 β† 的某一筆，也就是最多 8 塊以內；lookup-anchor（hash、slot、posterior state root）必須在最近 L = 14,400 slots 的 ancestor 裡找得到——這是少數無法只靠鏈上狀態驗證、必須保留 header 鏈的檢查。prerequisites 是本 report 依賴的 package hash。","rel":["anchor","lookup anchor","β†","ancestors"]},{"sym":"","term":"authorizer / token / trace","zh":"授權者／憑證／軌跡","cat":"data","gpRef":"§8.1","one":"authorizer 是判斷「這個 package 能不能用這個 core」的邏輯；token 是隨包附上的憑證；trace 是授權成功的輸出。","body":"authorizer 的身分是 H(auth code hash ⌢ config)。它在 in-core 執行（Ψ_I，gas 上限 G_I = 5×10^7），鏈上只檢查 authorizer hash 有沒有在該 core 的 pool 裡。這個設計把「誰買了 coretime」與「誰提交工作」拆開，因此同時支援 Ethereum 式與 Polkadot 式的使用模式。","rel":["α","coretime","Ψ_I"]},{"sym":"𝕁","term":"segment","zh":"分段","cat":"data","gpRef":"eq. 14.1, §14.4","one":"D³L 的固定大小資料單位，W_G = 4,104 octets。","body":"refine 用 `export` 產生 segment、用 import 取回別的 package 之前 export 的 segment。每個 package 最多 3,072 個 import 與 3,072 個 export。segment 在 Audit DA 的額外足跡是 W_F = W_G + 32·⌈log₂ W_X⌉ = 4,488（多出來的是 justification 路徑）。segment 保存 28 天。","rel":["D³L","export","W_G","W_F"]},{"sym":"","term":"D³L / DA","zh":"資料可用性層","cat":"data","gpRef":"§16, §17.2","one":"兩套資料可用性：audit DA（bundle，短期）與 import DA（segment，28 天）。","body":"audit DA 讓審計者能重建 work-package bundle 重跑計算，審計完成即可丟棄；import DA（也就是 D³L，Distributed Data Lake）保存 exported segment 28 天，讓後續的 work-package 能 import 前人算出的資料，而不必重新塞進可用性系統——這是 JAM 相對於單純 rollup DA 的特色。","rel":["segment","assurer","erasure coding"]},{"sym":"𝔾","term":"guarantee","zh":"保證","cat":"data","gpRef":"eq. 11.24–11.28","one":"(work-report, slot, 2–3 個 (validator index, Ed25519 簽章))。","body":"簽的是 X_G ⌢ H(E(report))。簽署者必須在該 slot 被指派到該 core：t 落在本 rotation 就用 M，落在前一個 rotation 就用 M*；視窗是 R·(⌊τ′/R⌋ − 1) ≤ t ≤ τ′。core 必須是 active（index < |κ′|/3），即使前一個 rotation 時它是 active 也一樣。credential 依 validator index 排序且唯一。","rel":["guarantor","M","rotation","reporters"]},{"sym":"","term":"assurance","zh":"可用性擔保","cat":"data","gpRef":"eq. 11.11–11.16","one":"(anchor, bitfield, validator index, Ed25519 簽章)。","body":"anchor 必須等於 H_P；bitfield 長度 C bits（full 是 43 bytes，LSB-first 打包）；只能對 ρ†[c] ≠ ∅ 的 core 打勾；整份 extrinsic 依 validator index 嚴格遞增。計票是**逐塊**的：狀態裡沒有跨塊累計器，所以必須某一塊單獨湊到 > 2/3·|κ|。","rel":["assurer","R (available)","ρ‡"]},{"sym":"","term":"verdict / culprit / fault","zh":"判決／共犯／過失","cat":"data","gpRef":"eq. 10.2–10.13","one":"verdict 是一組判決票；culprit 是保證過壞 report 的人；fault 是投了與 verdict 相反票的人。","body":"每個 verdict 恰好帶 ⌊2|k|/3⌋+1 張票（tiny 5、full 683），正票數只能是這個數（good）、0（bad）或 ⌊|k|/3⌋（wonky），其餘任何組合都讓區塊無效。verdict 的 epoch index 決定用 κ 還是 λ 驗簽。0.8.0 加了每份 extrinsic 最多 16 verdicts / 16 culprits / 16 faults，並取消了「bad verdict 必須附 ≥ 2 個 culprit」。","rel":["ψ","ρ†","offenders"]},{"sym":"𝕏","term":"deferred transfer","zh":"延遲轉帳","cat":"data","gpRef":"eq. 12.14","one":"(sender, dest, amount, 128-byte memo, gas)。","body":"`transfer` 呼叫當下就從發送方扣款（並檢查扣完仍高於自身 threshold，否則 CASH），但接收方要到 Δ+ 的**下一輪**才會以 input 形式收到並入帳。gas 欄位是預付給接收方處理這筆轉帳的量，必須 ≥ 接收方的 a_m（否則 LOW）。轉給已被刪除的 service 會被丟棄。","rel":["accumulate","transfer","Δ+"]},{"sym":"𝕌","term":"operand tuple","zh":"運算元組","cat":"data","gpRef":"eq. 12.13","one":"accumulate 看到的每個 work-digest：(package hash, segment root, authorizer, payload hash, gas limit, auth trace, result)。","body":"accumulate 不會拿到整個 work-report，而是這種抽出重點的元組；它們與收到的 deferred transfer 一起，透過 `fetch`(14/15) 讀入。同一個 service 在同一輪的所有 digest 會合併成一次 PVM 呼叫，以攤銷啟動成本。","rel":["accumulate","work-digest","fetch"]},{"sym":"R","term":"newly available reports","zh":"新可用報告","cat":"flow","gpRef":"eq. 11.17","one":"本區塊因 assurance 達標而變成 available 的 report 序列。","body":"R ≡ [ρ†[c] 的 report | Σ_a a_f[c] > 2/3·|κ|]。它接著被拆成 R!（沒有依賴、立刻累積）與 R^Q（有依賴、進 ω 排隊），合起來經 Q 函數得到本塊真正要 accumulate 的序列 R*。0.7.x 文獻寫作 W。注意別跟常數 R（rotation period = 10）或 rotation 函數 R(c, n) 搞混。","rel":["ω","ξ","R*","assurance"]},{"sym":"G","term":"reporters","zh":"報告者集合","cat":"flow","gpRef":"eq. 11.28","one":"本塊 guarantee credential 裡出現過簽章的 validator 的 Ed25519 key 集合。","body":"唯一用途是統計：π 的 g 計數器對每個 κ′[v] ∈ G 的 validator +1。0.7.x 文獻把它寫成 R，容易與「新可用報告 R」混淆——0.8.0 改成 G。","rel":["π","guarantee","R (available)"]},{"sym":"PVM","term":"Polkadot Virtual Machine","zh":"Polkadot 虛擬機","cat":"pvm","gpRef":"§4.7, 附錄 A","one":"以 RISC-V RV64EM 為基礎的暫存器機：13 個 64-bit 暫存器、4 KiB 分頁、32-bit 定址。","body":"選 RISC-V 的理由：可高效重編譯到 x86-64/ARM、有 LLVM 工具鏈、指令語意確定（沒有浮點等非決定性行為）、易於計量，且能自然支援暫停／續跑（CorePlay 需要）。相較 EVM 少了密碼學指令與環境互動指令——那些都走 host call。","rel":["φ","host call","Ψ","gas"]},{"sym":"φ","term":"registers","zh":"暫存器","cat":"pvm","gpRef":"eq. A.47","one":"13 個 64-bit 暫存器 φ_0..φ_12。","body":"標準初始化：φ_0 = 2^32 − 2^16（return address；dynamic jump 到這裡就是 halt）、φ_1 = stack pointer、φ_7 = 參數位址、φ_8 = 參數長度，其餘為 0。host call 也用 φ_7 起算的暫存器傳參數與回傳值。（0.7.x 的文獻用 ω 表示暫存器，0.8.0 已改為 φ——ω 現在是 ready queue。）","rel":["PVM","host call","standard init"]},{"sym":"ϱ","term":"gas counter","zh":"gas 計數器","cat":"pvm","gpRef":"§A.5, eq. A.54","one":"以 basic block 為單位、事先扣除的計量單位。","body":"0.8.0 起：進入一個 basic block（或跳回它的開頭）時，先把整個 block 的成本扣掉；不夠就以 ∞（out-of-gas）中止且**不扣款**。成本 ϱ^Δ = max(cycles − 3, 1)，cycles 來自一個模擬的亂序 CPU（32 條目 reorder buffer、每 cycle 4 decode / 5 start、ALU/LOAD/STORE/MUL/DIV 單元，記憶體延遲 𝔪 = 25）。0.7.x 是「每條指令 1 gas」。","rel":["basic block","∞","gas model"]},{"sym":"μ","term":"memory","zh":"記憶體","cat":"pvm","gpRef":"eq. 4.24, A.9–A.10","one":"2^32 個 octet，分成 Z_P = 4,096 octet 的頁，每頁可為 R、W 或不可存取。","body":"低於 2^16 的位址一律直接 panic（null pointer 保護），其他不可存取的位址則產生 page fault，回報**最低**那個不可存取的頁位址（可以補頁後續跑）。標準初始化把 RO data 放在 Z_Z = 2^16、RW/heap 在 2Z_Z + Z(|o|)、stack 與參數放在高位址，每段之間留一個 64 KiB 的 guard zone。","rel":["Z_P","Z_Z","page fault","standard init"]},{"sym":"ε","term":"exit reason","zh":"結束原因","cat":"pvm","gpRef":"eq. A.1","one":"∎ halt、☇ panic、∞ out-of-gas、page fault × 位址、host call × id。","body":"halt 與 panic 是最終狀態（回傳的 instruction counter 為 0）；其餘三種都可以「續跑」：補記憶體、補 gas、或執行 host call 後把 PC 前進 1 + skip。這個設計讓 refine 能建立 inner PVM 並代理它的 host call（CorePlay 的 pause/resume 也是靠它）。","rel":["PVM","host call","page fault"]},{"sym":"ϖ","term":"basic blocks","zh":"基本區塊","cat":"pvm","gpRef":"§A.3","one":"以 terminator 指令切分的程式片段，是 gas 計費與跳躍目標的單位。","body":"terminator 包含 trap、fallthrough、jump、jump_ind、load_imm_jump(_ind) 與所有 branch_*。任何靜態跳躍、動態跳躍與 branch 的目標（包含 branch 不成立時的下一條）都必須是 basic block 的開頭，否則 panic。0.8.0 的 deblob 還要求程式最後一個 block 必須以 terminator 收尾。","rel":["ϱ","djump","deblob"]},{"sym":"Ψ","term":"PVM invocation functions","zh":"PVM 呼叫函數","cat":"pvm","gpRef":"eq. A.1, A.38, B.1/B.5/B.9","one":"Ψ 單純執行、Ψ_H 代理 host call、Ψ_M 帶參數與回傳、Ψ_I/Ψ_R/Ψ_A 是三種協定用途。","body":"Ψ_I is-authorized（無狀態，只有 gas/grow_heap/fetch）；Ψ_R refine（多了 historical_lookup、export 與 inner PVM 那一組）；Ψ_A accumulate（多了 read/write/lookup/info 與所有會改狀態的 host call）。三者都以 Ψ_M 包裝，差別在 entry point 與 host-call 分派函數。","rel":["host call","refine","accumulate"]},{"sym":"","term":"host call","zh":"宿主呼叫","cat":"pvm","gpRef":"附錄 B","one":"PVM 透過 `ecalli` 呼叫外界的介面，0.8.0 編號 0–27。","body":"gas 0、grow_heap 1、fetch 2、lookup 3、read 4、write 5、info 6、historical_lookup 7、export 8、machine 9、peek 10、poke 11、pages 12、invoke 13、expunge 14、bless 15、assign 16、designate 17、checkpoint 18、new 19、upgrade 20、transfer 21、eject 22、query 23、solicit 24、forget 25、yield 26、provide 27；JIP-1 另定義 log = 100。未知編號扣 M_∅ = 1000 gas 並回傳 WHAT。0.8.0 因為插入 grow_heap，整組編號比 0.7.2 位移了一格。","rel":["Ψ","WHAT","gas cost"]},{"sym":"","term":"host-call result codes","zh":"宿主呼叫回傳碼","cat":"pvm","gpRef":"§B.1","one":"OK = 0；錯誤碼從 2^64−1 往下數。","body":"NONE 2^64−1（項目不存在）、WHAT −2（名稱未知）、OOB −3（inner PVM 記憶體不可存取）、WHO −4（index 未知）、FULL −5（空間不足或已配置）、CORE −6、CASH −7（餘額不足）、LOW −8（gas 太低）、HUH −9（操作不合法或權限不足）。inner PVM 另有 HALT 0 / PANIC 1 / FAULT 2 / HOST 3 / OOG 4。常見混淆：WHO 是「找不到」，HUH 是「不能這樣做」。","rel":["host call","WHO","HUH"]},{"sym":"","term":"fetch","zh":"fetch 宿主呼叫","cat":"pvm","gpRef":"§B.5 (index 2)","one":"三種 invocation 共用的萬用讀取介面，用 φ_10 選資料。","body":"selector 0 是協定常數的編碼（JIP-4 chainspec 的 protocol_parameters 用同一格式）、1 是 η′_0、2 auth trace、3–6 extrinsic 與 import segment、7–13 package/config/token/context/item 摘要/payload、14–15 accumulate 的 inputs。共通模式是「把資料的 [offset, offset+length) 寫進記憶體、回傳資料的完整長度」，不可用時回 NONE。","rel":["host call","accumulate","refine"]},{"sym":"","term":"checkpoint / yield","zh":"checkpoint 與 yield","cat":"pvm","gpRef":"§B.7 (18, 26)","one":"checkpoint 存檔（panic/OOG 時採用），yield 提交 32-byte 的 accumulation 輸出。","body":"accumulate 的 context 是一對 (x, y)：x 是正常維度、y 是例外維度，只有 `checkpoint` 會把 x 複製進 y。若程式以 ☇ 或 ∞ 結束，collapse 函數採用 y——也就是最後一次 checkpoint 的狀態；正常結束才用 x。yield 寫下的 hash 會進 θ、再進 β_B 的 MMR，最後被 BEEFY 簽名。","rel":["accumulate","θ","BEEFY"]},{"sym":"H","term":"Blake2b","zh":"Blake2b 雜湊","cat":"crypto","gpRef":"§3.8","one":"GP 的預設雜湊函數，輸出 32 octets。","body":"state trie、extrinsic hash、report hash、entropy、state key 等絕大多數地方都用 H。例外是 accumulation-output belt 與 BEEFY 相關的 H_K（Keccak）——那是為了讓 EVM 這類「legacy systems」能便宜地驗證。","rel":["H_K","state trie","BEEFY"]},{"sym":"H_K","term":"Keccak","zh":"Keccak 雜湊","cat":"crypto","gpRef":"§7, §18","one":"只用在 accumulation output 的 Merkle root、MMR 與 BEEFY 承諾。","body":"GP 原文：「Throughout, the Keccak hash function is used to maximize compatibility with legacy systems」。實務意義：橋接合約可以用 EVM 便宜的 keccak256 precompile 驗證 JAM 的 accumulation output 證明。","rel":["H","β_B","BEEFY"]},{"sym":"","term":"Bandersnatch VRF","zh":"Bandersnatch VRF","cat":"crypto","gpRef":"附錄 G","one":"建構在 BLS12-381 純量域上的曲線，JAM 用它做 seal、entropy 與 ring proof。","body":"兩種用法：(1) 一般（IETF 式）VRF——seal H_S、entropy H_V、審計選擇 s_n 都是；(2) ring VRF——提交 ticket 時證明「我是 γ_Z 這個 ring 裡的某個人」而不揭露身分。VRF 的輸出 Y(·) 只取決於 context 與訊息，這是 ticket id 與 entropy 的來源。","rel":["ticket","seal","γ_Z","ring root"]},{"sym":"","term":"signing contexts","zh":"簽章語境字串","cat":"crypto","gpRef":"附錄 I","one":"每種簽章都有專屬前綴，避免跨用途重放。","body":"$jam_ticket_seal（X_T）、$jam_fallback_seal（X_F）、$jam_entropy（X_E）、$jam_available（X_A）、$jam_guarantee（X_G）、$jam_valid / $jam_invalid（判決）、$jam_audit（X_U）、$jam_announce、$jam_beefy。面試常考「這個簽章的 context 與訊息各是什麼」——例如 seal 的訊息是 E_U(H)，而 H_V 的訊息是空序列。","rel":["seal","assurance","guarantee","BEEFY"]},{"sym":"E","term":"codec","zh":"編碼函數","cat":"codec","gpRef":"附錄 C","one":"JAM 自己的序列化：緊湊自然數 + 固定寬度整數 + 長度前綴序列。","body":"E(0) = [0]；小於 128 的數是單一 byte；再大就用「前綴的高位放幾個 1 表示後面還有幾個 byte」的形式；≥ 2^56 用 0xFF + 8 bytes LE。↕x 表示需要長度前綴的變長項；x? 是 0 或 1 ⌢ x；dictionary 依 key 排序；bit sequence 以 LSB-first 打包。注意這與 SCALE 的 compact 不同（SCALE 用最低兩個 bit 當模式）。","rel":["E_l","state serialization","SCALE"]},{"sym":"E_l","term":"fixed-length encoding","zh":"固定長度編碼","cat":"codec","gpRef":"附錄 C, D","one":"E_2/E_4/E_8：little-endian 的定寬整數。","body":"狀態序列化裡「所有非 discriminator 的數值都用定寬」（附錄 D 的註）。區塊／extrinsic 則逐結構定義：timeslot E_4、**所有 validator index 都是 E_2**、service index E_4、gas E_8、長度前綴才用緊湊 E。","rel":["E","state serialization"]},{"sym":"C(i)","term":"state key constructor","zh":"狀態鍵建構子","cat":"codec","gpRef":"§D.1","one":"把狀態元件或 service 資料對應到 31-octet 的 trie key。","body":"三種形式：C(i) = [i, 0, …]（第 i 章的單一元件，1 α、2 φ、3 β、4 γ、5 ψ、6 η、7 ι、8 κ、9 λ、10 ρ、11 τ、12 χ、13 π、14 ω、15 ξ、16 θ）；C(i, s) 把 service id 的 4 個 byte 與 0 交錯（C(255, s) 是 account info）；C(s, h) 把 service id 與 H(h) 的前 4 byte 交錯、再接 hash 的第 4..26 byte。storage/preimage/request 分別用 E_4(2^32−1)、E_4(2^32−2)、E_4(length) 當前綴避免碰撞。","rel":["state trie","δ","E_4"]},{"sym":"","term":"state trie","zh":"狀態樹","cat":"codec","gpRef":"§D.2","one":"binary Patricia Merkle trie，節點固定 512 bits。","body":"第一個 bit 區分 branch 與 leaf。branch = 0 + 左子 hash 的後 255 bits + 右子完整 256 bits。leaf 有兩種：值 ≤ 32 octets 直接內嵌（前兩 bit 10 + 6-bit 長度 + 31-byte key + 補零的值），否則存 H(value)（前 8 bits 11000000）。空子樹是零 hash。設計目標是「optimized for modern compute hardware」——固定大小、少分支。","rel":["C(i)","H","H_R"]},{"sym":"","term":"Merkle functions","zh":"Merkle 函數群","cat":"codec","gpRef":"附錄 E","one":"N 節點函數、M_B 一般根、M 定深根、MMR append 與 super-peak。","body":"N 在 ⌈n/2⌉ 處切開，雜湊 $node ⌢ 左 ⌢ 右（well-balanced）。M_B 直接把原始 blob 當 leaf（刻意不逐項雜湊），用於 extrinsic hash 與每塊的 accumulation output root。M 是定深版：先把每個 leaf 雜湊成 $leaf ⌢ v、再補零 hash 到 2 的冪——segment root 與 paged proof 用它。MMR 的 append 像二進位加法進位，super-peak 用 $peak 前綴由左往右摺疊。","rel":["MMR","segment root","β_B"]},{"sym":"","term":"erasure coding","zh":"抹除碼","cat":"crypto","gpRef":"附錄 H","one":"GF(2^16) 上的 systematic Reed–Solomon，任意 d(v) 個 chunk 即可還原。","body":"d(v) = max{d ≤ v/3 + 1 : W_G mod 2d = 0}；v = 1023 → 342、v = 6 → 3。也就是「即使將近三分之二的 validator 惡意或離線也能重建」。systematic 的好處是前 d 個 chunk 就是原始資料，直接串接即可。每個 validator 每個 segment 拿到的是 12 octets（full 配置）。","rel":["assurer","D³L","avspec"]},{"sym":"","term":"Fisher–Yates shuffle","zh":"洗牌函數","cat":"crypto","gpRef":"附錄 F","one":"以 32-byte 熵驅動的確定性洗牌，用於 guarantor 分派與審計選擇。","body":"用 Q_l(h)[i] = decode_4(H(h ⌢ E_4(⌊i/8⌋))[4(i mod 8) …]) 產生亂數序列——一次雜湊供應 8 個 32-bit 數。取 r[i] mod 剩餘長度、輸出該元素、再把最後一個元素搬進空位。確定性是關鍵：所有節點必須算出同一個分派。","rel":["guarantor","M (assignments)","auditor"]},{"sym":"C = 341","term":"core count","zh":"核心數","cat":"const","gpRef":"附錄 I","one":"總 core 數固定 341，但只有前 |κ′|/3 個是 active。","body":"每個 active core 需要 3 個 guarantor，所以 full 配置 |κ| = 1023 = 3·341 時全部 341 個 core 都 active。0.8.0 允許較小的 validator 集合（6 到 1023 的 3 的倍數），此時 active core 數等比例縮小，超出範圍的 core 永遠是 ∅。","rel":["𝕍","guarantor","active core"]},{"sym":"E = 600 / P = 6","term":"epoch length / slot period","zh":"epoch 長度／時槽長度","cat":"const","gpRef":"§4.8","one":"每個 slot 6 秒、每個 epoch 600 slots（正好一小時）。","body":"timeslot index 是自 JAM Common Era（2025-01-01 12:00 UTC，Unix 1,735,732,800）起算的 6 秒週期數，型別 N_2^32（可用到西元 2840 年）。中午 UTC 的選擇是為了讓「距起點 24 小時整數倍」的時刻在所有主要時區都是同一天。","rel":["τ","Y","JAM Common Era"]},{"sym":"Y = 500","term":"epoch tail start","zh":"票券截止點","cat":"const","gpRef":"§6.7","one":"epoch 的第 500 個 slot 之後不再接受 ticket。","body":"m′ < Y 時每塊最多 K = 16 張 ticket，之後 E_T 必須是空的。這段「尾巴」讓下個 epoch 的 slot-sealer 序列有時間定案：只有在 prior 區塊的 m ≥ Y 且 accumulator 飽和時，下個 epoch 才會使用 ticket，否則走 fallback。","rel":["γ_S","γ_A","K","fallback"]},{"sym":"R = 10","term":"rotation period","zh":"輪替週期","cat":"const","gpRef":"§11.3","one":"guarantor 與 core 的對應每 10 個 slot 換一次。","body":"rotation index = ⌊(t mod E)/R⌋，每個 epoch 有 60 次輪替。guarantee 的 slot 可以落在本 rotation 或前一個 rotation（視窗 R·(⌊τ′/R⌋−1) ≤ t ≤ τ′）；若前一個 rotation 屬於前一個 epoch，驗證要改用 λ′ 與 η′_3。輪替是為了限制惡意 guarantor 能持續盯上同一個 core 的時間。","rel":["M","M*","guarantee"]},{"sym":"H = 8 / L = 14,400","term":"recent history / lookup anchorage","zh":"近期歷史長度／查找錨點上限","cat":"const","gpRef":"§7, eq. 11.37","one":"anchor 最多回溯 8 個區塊；lookup anchor 最多回溯 14,400 slots（24 小時）。","body":"兩者的驗證方式不同：anchor 對照鏈上的 β†（狀態內），lookup anchor 必須對照保存的 header 鏈（ancestors A）——這是少數無法只靠狀態驗證的規則，也是 conformance fuzzer 把 Ancestry 列為 M1 必要功能的原因。D = L + 4,800 = 19,200 是 preimage 可被真正刪除前的等待期。","rel":["β†","ancestors","D"]},{"sym":"U = 5","term":"assurance timeout","zh":"擔保逾時","cat":"const","gpRef":"eq. 11.18","one":"report 進鏈後 5 個 slot 內沒湊到 2/3 擔保就被清掉。","body":"條件是 H_T ≥ t + U，t 是 report **進鏈**的 slot（τ′），不是 guarantee 自己帶的 slot。0.8.0 另外規定 |κ| ≠ |κ′|（validator 集合大小改變）時所有 pending 一併清空——因為 shard 數與 assurer 集合都對不上了。被清掉的 report 不會被 accumulate，就這樣消失。","rel":["ρ‡","assurance","R (available)"]},{"sym":"G_A / G_R / G_T / G_I","term":"gas limits","zh":"gas 上限","cat":"const","gpRef":"附錄 I","one":"每份 report 的 accumulate 10^7、每個 package 的 refine 5×10^9、每塊 accumulate 總量 3.5×10^9、is-authorized 5×10^7。","body":"這組數字反映 in-core 與 on-chain 的不對稱：refine 的預算是 accumulate 的 500 倍，因為只有 3 個 validator 執行；accumulate 是所有人都跑，所以整塊只有 G_T。Δ+ 的實際預算 g = max(G_T, G_A·C + Σ χ_Z 的 gas)。","rel":["refine","accumulate","Δ+"]},{"sym":"W_G / W_B / W_R / W_C","term":"size limits","zh":"大小上限","cat":"const","gpRef":"附錄 I","one":"segment 4,104；package bundle 13,791,360；report 變動內容 48 KiB；service code 4,000,000。","body":"W_B = W_M·W_F + 4,096 + 64 + 64，其中 W_F = W_G + 32·⌈log₂ W_X⌉ = 4,488 是一個 import segment 在 Audit DA 的足跡。W_R 限制的是 auth trace 加上所有成功輸出的總和——這是為了「fair use of a block's extrinsic space」。W_A = 64,000 是 authorizer code 的上限。","rel":["segment","work-package","work-report"]},{"sym":"B_S / B_I / B_L","term":"deposit constants","zh":"押金常數","cat":"const","gpRef":"eq. 9.8","one":"100 / 10 / 1：service 的基本、每項、每 octet 押金。","body":"threshold balance a_t = max(0, B_S + B_I·a_i + B_L·a_o − a_f)。a_i = 2·|requests| + |storage|（一筆 preimage request 算兩項），a_o 每筆 request 算 81 + 宣告長度、每筆 storage 算 34 + key + value。餘額低於 a_t 時 write/solicit/transfer 會回 FULL 或 CASH——這是防止狀態膨脹的機制。","rel":["a_t","service","FULL"]},{"sym":"𝕍","term":"validator count set","zh":"合法驗證者數","cat":"const","gpRef":"eq. 6.8","one":"𝕍 ≡ {3c | c ∈ N_[2, C+1]}：6 到 1023 之間 3 的倍數。","body":"0.8.0 (#514) 把 V 從協定常數改成這個集合——validator 數可以變，所有門檻改成對 |κ| 取值：super-majority ⌊2|κ|/3⌋+1、每人票數 n = ⌈2E/|γ′_P|⌉、erasure shard 數 = |κ′|、active core 數 = |κ′|/3。這是 0.7.2 → 0.8.0 影響面最廣的變更之一。","rel":["κ","C","super-majority"]},{"sym":"","term":"tiny vs full","zh":"tiny 與 full 配置","cat":"const","gpRef":"w3f/jamtestvectors","one":"測試向量用的縮小參數：6 個 validator、2 個 core、epoch 12 slots。","body":"tiny：V 6、C 2、E 12、Y 10、R 4、D 32、每人 ticket 數 ⌈2·12/6⌉ = 4（0.7.x 是常數 3）、super-majority 5、verdict 門檻 5/0/2、Bandersnatch ring 大小 6、erasure d(6) = 3。full：V 1023、C 341、E 600、Y 500、R 10、D 19,200、ticket 2、super-majority 683、verdict 683/0/341、d(1023) = 342。其餘常數與 GP 相同。","rel":["𝕍","test vectors","conformance"]},{"sym":"","term":"Safrole","zh":"Safrole 出塊機制","cat":"offchain","gpRef":"§6","one":"Sassafras 的簡化版：用 ring VRF 匿名決定每個 slot 唯一的出塊者。","body":"每個 slot 恰好一個預先決定的持票人，因此幾乎不會分叉；未來 slot 的持有者身分匿名（抗針對性 DoS）；副產品是高品質的熵池。相對於 BABE 的抽籤（可能零個或多個 leader），Safrole 在前一個 epoch 就把整個序列定案。抽籤失敗時退回 fallback key 序列，best-chain 規則會偏好 ticket 出塊較多的鏈。","rel":["γ_S","ticket","fallback","best chain"]},{"sym":"","term":"Grandpa / finality","zh":"Grandpa 與最終性","cat":"offchain","gpRef":"§19","one":"決定哪條鏈被最終確定；投票內容包含 posterior state root。","body":"best block 必須：以最新 finalized block 為祖先、已被審計（isaudited）、未 finalized 的祖先中沒有 equivocation（同一 slot 兩個有效區塊）。符合條件者中選 ticket-sealed 祖先最多的那條。投票帶上 posterior state root，是為了彌補 header 只有 prior root——同一個 header 但不同 posterior root 的票會被視為不同區塊。","rel":["best chain","H_R","BEEFY","isaudited"]},{"sym":"","term":"BEEFY","zh":"BEEFY 橋接簽章","cat":"offchain","gpRef":"§18","one":"對每個 finalized 區塊的 accumulation-output MMR super-peak 做 BLS 簽章。","body":"C_v ≡ BLS_{κ′[v]_l}(X_B ⌢ last(β_H) 的 super-peak)，X_B = $jam_beefy。BLS 可聚合，因此能給外部系統（bridge）一份簡短的最終性證明。這條路徑全程用 Keccak，方便 EVM 驗證。","rel":["θ","β_B","H_K"]},{"sym":"","term":"coretime","zh":"核心時間","cat":"offchain","gpRef":"§4.9.2","one":"JAM 取代 gas 購買模型的資源：預先購買、指派給 authorizer。","body":"GP 明說 coretime 的購買機制不在本文範圍，預期由某個 system parachain（在 parachains service 裡）處理。它與 authorizer 搭配，把「誰付錢買了算力」與「誰提交具體工作」拆開——這也是為什麼 JAM 不需要交易簽章與 nonce。","rel":["authorizer","α","service"]},{"sym":"","term":"service","zh":"服務","cat":"offchain","gpRef":"§4.9.2, §9","one":"JAM 唯一的帳戶型態：程式碼 + 餘額 + 狀態，permissionless 建立。","body":"取代 Ethereum 的 contract/EOA 二分法。兩個進入點：refine（in-core）與 accumulate（on-chain）。CoreChains（把 Polkadot parachain 搬上 JAM）、CorePlay（用 PVM 的暫停／續跑做同步感的 actor 合約）都只是 service——JAM 本身沒有 parachain 概念，升級責任下放到 service 層。","rel":["δ","refine","accumulate","CoreChains"]},{"sym":"","term":"JAM Prize / M1","zh":"JAM Prize 與 M1","cat":"eco","gpRef":"jam.web3.foundation","one":"W3F 的實作獎金；M1（IMPORTER）要求通過狀態轉換一致性測試並能匯入區塊。","body":"規則 12：提交後可能被要求面試，用來確認「團隊成員確實是程式碼的作者」，且對 Gray Paper 與自己的實作都有明確的專業能力——「INABILITY TO PROVE THIS EXPERTISE MAY RESULT IN A REDUCED PRIZE OR FULL DISQUALIFICATION」。milestone 交付範本另外載明面試會被錄影，並須由 Fellowship 以鏈上 remark 批准。T&C 3.5 規定一致性以**評估當下最新的 Gray Paper 版本**為準——這就是 0.8.0 差異要熟的原因。","rel":["conformance fuzzer","Gray Paper","M1 interview"]},{"sym":"","term":"conformance fuzzer","zh":"一致性 fuzzer","cat":"eco","gpRef":"davxy/jam-conformance","one":"透過 Unix socket 餵區塊、逐塊比對 state root 的測試工具。","body":"同步的 request/response 協定，訊息用 JAM codec 編碼並加上 32-bit little-endian 長度前綴；流程是 PeerInfo 交握 → Initialize（附 ancestry）→ ImportBlock（回 StateRoot 或 Error）→ 不一致時 GetState 抓整份狀態產生報告。M1 必須支援 Ancestry 與 Forking 兩個 feature。W3F 的門檻俗稱「一百萬步」。","rel":["M1","test vectors","ancestors"]},{"sym":"","term":"JIP","zh":"JAM 改進提案","cat":"eco","gpRef":"polkadot-fellows/JIPs","one":"Gray Paper 之外的實作標準：JIP-1..5+。","body":"JIP-1 debug 用的 `log` host call（index 100，對共識無影響）；JIP-2 節點 RPC（JSON-RPC over WebSocket，通常 19800）；JIP-3 telemetry（JAM Tart）；JIP-4 chainspec（genesis_state 用 62 字元的十六進位 31-byte key、protocol_parameters 用 `fetch` selector 0 的編碼）；JIP-5 由 32-byte seed 推導驗證者金鑰（blake2b(\"jam_val_key_ed25519\" ⌢ seed) 等）。這些不在 GP 裡，但 M1 的工具鏈會用到。","rel":["chainspec","log","conformance fuzzer"]},{"sym":"","term":"0.7.2 → 0.8.0","zh":"版本差異","cat":"eco","gpRef":"graypaper v0.8.0 (2026-06-03)","one":"面試最容易踩的雷：實作在 0.7.2，但一致性以最新版為準。","body":"重點清單：validator 集合可變（|κ| 取代常數 V）；ρ 改存整個 guarantee；dispute 加上 16 筆上限並取消「bad verdict 需 ≥2 culprits」；`bless` 限 manager；authorizer = H(code hash ⌢ config) 統一；refinement context 增為 8 欄（anchor slot、lookup-anchor posterior root）；PVM 改成 basic-block gas 模型並新增 grow_heap（host call 編號整組位移）；host call 有了各自的 base + 每 KiB 成本；每人票數改成 ⌈2E/|γ′_P|⌉；extrinsic hash 承諾 preimage 的 hash；service 統計加回已處理 transfer 數；β 每筆多了 timeslot。","rel":["𝕍","ρ","grow_heap","refinement context"]}]}</script>
<script>
(function(){
  'use strict';
  const DATA = JSON.parse(document.getElementById('jam-quiz-data').textContent);
  const ITEMS = DATA.items;
  const META = DATA.meta;
  const TERMS = DATA.terms || [];
  const GCATS = META.glossaryCats || {};
  const CHAPTERS = META.chapters; // [{key,name,group}]
  const STORE_KEY = 'jam-m1-drill-v1';
  const $ = (s, el=document) => el.querySelector(s);
  const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));

  // ---------- persistence (best effort) ----------
  let store = {progress:{}, prefs:{}};
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch(e){}
  function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){} }
  const EMPTY = Object.freeze({seen:0, ok:0, ng:0, box:0, last:0});
  function prog(id){ return store.progress[id] || EMPTY; }
  function progW(id){ return store.progress[id] || (store.progress[id] = {seen:0, ok:0, ng:0, box:0, last:0}); }
  function record(id, correct){
    const p = progW(id); p.seen++; p.last = Date.now();
    if (correct){ p.ok++; p.box = Math.min(3, p.box + 1); } else { p.ng++; p.box = 0; }
    save();
  }

  // ---------- seeded shuffle ----------
  function hash32(str){ let h = 2166136261>>>0; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619)>>>0; } return h; }
  function rng(seed){ let s = seed>>>0 || 1; return () => { s ^= s<<13; s>>>=0; s ^= s>>>17; s ^= s<<5; s>>>=0; return s/4294967296; }; }
  const SESSION_SEED = (Date.now() ^ (Math.random()*1e9)) >>> 0;
  function shuffled(arr, seed){ const r = rng(seed); const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function optionOrder(item){ return shuffled([0,1,2,3], hash32(item.id) ^ SESSION_SEED); }

  // ---------- state ----------
  const state = {
    mode: 'practice',
    chapter: null,          // null = all
    diffs: new Set(), kinds: new Set(), query: '',
    unseenFirst: true, shuffle: true,
    queue: [], idx: 0, answered: null,   // practice
    mock: null,             // {items, answers:[], idx, done}
  };

  // ---------- filtering ----------
  function baseFilter(){
    return ITEMS.filter(it => {
      if (state.chapter && it.ch !== state.chapter) return false;
      if (state.diffs.size && !state.diffs.has(it.difficulty)) return false;
      if (state.kinds.size){
        const isDelta = it.tags.includes('delta-0.8.0') || it.kind === 'delta';
        const hit = (state.kinds.has('delta') && isDelta) || state.kinds.has(it.kind);
        if (!hit) return false;
      }
      if (state.query){
        const q = state.query.toLowerCase();
        const hay = [it.stem, it.section, it.gpRef, it.tags.join(' '), it.id, it.options.join(' ')].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }
  function buildQueue(){
    let list = baseFilter();
    if (state.shuffle) list = shuffled(list, SESSION_SEED ^ 0x9e3779b9);
    else list = list.slice().sort((a,b)=> chIndex(a.ch)-chIndex(b.ch) || a.id.localeCompare(b.id));
    if (state.unseenFirst) list.sort((a,b)=> (prog(a.id).seen>0) - (prog(b.id).seen>0));
    state.queue = list; state.idx = 0; state.answered = null;
  }
  function chIndex(k){ return CHAPTERS.findIndex(c=>c.key===k); }
  function chName(k){ const c = CHAPTERS.find(c=>c.key===k); return c ? c.name : k; }

  // ---------- rendering helpers ----------
  function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function inlineCode(s){ // `code` → <code>
    return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  const GO_KW = /\b(func|return|if|else|for|range|var|const|type|struct|interface|map|chan|go|defer|switch|case|default|break|continue|package|import|nil|true|false|len|make|append|int|uint|uint64|uint32|byte|string|bool|error)\b/g;
  function highlight(src, lang){
    let s = esc(src);
    // comments and strings first, using placeholders
    const holes = [];
    s = s.replace(/(\/\/[^\n]*)/g, (m)=>{ holes.push('<span class="cm">'+m+'</span>'); return '␀'+(holes.length-1)+'␀'; });
    s = s.replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;|`[^`]*`)/g, (m)=>{ holes.push('<span class="str">'+m+'</span>'); return '␀'+(holes.length-1)+'␀'; });
    if (lang === 'go' || lang === 'rust' || lang === 'python') s = s.replace(GO_KW, '<span class="kw">$1</span>');
    s = s.replace(/\b([A-Za-z_][A-Za-z0-9_]*)\s*(?=\()/g, '<span class="fn">$1</span>');
    s = s.replace(/␀(\d+)␀/g, (m, i)=> holes[+i]);
    return s;
  }
  function dots(d){ return '<span class="dots" title="難度 '+d+'/3">'+[1,2,3].map(i=>'<i class="'+(i<=d?'on':'')+'"></i>').join('')+'</span>'; }
  function metaRow(it){
    const isDelta = it.tags.includes('delta-0.8.0') || it.kind === 'delta';
    return '<div class="meta">'
      + '<span class="tag chtag">'+esc(it.ch === 'ARCH' ? 'ARCH' : (isNaN(+it.ch) ? 'App. '+it.ch : '§'+it.ch))+' · '+esc(chName(it.ch))+'</span>'
      + '<span class="sect">'+esc(it.section)+'</span>'
      + dots(it.difficulty)
      + '<span class="tag kind">'+esc(it.kind)+'</span>'
      + (isDelta ? '<span class="tag delta">0.7.2 → 0.8.0</span>' : '')
      + '</div>';
  }
  function questionBody(it, order, opts){
    // opts: {revealed, picked, disabled, showKeys}
    let h = metaRow(it);
    h += '<p class="stem">'+inlineCode(it.stem)+'</p>';
    if (it.code){
      h += '<pre class="code"><code>'+highlight(it.code.src, it.code.lang)+'</code></pre>';
      if (it.code.caption) h += '<div class="code-cap">'+esc(it.code.caption)+'</div>';
    }
    h += '<ul class="opts">';
    order.forEach((oi, pos) => {
      const cls = ['opt'];
      if (opts.revealed){
        if (oi === it.answer) cls.push('correct');
        else if (oi === opts.picked) cls.push('wrong');
        else cls.push('dim');
      } else if (opts.picked === oi) cls.push('picked');
      h += '<li><button class="'+cls.join(' ')+'" data-oi="'+oi+'" '+(opts.disabled?'disabled':'')+'>'
        + '<span class="key">'+(pos+1)+'</span><span>'+inlineCode(it.options[oi])+'</span></button></li>';
    });
    h += '</ul>';
    return h;
  }
  function explanationBlock(it, correct){
    let h = '<div class="verdict '+(correct?'ok':'ng')+'">'+(correct?'✓ 答對':'✗ 答錯')+'<span style="font-weight:400;color:var(--muted);font-size:13px">正解：'+(currentOrder.indexOf(it.answer)+1)+'</span></div>';
    h += '<div class="expl '+(correct?'ok':'ng')+'">'+inlineCode(it.explanation)+'</div>';
    if (it.trap) h += '<div class="trap"><b>陷阱</b>'+inlineCode(it.trap)+'</div>';
    h += '<div class="ref">GP ref: '+esc(it.gpRef)+' · id: '+esc(it.id)+'</div>';
    return h;
  }
  let currentOrder = [0,1,2,3];

  // ---------- rail ----------
  function renderChapters(){
    const el = $('#chapters');
    const counts = {};
    ITEMS.forEach(it => { counts[it.ch] = (counts[it.ch]||0)+1; });
    let h = '';
    let lastGroup = null;
    const allP = masteryOf(ITEMS);
    h += '<button class="ch" data-ch="" aria-pressed="'+(state.chapter===null)+'"><span class="num">∀</span><span class="name"><b>全部章節</b>'+barHtml(allP)+'</span><span class="cnt">'+ITEMS.length+'</span></button>';
    CHAPTERS.forEach(c => {
      if (!counts[c.key]) return;
      if (c.group !== lastGroup){ h += '<div class="chgroup">'+esc(c.group)+'</div>'; lastGroup = c.group; }
      const p = masteryOf(ITEMS.filter(i=>i.ch===c.key));
      h += '<button class="ch'+(c.group!=='Chapters 3–13'?' app-ch':'')+'" data-ch="'+esc(c.key)+'" aria-pressed="'+(state.chapter===c.key)+'">'
        + '<span class="num">'+esc(c.key==='ARCH'?'★':c.key)+'</span>'
        + '<span class="name"><b>'+esc(c.name)+'</b>'+barHtml(p)+'</span>'
        + '<span class="cnt">'+counts[c.key]+'</span></button>';
    });
    el.innerHTML = h;
    $('#chTotal').textContent = '';
  }
  function masteryOf(list){
    let ok=0, ng=0;
    list.forEach(i => { const p = prog(i.id); if (p.seen){ if (p.box>=1) ok++; else ng++; } });
    return {ok, ng, n: list.length};
  }
  function barHtml(p){
    const okw = p.n? (p.ok/p.n*100):0, ngw = p.n? (p.ng/p.n*100):0;
    return '<span class="bar"><i class="ok" style="width:'+okw.toFixed(1)+'%"></i><i class="ng" style="width:'+ngw.toFixed(1)+'%"></i></span>';
  }

  // ---------- status strip ----------
  function renderStatus(){
    const el = $('#status');
    const list = baseFilter();
    const m = masteryOf(list);
    const total = ITEMS.length;
    const seenAll = ITEMS.filter(i=>prog(i.id).seen>0).length;
    let h = '';
    if (state.mode === 'practice'){
      h += '<span class="stat"><span class="k">題庫</span><b>'+list.length+'</b><span class="k">/ '+total+'</span></span>';
      h += '<span class="stat"><span class="k">本次</span><b>'+(state.queue.length? (state.idx+1):0)+'</b><span class="k">/ '+state.queue.length+'</span></span>';
      h += '<span class="stat"><span class="k">已掌握</span><b>'+m.ok+'</b><span class="k">待加強</span><b>'+m.ng+'</b></span>';
    } else if (state.mode === 'mock' && state.mock){
      const mk = state.mock;
      h += '<span class="stat"><span class="k">模擬考</span><b>'+Math.min(mk.idx+1, mk.items.length)+'</b><span class="k">/ '+mk.items.length+'</span></span>';
      if (mk.startedAt) h += '<span class="stat"><span class="k">計時</span><b id="timer">00:00</b></span>';
    } else if (state.mode === 'gloss'){
      h += '<span class="stat"><span class="k">名詞解釋</span><b>' + TERMS.length + '</b><span class="k">條 · Gray Paper 0.8.0 符號</span></span>';
    } else if (state.mode === 'review'){
      const due = reviewList();
      h += '<span class="stat"><span class="k">錯題本</span><b>'+due.length+'</b><span class="k">題待複習</span></span>';
    }
    h += '<span class="spacer"></span>';
    h += '<span class="stat"><span class="k">總進度</span><b>'+seenAll+'</b><span class="k">/ '+total+' 做過</span></span>';
    el.innerHTML = h;
  }

  // ---------- practice ----------
  function renderPractice(){
    const el = $('#content');
    if (!state.queue.length){
      el.innerHTML = '<div class="empty"><h3>沒有符合篩選的題目</h3>調整章節或篩選條件，或清空搜尋。</div>'; return;
    }
    if (state.idx >= state.queue.length){
      const m = masteryOf(state.queue);
      el.innerHTML = '<div class="empty"><h3>這一輪做完了</h3>本輪 '+state.queue.length+' 題。已掌握 '+m.ok+'，待加強 '+m.ng+'。<div class="actions"><button class="btn primary" id="againBtn">再來一輪</button><button class="btn" id="toReview">去錯題本</button></div></div>';
      $('#againBtn').onclick = ()=>{ buildQueue(); renderAll(); };
      $('#toReview').onclick = ()=> setMode('review');
      return;
    }
    const it = state.queue[state.idx];
    currentOrder = optionOrder(it);
    const revealed = state.answered !== null;
    let h = '<div class="card">' + questionBody(it, currentOrder, {revealed, picked: state.answered, disabled: revealed});
    if (revealed) h += explanationBlock(it, state.answered === it.answer);
    h += '<div class="actions">';
    if (revealed) h += '<button class="btn primary" id="nextBtn">下一題 →</button>';
    if (!revealed) h += '<button class="btn ghost" id="skipBtn">跳過</button>';
    h += '<span class="hint"><span class="kbd">1</span>–<span class="kbd">4</span> 作答 · <span class="kbd">Enter</span> 下一題</span>';
    h += '</div></div>';
    el.innerHTML = h;
    $$('.opt', el).forEach(b => b.onclick = ()=> answerPractice(+b.dataset.oi));
    const nb = $('#nextBtn'); if (nb) nb.onclick = nextPractice;
    const sb = $('#skipBtn'); if (sb) sb.onclick = ()=>{ if (!revealed){ state.idx++; state.answered=null; renderAll(); } };
    if (nb) nb.focus({preventScroll:true});
  }
  function answerPractice(oi){
    if (state.answered !== null) return;
    const it = state.queue[state.idx];
    state.answered = oi;
    record(it.id, oi === it.answer);
    renderAll();
  }
  function nextPractice(){ state.idx++; state.answered = null; renderAll(); window.scrollTo({top:0, behavior:'instant'}); }

  // ---------- review (Leitner-lite) ----------
  function reviewList(){
    return ITEMS.filter(i => { const p = prog(i.id); return p.seen>0 && p.box < 3; })
      .sort((a,b)=> prog(a.id).box - prog(b.id).box || prog(a.id).last - prog(b.id).last);
  }
  function renderReview(){
    const el = $('#content');
    const due = reviewList();
    if (!due.length){
      el.innerHTML = '<div class="empty"><h3>錯題本是空的</h3>答錯的題目會進到這裡；答對後升一級（box 0→3），連續答對三次就畢業。</div>'; return;
    }
    if (!state.queue.length || state.queue._review !== true){ state.queue = due; state.queue._review = true; state.idx = 0; state.answered = null; }
    if (state.idx >= state.queue.length){
      el.innerHTML = '<div class="empty"><h3>複習完一輪</h3><div class="actions"><button class="btn primary" id="againBtn">再複習一輪</button></div></div>';
      $('#againBtn').onclick = ()=>{ state.queue = []; renderAll(); };
      return;
    }
    const it = state.queue[state.idx];
    currentOrder = optionOrder(it);
    const p = prog(it.id);
    const revealed = state.answered !== null;
    let h = '<div class="notice">Box <b>'+p.box+'</b> / 3 · 答對 '+p.ok+' · 答錯 '+p.ng+' · 上次 '+(p.last? new Date(p.last).toLocaleDateString():'—')+'</div>';
    h += '<div class="card">' + questionBody(it, currentOrder, {revealed, picked: state.answered, disabled: revealed});
    if (revealed) h += explanationBlock(it, state.answered === it.answer);
    h += '<div class="actions">';
    if (revealed) h += '<button class="btn primary" id="nextBtn">下一題 →</button>';
    h += '<span class="hint"><span class="kbd">1</span>–<span class="kbd">4</span> 作答 · <span class="kbd">Enter</span> 下一題</span>';
    h += '</div></div>';
    el.innerHTML = h;
    $$('.opt', el).forEach(b => b.onclick = ()=> answerPractice(+b.dataset.oi));
    const nb = $('#nextBtn'); if (nb) nb.onclick = ()=>{ state.idx++; state.answered=null; renderAll(); };
  }

  // ---------- mock exam ----------
  let timerHandle = null;
  function renderMock(){
    const el = $('#content');
    const mk = state.mock;
    if (!mk){
      const pool = baseFilter();
      let h = '<div class="card mock-setup"><h2 style="margin:0;font-family:var(--serif);font-size:20px">模擬考</h2>'
        + '<div class="notice" style="margin:0">依目前的章節與篩選抽題（目前題庫 <b>'+pool.length+'</b> 題）。作答期間不顯示對錯，交卷後統一看詳解。真實面試：120 分鐘、隨機抽 2 個章節（一小一大）+ 架構 + 設計理念 + PVM/附錄。</div>'
        + '<label>題數</label><div class="seg" id="mockN">'+[10,20,30,40].map(n=>'<button data-n="'+n+'" aria-pressed="'+(n===20)+'">'+n+'</button>').join('')+'</div>'
        + '<label>抽題方式</label><div class="seg" id="mockMode"><button data-m="filter" aria-pressed="true">目前篩選</button><button data-m="exam" aria-pressed="false">面試配比（2 章節 + ARCH + 附錄）</button></div>'
        + '<div class="actions"><button class="btn primary" id="startMock">開始</button></div></div>';
      el.innerHTML = h;
      let n = 20, m = 'filter';
      $$('#mockN button').forEach(b=> b.onclick = ()=>{ n = +b.dataset.n; $$('#mockN button').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
      $$('#mockMode button').forEach(b=> b.onclick = ()=>{ m = b.dataset.m; $$('#mockMode button').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
      $('#startMock').onclick = ()=> startMock(n, m);
      return;
    }
    if (mk.done){ renderMockResults(); return; }
    const it = mk.items[mk.idx];
    currentOrder = optionOrder(it);
    let h = '<div class="card">' + questionBody(it, currentOrder, {revealed:false, picked: mk.answers[mk.idx], disabled:false});
    h += '<div class="actions">';
    h += '<button class="btn ghost" id="prevBtn" '+(mk.idx===0?'disabled':'')+'>← 上一題</button>';
    h += (mk.idx < mk.items.length-1) ? '<button class="btn primary" id="nextBtn">下一題 →</button>' : '<button class="btn primary" id="finishBtn">交卷</button>';
    h += '<span class="hint">已作答 '+mk.answers.filter(a=>a!==null).length+' / '+mk.items.length+'</span>';
    h += '</div></div>';
    el.innerHTML = h;
    $$('.opt', el).forEach(b => b.onclick = ()=>{ mk.answers[mk.idx] = +b.dataset.oi; renderAll(); });
    const nb = $('#nextBtn'); if (nb) nb.onclick = ()=>{ mk.idx++; renderAll(); window.scrollTo({top:0}); };
    const pb = $('#prevBtn'); if (pb) pb.onclick = ()=>{ mk.idx--; renderAll(); };
    const fb = $('#finishBtn'); if (fb) fb.onclick = finishMock;
  }
  function startMock(n, m){
    let items;
    if (m === 'exam'){
      const chapterKeys = CHAPTERS.filter(c=>c.group==='Chapters 3–13').map(c=>c.key).filter(k=>ITEMS.some(i=>i.ch===k));
      const r = rng(SESSION_SEED ^ 0x1234567);
      const pick2 = shuffled(chapterKeys, Math.floor(r()*1e9)).slice(0,2);
      const fromCh = shuffled(ITEMS.filter(i=>pick2.includes(i.ch)), Math.floor(r()*1e9));
      const arch = shuffled(ITEMS.filter(i=>i.ch==='ARCH'), Math.floor(r()*1e9));
      const app = shuffled(ITEMS.filter(i=>['A','B','C','D','E','F','G','H'].includes(i.ch)), Math.floor(r()*1e9));
      const nArch = Math.max(2, Math.round(n*0.2)), nApp = Math.max(2, Math.round(n*0.2));
      items = fromCh.slice(0, n - nArch - nApp).concat(arch.slice(0,nArch), app.slice(0,nApp));
      items = shuffled(items, Math.floor(r()*1e9));
    } else {
      items = shuffled(baseFilter(), SESSION_SEED ^ 0x55aa55aa).slice(0, n);
    }
    if (!items.length){ alert('目前篩選沒有題目'); return; }
    state.mock = {items, answers: items.map(()=>null), idx:0, done:false, startedAt: Date.now()};
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(()=>{ const t=$('#timer'); if (t && state.mock && !state.mock.done){ const s=Math.floor((Date.now()-state.mock.startedAt)/1000); t.textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); } }, 1000);
    renderAll();
  }
  function finishMock(){
    const mk = state.mock; mk.done = true; mk.endedAt = Date.now();
    mk.items.forEach((it,i)=>{ if (mk.answers[i]!==null) record(it.id, mk.answers[i]===it.answer); });
    if (timerHandle) clearInterval(timerHandle);
    renderAll(); window.scrollTo({top:0});
  }
  function renderMockResults(){
    const el = $('#content');
    const mk = state.mock;
    const n = mk.items.length;
    const correct = mk.items.filter((it,i)=> mk.answers[i]===it.answer).length;
    const secs = Math.floor((mk.endedAt - mk.startedAt)/1000);
    const byCh = {};
    mk.items.forEach((it,i)=>{ const b = byCh[it.ch] || (byCh[it.ch]={n:0,ok:0}); b.n++; if (mk.answers[i]===it.answer) b.ok++; });
    let h = '<div class="card results"><h2>模擬考結果</h2><div class="score">'+correct+' <small>/ '+n+' · '+Math.round(correct/n*100)+'% · '+Math.floor(secs/60)+' 分 '+(secs%60)+' 秒</small></div>';
    h += '<table class="tbl"><thead><tr><th>章節</th><th style="text-align:right">答對</th><th style="text-align:right">題數</th><th style="text-align:right">%</th></tr></thead><tbody>';
    Object.keys(byCh).sort((a,b)=>chIndex(a)-chIndex(b)).forEach(k=>{ const b=byCh[k]; h += '<tr><td>'+esc((k==='ARCH'?'★ ':(isNaN(+k)?'App. '+k+' ':'§'+k+' '))+chName(k))+'</td><td class="n">'+b.ok+'</td><td class="n">'+b.n+'</td><td class="n">'+Math.round(b.ok/b.n*100)+'</td></tr>'; });
    h += '</tbody></table>';
    const wrong = mk.items.map((it,i)=>({it,i})).filter(x=> mk.answers[x.i]!==x.it.answer);
    h += '<h3 style="font-size:15px;margin:0 0 6px">'+(wrong.length? '答錯 / 未答（'+wrong.length+'）':'全對！')+'</h3><div class="review-list">';
    wrong.forEach(({it,i})=>{
      const a = mk.answers[i];
      h += '<div class="review-item">'+metaRow(it)+'<div class="q">'+inlineCode(it.stem)+'</div>'
        + '<div class="a"><b style="color:var(--bad)">你的答案：</b>'+(a===null?'（未作答）':inlineCode(it.options[a]))+'</div>'
        + '<div class="a"><b style="color:var(--ok)">正解：</b>'+inlineCode(it.options[it.answer])+'</div>'
        + '<div class="expl" style="margin-top:8px;font-size:13.5px">'+inlineCode(it.explanation)+'</div>'
        + (it.trap?'<div class="trap"><b>陷阱</b>'+inlineCode(it.trap)+'</div>':'')
        + '<div class="ref">GP ref: '+esc(it.gpRef)+'</div></div>';
    });
    h += '</div><div class="actions"><button class="btn primary" id="newMock">再考一次</button><button class="btn" id="toPractice">回練習</button></div></div>';
    el.innerHTML = h;
    $('#newMock').onclick = ()=>{ state.mock = null; renderAll(); };
    $('#toPractice').onclick = ()=> setMode('practice');
  }


  // ---------- glossary ----------
  const gstate = {q:'', cat:null, open:new Set()};
  function termKey(t){ return (t.sym ? t.sym + ' ' : '') + t.term; }
  function glossMatches(){
    const q = gstate.q.toLowerCase();
    return TERMS.filter(t => {
      if (gstate.cat && !gstate.cat.split(',').includes(t.cat)) return false;
      if (!q) return true;
      return [t.sym, t.term, t.zh, t.one, t.body, t.gpRef, (t.rel||[]).join(' ')].join(' ').toLowerCase().includes(q);
    });
  }
  function hl(s){
    if (!gstate.q) return inlineCode(s);
    const q = gstate.q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return inlineCode(s).replace(new RegExp('(' + q + ')', 'gi'), '<mark>$1</mark>');
  }
  function openTerm(name){
    const t = TERMS.find(x => x.term === name || x.sym === name);
    if (!t) { gstate.q = name; gstate.cat = null; renderAll(); return; }
    gstate.open.add(t.term); gstate.cat = null; gstate.q = '';
    renderAll();
    const el = document.getElementById('term-' + cssId(t.term));
    if (el) el.scrollIntoView({block:'center', behavior:'smooth'});
  }
  function cssId(s){ return s.replace(/[^A-Za-z0-9]/g, '-'); }
  function renderGloss(){
    const el = $('#content');
    const list = glossMatches();
    let h = '<div class="gloss"><div class="gloss-head">'
      + '<input class="search" id="gsearch" type="search" placeholder="搜尋符號、名詞、說明…" value="' + esc(gstate.q) + '" aria-label="搜尋名詞">'
      + '<span class="sect">' + list.length + ' / ' + TERMS.length + ' 條</span></div>';
    const cats = [];       // dedupe by display label (several cat keys share one label)
    const seenLabel = new Map();
    TERMS.forEach(t => {
      const label = GCATS[t.cat] || t.cat;
      if (!seenLabel.has(label)) { seenLabel.set(label, [t.cat]); cats.push(label); }
      else if (!seenLabel.get(label).includes(t.cat)) seenLabel.get(label).push(t.cat);
    });
    h += '<div class="gcats">';
    h += '<button class="chip" data-gcat="" aria-pressed="' + (gstate.cat===null) + '">全部</button>';
    cats.forEach(label => {
      const keys = seenLabel.get(label);
      const on = gstate.cat && keys.includes(gstate.cat);
      h += '<button class="chip" data-gcat="' + esc(keys.join(',')) + '" aria-pressed="' + !!on + '">' + esc(label) + '</button>';
    });
    h += '</div>';
    if (!list.length){
      h += '<div class="empty"><h3>沒有符合的名詞</h3>換個關鍵字，或清空搜尋。</div></div>';
      el.innerHTML = h;
      bindGloss(); return;
    }
    let lastCat = null;
    list.forEach(t => {
      const lab = GCATS[t.cat]||t.cat;
      if (lab !== lastCat && !gstate.q){ h += '<div class="gsec">' + esc(lab) + '</div>'; lastCat = lab; }
      const open = gstate.open.has(t.term) || (gstate.q && gstate.q.length > 1);
      h += '<details class="gcard' + (gstate.q ? ' hit' : '') + '" id="term-' + cssId(t.term) + '" data-term="' + esc(t.term) + '"' + (open ? ' open' : '') + '>'
        + '<summary><span class="gsym">' + hl(t.sym || '·') + '</span>'
        + '<span class="gname"><b>' + hl(t.term) + '</b><span class="zh">' + hl(t.zh) + '</span>'
        + '<span class="one">' + hl(t.one) + '</span></span>'
        + '<span class="gref">' + esc(t.gpRef) + '</span></summary>'
        + '<div class="gbody">' + hl(t.body) + '</div>';
      if (t.rel && t.rel.length){
        h += '<div class="grel"><span class="lbl">相關</span>'
          + t.rel.map(r => '<button data-rel="' + esc(r) + '">' + esc(r) + '</button>').join('') + '</div>';
      }
      h += '</details>';
    });
    h += '</div>';
    el.innerHTML = h;
    bindGloss();
  }
  function bindGloss(){
    const s = $('#gsearch');
    if (s){
      let tmr = null;
      s.addEventListener('input', e => { clearTimeout(tmr); const v = e.target.value; tmr = setTimeout(() => { gstate.q = v.trim(); renderGloss(); const n = $('#gsearch'); if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 180); });
    }
    $$('#content .chip[data-gcat]').forEach(b => b.onclick = () => { gstate.cat = b.dataset.gcat || null; renderGloss(); });
    $$('#content .grel button').forEach(b => b.onclick = (e) => { e.preventDefault(); openTerm(b.dataset.rel); });
    $$('#content .gcard').forEach(d => d.addEventListener('toggle', () => {
      const k = d.dataset.term;
      if (d.open) gstate.open.add(k); else gstate.open.delete(k);
    }));
  }

  // ---------- mode & events ----------
  function setMode(m){
    state.mode = m; state.queue = []; state.idx = 0; state.answered = null;
    if (m !== 'mock') state.mock = null;
    $$('.modes button').forEach(b=> b.setAttribute('aria-pressed', b.dataset.mode===m));
    $('#rail').dataset.mode = m;
    if (m === 'practice') buildQueue();
    renderAll();
  }
  function renderAll(){ renderChapters(); renderStatus(); if (state.mode==='practice') renderPractice(); else if (state.mode==='mock') renderMock(); else if (state.mode==='gloss') renderGloss(); else renderReview(); }

  $('#chapters').addEventListener('click', e => {
    const b = e.target.closest('.ch'); if (!b) return;
    state.chapter = b.dataset.ch || null;
    if (state.mode==='practice') buildQueue(); else if (state.mode==='mock') state.mock = null;
    renderAll();
  });
  $$('.modes button').forEach(b=> b.onclick = ()=> setMode(b.dataset.mode));
  $$('#diffChips .chip').forEach(b=> b.onclick = ()=>{ const d=+b.dataset.diff; if (state.diffs.has(d)) state.diffs.delete(d); else state.diffs.add(d); b.setAttribute('aria-pressed', state.diffs.has(d)); refilter(); });
  $$('#kindChips .chip').forEach(b=> b.onclick = ()=>{ const k=b.dataset.kind; if (state.kinds.has(k)) state.kinds.delete(k); else state.kinds.add(k); b.setAttribute('aria-pressed', state.kinds.has(k)); refilter(); });
  $('#unseenFirst').onclick = (e)=>{ state.unseenFirst = !state.unseenFirst; e.currentTarget.setAttribute('aria-pressed', state.unseenFirst); refilter(); };
  $('#shuffleQ').onclick = (e)=>{ state.shuffle = !state.shuffle; e.currentTarget.setAttribute('aria-pressed', state.shuffle); refilter(); };
  let searchT = null;
  $('#search').addEventListener('input', e => { clearTimeout(searchT); searchT = setTimeout(()=>{ state.query = e.target.value.trim(); refilter(); }, 180); });
  function refilter(){ if (state.mode==='practice') buildQueue(); else if (state.mode==='mock') state.mock=null; renderAll(); }
  $('#drawerToggle').onclick = ()=> $('#rail').classList.toggle('collapsed');
  $('#resetBtn').onclick = ()=>{ if (confirm('清除所有本機進度？')){ store = {progress:{}, prefs:{}}; save(); renderAll(); } };
  $('#exportBtn').onclick = ()=>{
    const txt = JSON.stringify(store, null, 1);
    try { navigator.clipboard.writeText(txt); alert('進度 JSON 已複製到剪貼簿'); } catch(e){ prompt('複製以下 JSON', txt); }
  };
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea')) return;
    if (state.mode === 'gloss') return;
    if (e.key >= '1' && e.key <= '4'){
      const btn = $$('#content .opt')[+e.key-1]; if (btn && !btn.disabled){ btn.click(); e.preventDefault(); }
    } else if (e.key === 'Enter' || e.key === 'ArrowRight'){
      const nb = $('#nextBtn') || $('#finishBtn') || $('#againBtn'); if (nb){ nb.click(); e.preventDefault(); }
    } else if (e.key === 'ArrowLeft'){
      const pb = $('#prevBtn'); if (pb && !pb.disabled){ pb.click(); e.preventDefault(); }
    }
  });
  if (window.matchMedia('(max-width: 900px)').matches) $('#rail').classList.add('collapsed');

  // ---------- boot ----------
  $('#footMeta').innerHTML = esc(META.bankVersion)+' · '+ITEMS.length+' 題 · '+esc(META.gpVersion)+'<br>題目英文（貼近面試）、詳解繁中；選項每次隨機排列。<br>「名詞」分頁收錄 '+TERMS.length+' 條 GP 0.8.0 符號與術語。<br>進度存於此瀏覽器（localStorage）。';
  $('#brandSub').textContent = META.gpVersion+' · '+META.team;
  $('#rail').dataset.mode = state.mode;
  buildQueue(); renderAll();
})();
</script>

</body>
</html>
