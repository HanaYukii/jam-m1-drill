ority 的），**不是** eq. 11.30 的 I（本塊 E_G 帶進來的報告）。I 只餵 eq. 13.10 的 R(c)（i/x/z/e/u）與 eq. 13.11 的 L(c)（l）。所以用 (b) 那筆：130 × 65 = 8,450；8,450 ÷ 64 = 132.03125，⌈·⌉ = 133；4,104 × 133 = 545,832；262,144 + 545,832 = **807,976**。937,216 是誤用 (a) 那筆 guaranteed 報告：100,000 + 4,104 × ⌈200 × 65/64⌉ = 100,000 + 4,104 × 204——那組數字只會出現在 l = L(c) 這個欄位。803,872 是漏掉 ceiling，取 ⌊8,450/64⌋ = 132。795,664 是完全漏掉 65/64 係數，直接 4,104 × 130。65/64 的來由：每 64 個 export segment 會多一個 paged-proof segment（§14），所以 DA 佔用是 ⌈65n/64⌉ 個 segment，每個 W_G = 4,104 octets。","trap":"DA load 看 R（剛 available），bundle length 與 refine 統計看 I（剛 guaranteed）——同一塊同一個 core 可以兩者都有。"},{"id":"c3-ch13-rollover-code","ch":"13","section":"13.1 Validator Activity","gpRef":"eq. 13.4–13.6","difficulty":2,"kind":"code","tags":["statistics","rollover","delta-0.8.0","go"],"code":{"lang":"go","caption":"internal/statistics/statistics.go:109-133, 460-504 (UpdateValidatorActivityStatistics / UpdateCurrentStatistics, GP 0.7.2, condensed)","src":"// (13.3)  π ≡ (πV , πL, πC , πS);  (πV, πL) => (current, last)\nfunc UpdateValidatorActivityStatistics() {\n\tcs := blockchain.GetInstance()\n\tpreEpochIndex := GetEpochIndex(cs.GetPriorStates().GetTau())\n\tpostEpochIndex := GetEpochIndex(cs.GetPosteriorStates().GetTau())\n\tpreStatistics := cs.GetPriorStates().GetPi()\n\tif preEpochIndex == postEpochIndex {\n\t\tcs.GetPosteriorStates().SetPiCurrent(preStatistics.ValsCurr)\n\t\tcs.GetPosteriorStates().SetPiLast(preStatistics.ValsLast)\n\t} else { // reset\n\t\tvalsCurrent := make(types.ValidatorsStatistics, types.ValidatorsCount)\n\t\tcs.GetPosteriorStates().SetPiCurrent(valsCurrent)\n\t\tcs.GetPosteriorStates().SetPiLast(preStatistics.ValsCurr)\n\t}\n\tUpdateCurrentStatistics(cs.GetLatestBlock().Extrinsic) // ... plus core & service stats\n}\n\nfunc UpdateCurrentStatistics(extrinsic types.Extrinsic) {\n\tstatistics := cs.GetPosteriorStates().GetPi()\n\tUpdateBlockStatistics(&statistics, authorIndex)\n\tUpdateTicketStatistics(&statistics, authorIndex, extrinsic.Tickets)\n\tUpdatePreimageStatistics(&statistics, authorIndex, extrinsic.Preimages)\n\tUpdateReportStatistics(&statistics, extrinsic.Guarantees, tau, kappa)\n\tUpdateAvailabilityStatistics(&statistics, authorIndex, extrinsic.Assurances)\n\tcs.GetPosteriorStates().SetPiCurrent(statistics.ValsCurr)\n}"},"stem":"This is the team's GP 0.7.2 statistics code, condensed. Measured against GP 0.8.0 eq. 13.4–13.6, on which blocks does it place a validator's assurance increment in the wrong record, and what is the minimal fix?","options":["Only on blocks where ⌊τ/E⌋ ≠ ⌊τ′/E⌋. eq. 13.4 applies the assurance pass to the prior record, and eq. 13.5 then moves that already-incremented record into the archive, so on an epoch-boundary block each assurer's step belongs in the archive rather than in the newly allocated slice this code writes it into. The fix is to run the assurance pass on the prior record before the branch and to hand the incremented record to the else-branch's archive assignment.","On no block at all: the placement of the assurance increment already matches 0.8.0, because eq. 13.4 is itself applied to π_V‡ and this code likewise runs its availability pass on the posterior record. The only genuine 0.8.0 gap visible here is eq. 13.3, which sizes the two records from |κ| and |λ| rather than from the constant ValidatorsCount. The fix is to allocate the reset slice with len(kappa) instead.","Only on epoch-boundary blocks, but in the opposite direction. eq. 13.6 applies all six counters to π_V† before eq. 13.5 performs the rollover, so on a boundary block the author's block, ticket and preimage steps belong in the archive too, and the newly allocated slice must stay an all-zero sequence until the second block of the new epoch. The fix is to hoist the whole of UpdateCurrentStatistics above the epoch branch, so that every counter is credited before the reset rather than only the assurance pass.","On every block. eq. 13.4 attributes each assurance to the block author rather than to the assurer who signed it, so the availability pass credits the wrong validator on every block and not merely at the boundary; which of the two records receives that credit is a separate question this code already answers correctly. The fix is to index the increment by authorIndex exactly as the ticket and preimage passes already do."],"answer":0,"explanation":"0.7.2 → 0.8.0 的差異就在 assurance 的時機。0.8.0 eq. 13.4：π_V† ≡ π_V except ∀v ∈ N_{|κ|}：π_V†[v]_a = π_V[v]_a + (∃a ∈ E_A : a_v = v)——作用在 **prior** π_V 上；eq. 13.5 才 rollover：e′ ≠ e 時 (π_V‡, π′_L) = ([(0, …), …], π_V†)。上面這段 Go 先分支歸零、把 π_V 搬進 ValsLast，然後 UpdateCurrentStatistics 從 **posterior** 取 π 再跑 UpdateAvailabilityStatistics，等於把 assurance 記進了新 epoch 的累加器。因為非邊界塊 π_V‡ = π_V†，兩種寫法結果一樣，所以差異**只在 ⌊τ/E⌋ ≠ ⌊τ′/E⌋ 的那一塊**顯現——這正是 team issue #1021 / PR #1034 「assurances credited before epoch rollover」要修的東西。把 assurance 記給 author 與 UpdateAvailabilityStatistics 目前用 assurance.ValidatorIndex 的作法相反，也違反 §13.1 對 a 的定義；把 b/t/p/d/g 也搬到 rollover 之前則與 eq. 13.6 明寫的 π_V‡ 起點衝突。至於 |κ|/|λ| 的長度（eq. 13.3）確實是 0.8.0 另一個未補的缺口（team issue #1037，程式碼仍用常數 ValidatorsCount），但那不影響 assurance 落在哪一份 record，更不能拿來論證「assurance 的位置已經對了」——那個說法把 eq. 13.4 的起點說成 π_V‡，與式子本身的 π_V† ≡ π_V except … 直接矛盾（π_V‡ 是 eq. 13.5 的產物，順序上晚一步）。另一個「把整個 UpdateCurrentStatistics 提到分支之前」的修法則會多錯五個 counter：eq. 13.6 的 b/t/p/d/g 全部以 π_V‡ 為起點，提前做等於讓新 epoch 的第一塊完全不計分。","trap":"非 epoch 邊界的 fuzz trace 全綠不代表對——這個 bug 只在 600 塊裡的那 1 塊現形。"},{"id":"c3-ch13-accum-triple-code","ch":"13","section":"13.2 Cores and Services","gpRef":"eq. 13.8, 13.13–13.14; eq. 12.27–12.28","difficulty":2,"kind":"code","tags":["statistics","service-stats","accumulation","delta-0.8.0","go"],"code":{"lang":"go","caption":"internal/statistics/statistics.go:386-450 (CalculateAccumulationStatistics + record assembly, GP 0.7.2)","src":"// v0.7.1\n// (13.12) a\n// AccumulateCount, AccumulateGasUsed\nfunc CalculateAccumulationStatistics(serviceID types.ServiceID,\n\taccumulationStatistics types.AccumulationStatistics,\n) (accumulateCount types.U32, accumulateGasUsed types.Gas) {\n\tvalue, ok := accumulationStatistics[serviceID]\n\tif ok {\n\t\taccumulateCount = types.U32(value.NumAccumulatedReports)\n\t\taccumulateGasUsed = value.Gas\n\t}\n\t// else, the service id is not found, count and gas are 0\n\treturn accumulateCount, accumulateGasUsed\n}\n\n// ... inside UpdateServiceActivityStatistics, for each serviceID in s:\nservicesStatistics[serviceID] = types.ServiceActivityRecord{\n\tProvidedCount:     ps.count,\n\tProvidedSize:      ps.size,\n\tRefinementCount:   R.n,\n\tRefinementGasUsed: R.GasUsed,\n\tAccumulateCount:   accumulateCount,\n\tAccumulateGasUsed: accumulateGasUsed,\n}"},"stem":"The team's GP 0.7.2 code builds each service record's accumulation entry as the pair shown. GP 0.8.0 reshapes that entry. What exactly changes, and what observable consequence does it have for which services appear in π′_S?","options":["The entry becomes a three-element value — work-digests accumulated for the service, deferred transfers delivered to it, and accumulation gas — obtained as the substitute-if-nothing of the service's entry in S against an all-zero triple. Since S now keeps every service whose triple is not all-zero, a service touched only by incoming transfers has a non-zero middle element, becomes a key of S, and therefore joins the union that forms π′_S's domain.","0.8.0 restores the separate on-transfer PVM invocation Ψ_T, so the accumulation entry keeps its two elements and the record regains a transfer count and a transfer gas figure as two further top-level fields beside it, drawn from a second dictionary of on-transfer statistics. Every service that received a transfer therefore appears in π′_S carrying its own on-transfer gas figure, beside the reported and preimage-provided services.","The entry keeps its two elements — work-digests accumulated for the service and accumulation gas — but the gas element is re-typed from N_G to a plain natural, and it is now read out with a bare dictionary subscript rather than through the substitute-if-nothing wrapper. The domain of π′_S is unchanged, still the union of reported services, preimage-provided services and the keys of the accumulation statistics, so a service touched only by a transfer never appears.","The entry becomes a three-element value — work-digests accumulated for the service, preimages provided to it, and accumulation gas — obtained as the substitute-if-nothing of the service's entry in S against an all-zero triple. Since that middle element already counts provisions the separate provision pair becomes redundant, and the domain of π′_S narrows to exactly the services which appear as keys of the accumulation statistics."],"answer":0,"explanation":"eq. 13.8：π_S ∈ ⟨N_S → (p ∈ (N, N), r ∈ (N, N_G), i ∈ N, x ∈ N, z ∈ N, e ∈ N, a ∈ (N, N, N_G))⟩——a 在 0.8.0 是**三元組**。eq. 13.13：a = 𝒰(S[s], (0, 0, 0))，𝒰 是 §3.2 / eq. 3.2 的 substitute-if-nothing（dictionary 查不到會得 ∅，於是取後備值 (0, 0, 0)）。S 的定義在 eq. 12.27–12.28：S ∈ ⟨N_S → (N, N, N_G)⟩、S ≡ {s ↦ S(s) | S(s) ≠ (0, 0, 0)}，其中 S(s) = (N(s), T(s), G(s))：N(s) 是本塊被 accumulate 的 work-digest 數、T(s) 是 destination 為 s 的 processed deferred transfer 數、G(s) 是 accumulation 用掉的 gas。eq. 13.14：s = s^R ∪ s^P ∪ K(S)，所以「只收到 transfer」的 service 因為 T(s) > 0 而留在 S 裡，經由 K(S) 進入 π′_S 的 domain——這是 0.7.2 拿不到的資訊。歷史脈絡：0.7.1（team #656）因為 Ψ_T 被移除而把 OnTransfersCount / OnTransfersGasUsed 從 ServiceActivityRecord 刪掉，0.8.0（GP #502「Add back processed transfer count to service statistics」）只把 transfer **筆數**放回三元組中間，並沒有復活 on-transfer 的 gas 欄位，也沒有復活 Ψ_T——accumulation.tex 全篇沒有 Ψ_T，轉帳的 gas 是在 eq. 12.23 的 g 裡與 work-digest 的 gas 加總後一次進 Ψ_A，因此也不存在「第二本 on-transfer 統計字典」可供 π_S 取用。三元組中間那一項是 eq. 12.28 的 T(s) ≡ |[t | t ↕ t, t_d = s]|，數的是 **transfer 筆數**而不是 preimage 筆數；型別也沒有降級：eq. 13.8 的 a 第三個元素仍是 N_G，而且 eq. 13.13 用的是 𝒰(S[s], (0, 0, 0)) 這個substitute-if-nothing 包裝，不是裸下標——依 §3.5 的 d[k]，查不到 key 會得到 ∅，直接塞進 (N, N, N_G) 的欄位是不合型的。eq. 13.14 的 s = s^R ∪ s^P ∪ K(S) 三方聯集同樣沒有動：domain 不會縮成只剩 K(S)，否則本塊只被 report、或只被塞了 preimage 的 service 會憑空從 π′_S 消失。provision pair p 仍然獨立存在：eq. 13.13 寫作 p = Σ_{(s, d) ∈ E_P}(1, |d|)，注意 comprehension 綁定的 s 字面上**遮蔽**了外層的 ∀s ∈ s，而 §3 從未定義「重複綁定即過濾」的規則——照字面讀會退化成與 service 無關的全域總和。實際意思（也是所有實作的作法）是「E_P 中 service index 等於該 s 的那些 preimage 的 (筆數, 總 octet 數)」；同樣的遮蔽寫法也見於 eq. 12.28 的 G(s) ≡ Σ_{(s, u) ∈ u}(u)，屬於 GP 的編輯瑕疵而非明文慣例。","trap":"0.8.0 加回來的是 transfer 的「筆數」，不是 on-transfer 的 gas；Ψ_T 沒有回來。"},{"id":"c3-ch13-consensus-state-rationale","ch":"13","section":"13.1 Validator Activity","gpRef":"§13.1; eq. 4.4 (state composition); eq. 13.1–13.3; App. D key C(13)","difficulty":2,"kind":"rationale","tags":["statistics","rationale","state","epoch","staking"],"stem":"An interviewer pushes back: 'Validator counters look like telemetry to me. Why are they a component of σ and Merklized into the state trie at all, and why keep two validator records rather than one running counter?' What is the GP-grounded answer?","options":["Because Grandpa weights finality votes by validator performance, so the figures have to sit in σ where the finality gadget can read them and a stale accumulator would let a validator vote with the previous epoch's weight; that is also why §13.1 has validators vote on each other's auditing efforts, since audits carry the same weight in that ballot. The pairing exists so that a validator removed from the active set mid-epoch can still be slashed against its own history rather than against whoever replaced it, and the core records are paired for exactly the same reason.","It is essentially a serialization convenience: the JIP-2 RPC's statistics endpoint and the conformance vectors want a fixed-shape record, so π rides along in σ purely to give those consumers a stable layout, and because it is excluded from the state-trie construction of appendix D a node that skipped the update entirely would still agree on the state root. The pairing exists only so that a test vector can compare a whole epoch's totals in one shot.","Because the figures must be bit-identical on every node and provable to a consumer outside the chain: JAM pays no rewards itself but has to deliver activity data to a staking subsystem, so the record is a state component with its own trie key and a node computing it differently produces a different state root. The pairing exists because settlement is per-epoch — the archive holds the just-completed epoch's totals unchanged for the whole of the next epoch, giving a stable snapshot to read while the accumulator fills.","Because the author's reward is paid out of the block's accumulation gas budget in the same block, so the counters have to be readable from inside the state transition rather than from an off-chain index. The pairing is a rollback buffer: when a fork is reverted the archive is copied back over the accumulator, which is exactly why both halves have to be Merklized."],"answer":2,"explanation":"§13.1 開頭：「The JAM chain does not explicitly issue rewards—we leave this as a job to be done by the staking subsystem…However…it is important for the JAM chain to facilitate the arrival of information on validator activity in to the staking subsystem so that it may be acted upon.」要讓鏈外（甚至跨鏈）的 staking 系統能**信任**這些數字，它就必須是共識狀態：eq. 4.4 把 π 列為 σ 的十七個分量之一，App. D 以 C(13) 當 state key 併入 state trie，因此 π′ 併入 M_σ(σ′) 並可被 light client 證明——但要記住 JAM 的 header 帶的是 **prior** state root（§5：H_R ≡ M_σ(σ)，GP 明說這是與 Ethereum／Polkadot 相反的設計，為了 pipelining），所以含 π′ 的 σ′ 之根**不在本塊的 H_R 裡**，要等**下一塊**的 header 才會出現，剛好落後一塊；任何節點算錯 π 就會算出不同的 state root，直接是 invalid block——這正是「不是 telemetry」的意思，也讓 statistics 成為 conformance 測試的一等公民。雙份 record 的理由在 §13.1：「The validator statistics are made on a per-epoch basis and we retain one record of completed statistics (π_L) together with one record which serves as an accumulator for the present epoch (π_V)」——結算以 epoch 為單位，π_L 在整個下一個 epoch 都不再變動，消費者才有穩定快照可讀。§13.2 明講 π_C/π_S「are tracked only on a per-block basis」，所以不需要這種配對。Grandpa 不讀 π（GRANDPA、BEEFY 與 auditing 恰恰是 §13.1 說**無法**直接鏈上追蹤、要靠 validator 互評取中位數的部分——那段話正是「Grandpa 依表現加權投票」的反證，而不是它的佐證）；JAM 也沒有在區塊內付獎勵，§13.1 第一句就寫 does not explicitly issue rewards，遑論從 accumulation gas 預算裡扣；π 更不是 rollback buffer——分叉是靠整個 σ 的版本切換處理的，沒有「把 π_L 複製回 π_V」這種動作，而 §13 也沒有任何 slashing 條款（懲罰在 §10 的 judgements，依據是 ψ 不是 π）。最後，「π 不進 state trie、算錯也不影響 state root」與 App. D 直接衝突：C(13) 就是 π 的 state key，π′ 一定會被併進 M_σ(σ′)。","trap":"「為什麼在鏈上」的標準答法：因為要能被證明且必須共識一致，π 進 state root；不是為了 RPC 好看。"},{"id":"ch04-stf-extrinsic","ch":"4","section":"4.1 The Block","gpRef":"eq. 4.2–4.3 (block / extrinsic)","difficulty":1,"kind":"concept","tags":["block","extrinsic"],"stem":"Per GP 0.8.0, the extrinsic E of a JAM block is a tuple of exactly five components. Which of the following is NOT one of them?","options":["E_A — availability assurances by validators","E_D — disputes (verdicts, culprits, faults)","E_T — tickets for the Safrole slot-sealer contest","E_X — user transactions signed by external accounts"],"answer":3,"explanation":"GP eq. 4.3：E ≡ (E_T, E_D, E_P, E_A, E_G)，即 tickets、disputes、preimages、assurances、guarantees（reports）。JAM 是 transactionless 的：沒有任何「使用者簽名的交易」進入區塊，所有 extrinsic 都是由 validator 產生的。外部資料只能透過 work-package（in-core 的 refine）以及 preimage 進入系統。tickets、assurances、disputes 都是真實的 extrinsic 成分；「使用者簽名的交易 E_X」是 Ethereum 模型的概念，在 JAM 裡不存在（overview 4.7：「there is no such concept of a transactor」）。","trap":"面試常問：JAM 為什麼沒有 transaction？答：授權（authorization）與 blockspace 購買（coretime）被拆開，外部輸入經 refine 進入。"},{"id":"ch04-state-components","ch":"4","section":"4.2 The State","gpRef":"eq. 4.4 (state composition)","difficulty":2,"kind":"concept","tags":["state"],"stem":"GP eq. 4.4 partitions the state σ into 17 components. Which pairing of symbol → meaning is WRONG?","options":["θ → the accumulation output log of the most recent block","ω → the authorizer queue from which each core's pool is refilled","ρ → each core's current availability assignment (a guaranteed but not-yet-available work-report)","ξ → work-packages recently accumulated (one epoch of history)"],"answer":1,"explanation":"σ ≡ (α, β, θ, γ, δ, η, ι, κ, λ, ρ, τ, φ, χ, ψ, π, ω, ξ)。ω 是 ready queue（已 available 但因 dependency 未滿足而等待 accumulate 的 work-report），authorizer queue 是 φ（pool 是 α）。ρ 確實是每個 core 的 availability assignment；ξ 是最近一個 epoch 已 accumulate 的 work-package hash（用來做 dependency 判斷與防重複）；θ 是本區塊的 accumulation output log（(service, hash) pairs），會被 β 的 belt 吸收。","trap":"ω (vartheta) vs φ (phi) 容易混：ω = ready/queued reports，φ = auth queue。"},{"id":"ch04-dependency-graph-alpha","ch":"4","section":"4.2.1 State Transition Dependency Graph","gpRef":"eq. 4.5–4.20","difficulty":2,"kind":"concept","tags":["stf","ordering"],"stem":"In the state-transition dependency graph, the posterior authorizer pool α′ is defined as α′ ≺ (H, E_G, φ′, α). What does this imply for the order of computation inside a block import?","options":["α′ can be computed before any extrinsic is validated, since eq. 4.5–4.20 makes it depend only on the header's timeslot H_T and the prior pool α","α′ must be computed after accumulation, because φ′ (the posterior authorizer queue) is only known once accumulate has run (the `assign` host call may change it)","α′ is independent of the extrinsic and may run in parallel with Safrole, since φ changes only through the `designate` privilege held by the delegator χ_V","α′ must be computed before the guarantees extrinsic is validated, since eq. 11.32 checks each report's authorizer against the posterior pool α′[w_c]"],"answer":1,"explanation":"GP §8.2 明講：「Since α′ is dependent on φ′, practically speaking, this step must be computed after accumulation, the stage in which φ′ is defined.」φ 只能被有 assigner 權限的 service 在 accumulate 裡透過 `assign` host call 修改，所以 α′[c] = ←(F(c) ⌢ φ′[c][H_T mod Q])^O 必須等 accumulation 完成。說 α′ 只依賴 header 與 prior α、可以最先算的選項漏讀了依賴列：eq. 4.5–4.20 裡 α′ ≺ (H, E_G, φ′, α) 有四個輸入，E_G 決定哪些 authorizer hash 要從 pool 移除，φ′ 決定補進來的是什麼。說必須搶在驗 guarantee 之前算 α′ 的選項則把 prior/posterior 反過來了：eq. 11.32 檢查的是 w_a ∈ α[w_c]，用的是 prior 的 pool，本來就不需要 α′。說 φ 只由 `designate` 更動、因此 α′ 可與 Safrole 平行的選項則認錯了 host call 與權限持有者：`designate` 是 delegator χ_V 用來設 ι（validator keys）的，改 authorizer queue φ[c] 的是每個 core 各一位的 assigner χ_A 透過 `assign`。你們的 STF（internal/stf/sft.go）也是在 accumulation 之後才做 α′。","trap":"guarantee 驗證看 prior α；pool 更新用 posterior φ′。"},{"id":"ch04-common-era","ch":"4","section":"4.4 Time","gpRef":"§4.4 (JAM Common Era)","difficulty":1,"kind":"concept","tags":["time"],"stem":"When does the JAM Common Era begin, and why was that particular time of day chosen?","options":["00:00 UTC on 1 January 1970 — the Unix epoch itself, so a JAM timeslot index is simply the current Unix time divided by P = 6 seconds","12:00 UTC on 1 January 2025 — midday ensures every major timezone is on the same calendar date at any exact 24-hour multiple from the epoch start","12:00 UTC on 1 January 2024 — the day the first Gray Paper was published, so the slot index counts from the specification's own birthday","00:00 UTC on 1 January 2025 — a midnight start makes timeslot 0 the first slot of a calendar day, so every 14,400-slot boundary is a date change worldwide"],"answer":1,"explanation":"GP §4.4：「we define the time in terms of seconds passed since the beginning of the JAM Common Era, 1200 UTC on January 1, 2025」（Unix 時間 1,735,732,800 秒後），並直接給出理由：「Midday UTC is selected to ensure that all major timezones are on the same date at any exact 24-hour multiple from the beginning of the common era.」說是 2025 年午夜、理由是「讓每個 14,400 slot 邊界在全世界都是換日」的選項，恰好把 GP 的推理顛倒了：從 00:00 UTC 起算的 24 小時倍數落在 UTC 午夜，那一刻 UTC−5 還停在前一天、UTC+9 已經進入隔天，正是 midday 要避免的分歧。說是 2024 年的選項年份就錯了，而且 GP 從未把 era 綁在自身出版日上。說 era 就是 Unix epoch 的選項與腳註的 1,735,732,800 秒偏移直接衝突——若真如此該偏移就會是 0，JAM 的 slot 也就不是「自 2025 起算」的。timeslot index = 自 Common Era 起的 6 秒週期數，H_T·P ≤ T（wall clock）才有效。","trap":"數字題：1,735,732,800；slot = 6 秒；epoch = 600 slots = 1 小時。"},{"id":"ch04-in-core-vs-on-chain","ch":"4","section":"4.8 The Core Model and Services","gpRef":"§4.9.1–4.9.2","difficulty":1,"kind":"concept","tags":["architecture","refine","accumulate"],"stem":"Which statement correctly contrasts JAM's in-core and on-chain consensus models?","options":["Both are executed by all validators and differ only in pricing: in-core gas is charged per octet of the work-package, while on-chain gas is charged per PVM instruction","In-core computation (refine) is executed by every validator, while on-chain computation (accumulate) is executed only by the block author and replayed by others on a dispute","In-core computation (refine) is stateful and may transfer balances between services; on-chain computation (accumulate) is stateless and accepts arbitrarily large inputs","In-core computation (refine) is executed by a subset of validators and secured by the guarantee/assure/audit/judge game; on-chain computation (accumulate) is executed by all validators"],"answer":3,"explanation":"GP §4.9.1：in-core model 下「only a subset of the network is responsible for actually executing any given computation」，靠 guaranteeing → assuring → auditing →（可能的）judging 這組 crypto-economic game 確保正確性，可達單機約 300 倍的算力；on-chain（accumulate）則是 GP 稱為「everybody does everything」的模型。說 refine 由每個 validator 執行、accumulate 只由出塊者執行的選項把兩邊都顛倒了，而且「只有出塊者算、有爭議才重播」根本不是 JAM 的模型：accumulate 是 STF 的一部分，每個匯入區塊的節點都必須重算才能得到同一個 σ′，否則 H_R 對不上。說 refine 是 stateful 可轉帳、accumulate 是 stateless 接受任意輸入的選項也把兩者說反：§4.9.2 說 refine 是「a sort of high-performance stateless processor, able to accept arbitrary input data」，accumulate 才是「more stateful, providing access to certain on-chain functionality including the possibility of transferring balance」。說兩者都由全體執行、只差在計價方式的選項則錯在差異的本質：GP 說兩者「the primary difference between them one of scalability versus synchroneity」——差別在誰執行與可擴展性，而不是 gas 定價；gas 在兩邊都是 PVM 的計步單位，沒有「按 work-package octet 計費」這種規則。","trap":"refine = stateless / in-core / 大輸入；accumulate = stateful / on-chain / 小輸出。"},{"id":"ch04-balance-timeslot-ranges","ch":"4","section":"4.6–4.7","gpRef":"eq. 4.21 (balance), eq. 4.28 (timeslot)","difficulty":1,"kind":"concept","tags":["types"],"stem":"Which of the following is TRUE about the numeric domains used by JAM?","options":["Balances and timeslots are both N_2^64, with Kusama's 10^12 denomination, putting the protocol's end of life far beyond the year 2840","Balances are N_2^64 with Ethereum's 10^18 denomination; timeslots are N_2^32, which caps total issuance at roughly 18 whole tokens once the denomination applies","Balances are N_2^128 to match Polkadot's 10^10 denomination; timeslots are N_2^64, so the slot index can never wrap and the protocol has no dated end of life","Balances are N_2^64 (u64) with a standard denomination of 10^9 tokens; timeslots are N_2^32, giving the protocol a lifespan into the year 2840"],"answer":3,"explanation":"GP eq. 4.21：N_B ≡ N_2^64，並假設 10^9 為標準面額，因此最多約 18×10^9 tokens。eq. 4.28：N_T ≡ N_2^32，6 秒一 slot，壽命到 2840 年 8 月中。三個干擾項各自把其中一半換錯：說 balance 是 N_2^128 的選項與 eq. 4.21 直接衝突（GP 用 u64 正是為了讓餘額能塞進固定寬度的序列化），且 10^10 是 Polkadot 的面額、被 GP 明文列為「different to」JAM 的對照組；把 timeslot 放大成 N_2^64 也失去 eq. 4.28 的重點——u32 才有「2840 年」這個可算出來的壽命。說面額是 10^18 的選項同樣是 GP 明文對照的 Ethereum 值，不是 JAM 的假設；其後果（18×10^9 tokens 變成 18 顆）正好說明為什麼 GP 選 10^9。說兩者都是 N_2^64、面額 10^12 的選項則錯了三處：timeslot 是 u32、面額是 10^9，而 10^12 是 Kusama 的。","trap":"u64 balance、u32 timeslot、u32 service index。"},{"id":"ch04-coretime-vs-gas","ch":"4","section":"4.8.2 On Services and Accounts","gpRef":"§4.9.2 last paragraphs","difficulty":2,"kind":"rationale","tags":["coretime","authorization"],"stem":"How does JAM replace Ethereum's gas-purchase model for buying blockspace?","options":["Coretime is pre-purchased (Agile-Coretime style) and assigned to an authorization agent; procurement is out of scope of the GP and expected to be handled by a system parachain","Work-package builders sign a transaction that debits their own account on inclusion, exactly as in Ethereum — the one place where JAM keeps a signature-identified transactor","Validators auction each six-second slot to the highest-bidding work-package builder, and the authorization system of §8 exists to settle that auction and pay out the winning bid","Blockspace is metered in gas and debited from the accumulating service's balance a_b as its work-report accumulates; a service whose balance runs dry has its reports dropped"],"answer":0,"explanation":"GP §4.9.2：「In place of Ethereum's gas model for purchasing and measuring blockspace, JAM has the concept of coretime, which is prepurchased and assigned to an authorization agent… Its procurement is out of scope in the present work and is expected to be managed by a system parachain operating within a parachains service itself blessed with a number of cores」。授權代理（authorizer）讓外部行為者不必像 Ethereum 交易那樣自我識別即可提供輸入。說「gas 從 service 餘額扣」的選項混淆了兩件事：gas 在 JAM 只是 PVM 的計量與上限（每個 work-digest 自帶 gas limit、下限是 a_g），從頭到尾沒有任何餘額被扣；帳戶餘額 a_b 的用途是 threshold balance a_t 的門檻與 transfer，不是買 blockspace。說「validator 逐 slot 拍賣」的選項則整個機制不存在：§8 的 authorization system 只維護 authorizer pool α 與 queue φ，判斷的是「這份 work-report 的 authorizer hash 有沒有在該 core 的 pool 裡」（eq. 11.32），沒有出價、沒有拍賣、也不付錢給出塊者。說「builder 簽交易扣自己帳戶」的選項直接違反 §4.9.2 的核心句：「In JAM, these are separated and there is no such concept of a 'transactor'」——JAM 是 transactionless 的，區塊裡根本沒有使用者簽名的交易。這也是 §8 authorization system 的動機：把「買 coretime」和「提交具體工作」解耦。","trap":"面試「design rationale」常問：為什麼要 authorization system？答：同時支援 Ethereum-style 與 Polkadot-style 的互動模式。"},{"id":"ch04-pvm-summary","ch":"4","section":"4.5 The Virtual Machine and Gas","gpRef":"§4.7 The Virtual Machine and Gas, eq. 4.22–4.27","difficulty":1,"kind":"concept","tags":["pvm"],"stem":"Which description of the PVM as summarized in the Overview is correct?","options":["A stack machine derived from WebAssembly with 32-bit words, 16 registers and a linear memory that grows in 64 KiB pages with no inaccessible pages","A RISC-V (RV32IM) based register machine with 16 registers of 32 bits, big-endian, and a flat 64-bit address space that is not paged at all","A RISC-V (RV64EM) based register machine with 13 64-bit registers, little-endian, and a pageable 32-bit address space in 4096-octet pages","An EVM-compatible machine that keeps the Yellow Paper's cryptographic precompiles and environment opcodes in its instruction set, with 256-bit words"],"answer":2,"explanation":"GP §4.5：PVM 以 RISC-V 的 RV64EM 為基礎，13 個 64-bit 暫存器（RISC-V 有 16 個，扣掉 2 個 OS 保留 + 1 個固定為 0）、little-endian、記憶體為 2^32 個 octet 的 pageable RAM，page 大小 Z_P = 2^12 = 4096，每頁可為 mutable(W)、readable(R) 或 inaccessible(∅)。說它是 WebAssembly 風格 stack machine 的選項在架構類別上就錯了：GP 明寫 PVM 是「a very simple RISC register machine」，而且 eq. 4.24 的 access 陣列正是為了讓頁面可以是 ∅（inaccessible），page fault 是 PVM 五種 exit reason 之一，沒有 inaccessible 頁就沒有 fault。說是 RV32IM、16 個 32-bit 暫存器、big-endian、不分頁的選項每一項都與 §4.5 相反：GP 的原文依序給的是 register size (64-bit)、active number (13)、endianness (little)，位址空間則是 32-bit 且分頁。說它保留 EVM 密碼學 precompile 與環境指令的選項恰好否定了 GP 的簡化理由：「the complex instructions for cryptographic operations are missing as are those which deal with environmental interactions」——這些能力一律改走 host call。","trap":"13 registers / 64-bit / 4 KiB pages / 32-bit addressing。"},{"id":"ch04-forks-safrole-grandpa","ch":"4","section":"4.3 Which History?","gpRef":"§4.3","difficulty":1,"kind":"rationale","tags":["consensus"],"stem":"JAM states three goals about forks: (1) two heads should rarely form, (2) when they do they should be resolved quickly, (3) it should be possible to identify a recent block that will remain in history in perpetuity. Which mechanism delivers which goal?","options":["Safrole delivers all three; Grandpa is only used for BEEFY bridging","Safrole delivers (1), Grandpa delivers (3), and both contribute to (2)","Grandpa delivers (1) and (2); Safrole delivers (3)","ELVES auditing delivers (1); Safrole delivers (2); Grandpa delivers (3)"],"answer":1,"explanation":"GP §4.3：「Safrole, which governs the (not-necessarily forkless) extension of the blockchain; and Grandpa, which governs the finalization… the former delivers point 1, the latter delivers point 3 and both are important for delivering point 2.」ELVES 是 in-core 計算安全性的 auditing 機制，與 fork 目標無直接關係。","trap":""},{"id":"ch05-header-fields","ch":"5","section":"5 The Header","gpRef":"eq. 5.1","difficulty":1,"kind":"concept","tags":["header"],"stem":"GP eq. 5.1 defines the header H as a 10-tuple. Which field is NOT part of the header?","options":["H_W — the winning-tickets marker, carrying the next epoch's E = 600 tickets","H_R — the prior state root, which is the parent block's posterior state root","H_B — the BEEFY root committing to this block's own accumulation outputs","H_V — the entropy-yielding VRF signature that feeds the accumulator η_0"],"answer":2,"explanation":"eq. 5.1：H ≡ (H_P parent hash, H_R prior state root, H_X extrinsic hash, H_T timeslot, H_E epoch marker, H_W winning-tickets marker, H_O offenders marker, H_I author index, H_V VRF signature, H_S seal)，共十個欄位。另外三個選項描述的都是真的 header 欄位、而且描述正確：prior state root 依 §5 就是「the parent block's posterior state」；winning-tickets marker 的型別是 ([ticket]_E)?（eq. 5.11），E = 600，裝的正是下一個 epoch 的 slot-sealer tickets；entropy-yielding VRF signature 的輸出 Y(H_V) 正是 entropy accumulator 的輸入（η′_0 ≡ H(η_0 ⌢ Y(H_V))）。BEEFY / accumulation-output root 則不是 header 欄位：本區塊的 accumulation output 進入 β 的 accumulation-output belt（β_B，見 §7），validator 是對 last(β)_b 的 super-peak 做 BLS 簽章（§18 Beefy Distribution），header 裡沒有對應欄位。","trap":"記憶法：p r x t | e w o | i v s。"},{"id":"ch05-prior-state-root","ch":"5","section":"5 The Header","gpRef":"eq. 5.9 (H_r)","difficulty":1,"kind":"rationale","tags":["header","pipelining"],"stem":"Unlike Ethereum and Polkadot, a JAM header commits to the PRIOR state root (H_R = M_σ(σ)) rather than the posterior one. What is the stated reason?","options":["To reduce header size: the extrinsic hash H_X already commits to every input that can change state, so committing a second 32-octet root would be redundant","Because the posterior state root is undefined until the block's work-reports have been audited, and auditing only completes several tranches later","Because Grandpa votes carry the block header alone, which makes the header's prior state root the only place a finalized state root is ever committed","To facilitate pipelining of block computation, in particular of Merklization: the author need not finish Merklizing the new state before publishing the block"],"answer":3,"explanation":"GP §5：「This is a departure from both Polkadot and the Yellow Paper's Ethereum… We do this to facilitate the pipelining of block computation and in particular of Merklization.」實務上 block author 可以先發布區塊，把耗時的 state Merklization 延後到下一個 slot 才需要（下一個區塊的 H_R 才會用到）。後果：β 裡最新一筆的 state root 先填零，由下一個區塊的 β† 用 H_R 補正（eq. 7.5）。說「為了縮小 header」的選項雙重錯誤：prior 與 posterior root 都是 32 octet，換一個並不省空間，而 H_X 只是對 extrinsic 資料的 Merkle commitment（eq. 5.4–5.7），它承諾的是輸入不是結果狀態。說「Grandpa 只投 header、所以 prior root 是唯一被承諾的 state root」也錯：§19 明寫投票內容是 best block 的 header「together with its posterior state root」，正是為了讓下游系統能驗最新狀態。說「posterior root 要等審計完才算得出來」同樣錯：σ′ 由 (σ, B) 完全決定、區塊內就算得出來，auditing 是鏈下流程，只影響 finalization 與 best-chain 選擇，不影響狀態轉換本身。","trap":"設計理念題。延伸：Grandpa vote 會帶 posterior state root（§19）以彌補 header 只有 prior root。"},{"id":"ch05-extrinsic-hash-080","ch":"5","section":"5 The Header","gpRef":"eq. 5.4–5.7 (H_x)","difficulty":3,"kind":"delta","tags":["header","delta-0.8.0","codec"],"stem":"GP 0.8.0 (PR #524) redefined the extrinsic hash H_X = H(E(H#(a))) with a = [E_T(E_T), p, g, E_A(E_A), E_D(E_D)]. How are the preimages (p) and guarantees (g) components formed?","options":["p and g are dropped from a, which is then the three-element sequence [E_T(E_T), E_A(E_A), E_D(E_D)]; preimages and guarantees are committed only via the prior state root","p and g are the full codec encodings of E_P and E_G exactly as the block body carries them, so a commits to every preimage blob and every complete work-report","p encodes the sequence of (E_4(service), H(data)) pairs and g encodes the sequence of (H(work-report), E_4(slot), var(credential)) tuples, each sequence var-length prefixed","p is the Blake2b hash of the concatenated preimage blobs and g is the Keccak hash of the concatenated work-reports, so a carries exactly one 32-octet leaf for each"],"answer":2,"explanation":"GP eq. 5.6–5.7：p = E(var[(E_4(s), H(d)) for (s,d) in E_P])，g = E(var[(H(w), E_4(t), var(a)) for (w,t,a) in E_G])，兩者都是 E(var[…]) 的形狀。GP 為此給的理由（§5）：「taking care to allow for the possibility of reports and preimages to individually have their inclusion proven」——只放 hash，就能用 Merkle proof 證明某個 preimage/report 在區塊裡而不必附上整個 blob。說 p、g 就是 E_P/E_G 的完整編碼、跟 block body 一樣的選項，恰好毀掉這個設計目的：那樣 a 會扛著整包 blob 與整份 report，逐項證明也就無從談起。說 p 是「所有 preimage blob 串接後的 Blake2b」、g 是「所有 report 串接後的 Keccak」的選項有兩個硬錯：H# 是 blake-many、對序列的每個元素各取一次 hash 再編碼，不是對串接結果取一次；而 Keccak 在 JAM 只用於 BEEFY 的 MMR（§18），不出現在 H_X。說 p、g 被移除、a 只剩三個元素的選項也錯：eq. 5.5 的 a 是五個元素，preimages 與 guarantees 正是靠 H_X 而非 state root 進入 header。你們的 code（block_serialization / header hash）在 0.7.2 對 guarantees 已是用 report hash，0.8.0 再把 preimages 改為 (service, blake(data))。","trap":"0.7.2→0.8.0 差異；H# 是 blake-many（對序列每個元素各取 hash 再 encode）。"},{"id":"ch05-timeslot-validity","ch":"5","section":"5 The Header","gpRef":"eq. 5.8","difficulty":1,"kind":"concept","tags":["header","time"],"stem":"Which condition must a block's timeslot H_T satisfy for the block to be considered valid right now?","options":["P(H)_t < H_T ∧ H_T · P ≥ T — strictly greater than the parent's slot, and at or beyond the current wall-clock time T","P(H)_t < H_T ∧ H_T · P ≤ T — strictly greater than the parent's slot, and no later than the current wall-clock time T","P(H)_t ≤ H_T ∧ H_T · P ≤ T — greater than or equal to the parent's slot, and no later than the current wall-clock time T","H_T = P(H)_t + 1 ∧ H_T · P ≤ T — exactly one slot after the parent, and no later than the current wall-clock time T"],"answer":1,"explanation":"GP eq. 5.8：P(H)_t < H_T ∧ H_T·P ≤ T，其中 P = 6 秒、T 為 wall-clock 秒數（自 Common Era）。§5 原文：「A block may only be regarded as valid once the time-slot index H_T is in the past. It is always strictly greater than that of its parent.」把嚴格不等式放寬成「大於或等於 parent」的選項錯在：那會允許同一個 slot 出現兩個父子關係的區塊，正是 Safrole 要排除的 contention，GP 明寫 strictly greater。把 wall-clock 條件寫成 H_T·P ≥ T 的選項方向反了：那等於只接受未來（或剛好當下）的區塊，而 GP 是「不得在未來」，且「Blocks considered invalid by this rule may become valid as T advances」——未來區塊只是暫時無效。要求 H_T 恰好等於 parent + 1 的選項則禁止跳 slot，但沒人出塊時 slot 本來就會被跳過，這也正是 Safrole 必須處理 e′ > e + 1（整個 epoch 被跳過）的原因。你們 STF 裡 `BadSlot` 對應的是 τ ≥ τ′ 的情況。","trap":"跳 slot 是合法的（例如沒人出塊），這也是為什麼 Safrole 要處理 e′ > e+1（整個 epoch 被跳過）的情況。"},{"id":"ch05-author-index","ch":"5","section":"5 The Header","gpRef":"eq. 5.10 (H_i, H_a)","difficulty":2,"kind":"concept","tags":["header","validators"],"stem":"The block author index H_I is an index into which validator set, and how is the author's Bandersnatch key H_A obtained?","options":["Into the staging set ι; H_A = ι[H_I]_b, since ι holds the keys the delegator designates for the very next epoch","Into the prior active set κ; H_A = κ[H_I]_b, and H_A is serialized as an eleventh header field beside H_I","Into the pending set γ_k; H_A = γ_k[H_I]_b, which is why H_I may exceed |κ′| in an epoch's first block","Into the posterior active set κ′; H_A ≡ κ′[H_I]_b, and H_A is NOT serialized — it is merely an equivalence"],"answer":3,"explanation":"GP eq. 5.10：H_I ∈ N_{|κ′|}，H_A ≡ κ′[H_I]_b，「this is merely an equivalence, and is not serialized as part of the header」。用 posterior κ′ 是因為 epoch 交界的第一個區塊由新的 active set 出塊（key rotation 在該區塊內完成）。說索引進 prior κ、而且 H_A 被序列化成第十一個欄位的選項錯兩次：eq. 5.1 的 header 只有十個欄位，H_A 從來不上鏈，驗證者是自己用 κ′ 算出來的。說索引進 pending set γ_k、因此 H_I 可以超過 |κ′| 的選項直接違反 eq. 5.10 的型別 H_I ∈ N_{|κ′|}——索引域永遠是 κ′，不可能超出。說索引進 staging set ι、且 ι 是「下一個 epoch」的 key 的選項則把輪替慢了一輪：eq. 6.14 是 (γ_k′, κ′, λ′, γ_z′) ≡ (Φ(ι), γ_k, κ, z)，ι 要先變成 γ_k、再過一個 epoch 才成為 κ，所以 ι 對應的是「下下個」epoch。你們的 sealing.go 驗 seal/VRF 時傳入的也是 posterior state（code-map 3.2.6 註：參數名叫 priorState 但 STF 傳的是 posterior）。","trap":"epoch 第一個區塊：作者屬於 κ′ = 舊的 γ_k。"},{"id":"ch05-ancestors-lookup-anchor","ch":"5","section":"5 The Header","gpRef":"eq. 5.3 (ancestors A) & §11.4 lookup anchor","difficulty":2,"kind":"concept","tags":["header","ancestry"],"stem":"The GP only requires implementations to store headers of ancestors authored within the previous L = 14,400 timeslots (24 hours). Which on-chain check is the reason this ancestor set A is needed?","options":["Recomputing the fallback slot-sealer sequence F(η′_2, κ′) after a skipped epoch, which needs the entropy VRF H_V of every header in the skipped epoch","Verifying that a guarantee's lookup-anchor block (hash, timeslot and posterior state root) really occurs in the chain, which state σ on its own cannot attest","Verifying that each new block's parent hash H_P is the Blake2b of the parent header, which needs every header back to the last finalized block","Verifying that each availability assurance's anchor matches the parent hash H_P, which needs a search of the retained headers to locate that anchor"],"answer":1,"explanation":"GP eq. 11.38：∀x ∈ contexts: ∃h, h′ ∈ A: h_t = x_l（lookup-anchor time）∧ H(h) = x_l（lookup-anchor hash）∧ h′_p = H(h) ∧ h′_r = x_{l,s}（posterior state root of lookup anchor，0.8.0 新增）。§11.4：「this is one of the few conditions which cannot be checked purely with on-chain state and must be checked by virtue of retaining the series of the last L headers」——lookup anchor 最舊可以到 L = 14,400 slot 之前，而 recent history β 只留 H = 8 個 block，所以非靠 A 不可。其餘三個選項都把「其實不需要 A」的檢查說成需要：parent hash 的驗證（eq. 5.2：H_P ≡ H(E(P(H)))）只用到直接的 parent header 一份，跟 finality 沒有關係，也不必往回留任何東西；assurance 的 anchor 條件（eq. 11.12：a_a = H_P）要求它「等於」H_P，是一次等值比對而不是在保留的 header 裡搜尋；fallback slot-sealer 序列 F(η′_2, κ′)（eq. 6.27）的輸入只有 posterior 的 entropy η′_2 與 validator set κ′ 兩個 state 成分，完全不讀任何歷史 header 的 H_V。這也是 fuzzer 的「Ancestry」feature：M1 必須支援。","trap":"L = 14,400 slots = 24h；recent history H = 8 blocks 是給 anchor 用的，lookup anchor 用 A。"},{"id":"ch05-markers-types","ch":"5","section":"5.1 The Markers","gpRef":"eq. 5.11 (markers)","difficulty":2,"kind":"concept","tags":["header","markers"],"stem":"Which statement about the three header markers (H_E, H_W, H_O) is correct per eq. 5.11?","options":["H_E ∈ (H, H, [(bandersnatch, ed25519)]_V)? ; H_W ∈ ([ticket]_E)? ; H_O ∈ [ed25519 key]? — all three are optional and all three are None outside an epoch's first block","H_E ∈ (H, H, [(bandersnatch, ed25519)]_V)? ; H_W ∈ ([ticket]_E)? ; H_O ∈ [N_V]? — the offenders marker is optional and holds validator indices rather than keys","H_E ∈ ([336-octet validator key]_V)? ; H_W ∈ ([bandersnatch key]_E)? ; H_O ∈ [ed25519 key] — the epoch marker carries whole keys and the winners marker the fallback sealers","H_E ∈ (H, H, [(bandersnatch, ed25519)]_V)? ; H_W ∈ ([ticket]_E)? ; H_O ∈ [ed25519 key] — the offenders marker is a plain sequence that may be empty but is never None"],"answer":3,"explanation":"GP eq. 5.11：H_E ∈ (H, H, [(bandersnatch, ed25519)]_V)?（兩個 entropy hash + 下一 epoch 每個 validator 的 Bandersnatch 與 Ed25519 key，0.6.4 起加入 Ed25519），H_W ∈ ([ticket]_E)?（E = 600 張 tickets），H_O ∈ [ed25519 key]——注意它是不帶 ? 的序列，可以是空序列但永遠不是 None。把 H_O 也寫成 optional、並說三者都只在 epoch 首塊非空的選項錯在兩處：型別上 H_O 沒有 optional 包裝，語意上只要該區塊帶了 culprits 或 faults（§10），H_O 就非空，epoch 中間任何一塊都可能發生。把 H_E 寫成「完整 336-octet validator key」、H_W 寫成「fallback keys」的選項也錯：H_E 只放 (bandersnatch, ed25519) 這對子集合，而 fallback key sequence 是 F(η′_2, κ′) 在鏈上重算的（eq. 6.27），從不放進 H_W；H_W 裝的是 600 張 ticket。把 H_O 寫成 optional 的 validator index 序列的選項則兩點都錯：它裝的是 Ed25519 公鑰而不是 index，且不是 optional。時機：H_E 只在 e′ > e 時非空；H_W 只在同一 epoch 內首次跨越 Y 且 accumulator 飽和時非空。","trap":"H_E 放的是 key 的子集合（bs + ed），不是完整 336-octet key；H_O 放 key 不是 index。"},{"id":"ch06-gamma-components","ch":"6","section":"6.2 Safrole Basic State","gpRef":"eq. 6.3–6.6","difficulty":1,"kind":"concept","tags":["safrole","state"],"stem":"The Safrole state γ ≡ (γ_P, γ_Z, γ_S, γ_A). Which description is correct?","options":["γ_P the ticket accumulator (≤ E tickets) for the next epoch; γ_Z the Bandersnatch ring root over γ_P; γ_S the current epoch's slot-sealer sequence (E tickets or E keys); γ_A the pending validator keys, reset to ι at the start of each epoch","γ_P the previous epoch's validator keys (the λ set); γ_Z the Bandersnatch ring root over the active set κ; γ_S the current epoch's slot-sealer sequence (E tickets or E keys); γ_A the ticket accumulator (≤ E tickets) for the next epoch","γ_P pending validator keys for the next epoch; γ_Z an Ed25519 ring root over γ_P; γ_S the ticket accumulator (≤ E tickets) for the next epoch; γ_A the current epoch's slot-sealer sequence (E tickets or E keys)","γ_P pending validator keys for the next epoch; γ_Z the Bandersnatch ring root over γ_P; γ_S the current epoch's slot-sealer sequence (E tickets or E keys); γ_A the ticket accumulator (≤ E tickets) for the next epoch"],"answer":3,"explanation":"GP eq. 6.3–6.5：γ_P（pending set，每個 epoch 開頭從 ι 重置，決定下一個 epoch 的 ring root）、γ_Z ∈ ring root（由 γ_P 的 Bandersnatch key 組成）、γ_S ∈ [C]_E ∪ [H_B]_E（本 epoch 的 slot-sealer 序列：600 張 ticket 或 fallback 的 600 把 Bandersnatch key）、γ_A ∈ [C]_{:E}（下一個 epoch 用的 ticket accumulator，最多 E 筆）。Safrole 只透過 ι、κ、τ、η 與協定其他部分互動。把 γ_P 說成「上一個 epoch 的 λ」是錯的：λ 是 γ 之外的獨立狀態，γ_P 指向未來而非過去；同一選項把 ring root 說成對 κ 取也錯，eq. 6.14 的 z = O([k_b | k ∈ γ′_P]) 是對 pending set 取。說 γ_Z 是 Ed25519 ring root 同樣錯：ring root 只由 Bandersnatch key k_b 構成。把 γ_S 與 γ_A 對調是常見混淆——γ_S 是**本** epoch 已定案、每個 slot 對應一筆的 sealer 序列，γ_A 則是本 epoch 期間持續累積、供**下**個 epoch 用的 ticket 池。把 γ_P 與 γ_A 對調則違反 6.5/6.6 的型別：accumulator 是 ticket 序列（≤ E 筆），pending set 是 validator key 序列。","trap":"γ_S 有兩種型態（tickets 或 keys），serialization 時用 0/1 discriminator（見 D.1 C(4)）。"},{"id":"ch06-key-rotation","ch":"6","section":"6.3 Key Rotation","gpRef":"eq. 6.14–6.15","difficulty":2,"kind":"concept","tags":["safrole","validators","epoch"],"stem":"On an epoch change (e′ > e), how are the validator key sets rotated per eq. 6.14?","options":["(γ′_P, κ′, λ′, γ′_Z) = (Φ(ι), γ_P, κ, z) where z is the ring root over the Bandersnatch keys of γ′_P and Φ nulls the entire key tuple of any validator whose Ed25519 key is in ψ′_O","(γ′_P, κ′, λ′, γ′_Z) = (Φ(γ_P), κ, λ, γ_Z) where the ring root is only recomputed when ι changes and Φ nulls the keys of offenders in ψ′_O — the sequences advance one step every block","(γ′_P, κ′, λ′, γ′_Z) = (Φ(ι), ι, κ, z) where z is the ring root over the Bandersnatch keys of κ′ and Φ nulls the keys of offenders in the prior ψ_O rather than the posterior set","(γ′_P, κ′, λ′, γ′_Z) = (ι, γ_P, κ, z) where z is the ring root over γ′_P's Bandersnatch keys and no offender filtering is applied — offenders are skipped later by the guarantor assignment"],"answer":0,"explanation":"eq. 6.14：e′ > e 時 (γ′_P, κ′, λ′, γ′_Z) = (Φ(ι), γ_P, κ, z)，其中 z = O([k_b | k ∈ γ′_P])（ring root），否則四者不變。eq. 6.15：Φ(k) 把 k_e ∈ ψ′_O（posterior offenders，因為 disputes 已先處理）的 validator 整組換成全零 key。所以 staging set ι 要等**兩個** epoch 邊界才會成為 active（ι → γ_P → κ）。你們的 KeyRotate() 對應此式；ReplaceOffenderKeys 用的是 posterior ψ_O。「不做 offender 過濾、改由 guarantor 分配跳過」是錯的：eq. 6.15 的 Φ 在 key rotation 當下就把 k_e ∈ ψ′_O 的整把 key 換成全零，§11 的 P(|κ′|, η′_2, τ′) 並沒有排除 offender 的機制。「z 對 κ′ 取、Φ 用 prior ψ_O」錯兩處：ring root 必須對 γ′_P（下個 epoch 的提票 ring）取，且 disputes 先於 Safrole 執行，用的是 posterior ψ′_O。「每個區塊都推進一格、γ′_P = Φ(γ_P)」錯在兩點：輪換只在 e′ > e 發生（否則四者原封不動），且新的 pending set 來源是 staging set ι 而非 γ_P 自身，否則 ι 永遠進不了 κ。","trap":"常考：ι 什麼時候變成 κ？答：下下個 epoch（先進 γ_P，再進 κ）。"},{"id":"ch06-valcount","ch":"6","section":"6.3 Key Rotation","gpRef":"eq. 6.7–6.8 (valcount)","difficulty":2,"kind":"delta","tags":["safrole","validators","delta-0.8.0"],"stem":"GP 0.8.0 (PR #514) generalized the validator-set size. Which sizes are permitted for ι, γ_P, κ and λ?","options":["Any multiple of 3 between 3 and 3·C − 3 = 1020 inclusive (N_V ≡ {3c | c ∈ N_{1..C}})","Any multiple of 3 between 6 and 3·C = 1023 inclusive (N_V ≡ {3c | c ∈ N_{2..C+1}})","Any size between 6 and 1023 inclusive, with no divisibility rule (N_V ≡ N_{6..3·C+1})","Exactly 1023 validators always — the size is the fixed constant 3·C with C = 341 cores"],"answer":1,"explanation":"eq. 6.8：N_V ≡ {3c | c ∈ N_{2…C+1}}，即 6, 9, 12, …, 1023；§6.3：「The length of each sequence is always a multiple of 3 between 6 and 3C.」每個 active core 需要 3 個 guarantor，所以只有前 |κ′|/3 個 core 是 active（§11.3）。這是 0.7.2→0.8.0 的重大變化：很多常數改成依 |κ| 計算（例如 super-majority ⌊2|κ|/3⌋+1、tickets per validator n = ⌈2E/|γ′_P|⌉、erasure shards = |κ′|）。你們 repo 的 issue #1037 就是在追這個變動。「恆為 1023」是 0.7.2 的世界觀：0.8.0 之後 ι、γ_P、κ、λ 各自的長度都可以是 N_V 裡的任一值（designate host call 也只要求 z ∈ N_V）。「6 到 1023 但沒有整除限制」錯在「3 的倍數」是硬條件——每個 active core 固定配 3 個 guarantor，非 3 的倍數會讓 |κ′|/3 不整除。「3 到 1020」則是兩端各差一格：c 從 2 起算所以下界是 6（至少要能服務 2 個 core），c 上限使 3c 達到 3·C = 1023。","trap":"tiny 模式 V=6、C=2；full V=1023、C=341（1023 = 3·341）。"},{"id":"ch06-validator-key-layout","ch":"6","section":"6.3 Key Rotation","gpRef":"eq. 6.9–6.13","difficulty":1,"kind":"concept","tags":["safrole","validators","codec"],"stem":"A validator key K is a 336-octet sequence. What is the layout?","options":["Bandersnatch 32 | Ed25519 32 | BLS 144 | metadata 128","Bandersnatch 33 | Ed25519 32 | BLS 143 | metadata 128","Bandersnatch 32 | BLS 144 | Ed25519 32 | metadata 128","Ed25519 32 | Bandersnatch 32 | BLS 96 | metadata 176"],"answer":0,"explanation":"eq. 6.9–6.13：k_b = k[0..32)（Bandersnatch）、k_e = k[32..64)（Ed25519）、k_l = k[64..208)（BLS，144 octets）、k_m = k[208..336)（metadata，128 octets，opaque，用來放例如網路位址等實務識別資訊）。32+32+144+128 = 336。","trap":"BLS 144 octets（BLS12-381 上的 key 組合）。metadata 不參與任何密碼學運算。"},{"id":"ch06-entropy-update","ch":"6","section":"6.4 Sealing and Entropy Accumulation","gpRef":"eq. 6.22–6.24","difficulty":2,"kind":"concept","tags":["safrole","entropy"],"stem":"How is the entropy accumulator η updated in each block, and on an epoch change?","options":["η′_0 = H(η_0 ⌢ Y(H_V)) every block; the history rotates every block as well, so (η′_1, η′_2, η′_3) = (η_0, η_1, η_2) holds unconditionally and η_3 is always three blocks old","η′_0 = H(η_0 ⌢ Y(H_V)) every block, folding in the entropy VRF's output; on e′ > e additionally (η′_1, η′_2, η′_3) = (η_0, η_1, η_2), otherwise (η_1, η_2, η_3) unchanged","η′_0 = H(η_0 ⌢ H_V) every block, hashing the whole VRF signature rather than its 32-byte output; on e′ > e additionally (η′_1, η′_2, η′_3) = (η_0, η_1, η_2), otherwise unchanged","η′_0 = H(η_0 ⌢ Y(H_S)) every block, folding in the seal's VRF output; on e′ > e additionally (η′_1, η′_2, η′_3) = (η′_0, η_1, η_2), pushing the posterior accumulator into the history"],"answer":1,"explanation":"eq. 6.23：η′_0 ≡ H(η_0 ⌢ Y(H_V))——用 **prior** η_0 與 H_V 的 VRF **輸出** Y(·)（不是簽章本身）做 Blake2b。eq. 6.24：e′ > e 時 (η′_1, η′_2, η′_3) = (η_0, η_1, η_2)（注意推入的是 prior η_0），否則三者不變。H_V 的簽章 context 是 X_E ⌢ Y(H_S)（eq. 6.18），也就是 seal 的 VRF 輸出，因此 entropy 是「先固定訊息、再產生」的 bias-resistant 來源。你們 UpdateEtaPrime0() / UpdateEntropy() 分別對應 6.23 / 6.24。把整個 H_V 簽章而不是 Y(H_V) 餵進 hash 是錯的：6.23 取的是 VRF **輸出**（App. G 定義為 output 的前 32 bytes），簽章本身並非該 VRF 的 unbiasable 隨機值。用 Y(H_S) 同樣錯：seal 的輸出只拿來當 H_V 的 context（6.18）並與 ticket id 比對，累積進 η_0 的是 H_V 的輸出；那個選項還把 rotate 的來源寫成 posterior η′_0，這正是 6.24 最常見的實作 bug——η′_1 會混進本塊的 entropy。「history 每塊都 rotate」則違反 6.24 的 case 條件（只有 e′ > e 才 rotate）：若每塊都推，η_2 就不再是「上上個 epoch 結束時的累積值」，ticket context 與 fallback 種子都會逐塊漂移。","trap":"H_V 的輸出餵 η′_0；H_S 的輸出（Y(H_S)）只作為 H_V 的訊息與 ticket id 比對。"},{"id":"ch06-which-eta-where","ch":"6","section":"6.4 Sealing and Entropy Accumulation","gpRef":"eq. 6.16–6.18, 6.25, 6.30, 11.22","difficulty":3,"kind":"concept","tags":["safrole","entropy"],"stem":"Each of η′_2 and η′_3 has specific uses in GP 0.8.0. Which assignment is correct?","options":["η′_1: ticket ring-proof context (X_T ⌢ η′_1 ++ r) and fallback key sequence F(η′_1, κ′); η′_2: verifying the seal signature context (X_T ⌢ η′_2 ++ i_e); η′_3: the guarantor assignment shuffle P(|κ′|, η′_3, τ′)","η′_0: ticket ring-proof context (X_T ⌢ η′_0 ++ r) and the guarantor assignment shuffle; η′_1: fallback key sequence F(η′_1, κ′) and seal verification; η′_2 and η′_3 are kept solely to populate the epoch marker H_E","η′_2: verifying the seal signature context (X_T ⌢ η′_2 ++ i_e or X_F ⌢ η′_2); η′_3: ticket ring-proof context (X_T ⌢ η′_3 ++ r), fallback key sequence F(η′_3, κ′), guarantor assignment shuffle","η′_2: ticket ring-proof context (X_T ⌢ η′_2 ++ r), fallback key sequence F(η′_2, κ′), guarantor assignment shuffle; η′_3: verifying the seal signature context (X_T ⌢ η′_3 ++ i_e or X_F ⌢ η′_3)"],"answer":3,"explanation":"tickets 在 epoch N 提交時用 η′_2（eq. 6.30 的 ring proof context X_T ⌢ η′_2 ++ r）；到 epoch N+1 驗 seal 時，那個值已經被 rotate 成 η′_3（eq. 6.16：X_T ⌢ η′_3 ++ i_e；6.17：X_F ⌢ η′_3），這就是 §6.4 說的「The oldest is used to regenerate this randomness when verifying the seal」。fallback F(η′_2, κ′)（6.25）與 guarantor 分配 P(|κ′|, η′_2, τ′)（11.22）都用 η′_2；§11.3 解釋不用 η_1 是為了避免 epoch 末尾狀態不確定造成 fork magnification。epoch marker H_E 帶的是 (η_0, η_1)（prior 值，rotate 後即 η′_1, η′_2）。把兩者整組對調（seal 用 η′_2、提票與 fallback 用 η′_3）方向剛好相反；把三個用途各往前挪一格（提票用 η′_1、驗 seal 用 η′_2、guarantor 用 η′_3）則是 entropy rotation 的 off-by-one——11.22 明寫 G ≡ (P(|κ′|, η′_2, τ′), Φ(κ′))，用的是 η′_2。「η′_0 到處用、η′_2 與 η′_3 只是給 epoch marker」也錯：η′_0 每塊都被 6.23 改寫，拿它當 ring proof context 會使同一 epoch 內每塊 context 都不同、ticket 根本無法預先提交；而 H_E 裝的是 prior (η_0, η_1)，不是 η′_2/η′_3。","trap":"口訣：提 ticket 用 η2，驗 seal 用 η3（同一個值晚一個 epoch）。"},{"id":"ch06-seal-ticket-condition","ch":"6","section":"6.4 Sealing and Entropy Accumulation","gpRef":"eq. 6.16 (ticket seal)","difficulty":3,"kind":"concept","tags":["safrole","seal"],"stem":"When γ′_S is a sequence of tickets, the seal H_S must satisfy three conditions (eq. 6.16), with i = γ′_S[H_T mod E]. Which set is exactly right?","options":["i = H_A (the sealer entry is the author's own Bandersnatch key); H_S is a Bandersnatch signature by H_A over context X_F ⌢ η′_3 with message E_U(H) (the unsigned header); and the block is marked T = 0","i_y = H(H_S), the Blake2b hash of the seal bytes; H_S is a ring-VRF proof against γ′_Z over context X_T ⌢ η′_3 ++ i_e with message E(H) (the full header); and the block is marked T = 1 (ticketed)","i_y = Y(H_S); H_S is a Bandersnatch signature by H_A over context X_T ⌢ η′_3 ++ i_e with message E_U(H) (the unsigned header); and the block is marked T = 1 (ticketed)","i_y = Y(H_S); H_S is a Bandersnatch signature by H_A over context X_T ⌢ η′_2 ++ i_e with message E_U(H) (the unsigned header); and the block is marked T = 1 (ticketed)"],"answer":2,"explanation":"eq. 6.16：γ′_S ∈ [C] ⇒ { i_y = Y(H_S)（seal 的 VRF 輸出必須等於該 slot ticket 的 id，證明出塊者就是持票人）, H_S ∈ F^{X_T ⌢ η′_3 ++ i_e}_{H_A}(E_U(H)), T = 1 }。seal 是一般（IETF）Bandersnatch VRF 簽章，不是 ring VRF——ring 只在提交 ticket 時用。「i = H_A、context X_F ⌢ η′_3、T = 0」是 fallback 的情況（eq. 6.17）；context 寫成 X_T ⌢ η′_2 是錯的（提 ticket 才用 η′_2）。你們的 sealing.go ValidateByBandersnatchs 就是檢查 Y(H_S) == ticket id。把 i_y 寫成 H(H_S) 也錯：6.32 的 ticket id 是 VRF **輸出** Y(·)，不是簽章 bytes 的 hash；同一選項把訊息寫成 E(H)（完整 header）更是循環定義——header 本身含 H_S，簽章不可能簽進自己，6.16 用的是省略 seal 的 E_U(H)。","trap":"E_U(H) = 不含 H_S 的 header 序列化；H_V 則是 context X_E ⌢ Y(H_S)、訊息為空 []。"},{"id":"ch06-slot-sealer-cases","ch":"6","section":"6.5 The Slot-Sealer Sequence","gpRef":"eq. 6.25","difficulty":2,"kind":"concept","tags":["safrole","fallback"],"stem":"The posterior slot-sealer sequence γ′_S has three cases. A block arrives with e′ = e + 1, the previous block was at slot phase m = 480 (< Y = 500) and γ_A holds 600 tickets. What is γ′_S?","options":["Z(γ_A) — the outside-in ordering of the accumulator, because e′ = e + 1 and |γ_A| = E both hold and the m ≥ Y clause constrains m′, the new block's phase, not the prior block's","γ_S — unchanged, because the second case of eq. 6.25 covers any block whose prior still sat inside the same epoch's ticket-submission window, and only m ≥ Y forces a fresh sequence","F(η_2, κ) — fallback keys, because m = 480 < Y does select the third case, but F is seeded with the prior η_2 and the prior active set κ that were in force while the previous block was authored","F(η′_2, κ′) — fallback keys, because eq. 6.25's first case also needs m ≥ Y and the prior block's phase is still inside the ticket-submission window, so the contest never closed"],"answer":3,"explanation":"eq. 6.25：γ′_S ≡ Z(γ_A) 當 e′ = e+1 ∧ m ≥ Y ∧ |γ_A| = E；γ_S 當 e′ = e；否則 F(η′_2, κ′)。三個條件缺一不可：這裡 m = 480 < Y = 500，表示前一個區塊還在 ticket 提交期內、比賽尚未「結束」，因此雖然 accumulator 已滿也不能用（沒有任何區塊經歷過 m ≥ Y 來封閉比賽）。fallback 用 **posterior** η′_2 與 κ′。同理若跳過整個 epoch（e′ ≥ e+2）也走 fallback。你們 UpdateSlotKeySequence() 的三段 if 完全對應。把 m ≥ Y 讀成 m′ ≥ Y 是最常見的誤讀：6.25 的 m 出自 τ（prior 的 slot phase），這個門檻是要確認「比賽在上一塊時就已結束」；若改看 m′，本塊自己跨過 Y 就會提前套用 accumulator。「γ_S 不變」的條件是 e′ = e（同一 epoch），本題 e′ = e+1 已不適用，與 submission window 無關。fallback 的參數必須是 posterior：epoch 第一塊完成 key rotation 後 κ′（= 舊 γ_P）才是本 epoch 的 active set，η′_2 也已 rotate 過，用 (η_2, κ) 會算出完全不同的 600 把 key。","trap":"面試愛問邊界：(1) 跳過整個 epoch；(2) accumulator 未滿；(3) 前一塊 m < Y。全部都是 fallback。"},{"id":"ch06-outside-in-Z","ch":"6","section":"6.5 The Slot-Sealer Sequence","gpRef":"eq. 6.26 (Z)","difficulty":1,"kind":"calc","tags":["safrole","tickets"],"stem":"With a tiny epoch of E = 6 and a sorted accumulator γ_A = [a, b, c, d, e, f] (ascending ticket ids), what is Z(γ_A)?","options":["[a, f, b, e, c, d]","[a, b, c, d, e, f]","[a, c, e, f, d, b]","[f, a, e, b, d, c]"],"answer":0,"explanation":"eq. 6.26：Z(s) = [s_0, s_{n−1}, s_1, s_{n−2}, …]，「outside-in」交錯取頭尾。所以 [a,b,c,d,e,f] → [a,f,b,e,c,d]。目的：最佳（最小 id）的 ticket 與最差的 ticket 交錯散佈到整個 epoch，避免某段時間集中由同一批 validator 出塊。你們的 OutsideInSequencer() 用 left/right 兩個指標實作。","trap":"第一個 slot 是最小 id（s_0），第二個是最大 id。"},{"id":"ch06-fallback-F","ch":"6","section":"6.5 The Slot-Sealer Sequence","gpRef":"eq. 6.27 (F)","difficulty":2,"kind":"concept","tags":["safrole","fallback"],"stem":"The fallback key sequence F(r, k) selects, for each slot index i ∈ N_E, the Bandersnatch key k[…]_b of which validator?","options":["k[ i mod |k| ] — a plain round-robin over the key sequence, with the entropy r used only to choose the sequence's starting offset once per epoch rather than per slot","k[ decode_4( H_K(r ⌢ E_4(i))[0..4] ) mod |k| ] — Keccak-256 of the entropy concatenated with the 4-byte LE slot index, first 4 bytes decoded, modulo the validator count","k[ decode_8( H(r ⌢ E_8(i))[0..8] ) mod |k| ] — Blake2b of the entropy concatenated with the 8-byte LE slot index, first 8 bytes decoded, modulo the validator count","k[ decode_4( H(r ⌢ E_4(i))[0..4] ) mod |k| ] — Blake2b of the entropy concatenated with the 4-byte LE slot index, first 4 bytes decoded, modulo the validator count"],"answer":3,"explanation":"eq. 6.27：F(r, k) = [ k[decode_4(H(r ⌢ E_4(i))_{…4})]_b | i ∈ N_E ] 並對 |k| 取循環索引（cyclic ⟲）。H 是 Blake2b（GP 的預設 hash），E_4(i) 是 4-byte little-endian。你們 FallbackKeySequence() 用 Blake2bHashPartial(…, 4) 再 %ValidatorsCount（註解裡殘留的「Keccak256」字樣是 stale comment——面試時別被自己的註解誤導）。「round-robin、entropy 只決定起始偏移」錯得最徹底：F 是逐 slot 獨立抽樣，同一個 validator 可能被抽中多次、也可能整個 epoch 都沒被抽到；round-robin 會讓誰在哪個 slot 出塊完全可預測，正好毀掉 fallback 想保留的不可預測性。Keccak（H_K）在 GP 只用於 accumulation-output belt 與 BEEFY，§3.8 的 H 是 Blake2b-256。8-byte 版本錯兩處：E_4(i) 是 4-byte little-endian 序列化，且取的是 hash 的**前 4** octets（notation：s_{…4} 表示前 4 個元素）。","trap":"fallback 下 seal 用 X_F context，且 H_A 必須等於 γ′_S[H_T mod E]（eq. 6.17：i = H_A）。"},{"id":"ch06-epoch-marker","ch":"6","section":"6.6 The Markers","gpRef":"eq. 6.28","difficulty":2,"kind":"concept","tags":["safrole","markers"],"stem":"What exactly does the epoch marker H_E contain in the first block of a new epoch (e′ > e)?","options":["(η′_0, η′_1, [(k_b, k_e) | k ∈ κ′]) — the posterior η′_0 and η′_1 plus the Bandersnatch and Ed25519 keys of the validators that have just become active in this epoch","(η_2, η_3, [(k_b, k_e) | k ∈ ι]) — the two oldest historical entropies plus the Bandersnatch and Ed25519 keys of the staging set exactly as the designate host call left it","(η_0, η_1, Z(γ_A)) — the prior η_0 and η_1 plus the outside-in ordered ticket identifiers, one per timeslot, that will seal each slot of the coming epoch","(η_0, η_1, [(k_b, k_e) | k ∈ γ′_P]) — the prior η_0 and η_1 plus the Bandersnatch and Ed25519 keys of the pending validators γ′_P who take over in the next epoch"],"answer":3,"explanation":"eq. 6.28：H_E ≡ (η_0, η_1, [(k_b, k_e) | k ∈ γ′_P]) 當 e′ > e，否則 ∅。η_0 與 η_1 是 **prior** 值（rotate 後就是 η′_1, η′_2，也就是下個 epoch 提 ticket 與 fallback 會用的 entropy），加上 γ′_P（下一個 epoch 的 pending set，已經 Φ 過濾）的 Bandersnatch + Ed25519 key。目的（§6.6）：讓不同步完整 state 的節點（light client）只靠 header 鏈就能追蹤 validator 變化。你們 ValidateHeaderEpochMark（InvalidEpochMark = code 9）檢查此式。換成 posterior (η′_0, η′_1) 是錯的：η′_0 已經摻進本塊的 VRF 輸出，而 marker 要公告的正是 rotate 之後會成為 η′_1、η′_2 的那兩個值，也就是 prior 的 η_0、η_1；同一選項把 key 來源寫成 κ′（本 epoch 剛生效的 active set）也錯，marker 的目的是預告**下一個** epoch，因此帶的是 γ′_P。(η_2, η_3) 又更舊兩格，與下個 epoch 的提票 context 或 fallback 種子都無關；把 key 來源寫成未經 Φ 過濾的 ι，會讓 light client 收到 offender 尚未歸零的 key。至於 Z(γ_A)，那是 winning-tickets marker H_W（6.29）的內容，與 H_E 是 header 裡兩個彼此互斥的欄位。","trap":"H_E 放 γ′_P 不是 κ′；entropy 是 prior η_0/η_1。"},{"id":"ch06-winning-tickets-marker","ch":"6","section":"6.6 The Markers","gpRef":"eq. 6.29","difficulty":2,"kind":"concept","tags":["safrole","markers"],"stem":"Under which exact condition is the winning-tickets marker H_W non-empty?","options":["e′ > e ∧ m ≥ Y ∧ |γ_A| = E — the first block of a new epoch, once the previous epoch's tail has been reached and the accumulator is saturated; then H_W = Z(γ_A)","e′ = e ∧ Y ≤ m < m′ ∧ |γ_A| = E — every block of the epoch's tail after ticket submission has already closed, provided the accumulator is saturated; then H_W = Z(γ_A)","e′ = e ∧ m < Y ≤ m′ ∧ |γ_A| ≥ 1 — the first block of the same epoch whose slot phase crosses the tail start Y, with any non-empty accumulator; then H_W = Z(γ_A)","e′ = e ∧ m < Y ≤ m′ ∧ |γ_A| = E — the first block of the same epoch whose slot phase crosses the tail start Y, with a saturated accumulator; then H_W = Z(γ_A)"],"answer":3,"explanation":"eq. 6.29：H_W ≡ Z(γ_A) 當 e′ = e ∧ m < Y ≤ m′ ∧ |γ_A| = E，否則 ∅。即「同一 epoch 內，前一塊 phase 在 Y 之前、本塊 phase 在 Y 之後（含）」的那一個區塊，且 accumulator 已飽和，就把下個 epoch 的最終 ticket 序列公告在 header。若 accumulator 未滿則沒有 H_W（下個 epoch 將走 fallback）。注意若 epoch 尾端沒有任何區塊跨越 Y（例如 m = 480 直接跳到下個 epoch），H_W 永遠不會出現。「e′ > e ∧ m ≥ Y」錯在 marker 是同一 epoch 內的跨越事件：一旦進入新 epoch 才公告已經太遲（6.25 在該塊就已定案 γ′_S），而那組條件描述的其實是 slot-sealer 序列的第一個 case。「Y ≤ m < m′、整個 tail 每塊都帶」錯在 m < Y 這個下界：只有從提交期跨進 tail 的那一塊帶 marker，其後 tail 區塊一律 ∅，否則同一份序列會被重複公告。「|γ_A| ≥ 1 就夠」錯在飽和條件：Z 的定義域是長度 E 的序列，accumulator 未滿時下個 epoch 直接走 fallback，沒有 winning tickets 可公告。","trap":"H_W 與 H_E 互斥：H_W 要 e′ = e，H_E 要 e′ > e。"},{"id":"ch06-ticket-extrinsic-limits","ch":"6","section":"6.7 The Extrinsic and Tickets","gpRef":"eq. 6.30–6.32","difficulty":2,"kind":"delta","tags":["safrole","tickets","delta-0.8.0"],"stem":"Per GP 0.8.0, what bounds apply to the tickets extrinsic E_T?","options":["|E_T| ≤ E = 600 summed across the whole epoch rather than per block; each entry index e < n where n = ⌈2E / |γ′_P|⌉ — so 2 in the full configuration (E = 600, |γ′_P| = 1023)","|E_T| ≤ K = 16 in every block including those in the tail; each entry index e < N = 2, a fixed constant that does not depend on the validator-set size (E = 600, |κ| = 1023)","|E_T| ≤ K = 16 when m′ ≤ Y, otherwise |E_T| = 0; each entry index e < n where n = ⌈|γ′_P| / 2E⌉ — so 1 in the full configuration (E = 600, |γ′_P| = 1023)","|E_T| ≤ K = 16 when m′ < Y, otherwise |E_T| = 0; each entry index e < n where n = ⌈2E / |γ′_P|⌉ — so 2 in the full configuration (E = 600, |γ′_P| = 1023)"],"answer":3,"explanation":"eq. 6.30：E_T ∈ [(r ∈ N_n, p ∈ ring proof over γ′_Z with context X_T ⌢ η′_2 ++ r)]，n = ⌈2E/|γ′_P|⌉——0.8.0 (#527) 把原本的常數 N 改成公式，「To ensure the accumulator can be saturated, when there are fewer validators, each validator is permitted more tickets」。full：⌈2·600/1023⌉ = 2；test-vector 的 tiny 配置（E = 12、|γ′_P| = 6）：⌈24/6⌉ = 4（0.7.x 的 tiny 常數是 3，這是遷移時要改的點）。eq. 6.31：|E_T| ≤ K = 16 當 m′ < Y，否則必須為 0（tail 期間不能再提 ticket）。「每塊都能提 16 張、tail 也不例外」直接違反 6.31 的第二個 case；該選項把 entry index 上限寫成固定常數 N = 2，正是 0.7.2 的舊寫法。「|E_T| ≤ E = 600 是整個 epoch 的總量」錯在 K 限制的是**單一區塊**的 extrinsic 大小，GP 對整個 epoch 的提交總量沒有直接上限（真正的天花板來自 accumulator 只留最低 E 筆）。「m′ ≤ Y」把嚴格不等式放寬一格：m′ = Y 的那一塊已在 tail 內、必須是空 extrinsic；而 ⌈|γ′_P| / 2E⌉ 把比例整個倒過來，會變成 validator 越多每人配額越少，與「when there are fewer validators, each validator is permitted more tickets」的方向相反。","trap":"條件是 m′ < Y（本塊的 phase），K = 16 是每個區塊的上限，不是每個 epoch。"},{"id":"ch06-ticket-accumulator-rules","ch":"6","section":"6.7 The Extrinsic and Tickets","gpRef":"eq. 6.33–6.36","difficulty":2,"kind":"concept","tags":["safrole","tickets"],"stem":"Which statement about the new tickets n and the posterior accumulator γ′_A is FALSE?","options":["Tickets with higher ids are preferred, so γ′_A keeps the highest E entries","Every submitted ticket must appear in γ′_A — a ticket that would be evicted by the accumulator's cap is useless and makes the extrinsic invalid","γ′_A is the lowest E entries of the sorted union of n and (γ_A, or ∅ if e′ > e)","n must be sorted ascending by ticket id and contain no duplicates, and no id in n may already be in γ_A"],"answer":0,"explanation":"eq. 6.33：n 依 id 排序且唯一；6.34：n 的 id 與 γ_A 不相交；6.35：γ′_A = ←(sort_by_id(n ∪ (∅ if e′ > e else γ_A)))^E，即取**最低** E 筆（→ 記號 ^E 取前 E 個）；6.36：n ⊆ γ′_A，「It is invalid to include useless tickets in the extrinsic」。所以「保留最高 E 筆」是錯的：accumulator 留下的是排序後**最低**的 E 個 ticket id（§6.7「the accumulator becomes the lowest items of the sorted union」）。注意 §6.2 的行文說 γ_A 是「highest-scoring ticket identifiers」——GP 兩處措辭方向相反，實作以 6.35 的公式為準。你們 CreateNewTicketAccumulator() 排序後取 [:E]，GetPreviousTicketsAccumulator 在 e′ > e 時回傳空 accumulator。","trap":"「score」= ticket id（VRF 輸出），數值小者勝。"},{"id":"ch06-ticket-proof-context","ch":"6","section":"6.7 The Extrinsic and Tickets","gpRef":"eq. 6.30, 6.32","difficulty":2,"kind":"concept","tags":["safrole","tickets","vrf"],"stem":"A ticket proof p in E_T is a Bandersnatch ring-VRF proof. Against which ring root, with what context, and what is the ticket identifier?","options":["Against γ′_Z (the posterior ring root), context X_T ⌢ η′_2 ++ r, empty message []; the ticket id is the VRF output Y(p)","Against γ_Z (the prior ring root), context X_T ⌢ η′_3 ++ r, message E_U(H) (the unsigned header); the ticket id is the Blake2b hash H(p)","Against the Ed25519 keys of κ′ (the active set), context X_T ⌢ η_0 ++ r, empty message []; the ticket id is the proof p itself","Against γ′_Z (the posterior ring root), context X_E ⌢ Y(H_S), message E_U(H) (the unsigned header); the ticket id is the VRF output Y(p)"],"answer":0,"explanation":"eq. 6.30：p ∈ F̄^{X_T ⌢ η′_2 ++ r}_{γ′_Z}([])，ring proof 的驗證 root 是 γ′_Z（若本塊是 epoch 第一塊，γ′_Z 已換成新 pending set 的 root，因此 ticket 會針對**新** ring 驗證）；訊息為空序列；eq. 6.32：ticket id y = Y(p)（VRF 輸出），r 是 entry index。ring proof 讓驗證者知道「某個 γ′_P 成員」擁有此 ticket，但不知道是誰——匿名性的來源。你們 createSignatureContext 就是 \"jam_ticket_seal\" + η′_2(32B) + attempt(1B)。改用 prior γ_Z 會在 epoch 第一塊整批誤判（ring root 當塊就換成新 pending set 的）；context 取 η′_3 是驗 seal 才用的值，訊息取 E_U(H) 會把 ticket 綁死在某一顆 header 上、失去「先提交、後開票」的性質，id 取 H(p) 也錯——6.32 取的是 VRF 輸出而非 proof bytes 的 hash。ring 由 γ′_P 的 **Bandersnatch** key 組成，拿 κ′ 的 Ed25519 key 當驗證集合連曲線與集合都不對，而把 proof 本身當 id 會失去唯一性（proof 可被重新隨機化，VRF output 不行）。X_E ⌢ Y(H_S) 則是 H_V 的 context（6.18），提票當下根本還沒有 H_S 存在。","trap":"ring VRF 用在 ticket；一般 VRF 用在 seal 與 H_V。"},{"id":"ch06-seal-fallback","ch":"6","section":"6.4 Sealing","gpRef":"eq. 6.17–6.18","difficulty":2,"kind":"concept","tags":["safrole","seal","fallback"],"stem":"In fallback mode (γ′_S is a sequence of Bandersnatch keys), which checks apply to the header?","options":["γ′_S[H_T mod E] must equal H_A; no seal is required in fallback mode, there being no ticket identifier to bind it to; T = 0; and H_V alone is checked, with context X_E ⌢ η′_3 over []","γ′_S[H_T mod E] must equal the author's Ed25519 key; H_S is a ring-VRF proof against γ′_Z with context X_F ⌢ η′_3 over E_U(H); T = 1; and H_V is still required with context X_E ⌢ Y(H_S) over []","γ′_S[H_T mod E] must equal H_A; H_S is a Bandersnatch signature by H_A with context X_F ⌢ η′_3 over E_U(H); T = 0; and H_V is still required with context X_E ⌢ Y(H_S) over []","γ′_S[H_T mod E] must equal H_A; H_S is a Bandersnatch signature by H_A with context X_F ⌢ η′_2 over E_U(H); T = 0; and H_V is still required with context X_E ⌢ Y(H_S) over E_U(H)"],"answer":2,"explanation":"eq. 6.17：γ′_S ∈ [H_B] ⇒ { i = H_A, H_S ∈ F^{X_F ⌢ η′_3}_{H_A}(E_U(H)), T = 0 }。eq. 6.18 對兩種模式都適用：H_V ∈ F^{X_E ⌢ Y(H_S)}_{H_A}([])。X_F = $jam_fallback_seal、X_T = $jam_ticket_seal、X_E = $jam_entropy。T = 0 表示此塊「安全性較低」，§19 best-chain 規則會偏好 ticket-sealed 祖先較多的鏈。context 寫成 X_F ⌢ η′_2 是錯的：η′_2 是提票時用的值，驗 seal 一律用 rotate 之後的 η′_3；同一選項把 H_V 的訊息寫成 E_U(H) 也錯，6.18 的訊息是空序列 []，header 只透過 context 裡的 Y(H_S) 被綁定。「γ′_S 的項要等於 Ed25519 key、H_S 是 ring proof、T = 1」三處都錯：fallback 下 γ′_S ∈ [H_B]_E 是 Bandersnatch key 序列（6.6），ring proof 只用於提票，T 則是 ticket-sealed 標記、fallback 必為 0。「fallback 不需要 seal」更是根本誤解：6.17 仍要求 H_S ∈ F^{X_F ⌢ η′_3}_{H_A}(E_U(H))，沒有 seal 就無從證明作者確實持有該 slot 指定的 key，且 H_V 的 context 是 X_E ⌢ Y(H_S) 而非 η′_3。","trap":"fallback 的 entropy 仍然每塊更新（H_V 必填）。"},{"id":"ch06-code-slot-key-sequence","ch":"6","section":"6.5 The Slot-Sealer Sequence","gpRef":"eq. 6.25 — internal/safrole/sealing.go UpdateSlotKeySequence","difficulty":2,"kind":"code","tags":["safrole","code"],"stem":"This is the team's implementation of γ′_S. Which claim about it is correct?","code":{"lang":"go","caption":"internal/safrole/sealing.go (UpdateSlotKeySequence)","src":"if ePrime == e+1 && len(gammaA) == types.EpochLength && int(slotIndex) >= types.SlotSubmissionEnd {\n    // Z(γa) if e′ = e + 1 ∧ m ≥ Y ∧ |γa| = E\n    newGammaS.Tickets = OutsideInSequencer(&gammaA)\n} else if ePrime == e { // γs if e′ = e\n    newGammaS = cs.GetPriorStates().GetGammaS()\n} else { // F(η′2, κ′) otherwise\n    newGammaS.Keys = FallbackKeySequence(etaPrime[2], posteriorState.GetKappa())\n}\nposteriorState.SetGammaS(newGammaS)"},"options":["`slotIndex` should be m′ — the phase of the block being imported, H_T mod E — because eq. 6.25 asks whether the contest has closed by the current block; reading the prior block's τ mod E is an off-by-one","`slotIndex` is m — the slot phase of the PRIOR block (τ mod E) — and `gammaA` is the prior accumulator; `etaPrime[2]` and `posteriorState.GetKappa()` are posterior values, matching F(η′_2, κ′)","The first branch should also fire when ePrime ≥ e + 2 provided |γ_A| = E and m ≥ Y, since accumulated tickets stay valid until they are consumed; restricting it to e + 1 forces fallback needlessly","The fallback branch should pass the prior κ together with the prior η_2, since the incoming validators only gain authoring rights from the second block of the epoch onwards"],"answer":1,"explanation":"eq. 6.25 的條件是 m ≥ Y，m 是 **prior** block 的 phase（τ / E 的餘數），不是 m′——因為要確認「比賽已在前一塊之前結束」。F 的參數是 η′_2 與 κ′（posterior）：epoch 第一塊 key rotation 之後 κ′ = 舊 γ_P 才是本 epoch 真正的 active set。e′ = e+2（跳過整個 epoch）必須走 fallback，因為 accumulator 裡的 ticket 是為「e+1」那個 epoch 準備的（ring root/entropy 都不對）。把 slotIndex 換成 m′ 會讓「跨過 Y 的那一塊」立刻開票，等於少等一整段 tail；6.25 明寫 m（來自 τ），這正是 fuzzer 愛打的邊界。fallback 傳 prior (η_2, κ) 同樣錯：epoch 第一塊完成 6.14 的輪換後，κ′ 就是本 epoch 的 active set，用 κ 會把上一個 epoch 的 validator 排進本 epoch 的 sealer 序列。e′ ≥ e+2 不能套第一個 case：那些 ticket 的 ring proof 是針對「e+1 那個 epoch 的 γ′_Z」產生的，跳過整個 epoch 後 ring root 與 η 都已再度 rotate。","trap":"你們的 OuterUsedSafrole 先做 UpdateEntropy、KeyRotate，再做 UpdateSlotKeySequence——順序正是為了讓 η′_2、κ′ 就位。"},{"id":"ch06-code-fallback-hash","ch":"6","section":"6.5 The Slot-Sealer Sequence","gpRef":"eq. 6.27 — internal/safrole/slot_key_sequence.go","difficulty":2,"kind":"code","tags":["safrole","code","fallback"],"stem":"Read the team's FallbackKeySequence. Which statement is accurate about its conformance to eq. 6.27?","code":{"lang":"go","caption":"internal/safrole/slot_key_sequence.go","src":"for i = 0; i < epochLength; i++ {\n    serial := utils.SerializeFixedLength(i, 4)          // E_4(i)\n    concatenation := append(entropy[:], serial...)      // r ⌢ E_4(i)\n    // H4 : Keccak256(serializedBytes) -> See section 3.8 , take only the first 4 octets of the hash,\n    hash := hash.Blake2bHashPartial(concatenation, 4)\n    validatorIndex, _ := utils.DeserializeFixedLength(types.ByteSequence(hash), types.U32(4))\n    validatorIndex %= (types.U32(types.ValidatorsCount))\n    keys[i] = validators[validatorIndex].Bandersnatch\n}"},"options":["The hash is right — Blake2b is the GP's H and the first 4 octets are decoded little-endian — but eq. 6.27's cyclic subscript reduces modulo the length of the key sequence passed in, i.e. |κ′|, whereas the code reduces modulo the compile-time constant ValidatorsCount","The slice is wrong — eq. 6.27's subscript takes the LAST four octets of H(r ⌢ E_4(i)) and decodes them big-endian, so Blake2bHashPartial(·, 4) reads the wrong end — while the modulus over ValidatorsCount matches the equation's cyclic subscript exactly","The reduction is spurious — decode_4 of four Blake2b octets already lands inside N_E and eq. 6.27 carries no modulus at all, so `%= ValidatorsCount` is an invented step that can map two distinct slots onto the same validator and break one-slot-one-author","The hash is wrong — §3.8 reserves H for Blake2b-256 but eq. 6.27 calls for H_K, Keccak-256, exactly as the surviving comment says — while the modulus is right, since the cyclic subscript reduces over the fixed validator count that ValidatorsCount holds"],"answer":0,"explanation":"eq. 6.27：k[decode_4(H(r ⌢ E_4(i))_{…4})]_b，外面套 ⟲（cyclic 索引）——也就是對**傳入的 key 序列長度** |k| = |κ′| 取模。H 是 Blake2b（§3.8：H ≡ Blake2b-256；H_K 才是 Keccak，只用在 accumulation-output belt 與 BEEFY）。這段 code 有兩個要點：(1) 註解寫 Keccak256 是 stale，實際呼叫的是 Blake2bHashPartial，行為正確；(2) `%= types.ValidatorsCount` 用的是編譯期常數，在 0.7.2（|κ| 恆等於 V）沒問題，但 0.8.0 允許 |κ| 變動後就必須改成 len(κ′)——這正是 issue #1037 要處理的一類問題。「GP 這裡用 Keccak」是被 stale 註解帶偏——§3.8 的 H 就是 Blake2b-256，H_K 另有用途；該選項還宣稱「對固定 validator 數取模是對的」，在 0.8.0 同樣不成立。「取最後 4 octets、大端解碼」兩處都錯：GP 序列記法的 s_{…4} 是**前** 4 個元素，且 decode/E_n 一律小端。「不必取模」則忽略了 6.27 外層的 ⟲（cyclic）下標：decode_4 的值域是 0…2³²−1，遠大於 |k|，不取模必然越界。順帶一提，取模讓不同 slot 撞到同一個 validator 是 fallback 的正常行為而非缺陷——F 本來就是可重複抽樣。","trap":"面試官可能直接問：你們 fallback 用哪個 hash？答 Blake2b，並指出註解錯誤。"},{"id":"ch06-code-entropy-order","ch":"6","section":"6.4 Sealing and Entropy","gpRef":"eq. 6.23–6.24 — internal/safrole/sealing.go UpdateEntropy","difficulty":2,"kind":"code","tags":["safrole","code","entropy"],"stem":"In the team's UpdateEntropy, why is `eta[0]` overwritten with the posterior η′_0 AFTER the rotation loop, and what would go wrong if the loop ran after UpdateEtaPrime0 wrote into the same array?","code":{"lang":"go","caption":"internal/safrole/sealing.go","src":"eta := cs.GetPriorStates().GetEta()\nif ePrime > e {\n    for i := 2; i >= 0; i-- {\n        eta[i+1] = eta[i]          // (η′1, η′2, η′3) = (η0, η1, η2)\n    }\n}\n// This make sure we won't overwrite eta0\neta[0] = cs.GetPosteriorStates().GetEta0()\ncs.GetPosteriorStates().SetEta(eta)"},"options":["Because the descending loop is what stops η_0 from being copied into all three history slots; the write to eta[0] is independent of eq. 6.24 and could equally well run before the rotation","Because eq. 6.24 is stated over posterior values, (η′_1, η′_2, η′_3) = (η′_0, η′_1, η′_2), so η′_0 must be settled first and the assignment after the loop is a compensating fix-up for the wrong order","Because eq. 6.24 re-seeds the accumulator on an epoch change: η′_0 has to be reset after the rotation so the new epoch starts from a clean value, which is exactly what writing eta[0] last achieves","Because eq. 6.24 rotates the PRIOR η_0 into η′_1; if η′_0 (already hashed with this block's VRF output) were rotated instead, η′_1 would wrongly include the current block's entropy"],"answer":3,"explanation":"eq. 6.24：(η′_1, η′_2, η′_3) ≡ (η_0, η_1, η_2)——右側全是 **prior** 值。η′_0 = H(η_0 ⌢ Y(H_V))（6.23）則包含本塊的 VRF 輸出。若先把 η′_0 寫進 eta[0] 再 rotate，η′_1 會變成 H(η_0 ⌢ Y(H_V))，導致下個 epoch 的 ticket context（用 η′_2）與 fallback 都算錯，state root 立刻 mismatch。這種「prior vs posterior」的細節正是 fuzzer 最常抓到的 bug 類型。「epoch 換手時 η′_0 要歸零重新播種」在 GP 沒有依據：6.23 每一塊都照 H(η_0 ⌢ Y(H_V)) 更新，epoch 邊界也不例外。「倒序迴圈才是重點、寫 eta[0] 的時機無所謂」則正好說反：倒序確實避免了覆蓋，但**時機**才是這段程式的核心，先寫就會把本塊 entropy 推進 η′_1。「6.24 右邊是 posterior」同樣錯：右邊是 (η_0, η_1, η_2) 三個 prior 值；若真按 (η′_0, η′_1, η′_2) 遞推，三格歷史會在一次 epoch 轉換中被同一個值填滿。","trap":"所有 Safrole 式子都要先問：右邊是 prior 還是 posterior？"},{"id":"ch07-beta-structure","ch":"7","section":"7 Recent History","gpRef":"eq. 7.1–7.4","difficulty":2,"kind":"concept","tags":["recent-history","state"],"stem":"In GP 0.8.0 the recent-history state is β ≡ (β_H, β_B). What does each recent block entry in β_H hold, and what is β_B?","options":["Each β_H entry: (header hash, posterior state root, extrinsic hash, timeslot); β_B is the set of BEEFY signatures gathered over the last H = 8 blocks, which is what lets a bridge prove finality without following the header chain","Each β_H entry: (header hash h, state root s, accumulation-output-log super-peak b, timeslot t, dictionary p of reported work-package hash → segment root); β_B is the accumulation-output belt, an MMR of per-block accumulation-output roots","β_H is a single rolling hash committing to the last H = 8 headers, so recent history costs only 32 octets of state; β_B is the four-entry entropy accumulator, rotated at each epoch boundary and re-seeded from every header's VRF output","Each β_H entry: (header hash, state root, timeslot, list of the hashes of every work-report guaranteed in the block); β_B is the sequence of the last H = 8 block headers, retained so that a lookup-anchor can be resolved straight out of state"],"answer":1,"explanation":"eq. 7.2：β_H ∈ [(h ∈ H, s ∈ H, b ∈ H, t ∈ N_T, p ∈ D⟨H→H⟩)]_{:H}，H = 8。t（timeslot）是 0.8.0 新增欄位（配合 refinement context 的 anchor slot，#526）。p 是本塊 E_G 中每個 work-package hash → 其 segment root（exports root），供之後 report 的 prerequisite / segment-root lookup 驗證用。eq. 7.3：β_B ∈ [H?]（MMR 的 peaks，∅ 表示空 peak），用 Keccak。eq. 7.4：θ ∈ [(N_S, H)] 是本塊的 accumulation output（service, hash）序列。干擾項的錯誤各不相同：「extrinsic hash 進 β」錯——H_X 只存在 header（eq. 5.1、5.4），β 的 item 不含它，且 β_B 是 Keccak MMB、裡面全是 accumulation-output root，一個簽章都沒有（BEEFY 的 BLS 簽章 eq. 18.1 是鏈下散布的，不進狀態）。「p 是 work-report hash 的清單、β_B 存最近 8 個 header」錯——eq. 7.8 建的是 package hash ↦ segment root 的 dictionary，eq. 11.44 就是靠 value 驗 segment root；lookup anchor 要用 ancestor set A（保留 L = 14,400 個 header）解析，狀態裡從來沒有 header 序列。「β_H 只是一個 rolling hash、β_B 是 entropy accumulator」錯——eq. 7.1–7.2 明寫 β_H 是最多 8 筆 tuple 的序列（C(3) 逐筆編碼），entropy accumulator 是另一個狀態項 η ∈ [H]_4（C(6)），與 β 無關。","trap":"0.8.0 β_H 有 5 個欄位（多了 timeslot）；p 的 value 是 segment root 不是 report hash。"},{"id":"ch07-beta-dagger","ch":"7","section":"7 Recent History","gpRef":"eq. 7.5 & 7.8","difficulty":2,"kind":"concept","tags":["recent-history","pipelining"],"stem":"Why does the newest β_H entry get state root s = H_0 (the zero hash) at the end of block N, and how is it corrected?","options":["Because β_H entries carry no state root at all: eq. 7.2 declares an item as ⟨h, b, t, p⟩ and the zero hash is only a placeholder that C(3) skips, so eq. 11.36 matches an anchor on its header hash, super-peak and timeslot alone","Because the root goes into β_B instead: each block appends its own posterior state root as the belt's next leaf, so the β_H item can leave s at H_0 permanently and an anchor's state root is checked against b","Because the posterior state root of block N is not yet known when β′ is computed (the header carries the prior root); block N+1 computes β† by overwriting the last entry's s with its own H_R (eq. 7.5) before anything reads β","Because a state root only matters once the block is finalized: the entry keeps H_0 until Grandpa finalizes block N, at which point the finality gadget writes the real root into that entry and eq. 11.36 starts accepting anchors on it"],"answer":2,"explanation":"eq. 7.8：新 entry 為 (H(H), H_0, super-peak(β′_B), H_T, p)，§7 說明「The new state-trie root is the zero hash, which is inaccurate but safe since β′ is not utilized except to define the next block's β†」。eq. 7.5：β† ≡ β_H except β†[|β_H|−1]_s = H_R。所以每個 block 一開始（在驗 guarantee 的 anchor 之前）先用自己的 H_R 補正父塊的 state root。這是 header 帶 prior state root（pipelining）的直接後果。你們的 STF 在 τ′ 與 header check 之後、disputes 之前就算 β†。三個干擾的具體錯誤：「等 Grandpa 敲定後由 finality gadget 回填」錯——STF 是確定性函數，finality 從不回寫狀態，補正者是「下一個區塊」用自己的 H_R（eq. 7.5）；「eq. 7.2 的 item 根本沒有 s 欄位、C(3) 會略過零雜湊」錯——eq. 7.2 明列 s ∈ H 為第二個具名欄位，附錄 D 的 C(3) 編成 ⟨h, b, s, E_4(t), var(p)⟩，s 佔滿 32 bytes，而 eq. 11.36 也確實比對 x_s = y_s；「state root 改存進 β_B」錯——eq. 7.6–7.7 往 belt append 的 leaf 是 M_B(s, H_K)、s 由 θ′ 編碼而來，跟 state root 無關，且 eq. 11.36 是 x_s 對 y_s、x_b 對 y_b 兩個獨立比較。","trap":"guarantee 的 anchor 檢查（eq. 11.36）比對的是 β†（補正後），不是 β。"},{"id":"ch07-belt-keccak","ch":"7","section":"7 Recent History","gpRef":"eq. 7.6–7.7","difficulty":2,"kind":"rationale","tags":["recent-history","mmr","beefy"],"stem":"The accumulation-output belt β′_B = A(β_B, M_B(s, H_K), H_K) uses Keccak (H_K) rather than Blake2b. What is s and why Keccak?","options":["s = [E_4(service) ⌢ E(hash) for each (service, hash) in θ′]; Keccak is used 'to maximize compatibility with legacy systems'","s = the encoded header of the block being appended; Keccak is required because the Bandersnatch ring VRF transcript is defined over it","s = [H(g_w) for each guarantee g ∈ E_G]; Keccak is mandated so that Grandpa's finality votes can be checked by the same bridge contracts","s = the sequence of every work-report hash guaranteed in this block; Keccak is chosen because it costs less PVM gas than Blake2b"],"answer":0,"explanation":"eq. 7.6：s = [E_4(s) ⌢ E(h) | (s,h) ∈ θ′]；eq. 7.7：β′_B ≡ A(β_B, M_B(s, H_K), H_K)——先用 well-balanced binary Merkle（M_B）以 Keccak 算出本塊 accumulation output 的 root，再用 MMR append（附錄 E.2）接到 belt 上。§7：「Throughout, the Keccak hash function is used to maximize compatibility with legacy systems」——EVM 有便宜的 keccak256 precompile，BEEFY（§18）就是對這個 belt 的 super-peak 做 BLS 簽章給外部系統（bridge）用。你們的 recent_history_controller / mmr 都用 Keccak。實務上的理由就是 EVM 有便宜的 keccak256 precompile，bridge 合約驗 belt 幾乎不花錢。干擾項的錯處：s 的來源必須是 θ′（本塊 accumulation output 的 (service, hash) 序列），不是 E_G 的 work-report hash、也不是 header——report hash 只出現在 header 的 H_X（eq. 5.7）與 guarantee 簽章訊息裡；「Keccak 比較省 PVM gas」與「Bandersnatch ring VRF transcript 規定用 Keccak」都不是 GP 給的理由，附錄 G 的 VRF 有自己的建構、與 belt 的雜湊選擇無關；「給 Grandpa 的票用」也錯，簽 super-peak 的是 BEEFY 的 BLS 簽章（eq. 18.1：X_B ⌢ last(β_H)_b），Grandpa 完全不碰 belt。","trap":"belt 是 MMR（append-only，peaks 序列），super-peak（E.2）才是單一 32-byte commitment。"},{"id":"ch07-purpose","ch":"7","section":"7 Recent History","gpRef":"§7 & eq. 11.36, 11.41–11.44","difficulty":1,"kind":"concept","tags":["recent-history"],"stem":"What is the primary purpose of retaining the H = 8 most recent blocks in β_H, according to the GP?","options":["To preclude duplicate or out-of-date work-reports: a guarantee's refinement-context anchor must appear in β† and its work-package hash must not already be a key of any recent block's reported-package map","To store the last 8 posterior state roots so that Grandpa voters can compare candidate chains without re-executing them, β_B holding the matching BLS signatures over those roots","To seed the fallback slot-sealer sequence: when the ticket contest falls short, F draws E = 600 Bandersnatch keys and the hashes of the last 8 blocks in β_H supply the randomness for that draw","To let light clients follow the chain without state: β_H is the only place the last H = 8 header hashes are kept, so a client walks them backwards instead of reading H_P out of each header"],"answer":0,"explanation":"§7 第一句：「This is used to preclude the possibility of duplicate or out of date work-reports from being submitted.」具體用途：(1) eq. 11.36：refinement context 的 anchor (hash, state root, belt super-peak, timeslot) 必須匹配 β† 的某一筆——所以 anchor 最多只能是 8 個區塊之前；(2) eq. 11.41：新 report 的 package hash 不得出現在任何 β 條目的 p 裡（防重複）；(3) eq. 11.42 / 11.44：prerequisites 與 segment-root lookup 必須在 extrinsic 或 β 的 p 裡找得到。干擾項各自的硬傷：「light client 靠 β_H 才能往回走」錯，每個 header 自己就帶 H_P ≡ H(E(P(H)))（§5），光憑 header 鏈即可回溯，β 是狀態、light client 反而拿不到；「β 的 header hash 當 fallback sealer 的亂數種子」錯，fallback key sequence F 的種子是
