 reconstructing the bundles as per the recovery function」（附錄 H：任意 d(v) ≈ v/3 + 1 個 chunk 即可還原）。§17.2：bundle 內含 work-package、extrinsic data、imported segments 與其 justification；「Exported segments need not be reconstructed in the same way, but rather should be determined… through the execution of the Refine logic」——這也是為什麼「exported segments 隨 bundle 一起送來、不必重跑 refine」的說法一定錯：重跑 refine 正是審計的核心動作，M(w, p) 要求 w = Ξ(p, w_c, w_l, …) 逐欄位相符，光有資料而不重算根本沒有審到。「向 block author 要、他必須存 28 天」的說法還錯在保存責任歸屬：持有 chunk 的是 assurer 不是出塊者（§16），而且 28 天是 exported-segment 那個長期 D³L store 的期限，audit DA store 裡的 bundle 是短命的，assurer「只保存到該區塊 finality 為止」（§14）。「從 on-chain state 的 preimages 讀 segments」的說法搞錯了資料所在：鏈上只放 work-report 與它的 availability specification（erasure-root、segment-root 等 hash），segment 本身從不進 state；preimage 是另一套設施（§9.2），與 availability system 無關。「請另外兩個 guarantor 重簽」的說法則是循環論證：guarantor 的簽名正是審計要檢驗的對象，ELVES 的安全性建立在獨立重算上，不是再收集一次同一批人的背書。§17.3 確實允許直接向 guarantor 要完整 bundle 當捷徑，但「If this data cannot be decoded or verified however, we must fall back to reconstruction from erasure-coded chunks」，而且拿到之後一樣要重跑 refine。最後把 work-package specification 的每個欄位重算並比對——「essentially retracing the guarantors steps」。","trap":"審計 = 重跑 computereport 並比對整個 report；解不出 bundle 本身就代表 report 無效。"},{"id":"c3-appE-wb-vs-constant-depth","ch":"E","section":"E.1 Binary Merkle Trees & E.2 MMR","gpRef":"eq. E.1 (N), E.3 (M_B), E.4 (M), E.7 (C); eq. 11.5 (segment-root a_e); §14 availability specifier (erasure-root a_u)","difficulty":3,"kind":"rationale","tags":["merklization","segment-root","erasure-root","rationale"],"stem":"Appendix E gives two general Merkle root functions: the well-balanced M_B and the constant-depth M. In an availability specification the segment-root a_e is built with one of them and the erasure-root a_u with the other. Which way round is it, and what does the well-balanced shape buy over simply padding every tree up to a power of two?","options":["Both roots use M; M_B is only a thin wrapper that hashes a lone item and otherwise defers to the node function N. Padding up to a power of two is exactly what makes a tree well-balanced, the '$leaf' versus '$node' prefixes are the only substantive difference between the two root functions, and the erasure-root's leaves are single 32-octet chunk hashes rather than 64-octet pairs.","The other way round: the segment-root uses M_B because a segment is 4,104 octets and M_B avoids hashing each item, while the erasure-root uses M because the chunk count is fixed at the validator-set size, so a constant-depth tree is cheaper to build. M_B applies the '$leaf' prefix in its own base case, so no separate preprocessor is needed, and well-balancedness only matters for very short sequences where log₂ rounding wastes one level.","Both roots use M_B; the constant-depth function exists only for the state trie of appendix D, whose 31-octet keys already fix the depth, and the preprocessor C is that trie's key-padding step. The well-balanced shape is preferred because it gives every leaf the same proof length, which a power-of-two-padded tree cannot do once the item count is not itself a power of two, so J_6/L_6 page over the trie rather than over a general Merkle tree.","The segment-root uses M: the preprocessor C rewrites every item as H('$leaf' ⌢ s) and pads to 2^⌈log₂ n⌉ zero-hash leaves, so all leaves sit at one depth and 64-leaf pages stay size-aligned for J_6/L_6. The erasure-root uses M_B, whose leaves are already 64-octet hash pairs, so pre-hashing would be wasted and splitting at ⌈|v|/2⌉ keeps the deepest level — and the count of leaves on it — minimal."],"answer":3,"explanation":"GP 0.8.0 eq. 11.5 的說明文字寫得很白：segment-root a_e 是「a constant-depth, left-biased and zero-hash-padded binary Merkle tree committing to the hashes of each of the exported segments」，也就是 M（eq. E.4）＝ N(C(v,H),H)；C（eq. E.7）先把每個 item 換成 H('$leaf' ⌢ v_i)，再用 zero hash H_0 補到 2^⌈log₂ max(1,|v|)⌉。這兩件事缺一不可：先雜湊 leaf 才不會讓 justification 夾帶一整個 4,104-octet segment；補到 2 的冪次才會有 size-aligned 的 2^6 page，讓 eq. 14.12 的 paged-proofs 函數 P（GP 就叫 P，勿與 eq. 11.21 的 permute P 或 eq. 14.19 的 zero-pad 𝒫_n 混淆）能用 J_6/L_6 一次證明 64 個 segment。erasure-root a_u 走的是另一條路：§14 的 availability specifier 定義 a_u = M_B([⌢x | x ∈ ᵀ[b♣, s♣]])，每片 leaf 已經是「bundle chunk 的 Blake2b ⌢ 該 validator segment 欄的 M_B root」共 64 octets，再 pre-hash 一次純屬多做；而 GP 對 well-balanced 的定義是「ensures that the maximum depth of any leaf is minimal and that the number of leaves at that depth is also minimal」，v = 1023 時不必補成 1024 片。把兩者對調的說法剛好違反 eq. 11.5 原文；說「常深度樹只給 appendix D 用」也錯，D 的是 binary Patricia Merkle Trie，跟 E 的兩個函數是不同東西；而「well-balanced 讓每個 leaf proof 一樣長」正好相反——N 在 ⌈|v|/2⌉ 切，|v| = 5 時 index 0 的 trace 長 3、index 3 的長 2，長度本來就不齊，齊的是 constant-depth 那個。另外 M_B 的 padding 說法也不存在：M_B 完全不 padding。干擾新增的主張同樣站不住：說 M_B 會在自己的 base case 加上 '$leaf' 前綴、因此不需要獨立的 preprocessor 的那個，與 eq. E.3 相反（base case 是 H(v_0)，沒有任何前綴；加 '$leaf' 並補零的是 eq. E.7 的 constancy preprocessor C）；說把 C 當成 appendix D 那棵 trie 的 key padding 步驟、J_6/L_6 因此分頁在 trie 上的那個，混淆了兩個附錄——D 的是 binary Patricia Merkle Trie，其 31-octet key 根本不經過 C，而 eq. E.5/E.6 的 J_x/L_x 明確定義在 C(v, H) 之上；說 erasure-root 的 leaf 是單一 32-octet chunk hash 的那個也錯，§14 的 a_u = M_B([⌢x | x ∈ ᵀ[b♣, s♣]])，每片 leaf 是 bundle chunk hash 與該 validator segment 欄 root 接起來的 64 octets。","trap":"口訣：segment-root 走「先 $leaf 再補 0」的定深樹（要分頁證明），erasure-root 走「不補不預雜湊」的均衡樹（leaf 本來就是 hash）。"},{"id":"c3-appE-code-trace-split","ch":"E","section":"E.1 Binary Merkle Trees & E.2 MMR","gpRef":"eq. E.1 (N), E.2 (trace T), E.5–E.6 (J_x, L_x), E.7 (C); eq. 14.12 (paged proofs)","difficulty":3,"kind":"code","tags":["merklization","justification","proof-path","bug"],"stem":"Below is the team's trace function, the one that produces the sibling nodes of an inclusion justification. In the same file the node function N splits its input with `mid := (len(v) + 1) / 2`. Reading the two together, what is the defect and where does it actually bite?","code":{"lang":"go","caption":"internal/utilities/merkle_tree/merkle_tree.go (T) — compare with N in the same file","src":"func T(v []types.ByteSequence, i types.U32, hashFunc func(types.ByteSequence) types.OpaqueHash) (output []types.ByteSequence) {\n\tif len(v) <= 1 {\n\t\treturn output\n\t}\n\tmid := types.U32(len(v) / 2)\n\tvar siblingHalf []types.ByteSequence\n\tvar traverseHalf []types.ByteSequence\n\tvar newIndex types.U32\n\n\tif i < mid {\n\t\tsiblingHalf = v[mid:]  // right is sibling\n\t\ttraverseHalf = v[:mid] // go left\n\t\tnewIndex = i\n\t} else {\n\t\tsiblingHalf = v[:mid]  // left is sibling\n\t\ttraverseHalf = v[mid:] // go right\n\t\tnewIndex = i - mid\n\t}\n\tsibling := N(siblingHalf, hashFunc)\n\tsuffix := T(traverseHalf, newIndex, hashFunc)\n\tresult := make([]types.ByteSequence, 0, 1+len(suffix))\n\tresult = append(result, sibling)\n\tresult = append(result, suffix...)\n\treturn result\n}"},"options":["It is fine as written: for a well-balanced tree the two rounding conventions describe the same tree, because N recurses on the very halves this function walks. The only genuine divergence from the GP is ordering — the returned sequence runs from the leaf upwards, whereas the GP emits the opposite nodes from the root downwards, so reversing the slice at the CE 140 call site is the whole of the fix.","The recursion descends into the sibling half rather than the half that contains the target index, so the returned co-path is the mirror image of the correct one. Lengths always match the GP's, which is why unit tests on proof length pass while verification against a root fails. Page proofs escape it because a power-of-two tree is symmetric, so only the CE 140 co-path is affected.","It omits the '$node' domain-separation prefix when folding a sibling into the path, so the hashes it returns cannot be recombined into the root; the fix is to prepend the prefix inside this function rather than relying on the node function to do it. Odd-length levels are unaffected, since both functions round the split the same way, and page proofs fail exactly as often as direct calls do.","It rounds the split down while the GP — and this file's own node function — round it up, so at any recursion level of odd length the siblings and even the path length are wrong: for three items at index 0 the GP yields two nodes and this yields one. Page proofs escape it because C has already padded to a power of two, but the direct call that builds the CE 140 segment-shard co-path does not."],"answer":3,"explanation":"GP eq. E.1 的 N 在 ⌈|v|/2⌉ 切：N(v,H) = H('$node' ⌢ N(v_{…⌈|v|/2⌉},H) ⌢ N(v_{⌈|v|/2⌉…},H))；eq. E.2 的 trace T 用同一個 ⌈|v|/2⌉ 決定 P^⊤（含 i 的那半）與 P^⊥（兄弟那半）以及 P_I 的位移。程式裡 N 寫成 `(len(v)+1)/2` 是對的（ceil），但 T 寫成 `len(v)/2` 是 floor，兩者在長度為奇數時分岔。以 v = [a,b,c]、i = 0 為例：GP 的樹是 ((a,b),c)，正解 co-path 為 [N([c]), N([b])] 共兩層；這份程式取 mid = 1，兄弟半變成 [b,c]、只遞迴 [a]，回傳長度 1 的 [N([b,c])]，內容與長度全錯，proof 永遠對不回 root。為什麼平常沒炸：J_x（eq. E.5）先呼叫 C（eq. E.7）把序列補到 2 的冪次才丟給 T，之後每一層都是偶數，floor 與 ceil 相同，所以 work_package.go 走 eq. 14.12 的 paged-proofs P(s) 分頁證明沒事；真正踩雷的是 networking/handler/ce/ce140.go 的 constructMerkleCoPath，它把未補齊的 segment-shard 序列直接餵給 T。說「兩種取整等價」不成立，正因為同檔案的 N 用的是另一種取整；說「遞迴走進兄弟半、長度仍正確」也錯，程式明明是 traverseHalf 才遞迴，而且長度就是會少；說「少了 '$node' prefix」更不對，prefix 由 N 自己加，T 只是收集 N 的輸出。干擾新增的尾巴也各自可證偽：說「把回傳的 slice 在 CE 140 呼叫端反轉就修好了」的那個，前提本身不成立——這份程式是先 append sibling 再接遞迴結果，順序本來就是由 root 往下，與 eq. E.2 一致，順序從來不是缺陷；說「補到 2 的冪次後樹是對稱的，所以分頁證明逃過一劫」的那個，對稱性救不了「往兄弟半遞迴」這種錯，那在任何長度都錯，而分頁證明真正逃過的原因是 C 補齊後每層長度皆為偶數、floor 與 ceil 相同；說「兩個函式取整方式相同、所以奇數長度沒事、分頁證明也一樣會壞」的那個，正好把事實反過來說——N 是 `(len(v)+1)/2`、T 是 `len(v)/2`，而分頁證明因為先過 C 所以不會壞。","trap":"看到 Merkle 程式先問一句：ceil 還是 floor？GP 全篇一律 ⌈|v|/2⌉，只要 root 與 proof 用不同取整，偶數長度測資會全綠、奇數長度全紅。"},{"id":"c3-appE-mmb-peaks-superpeak","ch":"E","section":"E.1 Binary Merkle Trees & E.2 MMR","gpRef":"eq. E.8 (A), E.9 (E_M), E.10 (M_R); eq. 7.3, 7.7–7.8; §18 Beefy Distribution","difficulty":2,"kind":"concept","tags":["mmr","mmb","accumulation-log","beefy"],"stem":"The Accumulation Output Log β_B is a sequence of optional hashes rather than a single root, yet every recent-history entry stores only one 32-octet value b derived from it. Why does state keep the whole peak sequence, and what is that single value used for?","options":["The append function A carries like binary addition — an occupied slot n is folded with the incoming leaf and carried into slot n+1, an empty slot ∅ is simply filled — but the peak sequence itself is only a cache, since a node can rebuild it from the last H recent-history entries whenever it needs a proof; the single value is the Blake2b well-balanced root M_B taken over the peaks, kept in β_H purely so light clients can check the log without replaying accumulation, and Beefy signs the state root rather than that value.","The append function A pushes exactly one new peak per block and drops the oldest once the sequence exceeds H entries, exactly like the recent-history ring buffer, so the peaks are a bounded window rather than a growing commitment and old outputs simply age out of provability; the single stored value is the Keccak hash of the encoded peak sequence E_M(β_B), which enters β_H and is what third parties treat as the bridging commitment and BLS-sign for Beefy.","The append function A carries like binary addition — an occupied slot n is folded with the incoming leaf and carried into slot n+1, an empty slot ∅ is simply filled — so the peaks are exactly the state needed to keep appending and to serve O(log N) inclusion proofs; hashing them away would end appendability, which is why the separate super-peak M_R (a left-associated Keccak fold over the non-∅ peaks under a '$peak' prefix) is the one 32-octet value that enters β_H and is BLS-signed for Beefy.","The append function A carries like binary addition — an occupied slot n is folded with the incoming leaf and carried into slot n+1, an empty slot ∅ is simply filled — and the peaks are kept so that the log can be rewound on a fork, since removing the last leaf only ever requires dropping one peak; the single value is the well-balanced Keccak root over the accumulation outputs of that one block, which is what enters β_H and is BLS-signed for Beefy, so the peak sequence itself never leaves the node."],"answer":2,"explanation":"GP 附錄 E 的 MMR/MMB 段落：「a sequence of peaks, each peak the root of a Merkle tree containing 2^i items where i is the index in the sequence」，且「some peaks may be empty, ∅ rather than a Merkle root」。eq. E.8 的 A(r,l,H) = P(r,l,0,H) 就是二進位加法的進位：n ≥ |r| 時把 l 接在尾端；r_n = ∅ 時直接填入；否則把 r_n 清成 ∅、把 H(r_n ⌢ l) 當新的 leaf 進位到 n+1。GP 也明講「Hashing them removes the possibility of further appending so the range itself is kept on the system which needs to generate future proofs」——這就是為什麼 state 存 peaks 而不是存一個 root。eq. 7.7：β′_B ≡ A(β_B, M_B(s, keccak), keccak)，每個 block 只 append 一片 leaf（該 block accumulation output 的 well-balanced root，且明講「Throughout, the Keccak hash function is used to maximize compatibility with legacy systems」）。eq. 7.8 存進 β_H 的欄位是 b = M_R(β′_B)，而 eq. E.10 的 M_R 先濾掉 ∅、空則 H_0、單一則直接回傳，否則 keccak('$peak' ⌢ M_R(h_{…|h|−1}) ⌢ h_{|h|−1})——注意 M_R 是寫死 Keccak，不像 A（eq. E.8）收 H 參數；E_M（eq. E.9）則根本不雜湊，它只是 codec 𝓔_M。§18 Beefy 就是對 X_B ⌢ last(β_H)_b 做 BLS 簽章，所以 super-peak 才是對外橋接的那顆 commitment。說 peaks 是可丟的 cache、或說每 block 推一個 peak 並淘汰最舊的，都誤解了 MMB 是 append-only 且 peak 數量隨 log₂N 成長；說存的是 E_M(β_B) 的 Keccak 也錯，E_M（eq. E.9）是把 peaks 序列編碼成 blob 給 state serialization（C(3)）用的，不是 β_H 裡那顆 b；說 Beefy 只簽當個 block 的 root 更錯，那樣就沒有跨 block 的累積承諾了。逐一釘住三個干擾的錯處：說 peaks 只是可丟的 cache、能從最近 H 筆 recent-history 重建、且存進 β_H 的是 peaks 的 Blake2b M_B root 的那個，三處都錯——β_H 每筆只留 super-peak 而且只有 H 筆，重建不出整條 belt，GP 才會寫「the range itself is kept on the system which needs to generate future proofs」；存進 β_H 的是 M_R（Keccak、'$peak'）而非 M_B；Beefy 簽的是 X_B ⌢ 該筆的 b，不是 state root。說 A 每個 block 推一個 peak、超過 H 筆就淘汰最舊、舊輸出因此失去可證明性的那個，違背 MMB 的 append-only 本質：A 做的事情是進位而非推入，peak 數只隨 log₂N 成長且從不淘汰；它說存的是 keccak(E_M(β_B)) 也錯，E_M 是給 state serialization C(3) 用的 codec、根本不雜湊。說 peaks 是為了在分叉時回捲、砍掉最後一片 leaf 只要丟一個 peak 的那個，既誤解保留 peaks 的理由（GP 說的是雜湊掉就不能再 append），也誤解進位：一次 append 可能連鎖進位好幾格，回捲不是丟一個 peak 就好；而它說 β_H 存的是「該 block accumulation outputs 的 well-balanced Keccak root」，那其實是 eq. 7.7 被 append 進去的那片 leaf，不是 eq. 7.8 存下的 M_R(β′_B)。","trap":"MMR 與單一 Merkle root 的差別＝「還能不能再 append」。peaks 留著才能 append 與出證明；對外公布的是 super-peak（Keccak、'$peak'）。"},{"id":"c3-appF-shuffle-is-consensus","ch":"F","section":"F Shuffling (Fisher–Yates)","gpRef":"eq. F.1 (F); eq. 11.21 (guarantor permute P); §17 tranche-0 audit selection","difficulty":2,"kind":"rationale","tags":["shuffle","determinism","guarantor-assignment","rationale"],"stem":"A reviewer on the team wants to replace the `r_0 mod l` index selection in the shuffle F with rejection sampling, on the grounds that a modulo of a 32-bit draw is biased whenever l does not divide 2³². How should the team answer?","options":["The change is unnecessary rather than wrong: the numeric-sequence-from-hash function already removes the bias by slicing non-overlapping 4-octet windows out of a Blake2b digest, so the value taken modulo the remaining length is exactly uniform and rejection sampling would loop zero times. The two forms therefore agree bit for bit, and a node that switches still derives the same assignment P(|κ′|, η′_2, τ′) as everyone else.","Accept it, but only for ticket handling. The appendix-F shuffle is what orders the ticket accumulator γ_A and what §6 calls on to build the fallback key sequence, and since γ_A is re-sorted by identifier before use the permutation never reaches state; the guarantor path and the tranche-0 audit selection must keep the Gray Paper's biased form, because those two do reach state.","Reject the change. F is a consensus rule, not a statistics utility: every node must derive the identical permutation from the same entropy, and its output drives the guarantor-to-core assignment P(|κ′|, η′_2, τ′) and the tranche-0 audit selection. A node that de-biases assigns validators to different cores, then rejects perfectly valid guarantor signatures and splits the chain; the residual bias across 32-bit draws is deliberately accepted.","Accept the change. The Gray Paper fixes only the distribution — any shuffle that yields a uniformly random permutation of the input is conformant — and the jamtestvectors shuffle suite checks only that the result is a permutation of the input, not which permutation. F feeds nothing that is checked on chain anyway: the guarantor-to-core assignment is fixed by the core index each work-report carries, and tranche-0 auditing is a purely local choice."],"answer":2,"explanation":"eq. F.1 定義 F(s,r)：每一步取 index = r_0 mod l，輸出 s_{r_0 mod l}，再把 s_{l−1} 搬進那個位置、序列縮短一格遞迴。這裡的 mod 確實有 modulo bias（r_i ∈ N_{2³²}，l 通常不整除 2³²），GP 明知而不改，因為它要的不是統計上的完美均勻，而是「所有節點算出同一個排列」。用到的地方是硬性共識：eq. 11.21 的 P(v,e,t) = R(F([⌊i/3⌋ | i ∈ N_v], e), ⌊(t mod E)/R⌋) 決定每個 validator 這一輪被指派到哪個 core，η′_2 當種子（GP 特別說用 η_2 而非 η_1 是為了避開 fork-magnification）；另一處是 §17 的 tranche-0：F(reports, Y(s_0))[..10]。只要有節點改了 F，它算出的 M（eq. 11.22 的 guarantor assignments）就不同，於是把別人合法的 guarantor 簽章判成 bad validator index／unsorted guarantors，直接分叉。說「GP 只規定分佈」不成立：GP 給的是逐步可重現的函數定義，jamtestvectors 的 shuffle/ 向量正是逐一比對輸出序列（長度 0/8/16/20/50/100/200/341）。說 Q_l 已經消除 bias 也不對：Q_l（eq. F.2）只是把 hash 展開成 32-bit 數列，取模時的偏差原封不動。最後那個說法把兩件事混在一起：ticket accumulator γ_A 是依 identifier y 排序後取最小的 E 個（§6），從頭到尾沒有呼叫 F；§6 裡叫作 F 的是 fallback key sequence 函數（eq. 6.27），跟附錄 F 的 shuffle 是兩個不同的東西。干擾新加的理由一樣可以逐條打掉：說「F 餵的東西根本不上鏈、core 指派由 work-report 自帶的 core index 決定、tranche-0 純屬本地選擇」的那個，與 eq. 11.21／11.22 相反——鏈上規則是先用 F 算出 M 再驗 guarantor 的 core 與簽章，report 自報的 core 反而要被這個結果檢核，而 §17 的 tranche-0 選擇是決定性的協定規則，會影響 judgement；說「兩種寫法 bit for bit 相同、所以換了也算得出同一個 P」的那個自相矛盾：只要 l 不整除 2³²，rejection sampling 與直接取模就會在某些 draw 上選到不同 index，這正是提案想改掉的偏差；說「附錄 F 的 shuffle 既排 γ_A 又被 §6 拿去做 fallback key sequence」的那個，兩個指涉都錯——γ_A 依 identifier y 排序取最小的 E 個，而 eq. 6.27 的 fallback 是逐 slot 各做一次 hash 抽 key，從未呼叫 eq. F.1。","trap":"面試常問「這個 shuffle 有 bias 你要不要修？」——答案永遠是不修：規範函數的價值在於 bit-exact 可重現，不在於統計品質。"},{"id":"c3-appF-seq-from-hash-vs-fallback","ch":"F","section":"F Shuffling (Fisher–Yates)","gpRef":"eq. F.2 (Q_l), F.3 (F from a hash); eq. 6.27 (fallback key sequence)","difficulty":2,"kind":"concept","tags":["shuffle","entropy","safrole","fallback"],"stem":"Two places in the Gray Paper expand a 32-octet hash into a sequence of indices: the numeric-sequence-from-hash function that feeds the shuffle, and the fallback key-sequence function of §6 that picks an epoch's worth of Bandersnatch keys when the ticket accumulator is not full. How do the two expansions actually differ?","options":["The shuffle's expansion makes one Blake2b call per eight outputs — hashing the seed concatenated with the 4-octet encoding of ⌊i/8⌋ — and decodes the little-endian 4-octet window at offset 4i mod 32, so one 32-octet digest supplies eight consecutive 32-bit numbers. §6's fallback hashes once per slot, over the seed concatenated with the encoding of the slot index, and decodes only the leading 4 octets, using the result to index the key sequence cyclically.","It is the other way round: the shuffle's expansion hashes once per output, over the seed concatenated with the 4-octet encoding of i, and takes the leading four octets of each digest; §6's fallback makes one Blake2b call per eight slots — hashing the seed with the encoding of ⌊i/8⌋ — and decodes the little-endian window at offset 4i mod 32, which is what keeps a whole epoch of fallback keys cheap to compute at once.","Both hash once per output, over the seed concatenated with the 4-octet encoding of the index, and both take only the leading four octets of each digest; the shuffle then decodes big-endian and uses the value in its natural range while §6's fallback decodes little-endian and reduces modulo the key-sequence length, so endianness is the only real difference and is the classic source of fallback-seal mismatches.","They are the same construction used twice: §6's fallback sequence is literally the appendix-F shuffle applied to the active key set κ′ with η′_2 as the seed and then truncated to E entries, so both make one Blake2b call per eight outputs over the seed concatenated with the 4-octet encoding of ⌊i/8⌋, both decode the little-endian window at offset 4i mod 32, and both index the key sequence cyclically — which is why an implementation only needs one hash-expansion routine."],"answer":0,"explanation":"eq. F.2：Q_l(h) = [ 𝓔⁻¹_4( H(h ⌢ E_4(⌊i/8⌋))_{4i mod 32 …+4} ) | i ∈ N_l ]。注意兩個細節：counter 是 ⌊i/8⌋，所以每八個輸出才換一次 Blake2b；取的是 offset 4i mod 32 起算的 4 octets，剛好把 32-octet digest 切成八個互不重疊的 window，再以 𝓔⁻¹_4（little-endian，見 §3 對 E_l/𝓔⁻¹_l 的約定；別和 eq. H.1 的 shard 數函數 𝒟 混用同一個字母）解成 32-bit 數。eq. F.3 則把它接到 shuffle 上：F(s,h) ≡ F(s, Q_{|s|}(h))，數列長度恰好等於序列長度。§6 的 fallback key sequence（eq. 6.27）長得像但不是同一個：F(r,k) = [ k[𝓔⁻¹_4(H(r ⌢ E_4(i))_{…4})]_b ⟳ | i ∈ N_E ]——每個 slot 各做一次 hash，只取前 4 octets，而且是對 k 取 cyclic index（⟳），輸出是 Bandersnatch 公鑰而不是數字。把兩者當成同一個函數，是實作 safrole fallback 時最典型的錯法：γ′_S 只有落到 eq. 6.25 第三支時（跨 epoch 而 Z(γ_A) 的條件不成立，例如 |γ_A| ≠ E 或 m < Y）才等於 eq. 6.27 的結果（那是逐 slot 抽 k 的 fallback，不是把 κ′ 拿去 shuffle）；同一 epoch 內（e′ = e）γ′_S 一律沿用 γ_S。把「每次 hash 出八個」和「每次 hash 出一個」對調同樣是錯的；endianness 也不是唯一差異——𝓔⁻¹_4 兩邊都是 little-endian，真正的差異在 counter 與 window 的取法，以及輸出型別。三個干擾新加的細節也都可以直接對表：說兩者都「每八個輸出一次 hash、counter 用 ⌊i/8⌋、取 4i mod 32 的 window、且都做 cyclic index」的那個，把 Q_l 的規格整套搬到 eq. 6.27 上，但 6.27 寫的是 H(r ⌢ E_4(i)) 逐 slot 一次、只取 _{…4}；反過來說 shuffle 逐個輸出 hash、fallback 才是八個一批的那個，正好把兩邊調換；說兩者都逐個輸出 hash、都只取前四個 octet、差別只在 endianness 的那個，錯得更細——Q_l 取的是 offset 4i mod 32 的 window 而非固定前四個 octet，而 𝓔⁻¹_4 兩邊都是 little-endian，GP 從未定義 big-endian 的解碼。另外「cyclic index」只出現在 eq. 6.27（⟳ 是對 k 取模），Q_l 只輸出 32-bit 數、不做任何取模。","trap":"§6 的 fallback 叫 F、附錄 F 的 shuffle 也叫 𝓕——同名不同物。fallback 一個 slot 一次 hash、取前 4 bytes；Q_l 一次 hash 供八個、取 4i mod 32 的 window。"},{"id":"c3-appG-why-ring-not-plain-vrf","ch":"G","section":"G Bandersnatch VRF (IETF VRF vs Ring VRF)","gpRef":"§G; §3 signing schemes; eq. 6.30 (tickets extrinsic), eq. 6.16 (ticket seal)","difficulty":1,"kind":"rationale","tags":["bandersnatch","ring-vrf","safrole","anonymity","rationale"],"stem":"Safrole could have proved ticket validity with an ordinary IETF VRF signature plus the submitting validator's published Bandersnatch key. Why does the Gray Paper insist on a ring VRF proof instead?","options":["Because the proof shows only that its author knows a secret whose public key lies in the ring committed by γ′_Z, never which one, so next epoch's slot-sealer sequence can sit in public state without revealing who will author which slot; the author is identified only when the seal appears, which is what blunts targeted denial-of-service and bribery.","Because one ring proof can carry all of a validator's ticket entries at once — the entry indices ride in the message while the context fixes only η′_2 — so the 784-octet cost is paid once per validator per epoch and the tickets extrinsic stays inside its 16-per-block cap however many entries each validator is allowed.","Because it lets any key holder, validator or not, enter the ticket contest — the proof is checked against the 144-octet γ′_Z but ring membership is not required, only knowledge of some Bandersnatch secret — which is what keeps the accumulator saturated when part of the validator set is offline, and is why the contest closes at slot 500 of the epoch.","Because a ring VRF output is unbiasable whereas a plain VRF output can be ground by its signer through resubmission, so only the ring form makes next epoch's slot-sealer sequence safe to publish; anonymity is a welcome side effect but not the reason, and grinding resistance is also why the ticket's message is empty and its context carries no entry index."],"answer":0,"explanation":"§3 的簽章章節把差別講得最清楚：「Both the Bandersnatch signature and RingVRF proof strictly imply that a member utilized their secret key in combination with both the context x and the message m; the difference is that the member is identified in the former and is anonymous in the latter.」而 ring root 那段又說「A root implies a specific sequence of Bandersnatch key pairs, knowledge of one of the secrets would imply being capable of making a unique, valid—and anonymous—proof of knowledge of a unique secret within the sequence.」eq. 6.30 的 ticket proof 屬於 ⟨γ′_Z, X_T ⌢ η′_2 ⌢ i_e, []⟩ 這一族 784-octet ring proof，驗證只看 144-octet 的 ring root，因此鏈上永遠不知道某張 ticket 是誰投的；到了下一個 epoch 該 slot 的作者才用 eq. 6.16 的 96-octet IETF 簽章現身。（以下為 Sassafras/Safrole 的公認設計動機，GP 0.8.0 本文只寫到 anonymity，未展開攻擊模型）這正是 Safrole 相對 BABE 的賣點：未來的出塊者名單公開、身分不公開，攻擊者無法提前針對某台機器打 DoS 或行賄。「ring VRF 才 unbiasable」是錯的歸因——兩者都是 VRF，output 的不可操縱性來自 input 綁死 η′_2 與空 message，不是來自 zk；「一張 proof 打包多個 entry」也不存在，每個 entry index e 各自一張 proof，每張都是 784 octets；「任何人都能參賽」更是相反，ring proof 恰恰只能由 ring 成員產生。干擾補上的細節同樣經不起對照：說「grinding resistance 才是理由，所以 ticket 的 message 為空而且 context 不帶 entry index」的那個，後半直接違反 eq. 6.30——context 是 X_T ⌢ η′_2 ⌢ [i_e]，entry index 就在 context 裡，正因如此同一把私鑰的不同 entry 才會得到不同的 y；說「entry index 放在 message 裡、context 只鎖 η′_2，所以一張 proof 打包整個 epoch 的 entry」的那個，把 context 與 message 的內容對調（message 是空序列），而且 E_T 的每個元素各自帶一張 784-octet proof，C_maxblocktickets = 16 限的是每個 block 的 ticket 筆數而不是每個 validator 一張 proof；說「不必是 ring 成員、只要握有任一把 Bandersnatch 私鑰就能出 proof」的那個與 §G 的定義相反（V̄_r⟨c⟩(m) 要求 verify(r, c, m, x) 成立，等於證明私鑰對應的公鑰落在 r 承諾的序列裡），而 Y = 500 收單是 C_epochtailstart 的規定，與誰能參賽無關。","trap":"GP 0.8.0 只把 anonymity 寫成理由：ring proof 證明的是「簽章者在 γ′_Z 這個 ring 之中」而不指名是誰；unbiasability 兩種 VRF 都有，拿它當選 ring VRF 的理由必錯。"},{"id":"c3-appG-ring-root-commitment","ch":"G","section":"G Bandersnatch VRF (IETF VRF vs Ring VRF)","gpRef":"§G (ring root O, padding point); eq. 6.14–6.15 (key rotation and Φ); eq. 6.4 (γ_Z)","difficulty":2,"kind":"concept","tags":["bandersnatch","ring-vrf","ring-root","offenders"],"stem":"What exactly does the epoch root γ′_Z commit to, and what becomes of a validator whose key tuple has been zeroed by Φ because its Ed25519 key is in the offenders set?","options":["It commits to the full 336-octet validator key tuples of the pending set — Bandersnatch, Ed25519, BLS and metadata alike — as a fixed 144-octet commitment recomputed at the epoch boundary. Since Φ zeroes only the Ed25519 component the Bandersnatch half survives and keeps its index, so an offender can still submit tickets until the next rotation removes it.","It commits to the ordered Bandersnatch components of the pending key set — the validators of the coming epoch — as a fixed 144-octet commitment recomputed at the epoch boundary. An all-zero entry is not a valid curve point, so the Bandersnatch padding point is substituted for it: the ring keeps its size, every other member keeps its index, and no proof can ever be produced for that position.","It is the well-balanced Merkle root M_B over the ordered 32-octet Bandersnatch components of the pending key set and is therefore itself 32 octets, recomputed at the epoch boundary. A zeroed entry simply becomes a leaf whose opening nobody knows: the ring keeps its size, every other member keeps its index, and that is what excludes the offender from the contest.","It commits to the ordered Bandersnatch components of the active key set κ′ — the validators of the current epoch — as a fixed 144-octet commitment recomputed whenever the offenders set changes. Zeroed entries are dropped and the surviving keys re-indexed, so the ring shrinks by the number of offenders and both the root and the proofs get correspondingly cheaper."],"answer":1,"explanation":"eq. 6.14 的 key rotation 在 e′ > e 時把 (γ′_P, κ′, λ′, γ′_Z) 設成 (Φ(ι), γ_P, κ, z)，其中 z = O([k_b | k ∈ γ′_P])——所以 ring root 承諾的是 pending set γ′_P（下一個 epoch 才上線的那組）的 Bandersnatch 分量，而不是現行的 κ′；§G 的 O(s) ≡ commit(s)，而 §3 與 definitions 都寫明 ringroot ⊂ B_144（B_144 是 blob 集合 𝔹 的 144-octet 子集；別寫成 𝕐_144，𝕐 是 eq. 11.5 的 avspec 集合），是固定 144 octets、與 ring 大小無關的 commitment，不是 32-octet 的 Merkle root。eq. 6.15 的 Φ(k) 在 k_e ∈ ψ′_O 時把「整個」key tuple 換成 [0,0,…]，不是只清 Ed25519 那 32 octets，所以 Bandersnatch 欄位也是全零。§G 結尾那句就是為這種情況準備的：「Note that in the case a key k̃ has no corresponding Bandersnatch point when constructing the ring, then the Bandersnatch padding point as stated by Hosseini–Galassi should be substituted.」——用 padding point 補位而不是把它刪掉，ring 長度與每個成員的索引都不變，只是那個位置沒有人握有對應私鑰，因此永遠生不出合法 proof。若真的把零鍵刪掉再重新編號，所有人的 ring 成員位置都會位移，跨實作的 root 也就對不起來，這是 ring verifier 快取常見的災難（團隊 #1040/#1041 就是把 verifier 從「以 epoch 為 key」改成「以 validator-set hash 為 key」）。三個干擾各自的破綻：說承諾在 κ′ 上、且「offenders 一變就重算」的那個，除了搞錯集合，也搞錯時機——eq. 6.14 只在 e′ > e 的 epoch 邊界重算 γ′_Z，而且 ring proof 恆為 784 octets、root 恆為 144 octets，不會因 ring 變小而變便宜；說 γ′_Z 是 Bandersnatch key 的 well-balanced Merkle root、只有 32 octets 的那個，混淆了兩種承諾——§G 的 O(s) ≡ commit(s) 是多項式承諾而非 Merkle root，ring proof 的驗證也不是打開某片 leaf，且 definitions 寫明 ringroot ⊂ B_144；說承諾涵蓋整個 336-octet key tuple、且 Φ 只清 Ed25519 的那個，兩點都錯——z = O([k_b | k ∈ γ′_P]) 只取 32-octet 的 Bandersnatch 分量，而 eq. 6.15 的 Φ 是把整條 tuple 換成 [0, 0, …]，Bandersnatch 欄位一併歸零。","trap":"三個字要記牢：pending（不是 active）、144 octets（不是 32）、padding point（不是刪除）。"},{"id":"c3-appG-output-vs-signature","ch":"G","section":"G Bandersnatch VRF (IETF VRF vs Ring VRF)","gpRef":"§G (Y as output(·)‥32); §3 signing schemes; eq. 6.6 (ticket), 6.16 (ticket seal), 6.30 (tickets extrinsic)","difficulty":3,"kind":"concept","tags":["bandersnatch","vrf-output","ticket-identifier","safrole"],"stem":"The ticket accumulator keeps only tuples of a 32-octet identifier and an entry index; the 784-octet ring proof from the extrinsic is thrown away once verified. An epoch later the sealer of a slot must present a 96-octet signature whose output equals that stored identifier, even though it now signs the serialized unsigned header rather than an empty message. What makes that possible?","options":["Because the stored identifier is the Blake2b hash of the ring proof, and a Bandersnatch ring proof is deterministic, so the same key and context regenerate the identical proof bytes and hence the identical hash; the message plays no part in that hash. The ticket's context is the ticket-seal string with η′_2 and the entry index, the seal's is the same string with η′_3, and the entropy rotation makes those two byte strings equal one epoch later.","Because a VRF output is a high-entropy hash influenced by the context but not by the message, fixed by the secret key and the input alone. The ticket's context is the ticket-seal string with η′_2 and the entry index; the seal's is the same string with η′_3 and the ticket's entry index, and the entropy rotation makes those two byte strings equal one epoch later, so the same key yields the same 32 octets under either signature type.","Because the identifier is derived from η′_2 together with the entry index alone, so every validator can recompute every ticket identifier without ever seeing the proof; the signature contributes only the proof of the right to use it, which is why the proof itself need not be retained. One epoch later the seal signs under η′_3, but since the identifier never depended on a secret key, the sealer need only exhibit the same entry index.","Because the seal republishes the stored ring proof inside the seal field — the 96-octet form is that same proof with the zero-knowledge portion stripped, which is exactly why the two sizes differ — so its output is trivially unchanged no matter what is signed. The context does move from η′_2 to η′_3 across the epoch boundary, but a stripped proof carries its original output along with it, so the stored identifier still matches."],"answer":1,"explanation":"§3 的關鍵句：「both define a VRF output, a high entropy hash influenced by x but not by m」，§G 則寫 Y(s) ≡ output(x | x ∈ ⟨…⟩)‥32，也就是取 VRF output 的前 32 octets。§6 定義新 ticket 為 n = [(y ← Y(i_p), e ← i_e) | i ∈ E_T]，γ_A 依 y 排序取最小的 E 個，全程沒有保留 784-octet 的 proof。到了下一個 epoch，eq. 6.16 要求 i_y = Y(H_S) 且 H_S ∈ ⟨H_A, X_T ⌢ η′_3 ⌢ i_e, E_U(H)⟩。兩邊 context 之所以逐 byte 相同，是因為 entropy 每個 epoch 輪轉 (η′_1, η′_2, η′_3) ← (η_0, η_1, η_2)：投票當下的 η′_2，正是一個 epoch 後的 η′_3；entry index 也一路帶著。message 一邊是空序列、一邊是 E_U(H)，但 message 不影響 output，所以同一把私鑰照樣算出同一個 y。這也解釋了為什麼「ticket 不能被搬到別的 epoch」：換 epoch 就換 η，context 一變 y 就變，舊 y 進不了新的 γ_A；順帶一提 ticket 跟 core 完全無關，validator→core 是 eq. 11.21 的 shuffle 在管，別把兩者混談。說 y 是 proof 的 Blake2b 是錯的（那樣 output 就會隨簽章格式而變，96 與 784 octets 不可能撞出同一個雜湊）；說 seal 內嵌舊 proof 也錯，H_S 是全新的 IETF 簽章；說 y 只由 η′_2 與 index 決定更錯，那樣 ticket 就毫無私鑰綁定、任何人都能偽造。干擾補上的細節不改變它們錯：主張 y = Blake2b(proof) 的那個，即使把 context 輪轉講對了也救不回來——96-octet 的 IETF 簽章與 784-octet 的 ring proof 是兩種完全不同的位元串，不可能雜湊出同一個值，而 §G 定義的是 Y(s) ≡ output(s)‥32，取的是 VRF output 本身；主張 seal 內嵌「剝掉 zk 部分的同一張 proof」的那個，與 eq. 6.16 直接衝突（H_S ∈ ⟨H_A, X_T ⌢ η′_3 ⌢ i_e, E_U(H)⟩ 是重新產生的 IETF 簽章，不是舊 proof 的片段），而且若 output 真的隨 proof 一起被搬運，context 換不換就無所謂了，正好抹掉這題的重點；主張識別碼與私鑰無關、下一個 epoch 只要報出同一個 entry index 的那個，等於承認任何人都能奪取任一 slot——eq. 6.16 要求的是 i_y = Y(H_S)，H_S 必須由 H_A 這把私鑰簽出。","trap":"先分清楚兩個東西：signature／proof 是「可丟的憑證」，Y(·) 的 VRF output 才是「進 state 的身分」。output 綁 key＋context，不綁 message。"},{"id":"c3-appH-code-shardcount-080","ch":"H","section":"H Erasure Coding","gpRef":"eq. H.1 (𝒟); eq. 6.8 (𝕍); eq. 11.5 (a_v), eq. 11.31 (∀r ∈ I: (r_s)_v = |κ′|); §14 availability specifier","difficulty":2,"kind":"code","tags":["erasure-coding","delta-0.8.0","constants","tiny-vs-full"],"stem":"The team's Go tree is on GP 0.7.2 and pins the erasure-coding rate as shown. GP 0.8.0 replaces the fixed rate with the function 𝒟(v). What is the minimal correct migration, and what does it do to the 6-validator tiny configuration?","code":{"lang":"go","caption":"internal/types/const.go (mode setters + package constants) and internal/work_package/work_package.go (buildBCloud)","src":"// SetTinyMode()                     // SetFullMode()\n\tECPiecesPerSegment = 1026         //   ECPiecesPerSegment = 6      // W_P\n\tECBasicSize        = 4            //   ECBasicSize        = 684    // W_E\n\n// erasure coding constants\n// 342:1023 (Appendix H)\nconst (\n\tDataShards  = 342\n\tTotalShards = 1023\n)\n\n// buildBCloud\n\tpadded := PadToMultiple(bundle, types.ECBasicSize)\n\n\tshards, err := erasurecoding.EncodeDataShards(padded, types.DataShards, types.TotalShards-types.DataShards)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\thashedShards := make([]types.OpaqueHash, len(shards))\n\tfor i, shard := range shards {\n\t\thashedShards[i] = hash.Blake2bHash(types.ByteSequence(shard))\n\t}"},"options":["Every one of these numbers becomes a function of the assuring-set size that the report itself carries: the total is that size (which the on-chain rule pins to |κ′|), the data-shard count is the largest d with 2d dividing W_G and d no greater than v/3 + 1, and the pad width is twice that. On tiny that gives 3 data shards out of 6, a pad width of 6 and 684 pieces per segment, so the old 4 / 1026 pair must go.","Only the total needs to follow the assuring-set size that the report itself carries; the data-shard count is fixed by the segment size alone, since 𝒟 is the largest d with 2d dividing W_G, and the pad width is twice that. Tiny therefore keeps its 4 and its 1026 pieces per segment while only the total becomes variable, and buildBCloud needs no change beyond reading the report's shard-count field.","Set the data-shard count to v/3 + 1 unconditionally, the total to the assuring-set size the report carries, and the pad width to twice the count. Because the set of legal validator-set sizes contains only multiples of three, the side condition that twice the count divide the segment size is automatically satisfied and can be dropped; tiny becomes 3 out of 6 with 684 pieces per segment and full stays 342 out of 1023.","Nothing in this file changes beyond the segment constants. 𝒟(v) governs only the Import-DA segment path, so the audit-DA bundle keeps its 342:1023 rate and its 684-octet pad width, while the segment path alone switches to the report's own shard count; that asymmetry is exactly why the availability spec gained a shard-count field, and why the tiny pair stays 4 / 1026 rather than 3 / 684."],"answer":0,"explanation":"GP 0.8.0 的 eq. H.1：𝒟(v ∈ 𝕍) ≡ max({d | d ∈ N_{v/3+2}, W_G mod 2d = 0})，也就是「不超過 v/3+1 且 2d 能整除 W_G = 4,104 的最大 d」；配合 eq. 6.8 的 𝕍 ≡ {3c | c ∈ N_{2…C+1}}（§6 原文：「always a multiple of 3 between 6 and 3C」），rate 不再是常數而是每份 report 自帶的參數。eq. 11.5 讓 availability spec 多了 a_v ∈ 𝕍，緊接著 eq. 11.31 規定 ∀r ∈ I：(r_s)_v = |κ′|，§14 的 availability specifier 又把 z = 2·𝒟(a_v) 當成 bundle 補零與每段切片的寬度。代進 tiny：v = 6 → v/3+1 = 3，2·3 = 6 整除 4,104，所以 𝒟(6) = 3、z = 6、W_G/z = 684 pieces per segment；程式裡 tiny 的 4 / 1026 是 0.7.x 時代的值（等於 𝒟 = 2），必須換掉，否則 padded 長度與 encoder 期望的 2·DataShards 根本不一致。「只改 total、data 維持 342」錯在 𝒟 的上界就是 v/3+1，v = 6 時不可能是 342。「無條件用 v/3+1」是最漂亮的陷阱：整除條件並非恆成立——v = 1002 ∈ 𝕍 時 v/3+1 = 335，但 2d | 4104 要求 d 整除 2052，335 不合，真正的 𝒟(1002) = 228，GP 也特別提醒「the rate is least efficient when v is slightly below one of these values」。「只有 segment 路徑要改」同樣錯，§14 的 b♣ 用 C^{a_v}_{⌈|b|/z⌉}(𝒫_z(b))，bundle 路徑一樣吃 a_v。團隊的 PR #1026／#1035（original_shards(v)）與 issue #1037（|κ| ≠ V）就是這條遷移。把干擾新增的說法一併釘死：說「𝒟 只是『2d 整除 W_G 的最大 d』、與 v 無關，所以 tiny 保留 4 / 1026」的那個，把 eq. H.1 的候選集合 N_{v/3+2} 整個丟掉了——沒有 v/3+1 這個上界，最大的 d 會變成 2052，rate 就不成立；說「無條件用 v/3+1、整除條件恆成立」而且 tiny 算成 3 / 684 的那個，數值恰好對，錯的是理由與通用性：v = 1002 ∈ 𝕍 時 v/3+1 = 335 不整除 2052，𝒟(1002) = 228，側條件確實會生效，把它拿掉就會在非 tiny 非 full 的 set size 上算錯；說「audit-DA 保留 342:1023、只有 segment 路徑改」的那個，與 §14 的 b♣ = H#(C^{a_v}_{⌈|b|/z⌉}(𝒫_z(b))) 相牴觸——bundle 路徑同樣吃 a_v 與 z = 2·𝒟(a_v)，而 availability spec 之所以新增 shard-count 欄位，正是因為兩條路徑都要用它。","trap":"0.8.0 的 shard 數不是常數而是 report 欄位：先讀 a_v，再算 𝒟(a_v)，最後才 pad。tiny 從 2:6 變 3:6，每段 pieces 從 1026 變 684。"},{"id":"c3-appH-what-gets-coded","ch":"H","section":"H Erasure Coding","gpRef":"§14 availability specifier (b♣, s♣, a_u); eq. 14.12 (paged proofs); eq. 11.5; eq. H.5–H.6","difficulty":1,"kind":"concept","tags":["erasure-coding","availability","audit-da","d3l"],"stem":"For one work-report, which data does a guarantor erasure-code and hand out, and what does an individual validator end up holding?","options":["One data set: the work-report itself, zero-padded up to a multiple of twice the data-shard count and then coded into one chunk per validator, with each resulting chunk hashed; the erasure-root is the well-balanced Merkle root over those chunk hashes. The work-package bundle and the exported segments stay with the guarantors, who serve them on request during an audit, so a validator holds one 32-octet chunk hash and nothing more.","One data set: only the work-package bundle, zero-padded up to a multiple of twice the data-shard count and then coded into as many chunks as there are assurers, with each chunk hashed into a leaf of the erasure-root. The exported segments are committed to by the segment-root instead and are reconstructed on demand by re-running refine, which is why the segment-root and the erasure-root are separate fields, so a validator holds a single 32-octet bundle-chunk hash.","Two data sets: the auditable bundle, zero-padded up to a multiple of twice the data-shard count and then coded, with each resulting chunk hashed; and the exported segments together with their paged-proof segments, each coded and then transposed so that one chunk of every segment lands on the same validator. A validator holds one leaf of the erasure-root: its bundle-chunk hash concatenated with the root over its own segment column.","One data set: only the exported segments, together with their paged-proof segments, are coded and then transposed so that one chunk of every segment lands on the same validator, because only they must survive in the long-term data lake. The auditable bundle is replicated whole to every validator, which is precisely why it may be discarded soon after the block is finalized, and a validator's erasure-root leaf is just the root over its own segment column."],"answer":2,"explanation":"§14 講得很直接：「Guarantors are required to erasure-code and distribute two data sets: one blob, the auditable bundle containing the encoded work-package, extrinsic data and self-justifying imported segments which is placed in the short-term Audit DA store; and a second set of exported-segments data together with the Paged-Proofs metadata.」availability specifier 的定義式把兩條路寫成 b♣ = H#(C^{a_v}_{⌈|b|/z⌉}(𝒫_z(b)))（先用 𝒫_z 補零到 z = 2·𝒟(a_v) 的倍數，再切片編碼，每片 chunk 各做一次 Blake2b）與 s♣ = M_B#(ᵀ C^{a_v}#_{W_G/z}(s ⌢ P(s)))（每個 segment 各自編碼、轉置後每個 validator 拿到自己那一欄，再對該欄取 M_B root）；最後 a_u = M_B([⌢x | x ∈ ᵀ[b♣, s♣]])，所以每個 validator 對應到 erasure-root 的一片 leaf＝「它的 bundle chunk hash ⌢ 它的 segment 欄 root」。eq. 11.5 的說明也印證：「the root of a binary Merkle tree whose leaves are the a_v chunks produced by erasure-coding the work-package bundle and exported segments. As one chunk is distributed to each assurer, the number of chunks must equal the size of the assuring validator set.」說「只編碼 work-report」錯得最遠——report 只有幾 KB 且本來就上鏈；說「bundle 全量複製」違背 audit DA 的整個設計（1023 份全量複製正是要避免的事）；說「segment 靠重跑 refine 重建」也錯，refine 是無狀態但輸入本身就得先能取回，長期 D³L 至少保存 28 天正是為此。三個干擾都把「兩份資料」縮成一份，而且各自附帶一個可查的細節錯誤：說被編碼的是 work-report 本身、validator 只握一個 32-octet chunk hash 的那個，除了資料集選錯，也搞錯 leaf 形狀——a_u 的每片 leaf 是 b♣ 與 s♣ 轉置後接起來的 64 octets；說只編碼 exported segments、bundle 全量複製給每個 validator 的那個，與 §14 開頭「Guarantors are required to erasure-code and distribute two data sets」正面衝突，而 audit DA 之所以短命是因為只需撐到該區塊 final，不是因為它被複製；說只編碼 bundle、segment 靠重跑 refine 重建的那個，忽略了 refine 的輸入（imported segments）本身就得先能取回，這正是 D³L 存在的理由，而 segment-root 與 erasure-root 分開是因為前者承諾 segment 內容、後者承諾分片配置，不是因為只有一條路徑走編碼。","trap":"兩條線分開記：bundle 先 𝒫_z 補零→編碼→每片各做一次 Blake2b；segments 是 s ⌢ P(s) 一起編碼→轉置→每欄取 M_B root。erasure-root 的一片 leaf ＝同一個 validator 在這兩條線上的結果接起來。"},{"id":"c3-appH-rate-and-field-rationale","ch":"H","section":"H Erasure Coding","gpRef":"eq. H.1 (𝒟) and the §H opening paragraph; eq. 6.8 (𝕍); eq. 11.17 (availability super-majority)","difficulty":2,"kind":"rationale","tags":["erasure-coding","rationale","gf65536","threshold","delta-0.8.0"],"stem":"Appendix H says the coding rate 'is derived from' three separate considerations. Which account of them is right, and why is the code built over GF(2¹⁶) rather than over single octets?","options":["Reconstruction must survive almost two-thirds of the validators being malicious or incapacitated, which puts the data-shard count near v/3 + 1 and dovetails with the 2/3+1 assurance super-majority; the field is 16-bit, so one code word is an octet pair and the evaluation points can index up to v distinct validators; and twice the shard count must divide the 4,104-octet segment size so that a segment codes with no padding at all, which is why the count is the largest such value rather than exactly v/3 + 1.","The rate is chosen so that a two-thirds super-majority of assurances is itself the reconstruction threshold, which puts the data-shard count near 2v/3; the field is 16-bit purely because a segment is 4,104 = 2 × 2,052 octets and the code words must tile it evenly; and the divisibility side condition exists only to keep the last chunk from needing a length prefix, which is why the count is the largest admissible value rather than exactly 2v/3. On 1,023 validators that gives 682 data shards and 3 pieces per validator per segment.","The data-shard count is exactly ⌊v/3⌋ + 1 for every legal validator-set size, so the divisibility side condition is never active and could be dropped; GF(2¹⁶) is chosen only because 16-bit multiply-accumulate is faster than byte-wise arithmetic on modern hardware; and the 4,104-octet segment size follows from the field rather than the other way round, 4,104 being simply the smallest convenient multiple of the code-word width. On 1,002 validators that gives 335 data shards with no padding.","The rate is set so that exactly the 683 validators of a full super-majority are needed to rebuild, which is what ties availability to finality and fixes the count at 2v/3 + 1 rather than at the largest admissible value; GF(2¹⁶) is chosen because Blake2b emits 32 octets, i.e. exactly 16 code words, so a chunk hash and a chunk share a representation; and twice the shard count still divides the 4,104-octet segment size, since 1,366 divides 4,104."],"answer":0,"explanation":"§H 開頭原文把三個理由並列：「This rate is derived from the fact we wish to be able to reconstruct even should almost two-thirds of the v validators be malicious or incapacitated, the 16-bit Galois field on which the erasure-code is based and the desire to support, for simplicity, encoding segments of size W_G without padding.」對應到 eq. H.1 的 𝒟(v) ≡ max({d | d ∈ N_{v/3+2}, W_G mod 2d = 0})：上界 v/3+1 來自第一點（只要有 𝒟(v) 片就能重建，等於容忍將近 2/3 的節點消失，與 eq. 11.17 的 2/3+1 assurance 門檻互相搭配，而不是要求 2/3 的 chunk）；「2d 整除 4,104」來自第三點，所以 segment 用 k = W_G/(2𝒟(v)) 永遠是整數、完全不必 padding；而取 max 而非直接等於 v/3+1，正是因為整除條件會把它往下拉——GP 自己舉例「when v = 1022, the rate is approximately 1:4.5」——但要注意 1022 ∉ 𝕍（𝕍 只收 6 到 1023 之間 3 的倍數），這是個假想值：也只有在 v 不是 3 的倍數時，H.1 的上界該讀成 ⌊v/3⌋+1 還是 v/3+1 才會有差（取 ⌊1022/3⌋+1 = 341 才得到 𝒟 = 228、rate ≈ 1:4.48，與 GP 自己寫的 1:4.5 相符；讀成 342 則是 1:2.99）。對每個合法的 v 兩種讀法一致（v/3 ∈ ℕ），真正能驗證整除側條件確實會生效的合法案例是 v = 1002。至於為什麼是 GF(2¹⁶)：code word 就是一個 octet pair，validator i 被映成 field element ĩ = Σ i_j v_j（Cantor basis），evaluation point 必須每個 validator 各一個且互異，GF(2⁸) 只有 256 個點，連 1,023 個 validator 都編不完，這是最直接的理由（§H 只把 16-bit GF 列為三項考量之一，並未替它們排序）。把門檻說成 2v/3 或「剛好 683 片」都與 eq. H.1 相牴觸（那樣冗餘度會低到失去容錯意義）；說「⌊v/3⌋+1 恆成立、側條件從不生效」也錯，v = 1002 ∈ 𝕍 時 v/3+1 = 335 但 𝒟(1002) = 228。0.7.2 時這一切是寫死的 342:1023，0.8.0 才為了支援較小的 validator set 而變成以 v 為參數的函數。干擾新加的數字也全部可以當場驗算：說門檻是 2v/3、1023 個 validator 給 682 片、每片每段 3 pieces 的那個，682 早已超出 N_{v/3+2} 的上界 342，而且 2·682 = 1364 不整除 4,104（4104/1364 ≈ 3.009），根本切不出整數 pieces；說 ⌊v/3⌋+1 恆成立、側條件可刪、且 1,002 個 validator 給 335 片無需 padding 的那個，正是踩在唯一能證偽它的合法案例上——335 不整除 2,052，2·335 = 670 不整除 4,104，真正的 𝒟(1002) = 228；說固定 683 片、且「1,366 整除 4,104」的那個，算術就錯了（1366 × 3 = 4,098，餘 6），而 Blake2b 輸出 32 octets 與選 GF(2¹⁶) 毫無因果關係。至於為什麼不是 GF(2⁸)：evaluation point 必須每個 validator 各一個且互異，8-bit field 只有 256 個點，連 1,023 個 validator 都編不完，這是 16-bit 最直接的必要性。","trap":"「三分之一容錯」講的是 chunk 門檻 𝒟(v) ≈ v/3+1（任 1/3 即可重建），「三分之二」講的是 assurance 的 super-majority——兩個門檻方向相反，別對調。"},{"id":"c3-ch03-bounded-numeric-blob-types","ch":"3","section":"3.4 Numbers / 3.7.4 Octets and Blobs","gpRef":"§3.4; §3.7.4; §3.8.1","difficulty":1,"kind":"concept","tags":["notation","types","blobs","numbers"],"stem":"Almost every type in the Gray Paper is built from the vocabulary fixed in §3.4 and §3.7.4: N, N_n, Z, N_L, B, B_x and B_$. Which statement reads all of them the way the GP defines them?","options":["The subscripted natural set includes the subscript itself, so N_n has n + 1 members; N_L is equivalent to N_{2^64} because octet-sequence lengths are carried as 64-bit values; B_x is the set of blobs of length exactly x and B_$ the subset which are ASCII-encoded strings; and an octet, though bijective with a natural under 256, is not the same entity under serialization.","The subscripted natural set is the naturals strictly below the subscript, so N_n has n members; N_L is the set of octet sequences shorter than 2^32 rather than the set of their lengths; B_x is the set of blobs of at most x octets and B_$ the subset which are ASCII-encoded strings; and an octet serializes exactly as the general natural-number encoding does.","The subscripted natural set is the naturals strictly below the subscript, so N_n has n members; N_L is the GP's shorthand for the set of *lengths* of octet sequences and is equivalent to N_{2^32}; B_x is the set of blobs of length exactly x and B_$ the subset which are ASCII-encoded strings; and an octet, though bijective with a natural under 256, is not the same entity for serialization.","The subscripted natural set is the naturals strictly below the subscript, so N_n has n members; N_L is the set of lengths of octet sequences and is equivalent to N_{2^32}; B_x is the set of blobs of length exactly x but B_$ is the subset whose leading octet is a sentinel marker; and an octet just is a natural under 256, so the two serialize identically."],"answer":2,"explanation":"§3.4：「N denotes the set of naturals including zero whereas N_n implies a restriction on that set to values less than n. Formally, N = {0, 1, …} and N_n = {x | x ∈ N, x < n}」——嚴格小於，所以 N_n 有 n 個元素而不是 n + 1 個。同節：「we denote N_L as the set of lengths of octet sequences and is equivalent to N_{2^32}」——N_L 是**長度的集合**（一個自然數集），不是 blob 集合，而且是 2^32 不是 2^64。§3.7.4：「B denotes the set of octet strings (“blobs”) of arbitrary length… B_x denotes the set of such sequences of length x. B_$ denotes the subset of B which are ascii-encoded strings」——B_x 是**恰好** x 個 octet（不是至多），$ 表示 ASCII 字串子集，與「首個 octet 是 sentinel 標記」或長度前綴都無關。同節最後那句是面試最愛考的：「while an octet has an implicit and obvious bijective relationship with natural numbers less than 256…we do not treat them as exactly equivalent entities. In particular for the purpose of serialization, an octet is always serialized to itself, whereas a natural number may be serialized as a sequence of potentially several octets, depending on its magnitude and the encoding variant」——這是 App. C 裡 blob 直接落地、而自然數走 E 或 compact 變體的根據；說「octet 就是 256 以下的自然數、兩者序列化完全相同」或「octet 照一般自然數編碼走」都直接與這句話相反。另外 §3.8.1 定義 hash 集合 H ≡ B_32。","trap":"N_L 是「長度」的集合（= N_{2^32}），不是 blob 的集合；B_x 是「恰好 x」不是「至多 x」。"},{"id":"c3-ch03-optional-none-error","ch":"3","section":"3.3 Sets / 3.2 Functions and Operators","gpRef":"§3.3; eq. 3.2 (substitute-if-nothing); applied at eq. 13.13","difficulty":1,"kind":"concept","tags":["notation","optional","none","error"],"stem":"§3.3 introduces ∅, ∇ and the optional constructor A?, and eq. 3.2 defines the substitute-if-nothing function 𝒰. §13.2 then writes a service's accumulation entry as 𝒰(S[s], (0, 0, 0)), where S is a dictionary from service index to a triple. Which reading is correct?","options":["∅ marks a term validly left without a specific value and is defined to have cardinality zero; the optional constructor gives A? ≡ A ∪ {∅}; ∇ marks an unexpected failure or an invalid value, and the GP prefers it to ⊥ so it is not confused with Boolean false; and 𝒰 yields its first argument that is not ∅ — so the entry is the service's own triple when the dictionary holds one and the all-zero triple otherwise.","∅ is the empty set itself, so it has cardinality zero only because it happens to hold no members; the optional constructor A? is a codec directive meaning the component may be omitted from the encoding rather than a set operation; ∇ is the GP's chosen spelling of Boolean false, which is why the more conventional ⊥ is avoided; and 𝒰 yields the last of its arguments that is not ∅ — so the entry is the all-zero triple whenever the dictionary holds anything at all.","∅ has cardinality one, being a distinct inhabitant that A? adds to A; ∇ marks an unexpected failure or an invalid value and the GP prefers it to ⊥ so it is not confused with Boolean false; 𝒰 is defined for exactly two arguments, a candidate and a default; and a dictionary subscript on a missing key yields ∇ rather than ∅ — which is precisely why eq. 13.13 needs its fallback.","∅ marks a term validly left without a specific value and the optional constructor gives A? ≡ A ∪ {∅}; ∇ is a synonym for ∅ reserved for the case where the absence was anticipated, so the two are interchangeable inhabitants of A?; and 𝒰 yields the first of its arguments that *is* ∅, falling back to its last argument when none of them is — so the entry is ∅ for every service that was accumulated and the all-zero triple only for the untouched ones."],"answer":0,"explanation":"§3.3：「We commonly use ∅ to indicate that some term is validly left without a specific value. Its cardinality is defined as zero. We define the operation A? such that A? ≡ A ∪ {∅}」；「The term ∇ is utilized to indicate the unexpected failure of an operation or that a value is invalid or unexpected. (We try to avoid the use of the more conventional ⊥ here to avoid confusion with Boolean false…)」——∅ 與 ∇ 語意完全不同：前者是「合法地沒有值」，後者是「錯了」。eq. 3.2：𝒰(a_0, … a_n) ≡ a_x : (a_x ≠ ∅ ∨ x = n), ⋀_{i=0}^{x−1} a_i = ∅，GP 自己給的例子是 𝒰(∅, 1, ∅, 2) = 1 與 𝒰(∅, ∅) = ∅——取**第一個非 ∅** 的引數，可以有兩個以上引數。至於 dictionary 查不到 key 時的結果：eq. 3.7 明寫 d[k] ≡ v if ∃k : (k ↦ v) ∈ d，otherwise ∅（不是 ∇）；這正是 𝒰(S[s], (0, 0, 0)) 能運作的原因——沒被 accumulate 的 service 查出 ∅，於是落到後備的全零三元組；若 dictionary miss 真的給 ∇，eq. 13.13 這個包裝就救不回來，因為 ∇ 代表的是「出錯了」而不是「合法地沒有值」。其餘干擾各自踩到一個 §3.3 的明文：A? 是**集合運算** A? ≡ A ∪ {∅}（型別層面多一個 ∅ 元素），不是「編碼時可以省略這個欄位」的 codec 指示——那是 App. C 的事；把 ∇ 當成 Boolean false 的寫法恰恰是 GP 明文要避免的（它不用 ⊥ 就是怕跟 Boolean false 混淆），更不是「預期之內的缺值」——那個角色屬於 ∅；𝒰 取的是第一個**非** ∅（不是最後一個非 ∅，也不是第一個 ∅），而且 eq. 3.2 寫成 a_0, … a_n、GP 自己的例子 𝒰(∅, 1, ∅, 2) 就有四個引數，並非只收兩個；∅ 的 cardinality 依 §3.3 定義為零，說成一也與該句直接衝突。","trap":"∅ = 合法的「沒有值」；∇ = 錯誤。dictionary miss 給 ∅，不是 ∇；𝒰 取第一個非 ∅。"},{"id":"c3-ch03-ellipsis-ranges","ch":"3","section":"3.4 Numbers / 3.7 Sequences","gpRef":"§3.4 (Z_{a…b}, Z_{a…+b}); §3.7 (slicing, s[i]^⟲, last)","difficulty":2,"kind":"concept","tags":["notation","sequences","slicing","ranges"],"stem":"Let s = [10, 20, 30, 40, 50]. Applying the ellipsis conventions of GP §3.4 for integer sets and §3.7 for sequence slicing, which line is correct throughout?","options":["s_{…3} = [10, 20, 30], s_{1…+3} = [20, 30], Z_{1…3} = {1, 2, 3}, Z_{1…+3} = {2, 3, 4}, last(s) = 50, s[7]^⟲ = 30","s_{…3} = [10, 20, 30], s_{1…+3} = [20, 30, 40], Z_{1…3} = {1, 2}, Z_{1…+3} = {1, 2, 3}, last(s) = 50, s[7]^⟲ = 30","s_{…3} = [30, 40, 50], s_{1…+3} = [10, 20, 30], Z_{1…3} = {1, 2}, Z_{1…+3} = {1, 2, 3}, last(s) = 10, s[7]^⟲ = 40","s_{…3} = [10, 20], s_{1…+3} = [20, 30, 40, 50], Z_{1…3} = {1, 2, 3}, Z_{1…+3} = {1, 2, 3, 4}, last(s) = 50, s[7]^⟲ = 20"],"answer":1,"explanation":"§3.4：「Z_{a…b} = {x | x ∈ Z, a ≤ x < b}. E.g. Z_{2…5} = {2, 3, 4}」——**半開**區間，所以 Z_{1…3} 只有 {1, 2}；「We denote the offset/length form of this set as Z_{a…+b}, a short form of Z_{a…a+b}」——所以 Z_{1…+3} = Z_{1…4} = {1, 2, 3}。§3.7 對序列用同一套省略號：「A range may be denoted using an ellipsis for example: [0, 1, 2, 3]_{…2} = [0, 1] and [0, 1, 2, 3]_{1…+2} = [1, 2]」——下標只有結尾時是「取前 n 個」（等價於 index < n），有 …+ 時是 offset/length。s_{…3} 因此是 [10, 20, 30]，s_{1…+3} 從 index 1 起算三個 = [20, 30, 40]。同節：「We denote modulo subscription as s[i]^⟲ ≡ s[i mod |s|]」，7 mod 5 = 2，故 s[7]^⟲ = s[2] = 30；「We denote the final element x of a sequence s = [..., x] through the function last(s) ≡ x」，故 last(s) = 50。把區間讀成閉區間、把 …+ 讀成「到 index b 為止」、或把前綴切片讀成後綴，都是從 PDF 抄公式時最常見的錯誤——GP 全篇沒有任何「a 到 b 皆含」的閉區間記法。另外會在正文遇到 §3 從未定義的 N_{a…b}（preamble 的 \\Nclamp，例如 eq. 6.8 的 𝕍 ≡ {3c | c ∈ N_{2…C+1}}）：它沿用同一套半開讀法，C = 341 時 c 的上界是 341（c < 342），𝕍 的最大值才會剛好是 3 · 341 = 1023。","trap":"GP 只有兩種形式：半開的 a…b，與 offset/length 的 a…+b；序列切片沿用同一套，沒有閉區間。"},{"id":"c3-ch03-prime-dagger-record","ch":"3","section":"3.6 Tuples / 3.7 Sequences","gpRef":"§3.6 (named tuple components); eq. 4.1 (σ′ ≡ Υ(σ, B)); §4 state-transition dependency graph; eq. 13.1–13.3","difficulty":3,"kind":"concept","tags":["notation","tuples","prior-vs-posterior","state"],"stem":"Eq. 13.1–13.2 declare π ≡ (π_V, π_L, π_C, π_S) with (π_V, π_L) ∈ ⟦(b ∈ N, t ∈ N, p ∈ N, d ∈ N, g ∈ N, a ∈ N)⟧², and §13.1 then works through π_V†, π_V‡ and π′_V. An interviewer asks you to read that notation aloud. Which reading is right?","options":["∈ and the tricolon are interchangeable spellings of the same binding, so a field may equally be read back by name or by position; squaring the sequence-set says each of the two records is itself a sequence, one six-field entry per validator; §3 defines the prime as 'the value after the extrinsic has been applied'; and the dagger marks a value that has already been through the epoch rollover while the double-dagger marks one that has not.","A type declaration and a concrete value are both written with ∈, the tricolon being reserved for the key/value pairs of a dictionary, so the six counters are positional only and must be addressed by index rather than by name; squaring the sequence-set says each of the two records is itself a sequence, one six-field entry per validator; the prime denotes the Grandpa-finalized value of a state component, so π′ is only well defined once finality has caught up with the chain; and dagger and double-dagger mark the same component as it stood on a fork that was later discarded.","A type declaration introduces each component with ∈ while a concrete value binds its fields with the tricolon, and either way a field is read back by subscripting its name; squaring the sequence-set means the pair holds exactly two records in total, one per epoch, so each record carries a single validator's six counters; the prime marks the value that will be current at the start of the next epoch; and dagger and double-dagger are two further components of σ, each with its own state-trie key.","A type declaration introduces each component with ∈ while a concrete value binds its fields with the tricolon, and either way a field is read back by subscripting its name; squaring the sequence-set says each of the two records is itself a sequence, one six-field entry per validator; the undecorated symbol is the prior state and the primed one the posterior — a convention the GP fixes not in §3 but alongside σ′ ≡ Υ(σ, B) — and dagger and double-dagger mark intermediate values inside a single transition that appear in neither σ nor σ′."],"answer":3,"explanation":"§3.6 Tuples：「we may denote a tuple with two named natural components a and b as T = (a ∈ N, b ∈ N). We would denote an item t ∈ T through subscripting its name, thus for some t = (a ⦂ 3, b ⦂ 5), t_a = 3 and t_b = 5」——型別宣告用 ∈、具體值用 tricolon（⦂），兩者不可互換；欄位一律用**名字**下標讀取，不是位置索引。eq. 13.2 的上標 2 是把整個「序列集合」取平方：π_V 與 π_L **各自**都是一個序列，eq. 13.3 再釘死長度 |π_V| = |κ|、|π_L| = |λ|（0.8.0 改用 |κ|/|λ| 取代常數 V，根源是 eq. 6.8 的 𝕍 ≡ {3c | c ∈ N_{2…C+1}} 與 κ, λ ∈ ⟦𝕂⟧_𝕍——validator-set 大小在 0.8.0 是**可變**的），所以每個 validator 一筆六欄位紀錄，而不是「兩筆紀錄」。最刁鑽的一點：prime 的意義**不是**在 §3 定義的——§3 只談 typography、sets、numbers、dictionaries、tuples、sequences、cryptography，通篇沒有 prime 字樣。它是在 §4 的 eq. 4.1 旁以文字定下的：「Where σ is the prior state, σ′ is the posterior state, B is some valid block and Υ is our block-level state-transition function」。dagger 同樣出自 §4 的 dependency graph 段落：「The only synchronous entanglements are visible through the intermediate components superscripted with a dagger」——π_V† / π_V‡ 是單次 transition 內部的中間值，既不在 eq. 4.4 的 σ 分量清單裡，也沒有自己的 state-trie key（π 整體只佔 C(13) 一把）。prime 也與 finality 無關：Grandpa 只決定哪條鏈是 canonical，不改變任何一塊的 σ′；σ′ 在 Υ 算完的當下就完全確定，不必「等 finality 追上」，更不是「下一個 epoch 開始時才生效的值」。tricolon 的位置也要記牢：§3.5 的 dictionary 用的是 ↦（k ↦ v），tricolon 只出現在 §3.6 具體 tuple 值的欄位綁定，兩者不是同一個記號，也不能與型別宣告用的 ∈ 互換；欄位一律用名字下標，GP 全篇沒有以位置索引 tuple 的寫法。最後是 dagger 與 double-dagger 的先後：eq. 13.4 的 π_V† 是 **rollover 之前**（assurance 已加、尚未換代），eq. 13.5 產出的 π_V‡ 才是 **rollover 之後**的起點——把兩者的先後說反，正好會把 epoch 邊界那一塊的 counter 放錯 record。","trap":"「prime 在 GP 哪一節定義？」——不在 §3，而是 §4 eq. 4.1；dagger/double-dagger 也是 §4 交代的中間值。"},{"id":"c3-ch07-reported-map-shape","ch":"7","section":"7 Recent History","gpRef":"eq. 7.2 & 7.8; §7","difficulty":1,"kind":"concept","tags":["recent-history","reported-packages"],"stem":"Every item of β_H carries a field p. In GP 0.8.0, what does p hold, and what bounds the number of entries it can have?","options":["A sequence of the payload hashes of every work-item in every report of the block; at most I = 16 entries, the maximum number of work-items one work-package may carry, so the bound does not scale with the number of cores","A dictionary keyed by each work-package hash guaranteed in that block, whose value is that package's segment-root; at most C = 341 entries, because a block can report at most one work-report per core","A set holding the header hashes of the block's ancestors; at most H = 8 entries, one for each block kept in the recent-history window, which is what bounds a refinement context's anchor to eight blocks of depth","A dictionary keyed by each guaranteed work-package hash, whose value is the index of the core the work ran on; at most O = 8 entries, matching the size of a core's authorizer pool"],"answer":1,"explanation":"eq. 7.2 宣告 p ∈ D⟨H → H⟩（hash 對 hash 的 dictionary），eq. 7.8 把它建成 {((g_r)_s)_p ↦ ((g_r)_s)_e | g ∈ E_G}，也就是「本區塊 guarantee 的 work-package hash ↦ 該 package 的 segment-root（exports root）」。§7 原文說得很直白：\"the corresponding work-package hashes of each item reported (which is no more than the total number of cores, C = 341)\" —— 上限來自每個 core 每個區塊至多一份 report（eq. 11.32 要求 ρ‡[w_c] = ∅）。header hash 存在同一個 item 的 h 欄位，不在 p；core index 從頭到尾沒有進 β，report 已經自帶 w_c；I = 16 是單一 work-package 內 work-item 的數量上限（eq. 14.2），跟 recent history 無關。團隊 0.7.2 對應的型別是 []ReportedWorkPackage{Hash, ExportsRoot}，其 Validate() 正是拿 CoresCount 當上限。另外兩個上限也別記混：anchor 只能往回 8 個區塊，是因為 β_H 本身最多留 H = 8 筆（eq. 7.2 的 :H 截斷），不是因為 p 裡裝了 8 個祖先 header hash；而 I = 16 是「單一 work-package 的 work-item 數」上限，一個區塊可以有多達 C 份 report，用它當 p 的上限方向完全錯了。","trap":"p 的 value 不是隨便的雜湊，是 segment-root；eq. 11.44 要靠這個 value 驗 segment-root 與 package hash 配對。"},{"id":"c3-ch07-reported-map-downstream","ch":"7","section":"7 Recent History","gpRef":"eq. 7.8 & eq. 11.41–11.44","difficulty":2,"kind":"concept","tags":["recent-history","guarantees","anti-replay"],"stem":"When a block's guarantees extrinsic E_G is validated in §11, which of the on-chain checks actually read the reported-package maps stored inside β_H?","options":["Only the anti-duplicate one; prerequisites and the segment-root lookup are instead resolved against ξ (accumulation history) and the ready queue ω, whose dependency sets are what eventually clear a report for accumulation — so the maps in β_H would be redundant there and exist purely for the duplicate test","None of them: the maps exist to build BEEFY inclusion proofs for third parties, and §11 re-derives recent package hashes by decoding the E_G of the last eight blocks out of the block store — which is why the ancestor set A must retain L = 14,400 blocks complete with their extrinsics rather than headers alone","Three of them: an incoming package hash must not already be a key of any recent block's map (anti-duplicate); every prerequisite and every key of a report's segment-root lookup l must be such a key or come from this block's own guarantees; and l must be a sub-dictionary of those maps, so each segment-root matches its package hash","Only the refinement-context anchor check: the anchor's header hash, state root, super-peak and timeslot are all looked up among the maps of β†, while duplicates are caught later during accumulation, where a package hash already present in ξ is simply dropped from the ready queue instead of invalidating the block"],"answer":2,"explanation":"三處都在 §11：(1) eq. 11.41 要求 ∀p ∈ 本區塊 package hashes，p ∉ ⋃_{x ∈ β_H} K(x_p) ∪ ⋃ξ ∪ q ∪ a —— 這是反重複／反過期的主線，也是 §7 開頭說保留最近 H 個區塊的理由（\"to preclude the possibility of duplicate or out of date work-reports\"）；(2) eq. 11.42 要求 prerequisites 與 l 的每個 key 落在本區塊 E_G 或某個 β_H item 的 p 的 keys 裡；(3) eq. 11.44 要求 w_l ⊆ 本區塊 package-hash↦segment-root ∪ ⋃_{b ∈ β_H} b_p，是 dictionary 的包含關係，所以 value（segment-root）也必須吻合。把它縮成「只有反重複」是錯的：ξ 與 ω 確實出現在 eq. 11.41 的聯集裡，但它們是額外的來源，不是 prerequisite 檢查的依據。anchor 檢查是 eq. 11.36，比對的是 β† item 的 h、s、b、t 四個欄位，跟 p 無關。最後一個說法方向相反：p 存在鏈上狀態正是為了不必去翻歷史區塊的 extrinsic——§5 只要求保留最近 L = 14,400 slots 的 *header* 作為 ancestor set A，沒有任何條款要求留住舊 extrinsic，而 BEEFY 承諾的是 accumulation output（β_B 的 super-peak），與 p 無關。「重複交給 accumulation 處理、把已在 ξ 的 package 從 ready queue 丟掉」也錯：eq. 11.41 是區塊有效性條件，撞到就整塊不合法，不會留到 accumulation 再默默丟。","trap":"同一份 map 同時被用來「拒絕重複」與「接受依賴」——方向相反，別記反了。"},{"id":"c3-ch07-superpeak-to-beefy","ch":"7","section":"7 Recent History","gpRef":"eq. 7.7, 7.8; eq. E.8, E.10; §18 Beefy","difficulty":2,"kind":"concept","tags":["recent-history","mmr","beefy","keccak"],"stem":"Trace how a block's accumulation outputs end up inside a BEEFY signature. Which description matches GP 0.8.0?","options":["Each block Keccak-Merklizes θ′ into one root, appends it to β_B, and validators BLS-sign the whole encoded peak sequence of β_B; the super-peak exists only so that state key C(3) has one fixed-length field, which is why eq. 18.1's signed message is E(mmrencode(β_B)) rather than a single hash","The belt is rebuilt from θ with Blake2b every block and validators sign the root of the current block's outputs alone, so one BEEFY signature attests exactly one block's accumulation results and a verifier wanting an older output re-derives its root from that block's own C(16) entry","The block header carries the super-peak in a dedicated marker and validators sign the header hash; β_B is guarantor-side bookkeeping that never enters the serialized state, so a bridge only ever needs the header chain and never has to read a state proof","Each block Keccak-Merklizes the encoded θ′ into one root and appends that root to the belt β_B; the new β_H item stores only the belt's Keccak super-peak; validators then BLS-sign the domain-separated hash of the newest item's super-peak for each block they finalize"],"answer":3,"explanation":"eq. 7.6–7.7：s = [E_4(s) ⌢ E(h) | (s, h) ∈ θ′]，β′_B ≡ A(β_B, M_B(s, H_K), H_K)，全程用 Keccak，GP 原文的理由是 \"to maximize compatibility with legacy systems\"。eq. 7.8 新 item 的 b 欄位放 M_R(β′_B)，也就是 belt 的 super-peak（eq. E.10：先濾掉 ∅ peaks，只剩一個就直接回傳，否則以 $peak ⌢ M_R(前 n−1 個) ⌢ 最後一個 由右向左折疊）。beefy.tex eq. 18.1：F_v ≡ S^BLS_{κ′[v]_l}(X_B ⌢ last(β_H)_b)，X_B = $jam_beefy，對每個 finalized block 簽一次。簽整串 peaks 是錯的：完整 peak 序列確實以 E(mmrencode(β_B)) 進了 C(3)，但簽的是 32-byte super-peak，把序列壓成單一 commitment 才能給第三方簡潔證明。header 沒有 beefy marker（eq. 5.1 只有 epoch/winners/offenders 三個 marker）。用 Blake2b 或只涵蓋單一區塊也錯：MMB 是 append-only 累積結構，一個 super-peak 覆蓋創世以來所有 accumulation output。附帶一提，GP 0.8.0 的用語是 MMB（Merkle mountain belt）／Accumulation Output Log，團隊 0.7.2 程式碼叫它 beefyBelt / BeefyRoot，是同一個東西。另外兩個細節也別被騙：C(3) 的內容是「每筆 item 的編碼 + mmrencode(β_B)」，belt 確確實實進了序列化狀態，「只是 guarantor 的帳本」不成立，bridge 想拿 super-peak 仍得走狀態證明；而 C(16) 只裝「本區塊」的 θ，上一塊的輸出不會留在那裡，所以「回去翻某塊的 C(16) 重算 root」在鏈上是查不到的。","trap":"θ′ 是本區塊的輸出序列（另一個狀態項），β_B 是跨區塊的 belt；被 append 的是 θ′ 的 M_B root，不是 θ′ 本身。"},{"id":"c3-ch07-dagger-before-append","ch":"7","section":"7 Recent History","gpRef":"eq. 7.5, 7.8 & eq. 11.36","difficulty":2,"kind":"rationale","tags":["recent-history","pipelining","ordering"],"stem":"An implementer builds β′_H by first appending this block's new item (state root = H_0) and only then applying the parent-state-root back-fill of eq. 7.5 to 'the last element of the sequence'. What actually goes wrong?","options":["Only β_B is corrupted: the new item's super-peak would be taken from an uncorrected belt, so BEEFY roots drift apart while the recent-history entries and the state root stay correct, because eq. 7.7 folds the parent's back-filled state root into the leaf it appends and eq. 11.36 never looks at b","The history window slides one block too early, leaving β_H permanently at H − 1 = 7 entries, so eq. 11.36 rejects any anchor exactly eight blocks old while everything else still matches, since the ←(…)^H truncation belongs to eq. 7.5 rather than to the append of eq. 7.8 — the symptom is a rejected guarantee, never a state-root mismatch","Nothing observable: the last element is the same item either way once the block is finished, and eq. 7.5's correction is idempotent, so both orders produce the same C(3) preimage — which is precisely why the GP states β† as an exception on β_H instead of fixing an order of operations, and why implementations differ here without diverging","The back-fill lands on the block's own fresh item, so every entry ends up carrying its parent's posterior root instead of its own, and the parent's entry never receives the correction it was meant for; from then on eq. 11.36's state-root comparison rejects honest refinement contexts and the C(3) preimage diverges from every other node's"],"answer":3,"explanation":"eq. 7.5 的 β† ≡ β_H 只改「β_H 最後一個 item」的 s ← H_R，而 H_R 是本區塊 header 攜帶的 *parent* posterior state root（header.tex：JAM 刻意在 header 放 prior state root 以利 pipelining）。正確順序是先 β_H → β†（修好上一個區塊的 s），再 append 新 item 且 s = H_0。順序顛倒後，被修的是剛 append 的新 item，於是它拿到的是「上一個區塊」的 root，而上一個區塊的 item 再也拿不到本該補給它的 root——整條 β_H 系統性 off-by-one（注意：不會有任何 item 停在 H_0，新 item 一 append 就被錯位的修正立刻蓋掉）。後果有兩層：eq. 11.36 要求 x_s = y_s（context 的 anchor posterior state root 對上 β† item 的 s），guarantor 給的是真值，這台節點比對必失敗；而 C(3) 直接把每個 item 的 s 編進狀態序列化，state root 立刻和別人不同，fuzz trace 會停在 state-root mismatch。說「兩種順序等價」忽略了修改目標會變。β† 完全不碰 β_B，也不改變長度上限 ←(…)^H = 8 的截斷，所以另外兩個說法都不成立。GP 自己的註腳講清楚了為什麼 H_0 是安全的：\"β′ is not utilized except to define the next block's β†\"。再補三刀：eq. 7.5 的定義域是 β_H（append 之前的舊值），所以兩種順序改到的是不同的 item，「idempotent、序列化一樣」不成立；eq. 7.7 append 進 belt 的 leaf 是 M_B(s, H_K)、s 由 θ′ 編碼而來，完全沒有 state root 的成分，而 eq. 11.36 也確實比對 x_b = y_b，「從不看 b」是錯的；至於長度，←(…)^H 出現在 eq. 7.8 的 append 而不是 eq. 7.5，β† 只改一個欄位、不動長度，所以窗口永遠是 8，而且一旦 β_H 的內容錯了，C(3) 立刻不同——先炸的是 state root，不是 guarantee。","trap":"β† 修的是「上一個區塊」的 s，不是自己的；先修再 append，順序寫反不會報錯，只會 state root 不對。"},{"id":"c3-ch07-c3-field-order","ch":"7","section":"7 Recent History","gpRef":"eq. 7.2 & §D.1 state key C(3)","difficulty":3,"kind":"code","tags":["recent-history","codec","delta-0.8.0","gotcha"],"stem":"This is the team's GP 0.7.2 encoder for one β_H item under state key C(3). A reviewer objects that GP 0.8.0 declares the item as ⟨h, s, b, t, p⟩ — state root ahead of the accumulation-output-log super-peak — so the encoder must have two fields swapped. Who is right?","code":{"lang":"go","caption":"internal/types/encode.go:1950-1980 (BlockInfo.Encode; log line elided)","src":"func (bi *BlockInfo) Encode(e *Encoder) error {\n\t// HeaderHash\n\tif err := bi.HeaderHash.Encode(e); err != nil {\n\t\treturn err\n\t}\n\t// BeefyRoot\n\tif err := bi.BeefyRoot.Encode(e); err != nil {\n\t\treturn err\n\t}\n\t// StateRoot\n\tif err := bi.StateRoot.Encode(e); err != nil {\n\t\treturn err\n\t}\n\t// Reported\n\tif err := e.EncodeLength(uint64(len(bi.Reported))); err != nil {\n\t\treturn err\n\t}\n\tfor _, reportedWorkPackage := range bi.Reported {\n\t\tif err := reportedWorkPackage.Encode(e); err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n\treturn nil\n}"},"options":["The reviewer is right: a state component is always serialized in the order its defining equation lists the fields, so C(3) needs header hash, state root, super-peak, timeslot, reported map; appendix D merely restates the tuple of chapter 7 and the two can never disagree, so as written the encoder produces the wrong C(3) preimage and therefore the wrong state root","Both are wrong: C(3) holds only the encoded peak sequence of β_B, while the per-block items are committed through a marker in the header and otherwise kept off-chain by each node, so this encoder should not be feeding state serialization at all and whichever order it uses cannot move the state root","The encoder's order is right: state serialization is fixed by C(3) in appendix D, which emits header hash, then super-peak, then state root, then the timeslot, then the reported map; the tuple in chapter 7 merely names the components. The real 0.8.0 gap is the missing 4-byte timeslot between the state root and the reported map","The reviewer is right about the order and about the shape: 0.8.0 replaced the per-item super-peak with the full peak sequence, so each item must encode the whole belt where this code writes a single 32-byte hash, and eq. 11.36 compares an anchor against that sequence rather than against one commitment"],"answer":2,"explanation":"兩個地方都是 0.8.0 原文，但講的是不同的事。eq. 7.2 用具名欄位宣告集合：β_H ∈ ⟦⟨h ∈ H, s ∈ H, b ∈ H, t ∈ N_T, p ∈ D⟨H → H⟩⟩⟧_:8。附錄 D 的 C(3) 才是序列化定義，它明寫成 E(var[⟨h, b, s, E_4(t), var(p)⟩ | … ∈ β_H], mmrencode(β_B))——super-peak 在 state root 前面。GP 具名 tuple 的欄位順序不等於 codec 順序，狀態這一塊以 D.1 為準；jam test vectors 的 history JSON（header_hash, mmr, state_root, reported）與團隊的 BlockInfo{HeaderHash, BeefyRoot, StateRoot, Reported} 都跟 D.1 一致，這段 0.7.2 程式碼的順序沒問題。真正要補的是 0.8.0 新增的 t：GP PR #526 把 anchor 的 timeslot 放進 refinement context，eq. 11.36 因此多比一項 x_n = y_t，團隊 PR #1031 就是在 state_root 與 reported 之間插入 4-byte timeslot。C(3) 同時存了整條 belt（mmrencode(β_B)）與每個 item 的 32-byte super-peak，兩者並存；header 只有 epoch／winners／offenders 三個 marker，沒有 β marker，所以「item 靠 header marker 承諾、編碼順序動不了 state root」整句都不成立。「附錄 D 只是重述第 7 章的 tuple，兩者不可能不一致」正是本題要打掉的直覺：D.1 是獨立的定義，它就是把 b 排在 s 前面。至於「每個 item 要塞整條 peak 序列」——eq. 7.2 把 b 的型別寫成 b ∈ H，是 eq. E.10 算出來的單一 super-peak；eq. 11.36 也只比一個 32-byte 值（x_b = y_b），整條 belt 在 C(3) 裡只出現一次，不會被複製到每一筆 item。","trap":"宣告順序 ≠ 編碼順序。C(3) 是 b 在 s 前面；照 chapter 7 的順序寫 codec，值全對也會 state root 不對。"},{"id":"c3-ch08-queue-writer","ch":"8","section":"8.2 Pool and Queue","gpRef":"§8.2 (note under eq. 8.1); assign host call (index 16)","difficulty":1,"kind":"concept","tags":["authorization","privileges","host-calls"],"stem":"Who is permitted to change a core's authorizer queue φ[c] in GP 0.8.0, and through what mechanism?","options":["The block author, by including an authorization extrinsic alongside E_G as the sixth member of the extrinsic; the other validators re-check it against the coretime-sales record before accepting the block, and φ′ is then simply whatever that extrinsic declares","Nobody on-chain: φ is each node's local view of purchased coretime, gossiped off-chain by the coretime chain, and only a commitment to it ever reaches consensus — carried in the very same header marker that publishes the epoch's winning tickets","Any service may call `assign`, but the write only takes effect on cores whose pool has fallen empty; the manager service can override any core at any time with `bless`, and both writes land at the end of the block so that a core cannot be re-assigned twice in a row","Only the service currently registered as that core's assigner, and only from inside its accumulate execution, by calling `assign`, which replaces all Q = 80 entries of that one core's queue in a single call and may also hand the assigner role to another service"],"answer":3,"explanation":"§8.2 在 eq. 8.1 底下直接寫死：\"The portion of state φ may be altered only through an exogenous call made from the accumulate logic of an appropriately privileged service.\" 那個 privileged service 就是 χ_A[c]（per-core assigner）。host call Ω_A（`assign` = 16）從 ω_7..ω_9 取 (c, o, a)，自 memory 位址 o 讀 Q = 80 個 32-byte hash：c ≥ C 回 CORE，呼叫者 service id ≠ χ_A[c] 回 HUH，a 不是合法 service id 回 WHO，成功才 φ[c] ← q 並把 χ_A[c] ← a（Owned Privileges，讓 assigner 可以轉手）。所以是整批覆寫單一 core 的 queue，不是逐格插入，也跟 pool 空不空無關。`bless` 動的是 χ 的 privileges（0.8.0 PR #519 起只有 manager 能呼叫），碰不到 φ。JAM 是 transactionless 的：extrinsic 只有 E_T、E_P、E_G、E_A、E_D 五種，沒有「第六個」authorization extrinsic，coretime 的成交紀錄也不是鏈上共識條件。「pool 空了才生效」與 eq. 8.2 相違——每個區塊每個 core 都會抽一格 queue 進 pool，跟 pool 滿不滿無關。「只有 commitment 經由 header marker 進共識」則同時錯兩件事：eq. 8.1 的 φ ∈ ⟦⟦H⟧_Q⟧_C 是不折不扣的狀態元件（序列化在 C(2)），而 eq. 5.1 的 marker 只有 epoch、winning-tickets、offenders 三個。","trap":"「誰能寫 φ」與「誰能寫 χ」不同：assign 由 per-core assigner 呼叫，bless 只屬於 manager。"},{"id":"c3-ch08-rotation-index-cyclic","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 8.1–8.2","difficulty":2,"kind":"concept","tags":["authorization","rotation"],"stem":"Each block moves exactly one queue entry into every core's pool. How is that entry picked, and what becomes of the entries belonging to slots in which no block was produced?","options":["By a per-core cursor kept beside the pool that advances one step per imported block, so no queue entry is ever skipped — an empty slot merely postpones the rotation, the cursor being serialized next to α[c] under state key C(1)","By cyclic subscription on the block's own timeslot, i.e. index H_T mod Q, with no stored cursor anywhere; a slot that produces no block simply never has its entry drawn, and that index only comes round again 80 slots later","By index H_T mod O, so only the first eight queue positions ever rotate into the pool and the remaining 72 stay unreachable until an `assign` call shifts them forward, so an authorizer parked at index 40 stays out of reach until `assign` rotates the queue","By taking the oldest not-yet-used entry (FIFO) and deleting it from the queue as it enters the pool, which is why the assigner must refill a core's queue at least every 80 blocks and why φ[c] is shorter than Q between refills"],"answer":1,"explanation":"eq. 8.2：∀c ∈ N_C : α′[c] ≡ ←(F(c) ⌢ φ′[c]↺[H_T])^O。notation.tex 定義 modulo subscription s↺[i] ≡ s[i mod |s|]，而 eq. 8.1 規定 φ ∈ ⟦⟦H⟧_Q⟧_C —— 每個 core 的 queue 是「剛好 Q = 80 個」的序列（相對地 α ∈ ⟦⟦H⟧_:O⟧_C 是「至多 O = 8 個」）。索引直接來自 header 的 timeslot，不是狀態裡的游標，所以分叉、空 slot、Safrole 沒出票的 slot 對應的那格這一輪就是被跳過，要等 80 個 slot 後同餘再回來；實作若自己維護 cursor，只要鏈上出現空 slot 就會與參考實作分歧。queue 不會因為被抽取而縮短或清空（它不是 FIFO，也不需要定期補），唯一能改它的是 assign。O = 8 只出現在最後的 ←(…)^O 截斷，用來保留最右邊 8 個，跟選哪一格無關；queue 的 80 格每一格都會在 80 個 slot 內輪到，沒有「前 8 格以外碰不到」這回事，assign 也不會把 queue 往前轉——它是整批覆寫。若照 FIFO 的說法把用掉的項刪掉，φ[c] 就會短於 Q，直接違反 eq. 8.1 的固定長度型別；而「游標存在 α[c] 旁邊」在附錄 D 也找不到落腳處——C(1) 只映射到 E([var(x) | x ∈ α])，沒有多餘欄位可放游標。","trap":"抽 queue 用 mod Q（80），截 pool 用 O（8）——兩個常數各司其職，別互換。"},{"id":"c3-ch08-psi-i-visibility","ch":"8","section":"8.1 Authorizers and Authorizations","gpRef":"eq. B.1–B.2; §8.1","difficulty":2,"kind":"concept","tags":["authorization","pvm","delta-0.8.0"],"stem":"A guarantor runs the Is-Authorized logic Ψ_I before refining anything. What is that program actually able to observe?","options":["The work-package plus a read-only snapshot of the service accounts δ, reached through the same `read` and `lookup` host calls Accumulate uses, so an authorizer can check a balance or confirm that the coretime buyer still holds the core it is running on; the snapshot is pinned to the anchor block so that every auditor sees identical values","The work-package, the core index and a historical lookup pinned to the lookup-anchor timeslot, exactly as Refine gets it, since the authorization code is itself resolved by that same lookup; an authorizer may therefore read any preimage its host service had solicited by that slot, such as a whitelist published by the coretime buyer","The work-package and the core's own authorizer pool, handed in beside the core index because it is at most O × 32 = 256 octets, so that the code can confirm its own hash is still pooled and abort early rather than burn the guarantor's gas on a package eq. 11.32 will reject anyway","Its two arguments only — the work-package and the core index, the latter handed to the PVM as a 2-byte encoded argument — plus whatever `fetch` can pull out of that package, and the protocol constants; no chain state at all, and besides `fetch` the only host calls are the gas counter and heap growth"],"answer":3,"explanation":"eq. B.1：Ψ_I : (P, N_C) → (B ∪ E, N_G)，實際執行 Ψ_M(auth code, 0, G_I, E_2(c), F, ∅)，其中 G_I = 50,000,000、argument blob 就是 E_2(c)；auth code 解不出來（∅）回 BAD、長度 > W_A = 64,000 回 BIG。eq. B.2 的 dispatch F 只認三個 host call：gas、grow_heap、fetch，其他一律扣 M_∅ 並把 ω_7 設成 WHAT。GP 原文：\"totally stateless … we elide the host-call context since, being essentially stateless, it is always ∅\"。fetch（Ω_Y）在這裡除了 work-package 之外的參數全是 ∅，所以 selector 0（protocol constants）與 7–13（package 編碼、config、token、context、work-item metadata、payload）可用，selector 1–6 與 14/15（entropy、authorizer trace、extrinsics、import segments）一律回 NONE。看得到 δ 或 α 都是錯的：Ψ_I 完全無狀態，正因如此每個 auditor 事後重跑必然得到相同結果。歷史查詢 Λ 只有 Ψ_R（eq. B.5）有；auth code 由 lookup anchor 解析是「誰把 code 餵給 Ψ_I」，不代表 Ψ_I 自己能呼叫 Λ。0.8.0 delta：堆積成長的 host call 由 0.7.2 的 `sbrk` 更名為 `grow_heap`（index 1，PR #508 的新 gas model 一起改），Go 端的 dispatch 表要跟著改。逐項再說一次為什麼那三個都不行：δ 的唯讀快照要靠 `read`／`lookup`，而 eq. B.2 的 F 只認得 gas、grow_heap、fetch 三個名字，其餘一律 WHAT，所以「用 Accumulate 那套 host call」在 Ψ_I 根本叫不出來；歷史查詢 Λ 是 Ψ_R 的專利（eq. B.5 的 Ω_H），「code 由 lookup anchor 解析」講的是 eq. 14.11 由外部把 code 餵進 Ψ_I，不代表程式自己能查 preimage，因此「讀 whitelist」辦不到；至於把 α[c] 當第二個參數傳進來，eq. B.1 白紙黑字只有 (P, N_C) 兩個參數、PVM 的 argument blob 就是 E_2(c) 這 2 bytes，pool 大小是 256 bytes 也進不去——況且 Ψ_I 若能讀 pool 就不再是 stateless，auditor 事後重跑會因為 pool 已經輪替而得到不同結果。","trap":"Ψ_I 無狀態 ⇒ 授權邏輯不能讀鏈上餘額；要收錢只能靠 accumulate 那一端。"},{"id":"c3-ch08-authcode-lookup-anchor","ch":"8","section":"8.1 Authorizers and Authorizations","gpRef":"eq. 14.11; §8.1","difficulty":2,"kind":"rationale","tags":["authorization","auditing","determinism"],"stem":"The pool α[c] stores nothing but 32-byte authorizer hashes. So where does a guarantor obtain the executable is-authorized code, and as of which point in history is it resolved — and why there?","options":["From the preimage store of the separate auth-code host service named by the work-package, resolved by a historical lookup at the package's lookup-anchor timeslot, so that an auditor re-running the check much later resolves byte-identical code even if that
