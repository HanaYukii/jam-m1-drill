C(13) 一把）。兩者先後見 eq. 13.4 的 π_V†（rollover **之前**：assurance 已加、尚未換代）與 eq. 13.5 產出的 π_V‡（rollover **之後**的起點）——把先後說反，正好會把 epoch 邊界那一塊的 counter 放錯 record。","trap":"「prime 在 GP 哪一節定義？」——不在 §3，而是 §4 eq. 4.1；dagger/double-dagger 也是 §4 交代的中間值。"},{"id":"c3-ch07-reported-map-shape","ch":"7","section":"7 Recent History","gpRef":"eq. 7.2 & 7.8; §7","difficulty":1,"kind":"concept","tags":["recent-history","reported-packages"],"stem":"Every item of β_H carries a field p. In GP 0.8.0, what does p hold, and what bounds the number of entries it can have?","options":["A sequence of the payload hashes of every work-item in every report of the block; at most I = 16 entries, the maximum number of work-items one work-package may carry, so the bound does not scale with the number of cores","A dictionary keyed by each work-package hash guaranteed in that block, whose value is that package's segment-root; at most C = 341 entries, because a block can report at most one work-report per core","A set holding the header hashes of the block's ancestors; at most H = 8 entries, one for each block kept in the recent-history window, which is what bounds a refinement context's anchor to eight blocks of depth","A dictionary keyed by each guaranteed work-package hash, whose value is the index of the core the work ran on; at most O = 8 entries, matching the size of a core's authorizer pool"],"answer":1,"optNotes":["I = 16 是單一 work-package 的 work-item 數上限（eq. 14.2），而一個區塊可有多達 C 份 report。","§7 原文就寫 no more than the total number of cores, C = 341，且 value 是 segment-root。","header hash 存在同一個 item 的 h 欄位；anchor 深度 8 來自 β_H 本身的 :H 截斷，不是 p 的內容。","core index 從頭到尾沒有進 β（report 自帶 w_c），O = 8 是 authorizer pool 的上限。"],"explanation":"eq. 7.2 宣告 p ∈ D⟨H → H⟩（hash 對 hash 的 dictionary），eq. 7.8 把它建成 {((g_r)_s)_p ↦ ((g_r)_s)_e | g ∈ E_G}，也就是「本區塊 guarantee 的 work-package hash ↦ 該 package 的 segment-root（exports root）」。§7 原文說得很直白：\"the corresponding work-package hashes of each item reported (which is no more than the total number of cores, C = 341)\" —— 上限來自每個 core 每個區塊至多一份 report（eq. 11.32 要求 ρ‡[w_c] = ∅）。團隊 0.7.2 對應的型別是 []ReportedWorkPackage{Hash, ExportsRoot}，其 Validate() 正是拿 CoresCount 當上限。","trap":"p 的 value 不是隨便的雜湊，是 segment-root；eq. 11.44 要靠這個 value 驗 segment-root 與 package hash 配對。"},{"id":"c3-ch07-reported-map-downstream","ch":"7","section":"7 Recent History","gpRef":"eq. 7.8 & eq. 11.41–11.44","difficulty":2,"kind":"concept","tags":["recent-history","guarantees","anti-replay"],"stem":"When a block's guarantees extrinsic E_G is validated in §11, which of the on-chain checks actually read the reported-package maps stored inside β_H?","options":["Only the anti-duplicate one; prerequisites and the segment-root lookup are instead resolved against ξ (accumulation history) and the ready queue ω, whose dependency sets are what eventually clear a report for accumulation — so the maps in β_H would be redundant there and exist purely for the duplicate test","None of them: the maps exist to build BEEFY inclusion proofs for third parties, and §11 re-derives recent package hashes by decoding the E_G of the last eight blocks out of the block store — which is why the ancestor set A must retain L = 14,400 blocks complete with their extrinsics rather than headers alone","Three of them: an incoming package hash must not already be a key of any recent block's map (anti-duplicate); every prerequisite and every key of a report's segment-root lookup l must be such a key or come from this block's own guarantees; and l must be a sub-dictionary of those maps, so each segment-root matches its package hash","Only the refinement-context anchor check: the anchor's header hash, state root, super-peak and timeslot are all looked up among the maps of β†, while duplicates are caught later during accumulation, where a package hash already present in ξ is simply dropped from the ready queue instead of invalidating the block"],"answer":2,"optNotes":["ξ 與 ω 只是 eq. 11.41 聯集裡的額外來源；eq. 11.42 的 prerequisite 檢查照樣讀 β_H 的 p。","p 上鏈正是為了不必翻舊 extrinsic；ancestor set A 只留 header，BEEFY 承諾的是 β_B 的 super-peak。","eq. 11.41 反重複、11.42 解 prerequisite 與 l 的 key、11.44 要求 w_l 是子字典，三處都讀 p。","anchor 檢查是 eq. 11.36、比對 h/s/b/t 與 p 無關；eq. 11.41 撞到就整塊不合法，不會留到 accumulation。"],"explanation":"三處都在 §11：(1) eq. 11.41 要求 ∀p ∈ 本區塊 package hashes，p ∉ ⋃_{x ∈ β_H} K(x_p) ∪ ⋃ξ ∪ q ∪ a —— 這是反重複／反過期的主線，也是 §7 開頭說保留最近 H 個區塊的理由（\"to preclude the possibility of duplicate or out of date work-reports\"）；(2) eq. 11.42 要求 prerequisites 與 l 的每個 key 落在本區塊 E_G 或某個 β_H item 的 p 的 keys 裡；(3) eq. 11.44 要求 w_l ⊆ 本區塊 package-hash↦segment-root ∪ ⋃_{b ∈ β_H} b_p，是 dictionary 的包含關係，所以 value（segment-root）也必須吻合。","trap":"同一份 map 同時被用來「拒絕重複」與「接受依賴」——方向相反，別記反了。"},{"id":"c3-ch07-superpeak-to-beefy","ch":"7","section":"7 Recent History","gpRef":"eq. 7.7, 7.8; eq. E.8, E.10; §18 Beefy","difficulty":2,"kind":"concept","tags":["recent-history","mmr","beefy","keccak"],"stem":"Trace how a block's accumulation outputs end up inside a BEEFY signature. Which description matches GP 0.8.0?","options":["Each block Keccak-Merklizes θ′ into one root, appends it to β_B, and validators BLS-sign the whole encoded peak sequence of β_B; the super-peak exists only so that state key C(3) has one fixed-length field, which is why eq. 18.1's signed message is E(mmrencode(β_B)) rather than a single hash","The belt is rebuilt from θ with Blake2b every block and validators sign the root of the current block's outputs alone, so one BEEFY signature attests exactly one block's accumulation results and a verifier wanting an older output re-derives its root from that block's own C(16) entry","The block header carries the super-peak in a dedicated marker and validators sign the header hash; β_B is guarantor-side bookkeeping that never enters the serialized state, so a bridge only ever needs the header chain and never has to read a state proof","Each block Keccak-Merklizes the encoded θ′ into one root and appends that root to the belt β_B; the new β_H item stores only the belt's Keccak super-peak; validators then BLS-sign the domain-separated hash of the newest item's super-peak for each block they finalize"],"answer":3,"optNotes":["完整 peak 序列只以 mmrencode(β_B) 進 C(3)；eq. 18.1 簽的是壓成 32-byte 的 super-peak。","MMB 是 append-only 且全程用 Keccak；C(16) 只裝本區塊的 θ，翻不到舊區塊的 root。","eq. 5.1 只有 epoch／winners／offenders 三個 marker；belt 確實進了 C(3)，bridge 仍得走狀態證明。","eq. 7.7 append 的是 M_B(s, H_K)、eq. 7.8 的 b 存 super-peak、eq. 18.1 簽 X_B ⌢ last(β_H)_b。"],"explanation":"eq. 7.6–7.7：s = [E_4(s) ⌢ E(h) | (s, h) ∈ θ′]，β′_B ≡ A(β_B, M_B(s, H_K), H_K)，全程用 Keccak，GP 原文的理由是 \"to maximize compatibility with legacy systems\"。eq. 7.8 新 item 的 b 欄位放 M_R(β′_B)，也就是 belt 的 super-peak（eq. E.10：先濾掉 ∅ peaks，只剩一個就直接回傳，否則以 $peak ⌢ M_R(前 n−1 個) ⌢ 最後一個 由右向左折疊）。beefy.tex eq. 18.1：F_v ≡ S^BLS_{κ′[v]_l}(X_B ⌢ last(β_H)_b)，X_B = $jam_beefy，對每個 finalized block 簽一次。把序列壓成單一 commitment 才能給第三方簡潔證明。GP 0.8.0 的用語是 MMB（Merkle mountain belt）／Accumulation Output Log，團隊 0.7.2 程式碼叫它 beefyBelt / BeefyRoot，是同一個東西。","trap":"θ′ 是本區塊的輸出序列（另一個狀態項），β_B 是跨區塊的 belt；被 append 的是 θ′ 的 M_B root，不是 θ′ 本身。"},{"id":"c3-ch07-dagger-before-append","ch":"7","section":"7 Recent History","gpRef":"eq. 7.5, 7.8 & eq. 11.36","difficulty":2,"kind":"rationale","tags":["recent-history","pipelining","ordering"],"stem":"An implementer builds β′_H by first appending this block's new item (state root = H_0) and only then applying the parent-state-root back-fill of eq. 7.5 to 'the last element of the sequence'. What actually goes wrong?","options":["Only β_B is corrupted: the new item's super-peak would be taken from an uncorrected belt, so BEEFY roots drift apart while the recent-history entries and the state root stay correct, because eq. 7.7 folds the parent's back-filled state root into the leaf it appends and eq. 11.36 never looks at b","The history window slides one block too early, leaving β_H permanently at H − 1 = 7 entries, so eq. 11.36 rejects any anchor exactly eight blocks old while everything else still matches, since the ←(…)^H truncation belongs to eq. 7.5 rather than to the append of eq. 7.8 — the symptom is a rejected guarantee, never a state-root mismatch","Nothing observable: the last element is the same item either way once the block is finished, and eq. 7.5's correction is idempotent, so both orders produce the same C(3) preimage — which is precisely why the GP states β† as an exception on β_H instead of fixing an order of operations, and why implementations differ here without diverging","The back-fill lands on the block's own fresh item, so every entry ends up carrying its parent's posterior root instead of its own, and the parent's entry never receives the correction it was meant for; from then on eq. 11.36's state-root comparison rejects honest refinement contexts and the C(3) preimage diverges from every other node's"],"answer":3,"optNotes":["β† 完全不碰 β_B（belt 的 leaf 由 θ′ 編碼而來），而 eq. 11.36 確實也比對 x_b = y_b。","←(…)^H 的截斷在 eq. 7.8 的 append 而非 eq. 7.5；先炸的是 state root，不是 guarantee。","兩種順序改到的是不同的 item，「idempotent、序列化結果一樣」因此不成立。","eq. 7.5 的定義域是 append 前的 β_H，順序顛倒會讓修正落在新 item 上，整條系統性 off-by-one。"],"explanation":"eq. 7.5 的 β† ≡ β_H 只改「β_H 最後一個 item」的 s ← H_R，而 H_R 是本區塊 header 攜帶的 *parent* posterior state root（header.tex：JAM 刻意在 header 放 prior state root 以利 pipelining）。正確順序是先 β_H → β†（修好上一個區塊的 s），再 append 新 item 且 s = H_0。順序顛倒後，被修的是剛 append 的新 item，於是它拿到的是「上一個區塊」的 root，而上一個區塊的 item 再也拿不到本該補給它的 root（注意：不會有任何 item 停在 H_0，新 item 一 append 就被錯位的修正立刻蓋掉）。後果有兩層：eq. 11.36 要求 x_s = y_s（context 的 anchor posterior state root 對上 β† item 的 s），guarantor 給的是真值，這台節點比對必失敗；而 C(3) 直接把每個 item 的 s 編進狀態序列化，state root 立刻和別人不同，fuzz trace 會停在 state-root mismatch。GP 自己的註腳講清楚了為什麼 H_0 是安全的：\"β′ is not utilized except to define the next block's β†\"。","trap":"β† 修的是「上一個區塊」的 s，不是自己的；先修再 append，順序寫反不會報錯，只會 state root 不對。"},{"id":"c3-ch07-c3-field-order","ch":"7","section":"7 Recent History","gpRef":"eq. 7.2 & §D.1 state key C(3)","difficulty":3,"kind":"code","tags":["recent-history","codec","delta-0.8.0","gotcha"],"stem":"This is the team's GP 0.7.2 encoder for one β_H item under state key C(3). A reviewer objects that GP 0.8.0 declares the item as ⟨h, s, b, t, p⟩ — state root ahead of the accumulation-output-log super-peak — so the encoder must have two fields swapped. Who is right?","code":{"lang":"go","caption":"internal/types/encode.go:1950-1980 (BlockInfo.Encode; log line elided)","src":"func (bi *BlockInfo) Encode(e *Encoder) error {\n\t// HeaderHash\n\tif err := bi.HeaderHash.Encode(e); err != nil {\n\t\treturn err\n\t}\n\t// BeefyRoot\n\tif err := bi.BeefyRoot.Encode(e); err != nil {\n\t\treturn err\n\t}\n\t// StateRoot\n\tif err := bi.StateRoot.Encode(e); err != nil {\n\t\treturn err\n\t}\n\t// Reported\n\tif err := e.EncodeLength(uint64(len(bi.Reported))); err != nil {\n\t\treturn err\n\t}\n\tfor _, reportedWorkPackage := range bi.Reported {\n\t\tif err := reportedWorkPackage.Encode(e); err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n\treturn nil\n}"},"options":["The reviewer is right: a state component is always serialized in the order its defining equation lists the fields, so C(3) needs header hash, state root, super-peak, timeslot, reported map; appendix D merely restates the tuple of chapter 7 and the two can never disagree, so as written the encoder produces the wrong C(3) preimage and therefore the wrong state root","Both are wrong: C(3) holds only the encoded peak sequence of β_B, while the per-block items are committed through a marker in the header and otherwise kept off-chain by each node, so this encoder should not be feeding state serialization at all and whichever order it uses cannot move the state root","The encoder's order is right: state serialization is fixed by C(3) in appendix D, which emits header hash, then super-peak, then state root, then the timeslot, then the reported map; the tuple in chapter 7 merely names the components. The real 0.8.0 gap is the missing 4-byte timeslot between the state root and the reported map","The reviewer is right about the order and about the shape: 0.8.0 replaced the per-item super-peak with the full peak sequence, so each item must encode the whole belt where this code writes a single 32-byte hash, and eq. 11.36 compares an anchor against that sequence rather than against one commitment"],"answer":2,"optNotes":["「附錄 D 只是重述第 7 章的 tuple」正是本題要打掉的直覺：D.1 是獨立定義，就是把 b 排在 s 前面。","header 只有 epoch／winners／offenders 三個 marker；C(3) 同時存整條 belt 與每一筆 item。","D.1 的 C(3) 明寫 ⟨h, b, s, E_4(t), var(p)⟩，b 排在 s 前面；真正缺的是 0.8.0 的 4-byte t。","eq. 7.2 把 b 的型別寫成 b ∈ H（E.10 算出的單一 super-peak），eq. 11.36 也只比一個 32-byte 值。"],"explanation":"兩個地方都是 0.8.0 原文，但講的是不同的事。eq. 7.2 用具名欄位宣告集合：β_H ∈ ⟦⟨h ∈ H, s ∈ H, b ∈ H, t ∈ N_T, p ∈ D⟨H → H⟩⟩⟧_:8。附錄 D 的 C(3) 才是序列化定義，它明寫成 E(var[⟨h, b, s, E_4(t), var(p)⟩ | … ∈ β_H], mmrencode(β_B))——super-peak 在 state root 前面。GP 具名 tuple 的欄位順序不等於 codec 順序，狀態這一塊以 D.1 為準；jam test vectors 的 history JSON（header_hash, mmr, state_root, reported）與團隊的 BlockInfo{HeaderHash, BeefyRoot, StateRoot, Reported} 都跟 D.1 一致，這段 0.7.2 程式碼的順序沒問題。真正要補的是 0.8.0 新增的 t：GP PR #526 把 anchor 的 timeslot 放進 refinement context，eq. 11.36 因此多比一項 x_n = y_t，團隊 PR #1031 就是在 state_root 與 reported 之間插入 4-byte timeslot。","trap":"宣告順序 ≠ 編碼順序。C(3) 是 b 在 s 前面；照 chapter 7 的順序寫 codec，值全對也會 state root 不對。"},{"id":"c3-ch08-queue-writer","ch":"8","section":"8.2 Pool and Queue","gpRef":"§8.2 (note under eq. 8.1); assign host call (index 16)","difficulty":1,"kind":"concept","tags":["authorization","privileges","host-calls"],"stem":"Who is permitted to change a core's authorizer queue φ[c] in GP 0.8.0, and through what mechanism?","options":["The block author, by including an authorization extrinsic alongside E_G as the sixth member of the extrinsic; the other validators re-check it against the coretime-sales record before accepting the block, and φ′ is then simply whatever that extrinsic declares","Nobody on-chain: φ is each node's local view of purchased coretime, gossiped off-chain by the coretime chain, and only a commitment to it ever reaches consensus — carried in the very same header marker that publishes the epoch's winning tickets","Any service may call `assign`, but the write only takes effect on cores whose pool has fallen empty; the manager service can override any core at any time with `bless`, and both writes land at the end of the block so that a core cannot be re-assigned twice in a row","Only the service currently registered as that core's assigner, and only from inside its accumulate execution, by calling `assign`, which replaces all Q = 80 entries of that one core's queue in a single call and may also hand the assigner role to another service"],"answer":3,"optNotes":["extrinsic 只有 E_T、E_P、E_G、E_A、E_D 五種，coretime 的成交紀錄也不是鏈上共識條件。","eq. 8.1 的 φ 是不折不扣的狀態元件（序列化在 C(2)）；eq. 5.1 的 marker 只有三個。","Ω_A 的呼叫者 ≠ χ_A[c] 就回 HUH；bless 動的是 χ 的 privileges、碰不到 φ，也與 pool 空不空無關。","§8.2 明訂 φ 只能由 privileged service 的 accumulate 呼叫 assign 整批覆寫，並可順手轉手 χ_A[c]。"],"explanation":"§8.2 在 eq. 8.1 底下直接寫死：\"The portion of state φ may be altered only through an exogenous call made from the accumulate logic of an appropriately privileged service.\" 那個 privileged service 就是 χ_A[c]（per-core assigner）。host call Ω_A（`assign` = 16）從 ω_7..ω_9 取 (c, o, a)，自 memory 位址 o 讀 Q = 80 個 32-byte hash：c ≥ C 回 CORE，呼叫者 service id ≠ χ_A[c] 回 HUH，a 不是合法 service id 回 WHO，成功才 φ[c] ← q 並把 χ_A[c] ← a（Owned Privileges，讓 assigner 可以轉手）。所以是整批覆寫單一 core 的 queue，不是逐格插入。`bless` 動的是 χ 的 privileges（0.8.0 PR #519 起只有 manager 能呼叫）。","trap":"「誰能寫 φ」與「誰能寫 χ」不同：assign 由 per-core assigner 呼叫，bless 只屬於 manager。"},{"id":"c3-ch08-rotation-index-cyclic","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 8.1–8.2","difficulty":2,"kind":"concept","tags":["authorization","rotation"],"stem":"Each block moves exactly one queue entry into every core's pool. How is that entry picked, and what becomes of the entries belonging to slots in which no block was produced?","options":["By a per-core cursor kept beside the pool that advances one step per imported block, so no queue entry is ever skipped — an empty slot merely postpones the rotation, the cursor being serialized next to α[c] under state key C(1)","By cyclic subscription on the block's own timeslot, i.e. index H_T mod Q, with no stored cursor anywhere; a slot that produces no block simply never has its entry drawn, and that index only comes round again 80 slots later","By index H_T mod O, so only the first eight queue positions ever rotate into the pool and the remaining 72 stay unreachable until an `assign` call shifts them forward, so an authorizer parked at index 40 stays out of reach until `assign` rotates the queue","By taking the oldest not-yet-used entry (FIFO) and deleting it from the queue as it enters the pool, which is why the assigner must refill a core's queue at least every 80 blocks and why φ[c] is shorter than Q between refills"],"answer":1,"optNotes":["C(1) 只映射到 E([var(x) | x ∈ α])，附錄 D 沒有地方放游標；一旦出現空 slot 就會與參考實作分歧。","索引由 H_T mod Q 當場算出、鏈上沒有游標，沒出塊的那一格這輪就跳過，80 個 slot 後才同餘回來。","O = 8 只出現在最後的 ←(…)^O 截斷；80 格每一格都會在 80 個 slot 內輪到，沒有碰不到的格子。","刪掉用過的項會讓 φ[c] 短於 Q，直接違反 eq. 8.1 的固定長度型別；queue 也不需要定期補。"],"explanation":"eq. 8.2：∀c ∈ N_C : α′[c] ≡ ←(F(c) ⌢ φ′[c]↺[H_T])^O。notation.tex 定義 modulo subscription s↺[i] ≡ s[i mod |s|]，而 eq. 8.1 規定 φ ∈ ⟦⟦H⟧_Q⟧_C —— 每個 core 的 queue 是「剛好 Q = 80 個」的序列（相對地 α ∈ ⟦⟦H⟧_:O⟧_C 是「至多 O = 8 個」）。索引直接來自 header 的 timeslot，不是狀態裡的游標，所以分叉、空 slot、Safrole 沒出票的 slot 對應的那格這一輪就是被跳過；實作若自己維護 cursor，只要鏈上出現空 slot 就會與參考實作分歧。queue 不會因為被抽取而縮短或清空（它不是 FIFO），唯一能改它的是 assign 的整批覆寫。","trap":"抽 queue 用 mod Q（80），截 pool 用 O（8）——兩個常數各司其職，別互換。"},{"id":"c3-ch08-psi-i-visibility","ch":"8","section":"8.1 Authorizers and Authorizations","gpRef":"eq. B.1–B.2; §8.1","difficulty":2,"kind":"concept","tags":["authorization","pvm","delta-0.8.0"],"stem":"A guarantor runs the Is-Authorized logic Ψ_I before refining anything. What is that program actually able to observe?","options":["The work-package plus a read-only snapshot of the service accounts δ, reached through the same `read` and `lookup` host calls Accumulate uses, so an authorizer can check a balance or confirm that the coretime buyer still holds the core it is running on; the snapshot is pinned to the anchor block so that every auditor sees identical values","The work-package, the core index and a historical lookup pinned to the lookup-anchor timeslot, exactly as Refine gets it, since the authorization code is itself resolved by that same lookup; an authorizer may therefore read any preimage its host service had solicited by that slot, such as a whitelist published by the coretime buyer","The work-package and the core's own authorizer pool, handed in beside the core index because it is at most O × 32 = 256 octets, so that the code can confirm its own hash is still pooled and abort early rather than burn the guarantor's gas on a package eq. 11.32 will reject anyway","Its two arguments only — the work-package and the core index, the latter handed to the PVM as a 2-byte encoded argument — plus whatever `fetch` can pull out of that package, and the protocol constants; no chain state at all, and besides `fetch` the only host calls are the gas counter and heap growth"],"answer":3,"optNotes":["read／lookup 在 eq. B.2 的 F 裡根本叫不出來，一律扣 M_∅ 並把 ω_7 設成 WHAT。","歷史查詢 Λ 是 Ψ_R 的專利（eq. B.5 的 Ω_H）；auth code 由 lookup anchor 解析是外部餵進來的。","eq. B.1 只有 (P, N_C) 兩個參數、argument blob 就是 E_2(c)；能讀 pool 就不再是 stateless。","eq. B.2 的 F 只認 gas、grow_heap、fetch 三個 host call，GP 說 Ψ_I totally stateless。"],"explanation":"eq. B.1：Ψ_I : (P, N_C) → (B ∪ E, N_G)，實際執行 Ψ_M(auth code, 0, G_I, E_2(c), F, ∅)，其中 G_I = 50,000,000、argument blob 就是 E_2(c)；auth code 解不出來（∅）回 BAD、長度 > W_A = 64,000 回 BIG。eq. B.2 的 dispatch F 只認三個 host call：gas、grow_heap、fetch，其他一律扣 M_∅ 並把 ω_7 設成 WHAT。GP 原文：\"totally stateless … we elide the host-call context since, being essentially stateless, it is always ∅\"。fetch（Ω_Y）在這裡除了 work-package 之外的參數全是 ∅，所以 selector 0（protocol constants）與 7–13（package 編碼、config、token、context、work-item metadata、payload）可用，selector 1–6 與 14/15（entropy、authorizer trace、extrinsics、import segments）一律回 NONE。正因為 Ψ_I 完全無狀態，每個 auditor 事後重跑必然得到相同結果。0.8.0 delta：堆積成長的 host call 由 0.7.2 的 `sbrk` 更名為 `grow_heap`（index 1，PR #508 的新 gas model 一起改），Go 端的 dispatch 表要跟著改。","trap":"Ψ_I 無狀態 ⇒ 授權邏輯不能讀鏈上餘額；要收錢只能靠 accumulate 那一端。"},{"id":"c3-ch08-authcode-lookup-anchor","ch":"8","section":"8.1 Authorizers and Authorizations","gpRef":"eq. 14.11; §8.1","difficulty":2,"kind":"rationale","tags":["authorization","auditing","determinism"],"stem":"The pool α[c] stores nothing but 32-byte authorizer hashes. So where does a guarantor obtain the executable is-authorized code, and as of which point in history is it resolved — and why there?","options":["From the preimage store of the separate auth-code host service named by the work-package, resolved by a historical lookup at the package's lookup-anchor timeslot, so that an auditor re-running the check much later resolves byte-identical code even if that service has since replaced or forgotten the preimage","From the pool entry: the hash in α[c] is the preimage hash of the code concatenated with its configuration, so a guarantor fetches that blob by hash from any peer and runs it against the current best head, which is why an authorizer only becomes usable once someone has published its preimage","From the account of the first work-item's service, read at the anchor block's posterior state, since the anchor is what already pins the refinement context to a recent state root every validator has agreed on — eq. 11.36 has matched that root against β†, so no separate retention rule is needed to keep the code resolvable","From the work-package itself: the code blob travels in the bundle beside the token and the configuration blob, which is exactly what the 64,000-octet limit bounds, so a guarantor needs no preimage lookup at all and the hash pooled in α[c] is simply the Blake2b of that code section"],"answer":0,"optNotes":["Λ(δ[p_h], (p_c)_t, p_u)：由 package 自己宣告的 auth code host service 於 lookup anchor 時點解析。","α[c] 存的是 H(p_u ⌢ p_f)，本身不是任何 blob 的 preimage key；綁 best head 正是 Λ 要避免的漂移。","anchor 最多只有 8 個區塊深，而 audit 可能兩個 epoch 之後才發生，重跑會拿到不同的 code。","eq. 14.2 的 package 只帶 p_h、p_u、p_f；W_A = 64,000 是解析出來的 code 上限，不是 bundle 欄位。"],"explanation":"eq. 14.11：p_a ≡ H(p_u ⌢ p_f)（authorizer = auth code hash 與 config blob 串接後的 Blake2b，0.8.0 PR #522 把 ch.8 與 ch.14 的說法對齊），而 E(var(metadata), auth code) ≡ Λ(δ[p_h], (p_c)_t, p_u)，其中 p_u 是 auth code hash、p_h 是 auth code host service。三個重點：(1) 供應 code 的是 work-package 自己宣告的 auth code host service p_h，那是 eq. 14.2 裡與 work-item 的 service 分開的獨立欄位 —— 這正是「授權」與「工作」分離的具體長相：買 coretime 的人挑 authorizer，真正做事的是別的 service；(2) 時間點是 lookup anchor 的 timeslot (p_c)_t，因為 Λ 的設計目標是「在可能被 audit 的整段期間答案不變」，GP 用 D = L + 4,800 = 19,200 slots 的 expunge period 保證這件事；(3) α[c] 只有 32 bytes 的 hash，既沒有 config 也沒有 code，光靠它取不到程式。W_A = 64,000 是「解析出來的」is-authorized code 的大小上限（eq. B.1 的 BIG 條件）；bundle 自己的上限是 W_B ≈ 13.8 MB。","trap":"anchor 與 lookup anchor 是兩個不同的區塊：anchor 管 state/beefy/timeslot 比對，lookup anchor 管所有 preimage 的解析時點。"},{"id":"c3-ch08-unauthorized-report-outcome","ch":"8","section":"8.2 Pool and Queue","gpRef":"eq. 11.32 & eq. 8.2","difficulty":3,"kind":"code","tags":["authorization","guarantees","prior-posterior"],"stem":"This 0.7.2 code implements the authorizer half of eq. 11.32. Which pool is it obliged to read, and what is the protocol-level consequence when the membership test fails?","code":{"lang":"go","caption":"internal/extrinsic/guarantee_controller.go:172-186 (ValidateWorkReports; gas checks elided)","src":"func (g *GuaranteeController) ValidateWorkReports() error {\n\tworkReports := g.WorkReportSet()\n\talpha := blockchain.GetInstance().GetPriorStates().GetAlpha()\n\tdelta := blockchain.GetInstance().GetPriorStates().GetDelta()\n\trhoDoubleDagger := blockchain.GetInstance().GetIntermediateStates().GetRhoDoubleDagger()\n\tfor _, workReport := range workReports {\n\t\tif rhoDoubleDagger[workReport.CoreIndex] != nil {\n\t\t\terr := ReportsErrorCode.CoreEngaged\n\t\t\treturn &err\n\t\t}\n\t\tauthPool := alpha[workReport.CoreIndex]\n\t\tif !isAuthPoolContains(authPool, workReport.AuthorizerHash) {\n\t\t\terr := ReportsErrorCode.CoreUnauthorized\n\t\t\treturn &err\n\t\t}\n\t\t// … per-service accumulate-gas checks elided …\n\t}\n\treturn nil\n}"},"options":["Either pool will do, because the rotation only removes the authorizer the report itself consumed; failure records the report's guarantors as culprits in the disputes state so that the next epoch's punishment set slashes them, their Ed25519 keys entering ψ_O through the offenders marker of this very header","The prior pool, but the report is still admitted into the availability assignments with an empty authorizer trace and is silently discarded at accumulation time, which is why an absent authorizer costs a guarantor nothing and ρ‡ holds the entry until the U = 5 slot assurance timeout clears it","The prior pool, since the posterior one is only formed after accumulation out of the posterior queue; and the failure is an ordinary block-validity failure — the guarantee cannot be part of a valid block, so there is no report to punish anyone over and nothing is written to the disputes state","The posterior pool, because the report is being included in this very block and eq. 8.2's rotation is applied before guarantees are processed; failure then invalidates the block, which is why the dependency graph lists α′ among the inputs of ρ′ rather than the other way round"],"answer":2,"optNotes":["每塊每個 core 都會 append 一項 φ′[c]↺[H_T]，兩個 pool 幾乎必然不同；ψ_O 也只能經 E_D 增長。","eq. 11.46 只把通過全部檢查的 guarantee 填進 ρ′；ρ‡ 早在 guarantee 進來前就定案了。","eq. 11.32 寫的是 r_a ∈ α[r_c]——α 沒有 prime；不合法就整塊被拒，不會寫進 disputes。","α′ 依賴 φ′、要等 accumulation 之後才存在；§4 的 ρ′ ≺ (E_G, ρ‡, κ, τ′) 根本不含 α′。"],"explanation":"eq. 11.32 寫的是 ∀r ∈ I : ρ‡[r_c] = ∅ ∧ r_a ∈ α[r_c] —— α 沒有 prime。順序上也只能如此：eq. 8.2 的 α′ 依賴 φ′，而 φ′ 是 accumulation 的產出，§8.2 明說 \"practically speaking, this step must be computed after accumulation\"，所以 guarantee 驗證的當下 α′ 根本還不存在。程式碼用 GetPriorStates().GetAlpha() 是對的，也因此本區塊 accumulation 才剛 assign 進 queue 的新 authorizer，最快要下一個區塊才可能被引用。至於後果：§11 的這些條件是「區塊有效性條件」，不滿足就整個區塊不合法，import 時直接拒（團隊實作回 CoreUnauthorized）。這是刻意的分工：culprit／fault 只處理需要離線資料（重跑 refine、拉 audit DA）才能判定的爭議，而 authorizer 在不在 pool 裡是任何節點光看鏈上狀態就能算出來的條件。順帶一提 ρ‡ 是 assurances 之後、guarantees 之前的中間態，這正是 core-engaged 檢查要用它而不是 ρ 的原因。","trap":"「檢查用 prior α、更新用 posterior φ′」同一章兩個方向；面試常問「同一個區塊裡剛 assign 的 authorizer 能不能馬上用」——不能。"},{"id":"c3-ch09-expunge-delay","ch":"9","section":"9.2 Preimage Lookups","gpRef":"§9.2 (domain of Λ); App. B Refine Invocation (D ≡ L + 4,800 = 19,200)","difficulty":1,"kind":"rationale","tags":["accounts","preimages","constants"],"stem":"§9.2 bounds the timeslot argument of the historical-lookup function Λ to the window (H_t − D … H_t), and the constants appendix fixes D = 19,200 timeslots. What is the GP's stated reason for that particular number?","options":["The period must exceed the two-epoch audit window (1,200 timeslots) by a factor of sixteen so that erasure-coded bundles can still be reconstructed from the 1,023 validators' shards during a dispute; D is derived from that retention period, not from any anchor age.","Ω_H must return the same answer at every moment when auditing may still occur; the lookup anchor may itself be up to L = 14,400 timeslots older than recent history, so the period is that anchor age plus a further 4,800 slots (eight hours) of safety margin.","19,200 timeslots is exactly 32 epochs, which is precisely how long the accumulation history ξ keeps work-package hashes, so a preimage may not be dropped before the work-package that used it can no longer be re-accumulated; D is fixed at 32·E for that reason.","The per-octet deposit B_L is refunded linearly over the period, and 19,200 slots is 32 hours at six seconds per slot — the standard deposit-refund schedule for elective state; B_L is credited back to a_b in equal instalments over those slots."],"answer":1,"optNotes":["推導方向反了：驅動 D 的是 lookup anchor 的年齡，不是 dispute 期間的 erasure 重建。","附錄 B 直接寫出 D ≡ L + 4,800 = 19,200，理由就是 Ω_H 在任何可審計時點都要給同一個答案。","19,200 / E = 32 只是數值巧合；ξ 只保存一個 epoch 的 package hashes（eq. 12.1），與 D 無關。","GP 沒有 deposit 攤提退款機制；a_t 是門檻式檢查，餘額只透過 transfer 與 accumulate 改變。"],"explanation":"GP 附錄 B（Refine Invocation）原文：「The historical-lookup host-call function, Ω_H, is designed to give the same result regardless of the state of the chain for any time when auditing may occur … The lookup anchor may be up to L timeslots before the recent history and therefore adds to the potential age at the time of audit. We therefore set D to have a safety margin of eight hours: D ≡ L + 4,800 = 19,200。」L = 14,400（max lookup anchor age，24 小時），加 4,800 slot（8 小時）＝ 19,200 slot（32 小時）。§9.2 的 Λ 定義域正是 (H_t − D … H_t)。這題考的是「理由」而不是算術：D 的來源是 lookup anchor 的最大年齡加上安全邊際，凡是把它歸給別的保存期的說法，即使數字湊得上也不是 GP 寫的那條式子。","trap":"D 只是「forget 之後多久才能真的刪」；真正把 preimage 從 state 移除的動作在 `forget`（自家，Ω_F = 25）與 `eject`（別家，Ω_J = 22）兩個 accumulate host call 裡——注意別跟 0.8.0 的 `expunge`（Ω_X = 14）混淆，那是 refine-only 的 inner-PVM 拆除呼叫，與 preimage 無關。preimage 生命週期的狀態機本身在 §9.2.2。"},{"id":"c3-ch09-service-info-leaf","ch":"9","section":"9.3 Account Footprint and Threshold Balance","gpRef":"eq. 9.3, eq. 9.8; §D.1 T(σ) row C(255, s); App. B `info` (Ω_I)","difficulty":2,"kind":"concept","tags":["accounts","state","merklization"],"stem":"a_i (items), a_o (octets) and a_t (threshold balance) are dependent values — §9.3 derives a_i and a_o from a_s and a_l, and a_t from those two plus the stored gratis offset a_f, and none of them is a member of the eq. 9.3 tuple. Which of them actually reach the Merklized state, and how does that compare with what the `info` host call hands back?","options":["All three reach both encodings, and the two encodings are byte-for-byte identical — which is exactly why an implementation is free to reuse a single codec for the trie leaf and for the host call, and why the leaf can be handed straight to the guest's buffer.","The trie leaf carries a_t but neither a_i nor a_o (those are recomputed on demand), while `info` returns a_i and a_o but not a_t; both encodings begin with the version octet 0.","None of the three is serialized anywhere: the trie stores only the eq. 9.3 tuple fields, and a_i, a_o and a_t are recomputed from a_s and a_l each time a host call needs them.","The service-info leaf carries a_i and a_o but not a_t, and it opens with a version octet 0; `info` has no version octet but does include a_t, laid out as E(a_c, E_8(a_b, a_t, a_g, a_m, a_o), E_4(a_i), E_8(a_f), E_4(a_r, a_a, a_p))."],"answer":3,"optNotes":["兩個排列並不相同（version octet、a_t 的有無、a_f 的位置），共用一份 codec 正是最常見的實作坑。","剛好顛倒：leaf 存的是 a_i／a_o 而非 a_t，多寫 a_t 會讓 leaf 多 8 bytes、整棵 trie 的 root 對不上。","§9.3 明說 a_i、a_o「are expected to be found explicitly within the Merklized state data」，不是臨時重算。","leaf 有 version octet 0、沒有 a_t；`info` 沒有 version octet、有 a_t，兩者 a_f 的位置也不同。"],"explanation":"§9.3 說得很清楚：a_i、a_o 是 dependent values，「as we will see in the account serialization function … these are expected to be found explicitly within the Merklized state data. Because of this we make explicit their set.」——所以 a_i ∈ N_{2^32}、a_o ∈ N_{2^64} 被寫死進 trie。附錄 D 的 T(σ)：C(255, s) ↦ E(0, a_c, E_8(a_b, a_g, a_m, a_o, a_f), E_4(a_i, a_r, a_a, a_p))，開頭那個 0 就是 0.7.1 起加入的 service-info version octet，而 a_t 不在裡面（它是 max(0, B_S + B_I·a_i + B_L·a_o − a_f)，隨時可重算）。附錄 B 的 Ω_I（`info`）則是另一個排列：E(a_c, E_8(a_b, a_t, a_g, a_m, a_o), E_4(a_i), E_8(a_f), E_4(a_r, a_a, a_p))——有 a_t、沒有 version octet、a_f 的位置也不同。兩份編碼的欄位集合與順序都不一樣，這是 trie 與 host call 之間最容易共用錯 struct 的地方。","trap":"leaf 有 version octet、沒有 a_t；`info` 沒有 version octet、有 a_t。兩個排列不同，別共用 struct。"},{"id":"c3-ch09-write-threshold-go","ch":"9","section":"9.3 Account Footprint and Threshold Balance","gpRef":"eq. 9.8 (a_i, a_o, a_t); App. B `write` (Ω_W)","difficulty":2,"kind":"code","tags":["accounts","balance","host-calls","fuzzer-bug"],"stem":"This is the team's Ω_W after the fix for the 'write mutates StorageDict before the balance check' bug. Which statement matches GP 0.8.0?","code":{"lang":"go","caption":"PVM/host_call_general.go (write) + internal/service_account/service_account.go:207 (CalcStorageItemfootprint)","src":"// remove the old item's footprint, then add the new one's\nnewItems := a.ServiceInfo.Items - footprintItems\nnewOctets := a.ServiceInfo.Bytes - footprintOctets\n\nstorageItems, storageOctets := service_account.CalcStorageItemfootprint(\n    string(storageRawKey), storageRawData)\nnewItems += storageItems\nnewOctets += storageOctets\n\nnewMinBalance := service_account.CalcThresholdBalance(\n    newItems, newOctets, a.ServiceInfo.DepositOffset) // a_t\nif newMinBalance > a.ServiceInfo.Balance {\n    input.VM.Registers[7] = FULL\n    return OmegaOutput{ExitReason: ExitContinue, Addition: input.Addition}\n}\n\n// balance check passed, now apply the storage mutation\na.StorageDict[string(storageRawKey)] = storageRawData\na.ServiceInfo.Items = newItems\na.ServiceInfo.Bytes = newOctets\n\n// ---- service_account.go ----\nfunc CalcStorageItemfootprint(storageRawKey string, storageData types.ByteSequence) (types.U32, types.U64) {\n\treturn 1, 34 + types.U64(len(storageRawKey)) + types.U64(len(storageData))\n}"},"options":["One storage entry costs 1 against a_i and 32 + |v| against a_o — key length is never charged, because JAM stores only the hash of a storage key in the trie; on FULL the write still lands and the shortfall is taken out of the balance.","One storage entry costs 2 against a_i and 81 + |v| against a_o, exactly like a lookup-meta entry, on the grounds that both occupy precisely one leaf of the state trie; FULL is only ever produced once the balance itself has reached zero, so a solvent service can always complete a write.","The threshold is recomputed once at the end of accumulation rather than on every host call, so `write` can never yield FULL at all; services that over-commit their storage are pruned afterwards by whichever service holds their code-hash tombstone, and their deposit is returned to the parent.","One storage entry costs 1 against a_i and 34 + |k| + |v| against a_o — both the key and the value are charged; when the post-write threshold exceeds the balance the call yields FULL and the account must be returned completely untouched, which is why the map write is deferred until after the comparison."],"answer":3,"optNotes":["eq. 9.8 的求和是對 (x, y) 這一對跑，key 長度同樣計費；而且 FULL 分支不得留下任何寫入。","把 lookup request 的 2 items / 81 + z 套到 storage 上；FULL 的條件是 a_t > a_b，不是餘額歸零。","門檻檢查是每次 host call 當場做的，Ω_W 明列 FULL 分支；GP 也沒有 tombstone 剪枝或退款機制。","§9.8 的計價是 34 + |key| + |value|，key 的長度也算，且 FULL 時必須回傳原封不動的 s。"],"explanation":"eq. 9.8：a_i ≡ 2·|a_l| + |a_s|；a_o ≡ Σ_{(h,z)∈K(a_l)} (81 + z) + Σ_{(x,y)∈a_s} (34 + |y| + |x|)；a_t ≡ max(0, B_S + B_I·a_i + B_L·a_o − a_f)。求和是對 a_s 的「pair」跑——storage 一筆 = 1 item、34 + |k| + |v| octets；lookup request 一筆 = 2 items、81 + z octets。附錄 B 的 Ω_W：「⟨continue, FULL, s⟩ otherwhen a_t > a_b」——回傳的第三個元素是 **s**（原封不動的帳戶），不是被改過的 a；#979/#980 這個 bug 正是因為 Go map 是 reference，先寫再檢查會讓 FULL 分支殘留寫入，fuzzer seed 3785638964 step 15419 抓到。程式碼把 map 寫入延到比較之後，就是為了滿足這條「失敗即不留下任何狀態變更」的要求。","trap":"FULL 與 CASH 不同：a_t > a_b 用 FULL（write / solicit）；轉帳後自己跌破 a_t 用 CASH（transfer / new）。兩者都不留下任何狀態變更。"},{"id":"c3-ch09-forget-lifecycle","ch":"9","section":"9.2.2 Semantics","gpRef":"§9.2.2 (four shapes of a_l); App. B `forget` (Ω_F), expunge period D = 19,200","difficulty":2,"kind":"concept","tags":["accounts","preimages","host-calls"],"stem":"A service calls `forget` at time t for one of its own request keys (h, z). Taking the four shapes of a_l[(h, z)] in turn, which set of transitions matches GP 0.8.0?","options":["[] → HUH, there is nothing to forget; [x] → the request entry and a_p[h] are both dropped at once; [x, y] → [x, y, t]; [x, y, w] → [w, t] with no age condition attached; every other case returns HUH.","[] → dropped; [x] → dropped together with a_p[h]; [x, y] → dropped together with a_p[h]; [x, y, w] → dropped together with a_p[h]; every shape collapses at once and the D-slot delay governs only `eject`.","[] → the request entry is dropped; [x] → [x, t]; [x, y] → the request entry and a_p[h] are both expunged, but only once y < t − D; [x, y, w] → [w, t], again only once y < t − D; every other case returns HUH.","[] → the request entry is dropped; [x] → [x, t]; [x, y] → the request entry and a_p[h] are expunged the moment y < t, with no D-slot wait; [x, y, w] → dropped outright rather than rewritten; every other case returns HUH."],"answer":2,"optNotes":["[x, y] → [x, y, t] 是 `solicit` 的動作；available 的 preimage 也不能一步刪，[x, y, w] 那支同樣要 y < t − D。","§9.2 開頭明說「only after a period of time may it be removed from state」，`forget` 自己就帶這道等待期。","四支轉移與 Ω_F 逐條相符，且 D 的等待期只綁在 [x, y] 與 [x, y, w] 這兩支上。","少了 D 個 slot 的等待期會破壞 historical_lookup 的確定性；[x, y, w] 是被改寫成 [w, t] 而非整筆移除。"],"explanation":"附錄 B 的 Ω_F（`forget` = 25）逐條列出 a = self except：(i) 當 a_l[(h,z)] 是 []（無條件），或是 [x, y] 且 y < t − D，同時從 K(a_l) 移除 (h,z)、從 K(a_p) 移除 h；(ii) 當 a_l[(h,z)] = [x]，改寫成 [x, t]；(iii) 當 a_l[(h,z)] = [x,y,w] 且 y < t − D，改寫成 [w, t]；其餘 → error → HUH。這裡要點名一個 GP 的 under-specification：原文只寫了一條 guard「(x_s)_l[h,z] ∈ {[], [x,y]}, y < t − D」，把兩種形狀併在同一個集合裡，但 [] 這一支根本沒有任何東西綁定 y，年齡條件在該支懸空、無從判定；唯一可實作、也就是本題所鍵的讀法，是把 [] 這個 case 直接刪掉、完全不加等待期——[] 代表「已 solicit、從未供應」，若它也要等 D，solicit 之後就永遠取消不掉、[] 會永久卡在 state 裡——所以 D 的等待期實際上只約束 [x, y] 與 [x, y, w] 這兩支。GP 0.8.0 對此並未明文釐清，這是已知的 under-specification。對照 §9.2.2 的四種語意：[] requested、[x] available since x、[x,y] 自 y 起 unavailable、[x,y,z] 自 z 起再度 available。貫穿全題的原則是「available 的東西不能一步刪掉」——它必須先降級成 [x, t]，等 D = 19,200 slot 後才可能被真正 expunge，這正是 §9.2 開頭說的「it goes through a process of being marked as unavailable, and only after a period of time may it be removed from state. This ensures that historical information on its existence is retained.」否則 in-core historical_lookup 就不再確定（auditor 在 lookup anchor 時點重算會拿到不同答案），服務也就能隨時自我抹除歷史。至於 [x,y,w] → [w, t]：舊的 [x,y] 那段歷史被丟掉，因為它已經超過 D、不再需要保存，服務仍然持有那份 preimage 且自 w 起可用。","trap":"`forget` 不看餘額，`solicit` 才有 FULL 檢查；反向的 `solicit` 只接受兩種輸入形狀（不存在 → []、[x,y] → [x,y,t]），其餘一律 HUH。"},{"id":"c3-ch09-new-service-index","ch":"9","section":"9 Service Accounts","gpRef":"§9 eq. 9.1 (N_S ≡ N_{2^32}); eq. B.14 (check); S = 2^16","difficulty":2,"kind":"concept","tags":["accounts","service-id","accumulation"],"stem":"A service calls `new` during accumulation. How does GP 0.8.0 pick the index of the child account, and how is a clash with an existing service avoided?","options":["The context's next free id starts as check((E⁻¹_4(H(E(s, η′_0, H_t))) mod (2^32 − S − 2^8)) + S) with S = 2^16, so it is folded into the public range only; check linearly probes forward, i ↦ (i − S + 1) mod (2^32 − 2^8 − S) + S, until it lands on an index outside K(δ); the registrar alone may instead name any index below S.","The index is derived from H(E(s, η_0, H_t)) using the prior entropy accumulator and then probed downwards until a free slot appears; the reserved block is the top 2^16 of the index space rather than the bottom, and any service — not merely the registrar — may claim one of those reserved slots.","The index is the largest key currently present in δ plus one, so indices are handed out strictly sequentially across the whole chain and a clash is impossible by construction; the registrar merely reserves the first 2^16 of them at genesis and hands them out off-chain.","The index is Blake2b of the new account's code hash reduced mod 2^32, so that identical code always lands on the same slot and duplicate deployments are cheap; there is no probing at all, and should that index already be occupied the whole block is rejected as invalid."],"answer":0,"optNotes":["種子是 H(E(s, η′_0, H_t))，模數扣掉 S 與最高 2^8 折進 public range，check 再往前線性探測。","用 prior η_0 會讓 index 在區塊執行前就可預測；保留區是最低的 2^16，而且只有 registrar 能指定。","純遞增計數器在 parallel accumulation（Δ*）下無法決定性合併；protected range 也不是鏈下發放。","以 code hash 為種子會讓相同 code 的服務互撞，而 GP 給的是線性探測而非直接判區塊無效。"],"explanation":"附錄 B 的 initializer I：a（next free id）= check((E⁻¹_4(H(E(s, η′_0, H_t))) mod (2^32 − S − 2^8)) + S)，用的是**posterior** entropy accumulator η′_0 與本區塊的 H_t；模數刻意扣掉 S = C_minpublicindex = 2^16（registrar 專屬的 protected range）與最高的 2^8，所以隨機落點一定在 public range。eq. B.14 的 check(i) = i 若 i ∉ K(δ)，否則 check((i − S + 1) mod (2^32 − 2^8 − S) + S)——就是往前線性探測到第一個空位。成功 `new` 之後 context 的下一個 id 再跳 42：i* = check(S + (a − S + 42) mod (2^32 − S − 2^8))。registrar 路徑另走一條：當 caller = χ_R 且要求的 id < S，直接用該 id（已被占用則 FULL）。GP 也補了一句保險：萬一同一個 index 真的被兩個 service 取走，「the block is considered invalid」，但「Since no service can predict the identifier sequence ahead of time, they cannot intentionally disadvantage the block author.」——不可預測性正是這個設計要守住的性質。","trap":"η′_0（posterior）不是 η_0；並且 `new` 只在 accumulate 內可用，refine 沒有 δ。"},{"id":"c3-ch09-privilege-mutation","ch":"9","section":"9.4 Service Privileges","gpRef":"eq. 9.9–9.10 (χ); App. B `bless` (Ω_B), `assign` (Ω_A), `new` (Ω_N)","difficulty":3,"kind":"delta","tags":["accounts","privileges","gratis","delta-0.8.0"],"stem":"Your Go node is on GP 0.7.2, where the 'Owned Privileges' model let each privileged service rewrite its own slot of χ. What does GP 0.8.0 change, and who may hand a brand-new account a non-zero gratis storage offset a_f?","options":["Ω_B is the one host call that rewrites (χ_M, χ_A, χ_V, χ_R, χ_Z) wholesale, and it now yields HUH unless the caller is χ_M itself, so no service can promote itself to manager; a core's assigner may still hand over its own χ_A[c] through `assign`, and `new` yields HUH whenever f ≠ 0 and the caller is not the manager.","Ω_B is open to any service whose own index sits below S = 2^16, since occupying the protected range is what confers privilege in the first place; χ_A[c] may then only be moved by the manager, and a service raises its own a_f through `upgrade`.","Ω_B may still be invoked by any of the five privileged services, each rewriting only the slot it owns; the manager is special solely in that it may grant storage deposit credits, and `new` accepts f ≠ 0 from either the manager or the registrar.","χ is no longer mutable by host calls at all in 0.8.0; it may only be rewritten by the services listed in χ_Z as part of the automatic accumulation they receive in every block, and a_f is fixed for every account at genesis and can never be raised afterwards by anyone, manager included."],"answer":0,"optNotes":["#519 在 Ω_B 加上 x_s ≠ (x_e)_m → HUH，而 Ω_N 的 gratis 守衛是 f ≠ 0 ∧ x_s ≠ (x_e)_m。","低 index 只是 registrar 能指定的保留區、與特權無關；Ω_U 只能改 a_c/a_g/a_m，碰不到 a_f。","這是 0.7.1 的 Owned Privileges；0.8.0 的 Ω_B 已限定呼叫者必須是 χ_M，gratis 也只認 manager。","χ_Z 只是「每個區塊自動 accumulate 並配基本 gas」的字典，沒有任何寫 χ 的能力。"],"explanation":"GP 0.8.0（PR #519「Restrict bless to manager service」）在 Ω_B 加了一條守衛：「⟨continue, HUH, …⟩ otherwhen x_s ≠ (x_e)_m」（x_s 是呼叫者的 service index，x_e 是 invocation context 裡的 partial state）——也就是呼叫者不是 χ_M 就整組 HUH。§9.4 原文也改成 χ_M「is the service able to effect an alteration of χ from block to block as well as bestow services with storage deposit credits」。0.7.1 的 Owned Privileges（#475）讓每個特權服務改自己那格，攻擊面是：某服務先 bless 自己成 manager，再用 `new` 配 gratis storage、或把自己設成 registrar 去搶 < S 的低位 index。要留意 0.8.0 並沒有把「自有權」全部收回：Ω_A（`assign`）仍然要求 x_s = (x_e)_a[c] 才能寫 φ[c]，而且它同時寫回 χ_A[c]，所以 assigner 依然能把自己那一核的權限交棒；Ω_D（`designate`）則只要求 x_s = (x_e)_v，能改 ι 但改不了 χ_V。gratis 的守衛則在 Ω_N：「⟨continue, HUH, …⟩ otherwhen f ≠ 0 ∧ x_s ≠ (x_e)_m」。","trap":"0.7.2 → 0.8.0 的一句話：bless 只剩 manager 能叫；但 assign 仍保留 per-core 的自有權。"},{"id":"c3-appD-key-31-octets","ch":"D","section":"D.2.1 Node Encoding and Trie Identification","gpRef":"§D.1 (C → B_31); §D.2.1 (nodes fixed at 512 bit)","difficulty":1,"kind":"rationale","tags":["merklization","trie","state-keys"],"stem":"The state-key constructor C is specified as producing B_31, yet every other quantity in the state trie — child identities, the embedded value slot, H(v) — is 32 octets. What forces the key to be one octet short?","options":["The top octet is reserved so that the branch/leaf discriminator bit can be carried inside the key itself, which is what lets a verifier tell the two node types apart without fetching the node.","Keys are Blake2b outputs with the one-octet chapter index stripped off before storage; the value field is likewise 31 octets, padded to 32 only when hashed.","A node is fixed at 512 bit, and a leaf must fit a one-octet discriminator-plus-size header, the key, and a full 32-octet field for either the value or its hash: 1 + 31 + 32 = 64.","31 octets leaves one spare octet in a branch node so that a third child pointer can be appended when a sub-trie exceeds the 2^8 fan-out limit."],"answer":2,"optNotes":["discriminator 位在 node 的第一個 byte；key 的每個 bit 都要拿去做 trie 導航，不能挪用。","value 欄位是完整 32 octet 並以零填充，不是 31；key 也不是把某個 byte 拿掉之後的結果。","1 + 31 + 32 = 64：header octet 加 key 加整整 32 octet 的 value 或 H(v)，正好填滿 512 bit。","branch 只有左右兩個 child（左邊 255 bits、右邊 256 bits），沒有第三個 child 的概念。"],"explanation":"§D.2.1：「Nodes are fixed in size at 512 bit (64 bytes).」leaf 的版面是：第 1 bit 分辨 branch/leaf，第 2 bit 分辨 embedded-value leaf 與 regular leaf，該 byte 剩下的 6 bits 存 embedded value 的長度（regular leaf 則清零）；「The following 31 bytes are dedicated to the state key. The last 32 bytes are defined as the value, filling with zeroes if its length is less than 32 bytes」或是 H(v)。31 就是 64 扣掉 header octet 與整整 32 octet 的 value/hash 欄位之後剩下的空間——這也是 §D.1 一開始就說 state serialization 是「a mapping from 31-octet sequence state-keys to octet sequences of indefinite length」的原因，key 的長度是版面算出來的結果而非任何語意保留。","trap":"JIP-4 chainspec 的 genesis_state 每個 key 是 62 個 hex 字元 = 31 bytes，正好對得上。"},{"id":"c3-appD-service-subkeys","ch":"D","section":"D.1 Serialization","gpRef":"§D.1 (state-key constructor C; the final four rows of T(σ))","difficulty":2,"kind":"concept","tags":["merklization","state-keys","accounts"],"stem":"In T(σ) a service's storage entries, its preimages and its lookup-meta entries all go through the very same third form of C. What exactly is passed in, and what keeps the three kinds apart in the trie?","options":["The three kinds are told apart by octet 0 of the finished 31-octet key, which is 0xFD for storage, 0xFE for a preimage and 0xFF for lookup-meta, with the remaining 30 octets holding H(k) or the hash h directly and the service index folded into the value rather than the key.","All three use C(s, h) with h the raw storage key or preimage hash and no marker whatsoever; collisions cannot arise because a service storage key is required by §9 to be exactly 32 octets long, which keeps it inside a namespace disjoint from the 32-octet preimage hashes.","A four-octet marker is prepended before hashing — E_4(2^32−1) ⌢ k for storage, E_4(2^32−2) ⌢ h for a preimage, and E_4(l) ⌢ h for the lookup-meta of declared length l — and C(s, ·) then interleaves the four octets of n = E_4(s) with the first four octets of a = H(·), appending a_4 … a_26.","Storage uses C(s, k) with the raw key, preimages use the chapter form C(254, s) and lookup-meta uses C(253, s); no marker is needed at all because the three already live under distinct chapter indices, and the (h, l) pair of a lookup entry is recovered from the leaf's value rather than its key."],"answer":2,"optNotes":["octet 0 是 n_0，也就是 service id 的最低位 byte——你們的 #779/#780 正是踩到這個誤解。","GP 明說 storage key 長度完全自由；沒有 marker 就無從保證 C 的輸入互斥。","三列 T(σ) 的 marker 是 E_4(2^32−1)／E_4(2^32−2)／E_4(l)，C(s, ·) 再把 E_4(s) 與 H(·) 交錯成 31 bytes。","chapter 形式只用在 C(255, s) 的 service info；三者共用第三形式，靠輸入的 marker 分開。"],"explanation":"§D.1 的 T(σ) 最後三列逐字寫著：∀⟨s ↦ a⟩ ∈ δ, ⟨k ↦ v⟩ ∈ a_s：C(s, E_4(2^32−1) ⌢ k) ↦ v；∀⟨h ↦ p⟩ ∈ a_p：C(s, E_4(2^32−2) ⌢ h) ↦ p；∀⟨(h, l) ↦ t⟩ ∈ a_l：C(s, E_4(l) ⌢ h) ↦ E(↕[E_4(x) for x ∈ t])。而第三形式的 C 本身是 (s, h) ↦ [n_0, a_0, n_1, a_1, n_2, a_2, n_3, a_3, a_4, a_5, …, a_26]，其中 n = E_4(s)、a = H(h)——service id 的四個 byte 與雜湊的前四個 byte 交錯，之後接雜湊的第 4…26 byte，共 8 + 23 = 31 bytes。GP 接著保證：「Cryptographic hashing ensures that there will be no duplicate state-keys given that there are no duplicate inputs to C.」——不重複性靠的是 C 的**輸入**互斥，marker 就是把三個命名空間分開的手段；也因此 2^32−1 與 2^32−2 這兩個長度值等於被保留掉：只有當某個 service 同時存在一筆長度剛好是 2^32−1 的 lookup 請求、且其 hash 與某個 32-byte storage key 相同時才會撞上，而 0.8.0（PR #520）已把 preimage 長度收進 N_L ≡ N_{2^32}（注意這個型別**仍然包含** 2^32−1 與 2^32−2 兩個保留值，形式上並未排除碰撞，靠的是實務尺寸），實務上 preimage 遠小於 4 GiB，所以安全。","trap":"GP 明說 storage key「not required to be known by implementations」——只要存得下 Merklisation-ready 的雜湊即可，原始 key 可以不落盤。"},{"id":"c3-appD-rho-guarantee","ch":"D","section":"D.1 Serialization","gpRef":"§D.1 T(σ) row C(10); eq. 11.1 (ρ spec)","difficulty":3,"kind":"delta","tags":["merklization","state-keys","rho","delta-0.8.0"],"stem":"Your 0.7.2 encoder writes the C(10) entry of T(σ) as, per core, an optional pair of work-report and reporting timeslot. What does GP 0.8.0 put there instead?","options":["Per core an optional pair of work-report and timeslot exactly as before; 0.8.0 only tightened the timeslot to a fixed-length E_4 encoding and left the payload alone.","Per core an optional pair ⟨a_g, E_4(a_t)⟩ written with the ? option discriminator, where a_g is the entire guarantee G ≡ (r work-report, t timeslot, a credential of 2–3 (validator index, Ed25519 signature) pairs) — so the guarantors' signatures are now part of committed state.","The availability assurances extrinsic of the current block, so that an assurer's bitfield can be proven against the state root without replaying the block.","Only the availability specification (package hash, erasure root, segment root, bundle length) of each core's pending report, the guarantee itself being retained off-chain by the guarantors until an audit demands it; that is precisely the size reduction 0.8.0 was aiming for."],"answer":1,"optNotes":["0.8.0 換掉的是 payload 本身：ρ 現在存整個 guarantee，連 guarantor 的 credential 都在內。","#494 把 eq. 11.1 改成 ρ ∈ ⟦(g ∈ G, t ∈ N_T)?⟧_C，guarantor 簽章因此進入 committed state。","extrinsic 從不進 trie，這是把 extrinsic 與 state 兩件事搞混了。","availability specification 是 work-report 內部的欄位而非 ρ 的內容，0.8.0 也是加大而非縮小這一格。"],"explanation":"GP 0.8.0（PR #494「Keep full guarantees in availability assignments state (rho)」）把 eq. 11.1 改成 ρ ∈ ⟦(g ∈ G, t ∈ N_T)?⟧_C，而 G ≡ (r ∈ R, t ∈ N_T, a ∈ ⟦(N, V̄)⟧_{2:3})（eq. 11.24；0.8.0 的 R 是 work-report 集合、W 是 work-item 集合、V̄ 是 Ed25519 簽章集合），也就是 work-report 加上 guarantor 的 credential。附錄 D 的 T(σ) 因此寫成 C(10) ↦ E([ ⟨a_g, E_4(a_t)⟩? for ⟨a_g, a_t⟩ ∈ ρ ])——外層是 optional discriminator（∅ → 0；否則 1 ⌢ …），內層 timeslot 用固定 4 byte。0.7.2 只存 work-report、signature 不進 state；升上 0.8.0 若沒改，C(10) 的 leaf 會短一大截、state root 直接對不上。注意 guarantee 自己帶一個 t（guarantee 的 timeslot），availability assignment 又帶一個 t（reported 的時間，用於 eq. 11.18 的 U 逾時清除），兩者不是同一個欄位。","trap":"0.8.0 之後 ρ[c] 有兩個 timeslot：guarantee 內的 g_t，以及 assignment 的 a_t。序列化時別漏掉前者。"},{"id":"c3-appD-merklize-bitorder","ch":"D","section":"D.2 Merklization","gpRef":"§D.2 (M over D⟨b → (B_31, B)⟩); §3 notation (bits(·) is most-significant-first)","difficulty":3,"kind":"code","tags":["merklization","trie","state-root","incremental"],"stem":"M is defined over a dictionary keyed by bits(k), while the team's Go partitions one slice in place at each depth. A teammate proposes replacing it with 'sort the key-vals ascending, then fold them pairwise like M_B — same leaves, same root, and it vectorizes better'. Which statement is correct?","code":{"lang":"go","caption":"internal/utilities/merklization/merklization.go (partitionByBit, merklizeWithCache)","src":"func partitionByBit(entries []types.StateKeyVal, depth int) int {\n\tbyteIdx := depth / 8\n\tbitMask := byte(1 << (7 - depth%8))\n\tleft := 0\n\tfor right := range entries {\n\t\tif entries[right].Key[byteIdx]&bitMask == 0 {\n\t\t\tentries[left], entries[right] = entries[right], entries[left]\n\t\t\tleft++\n\t\t}\n\t}\n\treturn left\n}\n\nfunc merklizeWithCache(entries []types.StateKeyVal, depth int, cache LeafHashCache) types.OpaqueHash {\n\tif len(entries) == 0 {\n\t\treturn types.OpaqueHash{}\n\t}\n\tif len(entries) == 1 {\n\t\tif cache != nil {\n\t\t\treturn cache(entries[0].Key, entries[0].Value)\n\t\t}\n\t\tnode := encodeLeafNode(entries[0].Key, entries[0].Value)\n\t\treturn hash.Blake2bHash(node[:])\n\t}\n\tpivot := partitionByBit(entries, depth)\n\tleftHash := merklizeWithCache(entries[:pivot], depth+1, cache)\n\trightHash := merklizeWithCache(entries[pivot:], depth+1, cache)\n\tnode := encodeBranchNode(leftHash, rightHash)\n\treturn hash.Blake2bHash(node[:])\n}"},"options":["bits(·) runs least-significant-bit first so as to agree with the bit-sequence encoding E(b) of appendix C, so depth d has to branch on bit d mod 8 of octet ⌊d/8⌋; the partition shown is therefore reversed, and the only reason such an implementation ever matches a vector is that its state-key constructor is reversed too.","The proposal is sound: ascending key order is exactly a pre-order walk of the Patricia trie, so pairwise folding rebuilds the identical shape and the identical root; the in-place partition is nothing but an allocation optimization, and leaf caching keeps working either way because a leaf hash depends on nothing beyond its own key and value.","bits(·) runs most-significant-bit first, so depth d branches on bit 7 − (d mod 8) of octet ⌊d/8⌋; the shape follows from key bit-prefixes alone and never from slice order, which is what lets leaf hashes be cached and only the path from a changed leaf to the root recomputed — folding sorted leaves pairwise builds a balanced tree and a different root.","Insertion order genuinely matters here: the GP requires the leaves to be folded in ascending key order because the resulting root is what gets appended to the accumulation-output belt by M_R, an append-only structure; caching leaf hashes across blocks is consequently unsound and the trie must be rebuilt in full every block."],"answer":2,"optNotes":["附錄 C 的 E(b) 確實是 LSB-first 打包，但那是 codec；trie 導航用的 bits(·) 是 MSB-first。","排序後 pairwise 摺疊得到的是 well-balanced 樹（M_B 的做法），深度與分岔點都不同，root 必然不同。","bits(·) 是 MSB-first，樹形只由 key 的 bit prefix 決定，這正是 leaf hash 能跨區塊快取的前提。","M 的樹形只由 key 的 bit prefix 決定；M_R 的 append-only 屬性屬於 accumulation-output belt，與 state trie 無關。"],"explanation":"§3（notation）定義得很明確：「We use the function bits(B) ∈ b to denote the sequence of bits, ordered with the most significant first … thus bits([160, 0]) = [1, 0, 1, 0, 0, …]」，所以 depth d 要取 octet ⌊d/8⌋ 的第 7 − (d mod 8) 個 bit——正是程式裡的 `byte(1 << (7 - depth%8))`。§D.2 的 M 收的是 dictionary D⟨b → (B_31, B)⟩，遞迴條件是 ⟨b ↦ p⟩ ∈ d ⇔ ⟨b[1:] ↦ p⟩ ∈ l（當 b_0 = 0）或 r（當 b_0 = 1）：樹形**只**由 key 的 bit prefix 決定，跟輸入順序無關。這正是 incremental／cached 計算的前提：leaf hash 可以用 (key, H(value)) 當快取鍵（你們的 `LeafHashCache` 與 `key_level_cache.go` 就是這樣做），一個 block 只改動幾百個 key 時，只需要重算那幾條從 leaf 到 root 的路徑，而不是整棵 trie——否則每個 block 都要重雜湊整個 state，pipelining（header 帶 prior state root）就完全沒有意義了。順帶把幾種 Merkle 結構分清楚：M_B 用在 accumulation-output log 每區塊的 root（β_B′ ≡ A(β_B, M_B(s, keccak), keccak)）與 work-package 的 erasure root；segment root 用定深的 constant-depth merklization；M_R 是 MMR super-peak；而 0.8.0 的 extrinsic hash 根本不是 Merkle 樹：H_X ≡ H(E(H^#(a)))（PR #524）。","trap":"同一份 GP 裡有兩種 bit 順序：trie 導航 bits(·) 是 MSB-first，codec 的 bitstring 打包是 LSB-first。"},{"id":"c3-ch12-omega-xi-theta-naming","ch":"12","section":"12.1 History and Queuing","gpRef":"eq. 12.1 & 12.3; eq. 7.4 (θ); §4.2 state σ","difficulty":1,"kind":"delta","tags":["accumulation","state","notation","delta-0.8.0"],"stem":"Among the state items in σ written by accumulation are ω, ξ and θ. A GP 0.7.2-era Go client still calls its ready-queue field `Vartheta`. Which mapping of symbol → meaning is right for GP 0.8.0?","options":["ω ∈ ⟦{H}⟧_E took over from ξ as the epoch-long history of already-accumulated work-package hashes; the ready queue is still spelled ϑ ∈ ⟦⟦(ℝ, {H})⟧⟧_E in 0.8.0 and θ ∈ ⟦(N_S, H)⟧ is unchanged, so a 0.7.2 client only has to retire the symbol ξ and repoint the state key that held it","ω ∈ ⟦(N_S, H)⟧ is the Accumulation Output Log, renamed from θ in 0.8.0; ξ ∈ ⟦⟦(ℝ, {H})⟧⟧_E is the ready queue of deferred reports each paired with its outstanding dependency set; θ ∈ ⟦(N_S, N_G)⟧ now holds the per-service gas usage u that the last block's Δ+ returned, which is what the accumulation statistics read","ω ∈ ⟦⟦(ℝ, {H})⟧⟧_E is the ready (accumulation) queue of deferred reports each paired with its outstanding dependency set — GP 0.7.2 wrote this as ϑ; ξ ∈ ⟦{H}⟧_E is the epoch-long history of already-accumulated work-package hashes; θ ∈ ⟦(N_S, H)⟧ is the Accumulation Output Log, this block's (service, commitment) pairs","ω ∈ ⟦(N_S, N_S, N_B, B_128, N_G)⟧ is a new 0.8.0 state item holding the deferred transfers carried between accumulation rounds so that they survive a block boundary; ϑ ∈ ⟦⟦(ℝ, {H})⟧⟧_E remains the ready queue and ξ ∈ ⟦{H}⟧_E the epoch-long history of accumulated work-package hashes"],"answer":2,"optNotes":["ξ 在 0.8.0 完全沒有改名或改義，「只要把 ξ 退休掉」的遷移會把 accumulated 歷史整個弄丟。","per-service gas usage u 是 eq. 12.17 的回傳分量，餵完 eq. 12.28 的 G(s) 就消失，進不了 σ。","0.8.0 preamble 把 ready 定為 ω、accumulated 定為 ξ、lastaccout 定為 θ，三個型別也全對。","deferred transfers 從不進 σ，只在 Δ+ 遞迴內部傳遞；eq. 12.14 只是 Ψ_A 的輸入型別。"],"explanation":"GP 0.8.0 的 preamble 明訂 ready = ω、accumulated = ξ、lastaccout = θ。eq. 12.3 給出 ω ∈ ⟦⟦(ℝ, {H})⟧⟧_E（ℝ 是 0.8.0 的 work-report 集合，0.7.2 記作 W；每個 slot 一串「report + 尚未滿足的 dependency 集合」），eq. 12.1 給出 ξ ∈ ⟦{H}⟧_E（一個 epoch 份量的已 accumulate work-package hash），eq. 7.4 / 12.25 給出 θ ∈ ⟦(N_S, H)⟧ 亦即本區塊的 accumulation output log。0.7.2 的 ready queue 符號是 ϑ（團隊 Go 欄位 `Vartheta`、state key C(14)），0.8.0 改成 ω（GP 與 0.8.0 release notes 都沒有說明改名理由，別在口試時把「為了避開 ϑ/θ 混淆」講成 GP 的說法）；state key 不變：C(14)=ω、C(15)=ξ、C(16)=θ。","trap":"面試常考：0.7.2→0.8.0 ready queue 是 ϑ→ω 的更名，state key C(14) 與型別結構都沒動；同章的 W!/W_Q/W* 也一併改成 R!/R^Q/R*；別把 ω 和 θ（output log）搞混。"},{"id":"c3-ch12-operand-tuple-fields","ch":"12","section":"12.2 Execution","gpRef":"eq. 12.13 (U), 12.14 (X), 12.23 (Δ1)","difficulty":1,"kind":"concept","tags":["accumulation","operands","work-digest"],"stem":"Δ1 builds i^U as one operand tuple per work-digest of service s, taken from the round's reports in order. Two of s's digests sit in different reports r₁ and r₂. Which description of what an operand tuple carries is right for GP 0.8.0?","options":["The set is U (and deferred transfers are X, Ψ_A taking ⟦U ∪ X⟧). Each tuple takes y, g and l from the digest and, from its report, the core index and the refinement-context anchor in place of the package hash and segment root, so that accumulate can re-verify availability; digests whose l falls in the work-error set E are dropped before i^U is assembled, so the two tuples survive only if both refined successfully","The set is U (and deferred transfers are X, Ψ_A taking ⟦U ∪ X⟧). One operand tuple is built per report rather than per digest: its l field holds the concatenation of that report's digest results and its g field their summed gas-limits, with p, e, a and t lifted from the report as usual, and the service demultiplexes the results by payload hash — so s receives one tuple here, not two","The set is U (and deferred transfers are X, Ψ_A taking ⟦U ∪ X⟧). An operand tuple is the work-digest verbatim, so besides y, g and l it also carries c the code hash, d_u the gas actually used during refine, and the import / extrinsic / export counts that feed the core statistics; nothing is lifted in from the enclosing report, so the two tuples differ only in their payload hashes","The set is U (and deferred transfers are X, Ψ_A taking ⟦U ∪ X⟧). Each tuple mixes digest-level fields — y payload hash, g accumulate gas-limit, l the result, which is a blob or a member of the work-error set E — with fields lifted from its own report: p = (r_s)_p package hash, e = (r_s)_e segment root, a = r_a authorizer hash and t = r_t authorizer trace; so the two tuples differ in their report-level fields"],"answer":3,"optNotes":["eq. 12.13 的七個欄位裡沒有 core index 與 refinement context；l 的型別是 B ∪ E，錯誤結果不會被濾掉。","與 eq. 12.23 的 d ↕ r_d 迭代直接矛盾：該 service 這一輪有幾個 digest 就有幾個 operand。","code hash c、refine 實際用掉的 gas 與 i/x/z/e 計數只留在 digest，餵 §13 統計與 §11.4 檢查，不進 accumulate。","eq. 12.23 明寫來源：y/g/l 取自 digest，t/e/p/a 取自所屬 report，兩筆的 report-level 欄位因此不同。"],"explanation":"eq. 12.13：U ≡ (p ∈ H, e ∈ H, a ∈ H, y ∈ H, g ∈ N_G, t ∈ B, l ∈ B ∪ E)，eq. 12.14：X ≡ (s, d, a, m, g)，兩者的聯集就是 Ψ_A 的第五個參數（eq. B.9）。eq. 12.23 明白寫出每個 tuple 的來源：l ← d_l、g ← d_g、y ← d_y 來自 work-digest；t ← r_t、e ← (r_s)_e、p ← (r_s)_p、a ← r_a 來自那個 digest 所屬的 report，所以同一個 service 在不同 report 裡的兩個 digest，report-level 欄位不同。l 的型別特地寫成 B ∪ E，就是為了讓 service 自己處理 ∞、☇、BAD、BIG 等錯誤，GP 沒有任何「把 work-error digest 濾掉」的步驟。","trap":"口訣：operand = 「digest 三件（y, g, l）+ report 四件（p, e, a, t）」；refine 用掉多少 gas 不在裡面。"},{"id":"c3-ch12-E-removes-entries-too","ch":"12","section":"12.1 History and Queuing","gpRef":"eq. 12.7 (E), 12.8 (Q), 12.12, 12.33 (ω′)","difficulty":2,"kind":"rationale","tags":["accumulation","dependencies","queue"],"stem":"The queue-editing function E(r, x) does two jobs: it strips dependencies that appear in x, and it also discards whole entries. A teammate implements only the first job. What actually goes wrong?","options":["Only ω′ is affected — both the i = 0 case E(R^Q, ξ′[E−1]) and the i ≥ τ′ − τ case E(ω↺[m−i], ξ′[E−1]) would keep reports that were just accumulated, so the ready queue grows without bound until the epoch-long shift drops the stale entries. Q itself stays safe, because each recursion is fed a strictly shorter sequence once its dependency sets have been stripped","Nothing breaks. Q still terminates because its recursion is bounded by the epoch length E, and the §11.4 contextual check rejects any incoming report whose package hash is already in ξ, so an entry sitting in ω can never be accumulated a second time either; discarding whole entries is a pure optimisation that keeps ω small","Q stops terminating — E(r, P(g)) hands back the same entries with still-empty dependency sets, so the next recursion picks the identical g forever — and at the block boundary ω′ (both the i = 0 case E(R^Q, ξ′[E−1]) and the i ≥ τ′ − τ case E(ω↺[m−i], ξ′[E−1])) keeps reports that were just accumulated, so they would be accumulated again in a later block","The dependency-stripping job becomes redundant instead: once entries are never removed, a report can only ever be blocked by another report sitting in the same queue, so every dependency E would have stripped belongs to an entry E would also have deleted. Q therefore still terminates and ω′ still drains, just more slowly — one epoch-long shift at a time rather than one accumulation round at a time"],"answer":2,"optNotes":["沒有刪除就不會變短：Q 每輪拿到的序列長度不變，遞迴照樣不收斂。","§11.4 管的是 E_G 新進來的 guarantee，管不到早就躺在 ω 裡的項目；Q 也沒有 epoch 長度的界。","少了 (r_s)_p ∉ x 這一半，eq. 12.8 每一輪都算出同一批 g，遞迴永遠停不下來。","被依賴的那份可能走 R! 或早已只留在 ξ，剪依賴與刪項目作用在不同項目上，兩者不互相涵蓋。"],"explanation":"eq. 12.7 的 E 同時做兩件事：「(r, x) ↦ [(r, d ∖ x) | (r, d) ↕ r, (r_s)_p ∉ x]」——後半的過濾條件 (r_s)_p ∉ x 才是把「自己已經被 accumulate」的項目整筆刪掉的那一半。少了它，eq. 12.8 的 Q(r) = g ⌢ Q(E(r, P(g))) 會無限遞迴，因為 g 裡的項目依然留在 E(r, P(g)) 中且 dependency 集合仍為空。同樣地 eq. 12.12 的 q = E(… ⌢ R^Q, P(R!)) 會讓同時出現在 R! 與 ready queue 的 report 在同一個區塊被 accumulate 兩次，而 eq. 12.33 三個 case 中的兩個（i = 0 與 i ≥ τ′ − τ）靠 E(·, ξ′[E−1]) 清掉本區塊已完成的項目（中間的 1 ≤ i < τ′ − τ 是直接清成 ⟦⟧，不套用 E）。eq. 12.8 唯一的 base case 是 g = ⟦⟧。","trap":"E 是「刪項目 + 剪依賴」兩件事；只做剪依賴，Q 就不會收斂。"},{"id":"c3-ch12-starved-dependency-fate","ch":"12","section":"12.1 History and Queuing","gpRef":"eq. 12.8 (Q), 12.31–12.33; §12.1","difficulty":2,"kind":"concept","tags":["accumulation","dependencies","ready-queue"],"stem":"A report w is sitting in ω with one outstanding dependency p, and package p is never accumulated — the report carrying p was guaranteed a few blocks ago but timed out on its core and never became available. Trace w's fate under GP 0.8.0.","options":["Q never emits it, and the block that made w available is invalid: §12.1 says accumulation is cancelled entirely in the case of an invalid dependency, and cancellation is signalled by rejecting the block, so a report that times out on its core retroactively invalidates whichever later block first queued the report that depended on it","Q never emits it, because its dependency set is never emptied; it is then dropped at the very next block, because E(·, ξ′[E−1]) removes any entry still carrying a dependency that is absent from ξ — which is exactly how the GP cancels a report with an unsatisfiable dependency","Q never emits it, because its dependency set is never emptied; each block it is simply carried forward by the i ≥ τ′ − τ case ω′↺[m−i] = E(ω↺[m−i], ξ′[E−1]), and it vanishes at most one epoch later when the slot index wraps round and the i = 0 case overwrites that very slot with the new block's R^Q","Q holds it back only for a while: after E = 600 slots the dependency is deemed expired, the i ≥ τ′ − τ case stops re-applying E to that slot, and Q then treats w's dependency set as empty and accumulates it with whatever operands it has — so the work is delayed by at most one epoch but never silently lost"],"answer":2,"optNotes":["§12.1 的 cancelled entirely 指靜默淘汰；guarantor 在 core 上逾時本來就是 §11 允許的正常結果。","把 E 的語意反了：第二個參數是「已完成」的 hash 集合，只刪自己 package hash 落在其中的項目。","eq. 12.33 的 i ≥ τ′ − τ 逐塊把它搬過去，直到 slot index 繞回、i = 0 那格被新的 R^Q 整個覆寫。","「到期就視為依賴滿足、照樣 accumulate」是憑空發明的規則，eq. 12.8 只挑 dependency 集合為空者。"],"explanation":"eq. 12.8 的 Q 只挑 dependency 集合為空的項目（g = [r | (r, ∅) ↕ r]），w 永遠不會被挑中。eq. 12.33 的三個 case 決定它的壽命：i = 0 用本區塊的 R^Q 覆寫目前 slot、1 ≤ i < τ′ − τ 把跳過的 slot 清成 []、i ≥ τ′ − τ 則保留舊內容但套用 E(·, ξ′[E−1])。由於索引是 cyclic 的 ω′↺[m − i]，w 所在的 slot 在最多 E = 600 個 slot 後就會輪到 i = 0 被整個覆寫，這正好呼應 §12.1 的敘述「Each of these were made available at most one epoch ago」。GP 說的 cancelled entirely 指的是這種靜默淘汰——§12.1 沒有任何條款把 dependency 問題升級成區塊無效（§12 另有區塊有效性條件：12.18 底下 n/m 的索引衝突、以及 eq. 12.35–12.36 對 E_P 的要求，但與 dependency 無關）。","trap":"ready queue 的淘汰不是超時計時器，而是 cyclic buffer 被同一個 slot index 繞回來覆寫。"},{"id":"c3-ch12-gas-floor-vs-ceiling","ch":"12","section":"12.2 Execution","gpRef":"§11.4 (report gas checks); eq. 12.23 (Δ1 g), 12.24 (block g); §9.1","difficulty":2,"kind":"concept","tags":["accumulation","gas","service-accounts"],"stem":"G_A = 10,000,000 and G_T = 3,500,000,000, while every service account carries a_g and a_m. Which statement correctly places each accumulate-gas limit — the ceilings and the per-service floors?","options":["Per report, §11.4 requires Σ over its digests of d_g ≤ G_A; per service, G_A is additionally a per-block cap enforced inside Δ1, which is why eq. 12.23 clamps that service's g at G_A instead of summing its sources; and a_g is a refund floor rather than a minimum — whatever a service leaves unspent below a_g is credited back to its balance at the end of Δ+, with a_m playing the same role for deferred transfers","Per report, §11.4 requires Σ over its digests of d_g ≤ G_A and every digest's d_g ≥ δ[d_s]_g (the destination service's a_g), both checked at guarantee time against the prior δ; per block, eq. 12.24 sets Δ+'s budget to g = max(G_T, G_A·C + Σ values(χ_Z)); and the `transfer` host call refuses with LOW unless the transfer's gas l ≥ δ[d]_m, so a deferred transfer also arrives with enough gas for the recipient's Accumulate","Both ceilings are enforced inside Δ+ at accumulation time rather than at guarantee time: eq. 12.24's budget covers the whole block and §11.4's per-report sum is re-checked there against the posterior δ, so a service whose a_g exceeds G_A can never be accumulated — which is why a_g ≤ G_A is maintained as a state invariant by the `new` host call, and a_m is bounded against G_T the same way","Per report, §11.4 requires Σ over its digests of d_g ≤ G_T, G_T being the figure that bounds any single report; per block, eq. 12.24 builds Δ+'s budget out of G_A, the whole-block ceiling, which is why G_T is the larger constant of the two; and the two service-level floors run the other way round — a_g is the minimum gas per deferred transfer and a_m the minimum per work-item"],"answer":1,"optNotes":["eq. 12.23 的 g 是三項相加、沒有任何 clamp；§9.1 的 a_g 是准入下限而不是事後回沖。","三個層級各歸各位：report 層 G_A 與 a_g（對 prior δ 檢查）、block 層 eq. 12.24、transfer 層 a_m。","§11.4 兩條 gas 條件在 guarantee 時就對 prior δ 檢查過，Δ+ 不會重驗；GP 也沒有這條不變量。","數量級剛好反了：G_T 比 G_A 大 350 倍，當成單一 report 上限會讓一份 report 吃掉整塊預算。"],"explanation":"三個層級要分清楚。(1) Report 層：§11.4 的條件是 ∀w ∈ I: Σ_{d ∈ w_d}(d_g) ≤ G_A ∧ ∀d ∈ w_d: d_g ≥ δ[d_s]_g，是在 guarantee 進來時用 prior δ 檢查，跟 §12 無關（真要在 Δ+ 重驗，posterior δ 裡的 a_g 可能已被本塊改過，反而會讓合法區塊被拒）。(2) Block 層：eq. 12.24 的 g = max(G_T, G_A·C + Σ_{x ∈ values(χ_Z)}(x))，definitions.tex 也說 G_T「should be no smaller than G_A·C + Σ」。(3) Service 層的兩個下限來自 §9.1：a_g 是「每個 work-item」執行 Accumulate 所需的最低 gas，a_m 是「每筆 deferred transfer」所需的最低 gas，後者由 `transfer` host call 以 LOW 錯誤把關。","trap":"上限往下走（block g → report G_A），下限往上走（a_g / a_m → 呼叫方必須配足）；別把兩個方向搞反。"},{"id":"c3-ch12-theta-from-yield","ch":"12","section":"12.3 Final State Integration","gpRef":"eq. 12.18 (b), 12.25 (θ′); eq. 7.7 (β′_B)","difficulty":2,"kind":"concept","tags":["accumulation","output-log","beefy"],"stem":"In one block: service 5 accumulates and calls `yield` with a 32-octet hash; service 6 accumulates and burns gas but never calls `yield`; service 9 has no work-digest at all and is reached only by a deferred transfer, and it calls `yield`. What ends up in θ′, and what consumes it?","options":["b = {(s, y) | s ∈ s, y = Δ(s)_y, y ≠ ∅}, so this block contributes exactly the pairs for services 5 and 9; but θ′ is the append-only log of every accumulation output since genesis, so those two pairs are merely its tail, and the belt β_B is a cache of the Merkle root taken over that whole log","b = {(s, y) | s ∈ s, y = Δ(s)_y, y ≠ ∅}, but only services holding at least one work-digest in R*[..n] are members of s, so θ′ carries the pair for service 5 alone — service 9 is excluded even though it yielded, because a service reached solely by a deferred transfer can never commit an accumulation output. θ′ is replaced wholesale each block and is what β′_B appends to","θ′ holds one entry for every service in Δ*'s service set s, with the zero hash standing in for services that did not yield, so θ′ carries pairs for services 5, 6 and 9 alike and |θ′| = |s|, which is what lets downstream verifiers index it by position. It is a state item of its own, replaced wholesale each block, and it is what β′_B appends to","b = {(s, y) | s ∈ s, y = Δ(s)_y, y ≠ ∅}, so θ′ carries exactly the pairs for services 5 and 9 — service 6 shows up in u and in the accumulation statistics S but not here. θ′ is a state item of its own, replaced wholesale each block, and it is the input to β′_B = A(β_B, M_B(s, H_K), H_K) whose super-peak is stored in the new β_H entry"],"answer":3,"optNotes":["方向顛倒：θ′ 每塊整批換掉（state key C(16)），真正跨區塊累積的是 §7 的 β_B。","eq. 12.18 的 s 是三段聯集，純收款與 always-accumulate 服務同樣會被 Δ1 呼叫、同樣能 yield。","與 eq. 12.18 的 b ≠ ∅ 過濾直接衝突，也讓「零 hash」這個合法的 yield 值無從分辨。","b ≠ ∅ 濾掉沒呼叫 yield 的 service 6，而 transfer 收款方本來就在 s 裡，所以 5 與 9 都入列。"],"explanation":"eq. 12.18 定義 b = {(s, b) | s ∈ s, b = Δ(s)_y, b ≠ ∅}，條件 b ≠ ∅ 表示「沒呼叫 yield 就不入列」，所以只燒 gas 的服務只會出現在 u（gas 使用量）與 eq. 12.28 的 S，不會出現在 θ′。Δ* 的 service 集合 s = {d_s | r ∈ r, d ∈ r_d} ∪ K(f) ∪ {t_d | t ∈ t}，transfer 的收款方本來就在裡面。eq. 12.25：θ′ ≡ ⟦(s, h) ∈ b⟧，它是 σ 裡獨立的一項（state key C(16)），每個區塊整批換掉，不是自創世以來的累積；真正累積的是 §7 的 β_B（eq. 7.7 用 Keccak 做 M_B 與 MMB append），其 super-peak 才寫進 β_H。","trap":"沒 yield 就沒 commitment：θ′ 的長度由 yield 次數決定，不由 |s| 決定。"},{"id":"c3-ch12-provide-two-places","ch":"12","section":"12.2 Execution / 12.4 Preimage Integration","gpRef":"eq. 12.18 (d′), 12.20 (I), 12.21 (Y), 12.37","difficulty":2,"kind":"concept","tags":["accumulation","preimages","provide"],"stem":"The preimage-integration function I is applied twice during a block's transition. Where are the two applications, and what does its Y predicate silently discard?","options":["Only once, at the very end as δ′ = I(δ‡, E_P): the `provide` host call writes straight into the service's a_p and a_l during accumulation, so Δ* has nothing left to integrate. Y(d, s, i) is ⊥ unless s ∈ K(d) and d[s]_l[(H(i), |i|)] = [], so a blob aimed at a service ejected in the same round is dropped without prejudice — but that can only ever bite the extrinsic, never a `provide`","Once inside Δ1 for each accumulating service — so each service folds in its own provisions before Δ* merges the account dictionaries — and once at the very end as δ′ = I(δ‡, E_P). Y(d, s, i) accepts a request slot of the form [] or [x, y], i.e. solicited, or previously available and then forgotten, which is what lets the same preimage be provided twice over a service's lifetime","Once inside Δ* as e_d′ = I((e_d ∪ n) ∖ m, ⋃_{s ∈ s} Δ(s)_p) — folding in the blobs offered by the `provide` host call only after newly created and removed services have been merged — and once at the very end as δ′ = I(δ‡, E_P). Y(d, s, i) is ⊥ unless s ∈ K(d) and d[s]_l[(H(i), |i|)] = [], so a blob aimed at a service ejected in the same round, or at a request that is not merely solicited, is dropped without prejudice","Twice — once inside Δ* and once at the very end — but both applications take E_P as their second argument, the blobs offered by `provide` having been merged into E_P before Δ* runs. Y(d, s, i) additionally requires the blob to be under W_C = 4,000,000 octets and the service to hold the storage deposit for it, and a failure of either condition makes the block invalid rather than dropping the blob"],"answer":2,"optNotes":["漏掉 Δ* 這一層的合流：eq. 12.18 的 e_d′ 就是用 I 把 ⋃ Δ(s)_p 併進去的。","Δ1 只把 provisions 當輸出回傳；[x, y] 代表曾 available 後被 forget，違反 Y 的等號條件。","eq. 12.18 的 I 在 n 併入、m 移除之後才收 provisions，eq. 12.37 的 I 再收 E_P，兩處各司其職。","eq. 12.20–12.21 的 Y 只有兩個條件，沒有 W_C 與押金，且不合格是 disregarded 而非讓區塊無效。"],"explanation":"eq. 12.18 的 e_d′ = I((e_d ∪ n) ∖ m, ⋃_{s ∈ s} Δ(s)_p)：`provide` host call 產生的 provisions Δ(s)_p 是在 Δ* 這一層、而且是在新建服務 n 併入、被刪服務 m 移除「之後」才整合，所以同一輪被 eject 掉的服務收不到 blob（否則 n 與 m 還沒算出來，就無法判斷目標 service 是否還存在）。eq. 12.37 的 δ′ = I(δ‡, E_P) 是第二次，處理 preimage extrinsic。eq. 12.21 的 Y(d, s, i) 只在 s ∈ K(d) 且 d[s]_l[(H(i), |i|)] = ⟦⟧ 時為真，GP 原文也明說「Preimage provisions into services which no longer exist or whose relevant request is dropped are disregarded」——是靜默略過，不是讓區塊無效。","trap":"I 出現兩次：Δ* 裡收 `provide`、區塊尾端收 E_P；兩次的丟棄都是「without prejudice」，不會讓區塊無效。"},{"id":"c3-ch12-code-accumulation-statistics","ch":"12","section":"12.3 Final State Integration","gpRef":"eq. 12.27–12.28; eq. 12.17 (Δ+ output)","difficulty":2,"kind":"code","tags":["accumulation","statistics","code","delta-0.8.0"],"stem":"This is the team's GP 0.7.2 accumulation-statistics builder S. Which gap against GP 0.8.0 must be closed?","code":{"lang":"go","caption":"internal/accumulation/deferred_transfers.go (calculateAccumulationStatistics), 0.7.2 main","src":"// (12.28–12.29) S ≡ {(s ↦ (G(s), N(s))) | G(s)+N(s) ≠ 0}\nfunc calculateAccumulationStatistics(serviceGasUsedList types.ServiceGasUsedList,\n\tn types.U64) types.AccumulationStatistics {\n\tG := map[types.ServiceID]types.Gas{} // G(s)\n\tfor _, serviceGasUsed := range serviceGasUsedList {\n\t\tG[serviceGasUsed.ServiceID] += serviceGasUsed.Gas\n\t}\n\n\tS := types.AccumulationStatistics{}\n\tfor s, Gs := range G {\n\t\tNs := types.U64(len(getWorkResultByService(s, n)))\n\n\t\tif types.U64(Gs)+Ns == 0 {\n\t\t\tcontinue // skip, N(S) = []\n\t\t}\n\n\t\tS[s] = types.GasAndNumAccumulatedReports{\n\t\t\tGas:                   Gs,\n\t\t\tNumAccumulatedReports: Ns,\n\t\t}\n\t}\n\treturn S\n}"},"options":["N(s) must count whole work-*reports*, not digests: eq. 12.28 iterates r ↕ R*[..n] and counts each report once for the service that owns it, whereas this code counts one entry per matching digest, so a report carrying two digests for the same service is double-counted","0.8.0 makes S ∈ ⟨N_S → (N, N, N_G)⟩ a three-tuple S(s) = (N(s), T(s), G(s)); the missing middle element T(s) counts the processed deferred transfers whose destination is s, which forces Δ+ to return a fifth component — the processed-transfer sequence t ⌢ t† — and the inclusion filter becomes S(s) ≠ (0, 0, 0) rather than a sum test","G(s) must be the gas *allotted* — Σ d_g over the service's digests, the very figure §11.4 checks against G_A — rather than the gas actually used, otherwise a service that runs out of gas is under-charged in the statistics that feed π_S; the two-element shape and the sum-based inclusion filter are both already right for 0.8.0","S must carry an entry for every service in δ, with the all-zero triple for untouched services, so that the dictionary's key set is stable from block to block and π_S's serialization keeps a fixed length; the shape does become a triple in 0.8.0, but the new element is the transfer count sitting *last*, and it is Δ*, not Δ+, that returns the processed-transfer sequence it is built from"],"answer":1,"optNotes":["eq. 12.28 的 N(s) 明確是 d ↕ r_d 逐個 digest 數，不是逐 report 數。","eq. 12.27–12.28 的三元組與 S(s) ≠ (0,0,0) 篩選，逼得 eq. 12.17 的 Δ+ 多回傳 t ⌢ t†。","G(s) ≡ Σ_{(s, u) ∈ u}(u) 就是實際用掉的 gas，不是 §11.4 檢查的宣告上限。","S 只收非零項（δ‡ 才只對 K(S) 蓋 a_a）；T(s) 在三元組中間，且 t ⌢ t† 由 Δ+ 而非 Δ* 回傳。"],"explanation":"GP 0.8.0 eq. 12.27 寫的是 S ∈ ⟨N_S → (N, N, N_G)⟩，eq. 12.28 是 S ≡ {(s ↦ S(s)) | S(s) ≠ (0, 0, 0)}，其中 S(s) ≡ (N(s), T(s), G(s))，T(s) ≡ |[t | t ↕ t, t_d = s]| 就是「送到 s 的已處理 deferred transfer 筆數」（GP PR #502 “Add back processed transfer count to service statistics”）。要算得出 T(s)，eq. 12.17 的 Δ+ 必須多回傳一個 processed-transfer 序列（回傳值是 ⟨i + j, e′, b* ∪ b, u* ⌢ u, t ⌢ t†⟩），而這份 0.7.2 程式的 OuterAccumulationOutput 只有四個欄位、型別也只是 (Gas, NumAccumulatedReports) 兩元組，篩選條件寫成 Gs + Ns == 0 也不等價於三元組全零。S 只收非零項，正是為了讓 δ‡ 只對真的被 accumulate 的服務蓋上 a_a = τ′，而 S 又是 π_S 的來源之一（eq. 13.14 的 K(S)）。","trap":"0.8.0 的 accumulation statistics 是三元組 (N, T, G)；漏掉 T 會連帶讓 Δ+ 的回傳值少一個分量。"},{"id":"c3-ch12-why-R-star-is-a-sequence","ch":"12","section":"12.1 History and Queuing","gpRef":"eq. 11.17 (R), 12.4, 12.11 (R*), 12.17, 12.31","difficulty":2,"kind":"rationale","tags":["accumulation","determinism","availability"],"stem":"R, R!, R^Q and R* are all sequences rather than sets, even though only membership decides which reports are eligible. Why does the ordering matter for consensus, and where is it fixed?","options":["Because Δ+ accumulates only the gas-fitting prefix R*[..i] and then records ξ′[E−1] = P(R*[..n]): a different ordering yields a different prefix and hence a different posterior state. The order is pinned right back at eq. 11.17, where R is built by walking cores in ascending core index over ρ† and keeping those with more than 2/3·|κ| assurances; R! preserves that order and Q appends the queued reports in dependency-resolution rounds","Ordering only affects the accumulation statistics S and therefore π_S, because eq. 12.28's N(s) walks R*[..n] in order; the service state δ† is order-independent, since each service's Δ1 is a pure function of its own operands and its own prior account, and ξ′[E−1] = P(R*[..n]) is a set, so whatever order its members were produced in is lost the moment it is written","It does not matter for the posterior state. Δ* accumulates services in parallel, and any permutation of R* selects the same gas-fitting prefix anyway, because eq. 12.17 picks the maximal i by a sum and addition is commutative; that is exactly why b is a set while u is merely a convenient sequence, and why the GP bothers to fix an order only at eq. 12.11, purely so the prose can talk about R* concretely","Because Δ+ accumulates only the gas-fitting prefix R*[..i], so when gas runs short the ordering decides what gets dropped. The order is pinned at eq. 11.17, where R is built by ranking cores on how many assurances each collected, most-assured first, so that the best-attested reports are the ones accumulated and the marginal ones are deferred into ω"],"answer":0,"optNotes":["eq. 12.17 只吃 gas 前綴、eq. 12.31 寫 ξ′[E−1] = P(R*[..n])，順序因此是共識的一部分。","ξ′[E−1] 雖是集合，決定它內容的仍是前綴長度 n，所以 δ† 與 state root 同樣隨順序而變。","把「Δ* 內服務可平行」誤讀成「報告可任意重排」：eq. 12.17 選的是前綴，重排會換掉入選的那個集合。","eq. 11.17 走的是 c ↕ N_C；2/3·|κ| 只是布林門檻，跨過就入列，沒有任何名次可言。"],"explanation":"eq. 12.17 選的是「最大的前綴 i」使得 Σ_{r ∈ r[..i], d ∈ r_d}(d_g) + Σ_{t ∈ t}(t_g) + Σ_{x ∈ values(f)}(x) ≤ g，而 eq. 12.31 又用 ξ′[E−1] = P(R*[..n]) 把「本區塊做完了哪些 package」寫進 state。這兩處都只看前綴，所以順序一旦不同，被 accumulate 的集合、ξ′、δ† 乃至 state root 全都不同。順序的源頭在 eq. 11.17：R ≡ [(ρ†[c]_g)_w | c ↕ N_C, Σ_{a ∈ E_A}
