<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>JAM M1 Drill</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF0; --ink:#17212B; --ink-2:#4B5B69; --muted:#7C8B98;
  --line:#D7DEE4; --line-2:#C4CDD5;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --accent-soft:#DDF0F2;
  --amber:#B8741F; --amber-soft:#F7E9D3;
  --ok:#1F8A4C; --ok-soft:#DDF3E5; --bad:#C43D3D; --bad-soft:#F9E1E1;
  --code-bg:#F6F8FA; --code-ink:#1F2933; --kw:#8A3FA6; --str:#0A7D4F; --cm:#7C8B98; --fn:#1D5FB0;
  --shadow:0 1px 2px rgba(23,33,43,.06),0 8px 24px -12px rgba(23,33,43,.18);
  --radius:10px;
  --serif:"Source Serif 4","Noto Serif TC",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans","Noto Sans TC",-apple-system,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1418; --surface:#161C22; --surface-2:#1E262E; --ink:#E6ECF1; --ink-2:#B4C0CA; --muted:#8A99A6;
    --line:#2A343D; --line-2:#37424C;
    --accent:#3FB5C0; --accent-ink:#0B1215; --accent-soft:#143237;
    --amber:#E0A04E; --amber-soft:#3A2A14;
    --ok:#4CC27E; --ok-soft:#153824; --bad:#E5706C; --bad-soft:#3E1C1C;
    --code-bg:#0C1114; --code-ink:#D8E0E6; --kw:#C792EA; --str:#7BD88F; --cm:#7C8B98; --fn:#82AAFF;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1418; --surface:#161C22; --surface-2:#1E262E; --ink:#E6ECF1; --ink-2:#B4C0CA; --muted:#8A99A6;
  --line:#2A343D; --line-2:#37424C;
  --accent:#3FB5C0; --accent-ink:#0B1215; --accent-soft:#143237;
  --amber:#E0A04E; --amber-soft:#3A2A14;
  --ok:#4CC27E; --ok-soft:#153824; --bad:#E5706C; --bad-soft:#3E1C1C;
  --code-bg:#0C1114; --code-ink:#D8E0E6; --kw:#C792EA; --str:#7BD88F; --cm:#7C8B98; --fn:#82AAFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}
code,pre,.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
/* ---------- rail ---------- */
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 16px 24px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--sans);font-weight:600;font-size:18px;letter-spacing:-.01em;margin:0}
.brand h1 span{color:var(--accent)}
.brand .sub{font-size:12px;color:var(--muted);letter-spacing:.02em}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:8px}
.modes button{border:0;background:transparent;border-radius:6px;padding:7px 4px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rail h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.chapters{display:flex;flex-direction:column;gap:2px}
.rail[data-mode="gloss"] .chapters-block,.rail[data-mode="gloss"] .filters{display:none}
.modes button:nth-child(5):last-child{grid-column:span 2}
.qa-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:13px}
.card.qa{margin-bottom:12px}
.qa-q{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;padding:0;margin:0;cursor:pointer;color:var(--ink);font:inherit}
.qa-q .qa-n{flex:0 0 auto;min-width:28px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;padding-top:3px}
.qa-q .qa-qt{flex:1;font-size:16px;font-weight:600;line-height:1.55}
.qa-caret{flex:0 0 auto;color:var(--muted);transition:transform .15s;padding-top:2px}
.card.qa.open .qa-caret{transform:rotate(180deg)}
.qa-ans{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent);line-height:1.65}
.qa-ans b{display:block;font-size:11px;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.sheet h2{font-size:20px;margin:0 0 6px}
.sheet .sheet-one{color:var(--ink-2);line-height:1.7;margin:0 0 4px}
.sheet section{margin-top:20px}
.sheet section h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.sheet ol,.sheet ul{margin:0;padding-left:20px;line-height:1.7}
.sheet ol li,.sheet ul li{margin-bottom:4px}
.sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.sheet dt{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap}
.sheet dd{margin:0;line-height:1.6}
.sheet .qa{border-left:2px solid var(--line);padding-left:12px;margin-bottom:12px}
.sheet .qa b{display:block;margin-bottom:3px}
.sheet .qa span{color:var(--ink-2);line-height:1.7}
.sheet-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
@media print{
  .app{display:block}
  .rail,#status,.qa-bar,.drawer-toggle,.qa-caret{display:none!important}
  body,.stage,.card{background:#fff!important;color:#000!important}
  .card{max-width:none;border:0;border-bottom:1px solid #ccc;border-radius:0;box-shadow:none;padding:10px 0 14px;margin:0;break-inside:avoid;page-break-inside:avoid}
  .qa-a[hidden]{display:block!important}
  .qa-q .qa-qt{font-size:13pt}
  .expl,.qa-ans,.trap{border-color:#bbb!important;background:#fafafa!important;color:#000!important}
  .code{background:#f4f4f4!important;color:#000!important;border:1px solid #ddd}
  .tag,.ref,.code-cap{color:#555!important}
  @page{margin:14mm}
}
.ch{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;border:1px solid transparent;background:transparent;text-align:left;cursor:pointer;width:100%}
.ch:hover{background:var(--surface-2)}
.ch[aria-pressed="true"]{border-color:var(--line-2);background:var(--surface-2)}
.ch .num{font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;text-align:center;padding:2px 0}
.ch[aria-pressed="true"] .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ch .name{font-size:13px;line-height:1.25;display:flex;flex-direction:column;gap:3px;min-width:0}
.ch .name b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)} .bar .ng{background:var(--bad)}
.ch .cnt{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ch.app-ch .num{border-style:dashed}
.chgroup{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px 8px}
.filters{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.amber[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber)}
.search{width:100%;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);border-radius:7px;padding:7px 10px;font-size:13px}
.rail .foot{margin-top:auto;font-size:11px;color:var(--muted);line-height:1.5}
.rail .foot button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:11px}
/* ---------- stage ---------- */
.stage{padding:22px 28px 60px;min-width:0}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-size:13px;color:var(--ink-2);margin-bottom:16px;max-width:860px}
.status .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.status .stat{display:flex;gap:6px;align-items:baseline}
.status .stat b{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.status .spacer{flex:1}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);max-width:860px;padding:22px 26px 24px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.tag{border:1px solid var(--line-2);border-radius:5px;padding:1px 7px;font-family:var(--mono);font-size:11px;color:var(--ink-2);background:var(--surface-2)}
.tag.chtag{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tag.delta{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
.tag.kind{text-transform:uppercase;letter-spacing:.04em}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:inline-block}
.dots i.on{background:var(--ink-2)}
.sect{font-size:12px;color:var(--muted)}
.stem{font-family:var(--serif);font-size:19px;line-height:1.5;color:var(--ink);margin:0 0 14px;text-wrap:pretty;max-width:66ch}
.stem code{font-size:.9em;background:var(--surface-2);padding:1px 4px;border-radius:4px}
pre.code{background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 14px;overflow-x:auto;font-size:12.5px;line-height:1.5;tab-size:4}
.code-cap{font-family:var(--mono);font-size:11px;color:var(--muted);margin:-8px 0 12px}
.kw{color:var(--kw)} .str{color:var(--str)} .cm{color:var(--cm);font-style:italic} .fn{color:var(--fn)}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;width:100%;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:15px;line-height:1.45;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .key{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;text-align:center;padding:2px 0;margin-top:1px;background:var(--surface-2)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt.picked{outline:2px solid var(--accent);outline-offset:1px}
.verdict{display:flex;align-items:center;gap:10px;margin:16px 0 0;font-weight:600;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--bad)}
.expl{margin-top:12px;border-left:3px solid var(--line-2);padding:4px 0 4px 16px;font-family:var(--sans);font-size:14.5px;line-height:1.75;color:var(--ink);max-width:72ch;white-space:pre-wrap}
.expl.ok{border-color:var(--ok)} .expl.ng{border-color:var(--bad)}
.trap{margin-top:12px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:8px;padding:8px 12px;font-size:13.5px;line-height:1.6;max-width:72ch}
.trap b{color:var(--amber);font-weight:600;margin-right:6px}
.ref{margin-top:18px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.expl-block{margin-top:22px}
.expl-head{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:8px}
.expl-block .expl{margin-top:0}
.optnotes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.on{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--surface)}
.on.ok{border-color:var(--ok);background:var(--ok-soft,transparent)}
.on.picked{border-color:var(--bad)}
.on-n{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;padding-top:3px}
.on.ok .on-n{color:var(--ok)} .on.picked .on-n{color:var(--bad)}
.on-t{font-size:14.5px;line-height:1.55;color:var(--ink)}
.on-tag{display:inline-block;font-size:10.5px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;margin-right:8px;vertical-align:1px;font-weight:600}
.on-tag.ok{background:var(--ok);color:var(--surface)}
.on-tag.ng{background:var(--line-2);color:var(--muted)}
.on-tag.you{background:var(--bad);color:var(--surface)}
.on-x{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line-2);font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.results-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 10px}
.results-head h3{font-size:15px;margin:0}
.review-item .ri-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ri-n{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:22px}
.ri-mark{margin-left:auto;font-size:12.5px;font-weight:600}
.ri-mark.ok{color:var(--ok)} .ri-mark.ng{color:var(--bad)}
.review-item{padding:16px 18px}
.review-item.is-ng{border-left:3px solid var(--bad)}
.review-item.is-ok{border-left:3px solid var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.actions .hint{font-size:12px;color:var(--muted);margin-left:auto}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2);color:var(--ink-2)}

/* ---------- glossary ---------- */
.gloss{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:900px}
.gloss-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gloss-head .search{max-width:320px}
.gcats{display:flex;flex-wrap:wrap;gap:6px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.gcard summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.gcard summary::-webkit-details-marker{display:none}
.gsym{font-family:var(--mono);font-size:17px;color:var(--accent);min-width:2.2em;font-weight:500}
.gname{display:flex;flex-direction:column;gap:2px;min-width:0}
.gname b{font-weight:600;font-size:15px}
.gname .zh{font-size:13px;color:var(--ink-2)}
.gname .one{font-size:13.5px;color:var(--ink-2);margin-top:3px;line-height:1.55}
.gcard .gref{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.gbody{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.8;color:var(--ink);max-width:72ch}
.grel{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grel span.lbl{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.grel button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:2px 9px;font-size:12px;font-family:var(--mono);cursor:pointer;color:var(--ink-2)}
.grel button:hover{border-color:var(--accent);color:var(--ink)}
.gsec{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 -4px}
.gcard.hit{border-color:var(--accent)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
/* ---------- results / lists ---------- */
.empty{max-width:860px;background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--radius);padding:28px;color:var(--ink-2);font-size:14.5px;line-height:1.7}
.empty h3{margin:0 0 8px;font-size:16px;color:var(--ink)}
.results h2{font-size:22px;margin:0 0 4px;font-family:var(--serif);font-weight:600}
.score{font-family:var(--mono);font-size:40px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0 14px}
.score small{font-size:16px;color:var(--muted)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0 18px}
table.tbl th,table.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.tbl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.review-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.review-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
.review-item .q{font-family:var(--serif);font-size:16px;margin:4px 0 8px}
.review-item .a{font-size:13.5px;line-height:1.6}
.review-item .a b{font-weight:600}
.mock-setup{display:flex;flex-direction:column;gap:14px;max-width:560px}
.mock-setup label{font-size:13px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;color:var(--ink-2);font-size:14px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.notice{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;line-height:1.6;max-width:860px;margin-bottom:14px}
.notice b{font-weight:600}
.drawer-toggle{display:none}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .rail.collapsed .collapsible{display:none}
  .drawer-toggle{display:inline-block}
  .stage{padding:16px 14px 40px}
  .card{padding:16px}
  .stem{font-size:17px}
}
@media (prefers-reduced-motion: no-preference){
  .expl,.verdict,.trap{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>


<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <h1>JAM <span>M1</span> Drill</h1>
      <div class="sub" id="brandSub">Gray Paper 0.8.0 · New-JAMneration</div>
      <button class="btn ghost drawer-toggle" id="drawerToggle" style="margin-top:8px;align-self:flex-start">章節 / 篩選 ▾</button>
    </div>
    <div class="collapsible" style="display:flex;flex-direction:column;gap:18px">

<script id="jam-quiz-data" type="application/json">{"meta":{"bankVersion":"bank v1.0 (2026-08-29)","gpVersion":"Gray Paper 0.8.0","team":"New-JAMneration M1 interview prep","chapters":[{"key":"3","name":"Notation","group":"Chapters 3–13"},{"key":"4","name":"Overview","group":"Chapters 3–13"},{"key":"5","name":"The Header","group":"Chapters 3–13"},{"key":"6","name":"Safrole","group":"Chapters 3–13"},{"key":"7","name":"Recent History","group":"Chapters 3–13"},{"key":"8","name":"Authorization","group":"Chapters 3–13"},{"key":"9","name":"Service Accounts","group":"Chapters 3–13"},{"key":"10","name":"Disputes","group":"Chapters 3–13"},{"key":"11","name":"Reporting & Assurance","group":"Chapters 3–13"},{"key":"12","name":"Accumulation","group":"Chapters 3–13"},{"key":"13","name":"Statistics","group":"Chapters 3–13"},{"key":"14","name":"Work Packages & Reports","group":"Off-chain (14+)"},{"key":"A","name":"PVM","group":"Appendices"},{"key":"B","name":"Host Calls","group":"Appendices"},{"key":"C","name":"Codec","group":"Appendices"},{"key":"D","name":"State Merklization","group":"Appendices"},{"key":"E","name":"General Merklization / MMR","group":"Appendices"},{"key":"F","name":"Shuffling","group":"Appendices"},{"key":"G","name":"Bandersnatch VRF","group":"Appendices"},{"key":"H","name":"Erasure Coding","group":"Appendices"},{"key":"ARCH","name":"Architecture & Rationale","group":"Interview extras"}],"count":270,"glossaryCats":{"state":"狀態與區塊","block":"狀態與區塊","flow":"流程與角色","data":"資料結構","pvm":"PVM 與 host call","crypto":"密碼學","codec":"編碼與 Merklization","const":"常數","offchain":"鏈下協定","eco":"生態系與規則"}},"items":[{"id":"appA-exit-reasons","ch":"A","section":"A.1 Basic Definition","gpRef":"eq. A.1 (Ψ) & §4.7","difficulty":1,"kind":"concept","tags":["pvm"],"stem":"The PVM invocation Ψ returns an exit reason ε. Which is the complete set of possible exit reasons?","options":["∎ halt (regular termination), ☇ panic, ∞ out-of-gas, h̄ × id (host call, with the host-call identifier), ⊗ stack-overflow (raised when φ_1 falls below the stack’s lowest page)","∎ halt (regular termination), ☇ panic, ∞ out-of-gas, F̄ × address (page fault, carrying the exact octet address that was accessed), h̄ × id (host call, with the host-call identifier)","∎ halt (regular termination), ☇ panic, ∞ out-of-gas, F̄ × address (page fault, with the lowest inaccessible page address), ⊘ divide-by-zero (raised when div_u_64 is given φ_B = 0)","∎ halt (regular termination), ☇ panic, ∞ out-of-gas, F̄ × address (page fault, with the lowest inaccessible page address), h̄ × id (host call, with the host-call identifier)"],"answer":3,"optNotes":["PVM 沒有 stack 概念，越界只是 F̄（低於 2^16 才 ☇），這組還漏掉 page fault。","eq. A.9 回的是 Z_P⌊·/Z_P⌋ 對齊後的最低不可存取 page 位址，不是實際存取的 octet 位址。","§A.5.1 的除法從不 panic（除以 0 得 2^64 − 1），⊘ 不存在，這組還漏掉 host call。","與 eq. A.1 的 {∎, ☇, ∞} ∪ ({F̄, h̄} × N_R) 完全一致，fault 帶的正是對齊後的 page 位址。"],"explanation":"eq. A.1：ε ∈ {∎, ☇, ∞} ∪ ({F̄, h̄} × N_R)，剛好五種。§A.1：「In the case of a final halt, either through panic or success, the instruction counter returned is zero. In all other cases, the return value of the instruction counter indexes the one which caused the exit to happen and the machine state represents the prior state of said instruction」——所以 host call / page fault / OOG 都是可以「續跑」的：改 RAM、補 gas、或執行 host call 並把 PC 前進 1 + skip。stack 只是標準初始化（eq. A.46）配置的一段 W 記憶體，不是 PVM 的原生概念。","trap":"PVM 內部沒有 stack overflow 概念——stack 只是記憶體區段，越界就是 page fault（或 < 2^16 時 panic）。"},{"id":"appA-program-blob","ch":"A","section":"A.1 Basic Definition (deblob)","gpRef":"eq. A.2 (deblob), A.3 (skip)","difficulty":2,"kind":"concept","tags":["pvm","codec"],"stem":"What is the layout of a PVM program blob p, and what does the opcode bitmask k do?","options":["p = E(|c|) ⌢ c ⌢ E(|k|) ⌢ k ⌢ E(|j|) ⌢ j: the instruction data and its bitmask come first so that deblob can decode instructions before it has read the table, and every jump-table entry is a fixed 4 octets wide; k is one bit per code octet, 1 = this octet is an opcode","p = magic ⌢ version ⌢ E_4(|c|) ⌢ c ⌢ relocations: a stripped RISC-V ELF image whose headers give the code length, with no bitmask at all — instruction boundaries follow from each opcode’s fixed 4-octet length, and dynamic jump targets are patched in by the relocation table","p = E(|j|) ⌢ E_1(z) ⌢ E(|c|) ⌢ E_z(j) ⌢ c ⌢ k: jump-table length, jump-table entry width z, code length, the jump table (entries of z octets each), the instruction data c, then the bitmask k (one bit per code octet, 1 = this octet is an opcode); |k| must equal |c|","p = E(|j|) ⌢ E_1(z) ⌢ E(|c|) ⌢ E_z(j) ⌢ c ⌢ k in that field order, but k flags the octet *after* each instruction rather than its opcode octet, so |k| = |c| + 1 (the extra bit terminates the last instruction) and skip(i) counts backwards to the previous set bit"],"answer":2,"optNotes":["違反 eq. A.2 的欄位順序，且 entry 寬度是 blob 裡的 E_1(z) 變數，不是固定 4 octets。","§A.2 的指令長度隱含且最多 16 octets，動態跳躍是 runtime 查 j（eq. A.22）而非載入期重定位。","欄位順序與 v_inst 的 |k| = |c| ∧ k_ı = 1 都對上 eq. A.2：k 標的正是每條指令的 opcode octet。","v_inst 要求 |k| = |c| 且標記的就是 opcode 那個 octet，eq. A.3 的 skip 也是往前找下一個 set bit。"],"explanation":"eq. A.2：deblob 要求 p = E(|j|) ⌢ E_1(z) ⌢ E(|c|) ⌢ E_z(j) ⌢ E(c) ⌢ E(k) 且 v_blob(c, k, 0) 與 v_inst(c, k, ı) 都成立（沿 skip 走訪的每個落點都是 bitmask 標記的合法 opcode、最後一條是 terminator）。§A.2：PVM 以 octet 計算指令位置，k 標記哪些 octet 是 opcode；skip(i) = min(24, 到下一個 set bit 的距離 − 1)（eq. A.3），k 後面補無限個 1 讓最後一條指令有定義；指令長度隱含、最多 16 octets。指令資料 ζ = c ⌢ [0, 0, …]（eq. A.4）確保 PC 跑出程式碼時執行 opcode 0 = trap。","trap":"deblob 失敗（格式錯）→ 整個 Ψ 直接 panic。"},{"id":"appA-basic-blocks-gas","ch":"A","section":"A.3 Basic Blocks & A.5 Single-Step","gpRef":"eq. A.5–A.8, A.54","difficulty":3,"kind":"delta","tags":["pvm","gas","delta-0.8.0"],"stem":"GP 0.8.0 (PR #508) introduced a new gas model. How is gas charged?","options":["Per instruction, in arrears: each executed instruction costs 1 gas and the counter is decremented once it retires, exactly as in 0.7.x; when the deduction would take the counter below zero the machine exits with ∞ and the deduction stands, so the gas reported back is negative","Per basic block, in arrears: ϱ^Δ is deducted once the block’s terminator has executed, so a block that panics half-way through costs nothing; ϱ^Δ is the number of instructions in the block, and a deduction that leaves the counter negative exits with ∞ carrying that negative value","Per BASIC BLOCK, in advance: on the first step and whenever execution enters a basic block (or jumps back to its start), the whole block's cost ϱ^Δ is deducted; if the remaining gas is insufficient the machine exits with ∞ and the counter is unchanged; ϱ^Δ = max(cycles − 3, 1) from a simulated out-of-order CPU model","Per instruction, in advance: before each instruction a fixed per-opcode price from the §A.10 table is deducted (ecalli 100, div_u_64 60, unlikely 40, move_reg 0); if the price cannot be paid the machine exits with ∞ and the counter is unchanged, and basic blocks play no part in gas accounting at all"],"answer":2,"optNotes":["每指令 1 gas 是 0.7.2 的模型，已被 PR #508 取代；OOG 時 gas 不扣，更不會變負值。","時機與公式都錯：block 是預扣不是事後扣，ϱ^Δ 也不是指令數，照此 panic 的 block 免費。","eq. A.8 在 ϱ < ϱ^Δ 時回 (∞, ϱ, ⊥)，counter 一分不動；ϱ^Δ = max(cycles − 3, 1) 即 eq. A.54。","§A.10 那張表給的是餵進管線模擬的 cycles 而非 gas 價格，且 GP 要求整個 block 預先收費。"],"explanation":"§A.5：「On the very first step of execution, and every time the execution enters a new basic block or jumps back to the beginning of the current basic block, the gas counter of the machine is updated according to the gas cost function ϱ^Δ of the target basic block. No instruction is allowed to execute within a basic block unless the gas cost for the entire basic block has been charged in advance. In case there's not enough gas remaining… the execution is interrupted and the gas counter remains unchanged.」新增了「gas charged flag」（Ψ 的 bool 參數）以支援 host call 中斷後續跑不重複收費。eq. A.54：ϱ^Δ = max(cycles_final − 3, 1)，cycles 由 §A.9 的微架構模擬算出——初始狀態 (ı, 0, 4 decode slots, 5 starts, ⟨A 4, L 4, S 4, M 1, D 1⟩, ROB = []）、ROB 上限 32 筆；§A.10 有每條指令的 cycles/decode slots/exec units 表。basic block 的邊界 = terminator 指令（trap、fallthrough、jump、jump_ind、load_imm_jump(_ind)、所有 branch_*）之後。你們 0.7.2 每指令 1 gas（GasCost = InstrCount），0.8.0 需重做（issue #1046）。","trap":"面試「PVM portion」極可能問 0.8.0 gas model；記住：block-level、預先扣、max(c−3,1)、不足則 OOG 且不扣。"},{"id":"appA-memory-access","ch":"A","section":"A.5 Single-Step State Transition","gpRef":"eq. A.9–A.10 (ε^μ)","difficulty":2,"kind":"concept","tags":["pvm","memory"],"stem":"What happens when an instruction accesses RAM at an address that is (a) below 2^16, or (b) in an inaccessible page above 2^16?","options":["(a) the machine panics immediately regardless of page accessibility; (b) the machine state is unchanged and the exit is a page fault F̄ × (Z_P·⌊addr/Z_P⌋), reporting the lowest inaccessible page address","(a) reads below 2^16 return zero and writes there are silently dropped; (b) the exit is a page fault F̄ × (Z_P·⌊addr/Z_P⌋) for reads only — a write to a page whose access mode is R rather than W panics instead of faulting","(a) the machine panics immediately regardless of page accessibility; (b) the exit is a page fault F̄ × addr carrying the exact octet address requested, and the octets of the access that did fall in accessible pages are written before the fault is raised","(a) the access becomes a page fault F̄ × 0 so that the host can tell null-pointer bugs from ordinary faults; (b) the machine panics, because a page whose access mode in μ_a is ∅ can never be made accessible again and so the exit must be final"],"answer":0,"optNotes":["低位址無條件 ☇、高位址回 eq. A.10 的 F̄ × Z_P⌊·/Z_P⌋，且狀態完全不變因此可續跑。","低於 2^16 一律 ☇ 而非靜默；寫入判定用 V*_μ（μ_a = W），寫 R 頁同樣是 F̄ 不是 ☇。","eq. A.10 在 ε^μ ≠ ▸ 時 (ı*, φ*, μ*) = (ı, φ, μ)，記憶體一個 byte 都不能先寫下去。","§A.5 明寫低於 2^16「always panics immediately」；不可存取頁反而是可續跑的 fault 而非終局 panic。"],"explanation":"§A.5：「When an index of RAM below 2^16 is required, the machine always panics immediately… regardless of the apparent (in)accessibility of the value. Otherwise, should the given index of RAM not be accessible then machine state remains unchanged and the exit reason is a fault with the lowest inaccessible page address」。eq. A.10：ε^μ = ☇ 當 min(x) mod 2^32 < 2^16；F̄ × Z_P·⌊min(x) mod 2^32 / Z_P⌋ 否則，x 是所有不可讀/不可寫的存取位址集合。第一個 64 KiB zone 永遠不可存取（標準初始化把 RO data 放在 Z_Z = 2^16 開始）——null-pointer 保護。你們 code-map 3.11：「page fault reports the lowest faulting address; any address in the first 64 KiB zone is a panic not a fault」。","trap":"位址先 mod 2^32（暫存器是 64-bit，記憶體是 32-bit 定址）。"},{"id":"appA-standard-init","ch":"A","section":"A.7 Standard Program Initialization","gpRef":"eq. A.42–A.47","difficulty":3,"kind":"concept","tags":["pvm","memory"],"stem":"Under standard program initialization Y(p, a), which register/memory layout is correct?","options":["φ_0 = 0, φ_1 = 2^32 − 1 (stack pointer at the very top of RAM), φ_7 = 2^32 − Z_Z − Z_I (argument pointer), φ_8 = |a|; RO data at address 0, RW data (heap) immediately after it with no gap, stack growing down from 2^32 − 1, args at 2^32 − Z_Z − Z_I; Z_I = 2^24","φ_0 = 2^32 − 2^16 (return address; jumping there halts), φ_1 = 2^32 − 2·Z_Z − Z_I (stack pointer), φ_7 = 2^32 − Z_Z − Z_I (argument pointer), φ_8 = |a|; RO data at Z_Z = 2^16, RW data (heap) at 2·Z_Z + Z(|o|), stack ends at 2^32 − 2·Z_Z − Z_I, args at 2^32 − Z_Z − Z_I; Z_I = 2^24","φ_0 = 2^32 − 2^16 (return address; jumping there halts), φ_1 = 2^32 − 2·Z_Z − Z_I (stack pointer), φ_7 = |a|, φ_8 = 2^32 − Z_Z − Z_I (argument pointer); RO data at Z_Z = 2^16, RW data (heap) at 2·Z_Z + Z(|o|), stack ends at 2^32 − 2·Z_Z − Z_I, args at 2^32 − Z_Z − Z_I; Z_I = 2^24","φ_0 = 2^32 − 2^16 (return address; jumping there halts), φ_1 = 2^32 − 2·Z_Z − Z_I (stack pointer), φ_7 = 2^32 − Z_Z − Z_I (argument pointer), φ_8 = |a|; RO data at Z_Z = 2^16 but mapped W so the program may patch it, RW data (heap) at 2·Z_Z + Z(|o|), stack ends at 2^32 − 2·Z_Z − Z_I, args at 2^32 − Z_Z − Z_I; Z_I = 2^16"],"answer":1,"optNotes":["第一個 Z_Z zone 永遠不配置（null-pointer 保護），且 φ_0 不是 halt sentinel 就回不了 entry function。","eq. A.46/A.47 全部對上：段間各留一個 Z_Z 空洞、φ_0 為 halt sentinel、Z_I = 2^24。","eq. A.47 是 φ_7 存參數指標、φ_8 存長度，對調會一併弄壞 Ψ_M 的回傳值 μ′[φ′_7 … +φ′_8]。","eq. A.46 的 o 段與參數段存取模式皆為 R，只有 w/heap 與 stack 是 W；Z_I = 2^24，2^16 是 Z_Z。"],"explanation":"eq. A.42：JAM program blob 格式 E_3(|o|) ⌢ E_3(|w|) ⌢ E_2(z) ⌢ E_3(s) ⌢ o ⌢ w ⌢ E_4(|p|) ⌢ p（o = RO data、w = RW data、z = 額外 heap 頁數、s = stack 大小）。eq. A.46：記憶體區段——[Z_Z, Z_Z+|o|) RO、[2Z_Z + Z(|o|), …) RR（w 之後 + z 頁）、stack 在 [2^32 − 2Z_Z − Z_I − P(s), 2^32 − 2Z_Z − Z_I) 可寫、args 在 [2^32 − Z_Z − Z_I, …) 唯讀；每段之間刻意留一個 Z_Z = 64 KiB 的未配置 zone，「one major zone is always left unallocated between sections in order to reduce accidental overrun」。eq. A.47：φ_0 = 2^32 − 2^16、φ_1 = 2^32 − 2Z_Z − Z_I、φ_7 = 2^32 − Z_Z − Z_I、φ_8 = |a|，其餘 0；Z_I = 2^24 是最大參數大小。","trap":"φ_0 是 RA：djump 到 2^32 − 2^16 = 0xFFFF0000 即 halt（eq. A.22 附近的 djump 定義）。"},{"id":"appA-djump-alignment","ch":"A","section":"A.5 (dynamic jumps)","gpRef":"eq. A.22 (jumptablealignment)","difficulty":2,"kind":"rationale","tags":["pvm","rationale"],"stem":"For a dynamic jump to address a, the GP requires a mod Z_A = 0 with Z_A = 2, a ≠ 0, a ≤ |j|·Z_A and j[a/Z_A − 1] ∈ ϖ (a basic-block start). Why the alignment requirement?","options":["Because RISC-V hardware traps on an unaligned instruction fetch and the PVM must stay directly executable on RISC-V hosts; the same rule is why sjump also rejects any static jump target b with b mod Z_A ≠ 0 before checking b ∈ ϖ","Because odd dynamic addresses are reserved as sentinels: a = 1 means halt and every other odd value encodes a host-call identifier, so demanding a mod Z_A = 0 keeps genuine code targets disjoint from those encodings","Because every jump-table entry occupies exactly Z_A = 2 octets: the factor of two is simply the entry width, so scaling by Z_A converts a table position into an octet offset inside j, and wider entries would need a larger alignment factor","Because LLVM 'requires and assumes in its code generation that dynamically computed jump destinations always have a certain memory alignment', and JAM's tooling depends on LLVM, so the GP acquiesces to that assumption"],"answer":3,"optNotes":["PVM 從不由 RISC-V 硬體直接執行，且 eq. A.20 的 sjump 只有 b ∉ ϖ 這一個 panic 條件。","halt sentinel 是偶數的 2^32 − 2^16，host-call id 來自 ecalli 的 ν_X 而非 djump 的位址空間。","把 Z_A 與 entry 寬度 z 搞混——z 由 blob 的 E_1(z) 決定，a/Z_A − 1 取的是 j 的元素索引。","eq. A.22 的 footnote 直說是遷就 LLVM 對動態計算跳躍目標的對齊假設，純屬工具鏈妥協。"],"explanation":"eq. A.22 的 footnote：「The popular code generation backend LLVM requires and assumes in its code generation that dynamically computed jump destinations always have a certain memory alignment. Since at present we depend on this for our tooling, we must acquiesce to its assumptions.」djump(a)：a = 2^32 − 2^16 → halt；a = 0 ∨ a > |j|·Z_A ∨ a mod Z_A ≠ 0 ∨ j[a/Z_A − 1] ∉ ϖ → panic；否則 PC = j[a/Z_A − 1]。靜態 jump 與 branch 的目標（含 not-taken 的下一條）也都必須是 basic block 起點，否則 panic（§A.5）。","trap":"jump table index 是 a/Z_A − 1（從 1 開始算），因為 a = 0 保留為無效。"},{"id":"appA-host-call-continue","ch":"A","section":"A.6 Host Call Definition","gpRef":"§A.6 (Ψ_H)","difficulty":2,"kind":"concept","tags":["pvm","host-calls"],"stem":"In Ψ_H, when the inner Ψ exits with h̄ × h (a host call via `ecalli`), what happens next?","options":["Ψ_H halts the inner machine and passes h̄ × h up to its own caller together with the register file; that caller performs the host call, rebuilds the machine and re-enters Ψ at ı′ + 1 + skip(ı′) with fresh gas — which is why h̄ stays in Ψ_H’s exit-reason set","The context mutator f(h, ϱ, φ, μ, x) runs; on ▸ Ψ_H resumes at ı′ + 1 + skip(ı′), but the gas-charged flag is first reset to ⊥, so the block holding the ecalli is charged ϱ^Δ a second time; a ☇/∎/∞ returned by f becomes the final exit","The context mutator f(h, ϱ, φ, μ, x) runs; if it returns ▸ (continue), Ψ_H resumes with the instruction counter advanced to ı′ + 1 + skip(ı′), the new gas/registers/memory/context; if it returns ☇/∎/∞ that becomes the final exit; a page fault cannot come out of a host call itself","The context mutator f(h, ϱ, φ, μ, x) runs; if it returns ▸ (continue), Ψ_H resumes at the unchanged counter ı′ so that the ecalli re-executes and the host call is idempotent; if it returns ☇/∎/∞ that becomes the final exit; f may also return F̄ and hand a page fault back"],"answer":2,"optNotes":["違反 Ψ_H 的 codomain {☇, ∞, ∎} ∪ {F̄} × N_R——host call 是在內部用 state-mutator 處理掉的。","eq. A.11 的 flag 只在 terminator 執行完或 OOG 時變 ⊥，ecalli 不在 T 裡，不會重扣整個 block。","§A.6 要求明確給出 ı″ = ı′ + 1 + skip(ı′)，且 f 的型別 Ω_X 裡沒有 fault。","PC 停在原地會讓 ecalli 無限重跑；f 的 codomain {▸, ∎, ☇, ∞} 也不含 F̄。"],"explanation":"§A.6：Ψ_H* 先跑 Ψ；若 ε′ ∈ {∎, ☇, ∞} ∪ F̄ 直接回傳；若 ε′ = h̄ × h 則呼叫 f（Ω 函數，依 invocation 類型決定），得到 (▸, ϱ″, φ″, μ″, x″) 就以 ı″ = ı′ + 1 + skip(ı′) 續跑；得到 ☇/∎/∞ 則結束。「we must provide the new instruction counter value ı″ explicitly」——因為 Ψ 回傳的 PC 指向造成 exit 的那條指令（ecalli 本身）。GP 也明說「host-calls are in effect handled internally with the state-mutator function provided as an argument, preventing the possibility of the result being a host-call fault」。gas charged flag 保留（續跑同一 basic block 不重複收費）。未知 host call id：扣 M_∅ = 1000 gas 並在 φ_7 放 WHAT（eq. B.2/B.6/B.10 的 otherwise 分支）。","trap":"你們 interpreter 的 hostCallException 就是「charge gas → φ_7 = WHAT」。"},{"id":"appA-registers-immediates","ch":"A","section":"A.5.1 Instruction Tables","gpRef":"§A.5.1 & eq. A.19 (sign extension)","difficulty":2,"kind":"concept","tags":["pvm","decoding"],"stem":"How are register operands and immediates decoded from an instruction's octets?","options":["Register indices are 3-bit fields packed into the opcode octet itself, leaving 32 opcodes per format class; immediates are little-endian, take their width from the skip distance and are sign-extended to 64 bits, but because only 8 encodings fit, φ_8 … φ_12 are reachable only through move_reg","For the two-register instruction forms the register indices come from the low and high nibbles of the octet after the opcode, each clamped with min(12, …); immediates are little-endian and, where the encoding allows a variable-width immediate, its width is derived from the instruction's skip distance and the value is sign-extended to 64 bits","For the two-register instruction forms the register indices come from the low and high nibbles of the octet after the opcode, each clamped with min(12, …); immediates are big-endian, their width is fixed at 4 octets in every form that takes one, and they are zero-extended to 64 bits, so a negative constant needs a separate negate instruction","The register indices are whole octets — ζ_{ı+1} for the first and ζ_{ı+2} for the second, each clamped with min(12, …), so every two-register instruction is at least 3 octets long; immediates are little-endian and sign-extended to 64 bits, but their width is fixed at 8 octets in every form that takes one"],"answer":1,"optNotes":["3 bits 只能表示 8 個暫存器，但 §4.7 有 13 個；opcode octet 從頭到尾都是 opcode，沒有分租。","兩暫存器類的兩個索引擠在 ζ_{ı+1} 的高低 nibble，ℓ_X 由 skip 導出並依 eq. A.19 sign-extend。","§A.5 明說 immediate 是 little-endian、MSB 為符號位，省略高位補 0 或 255，補零會把 −1 變成 0xFF。","只有三暫存器類才用 ζ_{ı+2} 放 r_D；固定 8-octet immediate 也只有 load_imm_64 一條。"],"explanation":"指令表（§A.5.5 起）逐類給出解碼規則。以「Two Registers & One Immediate」為例：r_A = min(12, ζ_{ı+1} mod 16)、r_B = min(12, ⌊ζ_{ı+1}/16⌋)、ℓ_X = min(4, max(0, skip(ı) − 1))、ν_X 由 eq. A.19 的 sign extension 得出。clamp 到 12 是因為只有 13 個暫存器（0..12）。§A.5：「Immediate arguments are encoded in little-endian format with the most-significant bit being the sign bit… Elided octets are assumed to be zero if the MSB of the value is zero, and 255 otherwise」——省略高位正是為了壓縮負值。要小心：**不是每一類都這樣**——三暫存器形式的 r_D 佔一整個 octet（min(12, ζ_{ı+2})），單一 immediate 形式沒有暫存器 nibble，load_imm_64 帶固定 8-byte immediate 且不做 sign extension。你們 code-map 3.11 對應同一套解碼。","trap":"immediate 長度由 skip 決定——編碼器可省略高位零/全 1 位元組。"},{"id":"appB-result-constants","ch":"B","section":"B.1 Host-Call Result Constants","gpRef":"§B.1","difficulty":1,"kind":"concept","tags":["host-calls"],"stem":"Which mapping of host-call result constants is correct?","options":["OK = 0; NONE = 1 (item does not exist); WHAT = 2 (name unknown); OOB = 3; WHO = 4 (index unknown); FULL = 5; CORE = 6; CASH = 7 (insufficient funds); LOW = 8 (gas limit too low); HUH = 9 (invalid operation / insufficient privilege); the inner-PVM results HALT…OOG continue the same run at 10…14","OK = 0; NONE = 2^64−1 (item does not exist); WHAT = 2^64−2 (name unknown); OOB = 2^64−3 (index unknown); WHO = 2^64−4 (inner-PVM memory index not accessible); FULL = 2^64−5 (core index unknown); CORE = 2^64−6 (storage full or resource already allocated); CASH = 2^64−7; LOW = 2^64−8; HUH = 2^64−9","OK = 0; NONE = 2^64−1 (item does not exist); WHAT = 2^64−2 (name unknown); OOB = 2^64−3; WHO = 2^64−4 (index unknown); FULL = 2^64−5; CORE = 2^64−6; CASH = 2^64−7 (insufficient funds); LOW = 2^64−8 (gas limit too low); HUH = 2^64−9 (invalid operation / insufficient privilege)","OK = 0; NONE = 2^32−1 (item does not exist); WHAT = 2^32−2 (name unknown); OOB = 2^32−3; WHO = 2^32−4 (index unknown); FULL = 2^32−5; CORE = 2^32−6; LOW = 2^32−7 (gas limit too low); CASH = 2^32−8 (insufficient funds); HUH = 2^32−9 (invalid operation / insufficient privilege)"],"answer":2,"optNotes":["錯誤碼落在 0…9 就無法與 read/new/machine 那些正常的小整數回傳值區分。","數值對但語意平移：OOB 是 inner PVM 記憶體不可存取，WHO 才是 index unknown。","十個常數與 §B.1 逐字對上：2^64−k 的數值與 CASH/LOW/FULL/CORE 的語意都正確。","錯誤常數定義在 2^64 附近（2^32−1 是合法長度/索引），且 CASH 排在 LOW 之前。"],"explanation":"§B.1 逐字：NONE = 2^64−1、WHAT = 2^64−2、OOB = 2^64−3（inner PVM 記憶體索引不可存取）、WHO = 2^64−4（index unknown）、FULL = 2^64−5（storage full / resource already allocated）、CORE = 2^64−6（core index unknown）、CASH = 2^64−7（insufficient funds）、LOW = 2^64−8（gas limit too low）、HUH = 2^64−9、OK = 0。錯誤碼刻意擺在 2^64 頂端，因為 host call 的正常回傳值本身就是小整數（read/lookup/fetch 回傳長度、new 回傳新 service index、machine 回傳機器編號、query 回傳 1 + 2^32·x），必須能與之區分。inner PVM 的結果碼則是獨立的一組 HALT = 0、PANIC = 1、FAULT = 2、HOST = 3、OOG = 4。另註：「Note return codes for a host-call-request exit are any non-zero value less than 2^64 − 13」。","trap":"常考 WHO vs HUH：WHO = 找不到 service/index；HUH = 操作本身不合法（已 solicit、無法 forget、權限不足）。"},{"id":"appB-three-invocations","ch":"B","section":"B.2–B.4 Invocations","gpRef":"eq. B.1–B.2, B.5–B.6, B.9–B.11","difficulty":2,"kind":"concept","tags":["host-calls","pvm"],"stem":"The PVM has three invocation types. Which statement about their host-call sets is correct in GP 0.8.0?","options":["Ψ_I (is-authorized, stateless): gas, grow_heap, fetch only; Ψ_R (refine): gas, grow_heap, fetch, historical_lookup, export, machine, peek, poke, pages, invoke, expunge; Ψ_A (accumulate): gas, grow_heap, fetch, lookup, read, write, info, bless, assign, designate, checkpoint, new, upgrade, transfer, eject, query, solicit, forget, yield, provide; any other id costs M_∅ = 1000 gas and returns WHAT","Ψ_I (is-authorized, stateless): gas, grow_heap, fetch only; Ψ_R (refine): gas, grow_heap, fetch, lookup, read, write, info, export, machine, peek, poke, pages, invoke, expunge; Ψ_A (accumulate): gas, grow_heap, fetch, historical_lookup, bless, assign, designate, checkpoint, new, upgrade, transfer, eject, query, solicit, forget, yield, provide; any other id costs M_∅ = 1000 gas and returns WHAT","Ψ_I (is-authorized): gas, grow_heap, fetch, historical_lookup; Ψ_R (refine): gas, grow_heap, fetch, historical_lookup, lookup, read, invoke, expunge; Ψ_A (accumulate): gas, grow_heap, fetch, write, info, export, machine, peek, poke, pages, bless, assign, designate, checkpoint, new, upgrade, transfer, eject, query, solicit, forget, yield, provide; any other id costs M_∅ = 1000 gas and returns WHAT","Ψ_I (is-authorized, stateless): gas, fetch only; Ψ_R (refine): gas, grow_heap, fetch, historical_lookup, export, machine, peek, poke, pages, invoke, expunge; Ψ_A (accumulate): gas, fetch, lookup, read, write, info, bless, assign, designate, checkpoint, new, upgrade, transfer, eject, query, solicit, forget, yield, provide; grow_heap is refine-only since only in-core execution may resize RAM, and any other id panics (☇) with no gas charged"],"answer":0,"optNotes":["三張表分別對上 eq. B.2/B.6/B.11，未知 id 走 F 的 default：扣 M_∅ 後填 WHAT 續跑。","正好顛倒——in-core 沒有共識狀態，refine 只能做依 lookup-anchor 時間的 historical_lookup。","inner PVM 與 D3L export 只在 eq. B.6；eq. B.2 的 is-authorized 是 stateless，連 accounts 都拿不到。","grow_heap 三張表都有（0.8.0 用它取代 sbrk 指令），且未知 id 絕不是 ☇。"],"explanation":"eq. B.2（is-authorized mutator F）：gas、grow_heap、fetch；eq. B.6（refine）：+ historical_lookup、export、machine、peek、poke、pages、invoke、expunge（inner PVM 與 D3L export）；eq. B.11（accumulate）：+ lookup/read/write/info（透過 G 包裝，讓對自身帳戶的變更同步進 context）、bless、assign、designate、checkpoint、new、upgrade、transfer、eject、query、solicit、forget、yield、provide。分界的原理：in-core 的 refine 沒有共識狀態，只能做依 lookup-anchor 時間的 historical_lookup；accumulate 在鏈上，讀寫的是當下 partial state；is-authorized 則是 stateless，context 恆為 ∅。0.8.0（GP PR #508）把 sbrk 指令換成 grow_heap host call（index 1）並列進三張表。未知 id 走 F 的 default——扣 M_∅ = 1000 後 φ′_7 = WHAT 繼續執行，只有扣到 ϱ′ < 0 才 ∞。","trap":"read/write/lookup/info 在 accumulate 才有；refine 用 historical_lookup（依 lookup-anchor 時間）。"},{"id":"appB-accumulate-invocation","ch":"B","section":"B.4 Accumulate Invocation","gpRef":"eq. B.7–B.14","difficulty":3,"kind":"concept","tags":["host-calls","accumulate"],"stem":"Which statement about the accumulate invocation Ψ_A(e, t, s, g, i) is correct?","options":["If the service's code is unavailable or > W_C it halts with the work error BAD or BIG exactly as Ψ_I and Ψ_R do; otherwise the guarantors run it in-core as Ψ_M(code, entry 5, g, E(c, i, s, payload, H(p)), F, I(s, s)^2) and the block author merely records the resulting hash; a regular context x and an exceptional context y are kept (only `checkpoint` copies x into y) and on ☇ or ∞ the result collapses to y","If the service's code is unavailable or > W_C it returns the state with incoming transfer amounts already credited and no other effect; otherwise it runs Ψ_M(code, entry 1, g, E(t, s, |i|) ⌢ E(i), F, I(s, s)^2) with a regular context x and an exceptional context y (only `checkpoint` copies x into y); on ☇ or ∞ the result collapses to x, so everything done before the fault is kept; a 32-octet return blob becomes the yield hash","If the service's code is unavailable or > W_C it returns the state with incoming transfer amounts already credited and no other effect; otherwise it runs Ψ_M(code, entry 0, g, E(t, s, |i|), F, I(s, s)^2) with a regular context x and an exceptional context y (only `checkpoint` copies x into y); on ☇ or ∞ the result collapses to y; the deferred transfers among i are instead delivered by a separate Ψ_T on-transfer invocation","If the service's code is unavailable or > W_C it returns the state with incoming transfer amounts already credited and no other effect; otherwise it runs Ψ_M(code, entry 5, g, E(t, s, |i|), F, I(s, s)^2) with a regular context x and an exceptional context y (only `checkpoint` copies x into y); on ☇ or ∞ the result collapses to y; a 32-octet return blob becomes the yield hash; inputs are read via `fetch`"],"answer":3,"optNotes":["BAD/BIG 是 Ψ_I/Ψ_R 的 workerror，E(c, i, s, payload, H(p)) 也是 refine 的參數。","GP 明寫 entry point 5 且參數不接 E(i)；例外時若取 x，checkpoint 就完全沒有意義。","entry point 應為 5，且 0.8.0 只有三種 invocation，deferred transfer 直接混在 i 裡當 input。","entry point 是 5、參數只有 12 octets 的 E(t, s, |i|)，例外時 collapse 取 checkpoint 過的 y。"],"explanation":"eq. B.9：Ψ_A(e, t, s, g, i)：若 code = ∅ 或 |code| > W_C → (s（餘額已加上 Σ transfer 金額）, [], ∅, 0, [])；否則 C(Ψ_M(code, 5, g, E(t, s, |i|), F, I(s, s)^2))——entry point 是 **5**（refine 與 is-authorized 是 0），參數只有 (timeslot, service id, input 數) 共 12 octets，正是為了「avoid introducing unbounded data as part of the basic invocation arguments」（否則 RAM 配置無界、gas 會被灌水），實際 inputs 用 fetch(14/15) 讀。eq. B.7：context **x** = (s id, u state, i nextfreeid, t transfers, y yield, p provisions)；例外維度是 **y**；eq. B.10：I(s, s) 初始化 nextfreeid = check(decode_4(H(E(s, η′_0, H_T))) mod (2^32 − S − 2^8) + S)。collapse C（B.13）：o ∈ {∞, ☇} → 用 **y**（checkpoint 過的狀態）；o ∈ H（32 bytes）→ yield = o；其他 → X 原樣。你們 code-map 3.8.7：「accumulate entry point is PC 5；on PANIC/OOG the checkpointed context y is committed；a 32-byte return blob becomes the accumulation output hash」。","trap":"transfer 的金額在執行**前**就加到餘額（s = e except balance += Σ x_a）。"},{"id":"appB-new-service-index","ch":"B","section":"B.4 Accumulate Invocation","gpRef":"eq. B.10, B.14 & `new` (§B.7)","difficulty":3,"kind":"concept","tags":["host-calls","accounts"],"stem":"How are new service indices chosen by the `new` host call in GP 0.8.0?","options":["The context's next-free id starts at check(decode_4(H(E(s, η_0, H_T))) mod (2^32 − S − 2^8) + S) with S = 2^8; check() linearly probes (+1 wrapping inside [S, 2^32 − 2^8)) until an index not in keys(δ); after each `new` the next candidate is check(S + (i − S + 42) mod (2^32 − S − 2^8)); only the registrar may instead request a specific index < S, which returns FULL if that index already exists","The context's next-free id starts at check(decode_4(H(E(s, η′_0, H_T))) mod (2^32 − S − 2^8) + S) with S = 2^16; check() linearly probes (+1 wrapping inside [S, 2^32 − 2^8)) until an index not in keys(δ); after each `new` the next candidate is check(S + (i − S + 42) mod (2^32 − S − 2^8)); only the registrar may instead request a specific index < S, which returns FULL if that index already exists","The context's next-free id starts at check(decode_4(H(E(s, η′_0, H_T))) mod (2^32 − S − 2^8) + S) with S = 2^16; check() linearly probes (+1 wrapping inside [S, 2^32 − 2^8)) until an index not in keys(δ); after each `new` the next candidate is simply check(i + 1); only the registrar may instead request a specific index < S, which returns WHO if that index already exists","The context's next-free id starts at S itself with S = 2^16, so the sequence is fixed by the block author rather than by entropy; check() linearly probes (+1 wrapping inside [S, 2^32 − 2^8)) until an index not in keys(δ); after each `new` the next candidate is check(i + 1); only the registrar may instead request a specific index < S, which returns FULL if that index already exists"],"answer":1,"optNotes":["GP 用的是本區塊的 posterior η′_0，且 S = 2^16；2^8 是保留在 2^32 頂端的另外 256 個索引。","種子綁 posterior η′_0、每次配置跳 42 讓序列不可預測，撞號回 FULL（resource already allocated）。","跳 42 是刻意讓連續配置不相鄰；撞號的語意是 FULL，WHO 指的是 index unknown。","序列若從 S 固定推進就可預測，service 便能預先卡位，正是 §B.4 要防的事。"],"explanation":"eq. B.10：i_nextfree = check((decode_4(H(E(s, η′_0, H_T))) mod (2^32 − S − 2^8)) + S)；eq. B.14：check(i) = i 若 i ∉ keys(δ)，否則 check((i − S + 1) mod (2^32 − 2^8 − S) + S)。`new`（index 19）：registrar 且 desired id < S → 直接用該 id（若已存在 → FULL）；否則用 nextfreeid 並把 nextfreeid 更新為 check(S + (i − S + 42) mod (2^32 − S − 2^8))。§B.4 的設計目的：「no service can predict the identifier sequence ahead of time, they cannot intentionally disadvantage the block author」——正因為種子綁 η′_0，service 無法預先卡位。另外（本題選項未涵蓋，但同屬 Ω_N）：f ≠ 0 且非 manager → HUH；扣掉新帳戶的 a_t 後餘額低於自身 threshold → CASH。新帳戶：storage 空、requests = {(c, l) → []}、balance = 其 threshold、created = t、lastacc = 0、parent = 建立者。","trap":"S = 2^16 = 65536 是 public index 下限；2^32 − 2^8 上限保留最後 256 個。"},{"id":"appB-transfer-rules","ch":"B","section":"B.7 Accumulate Functions — transfer","gpRef":"`transfer` = 21","difficulty":2,"kind":"concept","tags":["host-calls","transfers"],"stem":"The `transfer` host call (φ_7 = d, φ_8 = a, φ_9 = l gas, φ_10 = o memo ptr) can fail in several ways. Which order/meaning is correct?","options":["Memo unreadable → panic; d ∉ keys(δ) → WHO; l < δ[d]_m (recipient's minmemogas) → LOW; balance − a < own threshold a_t → CASH; otherwise OK: a is moved into δ[d]'s balance inside this host call and the recipient is entered at once with the 128-octet memo, gas g = M_T + l being charged","Memo unreadable → HUH; d ∉ keys(δ) → WHO; l < the sender's own minmemogas a_m → LOW; balance − a < 0 → CASH; otherwise OK: the transfer is appended to the context's transfer list, the sender's balance is reduced by a, and gas g = M_T alone is charged","Memo unreadable → panic; d ∉ keys(δ) → WHO; l < δ[d]_m (recipient's minmemogas) → LOW; balance − a < own threshold a_t → CASH; otherwise OK: the transfer is appended to the context's transfer list, the sender's balance is reduced by a, and gas g = M_T + l is charged","Memo unreadable → panic; d ∉ keys(δ) → WHO; l < δ[d]_m (recipient's minmemogas) → CASH; balance − a < own threshold a_t → LOW; otherwise OK: the transfer is appended to the context's transfer list, the sender's balance is reduced by a, and gas g = M_T + l is charged"],"answer":2,"optNotes":["transfer 是 deferred 的：只附加到 x_t，接收方下一輪才被當成 accumulate input 叫起來。","記憶體不可讀在 Ω_T 一律是 ☇；比的是接收方的 d[d]_m，門檻是自身 a_t 而不是 0。","四個檢查依序是 panic/WHO/LOW/CASH，且 g = M_T + l 把預付給接收方的 gas 一起收。","語義反了：LOW 對應的是 l 不足（gas limit too low），CASH 對應餘額跌破 threshold。"],"explanation":"Ω_T（index 21，g = M_T + t，成功時 t = l、失敗時 t = 0，M_T = 575）：t = error（memo 範圍 μ[o..+W_T]、W_T = 128 不可讀）→ panic；d ∉ keys(d) → WHO；l < d[d]_m → LOW；b = balance − a < 自身 a_t → CASH；否則 OK，x′_t = x_t ⌢ t，balance = b。門檻用的是自身 a_t（eq. 9.8）而不是 0——否則帳戶可以把餘額花到低於 deposit 而讓 storage 失去擔保。transfer 屬於 deferred transfer：只是把 ⟨source, dest, amount, memo, gas⟩ 附加到 x_t，由 Δ+ 在**下一輪**把它當成接收方的 accumulate input 送達（接收方屆時不存在就丟棄），這也是 transfer 得先付 l gas 的原因。","trap":"LOW 對照的是**接收方**的 a_m，不是發送方。"},{"id":"appB-solicit-forget","ch":"B","section":"B.7 — solicit / forget / eject","gpRef":"`solicit` = 24, `forget` = 25, `eject` = 22","difficulty":3,"kind":"concept","tags":["host-calls","preimages"],"stem":"Given request status l = a_l[(h, z)] and current slot t, which transitions do `solicit` and `forget` perform?","options":["solicit: no entry → [] (CASH if the new footprint is unaffordable); [x, y] → [x, y, t]; anything else → HUH. forget: [] or [x, y] with y < t − D → delete request and preimage; [x] → [] (unavailable at once); [x, y, w] with y < t − D → [w, t]; anything else → HUH","solicit and forget are refine host calls managing D3L segments: solicit reserves the next export index (FULL once W_X is spent), forget releases one, both HUH on a bad index; the request lattice [] → [x] → [x, y] → [x, y, w] is driven purely by the preimages extrinsic E_P","solicit: no entry → [t]; [x, y] → [x, y, t]; anything else → HUH. forget: [] or [x, y] with y < t − D → delete request and preimage; [x] → [x, t]; [x, y, w] with w < t − D → [w, t]; anything else → HUH. Either call returns FULL when the account cannot afford its new threshold","solicit: no entry → [] (FULL if the new footprint is unaffordable); [x, y] → [x, y, t]; anything else → HUH. forget: [] or [x, y] with y < t − D → delete request and preimage; [x] → [x, t]; [x, y, w] with y < t − D → [w, t]; anything else → HUH"],"answer":3,"optNotes":["付不起 footprint 在 GP 裡是 FULL 而非 CASH；[x] → [x, t] 保留了 historical lookup 所需的可用區間。","eq. B.6 的 refine 表裡沒有 solicit/forget，D3L segment 是 export（index 8）在管。","新 request 一定是空序列 []；三元素的過期判定看中間的 y，而且 forget 從不回 FULL。","兩者正是 preimage lattice 的兩個方向：過期判定看的是 y，付不起新 footprint 回 FULL。"],"explanation":"Ω_S（solicit, 24）：(h,z) 不存在 → 新增 [] 並付 footprint（a_balance < a_minbalance → FULL）；[x,y] → append t（重新請求）；其他 → HUH。Ω_F（forget, 25）：[] 或 [x,y] 且 y < t − D → 刪 request 與 preimage；[x] → [x, t]（標記 unavailable，preimage 仍留著）；[x,y,w] 且 y < t − D → [w, t]；其他 → HUH。三元素 [x,y,w] 的過期判定看的是**中間**的 y（上一次停止可用的時刻），w 是最近一次重新請求的時刻，必然比較新。preimage 的請求狀態機由 solicit/forget 在 accumulate 中驅動，E_P extrinsic 只負責把 [] 推進到 [x]。D = C_expungeperiod = 19,200（= L + 4,800，§B.3 說明：審計最晚可在 accumulate 後兩個 epoch 發生，lookup anchor 最多 L 舊，再留 8 小時安全邊際）。`eject`（22）讓一個 codehash = E_32(caller id) 且只剩單一 request（items = 2）的 service 被銷毀並把餘額轉給呼叫者，條件同樣是 [x,y] 且 y < t − D。","trap":"刪除必須等 D 個 slot（32h）——確保 refine 的 historical lookup 仍可判定。"},{"id":"appB-bless-assign-designate","ch":"B","section":"B.7 — bless / assign / designate","gpRef":"`bless` = 15, `assign` = 16, `designate` = 17","difficulty":2,"kind":"delta","tags":["host-calls","privileges","delta-0.8.0"],"stem":"Which privilege checks do bless, assign and designate perform in GP 0.8.0?","options":["bless: caller must be the current manager χ_M (else HUH), sets (m, a[C], v, r, z); assign(c, o, a): c ≥ C → HUH, caller must be χ_A[c] (else CORE), writes the 32-entry queue φ[c] and a new assigner a; designate(o, z): z must be a valid validator count and caller must be χ_V (else HUH), sets ι to z 32-octet Ed25519 keys","bless: caller must be the current manager χ_M (else HUH), sets (m, a[C], v, r, z); assign(c, o, a): c ≥ C → CORE, caller must be χ_A[c] (else HUH), writes the 80-entry queue φ[c] and a new assigner a; designate(o, z): z must be a valid validator count and caller must be χ_V (else HUH), sets ι to z 336-octet keys","bless: caller must be the current registrar χ_R (else HUH), sets (m, a[C], v, r, z); assign(c, o, a): c ≥ C → CORE, caller must be χ_A[c] (else HUH), writes the 80-entry queue φ[c] and a new assigner a; designate(o, z): z must be a valid validator count and caller must be χ_M (else HUH), sets ι to z 336-octet keys","All three are gated on the manager alone: each returns HUH unless the caller is χ_M. bless additionally returns WHO when m, v or r is not a service index, assign additionally returns CORE for c ≥ C and writes the 80-entry queue φ[c], and designate additionally requires z ∈ N_V; χ_A[c] and χ_V are read-only and only bless can change them"],"answer":1,"optNotes":["CORE = core index unknown 專對應 c ≥ C，權限不符一律 HUH；Q = 80、每把 key 336 octets。","三者分屬 χ_M、χ_A[c]、χ_V 三把獨立權限，且 assign 成功時會把 χ_A[c] 改寫成參數 a。","張冠李戴：χ_R 只在 new 裡決定誰能指定 < S 的低位索引，designate 由 delegator χ_V 專屬。","漏掉 owned privilege：assign 會寫入新的 χ_A[c]，core 指派權可以轉手而不必回頭找 manager。"],"explanation":"Ω_B（bless, 15）：讀 m, a（4C 個 u32 assigners）, v, r, o/n（z 的 (u32, u64) pairs）；x_s ≠ χ_M → HUH（0.8.0 #519 新增：只有 manager 能 bless）；m/v/r 不是有效 service id → WHO。Ω_A（assign, 16）：c ≥ C → CORE；x_s ≠ χ_A[c] → HUH；a 無效 → WHO；否則 φ[c] = Q = 80 個 32-octet hash，χ_A[c] = a（owned privilege：assigner 可把權限轉給別人）。Ω_D（designate, 17）：z ∉ N_V（不是 6..1023 的 3 倍數）或 x_s ≠ χ_V → HUH；否則 ι = 讀入的 z 個 336-octet key（32 Bandersnatch + 32 Ed25519 + 144 BLS + 128 metadata）。三把權限刻意分開：manager 管全域、每個 core 各有自己的 assigner、validator key 由 delegator 專管。這三者的變更經 Δ* 的 R() 合併規則整合。","trap":"0.8.0 designate 也要驗 z 是合法 validator 數（#514）。"},{"id":"appB-checkpoint-yield","ch":"B","section":"B.7 — checkpoint / yield / provide","gpRef":"`checkpoint` = 18, `yield` = 26, `provide` = 27","difficulty":2,"kind":"concept","tags":["host-calls","accumulate"],"stem":"What do `checkpoint`, `yield` and `provide` do inside accumulate?","options":["checkpoint: copies the exceptional context y into the regular context x (so a later panic/OOG rewinds to the start of the accumulation) and returns the gas already used in φ_7; yield(o): records the 32-octet hash at o as the service's accumulation output (θ entry / BEEFY-visible commitment); provide(s, o, z): supplies preimage bytes for a request [] of service s (or the caller if φ_7 = 2^64−1), returning WHO/HUH on errors, integrated after the round","checkpoint: copies the regular context x into the exceptional context y (so a later panic/OOG commits the checkpointed state) and returns remaining gas in φ_7; yield(o): halts the invocation there and then, committing x and forfeiting the unspent gas, with the 32 octets at o as the output; provide(s, o, z): writes the preimage straight into δ[s]_p and moves a_l[(H(i), z)] to [t] inside this same host call","All three belong to the refine invocation: checkpoint snapshots the inner-PVM map m so that a later panic can restore it and returns remaining gas in φ_7; yield(o) appends the 32 octets at o to the export sequence e; provide(s, o, z) hands preimage bytes to the guarantor's local cache, returning WHO/HUH on errors; accumulate reaches the same effects through write, export and transfer instead","checkpoint: copies the regular context x into the exceptional context y (so a later panic/OOG commits the checkpointed state) and returns remaining gas in φ_7; yield(o): records the 32-octet hash at o as the service's accumulation output (θ entry / BEEFY-visible commitment); provide(s, o, z): supplies preimage bytes for a request [] of service s (or the caller if φ_7 = 2^64−1), returning WHO/HUH on errors, integrated after the round"],"answer":3,"optNotes":["方向相反：存檔是把當下的 x 複製進 y，反過來會把先前的進度倒回去，回傳的也是剩餘 gas。","Ω_Taurus 只設 x_y 一個欄位（停機得靠 halt 指令），provide 也只加進 x_provisions 等 Δ* 整合。","eq. B.11 才有這三個；refine 的 export 附加的是 4,104 octet segment，不是 32-octet hash。","checkpoint 是唯一會改 y 的 host call，因此 ☇/∞ 時 collapse 才能 commit 到存檔點。"],"explanation":"Ω_C（checkpoint, 18）：y′ ≡ x，φ′_7 = ϱ′（扣完 M_C = 103 後的**剩餘** gas）——這是唯一改變 y 的 host call；因為 collapse C 在 ☇/∞ 時使用 y，service 可以「存檔」部分進度。Ω_Taurus（yield, 26）：x_y = 記憶體 o 處的 32 bytes，回 OK 後**繼續執行**；若程式正常 halt 且回傳 32 bytes 也會成為 yield（B.13）。Ω_Aries（provide, 27）：s = φ_7（2^64−1 表示自己），i = μ[φ_8..+φ_9]，s 不存在 → WHO，request 狀態不是 [] 或已提供過 → HUH，否則加入 x_provisions，由 Δ* 的 I() 在該輪後整合（0.6.5 引入 provide）——host call 期間不可能直接改別的 service 的 preimage 表。","trap":"yield 的 hash 進 θ′ → β′_B belt → BEEFY；這是 service 對外（bridge）承諾狀態的管道。"},{"id":"appC-discriminators","ch":"C","section":"C.1 Discriminator / Sequence / Dictionary encoding","gpRef":"§C.1.3–C.1.5","difficulty":2,"kind":"concept","tags":["codec"],"stem":"Which statement about JAM's codec conventions is correct?","options":["Fixed-length items (hashes, fixed sequences) encode as-is; variable-length items ↕x are prefixed by E_4(|x|) so every length prefix is the same width; an optional value x? encodes as [0] if ∅ else [1] ⌢ E(x); dictionaries encode as their (key, value) pairs ordered by key; and bit sequences pack bits into octets most-significant-first","Fixed-length items (hashes, fixed sequences) encode as-is; variable-length items ↕x are prefixed by E(|x|); an optional value x? encodes as [0] if ∅ else [1] ⌢ E(x); dictionaries encode as their (key, value) pairs ordered by key; and bit sequences pack bits into octets least-significant-first","Fixed-length items (hashes, fixed sequences) are prefixed by E(|x|) too, so a decoder never needs type information; variable-length items ↕x are prefixed the same way; an optional value x? encodes as [0] if ∅ else [1] ⌢ E(x); dictionaries encode as their (key, value) pairs ordered by key; and bit sequences pack bits into octets least-significant-first","Fixed-length items (hashes, fixed sequences) encode as-is; variable-length items ↕x are prefixed by E(|x|); an optional value x? encodes as [0xFF] if ∅ else the value alone; dictionaries encode as their (key, value) pairs in insertion order; and bit sequences pack bits into octets least-significant-first"],"answer":1,"optNotes":["長度 discriminator 用的是可變長的 compact E，且 §C.1.4 明寫 bit 打包由最低位到最高位。","四點都對上 §C.1：固定長度免前綴、x? = 0 或 (1, x)、dictionary 依 key 排序、bit 打包 LSB-first。","§C.1.3 的但書：長度 discriminator「is omitted in the case of fixed-length terms such as hashes」。","x? 的定義是 0 或 (1, x)；dictionary 明訂依 key 排序，否則同一 state 會有多種合法編碼。"],"explanation":"§C.1：E(∅) = []、blob 編碼為自身、tuple 為各元素串接；↕x ≡ (|x|, x) 即長度前綴；x? = 0 當 ∅ 否則 (1, x)；dictionary 依 key 排序後編碼 pairs；§C.1.4 的 bit sequence 每 8 個 bit 打包成 octet、「in order of least significant to most」（assurance 的 bitfield 就是這樣）。附錄 C 對每個結構逐一給出編碼，沒有「變長欄位一律排到最後」這種通則——例如 E_U(H) 就把變長的 epoch marker 與 winning-tickets marker 排在固定長度的 H_I、H_V 之前。0.7.1 為 account serialization 加了 version byte（C(255, s) 開頭的 0）。","trap":"bits(x) 函數（§3）是 MSB-first 用於 trie key；codec 的 bit sequence 是 LSB-first——兩者方向不同。"},{"id":"appC-fixed-vs-compact","ch":"C","section":"C.2–C.3 Block/state serialization","gpRef":"§C.2 & appendix D note","difficulty":2,"kind":"concept","tags":["codec"],"stem":"Where does the GP use fixed-width integer encodings E_l versus the general compact encoding E?","options":["State serialization (appendix D) uses the compact E for every numeric, τ and account balances included; block/extrinsic encodings use E_4 for timeslots and E_2 for validator indices, while lengths/discriminators are always fixed 4-octet values; the GP defines each structure's encoding explicitly in appendix C","State serialization (appendix D) uses fixed-length for all non-discriminator numerics, but big-endian rather than little-endian; block/extrinsic encodings use E_4 for timeslots and E_2 for validator indices, while lengths/discriminators always use the compact E; a service index is E_2 throughout, matching the validator index width","State serialization (appendix D) uses fixed-length for all non-discriminator numerics (e.g. E_4(τ), E_8(balance)); block/extrinsic encodings use E_4 for timeslots and E_2 for validator indices, while lengths/discriminators always use the compact E; the GP defines each structure's encoding explicitly in appendix C","State serialization (appendix D) uses fixed-length for all non-discriminator numerics (e.g. E_4(τ), E_8(balance)); block/extrinsic encodings use E_8 for timeslots and E_4 for validator indices, while lengths/discriminators always use the compact E; appendix C leaves each structure's field layout to the implementation"],"answer":2,"optNotes":["把附錄 D 的註與 §C.1.3 兩邊倒過來：state 非 discriminator 數值才 fixed，discriminator 走 compact。","§C.1.6 明寫「Values are encoded in a regular little-endian fashion」，且 service index 全程是 E_4。","state 數值一律 fixed-length、H_T 為 E_4、validator index 一律 E_2、長度前綴才走 compact E。","H_T 是 E_4、validator index 是 E_2；附錄 C 也逐一給出各結構的明確編碼而非交給實作自訂。"],"explanation":"附錄 D 的註：「all non-discriminator numeric serialization in state is done in fixed-length according to the size of the term」（例如 C(11) ↦ E_4(τ)，account info 用 E_8/E_4）；§C.1.3 則說 discriminator「are encoded as a natural」，也就是變長的 compact E。附錄 C 對 header、extrinsic、work report 等逐一定義：H_T 用 E_4，**所有 validator index 都是 E_2**（assurer、judge、author、guarantor），service index E_4、gas E_8、長度前綴用 compact E；§C.1.6：「Values are encoded in a regular little-endian fashion」。你們 code-map 3.13.2 指出：work report 內的 core index 與 auth gas used 用 compact（C.6 風格），WorkResult.AccumulateGas 也是 compact，而 π_V/π_L 的統計用 E_4。這些細節是 codec test vectors 的核心。","trap":"面試若問「為什麼 state 用 fixed-length」：可預測大小、Merklization 友善、避免同值多種編碼。"},{"id":"appD-state-key","ch":"D","section":"D.1 Serialization (state-key constructor C)","gpRef":"§D.1 eq. C","difficulty":3,"kind":"concept","tags":["merklization","state-keys"],"stem":"The state-key constructor C maps to 31-octet keys. Which forms are correct?","options":["C(i) = [0, …, 0, i] with the chapter index in the final octet; C(i, s) = [i, n_0, 0, n_1, 0, n_2, 0, n_3, 0, …] with n = E_4(s); C(s, h) = [n_0, a_0, n_1, a_1, n_2, a_2, n_3, a_3, a_4, …, a_26] with n = E_4(s), a = H(h) and h the raw storage key for a storage item","C(i) = [i, 0, 0, …]; C(i, s) = [i, n_0, 0, n_1, 0, n_2, 0, n_3, 0, …] with n = E_4(s); C(s, h) = [n_0, a_0, n_1, a_1, n_2, a_2, n_3, a_3, a_4, …, a_26] with n = E_4(s) and a = H(h) — service-id bytes interleaved with the first 4 hash bytes, then hash bytes 4..26","C(i) = [i, 0, 0, …]; C(i, s) = [i, n_0, n_1, n_2, n_3, 0, 0, …] with n = E_4(s); C(s, h) = [n_0, a_0, n_1, a_1, n_2, a_2, n_3, a_3, a_4, …, a_26] with n = E_4(s) and a = H(h) — the service id sits in one contiguous run and only the hash bytes are interleaved","C(i) = [i, 0, 0, …]; C(i, s) = [i, n_0, 0, n_1, 0, n_2, 0, n_3, 0, …] with n = E_4(s); C(s, h) = [n_0, a_0, n_1, a_1, n_2, a_2, n_3, a_3, a_4, …, a_27] with n = E_4(s) and a = h itself — the raw 32-octet key is interleaved and the result runs to 32 octets"],"answer":1,"optNotes":["C(i) 是 [i, 0, 0, …]（index 在最前），storage 走的也是 C(s, E_4(2^32−1) ⌢ k) 而非原始 key。","C(i, s) 的 service-id byte 與 0 交錯、C(s, h) 取 a = H(h)，且值域固定為 B_31。","service-id 四個 byte 若連成一段，相鄰 service 的 key 在 trie 中就不會散開。","a 是 H(h)（Blake2b）而不是原始 h，且 C 的值域是 B_31，31 octets 才對。"],"explanation":"§D.1：C: N_2^8 ∪ (N_2^8, N_S) ∪ (N_S, B) → B_31。C(i) = [i, 0, …]（chapter i 的單一元件：1 α、2 φ、3 β、4 γ、5 ψ、6 η、7 ι、8 κ、9 λ、10 ρ、11 τ、12 χ、13 π、14 ω、15 ξ、16 θ）；C(255, s) 是 service s 的 account info（[255, n_0, 0, n_1, 0, n_2, 0, n_3, 0, …]）；C(s, h) 用於 storage / preimage / request：n 與 a = H(h) 的前 4 bytes 交錯（交錯是為了讓相鄰 service 的 key 在 trie 中散開），再接 a_4…a_26。storage key h = E_4(2^32−1) ⌢ k、preimage h = E_4(2^32−2) ⌢ hash、request h = E_4(l) ⌢ hash（l 是長度，因為 preimage < 2^32 所以不會與前兩者碰撞）。§D.1 末：「JAM does not allow service storage keys to be directly inspected or enumerated」——實作可以只存 hash 後的 key。","trap":"31 bytes（不是 32）：讓 leaf node 的 1 byte header + 31 key + 32 value 剛好 64 bytes。"},{"id":"appD-trie-nodes","ch":"D","section":"D.2 Merklization (node encoding)","gpRef":"§D.2.1 B and L functions, M","difficulty":2,"kind":"concept","tags":["merklization","trie"],"stem":"How are nodes of the state Patricia Merkle trie encoded?","options":["Every node is 512 bits. Branch: bit 0 = 0, then the last 255 bits of the left child's hash, then the full 256 bits of the right child's hash. Leaf with value ≤ 32 octets: bits 10 + 6-bit value length, the 31-octet key, then the value zero-padded to 32 octets. Leaf with larger value: bits 11000000, the 31-octet key, then H(value). Empty (sub)trie = zero hash; node identity = Blake2b of the 64 octets","Every node is 512 bits. Branch: bit 0 = 0, then the last 255 bits of the left child's hash, then the full 256 bits of the right child's hash. Leaf with value ≤ 32 octets: bits 10 + 6-bit value length, the 31-octet key, then H(value). Leaf with larger value: bits 11000000, the 31-octet key, then the value's first 32 octets. Empty (sub)trie = zero hash; node identity = Keccak of the 64 octets","Every node is 512 bits. Branch: bit 0 = 0, then the full 256 bits of the left child's hash, then the last 255 bits of the right child's hash. Leaf with value ≤ 32 octets: bits 10 + 6-bit value length, the 31-octet key, then the value zero-padded to 32 octets. Leaf with larger value: bits 11000000, the 31-octet key, then H(value). Empty (sub)trie = H([]); node identity = Blake2b of the 64 octets","Every node is 512 bits. Branch: bit 0 = 1, then the last 255 bits of the left child's hash, then the full 256 bits of the right child's hash. Leaf with value ≤ 32 octets: bits 00 + 6-bit value length, the 31-octet key, then the value zero-padded to 32 octets. Leaf with larger value: bits 01000000, the 31-octet key, then H(value). Empty (sub)trie = zero hash; node identity = Blake2b of the 64 octets"],"answer":0,"optNotes":["左子截成後 255 bits 以騰出 discriminator bit、右子取滿 256；空子樹識別為 zero hash。","L 的定義正好相反（內嵌存 value 補零、大值存 H(v)），且 state trie 全程用 Blake2b。","§D.2.1 是左子取後 255 bits、右子取滿 256 bits；空子樹識別為 H_0 而不是 H([])。","GP 是第一個 bit 為 0 才是 branch、為 1 是 leaf，第二個 bit 再分內嵌與一般 leaf。"],"explanation":"§D.2.1：「Nodes are fixed in size at 512 bit (64 bytes). Each node is either a branch or a leaf. The first bit discriminate between these two types.」B(l, r) = [0] ⌢ bits(l)[1..] ⌢ bits(r)——「the last 255 bits of the 0-bit (left) sub-trie identity and the full 256 bits of the 1-bit (right) sub-trie identity」；L(k, v) = [1, 0] ⌢ bits(E_1(|v|))[2..] ⌢ bits(k) ⌢ bits(v) ⌢ 0-padding 當 |v| ≤ 32，否則 [1,1,0,0,0,0,0,0] ⌢ bits(k) ⌢ bits(H(v))。M(d)：空 → H_0（zero hash）；單一 → H(L(k, v))；否則 H(B(M(l), M(r)))，依 key 的下一個 bit 分左右（MSB-first）。設計理由：「a format optimized for modern compute hardware, primarily by optimizing sizes to fit succinctly into typical memory layouts and reducing the need for unpredictable branching」。Keccak 只出現在 accumulation output belt，state trie 全程 Blake2b。","trap":"左子 hash 丟掉最高位（255 bits）以騰出 discriminator bit；值 ≤ 32 bytes 內嵌可省一次 hash。"},{"id":"appE-merkle-functions","ch":"E","section":"E.1 Binary Merkle Trees & E.2 MMR","gpRef":"eq. E.1–E.8","difficulty":2,"kind":"concept","tags":["merklization","mmr"],"stem":"Which description of the general Merklization functions is correct?","options":["N (node): splits the sequence at ⌈n/2⌉ and hashes left ⌢ right with no domain-separation prefix, the prefixes being reserved for leaves; M_B is the constant-depth root that pads to a power of two while M is the well-balanced root over the raw blobs — the two are named for their leaf treatment, not their shape; the MMR append A carries like binary addition and the super-peak folds the peaks with a '$node' prefix under Blake2b","N (node): splits the sequence at ⌊n/2⌋ so the right half is the larger one, and hashes '$node' ⌢ left ⌢ right; M_B is the well-balanced root taken over the RAW blobs; M (constant-depth) first hashes each leaf as '$leaf' ⌢ v and pads to a power of two by repeating the final leaf rather than with zero hashes; the MMR append A gives every leaf its own new peak without any carrying, and the super-peak folds the peaks with a '$peak' prefix","N (node): splits the sequence at ⌈n/2⌉ and hashes '$node' ⌢ left ⌢ right (well-balanced); M_B is the well-balanced root taken over the RAW blobs (it deliberately avoids hashing each item); M (constant-depth) first hashes each leaf as '$leaf' ⌢ v and pads to a power of two with zero hashes — used for segment roots and paged proofs; the MMR append A adds a peak with binary-addition-style carrying and the super-peak folds the peaks with a '$peak' prefix","N (node): splits the sequence at ⌈n/2⌉ and hashes '$node' ⌢ left ⌢ right (well-balanced); M_B hashes every item as '$leaf' ⌢ v before building the tree, which is what costs it one extra hash per item; M (constant-depth) takes the RAW blobs and pads to a power of two with zero hashes; the MMR append A carries like binary addition and the super-peak folds the peaks with a '$peak' prefix, but is defined only when the number of peaks is a power of two"],"answer":2,"optNotes":["N 的定義本身就含 $node 前綴，M_B 與 M 的角色被對調，super-peak 用 $peak 且是 Keccak。","三處都相反：GP 是 ⌈n/2⌉ 切、補 zero hash H_0、A 遇到已占用的 slot 就折疊進位。","M_B 直接把原始 blob 當 leaf（GP 明說 avoids hashing each item），M 才先 $leaf 雜湊再零填。","加 $leaf 的是 constancy preprocessor C，且 super-peak 對任意個非 ∅ peak 都遞迴定義。"],"explanation":"eq. E.1：N(v, H) = H_0 若空；v_0 若單一；否則 H($node ⌢ N(v[..⌈n/2⌉]) ⌢ N(v[⌈n/2⌉..]))——「well-balanced」使最大深度最小。前綴 $node/$leaf 防止 preimage collision。E.3：M_B(v, H) = H(v_0) 當 |v| = 1，否則 N(v, H)——直接把原始 blob 當 leaf、不加 $leaf 前綴（GP 明說它「avoids hashing each item in the sequence」）；用於 extrinsic hash 與 accumulation output belt 的每塊 root（Keccak）。E.4：M（constant depth）先 $leaf 雜湊、零填到 2 的冪——segment root 與 paged proofs（J_x/L_x, x = 6 即每 64 個 leaf 一頁）用它，因為固定深度讓 import 證明大小固定。E.8：MMR append A（peaks 序列，像二進位加法進位），super-peak 用 $peak 前綴從左到右摺疊。β_B 就是這種 MMR（Keccak）。","trap":"M_B 取 root 的分割點是 ⌈n/2⌉（左邊較多）；M 是零填到 2^k。"},{"id":"appH-chunking","ch":"H","section":"H Erasure Coding","gpRef":"eq. H.5–H.6","difficulty":2,"kind":"concept","tags":["erasure-coding"],"stem":"How does the chunking function 𝒞^v_k turn a data blob into v chunks, and what makes the code 'systematic'?","options":["The blob (padded to a multiple of 2·d(v) octets) is split into k pieces of d(v) octet-pairs; each piece is erasure-coded into v octet-pairs; the results are transposed so that chunk i holds the i-th pair of every piece (k pairs per chunk); systematic means the first d(v) chunks are the original data, so if they are all present reconstruction is mere concatenation","The blob (padded to a multiple of 2·d(v) octets) is split into k pieces of d(v) octet-pairs; each piece is erasure-coded into v octet-pairs; the pieces are then hashed and it is those hashes, not the coded pairs, that are handed out as chunks; systematic means every chunk carries a Merkle proof of its own index, so one chunk can be checked without reconstructing anything","The blob (padded to a multiple of 2·d(v) octets) is split into k pieces of d(v) octet-pairs; each piece is erasure-coded into v octet-pairs over GF(2^8) in the standard polynomial basis; the results are transposed so that chunk i holds the i-th pair of every piece; systematic means the encoder is its own inverse, so coding a blob twice returns the blob","The blob (padded to a multiple of 2·v octets) is split into v pieces of one octet-pair each; each piece is erasure-coded into d(v) octet-pairs; the results are concatenated rather than transposed, so chunk i is a contiguous slice of the coded stream; systematic means the parity pairs sit after the data, so any v − d(v) chunks reconstruct"],"answer":0,"optNotes":["systematic 的意義是前 𝒟(v) 個 chunk 就是原始資料，全在手時還原只是串接。","chunk 就是轉置後的 coded octet-pair 本身，雜湊只發生在組 erasure-root 的 b^♣ 那一步。","§H 明訂 GF(2^16)（x^16 + x^5 + x^3 + x^2 + 1）並改用 Cantor basis，systematic 也與自反性無關。","方向整個顛倒：eq. H.5 是切成 k 段、每段 𝒟(v) 個 pair 編成 v 個 pair 再轉置。"],"explanation":"eq. H.5：𝒞^v_k(d) = join(T[C_v(p) | p ∈ T(split_2(split_2k(d)))])——先切成 k 段、每段 𝒟(v) 個 octet-pair、各自 RS 編碼成 v 個 pair、再轉置成 v 個 chunk（每個 k pairs）。eq. H.6：任意 𝒟(v) 個 chunk（附索引）可還原；「If the original d items are known then reconstruction is just their concatenation」——這正是 systematic code 的優點：guarantor/assurer 手上的前 342 個 chunk 就是原始資料。兩個使用情境：Audit DA（work-package bundle，變長）與 Import DA（固定 4104-octet segments）。實作用 Cantor basis 的 GF(2^16)（lin2014novel）。","trap":"shard/chunk 數 = |κ′|（每個 validator 一個）；erasure root 是對這些 chunk 的 Merkle root。"},{"id":"arch-corejam-name","ch":"ARCH","section":"1.1 Nomenclature / RFC-31","gpRef":"§1.1 & RFC-31 CoreJam","difficulty":1,"kind":"rationale","tags":["architecture","history"],"stem":"Where does the name 'JAM' come from, and which stages of the original CoreJam model actually execute on-chain?","options":["From 'Joint Availability Mechanism', after the erasure-coded D3L at its centre; RFC-31 already proposed this same complete protocol under the name CoreJam, and only Collect runs on-chain, since the chain must order incoming work-packages before the other three stages run in-core","From 'Just Another Machine', a nod to the Yellow Paper's naming; the collect / refine / join / accumulate pipeline was bolted on later by RFC-31, and all four stages run on-chain because a single validator set executes everything in consensus","From CoreJam (Polkadot Fellowship RFC-31), named after its Collect / Refine / Join / Accumulate model; only Join and Accumulate happen on-chain — Collect and Refine are off-chain/in-core — hence 'Join-Accumulate Machine', a complete protocol rather than RFC-31's scope-limited alteration","From CoreJam (Polkadot Fellowship RFC-31), named after its Collect / Refine / Join / Accumulate model; Refine and Accumulate are the on-chain pair — Collect and Join are done off-chain by the package builder — hence 'Join-Accumulate Machine'"],"answer":2,"optNotes":["§1.1 明寫 RFC-31 是「incomplete, scope-limited alteration」，而 Collect 是 builder 在鏈下收集輸入。","四階段全在鏈上就是 §4.9.1 判定「is unfortunately not scalable」的 everybody-does-everything 模型。","名字與分工都對上 §1.1：只有 Join 與 Accumulate 上鏈，縮寫才會是 Join-Accumulate Machine。","分工顛倒：Refine 是 in-core 的高吞吐階段，Join 才是把 work-report 帶上鏈的那一步。"],"explanation":"GP §1.1：「An early, unrefined, version of this protocol was first proposed in Polkadot Fellowship RFC 31, known as CoreJam. CoreJam takes its name after the collect/refine/join/accumulate model of computation at the heart of its service proposition. While the CoreJam RFC suggested an incomplete, scope-limited alteration to the Polkadot protocol, JAM refers to a complete and coherent overall blockchain protocol.」四個階段的分界要背熟：Collect（builder 收集輸入）與 Refine（in-core 計算）在鏈下；Join（guarantee/assure 上鏈）與 Accumulate（狀態整合）在鏈上——名字正取自後面那一對。§4.9.1 則說明為何不能四階段全上鏈：「everybody does everything」式的 on-chain consensus model「is unfortunately not scalable」，JAM 引入 in-core 模型正是為了繞開它。","trap":"面試「architecture」開場常問這題；順便提 RFC-31 的三種 service 想像：parachain validation、actor progression（CorePlay）、simple ordering。"},{"id":"arch-driving-factors","ch":"ARCH","section":"1.2–1.3 Driving Factors / Size-Coherency Antagonism","gpRef":"§1.2–1.3","difficulty":2,"kind":"rationale","tags":["architecture","rationale"],"stem":"The GP names five driving factors and a principle called 'size-coherency antagonism'. Which statement is correct?","options":["Factors: Speed, Cost, Security, Decentralization, Simplicity; the antagonism is between decentralization and performance, because hardware requirements are barriers to entry to the validator set — JAM answers by fixing validator hardware at 16 cores / 64 GB / 8 TB and using SNARKs to compress the work, so coherency survives without any pipeline at all","Factors: Resilience, Generality, Performance, Coherency, Acce
